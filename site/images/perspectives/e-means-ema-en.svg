<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">Figure 5 | EMA response and memory</title><desc id="desc">With α=0.20, the positions of 50, 56 and 80 are proportional on the 40–90 number line.</desc><rect width="720" height="760" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">Figure 5 | EMA response and memory</text><g transform="translate(0 56)"><path d="M60 160H660" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M60 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M180 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M300 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M420 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M540 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M660 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><circle cx="180" cy="160" r="11" fill="#808080" stroke="none" stroke-width="3"/><circle cx="252" cy="160" r="11" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="540" cy="160" r="11" fill="#d65a42" stroke="none" stroke-width="3"/></g><text x="30" y="380" font-size="18">With α=0.20, the positions of 50, 56 and 80 are proportional on</text><text x="30" y="410" font-size="18"> the 40–90 number line.</text><text x="30" y="452" font-size="19">Gray: old value 50</text><text x="30" y="482" font-size="18">Retain 80% of the previous statistic.</text><text x="30" y="528" font-size="19">Blue: updated value 56</text><text x="30" y="558" font-size="18">0.8×50+0.2×80=56.</text><text x="30" y="604" font-size="19">Orange: new value 80</text><text x="30" y="634" font-size="18">The new observation receives 20% weight.</text><text x="30" y="680" font-size="17">This is a static scalar example. e-means applies EMA to sums S </text><text x="30" y="710" font-size="17">and counts N, then takes their ratio.</text></g></svg>
