<svg xmlns="http://www.w3.org/2000/svg" lang="zh-Hant" viewBox="0 0 720 544" role="img" aria-labelledby="title description"><title id="title">圖 1｜兩台電腦，共用一個資料空間</title><desc id="description">LAN 是區域網路；兩位使用者各自連到 NAS。</desc><rect width="720" height="544" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">圖 1｜兩台電腦，共用一個資料空間</text><text x="28" y="75.6" font-size="18">LAN 是區域網路；兩位使用者各自連到 NAS。</text><text x="28" y="117.3" font-size="21" font-weight="700">實驗室內網：獨立的存取關係</text><rect x="28" y="133.95" width="664" height="102.7" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M3 3h18v13H3z M8 21h8 M12 16v5" transform="translate(44 146.95) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="163.95" font-size="20" font-weight="700">研究生 A 的電腦</text><text x="92" y="196.95" font-size="18">電腦 A → NAS：以自己的帳號透過 SMB 讀寫獲准的資料夾。</text><rect x="28" y="246.64999999999998" width="664" height="102.7" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M3 3h18v13H3z M8 21h8 M12 16v5" transform="translate(44 259.65) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="276.65" font-size="20" font-weight="700">研究生 B 的電腦</text><text x="92" y="309.65" font-size="18">電腦 B → NAS：直接連到同一個共享空間，權限可與 A 不同。</text><rect x="28" y="359.34999999999997" width="664" height="102.7" rx="16" fill="#f0eaff" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 372.34999999999997) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="389.34999999999997" font-size="20" font-weight="700">NAS 共享儲存</text><text x="92" y="422.34999999999997" font-size="18">分別檢查兩個帳號的權限，保存論文、模型與研究資料。</text><text x="28" y="502.04999999999995" font-size="18">卡片是平行關係；A 不需要經過 B 才能連到 NAS。</text></g></svg>
