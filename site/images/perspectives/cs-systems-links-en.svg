<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 766.4000000000001" role="img" aria-labelledby="cs-links-en-title cs-links-en-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-links-en-title">Hard links and symbolic links</title><desc id="cs-links-en-desc">Left: two names refer to one inode. Right: dashed lines denote path resolution or target removal. Symlinks can cross filesystem boundaries.</desc><defs><marker id="cs-links-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="958.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">Hard links and symbolic links</text><path d="M510 100L510 780" fill="none" stroke="#64748b" stroke-width="3" /><rect x="30" y="120" width="200" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="50" y="150.0" font-size="16" font-weight="700" text-anchor="start">a.txt</text><text x="50" y="183.2" font-size="14" font-weight="400" text-anchor="start">directory entry</text><rect x="280" y="120" width="200" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="300" y="150.0" font-size="16" font-weight="700" text-anchor="start">b.txt</text><text x="300" y="183.2" font-size="14" font-weight="400" text-anchor="start">directory entry</text><rect x="140" y="360" width="240" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="160" y="390.0" font-size="16" font-weight="700" text-anchor="start">same inode</text><text x="160" y="423.2" font-size="14" font-weight="400" text-anchor="start">nlink = 2</text><rect x="140" y="610" width="240" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="160" y="640.0" font-size="16" font-weight="700" text-anchor="start">shared data</text><text x="160" y="673.2" font-size="14" font-weight="400" text-anchor="start">shared data</text><rect x="560" y="120" width="260" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="580" y="150.0" font-size="16" font-weight="700" text-anchor="start">link.txt</text><text x="580" y="183.2" font-size="14" font-weight="400" text-anchor="start">directory entry</text><rect x="560" y="340" width="300" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="580" y="370.0" font-size="16" font-weight="700" text-anchor="start">link inode</text><text x="580" y="403.2" font-size="14" font-weight="400" text-anchor="start">stored path: target.txt</text><rect x="890" y="340" width="180" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="910" y="370.0" font-size="16" font-weight="700" text-anchor="start">target.txt</text><text x="910" y="403.2" font-size="14" font-weight="400" text-anchor="start">resolve path</text><rect x="890" y="510" width="180" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="910" y="540.0" font-size="16" font-weight="700" text-anchor="start">target inode</text><text x="910" y="573.2" font-size="14" font-weight="400" text-anchor="start">target object</text><rect x="890" y="670" width="180" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="910" y="700.0" font-size="16" font-weight="700" text-anchor="start">target data</text><text x="910" y="733.2" font-size="14" font-weight="400" text-anchor="start">target data</text><rect x="540" y="640" width="320" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="560" y="670.0" font-size="16" font-weight="700" text-anchor="start">target removed → dangling</text><text x="560" y="697.2" font-size="16" font-weight="700" text-anchor="start">link</text><text x="560" y="730.4" font-size="14" font-weight="400" text-anchor="start">May dangle when the target is</text><text x="560" y="754.1999999999999" font-size="14" font-weight="400" text-anchor="start">removed</text><path d="M130 260L260 360" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-links-en-arrow)" /><path d="M380 260L260 360" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-links-en-arrow)" /><path d="M260 500L260 610" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-links-en-arrow)" /><path d="M690 260L690 340" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-links-en-arrow)" /><path d="M980 480L980 510" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-links-en-arrow)" /><path d="M980 650L980 670" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-links-en-arrow)" /><path d="M860 410L890 410" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#cs-links-en-arrow)" /><path d="M690 480L690 640" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#cs-links-en-arrow)" /><text x="28" y="860.0" font-size="20" font-weight="400" text-anchor="start">Left: two names refer to one inode. Right: dashed lines denote path resolution or target</text><text x="28" y="894.0" font-size="20" font-weight="400" text-anchor="start">removal. Symlinks can cross filesystem boundaries.</text></g></g></svg>
