<svg xmlns="http://www.w3.org/2000/svg" lang="zh" viewBox="0 0 720 472" role="img" aria-labelledby="title desc"><title id="title">圖6｜e-means的協同組件</title><desc id="desc">核心是Mini-batch + EMA；下面四項為協同組件，排列沒有先後含義。</desc><rect width="720" height="472" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">圖6｜e-means的協同組件</text><g transform="translate(0 56)"></g><text x="30" y="76" font-size="18">核心是Mini-batch + EMA；下面四項為協同組件，排列沒有先後含義。</text><text x="30" y="118" font-size="19">Cosine Schedule</text><text x="30" y="148" font-size="18">先積極調整，再逐步穩定。</text><text x="30" y="194" font-size="19">Dead-cluster Revival</text><text x="30" y="224" font-size="18">拆分donor群，重新利用低計數中心。</text><text x="30" y="270" font-size="19">Finalization</text><text x="30" y="300" font-size="18">固定保存的指派後，重算最後均值；或選slow EMA。</text><text x="30" y="346" font-size="19">Scaling Laws</text><text x="30" y="376" font-size="18">依n、k、T估計batch size B與初始步長α₀。</text><text x="30" y="422" font-size="17">各組件的貢獻需消融比較，不能分別宣稱必定加速。</text></g></svg>
