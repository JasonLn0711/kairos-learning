<svg xmlns="http://www.w3.org/2000/svg" lang="zh-Hant" viewBox="0 0 720 840" role="img" aria-labelledby="title description"><title id="title">圖 5｜硬碟容錯、時間點與獨立副本</title><desc id="description">三張卡片處理不同問題，屬於平行的保護措施。</desc><rect width="720" height="840" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">圖 5｜硬碟容錯、時間點與獨立副本</text><text x="28" y="75.6" font-size="18">三張卡片處理不同問題，屬於平行的保護措施。</text><text x="28" y="117.3" font-size="21" font-weight="700">NAS 資料的三種保護角色</text><rect x="28" y="133.95" width="664" height="102.7" rx="16" fill="#fff1dd" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 146.95) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="163.95" font-size="20" font-weight="700">RAID／SHR</text><text x="92" y="196.95" font-size="18">依配置承受硬碟故障；誤刪或加密會反映到陣列中。</text><rect x="28" y="246.64999999999998" width="664" height="102.7" rx="16" fill="#e2f5f2" stroke="#59697a"/><path d="M4 3h16v18H4z M8 7h8 M8 12h8 M8 17h5" transform="translate(44 259.65) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="276.65" font-size="20" font-weight="700">快照</text><text x="92" y="309.65" font-size="18">保留時間點狀態，協助快速回復；同機副本共用設備風險。</text><rect x="28" y="359.34999999999997" width="664" height="102.7" rx="16" fill="#f0eaff" stroke="#59697a"/><path d="M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6z M8 12l3 3 5-6" transform="translate(44 372.34999999999997) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="389.34999999999997" font-size="20" font-weight="700">獨立備份</text><text x="92" y="422.34999999999997" font-size="18">將副本存到另一個目的地，分開管理存取權限。</text><text x="28" y="502.04999999999995" font-size="21" font-weight="700">備份副本的保存與驗證</text><rect x="28" y="518.6999999999999" width="664" height="102.7" rx="16" fill="#e2f5f2" stroke="#59697a"/><path d="M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6z M8 12l3 3 5-6" transform="translate(44 531.6999999999999) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="548.6999999999999" font-size="20" font-weight="700">異地／離線／不可變</text><text x="92" y="581.6999999999999" font-size="18">依風險配置位置與保護期間，核對產品支援條件。</text><path d="M360 637.4v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="655.4" width="664" height="102.7" rx="16" fill="#f0eaff" stroke="#59697a"/><path d="M4 12l5 5L20 5" transform="translate(44 668.4) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="685.4" font-size="20" font-weight="700">實際還原</text><text x="92" y="718.4" font-size="18">還原至測試目錄，核對檔案、權限與耗時。</text><text x="28" y="798.1" font-size="18">還原證據回答「資料拿不拿得回來」，備份工作狀態回答「備份是否執行成功」。</text></g></svg>
