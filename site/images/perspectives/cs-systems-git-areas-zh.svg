<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 358.40000000000003" role="img" aria-labelledby="cs-git-areas-zh-title cs-git-areas-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-git-areas-zh-title">Git 的三個主要工作區域</title><desc id="cs-git-areas-zh-desc">Working Tree → git add → Index → git commit → Repository。工作樹、暫存區與已提交資料是不同狀態。</desc><defs><marker id="cs-git-areas-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="448.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">Git 的三個主要工作區域</text><path d="M3 7h7l2 3h9l-3 10H3z M3 7V4h6l3 3" transform="translate(180 95) scale(1.4)" fill="none" stroke="#18252c" stroke-width="1.8" /><text x="195.0" y="170.0" font-size="24" font-weight="700" text-anchor="middle">Working Tree</text><text x="195.0" y="216.8" font-size="20" font-weight="400" text-anchor="middle">正在修改的檔案</text><path d="M3 5l2 2 4-4 M12 5h9 M3 13l2 2 4-4 M12 13h9 M12 21h9" transform="translate(540 95) scale(1.4)" fill="none" stroke="#18252c" stroke-width="1.8" /><text x="555.0" y="170.0" font-size="24" font-weight="700" text-anchor="middle">Index</text><text x="555.0" y="216.8" font-size="20" font-weight="400" text-anchor="middle">準備提交的內容</text><path d="M2 12h7 M15 12h7 M15 12a3 3 0 1 0-6 0a3 3 0 1 0 6 0" transform="translate(900 95) scale(1.4)" fill="none" stroke="#18252c" stroke-width="1.8" /><text x="915.0" y="170.0" font-size="24" font-weight="700" text-anchor="middle">Repository</text><text x="915.0" y="216.8" font-size="20" font-weight="400" text-anchor="middle">已提交的版本物件</text><text x="28" y="350.0" font-size="20" font-weight="400" text-anchor="start">Working Tree → git add → Index → git commit → Repository。工作樹、暫存區與已提交資料是不同狀</text><text x="28" y="384.0" font-size="20" font-weight="400" text-anchor="start">態。</text></g></g></svg>
