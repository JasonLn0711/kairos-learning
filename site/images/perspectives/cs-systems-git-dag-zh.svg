<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590.4" role="img" aria-labelledby="cs-git-dag-zh-title cs-git-dag-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-git-dag-zh-title">Git 分支與合併</title><desc id="cs-git-dag-zh-desc">從 B 分出功能分支 C—D 與另一條開發線 E—F，G 為合併提交。圖線表示歷史連接；Git 內部父指標由新提交指向父提交。</desc><defs><marker id="cs-git-dag-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="738.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">Git 分支與合併</text><path d="M100 320L300 320" fill="none" stroke="#0f9488" stroke-width="3" /><path d="M300 320L500 170" fill="none" stroke="#0f9488" stroke-width="3" /><path d="M500 170L700 170" fill="none" stroke="#0f9488" stroke-width="3" /><path d="M700 170L950 320" fill="none" stroke="#0f9488" stroke-width="3" /><path d="M300 320L500 470" fill="none" stroke="#64748b" stroke-width="3" /><path d="M500 470L700 470" fill="none" stroke="#64748b" stroke-width="3" /><path d="M700 470L950 320" fill="none" stroke="#64748b" stroke-width="3" /><circle cx="100" cy="320" r="44" fill="#e2e8f0" stroke="#64748b" stroke-width="4" /><text x="100" y="332" font-size="36" font-weight="700" text-anchor="middle" fill="#18252c">A</text><circle cx="300" cy="320" r="44" fill="#e2e8f0" stroke="#64748b" stroke-width="4" /><text x="300" y="332" font-size="36" font-weight="700" text-anchor="middle" fill="#18252c">B</text><circle cx="500" cy="170" r="44" fill="#e2e8f0" stroke="#64748b" stroke-width="4" /><text x="500" y="182" font-size="36" font-weight="700" text-anchor="middle" fill="#18252c">C</text><circle cx="700" cy="170" r="44" fill="#e2e8f0" stroke="#64748b" stroke-width="4" /><text x="700" y="182" font-size="36" font-weight="700" text-anchor="middle" fill="#18252c">D</text><circle cx="500" cy="4