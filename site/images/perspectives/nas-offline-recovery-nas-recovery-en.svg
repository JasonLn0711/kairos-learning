<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 1088" role="img" aria-labelledby="title description"><title id="title">Figure 5 | Disk resilience, points in time and independent copies</title><desc id="description">The three cards address different problems and represent parallel protections.</desc><rect width="720" height="1088" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">Figure 5 | Disk resilience, points in time and</text><text x="28" y="75.6" font-size="24" font-weight="700">independent copies</text><text x="28" y="115.19999999999999" font-size="18">The three cards address different problems and represent</text><text x="28" y="144.89999999999998" font-size="18">parallel protections.</text><text x="28" y="186.59999999999997" font-size="21" font-weight="700">Three protection roles for NAS data</text><rect x="28" y="203.24999999999997" width="664" height="132.4" rx="16" fill="#fff1dd" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 216.24999999999997) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="233.24999999999997" font-size="20" font-weight="700">RAID / SHR</text><text x="92" y="266.25" font-size="18">Tolerates disk failures according to configuration;</text><text x="92" y="295.95" font-size="18">deletion or encryption is reflected in the array.</text><rect x="28" y="345.65" width="664" height="132.4" rx="16" fill="#e2f5f2" stroke="#59697a"/><path d="M4 3h16v18H4z M8 7h8 M8 12h8 M8 17h5" transform="translate(44 358.65) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="375.65" font-size="20" font-weight="700">Snapshots</text><text x="92" y="408.65" font-size="18">Retains points in time for quick recovery; local copies</text><text x="92" y="438.34999999999997" font-size="18">share device risks.</text><rect x="28" y="488.04999999999995" width="664" height="132.4" rx="16" fill="#f0eaff" stroke="#59697a"/><path d="M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6z M8 12l3 3 5-6" transform="translate(44 501.04999999999995) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="518.05" font-size="20" font-weight="700">Independent backup</text><text x="92" y="551.05" font-size="18">Stores copies at another destination with separately</text><text x="92" y="580.75" font-size="18">managed access.</text><text x="28" y="660.4499999999999" font-size="21" font-weight="700">Preserving and verifying backup copies</text><rect x="28" y="677.0999999999999" width="664" height="132.4" rx="16" fill="#e2f5f2" stroke="#59697a"/><path d="M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6z M8 12l3 3 5-6" transform="translate(44 690.0999999999999) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="707.0999999999999" font-size="20" font-weight="700">Off-site / offline / immutable</text><text x="92" y="740.0999999999999" font-size="18">Choose location and protection periods for the risks,</text><text x="92" y="769.8" font-size="18">and verify product support.</text><path d="M360 825.4999999999999v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="843.4999999999999" width="664" height="132.4" rx="16" fill="#f0eaff" stroke="#59697a"/><path d="M4 12l5 5L20 5" transform="translate(44 856.4999999999999) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="873.4999999999999" font-size="20" font-weight="700">Restore test</text><text x="92" y="906.4999999999999" font-size="18">Restore to a test directory and check files, permissions</text><text x="92" y="936.1999999999999" font-size="18">and elapsed time.</text><text x="28" y="1015.8999999999999" font-size="18">Restore evidence answers whether data can be recovered; job</text><text x="28" y="1045.6" font-size="18">status answers whether a backup ran successfully.</text></g></svg>
