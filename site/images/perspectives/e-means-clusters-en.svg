<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">Figure 1 | Clusters and centroids</title><desc id="desc">Three parallel groups: small dots are data; the large circled plus is a centroid.</desc><rect width="720" height="760" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">Figure 1 | Clusters and centroids</text><g transform="translate(0 56)"><circle cx="150" cy="90" r="78" fill="#2485b9" fill-opacity=".08" stroke="#2485b9" stroke-dasharray="7 6"/><circle cx="150" cy="42" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="112" cy="64" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="190" cy="80" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="120" cy="120" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="178" cy="130" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="160" cy="143" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="150" cy="90" r="14" fill="white" stroke="#2485b9" stroke-width="3"/><path d="M143 90h14M150 83v14" fill="none" stroke="#2485b9" stroke-width="4" stroke-linecap="round"/><circle cx="570" cy="90" r="78" fill="#d65a42" fill-opacity=".08" stroke="#d65a42" stroke-dasharray="7 6"/><circle cx="570" cy="42" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="532" cy="64" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="610" cy="80" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="540" cy="120" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="598" cy="130" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="580" cy="143" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="570" cy="90" r="14" fill="white" stroke="#d65a42" stroke-width="3"/><path d="M563 90h14M570 83v14" fill="none" stroke="#d65a42" stroke-width="4" stroke-linecap="round"/><circle cx="360" cy="230" r="78" fill="#299b76" fill-opacity=".08" stroke="#299b76" stroke-dasharray="7 6"/><circle cx="360" cy="182" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="322" cy="204" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="400" cy="220" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="330" cy="260" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="388" cy="270" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="370" cy="283" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="360" cy="230" r="14" fill="white" stroke="#299b76" stroke-width="3"/><path d="M353 230h14M360 223v14" fill="none" stroke="#299b76" stroke-width="4" stroke-linecap="round"/></g><text x="30" y="380" font-size="18">Three parallel groups: small dots are data; the large circled p</text><text x="30" y="410" font-size="18">lus is a centroid.</text><text x="30" y="452" font-size="19">Centroid 1: blue</text><text x="30" y="482" font-size="18">Representative position of the upper-left group.</text><text x="30" y="528" font-size="19">Centroid 2: orange</text><text x="30" y="558" font-size="18">Representative position of the upper-right group.</text><text x="30" y="604" font-size="19">Centroid 3: green</text><text x="30" y="634" font-size="18">Representative position of the lower group.</text><text x="30" y="680" font-size="17">Dashed circles are teaching regions, not Voronoi boundaries. Th</text><text x="30" y="710" font-size="17">is is not an e-means experiment.</text></g></svg>
