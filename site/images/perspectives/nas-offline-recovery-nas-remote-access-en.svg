<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 940" role="img" aria-labelledby="title description"><title id="title">Figure 4 | Transport, identity and permissions have distinct roles</title><desc id="description">Web arrows show logical access order; the connector initiates the outbound tunnel.</desc><rect width="720" height="940" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">Figure 4 | Transport, identity and permissions</text><text x="28" y="75.6" font-size="24" font-weight="700">have distinct roles</text><text x="28" y="115.19999999999999" font-size="18">Web arrows show logical access order; the connector initiates</text><text x="28" y="144.89999999999998" font-size="18">the outbound tunnel.</text><text x="28" y="186.59999999999997" font-size="21" font-weight="700">Web service: access after identity checks</text><rect x="28" y="203.24999999999997" width="664" height="102.7" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M3 3h18v13H3z M8 21h8 M12 16v5" transform="translate(44 216.24999999999997) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="233.24999999999997" font-size="20" font-weight="700">Remote browser</text><text x="92" y="266.25" font-size="18">The user requests a NAS web service.</text><path d="M360 321.95v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="339.95" width="664" height="132.4" rx="16" fill="#e2f5f2" stroke="#59697a"/><path d="M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6z M8 12l3 3 5-6" transform="translate(44 352.95) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="369.95" font-size="20" font-weight="700">Cloudflare Access</text><text x="92" y="402.95" font-size="18">Allows or denies access through identity and application</text><text x="92" y="432.65" font-size="18">policies.</text><path d="M360 488.35v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="506.35" width="664" height="132.4" rx="16" fill="#f0eaff" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 519.35) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="536.35" font-size="20" font-weight="700">Tunnel and NAS</text><text x="92" y="569.35" font-size="18">The tunnel carries traffic; the NAS checks sign-in and</text><text x="92" y="599.0500000000001" font-size="18">operation permissions.</text><text x="28" y="678.75" font-size="21" font-weight="700">SMB: a separate private-network path</text><rect x="28" y="695.4" width="664" height="132.4" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M9 2h6v6H9z M2 16h6v6H2z M16 16h6v6h-6z M12 8v4H5v4 M12 12h7v4" transform="translate(44 708.4) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="725.4" font-size="20" font-weight="700">Managed client → NAS</text><text x="92" y="758.4" font-size="18">Cloudflare One Client, private routes and network</text><text x="92" y="788.1" font-size="18">policies carry SMB; the NAS manages file permissions.</text><text x="28" y="867.8" font-size="18">After entry authentication succeeds, authorized computers and</text><text x="28" y="897.5" font-size="18">accounts still need appropriate write restrictions.</text></g></svg>
