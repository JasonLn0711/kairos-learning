<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 684" role="img" aria-labelledby="title desc"><title id="title">Figure 3 | Different local minima</title><desc id="desc">Both panels use the same illustrative landscape, with each point at a valley bottom.</desc><rect width="720" height="684" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">Figure 3 | Different local minima</text><g transform="translate(0 56)"><g transform="translate(0 0)"><path d="M20 30C65 25 65 160 110 160C145 160 145 65 185 65C220 65 220 210 265 210C300 210 315 100 340 20" fill="none" stroke="#d65a42" stroke-width="4" stroke-linecap="round"/><circle cx="110" cy="160" r="8" fill="#d65a42" stroke="none" stroke-width="3"/></g><g transform="translate(360 0)"><path d="M20 30C65 25 65 160 110 160C145 160 145 65 185 65C220 65 220 210 265 210C300 210 315 100 340 20" fill="none" stroke="#2485b9" stroke-width="4" stroke-linecap="round"/><circle cx="265" cy="210" r="8" fill="#2485b9" stroke="none" stroke-width="3"/></g></g><text x="30" y="380" font-size="18">Both panels use the same illustrative landscape, with each poin</text><text x="30" y="410" font-size="18">t at a valley bottom.</text><text x="30" y="452" font-size="19">Left: a shallower local minimum</text><text x="30" y="482" font-size="18">A sequence of downhill steps can stop in this valley.</text><text x="30" y="528" font-size="19">Right: a lower local minimum</text><text x="30" y="558" font-size="18">A different optimization path may reach this lower valley.</text><text x="30" y="604" font-size="17">This is not a measured loss curve or a guarantee of global opti</text><text x="30" y="634" font-size="17">mality.</text></g></svg>
