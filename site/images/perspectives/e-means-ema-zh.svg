<svg xmlns="http://www.w3.org/2000/svg" lang="zh" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">圖5｜EMA的反應與記憶</title><desc id="desc">α=0.20；數線40至90上，50、56、80保持正確相對位置。</desc><rect width="720" height="700" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">圖5｜EMA的反應與記憶</text><g transform="translate(0 56)"><path d="M60 160H660" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M60 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M180 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M300 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M420 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M540 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><path d="M660 151v18" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><circle cx="180" cy="160" r="11" fill="#808080" stroke="none" stroke-width="3"/><circle cx="252" cy="160" r="11" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="540" cy="160" r="11" fill="#d65a42" stroke="none" stroke-width="3"/></g><text x="30" y="380" font-size="18">α=0.20；數線40至90上，50、56、80保持正確相對位置。</text><text x="30" y="422" font-size="19">灰色：舊值50</text><text x="30" y="452" font-size="18">保留80%的舊統計。</text><text x="30" y="498" font-size="19">藍色：更新後56</text><text x="30" y="528" font-size="18">0.8×50+0.2×80=56。</text><text x="30" y="574" font-size="19">橘色：新值80</text><text x="30" y="604" font-size="18">新資料的權重為20%。</text><text x="30" y="650" font-size="17">這是單一數值的靜態算例；e-means對總和S與計數N做EMA後取比值。</text></g></svg>
