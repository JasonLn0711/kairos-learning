<svg xmlns="http://www.w3.org/2000/svg" lang="zh" viewBox="0 0 720 636" role="img" aria-labelledby="title desc"><title id="title">圖8｜離線索引與線上查詢</title><desc id="desc">離線先訓練中心並建立平行區域；線上查詢選候選區域後搜尋。</desc><rect width="720" height="636" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">圖8｜離線索引與線上查詢</text><g transform="translate(0 56)"></g><text x="30" y="76" font-size="18">離線先訓練中心並建立平行區域；線上查詢選候選區域後搜尋。</text><text x="30" y="118" font-size="19">離線：1000萬文件向量</text><text x="30" y="148" font-size="18">文件轉成Embeddings → k-means/e-means訓練centroids。</text><text x="30" y="194" font-size="19">平行區域A、B、C</text><text x="30" y="224" font-size="18">各區存放指派到該中心的資料，A/B/C沒有先後順序。</text><text x="30" y="270" font-size="19">線上：查詢向量</text><text x="30" y="300" font-size="18">查詢向量 → 選擇相關候選區域 → 搜尋候選文件。</text><text x="30" y="346" font-size="18">離線建置</text><text x="30" y="376" font-size="18">區域A</text><text x="30" y="406" font-size="18">區域B</text><text x="30" y="436" font-size="18">區域C</text><text x="30" y="466" font-size="18">線上查詢</text><text x="30" y="496" font-size="18">查詢向量</text><text x="30" y="526" font-size="18">選擇相關候選區域</text><text x="30" y="556" font-size="18">搜尋候選文件</text><text x="30" y="586" font-size="17">IVF概念示意；低MSE不必然提高Recall@10，也不直接加速LLM生成。</text></g></svg>
