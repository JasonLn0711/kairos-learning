<svg xmlns="http://www.w3.org/2000/svg" lang="zh" viewBox="0 0 720 624" role="img" aria-labelledby="title desc"><title id="title">圖3｜不同的局部極小值</title><desc id="desc">左右使用相同示意地形；點落在各自谷底。</desc><rect width="720" height="624" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">圖3｜不同的局部極小值</text><g transform="translate(0 56)"><g transform="translate(0 0)"><path d="M20 30C65 25 65 160 110 160C145 160 145 65 185 65C220 65 220 210 265 210C300 210 315 100 340 20" fill="none" stroke="#d65a42" stroke-width="4" stroke-linecap="round"/><circle cx="110" cy="160" r="8" fill="#d65a42" stroke="none" stroke-width="3"/></g><g transform="translate(360 0)"><path d="M20 30C65 25 65 160 110 160C145 160 145 65 185 65C220 65 220 210 265 210C300 210 315 100 340 20" fill="none" stroke="#2485b9" stroke-width="4" stroke-linecap="round"/><circle cx="265" cy="210" r="8" fill="#2485b9" stroke="none" stroke-width="3"/></g></g><text x="30" y="380" font-size="18">左右使用相同示意地形；點落在各自谷底。</text><text x="30" y="422" font-size="19">左：較淺的局部極小值</text><text x="30" y="452" font-size="18">每一步下降可能停在這個谷底。</text><text x="30" y="498" font-size="19">右：較低的局部極小值</text><text x="30" y="528" font-size="18">另一條最佳化路徑可能到達更低的谷底。</text><text x="30" y="574" font-size="17">這不是實測loss曲線，也不提供全域最優保證。</text></g></svg>
