<svg xmlns="http://www.w3.org/2000/svg" lang="zh" viewBox="0 0 720 624" role="img" aria-labelledby="title desc"><title id="title">圖4｜更新頻率與資料遍歷</title><desc id="desc">上下長條代表同一個epoch；下方五批僅為示意。</desc><rect width="720" height="624" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">圖4｜更新頻率與資料遍歷</text><g transform="translate(0 56)"><rect x="30" y="40" width="61" height="38" rx="3" fill="#d65a42"/><rect x="96" y="40" width="61" height="38" rx="3" fill="#e4a08f"/><rect x="162" y="40" width="61" height="38" rx="3" fill="#d65a42"/><rect x="228" y="40" width="61" height="38" rx="3" fill="#e4a08f"/><rect x="294" y="40" width="61" height="38" rx="3" fill="#d65a42"/><rect x="360" y="40" width="61" height="38" rx="3" fill="#e4a08f"/><rect x="426" y="40" width="61" height="38" rx="3" fill="#d65a42"/><rect x="492" y="40" width="61" height="38" rx="3" fill="#e4a08f"/><rect x="558" y="40" width="61" height="38" rx="3" fill="#d65a42"/><rect x="624" y="40" width="61" height="38" rx="3" fill="#e4a08f"/><rect x="30" y="170" width="127" height="38" rx="3" fill="#2485b9"/><path d="M96 218v20m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><rect x="162" y="170" width="127" height="38" rx="3" fill="#2485b9"/><path d="M228 218v20m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><rect x="294" y="170" width="127" height="38" rx="3" fill="#2485b9"/><path d="M360 218v20m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><rect x="426" y="170" width="127" height="38" rx="3" fill="#2485b9"/><path d="M492 218v20m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><rect x="558" y="170" width="127" height="38" rx="3" fill="#2485b9"/><path d="M624 218v20m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/></g><text x="30" y="380" font-size="18">上下長條代表同一個epoch；下方五批僅為示意。</text><text x="30" y="422" font-size="19">Lloyd：讀完整批再更新</text><text x="30" y="452" font-size="18">讀完100萬筆，再更新一次中心。</text><text x="30" y="498" font-size="19">e-means：每批讀完就更新</text><text x="30" y="528" font-size="18">圖示五個批次，各有一次更新；實際批數由n和B決定。</text><text x="30" y="574" font-size="17">mini-batch改變回饋頻率，不等於每個epoch只讀少量資料。</text></g></svg>
