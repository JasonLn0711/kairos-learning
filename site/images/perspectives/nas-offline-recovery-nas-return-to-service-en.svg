<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 1054" role="img" aria-labelledby="title description"><title id="title">Figure 6 | Five evidence-based steps to reconnection</title><desc id="description">This is a response plan, not a record of completed maintenance.</desc><rect width="720" height="1054" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">Figure 6 | Five evidence-based steps to</text><text x="28" y="75.6" font-size="24" font-weight="700">reconnection</text><text x="28" y="115.19999999999999" font-size="18">This is a response plan, not a record of completed maintenance.</text><text x="28" y="156.89999999999998" font-size="21" font-weight="700">From isolation to limited restoration</text><rect x="28" y="173.54999999999998" width="664" height="102.7" rx="16" fill="#eef1f4" stroke="#59697a"/><path d="M9 2h6v6H9z M2 16h6v6H2z M16 16h6v6h-6z M12 8v4H5v4 M12 12h7v4" transform="translate(44 186.54999999999998) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="203.54999999999998" font-size="20" font-weight="700">01 | Confirm isolation</text><text x="92" y="236.54999999999998" font-size="18">List interfaces, paths and services still reachable.</text><path d="M360 292.25v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="310.25" width="664" height="132.4" rx="16" fill="#fff1dd" stroke="#59697a"/><path d="M4 3h16v18H4z M8 7h8 M8 12h8 M8 17h5" transform="translate(44 323.25) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="340.25" font-size="20" font-weight="700">02 | Preserve and inspect records</text><text x="92" y="373.25" font-size="18">Check logins, accounts and file anomalies; escalate</text><text x="92" y="402.95" font-size="18">suspicious findings.</text><path d="M360 458.65v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="476.65" width="664" height="132.4" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 489.65) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="506.65" font-size="20" font-weight="700">03 | Inventory and controlled patching</text><text x="92" y="539.65" font-size="18">Check DSM and packages individually and record versions</text><text x="92" y="569.35" font-size="18">before and after.</text><path d="M360 625.05v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="643.05" width="664" height="132.4" rx="16" fill="#e2f5f2" stroke="#59697a"/><path d="M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6z M8 12l3 3 5-6" transform="translate(44 656.05) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="673.05" font-size="20" font-weight="700">04 | Verify permissions and recovery</text><text x="92" y="706.05" font-size="18">Test allowed and denied operations and restore an</text><text x="92" y="735.75" font-size="18">independent copy.</text><path d="M360 791.4499999999999v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="809.4499999999999" width="664" height="132.4" rx="16" fill="#f0eaff" stroke="#59697a"/><path d="M4 12l5 5L20 5" transform="translate(44 822.4499999999999) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="839.4499999999999" font-size="20" font-weight="700">05 | Reconnect in stages</text><text x="92" y="872.4499999999999" font-size="18">After administrator acceptance, restore necessary</text><text x="92" y="902.15" font-size="18">services and monitor logs.</text><text x="28" y="981.8499999999999" font-size="18">At any step, signs of compromise require continued isolation</text><text x="28" y="1011.55" font-size="18">and incident handling; reconnect according to the assessment.</text></g></svg>
