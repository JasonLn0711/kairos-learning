<svg xmlns="http://www.w3.org/2000/svg" lang="zh" viewBox="0 0 720 624" role="img" aria-labelledby="title desc"><title id="title">圖2｜一次Lloyd中心更新</title><desc id="desc">固定X={1,2,3,8,9,10}，數線保持等距；三角形表示中心。</desc><rect width="720" height="624" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">圖2｜一次Lloyd中心更新</text><g transform="translate(0 56)"><path d="M60 70H660" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="70" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="126.66666666666667" cy="70" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="193.33333333333334" cy="70" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="526.6666666666667" cy="70" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="593.3333333333334" cy="70" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="660" cy="70" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><path d="M126.66666666666667 42l-12 22h24z" fill="#2485b9"/><path d="M526.6666666666667 42l-12 22h24z" fill="#d65a42"/><path d="M60 220H660" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="220" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="126.66666666666667" cy="220" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="193.33333333333334" cy="220" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="526.6666666666667" cy="220" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="593.3333333333334" cy="220" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="660" cy="220" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><path d="M126.66666666666667 192l-12 22h24z" fill="#2485b9"/><path d="M593.3333333333334 192l-12 22h24z" fill="#d65a42"/></g><text x="30" y="380" font-size="18">固定X={1,2,3,8,9,10}，數線保持等距；三角形表示中心。</text><text x="30" y="422" font-size="19">更新前</text><text x="30" y="452" font-size="18">c₁=2、c₂=8；左群1,2,3，右群8,9,10。</text><text x="30" y="498" font-size="19">更新後</text><text x="30" y="528" font-size="18">c₁=(1+2+3)/3=2；c₂=(8+9+10)/3=9。</text><text x="30" y="574" font-size="17">資料位置不動；右中心從8移到9，左中心維持2。</text></g></svg>
