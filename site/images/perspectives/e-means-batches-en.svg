<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 714" role="img" aria-labelledby="title desc"><title id="title">Figure 4 | Update frequency and data passes</title><desc id="desc">Both bars represent one epoch; the five batches below are illustrative.</desc><rect width="720" height="714" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">Figure 4 | Update frequency and data passes</text><g transform="translate(0 56)"><rect x="30" y="40" width="61" height="38" rx="3" fill="#d65a42"/><rect x="96" y="40" width="61" height="38" rx="3" fill="#e4a08f"/><rect x="162" y="40" width="61" height="38" rx="3" fill="#d65a42"/><rect x="228" y="40" width="61" height="38" rx="3" fill="#e4a08f"/><rect x="294" y="40" width="61" height="38" rx="3" fill="#d65a42"/><rect x="360" y="40" width="61" height="38" rx="3" fill="#e4a08f"/><rect x="426" y="40" width="61" height="38" rx="3" fill="#d65a42"/><rect x="492" y="40" width="61" height="38" rx="3" fill="#e4a08f"/><rect x="558" y="40" width="61" height="38" rx="3" fill="#d65a42"/><rect x="624" y="40" width="61" height="38" rx="3" fill="#e4a08f"/><rect x="30" y="170" width="127" height="38" rx="3" fill="#2485b9"/><path d="M96 218v20m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><rect x="162" y="170" width="127" height="38" rx="3" fill="#2485b9"/><path d="M228 218v20m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><rect x="294" y="170" width="127" height="38" rx="3" fill="#2485b9"/><path d="M360 218v20m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><rect x="426" y="170" width="127" height="38" rx="3" fill="#2485b9"/><path d="M492 218v20m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><rect x="558" y="170" width="127" height="38" rx="3" fill="#2485b9"/><path d="M624 218v20m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/></g><text x="30" y="380" font-size="18">Both bars represent one epoch; the five batches below are illus</text><text x="30" y="410" font-size="18">trative.</text><text x="30" y="452" font-size="19">Lloyd: update after a full pass</text><text x="30" y="482" font-size="18">Read all one million points, then update the centroids once.</text><text x="30" y="528" font-size="19">e-means: update after each batch</text><text x="30" y="558" font-size="18">Five illustrated batches each trigger an update; the actual cou</text><text x="30" y="588" font-size="18">nt depends on n and B.</text><text x="30" y="634" font-size="17">Mini-batching changes feedback frequency, not the definition of</text><text x="30" y="664" font-size="17"> a full data pass.</text></g></svg>
