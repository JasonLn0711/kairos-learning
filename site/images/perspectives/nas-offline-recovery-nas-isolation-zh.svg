<svg xmlns="http://www.w3.org/2000/svg" lang="zh-Hant" viewBox="0 0 720 591" role="img" aria-labelledby="title description"><title id="title">圖 2｜兩種斷網，保留的路徑不同</title><desc id="description">先分辨外網中斷與 NAS 網路介面中斷。</desc><rect width="720" height="591" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">圖 2｜兩種斷網，保留的路徑不同</text><text x="28" y="75.6" font-size="18">先分辨外網中斷與 NAS 網路介面中斷。</text><text x="28" y="117.3" font-size="21" font-weight="700">A｜外網斷開，內網保留</text><rect x="28" y="133.95" width="664" height="102.7" rx="16" fill="#ffe9e9" stroke="#59697a"/><path d="M9 2h6v6H9z M2 16h6v6H2z M16 16h6v6h-6z M12 8v4H5v4 M12 12h7v4" transform="translate(44 146.95) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="163.95" font-size="20" font-weight="700">外網路徑：中斷 ×</text><text x="92" y="196.95" font-size="18">網際網路 × 路由器：此路徑無法通行。</text><rect x="28" y="246.64999999999998" width="664" height="102.7" rx="16" fill="#e2f5f2" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 259.65) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="276.65" font-size="20" font-weight="700">內網路徑：仍待管理</text><text x="92" y="309.65" font-size="18">內網電腦 ↔ NAS：網路與權限允許時仍可共享檔案。</text><text x="28" y="389.34999999999997" font-size="21" font-weight="700">B｜NAS 的所有網路連線斷開</text><rect x="28" y="405.99999999999994" width="664" height="102.7" rx="16" fill="#ffe9e9" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 418.99999999999994) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="435.99999999999994" font-size="20" font-weight="700">電腦到 NAS：路徑中斷 ×</text><text x="92" y="468.99999999999994" font-size="18">透過已拔除介面的網路存取停止；維護另安排受控路徑。</text><text x="28" y="548.6999999999999" font-size="18">驗收要記錄拔除或封鎖的介面及仍可達的服務。</text></g></svg>
