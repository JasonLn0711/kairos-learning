<svg xmlns="http://www.w3.org/2000/svg" lang="zh-Hant" viewBox="0 0 720 1025" role="img" aria-labelledby="title description"><title id="title">圖 3｜兩條需要分別防護的路徑</title><desc id="description">箭頭表示可能的影響傳遞，並非個案已遭入侵的證據。</desc><rect width="720" height="1025" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">圖 3｜兩條需要分別防護的路徑</text><text x="28" y="75.6" font-size="18">箭頭表示可能的影響傳遞，並非個案已遭入侵的證據。</text><text x="28" y="117.3" font-size="21" font-weight="700">A｜利用可達服務的漏洞</text><rect x="28" y="133.95" width="664" height="102.7" rx="16" fill="#fff1dd" stroke="#59697a"/><path d="M3 3h18v13H3z M8 21h8 M12 16v5" transform="translate(44 146.95) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="163.95" font-size="20" font-weight="700">外部攻擊者</text><text x="92" y="196.95" font-size="18">能到達某個開放服務。</text><path d="M360 252.64999999999998v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="270.65" width="664" height="102.7" rx="16" fill="#fff1dd" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 283.65) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="300.65" font-size="20" font-weight="700">受影響的 NAS 服務</text><text x="92" y="333.65" font-size="18">版本與利用條件同時符合。</text><path d="M360 389.34999999999997v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="407.34999999999997" width="664" height="102.7" rx="16" fill="#ffe9e9" stroke="#59697a"/><path d="M12 2 23 21H1z M12 8v6 M12 17v1" transform="translate(44 420.34999999999997) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="437.34999999999997" font-size="20" font-weight="700">未授權的影響</text><text x="92" y="470.34999999999997" font-size="18">可能讀寫檔案或影響服務，依漏洞能力而定。</text><text x="28" y="550.05" font-size="21" font-weight="700">B｜使用既有檔案權限</text><rect x="28" y="566.6999999999999" width="664" height="102.7" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M3 3h18v13H3z M8 21h8 M12 16v5" transform="translate(44 579.6999999999999) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="596.6999999999999" font-size="20" font-weight="700">受感染的電腦</text><text x="92" y="629.6999999999999" font-size="18">惡意程式取得使用者的執行環境。</text><path d="M360 685.4v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="703.4" width="664" height="102.7" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6z M8 12l3 3 5-6" transform="translate(44 716.4) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="733.4" font-size="20" font-weight="700">SMB 寫入權限</text><text x="92" y="766.4" font-size="18">該帳號獲准修改共享資料夾。</text><path d="M360 822.1v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="840.1" width="664" height="102.7" rx="16" fill="#ffe9e9" stroke="#59697a"/><path d="M4 3h16v18H4z M8 7h8 M8 12h8 M8 17h5" transform="translate(44 853.1) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="870.1" font-size="20" font-weight="700">共享資料遭修改</text><text x="92" y="903.1" font-size="18">可寫入的檔案可能遭刪除或加密。</text><text x="28" y="982.8000000000001" font-size="18">修補處理軟體缺口；最小權限、端點防護與復原副本各自承接不同風險。</text></g></svg>
