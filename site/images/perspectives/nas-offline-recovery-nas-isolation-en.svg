<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 749" role="img" aria-labelledby="title description"><title id="title">Figure 2 | Two disconnections, different remaining paths</title><desc id="description">Distinguish an Internet uplink outage from disconnected NAS interfaces.</desc><rect width="720" height="749" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">Figure 2 | Two disconnections, different</text><text x="28" y="75.6" font-size="24" font-weight="700">remaining paths</text><text x="28" y="115.19999999999999" font-size="18">Distinguish an Internet uplink outage from disconnected NAS</text><text x="28" y="144.89999999999998" font-size="18">interfaces.</text><text x="28" y="186.59999999999997" font-size="21" font-weight="700">A | Internet disconnected, LAN retained</text><rect x="28" y="203.24999999999997" width="664" height="102.7" rx="16" fill="#ffe9e9" stroke="#59697a"/><path d="M9 2h6v6H9z M2 16h6v6H2z M16 16h6v6h-6z M12 8v4H5v4 M12 12h7v4" transform="translate(44 216.24999999999997) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="233.24999999999997" font-size="20" font-weight="700">Internet path: disconnected ×</text><text x="92" y="266.25" font-size="18">Internet × router: this path is unavailable.</text><rect x="28" y="315.95" width="664" height="132.4" rx="16" fill="#e2f5f2" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 328.95) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="345.95" font-size="20" font-weight="700">LAN path: still requires controls</text><text x="92" y="378.95" font-size="18">Local computer ↔ NAS: file sharing remains possible when</text><text x="92" y="408.65" font-size="18">networking and permissions allow it.</text><text x="28" y="488.35" font-size="21" font-weight="700">B | All NAS network links disconnected</text><rect x="28" y="505" width="664" height="132.4" rx="16" fill="#ffe9e9" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 518) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="535" font-size="20" font-weight="700">Computer to NAS: path disconnected ×</text><text x="92" y="568" font-size="18">Access through disconnected interfaces stops. Arrange a</text><text x="92" y="597.7" font-size="18">separate controlled maintenance path.</text><text x="28" y="677.4" font-size="18">Record which interfaces are disconnected or blocked and which</text><text x="28" y="707.1" font-size="18">services remain reachable.</text></g></svg>
