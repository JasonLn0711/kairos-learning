<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 693" role="img" aria-labelledby="title description"><title id="title">Figure 1 | Two computers, one shared resource</title><desc id="description">A LAN is a local area network. Each user connects independently to the NAS.</desc><rect width="720" height="693" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">Figure 1 | Two computers, one shared resource</text><text x="28" y="75.6" font-size="18">A LAN is a local area network. Each user connects independently</text><text x="28" y="105.3" font-size="18">to the NAS.</text><text x="28" y="147" font-size="21" font-weight="700">Laboratory LAN: independent access paths</text><rect x="28" y="163.65" width="664" height="132.4" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M3 3h18v13H3z M8 21h8 M12 16v5" transform="translate(44 176.65) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="193.65" font-size="20" font-weight="700">Researcher A’s computer</text><text x="92" y="226.65" font-size="18">Computer A → NAS: uses its own account to read and write</text><text x="92" y="256.35" font-size="18">permitted folders over SMB.</text><rect x="28" y="306.05" width="664" height="132.4" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M3 3h18v13H3z M8 21h8 M12 16v5" transform="translate(44 319.05) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="336.05" font-size="20" font-weight="700">Researcher B’s computer</text><text x="92" y="369.05" font-size="18">Computer B → NAS: reaches the same storage directly;</text><text x="92" y="398.75" font-size="18">permissions may differ from A’s.</text><rect x="28" y="448.45000000000005" width="664" height="132.4" rx="16" fill="#f0eaff" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 461.45000000000005) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="478.45000000000005" font-size="20" font-weight="700">Shared NAS storage</text><text x="92" y="511.45000000000005" font-size="18">Checks each account’s permissions separately and stores</text><text x="92" y="541.1500000000001" font-size="18">papers, models and research data.</text><text x="28" y="620.85" font-size="18">The cards represent parallel relationships. A does not connect</text><text x="28" y="650.5500000000001" font-size="18">through B.</text></g></svg>
