<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 714" role="img" aria-labelledby="title desc"><title id="title">Figure 2 | One Lloyd update</title><desc id="desc">Fixed X={1,2,3,8,9,10}; the number line uses equal spacing and triangles mark centroids.</desc><rect width="720" height="714" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">Figure 2 | One Lloyd update</text><g transform="translate(0 56)"><path d="M60 70H660" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="70" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="126.66666666666667" cy="70" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="193.33333333333334" cy="70" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="526.6666666666667" cy="70" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="593.3333333333334" cy="70" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="660" cy="70" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><path d="M126.66666666666667 42l-12 22h24z" fill="#2485b9"/><path d="M526.6666666666667 42l-12 22h24z" fill="#d65a42"/><path d="M60 220H660" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="220" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="126.66666666666667" cy="220" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="193.33333333333334" cy="220" r="6" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="526.6666666666667" cy="220" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="593.3333333333334" cy="220" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="660" cy="220" r="6" fill="#d65a42" stroke="none" stroke-width="3"/><path d="M126.66666666666667 192l-12 22h24z" fill="#2485b9"/><path d="M593.3333333333334 192l-12 22h24z" fill="#d65a42"/></g><text x="30" y="380" font-size="18">Fixed X={1,2,3,8,9,10}; the number line uses equal spacing and </text><text x="30" y="410" font-size="18">triangles mark centroids.</text><text x="30" y="452" font-size="19">Before the update</text><text x="30" y="482" font-size="18">c₁=2, c₂=8; the left group is 1,2,3 and the right group is 8,9</text><text x="30" y="512" font-size="18">,10.</text><text x="30" y="558" font-size="19">After the update</text><text x="30" y="588" font-size="18">c₁=(1+2+3)/3=2; c₂=(8+9+10)/3=9.</text><text x="30" y="634" font-size="17">Data positions stay fixed; the right centroid moves from 8 to 9</text><text x="30" y="664" font-size="17"> and the left stays at 2.</text></g></svg>
