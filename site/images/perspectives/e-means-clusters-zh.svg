<svg xmlns="http://www.w3.org/2000/svg" lang="zh" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">圖1｜分群與代表中心</title><desc id="desc">三群是平行的資料集合；小圓點為資料，加號大圈為中心。</desc><rect width="720" height="700" fill="white"/><g font-family="system-ui,sans-serif" fill="#182b40"><text x="30" y="36" font-size="23" font-weight="700">圖1｜分群與代表中心</text><g transform="translate(0 56)"><circle cx="150" cy="90" r="78" fill="#2485b9" fill-opacity=".08" stroke="#2485b9" stroke-dasharray="7 6"/><circle cx="150" cy="42" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="112" cy="64" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="190" cy="80" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="120" cy="120" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="178" cy="130" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="160" cy="143" r="4" fill="#2485b9" stroke="none" stroke-width="3"/><circle cx="150" cy="90" r="14" fill="white" stroke="#2485b9" stroke-width="3"/><path d="M143 90h14M150 83v14" fill="none" stroke="#2485b9" stroke-width="4" stroke-linecap="round"/><circle cx="570" cy="90" r="78" fill="#d65a42" fill-opacity=".08" stroke="#d65a42" stroke-dasharray="7 6"/><circle cx="570" cy="42" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="532" cy="64" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="610" cy="80" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="540" cy="120" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="598" cy="130" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="580" cy="143" r="4" fill="#d65a42" stroke="none" stroke-width="3"/><circle cx="570" cy="90" r="14" fill="white" stroke="#d65a42" stroke-width="3"/><path d="M563 90h14M570 83v14" fill="none" stroke="#d65a42" stroke-width="4" stroke-linecap="round"/><circle cx="360" cy="230" r="78" fill="#299b76" fill-opacity=".08" stroke="#299b76" stroke-dasharray="7 6"/><circle cx="360" cy="182" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="322" cy="204" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="400" cy="220" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="330" cy="260" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="388" cy="270" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="370" cy="283" r="4" fill="#299b76" stroke="none" stroke-width="3"/><circle cx="360" cy="230" r="14" fill="white" stroke="#299b76" stroke-width="3"/><path d="M353 230h14M360 223v14" fill="none" stroke="#299b76" stroke-width="4" stroke-linecap="round"/></g><text x="30" y="380" font-size="18">三群是平行的資料集合；小圓點為資料，加號大圈為中心。</text><text x="30" y="422" font-size="19">中心1：藍色</text><text x="30" y="452" font-size="18">左上群的代表位置。</text><text x="30" y="498" font-size="19">中心2：橘色</text><text x="30" y="528" font-size="18">右上群的代表位置。</text><text x="30" y="574" font-size="19">中心3：綠色</text><text x="30" y="604" font-size="18">下方群的代表位置。</text><text x="30" y="650" font-size="17">虛線圓為教學範圍，不是Voronoi邊界；這不是e-means實驗。</text></g></svg>
