<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 1114" role="img" aria-labelledby="title description"><title id="title">Figure 3 | Two paths requiring separate controls</title><desc id="description">Arrows show possible propagation of impact, not evidence that a particular device was compromised.</desc><rect width="720" height="1114" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">Figure 3 | Two paths requiring separate controls</text><text x="28" y="75.6" font-size="18">Arrows show possible propagation of impact, not evidence that a</text><text x="28" y="105.3" font-size="18">particular device was compromised.</text><text x="28" y="147" font-size="21" font-weight="700">A | Exploiting a reachable service</text><rect x="28" y="163.65" width="664" height="102.7" rx="16" fill="#fff1dd" stroke="#59697a"/><path d="M3 3h18v13H3z M8 21h8 M12 16v5" transform="translate(44 176.65) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="193.65" font-size="20" font-weight="700">External attacker</text><text x="92" y="226.65" font-size="18">Can reach an exposed service.</text><path d="M360 282.35v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="300.35" width="664" height="102.7" rx="16" fill="#fff1dd" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 313.35) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="330.35" font-size="20" font-weight="700">Affected NAS service</text><text x="92" y="363.35" font-size="18">The version and exploitation conditions apply.</text><path d="M360 419.05v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="437.05" width="664" height="132.4" rx="16" fill="#ffe9e9" stroke="#59697a"/><path d="M12 2 23 21H1z M12 8v6 M12 17v1" transform="translate(44 450.05) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="467.05" font-size="20" font-weight="700">Unauthorized impact</text><text x="92" y="500.05" font-size="18">May read or write files or disrupt a service, depending</text><text x="92" y="529.75" font-size="18">on the vulnerability.</text><text x="28" y="609.45" font-size="21" font-weight="700">B | Using existing file permissions</text><rect x="28" y="626.1" width="664" height="102.7" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M3 3h18v13H3z M8 21h8 M12 16v5" transform="translate(44 639.1) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="656.1" font-size="20" font-weight="700">Infected computer</text><text x="92" y="689.1" font-size="18">Malware operates in the user’s environment.</text><path d="M360 744.8000000000001v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="762.8000000000001" width="664" height="102.7" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6z M8 12l3 3 5-6" transform="translate(44 775.8000000000001) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="792.8000000000001" font-size="20" font-weight="700">SMB write permission</text><text x="92" y="825.8000000000001" font-size="18">The account is permitted to modify shared folders.</text><path d="M360 881.5000000000001v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="899.5000000000001" width="664" height="102.7" rx="16" fill="#ffe9e9" stroke="#59697a"/><path d="M4 3h16v18H4z M8 7h8 M8 12h8 M8 17h5" transform="translate(44 912.5000000000001) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="929.5000000000001" font-size="20" font-weight="700">Shared data modified</text><text x="92" y="962.5000000000001" font-size="18">Writable files may be deleted or encrypted.</text><text x="28" y="1042.2000000000003" font-size="18">Patches address software flaws; least privilege, endpoint</text><text x="28" y="1071.9000000000003" font-size="18">protection and recovery copies address distinct risks.</text></g></svg>
