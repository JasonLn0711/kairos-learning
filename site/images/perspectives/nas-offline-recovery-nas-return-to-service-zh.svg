<svg xmlns="http://www.w3.org/2000/svg" lang="zh-Hant" viewBox="0 0 720 866" role="img" aria-labelledby="title description"><title id="title">圖 6｜五個有證據的復線步驟</title><desc id="description">這是處置規劃，並非已完成的維運紀錄。</desc><rect width="720" height="866" fill="#ffffff"/><g font-family="system-ui, sans-serif" fill="#182b40"><text x="28" y="36" font-size="24" font-weight="700">圖 6｜五個有證據的復線步驟</text><text x="28" y="75.6" font-size="18">這是處置規劃，並非已完成的維運紀錄。</text><text x="28" y="117.3" font-size="21" font-weight="700">從隔離到有限恢復</text><rect x="28" y="133.95" width="664" height="102.7" rx="16" fill="#eef1f4" stroke="#59697a"/><path d="M9 2h6v6H9z M2 16h6v6H2z M16 16h6v6h-6z M12 8v4H5v4 M12 12h7v4" transform="translate(44 146.95) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="163.95" font-size="20" font-weight="700">01｜確認隔離</text><text x="92" y="196.95" font-size="18">列出介面、路徑與仍可達的服務。</text><path d="M360 252.64999999999998v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="270.65" width="664" height="102.7" rx="16" fill="#fff1dd" stroke="#59697a"/><path d="M4 3h16v18H4z M8 7h8 M8 12h8 M8 17h5" transform="translate(44 283.65) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="300.65" font-size="20" font-weight="700">02｜保存與檢查紀錄</text><text x="92" y="333.65" font-size="18">檢查登入、帳號與檔案異常；可疑情況轉入調查。</text><path d="M360 389.34999999999997v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="407.34999999999997" width="664" height="102.7" rx="16" fill="#eaf1ff" stroke="#59697a"/><path d="M5 2h14v20H5z M8 6h2v10H8z M14 6h2v10h-2z M15 19h1" transform="translate(44 420.34999999999997) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="437.34999999999997" font-size="20" font-weight="700">03｜盤點與受控修補</text><text x="92" y="470.34999999999997" font-size="18">逐項核對 DSM 與套件，記錄更新前後版本。</text><path d="M360 526.05v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="544.05" width="664" height="102.7" rx="16" fill="#e2f5f2" stroke="#59697a"/><path d="M12 2 21 6v6c0 5-9 10-9 10S3 17 3 12V6z M8 12l3 3 5-6" transform="translate(44 557.05) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="574.05" font-size="20" font-weight="700">04｜驗證權限與復原</text><text x="92" y="607.05" font-size="18">測試允許及拒絕的操作，完成獨立副本還原。</text><path d="M360 662.75v20m-6-6 6 6 6-6" fill="none" stroke="#425466" stroke-width="2"/><rect x="28" y="680.75" width="664" height="102.7" rx="16" fill="#f0eaff" stroke="#59697a"/><path d="M4 12l5 5L20 5" transform="translate(44 693.75) scale(1.3)" fill="none" stroke="#243b53" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="710.75" font-size="20" font-weight="700">05｜分階段復線</text><text x="92" y="743.75" font-size="18">管理者確認結果後，只恢復必要服務並觀察紀錄。</text><text x="28" y="823.45" font-size="18">任一步出現入侵跡象，維持隔離並交由事件處理；復線以評估結果為準。</text></g></svg>
