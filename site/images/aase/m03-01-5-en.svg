<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 514" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5｜Two Documents, Different Responsibilities</title><desc id="desc">Compare their purposes side by side. Record the reason for requirement changes and keep both documents consistent.</desc><rect width="1040" height="514" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 5｜Two Documents, Different Responsibilities</text><rect x="36" y="70" width="476" height="230" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">problem.md | Problem document</text><text x="56" y="142" font-size="20" font-weight="400">Why do this? Who faces</text><text x="56" y="178" font-size="20" font-weight="400">difficulty? How is work done</text><text x="56" y="214" font-size="20" font-weight="400">now? What should improve? Which</text><text x="56" y="250" font-size="20" font-weight="400">assumptions remain unverified?</text><rect x="528" y="70" width="476" height="302" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="548" y="98" font-size="22" font-weight="650">spec.md | Specification</text><text x="548" y="134" font-size="22" font-weight="650">document</text><text x="548" y="178" font-size="20" font-weight="400">What exactly should the system</text><text x="548" y="214" font-size="20" font-weight="400">do? Which fields are required?</text><text x="548" y="250" font-size="20" font-weight="400">How are they checked? How are</text><text x="548" y="286" font-size="20" font-weight="400">errors shown? How will behavior</text><text x="548" y="322" font-size="20" font-weight="400">be tested?</text><text x="36" y="418" font-size="20" font-weight="400">Compare their purposes side by side. Record the reason for</text><text x="36" y="454" font-size="20" font-weight="400">requirement changes and keep both documents consistent.</text></g></svg>
