<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 826" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜Problem Statement Framework｜五個問題</title><desc id="desc">這五個面向共同定義問題。編號是閱讀與訪談順序，不表示各面向已獲證實。</desc><rect width="1040" height="826" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 2｜Problem Statement Framework｜五個問題</text><rect x="36" y="70" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">1. Who｜誰遇到問題？</text><text x="56" y="142" font-size="20" font-weight="400">負責交接申請文件的收件人員。</text><rect x="36" y="202" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="230" font-size="22" font-weight="650">2. When｜什麼時候發生？</text><text x="56" y="274" font-size="20" font-weight="400">在把文件交給下一位同仁之前。</text><rect x="36" y="334" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="362" font-size="22" font-weight="650">3. As-Is｜現在怎麼做？</text><text x="56" y="406" font-size="20" font-weight="400">透過人工清單逐一核對必填欄位。</text><rect x="36" y="466" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="494" font-size="22" font-weight="650">4. Problem｜究竟有什麼困難？</text><text x="56" y="538" font-size="20" font-weight="400">可能因為漏看欄位，導致文件交接後才需要補件。這是尚待驗證的假設。</text><rect x="36" y="598" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="626" font-size="22" font-weight="650">5. Outcome｜希望改善到什麼程度？</text><text x="56" y="670" font-size="20" font-weight="400">讓收件人員在交接之前，就能找到並修正缺漏。</text><text x="36" y="766" font-size="20" font-weight="400">這五個面向共同定義問題。編號是閱讀與訪談順序，不表示各面向已獲證實。</text></g></svg>
