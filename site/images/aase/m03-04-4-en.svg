<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 956" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4｜An easily missed error</title><desc id="desc">Steps 1 → 2 show changing input. Incorrect and correct handling are alternatives.</desc><rect width="1040" height="956" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 4｜An easily missed error</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="104" font-size="22" font-weight="650">1. Enter three required fields</text><text x="60" y="148" font-size="20" font-weight="400">The data is complete and passes validation</text><path d="M520 204v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="256" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="284" font-size="22" font-weight="650">2. Delete one required field</text><text x="60" y="328" font-size="20" font-weight="400">The previous successful check no longer applies</text><rect x="36" y="436" width="968" height="158" rx="10" fill="#faeef0" stroke="#718188"/><text x="60" y="464" font-size="22" font-weight="650">Incorrect: export using stale results</text><text x="60" y="508" font-size="20" font-weight="400">A success message appears, but the report does not match the</text><text x="60" y="544" font-size="20" font-weight="400">current input</text><rect x="36" y="652" width="968" height="122" rx="10" fill="#eaf6ef" stroke="#718188"/><text x="60" y="680" font-size="22" font-weight="650">Correct: require a fresh check before export</text><text x="60" y="724" font-size="20" font-weight="400">Keep validation consistent with the current input</text><text x="36" y="860" font-size="20" font-weight="400">Steps 1 → 2 show changing input. Incorrect and correct handling are</text><text x="36" y="896" font-size="20" font-weight="400">alternatives.</text></g></svg>
