<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 622" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜六階段的證據修復流程</title><desc id="desc">依 01–06 的閱讀順序理解各項責任；第 06 項在需要復原時執行，並非每次修復都要撤銷變更。</desc><rect width="1060" height="622" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 1｜六階段的證據修復流程</text><rect x="36" y="96" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">01  重現問題</text><text x="56" y="176" font-size="20" font-weight="400">證明問題確實存在</text><rect x="546" y="96" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="566" y="132" font-size="20" font-weight="700">02  定位原因</text><text x="566" y="176" font-size="20" font-weight="400">辨別故障發生在哪一層</text><rect x="36" y="246" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="282" font-size="20" font-weight="700">03  固定失敗</text><text x="56" y="326" font-size="20" font-weight="400">用測試抓住錯誤</text><rect x="546" y="246" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="566" y="282" font-size="20" font-weight="700">04  最小修正</text><text x="566" y="326" font-size="20" font-weight="400">只修改必要部分</text><rect x="36" y="396" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="432" font-size="20" font-weight="700">05  重新驗證</text><text x="56" y="476" font-size="20" font-weight="400">確認修好了且沒弄壞其他功能</text><rect x="546" y="396" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="566" y="432" font-size="20" font-weight="700">06  安全復原</text><text x="566" y="476" font-size="20" font-weight="400">必要時回復變更，留下證據</text><text x="36" y="562" font-size="20" font-weight="400">依 01–06 的閱讀順序理解各項責任；第 06 項在需要復原時執行，並非每次修復都要撤銷變更。</text></g></svg>
