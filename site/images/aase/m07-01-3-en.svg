<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1140" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Five steps from project location to shutdown</title><desc id="desc">Numbers and arrows indicate operating order. Check actual outcomes at each step; skeleton startup does not establish feature acceptance.</desc><rect width="1060" height="1140" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 3 | Five steps from project location to shutdown</text><rect x="36" y="96" width="988" height="166" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="132" font-size="20" font-weight="700">Find the correct project root</text><text x="56" y="176" font-size="20" font-weight="400">Confirm that README, requirements.txt and starter are in the expected</text><text x="56" y="212" font-size="20" font-weight="400">locations.</text><path d="M530 270v24m-7-7 7 7 7-7" fill="none" stroke="#506573" stroke-width="2"/><rect x="36" y="310" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="346" font-size="20" font-weight="700">Create and activate a virtual environment</text><text x="56" y="390" font-size="20" font-weight="400">Confirm that the selected Python meets the requirements.</text><path d="M530 448v24m-7-7 7 7 7-7" fill="none" stroke="#506573" stroke-width="2"/><rect x="36" y="488" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="524" font-size="20" font-weight="700">Install dependencies</text><text x="56" y="568" font-size="20" font-weight="400">Confirm that installation finishes successfully.</text><path d="M530 626v24m-7-7 7 7 7-7" fill="none" stroke="#506573" stroke-width="2"/><rect x="36" y="666" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="702" font-size="20" font-weight="700">Start the program</text><text x="56" y="746" font-size="20" font-weight="400">Observe the starting skeleton in the browser.</text><path d="M530 804v24m-7-7 7 7 7-7" fill="none" stroke="#506573" stroke-width="2"/><rect x="36" y="844" width="988" height="166" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="880" font-size="20" font-weight="700">Stop and retain evidence</text><text x="56" y="924" font-size="20" font-weight="400">Stop the service properly and record successes, failures and</text><text x="56" y="960" font-size="20" font-weight="400">unverified items.</text><text x="36" y="1048" font-size="20" font-weight="400">Numbers and arrows indicate operating order. Check actual outcomes at</text><text x="36" y="1084" font-size="20" font-weight="400">each step; skeleton startup does not establish feature acceptance.</text></g></svg>
