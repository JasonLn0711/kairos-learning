<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 568" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜分別核對三層結果</title><desc id="desc">三列是不同的判讀責任，通過其中一層不保證其餘層成立。</desc><rect width="1040" height="568" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 2｜分別核對三層結果</text><circle cx="48" cy="96" r="10" fill="none" stroke="#65757c"/><text x="80" y="104" font-size="20" font-weight="700">第一層：通訊結果</text><text x="80" y="144" font-size="20" font-weight="400">請求有沒有成功送達並獲得預期回應？HTTP 狀態是什麼？</text><path d="M36 200H1004" stroke="#d5dce0"/><circle cx="48" cy="240" r="10" fill="none" stroke="#65757c"/><text x="80" y="248" font-size="20" font-weight="700">第二層：業務結果</text><text x="80" y="288" font-size="20" font-weight="400">內容是否符合規則？例如資料齊全、庫存足夠、符合受理條件。</text><path d="M36 344H1004" stroke="#d5dce0"/><circle cx="48" cy="384" r="10" fill="none" stroke="#65757c"/><text x="80" y="392" font-size="20" font-weight="700">第三層：使用者任務完成</text><text x="80" y="432" font-size="20" font-weight="400">訂單真的成立、報告能正確下載，或使用者確實取得需要的結果了嗎？</text><text x="36" y="508" font-size="20" font-weight="400">三列是不同的判讀責任，通過其中一層不保證其餘層成立。</text></g></svg>
