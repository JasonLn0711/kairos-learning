<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜C4 的四個放大層級</title><desc id="desc">四層是由外而內的靜態結構視角，不是四個執行步驟；依溝通需要選用。</desc><rect width="1040" height="456" fill="#fff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="40" y="44" font-size="24" font-weight="700">圖 2｜C4 的四個放大層級</text><rect x="40" y="98" width="460" height="118" rx="12" fill="#fbfcfd" stroke="#64748b" stroke-width="2"/><text x="58" y="130" font-size="22" font-weight="700">C1 · Context</text><text x="58" y="170" font-size="20" font-weight="400">系統與外界的關係</text><rect x="540" y="98" width="460" height="118" rx="12" fill="#fbfcfd" stroke="#64748b" stroke-width="2"/><text x="558" y="130" font-size="22" font-weight="700">C2 · Container</text><text x="558" y="170" font-size="20" font-weight="400">系統由哪些應用與資料儲存組成</text><rect x="40" y="240" width="460" height="118" rx="12" fill="#fbfcfd" stroke="#64748b" stroke-width="2"/><text x="58" y="272" font-size="22" font-weight="700">C3 · Component</text><text x="58" y="312" font-size="20" font-weight="400">應用程式內有哪些功能元件</text><rect x="540" y="240" width="460" height="118" rx="12" fill="#fbfcfd" stroke="#64748b" stroke-width="2"/><text x="558" y="272" font-size="22" font-weight="700">C4 · Code</text><text x="558" y="312" font-size="20" font-weight="400">類別、介面等程式碼結構</text><text x="40" y="398" font-size="20" font-weight="400">四層是由外而內的靜態結構視角，不是四個執行步驟；依溝通需要選用。</text></g></svg>
