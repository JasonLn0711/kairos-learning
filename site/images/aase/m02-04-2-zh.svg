<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1174" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜Coding Agent 的觀察與修正</title><desc id="desc">向下箭頭表示一輪作業；測試失敗回到觀察，通過才交付審查。每輪仍受停止條件、授權限制與資源預算約束。</desc><rect width="1040" height="1174" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 2｜Coding Agent 的觀察與修正</text><rect x="36" y="94" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="128" font-size="22">目標</text><text x="56" y="170" font-size="20">修好星期六排三科的 Bug。</text><path d="M520 226V254m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="268" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="302" font-size="22">觀察</text><text x="56" y="344" font-size="20">讀取規格、程式與錯誤紀錄。</text><path d="M520 400V428m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="442" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="476" font-size="22">決策</text><text x="56" y="518" font-size="20">選擇要檢查哪個檔案。</text><path d="M520 574V602m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="616" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="650" font-size="22">行動</text><text x="56" y="692" font-size="20">修改程式並執行測試。</text><path d="M520 748V766H266V792m-7-7 7 7 7-7M520 766H774V792m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="808" width="460" height="158" rx="10" fill="#fbf0ed" stroke="#d4d8da"/><text x="56" y="842" font-size="22">測試失敗 → 重新觀察</text><text x="56" y="884" font-size="20">找出失敗原因，再回到觀察步驟決定下一步</text><text x="56" y="918" font-size="20">；遇停止條件就交接。</text><rect x="544" y="808" width="460" height="158" rx="10" fill="#edf5f0" stroke="#d4d8da"/><text x="564" y="842" font-size="22">測試通過 → 交付審查</text><text x="564" y="884" font-size="20">保留差異與測試紀錄；通過測試仍須依任務</text><text x="564" y="918" font-size="20">約定審查。</text><text x="36" y="992" font-size="20">↩ 回到觀察；遇停止條件則交接。</text><text x="36" y="1078" font-size="20">向下箭頭表示一輪作業；測試失敗回到觀察，通過才交付審查。每輪仍受停止條件、授權限制與資</text><text x="36" y="1112" font-size="20">源預算約束。</text></g></svg>
