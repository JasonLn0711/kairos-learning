<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 558" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜將上傳結果畫成共同節點的分支</title><desc id="desc">依 Balsamiq 檔案上傳範例重製。上方對照重複路徑的問題，下方共用「檔案上傳中」後分支；失敗線用文字與虛線區分，顏色不是唯一提示。</desc><rect width="1040" height="558" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="30" y="42" font-size="24" font-weight="700">圖 4｜將上傳結果畫成共同節點的分支</text><text x="30" y="86" font-size="20" font-weight="400">依 Balsamiq 檔案上傳範例重製。上方對照重複路徑的問題，下方共用「檔案上傳中」後分支；失</text><text x="30" y="120" font-size="20" font-weight="400">敗線用文字與虛線區分，顏色不是唯一提示。</text><rect x="30" y="153" width="980" height="169" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="178" font-size="22" font-weight="700">分開重複的路徑</text><text x="50" y="224" font-size="20" font-weight="400">使用者上傳檔案 → 檔案上傳中 → 檔案上傳成功</text><text x="50" y="268" font-size="20" font-weight="400">使用者上傳檔案 → 檔案上傳中 → 檔案上傳失敗</text><rect x="30" y="321" width="980" height="213" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="346" font-size="22" font-weight="700">共用上傳中的狀態</text><text x="50" y="392" font-size="20" font-weight="400">使用者上傳檔案 → 檔案上傳中</text><text x="50" y="436" font-size="20" font-weight="400">成功 → 檔案上傳成功</text><text x="50" y="480" font-size="20" font-weight="400">失敗 ⇢ 檔案上傳失敗</text></g></svg>
