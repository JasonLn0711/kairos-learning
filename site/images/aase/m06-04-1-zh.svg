<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1248" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜一次網頁操作的概念流程</title><desc id="desc">箭頭表示本例的概念處理順序；實作架構與通訊需另行確認。</desc><rect width="1040" height="1248" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 1｜一次網頁操作的概念流程</text><circle cx="520" cy="100" r="10" fill="none" stroke="#65757c"/><text x="520" y="138" font-size="20" font-weight="700" text-anchor="middle">1. 使用者操作</text><text x="520" y="178" font-size="20" font-weight="400" text-anchor="middle">選擇牛肉麵，按下送出</text><path d="M520 218v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><circle cx="520" cy="282" r="10" fill="none" stroke="#65757c"/><text x="520" y="320" font-size="20" font-weight="700" text-anchor="middle">2. Browser（瀏覽器）</text><text x="520" y="360" font-size="20" font-weight="400" text-anchor="middle">收集品項、數量、桌號等資料</text><path d="M520 400v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><circle cx="520" cy="464" r="10" fill="none" stroke="#65757c"/><text x="520" y="502" font-size="20" font-weight="700" text-anchor="middle">3. HTTP／其他通訊機制</text><text x="520" y="542" font-size="20" font-weight="400" text-anchor="middle">把資料送往處理訂單的系統</text><path d="M520 582v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><circle cx="520" cy="646" r="10" fill="none" stroke="#65757c"/><text x="520" y="684" font-size="20" font-weight="700" text-anchor="middle">4. Server（伺服器）</text><text x="520" y="724" font-size="20" font-weight="400" text-anchor="middle">確認商品、價格、庫存與訂購權限</text><path d="M520 764v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><circle cx="520" cy="828" r="10" fill="none" stroke="#65757c"/><text x="520" y="866" font-size="20" font-weight="700" text-anchor="middle">5. 資料儲存與業務處理</text><text x="520" y="906" font-size="20" font-weight="400" text-anchor="middle">建立訂單、儲存結果</text><path d="M520 946v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="24" y="986" width="992" height="150" rx="12" fill="#eaf6ef"/><circle cx="520" cy="1010" r="10" fill="none" stroke="#65757c"/><text x="520" y="1048" font-size="20" font-weight="700" text-anchor="middle">6. 回傳結果</text><text x="520" y="1088" font-size="20" font-weight="400" text-anchor="middle">畫面顯示訂單成立，或提示失敗原因</text><text x="36" y="1188" font-size="20" font-weight="400">箭頭表示本例的概念處理順序；實作架構與通訊需另行確認。</text></g></svg>
