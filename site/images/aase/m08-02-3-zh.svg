<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 898" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜人與 Agent 的 TDD 協作</title><desc id="desc">向下箭頭表示協作順序；驗收條件由人員或獨立機制確認。這是工作流程示意，不是已執行紀錄。</desc><rect width="1060" height="898" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 3｜人與 Agent 的 TDD 協作</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">人定義要求與驗收條件</text><text x="56" y="176" font-size="20" font-weight="400">先選出一項最小、可驗證的行為</text><path d="M530 236v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="286" width="988" height="130" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="322" font-size="20" font-weight="700">Agent 撰寫測試，執行並展示預期失敗</text><text x="56" y="366" font-size="20" font-weight="400">核對失敗是否來自需求行為</text><path d="M530 426v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="476" width="988" height="130" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="512" font-size="20" font-weight="700">Agent 修改實作，再執行相同測試</text><text x="56" y="556" font-size="20" font-weight="400">保留原本的驗收要求</text><path d="M530 616v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="666" width="988" height="130" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="702" font-size="20" font-weight="700">確認測試結果，重構並再次驗證</text><text x="56" y="746" font-size="20" font-weight="400">回報已驗證與未驗證的要求</text><text x="36" y="838" font-size="20" font-weight="400">向下箭頭表示協作順序；驗收條件由人員或獨立機制確認。這是工作流程示意，不是已執行紀錄。</text></g></svg>
