<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 524" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3｜Three scope states</title><desc id="desc">These are not mandatory release phases. Deferred work is not a promise to implement it.</desc><rect width="1040" height="524" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 3｜Three scope states</text><rect x="36.0" y="76" width="312.0" height="194" rx="10" fill="#eaf6ef" stroke="#718188"/><text x="60.0" y="104" font-size="22" font-weight="650">First version</text><text x="60.0" y="148" font-size="20" font-weight="400">Complete now and</text><text x="60.0" y="184" font-size="20" font-weight="400">provide acceptance</text><text x="60.0" y="220" font-size="20" font-weight="400">evidence</text><rect x="364.0" y="76" width="312.0" height="230" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="388.0" y="104" font-size="22" font-weight="650">Deferred</text><text x="388.0" y="148" font-size="20" font-weight="400">Possibly needed;</text><text x="388.0" y="184" font-size="20" font-weight="400">first meet the</text><text x="388.0" y="220" font-size="20" font-weight="400">conditions for</text><text x="388.0" y="256" font-size="20" font-weight="400">reconsideration</text><rect x="692.0" y="76" width="312.0" height="266" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="716.0" y="104" font-size="22" font-weight="650">Not in this</text><text x="716.0" y="140" font-size="22" font-weight="650">version</text><text x="716.0" y="184" font-size="20" font-weight="400">Explicitly excluded</text><text x="716.0" y="220" font-size="20" font-weight="400">; no commitment to</text><text x="716.0" y="256" font-size="20" font-weight="400">provide the</text><text x="716.0" y="292" font-size="20" font-weight="400">capability</text><text x="36" y="428" font-size="20" font-weight="400">These are not mandatory release phases. Deferred work is not a</text><text x="36" y="464" font-size="20" font-weight="400">promise to implement it.</text></g></svg>
