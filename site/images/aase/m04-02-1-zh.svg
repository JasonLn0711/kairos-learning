<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 830" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜任務分析的核心思考架構</title><desc id="desc">目標引導四個平行分析面向，再用完成結果核對。箭頭表示分析關係，四個面向沒有先後順序。</desc><rect width="1040" height="830" fill="#ffffff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="20" font-weight="700">圖 1｜任務分析的核心思考架構</text><rect x="36" y="96" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="132" font-size="20" font-weight="700">使用者目標 Goal</text><text x="56" y="174" font-size="20" font-weight="400">最終要得到什麼成果？</text><path d="M520 232v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="276" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="312" font-size="20" font-weight="700">動作 Action</text><text x="56" y="354" font-size="20" font-weight="400">需要做什麼？</text><rect x="540" y="276" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="312" font-size="20" font-weight="700">判斷 Decision</text><text x="560" y="354" font-size="20" font-weight="400">依什麼條件決定？</text><rect x="36" y="416" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="452" font-size="20" font-weight="700">資訊與回饋</text><text x="56" y="494" font-size="20" font-weight="400">需要知道什麼？</text><rect x="540" y="416" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="452" font-size="20" font-weight="700">例外與回復</text><text x="560" y="494" font-size="20" font-weight="400">失敗後怎麼繼續？</text><path d="M520 556v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="600" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="636" font-size="20" font-weight="700">可驗證的完成結果</text><text x="56" y="678" font-size="20" font-weight="400">怎麼證明工作真的完成？</text><text x="36" y="772" font-size="20" font-weight="400">目標引導四個平行分析面向，再用完成結果核對。箭頭表示分析關係，四個面向沒有先後順序。</text></g></svg>
