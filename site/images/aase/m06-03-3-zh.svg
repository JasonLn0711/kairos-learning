<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 860" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜訂餐系統的 C1 外部關係</title><desc id="desc">顧客／店員 ↔ 訂餐系統 ↔ 外部支付平台，雙向連線表示互動關係；未描述特定通訊協定或執行順序。</desc><rect width="1060" height="860" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 3｜訂餐系統的 C1 外部關係</text><rect x="36" y="96" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="132" font-size="20" font-weight="700">顧客、餐廳店員</text><text x="56" y="176" font-size="20" font-weight="400">系統範圍外的人／角色</text><path d="M520 242v28m-7-7 7 7 7-7M536 270V242m-7 7 7-7 7 7" fill="none" stroke="#46535f" stroke-width="2"/><rect x="36" y="290" width="988" height="240" rx="14" fill="#fbfcfd" stroke="#7295bf" stroke-dasharray="5 5"/><text x="56" y="326" font-size="20" font-weight="700">System Boundary</text><rect x="56" y="376" width="948" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="76" y="412" font-size="20" font-weight="700">線上訂餐系統</text><text x="76" y="456" font-size="20" font-weight="400">我們正在設計的系統；系統邊界內</text><path d="M520 542v28m-7-7 7 7 7-7M536 570V542m-7 7 7-7 7 7" fill="none" stroke="#46535f" stroke-width="2"/><rect x="36" y="590" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="626" font-size="20" font-weight="700">第三方支付平台</text><text x="56" y="670" font-size="20" font-weight="400">系統範圍外的支付服務</text><text x="36" y="764" font-size="20" font-weight="400">顧客／店員 ↔ 訂餐系統 ↔ 外部支付平台，雙向連線表示互動關係；未描述特定通訊協定或執行順</text><text x="36" y="800" font-size="20" font-weight="400">序。</text></g></svg>
