<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1126" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4｜Conceptual order from requirements to verification</title><desc id="desc">Arrows show conceptual design order. Actual projects revisit earlier stages. Functional correctness and users completing work need separate verification.</desc><rect width="1040" height="1126" fill="#ffffff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="20" font-weight="700">Figure 4｜Conceptual order from requirements to verification</text><rect x="36" y="96" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="132" font-size="20" font-weight="700">01 Requirements engineering</text><text x="56" y="174" font-size="20" font-weight="400">Define the user problem and success criteria</text><path d="M520 236v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="280" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="316" font-size="20" font-weight="700">02 Task Analysis</text><text x="56" y="358" font-size="20" font-weight="400">Identify work, decisions, information and exceptions</text><path d="M520 420v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="464" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="500" font-size="20" font-weight="700">03 User Flow and UI design</text><text x="56" y="542" font-size="20" font-weight="400">Arrange paths, interfaces and feedback</text><path d="M520 604v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="648" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="684" font-size="20" font-weight="700">04 Implementation</text><text x="56" y="726" font-size="20" font-weight="400">Implement business rules and behavior</text><path d="M520 788v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="832" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="868" font-size="20" font-weight="700">05 Testing and verification</text><text x="56" y="910" font-size="20" font-weight="400">Check functions and users completing the work</text><text x="36" y="1000" font-size="20" font-weight="400">Arrows show conceptual design order. Actual projects revisit earlier</text><text x="36" y="1034" font-size="20" font-weight="400">stages. Functional correctness and users completing work need separate</text><text x="36" y="1068" font-size="20" font-weight="400">verification.</text></g></svg>
