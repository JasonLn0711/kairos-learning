<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 652" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Custom HTTP API and Streamlit concepts</title><desc id="desc">The independent paths are conceptual. Verify actual requests, WebSocket messages and connections from documentation, source or traffic. validate() is an in-process call, not an HTTP endpoint established by this figure.</desc><rect width="1040" height="652" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 3 | Custom HTTP API and Streamlit concepts</text><text x="36" y="104" font-size="20" font-weight="700">Custom HTTP API concept</text><text x="36" y="152" font-size="20" font-weight="400">Browser</text><path d="M240 144h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="284" y="152" font-size="20" font-weight="400">HTTP API</text><path d="M488 144h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="532" y="152" font-size="20" font-weight="400">Backend</text><path d="M736 144h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="780" y="152" font-size="20" font-weight="400">Response</text><path d="M36 224H1004" stroke="#d5dce0"/><text x="36" y="272" font-size="20" font-weight="700">Streamlit concept</text><text x="36" y="320" font-size="20" font-weight="400">Browser</text><path d="M240 312h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="284" y="320" font-size="20" font-weight="400">Streamlit</text><text x="284" y="356" font-size="20" font-weight="400">framework</text><text x="284" y="392" font-size="20" font-weight="400">communication</text><path d="M488 312h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="532" y="320" font-size="20" font-weight="400">Python process</text><path d="M736 312h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="780" y="320" font-size="20" font-weight="400">validate()</text><text x="36" y="484" font-size="20" font-weight="400">The independent paths are conceptual. Verify actual requests,</text><text x="36" y="520" font-size="20" font-weight="400">WebSocket messages and connections from documentation, source or</text><text x="36" y="556" font-size="20" font-weight="400">traffic. validate() is an in-process call, not an HTTP endpoint</text><text x="36" y="592" font-size="20" font-weight="400">established by this figure.</text></g></svg>
