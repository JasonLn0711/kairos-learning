<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 630" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜畫面、規則與測試分工</title><desc id="desc">三列是平行責任，沒有時間順序；同一規則可由畫面與測試呼叫。</desc><rect width="1060" height="630" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 3｜畫面、規則與測試分工</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">app.py — 畫面層</text><text x="56" y="176" font-size="20" font-weight="400">負責讓使用者輸入、呈現錯誤、修改資料</text><rect x="36" y="250" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="286" font-size="20" font-weight="700">rules.py — 規則層</text><text x="56" y="330" font-size="20" font-weight="400">負責判斷資料是否合法，不依賴畫面</text><rect x="36" y="404" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="440" font-size="20" font-weight="700">tests/test_rules.py — 測試層</text><text x="56" y="484" font-size="20" font-weight="400">負責用正常與異常資料檢查規則是否正確</text><text x="36" y="570" font-size="20" font-weight="400">三列是平行責任，沒有時間順序；同一規則可由畫面與測試呼叫。</text></g></svg>
