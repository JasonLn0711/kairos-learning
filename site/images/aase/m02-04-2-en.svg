<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1276" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | A Coding Agent observes and revises</title><desc id="desc">Downward arrows represent one iteration. Failed tests return to observation; passing tests lead to review. Stop conditions, permissions and resource budgets constrain every iteration.</desc><rect width="1040" height="1276" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 2 | A Coding Agent observes and revises</text><rect x="36" y="94" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="128" font-size="22">Goal</text><text x="56" y="170" font-size="20">Fix the bug rejecting three subjects on Saturday.</text><path d="M520 226V254m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="268" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="302" font-size="22">Observe</text><text x="56" y="344" font-size="20">Read the specification, code and error records.</text><path d="M520 400V428m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="442" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="476" font-size="22">Decide</text><text x="56" y="518" font-size="20">Choose which file to inspect.</text><path d="M520 574V602m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="616" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="650" font-size="22">Act</text><text x="56" y="692" font-size="20">Change code and run tests.</text><path d="M520 748V766H266V792m-7-7 7 7 7-7M520 766H774V792m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="808" width="460" height="226" rx="10" fill="#fbf0ed" stroke="#d4d8da"/><text x="56" y="842" font-size="22">Tests fail → observe again</text><text x="56" y="884" font-size="20">Find the failure cause and</text><text x="56" y="918" font-size="20">return to observation to</text><text x="56" y="952" font-size="20">choose the next action; hand</text><text x="56" y="986" font-size="20">off at a stop condition.</text><rect x="544" y="808" width="460" height="226" rx="10" fill="#edf5f0" stroke="#d4d8da"/><text x="564" y="842" font-size="22">Tests pass → hand off for</text><text x="564" y="876" font-size="22">review</text><text x="564" y="918" font-size="20">Retain the diff and test</text><text x="564" y="952" font-size="20">records; passing tests still</text><text x="564" y="986" font-size="20">requires the agreed review.</text><text x="36" y="1060" font-size="20">Return to Observe; hand off at a stop condition.</text><text x="36" y="1146" font-size="20">Downward arrows represent one iteration. Failed tests return to</text><text x="36" y="1180" font-size="20">observation; passing tests lead to review. Stop conditions,</text><text x="36" y="1214" font-size="20">permissions and resource budgets constrain every iteration.</text></g></svg>
