<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 718" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜銀行申請表——互動示範</title><desc id="desc">教學模擬。先檢查，再修改文件類型；檢查結果只屬於當時快照。</desc><rect width="1060" height="718" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 1｜銀行申請表——互動示範</text><rect x="36" y="96" width="478" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">申請編號</text><text x="56" y="176" font-size="20" font-weight="400">A001</text><rect x="546" y="96" width="478" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="566" y="132" font-size="20" font-weight="700">申請人代號</text><text x="566" y="176" font-size="20" font-weight="400">C123</text><rect x="36" y="252" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="288" font-size="20" font-weight="700">文件類型</text><text x="56" y="332" font-size="20" font-weight="400">收入證明</text><text x="56" y="424" font-size="20" font-weight="400">檢查資料    重設（靜態示意）</text><rect x="36" y="484" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="520" font-size="20" font-weight="700">初始狀態</text><text x="56" y="564" font-size="20" font-weight="400">目前資料尚未檢查，請按「檢查資料」。</text><text x="36" y="658" font-size="20" font-weight="400">教學模擬。先檢查，再修改文件類型；檢查結果只屬於當時快照。</text></g></svg>
