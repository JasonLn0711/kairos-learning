<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 966" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜需求到可查核證據的追溯鏈</title><desc id="desc">箭頭表示相鄰層次需要有可查核的連結；畫出這條鏈不代表測試已執行或已通過。</desc><rect width="1040" height="966" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 3｜需求到可查核證據的追溯鏈</text><text x="36" y="98" font-size="22" font-weight="650">需求（Requirement）</text><text x="36" y="142" font-size="20" font-weight="400">定義工作承諾與禁止結果。</text><path d="M520 202v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><text x="36" y="272" font-size="22" font-weight="650">驗收情境（Acceptance Scenario）</text><text x="36" y="316" font-size="20" font-weight="400">以具體條件、動作與結果表達需求。</text><path d="M520 376v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><text x="36" y="446" font-size="22" font-weight="650">測試案例（Test Case）</text><text x="36" y="490" font-size="20" font-weight="400">指定如何操作與比較實際結果。</text><path d="M520 550v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><text x="36" y="620" font-size="22" font-weight="650">執行結果（Test Result）</text><text x="36" y="664" font-size="20" font-weight="400">記錄本次實際觀察到的結果。</text><path d="M520 724v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><text x="36" y="794" font-size="22" font-weight="650">可查核證據（Evidence）</text><text x="36" y="838" font-size="20" font-weight="400">保存測試版本、命令與結果，供他人重查。</text><text x="36" y="906" font-size="20" font-weight="400">箭頭表示相鄰層次需要有可查核的連結；畫出這條鏈不代表測試已執行或已通過。</text></g></svg>
