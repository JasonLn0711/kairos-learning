<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 612" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜完整流程與不完整流程</title><desc id="desc">兩組是比較，不是先後階段；箭頭只表示各組內的步驟。</desc><rect width="1040" height="612" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 2｜完整流程與不完整流程</text><rect x="36" y="76" width="968" height="166" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="104" font-size="22" font-weight="650">有價值的第一版</text><text x="60" y="148" font-size="20" font-weight="400">輸入訂單 → 檢查庫存 → 確認訂單 → 產生結果</text><text x="60" y="192" font-size="20" font-weight="400">缺貨時必須有明確回應，不能假裝訂購成功</text><rect x="36" y="300" width="968" height="166" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="328" font-size="22" font-weight="650">不完整的第一版</text><text x="60" y="372" font-size="20" font-weight="400">精美首頁 → 選擇商品 → 按下購買</text><text x="60" y="416" font-size="20" font-weight="400">沒有確認庫存，也沒有可信的訂單結果</text><text x="36" y="552" font-size="20" font-weight="400">兩組是比較，不是先後階段；箭頭只表示各組內的步驟。</text></g></svg>
