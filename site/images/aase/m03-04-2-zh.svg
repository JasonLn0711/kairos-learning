<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 952" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜最小但完整的文件處理流程</title><desc id="desc">依序輸入、檢查、修正重查、預覽與匯出；缺漏時不能完整匯出，修改後舊結果失效。</desc><rect width="1040" height="952" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 2｜最小但完整的文件處理流程</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="104" font-size="22" font-weight="650">1. 輸入資料</text><text x="94" y="148" font-size="20" font-weight="400">使用者輸入三個欄位</text><path d="M4 3h10l6 6v12H4V3Zm10 0v6h6M1 13h10m-4-4 4 4-4 4" transform="translate(54 86)" fill="none" stroke="#18252c" stroke-width="1.6"/><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="238" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="266" font-size="22" font-weight="650">2. 檢查資料</text><text x="94" y="310" font-size="20" font-weight="400">系統判斷必要欄位是否缺漏</text><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm5 12 6 6M7 10l2 2 4-5" transform="translate(54 248)" fill="none" stroke="#18252c" stroke-width="1.6"/><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="400" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="428" font-size="22" font-weight="650">3. 提示並修正</text><text x="94" y="472" font-size="20" font-weight="400">缺漏時不能完整匯出，補齊後重新檢查</text><path d="m3 17-1 5 5-1L21 7l-5-5L3 17Zm10-12 5 5" transform="translate(54 410)" fill="none" stroke="#18252c" stroke-width="1.6"/><path d="M520 532v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="562" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="590" font-size="22" font-weight="650">4. 預覽結果</text><text x="94" y="634" font-size="20" font-weight="400">確認報告反映目前輸入的資料</text><path d="M4 3h10l6 6v12H4V3Zm10 0v6h6M8 14l3 3 5-6" transform="translate(54 572)" fill="none" stroke="#18252c" stroke-width="1.6"/><path d="M520 694v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="724" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="752" font-size="22" font-weight="650">5. 匯出報告</text><text x="94" y="796" font-size="20" font-weight="400">只有符合條件時才能匯出完整報告</text><path d="M12 2v14m-5-5 5 5 5-5M4 17v5h16v-5" transform="translate(54 734)" fill="none" stroke="#18252c" stroke-width="1.6"/><text x="36" y="892" font-size="20" font-weight="400">依序輸入、檢查、修正重查、預覽與匯出；缺漏時不能完整匯出，修改後舊結果失效。</text></g></svg>
