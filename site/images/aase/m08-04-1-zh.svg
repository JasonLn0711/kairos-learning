<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 338" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜模擬輸入、重新執行、檢查結果</title><desc id="desc">箭頭表示測試動作的順序。每次修改輸入，都要確認新操作造成的結果，避免沿用上一次的狀態。</desc><rect width="1060" height="338" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 1｜模擬輸入、重新執行、檢查結果</text><rect x="36" y="98" width="300" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="134" font-size="20" font-weight="700">模擬輸入</text><text x="56" y="178" font-size="20" font-weight="400">填寫欄位</text><rect x="380" y="98" width="300" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="400" y="134" font-size="20" font-weight="700">重新執行</text><text x="400" y="178" font-size="20" font-weight="400">run()</text><rect x="724" y="98" width="300" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="744" y="134" font-size="20" font-weight="700">檢查結果</text><text x="744" y="178" font-size="20" font-weight="400">assert</text><path d="M348 158h24m-7-7 7 7-7 7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M692 158h24m-7-7 7 7-7 7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="278" font-size="20" font-weight="400">箭頭表示測試動作的順序。每次修改輸入，都要確認新操作造成的結果，避免沿用上一次的狀態。</text></g></svg>
