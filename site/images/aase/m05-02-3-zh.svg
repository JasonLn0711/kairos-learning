<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 526" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜把「很快」寫成可以量測的條件</title><desc id="desc">上下兩段比較需求的具體程度；50 人、95% 與 2 秒均為示範，必須經情境、負載、成本與利害關係人確認。</desc><rect width="1040" height="526" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="40" font-size="20" font-weight="700">圖 3｜把「很快」寫成可以量測的條件</text><rect x="32" y="92" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="128" font-size="20" font-weight="700">模糊需求</text><text x="52" y="172" font-size="20" font-weight="400">「商品搜尋要很快。」</text><rect x="32" y="238" width="976" height="164" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="274" font-size="20" font-weight="700">可驗證需求的寫法（示範數值，尚非正式門檻）</text><text x="52" y="318" font-size="20" font-weight="400">「在指定測試設備、固定資料集與 50 位模擬同時使用者的條件下，從伺服器收到搜尋請求到回</text><text x="52" y="354" font-size="20" font-weight="400">傳完整結果，95% 的請求應在 2 秒內完成。」</text><text x="32" y="432" font-size="20" font-weight="400">上下兩段比較需求的具體程度；50 人、95% 與 2 秒均為示範，必須經情境、負載、成本與利害</text><text x="32" y="468" font-size="20" font-weight="400">關係人確認。</text></g></svg>
