<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 764" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5 | Project Handover Memory</title><desc id="desc">The four fields describe one state record, not execution order. Passing specified tests supports only their scope.</desc><rect width="1040" height="764" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 5 | Project Handover Memory</text><rect x="36.0" y="72" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="100" font-size="22">Completed</text><text x="52.0" y="144" font-size="20">Add-subject feature; specified tests passed.</text><rect x="36.0" y="212" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="240" font-size="22">Pending</text><text x="52.0" y="284" font-size="20">Fix the weekend scheduling limit.</text><rect x="36.0" y="352" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="380" font-size="22">Unresolved</text><text x="52.0" y="424" font-size="20">Are public holidays weekdays or weekends?</text><rect x="36.0" y="492" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="520" font-size="22">Sources</text><text x="52.0" y="564" font-size="20">Requirements v3 and the latest test records.</text><text x="36" y="668" font-size="20">The four fields describe one state record, not execution order.</text><text x="36" y="704" font-size="20">Passing specified tests supports only their scope.</text></g></svg>
