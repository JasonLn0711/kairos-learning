<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 626" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜同一個訂單後端內的四項分工</title><desc id="desc">外框代表同一個 API 應用，四個元件平行呈現，沒有順序箭頭。這些只是 Component 示例，不要求四個獨立服務或四個檔案。</desc><rect width="1060" height="626" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 5｜同一個訂單後端內的四項分工</text><rect x="36" y="96" width="988" height="394" rx="14" fill="#fbfcfd" stroke="#7295bf" stroke-dasharray="5 5"/><text x="56" y="132" font-size="20" font-weight="700">訂單後端 API（同一個應用程式）</text><rect x="56" y="182" width="460" height="134" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="76" y="218" font-size="20" font-weight="700">訂單驗證</text><text x="76" y="262" font-size="20" font-weight="400">檢查品項、數量與輸入格式</text><rect x="544" y="182" width="460" height="134" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="564" y="218" font-size="20" font-weight="700">價格計算</text><text x="564" y="262" font-size="20" font-weight="400">計算總價、折扣與稅額</text><rect x="56" y="336" width="460" height="134" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="76" y="372" font-size="20" font-weight="700">支付協調</text><text x="76" y="416" font-size="20" font-weight="400">向支付平台建立交易</text><rect x="544" y="336" width="460" height="134" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="564" y="372" font-size="20" font-weight="700">資料存取</text><text x="564" y="416" font-size="20" font-weight="400">讀取或保存訂單</text><text x="36" y="530" font-size="20" font-weight="400">外框代表同一個 API 應用，四個元件平行呈現，沒有順序箭頭。這些只是 Component 示例，不</text><text x="36" y="566" font-size="20" font-weight="400">要求四個獨立服務或四個檔案。</text></g></svg>
