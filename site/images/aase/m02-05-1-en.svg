<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1518" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Agent Harness: six parallel aspects and the LLM</title><desc id="desc">Conceptual architecture: the six aspects cooperate. They are neither six independent programs nor six sequential stages.</desc><rect width="1040" height="1518" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 1 | Agent Harness: six parallel aspects and the LLM</text><rect x="100" y="104" width="840" height="140" rx="10" fill="#edf2f7" stroke="#b8c9d0"/><text x="120" y="140" font-size="22">USER REQUEST</text><text x="120" y="188" font-size="20">User: “Fix my study-planner system.”</text><path d="M520 252v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="292" width="968" height="882" rx="12" fill="#fff9f2" stroke="#ba7950" stroke-width="2"/><text x="68" y="328" font-size="24">Agent Harness</text><text x="68" y="376" font-size="20">Work support system</text><rect x="68" y="428" width="444" height="176" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="88" y="464" font-size="22">Context</text><text x="88" y="512" font-size="20">Provide the right</text><text x="88" y="548" font-size="20">information</text><rect x="528" y="428" width="444" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="548" y="464" font-size="22">Tools</text><text x="548" y="512" font-size="20">Provide tools for the work</text><rect x="68" y="622" width="444" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="88" y="658" font-size="22">Orchestration</text><text x="88" y="706" font-size="20">Manage the task flow</text><rect x="528" y="622" width="444" height="176" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="548" y="658" font-size="22">Execution</text><text x="548" y="706" font-size="20">Provide the execution</text><text x="548" y="742" font-size="20">environment</text><rect x="68" y="816" width="444" height="176" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="88" y="852" font-size="22">Security</text><text x="88" y="900" font-size="20">Control the scope of</text><text x="88" y="936" font-size="20">permissions</text><rect x="528" y="816" width="444" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="548" y="852" font-size="22">Observability</text><text x="548" y="900" font-size="20">Record and verify results</text><rect x="68" y="1010" width="904" height="140" rx="10" fill="#e9edf6" stroke="#b8c9d0"/><text x="88" y="1046" font-size="22">LLM (the brain)</text><text x="88" y="1094" font-size="20">Understand, reason, generate responses or tool requests</text><path d="M520 1182v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="100" y="1222" width="840" height="140" rx="10" fill="#e8f4ef" stroke="#b8c9d0"/><text x="120" y="1258" font-size="22">Checkable, deliverable work</text><text x="120" y="1306" font-size="20">Code changes + test results + operation records</text><text x="36" y="1410" font-size="20">Conceptual architecture: the six aspects cooperate. They are</text><text x="36" y="1446" font-size="20">neither six independent programs nor six sequential stages.</text></g></svg>
