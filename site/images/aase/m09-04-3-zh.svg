<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 966" role="img" aria-labelledby="title desc"><title id="title">圖 3｜AASE 的五層責任鏈</title><desc id="desc">五列呈現工程責任的不同層次，沒有通過或因果箭頭。實作技術可以替換，每次仍需檢查其他層受影響的承諾。</desc><rect width="1060" height="966" fill="#fbfcfc"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="48" y="40" font-size="20" font-weight="700">圖 3｜AASE 的五層責任鏈</text><rect x="24" y="96" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="132" font-size="20" font-weight="700">問題與需求</text><text x="48" y="176" font-size="20" font-weight="400">到底要解決什麼？</text><rect x="24" y="248" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="284" font-size="20" font-weight="700">設計與規格</text><text x="48" y="328" font-size="20" font-weight="400">應該怎麼運作？</text><rect x="24" y="400" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="436" font-size="20" font-weight="700">系統實作</text><text x="48" y="480" font-size="20" font-weight="400">用什麼技術做出來？</text><rect x="24" y="552" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="588" font-size="20" font-weight="700">測試驗收</text><text x="48" y="632" font-size="20" font-weight="400">如何證明真的能用？</text><rect x="24" y="704" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="740" font-size="20" font-weight="700">交付與改善</text><text x="48" y="784" font-size="20" font-weight="400">如何持續可靠地運作？</text><text x="48" y="874" font-size="20" font-weight="400">五列呈現工程責任的不同層次，沒有通過或因果箭頭。實作技術可以替換，每次仍需檢查其他層</text><text x="48" y="910" font-size="20" font-weight="400">受影響的承諾。</text></g></svg>
