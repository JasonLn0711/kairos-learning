<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 566" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | The same transfer function with different quality</title><desc id="desc">These banks are a synthetic comparison. Parallel cards compare quality, without implying time or causality. Preventing duplicate debits also requires specific functions and rules.</desc><rect width="1040" height="566" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="40" font-size="20" font-weight="700">Figure 2 | The same transfer function with different quality</text><rect x="32" y="92" width="476" height="308" rx="14" fill="#ffffff" stroke="#647681"/><text x="52" y="128" font-size="20" font-weight="700">Bank A</text><text x="52" y="172" font-size="20" font-weight="400">The function exists, but</text><text x="52" y="208" font-size="20" font-weight="400">quality is poor.</text><text x="52" y="244" font-size="20" font-weight="400">Transfers often take a long</text><text x="52" y="280" font-size="20" font-weight="400">time, the service occasionally</text><text x="52" y="316" font-size="20" font-weight="400">crashes, and error messages are</text><text x="52" y="352" font-size="20" font-weight="400">unclear.</text><rect x="532" y="92" width="476" height="308" rx="14" fill="#ffffff" stroke="#647681"/><text x="552" y="128" font-size="20" font-weight="700">Bank B</text><text x="552" y="172" font-size="20" font-weight="400">Both functionality and quality</text><text x="552" y="208" font-size="20" font-weight="400">have been designed.</text><text x="552" y="244" font-size="20" font-weight="400">Response times are predictable,</text><text x="552" y="280" font-size="20" font-weight="400">failure states are clear, and</text><text x="552" y="316" font-size="20" font-weight="400">duplicate debits can be</text><text x="552" y="352" font-size="20" font-weight="400">prevented.</text><text x="32" y="436" font-size="20" font-weight="400">These banks are a synthetic comparison. Parallel cards compare quality</text><text x="32" y="472" font-size="20" font-weight="400">, without implying time or causality. Preventing duplicate debits also</text><text x="32" y="508" font-size="20" font-weight="400">requires specific functions and rules.</text></g></svg>
