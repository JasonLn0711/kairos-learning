<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 724" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜瀏覽器與伺服器如何維持工作階段</title><desc id="desc">兩個角色分工；瀏覽器向伺服器送出 Cookie，伺服器驗證 Session 是否有效。這不是兩個依序執行的狀態。</desc><rect width="1060" height="724" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 3｜瀏覽器與伺服器如何維持工作階段</text><rect x="36" y="96" width="460" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">使用者瀏覽器</text><text x="56" y="176" font-size="20" font-weight="400">保存 Session Cookie</text><rect x="564" y="96" width="460" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="584" y="132" font-size="20" font-weight="700">網站伺服器</text><text x="584" y="176" font-size="20" font-weight="400">保存 Session 紀錄</text><text x="36" y="262" font-size="20" font-weight="400">瀏覽器 → 伺服器：Cookie；伺服器檢查有效性。</text><rect x="36" y="318" width="988" height="274" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="354" font-size="20" font-weight="700">伺服器端概念紀錄（示意）</text><text x="56" y="398" font-size="20" font-weight="400">Session ID → 隨機不可預測的識別值</text><text x="56" y="434" font-size="20" font-weight="400">User → A</text><text x="56" y="470" font-size="20" font-weight="400">Created → 建立時間</text><text x="56" y="506" font-size="20" font-weight="400">Expires → 失效時間</text><text x="56" y="542" font-size="20" font-weight="400">Revoked → 是否已撤銷</text><text x="36" y="628" font-size="20" font-weight="400">兩個角色分工；瀏覽器向伺服器送出 Cookie，伺服器驗證 Session 是否有效。這不是兩個依序</text><text x="36" y="664" font-size="20" font-weight="400">執行的狀態。</text></g></svg>
