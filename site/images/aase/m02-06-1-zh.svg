<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 994" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜從任務要求到成果驗收</title><desc id="desc">主管交代任務：確認週末最多可以安排幾個科目。箭頭是本例步驟順序；授權與記錄持續生效。</desc><rect width="1040" height="994" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 1｜從任務要求到成果驗收</text><text x="36" y="98" font-size="20" font-weight="400">主管交代任務：確認週末最多可以安排幾個科目。箭頭是本例步驟順序；授權與記錄持續生效。</text><path d="M520 144v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="186" width="968" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="214" font-size="22" font-weight="650">1. Tool Calling — 提出申請</text><text x="56" y="258" font-size="20" font-weight="400">員工說：「我要去資料室讀取需求文件。」</text><path d="M520 318v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="348" width="968" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="376" font-size="22" font-weight="650">2. Authorization — 檢查權限</text><text x="56" y="420" font-size="20" font-weight="400">管理員確認：他是否能讀取這份文件？</text><path d="M520 480v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="510" width="968" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="538" font-size="22" font-weight="650">3. Sandbox — 限制活動範圍</text><text x="56" y="582" font-size="20" font-weight="400">只能閱讀指定文件，不能刪檔、修改或上傳資料。</text><path d="M520 642v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="672" width="968" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="700" font-size="22" font-weight="650">4. Observability — 留下紀錄</text><text x="56" y="744" font-size="20" font-weight="400">記錄誰要求讀檔、讀了哪一版、結果成功還是失敗。</text><path d="M520 804v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="834" width="968" height="122" rx="10" fill="#eaf6ef" stroke="#91bca4"/><text x="56" y="862" font-size="22" font-weight="650">5. Verification — 驗收成果</text><text x="56" y="906" font-size="20" font-weight="400">確認讀取的是最新版，且正確解釋了週末規則。</text></g></svg>
