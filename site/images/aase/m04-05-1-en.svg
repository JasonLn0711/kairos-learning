<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 776" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Printing: basic and advanced levels</title><desc id="desc">The cards compare collapsed and expanded states. Functions remain discoverable when needed. Print is a depicted action.</desc><rect width="1040" height="776" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 1 | Printing: basic and advanced levels</text><rect x="36" y="88" width="458" height="404" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="56" y="126" font-size="22" font-weight="700">Basic print screen</text><text x="56" y="170" font-size="20" font-weight="400">Printer: Office Printer</text><text x="56" y="216" font-size="20" font-weight="400">Copies: 1</text><text x="56" y="262" font-size="20" font-weight="400">Paper: A4</text><text x="56" y="308" font-size="20" font-weight="400">Advanced settings ▸</text><rect x="50" y="329" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="62" y="354" font-size="20" font-weight="400">Print</text><text x="56" y="404" font-size="20" font-weight="400">The primary action is easy to</text><text x="56" y="440" font-size="20" font-weight="400">find.</text><rect x="546" y="88" width="458" height="542" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="566" y="126" font-size="22" font-weight="700">Advanced settings expanded</text><text x="566" y="170" font-size="20" font-weight="400">Printer: Office Printer</text><text x="566" y="216" font-size="20" font-weight="400">Copies: 1</text><text x="566" y="262" font-size="20" font-weight="400">Paper: A4</text><text x="566" y="308" font-size="20" font-weight="400">Advanced settings ▾</text><text x="566" y="354" font-size="20" font-weight="400">Double-sided: Off</text><text x="566" y="400" font-size="20" font-weight="400">Scale: 100%</text><text x="566" y="446" font-size="20" font-weight="400">Reverse printing: Off</text><rect x="560" y="467" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="572" y="492" font-size="20" font-weight="400">Print</text><text x="566" y="542" font-size="20" font-weight="400">Specialized functions remain</text><text x="566" y="578" font-size="20" font-weight="400">discoverable.</text><text x="36" y="674" font-size="20" font-weight="400">The cards compare collapsed and expanded states. Functions remain</text><text x="36" y="710" font-size="20" font-weight="400">discoverable when needed. Print is a depicted action.</text></g></svg>
