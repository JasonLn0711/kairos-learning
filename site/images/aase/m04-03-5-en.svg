<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 522" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5 | Change the layout while preserving reading order</title><desc id="desc">Desktop places 2 and 3 side by side; mobile stacks them. Both retain reading order 1→2→3→4. Numbers represent information order, not four actual submissions.</desc><rect width="1040" height="522" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 5 | Change the layout while preserving reading order</text><text x="56" y="98" font-size="22" font-weight="700">Desktop</text><rect x="50" y="120" width="440" height="70" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="62" y="144" font-size="20" font-weight="400">1. Task and instructions</text><rect x="50" y="178" width="212" height="104" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="62" y="202" font-size="20" font-weight="400">2. Data</text><text x="62" y="236" font-size="20" font-weight="400">entry</text><rect x="270" y="178" width="212" height="104" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="282" y="202" font-size="20" font-weight="400">3. Input</text><text x="282" y="236" font-size="20" font-weight="400">guidance</text><rect x="50" y="270" width="440" height="70" rx="12" fill="#e3ecfb" stroke="#bccbd0"/><text x="62" y="294" font-size="20" font-weight="400">4. Check and results</text><text x="556" y="98" font-size="22" font-weight="700">Mobile</text><rect x="550" y="120" width="440" height="70" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="562" y="144" font-size="20" font-weight="400">1. Task and instructions</text><rect x="550" y="178" width="440" height="70" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="562" y="202" font-size="20" font-weight="400">2. Data entry</text><rect x="550" y="236" width="440" height="70" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="562" y="260" font-size="20" font-weight="400">3. Input guidance</text><rect x="550" y="294" width="440" height="70" rx="12" fill="#e3ecfb" stroke="#bccbd0"/><text x="562" y="318" font-size="20" font-weight="400">4. Check and results</text><text x="36" y="400" font-size="20" font-weight="400">Desktop places 2 and 3 side by side; mobile stacks them. Both retain</text><text x="36" y="434" font-size="20" font-weight="400">reading order 1→2→3→4. Numbers represent information order, not four</text><text x="36" y="468" font-size="20" font-weight="400">actual submissions.</text></g></svg>
