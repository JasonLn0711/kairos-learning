<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜三個 Agent 指令與文件分工</title><desc id="desc">箭頭表示建議的工作順序；先審查提案，實作後取得測試證據，再接受與封存。封存後可回到規劃下一次變更。斜線語法依版本與助理核對；四種文件是責任分工，design.md 依需要建立。</desc><rect width="1440" height="620" fill="#f5faf9"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#182f32"><text x="36" y="42" font-size="20" font-weight="700">圖 1｜三個 Agent 指令與文件分工</text><rect x="36" y="100" width="432" height="244" rx="14" fill="#ffffff" stroke="#7da6a9"/><text x="56" y="138" font-size="20" font-weight="700">/opsx:propose</text><text x="56" y="182" font-size="20" font-weight="400">proposal.md｜為什麼改、改什麼</text><text x="56" y="218" font-size="20" font-weight="400">design.md｜技術做法</text><text x="56" y="254" font-size="20" font-weight="400">specs/｜候選規格差異</text><text x="56" y="290" font-size="20" font-weight="400">tasks.md｜工作清單</text><path d="M475 164h22m-7-7 7 7-7 7" fill="none" stroke="#386d72" stroke-width="2"/><rect x="504" y="100" width="432" height="208" rx="14" fill="#ffffff" stroke="#7da6a9"/><text x="524" y="138" font-size="20" font-weight="700">/opsx:apply</text><text x="524" y="182" font-size="20" font-weight="400">人類先審查文件；Agent 依 tasks.</text><text x="524" y="218" font-size="20" font-weight="400">md 實作。</text><text x="524" y="254" font-size="20" font-weight="400">實際執行功能與負向測試，保存結果。</text><path d="M943 164h22m-7-7 7 7-7 7" fill="none" stroke="#386d72" stroke-width="2"/><rect x="972" y="100" width="432" height="316" rx="14" fill="#ffffff" stroke="#7da6a9"/><text x="992" y="138" font-size="20" font-weight="700">/opsx:archive</text><text x="992" y="182" font-size="20" font-weight="400">已接受的候選差異 →</text><text x="992" y="218" font-size="20" font-weight="400">openspec/specs/ 現行規格</text><text x="992" y="254" font-size="20" font-weight="400">ADDED 新增／MODIFIED 修改／</text><text x="992" y="290" font-size="20" font-weight="400">REMOVED 移除</text><text x="992" y="326" font-size="20" font-weight="400">保留提案歷史；封存不證明測試或部署</text><text x="992" y="362" font-size="20" font-weight="400">成功。</text><text x="36" y="464" font-size="20" font-weight="400">↶ 下一次變更：回到規劃與釐清問題</text><text x="36" y="524" font-size="20" font-weight="400">箭頭表示建議的工作順序；先審查提案，實作後取得測試證據，再接受與封存。封存後可回到規劃下一次變更。斜線語法依版本與助理核對；</text><text x="36" y="560" font-size="20" font-weight="400">四種文件是責任分工，design.md 依需要建立。</text></g></svg>
