<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1168" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Review each connection after TLS termination</title><desc id="desc">Arrows indicate data transmission in this hypothetical architecture, not a verified production deployment.</desc><rect width="1060" height="1168" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 2 | Review each connection after TLS termination</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Customer browser</text><text x="56" y="176" font-size="20" font-weight="400">Initiates the website connection.</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="298" font-size="20" font-weight="400">① HTTPS / TLS encryption</text><rect x="36" y="354" width="988" height="166" rx="14" fill="#f1faf5" stroke="#64748b"/><text x="56" y="390" font-size="20" font-weight="700">Reverse proxy</text><text x="56" y="434" font-size="20" font-weight="400">For example Nginx or a load balancer. TLS terminates and data is</text><text x="56" y="470" font-size="20" font-weight="400">decrypted here.</text><path d="M530 528v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="592" font-size="20" font-weight="400">② Separate connection: protection must be confirmed</text><rect x="36" y="648" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="684" font-size="20" font-weight="700">Backend application</text><text x="56" y="728" font-size="20" font-weight="400">Handles members, orders and payments.</text><path d="M530 786v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="850" font-size="20" font-weight="400">③ Separate database connection</text><rect x="36" y="906" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="942" font-size="20" font-weight="700">Database</text><text x="56" y="986" font-size="20" font-weight="400">Verify this connection’s protection and access controls independently</text><text x="36" y="1072" font-size="20" font-weight="400">Arrows indicate data transmission in this hypothetical architecture,</text><text x="36" y="1108" font-size="20" font-weight="400">not a verified production deployment.</text></g></svg>
