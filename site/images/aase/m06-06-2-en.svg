<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1012" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Review each connection after TLS termination</title><desc id="desc">Arrows indicate data transmission in this hypothetical architecture, not a verified production deployment.</desc><rect width="1060" height="1012" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 2 | Review each connection after TLS termination</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Customer browser</text><text x="56" y="176" font-size="20" font-weight="400">① HTTPS / TLS encryption → reverse proxy</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="278" width="988" height="202" rx="14" fill="#f1faf5" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">Reverse proxy</text><text x="56" y="358" font-size="20" font-weight="400">For example Nginx or a load balancer. TLS terminates and data is</text><text x="56" y="394" font-size="20" font-weight="400">decrypted here. ② Separate connection: protection must be confirmed →</text><text x="56" y="430" font-size="20" font-weight="400">backend</text><path d="M530 488v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="532" width="988" height="166" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="568" font-size="20" font-weight="700">Backend application</text><text x="56" y="612" font-size="20" font-weight="400">Handles members, orders and payments. ③ Separate database connection</text><text x="56" y="648" font-size="20" font-weight="400">→ database</text><path d="M530 706v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="750" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="786" font-size="20" font-weight="700">Database</text><text x="56" y="830" font-size="20" font-weight="400">Verify this connection’s protection and access controls independently</text><text x="36" y="916" font-size="20" font-weight="400">Arrows indicate data transmission in this hypothetical architecture,</text><text x="36" y="952" font-size="20" font-weight="400">not a verified production deployment.</text></g></svg>
