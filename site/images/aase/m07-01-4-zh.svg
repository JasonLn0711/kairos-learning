<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1126" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜依作業系統建立與啟用環境</title><desc id="desc">選擇符合自己系統的一欄；兩欄是替代操作路徑，並非先後步驟。確認 Python 3.11／3.12，再核對執行檔位置。</desc><rect width="1060" height="1126" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 4｜依作業系統建立與啟用環境</text><rect x="36" y="96" width="988" height="526" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="132" font-size="20" font-weight="700">Linux / macOS</text><text x="56" y="176" font-size="20" font-weight="400" font-family="monospace"># 在工作坊根目錄執行</text><text x="56" y="212" font-size="20" font-weight="400" font-family="monospace">python3 --version</text><text x="56" y="248" font-size="20" font-weight="400" font-family="monospace"></text><text x="56" y="284" font-size="20" font-weight="400" font-family="monospace"># 確認為 Python 3.11 或 3.12 後建立環境</text><text x="56" y="320" font-size="20" font-weight="400" font-family="monospace">python3 -m venv .venv</text><text x="56" y="356" font-size="20" font-weight="400" font-family="monospace"></text><text x="56" y="392" font-size="20" font-weight="400" font-family="monospace"># 啟用虛擬環境</text><text x="56" y="428" font-size="20" font-weight="400" font-family="monospace">source .venv/bin/activate</text><text x="56" y="464" font-size="20" font-weight="400" font-family="monospace"></text><text x="56" y="500" font-size="20" font-weight="400" font-family="monospace"># 查看目前 Python</text><text x="56" y="536" font-size="20" font-weight="400" font-family="monospace">python --version</text><text x="56" y="572" font-size="20" font-weight="400" font-family="monospace">python -c &quot;import sys; print(sys.executable)&quot;</text><rect x="36" y="646" width="988" height="346" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="682" font-size="20" font-weight="700">Windows PowerShell</text><text x="56" y="726" font-size="20" font-weight="400" font-family="monospace">Get-Location</text><text x="56" y="762" font-size="20" font-weight="400" font-family="monospace">Get-ChildItem</text><text x="56" y="798" font-size="20" font-weight="400" font-family="monospace">py -3.12 --version</text><text x="56" y="834" font-size="20" font-weight="400" font-family="monospace">py -3.12 -m venv .venv</text><text x="56" y="870" font-size="20" font-weight="400" font-family="monospace">.\.venv\Scripts\Activate.ps1</text><text x="56" y="906" font-size="20" font-weight="400" font-family="monospace">python --version</text><text x="56" y="942" font-size="20" font-weight="400" font-family="monospace">python -c &quot;import sys; print(sys.executable)&quot;</text><text x="36" y="1034" font-size="20" font-weight="400">選擇符合自己系統的一欄；兩欄是替代操作路徑，並非先後步驟。確認 Python 3.11／3.12，再</text><text x="36" y="1070" font-size="20" font-weight="400">核對執行檔位置。</text></g></svg>
