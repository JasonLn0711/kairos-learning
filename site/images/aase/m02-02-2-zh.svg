<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 730" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜一次 AI 工作可能需要的上下文</title><desc id="desc">實際組合、資訊選取方式及容量計算依模型與 AI 服務而不同；這五項是組成示意，不是所有產品固定的封裝格式。</desc><rect width="1040" height="730" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 2｜一次 AI 工作可能需要的上下文</text><text x="56" y="98" font-size="22">系統規則與工具說明</text><text x="56" y="140" font-size="20">任務邊界及可使用工具的資訊。</text><text x="56" y="202" font-size="22">你現在提出的要求</text><text x="56" y="244" font-size="20">這次要完成的工作。</text><text x="56" y="306" font-size="22">部分歷史對話與摘要</text><text x="56" y="348" font-size="20">被選入這次呼叫的歷史片段。</text><text x="56" y="410" font-size="22">程式碼、文件與查詢結果</text><text x="56" y="452" font-size="20">實際取得且與本次工作相關的資料。</text><text x="56" y="514" font-size="22">模型正在產生的回答</text><text x="56" y="556" font-size="20">依服務規則安排生成空間。</text><text x="36" y="638" font-size="20">實際組合、資訊選取方式及容量計算依模型與 AI 服務而不同；這五項是組成示意，不是所有產</text><text x="36" y="672" font-size="20">品固定的封裝格式。</text></g></svg>
