<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 730" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜一次 AI 工作可能包含的資料</title><desc id="desc">模型根據當次取得的資訊產生回答。五列是組成示意，並非五個先後步驟；預留回答表示容量規劃，實際封裝與容量規則依服務而異。</desc><rect width="1040" height="730" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 2｜一次 AI 工作可能包含的資料</text><text x="56" y="98" font-size="22">系統規則</text><text x="56" y="140" font-size="20">AI 必須遵守的工作要求</text><text x="56" y="202" font-size="22">你現在的問題</text><text x="56" y="244" font-size="20">例如：修改網站的按鈕顏色</text><text x="56" y="306" font-size="22">歷史對話或摘要</text><text x="56" y="348" font-size="20">之前討論過的設計與決策</text><text x="56" y="410" font-size="22">外部資料及工具回傳</text><text x="56" y="452" font-size="20">程式碼、文件、Git 內容、測試輸出</text><text x="56" y="514" font-size="22">預留回答空間</text><text x="56" y="556" font-size="20">留給模型接下來產生的內容</text><text x="36" y="638" font-size="20">模型根據當次取得的資訊產生回答。五列是組成示意，並非五個先後步驟；預留回答表示容量規劃</text><text x="36" y="672" font-size="20">，實際封裝與容量規則依服務而異。</text></g></svg>
