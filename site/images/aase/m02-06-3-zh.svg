<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 766" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜M02 六課的問題與分工</title><desc id="desc">六列是課程概念對照，不表示每個系統一定依這六步執行。</desc><rect width="1040" height="766" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 3｜M02 六課的問題與分工</text><rect x="36" y="70" width="968" height="78" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">M02-01</text><text x="186" y="98" font-size="20" font-weight="400">模型如何理解和產生文字？｜Token、Transformer、Attention</text><rect x="36" y="158" width="968" height="78" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="186" font-size="22" font-weight="650">M02-02</text><text x="186" y="186" font-size="20" font-weight="400">這次模型看得到哪些資訊？｜Context Window</text><rect x="36" y="246" width="968" height="114" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="274" font-size="22" font-weight="650">M02-03</text><text x="186" y="274" font-size="20" font-weight="400">長任務中的資訊如何重用、縮短、尋找與保留？｜KV Cache、Compaction、</text><text x="186" y="310" font-size="20" font-weight="400">RAG、Memory</text><rect x="36" y="370" width="968" height="78" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="398" font-size="22" font-weight="650">M02-04</text><text x="186" y="398" font-size="20" font-weight="400">誰決定下一步？｜Chatbot、Workflow、Agent</text><rect x="36" y="458" width="968" height="78" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="486" font-size="22" font-weight="650">M02-05</text><text x="186" y="486" font-size="20" font-weight="400">模型周圍有哪些支援機制？｜Agent Harness</text><rect x="36" y="546" width="968" height="114" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="574" font-size="22" font-weight="650">M02-06</text><text x="186" y="574" font-size="20" font-weight="400">工具操作有沒有授權、執行和證據？｜Tool Calling、Sandbox、</text><text x="186" y="610" font-size="20" font-weight="400">Observability</text><text x="36" y="706" font-size="20" font-weight="400">六列是課程概念對照，不表示每個系統一定依這六步執行。</text></g></svg>
