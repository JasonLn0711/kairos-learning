<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 374" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Input, rerun and inspect</title><desc id="desc">Arrows show the order of test actions. After each input change, inspect the new result instead of reusing the previous state.</desc><rect width="1060" height="374" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 1 | Input, rerun and inspect</text><rect x="36" y="98" width="300" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="134" font-size="20" font-weight="700">Simulate input</text><text x="56" y="178" font-size="20" font-weight="400">Fill the fields</text><rect x="380" y="98" width="300" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="400" y="134" font-size="20" font-weight="700">Rerun</text><text x="400" y="178" font-size="20" font-weight="400">run()</text><rect x="724" y="98" width="300" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="744" y="134" font-size="20" font-weight="700">Inspect results</text><text x="744" y="178" font-size="20" font-weight="400">assert</text><path d="M348 158h24m-7-7 7 7-7 7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M692 158h24m-7-7 7 7-7 7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="278" font-size="20" font-weight="400">Arrows show the order of test actions. After each input change, inspect the</text><text x="36" y="314" font-size="20" font-weight="400">new result instead of reusing the previous state.</text></g></svg>
