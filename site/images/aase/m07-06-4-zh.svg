<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1062" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜五步審查流程</title><desc id="desc">數字與連線表示建議審查順序；每一步都要依本次任務範圍實際執行。</desc><rect width="1060" height="1062" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 4｜五步審查流程</text><rect x="36" y="96" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="132" font-size="20" font-weight="700">核對規格</text><text x="56" y="174" font-size="20" font-weight="400">確認功能、驗收條件與不允許修改的範圍。</text><path d="M530 232V264m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="282" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="318" font-size="20" font-weight="700">檢查檔案變更</text><text x="56" y="360" font-size="20" font-weight="400">查看工作區、暫存區、未追蹤檔案，必要時檢查 Agent 已建立的提交。</text><path d="M530 418V450m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="468" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="504" font-size="20" font-weight="700">檢查工具紀錄</text><text x="56" y="546" font-size="20" font-weight="400">確認命令、目錄、退出碼、輸出與未執行事項。</text><path d="M530 604V636m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="654" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="690" font-size="20" font-weight="700">獨立驗證行為</text><text x="56" y="732" font-size="20" font-weight="400">執行直接對應需求的正常、錯誤與邊界測試，必要時人工操作。</text><path d="M530 790V822m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="840" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="876" font-size="20" font-weight="700">留下決策紀錄</text><text x="56" y="918" font-size="20" font-weight="400">寫下接受、要求修正或延後的理由及未解風險。</text><text x="36" y="1002" font-size="20" font-weight="400">數字與連線表示建議審查順序；每一步都要依本次任務範圍實際執行。</text></g></svg>
