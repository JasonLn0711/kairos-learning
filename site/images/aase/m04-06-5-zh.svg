<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 952" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜有分支的復原路徑</title><desc id="desc">箭頭表示概念狀態轉換；結果判斷後依條件分流，不把失敗當成成功前的必經步驟。修改既有輸入時，舊結果必須重新驗證。</desc><rect width="1060" height="952" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 5｜有分支的復原路徑</text><rect x="244" y="96" width="552" height="130" rx="14" fill="#e9edf4" stroke="#64748b"/><text x="264" y="132" font-size="20" font-weight="700">輸入資料</text><text x="264" y="176" font-size="20" font-weight="400">使用者填寫必要欄位</text><path d="M520 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="244" y="278" width="552" height="130" rx="14" fill="#e9edf4" stroke="#64748b"/><text x="264" y="314" font-size="20" font-weight="700">處理中</text><text x="264" y="358" font-size="20" font-weight="400">檢查、驗證、計算</text><path d="M520 416v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="244" y="460" width="552" height="130" rx="14" fill="#fff2cc" stroke="#64748b"/><text x="264" y="496" font-size="20" font-weight="700">結果判斷</text><text x="264" y="540" font-size="20" font-weight="400">成功、缺漏或技術失敗</text><path d="M520 598v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M270 642v-16h500v16" fill="none" stroke="#59666e" stroke-width="2"/><rect x="28" y="642" width="484" height="166" rx="14" fill="#fce7e7" stroke="#64748b"/><text x="48" y="678" font-size="20" font-weight="700">缺漏或技術失敗 → 需修正／重試</text><text x="48" y="722" font-size="20" font-weight="400">保留資料，提供出口；修正後回到輸入／重新</text><text x="48" y="758" font-size="20" font-weight="400">檢查。</text><rect x="548" y="642" width="484" height="166" rx="14" fill="#e2f2e8" stroke="#64748b"/><text x="568" y="678" font-size="20" font-weight="700">成功 → 完成</text><text x="568" y="722" font-size="20" font-weight="400">有效結果與下一步；修改輸入後使舊結果失效</text><text x="568" y="758" font-size="20" font-weight="400">。</text><text x="36" y="856" font-size="20" font-weight="400">箭頭表示概念狀態轉換；結果判斷後依條件分流，不把失敗當成成功前的必經步驟。修改既有輸入時</text><text x="36" y="892" font-size="20" font-weight="400">，舊結果必須重新驗證。</text></g></svg>
