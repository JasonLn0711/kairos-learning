<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 994" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜文件檢核的四種狀態</title><desc id="desc">四張卡是不同情境，並非每次操作必然經過的四個步驟。缺漏時補填；系統故障另提示安全重試；完成只代表本次資料檢核。</desc><rect width="1040" height="994" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 5｜文件檢核的四種狀態</text><rect x="36" y="88" width="458" height="368" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="56" y="126" font-size="22" font-weight="700">狀態一：輸入</text><text x="56" y="170" font-size="20" font-weight="400">等待使用者填寫資料</text><text x="56" y="216" font-size="20" font-weight="400">案件編號：A001</text><text x="56" y="262" font-size="20" font-weight="400">來源單位：甲部門</text><text x="56" y="308" font-size="20" font-weight="400">文件類型：尚未選擇</text><rect x="50" y="329" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="62" y="354" font-size="20" font-weight="400">［檢查資料］</text><text x="56" y="404" font-size="20" font-weight="400">下一步：填寫並啟動檢查。</text><rect x="546" y="88" width="458" height="368" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="566" y="126" font-size="22" font-weight="700">狀態二：處理中</text><text x="566" y="170" font-size="20" font-weight="400">已收到檢查請求</text><text x="566" y="216" font-size="20" font-weight="400">正在檢查資料…</text><text x="566" y="262" font-size="20" font-weight="400">請勿重複送出。</text><text x="566" y="308" font-size="20" font-weight="400">完成後將顯示檢查結果。</text><rect x="560" y="329" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="572" y="354" font-size="20" font-weight="400">［檢查中，暫不可再送出］</text><text x="566" y="404" font-size="20" font-weight="400">下一步：等待結果；逾時則依提示處理。</text><rect x="36" y="480" width="458" height="368" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="56" y="518" font-size="22" font-weight="700">狀態三：缺漏</text><text x="56" y="562" font-size="20" font-weight="400">已找到可修正的問題</text><text x="56" y="608" font-size="20" font-weight="400">缺少必要資料</text><text x="56" y="654" font-size="20" font-weight="400">「文件類型」尚未填寫。</text><text x="56" y="700" font-size="20" font-weight="400">已保留其他欄位。</text><rect x="50" y="721" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="62" y="746" font-size="20" font-weight="400">［補填並重新檢查］</text><text x="56" y="796" font-size="20" font-weight="400">下一步：只修正缺漏，不必全部重填。</text><rect x="546" y="480" width="458" height="368" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="566" y="518" font-size="22" font-weight="700">狀態四：完成</text><text x="566" y="562" font-size="20" font-weight="400">本次資料檢核已完成</text><text x="566" y="608" font-size="20" font-weight="400">三個必要欄位均已齊全</text><text x="566" y="654" font-size="20" font-weight="400">可以預覽或匯出。</text><text x="566" y="700" font-size="20" font-weight="400">注意：不代表正式受理。</text><rect x="560" y="721" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="572" y="746" font-size="20" font-weight="400">［預覽］［匯出］</text><text x="566" y="796" font-size="20" font-weight="400">下一步：確認內容，再選擇匯出。</text><text x="36" y="892" font-size="20" font-weight="400">四張卡是不同情境，並非每次操作必然經過的四個步驟。缺漏時補填；系統故障另提示安全重試；完成只代</text><text x="36" y="928" font-size="20" font-weight="400">表本次資料檢核。</text></g></svg>
