<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 892" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 6 | Validate First, Then Let AI Explain</title><desc id="desc">Arrows show responsibilities and data flow. A field-completeness check does not establish formal approval.</desc><rect width="1040" height="892" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 6 | Validate First, Then Let AI Explain</text><rect x="36.0" y="70" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="98" font-size="22">Original application data</text><text x="56.0" y="142" font-size="20">SYN-001 / DEMO-A / document type blank</text><path d="M512 201v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="233" width="952.0" height="154" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="261" font-size="22">Program-rule validation</text><text x="56.0" y="305" font-size="20">Check whether application ID, applicant code and document type are</text><text x="56.0" y="339" font-size="20">all filled in.</text><path d="M512 398v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="430" width="952.0" height="120" rx="10" fill="#fff4e9" stroke="#c8a17c"/><text x="56.0" y="458" font-size="22">Validation result: document type missing</text><text x="56.0" y="502" font-size="20">Retain the actual rule-check result.</text><path d="M512 561v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="593" width="952.0" height="154" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="621" font-size="22">AI helps the user understand</text><text x="56.0" y="665" font-size="20">“This cannot currently be marked complete. Please add the document</text><text x="56.0" y="699" font-size="20">type.”</text><text x="36" y="800" font-size="20">Arrows show responsibilities and data flow. A field-completeness</text><text x="36" y="834" font-size="20">check does not establish formal approval.</text></g></svg>
