<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 766" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 6｜資料改變後，兩種結果處理方式</title><desc id="desc">箭頭表示同一案例的資料變更。下方是互斥的錯誤／正確策略對照，不是兩個連續步驟。</desc><rect width="1040" height="766" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 6｜資料改變後，兩種結果處理方式</text><rect x="36" y="88" width="968" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="56" y="126" font-size="22" font-weight="700">原始資料通過</text><text x="56" y="170" font-size="20" font-weight="400">資料 A → 檢核通過 → 產生結果 A</text><path d="M520 232v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="274" width="968" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="56" y="312" font-size="22" font-weight="700">使用者修改資料</text><text x="56" y="356" font-size="20" font-weight="400">資料 B；先前結果仍對應資料 A</text><path d="M520 418v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="460" width="458" height="190" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><rect x="46" y="470" width="438" height="50" rx="12" fill="#fce1e1" stroke="#d4dce1" stroke-width="1"/><text x="56" y="498" font-size="22" font-weight="700">錯誤做法</text><text x="56" y="562" font-size="20" font-weight="400">仍顯示結果 A 已通過，讓人誤以為資料 B</text><text x="56" y="598" font-size="20" font-weight="400">也通過。</text><rect x="546" y="460" width="458" height="190" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><rect x="556" y="470" width="438" height="50" rx="12" fill="#d9efe1" stroke="#d4dce1" stroke-width="1"/><text x="566" y="498" font-size="22" font-weight="700">正確做法</text><text x="566" y="562" font-size="20" font-weight="400">提示資料已變更，舊檢核失效，需要重新檢查</text><text x="566" y="598" font-size="20" font-weight="400">。</text><text x="36" y="700" font-size="20" font-weight="400">箭頭表示同一案例的資料變更。下方是互斥的錯誤／正確策略對照，不是兩個連續步驟。</text></g></svg>
