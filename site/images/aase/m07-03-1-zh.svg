<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 574" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜橫向開發與垂直切片的比較</title><desc id="desc">左邊按層分別完成，右邊按任務穿過所需層次；分層方塊不表示時序。並非每個切片都需要資料庫，本課只需輸入與預覽。</desc><rect width="1060" height="574" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700" fill="#18252c">圖 1｜橫向開發與垂直切片的比較</text><text x="36" y="90" font-size="20" font-weight="700" fill="#18252c">橫向分層開發</text><rect x="36" y="138" width="460" height="80" rx="8" fill="#e2e6e9" stroke="#87949c"/><text x="52" y="170" font-size="20" font-weight="400" fill="#18252c">所有 UI 畫面</text><rect x="36" y="230" width="460" height="80" rx="8" fill="#e2e6e9" stroke="#87949c"/><text x="52" y="262" font-size="20" font-weight="400" fill="#18252c">所有業務邏輯</text><rect x="36" y="322" width="460" height="80" rx="8" fill="#e2e6e9" stroke="#87949c"/><text x="52" y="354" font-size="20" font-weight="400" fill="#18252c">所有資料處理</text><text x="540" y="90" font-size="20" font-weight="700" fill="#18252c">垂直切片開發</text><text x="540" y="146" font-size="20" font-weight="700" fill="#18252c">切片 1</text><rect x="540" y="190" width="150" height="80" rx="8" fill="#b3dfc8" stroke="#87949c"/><text x="556" y="222" font-size="20" font-weight="400" fill="#18252c">UI</text><rect x="540" y="282" width="150" height="80" rx="8" fill="#b3dfc8" stroke="#87949c"/><text x="556" y="314" font-size="20" font-weight="400" fill="#18252c">邏輯</text><rect x="540" y="374" width="150" height="80" rx="8" fill="#b3dfc8" stroke="#87949c"/><text x="556" y="406" font-size="20" font-weight="400" fill="#18252c">資料</text><text x="706" y="146" font-size="20" font-weight="700" fill="#18252c">切片 2</text><rect x="706" y="190" width="150" height="80" rx="8" fill="#d5dbe0" stroke="#87949c"/><text x="722" y="222" font-size="20" font-weight="400" fill="#18252c">UI</text><rect x="706" y="282" width="150" height="80" rx="8" fill="#d5dbe0" stroke="#87949c"/><text x="722" y="314" font-size="20" font-weight="400" fill="#18252c">邏輯</text><rect x="706" y="374" width="150" height="80" rx="8" fill="#d5dbe0" stroke="#87949c"/><text x="722" y="406" font-size="20" font-weight="400" fill="#18252c">資料</text><text x="872" y="146" font-size="20" font-weight="700" fill="#18252c">切片 3</text><rect x="872" y="190" width="150" height="80" rx="8" fill="#d5dbe0" stroke="#87949c"/><text x="888" y="222" font-size="20" font-weight="400" fill="#18252c">UI</text><rect x="872" y="282" width="150" height="80" rx="8" fill="#d5dbe0" stroke="#87949c"/><text x="888" y="314" font-size="20" font-weight="400" fill="#18252c">邏輯</text><rect x="872" y="374" width="150" height="80" rx="8" fill="#d5dbe0" stroke="#87949c"/><text x="888" y="406" font-size="20" font-weight="400" fill="#18252c">資料</text><text x="36" y="482" font-size="20" font-weight="400" fill="#18252c">左邊按層分別完成，右邊按任務穿過所需層次；分層方塊不表示時序。並非每個切片都需要資料庫，</text><text x="36" y="518" font-size="20" font-weight="400" fill="#18252c">本課只需輸入與預覽。</text></g></svg>
