<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜相近功能，兩種資訊安排</title><desc id="desc">A／B 是平行比較，沒有先後箭頭。此為說明性草圖，沒有可操作功能，也尚未經使用者測試。</desc><rect width="1040" height="660" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 3｜相近功能，兩種資訊安排</text><rect x="36" y="72" width="468" height="490" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="98" font-size="20" font-weight="700">安排 A｜所有事情都很重要</text><text x="60" y="148" font-size="22" font-weight="700">管理系統</text><rect x="48" y="174" width="444" height="170" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="60" y="198" font-size="20" font-weight="400">進階設定</text><text x="60" y="232" font-size="20" font-weight="400">下載報告</text><text x="60" y="266" font-size="20" font-weight="400">查看結果</text><text x="60" y="300" font-size="20" font-weight="400">開始檢查</text><text x="60" y="350" font-size="20" font-weight="400">狀態：INVALID</text><text x="60" y="400" font-size="20" font-weight="400">資料、說明、紀錄、診斷、輸出混在一起。</text><text x="60" y="450" font-size="20" font-weight="400">問題：使用者不清楚現在該做哪件事。</text><rect x="536" y="72" width="468" height="490" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="556" y="98" font-size="20" font-weight="700">安排 B｜依照工作任務呈現</text><text x="560" y="148" font-size="22" font-weight="700">申請資料檢查</text><text x="560" y="198" font-size="20" font-weight="400">請確認三項必要資料。</text><text x="560" y="248" font-size="20" font-weight="400">申請編號：A1024</text><text x="560" y="282" font-size="20" font-weight="400">申請人代號：P008</text><text x="560" y="316" font-size="20" font-weight="400">文件類型：未填寫</text><rect x="548" y="342" width="444" height="68" rx="12" fill="#edf0f2" stroke="#a75b4a"/><text x="560" y="366" font-size="20" font-weight="400">尚缺少文件類型</text><rect x="548" y="392" width="444" height="68" rx="12" fill="#e3ecfb" stroke="#bccbd0"/><text x="560" y="416" font-size="20" font-weight="400">補填文件類型</text><text x="560" y="466" font-size="20" font-weight="400">改善方向：錯誤、修正方式與下一個動作有</text><text x="560" y="500" font-size="20" font-weight="400">清楚關聯。</text><text x="36" y="606" font-size="20" font-weight="400">A／B 是平行比較，沒有先後箭頭。此為說明性草圖，沒有可操作功能，也尚未經使用者測試。</text></g></svg>
