<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 734" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5｜Four responsibilities inside one order backend</title><desc id="desc">The boundary represents one API application. Four peer components have no sequence arrows. These are component examples, not a requirement for four separate services or files.</desc><rect width="1060" height="734" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 5｜Four responsibilities inside one order backend</text><rect x="36" y="96" width="988" height="466" rx="14" fill="#fbfcfd" stroke="#7295bf" stroke-dasharray="5 5"/><text x="56" y="132" font-size="20" font-weight="700">Order backend API (one application)</text><rect x="56" y="182" width="460" height="170" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="76" y="218" font-size="20" font-weight="700">Order validation</text><text x="76" y="262" font-size="20" font-weight="400">Checks items, quantities and</text><text x="76" y="298" font-size="20" font-weight="400">input format</text><rect x="544" y="182" width="460" height="170" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="564" y="218" font-size="20" font-weight="700">Pricing</text><text x="564" y="262" font-size="20" font-weight="400">Calculates totals, discounts</text><text x="564" y="298" font-size="20" font-weight="400">and tax</text><rect x="56" y="372" width="460" height="170" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="76" y="408" font-size="20" font-weight="700">Payment coordination</text><text x="76" y="452" font-size="20" font-weight="400">Creates a transaction with the</text><text x="76" y="488" font-size="20" font-weight="400">payment platform</text><rect x="544" y="372" width="460" height="134" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="564" y="408" font-size="20" font-weight="700">Data access</text><text x="564" y="452" font-size="20" font-weight="400">Reads or saves orders</text><text x="36" y="602" font-size="20" font-weight="400">The boundary represents one API application. Four peer components have</text><text x="36" y="638" font-size="20" font-weight="400">no sequence arrows. These are component examples, not a requirement for</text><text x="36" y="674" font-size="20" font-weight="400">four separate services or files.</text></g></svg>
