<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 442" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1｜Understand the Difficulty Before Choosing a Solution</title><desc id="desc">The columns are parallel analogies sharing Problem Before Solution. They do not form a medical-to-software sequence.</desc><rect width="1040" height="442" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 1｜Understand the Difficulty Before Choosing a Solution</text><rect x="36" y="70" width="476" height="230" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">Medical diagnosis</text><text x="56" y="142" font-size="20" font-weight="400">The patient says, “I want</text><text x="56" y="178" font-size="20" font-weight="400">antibiotics.” Understand</text><text x="56" y="214" font-size="20" font-weight="400">symptoms and causes before</text><text x="56" y="250" font-size="20" font-weight="400">choosing treatment.</text><rect x="528" y="70" width="476" height="230" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="548" y="98" font-size="22" font-weight="650">Software engineering</text><text x="548" y="142" font-size="20" font-weight="400">The user says, “I want an AI</text><text x="548" y="178" font-size="20" font-weight="400">system.” Understand the work</text><text x="548" y="214" font-size="20" font-weight="400">difficulty before deciding</text><text x="548" y="250" font-size="20" font-weight="400">whether AI is needed.</text><text x="36" y="346" font-size="20" font-weight="400">The columns are parallel analogies sharing Problem Before Solution.</text><text x="36" y="382" font-size="20" font-weight="400">They do not form a medical-to-software sequence.</text></g></svg>
