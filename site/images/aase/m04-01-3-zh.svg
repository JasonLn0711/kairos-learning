<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 572" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜狀態提示的修改前與候選修改</title><desc id="desc">示意畫面，不是真實系統或測試結果；候選修改仍需要驗證。</desc><rect width="1040" height="572" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 3｜狀態提示的修改前與候選修改</text><rect x="36" y="74" width="460" height="392" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><rect x="52" y="90" width="200" height="42" rx="12" fill="#fce1e1" stroke="#d5dce0"/><text x="64" y="118" font-size="20" font-weight="700">修改前</text><path d="M67 170a11 11 0 1 0 0 22a11 11 0 1 0 0-22m-6 11 4 4 7-9" fill="none" stroke="#087337" stroke-width="2"/><text x="92" y="192" font-size="22" font-weight="700">成功！</text><text x="52" y="238" font-size="20" font-weight="400">操作完成</text><rect x="52" y="264" width="428" height="70" rx="12" fill="#f0f1f2" stroke="#d5dce0"/><text x="66" y="288" font-size="20" font-weight="400">確定</text><text x="52" y="354" font-size="20" font-weight="400">沒有解釋成功的是什麼，也不知道下一步。</text><rect x="546" y="74" width="460" height="392" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><rect x="562" y="90" width="200" height="42" rx="12" fill="#d9efe1" stroke="#d5dce0"/><text x="574" y="118" font-size="20" font-weight="700">候選修改</text><path d="M577 170a11 11 0 1 0 0 22a11 11 0 1 0 0-22m-6 11 4 4 7-9" fill="none" stroke="#087337" stroke-width="2"/><text x="602" y="192" font-size="22" font-weight="700">欄位檢查完成</text><text x="562" y="238" font-size="20" font-weight="400">3 個必要欄位已齊全。</text><text x="562" y="288" font-size="20" font-weight="400">尚未正式受理，請依程序辦理送件。</text><rect x="562" y="314" width="428" height="70" rx="12" fill="#f0f1f2" stroke="#d5dce0"/><text x="576" y="338" font-size="20" font-weight="400">匯出檢查報告</text><text x="562" y="404" font-size="20" font-weight="400">明確說明狀態，以及接下來能做什麼。</text><text x="36" y="510" font-size="20" font-weight="400">示意畫面，不是真實系統或測試結果；候選修改仍需要驗證。</text></g></svg>
