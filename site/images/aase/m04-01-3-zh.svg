<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 948" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜從使用者目標到整體結果</title><desc id="desc">簡化的教學流程。實際操作通常會反覆經過「操作、回饋、理解、再操作」的循環；HCI 與 UX 也涵蓋比圖中更廣的範圍。 UI 與 HCI 為並列觀點，沒有先後順序；箭頭表示本圖的閱讀方向。</desc><rect width="1040" height="948" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 3｜從使用者目標到整體結果</text><rect x="36" y="104" width="968" height="134" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="136" font-size="21" font-weight="700">使用者目標</text><text x="56" y="186" font-size="20" font-weight="400">例如：完成銀行帳戶開立</text><path d="M520 250v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="298" width="472" height="134" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="330" font-size="21" font-weight="700">UI：看見與操作</text><text x="56" y="380" font-size="20" font-weight="400">表單、按鈕、資料提示、結果畫面</text><rect x="532" y="298" width="472" height="134" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="552" y="330" font-size="21" font-weight="700">HCI：理解與判斷</text><text x="552" y="380" font-size="20" font-weight="400">理解指示、選擇動作、解讀系統回饋</text><path d="M520 444v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="492" width="968" height="134" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="524" font-size="21" font-weight="700">系統處理與回饋</text><text x="56" y="574" font-size="20" font-weight="400">檢查資料、儲存、通知、處理錯誤</text><path d="M520 638v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="686" width="968" height="134" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="718" font-size="21" font-weight="700">UX：從開始到後續服務的整體結果</text><text x="56" y="768" font-size="20" font-weight="400">是否完成開戶？過程是否順利？後續是否能使用帳戶？</text><text x="36" y="844" font-size="20" font-weight="400">簡化的教學流程。實際操作通常會反覆經過「操作、回饋、理解、再操作」的循環；HCI 與 UX 也</text><text x="36" y="880" font-size="20" font-weight="400">涵蓋比圖中更廣的範圍。 UI 與 HCI 為並列觀點，沒有先後順序；箭頭表示本圖的閱讀方向。</text></g></svg>
