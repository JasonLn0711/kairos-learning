<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1260" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4 | Intake checking System Context</title><desc id="desc">Arrows distinguish input requests from returned results. The dashed scope boundary identifies the system being described, not security isolation. There are no external runtime systems.</desc><rect width="1040" height="1260" fill="#fff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="40" y="44" font-size="24" font-weight="700">Figure 4 | Intake checking System Context</text><text x="40" y="98" font-size="20" font-weight="700">Outside the system scope</text><rect x="40" y="144" width="960" height="152" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="176" font-size="22" font-weight="700">Intake worker</text><text x="58" y="216" font-size="20" font-weight="400">Person / role · Enters synthetic data, reviews results and obtains</text><text x="58" y="250" font-size="20" font-weight="400">reports.</text><text x="40" y="336" font-size="20" font-weight="700">Inside the system scope:</text><text x="40" y="382" font-size="20" font-weight="400">System scope being described</text><rect x="28" y="420" width="984" height="174" rx="14" fill="none" stroke="#3074aa" stroke-width="2" stroke-dasharray="8 5"/><rect x="40" y="428" width="960" height="152" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="460" font-size="22" font-weight="700">Intake completeness-checking system</text><text x="58" y="500" font-size="20" font-weight="400">Software system · Checks fields, identifies omissions and exports</text><text x="58" y="534" font-size="20" font-weight="400">reports.</text><text x="40" y="620" font-size="22" font-weight="700">Directed relationships</text><text x="64" y="698" font-size="20" font-weight="700">Intake worker</text><path d="M78 736v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="792" font-size="20" font-weight="700">Intake completeness-checking system</text><text x="64" y="834" font-size="20" font-weight="400">Enters synthetic data and requests checking or export.</text><path d="M40 884H1000" stroke="#cbd5e1"/><text x="64" y="924" font-size="20" font-weight="700">Intake completeness-checking system</text><path d="M78 962v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1018" font-size="20" font-weight="700">Intake worker</text><text x="64" y="1060" font-size="20" font-weight="400">Returns omission feedback and a completeness report</text><path d="M40 1110H1000" stroke="#cbd5e1"/><text x="40" y="1134" font-size="20" font-weight="400">Arrows distinguish input requests from returned results. The dashed</text><text x="40" y="1168" font-size="20" font-weight="400">scope boundary identifies the system being described, not security</text><text x="40" y="1202" font-size="20" font-weight="400">isolation. There are no external runtime systems.</text></g></svg>
