<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜用兩張任務卡走讀草圖</title><desc id="desc">兩張卡是不同測試任務，不代表先後流程；先觀察理解，再記錄修正理由。</desc><rect width="1040" height="460" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="30" y="42" font-size="24" font-weight="700">圖 5｜用兩張任務卡走讀草圖</text><text x="30" y="86" font-size="20" font-weight="400">兩張卡是不同測試任務，不代表先後流程；先觀察理解，再記錄修正理由。</text><rect x="30" y="119" width="980" height="159" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="144" font-size="22" font-weight="700">任務 A：資料缺漏</text><text x="50" y="190" font-size="20" font-weight="400">你正在準備出貨，但是忘記填寫收件地址。請指出介面上哪裡告訴你這件事，以及你應該如何補</text><text x="50" y="224" font-size="20" font-weight="400">救。</text><rect x="30" y="277" width="980" height="159" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="302" font-size="22" font-weight="700">任務 B：完成後修改</text><text x="50" y="348" font-size="20" font-weight="400">你已經完成資料檢查，後來發現電話填錯並修改了內容。請說明現在是否可以直接匯出已通過檢</text><text x="50" y="382" font-size="20" font-weight="400">查的資料。</text></g></svg>
