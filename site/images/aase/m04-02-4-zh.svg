<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1092" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜從需求到驗證的概念順序</title><desc id="desc">箭頭表示設計工作的概念順序；實際專案需反覆回到前面階段修正。功能正確與使用者能完成工作分別驗證。</desc><rect width="1040" height="1092" fill="#ffffff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="20" font-weight="700">圖 4｜從需求到驗證的概念順序</text><rect x="36" y="96" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="132" font-size="20" font-weight="700">01 需求工程</text><text x="56" y="174" font-size="20" font-weight="400">定義使用者問題與成功條件</text><path d="M520 236v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="280" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="316" font-size="20" font-weight="700">02 Task Analysis</text><text x="56" y="358" font-size="20" font-weight="400">找出工作、判斷、資訊及例外</text><path d="M520 420v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="464" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="500" font-size="20" font-weight="700">03 User Flow 與 UI 設計</text><text x="56" y="542" font-size="20" font-weight="400">安排操作路徑、介面和回饋</text><path d="M520 604v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="648" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="684" font-size="20" font-weight="700">04 系統實作</text><text x="56" y="726" font-size="20" font-weight="400">把業務規則與操作行為做成軟體</text><path d="M520 788v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="832" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="868" font-size="20" font-weight="700">05 測試與驗證</text><text x="56" y="910" font-size="20" font-weight="400">確認功能正確，使用者也能完成工作</text><text x="36" y="1000" font-size="20" font-weight="400">箭頭表示設計工作的概念順序；實際專案需反覆回到前面階段修正。功能正確與使用者能完成工作分</text><text x="36" y="1034" font-size="20" font-weight="400">別驗證。</text></g></svg>
