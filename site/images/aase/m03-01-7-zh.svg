<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 790" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 7｜從學習目的走向開發與驗收</title><desc id="desc">這是學習與工作產物的主線；讀完各模組不等於完成實作、使用者驗收或解決問題。</desc><rect width="1040" height="790" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 7｜從學習目的走向開發與驗收</text><rect x="36" y="70" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">M01｜理解軟體工程的目的</text><text x="56" y="142" font-size="20" font-weight="400">重點是讓使用者完成真正需要的工作，而不只是寫出程式。</text><path d="M520 206v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="234" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="262" font-size="22" font-weight="650">M02｜理解 AI 如何協助完成工作</text><text x="56" y="306" font-size="20" font-weight="400">認識 LLM、Context、Tools、Agent Harness、測試與可觀測性。</text><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="398" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="426" font-size="22" font-weight="650">M03｜先定義清楚要做的工作</text><text x="56" y="470" font-size="20" font-weight="400">將模糊想法變成能訪談、能驗證、能開發的問題與需求。</text><path d="M520 534v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="562" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="590" font-size="22" font-weight="650">後續開發與驗收</text><text x="56" y="634" font-size="20" font-weight="400">依規格實作、測試，並根據證據確認是否解決原本的問題。</text><text x="36" y="730" font-size="20" font-weight="400">這是學習與工作產物的主線；讀完各模組不等於完成實作、使用者驗收或解決問題。</text></g></svg>
