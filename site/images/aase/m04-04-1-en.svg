<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 902" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | From requirements to a working product</title><desc id="desc">Arrows show a typical design order. Earlier decisions can be revisited; this is not a mandatory waterfall process.</desc><rect width="1040" height="902" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="30" y="42" font-size="24" font-weight="700">Figure 1 | From requirements to a working product</text><text x="30" y="86" font-size="20" font-weight="400">Arrows show a typical design order. Earlier decisions can be revisited;</text><text x="30" y="120" font-size="20" font-weight="400">this is not a mandatory waterfall process.</text><rect x="30" y="153" width="980" height="125" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="178" font-size="22" font-weight="700">Requirements and scenario</text><text x="50" y="224" font-size="20" font-weight="400">Who needs to solve which problem?</text><path d="M520 284v26m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="30" y="303" width="980" height="125" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="328" font-size="22" font-weight="700">User Flow</text><text x="50" y="374" font-size="20" font-weight="400">Which steps does the user take?</text><path d="M520 434v26m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="30" y="453" width="980" height="125" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="478" font-size="22" font-weight="700">Wireframe</text><text x="50" y="524" font-size="20" font-weight="400">What appears on each screen, and what happens after activation?</text><path d="M520 584v26m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="30" y="603" width="980" height="125" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="628" font-size="22" font-weight="700">Interactive prototype</text><text x="50" y="674" font-size="20" font-weight="400">Let people try the interaction</text><path d="M520 734v26m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="30" y="753" width="980" height="125" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="778" font-size="22" font-weight="700">Implementation, testing and delivery</text><text x="50" y="824" font-size="20" font-weight="400">Verify real business logic, security and quality</text></g></svg>
