<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 752" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜授權判斷的四個因素</title><desc id="desc">四列是共同參與判斷的因素，不代表先後步驟。</desc><rect width="1060" height="752" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 1｜授權判斷的四個因素</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Subject（主體）</text><text x="56" y="176" font-size="20" font-weight="400">誰提出要求？</text><rect x="36" y="242" width="988" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="278" font-size="20" font-weight="700">Resource（資源）</text><text x="56" y="322" font-size="20" font-weight="400">想存取哪筆資料？</text><rect x="36" y="388" width="988" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="424" font-size="20" font-weight="700">Action（動作）</text><text x="56" y="468" font-size="20" font-weight="400">想讀取、修改或匯出？</text><rect x="36" y="534" width="988" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="570" font-size="20" font-weight="700">Context（情境）</text><text x="56" y="614" font-size="20" font-weight="400">是否符合時間、案件關係等條件？</text><text x="36" y="692" font-size="20" font-weight="400">四列是共同參與判斷的因素，不代表先後步驟。</text></g></svg>
