<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 338" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜User Flow：客人怎麼完成用餐</title><desc id="desc">箭頭表示這個簡化案例的操作順序。餐廳內部的系統分工留給下一張圖。</desc><rect width="1320" height="338" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="42" font-size="20" font-weight="700">圖 1｜User Flow：客人怎麼完成用餐</text><rect x="32" y="102" width="224" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="50" y="138" font-size="20" font-weight="700">入座</text><text x="50" y="178" font-size="20" font-weight="400">客人找到座位。</text><path d="M258 164 L282 164" fill="none" stroke="#61736b" stroke-width="2"/><path d="M272 170L282 164L272 158" fill="none" stroke="#61736b" stroke-width="2"/><rect x="290" y="102" width="224" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="308" y="138" font-size="20" font-weight="700">點餐</text><text x="308" y="178" font-size="20" font-weight="400">選擇並送出餐點。</text><path d="M516 164 L540 164" fill="none" stroke="#61736b" stroke-width="2"/><path d="M530 170L540 164L530 158" fill="none" stroke="#61736b" stroke-width="2"/><rect x="548" y="102" width="224" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="566" y="138" font-size="20" font-weight="700">等待</text><text x="566" y="178" font-size="20" font-weight="400">等候餐點送達。</text><path d="M774 164 L798 164" fill="none" stroke="#61736b" stroke-width="2"/><path d="M788 170L798 164L788 158" fill="none" stroke="#61736b" stroke-width="2"/><rect x="806" y="102" width="224" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="824" y="138" font-size="20" font-weight="700">用餐</text><text x="824" y="178" font-size="20" font-weight="400">享用餐點。</text><path d="M1032 164 L1056 164" fill="none" stroke="#61736b" stroke-width="2"/><path d="M1046 170L1056 164L1046 158" fill="none" stroke="#61736b" stroke-width="2"/><rect x="1064" y="102" width="224" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="1082" y="138" font-size="20" font-weight="700">結帳</text><text x="1082" y="178" font-size="20" font-weight="400">完成付款。</text><text x="32" y="278" font-size="20" font-weight="400">箭頭表示這個簡化案例的操作順序。餐廳內部的系統分工留給下一張圖。</text></g></svg>
