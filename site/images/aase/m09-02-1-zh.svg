<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 702" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜從製作者到接手者的四階段</title><desc id="desc">箭頭表示文件閱讀與交付順序，不表示已通過驗收。</desc><rect width="1040" height="702" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 1｜從製作者到接手者的四階段</text><text x="64" y="102" font-size="20" font-weight="700">定位：這是什麼？</text><text x="64" y="146" font-size="20" font-weight="400">用途、使用對象、功能範圍、版本</text><path d="M520 198v24m-6-6 6 6 6-6" fill="none" stroke="#59666e" stroke-width="2"/><text x="64" y="246" font-size="20" font-weight="700">重建：怎麼讓它跑起來？</text><text x="64" y="290" font-size="20" font-weight="400">環境、依賴套件、安裝與啟動命令</text><path d="M520 342v24m-6-6 6 6 6-6" fill="none" stroke="#59666e" stroke-width="2"/><text x="64" y="390" font-size="20" font-weight="700">驗收：怎麼知道它真的正常？</text><text x="64" y="434" font-size="20" font-weight="400">測試資料、操作步驟、預期結果、實際證據</text><path d="M520 486v24m-6-6 6 6 6-6" fill="none" stroke="#59666e" stroke-width="2"/><text x="64" y="534" font-size="20" font-weight="700">交接：發生問題或結束使用怎麼辦？</text><text x="64" y="578" font-size="20" font-weight="400">已知限制、錯誤處理、復原、停止、清理</text><text x="36" y="642" font-size="20" font-weight="400">箭頭表示文件閱讀與交付順序，不表示已通過驗收。</text></g></svg>
