<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1304" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4 | Repairing the third weekend subject: one reasonable workflow</title><desc id="desc">Security: restrict file, tool and network access throughout the task

Observability: retain appropriate records throughout, not only in the final step</desc><rect width="1040" height="1304" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 4 | Repairing the third weekend subject: one</text><text x="36" y="80" font-size="24">reasonable workflow</text><rect x="36" y="140" width="968" height="176" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="56" y="176" font-size="22">1. Get the latest specification</text><text x="56" y="224" font-size="20">Context: confirm that the weekend limit really is three</text><text x="56" y="260" font-size="20">subjects</text><path d="M520 324v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="364" width="968" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="56" y="400" font-size="22">2. Read the project code</text><text x="56" y="448" font-size="20">Tools + Execution: confirm this is the target project</text><path d="M520 512v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="552" width="968" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="56" y="588" font-size="22">3. Find and fix the bug</text><text x="56" y="636" font-size="20">The LLM analyzes; tools make the actual changes</text><path d="M520 700v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="740" width="968" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="56" y="776" font-size="22">4. Run tests</text><text x="56" y="824" font-size="20">Orchestration: confirm the required validation is complete</text><path d="M520 888v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="928" width="968" height="140" rx="10" fill="#e8f4ef" stroke="#b8c9d0"/><text x="56" y="964" font-size="22">5. Assemble the evidence</text><text x="56" y="1012" font-size="20">Observability: retain changes and test results</text><text x="36" y="1112" font-size="20">Security: restrict file, tool and network access throughout the</text><text x="36" y="1148" font-size="20">task</text><text x="36" y="1196" font-size="20">Observability: retain appropriate records throughout, not only</text><text x="36" y="1232" font-size="20">in the final step</text></g></svg>
