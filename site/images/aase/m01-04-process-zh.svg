<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 838" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜需求訪談的五個步驟</title><desc id="desc">箭頭表示調查與驗證的工作順序，不代表每一步已經得到證實。第③步的需求仍須向使用者確認，第⑤步比較操作時間和錯誤次數。</desc><rect width="1040" height="838" fill="#fbfcfc"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="42" font-size="24" font-weight="700">圖 2｜需求訪談的五個步驟</text><text x="64" y="94" font-size="22" font-weight="700">① 聽到原話</text><text x="64" y="136" font-size="20" font-weight="400">「我們的系統很慢。」</text><path d="M520 180 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="226" font-size="22" font-weight="700">② 追問真實經過</text><text x="64" y="268" font-size="20" font-weight="400">「最近一次慢，是在哪個步驟？」</text><path d="M520 312 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="358" font-size="22" font-weight="700">③ 定義真正的需求</text><text x="64" y="400" font-size="20" font-weight="400">「希望減少重複填寫相同資料。」</text><path d="M520 444 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="490" font-size="22" font-weight="700">④ 提出改善假設</text><text x="64" y="532" font-size="20" font-weight="400">「讓資料自動帶入，可能減少工作量。」</text><path d="M520 576 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="594" width="968" height="110" rx="6" fill="#f9f0eb" stroke="#b54b25"/><text x="64" y="622" font-size="22" font-weight="700">⑤ 實際驗證</text><text x="64" y="664" font-size="20" font-weight="400">「試用原型，比較操作時間和錯誤次數。」</text><text x="36" y="742" font-size="20" font-weight="400">箭頭表示調查與驗證的工作順序，不代表每一步已經得到證實。第③步的需求仍須向使用者確認，第⑤步比</text><text x="36" y="776" font-size="20" font-weight="400">較操作時間和錯誤次數。</text></g></svg>
