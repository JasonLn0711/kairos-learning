<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 698" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | IA practice contains structure planning and sitemaps</title><desc id="desc">Redrawn from the Nielsen Norman Group reference. Nested boundaries mean inclusion, not execution order; a sitemap represents part of the structure.</desc><rect width="1040" height="698" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 1 | IA practice contains structure planning and sitemaps</text><rect x="36" y="74" width="960" height="458" rx="12" fill="#edf7f4" stroke="#368079"/><text x="56" y="98" font-size="22" font-weight="700">Information architecture activities</text><text x="56" y="140" font-size="20" font-weight="400">Content inventory</text><text x="56" y="174" font-size="20" font-weight="400">Content audit</text><text x="56" y="208" font-size="20" font-weight="400">IA user research</text><text x="56" y="242" font-size="20" font-weight="400">Taxonomies and tags</text><rect x="66" y="274" width="900" height="238" rx="12" fill="#e6f2fb" stroke="#397c9b"/><text x="86" y="302" font-size="22" font-weight="700">Plan website structure</text><text x="86" y="344" font-size="20" font-weight="400">Establish content organization and hierarchy</text><rect x="96" y="376" width="840" height="116" rx="12" fill="#efedfa" stroke="#7468a3"/><text x="116" y="404" font-size="22" font-weight="700">Sitemap</text><text x="116" y="446" font-size="20" font-weight="400">Visualize the website structure</text><text x="36" y="576" font-size="20" font-weight="400">Redrawn from the Nielsen Norman Group reference. Nested boundaries</text><text x="36" y="610" font-size="20" font-weight="400">mean inclusion, not execution order; a sitemap represents part of the</text><text x="36" y="644" font-size="20" font-weight="400">structure.</text></g></svg>
