<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 686" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜介面與資料檢核</title><desc id="desc">箭頭表示資料送至規則層；不通過與通過是互斥結果，不是先後步驟。</desc><rect width="1060" height="686" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 1｜介面與資料檢核</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">使用者介面（UI）</text><text x="56" y="176" font-size="20" font-weight="400">方便輸入、提醒必填、限制字數</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="278" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">資料檢核（Validation）</text><text x="56" y="358" font-size="20" font-weight="400">確認欄位、資料型別、空白及長度符合規則</text><rect x="36" y="460" width="478" height="130" rx="14" fill="#fff5f5" stroke="#64748b"/><text x="56" y="496" font-size="20" font-weight="700">不通過</text><text x="56" y="540" font-size="20" font-weight="400">顯示原因，保留資料供修正</text><rect x="546" y="460" width="478" height="130" rx="14" fill="#f1faf5" stroke="#64748b"/><text x="566" y="496" font-size="20" font-weight="700">通過</text><text x="566" y="540" font-size="20" font-weight="400">表示本次欄位符合指定規則</text><path d="M275 420v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M785 420v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="626" font-size="20" font-weight="400">箭頭表示資料送至規則層；不通過與通過是互斥結果，不是先後步驟。</text></g></svg>
