<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 900" role="img" aria-labelledby="title desc">
<title id="title">Figure 1 | Five Steps for an SDD Change</title>
<desc id="desc">This is an iterative process; each step may be revisited.</desc>
<rect x="4" y="4" width="832" height="892" rx="16" fill="#fbfcfc" stroke="#cbd5d8"/>
<text x="420" y="45" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#18252c">Figure 1 | Five Steps for an SDD Change</text>
<text x="420" y="95" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18252c">1. Change Request</text>
<text x="420" y="131" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">Why change? Who proposed it? Has it been approved?</text>
<path d="M420 183v23m-6-6 6 6 6-6" fill="none" stroke="#526168" stroke-width="2"/>
<text x="420" y="240" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18252c">2. Specification</text>
<text x="420" y="276" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">What are the new rules? Which existing rules must remain intact?</text>
<path d="M420 328v23m-6-6 6 6 6-6" fill="none" stroke="#526168" stroke-width="2"/>
<text x="420" y="385" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18252c">3. Impact Analysis and Implementation</text>
<text x="420" y="421" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">Which screens, data, code and documents change?</text>
<path d="M420 473v23m-6-6 6 6 6-6" fill="none" stroke="#526168" stroke-width="2"/>
<text x="420" y="530" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18252c">4. Testing and Verification</text>
<text x="420" y="566" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">Does the new behavior work? Do existing features still work?</text>
<path d="M420 618v23m-6-6 6 6 6-6" fill="none" stroke="#526168" stroke-width="2"/>
<rect x="22" y="645" width="796" height="116" rx="12" fill="#eaf6f2" stroke="#cbded8"/>
<text x="420" y="675" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18252c">5. Review, Decision and Evidence</text>
<text x="420" y="711" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">Accept, revise or defer; return to earlier steps when necessary.</text>
<text x="420" y="830" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">This is an iterative process; each step may be revisited.</text>
</svg>
