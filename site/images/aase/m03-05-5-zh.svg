<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 736" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜修改後沿用舊狀態的風險</title><desc id="desc">編號表示合成案例的時間順序。資料 B 必須重新檢查，不能沿用資料 A 的結果；本圖沒有宣稱真實銀行曾發生此事件。</desc><rect width="1040" height="736" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 5｜修改後沿用舊狀態的風險</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">步驟 1｜檢查資料 A</text><text x="60" y="148" font-size="20" font-weight="400">系統顯示資料 A 通過檢查。</text><rect x="36" y="208" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="236" font-size="22" font-weight="650">步驟 2｜使用者修改資料</text><text x="60" y="280" font-size="20" font-weight="400">使用者把資料 A 改成 B，並更改了重要的金額欄位。</text><rect x="36" y="340" width="968" height="122" rx="10" fill="#fff2ea" stroke="#b15840"/><text x="60" y="368" font-size="22" font-weight="650">步驟 3｜系統仍然顯示通過</text><text x="60" y="412" font-size="20" font-weight="400">系統沿用了資料 A 的檢查結果，沒有重新驗證 B。</text><rect x="36" y="472" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="500" font-size="22" font-weight="650">步驟 4｜使用者匯出報告</text><text x="60" y="544" font-size="20" font-weight="400">未重新檢查的資料 B 被匯出，形成風險。</text><text x="36" y="640" font-size="20" font-weight="400">編號表示合成案例的時間順序。資料 B 必須重新檢查，不能沿用資料 A 的結果；本圖沒有宣稱</text><text x="36" y="676" font-size="20" font-weight="400">真實銀行曾發生此事件。</text></g></svg>
