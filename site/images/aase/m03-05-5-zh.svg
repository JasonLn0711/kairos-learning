<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 868" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜過期檢查結果的問題</title><desc id="desc">設計風險；最後的補充規則是針對風險的需求，驗收證據仍待取得。</desc><rect width="1040" height="868" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 5｜過期檢查結果的問題</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">1. 檢查資料 A</text><text x="60" y="148" font-size="20" font-weight="400">使用者輸入資料 A，按下檢查，系統顯示通過。</text><rect x="36" y="208" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="236" font-size="22" font-weight="650">2. 修改成資料 B</text><text x="60" y="280" font-size="20" font-weight="400">使用者又修改了資料，變成資料 B。</text><rect x="36" y="340" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="368" font-size="22" font-weight="650">3. 沿用舊狀態</text><text x="60" y="412" font-size="20" font-weight="400">系統卻保留資料 A 的「檢查通過」狀態。</text><rect x="36" y="472" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="500" font-size="22" font-weight="650">4. 未重新檢查就匯出</text><text x="60" y="544" font-size="20" font-weight="400">使用者直接匯出資料 B 的報告，沒有重新檢查。</text><rect x="36" y="604" width="968" height="158" rx="10" fill="#fff2ea" stroke="#b15840"/><text x="60" y="632" font-size="22" font-weight="650">應補充的規則</text><text x="60" y="676" font-size="20" font-weight="400">每當影響檢查結果的輸入資料改變時，原本的檢查通過狀態必須失效，重新檢查後才能完整匯</text><text x="60" y="712" font-size="20" font-weight="400">出。</text><text x="36" y="808" font-size="20" font-weight="400">設計風險；最後的補充規則是針對風險的需求，驗收證據仍待取得。</text></g></svg>
