<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 734" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Three inputs to human review</title><desc id="desc">Specification, diff and evidence are parallel review inputs. Together they inform acceptance, revision or deferral. The downward arrow means aggregation, not a sequence between inputs.</desc><rect width="1060" height="734" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 1 | Three inputs to human review</text><rect x="36" y="96" width="316" height="272" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="132" font-size="20" font-weight="700">Specification</text><text x="56" y="174" font-size="20" font-weight="400">What should be done:</text><text x="56" y="210" font-size="20" font-weight="400">requirements,</text><text x="56" y="246" font-size="20" font-weight="400">acceptance</text><text x="56" y="282" font-size="20" font-weight="400">conditions and</text><text x="56" y="318" font-size="20" font-weight="400">exclusions</text><rect x="372" y="96" width="316" height="200" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="392" y="132" font-size="20" font-weight="700">Diff</text><text x="392" y="174" font-size="20" font-weight="400">What changed: files,</text><text x="392" y="210" font-size="20" font-weight="400">configuration and</text><text x="392" y="246" font-size="20" font-weight="400">behavior</text><rect x="708" y="96" width="316" height="236" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="728" y="132" font-size="20" font-weight="700">Evidence</text><text x="728" y="174" font-size="20" font-weight="400">Does it work:</text><text x="728" y="210" font-size="20" font-weight="400">relevant tests,</text><text x="728" y="246" font-size="20" font-weight="400">operations and</text><text x="728" y="282" font-size="20" font-weight="400">limits</text><path d="M530 378V414m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="434" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="470" font-size="20" font-weight="700">Human review and decision</text><text x="56" y="512" font-size="20" font-weight="400">Accept / Revise / Defer</text><text x="36" y="602" font-size="20" font-weight="400">Specification, diff and evidence are parallel review inputs. Together</text><text x="36" y="638" font-size="20" font-weight="400">they inform acceptance, revision or deferral. The downward arrow means</text><text x="36" y="674" font-size="20" font-weight="400">aggregation, not a sequence between inputs.</text></g></svg>
