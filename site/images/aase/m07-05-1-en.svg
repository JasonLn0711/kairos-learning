<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 754" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Bank application form — interactive demo</title><desc id="desc">Teaching simulation. Check first, then edit document type; a check result belongs only to its snapshot.</desc><rect width="1060" height="754" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 1 | Bank application form — interactive demo</text><rect x="36" y="96" width="478" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Application ID</text><text x="56" y="176" font-size="20" font-weight="400">A001</text><rect x="546" y="96" width="478" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="566" y="132" font-size="20" font-weight="700">Applicant code</text><text x="566" y="176" font-size="20" font-weight="400">C123</text><rect x="36" y="252" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="288" font-size="20" font-weight="700">Document type</text><text x="56" y="332" font-size="20" font-weight="400">收入證明</text><text x="56" y="424" font-size="20" font-weight="400">Check data    Reset (static illustration)</text><rect x="36" y="484" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="520" font-size="20" font-weight="700">Initial state</text><text x="56" y="564" font-size="20" font-weight="400">Current data is unchecked. Select Check data.</text><text x="36" y="658" font-size="20" font-weight="400">Teaching simulation. Check first, then edit document type; a check</text><text x="36" y="694" font-size="20" font-weight="400">result belongs only to its snapshot.</text></g></svg>
