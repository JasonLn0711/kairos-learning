<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1170" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4 | Five-step review procedure</title><desc id="desc">Numbers and connectors show the recommended review order. Execute each step within this task’s actual scope.</desc><rect width="1060" height="1170" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 4 | Five-step review procedure</text><rect x="36" y="96" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="132" font-size="20" font-weight="700">Check the specification</text><text x="56" y="174" font-size="20" font-weight="400">Confirm features, acceptance conditions and excluded changes.</text><path d="M530 232V264m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="282" width="988" height="164" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="318" font-size="20" font-weight="700">Inspect file changes</text><text x="56" y="360" font-size="20" font-weight="400">Review working-tree, staged and untracked content, plus Agent-created</text><text x="56" y="396" font-size="20" font-weight="400">commits where needed.</text><path d="M530 454V486m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="504" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="540" font-size="20" font-weight="700">Inspect tool records</text><text x="56" y="582" font-size="20" font-weight="400">Confirm command, directory, exit code, output and unexecuted work.</text><path d="M530 640V672m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="690" width="988" height="164" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="726" font-size="20" font-weight="700">Verify behavior independently</text><text x="56" y="768" font-size="20" font-weight="400">Run normal, error and boundary tests directly tied to requirements,</text><text x="56" y="804" font-size="20" font-weight="400">with manual operation where needed.</text><path d="M530 862V894m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="912" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="948" font-size="20" font-weight="700">Record the decision</text><text x="56" y="990" font-size="20" font-weight="400">Explain acceptance, revision or deferral and unresolved risks.</text><text x="36" y="1074" font-size="20" font-weight="400">Numbers and connectors show the recommended review order. Execute each</text><text x="36" y="1110" font-size="20" font-weight="400">step within this task’s actual scope.</text></g></svg>
