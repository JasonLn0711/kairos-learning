<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 478" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Good error recovery</title><desc id="desc">Plus signs join three complementary requirements; they do not represent sequential screens.</desc><rect width="1060" height="478" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 3 | Good error recovery</text><rect x="28" y="96" width="296" height="238" rx="14" fill="#edf1f5" stroke="#64748b"/><text x="48" y="132" font-size="20" font-weight="700">Identify the</text><text x="48" y="168" font-size="20" font-weight="700">problem</text><text x="48" y="212" font-size="20" font-weight="400">Explain precisely</text><text x="48" y="248" font-size="20" font-weight="400">what needs</text><text x="48" y="284" font-size="20" font-weight="400">correction.</text><text x="337" y="150" font-size="24">＋</text><rect x="372" y="96" width="296" height="238" rx="14" fill="#edf1f5" stroke="#64748b"/><text x="392" y="132" font-size="20" font-weight="700">Preserve progress</text><text x="392" y="176" font-size="20" font-weight="400">Retain completed</text><text x="392" y="212" font-size="20" font-weight="400">work that can</text><text x="392" y="248" font-size="20" font-weight="400">safely be retained</text><text x="392" y="284" font-size="20" font-weight="400">.</text><text x="681" y="150" font-size="24">＋</text><rect x="716" y="96" width="296" height="238" rx="14" fill="#edf1f5" stroke="#64748b"/><text x="736" y="132" font-size="20" font-weight="700">Provide the next</text><text x="736" y="168" font-size="20" font-weight="700">action</text><text x="736" y="212" font-size="20" font-weight="400">Explain completion</text><text x="736" y="248" font-size="20" font-weight="400">, rechecking,</text><text x="736" y="284" font-size="20" font-weight="400">retry or help.</text><text x="36" y="382" font-size="20" font-weight="400">Plus signs join three complementary requirements; they do not</text><text x="36" y="418" font-size="20" font-weight="400">represent sequential screens.</text></g></svg>
