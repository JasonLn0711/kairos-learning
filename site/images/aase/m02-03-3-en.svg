<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 488" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | From Conversation to Compact Summary</title><desc id="desc">The arrow means summarization, not guaranteed completeness. Keep the original requirements available for inspection.</desc><rect width="1040" height="488" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 3 | From Conversation to Compact Summary</text><rect x="36.0" y="72" width="462.0" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="100" font-size="22">Original conversation</text><text x="52.0" y="144" font-size="20">Extensive discussion, error</text><text x="52.0" y="180" font-size="20">messages and corrections.</text><path d="M501.0 115h38m-6-6 6 6-6 6" fill="none" stroke="#637982" stroke-width="2"/><rect x="542.0" y="72" width="462.0" height="266" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="558.0" y="100" font-size="22">Compact summary</text><text x="558.0" y="144" font-size="20">Completed: add subjects.</text><text x="558.0" y="180" font-size="20">Confirmed: at most 2 subjects</text><text x="558.0" y="216" font-size="20">on weekdays. Pending fix:</text><text x="558.0" y="252" font-size="20">weekend limit. Undecided:</text><text x="558.0" y="288" font-size="20">public holidays.</text><text x="36" y="392" font-size="20">The arrow means summarization, not guaranteed completeness. Keep the</text><text x="36" y="428" font-size="20">original requirements available for inspection.</text></g></svg>
