<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1248" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜易用性測試觀察表（虛構示例）</title><desc id="desc">虛構教學示例，不代表曾經進行真人測試。</desc><rect width="1060" height="1248" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 2｜易用性測試觀察表（虛構示例）</text><text x="36" y="96" font-size="20" font-weight="700">系統版本</text><text x="60" y="132" font-size="20" font-weight="400">v0.2</text><path d="M36 180H1024" stroke="#d5dce0"/><text x="36" y="216" font-size="20" font-weight="700">測試者代號</text><text x="60" y="252" font-size="20" font-weight="400">P01</text><path d="M36 300H1024" stroke="#d5dce0"/><text x="36" y="336" font-size="20" font-weight="700">任務</text><text x="60" y="372" font-size="20" font-weight="400">修改資料後取得最新報告</text><path d="M36 420H1024" stroke="#d5dce0"/><text x="36" y="456" font-size="20" font-weight="700">觀察行為</text><text x="60" y="492" font-size="20" font-weight="400">修改資料後，未重新檢核即下載</text><path d="M36 540H1024" stroke="#d5dce0"/><text x="36" y="576" font-size="20" font-weight="700">主持人協助</text><text x="60" y="612" font-size="20" font-weight="400">沒有</text><path d="M36 660H1024" stroke="#d5dce0"/><text x="36" y="696" font-size="20" font-weight="700">任務結果</text><text x="60" y="732" font-size="20" font-weight="400">未取得符合要求的最新報告</text><path d="M36 780H1024" stroke="#d5dce0"/><text x="36" y="816" font-size="20" font-weight="700">可能原因</text><text x="60" y="852" font-size="20" font-weight="400">不清楚報告需要重新產生</text><path d="M36 900H1024" stroke="#d5dce0"/><text x="36" y="936" font-size="20" font-weight="700">改善假設</text><text x="60" y="972" font-size="20" font-weight="400">標記舊結果並引導重新檢核</text><path d="M36 1020H1024" stroke="#d5dce0"/><text x="36" y="1056" font-size="20" font-weight="700">再測方式</text><text x="60" y="1092" font-size="20" font-weight="400">讓其他符合目標族群的參與者完成同類任務</text><path d="M36 1140H1024" stroke="#d5dce0"/><text x="36" y="1188" font-size="20" font-weight="400">虛構教學示例，不代表曾經進行真人測試。</text></g></svg>
