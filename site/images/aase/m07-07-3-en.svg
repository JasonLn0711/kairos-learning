<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Capture failure, repair and verify</title><desc id="desc">Arrows show repair verification order, not completed or passed execution. Regression here means checking affected existing features after repair.</desc><rect width="1060" height="470" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 3 | Capture failure, repair and verify</text><rect x="36" y="96" width="288" height="202" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Red</text><text x="56" y="176" font-size="20" font-weight="400">Prove that the</text><text x="56" y="212" font-size="20" font-weight="400">test detects the</text><text x="56" y="248" font-size="20" font-weight="400">fault</text><path d="M336 161h30m-7-7 7 7-7 7" fill="none" stroke="#475569" stroke-width="2"/><rect x="386" y="96" width="288" height="166" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="406" y="132" font-size="20" font-weight="700">Green</text><text x="406" y="176" font-size="20" font-weight="400">Pass after a</text><text x="406" y="212" font-size="20" font-weight="400">minimal repair</text><path d="M686 161h30m-7-7 7 7-7 7" fill="none" stroke="#475569" stroke-width="2"/><rect x="736" y="96" width="288" height="202" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="756" y="132" font-size="20" font-weight="700">Regression</text><text x="756" y="176" font-size="20" font-weight="400">Check that other</text><text x="756" y="212" font-size="20" font-weight="400">features still</text><text x="756" y="248" font-size="20" font-weight="400">work</text><text x="36" y="338" font-size="20" font-weight="400">Arrows show repair verification order, not completed or passed</text><text x="36" y="374" font-size="20" font-weight="400">execution. Regression here means checking affected existing features</text><text x="36" y="410" font-size="20" font-weight="400">after repair.</text></g></svg>
