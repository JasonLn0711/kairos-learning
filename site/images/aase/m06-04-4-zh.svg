<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 502" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜Developer Tools：Network 模擬紀錄</title><desc id="desc">僅作說明的模擬紀錄，不是從教材網站擷取的封包；101 示意協定升級，不表示業務完成。</desc><rect width="1040" height="502" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 4｜Developer Tools：Network 模擬紀錄</text><text x="36" y="104" font-size="20" font-weight="700">Developer Tools</text><text x="36" y="152" font-size="20" font-weight="400">Elements     Network     Console</text><text x="36" y="200" font-size="20" font-weight="400">All     Fetch/XHR     WS     Doc</text><text x="36" y="260" font-size="20" font-weight="700">Name</text><text x="356" y="260" font-size="20" font-weight="700">Status</text><text x="676" y="260" font-size="20" font-weight="700">Type</text><path d="M36 290H1004" stroke="#d5dce0"/><text x="36" y="314" font-size="20" font-weight="400">orders</text><text x="356" y="314" font-size="20" font-weight="400">200</text><text x="676" y="314" font-size="20" font-weight="400">fetch</text><path d="M36 344H1004" stroke="#d5dce0"/><text x="36" y="368" font-size="20" font-weight="400">session</text><text x="356" y="368" font-size="20" font-weight="400">101</text><text x="676" y="368" font-size="20" font-weight="400">websocket</text><path d="M36 398H1004" stroke="#d5dce0"/><text x="36" y="442" font-size="20" font-weight="400">僅作說明的模擬紀錄，不是從教材網站擷取的封包；101 示意協定升級，不表示業務完成。</text></g></svg>
