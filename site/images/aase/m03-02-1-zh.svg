<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 952" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜M03-02 的需求發現流程</title><desc id="desc">箭頭表示需求發現的工作順序；每一步保留待確認事項，不表示訪談後已證實成效。</desc><rect width="1040" height="952" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 1｜M03-02 的需求發現流程</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">1. 找對人（Who）</text><text x="60" y="148" font-size="20" font-weight="400">誰使用、誰受影響、誰負責決定？</text><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="238" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="266" font-size="22" font-weight="650">2. 問對問題（Interview）</text><text x="60" y="310" font-size="20" font-weight="400">請對方描述實際做過的事情。</text><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="400" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="428" font-size="22" font-weight="650">3. 整理證據（Evidence）</text><text x="60" y="472" font-size="20" font-weight="400">區分對方說的、我們推測的與尚待驗證的。</text><path d="M520 532v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="562" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="590" font-size="22" font-weight="650">4. 確認規則（Decision）</text><text x="60" y="634" font-size="20" font-weight="400">遇到矛盾，找有權責的人釐清。</text><path d="M520 694v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="724" width="968" height="122" rx="10" fill="#eaf6ef" stroke="#91bca4"/><text x="60" y="752" font-size="22" font-weight="650">5. 形成需求（Requirement）</text><text x="60" y="796" font-size="20" font-weight="400">寫進 problem.md，準備設計與測試。</text><text x="36" y="892" font-size="20" font-weight="400">箭頭表示需求發現的工作順序；每一步保留待確認事項，不表示訪談後已證實成效。</text></g></svg>
