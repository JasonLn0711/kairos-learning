<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 854" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | A restaurant information system (hypothetical)</title><desc id="desc">Arrows show information relationships: ordering tablet → order management; order management separately sends information to kitchen, inventory and billing systems. The three receivers are parallel, not successive steps.</desc><rect width="1320" height="854" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="42" font-size="20" font-weight="700">Figure 2 | A restaurant information system (hypothetical)</text><rect x="410" y="102" width="500" height="126" rx="16" fill="#edf0f3" stroke="#85998e"/><text x="428" y="138" font-size="20" font-weight="700">Ordering tablet</text><text x="428" y="178" font-size="20" font-weight="400">Order → order management</text><path d="M660 233 L660 276" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 266L660 276L666 266" fill="none" stroke="#61736b" stroke-width="2"/><rect x="410" y="284" width="500" height="160" rx="16" fill="#edf0f3" stroke="#85998e"/><text x="428" y="320" font-size="20" font-weight="700">Order management</text><text x="428" y="360" font-size="20" font-weight="400">Receive orders and distribute</text><text x="428" y="394" font-size="20" font-weight="400">three kinds of information.</text><path d="M660 450 L660 478 L228 478 L228 510" fill="none" stroke="#61736b" stroke-width="2"/><path d="M222 500L228 510L234 500" fill="none" stroke="#61736b" stroke-width="2"/><rect x="32" y="516" width="392" height="160" rx="16" fill="#edf0f3" stroke="#85998e"/><text x="50" y="552" font-size="20" font-weight="700">Kitchen display</text><text x="50" y="592" font-size="20" font-weight="400">Order management →</text><text x="50" y="626" font-size="20" font-weight="400">preparation details</text><path d="M660 450 L660 478 L660 478 L660 510" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 500L660 510L666 500" fill="none" stroke="#61736b" stroke-width="2"/><rect x="464" y="516" width="392" height="126" rx="16" fill="#edf0f3" stroke="#85998e"/><text x="482" y="552" font-size="20" font-weight="700">Inventory system</text><text x="482" y="592" font-size="20" font-weight="400">Order management → usage</text><path d="M660 450 L660 478 L1092 478 L1092 510" fill="none" stroke="#61736b" stroke-width="2"/><path d="M1086 500L1092 510L1098 500" fill="none" stroke="#61736b" stroke-width="2"/><rect x="896" y="516" width="392" height="126" rx="16" fill="#edf0f3" stroke="#85998e"/><text x="914" y="552" font-size="20" font-weight="700">Billing system</text><text x="914" y="592" font-size="20" font-weight="400">Order management → amount</text><text x="32" y="726" font-size="20" font-weight="400">Arrows show information relationships: ordering tablet → order management; order management</text><text x="32" y="760" font-size="20" font-weight="400">separately sends information to kitchen, inventory and billing systems. The three receivers</text><text x="32" y="794" font-size="20" font-weight="400">are parallel, not successive steps.</text></g></svg>
