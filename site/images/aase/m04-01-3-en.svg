<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 674" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Status feedback before and after a candidate change</title><desc id="desc">Illustrative screens, not an actual system or test results; the candidate still needs testing.</desc><rect width="1040" height="674" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 3 | Status feedback before and after a candidate change</text><rect x="36" y="74" width="460" height="460" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><rect x="52" y="90" width="200" height="42" rx="12" fill="#fce1e1" stroke="#d5dce0"/><text x="64" y="118" font-size="20" font-weight="700">Before</text><path d="M67 170a11 11 0 1 0 0 22a11 11 0 1 0 0-22m-6 11 4 4 7-9" fill="none" stroke="#087337" stroke-width="2"/><text x="92" y="192" font-size="22" font-weight="700">Success!</text><text x="52" y="238" font-size="20" font-weight="400">Operation completed</text><rect x="52" y="264" width="428" height="70" rx="12" fill="#f0f1f2" stroke="#d5dce0"/><text x="66" y="288" font-size="20" font-weight="400">OK</text><text x="52" y="354" font-size="20" font-weight="400">It does not explain what</text><text x="52" y="388" font-size="20" font-weight="400">succeeded or what to do next.</text><rect x="546" y="74" width="460" height="460" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><rect x="562" y="90" width="200" height="42" rx="12" fill="#d9efe1" stroke="#d5dce0"/><text x="574" y="118" font-size="20" font-weight="700">Candidate change</text><path d="M577 170a11 11 0 1 0 0 22a11 11 0 1 0 0-22m-6 11 4 4 7-9" fill="none" stroke="#087337" stroke-width="2"/><text x="602" y="192" font-size="22" font-weight="700">Field check completed</text><text x="562" y="238" font-size="20" font-weight="400">3 required fields are complete.</text><text x="562" y="288" font-size="20" font-weight="400">Not officially accepted yet;</text><text x="562" y="322" font-size="20" font-weight="400">follow the submission procedure.</text><rect x="562" y="348" width="428" height="70" rx="12" fill="#f0f1f2" stroke="#d5dce0"/><text x="576" y="372" font-size="20" font-weight="400">Export check report</text><text x="562" y="438" font-size="20" font-weight="400">It states the status and the</text><text x="562" y="472" font-size="20" font-weight="400">available next action.</text><text x="36" y="578" font-size="20" font-weight="400">Illustrative screens, not an actual system or test results; the</text><text x="36" y="612" font-size="20" font-weight="400">candidate still needs testing.</text></g></svg>
