<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1128" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | From a user goal to the overall outcome</title><desc id="desc">A simplified teaching structure. Real use often cycles through action, feedback, interpretation and further action; HCI and UX extend beyond the scope shown here. UI and HCI are parallel perspectives, with no order between them; arrows indicate the reading direction of this illustration.</desc><rect width="1040" height="1128" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 3 | From a user goal to the overall outcome</text><rect x="36" y="104" width="968" height="134" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="136" font-size="21" font-weight="700">User goal</text><text x="56" y="186" font-size="20" font-weight="400">For example: open a bank account</text><path d="M520 250v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="298" width="472" height="170" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="330" font-size="21" font-weight="700">UI: see and operate</text><text x="56" y="380" font-size="20" font-weight="400">Forms, buttons, information</text><text x="56" y="416" font-size="20" font-weight="400">prompts and result screens</text><rect x="532" y="298" width="472" height="170" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="552" y="330" font-size="21" font-weight="700">HCI: understand and decide</text><text x="552" y="380" font-size="20" font-weight="400">Interpret instructions, choose</text><text x="552" y="416" font-size="20" font-weight="400">actions and interpret feedback</text><path d="M520 480v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="528" width="968" height="134" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="560" font-size="21" font-weight="700">System processing and feedback</text><text x="56" y="610" font-size="20" font-weight="400">Check information, save, notify and handle errors</text><path d="M520 674v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="722" width="968" height="170" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="754" font-size="21" font-weight="700">UX: overall outcome from start to follow-up service</text><text x="56" y="804" font-size="20" font-weight="400">Was the account opened? Was the process smooth? Can the account</text><text x="56" y="840" font-size="20" font-weight="400">actually be used?</text><text x="36" y="916" font-size="20" font-weight="400">A simplified teaching structure. Real use often cycles through action,</text><text x="36" y="952" font-size="20" font-weight="400">feedback, interpretation and further action; HCI and UX extend beyond</text><text x="36" y="988" font-size="20" font-weight="400">the scope shown here. UI and HCI are parallel perspectives, with no</text><text x="36" y="1024" font-size="20" font-weight="400">order between them; arrows indicate the reading direction of this</text><text x="36" y="1060" font-size="20" font-weight="400">illustration.</text></g></svg>
