<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1244" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 6｜整堂課的核心知識地圖</title><desc id="desc">箭頭表示本課決策流程，沒有表示已完成實際驗證。</desc><rect width="1040" height="1244" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 6｜整堂課的核心知識地圖</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="104" font-size="22" font-weight="650">1. 定義問題（Problem）</text><text x="60" y="148" font-size="20" font-weight="400">我們究竟想解決什麼？</text><path d="M520 204v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="256" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="284" font-size="22" font-weight="650">2. 找出高風險假設（Assumption）</text><text x="60" y="328" font-size="20" font-weight="400">哪件事如果判斷錯誤，影響最大？</text><path d="M520 384v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="436" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="464" font-size="22" font-weight="650">3. 設計 MVP（Minimum Viable Product）</text><text x="60" y="508" font-size="20" font-weight="400">什麼是回答核心問題的最小完整流程？</text><path d="M520 564v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="616" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="644" font-size="22" font-weight="650">4. 確定範圍（Scope）</text><text x="60" y="688" font-size="20" font-weight="400">第一版、延後、本版不做；哪些約束不可破壞？</text><path d="M520 744v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="796" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="824" font-size="22" font-weight="650">5. 執行驗證（Validation）</text><text x="60" y="868" font-size="20" font-weight="400">用測試、觀察與可核對的資料取得證據</text><path d="M520 924v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="976" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="1004" font-size="22" font-weight="650">6. 決定下一步（Decision）</text><text x="60" y="1048" font-size="20" font-weight="400">繼續、調整、擴大，或停止</text><text x="36" y="1184" font-size="20" font-weight="400">箭頭表示本課決策流程，沒有表示已完成實際驗證。</text></g></svg>
