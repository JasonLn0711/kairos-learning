<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 488" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Medical Consultation and Requirements Interview</title><desc id="desc">Shared principle: diagnose the problem before choosing a solution. The columns are parallel analogies; the medical example illustrates the order of investigation only.</desc><rect width="1040" height="488" fill="#fbfcfc"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="42" font-size="24" font-weight="700">Figure 1 | Medical Consultation and Requirements Interview</text><text x="36" y="94" font-size="22" font-weight="700">Medical consultation</text><text x="36" y="140" font-size="20" font-weight="400">Patient: “I want antibiotics.”</text><text x="36" y="174" font-size="20" font-weight="400">The doctor reviews symptoms,</text><text x="36" y="208" font-size="20" font-weight="400">history and examination results</text><text x="36" y="242" font-size="20" font-weight="400">before choosing treatment.</text><text x="546" y="94" font-size="22" font-weight="700">Requirements interview</text><text x="546" y="140" font-size="20" font-weight="400">User: “I want an AI system.” The</text><text x="546" y="174" font-size="20" font-weight="400">engineer investigates the</text><text x="546" y="208" font-size="20" font-weight="400">workflow and difficulties before</text><text x="546" y="242" font-size="20" font-weight="400">deciding whether AI is needed.</text><path d="M36 306 H1004" stroke="#77868a"/><text x="36" y="358" font-size="20" font-weight="400">Shared principle: diagnose the problem before choosing a solution. The</text><text x="36" y="392" font-size="20" font-weight="400">columns are parallel analogies; the medical example illustrates the order</text><text x="36" y="426" font-size="20" font-weight="400">of investigation only.</text></g></svg>
