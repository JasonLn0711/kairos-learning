<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 464" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜能繼續申請的復原訊息</title><desc id="desc">正例：明確指出缺件、保留其他資料，並提供可執行的下一步。示範訊息，非真實系統。</desc><rect width="1060" height="464" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 2｜能繼續申請的復原訊息</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">尚未完成申請</text><text x="56" y="176" font-size="20" font-weight="400">你尚未上傳「收入證明文件」。</text><rect x="36" y="244" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="280" font-size="20" font-weight="700">保留進度與下一步</text><text x="56" y="324" font-size="20" font-weight="400">其他資料都已保留，請補上收入證明後，再按「重新檢查」。</text><text x="36" y="404" font-size="20" font-weight="400">正例：明確指出缺件、保留其他資料，並提供可執行的下一步。示範訊息，非真實系統。</text></g></svg>
