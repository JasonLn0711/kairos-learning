<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 706" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | A discoverable advanced-settings entry</title><desc id="desc">The orange outline identifies the advanced entry. The chevron indicates another settings level, not an applied change.</desc><rect width="1040" height="706" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 2 | A discoverable advanced-settings entry</text><rect x="120" y="88" width="800" height="180" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="140" y="126" font-size="22" font-weight="700">Settings</text><text x="140" y="170" font-size="20" font-weight="400">Security</text><text x="140" y="216" font-size="20" font-weight="400">Password | Change</text><rect x="120" y="284" width="800" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="140" y="322" font-size="22" font-weight="700">Country Settings</text><text x="140" y="366" font-size="20" font-weight="400">General settings entry ›</text><rect x="120" y="434" width="800" height="134" rx="12" fill="#ffffff" stroke="#ec874d" stroke-width="4"/><text x="140" y="472" font-size="22" font-weight="700">Advanced Settings</text><text x="140" y="516" font-size="20" font-weight="400">Advanced settings entry ›</text><text x="36" y="604" font-size="20" font-weight="400">The orange outline identifies the advanced entry. The chevron indicates</text><text x="36" y="640" font-size="20" font-weight="400">another settings level, not an applied change.</text></g></svg>
