<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 422" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜相同轉帳功能，不同品質</title><desc id="desc">兩家銀行是合成比較案例；卡片並列比較品質，不表示時間或因果。避免重複扣款也需要具體功能與規則來實現。</desc><rect width="1040" height="422" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="40" font-size="20" font-weight="700">圖 2｜相同轉帳功能，不同品質</text><rect x="32" y="92" width="476" height="200" rx="14" fill="#ffffff" stroke="#647681"/><text x="52" y="128" font-size="20" font-weight="700">銀行 A</text><text x="52" y="172" font-size="20" font-weight="400">功能存在，但品質欠佳</text><text x="52" y="208" font-size="20" font-weight="400">轉帳常需要等待很久，偶爾當機，錯誤訊息</text><text x="52" y="244" font-size="20" font-weight="400">不清楚。</text><rect x="532" y="92" width="476" height="200" rx="14" fill="#ffffff" stroke="#647681"/><text x="552" y="128" font-size="20" font-weight="700">銀行 B</text><text x="552" y="172" font-size="20" font-weight="400">功能與品質都經過設計</text><text x="552" y="208" font-size="20" font-weight="400">回應時間可預期，失敗時狀態清楚，能避免</text><text x="552" y="244" font-size="20" font-weight="400">重複扣款。</text><text x="32" y="328" font-size="20" font-weight="400">兩家銀行是合成比較案例；卡片並列比較品質，不表示時間或因果。避免重複扣款也需要具體功能與</text><text x="32" y="364" font-size="20" font-weight="400">規則來實現。</text></g></svg>
