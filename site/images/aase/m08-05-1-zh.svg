<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1272" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜任務導向易用性測試的工作流程</title><desc id="desc">箭頭表示六個研究步驟的順序；再測後依結果決定下一個問題，並非已證明改善有效。</desc><rect width="1060" height="1272" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 1｜任務導向易用性測試的工作流程</text><rect x="36" y="96" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="136" font-size="20" font-weight="700">1. 決定要研究的問題</text><text x="56" y="180" font-size="20" font-weight="400">例如：使用者能不能發現資料缺漏？</text><path d="M530 240v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="284" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="324" font-size="20" font-weight="700">2. 設計有目標的任務</text><text x="56" y="368" font-size="20" font-weight="400">只交代目的、情境和必要資料。</text><path d="M530 428v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="472" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="512" font-size="20" font-weight="700">3. 讓使用者自行操作</text><text x="56" y="556" font-size="20" font-weight="400">主持人不提供操作答案。</text><path d="M530 616v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="660" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="700" font-size="20" font-weight="700">4. 記錄可觀察的證據</text><text x="56" y="744" font-size="20" font-weight="400">行為、停頓、錯誤、協助、結果。</text><path d="M530 804v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="848" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="888" font-size="20" font-weight="700">5. 提出原因假設並改善</text><text x="56" y="932" font-size="20" font-weight="400">先選一個有證據支持的問題。</text><path d="M530 992v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="1036" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="1076" font-size="20" font-weight="700">6. 使用相同目標重新驗證</text><text x="56" y="1120" font-size="20" font-weight="400">確認改善是否真的有效。</text><text x="36" y="1212" font-size="20" font-weight="400">箭頭表示六個研究步驟的順序；再測後依結果決定下一個問題，並非已證明改善有效。</text></g></svg>
