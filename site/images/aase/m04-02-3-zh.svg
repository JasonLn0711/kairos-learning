<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 756" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜完整性檢查的判斷與回復</title><desc id="desc">先輸入並檢查，再依缺漏分支。補填或修改後均回到完整性檢查；無法取得資料可暫停或取消。箭頭表示條件路徑，不表示兩分支依序執行。</desc><rect width="1040" height="756" fill="#ffffff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="20" font-weight="700">圖 3｜完整性檢查的判斷與回復</text><rect x="36" y="96" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="132" font-size="20" font-weight="700">輸入資料 → 執行完整性檢查</text><text x="56" y="174" font-size="20" font-weight="400">資料有缺漏嗎？</text><path d="M520 232v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M268 254h504" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="276" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="312" font-size="20" font-weight="700">有缺漏</text><text x="56" y="354" font-size="20" font-weight="400">指出缺件並保留資料</text><path d="M268 410v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="454" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="490" font-size="20" font-weight="700">能取得正確資料？</text><text x="56" y="532" font-size="20" font-weight="400">能：補填並重新檢查</text><text x="56" y="566" font-size="20" font-weight="400">不能：暫停或取消</text><rect x="540" y="276" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="312" font-size="20" font-weight="700">無缺漏</text><text x="560" y="354" font-size="20" font-weight="400">預覽目前檢查結果</text><path d="M772 410v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="540" y="454" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="490" font-size="20" font-weight="700">資料又修改了嗎？</text><text x="560" y="532" font-size="20" font-weight="400">有：使舊結果失效並重查</text><text x="560" y="566" font-size="20" font-weight="400">沒有：確認並匯出</text><text x="36" y="664" font-size="20" font-weight="400">先輸入並檢查，再依缺漏分支。補填或修改後均回到完整性檢查；無法取得資料可暫停或取消。箭頭</text><text x="36" y="698" font-size="20" font-weight="400">表示條件路徑，不表示兩分支依序執行。</text></g></svg>
