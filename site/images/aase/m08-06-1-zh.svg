<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 804" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜從風險到回歸證據</title><desc id="desc">向下箭頭表示五個工作的先後順序；最後一格是回歸與交接工作，不代表測試已通過。</desc><rect width="1040" height="804" fill="#fbfcfc"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="42" font-size="24" font-weight="700">圖 1｜從風險到回歸證據</text><text x="64" y="94" font-size="22" font-weight="700">1. 需求與風險</text><text x="64" y="136" font-size="20" font-weight="400">什麼事情絕對不能發生？</text><path d="M520 180 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="226" font-size="22" font-weight="700">2. 設計負向情境</text><text x="64" y="268" font-size="20" font-weight="400">故意提供不合法輸入、錯誤狀態或未授權操作</text><path d="M520 312 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="358" font-size="22" font-weight="700">3. 執行測試並留下證據</text><text x="64" y="400" font-size="20" font-weight="400">比較預期結果與實際結果</text><path d="M520 444 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="490" font-size="22" font-weight="700">4. 定位問題與修正</text><text x="64" y="532" font-size="20" font-weight="400">找出根因，進行最小必要修改</text><path d="M520 576 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="594" width="968" height="110" rx="6" fill="#eaf6ef" stroke="#ccdfd3"/><text x="64" y="622" font-size="22" font-weight="700">5. 回歸測試與交接</text><text x="64" y="664" font-size="20" font-weight="400">重測原本問題與相關正常功能，留下版本及結果</text><text x="36" y="742" font-size="20" font-weight="400">向下箭頭表示五個工作的先後順序；最後一格是回歸與交接工作，不代表測試已通過。</text></g></svg>
