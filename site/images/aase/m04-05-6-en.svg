<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 838" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 6 | Two ways to handle results after a data change</title><desc id="desc">Arrows indicate a data change in one example. The lower cards compare alternative incorrect/correct strategies, not consecutive steps.</desc><rect width="1040" height="838" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 6 | Two ways to handle results after a data change</text><rect x="36" y="88" width="968" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="56" y="126" font-size="22" font-weight="700">Original data passes</text><text x="56" y="170" font-size="20" font-weight="400">Data A → check passes → result A</text><path d="M520 232v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="274" width="968" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="56" y="312" font-size="22" font-weight="700">User changes data</text><text x="56" y="356" font-size="20" font-weight="400">Data B; the previous result still refers to data A</text><path d="M520 418v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="460" width="458" height="226" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><rect x="46" y="470" width="438" height="50" rx="12" fill="#fce1e1" stroke="#d4dce1" stroke-width="1"/><text x="56" y="498" font-size="22" font-weight="700">Incorrect approach</text><text x="56" y="562" font-size="20" font-weight="400">Continue showing result A as</text><text x="56" y="598" font-size="20" font-weight="400">passed, misleading users into</text><text x="56" y="634" font-size="20" font-weight="400">thinking data B passed too.</text><rect x="546" y="460" width="458" height="226" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><rect x="556" y="470" width="438" height="50" rx="12" fill="#d9efe1" stroke="#d4dce1" stroke-width="1"/><text x="566" y="498" font-size="22" font-weight="700">Correct approach</text><text x="566" y="562" font-size="20" font-weight="400">Say that data has changed, the</text><text x="566" y="598" font-size="20" font-weight="400">old check is invalid and</text><text x="566" y="634" font-size="20" font-weight="400">rechecking is required.</text><text x="36" y="736" font-size="20" font-weight="400">Arrows indicate a data change in one example. The lower cards compare</text><text x="36" y="772" font-size="20" font-weight="400">alternative incorrect/correct strategies, not consecutive steps.</text></g></svg>
