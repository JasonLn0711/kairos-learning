<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 370" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜好的錯誤復原</title><desc id="desc">三個要素以加號相連，表示共同條件，不代表三個依序發生的畫面。</desc><rect width="1060" height="370" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 3｜好的錯誤復原</text><rect x="28" y="96" width="296" height="130" rx="14" fill="#edf1f5" stroke="#64748b"/><text x="48" y="132" font-size="20" font-weight="700">指出問題</text><text x="48" y="176" font-size="20" font-weight="400">具體說明哪裡需要修正。</text><text x="337" y="150" font-size="24">＋</text><rect x="372" y="96" width="296" height="166" rx="14" fill="#edf1f5" stroke="#64748b"/><text x="392" y="132" font-size="20" font-weight="700">保留進度</text><text x="392" y="176" font-size="20" font-weight="400">保留已完成且可安全保留</text><text x="392" y="212" font-size="20" font-weight="400">的工作。</text><text x="681" y="150" font-size="24">＋</text><rect x="716" y="96" width="296" height="166" rx="14" fill="#edf1f5" stroke="#64748b"/><text x="736" y="132" font-size="20" font-weight="700">提供下一步</text><text x="736" y="176" font-size="20" font-weight="400">說明補填、重新檢查、重</text><text x="736" y="212" font-size="20" font-weight="400">試或求助的動作。</text><text x="36" y="310" font-size="20" font-weight="400">三個要素以加號相連，表示共同條件，不代表三個依序發生的畫面。</text></g></svg>
