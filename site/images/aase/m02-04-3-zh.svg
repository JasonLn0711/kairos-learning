<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 936" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜Agent 任務控制卡</title><desc id="desc">教學範例；允許與禁止是並列權限，成功、停止與交付各有不同作用。實際限制還須由工具與執行環境強制執行。</desc><rect width="1040" height="936" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 3｜Agent 任務控制卡</text><rect x="36" y="94" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="128" font-size="22">目標</text><text x="56" y="170" font-size="20">修正週末三科無法儲存的問題。</text><rect x="36" y="236" width="460" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="270" font-size="22">可以做</text><text x="56" y="312" font-size="20">讀相關程式、修改指定檔案、執行測試。</text><rect x="544" y="236" width="460" height="124" rx="10" fill="#fbf0ed" stroke="#d4d8da"/><text x="564" y="270" font-size="22">不能做</text><text x="564" y="312" font-size="20">刪除正式資料、上傳私人資訊、自行發布。</text><rect x="36" y="378" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="412" font-size="22">成功標準</text><text x="56" y="454" font-size="20">週末三科可以儲存、平日三科依然被拒絕，相關自動測試通過。</text><rect x="36" y="520" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="554" font-size="22">停止條件</text><text x="56" y="596" font-size="20">規格矛盾、需要額外授權、工具無法使用，或達到預算與重試上限。</text><rect x="36" y="662" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="696" font-size="22">交付證據</text><text x="56" y="738" font-size="20">修改過的檔案、差異紀錄、實際測試結果與待確認事項。</text><text x="36" y="840" font-size="20">教學範例；允許與禁止是並列權限，成功、停止與交付各有不同作用。實際限制還須由工具與執行</text><text x="36" y="874" font-size="20">環境強制執行。</text></g></svg>
