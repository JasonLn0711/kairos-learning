<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 568" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜第一次試算的輸入與結果</title><desc id="desc">合成範例：數字用來辨認結果對應哪次輸入，不是保費公式。</desc><rect width="1040" height="568" fill="#fbfdfb"/><g fill="#173329" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 3｜第一次試算的輸入與結果</text><text x="36" y="100" font-size="20" font-weight="400">合成範例：數字用來辨認結果對應哪次輸入，不是保費公式。</text><rect x="36" y="138" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="166" font-size="22" font-weight="650">保障額度</text><text x="60" y="210" font-size="20" font-weight="400">100 萬元。</text><rect x="36" y="272" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="300" font-size="22" font-weight="650">假設保費</text><text x="60" y="344" font-size="20" font-weight="400">每年 12,000 元。</text><rect x="36" y="406" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="434" font-size="22" font-weight="650">試算結果：已產生</text><text x="60" y="478" font-size="20" font-weight="400">對應原輸入；改為 300 萬元時，此結果失效。</text></g></svg>
