<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1610" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Shipping-data state transitions</title><desc id="desc">Each row names a source → destination, followed by its event or condition. Rows are not sequential steps. Decision exits are alternatives. Retry applies to this data check; a transaction needs its actual status confirmed first.</desc><rect width="1040" height="1610" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="30" y="42" font-size="24" font-weight="700">Figure 3 | Shipping-data state transitions</text><text x="30" y="86" font-size="20" font-weight="400">Each row names a source → destination, followed by its event or</text><text x="30" y="120" font-size="20" font-weight="400">condition. Rows are not sequential steps. Decision exits are</text><text x="30" y="154" font-size="20" font-weight="400">alternatives. Retry applies to this data check; a transaction needs its</text><text x="30" y="188" font-size="20" font-weight="400">actual status confirmed first.</text><rect x="30" y="221" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="246" font-size="22" font-weight="700">Input → Data complete?</text><text x="50" y="292" font-size="20" font-weight="400">Select Check</text><rect x="30" y="345" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="370" font-size="22" font-weight="700">Data complete? → Missing: identify the field</text><text x="50" y="416" font-size="20" font-weight="400">No</text><rect x="30" y="469" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="494" font-size="22" font-weight="700">Missing: identify the field → Input</text><text x="50" y="540" font-size="20" font-weight="400">Fill omissions; retain other values</text><rect x="30" y="593" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="618" font-size="22" font-weight="700">Data complete? → Remote processing needed?</text><text x="50" y="664" font-size="20" font-weight="400">Yes</text><rect x="30" y="717" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="742" font-size="22" font-weight="700">Remote processing needed? → Check complete</text><text x="50" y="788" font-size="20" font-weight="400">No: local checking completes</text><rect x="30" y="841" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="866" font-size="22" font-weight="700">Remote processing needed? → Processing</text><text x="50" y="912" font-size="20" font-weight="400">Yes</text><rect x="30" y="965" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="990" font-size="22" font-weight="700">Processing → Check complete</text><text x="50" y="1036" font-size="20" font-weight="400">Success</text><rect x="30" y="1089" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="1114" font-size="22" font-weight="700">Processing → Technical failure</text><text x="50" y="1160" font-size="20" font-weight="400">Timeout or service fault</text><rect x="30" y="1213" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="1238" font-size="22" font-weight="700">Technical failure → Input</text><text x="50" y="1284" font-size="20" font-weight="400">Retry</text><rect x="30" y="1337" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="1362" font-size="22" font-weight="700">Check complete → Input</text><text x="50" y="1408" font-size="20" font-weight="400">Edit any field: invalidate the previous check</text><rect x="30" y="1461" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="1486" font-size="22" font-weight="700">Check complete → Preview / export</text><text x="50" y="1532" font-size="20" font-weight="400">Data unchanged</text></g></svg>
