<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 964" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜一個故事與四條規格</title><desc id="desc">代號供追溯與驗收引用；五列是不同規格角色，不表示五個執行步驟，也不代表已實作或通過測試。</desc><rect width="1040" height="964" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="40" font-size="20" font-weight="700">圖 4｜一個故事與四條規格</text><rect x="32" y="92" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="128" font-size="20" font-weight="700">S-01｜User Story</text><text x="52" y="172" font-size="20" font-weight="400">身為收件人員，我希望在匯出前知道哪些必要欄位沒有填寫，以便補齊後再交接。</text><rect x="32" y="238" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="274" font-size="20" font-weight="700">FR-01｜檢查缺漏</text><text x="52" y="318" font-size="20" font-weight="400">必要欄位不存在、為空字串或只有空白字元時，系統應將它列為缺漏。</text><rect x="32" y="384" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="420" font-size="20" font-weight="700">FR-02｜防止錯誤匯出</text><text x="52" y="464" font-size="20" font-weight="400">未通過完整性檢查時，不得產生標示為「完整」的匯出報告。</text><rect x="32" y="530" width="976" height="164" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="566" font-size="20" font-weight="700">NFR-01｜鍵盤可操作性</text><text x="52" y="610" font-size="20" font-weight="400">使用者應能只用鍵盤完成填寫、檢查、修正與匯出；操作焦點必須可辨識，且不應陷入無法離開</text><text x="52" y="646" font-size="20" font-weight="400">的操作區域。</text><rect x="32" y="712" width="976" height="164" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="748" font-size="20" font-weight="700">C-01｜資料與使用範圍</text><text x="52" y="792" font-size="20" font-weight="400">本次原型只處理合成資料，採單人本機操作，不連接真實收件系統，也不宣稱具有正式業務受理</text><text x="52" y="828" font-size="20" font-weight="400">能力。</text><text x="32" y="906" font-size="20" font-weight="400">代號供追溯與驗收引用；五列是不同規格角色，不表示五個執行步驟，也不代表已實作或通過測試。</text></g></svg>
