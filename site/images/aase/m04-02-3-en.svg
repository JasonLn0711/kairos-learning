<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 892" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3｜Decisions and recovery in completeness checking</title><desc id="desc">Enter and check, then branch on missing data. Both supplied data and edits return to checking. Unavailable information permits pausing or cancellation. Arrows denote conditional paths; the branches are not sequential.</desc><rect width="1040" height="892" fill="#ffffff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="20" font-weight="700">Figure 3｜Decisions and recovery in completeness checking</text><rect x="36" y="96" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="132" font-size="20" font-weight="700">Enter data → run the completeness check</text><text x="56" y="174" font-size="20" font-weight="400">Is any data missing?</text><path d="M520 232v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M268 254h504" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="276" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="312" font-size="20" font-weight="700">Missing data</text><text x="56" y="354" font-size="20" font-weight="400">Identify omissions and retain</text><text x="56" y="388" font-size="20" font-weight="400">entered data</text><path d="M268 444v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="488" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="524" font-size="20" font-weight="700">Can correct data be obtained?</text><text x="56" y="566" font-size="20" font-weight="400">Yes: fill it in and recheck</text><text x="56" y="600" font-size="20" font-weight="400">No: pause or cancel</text><rect x="540" y="276" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="312" font-size="20" font-weight="700">No missing data</text><text x="560" y="354" font-size="20" font-weight="400">Preview the current check</text><text x="560" y="388" font-size="20" font-weight="400">results</text><path d="M772 444v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="540" y="488" width="464" height="192" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="524" font-size="20" font-weight="700">Has the data changed again?</text><text x="560" y="566" font-size="20" font-weight="400">Yes: invalidate the old result</text><text x="560" y="600" font-size="20" font-weight="400">and recheck</text><text x="560" y="634" font-size="20" font-weight="400">No: confirm and export</text><text x="36" y="732" font-size="20" font-weight="400">Enter and check, then branch on missing data. Both supplied data and</text><text x="36" y="766" font-size="20" font-weight="400">edits return to checking. Unavailable information permits pausing or</text><text x="36" y="800" font-size="20" font-weight="400">cancellation. Arrows denote conditional paths; the branches are not</text><text x="36" y="834" font-size="20" font-weight="400">sequential.</text></g></svg>
