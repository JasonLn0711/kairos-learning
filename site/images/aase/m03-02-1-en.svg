<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 988" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | M03-02 Requirements Discovery</title><desc id="desc">Arrows show discovery work order. Retain unresolved issues at each step; an interview alone does not establish effectiveness.</desc><rect width="1040" height="988" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 1 | M03-02 Requirements Discovery</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">1. Find the right people (Who)</text><text x="60" y="148" font-size="20" font-weight="400">Who uses the system, who is affected, and who decides?</text><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="238" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="266" font-size="22" font-weight="650">2. Ask about work (Interview)</text><text x="60" y="310" font-size="20" font-weight="400">Ask people to describe something they actually did.</text><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="400" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="428" font-size="22" font-weight="650">3. Organize evidence (Evidence)</text><text x="60" y="472" font-size="20" font-weight="400">Separate reported accounts, your inferences and untested claims.</text><path d="M520 532v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="562" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="590" font-size="22" font-weight="650">4. Confirm rules (Decision)</text><text x="60" y="634" font-size="20" font-weight="400">Ask the accountable decision owner to clarify contradictions.</text><path d="M520 694v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="724" width="968" height="122" rx="10" fill="#eaf6ef" stroke="#91bca4"/><text x="60" y="752" font-size="22" font-weight="650">5. Form requirements (Requirement)</text><text x="60" y="796" font-size="20" font-weight="400">Record them in problem.md for design and testing.</text><text x="36" y="892" font-size="20" font-weight="400">Arrows show discovery work order. Retain unresolved issues at each</text><text x="36" y="928" font-size="20" font-weight="400">step; an interview alone does not establish effectiveness.</text></g></svg>
