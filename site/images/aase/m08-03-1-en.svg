<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 940" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | From Specification to Test Results</title><desc id="desc">Downward arrows show design and execution order; PASS and FAIL are alternative comparison outcomes.</desc><rect width="1060" height="940" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 1 | From Specification to Test Results</text><rect x="36" y="96" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">1. Specification</text><text x="56" y="176" font-size="20" font-weight="400">Decide which result is correct</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="278" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">2. Test Cases</text><text x="56" y="358" font-size="20" font-weight="400">Normal, invalid, boundary and exception cases</text><path d="M530 416v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="460" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="496" font-size="20" font-weight="700">3. Run pytest</text><text x="56" y="540" font-size="20" font-weight="400">Prepare input → call program → compare expected result</text><path d="M530 598v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="642" width="480" height="130" rx="12" fill="#f0f8f3" stroke="#64748b"/><text x="56" y="678" font-size="20" font-weight="700">✓ PASS</text><text x="56" y="722" font-size="20" font-weight="400">Meets the checked conditions</text><rect x="544" y="642" width="480" height="166" rx="12" fill="#fff5f5" stroke="#64748b"/><text x="564" y="678" font-size="20" font-weight="700">✗ FAIL</text><text x="564" y="722" font-size="20" font-weight="400">Unexpected result; investigate</text><text x="564" y="758" font-size="20" font-weight="400">the cause</text><text x="36" y="844" font-size="20" font-weight="400">Downward arrows show design and execution order; PASS and FAIL are</text><text x="36" y="880" font-size="20" font-weight="400">alternative comparison outcomes.</text></g></svg>
