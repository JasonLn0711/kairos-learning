<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 872" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜Workflow 與 Agent 混合</title><desc id="desc">箭頭表示依序交接：固定入口檢查 → 授權內探索 → 固定驗收與人類審查。中間 Agent 的內部迴圈在此省略；測試或審查未過不進入正式發布。</desc><rect width="1040" height="872" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 4｜Workflow 與 Agent 混合</text><rect x="36" y="94" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="128" font-size="22">使用者提交修復需求</text><text x="56" y="170" font-size="20">說明要解決的問題。</text><path d="M520 226V254m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="268" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="302" font-size="22">Workflow</text><text x="56" y="344" font-size="20">固定檢查權限、需求與操作範圍。</text><path d="M520 400V428m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="442" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#b54b25"/><text x="56" y="476" font-size="22">Agent</text><text x="56" y="518" font-size="20">在授權範圍內探索問題、修改程式、執行測試。</text><path d="M520 574V602m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="616" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="650" font-size="22">Workflow</text><text x="56" y="692" font-size="20">執行固定驗收測試、記錄結果、等待人類審查。</text><text x="36" y="776" font-size="20">箭頭表示依序交接：固定入口檢查 → 授權內探索 → 固定驗收與人類審查。中間 Agent 的內</text><text x="36" y="810" font-size="20">部迴圈在此省略；測試或審查未過不進入正式發布。</text></g></svg>
