<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 508" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜互動練習：改變成功阻擋數，看看結果</title><desc id="desc">四筆缺漏的固定合成案例；結果只供練習計算，不是實際測試證據。</desc><rect width="1040" height="508" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 3｜互動練習：改變成功阻擋數，看看結果</text><text x="36" y="104" font-size="22" font-weight="650">四筆缺漏中，成功阻擋   3 / 4</text><rect x="36" y="152" width="968" height="20" rx="10" fill="#e4e9ec"/><circle cx="762" cy="162" r="12" fill="#ffffff" stroke="#637982"/><text x="36" y="207" font-size="18" font-weight="400">0</text><text x="275" y="207" font-size="18" font-weight="400">1</text><text x="514" y="207" font-size="18" font-weight="400">2</text><text x="753" y="207" font-size="18" font-weight="400">3</text><text x="992" y="207" font-size="18" font-weight="400">4</text><text x="36" y="264" font-size="20" font-weight="400">缺漏阻擋率</text><text x="36" y="308" font-size="30" font-weight="650">75%</text><text x="530" y="264" font-size="22" font-weight="650">未達本版阻擋要求</text><text x="530" y="308" font-size="20" font-weight="400">本版要求 4 / 4 全數阻擋</text><text x="36" y="372" font-size="20" font-weight="400">還有 1 筆缺漏案例沒有成功阻擋，不能因其他正常案例成功，就宣稱這項規則已經通過。</text><text x="36" y="448" font-size="20" font-weight="400">四筆缺漏的固定合成案例；結果只供練習計算，不是實際測試證據。</text></g></svg>
