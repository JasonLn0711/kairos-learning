<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 808" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜瑕疵阻擋與良品放行</title><desc id="desc">固定四件瑕疵品、兩件良品。數據為教學用的合成案例，不是真實工廠測試紀錄；下載圖保留預設3／4與0／2，不隨操作改變。</desc><rect width="1040" height="808" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 3｜瑕疵阻擋與良品放行</text><rect x="36" y="76" width="968" height="158" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">有瑕疵的 4 件產品，成功阻擋幾件？</text><text x="60" y="148" font-size="20" font-weight="400">3 / 4</text><rect x="60" y="190" width="920" height="12" rx="6" fill="#e4e9ec"/><circle cx="750" cy="196" r="10" fill="#ffffff" stroke="#637982"/><rect x="36" y="244" width="968" height="158" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="272" font-size="22" font-weight="650">正常的 2 件產品，被錯誤阻擋幾件？</text><text x="60" y="316" font-size="20" font-weight="400">0 / 2</text><rect x="60" y="358" width="920" height="12" rx="6" fill="#e4e9ec"/><circle cx="60" cy="364" r="10" fill="#ffffff" stroke="#637982"/><rect x="36" y="412" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="440" font-size="22" font-weight="650">瑕疵阻擋率</text><text x="60" y="484" font-size="20" font-weight="400">75%</text><rect x="36" y="544" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="572" font-size="22" font-weight="650">良品正確放行率</text><text x="60" y="616" font-size="20" font-weight="400">100%</text><text x="36" y="712" font-size="20" font-weight="400">固定四件瑕疵品、兩件良品。數據為教學用的合成案例，不是真實工廠測試紀錄；下載圖保留預設</text><text x="36" y="748" font-size="20" font-weight="400">3／4與0／2，不隨操作改變。</text></g></svg>
