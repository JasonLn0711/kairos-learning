<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 616" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Explore the number of blocked cases</title><desc id="desc">Four fixed synthetic missing-input cases; the calculation is practice rather than actual test evidence.</desc><rect width="1040" height="616" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 3 | Explore the number of blocked cases</text><text x="36" y="104" font-size="22" font-weight="650">Missing-input cases successfully blocked   3 / 4</text><rect x="36" y="152" width="968" height="20" rx="10" fill="#e4e9ec"/><circle cx="762" cy="162" r="12" fill="#ffffff" stroke="#637982"/><text x="36" y="207" font-size="18" font-weight="400">0</text><text x="275" y="207" font-size="18" font-weight="400">1</text><text x="514" y="207" font-size="18" font-weight="400">2</text><text x="753" y="207" font-size="18" font-weight="400">3</text><text x="992" y="207" font-size="18" font-weight="400">4</text><text x="36" y="264" font-size="20" font-weight="400">Missing-input blocking rate</text><text x="36" y="308" font-size="30" font-weight="650">75%</text><text x="530" y="264" font-size="22" font-weight="650">Blocking requirement not met</text><text x="530" y="308" font-size="20" font-weight="400">This version requires all 4 / 4</text><text x="530" y="344" font-size="20" font-weight="400">cases to be blocked.</text><text x="36" y="408" font-size="20" font-weight="400">One missing-input case remains unblocked. Successful complete-input</text><text x="36" y="444" font-size="20" font-weight="400">cases do not make this rule pass.</text><text x="36" y="520" font-size="20" font-weight="400">Four fixed synthetic missing-input cases; the calculation is practice</text><text x="36" y="556" font-size="20" font-weight="400">rather than actual test evidence.</text></g></svg>
