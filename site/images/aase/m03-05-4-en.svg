<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 456" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4 | Check the timing boundaries</title><desc id="desc">The illustrative 15 and 10 minutes cover different intervals and do not establish a five-minute saving.</desc><rect width="1040" height="456" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 4 | Check the timing boundaries</text><rect x="36" y="76" width="476" height="202" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">Old workflow</text><text x="60" y="148" font-size="20" font-weight="400">15 minutes</text><text x="60" y="192" font-size="20" font-weight="400">Timing starts at opening</text><text x="60" y="228" font-size="20" font-weight="400">documents and organizing data.</text><rect x="528" y="76" width="476" height="238" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="552" y="104" font-size="22" font-weight="650">New workflow</text><text x="552" y="148" font-size="20" font-weight="400">10 minutes</text><text x="552" y="192" font-size="20" font-weight="400">Timing starts only after data</text><text x="552" y="228" font-size="20" font-weight="400">preparation, at pressing</text><text x="552" y="264" font-size="20" font-weight="400">Generate.</text><text x="36" y="360" font-size="20" font-weight="400">The illustrative 15 and 10 minutes cover different intervals and do</text><text x="36" y="396" font-size="20" font-weight="400">not establish a five-minute saving.</text></g></svg>
