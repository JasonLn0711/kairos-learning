<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 868" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜資料變更使舊結果失效</title><desc id="desc">箭頭表示事件順序。資料 B 是否合格，必須重新執行檢核。</desc><rect width="1060" height="868" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 4｜資料變更使舊結果失效</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">使用者輸入資料 A</text><text x="56" y="176" font-size="20" font-weight="400">取得這次輸入的三欄值</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="278" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">檢核通過，結果屬於資料 A</text><text x="56" y="358" font-size="20" font-weight="400">此結果只對 A 有效</text><path d="M530 416v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="460" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="496" font-size="20" font-weight="700">使用者修改成資料 B</text><text x="56" y="540" font-size="20" font-weight="400">輸入版本已改變</text><path d="M530 598v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="642" width="988" height="130" rx="14" fill="#fff5f5" stroke="#64748b"/><text x="56" y="678" font-size="20" font-weight="700">舊結果失效</text><text x="56" y="722" font-size="20" font-weight="400">重新執行檢核，才能知道 B 是否合格</text><text x="36" y="808" font-size="20" font-weight="400">箭頭表示事件順序。資料 B 是否合格，必須重新執行檢核。</text></g></svg>
