<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 904" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜TLS 終結後，下一段另行確認</title><desc id="desc">箭頭表示資料傳輸方向；此為假想架構，未驗證正式部署。</desc><rect width="1060" height="904" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 2｜TLS 終結後，下一段另行確認</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">顧客的瀏覽器</text><text x="56" y="176" font-size="20" font-weight="400">① HTTPS / TLS 加密 → 反向代理</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="278" width="988" height="166" rx="14" fill="#f1faf5" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">反向代理（Reverse Proxy）</text><text x="56" y="358" font-size="20" font-weight="400">例如 Nginx、負載平衡器；TLS 終結點：在這裡解密。② 新的一段連線：需要另外確認保護方</text><text x="56" y="394" font-size="20" font-weight="400">式 → 後端</text><path d="M530 452v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="496" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="532" font-size="20" font-weight="700">後端應用程式</text><text x="56" y="576" font-size="20" font-weight="400">處理會員、訂單及付款邏輯。③ 另一段資料庫連線 → 資料庫</text><path d="M530 634v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="678" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="714" font-size="20" font-weight="700">資料庫</text><text x="56" y="758" font-size="20" font-weight="400">該段傳輸保護與存取控制需獨立確認</text><text x="36" y="844" font-size="20" font-weight="400">箭頭表示資料傳輸方向；此為假想架構，未驗證正式部署。</text></g></svg>
