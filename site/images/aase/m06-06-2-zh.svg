<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1096" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜TLS 終結後，下一段另行確認</title><desc id="desc">箭頭表示資料傳輸方向；此為假想架構，未驗證正式部署。</desc><rect width="1060" height="1096" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 2｜TLS 終結後，下一段另行確認</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">顧客的瀏覽器</text><text x="56" y="176" font-size="20" font-weight="400">發起網站連線。</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="298" font-size="20" font-weight="400">① HTTPS / TLS 加密</text><rect x="36" y="354" width="988" height="130" rx="14" fill="#f1faf5" stroke="#64748b"/><text x="56" y="390" font-size="20" font-weight="700">反向代理（Reverse Proxy）</text><text x="56" y="434" font-size="20" font-weight="400">例如 Nginx、負載平衡器；TLS 終結點：在這裡解密。</text><path d="M530 492v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="556" font-size="20" font-weight="400">② 新的一段連線：需要另外確認保護方式</text><rect x="36" y="612" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="648" font-size="20" font-weight="700">後端應用程式</text><text x="56" y="692" font-size="20" font-weight="400">處理會員、訂單及付款邏輯。</text><path d="M530 750v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="814" font-size="20" font-weight="400">③ 另一段資料庫連線</text><rect x="36" y="870" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="906" font-size="20" font-weight="700">資料庫</text><text x="56" y="950" font-size="20" font-weight="400">該段傳輸保護與存取控制需獨立確認</text><text x="36" y="1036" font-size="20" font-weight="400">箭頭表示資料傳輸方向；此為假想架構，未驗證正式部署。</text></g></svg>
