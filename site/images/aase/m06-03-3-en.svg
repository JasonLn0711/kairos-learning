<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 896" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3｜C1 surroundings of the ordering system</title><desc id="desc">Customers/staff ↔ ordering system ↔ external payment platform. Bidirectional links show interactions, without specifying protocols or execution order.</desc><rect width="1060" height="896" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 3｜C1 surroundings of the ordering system</text><rect x="36" y="96" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="132" font-size="20" font-weight="700">Customers and restaurant staff</text><text x="56" y="176" font-size="20" font-weight="400">People / roles outside the system</text><path d="M520 242v28m-7-7 7 7 7-7M536 270V242m-7 7 7-7 7 7" fill="none" stroke="#46535f" stroke-width="2"/><rect x="36" y="290" width="988" height="240" rx="14" fill="#fbfcfd" stroke="#7295bf" stroke-dasharray="5 5"/><text x="56" y="326" font-size="20" font-weight="700">System Boundary</text><rect x="56" y="376" width="948" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="76" y="412" font-size="20" font-weight="700">Online ordering system</text><text x="76" y="456" font-size="20" font-weight="400">The system being designed; inside the system boundary</text><path d="M520 542v28m-7-7 7 7 7-7M536 570V542m-7 7 7-7 7 7" fill="none" stroke="#46535f" stroke-width="2"/><rect x="36" y="590" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="626" font-size="20" font-weight="700">Third-party payment platform</text><text x="56" y="670" font-size="20" font-weight="400">Payment service outside the system</text><text x="36" y="764" font-size="20" font-weight="400">Customers/staff ↔ ordering system ↔ external payment platform.</text><text x="36" y="800" font-size="20" font-weight="400">Bidirectional links show interactions, without specifying protocols or</text><text x="36" y="836" font-size="20" font-weight="400">execution order.</text></g></svg>
