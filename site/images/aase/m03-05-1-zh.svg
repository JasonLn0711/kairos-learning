<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1150" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜從問題到決策的六個環節</title><desc id="desc">箭頭表示判斷的閱讀順序，不保證改善或因果成立。這個流程可以反覆循環；如果證據不支持假設，就需要回頭修正，而不是勉強宣布成功。</desc><rect width="1040" height="1150" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 1｜從問題到決策的六個環節</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">1. Problem｜問題</text><text x="60" y="148" font-size="20" font-weight="400">病人等待時間過長</text><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="238" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="266" font-size="22" font-weight="650">2. Requirement｜需求</text><text x="60" y="310" font-size="20" font-weight="400">系統要能依報到狀態與看診規則安排候診流程</text><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="400" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="428" font-size="22" font-weight="650">3. Hypothesis｜假設</text><text x="60" y="472" font-size="20" font-weight="400">減少人工排程時間，可能縮短病人等待時間</text><path d="M520 532v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="562" width="968" height="122" rx="10" fill="#e9f2f7" stroke="#a8c8ed"/><text x="60" y="590" font-size="22" font-weight="650">4. Metric｜成功指標</text><text x="60" y="634" font-size="20" font-weight="400">候診時間、準時看診率、排程錯誤率</text><path d="M520 694v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="724" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="752" font-size="22" font-weight="650">5. Evidence｜證據</text><text x="60" y="796" font-size="20" font-weight="400">系統測試、前後比較、實際操作紀錄</text><path d="M520 856v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="886" width="968" height="122" rx="10" fill="#e9f7f2" stroke="#82ccb7"/><text x="60" y="914" font-size="22" font-weight="650">6. Decision｜決策</text><text x="60" y="958" font-size="20" font-weight="400">通過驗收、修改設計，或重新檢查問題</text><text x="36" y="1054" font-size="20" font-weight="400">箭頭表示判斷的閱讀順序，不保證改善或因果成立。這個流程可以反覆循環；如果證據不支持假設</text><text x="36" y="1090" font-size="20" font-weight="400">，就需要回頭修正，而不是勉強宣布成功。</text></g></svg>
