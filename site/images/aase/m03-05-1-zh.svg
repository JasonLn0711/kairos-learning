<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1114" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜從問題到決策</title><desc id="desc">六步呈現需求、設計假設、指標與證據的關係；證據仍可能要求回頭修正。</desc><rect width="1040" height="1114" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 1｜從問題到決策</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">1. Problem｜問題</text><text x="60" y="148" font-size="20" font-weight="400">使用者經常漏填資料，導致報告錯誤</text><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="238" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="266" font-size="22" font-weight="650">2. Requirement｜需求</text><text x="60" y="310" font-size="20" font-weight="400">資料缺漏時，系統不得匯出完整報告</text><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="400" width="968" height="122" rx="10" fill="#e9f2f7" stroke="#d9eaf4"/><text x="60" y="428" font-size="22" font-weight="650">3. Hypothesis｜假設</text><text x="60" y="472" font-size="20" font-weight="400">告訴使用者缺少什麼，就可能讓他自行修正</text><path d="M520 532v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="562" width="968" height="122" rx="10" fill="#e9f2f7" stroke="#d9eaf4"/><text x="60" y="590" font-size="22" font-weight="650">4. Metric｜成功指標</text><text x="60" y="634" font-size="20" font-weight="400">缺漏阻擋率、無提示完成率、完成時間</text><path d="M520 694v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="724" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="752" font-size="22" font-weight="650">5. Evidence｜測試證據</text><text x="60" y="796" font-size="20" font-weight="400">測試紀錄、實際操作結果、錯誤案例</text><path d="M520 856v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="886" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="914" font-size="22" font-weight="650">6. Decision｜決策</text><text x="60" y="958" font-size="20" font-weight="400">通過驗收、修正設計，或重新檢查需求</text><text x="36" y="1054" font-size="20" font-weight="400">六步呈現需求、設計假設、指標與證據的關係；證據仍可能要求回頭修正。</text></g></svg>
