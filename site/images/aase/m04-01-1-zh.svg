<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 814" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜醫院報到的三種設計問題</title><desc id="desc">UI、HCI、UX 是並列的分析視角；使用者的目標是順利就醫。</desc><rect width="1040" height="814" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 1｜醫院報到的三種設計問題</text><rect x="36" y="104" width="968" height="178" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="136" font-size="21" font-weight="700">UI — User Interface（使用者介面）</text><text x="56" y="186" font-size="20" font-weight="400">報到機螢幕上的按鈕、字體、顏色、文字提示、插卡指示等，應該如何呈現？</text><text x="56" y="230" font-size="20" font-weight="400">例如：「確認報到」按鈕是否太小？長輩能不能看清楚？</text><rect x="36" y="306" width="968" height="214" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="338" font-size="21" font-weight="700">HCI — Human–Computer Interaction（人機互動）</text><text x="56" y="388" font-size="20" font-weight="400">人如何理解機器的指示、判斷下一步，以及操作機器？</text><text x="56" y="432" font-size="20" font-weight="400">例如：畫面寫著「完成」，病人以為已經看診報到，但系統其實只確認健保卡讀取成功。為什麼會</text><text x="56" y="468" font-size="20" font-weight="400">誤解？</text><rect x="36" y="544" width="968" height="178" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="576" font-size="21" font-weight="700">UX — User Experience（使用者經驗）</text><text x="56" y="626" font-size="20" font-weight="400">從到醫院、報到、候診、看診、領藥到離院，整體經驗好不好？</text><text x="56" y="670" font-size="20" font-weight="400">例如：報到機操作只要 20 秒，但報到後沒有告訴病人診間在哪裡，病人還是可能迷路。</text><text x="36" y="746" font-size="20" font-weight="400">UI、HCI、UX 是並列的分析視角；使用者的目標是順利就醫。</text></g></svg>
