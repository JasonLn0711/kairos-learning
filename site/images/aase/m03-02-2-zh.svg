<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 876" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜分開記錄四層資訊</title><desc id="desc">四層表示不同性質的資訊，不是自動成立的因果鏈；供述仍需交叉確認，解法仍需試用。</desc><rect width="1040" height="876" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 2｜分開記錄四層資訊</text><rect x="36" y="76" width="968" height="166" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">第一層：供述（Statement）</text><text x="60" y="148" font-size="20" font-weight="400">收件人員說，他會圈出空白欄位。</text><text x="60" y="192" font-size="20" font-weight="400">這是受訪者的說法，尚不等於我們已觀察到。</text><rect x="36" y="252" width="968" height="166" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="280" font-size="22" font-weight="650">第二層：推論（Inference）</text><text x="60" y="324" font-size="20" font-weight="400">具體指出缺漏欄位，可能可以減少補件溝通。</text><text x="60" y="368" font-size="20" font-weight="400">這是分析者提出的解釋，尚未證實。</text><rect x="36" y="428" width="968" height="166" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="456" font-size="22" font-weight="650">第三層：需求候選（Requirement Candidate）</text><text x="60" y="500" font-size="20" font-weight="400">送件者需要清楚知道哪些欄位要補齊。</text><text x="60" y="544" font-size="20" font-weight="400">先確認這是不是真正需要支援的工作成果。</text><rect x="36" y="604" width="968" height="166" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="632" font-size="22" font-weight="650">第四層：待驗證解法（Solution Hypothesis）</text><text x="60" y="676" font-size="20" font-weight="400">設計缺漏清單，讓送件者試用，觀察是否能正確補齊。</text><text x="60" y="720" font-size="20" font-weight="400">需要測試，而不是直接假設這個設計有效。</text><text x="36" y="816" font-size="20" font-weight="400">四層表示不同性質的資訊，不是自動成立的因果鏈；供述仍需交叉確認，解法仍需試用。</text></g></svg>
