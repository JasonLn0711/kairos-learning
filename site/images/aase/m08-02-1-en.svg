<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | The small TDD cycle</title><desc id="desc">Arrows show the next development step. After refactoring, select the next small requirement and return to Red. Retain verifiable results each time.</desc><rect width="1060" height="780" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 1 | The small TDD cycle</text><rect x="36" y="96" width="900" height="130" rx="14" fill="#fcf1f2" stroke="#c43c46"/><text x="56" y="132" font-size="20" font-weight="700">1. Red</text><text x="56" y="176" font-size="20" font-weight="400">Write a test and confirm the requirement is unmet</text><path d="M486 236v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="286" width="900" height="130" rx="14" fill="#edf8f2" stroke="#16804d"/><text x="56" y="322" font-size="20" font-weight="700">2. Green</text><text x="56" y="366" font-size="20" font-weight="400">Make a minimal repair so the same tests pass</text><path d="M486 426v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="476" width="900" height="130" rx="14" fill="#eef4fc" stroke="#3477c6"/><text x="56" y="512" font-size="20" font-weight="700">3. Refactor</text><text x="56" y="556" font-size="20" font-weight="400">Organize internal structure and rerun tests</text><path d="M936 571H986Q1010 571 1010 547V144Q1010 120 986 120H952m10-8-10 8 10 8" fill="none" stroke="#7c8792" stroke-width="3" stroke-dasharray="8 6"/><text x="36" y="648" font-size="20" font-weight="400">Arrows show the next development step. After refactoring, select the</text><text x="36" y="684" font-size="20" font-weight="400">next small requirement and return to Red. Retain verifiable results</text><text x="36" y="720" font-size="20" font-weight="400">each time.</text></g></svg>
