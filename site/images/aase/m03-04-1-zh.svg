<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 628" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜一個完整的最小流程</title><desc id="desc">客人點餐後檢查食材；有食材與沒有食材為條件分支，並非先後步驟。</desc><rect width="1040" height="628" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 1｜一個完整的最小流程</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">客人點餐</text><text x="60" y="148" font-size="20" font-weight="400">輸入需求</text><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="238" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="266" font-size="22" font-weight="650">確認是否有食材</text><text x="60" y="310" font-size="20" font-weight="400">檢查條件</text><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="400" width="476" height="122" rx="10" fill="#eaf6ef" stroke="#91bca4"/><text x="60" y="428" font-size="22" font-weight="650">有食材</text><text x="60" y="472" font-size="20" font-weight="400">製作並交付</text><rect x="528" y="400" width="476" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="552" y="428" font-size="22" font-weight="650">沒有食材</text><text x="552" y="472" font-size="20" font-weight="400">告知並提供替代方案</text><text x="36" y="568" font-size="20" font-weight="400">客人點餐後檢查食材；有食材與沒有食材為條件分支，並非先後步驟。</text></g></svg>
