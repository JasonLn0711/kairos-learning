<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1064" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜最小完整服務流程</title><desc id="desc">箭頭表示服務步驟順序。顧客能完成購買，你也能知道這門生意是否值得繼續。</desc><rect width="1040" height="1064" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 1｜最小完整服務流程</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="104" font-size="22" font-weight="650">顧客點餐</text><text x="60" y="148" font-size="20" font-weight="400">選擇本次供應的便當</text><path d="M520 204v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="256" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="284" font-size="22" font-weight="650">確認訂單</text><text x="60" y="328" font-size="20" font-weight="400">確認品項與交付安排</text><path d="M520 384v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="436" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="464" font-size="22" font-weight="650">製作餐點</text><text x="60" y="508" font-size="20" font-weight="400">完成承諾的餐點</text><path d="M520 564v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="616" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="644" font-size="22" font-weight="650">處理異常</text><text x="60" y="688" font-size="20" font-weight="400">處理缺貨或無法交付的情況</text><path d="M520 744v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="796" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="824" font-size="22" font-weight="650">交付餐點</text><text x="60" y="868" font-size="20" font-weight="400">讓顧客取得餐點</text><text x="36" y="1004" font-size="20" font-weight="400">箭頭表示服務步驟順序。顧客能完成購買，你也能知道這門生意是否值得繼續。</text></g></svg>
