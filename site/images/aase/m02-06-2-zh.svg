<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 334" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜只讀任務的允許與禁止範圍</title><desc id="desc">兩欄比較同一任務的權限邊界，沒有先後流程；綠色與紅色之外，也用文字明列狀態。</desc><rect width="1040" height="334" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 2｜只讀任務的允許與禁止範圍</text><rect x="36" y="70" width="476" height="158" rx="10" fill="#eaf6ef" stroke="#91bca4"/><text x="56" y="98" font-size="22" font-weight="650">允許</text><text x="56" y="142" font-size="20" font-weight="400">讀取指定專案文件；檢查文件版本；回報讀</text><text x="56" y="178" font-size="20" font-weight="400">取結果。</text><rect x="528" y="70" width="476" height="158" rx="10" fill="#fff5f4" stroke="#cba9a4"/><text x="548" y="98" font-size="22" font-weight="650">不允許</text><text x="548" y="142" font-size="20" font-weight="400">刪除或改寫檔案；讀取其他專案；將資料傳</text><text x="548" y="178" font-size="20" font-weight="400">送到外網。</text><text x="36" y="274" font-size="20" font-weight="400">兩欄比較同一任務的權限邊界，沒有先後流程；綠色與紅色之外，也用文字明列狀態。</text></g></svg>
