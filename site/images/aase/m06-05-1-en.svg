<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 788" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Four factors in an authorization decision</title><desc id="desc">The four rows contribute to one decision; they are not sequential steps.</desc><rect width="1060" height="788" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 1 | Four factors in an authorization decision</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Subject</text><text x="56" y="176" font-size="20" font-weight="400">Who is making the request?</text><rect x="36" y="242" width="988" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="278" font-size="20" font-weight="700">Resource</text><text x="56" y="322" font-size="20" font-weight="400">Which record is requested?</text><rect x="36" y="388" width="988" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="424" font-size="20" font-weight="700">Action</text><text x="56" y="468" font-size="20" font-weight="400">Read, change or export?</text><rect x="36" y="534" width="988" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="570" font-size="20" font-weight="700">Context</text><text x="56" y="614" font-size="20" font-weight="400">Are time, case relationship and other conditions satisfied?</text><text x="36" y="692" font-size="20" font-weight="400">The four rows contribute to one decision; they are not sequential</text><text x="36" y="728" font-size="20" font-weight="400">steps.</text></g></svg>
