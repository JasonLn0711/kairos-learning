<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜手風琴面板：標題持續可見</title><desc id="desc">靜態結構示意：三個標題中，只有第二個面板展開。符號表示狀態，不是先後步驟；實際控制需支援鍵盤與展開狀態。</desc><rect width="1040" height="660" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 4｜手風琴面板：標題持續可見</text><rect x="120" y="88" width="800" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="140" y="126" font-size="22" font-weight="700">標題一 Heading ▾</text><text x="140" y="170" font-size="20" font-weight="400">已收合，保留標題。</text><rect x="120" y="238" width="800" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="140" y="276" font-size="22" font-weight="700">標題二 Heading ▴</text><text x="140" y="320" font-size="20" font-weight="400">已展開：面板在手風琴展開時出現。</text><rect x="120" y="388" width="800" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="140" y="426" font-size="22" font-weight="700">標題三 Heading ▾</text><text x="140" y="470" font-size="20" font-weight="400">已收合，保留標題。</text><text x="36" y="558" font-size="20" font-weight="400">靜態結構示意：三個標題中，只有第二個面板展開。符號表示狀態，不是先後步驟；實際控制需支援鍵盤與</text><text x="36" y="594" font-size="20" font-weight="400">展開狀態。</text></g></svg>
