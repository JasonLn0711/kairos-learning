<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1990" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 · Completeness checking: decisions and recovery</title><desc id="desc">Follow the explicitly named destination at each decision. Return paths retain entered data; editing invalidates the old result. Arrows describe control flow, not elapsed time or business approval.</desc><rect width="1040" height="1990" fill="#fbfdfb"/><g fill="#173329" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 2 · Completeness checking: decisions and recovery</text><text x="36" y="100" font-size="20" font-weight="400">Follow the explicitly named destination at each decision. Return</text><text x="36" y="136" font-size="20" font-weight="400">paths retain entered data; editing invalidates the old result. Arrows</text><text x="36" y="172" font-size="20" font-weight="400">describe control flow, not elapsed time or business approval.</text><rect x="36" y="210" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="238" font-size="22" font-weight="650">Start</text><text x="60" y="282" font-size="20" font-weight="400">→ Enter required fields.</text><rect x="36" y="344" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="372" font-size="22" font-weight="650">Enter required fields</text><text x="60" y="416" font-size="20" font-weight="400">Application number, applicant code and document type → Cancel?</text><rect x="36" y="478" width="968" height="122" rx="12" fill="#e3f2e9" stroke="#658f76" stroke-dasharray="6 4"/><text x="60" y="506" font-size="22" font-weight="650">Cancel?</text><text x="60" y="550" font-size="20" font-weight="400">Yes → End without a report. No → Check current input.</text><rect x="36" y="612" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="640" font-size="22" font-weight="650">Check current input</text><text x="60" y="684" font-size="20" font-weight="400">→ Required fields complete?</text><rect x="36" y="746" width="968" height="158" rx="12" fill="#e3f2e9" stroke="#658f76" stroke-dasharray="6 4"/><text x="60" y="774" font-size="22" font-weight="650">Required fields complete?</text><text x="60" y="818" font-size="20" font-weight="400">No → Show omissions and retain values. Yes → Preview checked result</text><text x="60" y="854" font-size="20" font-weight="400">.</text><rect x="36" y="916" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="944" font-size="22" font-weight="650">Show omissions and retain values</text><text x="60" y="988" font-size="20" font-weight="400">→ Enter required fields; correct omissions and check again.</text><rect x="36" y="1050" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="1078" font-size="22" font-weight="650">Preview checked result</text><text x="60" y="1122" font-size="20" font-weight="400">→ Edit data?</text><rect x="36" y="1184" width="968" height="122" rx="12" fill="#e3f2e9" stroke="#658f76" stroke-dasharray="6 4"/><text x="60" y="1212" font-size="22" font-weight="650">Edit data?</text><text x="60" y="1256" font-size="20" font-weight="400">Yes → Invalidate previous result. No → Confirm export?</text><rect x="36" y="1318" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="1346" font-size="22" font-weight="650">Invalidate previous result</text><text x="60" y="1390" font-size="20" font-weight="400">→ Enter required fields; a new check is required.</text><rect x="36" y="1452" width="968" height="158" rx="12" fill="#e3f2e9" stroke="#658f76" stroke-dasharray="6 4"/><text x="60" y="1480" font-size="22" font-weight="650">Confirm export?</text><text x="60" y="1524" font-size="20" font-weight="400">Yes → Export report → Task complete. No/cancel → End without a</text><text x="60" y="1560" font-size="20" font-weight="400">report.</text><rect x="36" y="1622" width="968" height="158" rx="28" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="1650" font-size="22" font-weight="650">Export report → Task complete</text><text x="60" y="1694" font-size="20" font-weight="400">The report corresponds to current checked input; no official</text><text x="60" y="1730" font-size="20" font-weight="400">acceptance is implied.</text><rect x="36" y="1792" width="968" height="158" rx="28" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="1820" font-size="22" font-weight="650">End without a report</text><text x="60" y="1864" font-size="20" font-weight="400">No new report is produced in this task. Draft retention requires a</text><text x="60" y="1900" font-size="20" font-weight="400">separate decision.</text></g></svg>
