<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 624" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜證據強度的差別</title><desc id="desc">三欄逐列比較主張、證據與判斷。</desc><rect width="1060" height="624" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 3｜證據強度的差別</text><rect x="36" y="96" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="132" font-size="20" font-weight="700">AI 說法</text><rect x="372" y="96" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="392" y="132" font-size="20" font-weight="700">實際證據</text><rect x="708" y="96" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="728" y="132" font-size="20" font-weight="700">可合理判斷</text><rect x="36" y="200" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="242" font-size="20" font-weight="400">程式已完成</text><rect x="372" y="200" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="392" y="242" font-size="20" font-weight="400">只有文字摘要</text><rect x="708" y="200" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="728" y="242" font-size="20" font-weight="400">尚未證實</text><rect x="36" y="304" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="346" font-size="20" font-weight="400">測試成功</text><rect x="372" y="304" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="392" y="346" font-size="20" font-weight="400">表單測試 4 passed</text><rect x="708" y="304" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="728" y="346" font-size="20" font-weight="400">僅證明該批測試通過</text><rect x="36" y="408" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="450" font-size="20" font-weight="400">匯出功能正確</text><rect x="372" y="408" width="316" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="392" y="450" font-size="20" font-weight="400">匯出測試通過，且實際下載</text><text x="392" y="486" font-size="20" font-weight="400">內容核對正確</text><rect x="708" y="408" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="728" y="450" font-size="20" font-weight="400">有較直接的支持證據</text><text x="36" y="564" font-size="20" font-weight="400">三欄逐列比較主張、證據與判斷。</text></g></svg>
