<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1048" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜review-notes.md — 範例</title><desc id="desc">以下全為假設示例，不能視為已實測結果。</desc><rect width="1060" height="1048" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 5｜review-notes.md — 範例</text><rect x="36" y="96" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="132" font-size="20" font-weight="700">任務</text><text x="56" y="174" font-size="20" font-weight="400">資料檢核與報告匯出</text><rect x="36" y="242" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="278" font-size="20" font-weight="700">驗收要求</text><text x="56" y="320" font-size="20" font-weight="400">缺漏資料不得產生完整報告。</text><rect x="36" y="388" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="424" font-size="20" font-weight="700">修改檔案</text><text x="56" y="466" font-size="20" font-weight="400">app.py、rules.py、tests/</text><rect x="36" y="534" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="570" font-size="20" font-weight="700">實際工具結果（假設）</text><text x="56" y="612" font-size="20" font-weight="400">在表單切片執行 pytest，4 個測試通過。</text><rect x="36" y="680" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="716" font-size="20" font-weight="700">發現問題</text><text x="56" y="758" font-size="20" font-weight="400">匯出時的重新驗證被移除；尚無證據顯示下載內容經過驗證。</text><rect x="36" y="826" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="862" font-size="20" font-weight="700">決策：要求修正</text><text x="56" y="904" font-size="20" font-weight="400">理由：不符合驗收規格，現有測試不足以證明匯出功能正確。</text><text x="36" y="988" font-size="20" font-weight="400">以下全為假設示例，不能視為已實測結果。</text></g></svg>
