<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 2346" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜餐廳訂餐系統與外界</title><desc id="desc">假設金流與外送均已實際串接。箭頭標明互動方向、資料與目的，不表示執行時序；回覆以獨立方向列出。</desc><rect width="1040" height="2346" fill="#fff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="40" y="44" font-size="24" font-weight="700">圖 1｜餐廳訂餐系統與外界</text><text x="40" y="98" font-size="20" font-weight="700">系統範圍外</text><rect x="40" y="144" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#36751b" stroke-width="2"/><text x="58" y="176" font-size="22" font-weight="700">顧客</text><text x="58" y="216" font-size="20" font-weight="400">人／角色 · 選餐點、送出訂單。</text><rect x="40" y="286" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="318" font-size="22" font-weight="700">金流系統</text><text x="58" y="358" font-size="20" font-weight="400">軟體系統 · 處理付款並回傳交易結果。</text><rect x="40" y="428" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="460" font-size="22" font-weight="700">外送平台</text><text x="58" y="500" font-size="20" font-weight="400">軟體系統 · 安排配送並提供配送狀態。</text><text x="40" y="586" font-size="20" font-weight="700">系統範圍內：</text><text x="40" y="632" font-size="20" font-weight="400">餐廳訂餐系統</text><rect x="28" y="670" width="984" height="140" rx="14" fill="none" stroke="#3074aa" stroke-width="2" stroke-dasharray="8 5"/><rect x="40" y="678" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="710" font-size="22" font-weight="700">餐廳訂餐系統</text><text x="58" y="750" font-size="20" font-weight="400">軟體系統 · 接收訂單、管理訂餐狀態。</text><text x="40" y="836" font-size="22" font-weight="700">有方向的關係</text><text x="64" y="914" font-size="20" font-weight="700">顧客</text><path d="M78 952v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1008" font-size="20" font-weight="700">餐廳訂餐系統</text><text x="64" y="1050" font-size="20" font-weight="400">選餐點並送出訂單</text><path d="M40 1100H1000" stroke="#cbd5e1"/><text x="64" y="1140" font-size="20" font-weight="700">餐廳訂餐系統</text><path d="M78 1178v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1234" font-size="20" font-weight="700">顧客</text><text x="64" y="1276" font-size="20" font-weight="400">提供訂餐狀態</text><path d="M40 1326H1000" stroke="#cbd5e1"/><text x="64" y="1366" font-size="20" font-weight="700">餐廳訂餐系統</text><path d="M78 1404v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1460" font-size="20" font-weight="700">金流系統</text><text x="64" y="1502" font-size="20" font-weight="400">送出付款請求</text><path d="M40 1552H1000" stroke="#cbd5e1"/><text x="64" y="1592" font-size="20" font-weight="700">金流系統</text><path d="M78 1630v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1686" font-size="20" font-weight="700">餐廳訂餐系統</text><text x="64" y="1728" font-size="20" font-weight="400">回傳交易結果</text><path d="M40 1778H1000" stroke="#cbd5e1"/><text x="64" y="1818" font-size="20" font-weight="700">餐廳訂餐系統</text><path d="M78 1856v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1912" font-size="20" font-weight="700">外送平台</text><text x="64" y="1954" font-size="20" font-weight="400">提出配送要求</text><path d="M40 2004H1000" stroke="#cbd5e1"/><text x="64" y="2044" font-size="20" font-weight="700">外送平台</text><path d="M78 2082v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="2138" font-size="20" font-weight="700">餐廳訂餐系統</text><text x="64" y="2180" font-size="20" font-weight="400">回傳配送狀態</text><path d="M40 2230H1000" stroke="#cbd5e1"/><text x="40" y="2254" font-size="20" font-weight="400">假設金流與外送均已實際串接。箭頭標明互動方向、資料與目的，不表示執行時序；回覆以獨立方向</text><text x="40" y="2288" font-size="20" font-weight="400">列出。</text></g></svg>
