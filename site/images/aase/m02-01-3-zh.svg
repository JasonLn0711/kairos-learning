<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 335" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜「文件」的假設性向量</title><desc id="desc">實際模型通常有更多維度。這四個數字僅用於教學，不表示真實的 Token 向量，也不是四項人工定義的屬性。</desc><rect width="1040" height="335" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 3｜「文件」的假設性向量</text><rect x="36.0" y="70" width="226.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="98" font-size="22">0.2</text><text x="56.0" y="142" font-size="20">第 1 維</text><rect x="278.0" y="70" width="226.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="298.0" y="98" font-size="22">−0.7</text><text x="298.0" y="142" font-size="20">第 2 維</text><rect x="520.0" y="70" width="226.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="540.0" y="98" font-size="22">1.1</text><text x="540.0" y="142" font-size="20">第 3 維</text><rect x="762.0" y="70" width="226.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="782.0" y="98" font-size="22">0.4</text><text x="782.0" y="142" font-size="20">第 4 維</text><text x="36" y="243" font-size="20">實際模型通常有更多維度。這四個數字僅用於教學，不表示真實的 Token 向量，也不是四項人</text><text x="36" y="277" font-size="20">工定義的屬性。</text></g></svg>
