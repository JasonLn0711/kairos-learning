<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 633" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜上下文預算互動</title><desc id="desc">假設上限 10,000 Token，輸入與預留回答共用預算。以下數值是日誌 500 的靜態預設；容量足夠不保證資訊被正確使用。這不是任何特定模型的實際限制。</desc><rect width="1040" height="633" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 3｜上下文預算互動</text><text x="36" y="98" font-size="28">9,500 / 10,000 Token</text><rect x="36" y="144" width="968" height="24" rx="10" fill="#e9ebed" stroke="#d4d8da"/><rect x="36" y="144" width="96.80000000000001" height="24" fill="#637e8d"/><rect x="132.8" y="144" width="193.60000000000002" height="24" fill="#618d7b"/><rect x="326.40000000000003" y="144" width="435.6" height="24" fill="#b9914d"/><rect x="762.0" y="144" width="145.2" height="24" fill="#92799f"/><rect x="907.2" y="144" width="48.400000000000006" height="24" fill="#bd735e"/><text x="36" y="209" font-size="20">系統規則: 1,000</text><text x="36" y="253" font-size="20">需求及程式: 2,000</text><text x="36" y="297" font-size="20">測試紀錄: 4,500</text><text x="36" y="341" font-size="20">預留回答: 1,500</text><text x="36" y="385" font-size="20">額外日誌: 500</text><text x="36" y="441" font-size="20">剩餘 500 Token；日誌範圍 0–3,000。</text><text x="36" y="487" font-size="20">1,800 Token 日誌 → 10,800；超出 800。</text><text x="36" y="541" font-size="20">假設上限 10,000 Token，輸入與預留回答共用預算。以下數值是日誌 500 的靜態預設；容</text><text x="36" y="575" font-size="20">量足夠不保證資訊被正確使用。這不是任何特定模型的實際限制。</text></g></svg>
