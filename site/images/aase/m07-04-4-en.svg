<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 904" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4 | Input changes invalidate old results</title><desc id="desc">Arrows show event order. Data B requires another check before its validity is known.</desc><rect width="1060" height="904" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 4 | Input changes invalidate old results</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">User enters data A</text><text x="56" y="176" font-size="20" font-weight="400">Read this input’s three values</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="278" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">Check passes; result belongs to A</text><text x="56" y="358" font-size="20" font-weight="400">The result applies only to A</text><path d="M530 416v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="460" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="496" font-size="20" font-weight="700">User changes input to data B</text><text x="56" y="540" font-size="20" font-weight="400">The input version has changed</text><path d="M530 598v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="642" width="988" height="130" rx="14" fill="#fff5f5" stroke="#64748b"/><text x="56" y="678" font-size="20" font-weight="700">Old result is invalid</text><text x="56" y="722" font-size="20" font-weight="400">Check again to determine whether B passes</text><text x="36" y="808" font-size="20" font-weight="400">Arrows show event order. Data B requires another check before its</text><text x="36" y="844" font-size="20" font-weight="400">validity is known.</text></g></svg>
