<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 682" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜把真正的工作拆成任務</title><desc id="desc">依序檢查每一步的角色、資訊、成功條件與例外。</desc><rect width="1040" height="682" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 5｜把真正的工作拆成任務</text><text x="520" y="102" text-anchor="middle" font-size="20">使用者收到案件</text><path d="M520 136v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><text x="520" y="194" text-anchor="middle" font-size="20">尋找必要資料</text><path d="M520 228v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><text x="520" y="286" text-anchor="middle" font-size="20">填寫表單</text><path d="M520 320v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><text x="520" y="378" text-anchor="middle" font-size="20">發現缺漏並修正</text><path d="M520 412v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><text x="520" y="470" text-anchor="middle" font-size="20">檢查與匯出報告</text><path d="M520 504v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><text x="520" y="562" text-anchor="middle" font-size="20">交給下一位承辦人</text><text x="36" y="620" font-size="20" font-weight="400">依序檢查每一步的角色、資訊、成功條件與例外。</text></g></svg>
