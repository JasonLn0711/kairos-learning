<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1256" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 6 | Integrated case: AI quality inspection in manufacturing</title><desc id="desc">All numbers are hypothetical. The study arrangement, sample representativeness and timing boundaries have not been provided.</desc><rect width="1040" height="1256" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 6 | Integrated case: AI quality inspection in</text><text x="36" y="80" font-size="24" font-weight="650">manufacturing</text><rect x="36" y="112" width="968" height="210" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="140" font-size="22" font-weight="650">The company makes three claims</text><text x="60" y="184" font-size="20" font-weight="400">“AI has been successfully launched.”</text><text x="60" y="228" font-size="20" font-weight="400">“Defect detection performs well.”</text><text x="60" y="272" font-size="20" font-weight="400">“Overall factory production efficiency has improved by 30%.”</text><rect x="36" y="332" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="360" font-size="22" font-weight="650">Genuinely defective products</text><text x="60" y="404" font-size="20" font-weight="400">20 products</text><rect x="36" y="464" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="492" font-size="22" font-weight="650">Defective products successfully blocked</text><text x="60" y="536" font-size="20" font-weight="400">18 products</text><rect x="36" y="596" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="624" font-size="22" font-weight="650">Genuinely good products</text><text x="60" y="668" font-size="20" font-weight="400">80 products</text><rect x="36" y="728" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="756" font-size="22" font-weight="650">Good products incorrectly blocked</text><text x="60" y="800" font-size="20" font-weight="400">12 products</text><rect x="36" y="860" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="888" font-size="22" font-weight="650">Previous manual workflow</text><text x="60" y="932" font-size="20" font-weight="400">Average 10 minutes</text><rect x="36" y="992" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="1020" font-size="22" font-weight="650">New AI workflow</text><text x="60" y="1064" font-size="20" font-weight="400">Average 7 minutes</text><text x="36" y="1160" font-size="20" font-weight="400">All numbers are hypothetical. The study arrangement, sample</text><text x="36" y="1196" font-size="20" font-weight="400">representativeness and timing boundaries have not been provided.</text></g></svg>
