<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 756" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜Agent 除錯指令範本</title><desc id="desc">四段是同一任務的範圍與驗收條件；複製文字後仍需由 Agent 實際執行並提供證據。</desc><rect width="1060" height="756" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 4｜Agent 除錯指令範本</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">任務</text><text x="56" y="176" font-size="20" font-weight="400">修復輸入變更後舊報告仍可下載的問題。</text><rect x="36" y="242" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="278" font-size="20" font-weight="700">工作規則</text><text x="56" y="322" font-size="20" font-weight="400">先重現、先補失敗測試、只修改必要邏輯、保留無關修改。</text><rect x="36" y="388" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="424" font-size="20" font-weight="700">完成條件</text><text x="56" y="468" font-size="20" font-weight="400">舊報告不能再使用；原失敗測試轉為通過；受影響的其他測試通過；提供實際命令與結果。</text><rect x="36" y="534" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="570" font-size="20" font-weight="700">禁止事項</text><text x="56" y="614" font-size="20" font-weight="400">未經確認的大規模重構、刪除其他修改、將未執行的測試宣稱為通過。</text><text x="36" y="696" font-size="20" font-weight="400">四段是同一任務的範圍與驗收條件；複製文字後仍需由 Agent 實際執行並提供證據。</text></g></svg>
