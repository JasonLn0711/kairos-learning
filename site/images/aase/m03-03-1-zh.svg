<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜餐廳訂貨的三種描述</title><desc id="desc">箭頭表示分析從現況走向目標與具體操作；改善仍是待驗證假設。</desc><rect width="1040" height="660" fill="#fbfdfb"/><g fill="#173329" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 1｜餐廳訂貨的三種描述</text><text x="36" y="100" font-size="20" font-weight="400">箭頭表示分析從現況走向目標與具體操作；改善仍是待驗證假設。</text><rect x="36" y="138" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="166" font-size="22" font-weight="650">As-Is</text><text x="60" y="210" font-size="20" font-weight="400">查看冰箱 → 紙本記錄缺料 → 打電話；未接通要重撥。問題是耗時、漏訂與紀錄不完整。</text><path d="M520 272v26m-7-7 7 7 7-7" fill="none" stroke="#557764" stroke-width="2"/><rect x="36" y="300" width="968" height="158" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="328" font-size="22" font-weight="650">To-Be</text><text x="60" y="372" font-size="20" font-weight="400">呈現庫存與建議量 → 店長確認 → 送出 → 通知供應商。目標為減少重工、漏訂並留存紀錄；</text><text x="60" y="408" font-size="20" font-weight="400">通知不等於供應商接受。</text><path d="M520 470v26m-7-7 7 7 7-7" fill="none" stroke="#557764" stroke-width="2"/><rect x="36" y="498" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="526" font-size="22" font-weight="650">User Flow</text><text x="60" y="570" font-size="20" font-weight="400">登入 → 檢查庫存 → 調整數量 → 確認 → 送出；缺貨、變價、斷線與取消另有分支。</text></g></svg>
