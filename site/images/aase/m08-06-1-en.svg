<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 872" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | From Risk to Regression Evidence</title><desc id="desc">Downward arrows show the order of five activities. The final box represents regression and handoff work, not a passing test result.</desc><rect width="1040" height="872" fill="#fbfcfc"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="42" font-size="24" font-weight="700">Figure 1 | From Risk to Regression Evidence</text><text x="64" y="94" font-size="22" font-weight="700">1. Requirements and risks</text><text x="64" y="136" font-size="20" font-weight="400">What must never happen?</text><path d="M520 180 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="226" font-size="22" font-weight="700">2. Design negative scenarios</text><text x="64" y="268" font-size="20" font-weight="400">Supply invalid input, incorrect state or unauthorized operations</text><path d="M520 312 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="358" font-size="22" font-weight="700">3. Execute tests and retain evidence</text><text x="64" y="400" font-size="20" font-weight="400">Compare expected and actual results</text><path d="M520 444 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="490" font-size="22" font-weight="700">4. Locate and repair the problem</text><text x="64" y="532" font-size="20" font-weight="400">Find the cause and make the smallest necessary change</text><path d="M520 576 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="594" width="968" height="144" rx="6" fill="#eaf6ef" stroke="#ccdfd3"/><text x="64" y="622" font-size="22" font-weight="700">5. Regression tests and handoff</text><text x="64" y="664" font-size="20" font-weight="400">Retest the original issue and related normal behavior; retain the</text><text x="64" y="698" font-size="20" font-weight="400">version and results</text><text x="36" y="776" font-size="20" font-weight="400">Downward arrows show the order of five activities. The final box represents</text><text x="36" y="810" font-size="20" font-weight="400">regression and handoff work, not a passing test result.</text></g></svg>
