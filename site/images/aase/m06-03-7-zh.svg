<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 788" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 7｜從邊界到真實性的四個盤點階段</title><desc id="desc">四列依盤點步驟閱讀，並不是程式的執行流程；每一步均須回到實際程式核對。</desc><rect width="1060" height="788" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 7｜從邊界到真實性的四個盤點階段</text><rect x="36" y="96" width="988" height="134" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="56" y="132" font-size="20" font-weight="700">第一階段：確認系統邊界</text><text x="56" y="176" font-size="20" font-weight="400">確認誰使用系統、哪些外部系統提供服務、哪些程式由你負責開發；沿用 C1 成果。</text><rect x="36" y="250" width="988" height="134" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="56" y="286" font-size="20" font-weight="700">第二階段：找出主要應用與資料儲存</text><text x="56" y="330" font-size="20" font-weight="400">盤點實際執行的前端、後端、工作程序及必要資料儲存；不要把每個檔案當 Container。</text><rect x="36" y="404" width="988" height="134" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="56" y="440" font-size="20" font-weight="700">第三階段：標註責任與通訊</text><text x="56" y="484" font-size="20" font-weight="400">方塊寫名稱、用途、主要技術；連線寫誰呼叫誰、傳送何種資料及實際通訊方式。</text><rect x="36" y="558" width="988" height="134" rx="14" fill="#fbfcfd" stroke="#7295bf"/><text x="56" y="594" font-size="20" font-weight="700">第四階段：檢查真實性與未知事項</text><text x="56" y="638" font-size="20" font-weight="400">對應實際執行方式。尚未實作的資料庫、API、認證及遠端部署明列未來規劃。</text><text x="36" y="728" font-size="20" font-weight="400">四列依盤點步驟閱讀，並不是程式的執行流程；每一步均須回到實際程式核對。</text></g></svg>
