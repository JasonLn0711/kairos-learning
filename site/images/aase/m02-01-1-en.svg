<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1252" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | How Text Becomes a Response</title><desc id="desc">Arrows show a simplified processing order. The final response may be right or wrong; this path alone does not establish validation against business rules.</desc><rect width="1040" height="1252" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 1 | How Text Becomes a Response</text><rect x="36.0" y="70" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="98" font-size="22">You enter text</text><text x="56.0" y="142" font-size="20">“Please check the application.”</text><path d="M512 201v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="233" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="261" font-size="22">1. Tokenizer: split into tokens</text><text x="56.0" y="305" font-size="20">Split text into units the model can process, then map them to IDs.</text><path d="M512 364v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="396" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="424" font-size="22">2. Vectors and position information</text><text x="56.0" y="468" font-size="20">Turn text into numeric representations for computation.</text><path d="M512 527v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="559" width="952.0" height="154" rx="10" fill="#edf8f5" stroke="#79aaa0"/><text x="56.0" y="587" font-size="22">3. Transformer computation</text><text x="56.0" y="631" font-size="20">Attention and other neural network layers repeatedly process</text><text x="56.0" y="665" font-size="20">information.</text><path d="M512 724v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="756" width="952.0" height="154" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="784" font-size="22">4. Predict the next token</text><text x="56.0" y="828" font-size="20">Compute probabilities of possible outputs and select using a</text><text x="56.0" y="862" font-size="20">decoding strategy.</text><path d="M512 921v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="953" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="981" font-size="22">5. Form a response</text><text x="56.0" y="1025" font-size="20">“The document type is missing from this application.”</text><text x="36" y="1126" font-size="20">Arrows show a simplified processing order. The final response may be</text><text x="36" y="1160" font-size="20">right or wrong; this path alone does not establish validation against</text><text x="36" y="1194" font-size="20">business rules.</text></g></svg>
