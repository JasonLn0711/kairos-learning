<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1092" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 6 · From analysis to implementation</title><desc id="desc">As-Is → To-Be → User Flow feeds two parallel design concerns, UI/UX and requirements/tests; both inform implementation, verification and improvement. This is a dependency diagram, not a mandatory waterfall schedule.</desc><rect width="1040" height="1092" fill="#fbfdfb"/><g fill="#173329" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 6 · From analysis to implementation</text><text x="36" y="100" font-size="20" font-weight="400">As-Is → To-Be → User Flow feeds two parallel design concerns, UI/UX</text><text x="36" y="136" font-size="20" font-weight="400">and requirements/tests; both inform implementation, verification and</text><text x="36" y="172" font-size="20" font-weight="400">improvement. This is a dependency diagram, not a mandatory waterfall</text><text x="36" y="208" font-size="20" font-weight="400">schedule.</text><rect x="36" y="246" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="274" font-size="22" font-weight="650">As-Is</text><text x="60" y="318" font-size="20" font-weight="400">Understand current problems and constraints.</text><path d="M520 380v26m-7-7 7 7 7-7" fill="none" stroke="#557764" stroke-width="2"/><rect x="36" y="408" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="436" font-size="22" font-weight="650">To-Be</text><text x="60" y="480" font-size="20" font-weight="400">Design a better way of working.</text><path d="M520 542v26m-7-7 7 7 7-7" fill="none" stroke="#557764" stroke-width="2"/><rect x="36" y="570" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="598" font-size="22" font-weight="650">User Flow</text><text x="60" y="642" font-size="20" font-weight="400">Define operations, decisions and exception paths.</text><path d="M520 704v12H274v16m-7-7 7 7 7-7M520 716H766v16m-7-7 7 7 7-7" fill="none" stroke="#557764" stroke-width="2"/><rect x="36" y="732" width="476" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="760" font-size="22" font-weight="650">UI / UX</text><text x="60" y="804" font-size="20" font-weight="400">M04: design usable interfaces.</text><rect x="528" y="732" width="476" height="158" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="552" y="760" font-size="22" font-weight="650">Requirements and tests</text><text x="552" y="804" font-size="20" font-weight="400">M05 / M08: define testable</text><text x="552" y="840" font-size="20" font-weight="400">behavior.</text><path d="M274 902v12H766v-12M520 914v16m-7-7 7 7 7-7" fill="none" stroke="#557764" stroke-width="2"/><rect x="36" y="930" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="958" font-size="22" font-weight="650">Implementation, verification and improvement</text><text x="60" y="1002" font-size="20" font-weight="400">Architecture, AI Coding, testing and iteration.</text></g></svg>
