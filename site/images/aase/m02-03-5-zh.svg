<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 728" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜專案交接記憶</title><desc id="desc">四個欄位共同描述一份狀態記錄，不是執行順序。指定測試通過只支持該測試範圍。</desc><rect width="1040" height="728" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 5｜專案交接記憶</text><rect x="36.0" y="72" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="100" font-size="22">已完成</text><text x="52.0" y="144" font-size="20">新增科目功能，指定測試通過。</text><rect x="36.0" y="212" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="240" font-size="22">待處理</text><text x="52.0" y="284" font-size="20">修正週末安排上限。</text><rect x="36.0" y="352" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="380" font-size="22">未決問題</text><text x="52.0" y="424" font-size="20">國定假日算平日還是週末？</text><rect x="36.0" y="492" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="520" font-size="22">資料來源</text><text x="52.0" y="564" font-size="20">需求文件 v3、最新測試紀錄。</text><text x="36" y="668" font-size="20">四個欄位共同描述一份狀態記錄，不是執行順序。指定測試通過只支持該測試範圍。</text></g></svg>
