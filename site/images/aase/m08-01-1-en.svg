<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 986" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Specification and five complementary verification perspectives</title><desc id="desc">The arrow connects the specification to relevant verification questions. The five perspectives complement one another; they are neither a testing sequence nor substitutes.</desc><rect width="1060" height="986" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 1 | Specification and five complementary verification</text><text x="36" y="78" font-size="20" font-weight="700">perspectives</text><rect x="36" y="130" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="166" font-size="20" font-weight="700">Specification</text><text x="56" y="210" font-size="20" font-weight="400">First state what the software should do.</text><path d="M530 272v24m-7-7 7 7 7-7" fill="none" stroke="#53636d" stroke-width="2"/><rect x="36" y="314" width="482" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="350" font-size="20" font-weight="700">01 Startup verification</text><text x="56" y="394" font-size="20" font-weight="400">Can the program run?</text><rect x="542" y="314" width="482" height="168" rx="12" fill="#ffffff" stroke="#64748b"/><text x="562" y="350" font-size="20" font-weight="700">02 Rule verification</text><text x="562" y="394" font-size="20" font-weight="400">Are calculations and decisions</text><text x="562" y="430" font-size="20" font-weight="400">correct?</text><rect x="36" y="498" width="482" height="168" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="534" font-size="20" font-weight="700">03 Interface verification</text><text x="56" y="578" font-size="20" font-weight="400">Are operations, messages and</text><text x="56" y="614" font-size="20" font-weight="400">outputs correct?</text><rect x="542" y="498" width="482" height="168" rx="12" fill="#ffffff" stroke="#64748b"/><text x="562" y="534" font-size="20" font-weight="700">04 Task verification</text><text x="562" y="578" font-size="20" font-weight="400">Can a person complete their work</text><text x="562" y="614" font-size="20" font-weight="400">?</text><rect x="36" y="682" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="718" font-size="20" font-weight="700">05 Security verification</text><text x="56" y="762" font-size="20" font-weight="400">Does the system prevent prohibited behavior?</text><text x="36" y="854" font-size="20" font-weight="400">The arrow connects the specification to relevant verification questions.</text><text x="36" y="890" font-size="20" font-weight="400">The five perspectives complement one another; they are neither a testing</text><text x="36" y="926" font-size="20" font-weight="400">sequence nor substitutes.</text></g></svg>
