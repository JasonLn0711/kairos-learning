<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1284" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Usability observation record (fictional example)</title><desc id="desc">Fictional teaching example; no claim of human testing.</desc><rect width="1060" height="1284" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 2 | Usability observation record (fictional example)</text><text x="36" y="96" font-size="20" font-weight="700">System version</text><text x="60" y="132" font-size="20" font-weight="400">v0.2</text><path d="M36 180H1024" stroke="#d5dce0"/><text x="36" y="216" font-size="20" font-weight="700">Participant code</text><text x="60" y="252" font-size="20" font-weight="400">P01</text><path d="M36 300H1024" stroke="#d5dce0"/><text x="36" y="336" font-size="20" font-weight="700">Task</text><text x="60" y="372" font-size="20" font-weight="400">Obtain a current report after editing data</text><path d="M36 420H1024" stroke="#d5dce0"/><text x="36" y="456" font-size="20" font-weight="700">Observed behavior</text><text x="60" y="492" font-size="20" font-weight="400">Downloaded after editing without validating again</text><path d="M36 540H1024" stroke="#d5dce0"/><text x="36" y="576" font-size="20" font-weight="700">Facilitator assistance</text><text x="60" y="612" font-size="20" font-weight="400">None</text><path d="M36 660H1024" stroke="#d5dce0"/><text x="36" y="696" font-size="20" font-weight="700">Task result</text><text x="60" y="732" font-size="20" font-weight="400">Did not obtain the required current report</text><path d="M36 780H1024" stroke="#d5dce0"/><text x="36" y="816" font-size="20" font-weight="700">Possible cause</text><text x="60" y="852" font-size="20" font-weight="400">Unaware the report needs regeneration</text><path d="M36 900H1024" stroke="#d5dce0"/><text x="36" y="936" font-size="20" font-weight="700">Improvement hypothesis</text><text x="60" y="972" font-size="20" font-weight="400">Mark old results and guide the user to validate again</text><path d="M36 1020H1024" stroke="#d5dce0"/><text x="36" y="1056" font-size="20" font-weight="700">Retest</text><text x="60" y="1092" font-size="20" font-weight="400">Ask other participants from the target group to perform comparable</text><text x="60" y="1128" font-size="20" font-weight="400">tasks</text><path d="M36 1176H1024" stroke="#d5dce0"/><text x="36" y="1224" font-size="20" font-weight="400">Fictional teaching example; no claim of human testing.</text></g></svg>
