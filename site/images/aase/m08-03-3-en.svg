<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 718" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | The 80-character Boundary</title><desc id="desc">The slider compares lengths from 0 to 100 only. Type and nonempty-after-trimming checks are still required for full validity.</desc><rect width="1060" height="718" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 3 | The 80-character Boundary</text><rect x="36" y="96" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">79 characters</text><text x="56" y="176" font-size="20" font-weight="400">Accept</text><rect x="36" y="242" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="278" font-size="20" font-weight="700">80 characters</text><text x="56" y="322" font-size="20" font-weight="400">Accept</text><rect x="36" y="388" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="424" font-size="20" font-weight="700">81 characters</text><text x="56" y="468" font-size="20" font-weight="400">Reject</text><text x="36" y="554" font-size="20" font-weight="400">80 ≤ 80; 81 &gt; 80</text><text x="36" y="622" font-size="20" font-weight="400">The slider compares lengths from 0 to 100 only. Type and</text><text x="36" y="658" font-size="20" font-weight="400">nonempty-after-trimming checks are still required for full validity.</text></g></svg>
