<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜設定頁的進階入口</title><desc id="desc">橘框標出進階入口；箭頭表示可前往下一層設定，不表示已執行變更。</desc><rect width="1040" height="670" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 2｜設定頁的進階入口</text><rect x="120" y="88" width="800" height="180" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="140" y="126" font-size="22" font-weight="700">設定 Settings</text><text x="140" y="170" font-size="20" font-weight="400">安全性 Security</text><text x="140" y="216" font-size="20" font-weight="400">密碼 Password｜變更 Change</text><rect x="120" y="284" width="800" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="140" y="322" font-size="22" font-weight="700">國家／地區設定 Country Settings</text><text x="140" y="366" font-size="20" font-weight="400">一般設定入口 ›</text><rect x="120" y="434" width="800" height="134" rx="12" fill="#ffffff" stroke="#ec874d" stroke-width="4"/><text x="140" y="472" font-size="22" font-weight="700">進階設定 Advanced Settings</text><text x="140" y="516" font-size="20" font-weight="400">進階設定入口 ›</text><text x="36" y="604" font-size="20" font-weight="400">橘框標出進階入口；箭頭表示可前往下一層設定，不表示已執行變更。</text></g></svg>
