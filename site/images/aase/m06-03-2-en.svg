<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 624" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2｜One application role, three deployed instances</title><desc id="desc">The downward connection maps a role to its deployment. The three Docker instances are peers, not a call sequence. This hypothetical example does not require C4 containers to use Docker.</desc><rect width="1060" height="624" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 2｜One application role, three deployed instances</text><rect x="36" y="96" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="132" font-size="20" font-weight="700">C4 container: Order API</text><text x="56" y="176" font-size="20" font-weight="400">One application role and responsibility</text><path d="M520 242v28m-7-7 7 7 7-7" fill="none" stroke="#46535f" stroke-width="2"/><text x="560" y="262" font-size="20" font-weight="400">Actual deployment</text><rect x="36" y="318" width="316" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="354" font-size="20" font-weight="700">Docker 1</text><text x="56" y="398" font-size="20" font-weight="400">API instance</text><rect x="372" y="318" width="316" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="392" y="354" font-size="20" font-weight="700">Docker 2</text><text x="392" y="398" font-size="20" font-weight="400">API instance</text><rect x="708" y="318" width="316" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="728" y="354" font-size="20" font-weight="700">Docker 3</text><text x="728" y="398" font-size="20" font-weight="400">API instance</text><text x="36" y="492" font-size="20" font-weight="400">The downward connection maps a role to its deployment. The three Docker</text><text x="36" y="528" font-size="20" font-weight="400">instances are peers, not a call sequence. This hypothetical example</text><text x="36" y="564" font-size="20" font-weight="400">does not require C4 containers to use Docker.</text></g></svg>
