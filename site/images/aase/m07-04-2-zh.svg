<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 702" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜互動練習：模擬資料檢核</title><desc id="desc">只模擬文字欄位規則。缺鍵、None、數字另以 Python 測試；不保存資料，不代表正式受理。</desc><rect width="1060" height="702" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 2｜互動練習：模擬資料檢核</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">申請編號</text><text x="56" y="176" font-size="20" font-weight="400">SYN-001</text><rect x="36" y="250" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="286" font-size="20" font-weight="700">申請人代號</text><text x="56" y="330" font-size="20" font-weight="400">DEMO-A</text><rect x="36" y="404" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="440" font-size="20" font-weight="700">文件類型</text><text x="56" y="484" font-size="20" font-weight="400">合成申請表</text><text x="36" y="570" font-size="20" font-weight="400">靜態預設：尚未檢查。啟用網頁互動以檢查或重設。</text><text x="36" y="642" font-size="20" font-weight="400">只模擬文字欄位規則。缺鍵、None、數字另以 Python 測試；不保存資料，不代表正式受理。</text></g></svg>
