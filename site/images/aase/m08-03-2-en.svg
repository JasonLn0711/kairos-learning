<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 754" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Delivery Threshold</title><desc id="desc">Integer totals from 0 to 2,000: delivery is free at 1,000 or above, otherwise 60. This demonstrates a rule without running Python or pytest.</desc><rect width="1060" height="754" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 2 | Delivery Threshold</text><rect x="36" y="96" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Order total</text><text x="56" y="176" font-size="20" font-weight="400">999</text><rect x="36" y="242" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="278" font-size="20" font-weight="700">Expected fee</text><text x="56" y="322" font-size="20" font-weight="400">60</text><rect x="36" y="388" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="424" font-size="20" font-weight="700">Free-delivery threshold</text><text x="56" y="468" font-size="20" font-weight="400">1000</text><text x="36" y="554" font-size="20" font-weight="400">999 &lt; 1000 → 60; 1000 ≥ 1000 → 0</text><text x="36" y="622" font-size="20" font-weight="400">Integer totals from 0 to 2,000: delivery is free at 1,000 or above,</text><text x="36" y="658" font-size="20" font-weight="400">otherwise 60. This demonstrates a rule without running Python or</text><text x="36" y="694" font-size="20" font-weight="400">pytest.</text></g></svg>
