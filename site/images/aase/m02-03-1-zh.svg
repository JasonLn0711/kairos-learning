<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜辦公室裡的四種分工</title><desc id="desc">並列卡片表示用途比較；手機上下排列仍不代表先後順序。</desc><rect width="1040" height="520" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 1｜辦公室裡的四種分工</text><rect x="36.0" y="72" width="476.0" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="100" font-size="22">KV Cache｜計算層</text><text x="52.0" y="144" font-size="20">已經計算的部分先留著。像保留算過的中間結</text><text x="52.0" y="180" font-size="20">果，避免重複計算。</text><rect x="528.0" y="72" width="476.0" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="544.0" y="100" font-size="22">Compaction｜對話層</text><text x="544.0" y="144" font-size="20">把冗長討論變成交接摘要。像把三小時會議整</text><text x="544.0" y="180" font-size="20">理成一頁重點紀錄。</text><rect x="36.0" y="248" width="476.0" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="276" font-size="22">RAG｜資料檢索層</text><text x="52.0" y="320" font-size="20">去資料庫找真正的規定。像去檔案室找最新版</text><text x="52.0" y="356" font-size="20">本的需求文件。</text><rect x="528.0" y="248" width="476.0" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="544.0" y="276" font-size="22">Memory｜持久狀態層</text><text x="544.0" y="320" font-size="20">把重要進度記在工作日誌。像隔天重新上班時</text><text x="544.0" y="356" font-size="20">，翻閱昨天的交接簿。</text><text x="36" y="460" font-size="20">並列卡片表示用途比較；手機上下排列仍不代表先後順序。</text></g></svg>
