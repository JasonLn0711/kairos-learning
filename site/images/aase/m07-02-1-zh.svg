<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 838" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜可核對的五步委派閉環</title><desc id="desc">四個向下箭頭表示本次委派的工作順序；最後由人類接受、退回修正或釐清需求，必要時回到規格與契約。圖中不另畫回線，也不代表已完成驗收。</desc><rect width="1040" height="838" fill="#fbfcfc"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="42" font-size="24" font-weight="700">圖 1｜可核對的五步委派閉環</text><text x="64" y="94" font-size="22" font-weight="700">1. 人類確認規格（Specification）</text><text x="64" y="136" font-size="20" font-weight="400">定義什麼才算做對、哪些規則已被確認</text><path d="M520 180 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="226" font-size="22" font-weight="700">2. 訂定工作契約（Task Contract）</text><text x="64" y="268" font-size="20" font-weight="400">明確指定任務範圍、工具、驗收與停止條件</text><path d="M520 312 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="358" font-size="22" font-weight="700">3. AI Agent 執行</text><text x="64" y="400" font-size="20" font-weight="400">在實際授予的權限內操作，保留紀錄</text><path d="M520 444 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text x="64" y="490" font-size="22" font-weight="700">4. 提供證據（Evidence）</text><text x="64" y="532" font-size="20" font-weight="400">呈現檔案差異、測試結果、未完成事項</text><path d="M520 576 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="594" width="968" height="110" rx="6" fill="#f9f0eb" stroke="#b54b25"/><text x="64" y="622" font-size="22" font-weight="700">5. 人類審查與驗收</text><text x="64" y="664" font-size="20" font-weight="400">接受成果、退回修正，或先釐清需求</text><text x="36" y="742" font-size="20" font-weight="400">四個向下箭頭表示本次委派的工作順序；最後由人類接受、退回修正或釐清需求，必要時回到規格與契約。</text><text x="36" y="776" font-size="20" font-weight="400">圖中不另畫回線，也不代表已完成驗收。</text></g></svg>
