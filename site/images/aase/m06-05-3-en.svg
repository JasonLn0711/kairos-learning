<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 724" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Browser and server session responsibilities</title><desc id="desc">Two roles work together. The browser sends a cookie to the server, which checks session validity. These are not two sequential states.</desc><rect width="1060" height="724" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 3 | Browser and server session responsibilities</text><rect x="36" y="96" width="460" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">User browser</text><text x="56" y="176" font-size="20" font-weight="400">Retains the session cookie</text><rect x="564" y="96" width="460" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="584" y="132" font-size="20" font-weight="700">Web server</text><text x="584" y="176" font-size="20" font-weight="400">Retains the session record</text><text x="36" y="262" font-size="20" font-weight="400">Browser → server: cookie; server checks validity.</text><rect x="36" y="318" width="988" height="274" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="56" y="354" font-size="20" font-weight="700">Conceptual server-side record</text><text x="56" y="398" font-size="20" font-weight="400">Session ID → random unpredictable identifier</text><text x="56" y="434" font-size="20" font-weight="400">User → A</text><text x="56" y="470" font-size="20" font-weight="400">Created → creation time</text><text x="56" y="506" font-size="20" font-weight="400">Expires → expiry time</text><text x="56" y="542" font-size="20" font-weight="400">Revoked → revocation status</text><text x="36" y="628" font-size="20" font-weight="400">Two roles work together. The browser sends a cookie to the server,</text><text x="36" y="664" font-size="20" font-weight="400">which checks session validity. These are not two sequential states.</text></g></svg>
