<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1336" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜訂餐系統的 C2 應用與儲存</title><desc id="desc">系統內包含前端、API 與 PostgreSQL；顧客與支付平台在外。前端 ↔ API 使用 HTTPS／API，API ↔ 資料庫讀寫資料，API ↔ 外部支付平台通訊；連線是關係，並非所有操作的時序。</desc><rect width="1060" height="1336" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 4｜訂餐系統的 C2 應用與儲存</text><rect x="36" y="96" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="132" font-size="20" font-weight="700">顧客</text><text x="56" y="176" font-size="20" font-weight="400">系統範圍外；使用訂餐前端</text><path d="M520 242v28m-7-7 7 7 7-7" fill="none" stroke="#46535f" stroke-width="2"/><rect x="36" y="290" width="988" height="684" rx="14" fill="#fbfcfd" stroke="#7295bf" stroke-dasharray="5 5"/><text x="56" y="326" font-size="20" font-weight="700">線上訂餐系統 — C4 Container 視角</text><rect x="56" y="376" width="948" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="76" y="412" font-size="20" font-weight="700">訂餐前端（Web App）</text><text x="76" y="456" font-size="20" font-weight="400">顯示菜單、購物車與訂單</text><path d="M520 522v28m-7-7 7 7 7-7M536 550V522m-7 7 7-7 7 7" fill="none" stroke="#46535f" stroke-width="2"/><text x="560" y="542" font-size="20" font-weight="400">HTTPS / API</text><rect x="56" y="598" width="948" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="76" y="634" font-size="20" font-weight="700">訂單後端（API Application）</text><text x="76" y="678" font-size="20" font-weight="400">檢查訂單、計算金額、處理業務規則</text><path d="M520 744v28m-7-7 7 7 7-7M536 772V744m-7 7 7-7 7 7" fill="none" stroke="#46535f" stroke-width="2"/><text x="560" y="764" font-size="20" font-weight="400">讀取／保存訂單與商品</text><rect x="56" y="820" width="948" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="76" y="856" font-size="20" font-weight="700">訂單資料庫（PostgreSQL）</text><text x="76" y="900" font-size="20" font-weight="400">保存訂單與商品資料</text><text x="56" y="1014" font-size="20" font-weight="400">訂單後端 ↔ 第三方支付平台</text><rect x="36" y="1066" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="1102" font-size="20" font-weight="700">第三方支付平台</text><text x="56" y="1146" font-size="20" font-weight="400">系統範圍外；與訂單後端通訊</text><text x="36" y="1240" font-size="20" font-weight="400">系統內包含前端、API 與 PostgreSQL；顧客與支付平台在外。前端 ↔ API 使用 HTTPS／API</text><text x="36" y="1276" font-size="20" font-weight="400">，API ↔ 資料庫讀寫資料，API ↔ 外部支付平台通訊；連線是關係，並非所有操作的時序。</text></g></svg>
