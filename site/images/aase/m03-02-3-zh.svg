<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜同一欄位在不同階段可能有不同規則</title><desc id="desc">以上只是可能的規則解釋，必須由有決定權的人確認。兩欄並列比較適用條件，沒有自動交接或授權關係。</desc><rect width="1040" height="340" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 3｜同一欄位在不同階段可能有不同規則</text><rect x="36" y="76" width="476" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">暫存草稿</text><text x="60" y="148" font-size="20" font-weight="400">文件類型可能允許空白。</text><rect x="528" y="76" width="476" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="552" y="104" font-size="22" font-weight="650">正式交接</text><text x="552" y="148" font-size="20" font-weight="400">文件類型可能必填。</text><text x="36" y="244" font-size="20" font-weight="400">以上只是可能的規則解釋，必須由有決定權的人確認。兩欄並列比較適用條件，沒有自動交接或授</text><text x="36" y="280" font-size="20" font-weight="400">權關係。</text></g></svg>
