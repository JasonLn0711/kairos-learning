<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 546" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜從第一切片逐步擴充</title><desc id="desc">編號表示課程逐步增加的責任；每階段以自己的證據驗收。</desc><rect width="1060" height="546" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700" fill="#18252c">圖 3｜從第一切片逐步擴充</text><text x="36" y="90" font-size="20" font-weight="700" fill="#18252c">1. M07-03：建立表單</text><text x="64" y="130" font-size="20" font-weight="400" fill="#18252c">輸入資料 → 顯示未檢核預覽。</text><text x="36" y="190" font-size="20" font-weight="700" fill="#18252c">2. M07-04：加入資料檢核</text><text x="64" y="230" font-size="20" font-weight="400" fill="#18252c">輸入資料 → 依業務規則檢查 → 顯示通過或錯誤。</text><text x="36" y="290" font-size="20" font-weight="700" fill="#18252c">3. M07-05：預覽與匯出</text><text x="64" y="330" font-size="20" font-weight="400" fill="#18252c">輸入資料 → 檢核 → 預覽有效結果 → 匯出。</text><text x="36" y="390" font-size="20" font-weight="700" fill="#18252c">4. M07-06、M07-07：審查與修復</text><text x="64" y="430" font-size="20" font-weight="400" fill="#18252c">確認 AI 的修改內容、測試證據、錯誤原因，以及是否能安全復原。</text><text x="36" y="490" font-size="20" font-weight="400" fill="#18252c">編號表示課程逐步增加的責任；每階段以自己的證據驗收。</text></g></svg>
