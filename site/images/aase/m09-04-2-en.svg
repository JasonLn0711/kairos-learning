<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1304" role="img" aria-labelledby="title desc"><title id="title">Figure 2 | Six migration steps, starting with success criteria</title><desc id="desc">Five downward arrows show the working order of six steps. Acceptance evidence determines whether to accept or recover; the diagram does not claim execution or success.</desc><rect width="1060" height="1304" fill="#fbfcfc"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="48" y="40" font-size="20" font-weight="700">Figure 2 | Six migration steps, starting with success criteria</text><rect x="24" y="96" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="132" font-size="20" font-weight="700">1. Explain the reason for change</text><text x="48" y="176" font-size="20" font-weight="400">Improve speed, cost, quality, or safety</text><path d="M530 238v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="278" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="314" font-size="20" font-weight="700">2. Identify behavior to retain</text><text x="48" y="358" font-size="20" font-weight="400">Requirements, business rules, data, and permissions</text><path d="M530 420v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="460" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="496" font-size="20" font-weight="700">3. Analyze the impact</text><text x="48" y="540" font-size="20" font-weight="400">Code, interfaces, data, environments, and operations</text><path d="M530 602v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="642" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="678" font-size="20" font-weight="700">4. Define tests and pass criteria</text><text x="48" y="722" font-size="20" font-weight="400">Normal cases, error cases, and authorization checks</text><path d="M530 784v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="824" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="860" font-size="20" font-weight="700">5. Migrate a small scope and execute tests</text><text x="48" y="904" font-size="20" font-weight="400">Retain records and compare old and new behavior</text><path d="M530 966v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="1006" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="1042" font-size="20" font-weight="700">6. Accept or recover</text><text x="48" y="1086" font-size="20" font-weight="400">Expand only after acceptance; stop on failure</text><text x="48" y="1176" font-size="20" font-weight="400">Five downward arrows show the working order of six steps.</text><text x="48" y="1212" font-size="20" font-weight="400">Acceptance evidence determines whether to accept or recover; the</text><text x="48" y="1248" font-size="20" font-weight="400">diagram does not claim execution or success.</text></g></svg>
