<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1266" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜Streamlit 程序與資料位置</title><desc id="desc">使用者→瀏覽器；瀏覽器↔Python／Streamlit程序為Streamlit通訊（WebSocket）。rules.py與Session State都位於同一Python程序內；雙向符號表示呼叫／結果或讀寫，不表示獨立服務。JSON下載到使用者裝置。主機分組不代表已驗證的安全信任邊界。</desc><rect width="1320" height="1266" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="42" font-size="20" font-weight="700">圖 4｜Streamlit 程序與資料位置</text><rect x="410" y="102" width="500" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="428" y="138" font-size="20" font-weight="700">使用者</text><text x="428" y="178" font-size="20" font-weight="400">操作瀏覽器。</text><path d="M660 232 L660 272" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 262L660 272L666 262" fill="none" stroke="#61736b" stroke-width="2"/><rect x="410" y="282" width="500" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="428" y="318" font-size="20" font-weight="700">瀏覽器：操作介面</text><text x="428" y="358" font-size="20" font-weight="400">輸入與結果顯示；↔ Python／Streamlit程</text><text x="428" y="392" font-size="20" font-weight="400">序。</text><rect x="32" y="532" width="850" height="556" rx="8" fill="#f3f5f4" stroke="#81958a"/><text x="48" y="564" font-size="20" font-weight="700">Streamlit 執行主機</text><rect x="56" y="596" width="802" height="468" rx="8" fill="#f7fbf8" stroke="#81958a"/><text x="72" y="628" font-size="20" font-weight="700">同一個 Python 程序</text><rect x="204" y="656" width="500" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="222" y="692" font-size="20" font-weight="700">Python／Streamlit 程序</text><text x="222" y="732" font-size="20" font-weight="400">執行驗證與報告產生。</text><rect x="80" y="846" width="360" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="98" y="882" font-size="20" font-weight="700">rules.py：驗證規則</text><text x="98" y="922" font-size="20" font-weight="400">程序內直接呼叫／回傳結果。</text><rect x="474" y="846" width="360" height="194" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="492" y="882" font-size="20" font-weight="700">Session State：工作階段記</text><text x="492" y="916" font-size="20" font-weight="700">憶體</text><text x="492" y="956" font-size="20" font-weight="400">程序內暫存輸入與已檢查快照；</text><text x="492" y="990" font-size="20" font-weight="400">讀／寫。</text><path d="M454 787 L454 810 L260 810 L260 839" fill="none" stroke="#61736b" stroke-width="2"/><path d="M254 829L260 839L266 829" fill="none" stroke="#61736b" stroke-width="2"/><path d="M274 840 L274 824 L468 824 L468 788" fill="none" stroke="#61736b" stroke-width="2"/><path d="M474 798L468 788L462 798" fill="none" stroke="#61736b" stroke-width="2"/><path d="M454 787 L454 810 L654 810 L654 839" fill="none" stroke="#61736b" stroke-width="2"/><path d="M648 829L654 839L660 829" fill="none" stroke="#61736b" stroke-width="2"/><path d="M668 840 L668 824 L468 824 L468 788" fill="none" stroke="#61736b" stroke-width="2"/><path d="M474 798L468 788L462 798" fill="none" stroke="#61736b" stroke-width="2"/><rect x="930" y="656" width="358" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="948" y="692" font-size="20" font-weight="700">使用者裝置上的 JSON 檔案</text><text x="948" y="732" font-size="20" font-weight="400">瀏覽器 → 下載；與伺服器記憶</text><text x="948" y="766" font-size="20" font-weight="400">體分開管理。</text><path d="M660 448 L660 478 L454 478 L454 648" fill="none" stroke="#61736b" stroke-width="2"/><path d="M448 638L454 648L460 638" fill="none" stroke="#61736b" stroke-width="2"/><path d="M440 648 L440 492 L646 492 L646 448" fill="none" stroke="#61736b" stroke-width="2"/><path d="M652 458L646 448L640 458" fill="none" stroke="#61736b" stroke-width="2"/><path d="M660 478 L1109 478 L1109 648" fill="none" stroke="#61736b" stroke-width="2"/><path d="M1103 638L1109 648L1115 638" fill="none" stroke="#61736b" stroke-width="2"/><text x="32" y="1138" font-size="20" font-weight="400">使用者→瀏覽器；瀏覽器↔Python／Streamlit程序為Streamlit通訊（WebSocket）。rules.py與Session State都位</text><text x="32" y="1172" font-size="20" font-weight="400">於同一Python程序內；雙向符號表示呼叫／結果或讀寫，不表示獨立服務。JSON下載到使用者裝置。主機分組不代表已驗證的</text><text x="32" y="1206" font-size="20" font-weight="400">安全信任邊界。</text></g></svg>
