<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 974" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜安全的資料存取判斷流程</title><desc id="desc">箭頭代表判斷路徑；失效或無權限即拒絕，不繼續讀取。每個資料入口都要執行檢查：讀取、修改、下載、匯出、API、批次工作。</desc><rect width="1060" height="974" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 2｜安全的資料存取判斷流程</text><rect x="260" y="96" width="760" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="280" y="132" font-size="20" font-weight="700">使用者要求</text><text x="280" y="176" font-size="20" font-weight="400">讀取或匯出案件</text><path d="M640 234V268m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="260" y="288" width="760" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="280" y="324" font-size="20" font-weight="700">伺服器檢查工作階段</text><text x="280" y="368" font-size="20" font-weight="400">失效 → 拒絕；有效 → 檢查案件權限</text><path d="M640 426V486m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M260 388H145V468m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="24" y="478" width="250" height="166" rx="14" fill="#f9eaea" stroke="#64748b"/><text x="44" y="514" font-size="20" font-weight="700">失效 → 拒絕</text><text x="44" y="558" font-size="20" font-weight="400">停止處理，不存取案</text><text x="44" y="594" font-size="20" font-weight="400">件資料。</text><rect x="310" y="508" width="710" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="330" y="544" font-size="20" font-weight="700">檢查使用者對該案件的權限</text><text x="330" y="588" font-size="20" font-weight="400">無權限 → 拒絕且不回傳資料內容；有權限 → 存取資料</text><path d="M665 646V683m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M490 706v-16h360v16" fill="none" stroke="#59666e" stroke-width="2"/><rect x="310" y="706" width="340" height="130" rx="14" fill="#f9eaea" stroke="#64748b"/><text x="330" y="742" font-size="20" font-weight="700">無權限 → 拒絕</text><text x="330" y="786" font-size="20" font-weight="400">不回傳資料內容。</text><rect x="680" y="706" width="340" height="130" rx="14" fill="#e8f3ec" stroke="#64748b"/><text x="700" y="742" font-size="20" font-weight="700">有權限 → 存取資料</text><text x="700" y="786" font-size="20" font-weight="400">僅回傳獲准內容。</text><text x="36" y="878" font-size="20" font-weight="400">箭頭代表判斷路徑；失效或無權限即拒絕，不繼續讀取。每個資料入口都要執行檢查：讀取、修改、</text><text x="36" y="914" font-size="20" font-weight="400">下載、匯出、API、批次工作。</text></g></svg>
