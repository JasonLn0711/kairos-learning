<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | A minimum complete flow</title><desc id="desc">Check ingredients after ordering; available and unavailable are conditional branches, not sequential steps.</desc><rect width="1040" height="700" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 1 | A minimum complete flow</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">Customer orders</text><text x="60" y="148" font-size="20" font-weight="400">Input a request</text><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="238" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="266" font-size="22" font-weight="650">Check ingredient availability</text><text x="60" y="310" font-size="20" font-weight="400">Check conditions</text><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="400" width="476" height="122" rx="10" fill="#eaf6ef" stroke="#91bca4"/><text x="60" y="428" font-size="22" font-weight="650">Ingredients available</text><text x="60" y="472" font-size="20" font-weight="400">Prepare and deliver</text><rect x="528" y="400" width="476" height="158" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="552" y="428" font-size="22" font-weight="650">Ingredients unavailable</text><text x="552" y="472" font-size="20" font-weight="400">Explain and offer an</text><text x="552" y="508" font-size="20" font-weight="400">alternative</text><text x="36" y="604" font-size="20" font-weight="400">Check ingredients after ordering; available and unavailable are</text><text x="36" y="640" font-size="20" font-weight="400">conditional branches, not sequential steps.</text></g></svg>
