<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1100" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1｜Minimum complete service flow</title><desc id="desc">Arrows indicate service order. Customers complete a purchase, and you learn whether the business is worth continuing.</desc><rect width="1040" height="1100" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 1｜Minimum complete service flow</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="104" font-size="22" font-weight="650">Customer orders</text><text x="60" y="148" font-size="20" font-weight="400">Select the boxed meal offered</text><path d="M520 204v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="256" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="284" font-size="22" font-weight="650">Confirm the order</text><text x="60" y="328" font-size="20" font-weight="400">Confirm the item and delivery arrangement</text><path d="M520 384v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="436" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="464" font-size="22" font-weight="650">Prepare the meal</text><text x="60" y="508" font-size="20" font-weight="400">Prepare the promised meal</text><path d="M520 564v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="616" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="644" font-size="22" font-weight="650">Handle exceptions</text><text x="60" y="688" font-size="20" font-weight="400">Address stock shortages or failed delivery</text><path d="M520 744v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="796" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="824" font-size="22" font-weight="650">Deliver the meal</text><text x="60" y="868" font-size="20" font-weight="400">The customer receives the meal</text><text x="36" y="1004" font-size="20" font-weight="400">Arrows indicate service order. Customers complete a purchase, and you</text><text x="36" y="1040" font-size="20" font-weight="400">learn whether the business is worth continuing.</text></g></svg>
