<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1422" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4 | Error summary and field messages</title><desc id="desc">Static teaching adaptation of the supplied CMS Design System example. Summary links target the affected fields in this figure. Surname length and MM/DD/YYYY are example-specific rules.</desc><rect width="1060" height="1422" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 4 | Error summary and field messages</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fff5f7" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">1 | Error summary</text><text x="56" y="176" font-size="20" font-weight="400">Complete these items to create your account:</text><rect x="36" y="244" width="988" height="130" rx="14" fill="#fff5f7" stroke="#64748b"/><text x="56" y="280" font-size="20" font-weight="700">2a | Last name</text><text x="56" y="324" font-size="20" font-weight="400">Enter a last name that’s more than 1 character.</text><rect x="36" y="392" width="988" height="130" rx="14" fill="#fff5f7" stroke="#64748b"/><text x="56" y="428" font-size="20" font-weight="700">2b | Date of birth</text><text x="56" y="472" font-size="20" font-weight="400">Enter birthdate as MM/DD/YYYY.</text><rect x="36" y="540" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="576" font-size="20" font-weight="700">Entered first name</text><text x="56" y="620" font-size="20" font-weight="400">Lisa</text><rect x="36" y="688" width="988" height="166" rx="14" fill="#fff5f7" stroke="#64748b"/><text x="56" y="724" font-size="20" font-weight="700">3 | Last-name field message</text><text x="56" y="768" font-size="20" font-weight="400">Enter a last name that’s more than 1 character.</text><text x="56" y="804" font-size="20" font-weight="400">Current value: empty</text><rect x="36" y="872" width="988" height="166" rx="14" fill="#fff5f7" stroke="#64748b"/><text x="56" y="908" font-size="20" font-weight="700">Date-of-birth field message</text><text x="56" y="952" font-size="20" font-weight="400">Enter birthdate as MM/DD/YYYY.</text><text x="56" y="988" font-size="20" font-weight="400">Month: empty / Day: 01 / Year: 1990</text><rect x="36" y="1056" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="1092" font-size="20" font-weight="700">4 | Submit position</text><text x="56" y="1136" font-size="20" font-weight="400">Static illustration; no data is submitted here.</text><text x="36" y="1218" font-size="20" font-weight="400">Source: CMS Design System — Error validation</text><text x="36" y="1290" font-size="20" font-weight="400">Static teaching adaptation of the supplied CMS Design System example.</text><text x="36" y="1326" font-size="20" font-weight="400">Summary links target the affected fields in this figure. Surname</text><text x="36" y="1362" font-size="20" font-weight="400">length and MM/DD/YYYY are example-specific rules.</text></g></svg>
