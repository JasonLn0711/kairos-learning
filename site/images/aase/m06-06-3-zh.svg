<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1096" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜沿資料路徑檢查三個信任邊界</title><desc id="desc">箭頭表示示例資料流；A／B／C 為跨界檢查位置，圖線本身不實作控制。</desc><rect width="1060" height="1096" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 3｜沿資料路徑檢查三個信任邊界</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">不受信任的外部輸入</text><text x="56" y="176" font-size="20" font-weight="400">使用者上傳文件、輸入表單、呼叫 API。</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="298" font-size="20" font-weight="400">信任邊界 A</text><rect x="36" y="354" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="390" font-size="20" font-weight="700">後端應用程式</text><text x="56" y="434" font-size="20" font-weight="400">驗證輸入型別、格式、大小、身分及操作權限。</text><path d="M530 492v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="556" font-size="20" font-weight="400">信任邊界 B</text><rect x="36" y="612" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="648" font-size="20" font-weight="700">內部敏感資料庫</text><text x="56" y="692" font-size="20" font-weight="400">執行資料存取權限及查詢限制。</text><path d="M530 750v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="814" font-size="20" font-weight="400">信任邊界 C</text><rect x="36" y="870" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="906" font-size="20" font-weight="700">對外匯出與分享</text><text x="56" y="950" font-size="20" font-weight="400">限制可輸出欄位、收件對象及資料範圍</text><text x="36" y="1036" font-size="20" font-weight="400">箭頭表示示例資料流；A／B／C 為跨界檢查位置，圖線本身不實作控制。</text></g></svg>
