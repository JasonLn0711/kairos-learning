<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 950" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2｜HTA: task hierarchy</title><desc id="desc">Task 3 further decomposes into identifying omissions → obtaining data → filling it in. This is a hierarchy, not a requirement to perform every task on every attempt. The Plan specifies execution conditions.</desc><rect width="1040" height="950" fill="#ffffff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="20" font-weight="700">Figure 2｜HTA: task hierarchy</text><rect x="36" y="96" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="132" font-size="20" font-weight="700">0. Complete the intake check</text><text x="56" y="174" font-size="20" font-weight="400">Decompose the overall goal into five subtasks.</text><path d="M520 232v15M268 247h504M268 247v15M772 247v15" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="274" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="310" font-size="20" font-weight="700">1. Prepare data</text><text x="56" y="352" font-size="20" font-weight="400">Subtask; the Plan determines</text><text x="56" y="386" font-size="20" font-weight="400">execution.</text><rect x="540" y="274" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="310" font-size="20" font-weight="700">2. Run the check</text><text x="560" y="352" font-size="20" font-weight="400">Subtask; the Plan determines</text><text x="560" y="386" font-size="20" font-weight="400">execution.</text><rect x="36" y="448" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="484" font-size="20" font-weight="700">3. Handle omissions</text><text x="56" y="526" font-size="20" font-weight="400">Subtask; the Plan determines</text><text x="56" y="560" font-size="20" font-weight="400">execution.</text><rect x="540" y="448" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="484" font-size="20" font-weight="700">4. Verify results</text><text x="560" y="526" font-size="20" font-weight="400">Subtask; the Plan determines</text><text x="560" y="560" font-size="20" font-weight="400">execution.</text><rect x="36" y="622" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="658" font-size="20" font-weight="700">5. Export or exit</text><text x="56" y="700" font-size="20" font-weight="400">Subtask; the Plan determines</text><text x="56" y="734" font-size="20" font-weight="400">execution.</text><text x="36" y="824" font-size="20" font-weight="400">Task 3 further decomposes into identifying omissions → obtaining data</text><text x="36" y="858" font-size="20" font-weight="400">→ filling it in. This is a hierarchy, not a requirement to perform</text><text x="36" y="892" font-size="20" font-weight="400">every task on every attempt. The Plan specifies execution conditions.</text></g></svg>
