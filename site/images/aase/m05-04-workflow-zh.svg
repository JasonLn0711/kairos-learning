<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 900" role="img" aria-labelledby="title desc">
<title id="title">圖 1｜SDD 的五步變更流程</title>
<desc id="desc">這是反覆迭代的流程，不代表每一步只能執行一次。</desc>
<rect x="4" y="4" width="832" height="892" rx="16" fill="#fbfcfc" stroke="#cbd5d8"/>
<text x="420" y="45" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#18252c">圖 1｜SDD 的五步變更流程</text>
<text x="420" y="95" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18252c">1. 需求變更（Change Request）</text>
<text x="420" y="131" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">為什麼要改？誰提出？是否已核准？</text>
<path d="M420 183v23m-6-6 6 6 6-6" fill="none" stroke="#526168" stroke-width="2"/>
<text x="420" y="240" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18252c">2. 更新規格（Specification）</text>
<text x="420" y="276" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">新的規則是什麼？原有規則哪些不能破壞？</text>
<path d="M420 328v23m-6-6 6 6 6-6" fill="none" stroke="#526168" stroke-width="2"/>
<text x="420" y="385" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18252c">3. 影響分析與實作（Implementation）</text>
<text x="420" y="421" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">修改哪些畫面、資料、程式與文件？</text>
<path d="M420 473v23m-6-6 6 6 6-6" fill="none" stroke="#526168" stroke-width="2"/>
<text x="420" y="530" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18252c">4. 測試與驗證（Verification）</text>
<text x="420" y="566" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">新功能正確嗎？舊功能有沒有被破壞？</text>
<path d="M420 618v23m-6-6 6 6 6-6" fill="none" stroke="#526168" stroke-width="2"/>
<rect x="22" y="645" width="796" height="116" rx="12" fill="#eaf6f2" stroke="#cbded8"/>
<text x="420" y="675" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#18252c">5. 審查、決策與留下證據</text>
<text x="420" y="711" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">接受、修正或暫緩；必要時回到前面重新確認</text>
<text x="420" y="830" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#18252c">這是反覆迭代的流程，不代表每一步只能執行一次。</text>
</svg>
