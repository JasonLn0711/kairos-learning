<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1118" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | A safe data-access decision flow</title><desc id="desc">Arrows indicate decision paths. An invalid session or denied permission stops access. Check every data entry point: reads, changes, downloads, exports, APIs and batch jobs.</desc><rect width="1060" height="1118" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 2 | A safe data-access decision flow</text><rect x="260" y="96" width="760" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="280" y="132" font-size="20" font-weight="700">User request</text><text x="280" y="176" font-size="20" font-weight="400">Read or export a case</text><path d="M640 234V268m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="260" y="288" width="760" height="130" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="280" y="324" font-size="20" font-weight="700">Server checks session</text><text x="280" y="368" font-size="20" font-weight="400">Invalid → deny; valid → check case permission</text><path d="M640 426V486m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M260 388H145V468m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="24" y="478" width="250" height="202" rx="14" fill="#f9eaea" stroke="#64748b"/><text x="44" y="514" font-size="20" font-weight="700">Invalid → deny</text><text x="44" y="558" font-size="20" font-weight="400">Stop without</text><text x="44" y="594" font-size="20" font-weight="400">accessing case</text><text x="44" y="630" font-size="20" font-weight="400">data.</text><rect x="310" y="508" width="710" height="166" rx="14" fill="#f3f4f5" stroke="#64748b"/><text x="330" y="544" font-size="20" font-weight="700">Check permission for this case</text><text x="330" y="588" font-size="20" font-weight="400">No permission → deny without record content;</text><text x="330" y="624" font-size="20" font-weight="400">permission → access data</text><path d="M665 682V719m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M490 742v-16h360v16" fill="none" stroke="#59666e" stroke-width="2"/><rect x="310" y="742" width="340" height="166" rx="14" fill="#f9eaea" stroke="#64748b"/><text x="330" y="778" font-size="20" font-weight="700">No permission → deny</text><text x="330" y="822" font-size="20" font-weight="400">Return no record</text><text x="330" y="858" font-size="20" font-weight="400">content.</text><rect x="680" y="742" width="340" height="202" rx="14" fill="#e8f3ec" stroke="#64748b"/><text x="700" y="778" font-size="20" font-weight="700">Permission → access</text><text x="700" y="814" font-size="20" font-weight="700">data</text><text x="700" y="858" font-size="20" font-weight="400">Return only approved</text><text x="700" y="894" font-size="20" font-weight="400">content.</text><text x="36" y="986" font-size="20" font-weight="400">Arrows indicate decision paths. An invalid session or denied</text><text x="36" y="1022" font-size="20" font-weight="400">permission stops access. Check every data entry point: reads, changes,</text><text x="36" y="1058" font-size="20" font-weight="400">downloads, exports, APIs and batch jobs.</text></g></svg>
