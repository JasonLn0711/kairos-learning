<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 618" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜Given／When／Then 的三個時間位置</title><desc id="desc">箭頭表示同一情境由前置條件、觸發動作走向預期結果；這是訂餐的合成示例。</desc><rect width="1040" height="618" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 1｜Given／When／Then 的三個時間位置</text><text x="36" y="98" font-size="22" font-weight="650">Given — 假設／前置條件｜開始前</text><text x="36" y="142" font-size="20" font-weight="400">顧客已選擇牛排，但尚未填寫外送地址。</text><path d="M520 202v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><text x="36" y="272" font-size="22" font-weight="650">When — 當／觸發動作｜操作時</text><text x="36" y="316" font-size="20" font-weight="400">顧客按下「確認訂單」。</text><path d="M520 376v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><text x="36" y="446" font-size="22" font-weight="650">Then — 那麼／預期結果｜操作後</text><text x="36" y="490" font-size="20" font-weight="400">系統提示「請填寫外送地址」，不得建立正式訂單，且保留已選餐點。</text><text x="36" y="558" font-size="20" font-weight="400">箭頭表示同一情境由前置條件、觸發動作走向預期結果；這是訂餐的合成示例。</text></g></svg>
