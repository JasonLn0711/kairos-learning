<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 752" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜餐廳資訊系統如何運作（假設範例）</title><desc id="desc">箭頭是資訊傳遞關係：點餐平板→訂單管理系統；訂單管理系統分別傳給廚房、庫存與結帳系統。下方三者是平行接收者，沒有彼此先後關係。</desc><rect width="1320" height="752" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="42" font-size="20" font-weight="700">圖 2｜餐廳資訊系統如何運作（假設範例）</text><rect x="410" y="102" width="500" height="126" rx="16" fill="#edf0f3" stroke="#85998e"/><text x="428" y="138" font-size="20" font-weight="700">點餐平板</text><text x="428" y="178" font-size="20" font-weight="400">送出訂單 → 訂單管理系統</text><path d="M660 233 L660 276" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 266L660 276L666 266" fill="none" stroke="#61736b" stroke-width="2"/><rect x="410" y="284" width="500" height="126" rx="16" fill="#edf0f3" stroke="#85998e"/><text x="428" y="320" font-size="20" font-weight="700">訂單管理系統</text><text x="428" y="360" font-size="20" font-weight="400">接收訂單，分送三類資訊。</text><path d="M660 416 L660 444 L228 444 L228 476" fill="none" stroke="#61736b" stroke-width="2"/><path d="M222 466L228 476L234 466" fill="none" stroke="#61736b" stroke-width="2"/><rect x="32" y="482" width="392" height="126" rx="16" fill="#edf0f3" stroke="#85998e"/><text x="50" y="518" font-size="20" font-weight="700">廚房顯示器</text><text x="50" y="558" font-size="20" font-weight="400">訂單管理系統 → 出餐資訊</text><path d="M660 416 L660 444 L660 444 L660 476" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 466L660 476L666 466" fill="none" stroke="#61736b" stroke-width="2"/><rect x="464" y="482" width="392" height="126" rx="16" fill="#edf0f3" stroke="#85998e"/><text x="482" y="518" font-size="20" font-weight="700">庫存系統</text><text x="482" y="558" font-size="20" font-weight="400">訂單管理系統 → 用量</text><path d="M660 416 L660 444 L1092 444 L1092 476" fill="none" stroke="#61736b" stroke-width="2"/><path d="M1086 466L1092 476L1098 466" fill="none" stroke="#61736b" stroke-width="2"/><rect x="896" y="482" width="392" height="126" rx="16" fill="#edf0f3" stroke="#85998e"/><text x="914" y="518" font-size="20" font-weight="700">結帳系統</text><text x="914" y="558" font-size="20" font-weight="400">訂單管理系統 → 金額</text><text x="32" y="658" font-size="20" font-weight="400">箭頭是資訊傳遞關係：點餐平板→訂單管理系統；訂單管理系統分別傳給廚房、庫存與結帳系統。下方三者是平行接收者，沒有彼</text><text x="32" y="692" font-size="20" font-weight="400">此先後關係。</text></g></svg>
