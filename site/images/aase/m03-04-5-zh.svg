<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 884" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜一個簡單的變更決策框架</title><desc id="desc">箭頭表示決策順序；是／否分支互斥，兩者都回到範圍負責角色確認。</desc><rect width="1040" height="884" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 5｜一個簡單的變更決策框架</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="104" font-size="22" font-weight="650">收到新功能要求</text><text x="60" y="148" font-size="20" font-weight="400">先釐清要新增的能力</text><path d="M520 204v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="256" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="284" font-size="22" font-weight="650">它是否為驗證核心問題所必需？</text><text x="60" y="328" font-size="20" font-weight="400">依原定問題判斷必要性</text><path d="M274 384v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><path d="M766 384v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36.0" y="436" width="476.0" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60.0" y="464" font-size="22" font-weight="650">是：評估交換範圍或調整資源</text><text x="60.0" y="508" font-size="20" font-weight="400">更新規格、測試、時程與責任</text><rect x="528.0" y="436" width="476.0" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="552.0" y="464" font-size="22" font-weight="650">否：列入延後或本版不做</text><text x="552.0" y="508" font-size="20" font-weight="400">記錄理由及重新討論條件</text><path d="M274.0 564v28H520" fill="none" stroke="#526770" stroke-width="2"/><path d="M766.0 564v28H520" fill="none" stroke="#526770" stroke-width="2"/><path d="M520 592v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="616" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="644" font-size="22" font-weight="650">由範圍負責角色確認決定</text><text x="60" y="688" font-size="20" font-weight="400">保留變更紀錄，讓開發、規格與驗收一致</text><text x="36" y="824" font-size="20" font-weight="400">箭頭表示決策順序；是／否分支互斥，兩者都回到範圍負責角色確認。</text></g></svg>
