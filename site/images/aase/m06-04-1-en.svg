<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1284" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Conceptual flow of a web action</title><desc id="desc">Arrows show the conceptual processing order in this example; verify the actual architecture and communication separately.</desc><rect width="1040" height="1284" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 1 | Conceptual flow of a web action</text><circle cx="520" cy="100" r="10" fill="none" stroke="#65757c"/><text x="520" y="138" font-size="20" font-weight="700" text-anchor="middle">1. User action</text><text x="520" y="178" font-size="20" font-weight="400" text-anchor="middle">Choose beef noodles and press submit</text><path d="M520 218v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><circle cx="520" cy="282" r="10" fill="none" stroke="#65757c"/><text x="520" y="320" font-size="20" font-weight="700" text-anchor="middle">2. Browser</text><text x="520" y="360" font-size="20" font-weight="400" text-anchor="middle">Collect item, quantity, table number and other data</text><path d="M520 400v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><circle cx="520" cy="464" r="10" fill="none" stroke="#65757c"/><text x="520" y="502" font-size="20" font-weight="700" text-anchor="middle">3. HTTP / other communication</text><text x="520" y="542" font-size="20" font-weight="400" text-anchor="middle">Send data to the order-processing system</text><path d="M520 582v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><circle cx="520" cy="646" r="10" fill="none" stroke="#65757c"/><text x="520" y="684" font-size="20" font-weight="700" text-anchor="middle">4. Server</text><text x="520" y="724" font-size="20" font-weight="400" text-anchor="middle">Check products, prices, inventory and permission to order</text><path d="M520 764v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><circle cx="520" cy="828" r="10" fill="none" stroke="#65757c"/><text x="520" y="866" font-size="20" font-weight="700" text-anchor="middle">5. Storage and business processing</text><text x="520" y="906" font-size="20" font-weight="400" text-anchor="middle">Create the order and save the result</text><path d="M520 946v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="24" y="986" width="992" height="150" rx="12" fill="#eaf6ef"/><circle cx="520" cy="1010" r="10" fill="none" stroke="#65757c"/><text x="520" y="1048" font-size="20" font-weight="700" text-anchor="middle">6. Return the result</text><text x="520" y="1088" font-size="20" font-weight="400" text-anchor="middle">Show order acceptance or explain the failure</text><text x="36" y="1188" font-size="20" font-weight="400">Arrows show the conceptual processing order in this example; verify</text><text x="36" y="1224" font-size="20" font-weight="400">the actual architecture and communication separately.</text></g></svg>
