<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1032" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜從定位專案到停止服務的五步流程</title><desc id="desc">編號與箭頭只表示操作順序；每一步都核對實際結果，啟動骨架不表示功能驗收通過。</desc><rect width="1060" height="1032" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 3｜從定位專案到停止服務的五步流程</text><rect x="36" y="96" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="132" font-size="20" font-weight="700">找到正確的專案根目錄</text><text x="56" y="176" font-size="20" font-weight="400">確認 README、requirements.txt、starter 在預期位置。</text><path d="M530 234v24m-7-7 7 7 7-7" fill="none" stroke="#506573" stroke-width="2"/><rect x="36" y="274" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="310" font-size="20" font-weight="700">建立並啟用虛擬環境</text><text x="56" y="354" font-size="20" font-weight="400">確認使用的是符合要求的 Python。</text><path d="M530 412v24m-7-7 7 7 7-7" fill="none" stroke="#506573" stroke-width="2"/><rect x="36" y="452" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="488" font-size="20" font-weight="700">安裝依賴套件</text><text x="56" y="532" font-size="20" font-weight="400">確認安裝命令成功結束。</text><path d="M530 590v24m-7-7 7 7 7-7" fill="none" stroke="#506573" stroke-width="2"/><rect x="36" y="630" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="666" font-size="20" font-weight="700">啟動程式</text><text x="56" y="710" font-size="20" font-weight="400">瀏覽器實際顯示起始骨架。</text><path d="M530 768v24m-7-7 7 7 7-7" fill="none" stroke="#506573" stroke-width="2"/><rect x="36" y="808" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="844" font-size="20" font-weight="700">停止並留下證據</text><text x="56" y="888" font-size="20" font-weight="400">正確結束服務，記錄成功、失敗與尚未驗證的項目。</text><text x="36" y="976" font-size="20" font-weight="400">編號與箭頭只表示操作順序；每一步都核對實際結果，啟動骨架不表示功能驗收通過。</text></g></svg>
