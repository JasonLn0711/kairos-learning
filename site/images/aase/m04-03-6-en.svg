<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 932" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 6 | From user tasks to a testable interface</title><desc id="desc">Arrows indicate the suggested order of design work. Step five includes validation; drawing a wireframe does not establish acceptance by real users.</desc><rect width="1040" height="932" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 6 | From user tasks to a testable interface</text><rect x="36" y="74" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="98" font-size="22" font-weight="700">1. Define users and tasks</text><text x="56" y="138" font-size="20" font-weight="400">Who will use it? What are they trying to accomplish?</text><path d="M520 190v22m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="222" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="246" font-size="22" font-weight="700">2. Inventory content and functions</text><text x="56" y="286" font-size="20" font-weight="400">Which data, buttons, errors and results are needed?</text><path d="M520 338v22m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="370" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="394" font-size="22" font-weight="700">3. Build IA: categories, names and relationships</text><text x="56" y="434" font-size="20" font-weight="400">Which information belongs together?</text><path d="M520 486v22m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="518" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="542" font-size="22" font-weight="700">4. Define states, navigation and visual hierarchy</text><text x="56" y="582" font-size="20" font-weight="400">What should users notice and do in each state?</text><path d="M520 634v22m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="666" width="968" height="108" rx="12" fill="#e3ecfb" stroke="#bccbd0"/><text x="56" y="690" font-size="22" font-weight="700">5. Draw and validate a wireframe</text><text x="56" y="730" font-size="20" font-weight="400">Check desktop, mobile, keyboard use and real work tasks.</text><text x="36" y="810" font-size="20" font-weight="400">Arrows indicate the suggested order of design work. Step five includes</text><text x="36" y="844" font-size="20" font-weight="400">validation; drawing a wireframe does not establish acceptance by real</text><text x="36" y="878" font-size="20" font-weight="400">users.</text></g></svg>
