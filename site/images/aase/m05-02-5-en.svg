<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1036" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5 | Collaborate with AI using a specification</title><desc id="desc">Numbers indicate collaboration order. Changed requirements require revisiting the relevant specification and tests. An AI completion message still requires executed test evidence.</desc><rect width="1040" height="1036" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="40" font-size="20" font-weight="700">Figure 5 | Collaborate with AI using a specification</text><rect x="32" y="92" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="128" font-size="20" font-weight="700">1  Write a User Story</text><text x="52" y="172" font-size="20" font-weight="400">Establish the user and purpose.</text><rect x="32" y="238" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="274" font-size="20" font-weight="700">2  Add FR, NFR and constraints</text><text x="52" y="318" font-size="20" font-weight="400">Define behavior, quality and boundaries.</text><rect x="32" y="384" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="420" font-size="20" font-weight="700">3  Add Acceptance Criteria</text><text x="52" y="464" font-size="20" font-weight="400">Cover normal, error and boundary scenarios.</text><rect x="32" y="530" width="976" height="164" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="566" font-size="20" font-weight="700">4  Ask an AI Coding Agent to implement</text><text x="52" y="610" font-size="20" font-weight="400">Follow the specification and do not invent consequential business</text><text x="52" y="646" font-size="20" font-weight="400">rules.</text><rect x="32" y="712" width="976" height="164" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="748" font-size="20" font-weight="700">5  Execute tests and retain evidence</text><text x="52" y="792" font-size="20" font-weight="400">Compare results against requirements and leave untested items</text><text x="52" y="828" font-size="20" font-weight="400">unverified.</text><text x="32" y="906" font-size="20" font-weight="400">Numbers indicate collaboration order. Changed requirements require</text><text x="32" y="942" font-size="20" font-weight="400">revisiting the relevant specification and tests. An AI completion</text><text x="32" y="978" font-size="20" font-weight="400">message still requires executed test evidence.</text></g></svg>
