<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1024" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | A minimum complete document workflow</title><desc id="desc">Enter, check, correct and recheck, preview, then export. Missing input blocks complete export; edits invalidate the old result.</desc><rect width="1040" height="1024" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 2 | A minimum complete document workflow</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="104" font-size="22" font-weight="650">1. Enter data</text><text x="94" y="148" font-size="20" font-weight="400">The user enters three fields</text><path d="M4 3h10l6 6v12H4V3Zm10 0v6h6M1 13h10m-4-4 4 4-4 4" transform="translate(54 86)" fill="none" stroke="#18252c" stroke-width="1.6"/><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="238" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="266" font-size="22" font-weight="650">2. Check data</text><text x="94" y="310" font-size="20" font-weight="400">The system checks for missing required fields</text><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm5 12 6 6M7 10l2 2 4-5" transform="translate(54 248)" fill="none" stroke="#18252c" stroke-width="1.6"/><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="400" width="968" height="158" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="428" font-size="22" font-weight="650">3. Show feedback and correct</text><text x="94" y="472" font-size="20" font-weight="400">Block complete export when input is missing; check again after</text><text x="94" y="508" font-size="20" font-weight="400">correction</text><path d="m3 17-1 5 5-1L21 7l-5-5L3 17Zm10-12 5 5" transform="translate(54 410)" fill="none" stroke="#18252c" stroke-width="1.6"/><path d="M520 568v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="598" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="626" font-size="22" font-weight="650">4. Preview the result</text><text x="94" y="670" font-size="20" font-weight="400">Confirm the report reflects the current input</text><path d="M4 3h10l6 6v12H4V3Zm10 0v6h6M8 14l3 3 5-6" transform="translate(54 608)" fill="none" stroke="#18252c" stroke-width="1.6"/><path d="M520 730v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="760" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="788" font-size="22" font-weight="650">5. Export the report</text><text x="94" y="832" font-size="20" font-weight="400">Allow complete-report export only when conditions are met</text><path d="M12 2v14m-5-5 5 5 5-5M4 17v5h16v-5" transform="translate(54 770)" fill="none" stroke="#18252c" stroke-width="1.6"/><text x="36" y="928" font-size="20" font-weight="400">Enter, check, correct and recheck, preview, then export. Missing</text><text x="36" y="964" font-size="20" font-weight="400">input blocks complete export; edits invalidate the old result.</text></g></svg>
