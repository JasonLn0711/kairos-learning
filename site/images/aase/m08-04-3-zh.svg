<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 940" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜五種 AppTest 語法的白話對照</title><desc id="desc">這五項各自說明一種操作或斷言；沒有箭頭，不代表必須依此順序連續執行。</desc><rect width="1060" height="940" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 3｜五種 AppTest 語法的白話對照</text><rect x="36" y="98" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="134" font-size="20" font-weight="700">AppTest.from_file(&quot;app.py&quot;)</text><text x="56" y="178" font-size="20" font-weight="400">告訴測試工具：「我要測試這支應用程式。」</text><rect x="36" y="252" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="288" font-size="20" font-weight="700">.input(&quot;SYN-001&quot;)</text><text x="56" y="332" font-size="20" font-weight="400">模擬使用者在指定輸入框填寫 SYN-001。</text><rect x="36" y="406" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="442" font-size="20" font-weight="700">.click().run()</text><text x="56" y="486" font-size="20" font-weight="400">模擬按下按鈕，再重新執行程式。</text><rect x="36" y="560" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="596" font-size="20" font-weight="700">assert at.success</text><text x="56" y="640" font-size="20" font-weight="400">要求新畫面必須出現成功提示。</text><rect x="36" y="714" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="750" font-size="20" font-weight="700">assert not at.success</text><text x="56" y="794" font-size="20" font-weight="400">要求畫面不得出現成功提示。</text><text x="36" y="880" font-size="20" font-weight="400">這五項各自說明一種操作或斷言；沒有箭頭，不代表必須依此順序連續執行。</text></g></svg>
