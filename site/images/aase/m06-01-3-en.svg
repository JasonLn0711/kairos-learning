<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1312" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | User Flow for the intake completeness checker</title><desc id="desc">Enter → check → completeness decision. No: show omissions → correct → return to Check. Yes: preview → download JSON. These are actions and recovery conditions, not software architecture. Editing invalidates old results; export revalidates.</desc><rect width="1320" height="1312" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="42" font-size="20" font-weight="700">Figure 3 | User Flow for the intake completeness checker</text><rect x="410" y="102" width="500" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="428" y="138" font-size="20" font-weight="700">Enter intake data</text><text x="428" y="178" font-size="20" font-weight="400">Enter the three required teaching</text><text x="428" y="212" font-size="20" font-weight="400">fields.</text><path d="M660 267 L660 305" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 295L660 305L666 295" fill="none" stroke="#61736b" stroke-width="2"/><rect x="410" y="316" width="500" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="428" y="352" font-size="20" font-weight="700">Press Check</text><text x="428" y="392" font-size="20" font-weight="400">Check the current input.</text><path d="M660 447 L660 485" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 475L660 485L666 475" fill="none" stroke="#61736b" stroke-width="2"/><rect x="410" y="496" width="500" height="160" rx="16" fill="#eefaf3" stroke="#85998e"/><text x="428" y="532" font-size="20" font-weight="700">Is the data complete?</text><text x="428" y="572" font-size="20" font-weight="400">Branch on the teaching</text><text x="428" y="606" font-size="20" font-weight="400">completeness rules.</text><path d="M660 662 L660 688 L320 688 L320 720" fill="none" stroke="#61736b" stroke-width="2"/><path d="M314 710L320 720L326 710" fill="none" stroke="#61736b" stroke-width="2"/><path d="M660 688 L1000 688 L1000 720" fill="none" stroke="#61736b" stroke-width="2"/><path d="M994 710L1000 720L1006 710" fill="none" stroke="#61736b" stroke-width="2"/><rect x="80" y="726" width="480" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="98" y="762" font-size="20" font-weight="700">No: show missing fields</text><text x="98" y="802" font-size="20" font-weight="400">Identify information to supply</text><text x="98" y="836" font-size="20" font-weight="400">or correct.</text><rect x="760" y="726" width="480" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="778" y="762" font-size="20" font-weight="700">Yes: preview results</text><text x="778" y="802" font-size="20" font-weight="400">Inspect results for the current</text><text x="778" y="836" font-size="20" font-weight="400">input.</text><path d="M320 891 L320 932" fill="none" stroke="#61736b" stroke-width="2"/><path d="M314 922L320 932L326 922" fill="none" stroke="#61736b" stroke-width="2"/><path d="M1000 891 L1000 932" fill="none" stroke="#61736b" stroke-width="2"/><path d="M994 922L1000 932L1006 922" fill="none" stroke="#61736b" stroke-width="2"/><rect x="80" y="940" width="480" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="98" y="976" font-size="20" font-weight="700">Supply or correct data</text><text x="98" y="1016" font-size="20" font-weight="400">→ Return to Press Check with</text><text x="98" y="1050" font-size="20" font-weight="400">updated input.</text><rect x="760" y="940" width="480" height="194" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="778" y="976" font-size="20" font-weight="700">Download JSON report</text><text x="778" y="1016" font-size="20" font-weight="400">Revalidate before download;</text><text x="778" y="1050" font-size="20" font-weight="400">completeness is not official</text><text x="778" y="1084" font-size="20" font-weight="400">intake.</text><path d="M78 985 L28 985 L28 431 L402 431" fill="none" stroke="#61736b" stroke-width="2"/><path d="M392 437L402 431L392 425" fill="none" stroke="#61736b" stroke-width="2"/><text x="32" y="1184" font-size="20" font-weight="400">Enter → check → completeness decision. No: show omissions → correct → return to Check. Yes:</text><text x="32" y="1218" font-size="20" font-weight="400">preview → download JSON. These are actions and recovery conditions, not software</text><text x="32" y="1252" font-size="20" font-weight="400">architecture. Editing invalidates old results; export revalidates.</text></g></svg>
