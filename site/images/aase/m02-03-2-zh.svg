<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜已處理的 K/V 與新 token</title><desc id="desc">前四格是已處理的詞塊；箭頭表示接續生成，新位置仍需計算。這不是實際 tokenizer 的輸出。</desc><rect width="1040" height="380" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 2｜已處理的 K/V 與新 token</text><rect x="36.0" y="72" width="180.8" height="122" rx="10" fill="#e8f4ef" stroke="#90c7b9"/><text x="52.0" y="100" font-size="22">今天</text><text x="52.0" y="144" font-size="20">K/V 可重用</text><rect x="232.8" y="72" width="180.8" height="122" rx="10" fill="#e8f4ef" stroke="#90c7b9"/><text x="248.8" y="100" font-size="22">我們</text><text x="248.8" y="144" font-size="20">K/V 可重用</text><rect x="429.6" y="72" width="180.8" height="122" rx="10" fill="#e8f4ef" stroke="#90c7b9"/><text x="445.6" y="100" font-size="22">來</text><text x="445.6" y="144" font-size="20">K/V 可重用</text><rect x="626.4000000000001" y="72" width="180.8" height="122" rx="10" fill="#e8f4ef" stroke="#90c7b9"/><text x="642.4000000000001" y="100" font-size="22">設計</text><text x="642.4000000000001" y="144" font-size="20">K/V 可重用</text><path d="M810.2 115h10m-6-6 6 6-6 6" fill="none" stroke="#637982" stroke-width="2"/><rect x="823.2" y="72" width="180.8" height="158" rx="10" fill="#eceffc" stroke="#a6b4ec"/><text x="839.2" y="100" font-size="22">系統</text><text x="839.2" y="144" font-size="20">新 token 仍</text><text x="839.2" y="180" font-size="20">需計算</text><text x="36" y="284" font-size="20">前四格是已處理的詞塊；箭頭表示接續生成，新位置仍需計算。這不是實際 tokenizer 的輸出</text><text x="36" y="320" font-size="20">。</text></g></svg>
