<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 567" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜Q、K、V 的圖書館比喻</title><desc id="desc">三列說明不同角色。圖書館是比喻；模型實際計算的是向量。</desc><rect width="1040" height="567" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 4｜Q、K、V 的圖書館比喻</text><rect x="36.0" y="70" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="98" font-size="22">Q｜Query：我要找什麼？</text><text x="56.0" y="142" font-size="20">像讀者拿著查詢需求，準備比對線索。</text><rect x="36.0" y="203" width="952.0" height="120" rx="10" fill="#edf8f5" stroke="#79aaa0"/><text x="56.0" y="231" font-size="22">K｜Key：有哪些可以比對的線索？</text><text x="56.0" y="275" font-size="20">像每本書的索引資訊，用來判斷匹配程度。</text><rect x="36.0" y="336" width="952.0" height="120" rx="10" fill="#fff4e9" stroke="#c8a17c"/><text x="56.0" y="364" font-size="22">V｜Value：要取回什麼資訊？</text><text x="56.0" y="408" font-size="20">像根據匹配程度，從各本書取得並組合內容。</text><text x="36" y="509" font-size="20">三列說明不同角色。圖書館是比喻；模型實際計算的是向量。</text></g></svg>
