<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 910" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Questions and Responsibilities Across M02</title><desc id="desc">The six rows relate course concepts, not six mandatory runtime stages.</desc><rect width="1040" height="910" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 3 | Questions and Responsibilities Across M02</text><rect x="36" y="70" width="968" height="114" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">M02-01</text><text x="186" y="98" font-size="20" font-weight="400">How does the model process and generate text? | Token,</text><text x="186" y="134" font-size="20" font-weight="400">Transformer, Attention</text><rect x="36" y="194" width="968" height="114" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="222" font-size="22" font-weight="650">M02-02</text><text x="186" y="222" font-size="20" font-weight="400">What information can the model see this time? | Context</text><text x="186" y="258" font-size="20" font-weight="400">Window</text><rect x="36" y="318" width="968" height="150" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="346" font-size="22" font-weight="650">M02-03</text><text x="186" y="346" font-size="20" font-weight="400">How is information reused, condensed, retrieved and</text><text x="186" y="382" font-size="20" font-weight="400">retained in long tasks? | KV Cache, Compaction, RAG,</text><text x="186" y="418" font-size="20" font-weight="400">Memory</text><rect x="36" y="478" width="968" height="78" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="506" font-size="22" font-weight="650">M02-04</text><text x="186" y="506" font-size="20" font-weight="400">Who decides the next step? | Chatbot, Workflow, Agent</text><rect x="36" y="566" width="968" height="114" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="594" font-size="22" font-weight="650">M02-05</text><text x="186" y="594" font-size="20" font-weight="400">What support mechanisms surround the model? | Agent</text><text x="186" y="630" font-size="20" font-weight="400">Harness</text><rect x="36" y="690" width="968" height="114" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="718" font-size="22" font-weight="650">M02-06</text><text x="186" y="718" font-size="20" font-weight="400">Are tool actions authorized, executed and evidenced? |</text><text x="186" y="754" font-size="20" font-weight="400">Tool Calling, Sandbox, Observability</text><text x="36" y="850" font-size="20" font-weight="400">The six rows relate course concepts, not six mandatory runtime stages.</text></g></svg>
