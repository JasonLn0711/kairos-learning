<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 718" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜免運門檻示範</title><desc id="desc">訂單金額為 0～2,000 整數；滿 1,000 免運，否則 60。這是規則示範，沒有執行 Python 或 pytest。</desc><rect width="1060" height="718" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 2｜免運門檻示範</text><rect x="36" y="96" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">訂單金額</text><text x="56" y="176" font-size="20" font-weight="400">999</text><rect x="36" y="242" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="278" font-size="20" font-weight="700">預期運費</text><text x="56" y="322" font-size="20" font-weight="400">60</text><rect x="36" y="388" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="424" font-size="20" font-weight="700">免運門檻</text><text x="56" y="468" font-size="20" font-weight="400">1000</text><text x="36" y="554" font-size="20" font-weight="400">999 &lt; 1000 → 60; 1000 ≥ 1000 → 0</text><text x="36" y="622" font-size="20" font-weight="400">訂單金額為 0～2,000 整數；滿 1,000 免運，否則 60。這是規則示範，沒有執行 Python</text><text x="36" y="658" font-size="20" font-weight="400">或 pytest。</text></g></svg>
