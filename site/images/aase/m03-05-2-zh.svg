<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 612" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜功能指標與任務指標</title><desc id="desc">兩種指標分開取得證據，彼此補充。</desc><rect width="1040" height="612" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 2｜功能指標與任務指標</text><rect x="36" y="76" width="968" height="210" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="104" font-size="22" font-weight="650">功能指標（Functional Metric）</text><text x="94" y="148" font-size="20" font-weight="400">系統有沒有依照預先設定的規則正確運作？</text><text x="94" y="192" font-size="20" font-weight="400">例如：缺件時是否阻擋匯出？修改資料後，是否要求重新檢查？</text><text x="94" y="236" font-size="20" font-weight="400">驗證方式通常是自動化測試、人工操作測試。</text><path d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6l8-4Zm-4 10 3 3 5-6" transform="translate(50 86)" fill="none" stroke="#18252c" stroke-width="1.6"/><rect x="36" y="296" width="968" height="210" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="94" y="324" font-size="22" font-weight="650">任務指標（Task Metric）</text><text x="94" y="368" font-size="20" font-weight="400">使用者能不能順利完成真正想做的事情？</text><text x="94" y="412" font-size="20" font-weight="400">例如：第一次使用的人，能否自己找到缺漏、補齊資料、取得正確報告？</text><text x="94" y="456" font-size="20" font-weight="400">驗證方式可能是使用者任務測試、計時、觀察操作過程。</text><path d="M9 4a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM2 21v-3a7 7 0 0 1 14 0v3M17 4a3 3 0 0 1 0 6m1 4a5 5 0 0 1 4 5" transform="translate(50 306)" fill="none" stroke="#18252c" stroke-width="1.6"/><text x="36" y="552" font-size="20" font-weight="400">兩種指標分開取得證據，彼此補充。</text></g></svg>
