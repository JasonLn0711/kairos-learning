<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1174" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | From Task Request to Acceptance</title><desc id="desc">Manager’s task: confirm the weekend subject limit. Arrows show this example’s steps; authorization and recording remain active throughout.</desc><rect width="1040" height="1174" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 1 | From Task Request to Acceptance</text><text x="36" y="98" font-size="20" font-weight="400">Manager’s task: confirm the weekend subject limit. Arrows show this</text><text x="36" y="134" font-size="20" font-weight="400">example’s steps; authorization and recording remain active throughout.</text><path d="M520 180v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="222" width="968" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="250" font-size="22" font-weight="650">1. Tool Calling — Request</text><text x="56" y="294" font-size="20" font-weight="400">The employee says, “I want to read the requirements document in the</text><text x="56" y="330" font-size="20" font-weight="400">archive.”</text><path d="M520 390v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="420" width="968" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="448" font-size="22" font-weight="650">2. Authorization — Check permission</text><text x="56" y="492" font-size="20" font-weight="400">The administrator checks whether this employee may read the document.</text><path d="M520 552v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="582" width="968" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="610" font-size="22" font-weight="650">3. Sandbox — Restrict scope</text><text x="56" y="654" font-size="20" font-weight="400">Read only the specified document; do not delete, change or upload</text><text x="56" y="690" font-size="20" font-weight="400">data.</text><path d="M520 750v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="780" width="968" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="808" font-size="22" font-weight="650">4. Observability — Record events</text><text x="56" y="852" font-size="20" font-weight="400">Record who requested the read, which version was read, and whether</text><text x="56" y="888" font-size="20" font-weight="400">it succeeded or failed.</text><path d="M520 948v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="978" width="968" height="158" rx="10" fill="#eaf6ef" stroke="#91bca4"/><text x="56" y="1006" font-size="22" font-weight="650">5. Verification — Accept the result</text><text x="56" y="1050" font-size="20" font-weight="400">Confirm that the document is current and the weekend rule was</text><text x="56" y="1086" font-size="20" font-weight="400">interpreted correctly.</text></g></svg>
