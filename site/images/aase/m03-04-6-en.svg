<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1280" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 6｜The lesson knowledge map</title><desc id="desc">Arrows indicate the decision process, not completed real-world validation.</desc><rect width="1040" height="1280" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 6｜The lesson knowledge map</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="104" font-size="22" font-weight="650">1. Define the problem</text><text x="60" y="148" font-size="20" font-weight="400">What are we trying to solve?</text><path d="M520 204v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="256" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="284" font-size="22" font-weight="650">2. Identify the riskiest assumption</text><text x="60" y="328" font-size="20" font-weight="400">Which wrong judgment would have the greatest impact?</text><path d="M520 384v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="436" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="464" font-size="22" font-weight="650">3. Design the MVP</text><text x="60" y="508" font-size="20" font-weight="400">What minimum complete flow answers the core question?</text><path d="M520 564v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="616" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="644" font-size="22" font-weight="650">4. Define scope</text><text x="60" y="688" font-size="20" font-weight="400">First version, deferred, excluded; which constraints must hold?</text><path d="M520 744v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="796" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="824" font-size="22" font-weight="650">5. Validate</text><text x="60" y="868" font-size="20" font-weight="400">Use tests, observation and inspectable data as evidence</text><path d="M520 924v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="976" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="1004" font-size="22" font-weight="650">6. Decide the next step</text><text x="60" y="1048" font-size="20" font-weight="400">Continue, adjust, expand or stop</text><text x="36" y="1184" font-size="20" font-weight="400">Arrows indicate the decision process, not completed real-world</text><text x="36" y="1220" font-size="20" font-weight="400">validation.</text></g></svg>
