<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 980" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜Git 的四個位置</title><desc id="desc">向下箭頭依序表示 git add、git commit、git push；這是簡化的單向路徑。推送到遠端不代表已部署，也不代表測試或驗收通過。</desc><rect width="1060" height="980" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 1｜Git 的四個位置</text><rect x="36" y="90" width="988" height="124" rx="14" fill="#fbfcfd" stroke="#b4c5cc"/><text x="56" y="126" font-size="20" font-weight="700">1. 工作區（Working Directory）</text><text x="56" y="166" font-size="20" font-weight="400">你正在修改的草稿</text><path d="M56 226v24m-6-6 6 6 6-6" fill="none" stroke="#59666e" stroke-width="2"/><text x="86" y="248" font-size="20" font-weight="400">git add：挑選本次要歸檔的內容</text><rect x="36" y="298" width="988" height="124" rx="14" fill="#ecf3f8" stroke="#b4c5cc"/><text x="56" y="334" font-size="20" font-weight="700">2. 暫存區（Staging Area / Index）</text><text x="56" y="374" font-size="20" font-weight="400">已選定、準備封存的修改</text><path d="M56 434v24m-6-6 6 6 6-6" fill="none" stroke="#59666e" stroke-width="2"/><text x="86" y="456" font-size="20" font-weight="400">git commit：正式建立版本紀錄</text><rect x="36" y="506" width="988" height="124" rx="14" fill="#ebf4f0" stroke="#b4c5cc"/><text x="56" y="542" font-size="20" font-weight="700">3. 本機儲存庫（Local Repository）</text><text x="56" y="582" font-size="20" font-weight="400">已封存、可以追溯的版本歷史</text><path d="M56 642v24m-6-6 6 6 6-6" fill="none" stroke="#59666e" stroke-width="2"/><text x="86" y="664" font-size="20" font-weight="400">git push：將提交送往遠端</text><rect x="36" y="714" width="988" height="124" rx="14" fill="#fbfcfd" stroke="#b4c5cc"/><text x="56" y="750" font-size="20" font-weight="700">4. 遠端儲存庫（Remote Repository）</text><text x="56" y="790" font-size="20" font-weight="400">例如 GitHub 上的共享版本紀錄</text><text x="36" y="884" font-size="20" font-weight="400">向下箭頭依序表示 git add、git commit、git push；這是簡化的單向路徑。推送到遠</text><text x="36" y="920" font-size="20" font-weight="400">端不代表已部署，也不代表測試或驗收通過。</text></g></svg>
