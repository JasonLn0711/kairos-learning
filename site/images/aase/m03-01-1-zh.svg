<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 370" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜先理解困難，再選擇解法</title><desc id="desc">兩欄是平行比喻；共同原則是問題先於解決方案（Problem Before Solution），不是醫療診斷接著軟體開發的流程。</desc><rect width="1040" height="370" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 1｜先理解困難，再選擇解法</text><rect x="36" y="70" width="476" height="158" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">醫療診斷</text><text x="56" y="142" font-size="20" font-weight="400">病人說：「我要抗生素。」先找出症狀與病</text><text x="56" y="178" font-size="20" font-weight="400">因，才決定治療方式。</text><rect x="528" y="70" width="476" height="158" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="548" y="98" font-size="22" font-weight="650">軟體工程</text><text x="548" y="142" font-size="20" font-weight="400">使用者說：「我要 AI 系統。」先找出工作</text><text x="548" y="178" font-size="20" font-weight="400">困難，才決定是否需要 AI。</text><text x="36" y="274" font-size="20" font-weight="400">兩欄是平行比喻；共同原則是問題先於解決方案（Problem Before Solution），不是醫療</text><text x="36" y="310" font-size="20" font-weight="400">診斷接著軟體開發的流程。</text></g></svg>
