<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 892" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜依規格進行 AI 協作</title><desc id="desc">編號表示協作順序；需求變更時回到相關規格與測試重新確認。AI 的完成回覆仍需實際測試證據。</desc><rect width="1040" height="892" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="40" font-size="20" font-weight="700">圖 5｜依規格進行 AI 協作</text><rect x="32" y="92" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="128" font-size="20" font-weight="700">1  先寫 User Story</text><text x="52" y="172" font-size="20" font-weight="400">確認使用者與目的。</text><rect x="32" y="238" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="274" font-size="20" font-weight="700">2  補 FR、NFR、Constraints</text><text x="52" y="318" font-size="20" font-weight="400">定義功能、品質及界線。</text><rect x="32" y="384" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="420" font-size="20" font-weight="700">3  補 Acceptance Criteria</text><text x="52" y="464" font-size="20" font-weight="400">寫出正常、錯誤及邊界情境。</text><rect x="32" y="530" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="566" font-size="20" font-weight="700">4  交給 AI Coding Agent 實作</text><text x="52" y="610" font-size="20" font-weight="400">要求依照規格開發，不自行假定重要業務規則。</text><rect x="32" y="676" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="712" font-size="20" font-weight="700">5  執行測試並保留證據</text><text x="52" y="756" font-size="20" font-weight="400">檢查結果是否符合需求，未測試的項目不得宣稱通過。</text><text x="32" y="834" font-size="20" font-weight="400">編號表示協作順序；需求變更時回到相關規格與測試重新確認。AI 的完成回覆仍需實際測試證據。</text></g></svg>
