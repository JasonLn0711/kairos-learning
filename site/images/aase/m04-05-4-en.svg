<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 696" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4 | Accordion: headings remain visible</title><desc id="desc">Static structure: only the second of three panels is expanded. Symbols indicate states, not sequence. A working control needs keyboard access and an exposed expanded state.</desc><rect width="1040" height="696" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 4 | Accordion: headings remain visible</text><rect x="120" y="88" width="800" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="140" y="126" font-size="22" font-weight="700">Heading 1 ▾</text><text x="140" y="170" font-size="20" font-weight="400">Collapsed; the heading remains visible.</text><rect x="120" y="238" width="800" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="140" y="276" font-size="22" font-weight="700">Heading 2 ▴</text><text x="140" y="320" font-size="20" font-weight="400">Expanded: the panel appears when the accordion is expanded.</text><rect x="120" y="388" width="800" height="134" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="140" y="426" font-size="22" font-weight="700">Heading 3 ▾</text><text x="140" y="470" font-size="20" font-weight="400">Collapsed; the heading remains visible.</text><text x="36" y="558" font-size="20" font-weight="400">Static structure: only the second of three panels is expanded. Symbols</text><text x="36" y="594" font-size="20" font-weight="400">indicate states, not sequence. A working control needs keyboard access and</text><text x="36" y="630" font-size="20" font-weight="400">an exposed expanded state.</text></g></svg>
