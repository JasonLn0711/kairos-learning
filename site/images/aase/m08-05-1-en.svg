<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1344" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Task-based usability testing workflow</title><desc id="desc">Arrows indicate the order of six research steps. Use retest findings to choose the next question; the sequence does not establish an improvement.</desc><rect width="1060" height="1344" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 1 | Task-based usability testing workflow</text><rect x="36" y="96" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="136" font-size="20" font-weight="700">1. Choose a research question</text><text x="56" y="180" font-size="20" font-weight="400">For example: can users discover missing data?</text><path d="M530 240v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="284" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="324" font-size="20" font-weight="700">2. Design a goal-based task</text><text x="56" y="368" font-size="20" font-weight="400">Provide only the purpose, context, and necessary data.</text><path d="M530 428v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="472" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="512" font-size="20" font-weight="700">3. Let the participant act</text><text x="56" y="556" font-size="20" font-weight="400">The facilitator does not reveal the action path.</text><path d="M530 616v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="660" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="700" font-size="20" font-weight="700">4. Record observable evidence</text><text x="56" y="744" font-size="20" font-weight="400">Actions, pauses, errors, assistance, and outcomes.</text><path d="M530 804v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="848" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="888" font-size="20" font-weight="700">5. Hypothesize and improve</text><text x="56" y="932" font-size="20" font-weight="400">Choose one problem supported by evidence.</text><path d="M530 992v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="1036" width="988" height="136" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="1076" font-size="20" font-weight="700">6. Retest with the same goal</text><text x="56" y="1120" font-size="20" font-weight="400">Check whether the improvement actually works.</text><text x="36" y="1212" font-size="20" font-weight="400">Arrows indicate the order of six research steps. Use retest findings</text><text x="36" y="1248" font-size="20" font-weight="400">to choose the next question; the sequence does not establish an</text><text x="36" y="1284" font-size="20" font-weight="400">improvement.</text></g></svg>
