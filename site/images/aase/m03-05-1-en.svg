<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1258" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Six links from problem to decision</title><desc id="desc">Arrows show the order of reasoning, not demonstrated improvement or causation. Repeat the cycle when needed: if evidence does not support the hypothesis, revise it rather than declaring success.</desc><rect width="1040" height="1258" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 1 | Six links from problem to decision</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">1. Problem</text><text x="60" y="148" font-size="20" font-weight="400">Patients wait too long</text><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="238" width="968" height="158" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="266" font-size="22" font-weight="650">2. Requirement</text><text x="60" y="310" font-size="20" font-weight="400">Arrange the waiting workflow using check-in status and clinical</text><text x="60" y="346" font-size="20" font-weight="400">scheduling rules</text><path d="M520 406v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="436" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="464" font-size="22" font-weight="650">3. Hypothesis</text><text x="60" y="508" font-size="20" font-weight="400">Reducing manual scheduling time may shorten patient waiting time</text><path d="M520 568v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="598" width="968" height="122" rx="10" fill="#e9f2f7" stroke="#a8c8ed"/><text x="60" y="626" font-size="22" font-weight="650">4. Metric</text><text x="60" y="670" font-size="20" font-weight="400">Waiting time, on-time consultation rate and scheduling error rate</text><path d="M520 730v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="760" width="968" height="158" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="788" font-size="22" font-weight="650">5. Evidence</text><text x="60" y="832" font-size="20" font-weight="400">System tests, before-and-after comparisons and actual operation</text><text x="60" y="868" font-size="20" font-weight="400">records</text><path d="M520 928v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="958" width="968" height="122" rx="10" fill="#e9f7f2" stroke="#82ccb7"/><text x="60" y="986" font-size="22" font-weight="650">6. Decision</text><text x="60" y="1030" font-size="20" font-weight="400">Accept, revise the design, or re-examine the problem</text><text x="36" y="1126" font-size="20" font-weight="400">Arrows show the order of reasoning, not demonstrated improvement or</text><text x="36" y="1162" font-size="20" font-weight="400">causation. Repeat the cycle when needed: if evidence does not support</text><text x="36" y="1198" font-size="20" font-weight="400">the hypothesis, revise it rather than declaring success.</text></g></svg>
