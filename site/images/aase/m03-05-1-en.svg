<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1222" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | From problem to decision</title><desc id="desc">Six steps connect requirements, design hypotheses, metrics and evidence; evidence may call for revision.</desc><rect width="1040" height="1222" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 1 | From problem to decision</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">1. Problem</text><text x="60" y="148" font-size="20" font-weight="400">Users often omit information, causing report errors.</text><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="238" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="266" font-size="22" font-weight="650">2. Requirement</text><text x="60" y="310" font-size="20" font-weight="400">Missing data must prevent complete-report export.</text><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="400" width="968" height="158" rx="10" fill="#e9f2f7" stroke="#d9eaf4"/><text x="60" y="428" font-size="22" font-weight="650">3. Hypothesis</text><text x="60" y="472" font-size="20" font-weight="400">Telling users what is missing may help them correct it</text><text x="60" y="508" font-size="20" font-weight="400">independently.</text><path d="M520 568v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="598" width="968" height="158" rx="10" fill="#e9f2f7" stroke="#d9eaf4"/><text x="60" y="626" font-size="22" font-weight="650">4. Metric</text><text x="60" y="670" font-size="20" font-weight="400">Missing-input blocking rate, unprompted completion rate, completion</text><text x="60" y="706" font-size="20" font-weight="400">time.</text><path d="M520 766v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="796" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="824" font-size="22" font-weight="650">5. Evidence</text><text x="60" y="868" font-size="20" font-weight="400">Test records, observed task results and error cases.</text><path d="M520 928v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="958" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="986" font-size="22" font-weight="650">6. Decision</text><text x="60" y="1030" font-size="20" font-weight="400">Accept, revise the design or revisit the requirements.</text><text x="36" y="1126" font-size="20" font-weight="400">Six steps connect requirements, design hypotheses, metrics and</text><text x="36" y="1162" font-size="20" font-weight="400">evidence; evidence may call for revision.</text></g></svg>
