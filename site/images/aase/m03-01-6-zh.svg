<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 498" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 6｜問題、行為與實作證據的銜接</title><desc id="desc">箭頭表示工作產物的銜接：problem.md → spec.md → Implementation + Tests；不是自動通過驗收的保證。</desc><rect width="1040" height="498" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 6｜問題、行為與實作證據的銜接</text><rect x="36" y="70" width="476" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">problem.md</text><text x="56" y="142" font-size="20" font-weight="400">定義問題。</text><path d="M514 98h10m-4-4 4 4-4 4" fill="none" stroke="#637982" stroke-width="2"/><rect x="528" y="70" width="476" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="548" y="98" font-size="22" font-weight="650">spec.md</text><text x="548" y="142" font-size="20" font-weight="400">定義行為。</text><path d="M760 206v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="234" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="262" font-size="22" font-weight="650">Implementation + Tests</text><text x="56" y="306" font-size="20" font-weight="400">實作程式，執行測試並檢查證據。</text><text x="36" y="402" font-size="20" font-weight="400">箭頭表示工作產物的銜接：problem.md → spec.md → Implementation + Tests；不是</text><text x="36" y="438" font-size="20" font-weight="400">自動通過驗收的保證。</text></g></svg>
