<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 676" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜報告狀態：改版前與設計提案</title><desc id="desc">上下兩區比較兩種設計，沒有操作順序箭頭。示意介面，非實際系統；動作文字不能執行下載或檢核。</desc><rect width="1060" height="676" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 3｜報告狀態：改版前與設計提案</text><rect x="36" y="96" width="988" height="208" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="136" font-size="20" font-weight="700">改版前</text><text x="56" y="180" font-size="20" font-weight="400">報告管理</text><text x="56" y="216" font-size="20" font-weight="400">資料已修改</text><text x="56" y="252" font-size="20" font-weight="400">下載報告</text><rect x="36" y="332" width="988" height="208" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="372" font-size="20" font-weight="700">改版後的設計提案</text><text x="56" y="416" font-size="20" font-weight="400">報告需要重新檢核</text><text x="56" y="452" font-size="20" font-weight="400">資料已經變更，目前的報告不再代表最新資料。完成檢核後才能下載最新報告。</text><text x="56" y="488" font-size="20" font-weight="400">重新檢核並更新報告</text><text x="36" y="580" font-size="20" font-weight="400">上下兩區比較兩種設計，沒有操作順序箭頭。示意介面，非實際系統；動作文字不能執行下載或檢核</text><text x="36" y="616" font-size="20" font-weight="400">。</text></g></svg>
