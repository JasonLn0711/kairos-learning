<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1466" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 6｜本機參考程式的邊界與資料位置</title><desc id="desc">系統內有瀏覽器前端與 Python／Streamlit 程序；rules.py 和 Session State 嵌在程序內。前端 ↔ 程序由 Streamlit 管理，前端 → 範圍外操作者裝置下載 JSON；不把下載檔畫成系統資料庫。</desc><rect width="1060" height="1466" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 6｜本機參考程式的邊界與資料位置</text><rect x="36" y="96" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="132" font-size="20" font-weight="700">收件人員</text><text x="56" y="176" font-size="20" font-weight="400">填寫資料、執行檢核、下載報告</text><path d="M520 242v28m-7-7 7 7 7-7" fill="none" stroke="#46535f" stroke-width="2"/><rect x="36" y="290" width="988" height="778" rx="14" fill="#fbfcfd" stroke="#7295bf" stroke-dasharray="5 5"/><text x="56" y="326" font-size="20" font-weight="700">本機收件完整性檢核系統</text><rect x="56" y="376" width="948" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="76" y="412" font-size="20" font-weight="700">瀏覽器中的 Streamlit 前端</text><text x="76" y="456" font-size="20" font-weight="400">顯示介面、接收操作</text><path d="M520 522v28m-7-7 7 7 7-7M536 550V522m-7 7 7-7 7 7" fill="none" stroke="#46535f" stroke-width="2"/><text x="560" y="542" font-size="20" font-weight="400">Streamlit 管理的通訊</text><rect x="56" y="598" width="948" height="450" rx="14" fill="#eaf1f7" stroke="#7295bf"/><rect x="70" y="610" width="920" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="90" y="646" font-size="20" font-weight="700">Python / Streamlit 程序</text><text x="90" y="690" font-size="20" font-weight="400">處理資料、執行檢核、產生報告</text><rect x="90" y="756" width="880" height="134" rx="14" fill="#f1f3f5" stroke="#7295bf"/><text x="110" y="792" font-size="20" font-weight="700">rules.py</text><text x="110" y="836" font-size="20" font-weight="400">同一程序內部的驗證及匯出邏輯</text><rect x="90" y="902" width="880" height="134" rx="14" fill="#f1f3f5" stroke="#7295bf"/><text x="110" y="938" font-size="20" font-weight="700">Session State</text><text x="110" y="982" font-size="20" font-weight="400">暫存工作階段資料；不是持久業務資料庫</text><text x="56" y="1108" font-size="20" font-weight="400">瀏覽器前端 → 操作者裝置：下載 JSON</text><rect x="36" y="1160" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="1196" font-size="20" font-weight="700">操作者下載資料夾（系統範圍外）</text><text x="56" y="1240" font-size="20" font-weight="400">瀏覽器下載 JSON 後，由操作者管理檔案</text><text x="36" y="1334" font-size="20" font-weight="400">系統內有瀏覽器前端與 Python／Streamlit 程序；rules.py 和 Session State 嵌在程序</text><text x="36" y="1370" font-size="20" font-weight="400">內。前端 ↔ 程序由 Streamlit 管理，前端 → 範圍外操作者裝置下載 JSON；不把下載檔畫成</text><text x="36" y="1406" font-size="20" font-weight="400">系統資料庫。</text></g></svg>
