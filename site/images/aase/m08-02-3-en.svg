<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 970" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | TDD collaboration between person and Agent</title><desc id="desc">Downward arrows show collaboration order. People or an independent mechanism confirm acceptance criteria. This is a workflow illustration, not an execution record.</desc><rect width="1060" height="970" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 3 | TDD collaboration between person and Agent</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Person defines requirements and acceptance</text><text x="56" y="176" font-size="20" font-weight="400">Select one smallest verifiable behavior</text><path d="M530 236v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="286" width="988" height="130" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="322" font-size="20" font-weight="700">Agent writes and runs tests, showing expected failure</text><text x="56" y="366" font-size="20" font-weight="400">Check that the failure concerns required behavior</text><path d="M530 426v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="476" width="988" height="130" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="512" font-size="20" font-weight="700">Agent repairs implementation and reruns the same tests</text><text x="56" y="556" font-size="20" font-weight="400">Preserve the original acceptance requirement</text><path d="M530 616v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="666" width="988" height="130" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="702" font-size="20" font-weight="700">Confirm results, refactor and verify again</text><text x="56" y="746" font-size="20" font-weight="400">Report verified and unverified requirements</text><text x="36" y="838" font-size="20" font-weight="400">Downward arrows show collaboration order. People or an independent</text><text x="36" y="874" font-size="20" font-weight="400">mechanism confirm acceptance criteria. This is a workflow illustration</text><text x="36" y="910" font-size="20" font-weight="400">, not an execution record.</text></g></svg>
