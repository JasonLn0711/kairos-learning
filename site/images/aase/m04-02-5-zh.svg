<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜交給 AI Coding Agent 的三項驗收條件</title><desc id="desc">以下是待實作與測試的規格，並非已執行或通過的測試；三項條件平行列出。</desc><rect width="1040" height="670" fill="#ffffff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="20" font-weight="700">圖 5｜交給 AI Coding Agent 的三項驗收條件</text><rect x="36" y="96" width="968" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="132" font-size="20" font-weight="700">測試 A：資料缺漏</text><text x="56" y="174" font-size="20" font-weight="400">如果使用者缺少必要欄位並執行檢查，系統必須指出缺件，不能顯示完整通過或提供完整報告匯</text><text x="56" y="208" font-size="20" font-weight="400">出。</text><rect x="36" y="270" width="968" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="306" font-size="20" font-weight="700">測試 B：結果過期</text><text x="56" y="348" font-size="20" font-weight="400">如果使用者在檢查通過後修改資料，原有檢查結果必須失效，重新檢查前不得以舊結果當作最新</text><text x="56" y="382" font-size="20" font-weight="400">結果。</text><rect x="36" y="444" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="480" font-size="20" font-weight="700">測試 C：明確取消</text><text x="56" y="522" font-size="20" font-weight="400">如果使用者取消任務，系統不可將取消記錄為成功完成。</text><text x="36" y="612" font-size="20" font-weight="400">以下是待實作與測試的規格，並非已執行或通過的測試；三項條件平行列出。</text></g></svg>
