<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 916" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜由外向內的四種視角</title><desc id="desc">逐層縮排表示觀察範圍放大，不是四個依序執行步驟。醫院只是概念比喻，軟體層級不必與組織一一對應。</desc><rect width="1060" height="916" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 1｜由外向內的四種視角</text><rect x="36" y="96" width="988" height="684" rx="14" fill="#f1f3f5" stroke="#7295bf"/><rect x="48" y="108" width="964" height="134" rx="14" fill="#f1f3f5" stroke="#7295bf"/><text x="68" y="144" font-size="20" font-weight="700">C1 — System Context｜最遠的視角</text><text x="68" y="188" font-size="20" font-weight="400">醫院與病患、健保署、外部檢驗機構的關係。問：誰使用這間醫院？它依賴哪些外部機構？</text><rect x="64" y="254" width="948" height="510" rx="14" fill="#f1f3f5" stroke="#7295bf"/><rect x="76" y="266" width="924" height="134" rx="14" fill="#f1f3f5" stroke="#7295bf"/><text x="96" y="302" font-size="20" font-weight="700">C2 — Container</text><text x="96" y="346" font-size="20" font-weight="400">掛號系統、病歷系統、檢驗資料庫。問：醫院內有哪些主要系統？各自負責什麼？</text><rect x="92" y="412" width="908" height="336" rx="14" fill="#f1f3f5" stroke="#7295bf"/><rect x="104" y="424" width="884" height="134" rx="14" fill="#f1f3f5" stroke="#7295bf"/><text x="124" y="460" font-size="20" font-weight="700">C3 — Component</text><text x="124" y="504" font-size="20" font-weight="400">掛號系統內的預約、排程、通知模組。問：一個系統內部如何分工？</text><rect x="120" y="570" width="868" height="162" rx="14" fill="#f1f3f5" stroke="#7295bf"/><rect x="132" y="582" width="844" height="134" rx="14" fill="#f1f3f5" stroke="#7295bf"/><text x="152" y="618" font-size="20" font-weight="700">C4 — Code</text><text x="152" y="662" font-size="20" font-weight="400">檢查時段的函式、資料模型、程式類別。問：具體如何實作？</text><text x="36" y="820" font-size="20" font-weight="400">逐層縮排表示觀察範圍放大，不是四個依序執行步驟。醫院只是概念比喻，軟體層級不必與組織一一</text><text x="36" y="856" font-size="20" font-weight="400">對應。</text></g></svg>
