<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 568" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜不同問題，使用不同觀點</title><desc id="desc">三種觀點並列比較，不是依序執行的三個步驟。</desc><rect width="1040" height="568" fill="#fbfdfb"/><g fill="#173329" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 5｜不同問題，使用不同觀點</text><text x="36" y="100" font-size="20" font-weight="400">三種觀點並列比較，不是依序執行的三個步驟。</text><rect x="36" y="138" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="166" font-size="22" font-weight="650">User Flow</text><text x="60" y="210" font-size="20" font-weight="400">單一任務：病人完成一次掛號的操作、判斷與回復。</text><rect x="36" y="272" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="300" font-size="22" font-weight="650">User Journey / Experience Map</text><text x="60" y="344" font-size="20" font-weight="400">較長經驗：不舒服 → 找醫院 → 掛號 → 看診 → 追蹤，跨越人物、場所與服務。</text><rect x="36" y="406" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="434" font-size="22" font-weight="650">System Architecture</text><text x="60" y="478" font-size="20" font-weight="400">技術協作：網站、API、預約資料庫、身分驗證與防重複預約控制。</text></g></svg>
