<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 864" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Keep basic fields visible and advanced settings available</title><desc id="desc">Both cards retain the same functions. The right card replaces the faded reference with an explicit entry; its inventory describes available expanded settings, not disabled fields.</desc><rect width="1040" height="864" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 3 | Keep basic fields visible and advanced settings</text><text x="36" y="80" font-size="24" font-weight="700">available</text><rect x="36" y="124" width="458" height="512" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><rect x="46" y="134" width="438" height="50" rx="12" fill="#fce1e1" stroke="#d4dce1" stroke-width="1"/><text x="56" y="162" font-size="22" font-weight="700">Before | All options shown</text><text x="56" y="226" font-size="20" font-weight="400">Basic Settings</text><text x="56" y="272" font-size="20" font-weight="400">Company Name: Enter company name</text><text x="56" y="318" font-size="20" font-weight="400">Email: Enter email</text><text x="56" y="364" font-size="20" font-weight="400">Advanced Configuration</text><text x="56" y="410" font-size="20" font-weight="400">API Rate Limit: 1000/hour</text><text x="56" y="456" font-size="20" font-weight="400">Webhook URL: https://…</text><text x="56" y="502" font-size="20" font-weight="400">Custom Headers: Authorization:</text><text x="56" y="538" font-size="20" font-weight="400">Bearer…</text><text x="56" y="584" font-size="20" font-weight="400">Security Options</text><rect x="546" y="124" width="458" height="558" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><rect x="556" y="134" width="438" height="50" rx="12" fill="#d9efe1" stroke="#d4dce1" stroke-width="1"/><text x="566" y="162" font-size="22" font-weight="700">After | Progressive disclosure</text><text x="566" y="226" font-size="20" font-weight="400">Basic Settings</text><text x="566" y="272" font-size="20" font-weight="400">Company Name: Enter company name</text><text x="566" y="318" font-size="20" font-weight="400">Email: Enter email</text><text x="566" y="364" font-size="20" font-weight="400">Advanced settings ▸</text><text x="566" y="410" font-size="20" font-weight="400">Available when expanded:</text><text x="566" y="456" font-size="20" font-weight="400">API Rate Limit: 1000/hour</text><text x="566" y="502" font-size="20" font-weight="400">Webhook URL: https://…</text><text x="566" y="548" font-size="20" font-weight="400">Custom Headers: Authorization:</text><text x="566" y="584" font-size="20" font-weight="400">Bearer…</text><text x="566" y="630" font-size="20" font-weight="400">Security Options</text><text x="36" y="726" font-size="20" font-weight="400">Both cards retain the same functions. The right card replaces the faded</text><text x="36" y="762" font-size="20" font-weight="400">reference with an explicit entry; its inventory describes available</text><text x="36" y="798" font-size="20" font-weight="400">expanded settings, not disabled fields.</text></g></svg>
