<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 558" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Four C4 levels of detail</title><desc id="desc">Four inward levels of static structure, not four execution steps. Select the views that help communication.</desc><rect width="1040" height="558" fill="#fff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="40" y="44" font-size="24" font-weight="700">Figure 2 | Four C4 levels of detail</text><rect x="40" y="98" width="460" height="152" rx="12" fill="#fbfcfd" stroke="#64748b" stroke-width="2"/><text x="58" y="130" font-size="22" font-weight="700">C1 · Context</text><text x="58" y="170" font-size="20" font-weight="400">The system and its external</text><text x="58" y="204" font-size="20" font-weight="400">relationships</text><rect x="540" y="98" width="460" height="152" rx="12" fill="#fbfcfd" stroke="#64748b" stroke-width="2"/><text x="558" y="130" font-size="22" font-weight="700">C2 · Container</text><text x="558" y="170" font-size="20" font-weight="400">Applications and data stores</text><text x="558" y="204" font-size="20" font-weight="400">within the system</text><rect x="40" y="274" width="460" height="152" rx="12" fill="#fbfcfd" stroke="#64748b" stroke-width="2"/><text x="58" y="306" font-size="22" font-weight="700">C3 · Component</text><text x="58" y="346" font-size="20" font-weight="400">Functional components inside</text><text x="58" y="380" font-size="20" font-weight="400">an application</text><rect x="540" y="274" width="460" height="152" rx="12" fill="#fbfcfd" stroke="#64748b" stroke-width="2"/><text x="558" y="306" font-size="22" font-weight="700">C4 · Code</text><text x="558" y="346" font-size="20" font-weight="400">Classes, interfaces and other</text><text x="558" y="380" font-size="20" font-weight="400">code structures</text><text x="40" y="466" font-size="20" font-weight="400">Four inward levels of static structure, not four execution steps.</text><text x="40" y="500" font-size="20" font-weight="400">Select the views that help communication.</text></g></svg>
