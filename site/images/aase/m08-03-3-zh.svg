<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 682" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜80 字元邊界</title><desc id="desc">滑桿只比較 0～100 的長度；仍須檢查型別、去除空白後非空，才能判定完整資料有效。</desc><rect width="1060" height="682" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 3｜80 字元邊界</text><rect x="36" y="96" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">79 字元</text><text x="56" y="176" font-size="20" font-weight="400">應接受</text><rect x="36" y="242" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="278" font-size="20" font-weight="700">80 字元</text><text x="56" y="322" font-size="20" font-weight="400">應接受</text><rect x="36" y="388" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="424" font-size="20" font-weight="700">81 字元</text><text x="56" y="468" font-size="20" font-weight="400">應拒絕</text><text x="36" y="554" font-size="20" font-weight="400">80 ≤ 80; 81 &gt; 80</text><text x="36" y="622" font-size="20" font-weight="400">滑桿只比較 0～100 的長度；仍須檢查型別、去除空白後非空，才能判定完整資料有效。</text></g></svg>
