<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 806" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜需求規格與五個互補驗證面向</title><desc id="desc">箭頭表示從規格選擇對應的驗證問題；五個面向互補，不表示測試先後，也不能相互取代。</desc><rect width="1060" height="806" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 1｜需求規格與五個互補驗證面向</text><rect x="36" y="94" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="130" font-size="20" font-weight="700">需求規格（Specification）</text><text x="56" y="174" font-size="20" font-weight="400">先說清楚：軟體應該做到什麼？</text><path d="M530 236v24m-7-7 7 7 7-7" fill="none" stroke="#53636d" stroke-width="2"/><rect x="36" y="278" width="482" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">01 啟動驗證</text><text x="56" y="358" font-size="20" font-weight="400">程式能不能運行？</text><rect x="542" y="278" width="482" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="562" y="314" font-size="20" font-weight="700">02 規則驗證</text><text x="562" y="358" font-size="20" font-weight="400">計算和判斷對不對？</text><rect x="36" y="426" width="482" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="462" font-size="20" font-weight="700">03 介面驗證</text><text x="56" y="506" font-size="20" font-weight="400">操作、提示和輸出正確嗎？</text><rect x="542" y="426" width="482" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="562" y="462" font-size="20" font-weight="700">04 任務驗證</text><text x="562" y="506" font-size="20" font-weight="400">真人能完成工作嗎？</text><rect x="36" y="574" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="610" font-size="20" font-weight="700">05 安全驗證</text><text x="56" y="654" font-size="20" font-weight="400">不應該發生的事情，系統有沒有阻止？</text><text x="36" y="746" font-size="20" font-weight="400">箭頭表示從規格選擇對應的驗證問題；五個面向互補，不表示測試先後，也不能相互取代。</text></g></svg>
