<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 656" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜同一部電腦，三個獨立專案環境</title><desc id="desc">三個專案平行管理套件，避免更新互相干擾；上下排列不代表執行順序。虛擬環境不提供檔案或網路安全隔離。</desc><rect width="1060" height="656" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 2｜同一部電腦，三個獨立專案環境</text><rect x="36" y="96" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="132" font-size="20" font-weight="700">醫院影像分析系統</text><text x="56" y="176" font-size="20" font-weight="400">Python 3.11 + 一組經過驗證的 AI 套件</text><rect x="36" y="246" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="282" font-size="20" font-weight="700">餐廳庫存管理系統</text><text x="56" y="326" font-size="20" font-weight="400">Python 3.12 + 另一組資料處理套件</text><rect x="36" y="396" width="988" height="130" rx="10" fill="#ffffff" stroke="#9baab4"/><text x="56" y="432" font-size="20" font-weight="700">學校作業管理系統</text><text x="56" y="476" font-size="20" font-weight="400">Python 3.12 + Web 與測試套件</text><text x="36" y="564" font-size="20" font-weight="400">三個專案平行管理套件，避免更新互相干擾；上下排列不代表執行順序。虛擬環境不提供檔案或網路</text><text x="36" y="600" font-size="20" font-weight="400">安全隔離。</text></g></svg>
