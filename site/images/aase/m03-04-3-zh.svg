<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜三種範圍狀態</title><desc id="desc">這三種分類不是必須依序推出的產品階段。「延後」也不代表已經承諾一定會做。</desc><rect width="1040" height="380" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 3｜三種範圍狀態</text><rect x="36.0" y="76" width="312.0" height="158" rx="10" fill="#eaf6ef" stroke="#718188"/><text x="60.0" y="104" font-size="22" font-weight="650">第一版</text><text x="60.0" y="148" font-size="20" font-weight="400">現在就要完成，並提供驗收</text><text x="60.0" y="184" font-size="20" font-weight="400">證據</text><rect x="364.0" y="76" width="312.0" height="158" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="388.0" y="104" font-size="22" font-weight="650">延後</text><text x="388.0" y="148" font-size="20" font-weight="400">可能需要，但先滿足重新討</text><text x="388.0" y="184" font-size="20" font-weight="400">論條件</text><rect x="692.0" y="76" width="312.0" height="158" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="716.0" y="104" font-size="22" font-weight="650">本版不做</text><text x="716.0" y="148" font-size="20" font-weight="400">明確排除，不承諾提供這種</text><text x="716.0" y="184" font-size="20" font-weight="400">能力</text><text x="36" y="320" font-size="20" font-weight="400">這三種分類不是必須依序推出的產品階段。「延後」也不代表已經承諾一定會做。</text></g></svg>
