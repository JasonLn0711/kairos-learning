<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1168" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1｜Four views, from outside to inside</title><desc id="desc">Progressive indentation represents zooming into the subject, not four execution steps. The hospital is an analogy; software levels need not map one-to-one to organizational units.</desc><rect width="1060" height="1168" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 1｜Four views, from outside to inside</text><rect x="36" y="96" width="988" height="900" rx="14" fill="#f1f3f5" stroke="#7295bf"/><rect x="48" y="108" width="964" height="206" rx="14" fill="#f1f3f5" stroke="#7295bf"/><text x="68" y="144" font-size="20" font-weight="700">C1 — System Context | Farthest view</text><text x="68" y="188" font-size="20" font-weight="400">Relationships with patients, the health-insurance authority and</text><text x="68" y="224" font-size="20" font-weight="400">external laboratories. Who uses the hospital? Which outside</text><text x="68" y="260" font-size="20" font-weight="400">organizations does it depend on?</text><rect x="64" y="326" width="948" height="654" rx="14" fill="#f1f3f5" stroke="#7295bf"/><rect x="76" y="338" width="924" height="206" rx="14" fill="#f1f3f5" stroke="#7295bf"/><text x="96" y="374" font-size="20" font-weight="700">C2 — Container</text><text x="96" y="418" font-size="20" font-weight="400">Registration application, medical-record application and</text><text x="96" y="454" font-size="20" font-weight="400">laboratory database. What major applications or stores exist,</text><text x="96" y="490" font-size="20" font-weight="400">and what is each responsible for?</text><rect x="92" y="556" width="908" height="408" rx="14" fill="#f1f3f5" stroke="#7295bf"/><rect x="104" y="568" width="884" height="170" rx="14" fill="#f1f3f5" stroke="#7295bf"/><text x="124" y="604" font-size="20" font-weight="700">C3 — Component</text><text x="124" y="648" font-size="20" font-weight="400">Booking, scheduling and notification modules within</text><text x="124" y="684" font-size="20" font-weight="400">registration. How is work divided inside one application?</text><rect x="120" y="750" width="868" height="198" rx="14" fill="#f1f3f5" stroke="#7295bf"/><rect x="132" y="762" width="844" height="170" rx="14" fill="#f1f3f5" stroke="#7295bf"/><text x="152" y="798" font-size="20" font-weight="700">C4 — Code</text><text x="152" y="842" font-size="20" font-weight="400">Functions that check appointment slots, data models and</text><text x="152" y="878" font-size="20" font-weight="400">classes. How is the behavior implemented?</text><text x="36" y="1036" font-size="20" font-weight="400">Progressive indentation represents zooming into the subject, not four</text><text x="36" y="1072" font-size="20" font-weight="400">execution steps. The hospital is an analogy; software levels need not</text><text x="36" y="1108" font-size="20" font-weight="400">map one-to-one to organizational units.</text></g></svg>
