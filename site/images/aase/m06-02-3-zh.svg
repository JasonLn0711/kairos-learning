<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1894" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜網路銀行的 System Context</title><desc id="desc">依 Simon Brown／c4model.com 附件改編，CC BY 4.0。箭頭表示使用或合作關係，不是時序；保留四個節點與四條方向關係。</desc><rect width="1040" height="1894" fill="#fff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="40" y="44" font-size="24" font-weight="700">圖 3｜網路銀行的 System Context</text><text x="40" y="98" font-size="20" font-weight="700">系統範圍外</text><rect x="40" y="144" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#36751b" stroke-width="2"/><text x="58" y="176" font-size="22" font-weight="700">Personal Banking Customer</text><text x="58" y="216" font-size="20" font-weight="400">人／角色 · 持有一個或多個個人銀行帳戶的顧客。</text><rect x="40" y="286" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#b62032" stroke-width="2"/><text x="58" y="318" font-size="22" font-weight="700">Amazon Web Services Simple Email Service</text><text x="58" y="358" font-size="20" font-weight="400">軟體系統 · 雲端電子郵件服務。</text><rect x="40" y="428" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#a35c00" stroke-width="2"/><text x="58" y="460" font-size="22" font-weight="700">Core Banking System</text><text x="58" y="500" font-size="20" font-weight="400">軟體系統 · 管理顧客資訊、銀行帳戶及交易等核心功能。</text><text x="40" y="586" font-size="20" font-weight="700">系統範圍內：</text><text x="40" y="632" font-size="20" font-weight="400">Internet Banking System</text><rect x="28" y="670" width="984" height="140" rx="14" fill="none" stroke="#3074aa" stroke-width="2" stroke-dasharray="8 5"/><rect x="40" y="678" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="710" font-size="22" font-weight="700">Internet Banking System</text><text x="58" y="750" font-size="20" font-weight="400">軟體系統 · 讓顧客透過網頁查看帳戶資訊與付款。</text><text x="40" y="836" font-size="22" font-weight="700">有方向的關係</text><text x="64" y="914" font-size="20" font-weight="700">Personal Banking Customer</text><path d="M78 952v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2" stroke-dasharray="4 3"/><text x="64" y="1008" font-size="20" font-weight="700">Internet Banking System</text><text x="64" y="1050" font-size="20" font-weight="400">查看帳戶餘額與付款</text><path d="M40 1100H1000" stroke="#cbd5e1"/><text x="64" y="1140" font-size="20" font-weight="700">Internet Banking System</text><path d="M78 1178v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2" stroke-dasharray="4 3"/><text x="64" y="1234" font-size="20" font-weight="700">Amazon Web Services Simple Email Service</text><text x="64" y="1276" font-size="20" font-weight="400">使用郵件服務寄信給顧客</text><path d="M40 1326H1000" stroke="#cbd5e1"/><text x="64" y="1366" font-size="20" font-weight="700">Amazon Web Services Simple Email Service</text><path d="M78 1404v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2" stroke-dasharray="4 3"/><text x="64" y="1460" font-size="20" font-weight="700">Personal Banking Customer</text><text x="64" y="1502" font-size="20" font-weight="400">寄送電子郵件</text><path d="M40 1552H1000" stroke="#cbd5e1"/><text x="64" y="1592" font-size="20" font-weight="700">Internet Banking System</text><path d="M78 1630v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2" stroke-dasharray="4 3"/><text x="64" y="1686" font-size="20" font-weight="700">Core Banking System</text><text x="64" y="1728" font-size="20" font-weight="400">取得帳戶資訊並透過核心系統付款</text><path d="M40 1778H1000" stroke="#cbd5e1"/><text x="40" y="1802" font-size="20" font-weight="400">依 Simon Brown／c4model.com 附件改編，CC BY 4.0。箭頭表示使用或合作關係，不是時</text><text x="40" y="1836" font-size="20" font-weight="400">序；保留四個節點與四條方向關係。</text></g></svg>
