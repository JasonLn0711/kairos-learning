<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1480" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Where HCI, UI, UX and interaction design meet</title><desc id="desc">A conceptual illustration after Figma. Overlap indicates interacting concerns, not a strict academic classification of sets or three successive phases.</desc><rect width="1040" height="1480" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 2 | Where HCI, UI, UX and interaction design meet</text><circle cx="378" cy="401" r="256" fill="#d9efe1"/><circle cx="662" cy="401" r="256" fill="#f9dfd9"/><circle cx="520" cy="576" r="256" fill="#e5dff5"/><path d="M350 62C279 110 245 183 245 220c0 58 47 108 105 130 58-22 105-72 105-130 0-37-34-110-105-158Z" transform="translate(47.5 104) scale(1.35)" fill="#fbfcfd" stroke="#65757c" stroke-dasharray="5 5"/><text x="110" y="324" font-size="22" font-weight="700">HCI | Human–</text><text x="110" y="360" font-size="22" font-weight="700">computer</text><text x="110" y="396" font-size="22" font-weight="700">interaction</text><text x="740" y="324" font-size="22" font-weight="700">UI | User interface</text><text x="400" y="714" font-size="22" font-weight="700">UX | User</text><text x="400" y="750" font-size="22" font-weight="700">experience</text><text x="405" y="464" font-size="22" font-weight="700">IxD | Interaction</text><text x="405" y="500" font-size="22" font-weight="700">design</text><text x="36" y="904" font-size="21" font-weight="700">HCI | Human–computer interaction</text><text x="36" y="948" font-size="20" font-weight="400">Human cognition, behavior and interaction capabilities</text><text x="36" y="1004" font-size="21" font-weight="700">UI | User interface</text><text x="36" y="1048" font-size="20" font-weight="400">Screens, controls and responses</text><text x="36" y="1104" font-size="21" font-weight="700">UX | User experience</text><text x="36" y="1148" font-size="20" font-weight="400">Needs, outcomes and feelings across the service</text><text x="36" y="1204" font-size="21" font-weight="700">IxD | Interaction design</text><text x="36" y="1248" font-size="20" font-weight="400">Design interaction behavior and feedback where the three perspectives</text><text x="36" y="1284" font-size="20" font-weight="400">meet</text><text x="36" y="1340" font-size="20" font-weight="400">A conceptual illustration after Figma. Overlap indicates interacting</text><text x="36" y="1376" font-size="20" font-weight="400">concerns, not a strict academic classification of sets or three</text><text x="36" y="1412" font-size="20" font-weight="400">successive phases.</text></g></svg>
