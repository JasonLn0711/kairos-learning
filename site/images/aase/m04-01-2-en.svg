<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 984" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Examine intake through HCI, UI and UX</title><desc id="desc">The perspectives influence one another and are presented in parallel, not as successive phases.</desc><rect width="1040" height="984" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 2 | Examine intake through HCI, UI and UX</text><path d="M12 4c-3-5-9 0-6 4-5 1-3 8 0 8 0 5 6 5 6 1V4Zm0 0c3-5 9 0 6 4 5 1 3 8 0 8 0 5-6 5-6 1M8 8v5m8-5v5" transform="translate(36 82)" fill="none" stroke="#18252c" stroke-width="1.6"/><text x="80" y="102" font-size="22" font-weight="700">HCI: investigate the misunderstanding</text><text x="80" y="150" font-size="20" font-weight="400">What does “success” mean to the user? Do they know that complete</text><text x="80" y="184" font-size="20" font-weight="400">fields and official acceptance differ?</text><text x="80" y="226" font-size="20" font-weight="400">Ask them to explain the screen directly rather than having</text><text x="80" y="260" font-size="20" font-weight="400">developers guess.</text><path d="M36 322H1004" stroke="#d5dce0"/><path d="m7 5 2 15 4-5 5-1L7 5Zm-3-3L2 0m10 3 1-3M3 10H0" transform="translate(36 344)" fill="none" stroke="#18252c" stroke-width="1.6"/><text x="80" y="364" font-size="22" font-weight="700">UI: change the information on screen</text><text x="80" y="412" font-size="20" font-weight="400">Explain specifically what has been completed instead of only</text><text x="80" y="446" font-size="20" font-weight="400">showing “Success.”</text><text x="80" y="488" font-size="20" font-weight="400">For example: “Three required fields are complete; the case has not</text><text x="80" y="522" font-size="20" font-weight="400">been formally submitted.”</text><text x="80" y="564" font-size="20" font-weight="400">Provide a clear next action.</text><path d="M36 626H1004" stroke="#d5dce0"/><path d="M2 2h7v7H2V2Zm13 13h7v7h-7v-7ZM5 9v9h10" transform="translate(36 648)" fill="none" stroke="#18252c" stroke-width="1.6"/><text x="80" y="668" font-size="22" font-weight="700">UX: check whether the whole task works</text><text x="80" y="716" font-size="20" font-weight="400">Even if the screen is understandable, who should receive the</text><text x="80" y="750" font-size="20" font-weight="400">exported report? Can the next worker use it?</text><text x="80" y="792" font-size="20" font-weight="400">If that worker must re-enter all the information, the overall</text><text x="80" y="826" font-size="20" font-weight="400">workflow still has a problem.</text><text x="36" y="888" font-size="20" font-weight="400">The perspectives influence one another and are presented in parallel,</text><text x="36" y="922" font-size="20" font-weight="400">not as successive phases.</text></g></svg>
