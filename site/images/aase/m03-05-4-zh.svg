<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 348" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜先核對計時起點</title><desc id="desc">15 與 10 分鐘是不同計時範圍的示意，不能據此認定節省五分鐘。</desc><rect width="1040" height="348" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 4｜先核對計時起點</text><rect x="36" y="76" width="476" height="166" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">舊流程</text><text x="60" y="148" font-size="20" font-weight="400">15 分鐘</text><text x="60" y="192" font-size="20" font-weight="400">從打開文件、整理資料開始計時</text><rect x="528" y="76" width="476" height="166" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="552" y="104" font-size="22" font-weight="650">新流程</text><text x="552" y="148" font-size="20" font-weight="400">10 分鐘</text><text x="552" y="192" font-size="20" font-weight="400">從資料整理完成、按下產生按鈕才計時</text><text x="36" y="288" font-size="20" font-weight="400">15 與 10 分鐘是不同計時範圍的示意，不能據此認定節省五分鐘。</text></g></svg>
