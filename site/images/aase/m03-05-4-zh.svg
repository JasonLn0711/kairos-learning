<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜假設 H-01：AI 家教是否有助於學習？</title><desc id="desc">四欄共同定義待驗假設；示範門檻需在研究前具體約定，這裡沒有學習成效的實測結果。</desc><rect width="1040" height="700" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 4｜假設 H-01：AI 家教是否有助於學習？</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">假設內容</text><text x="60" y="148" font-size="20" font-weight="400">提供能逐步提示、而非直接公布答案的 AI 家教，可能提高學生獨立解決新題目的能力。</text><rect x="36" y="208" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="236" font-size="22" font-weight="650">測量方式</text><text x="60" y="280" font-size="20" font-weight="400">使用難度相近但未見過的題目，測量學生在沒有 AI 幫助下的解題能力。</text><rect x="36" y="340" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="368" font-size="22" font-weight="650">示範成功門檻</text><text x="60" y="412" font-size="20" font-weight="400">實驗組在事先定義的測驗指標上優於適當的對照組，且效果達到預定的教育實務重要程度。</text><rect x="36" y="472" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="500" font-size="22" font-weight="650">可能反證</text><text x="60" y="544" font-size="20" font-weight="400">學生使用 AI 時表現變好，卻無法獨立解決新的題目。</text><text x="36" y="640" font-size="20" font-weight="400">四欄共同定義待驗假設；示範門檻需在研究前具體約定，這裡沒有學習成效的實測結果。</text></g></svg>
