<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 884" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜一次容易被忽略的錯誤</title><desc id="desc">步驟 1 → 2 表示輸入狀態改變；錯誤與正確是兩種處理方式的比較。</desc><rect width="1040" height="884" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 4｜一次容易被忽略的錯誤</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="104" font-size="22" font-weight="650">1. 使用者輸入三個必要欄位</text><text x="60" y="148" font-size="20" font-weight="400">資料完整，通過檢查</text><path d="M520 204v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="256" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="284" font-size="22" font-weight="650">2. 使用者刪掉其中一個必要欄位</text><text x="60" y="328" font-size="20" font-weight="400">原本通過的檢查結果已不再適用</text><rect x="36" y="436" width="968" height="122" rx="10" fill="#faeef0" stroke="#718188"/><text x="60" y="464" font-size="22" font-weight="650">錯誤：系統仍允許用舊結果匯出</text><text x="60" y="508" font-size="20" font-weight="400">使用者看到成功訊息，實際報告卻不符合目前資料狀態</text><rect x="36" y="616" width="968" height="122" rx="10" fill="#eaf6ef" stroke="#718188"/><text x="60" y="644" font-size="22" font-weight="650">正確：要求重新檢查才能匯出</text><text x="60" y="688" font-size="20" font-weight="400">讓驗證結果與目前的輸入資料保持一致</text><text x="36" y="824" font-size="20" font-weight="400">步驟 1 → 2 表示輸入狀態改變；錯誤與正確是兩種處理方式的比較。</text></g></svg>
