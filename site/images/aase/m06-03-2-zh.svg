<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 588" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜一個應用角色，三個部署實例</title><desc id="desc">向下連線表示同一角色的部署對應；三個 Docker 實例並列，不互相依序呼叫。這是假設部署範例，C4 Container 不要求使用 Docker。</desc><rect width="1060" height="588" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 2｜一個應用角色，三個部署實例</text><rect x="36" y="96" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="132" font-size="20" font-weight="700">C4 Container：訂單 API</text><text x="56" y="176" font-size="20" font-weight="400">一種應用程式角色與責任</text><path d="M520 242v28m-7-7 7 7 7-7" fill="none" stroke="#46535f" stroke-width="2"/><text x="560" y="262" font-size="20" font-weight="400">實際部署（Deployment）</text><rect x="36" y="318" width="316" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="354" font-size="20" font-weight="700">Docker 1</text><text x="56" y="398" font-size="20" font-weight="400">API 實例</text><rect x="372" y="318" width="316" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="392" y="354" font-size="20" font-weight="700">Docker 2</text><text x="392" y="398" font-size="20" font-weight="400">API 實例</text><rect x="708" y="318" width="316" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="728" y="354" font-size="20" font-weight="700">Docker 3</text><text x="728" y="398" font-size="20" font-weight="400">API 實例</text><text x="36" y="492" font-size="20" font-weight="400">向下連線表示同一角色的部署對應；三個 Docker 實例並列，不互相依序呼叫。這是假設部署範例</text><text x="36" y="528" font-size="20" font-weight="400">，C4 Container 不要求使用 Docker。</text></g></svg>
