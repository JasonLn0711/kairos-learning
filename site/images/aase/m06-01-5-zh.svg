<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜C4 架構模型的四個層級</title><desc id="desc">向下箭頭表示逐層放大結構，不表示執行順序。依問題選擇有幫助的層級，不必每次畫完四層。Container不一定是Docker容器。</desc><rect width="1320" height="900" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="42" font-size="20" font-weight="700">圖 5｜C4 架構模型的四個層級</text><rect x="120" y="102" width="1080" height="126" rx="16" fill="#fbfcfd" stroke="#85998e"/><text x="138" y="138" font-size="20" font-weight="700">C1 · System Context</text><text x="138" y="178" font-size="20" font-weight="400">誰使用系統？與哪些外部系統合作？</text><path d="M660 234 L660 268" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 258L660 268L666 258" fill="none" stroke="#61736b" stroke-width="2"/><rect x="120" y="278" width="1080" height="126" rx="16" fill="#fbfcfd" stroke="#85998e"/><text x="138" y="314" font-size="20" font-weight="700">C2 · Container</text><text x="138" y="354" font-size="20" font-weight="400">有哪些應用程式、服務及資料儲存？</text><path d="M660 410 L660 444" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 434L660 444L666 434" fill="none" stroke="#61736b" stroke-width="2"/><rect x="120" y="454" width="1080" height="126" rx="16" fill="#fbfcfd" stroke="#85998e"/><text x="138" y="490" font-size="20" font-weight="700">C3 · Component</text><text x="138" y="530" font-size="20" font-weight="400">單一應用程式內有哪些功能組件？</text><path d="M660 586 L660 620" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 610L660 620L666 610" fill="none" stroke="#61736b" stroke-width="2"/><rect x="120" y="630" width="1080" height="126" rx="16" fill="#fbfcfd" stroke="#85998e"/><text x="138" y="666" font-size="20" font-weight="700">C4 · Code</text><text x="138" y="706" font-size="20" font-weight="400">組件內部有哪些類別、函式與程式碼？</text><text x="32" y="806" font-size="20" font-weight="400">向下箭頭表示逐層放大結構，不表示執行順序。依問題選擇有幫助的層級，不必每次畫完四層。Container不一定是Docker容</text><text x="32" y="840" font-size="20" font-weight="400">器。</text></g></svg>
