<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1268" role="img" aria-labelledby="title desc"><title id="title">圖 2｜先定義成功的六步遷移</title><desc id="desc">五條向下箭頭表示六個步驟的作業順序；最後依驗收結果決定接受或復原，不表示已執行或已通過。</desc><rect width="1060" height="1268" fill="#fbfcfc"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="48" y="40" font-size="20" font-weight="700">圖 2｜先定義成功的六步遷移</text><rect x="24" y="96" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="132" font-size="20" font-weight="700">1. 說清楚為什麼要換</text><text x="48" y="176" font-size="20" font-weight="400">改善速度、成本、品質或安全</text><path d="M530 238v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="278" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="314" font-size="20" font-weight="700">2. 確認哪些行為不能變</text><text x="48" y="358" font-size="20" font-weight="400">需求、業務規則、資料及權限</text><path d="M530 420v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="460" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="496" font-size="20" font-weight="700">3. 分析影響範圍</text><text x="48" y="540" font-size="20" font-weight="400">程式、介面、資料、環境、操作</text><path d="M530 602v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="642" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="678" font-size="20" font-weight="700">4. 設定測試與通過標準</text><text x="48" y="722" font-size="20" font-weight="400">正常案例、錯誤案例、權限檢查</text><path d="M530 784v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="824" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="860" font-size="20" font-weight="700">5. 小範圍遷移並實測</text><text x="48" y="904" font-size="20" font-weight="400">保留紀錄，比較新舊差異</text><path d="M530 966v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="1006" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="1042" font-size="20" font-weight="700">6. 決定接受或復原</text><text x="48" y="1086" font-size="20" font-weight="400">驗收通過才擴大，失敗就停止</text><text x="48" y="1176" font-size="20" font-weight="400">五條向下箭頭表示六個步驟的作業順序；最後依驗收結果決定接受或復原，不表示已執行或已通</text><text x="48" y="1212" font-size="20" font-weight="400">過。</text></g></svg>
