<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 864" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 6｜從使用者任務到可測試介面</title><desc id="desc">箭頭表示本課建議的設計工作順序；第五步包含驗證，不代表線框稿已通過真實使用者驗收。</desc><rect width="1040" height="864" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 6｜從使用者任務到可測試介面</text><rect x="36" y="74" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="98" font-size="22" font-weight="700">1. 定義使用者與工作任務</text><text x="56" y="138" font-size="20" font-weight="400">誰來使用？想完成什麼？</text><path d="M520 190v22m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="222" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="246" font-size="22" font-weight="700">2. 盤點所有內容與功能</text><text x="56" y="286" font-size="20" font-weight="400">需要哪些資料、按鈕、錯誤與結果？</text><path d="M520 338v22m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="370" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="394" font-size="22" font-weight="700">3. 建立 IA：分類、命名與關係</text><text x="56" y="434" font-size="20" font-weight="400">哪些資訊應該放在一起？</text><path d="M520 486v22m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="518" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="542" font-size="22" font-weight="700">4. 定義狀態、導覽與視覺優先序</text><text x="56" y="582" font-size="20" font-weight="400">每個狀態下，該先看什麼、做什麼？</text><path d="M520 634v22m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="36" y="666" width="968" height="108" rx="12" fill="#e3ecfb" stroke="#bccbd0"/><text x="56" y="690" font-size="22" font-weight="700">5. 畫 Wireframe（線框稿）並驗證</text><text x="56" y="730" font-size="20" font-weight="400">檢查桌面、手機、鍵盤及真實工作任務。</text><text x="36" y="810" font-size="20" font-weight="400">箭頭表示本課建議的設計工作順序；第五步包含驗證，不代表線框稿已通過真實使用者驗收。</text></g></svg>
