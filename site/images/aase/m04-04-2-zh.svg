<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1548" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜出貨資料檢查的四種畫面</title><desc id="desc">四格是獨立情境，不是固定四步。所有姓名與電話都是合成範例；示意按鈕不執行檢查。</desc><rect width="1040" height="1548" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="30" y="42" font-size="24" font-weight="700">圖 2｜出貨資料檢查的四種畫面</text><text x="30" y="86" font-size="20" font-weight="400">四格是獨立情境，不是固定四步。所有姓名與電話都是合成範例；示意按鈕不執行檢查。</text><rect x="30" y="119" width="980" height="403" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="144" font-size="22" font-weight="700">① 輸入中</text><text x="50" y="190" font-size="20" font-weight="400">收件人 *</text><text x="50" y="224" font-size="20" font-weight="400">王小明</text><text x="50" y="268" font-size="20" font-weight="400">收件地址 *</text><text x="50" y="302" font-size="20" font-weight="400">請輸入地址</text><text x="50" y="346" font-size="20" font-weight="400">聯絡電話 *</text><text x="50" y="380" font-size="20" font-weight="400">0912-XXX-XXX</text><text x="50" y="424" font-size="20" font-weight="400">檢查資料</text><text x="50" y="468" font-size="20" font-weight="400">使用者知道要填什麼</text><rect x="30" y="521" width="980" height="301" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="546" font-size="22" font-weight="700">② 處理中</text><text x="50" y="592" font-size="20" font-weight="400">出貨資料檢查</text><text x="50" y="636" font-size="20" font-weight="400">正在處理</text><text x="50" y="680" font-size="20" font-weight="400">資料已保留，請勿重複提交</text><text x="50" y="724" font-size="20" font-weight="400">檢查進行中</text><text x="50" y="768" font-size="20" font-weight="400">僅在實際需要等待時出現</text><rect x="30" y="821" width="980" height="379" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="846" font-size="22" font-weight="700">③ 資料缺漏</text><text x="50" y="892" font-size="20" font-weight="400">還有 1 項資料需要補填</text><text x="50" y="936" font-size="20" font-weight="400">收件人：王小明</text><text x="50" y="980" font-size="20" font-weight="400">收件地址 *</text><text x="50" y="1014" font-size="20" font-weight="400">請填寫收件地址</text><text x="50" y="1058" font-size="20" font-weight="400">聯絡電話：已保留</text><text x="50" y="1102" font-size="20" font-weight="400">補填後重新檢查</text><text x="50" y="1146" font-size="20" font-weight="400">說清楚哪裡錯，且不清空其他欄位</text><rect x="30" y="1199" width="980" height="325" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="1224" font-size="22" font-weight="700">④ 檢查完成</text><text x="50" y="1270" font-size="20" font-weight="400">三欄完整性檢查通過</text><text x="50" y="1314" font-size="20" font-weight="400">收件人：王小明</text><text x="50" y="1348" font-size="20" font-weight="400">收件地址：已填寫</text><text x="50" y="1382" font-size="20" font-weight="400">聯絡電話：0912-XXX-XXX</text><text x="50" y="1426" font-size="20" font-weight="400">預覽／匯出資料</text><text x="50" y="1470" font-size="20" font-weight="400">修改任一欄後，原檢查結果失效</text></g></svg>
