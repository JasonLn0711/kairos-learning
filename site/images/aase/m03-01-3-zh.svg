<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 502" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜兩種驗收，各自需要證據</title><desc id="desc">兩項是平行驗收面向；功能通過不代表使用者驗收通過，也不能直接推得效率提升。</desc><rect width="1040" height="502" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 3｜兩種驗收，各自需要證據</text><rect x="36" y="70" width="968" height="158" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">功能驗收（Functional Acceptance）</text><text x="56" y="142" font-size="20" font-weight="400">確認系統有沒有按照規則運作。例如文件類型空白時，系統必須提示缺漏，並禁止匯出標記為完</text><text x="56" y="178" font-size="20" font-weight="400">整的正式報告。</text><rect x="36" y="238" width="968" height="158" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="266" font-size="22" font-weight="650">使用者驗收（User Acceptance）</text><text x="56" y="310" font-size="20" font-weight="400">確認使用者實際能不能完成任務。例如收件人員能找到錯誤提示、知道要補什麼，而且能自行完</text><text x="56" y="346" font-size="20" font-weight="400">成修正。</text><text x="36" y="442" font-size="20" font-weight="400">兩項是平行驗收面向；功能通過不代表使用者驗收通過，也不能直接推得效率提升。</text></g></svg>
