<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1030" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Simulate stale-report invalidation</title><desc id="desc">First select “Check data”, then clear “Document type”. Compare Bug and Fixed modes: Bug keeps the old success and download, while Fixed invalidates the result. This is a simplified local interaction, not a real banking system.</desc><rect width="1060" height="1030" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 2 | Simulate stale-report invalidation</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Simulation mode</text><text x="56" y="176" font-size="20" font-weight="400">Bug｜Fixed</text><rect x="36" y="246" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="282" font-size="20" font-weight="700">Customer name</text><text x="56" y="326" font-size="20" font-weight="400">甲公司</text><rect x="36" y="396" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="432" font-size="20" font-weight="700">Business tax ID</text><text x="56" y="476" font-size="20" font-weight="400">12345678</text><rect x="546" y="396" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="566" y="432" font-size="20" font-weight="700">Document type</text><text x="566" y="476" font-size="20" font-weight="400">財務報表</text><rect x="36" y="546" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="582" font-size="20" font-weight="700">Check data</text><text x="56" y="626" font-size="20" font-weight="400">Offer a synthetic report download after a successful check</text><rect x="36" y="696" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="732" font-size="20" font-weight="700">Check result</text><text x="56" y="776" font-size="20" font-weight="400">No valid check result; report export is unavailable.</text><text x="36" y="862" font-size="20" font-weight="400">First select “Check data”, then clear “Document type”. Compare Bug and</text><text x="36" y="898" font-size="20" font-weight="400">Fixed modes: Bug keeps the old success and download, while Fixed</text><text x="36" y="934" font-size="20" font-weight="400">invalidates the result. This is a simplified local interaction, not a</text><text x="36" y="970" font-size="20" font-weight="400">real banking system.</text></g></svg>
