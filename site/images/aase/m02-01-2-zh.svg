<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 301" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜「收件資料」的兩種假設切分</title><desc id="desc">兩組是平行比較，並非先後步驟；這些切分是教學示意，並非實際模型結果。</desc><rect width="1040" height="301" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 2｜「收件資料」的兩種假設切分</text><rect x="36.0" y="70" width="468.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="98" font-size="22">切成 2 個 Token</text><text x="56.0" y="142" font-size="20">收件 ／ 資料</text><rect x="520.0" y="70" width="468.0" height="120" rx="10" fill="#edf8f5" stroke="#79aaa0"/><text x="540.0" y="98" font-size="22">切成 4 個 Token</text><text x="540.0" y="142" font-size="20">收 ／ 件 ／ 資 ／ 料</text><text x="36" y="243" font-size="20">兩組是平行比較，並非先後步驟；這些切分是教學示意，並非實際模型結果。</text></g></svg>
