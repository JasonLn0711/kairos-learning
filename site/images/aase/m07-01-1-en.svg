<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1102" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Eight restaurant and development roles</title><desc id="desc">Each row pairs a restaurant role with a development role. These are analogies, with no sequence arrows. Preparation, implementation and acceptance need separate evidence.</desc><rect width="1060" height="1102" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 1 | Eight restaurant and development roles</text><text x="36" y="96" font-size="20" font-weight="700">Restaurant → software development (paired analogy)</text><rect x="36" y="118" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="144" font-size="20" font-weight="700">Shop location</text><text x="442" y="144" font-size="20" font-weight="400">Project directory</text><rect x="36" y="206" width="988" height="112" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="232" font-size="20" font-weight="700">Kitchen and cooking</text><text x="52" y="268" font-size="20" font-weight="700">equipment</text><text x="442" y="232" font-size="20" font-weight="400">Runtime environment</text><rect x="36" y="330" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="356" font-size="20" font-weight="700">Ingredients list</text><text x="442" y="356" font-size="20" font-weight="400">Dependencies</text><rect x="36" y="418" width="988" height="112" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="444" font-size="20" font-weight="700">Separate cooking</text><text x="52" y="480" font-size="20" font-weight="700">workbench</text><text x="442" y="444" font-size="20" font-weight="400">Virtual environment</text><rect x="36" y="542" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="568" font-size="20" font-weight="700">Basic restaurant fit-out</text><text x="442" y="568" font-size="20" font-weight="400">Starter project</text><rect x="36" y="630" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="656" font-size="20" font-weight="700">Chef and cooking tools</text><text x="442" y="656" font-size="20" font-weight="400">Development tools and Coding Agent</text><rect x="36" y="718" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="744" font-size="20" font-weight="700">Cooking the beef noodles</text><text x="442" y="744" font-size="20" font-weight="400">Implementation</text><rect x="36" y="806" width="988" height="112" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="832" font-size="20" font-weight="700">Tasting and hygiene</text><text x="52" y="868" font-size="20" font-weight="700">checks</text><text x="442" y="832" font-size="20" font-weight="400">Testing and acceptance</text><text x="36" y="974" font-size="20" font-weight="400">Each row pairs a restaurant role with a development role. These are</text><text x="36" y="1010" font-size="20" font-weight="400">analogies, with no sequence arrows. Preparation, implementation and</text><text x="36" y="1046" font-size="20" font-weight="400">acceptance need separate evidence.</text></g></svg>
