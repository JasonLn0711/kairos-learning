<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 966" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1｜Core questions in task analysis</title><desc id="desc">The goal guides four parallel perspectives, checked against a verifiable outcome. Arrows express analytical relationships; the four perspectives have no execution order.</desc><rect width="1040" height="966" fill="#ffffff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="20" font-weight="700">Figure 1｜Core questions in task analysis</text><rect x="36" y="96" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="132" font-size="20" font-weight="700">User goal</text><text x="56" y="174" font-size="20" font-weight="400">What outcome is needed?</text><path d="M520 232v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="276" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="312" font-size="20" font-weight="700">Action</text><text x="56" y="354" font-size="20" font-weight="400">What must the person do?</text><rect x="540" y="276" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="312" font-size="20" font-weight="700">Decision</text><text x="560" y="354" font-size="20" font-weight="400">Which conditions inform a</text><text x="560" y="388" font-size="20" font-weight="400">decision?</text><rect x="36" y="450" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="486" font-size="20" font-weight="700">Information and feedback</text><text x="56" y="528" font-size="20" font-weight="400">What must the person know?</text><rect x="540" y="450" width="464" height="158" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="486" font-size="20" font-weight="700">Exception and recovery</text><text x="560" y="528" font-size="20" font-weight="400">How can work continue after</text><text x="560" y="562" font-size="20" font-weight="400">failure?</text><path d="M520 624v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="668" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="704" font-size="20" font-weight="700">Verifiable outcome</text><text x="56" y="746" font-size="20" font-weight="400">How will completion be demonstrated?</text><text x="36" y="840" font-size="20" font-weight="400">The goal guides four parallel perspectives, checked against a</text><text x="36" y="874" font-size="20" font-weight="400">verifiable outcome. Arrows express analytical relationships; the four</text><text x="36" y="908" font-size="20" font-weight="400">perspectives have no execution order.</text></g></svg>
