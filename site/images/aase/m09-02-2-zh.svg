<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 706" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜交接完成度自我檢查</title><desc id="desc">勾選只表示文件盤點；0 / 8 是初始狀態，不代表軟體品質、正式驗收或獨立交接通過。</desc><rect width="1040" height="706" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 2｜交接完成度自我檢查</text><text x="36" y="102" font-size="20" font-weight="400">0 / 8</text><rect x="36" y="124" width="968" height="6" fill="#d9dfe2"/><rect x="36" y="143" width="18" height="18" rx="3" fill="white" stroke="#64748b"/><text x="76" y="162" font-size="20" font-weight="400">說明專案用途、使用對象與適用範圍</text><rect x="36" y="195" width="18" height="18" rx="3" fill="white" stroke="#64748b"/><text x="76" y="214" font-size="20" font-weight="400">列出需要的作業系統、軟體版本與依賴</text><rect x="36" y="247" width="18" height="18" rx="3" fill="white" stroke="#64748b"/><text x="76" y="266" font-size="20" font-weight="400">提供正確的安裝、測試與啟動命令</text><rect x="36" y="299" width="18" height="18" rx="3" fill="white" stroke="#64748b"/><text x="76" y="318" font-size="20" font-weight="400">提供測試資料、預期結果與實測紀錄</text><rect x="36" y="351" width="18" height="18" rx="3" fill="white" stroke="#64748b"/><text x="76" y="370" font-size="20" font-weight="400">清楚區分已驗證功能和未驗證事項</text><rect x="36" y="403" width="18" height="18" rx="3" fill="white" stroke="#64748b"/><text x="76" y="422" font-size="20" font-weight="400">記錄已知限制、風險與不能使用的情境</text><rect x="36" y="455" width="18" height="18" rx="3" fill="white" stroke="#64748b"/><text x="76" y="474" font-size="20" font-weight="400">說明錯誤處理、停止服務與資料清理</text><rect x="36" y="507" width="18" height="18" rx="3" fill="white" stroke="#64748b"/><text x="76" y="526" font-size="20" font-weight="400">讓另一個人從乾淨環境獨立重現</text><text x="36" y="578" font-size="20" font-weight="400">重新檢查（靜態圖）</text><text x="36" y="646" font-size="20" font-weight="400">勾選只表示文件盤點；0 / 8 是初始狀態，不代表軟體品質、正式驗收或獨立交接通過。</text></g></svg>
