<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 904" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜任務交接範例</title><desc id="desc">路徑、規格及測試案例均為教學假設，並非已建立或驗證的專案檔案。</desc><rect width="1040" height="904" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 4｜任務交接範例</text><text x="56" y="98" font-size="22">目標</text><text x="56" y="140" font-size="20">修正收件狀態判斷錯誤。</text><text x="56" y="202" font-size="22">有效規格</text><text x="56" y="244" font-size="20">以 docs/requirements-v3.md 為準，缺少必填文件不得顯示「收件完成」。</text><text x="56" y="306" font-size="22">已有證據</text><text x="56" y="348" font-size="20">測試 T-04 顯示缺少附件時，系統仍回報完成。</text><text x="56" y="410" font-size="22">未決問題</text><text x="56" y="452" font-size="20">選填文件是否影響狀態，尚未確認。</text><text x="56" y="514" font-size="22">工作範圍</text><text x="56" y="556" font-size="20">只修改狀態判斷邏輯與相關測試，不修改 UI 配色。</text><text x="56" y="618" font-size="22">停止條件</text><text x="56" y="660" font-size="20">遇到需求衝突或需要決定選填文件規則時先回報。</text><text x="56" y="722" font-size="22">完成條件</text><text x="56" y="764" font-size="20">T-04 測試通過，提供實際測試結果。</text><text x="36" y="846" font-size="20">路徑、規格及測試案例均為教學假設，並非已建立或驗證的專案檔案。</text></g></svg>
