<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 904" role="img" aria-labelledby="title desc" lang="zh"><title id="title">任務工作包｜可交接的 AI 任務</title><desc id="desc">以上檔名、需求及測試都是教材的虛構案例。七欄平行描述同一任務，並非七個執行步驟。</desc><rect width="1040" height="904" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">任務工作包｜可交接的 AI 任務</text><text x="56" y="98" font-size="22">工作目標</text><text x="56" y="140" font-size="20">修正收件完成狀態的判斷錯誤</text><text x="56" y="202" font-size="22">有效規格</text><text x="56" y="244" font-size="20">docs/requirements-v3.md</text><text x="56" y="306" font-size="22">錯誤證據</text><text x="56" y="348" font-size="20">測試 T-04：缺少必填附件仍顯示完成</text><text x="56" y="410" font-size="22">未決問題</text><text x="56" y="452" font-size="20">選填文件是否影響完成狀態</text><text x="56" y="514" font-size="22">修改範圍</text><text x="56" y="556" font-size="20">僅修改狀態判斷與相關測試</text><text x="56" y="618" font-size="22">停止條件</text><text x="56" y="660" font-size="20">遇到需求衝突先回報</text><text x="56" y="722" font-size="22">完成標準</text><text x="56" y="764" font-size="20">T-04 測試通過，並提供實際結果</text><text x="36" y="846" font-size="20">以上檔名、需求及測試都是教材的虛構案例。七欄平行描述同一任務，並非七個執行步驟。</text></g></svg>
