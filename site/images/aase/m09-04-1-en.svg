<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 658" role="img" aria-labelledby="title desc"><title id="title">Figure 1 | Replaceable tools and continuing responsibilities</title><desc id="desc">The columns are parallel comparisons and stack on narrow screens. Responsibilities may change with new requirements, through explicit decisions, updated specifications, and renewed verification; tools cannot decide independently.</desc><rect width="1060" height="658" fill="#fbfcfc"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="48" y="40" font-size="20" font-weight="700">Figure 1 | Replaceable tools and continuing responsibilities</text><text x="48" y="132" font-size="20" font-weight="700">Replaceable tools</text><text x="48" y="176" font-size="20" font-weight="400">AI models</text><text x="48" y="212" font-size="20" font-weight="400">Coding Agents</text><text x="48" y="248" font-size="20" font-weight="400">UI frameworks</text><text x="48" y="284" font-size="20" font-weight="400">Databases and deployment</text><text x="48" y="320" font-size="20" font-weight="400">Third-party packages</text><text x="568" y="132" font-size="20" font-weight="700">Continuing responsibilities</text><text x="568" y="176" font-size="20" font-weight="400">Actual user needs</text><text x="568" y="212" font-size="20" font-weight="400">Business rules and acceptance</text><text x="568" y="248" font-size="20" font-weight="400">criteria</text><text x="568" y="284" font-size="20" font-weight="400">Data security and permissions</text><text x="568" y="320" font-size="20" font-weight="400">Testing and failure recovery</text><text x="568" y="356" font-size="20" font-weight="400">Documentation, handoff, and</text><text x="568" y="392" font-size="20" font-weight="400">owners</text><text x="48" y="494" font-size="20" font-weight="400">The columns are parallel comparisons and stack on narrow screens.</text><text x="48" y="530" font-size="20" font-weight="400">Responsibilities may change with new requirements, through explicit</text><text x="48" y="566" font-size="20" font-weight="400">decisions, updated specifications, and renewed verification; tools</text><text x="48" y="602" font-size="20" font-weight="400">cannot decide independently.</text></g></svg>
