<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1160" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜修復週末第三科：一種合理的工作流程</title><desc id="desc">Security：全程限制檔案、工具及網路存取權限

Observability：全程保留適當紀錄，不只記錄最後一步</desc><rect width="1040" height="1160" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 4｜修復週末第三科：一種合理的工作流程</text><rect x="36" y="104" width="968" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="56" y="140" font-size="22">1. 取得最新版規格</text><text x="56" y="188" font-size="20">Context：確認週末上限確實是三科</text><path d="M520 252v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="292" width="968" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="56" y="328" font-size="22">2. 讀取專案程式碼</text><text x="56" y="376" font-size="20">Tools + Execution：確認讀到的是目標專案</text><path d="M520 440v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="480" width="968" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="56" y="516" font-size="22">3. 找出錯誤並修改</text><text x="56" y="564" font-size="20">LLM 分析，Tools 執行實際修改</text><path d="M520 628v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="668" width="968" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="56" y="704" font-size="22">4. 執行測試</text><text x="56" y="752" font-size="20">Orchestration：確認完成必要的驗證</text><path d="M520 816v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="856" width="968" height="140" rx="10" fill="#e8f4ef" stroke="#b8c9d0"/><text x="56" y="892" font-size="22">5. 整理修改證據</text><text x="56" y="940" font-size="20">Observability：保存變更與測試結果</text><text x="36" y="1040" font-size="20">Security：全程限制檔案、工具及網路存取權限</text><text x="36" y="1088" font-size="20">Observability：全程保留適當紀錄，不只記錄最後一步</text></g></svg>
