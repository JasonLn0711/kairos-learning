<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 544" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜自訂 HTTP API 與 Streamlit 的概念對照</title><desc id="desc">兩條獨立路徑均為概念示意；實際請求、WebSocket 訊息與其他連線，需由文件、原始碼或封包確認。validate() 是程序內呼叫，不是此圖宣稱存在的 HTTP 端點。</desc><rect width="1040" height="544" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 3｜自訂 HTTP API 與 Streamlit 的概念對照</text><text x="36" y="104" font-size="20" font-weight="700">傳統自訂 HTTP API 的概念</text><text x="36" y="152" font-size="20" font-weight="400">Browser</text><path d="M240 144h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="284" y="152" font-size="20" font-weight="400">HTTP API</text><path d="M488 144h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="532" y="152" font-size="20" font-weight="400">Backend</text><path d="M736 144h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="780" y="152" font-size="20" font-weight="400">Response</text><path d="M36 224H1004" stroke="#d5dce0"/><text x="36" y="272" font-size="20" font-weight="700">Streamlit 的概念</text><text x="36" y="320" font-size="20" font-weight="400">Browser</text><path d="M240 312h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="284" y="320" font-size="20" font-weight="400">Streamlit 框架</text><text x="284" y="356" font-size="20" font-weight="400">通訊</text><path d="M488 312h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="532" y="320" font-size="20" font-weight="400">Python 程序</text><path d="M736 312h24m-6-6 6 6-6 6" fill="none" stroke="#65757c" stroke-width="2"/><text x="780" y="320" font-size="20" font-weight="400">validate()</text><text x="36" y="448" font-size="20" font-weight="400">兩條獨立路徑均為概念示意；實際請求、WebSocket 訊息與其他連線，需由文件、原始碼或封包</text><text x="36" y="484" font-size="20" font-weight="400">確認。validate() 是程序內呼叫，不是此圖宣稱存在的 HTTP 端點。</text></g></svg>
