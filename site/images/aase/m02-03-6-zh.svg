<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1158" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 6｜跨日開發與驗證流程</title><desc id="desc">箭頭只表示本例順序；第二天前的分隔線區分工作日。每次更新記錄都以實際結果為依據。</desc><rect width="1040" height="1158" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 6｜跨日開發與驗證流程</text><rect x="36.0" y="72" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="100" font-size="22">第一天：開始工作</text><text x="52.0" y="144" font-size="20">AI 接到需求，開始撰寫程式；底層引擎可能利用 KV Cache，減少產生文字時的重複運算。</text><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="242" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="270" font-size="22">對話逐漸變長</text><text x="52.0" y="314" font-size="20">使用 Compaction 整理重要條件與工作進度，讓有限的 Context Window 可以繼續使用。</text><path d="M520 378v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="412" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="440" font-size="22">工作暫停</text><text x="52.0" y="484" font-size="20">將已確認決策、測試結果與下一步存入 Memory。</text><path d="M520 548v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="582" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="610" font-size="22">第二天：恢復工作</text><text x="52.0" y="654" font-size="20">從 Memory 取回昨天的進度。</text><path d="M36 570h968" stroke="#84999e" stroke-width="3"/><path d="M520 718v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="752" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="780" font-size="22">需要確認規格</text><text x="52.0" y="824" font-size="20">透過 RAG 找到最新需求文件，避免只依據昨天可能過期的記憶開發。</text><path d="M520 888v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="922" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="950" font-size="22">接續開發與驗證</text><text x="52.0" y="994" font-size="20">修改程式、執行測試，並根據實際結果更新工作紀錄。</text><text x="36" y="1098" font-size="20">箭頭只表示本例順序；第二天前的分隔線區分工作日。每次更新記錄都以實際結果為依據。</text></g></svg>
