<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 708" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜TDD 的小步循環</title><desc id="desc">箭頭表示下一個開發步驟；完成重構後選下一個小要求，再回到 Red。每輪保留可驗證結果。</desc><rect width="1060" height="708" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 1｜TDD 的小步循環</text><rect x="36" y="96" width="900" height="130" rx="14" fill="#fcf1f2" stroke="#c43c46"/><text x="56" y="132" font-size="20" font-weight="700">1. Red</text><text x="56" y="176" font-size="20" font-weight="400">先寫測試，確認要求尚未滿足</text><path d="M486 236v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="286" width="900" height="130" rx="14" fill="#edf8f2" stroke="#16804d"/><text x="56" y="322" font-size="20" font-weight="700">2. Green</text><text x="56" y="366" font-size="20" font-weight="400">最小修正，讓相同測試通過</text><path d="M486 426v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="476" width="900" height="130" rx="14" fill="#eef4fc" stroke="#3477c6"/><text x="56" y="512" font-size="20" font-weight="700">3. Refactor</text><text x="56" y="556" font-size="20" font-weight="400">整理內部結構，重新跑測試</text><path d="M936 571H986Q1010 571 1010 547V144Q1010 120 986 120H952m10-8-10 8 10 8" fill="none" stroke="#7c8792" stroke-width="3" stroke-dasharray="8 6"/><text x="36" y="648" font-size="20" font-weight="400">箭頭表示下一個開發步驟；完成重構後選下一個小要求，再回到 Red。每輪保留可驗證結果。</text></g></svg>
