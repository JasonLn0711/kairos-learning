<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1374" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜Agent Harness：六個平行面向與 LLM</title><desc id="desc">概念架構圖：六個面向互相配合，不代表六套獨立程式，也不是依序執行的六個階段。</desc><rect width="1040" height="1374" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 1｜Agent Harness：六個平行面向與 LLM</text><rect x="100" y="104" width="840" height="140" rx="10" fill="#edf2f7" stroke="#b8c9d0"/><text x="120" y="140" font-size="22">USER REQUEST</text><text x="120" y="188" font-size="20">使用者：「幫我修好讀書計畫系統」</text><path d="M520 252v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="292" width="968" height="774" rx="12" fill="#fff9f2" stroke="#ba7950" stroke-width="2"/><text x="68" y="328" font-size="24">Agent Harness</text><text x="68" y="376" font-size="20">工作支援系統</text><rect x="68" y="428" width="444" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="88" y="464" font-size="22">Context</text><text x="88" y="512" font-size="20">提供正確資料</text><rect x="528" y="428" width="444" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="548" y="464" font-size="22">Tools</text><text x="548" y="512" font-size="20">提供工作工具</text><rect x="68" y="586" width="444" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="88" y="622" font-size="22">Orchestration</text><text x="88" y="670" font-size="20">管理任務流程</text><rect x="528" y="586" width="444" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="548" y="622" font-size="22">Execution</text><text x="548" y="670" font-size="20">提供執行環境</text><rect x="68" y="744" width="444" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="88" y="780" font-size="22">Security</text><text x="88" y="828" font-size="20">控制權限範圍</text><rect x="528" y="744" width="444" height="140" rx="10" fill="#ffffff" stroke="#b8c9d0"/><text x="548" y="780" font-size="22">Observability</text><text x="548" y="828" font-size="20">記錄與驗證結果</text><rect x="68" y="902" width="904" height="140" rx="10" fill="#e9edf6" stroke="#b8c9d0"/><text x="88" y="938" font-size="22">LLM（大腦）</text><text x="88" y="986" font-size="20">理解、推理、產生回應或工具請求</text><path d="M520 1074v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="100" y="1114" width="840" height="140" rx="10" fill="#e8f4ef" stroke="#b8c9d0"/><text x="120" y="1150" font-size="22">可檢查、可交付的工作成果</text><text x="120" y="1198" font-size="20">程式修改 + 測試結果 + 操作紀錄</text><text x="36" y="1302" font-size="20">概念架構圖：六個面向互相配合，不代表六套獨立程式，也不是依序執行的六個階段。</text></g></svg>
