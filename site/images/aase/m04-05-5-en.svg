<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1246" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5 | Four states of document checking</title><desc id="desc">The cards compare situations, not four mandatory sequential steps. Correct missing data; handle system failure with safe-retry guidance. Completion means this data check only.</desc><rect width="1040" height="1246" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 5 | Four states of document checking</text><rect x="36" y="88" width="458" height="404" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="56" y="126" font-size="22" font-weight="700">State 1: Input</text><text x="56" y="170" font-size="20" font-weight="400">Waiting for user input</text><text x="56" y="216" font-size="20" font-weight="400">Case ID: A001</text><text x="56" y="262" font-size="20" font-weight="400">Source unit: Department A</text><text x="56" y="308" font-size="20" font-weight="400">Document type: Not selected</text><rect x="50" y="329" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="62" y="354" font-size="20" font-weight="400">[Check data]</text><text x="56" y="404" font-size="20" font-weight="400">Next: complete the fields and</text><text x="56" y="440" font-size="20" font-weight="400">start checking.</text><rect x="546" y="88" width="458" height="476" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="566" y="126" font-size="22" font-weight="700">State 2: Processing</text><text x="566" y="170" font-size="20" font-weight="400">Check request received</text><text x="566" y="216" font-size="20" font-weight="400">Checking data…</text><text x="566" y="262" font-size="20" font-weight="400">Do not submit again.</text><text x="566" y="308" font-size="20" font-weight="400">The result will appear when</text><text x="566" y="344" font-size="20" font-weight="400">checking finishes.</text><rect x="560" y="365" width="430" height="97" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="572" y="390" font-size="20" font-weight="400">[Checking; resubmission</text><text x="572" y="426" font-size="20" font-weight="400">unavailable]</text><text x="566" y="476" font-size="20" font-weight="400">Next: wait for the result; follow</text><text x="566" y="512" font-size="20" font-weight="400">guidance if it times out.</text><rect x="36" y="588" width="458" height="440" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="56" y="626" font-size="22" font-weight="700">State 3: Missing data</text><text x="56" y="670" font-size="20" font-weight="400">A correctable problem was found</text><text x="56" y="716" font-size="20" font-weight="400">Required data is missing</text><text x="56" y="762" font-size="20" font-weight="400">Document type has not been</text><text x="56" y="798" font-size="20" font-weight="400">entered.</text><text x="56" y="844" font-size="20" font-weight="400">Other fields have been retained.</text><rect x="50" y="865" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="62" y="890" font-size="20" font-weight="400">[Complete and recheck]</text><text x="56" y="940" font-size="20" font-weight="400">Next: correct the omission</text><text x="56" y="976" font-size="20" font-weight="400">without re-entering everything.</text><rect x="546" y="588" width="458" height="476" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="566" y="626" font-size="22" font-weight="700">State 4: Complete</text><text x="566" y="670" font-size="20" font-weight="400">This data check is complete</text><text x="566" y="716" font-size="20" font-weight="400">All three required fields are</text><text x="566" y="752" font-size="20" font-weight="400">complete</text><text x="566" y="798" font-size="20" font-weight="400">Preview or export is available.</text><text x="566" y="844" font-size="20" font-weight="400">Note: this does not mean formal</text><text x="566" y="880" font-size="20" font-weight="400">acceptance.</text><rect x="560" y="901" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="572" y="926" font-size="20" font-weight="400">[Preview] [Export]</text><text x="566" y="976" font-size="20" font-weight="400">Next: confirm the content, then</text><text x="566" y="1012" font-size="20" font-weight="400">choose export.</text><text x="36" y="1108" font-size="20" font-weight="400">The cards compare situations, not four mandatory sequential steps. Correct</text><text x="36" y="1144" font-size="20" font-weight="400">missing data; handle system failure with safe-retry guidance. Completion</text><text x="36" y="1180" font-size="20" font-weight="400">means this data check only.</text></g></svg>
