<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 362" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜先固定失敗，再修正及驗證</title><desc id="desc">箭頭表示修復驗證順序，不代表已執行或通過。Regression 在這裡指修復後再檢查受影響的既有功能。</desc><rect width="1060" height="362" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 3｜先固定失敗，再修正及驗證</text><rect x="36" y="96" width="288" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Red</text><text x="56" y="176" font-size="20" font-weight="400">證明測試抓到故障</text><path d="M336 161h30m-7-7 7 7-7 7" fill="none" stroke="#475569" stroke-width="2"/><rect x="386" y="96" width="288" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="406" y="132" font-size="20" font-weight="700">Green</text><text x="406" y="176" font-size="20" font-weight="400">最小修正後通過</text><path d="M686 161h30m-7-7 7 7-7 7" fill="none" stroke="#475569" stroke-width="2"/><rect x="736" y="96" width="288" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="756" y="132" font-size="20" font-weight="700">Regression</text><text x="756" y="176" font-size="20" font-weight="400">確認其他功能正常</text><text x="36" y="266" font-size="20" font-weight="400">箭頭表示修復驗證順序，不代表已執行或通過。Regression 在這裡指修復後再檢查受影響的既有</text><text x="36" y="302" font-size="20" font-weight="400">功能。</text></g></svg>
