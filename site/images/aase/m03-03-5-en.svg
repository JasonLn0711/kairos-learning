<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 676" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5 · Different questions, different views</title><desc id="desc">These three views are parallel comparisons, not sequential steps.</desc><rect width="1040" height="676" fill="#fbfdfb"/><g fill="#173329" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 5 · Different questions, different views</text><text x="36" y="100" font-size="20" font-weight="400">These three views are parallel comparisons, not sequential steps.</text><rect x="36" y="138" width="968" height="158" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="166" font-size="22" font-weight="650">User Flow</text><text x="60" y="210" font-size="20" font-weight="400">One task: how a patient books once, including clicks, decisions and</text><text x="60" y="246" font-size="20" font-weight="400">recovery.</text><rect x="36" y="308" width="968" height="158" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="336" font-size="22" font-weight="650">User Journey / Experience Map</text><text x="60" y="380" font-size="20" font-weight="400">A longer experience: feeling unwell → finding a hospital → booking</text><text x="60" y="416" font-size="20" font-weight="400">→ consultation → follow-up, across people, places and services.</text><rect x="36" y="478" width="968" height="158" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="506" font-size="22" font-weight="650">System Architecture</text><text x="60" y="550" font-size="20" font-weight="400">Technical collaboration: website, API, appointment database,</text><text x="60" y="586" font-size="20" font-weight="400">authentication and duplicate-booking controls.</text></g></svg>
