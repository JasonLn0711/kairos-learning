<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 779" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | From Stored Records to the Current Work Window</title><desc id="desc">The dashed arrow represents selection. Records on the left can exist without all their contents reaching the model’s work window on the right.</desc><rect width="1040" height="779" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 1 | From Stored Records to the Current Work Window</text><rect x="36" y="73" width="410" height="520" rx="10" fill="#e8e5de" stroke="#b99a88"/><text x="56" y="108" font-size="22">Database / history</text><rect x="72" y="168" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M92 182h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="247" y="168" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M267 182h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="72" y="230" width="155" height="48" rx="10" fill="#cddbd3" stroke="#d4d8da"/><path d="M92 244h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="247" y="230" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M267 244h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="72" y="292" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M92 306h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="247" y="292" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M267 306h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><text x="56" y="396" font-size="20">Stored does not mean fully</text><text x="56" y="430" font-size="20">read</text><rect x="594" y="73" width="410" height="520" rx="10" fill="#ecd5c8" stroke="#b99a88"/><text x="614" y="108" font-size="22">Context Window</text><rect x="614" y="146" width="370" height="50" rx="10" fill="#ffffff" stroke="#d4d8da"/><text x="626" y="176" font-size="20">Task and rules</text><rect x="614" y="238" width="370" height="50" rx="10" fill="#ffffff" stroke="#d4d8da"/><text x="626" y="268" font-size="20">Relevant documents</text><rect x="614" y="330" width="370" height="84" rx="10" fill="#ffffff" stroke="#d4d8da"/><text x="626" y="360" font-size="20">Conversation and tool</text><text x="626" y="394" font-size="20">results</text><rect x="614" y="456" width="370" height="84" rx="10" fill="#ffffff" stroke="#d4d8da"/><text x="626" y="486" font-size="20">Available capacity is</text><text x="626" y="520" font-size="20">limited</text><text x="462" y="323.0" font-size="20">Select</text><path d="M456 358.0h126m-10-8 10 8-10 8" stroke="#a46c51" stroke-dasharray="8 6" stroke-width="3" fill="none"/><text x="36" y="653" font-size="20">The dashed arrow represents selection. Records on the left can exist</text><text x="36" y="687" font-size="20">without all their contents reaching the model’s work window on the</text><text x="36" y="721" font-size="20">right.</text></g></svg>
