<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 665" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Company Archive and Engineer’s Desk</title><desc id="desc">Information must be selected; do not assume every stored record has been read. The dashed arrow denotes selection. The context window is the engineer’s available working space for this task.</desc><rect width="1040" height="665" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 1 | Company Archive and Engineer’s Desk</text><rect x="36" y="73" width="410" height="406" rx="10" fill="#e8e5de" stroke="#b99a88"/><text x="56" y="108" font-size="22">Company archive</text><rect x="72" y="168" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M92 182h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="247" y="168" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M267 182h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="72" y="230" width="155" height="48" rx="10" fill="#cddbd3" stroke="#d4d8da"/><path d="M92 244h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="247" y="230" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M267 244h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="72" y="292" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M92 306h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="247" y="292" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M267 306h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><text x="56" y="396" font-size="20">Stored chats, documents,</text><text x="56" y="430" font-size="20">code and databases</text><rect x="594" y="73" width="410" height="406" rx="10" fill="#ecd