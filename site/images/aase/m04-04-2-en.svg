<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1582" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Four shipping-data screens</title><desc id="desc">These are independent situations, not four mandatory steps. Names and telephone numbers are synthetic. Button labels do not run checks.</desc><rect width="1040" height="1582" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="30" y="42" font-size="24" font-weight="700">Figure 2 | Four shipping-data screens</text><text x="30" y="86" font-size="20" font-weight="400">These are independent situations, not four mandatory steps. Names and</text><text x="30" y="120" font-size="20" font-weight="400">telephone numbers are synthetic. Button labels do not run checks.</text><rect x="30" y="153" width="980" height="403" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="178" font-size="22" font-weight="700">① Input</text><text x="50" y="224" font-size="20" font-weight="400">Recipient *</text><text x="50" y="258" font-size="20" font-weight="400">Wang Xiaoming</text><text x="50" y="302" font-size="20" font-weight="400">Delivery address *</text><text x="50" y="336" font-size="20" font-weight="400">Enter an address</text><text x="50" y="380" font-size="20" font-weight="400">Contact telephone *</text><text x="50" y="414" font-size="20" font-weight="400">0912-XXX-XXX</text><text x="50" y="458" font-size="20" font-weight="400">Check data</text><text x="50" y="502" font-size="20" font-weight="400">Users know what to enter</text><rect x="30" y="555" width="980" height="301" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="580" font-size="22" font-weight="700">② Processing</text><text x="50" y="626" font-size="20" font-weight="400">Shipping-data check</text><text x="50" y="670" font-size="20" font-weight="400">Processing</text><text x="50" y="714" font-size="20" font-weight="400">Input retained; do not submit again</text><text x="50" y="758" font-size="20" font-weight="400">Check in progress</text><text x="50" y="802" font-size="20" font-weight="400">Only when an actual wait exists</text><rect x="30" y="855" width="980" height="379" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="880" font-size="22" font-weight="700">③ Missing data</text><text x="50" y="926" font-size="20" font-weight="400">1 field still needs a value</text><text x="50" y="970" font-size="20" font-weight="400">Recipient: Wang Xiaoming</text><text x="50" y="1014" font-size="20" font-weight="400">Delivery address *</text><text x="50" y="1048" font-size="20" font-weight="400">Please enter the delivery address</text><text x="50" y="1092" font-size="20" font-weight="400">Telephone: retained</text><text x="50" y="1136" font-size="20" font-weight="400">Fill the omission and check again</text><text x="50" y="1180" font-size="20" font-weight="400">Identify the problem and keep other values</text><rect x="30" y="1233" width="980" height="325" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="1258" font-size="22" font-weight="700">④ Check complete</text><text x="50" y="1304" font-size="20" font-weight="400">Three-field completeness check passed</text><text x="50" y="1348" font-size="20" font-weight="400">Recipient: Wang Xiaoming</text><text x="50" y="1382" font-size="20" font-weight="400">Address: entered</text><text x="50" y="1416" font-size="20" font-weight="400">Telephone: 0912-XXX-XXX</text><text x="50" y="1460" font-size="20" font-weight="400">Preview / export data</text><text x="50" y="1504" font-size="20" font-weight="400">Any edit invalidates the previous check</text></g></svg>
