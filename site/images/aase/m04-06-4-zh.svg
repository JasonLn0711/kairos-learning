<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1386" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜表單錯誤摘要與欄位提示</title><desc id="desc">依 CMS Design System 附圖重製的靜態教學示意；摘要連到本圖問題欄位。範例姓名長度與 MM/DD/YYYY 是示例規則，非所有服務通則。</desc><rect width="1060" height="1386" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 4｜表單錯誤摘要與欄位提示</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fff5f7" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">1｜頁首錯誤摘要</text><text x="56" y="176" font-size="20" font-weight="400">請完成以下項目以建立帳號：</text><rect x="36" y="244" width="988" height="130" rx="14" fill="#fff5f7" stroke="#64748b"/><text x="56" y="280" font-size="20" font-weight="700">2a｜姓氏</text><text x="56" y="324" font-size="20" font-weight="400">請輸入超過 1 個字元的姓氏。</text><rect x="36" y="392" width="988" height="130" rx="14" fill="#fff5f7" stroke="#64748b"/><text x="56" y="428" font-size="20" font-weight="700">2b｜出生日期</text><text x="56" y="472" font-size="20" font-weight="400">請以 MM/DD/YYYY 輸入出生日期。</text><rect x="36" y="540" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="576" font-size="20" font-weight="700">已填名字</text><text x="56" y="620" font-size="20" font-weight="400">Lisa</text><rect x="36" y="688" width="988" height="166" rx="14" fill="#fff5f7" stroke="#64748b"/><text x="56" y="724" font-size="20" font-weight="700">3｜姓氏欄位提示</text><text x="56" y="768" font-size="20" font-weight="400">請輸入超過 1 個字元的姓氏。</text><text x="56" y="804" font-size="20" font-weight="400">目前值：空白</text><rect x="36" y="872" width="988" height="166" rx="14" fill="#fff5f7" stroke="#64748b"/><text x="56" y="908" font-size="20" font-weight="700">出生日期欄位提示</text><text x="56" y="952" font-size="20" font-weight="400">請以 MM/DD/YYYY 輸入出生日期。</text><text x="56" y="988" font-size="20" font-weight="400">月：空白／日：01／年：1990</text><rect x="36" y="1056" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="1092" font-size="20" font-weight="700">4｜送出位置</text><text x="56" y="1136" font-size="20" font-weight="400">靜態示意；此處不送出資料。</text><text x="36" y="1218" font-size="20" font-weight="400">Source: CMS Design System — Error validation</text><text x="36" y="1290" font-size="20" font-weight="400">依 CMS Design System 附圖重製的靜態教學示意；摘要連到本圖問題欄位。範例姓名長度與</text><text x="36" y="1326" font-size="20" font-weight="400">MM/DD/YYYY 是示例規則，非所有服務通則。</text></g></svg>
