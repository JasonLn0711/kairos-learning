<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 442" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Allowed and Prohibited Scope for a Read-only Task</title><desc id="desc">The columns compare permission boundaries for one task, not sequential stages. Text labels convey the status as well as green and red.</desc><rect width="1040" height="442" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 2 | Allowed and Prohibited Scope for a Read-only Task</text><rect x="36" y="70" width="476" height="194" rx="10" fill="#eaf6ef" stroke="#91bca4"/><text x="56" y="98" font-size="22" font-weight="650">Allowed</text><text x="56" y="142" font-size="20" font-weight="400">Read specified project</text><text x="56" y="178" font-size="20" font-weight="400">documents; check document</text><text x="56" y="214" font-size="20" font-weight="400">versions; report the result.</text><rect x="528" y="70" width="476" height="194" rx="10" fill="#fff5f4" stroke="#cba9a4"/><text x="548" y="98" font-size="22" font-weight="650">Not allowed</text><text x="548" y="142" font-size="20" font-weight="400">Delete or rewrite files; read</text><text x="548" y="178" font-size="20" font-weight="400">other projects; transmit data</text><text x="548" y="214" font-size="20" font-weight="400">to external networks.</text><text x="36" y="310" font-size="20" font-weight="400">The columns compare permission boundaries for one task, not</text><text x="36" y="346" font-size="20" font-weight="400">sequential stages. Text labels convey the status as well as green and</text><text x="36" y="382" font-size="20" font-weight="400">red.</text></g></svg>
