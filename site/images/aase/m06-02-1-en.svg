<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 2380" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Restaurant ordering system and its surroundings</title><desc id="desc">Assume payment and delivery integrations exist. Arrows name direction, data and purpose, not a timeline; responses have separate directions.</desc><rect width="1040" height="2380" fill="#fff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="40" y="44" font-size="24" font-weight="700">Figure 1 | Restaurant ordering system and its surroundings</text><text x="40" y="98" font-size="20" font-weight="700">Outside the system scope</text><rect x="40" y="144" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#36751b" stroke-width="2"/><text x="58" y="176" font-size="22" font-weight="700">Customer</text><text x="58" y="216" font-size="20" font-weight="400">Person / role · Chooses meals and submits orders.</text><rect x="40" y="286" width="960" height="152" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="318" font-size="22" font-weight="700">Payment system</text><text x="58" y="358" font-size="20" font-weight="400">Software system · Processes payments and returns transaction</text><text x="58" y="392" font-size="20" font-weight="400">results.</text><rect x="40" y="462" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="494" font-size="22" font-weight="700">Delivery platform</text><text x="58" y="534" font-size="20" font-weight="400">Software system · Arranges deliveries and provides status.</text><text x="40" y="620" font-size="20" font-weight="700">Inside the system scope:</text><text x="40" y="666" font-size="20" font-weight="400">Restaurant ordering system</text><rect x="28" y="704" width="984" height="140" rx="14" fill="none" stroke="#3074aa" stroke-width="2" stroke-dasharray="8 5"/><rect x="40" y="712" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="744" font-size="22" font-weight="700">Restaurant ordering system</text><text x="58" y="784" font-size="20" font-weight="400">Software system · Receives orders and manages their status.</text><text x="40" y="870" font-size="22" font-weight="700">Directed relationships</text><text x="64" y="948" font-size="20" font-weight="700">Customer</text><path d="M78 986v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1042" font-size="20" font-weight="700">Restaurant ordering system</text><text x="64" y="1084" font-size="20" font-weight="400">Chooses meals and submits an order</text><path d="M40 1134H1000" stroke="#cbd5e1"/><text x="64" y="1174" font-size="20" font-weight="700">Restaurant ordering system</text><path d="M78 1212v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1268" font-size="20" font-weight="700">Customer</text><text x="64" y="1310" font-size="20" font-weight="400">Provides order status</text><path d="M40 1360H1000" stroke="#cbd5e1"/><text x="64" y="1400" font-size="20" font-weight="700">Restaurant ordering system</text><path d="M78 1438v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1494" font-size="20" font-weight="700">Payment system</text><text x="64" y="1536" font-size="20" font-weight="400">Sends a payment request</text><path d="M40 1586H1000" stroke="#cbd5e1"/><text x="64" y="1626" font-size="20" font-weight="700">Payment system</text><path d="M78 1664v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1720" font-size="20" font-weight="700">Restaurant ordering system</text><text x="64" y="1762" font-size="20" font-weight="400">Returns the transaction result</text><path d="M40 1812H1000" stroke="#cbd5e1"/><text x="64" y="1852" font-size="20" font-weight="700">Restaurant ordering system</text><path d="M78 1890v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="1946" font-size="20" font-weight="700">Delivery platform</text><text x="64" y="1988" font-size="20" font-weight="400">Requests delivery</text><path d="M40 2038H1000" stroke="#cbd5e1"/><text x="64" y="2078" font-size="20" font-weight="700">Delivery platform</text><path d="M78 2116v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="2172" font-size="20" font-weight="700">Restaurant ordering system</text><text x="64" y="2214" font-size="20" font-weight="400">Returns delivery status</text><path d="M40 2264H1000" stroke="#cbd5e1"/><text x="40" y="2288" font-size="20" font-weight="400">Assume payment and delivery integrations exist. Arrows name direction,</text><text x="40" y="2322" font-size="20" font-weight="400">data and purpose, not a timeline; responses have separate directions.</text></g></svg>
