<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 498" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 6｜Connect the Problem, Behavior and Implementation Evidence</title><desc id="desc">Arrows connect work artifacts: problem.md → spec.md → Implementation + Tests. They do not guarantee acceptance.</desc><rect width="1040" height="498" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 6｜Connect the Problem, Behavior and Implementation Evidence</text><rect x="36" y="70" width="476" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">problem.md</text><text x="56" y="142" font-size="20" font-weight="400">Define the problem.</text><path d="M514 98h10m-4-4 4 4-4 4" fill="none" stroke="#637982" stroke-width="2"/><rect x="528" y="70" width="476" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="548" y="98" font-size="22" font-weight="650">spec.md</text><text x="548" y="142" font-size="20" font-weight="400">Define behavior.</text><path d="M760 206v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="234" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="262" font-size="22" font-weight="650">Implementation + Tests</text><text x="56" y="306" font-size="20" font-weight="400">Implement the code, run tests and inspect the evidence.</text><text x="36" y="402" font-size="20" font-weight="400">Arrows connect work artifacts: problem.md → spec.md → Implementation</text><text x="36" y="438" font-size="20" font-weight="400">+ Tests. They do not guarantee acceptance.</text></g></svg>
