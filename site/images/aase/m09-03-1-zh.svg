<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1086" role="img" aria-labelledby="title desc"><title id="title">圖 1｜從需求一路追到交付與證據</title><desc id="desc">向下箭頭表示追溯閱讀順序；第四階段強調實際觀察。每一關都需連到同一案例的作品，箭頭本身不代表已驗收通過。</desc><rect width="1060" height="1086" fill="#fbfcfc"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="48" y="40" font-size="20" font-weight="700">圖 1｜從需求一路追到交付與證據</text><rect x="24" y="96" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="132" font-size="20" font-weight="700">1. 問題與需求</text><text x="48" y="176" font-size="20" font-weight="400">原本要解決什麼問題？</text><path d="M530 238v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="278" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="314" font-size="20" font-weight="700">2. 設計與規格</text><text x="48" y="358" font-size="20" font-weight="400">承諾系統應該如何運作？</text><path d="M530 420v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="460" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="496" font-size="20" font-weight="700">3. 程式與版本</text><text x="48" y="540" font-size="20" font-weight="400">實際做了什麼？是哪個版本？</text><path d="M530 602v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="642" width="1012" height="134" rx="14" fill="#eaf3f0" stroke="#a6b8b4"/><text x="48" y="678" font-size="20" font-weight="700">4. 測試與驗收證據</text><text x="48" y="722" font-size="20" font-weight="400">實際觀察到什麼？是否符合要求？</text><path d="M530 784v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="824" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="860" font-size="20" font-weight="700">5. 交付與限制</text><text x="48" y="904" font-size="20" font-weight="400">可以交給誰使用？還有哪些風險？</text><text x="48" y="994" font-size="20" font-weight="400">向下箭頭表示追溯閱讀順序；第四階段強調實際觀察。每一關都需連到同一案例的作品，箭頭本</text><text x="48" y="1030" font-size="20" font-weight="400">身不代表已驗收通過。</text></g></svg>
