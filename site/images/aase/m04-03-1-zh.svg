<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 664" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜IA 工作、網站結構與網站地圖的包含關係</title><desc id="desc">依 Nielsen Norman Group 的原圖重新繪製。巢狀邊界表示包含，不表示執行順序；網站地圖只呈現部分結構。</desc><rect width="1040" height="664" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 1｜IA 工作、網站結構與網站地圖的包含關係</text><rect x="36" y="74" width="960" height="458" rx="12" fill="#edf7f4" stroke="#368079"/><text x="56" y="98" font-size="22" font-weight="700">資訊架構工作</text><text x="56" y="140" font-size="20" font-weight="400">內容盤點</text><text x="56" y="174" font-size="20" font-weight="400">內容品質檢查</text><text x="56" y="208" font-size="20" font-weight="400">IA 使用者研究</text><text x="56" y="242" font-size="20" font-weight="400">分類與標籤</text><rect x="66" y="274" width="900" height="238" rx="12" fill="#e6f2fb" stroke="#397c9b"/><text x="86" y="302" font-size="22" font-weight="700">規劃網站結構</text><text x="86" y="344" font-size="20" font-weight="400">建立內容組織與層級</text><rect x="96" y="376" width="840" height="116" rx="12" fill="#efedfa" stroke="#7468a3"/><text x="116" y="404" font-size="22" font-weight="700">網站地圖</text><text x="116" y="446" font-size="20" font-weight="400">以圖呈現網站結構</text><text x="36" y="576" font-size="20" font-weight="400">依 Nielsen Norman Group 的原圖重新繪製。巢狀邊界表示包含，不表示執行順序；網站地圖</text><text x="36" y="610" font-size="20" font-weight="400">只呈現部分結構。</text></g></svg>
