<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 726" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Three positions in Given / When / Then</title><desc id="desc">Arrows connect preconditions, the trigger and the expected outcome within one synthetic ordering scenario.</desc><rect width="1040" height="726" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 1 | Three positions in Given / When / Then</text><text x="36" y="98" font-size="22" font-weight="650">Given — preconditions | Before</text><text x="36" y="142" font-size="20" font-weight="400">The customer has selected steak but has not entered a delivery</text><text x="36" y="178" font-size="20" font-weight="400">address.</text><path d="M520 238v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><text x="36" y="308" font-size="22" font-weight="650">When — trigger | During</text><text x="36" y="352" font-size="20" font-weight="400">The customer selects Confirm order.</text><path d="M520 412v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><text x="36" y="482" font-size="22" font-weight="650">Then — expected outcome | After</text><text x="36" y="526" font-size="20" font-weight="400">Display “Enter a delivery address,” create no official order and</text><text x="36" y="562" font-size="20" font-weight="400">retain the selected food.</text><text x="36" y="630" font-size="20" font-weight="400">Arrows connect preconditions, the trigger and the expected outcome</text><text x="36" y="666" font-size="20" font-weight="400">within one synthetic ordering scenario.</text></g></svg>
