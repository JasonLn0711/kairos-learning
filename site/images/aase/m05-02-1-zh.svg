<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 858" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜把午餐想法轉成可驗證的要求</title><desc id="desc">箭頭表示需求逐步具體化；FR 與 NFR 並列，分別說明行為與品質，並非先後步驟。此為教學示意，品質條件仍須具體化。</desc><rect width="1040" height="858" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="40" font-size="20" font-weight="700">圖 1｜把午餐想法轉成可驗證的要求</text><rect x="32" y="92" width="976" height="128" rx="14" fill="#ffffff" stroke="#647681"/><text x="52" y="128" font-size="20" font-weight="700">User Story｜我為什麼需要它？</text><text x="52" y="172" font-size="20" font-weight="400">上班族希望午休能快速吃到合適的餐點，以便準時回去工作</text><path d="M520 228v26m-7-7 7 7 7-7" fill="none" stroke="#53636d" stroke-width="2"/><rect x="32" y="272" width="476" height="128" rx="14" fill="#edf3f8" stroke="#647681"/><text x="52" y="308" font-size="20" font-weight="700">FR｜要做什麼？</text><text x="52" y="352" font-size="20" font-weight="400">提供點餐、客製化、付款與訂單查詢</text><rect x="532" y="272" width="476" height="128" rx="14" fill="#edf5f2" stroke="#647681"/><text x="552" y="308" font-size="20" font-weight="700">NFR｜做得如何？</text><text x="552" y="352" font-size="20" font-weight="400">流程易懂、回應穩定、操作方便</text><rect x="32" y="420" width="976" height="128" rx="14" fill="#fbfcfd" stroke="#647681"/><text x="52" y="456" font-size="20" font-weight="700">Constraints｜有哪些限制？</text><text x="52" y="500" font-size="20" font-weight="400">遵守已確認的食材限制、預算及設備條件</text><path d="M520 556v26m-7-7 7 7 7-7" fill="none" stroke="#53636d" stroke-width="2"/><rect x="32" y="600" width="976" height="128" rx="14" fill="#ffffff" stroke="#647681"/><text x="52" y="636" font-size="20" font-weight="700">Acceptance Criteria｜如何確認有做到？</text><text x="52" y="680" font-size="20" font-weight="400">指定情境下能正確點餐、處理過敏限制、完成付款與查詢；品質指標也經過測試</text><text x="32" y="764" font-size="20" font-weight="400">箭頭表示需求逐步具體化；FR 與 NFR 並列，分別說明行為與品質，並非先後步驟。此為教學示意</text><text x="32" y="800" font-size="20" font-weight="400">，品質條件仍須具體化。</text></g></svg>
