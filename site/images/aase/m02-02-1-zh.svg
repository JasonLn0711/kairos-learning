<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 631" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜公司資料室與工程師的工作桌</title><desc id="desc">必須選取資料，不能假設全部都已讀取。虛線箭頭表示資料選取；Context Window 是工程師這一次能使用的工作桌空間。</desc><rect width="1040" height="631" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 1｜公司資料室與工程師的工作桌</text><rect x="36" y="73" width="410" height="406" rx="10" fill="#e8e5de" stroke="#b99a88"/><text x="56" y="108" font-size="22">公司資料室</text><rect x="72" y="168" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M92 182h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="247" y="168" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M267 182h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="72" y="230" width="155" height="48" rx="10" fill="#cddbd3" stroke="#d4d8da"/><path d="M92 244h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="247" y="230" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M267 244h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="72" y="292" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M92 306h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><rect x="247" y="292" width="155" height="48" rx="10" fill="#ffffff" stroke="#d4d8da"/><path d="M267 306h100m-100 10h80m-80 10h90" stroke="#a4a6a2" stroke-width="3" fill="none"/><text x="56" y="396" font-size="20">保存的聊天紀錄、文件、程式碼、資料</text><text x="56" y="430" font-size="20">庫</text><rect x="594" y="73" width="410" height="406" rx="10" fill="#ecd5c8" stroke="#b99a88"/><text x="614" y="108" font-size="22">工程師的工作桌</text><rect x="614" y="146" width="370" height="50" rx="10" fill="#ffffff" stroke="#d4d8da"/><text x="626" y="176" font-size="20">本次真正取得的規則</text><rect x