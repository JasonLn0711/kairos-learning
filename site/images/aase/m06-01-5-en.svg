<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 934" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5 | Four levels of the C4 model</title><desc id="desc">Downward arrows mean zooming into structure, not execution order. Use the levels that help answer the question; all four are not always necessary. A container is not necessarily a Docker container.</desc><rect width="1320" height="934" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="42" font-size="20" font-weight="700">Figure 5 | Four levels of the C4 model</text><rect x="120" y="102" width="1080" height="126" rx="16" fill="#fbfcfd" stroke="#85998e"/><text x="138" y="138" font-size="20" font-weight="700">C1 · System Context</text><text x="138" y="178" font-size="20" font-weight="400">Who uses the system? Which external systems cooperate with it?</text><path d="M660 234 L660 268" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 258L660 268L666 258" fill="none" stroke="#61736b" stroke-width="2"/><rect x="120" y="278" width="1080" height="126" rx="16" fill="#fbfcfd" stroke="#85998e"/><text x="138" y="314" font-size="20" font-weight="700">C2 · Container</text><text x="138" y="354" font-size="20" font-weight="400">Which applications, services and data stores exist?</text><path d="M660 410 L660 444" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 434L660 444L666 434" fill="none" stroke="#61736b" stroke-width="2"/><rect x="120" y="454" width="1080" height="126" rx="16" fill="#fbfcfd" stroke="#85998e"/><text x="138" y="490" font-size="20" font-weight="700">C3 · Component</text><text x="138" y="530" font-size="20" font-weight="400">Which functional components exist within an application?</text><path d="M660 586 L660 620" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 610L660 620L666 610" fill="none" stroke="#61736b" stroke-width="2"/><rect x="120" y="630" width="1080" height="126" rx="16" fill="#fbfcfd" stroke="#85998e"/><text x="138" y="666" font-size="20" font-weight="700">C4 · Code</text><text x="138" y="706" font-size="20" font-weight="400">Which classes, functions and code exist within a component?</text><text x="32" y="806" font-size="20" font-weight="400">Downward arrows mean zooming into structure, not execution order. Use the levels that help</text><text x="32" y="840" font-size="20" font-weight="400">answer the question; all four are not always necessary. A container is not necessarily a</text><text x="32" y="874" font-size="20" font-weight="400">Docker container.</text></g></svg>
