<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 742" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜從規格正本到有證據的完成</title><desc id="desc">箭頭表示工作順序。執行後依測試與審查確認結果；正式決策須更新正本，供下次選取。</desc><rect width="1040" height="742" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 5｜從規格正本到有證據的完成</text><text x="56" y="98" font-size="22">規格正本（Source of Truth）</text><text x="56" y="140" font-size="20">現在有效的規則與版本。</text><path d="M520 194v22m-7-7 7 7 7-7" fill="none" stroke="#697b82" stroke-width="2"/><text x="56" y="252" font-size="22">選取相關資料</text><text x="56" y="294" font-size="20">只拿本次需要的規格、程式與證據。</text><path d="M520 348v22m-7-7 7 7 7-7" fill="none" stroke="#697b82" stroke-width="2"/><rect x="36" y="378" width="968" height="112" rx="8" fill="#f4eae6" stroke="#ca9c87"/><text x="56" y="406" font-size="22">AI Agent 執行任務</text><text x="56" y="448" font-size="20">使用目前取得的 Context。</text><path d="M520 502v22m-7-7 7 7 7-7" fill="none" stroke="#697b82" stroke-width="2"/><text x="56" y="560" font-size="22">測試、審查與更新紀錄</text><text x="56" y="602" font-size="20">有證據後才確認完成，必要時正式更新規格。</text><text x="36" y="684" font-size="20">箭頭表示工作順序。執行後依測試與審查確認結果；正式決策須更新正本，供下次選取。</text></g></svg>
