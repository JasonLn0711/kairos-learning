<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 776" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜可靠的 Agent 工作循環</title><desc id="desc">向下箭頭表示工作順序。確認新決策後，更新規格正本供下次使用；這個回饋關係以文字明示，並非執行後自動完成。</desc><rect width="1040" height="776" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 4｜可靠的 Agent 工作循環</text><text x="56" y="98" font-size="22">規格正本與版本紀錄</text><text x="56" y="140" font-size="20">確認現在有效的規則</text><path d="M520 194v22m-7-7 7 7 7-7" fill="none" stroke="#697b82" stroke-width="2"/><text x="56" y="252" font-size="22">選取本次需要的 Context</text><text x="56" y="294" font-size="20">包含正確文件、程式與必要證據</text><path d="M520 348v22m-7-7 7 7 7-7" fill="none" stroke="#697b82" stroke-width="2"/><rect x="36" y="378" width="968" height="112" rx="8" fill="#f4eae6" stroke="#ca9c87"/><text x="56" y="406" font-size="22">AI Agent 執行工作</text><text x="56" y="448" font-size="20">讀取、分析、修改、執行工具</text><path d="M520 502v22m-7-7 7 7 7-7" fill="none" stroke="#697b82" stroke-width="2"/><text x="56" y="560" font-size="22">測試與審查結果</text><text x="56" y="602" font-size="20">確認真的符合規格，並回查實際結果</text><text x="36" y="684" font-size="20">向下箭頭表示工作順序。確認新決策後，更新規格正本供下次使用；這個回饋關係以文字明示，並</text><text x="36" y="718" font-size="20">非執行後自動完成。</text></g></svg>
