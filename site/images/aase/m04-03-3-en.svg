<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 796" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Similar functions, two information arrangements</title><desc id="desc">A and B are alternatives with no sequence arrows. These are explanatory sketches, with no working controls or user-test evidence.</desc><rect width="1040" height="796" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 3 | Similar functions, two information arrangements</text><rect x="36" y="72" width="468" height="592" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="98" font-size="20" font-weight="700">Arrangement A | Everything is</text><text x="56" y="132" font-size="20" font-weight="700">important</text><text x="60" y="182" font-size="22" font-weight="700">Management system</text><rect x="48" y="208" width="444" height="170" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="60" y="232" font-size="20" font-weight="400">Advanced settings</text><text x="60" y="266" font-size="20" font-weight="400">Download report</text><text x="60" y="300" font-size="20" font-weight="400">View results</text><text x="60" y="334" font-size="20" font-weight="400">Start check</text><text x="60" y="384" font-size="20" font-weight="400">Status: INVALID</text><text x="60" y="434" font-size="20" font-weight="400">Data, instructions, records,</text><text x="60" y="468" font-size="20" font-weight="400">diagnostics and output are</text><text x="60" y="502" font-size="20" font-weight="400">mixed together.</text><text x="60" y="552" font-size="20" font-weight="400">Problem: users cannot identify</text><text x="60" y="586" font-size="20" font-weight="400">what to do now.</text><rect x="536" y="72" width="468" height="592" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="556" y="98" font-size="20" font-weight="700">Arrangement B | Organize</text><text x="556" y="132" font-size="20" font-weight="700">around the task</text><text x="560" y="182" font-size="22" font-weight="700">Application-data check</text><text x="560" y="232" font-size="20" font-weight="400">Confirm the three required</text><text x="560" y="266" font-size="20" font-weight="400">fields.</text><text x="560" y="316" font-size="20" font-weight="400">Application ID: A1024</text><text x="560" y="350" font-size="20" font-weight="400">Applicant code: P008</text><text x="560" y="384" font-size="20" font-weight="400">Document type: not entered</text><rect x="548" y="410" width="444" height="68" rx="12" fill="#edf0f2" stroke="#a75b4a"/><text x="560" y="434" font-size="20" font-weight="400">Document type is missing</text><rect x="548" y="460" width="444" height="68" rx="12" fill="#e3ecfb" stroke="#bccbd0"/><text x="560" y="484" font-size="20" font-weight="400">Enter document type</text><text x="560" y="534" font-size="20" font-weight="400">Improvement: the error,</text><text x="560" y="568" font-size="20" font-weight="400">correction and next action</text><text x="560" y="602" font-size="20" font-weight="400">have a clear relationship.</text><text x="36" y="708" font-size="20" font-weight="400">A and B are alternatives with no sequence arrows. These are</text><text x="36" y="742" font-size="20" font-weight="400">explanatory sketches, with no working controls or user-test evidence.</text></g></svg>
