<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 692" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Three Agent Instructions and Their Artifacts</title><desc id="desc">Arrows show the suggested sequence: review the proposal, implement and obtain test evidence, then accept and archive. Return to planning for the next change. Check slash syntax against the version and assistant. The four artifact types divide responsibilities; create design.md when needed.</desc><rect width="1440" height="692" fill="#f5faf9"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#182f32"><text x="36" y="42" font-size="20" font-weight="700">Figure 1 | Three Agent Instructions and Their Artifacts</text><rect x="36" y="100" width="432" height="352" rx="14" fill="#ffffff" stroke="#7da6a9"/><text x="56" y="138" font-size="20" font-weight="700">/opsx:propose</text><text x="56" y="182" font-size="20" font-weight="400">proposal.md | Why and what</text><text x="56" y="218" font-size="20" font-weight="400">changes</text><text x="56" y="254" font-size="20" font-weight="400">design.md | Technical</text><text x="56" y="290" font-size="20" font-weight="400">approach</text><text x="56" y="326" font-size="20" font-weight="400">specs/ | Candidate</text><text x="56" y="362" font-size="20" font-weight="400">specification deltas</text><text x="56" y="398" font-size="20" font-weight="400">tasks.md | Work checklist</text><path d="M475 164h22m-7-7 7 7-7 7" fill="none" stroke="#386d72" stroke-width="2"/><rect x="504" y="100" width="432" height="280" rx="14" fill="#ffffff" stroke="#7da6a9"/><text x="524" y="138" font-size="20" font-weight="700">/opsx:apply</text><text x="524" y="182" font-size="20" font-weight="400">People review the documents</text><text x="524" y="218" font-size="20" font-weight="400">first; the agent implements</text><text x="524" y="254" font-size="20" font-weight="400">tasks.md.</text><text x="524" y="290" font-size="20" font-weight="400">Run functional and negative</text><text x="524" y="326" font-size="20" font-weight="400">tests and retain results.</text><path d="M943 164h22m-7-7 7 7-7 7" fill="none" stroke="#386d72" stroke-width="2"/><rect x="972" y="100" width="432" height="352" rx="14" fill="#ffffff" stroke="#7da6a9"/><text x="992" y="138" font-size="20" font-weight="700">/opsx:archive</text><text x="992" y="182" font-size="20" font-weight="400">Accepted candidate deltas →</text><text x="992" y="218" font-size="20" font-weight="400">current openspec/specs/</text><text x="992" y="254" font-size="20" font-weight="400">ADDED / MODIFIED / REMOVED</text><text x="992" y="290" font-size="20" font-weight="400">requirements</text><text x="992" y="326" font-size="20" font-weight="400">Keep proposal history;</text><text x="992" y="362" font-size="20" font-weight="400">archive does not certify</text><text x="992" y="398" font-size="20" font-weight="400">tests or deployment.</text><text x="36" y="500" font-size="20" font-weight="400">↶ Next change: return to planning and exploration</text><text x="36" y="560" font-size="20" font-weight="400">Arrows show the suggested sequence: review the proposal, implement and obtain test evidence, then</text><text x="36" y="596" font-size="20" font-weight="400">accept and archive. Return to planning for the next change. Check slash syntax against the version</text><text x="36" y="632" font-size="20" font-weight="400">and assistant. The four artifact types divide responsibilities; create design.md when needed.</text></g></svg>
