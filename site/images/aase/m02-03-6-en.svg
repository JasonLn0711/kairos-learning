<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1302" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 6 | Development and Verification Across Days</title><desc id="desc">Arrows describe this example’s order only. The divider before day two separates workdays. Update records from actual results.</desc><rect width="1040" height="1302" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 6 | Development and Verification Across Days</text><rect x="36.0" y="72" width="968.0" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="100" font-size="22">Day one: begin work</text><text x="52.0" y="144" font-size="20">The AI receives requirements and writes code. The engine may use KV</text><text x="52.0" y="180" font-size="20">Cache to reduce repeated generation computations.</text><path d="M520 244v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="278" width="968.0" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="306" font-size="22">Conversation grows</text><text x="52.0" y="350" font-size="20">Use Compaction to organize constraints and progress so the limited</text><text x="52.0" y="386" font-size="20">Context Window remains usable.</text><path d="M520 450v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="484" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="512" font-size="22">Pause work</text><text x="52.0" y="556" font-size="20">Save confirmed decisions, test results and next steps in Memory.</text><path d="M520 620v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="654" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="682" font-size="22">Day two: resume work</text><text x="52.0" y="726" font-size="20">Retrieve yesterday’s progress from Memory.</text><path d="M36 642h968" stroke="#84999e" stroke-width="3"/><path d="M520 790v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="824" width="968.0" height="158" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="852" font-size="22">Check specifications</text><text x="52.0" y="896" font-size="20">Use RAG to find the latest requirements, avoiding reliance on</text><text x="52.0" y="932" font-size="20">potentially stale notes.</text><path d="M520 996v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="1030" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="1058" font-size="22">Continue development and verification</text><text x="52.0" y="1102" font-size="20">Modify code, run tests and update the work log from actual results.</text><text x="36" y="1206" font-size="20">Arrows describe this example’s order only. The divider before day two</text><text x="36" y="1242" font-size="20">separates workdays. Update records from actual results.</text></g></svg>
