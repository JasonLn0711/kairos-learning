<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 814" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜HTA：任務層次</title><desc id="desc">其中「3. 處理缺件」還可細分為：辨識缺漏 → 取得資料 → 補填資料。這些是任務的層次，不代表每次都會執行；執行條件由 Plan 交代。</desc><rect width="1040" height="814" fill="#ffffff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="20" font-weight="700">圖 2｜HTA：任務層次</text><rect x="36" y="96" width="968" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="132" font-size="20" font-weight="700">0. 完成收件完整性檢查</text><text x="56" y="174" font-size="20" font-weight="400">將整體目標拆成下列五項子任務。</text><path d="M520 232v15M268 247h504M268 247v15M772 247v15" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="274" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="310" font-size="20" font-weight="700">1. 準備資料</text><text x="56" y="352" font-size="20" font-weight="400">子任務；依 Plan 決定是否執行。</text><rect x="540" y="274" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="310" font-size="20" font-weight="700">2. 執行檢查</text><text x="560" y="352" font-size="20" font-weight="400">子任務；依 Plan 決定是否執行。</text><rect x="36" y="414" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="450" font-size="20" font-weight="700">3. 處理缺件</text><text x="56" y="492" font-size="20" font-weight="400">子任務；依 Plan 決定是否執行。</text><rect x="540" y="414" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="560" y="450" font-size="20" font-weight="700">4. 核對結果</text><text x="560" y="492" font-size="20" font-weight="400">子任務；依 Plan 決定是否執行。</text><rect x="36" y="554" width="464" height="124" rx="12" fill="#fbfcfd" stroke="#aab4bb"/><text x="56" y="590" font-size="20" font-weight="700">5. 匯出或退出</text><text x="56" y="632" font-size="20" font-weight="400">子任務；依 Plan 決定是否執行。</text><text x="36" y="722" font-size="20" font-weight="400">其中「3. 處理缺件」還可細分為：辨識缺漏 → 取得資料 → 補填資料。這些是任務的層次，不代</text><text x="36" y="756" font-size="20" font-weight="400">表每次都會執行；執行條件由 Plan 交代。</text></g></svg>
