<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 878" role="img" aria-labelledby="title desc"><title id="title">圖 2｜同一理賠案件的三種驗收情境</title><desc id="desc">三列各自呈現輸入條件、預期行為及應保存的證據；A→B→C 可按同一案件重演，但列間沒有因果箭頭。這是教學情境，尚無當次測試結果。</desc><rect width="1060" height="878" fill="#fbfcfc"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="48" y="40" font-size="20" font-weight="700">圖 2｜同一理賠案件的三種驗收情境</text><rect x="24" y="96" width="1012" height="206" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="132" font-size="20" font-weight="700">情境 A：故意讓資料不完整（負向測試）</text><text x="48" y="176" font-size="20" font-weight="400">申請人缺少醫療收據。系統應該提醒「缺少必要文件」，而且不能讓工作人員下載標示為完整的</text><text x="48" y="212" font-size="20" font-weight="400">報告。</text><text x="48" y="248" font-size="20" font-weight="400">驗收證據：缺漏提示、禁止匯出的測試結果，以及實際畫面。</text><rect x="24" y="320" width="1012" height="206" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="356" font-size="20" font-weight="700">情境 B：補齊所有資料（正常測試）</text><text x="48" y="400" font-size="20" font-weight="400">工作人員上傳收據後重新檢核。系統顯示完成，允許匯出 JSON 報告，而且報告內容必須正確</text><text x="48" y="436" font-size="20" font-weight="400">。</text><text x="48" y="472" font-size="20" font-weight="400">驗收證據：實際匯出檔案、欄位比對與通過的測試紀錄。</text><rect x="24" y="544" width="1012" height="206" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="580" font-size="20" font-weight="700">情境 C：修改已經檢核完成的資料（過期結果測試）</text><text x="48" y="624" font-size="20" font-weight="400">假設工作人員把原本已填寫的醫療費用刪掉。系統就不能繼續讓使用者下載修改前產生的完整報</text><text x="48" y="660" font-size="20" font-weight="400">告，必須要求重新檢核。</text><text x="48" y="696" font-size="20" font-weight="400">驗收證據：修改後的檢核狀態、舊下載失效，以及重新檢核的操作紀錄。</text><text x="48" y="786" font-size="20" font-weight="400">三列各自呈現輸入條件、預期行為及應保存的證據；A→B→C 可按同一案件重演，但列間沒有因</text><text x="48" y="822" font-size="20" font-weight="400">果箭頭。這是教學情境，尚無當次測試結果。</text></g></svg>
