<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 872" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜缺漏、補正、再次修改的三階段測試</title><desc id="desc">向下箭頭表示同一情境的操作順序。第三階段清除舊成功、下載與已檢查狀態，要求以新輸入重新驗證。</desc><rect width="1060" height="872" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 2｜缺漏、補正、再次修改的三階段測試</text><rect x="36" y="98" width="988" height="240" rx="12" fill="#fff6ed" stroke="#64748b"/><text x="56" y="134" font-size="20" font-weight="700">階段 1｜資料缺漏</text><text x="56" y="178" font-size="20" font-weight="400">案件編號：SYN-001</text><text x="56" y="214" font-size="20" font-weight="400">申請人代碼：DEMO-A</text><text x="56" y="250" font-size="20" font-weight="400">文件類型：未填寫</text><text x="56" y="286" font-size="20" font-weight="400">顯示「缺少文件類型」；不得提供下載。</text><path d="M530 346v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="390" width="988" height="168" rx="12" fill="#edf8f3" stroke="#64748b"/><text x="56" y="426" font-size="20" font-weight="700">階段 2｜補齊資料並檢查成功</text><text x="56" y="470" font-size="20" font-weight="400">文件類型：合成申請表</text><text x="56" y="506" font-size="20" font-weight="400">顯示檢查成功，出現下載按鈕。</text><path d="M530 566v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="610" width="988" height="168" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="646" font-size="20" font-weight="700">階段 3｜再次修改輸入</text><text x="56" y="690" font-size="20" font-weight="400">文件類型：再次清空</text><text x="56" y="726" font-size="20" font-weight="400">舊成功訊息、下載按鈕、已檢查狀態全部失效。</text><text x="36" y="812" font-size="20" font-weight="400">向下箭頭表示同一情境的操作順序。第三階段清除舊成功、下載與已檢查狀態，要求以新輸入重新驗證。</text></g></svg>
