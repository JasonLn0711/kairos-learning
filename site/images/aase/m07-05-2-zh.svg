<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1322" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜預覽與匯出的可靠流程</title><desc id="desc">箭頭表示檢查順序與條件去向。資料修改分支返回驗證；只有資料未變且符合規則才前進至匯出。</desc><rect width="1060" height="1322" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 2｜預覽與匯出的可靠流程</text><rect x="36" y="96" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">使用者輸入資料</text><text x="56" y="176" font-size="20" font-weight="400">Current Record</text><path d="M530 236v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="288" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="324" font-size="20" font-weight="700">按下檢查，執行驗證</text><text x="56" y="368" font-size="20" font-weight="400">Validation；失敗則補正後重查</text><path d="M530 428v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="480" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="516" font-size="20" font-weight="700">驗證通過，保存快照</text><text x="56" y="560" font-size="20" font-weight="400">Checked Snapshot</text><path d="M530 620v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="672" width="478" height="132" rx="14" fill="#f7f2eb" stroke="#64748b"/><text x="56" y="708" font-size="20" font-weight="700">資料被修改</text><text x="56" y="752" font-size="20" font-weight="400">舊快照失效 → 返回「按下檢查，執行驗證」</text><rect x="546" y="672" width="478" height="132" rx="14" fill="#eef6f3" stroke="#64748b"/><text x="566" y="708" font-size="20" font-weight="700">資料沒有變</text><text x="566" y="752" font-size="20" font-weight="400">符合規則，准許預覽 → 匯出前再驗證</text><text x="36" y="840" font-size="20" font-weight="400">只有「資料沒有變」分支繼續 ↓</text><rect x="36" y="896" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="932" font-size="20" font-weight="700">匯出前再驗證 + 允許清單過濾</text><text x="56" y="976" font-size="20" font-weight="400">Revalidation + Allowlist；失敗則停止匯出並重查</text><path d="M530 1036v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="1088" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="1124" font-size="20" font-weight="700">輸出 JSON 報告</text><text x="56" y="1168" font-size="20" font-weight="400">附上適用範圍說明（Scope）</text><text x="36" y="1262" font-size="20" font-weight="400">箭頭表示檢查順序與條件去向。資料修改分支返回驗證；只有資料未變且符合規則才前進至匯出。</text></g></svg>
