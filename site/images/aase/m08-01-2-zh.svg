<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 658" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜通過、失敗與待驗</title><desc id="desc">三列是不同證據狀態，沒有先後關係。通過只支持已測版本與條件；沒有執行或證據不足均保留待驗。</desc><rect width="1060" height="658" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 2｜通過、失敗與待驗</text><rect x="36" y="94" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="130" font-size="20" font-weight="700">✓ 通過（Pass）</text><text x="56" y="174" font-size="20" font-weight="400">已執行，結果符合預期，但只適用於已測試的版本及條件。</text><rect x="36" y="246" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="282" font-size="20" font-weight="700">× 失敗（Fail）</text><text x="56" y="326" font-size="20" font-weight="400">已執行，但觀察結果不符合預期，應保留失敗證據。</text><rect x="36" y="398" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="434" font-size="20" font-weight="700">○ 待驗（Not Tested）</text><text x="56" y="478" font-size="20" font-weight="400">沒有執行，或缺少足夠證據，不能自行假設通過。</text><text x="36" y="562" font-size="20" font-weight="400">三列是不同證據狀態，沒有先後關係。通過只支持已測版本與條件；沒有執行或證據不足均保留待驗</text><text x="36" y="598" font-size="20" font-weight="400">。</text></g></svg>
