<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 878" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Intake form</title><desc id="desc">All three fields are intended to be required, but required-field validation is not implemented. Use synthetic test data.</desc><rect width="1060" height="878" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700" fill="#18252c">Figure 2 | Intake form</text><text x="36" y="90" font-size="20" font-weight="400" fill="#18252c">All three fields are intended to be required, but required-field</text><text x="36" y="126" font-size="20" font-weight="400" fill="#18252c">validation is not implemented. Use synthetic test data.</text><text x="36" y="190" font-size="20" font-weight="700" fill="#18252c">Application ID (intended required)</text><rect x="36" y="230" width="988" height="80" rx="8" fill="#ffffff" stroke="#87949c"/><text x="52" y="262" font-size="20" font-weight="400" fill="#18252c">SYN-001</text><text x="36" y="342" font-size="20" font-weight="700" fill="#18252c">Applicant code (intended required)</text><rect x="36" y="382" width="988" height="80" rx="8" fill="#ffffff" stroke="#87949c"/><text x="52" y="414" font-size="20" font-weight="400" fill="#18252c">DEMO-A</text><text x="36" y="494" font-size="20" font-weight="700" fill="#18252c">Document type (intended required)</text><rect x="36" y="534" width="988" height="80" rx="8" fill="#ffffff" stroke="#87949c"/><text x="52" y="566" font-size="20" font-weight="400" fill="#18252c">(blank)</text><rect x="36" y="634" width="988" height="80" rx="8" fill="#18252c" stroke="#87949c"/><text x="52" y="666" font-size="20" font-weight="400" fill="#ffffff">View current input (unvalidated)</text><text x="36" y="750" font-size="20" font-weight="400" fill="#18252c">No preview yet</text><text x="36" y="786" font-size="20" font-weight="400" fill="#18252c">Press the button to show a preview. Editing any field clears the</text><text x="36" y="822" font-size="20" font-weight="400" fill="#18252c">previous preview.</text></g></svg>
