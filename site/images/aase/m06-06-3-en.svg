<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1132" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Three trust boundaries along the data path</title><desc id="desc">Arrows show example data flow. A/B/C mark checks across boundaries; drawing them implements no controls.</desc><rect width="1060" height="1132" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 3 | Three trust boundaries along the data path</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Untrusted external input</text><text x="56" y="176" font-size="20" font-weight="400">Uploaded documents, forms and API calls.</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="298" font-size="20" font-weight="400">Trust boundary A</text><rect x="36" y="354" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="390" font-size="20" font-weight="700">Backend application</text><text x="56" y="434" font-size="20" font-weight="400">Validate type, format, size, identity and operation permissions.</text><path d="M530 492v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="556" font-size="20" font-weight="400">Trust boundary B</text><rect x="36" y="612" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="648" font-size="20" font-weight="700">Internal sensitive database</text><text x="56" y="692" font-size="20" font-weight="400">Enforce data-access permissions and query restrictions.</text><path d="M530 750v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="814" font-size="20" font-weight="400">Trust boundary C</text><rect x="36" y="870" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="906" font-size="20" font-weight="700">External export and sharing</text><text x="56" y="950" font-size="20" font-weight="400">Restrict output fields, recipients and data scope</text><text x="36" y="1036" font-size="20" font-weight="400">Arrows show example data flow. A/B/C mark checks across boundaries;</text><text x="36" y="1072" font-size="20" font-weight="400">drawing them implements no controls.</text></g></svg>
