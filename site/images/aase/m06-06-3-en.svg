<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 976" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Three trust boundaries along the data path</title><desc id="desc">Arrows show example data flow. A/B/C mark checks across boundaries; drawing them implements no controls.</desc><rect width="1060" height="976" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 3 | Three trust boundaries along the data path</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Untrusted external input</text><text x="56" y="176" font-size="20" font-weight="400">Uploaded documents, forms and API calls. ↓ Trust boundary A</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="278" width="988" height="166" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">Backend application</text><text x="56" y="358" font-size="20" font-weight="400">Validate type, format, size, identity and operation permissions. ↓</text><text x="56" y="394" font-size="20" font-weight="400">Trust boundary B</text><path d="M530 452v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="496" width="988" height="166" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="532" font-size="20" font-weight="700">Internal sensitive database</text><text x="56" y="576" font-size="20" font-weight="400">Enforce data-access permissions and query restrictions. ↓ Trust</text><text x="56" y="612" font-size="20" font-weight="400">boundary C</text><path d="M530 670v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="714" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="750" font-size="20" font-weight="700">External export and sharing</text><text x="56" y="794" font-size="20" font-weight="400">Restrict output fields, recipients and data scope</text><text x="36" y="880" font-size="20" font-weight="400">Arrows show example data flow. A/B/C mark checks across boundaries;</text><text x="36" y="916" font-size="20" font-weight="400">drawing them implements no controls.</text></g></svg>
