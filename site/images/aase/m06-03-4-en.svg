<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1444" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4｜C2 applications and storage</title><desc id="desc">The boundary encloses the frontend, API and PostgreSQL; the customer and payment platform are outside. Frontend ↔ API uses HTTPS/API, API ↔ database reads/writes data, and API ↔ external payment platform exchanges payment information. Links are relationships, not a universal sequence.</desc><rect width="1060" height="1444" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 4｜C2 applications and storage</text><rect x="36" y="96" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="132" font-size="20" font-weight="700">Customer</text><text x="56" y="176" font-size="20" font-weight="400">Outside the system; uses the ordering frontend</text><path d="M520 242v28m-7-7 7 7 7-7" fill="none" stroke="#46535f" stroke-width="2"/><rect x="36" y="290" width="988" height="684" rx="14" fill="#fbfcfd" stroke="#7295bf" stroke-dasharray="5 5"/><text x="56" y="326" font-size="20" font-weight="700">Online ordering system — C4 container view</text><rect x="56" y="376" width="948" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="76" y="412" font-size="20" font-weight="700">Ordering frontend (Web App)</text><text x="76" y="456" font-size="20" font-weight="400">Displays menus, cart and orders</text><path d="M520 522v28m-7-7 7 7 7-7M536 550V522m-7 7 7-7 7 7" fill="none" stroke="#46535f" stroke-width="2"/><text x="560" y="542" font-size="20" font-weight="400">HTTPS / API</text><rect x="56" y="598" width="948" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="76" y="634" font-size="20" font-weight="700">Order backend (API Application)</text><text x="76" y="678" font-size="20" font-weight="400">Checks orders, calculates amounts and applies business rules</text><path d="M520 744v28m-7-7 7 7 7-7M536 772V744m-7 7 7-7 7 7" fill="none" stroke="#46535f" stroke-width="2"/><text x="560" y="764" font-size="20" font-weight="400">Read / save orders and products</text><rect x="56" y="820" width="948" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="76" y="856" font-size="20" font-weight="700">Order database (PostgreSQL)</text><text x="76" y="900" font-size="20" font-weight="400">Stores orders and product data</text><text x="56" y="1014" font-size="20" font-weight="400">Order backend ↔ third-party payment platform</text><rect x="36" y="1066" width="988" height="134" rx="14" fill="#eaf1f7" stroke="#7295bf"/><text x="56" y="1102" font-size="20" font-weight="700">Third-party payment platform</text><text x="56" y="1146" font-size="20" font-weight="400">Outside the system; communicates with the order backend</text><text x="36" y="1240" font-size="20" font-weight="400">The boundary encloses the frontend, API and PostgreSQL; the customer</text><text x="36" y="1276" font-size="20" font-weight="400">and payment platform are outside. Frontend ↔ API uses HTTPS/API, API ↔</text><text x="36" y="1312" font-size="20" font-weight="400">database reads/writes data, and API ↔ external payment platform</text><text x="36" y="1348" font-size="20" font-weight="400">exchanges payment information. Links are relationships, not a universal</text><text x="36" y="1384" font-size="20" font-weight="400">sequence.</text></g></svg>
