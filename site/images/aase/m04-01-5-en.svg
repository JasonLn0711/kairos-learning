<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 716" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5 | Break the actual work into tasks</title><desc id="desc">For each step in order, examine the role, information, success criteria and exceptions.</desc><rect width="1040" height="716" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 5 | Break the actual work into tasks</text><text x="520" y="102" text-anchor="middle" font-size="20">The user receives a case</text><path d="M520 136v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><text x="520" y="194" text-anchor="middle" font-size="20">Finds the required information</text><path d="M520 228v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><text x="520" y="286" text-anchor="middle" font-size="20">Fills in the form</text><path d="M520 320v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><text x="520" y="378" text-anchor="middle" font-size="20">Finds and corrects omissions</text><path d="M520 412v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><text x="520" y="470" text-anchor="middle" font-size="20">Checks and exports the report</text><path d="M520 504v24m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><text x="520" y="562" text-anchor="middle" font-size="20">Hands it to the next case worker</text><text x="36" y="620" font-size="20" font-weight="400">For each step in order, examine the role, information, success criteria</text><text x="36" y="654" font-size="20" font-weight="400">and exceptions.</text></g></svg>
