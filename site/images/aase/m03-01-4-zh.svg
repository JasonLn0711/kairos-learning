<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1322" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜As-Is／To-Be｜比較工作流程</title><desc id="desc">前 3 格是 As-Is，後 4 格是 To-Be；兩組各自依箭頭前進，沒有從舊流程交接連到新流程填寫的箭頭。To-Be 第 3 格僅於有缺漏時執行。</desc><rect width="1040" height="1322" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 4｜As-Is／To-Be｜比較工作流程</text><rect x="36" y="70" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">As-Is 1｜填寫資料</text><text x="56" y="142" font-size="20" font-weight="400">目前流程：輸入申請文件內容。</text><path d="M520 206v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="234" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="262" font-size="22" font-weight="650">As-Is 2｜人工檢查</text><text x="56" y="306" font-size="20" font-weight="400">使用人工清單逐一核對。</text><path d="M520 370v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="398" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="426" font-size="22" font-weight="650">As-Is 3｜交接文件</text><text x="56" y="470" font-size="20" font-weight="400">假設的痛點：人工核對可能遺漏必填欄位。</text><rect x="36" y="566" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="594" font-size="22" font-weight="650">To-Be 1｜填寫資料</text><text x="56" y="638" font-size="20" font-weight="400">預期流程：輸入申請文件內容。</text><path d="M520 702v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="730" width="968" height="122" rx="8" fill="#e7f2ef" stroke="#81b7aa"/><text x="56" y="758" font-size="22" font-weight="650">To-Be 2｜系統檢查必填欄位</text><text x="56" y="802" font-size="20" font-weight="400">改變的環節：檢查必要欄位是否齊全。</text><path d="M520 866v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="894" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="922" font-size="22" font-weight="650">To-Be 3｜有缺漏就提示並修正</text><text x="56" y="966" font-size="20" font-weight="400">條件步驟：有缺漏時顯示提示，修正後確認齊全。</text><path d="M520 1030v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36" y="1058" width="968" height="122" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="1086" font-size="22" font-weight="650">To-Be 4｜預覽、匯出與交接</text><text x="56" y="1130" font-size="20" font-weight="400">缺漏處理完成後繼續；改善效果仍待測試。</text><text x="36" y="1226" font-size="20" font-weight="400">前 3 格是 As-Is，後 4 格是 To-Be；兩組各自依箭頭前進，沒有從舊流程交接連到新流程</text><text x="36" y="1262" font-size="20" font-weight="400">填寫的箭頭。To-Be 第 3 格僅於有缺漏時執行。</text></g></svg>
