<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 514" role="img" aria-labelledby="title desc"><title id="title">圖 1｜可替換工具與持續責任</title><desc id="desc">兩欄為平行對照，窄版依序重排；責任可依新需求調整，但須明確決策、更新規格並重新驗證，工具不能自行決定。</desc><rect width="1060" height="514" fill="#fbfcfc"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="48" y="40" font-size="20" font-weight="700">圖 1｜可替換工具與持續責任</text><text x="48" y="132" font-size="20" font-weight="700">可以更換的工具</text><text x="48" y="176" font-size="20" font-weight="400">AI 模型</text><text x="48" y="212" font-size="20" font-weight="400">Coding Agent</text><text x="48" y="248" font-size="20" font-weight="400">UI 開發框架</text><text x="48" y="284" font-size="20" font-weight="400">資料庫與部署方式</text><text x="48" y="320" font-size="20" font-weight="400">第三方套件</text><text x="568" y="132" font-size="20" font-weight="700">必須持續履行的責任</text><text x="568" y="176" font-size="20" font-weight="400">使用者真正的需求</text><text x="568" y="212" font-size="20" font-weight="400">業務規則與驗收條件</text><text x="568" y="248" font-size="20" font-weight="400">資料安全與權限</text><text x="568" y="284" font-size="20" font-weight="400">測試與故障復原</text><text x="568" y="320" font-size="20" font-weight="400">文件、交接與負責人</text><text x="48" y="422" font-size="20" font-weight="400">兩欄為平行對照，窄版依序重排；責任可依新需求調整，但須明確決策、更新規格並重新驗證，</text><text x="48" y="458" font-size="20" font-weight="400">工具不能自行決定。</text></g></svg>
