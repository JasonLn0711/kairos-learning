<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 790" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 6｜先驗證，再讓 AI 解釋</title><desc id="desc">箭頭表示工作分工與資料流。欄位完整性檢查不等於正式審核通過。</desc><rect width="1040" height="790" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 6｜先驗證，再讓 AI 解釋</text><rect x="36.0" y="70" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="98" font-size="22">原始申請資料</text><text x="56.0" y="142" font-size="20">SYN-001／DEMO-A／文件類型空白</text><path d="M512 201v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="233" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="261" font-size="22">程式規則驗證</text><text x="56.0" y="305" font-size="20">檢查申請編號、申請人代號及文件類型是否都已填寫。</text><path d="M512 364v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="396" width="952.0" height="120" rx="10" fill="#fff4e9" stroke="#c8a17c"/><text x="56.0" y="424" font-size="22">驗證結果：缺少文件類型</text><text x="56.0" y="468" font-size="20">保留規則檢查的實際結果。</text><path d="M512 527v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="559" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="587" font-size="22">AI 協助使用者理解</text><text x="56.0" y="631" font-size="20">「目前無法標記為完整，請補上文件類型。」</text><text x="36" y="732" font-size="20">箭頭表示工作分工與資料流。欄位完整性檢查不等於正式審核通過。</text></g></svg>
