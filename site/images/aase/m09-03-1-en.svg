<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1122" role="img" aria-labelledby="title desc"><title id="title">Figure 1 | Trace requirements to evidence and delivery</title><desc id="desc">Downward arrows indicate the traceability reading order. Stage four emphasizes actual observations. Each stage links artifacts for the same case; arrows do not establish acceptance.</desc><rect width="1060" height="1122" fill="#fbfcfc"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="48" y="40" font-size="20" font-weight="700">Figure 1 | Trace requirements to evidence and delivery</text><rect x="24" y="96" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="132" font-size="20" font-weight="700">1. Problem and requirements</text><text x="48" y="176" font-size="20" font-weight="400">What problem was originally to be solved?</text><path d="M530 238v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="278" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="314" font-size="20" font-weight="700">2. Design and specification</text><text x="48" y="358" font-size="20" font-weight="400">How did you promise the system would behave?</text><path d="M530 420v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="460" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="496" font-size="20" font-weight="700">3. Code and version</text><text x="48" y="540" font-size="20" font-weight="400">What was implemented, and in which version?</text><path d="M530 602v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="642" width="1012" height="134" rx="14" fill="#eaf3f0" stroke="#a6b8b4"/><text x="48" y="678" font-size="20" font-weight="700">4. Tests and acceptance evidence</text><text x="48" y="722" font-size="20" font-weight="400">What was actually observed, and did it meet requirements?</text><path d="M530 784v28m-7-7 7 7 7-7" fill="none" stroke="#526367" stroke-width="2"/><rect x="24" y="824" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="860" font-size="20" font-weight="700">5. Delivery and limits</text><text x="48" y="904" font-size="20" font-weight="400">Who can use it, and what risks remain?</text><text x="48" y="994" font-size="20" font-weight="400">Downward arrows indicate the traceability reading order. Stage four</text><text x="48" y="1030" font-size="20" font-weight="400">emphasizes actual observations. Each stage links artifacts for the</text><text x="48" y="1066" font-size="20" font-weight="400">same case; arrows do not establish acceptance.</text></g></svg>
