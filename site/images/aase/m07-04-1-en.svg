<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 758" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Interface and data validation</title><desc id="desc">Arrows send data to the rule layer. Failed and passed are mutually exclusive outcomes, not consecutive steps.</desc><rect width="1060" height="758" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 1 | Interface and data validation</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">User interface (UI)</text><text x="56" y="176" font-size="20" font-weight="400">Help entry, remind users of required fields and limit length</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="278" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">Data validation</text><text x="56" y="358" font-size="20" font-weight="400">Check fields, types, whitespace and length against the rules</text><rect x="36" y="460" width="478" height="166" rx="14" fill="#fff5f5" stroke="#64748b"/><text x="56" y="496" font-size="20" font-weight="700">Failed</text><text x="56" y="540" font-size="20" font-weight="400">Show reasons and retain data for</text><text x="56" y="576" font-size="20" font-weight="400">correction</text><rect x="546" y="460" width="478" height="166" rx="14" fill="#f1faf5" stroke="#64748b"/><text x="566" y="496" font-size="20" font-weight="700">Passed</text><text x="566" y="540" font-size="20" font-weight="400">The current fields meet the</text><text x="566" y="576" font-size="20" font-weight="400">stated rules</text><path d="M275 420v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M785 420v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><text x="36" y="662" font-size="20" font-weight="400">Arrows send data to the rule layer. Failed and passed are mutually</text><text x="36" y="698" font-size="20" font-weight="400">exclusive outcomes, not consecutive steps.</text></g></svg>
