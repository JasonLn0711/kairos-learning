<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 806" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜收件資料表單</title><desc id="desc">三個欄位預計都為必填，但目前尚未實作必填驗證。請使用合成測試資料。</desc><rect width="1060" height="806" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700" fill="#18252c">圖 2｜收件資料表單</text><text x="36" y="90" font-size="20" font-weight="400" fill="#18252c">三個欄位預計都為必填，但目前尚未實作必填驗證。請使用合成測試資料。</text><text x="36" y="154" font-size="20" font-weight="700" fill="#18252c">申請編號（預計必填）</text><rect x="36" y="194" width="988" height="80" rx="8" fill="#ffffff" stroke="#87949c"/><text x="52" y="226" font-size="20" font-weight="400" fill="#18252c">SYN-001</text><text x="36" y="306" font-size="20" font-weight="700" fill="#18252c">申請人代號（預計必填）</text><rect x="36" y="346" width="988" height="80" rx="8" fill="#ffffff" stroke="#87949c"/><text x="52" y="378" font-size="20" font-weight="400" fill="#18252c">DEMO-A</text><text x="36" y="458" font-size="20" font-weight="700" fill="#18252c">文件類型（預計必填）</text><rect x="36" y="498" width="988" height="80" rx="8" fill="#ffffff" stroke="#87949c"/><text x="52" y="530" font-size="20" font-weight="400" fill="#18252c">（空白）</text><rect x="36" y="598" width="988" height="80" rx="8" fill="#18252c" stroke="#87949c"/><text x="52" y="630" font-size="20" font-weight="400" fill="#ffffff">查看本次輸入（未檢核）</text><text x="36" y="714" font-size="20" font-weight="400" fill="#18252c">目前沒有預覽結果</text><text x="36" y="750" font-size="20" font-weight="400" fill="#18252c">按下查看按鈕才會顯示；修改任一欄位會清除舊預覽。</text></g></svg>
