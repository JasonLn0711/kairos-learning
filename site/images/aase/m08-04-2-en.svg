<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 908" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Omission, correction and another edit</title><desc id="desc">Downward arrows show operations in one scenario. Stage three clears old success, download and checked state, requiring validation of the new input.</desc><rect width="1060" height="908" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 2 | Omission, correction and another edit</text><rect x="36" y="98" width="988" height="240" rx="12" fill="#fff6ed" stroke="#64748b"/><text x="56" y="134" font-size="20" font-weight="700">Stage 1 | Missing data</text><text x="56" y="178" font-size="20" font-weight="400">Application ID: SYN-001</text><text x="56" y="214" font-size="20" font-weight="400">Applicant code: DEMO-A</text><text x="56" y="250" font-size="20" font-weight="400">Document type: not filled in</text><text x="56" y="286" font-size="20" font-weight="400">Show missing document-type feedback; no download.</text><path d="M530 346v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="390" width="988" height="168" rx="12" fill="#edf8f3" stroke="#64748b"/><text x="56" y="426" font-size="20" font-weight="700">Stage 2 | Complete data and check</text><text x="56" y="470" font-size="20" font-weight="400">Document type: 合成申請表</text><text x="56" y="506" font-size="20" font-weight="400">Show success and a download button.</text><path d="M530 566v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="610" width="988" height="168" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="646" font-size="20" font-weight="700">Stage 3 | Edit input again</text><text x="56" y="690" font-size="20" font-weight="400">Document type: cleared again</text><text x="56" y="726" font-size="20" font-weight="400">Invalidate old success, download and checked state.</text><text x="36" y="812" font-size="20" font-weight="400">Downward arrows show operations in one scenario. Stage three clears old</text><text x="36" y="848" font-size="20" font-weight="400">success, download and checked state, requiring validation of the new input.</text></g></svg>
