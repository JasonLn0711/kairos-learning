<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1106" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 | Agent task contract</title><desc id="desc">Teaching example. Allowed and prohibited actions are parallel permissions; success, stopping and evidence serve different purposes. Tools and the execution environment must enforce actual restrictions.</desc><rect width="1040" height="1106" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 3 | Agent task contract</text><rect x="36" y="94" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="128" font-size="22">Goal</text><text x="56" y="170" font-size="20">Fix rejection of three subjects on weekends.</text><rect x="36" y="236" width="460" height="158" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="270" font-size="22">Allowed</text><text x="56" y="312" font-size="20">Read relevant code, change</text><text x="56" y="346" font-size="20">specified files and run tests.</text><rect x="544" y="236" width="460" height="192" rx="10" fill="#fbf0ed" stroke="#d4d8da"/><text x="564" y="270" font-size="22">Prohibited</text><text x="564" y="312" font-size="20">Delete production data, upload</text><text x="564" y="346" font-size="20">private information or publish</text><text x="564" y="380" font-size="20">independently.</text><rect x="36" y="446" width="968" height="158" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="480" font-size="22">Success criteria</text><text x="56" y="522" font-size="20">Weekend plans with three subjects save, weekday plans with three</text><text x="56" y="556" font-size="20">are still rejected, and relevant automated tests pass.</text><rect x="36" y="622" width="968" height="158" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="656" font-size="22">Stop conditions</text><text x="56" y="698" font-size="20">Conflicting requirements, additional authorization needed,</text><text x="56" y="732" font-size="20">unavailable tools, or exhausted budget and retry limits.</text><rect x="36" y="798" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="832" font-size="22">Handoff evidence</text><text x="56" y="874" font-size="20">Changed files, diffs, actual test results and unresolved questions.</text><text x="36" y="976" font-size="20">Teaching example. Allowed and prohibited actions are parallel</text><text x="36" y="1010" font-size="20">permissions; success, stopping and evidence serve different purposes.</text><text x="36" y="1044" font-size="20">Tools and the execution environment must enforce actual restrictions.</text></g></svg>
