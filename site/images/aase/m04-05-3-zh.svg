<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 828" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜保留基本欄位，讓進階設定按需出現</title><desc id="desc">前後兩卡保留相同功能。右卡用清楚入口取代參考圖的淡化區；下方清單說明展開後可用的設定，不是停用欄位。</desc><rect width="1040" height="828" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 3｜保留基本欄位，讓進階設定按需出現</text><rect x="36" y="88" width="458" height="548" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><rect x="46" y="98" width="438" height="50" rx="12" fill="#fce1e1" stroke="#d4dce1" stroke-width="1"/><text x="56" y="126" font-size="22" font-weight="700">調整前｜所有選項攤開</text><text x="56" y="190" font-size="20" font-weight="400">基本設定 Basic Settings</text><text x="56" y="236" font-size="20" font-weight="400">公司名稱 Company Name：Enter</text><text x="56" y="272" font-size="20" font-weight="400">company name</text><text x="56" y="318" font-size="20" font-weight="400">Email：Enter email</text><text x="56" y="364" font-size="20" font-weight="400">進階設定 Advanced Configuration</text><text x="56" y="410" font-size="20" font-weight="400">API Rate Limit：1000/hour</text><text x="56" y="456" font-size="20" font-weight="400">Webhook URL：https://…</text><text x="56" y="502" font-size="20" font-weight="400">Custom Headers：Authorization:</text><text x="56" y="538" font-size="20" font-weight="400">Bearer…</text><text x="56" y="584" font-size="20" font-weight="400">Security Options</text><rect x="546" y="88" width="458" height="594" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><rect x="556" y="98" width="438" height="50" rx="12" fill="#d9efe1" stroke="#d4dce1" stroke-width="1"/><text x="566" y="126" font-size="22" font-weight="700">調整後｜漸進揭露</text><text x="566" y="190" font-size="20" font-weight="400">基本設定 Basic Settings</text><text x="566" y="236" font-size="20" font-weight="400">公司名稱 Company Name：Enter</text><text x="566" y="272" font-size="20" font-weight="400">company name</text><text x="566" y="318" font-size="20" font-weight="400">Email：Enter email</text><text x="566" y="364" font-size="20" font-weight="400">進階設定 ▸</text><text x="566" y="410" font-size="20" font-weight="400">展開後可用：</text><text x="566" y="456" font-size="20" font-weight="400">API Rate Limit：1000/hour</text><text x="566" y="502" font-size="20" font-weight="400">Webhook URL：https://…</text><text x="566" y="548" font-size="20" font-weight="400">Custom Headers：Authorization:</text><text x="566" y="584" font-size="20" font-weight="400">Bearer…</text><text x="566" y="630" font-size="20" font-weight="400">Security Options</text><text x="36" y="726" font-size="20" font-weight="400">前後兩卡保留相同功能。右卡用清楚入口取代參考圖的淡化區；下方清單說明展開後可用的設定，不是停用</text><text x="36" y="762" font-size="20" font-weight="400">欄位。</text></g></svg>
