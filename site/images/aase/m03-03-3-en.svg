<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 3 · The first quotation input</title><desc id="desc">Synthetic example: these values illustrate which input produced a result; they are not a premium formula.</desc><rect width="1040" height="640" fill="#fbfdfb"/><g fill="#173329" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 3 · The first quotation input</text><text x="36" y="100" font-size="20" font-weight="400">Synthetic example: these values illustrate which input produced a</text><text x="36" y="136" font-size="20" font-weight="400">result; they are not a premium formula.</text><rect x="36" y="174" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="202" font-size="22" font-weight="650">Coverage</text><text x="60" y="246" font-size="20" font-weight="400">TWD 1,000,000 (100 ten-thousand TWD).</text><rect x="36" y="308" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="336" font-size="22" font-weight="650">Hypothetical premium</text><text x="60" y="380" font-size="20" font-weight="400">TWD 12,000 per year.</text><rect x="36" y="442" width="968" height="158" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="470" font-size="22" font-weight="650">Result produced</text><text x="60" y="514" font-size="20" font-weight="400">Corresponds to the original input. Editing coverage to TWD 3,000,</text><text x="60" y="550" font-size="20" font-weight="400">000 invalidates this result.</text></g></svg>
