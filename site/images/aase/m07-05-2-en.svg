<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1430" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Reliable preview and export flow</title><desc id="desc">Arrows indicate check order and conditional destinations. Edits return to validation; only unchanged data that still passes can advance to export.</desc><rect width="1060" height="1430" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 2 | Reliable preview and export flow</text><rect x="36" y="96" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">User enters data</text><text x="56" y="176" font-size="20" font-weight="400">Current Record</text><path d="M530 236v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="288" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="324" font-size="20" font-weight="700">Check and validate</text><text x="56" y="368" font-size="20" font-weight="400">Validation; correct failures and check again</text><path d="M530 428v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="480" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="516" font-size="20" font-weight="700">Pass and save snapshot</text><text x="56" y="560" font-size="20" font-weight="400">Checked Snapshot</text><path d="M530 620v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="672" width="478" height="168" rx="14" fill="#f7f2eb" stroke="#64748b"/><text x="56" y="708" font-size="20" font-weight="700">Data changed</text><text x="56" y="752" font-size="20" font-weight="400">Invalidate old snapshot → return</text><text x="56" y="788" font-size="20" font-weight="400">to Check and validate</text><rect x="546" y="672" width="478" height="168" rx="14" fill="#eef6f3" stroke="#64748b"/><text x="566" y="708" font-size="20" font-weight="700">Data unchanged</text><text x="566" y="752" font-size="20" font-weight="400">Rules pass: allow preview →</text><text x="566" y="788" font-size="20" font-weight="400">revalidate before export</text><text x="36" y="876" font-size="20" font-weight="400">Only the unchanged-data branch proceeds ↓</text><rect x="36" y="932" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="968" font-size="20" font-weight="700">Revalidate + select allowed fields</text><text x="56" y="1012" font-size="20" font-weight="400">Revalidation + Allowlist; on failure stop export and check again</text><path d="M530 1072v24m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="1124" width="988" height="132" rx="14" fill="#ffffff" stroke="#64748b"/><text x="56" y="1160" font-size="20" font-weight="700">Output JSON report</text><text x="56" y="1204" font-size="20" font-weight="400">Include the scope statement (Scope)</text><text x="36" y="1298" font-size="20" font-weight="400">Arrows indicate check order and conditional destinations. Edits</text><text x="36" y="1334" font-size="20" font-weight="400">return to validation; only unchanged data that still passes can</text><text x="36" y="1370" font-size="20" font-weight="400">advance to export.</text></g></svg>
