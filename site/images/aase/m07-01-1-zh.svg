<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 958" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜開餐廳與軟體開發的八組對照</title><desc id="desc">每組先列餐廳角色，再列對應軟體角色；寬版左右對照、窄版上下配對，沒有先後箭頭。準備、實作與驗收需分別證明。</desc><rect width="1060" height="958" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 1｜開餐廳與軟體開發的八組對照</text><text x="36" y="96" font-size="20" font-weight="700">餐廳 → 軟體開發（逐列比喻）</text><rect x="36" y="118" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="144" font-size="20" font-weight="700">店面位置</text><text x="442" y="144" font-size="20" font-weight="400">專案資料夾（Project Directory）</text><rect x="36" y="206" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="232" font-size="20" font-weight="700">廚房與爐具</text><text x="442" y="232" font-size="20" font-weight="400">執行環境（Runtime Environment）</text><rect x="36" y="294" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="320" font-size="20" font-weight="700">食材清單</text><text x="442" y="320" font-size="20" font-weight="400">依賴套件（Dependencies）</text><rect x="36" y="382" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="408" font-size="20" font-weight="700">獨立料理工作臺</text><text x="442" y="408" font-size="20" font-weight="400">虛擬環境（Virtual Environment）</text><rect x="36" y="470" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="496" font-size="20" font-weight="700">餐廳基本裝潢</text><text x="442" y="496" font-size="20" font-weight="400">專案骨架（Starter Project）</text><rect x="36" y="558" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="584" font-size="20" font-weight="700">廚師與料理機具</text><text x="442" y="584" font-size="20" font-weight="400">開發工具與 Coding Agent</text><rect x="36" y="646" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="672" font-size="20" font-weight="700">實際煮出牛肉麵</text><text x="442" y="672" font-size="20" font-weight="400">功能實作（Implementation）</text><rect x="36" y="734" width="988" height="76" rx="6" fill="#f1f4f6" stroke="#c5cfd5"/><text x="52" y="760" font-size="20" font-weight="700">試吃與衛生檢查</text><text x="442" y="760" font-size="20" font-weight="400">測試及驗收（Testing &amp; Acceptance）</text><text x="36" y="866" font-size="20" font-weight="400">每組先列餐廳角色，再列對應軟體角色；寬版左右對照、窄版上下配對，沒有先後箭頭。準備、實作</text><text x="36" y="902" font-size="20" font-weight="400">與驗收需分別證明。</text></g></svg>
