<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1408" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜HCI、UI、UX 與互動設計的交會</title><desc id="desc">參考 Figma 的概念示意。交疊表示關注點互相影響，不是嚴格的學術集合分類，也不表示三個先後階段。</desc><rect width="1040" height="1408" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 2｜HCI、UI、UX 與互動設計的交會</text><circle cx="378" cy="401" r="256" fill="#d9efe1"/><circle cx="662" cy="401" r="256" fill="#f9dfd9"/><circle cx="520" cy="576" r="256" fill="#e5dff5"/><path d="M350 62C279 110 245 183 245 220c0 58 47 108 105 130 58-22 105-72 105-130 0-37-34-110-105-158Z" transform="translate(47.5 104) scale(1.35)" fill="#fbfcfd" stroke="#65757c" stroke-dasharray="5 5"/><text x="110" y="324" font-size="22" font-weight="700">HCI｜人機互動</text><text x="740" y="324" font-size="22" font-weight="700">UI｜使用者介面</text><text x="400" y="714" font-size="22" font-weight="700">UX｜使用者經驗</text><text x="405" y="464" font-size="22" font-weight="700">IxD｜互動設計</text><text x="36" y="904" font-size="21" font-weight="700">HCI｜人機互動</text><text x="36" y="948" font-size="20" font-weight="400">人的認知、行為與互動能力</text><text x="36" y="1004" font-size="21" font-weight="700">UI｜使用者介面</text><text x="36" y="1048" font-size="20" font-weight="400">畫面、控制元件與回應</text><text x="36" y="1104" font-size="21" font-weight="700">UX｜使用者經驗</text><text x="36" y="1148" font-size="20" font-weight="400">整段服務的需求、結果與感受</text><text x="36" y="1204" font-size="21" font-weight="700">IxD｜互動設計</text><text x="36" y="1248" font-size="20" font-weight="400">設計互動行為與回饋，涉及三種觀點的交會</text><text x="36" y="1304" font-size="20" font-weight="400">參考 Figma 的概念示意。交疊表示關注點互相影響，不是嚴格的學術集合分類，也不表示三個先</text><text x="36" y="1340" font-size="20" font-weight="400">後階段。</text></g></svg>
