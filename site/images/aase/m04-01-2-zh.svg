<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 746" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜從 HCI、UI、UX 檢查收件系統</title><desc id="desc">三種觀點互相影響，並列呈現，不表示先後階段。</desc><rect width="1040" height="746" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 2｜從 HCI、UI、UX 檢查收件系統</text><path d="M12 4c-3-5-9 0-6 4-5 1-3 8 0 8 0 5 6 5 6 1V4Zm0 0c3-5 9 0 6 4 5 1 3 8 0 8 0 5-6 5-6 1M8 8v5m8-5v5" transform="translate(36 82)" fill="none" stroke="#18252c" stroke-width="1.6"/><text x="80" y="102" font-size="22" font-weight="700">HCI：研究為什麼會誤解</text><text x="80" y="150" font-size="20" font-weight="400">使用者心目中的「成功」是什麼意思？他是否知道欄位齊全和正式受理不同？</text><text x="80" y="192" font-size="20" font-weight="400">可以請他直接說明畫面意思，而不是由開發者自行猜測。</text><path d="M36 254H1004" stroke="#d5dce0"/><path d="m7 5 2 15 4-5 5-1L7 5Zm-3-3L2 0m10 3 1-3M3 10H0" transform="translate(36 276)" fill="none" stroke="#18252c" stroke-width="1.6"/><text x="80" y="296" font-size="22" font-weight="700">UI：修改畫面上呈現的資訊</text><text x="80" y="344" font-size="20" font-weight="400">不要只顯示「成功」，而要說明具體完成了什麼。</text><text x="80" y="386" font-size="20" font-weight="400">例如：「三個必要欄位已齊全，尚未正式送件。」</text><text x="80" y="428" font-size="20" font-weight="400">同時提供清楚的下一步操作。</text><path d="M36 490H1004" stroke="#d5dce0"/><path d="M2 2h7v7H2V2Zm13 13h7v7h-7v-7ZM5 9v9h10" transform="translate(36 512)" fill="none" stroke="#18252c" stroke-width="1.6"/><text x="80" y="532" font-size="22" font-weight="700">UX：確認整段工作是否順利</text><text x="80" y="580" font-size="20" font-weight="400">即使畫面讓人看懂了，承辦人匯出報告後，究竟應該交給誰？接手者能不能使用？</text><text x="80" y="622" font-size="20" font-weight="400">如果接手者還得重新輸入全部資料，整體工作流程仍然有問題。</text><text x="36" y="684" font-size="20" font-weight="400">三種觀點互相影響，並列呈現，不表示先後階段。</text></g></svg>
