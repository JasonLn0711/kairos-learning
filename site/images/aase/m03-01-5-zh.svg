<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 334" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜兩份文件的分工</title><desc id="desc">兩份文件並列比較用途；需求變動時保留原因，並檢查兩份文件是否仍一致。</desc><rect width="1040" height="334" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 5｜兩份文件的分工</text><rect x="36" y="70" width="476" height="158" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="56" y="98" font-size="22" font-weight="650">problem.md｜問題文件</text><text x="56" y="142" font-size="20" font-weight="400">為什麼需要做？誰遇到困難？目前如何工作</text><text x="56" y="178" font-size="20" font-weight="400">？想改善什麼？哪些假設還沒證實？</text><rect x="528" y="70" width="476" height="158" rx="8" fill="#ffffff" stroke="#c3cfd5"/><text x="548" y="98" font-size="22" font-weight="650">spec.md｜規格文件</text><text x="548" y="142" font-size="20" font-weight="400">系統具體要做什麼？有哪些欄位？如何檢查</text><text x="548" y="178" font-size="20" font-weight="400">？錯誤怎麼呈現？如何測試？</text><text x="36" y="274" font-size="20" font-weight="400">兩份文件並列比較用途；需求變動時保留原因，並檢查兩份文件是否仍一致。</text></g></svg>
