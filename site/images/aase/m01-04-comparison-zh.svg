<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 352" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜醫師看診與需求訪談</title><desc id="desc">共同原則：先診斷問題，再決定解法。 兩欄是平行類比；醫療欄只用來說明先了解問題的思路。</desc><rect width="1040" height="352" fill="#fbfcfc"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="42" font-size="24" font-weight="700">圖 1｜醫師看診與需求訪談</text><text x="36" y="94" font-size="22" font-weight="700">醫師看診</text><text x="36" y="140" font-size="20" font-weight="400">病人：「我要吃抗生素。」 醫師先了解症狀、</text><text x="36" y="174" font-size="20" font-weight="400">病史與檢查結果，再決定治療方式。</text><text x="546" y="94" font-size="22" font-weight="700">需求訪談</text><text x="546" y="140" font-size="20" font-weight="400">使用者：「我要一套 AI 系統。」 工程師先</text><text x="546" y="174" font-size="20" font-weight="400">了解工作流程與困難，再決定是否需要 AI。</text><path d="M36 238 H1004" stroke="#77868a"/><text x="36" y="290" font-size="20" font-weight="400">共同原則：先診斷問題，再決定解法。 兩欄是平行類比；醫療欄只用來說明先了解問題的思路。</text></g></svg>
