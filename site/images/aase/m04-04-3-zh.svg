<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1542" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜出貨資料檢查的狀態轉換</title><desc id="desc">每列是起點 → 終點，列下方是觸發事件或條件；各列不是依序執行。判斷節點的兩條出口互斥。重試只適用本例的資料檢查，交易須先確認實際狀態。</desc><rect width="1040" height="1542" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="30" y="42" font-size="24" font-weight="700">圖 3｜出貨資料檢查的狀態轉換</text><text x="30" y="86" font-size="20" font-weight="400">每列是起點 → 終點，列下方是觸發事件或條件；各列不是依序執行。判斷節點的兩條出口互斥。重試</text><text x="30" y="120" font-size="20" font-weight="400">只適用本例的資料檢查，交易須先確認實際狀態。</text><rect x="30" y="153" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="178" font-size="22" font-weight="700">輸入資料 → 資料是否完整？</text><text x="50" y="224" font-size="20" font-weight="400">按下檢查</text><rect x="30" y="277" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="302" font-size="22" font-weight="700">資料是否完整？ → 缺漏：指出要補哪欄</text><text x="50" y="348" font-size="20" font-weight="400">否</text><rect x="30" y="401" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="426" font-size="22" font-weight="700">缺漏：指出要補哪欄 → 輸入資料</text><text x="50" y="472" font-size="20" font-weight="400">補填並保留原值</text><rect x="30" y="525" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="550" font-size="22" font-weight="700">資料是否完整？ → 是否需要遠端處理？</text><text x="50" y="596" font-size="20" font-weight="400">是</text><rect x="30" y="649" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="674" font-size="22" font-weight="700">是否需要遠端處理？ → 檢查完成</text><text x="50" y="720" font-size="20" font-weight="400">否：本機檢查即完成</text><rect x="30" y="773" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="798" font-size="22" font-weight="700">是否需要遠端處理？ → 處理中</text><text x="50" y="844" font-size="20" font-weight="400">是</text><rect x="30" y="897" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="922" font-size="22" font-weight="700">處理中 → 檢查完成</text><text x="50" y="968" font-size="20" font-weight="400">成功</text><rect x="30" y="1021" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="1046" font-size="22" font-weight="700">處理中 → 技術失敗</text><text x="50" y="1092" font-size="20" font-weight="400">逾時或服務異常</text><rect x="30" y="1145" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="1170" font-size="22" font-weight="700">技術失敗 → 輸入資料</text><text x="50" y="1216" font-size="20" font-weight="400">重試</text><rect x="30" y="1269" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="1294" font-size="22" font-weight="700">檢查完成 → 輸入資料</text><text x="50" y="1340" font-size="20" font-weight="400">修改任一欄：舊檢查結果失效</text><rect x="30" y="1393" width="980" height="125" rx="12" fill="#edf9f1" stroke="#bddac9"/><text x="50" y="1418" font-size="22" font-weight="700">檢查完成 → 預覽／匯出</text><text x="50" y="1464" font-size="20" font-weight="400">資料未修改</text></g></svg>
