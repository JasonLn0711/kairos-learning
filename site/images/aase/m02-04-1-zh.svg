<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 742" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜儲存讀書計畫的固定分支</title><desc id="desc">箭頭表示程式依規則選擇的路徑；符合與不符合是兩個互斥結果，手機上下排列也不代表先後執行。</desc><rect width="1040" height="742" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 1｜儲存讀書計畫的固定分支</text><rect x="36" y="94" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="128" font-size="22">使用者按下「儲存」</text><text x="56" y="170" font-size="20">提交日期與科目數量。</text><path d="M520 226V254m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="268" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="302" font-size="22">程式檢查日期與科目數量</text><text x="56" y="344" font-size="20">根據預先設定的規則判斷。</text><path d="M520 400V418H266V444m-7-7 7 7 7-7M520 418H774V444m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="460" width="460" height="124" rx="10" fill="#edf5f0" stroke="#d4d8da"/><text x="56" y="494" font-size="22">符合規則</text><text x="56" y="536" font-size="20">儲存成功。</text><rect x="544" y="460" width="460" height="124" rx="10" fill="#fbf0ed" stroke="#d4d8da"/><text x="564" y="494" font-size="22">不符合規則</text><text x="564" y="536" font-size="20">拒絕儲存並提示修改。</text><text x="36" y="646" font-size="20">箭頭表示程式依規則選擇的路徑；符合與不符合是兩個互斥結果，手機上下排列也不代表先後執行</text><text x="36" y="680" font-size="20">。</text></g></svg>
