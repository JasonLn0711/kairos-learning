<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1810" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜完整性檢查：判斷與回復</title><desc id="desc">依每個判斷的明列出口走讀；回填保留資料，修改使舊結果失效。箭頭表示控制流程，不代表經過時間或業務核准。</desc><rect width="1040" height="1810" fill="#fbfdfb"/><g fill="#173329" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 2｜完整性檢查：判斷與回復</text><text x="36" y="100" font-size="20" font-weight="400">依每個判斷的明列出口走讀；回填保留資料，修改使舊結果失效。箭頭表示控制流程，不代表經過</text><text x="36" y="136" font-size="20" font-weight="400">時間或業務核准。</text><rect x="36" y="174" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="202" font-size="22" font-weight="650">開始</text><text x="60" y="246" font-size="20" font-weight="400">→ 輸入必要欄位。</text><rect x="36" y="308" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="336" font-size="22" font-weight="650">輸入必要欄位</text><text x="60" y="380" font-size="20" font-weight="400">申請編號、申請人代號、文件類型 → 是否取消？</text><rect x="36" y="442" width="968" height="122" rx="12" fill="#e3f2e9" stroke="#658f76" stroke-dasharray="6 4"/><text x="60" y="470" font-size="22" font-weight="650">是否取消？</text><text x="60" y="514" font-size="20" font-weight="400">是 → 結束：不產生報告。否 → 檢查目前輸入。</text><rect x="36" y="576" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="604" font-size="22" font-weight="650">檢查目前輸入</text><text x="60" y="648" font-size="20" font-weight="400">→ 欄位完整？</text><rect x="36" y="710" width="968" height="122" rx="12" fill="#e3f2e9" stroke="#658f76" stroke-dasharray="6 4"/><text x="60" y="738" font-size="22" font-weight="650">欄位完整？</text><text x="60" y="782" font-size="20" font-weight="400">否 → 提示缺漏並保留已填資料。是 → 預覽檢查結果。</text><rect x="36" y="844" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="872" font-size="22" font-weight="650">提示缺漏並保留已填資料</text><text x="60" y="916" font-size="20" font-weight="400">→ 輸入必要欄位，補齊後重新檢查。</text><rect x="36" y="978" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="1006" font-size="22" font-weight="650">預覽檢查結果</text><text x="60" y="1050" font-size="20" font-weight="400">→ 是否修改資料？</text><rect x="36" y="1112" width="968" height="122" rx="12" fill="#e3f2e9" stroke="#658f76" stroke-dasharray="6 4"/><text x="60" y="1140" font-size="22" font-weight="650">是否修改資料？</text><text x="60" y="1184" font-size="20" font-weight="400">是 → 使原檢查結果失效。否 → 是否確認匯出？</text><rect x="36" y="1246" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="1274" font-size="22" font-weight="650">使原檢查結果失效</text><text x="60" y="1318" font-size="20" font-weight="400">→ 輸入必要欄位，必須重新檢查。</text><rect x="36" y="1380" width="968" height="122" rx="12" fill="#e3f2e9" stroke="#658f76" stroke-dasharray="6 4"/><text x="60" y="1408" font-size="22" font-weight="650">是否確認匯出？</text><text x="60" y="1452" font-size="20" font-weight="400">是 → 匯出完整性報告 → 任務完成。否／取消 → 結束：不產生報告。</text><rect x="36" y="1514" width="968" height="122" rx="28" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="1542" font-size="22" font-weight="650">匯出完整性報告 → 任務完成</text><text x="60" y="1586" font-size="20" font-weight="400">報告對應目前已檢查輸入；不代表正式受理。</text><rect x="36" y="1648" width="968" height="122" rx="28" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="1676" font-size="22" font-weight="650">結束：不產生報告</text><text x="60" y="1720" font-size="20" font-weight="400">本次不產生新報告；草稿保留規則另行決定。</text></g></svg>
