<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1028" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5｜A change-decision framework</title><desc id="desc">Arrows indicate decision order. Yes and no are alternative branches; both return to the scope owner for confirmation.</desc><rect width="1040" height="1028" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 5｜A change-decision framework</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="104" font-size="22" font-weight="650">Receive a feature request</text><text x="60" y="148" font-size="20" font-weight="400">Clarify the requested capability</text><path d="M520 204v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="256" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="284" font-size="22" font-weight="650">Is it necessary to test the core question?</text><text x="60" y="328" font-size="20" font-weight="400">Assess it against the original question</text><path d="M274 384v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><path d="M766 384v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36.0" y="436" width="476.0" height="194" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60.0" y="464" font-size="22" font-weight="650">Yes: exchange scope or</text><text x="60.0" y="500" font-size="22" font-weight="650">adjust resources</text><text x="60.0" y="544" font-size="20" font-weight="400">Update specifications, tests,</text><text x="60.0" y="580" font-size="20" font-weight="400">schedule and responsibilities</text><rect x="528.0" y="436" width="476.0" height="194" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="552.0" y="464" font-size="22" font-weight="650">No: defer or exclude from</text><text x="552.0" y="500" font-size="22" font-weight="650">this version</text><text x="552.0" y="544" font-size="20" font-weight="400">Record the reason and</text><text x="552.0" y="580" font-size="20" font-weight="400">reconsideration conditions</text><path d="M274.0 636v28H520" fill="none" stroke="#526770" stroke-width="2"/><path d="M766.0 636v28H520" fill="none" stroke="#526770" stroke-width="2"/><path d="M520 664v26m-7-7 7 7 7-7" fill="none" stroke="#526770" stroke-width="2"/><rect x="36" y="688" width="968" height="158" rx="10" fill="#fbfcfd" stroke="#718188"/><text x="60" y="716" font-size="22" font-weight="650">The scope owner confirms the decision</text><text x="60" y="760" font-size="20" font-weight="400">Keep a change record so implementation, specifications and</text><text x="60" y="796" font-size="20" font-weight="400">acceptance agree</text><text x="36" y="932" font-size="20" font-weight="400">Arrows indicate decision order. Yes and no are alternative branches;</text><text x="36" y="968" font-size="20" font-weight="400">both return to the scope owner for confirmation.</text></g></svg>
