<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 810" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Fixed branches when saving a study plan</title><desc id="desc">Arrows show rule-controlled paths. Valid and invalid are mutually exclusive outcomes; stacking them on a phone does not make them sequential.</desc><rect width="1040" height="810" fill="#fbfcfc"/><g fill="#26353c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 1 | Fixed branches when saving a study plan</text><rect x="36" y="94" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="128" font-size="22">User selects Save</text><text x="56" y="170" font-size="20">Submit the date and subject count.</text><path d="M520 226V254m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="268" width="968" height="124" rx="10" fill="#fbfcfc" stroke="#d4d8da"/><text x="56" y="302" font-size="22">Program checks date and subject count</text><text x="56" y="344" font-size="20">Apply the predefined rules.</text><path d="M520 400V418H266V444m-7-7 7 7 7-7M520 418H774V444m-7-7 7 7 7-7" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="460" width="460" height="124" rx="10" fill="#edf5f0" stroke="#d4d8da"/><text x="56" y="494" font-size="22">Valid</text><text x="56" y="536" font-size="20">Save succeeds.</text><rect x="544" y="460" width="460" height="158" rx="10" fill="#fbf0ed" stroke="#d4d8da"/><text x="564" y="494" font-size="22">Invalid</text><text x="564" y="536" font-size="20">Reject the save and request a</text><text x="564" y="570" font-size="20">correction.</text><text x="36" y="680" font-size="20">Arrows show rule-controlled paths. Valid and invalid are mutually</text><text x="36" y="714" font-size="20">exclusive outcomes; stacking them on a phone does not make them</text><text x="36" y="748" font-size="20">sequential.</text></g></svg>
