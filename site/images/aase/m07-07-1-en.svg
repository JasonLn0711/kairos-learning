<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 694" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Six responsibilities in evidence-based repair</title><desc id="desc">Read responsibilities in order 01–06. Step 06 applies when recovery is needed; every repair does not require reverting changes.</desc><rect width="1060" height="694" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">Figure 1 | Six responsibilities in evidence-based repair</text><rect x="36" y="96" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">01  Reproduce the fault</text><text x="56" y="176" font-size="20" font-weight="400">Establish that the fault exists</text><rect x="546" y="96" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="566" y="132" font-size="20" font-weight="700">02  Locate the cause</text><text x="566" y="176" font-size="20" font-weight="400">Identify the failure layer</text><rect x="36" y="246" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="282" font-size="20" font-weight="700">03  Capture failure</text><text x="56" y="326" font-size="20" font-weight="400">Make a test detect the fault</text><rect x="546" y="246" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="566" y="282" font-size="20" font-weight="700">04  Minimal repair</text><text x="566" y="326" font-size="20" font-weight="400">Change only necessary logic</text><rect x="36" y="396" width="478" height="166" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="432" font-size="20" font-weight="700">05  Verify again</text><text x="56" y="476" font-size="20" font-weight="400">Check the repair and affected</text><text x="56" y="512" font-size="20" font-weight="400">features</text><rect x="546" y="396" width="478" height="166" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="566" y="432" font-size="20" font-weight="700">06  Recover safely</text><text x="566" y="476" font-size="20" font-weight="400">If needed, restore scoped</text><text x="566" y="512" font-size="20" font-weight="400">changes and retain evidence</text><text x="36" y="598" font-size="20" font-weight="400">Read responsibilities in order 01–06. Step 06 applies when recovery is</text><text x="36" y="634" font-size="20" font-weight="400">needed; every repair does not require reverting changes.</text></g></svg>
