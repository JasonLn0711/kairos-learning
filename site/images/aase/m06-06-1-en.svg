<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 442" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | TLS protects browser-to-server communication</title><desc id="desc">The bidirectional connection represents negotiation between endpoints, not business authorization. Four explanatory steps follow.</desc><rect width="1060" height="442" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 1 | TLS protects browser-to-server communication</text><rect x="36" y="96" width="448" height="166" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">Your browser</text><text x="56" y="176" font-size="20" font-weight="400">Verifies the certificate and</text><text x="56" y="212" font-size="20" font-weight="400">server domain identity</text><rect x="576" y="96" width="448" height="202" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="596" y="132" font-size="20" font-weight="700">Website server</text><text x="596" y="176" font-size="20" font-weight="400">Presents a certificate and</text><text x="596" y="212" font-size="20" font-weight="400">participates in key exchange</text><text x="596" y="248" font-size="20" font-weight="400">and protected communication</text><text x="510" y="156" font-size="28">↔</text><text x="36" y="346" font-size="20" font-weight="400">The bidirectional connection represents negotiation between endpoints,</text><text x="36" y="382" font-size="20" font-weight="400">not business authorization. Four explanatory steps follow.</text></g></svg>
