<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜原本的設計與候選修改</title><desc id="desc">兩個示意介面並列比較；按鈕是示意文字。候選修改仍須透過真人任務測試驗證。</desc><rect width="1040" height="620" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 4｜原本的設計與候選修改</text><rect x="36" y="104" width="460" height="368" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="136" font-size="20" font-weight="400">原本的設計</text><path d="M67 178a11 11 0 1 0 0 22a11 11 0 1 0 0-22m-6 11 4 4 7-9" fill="none" stroke="#087337" stroke-width="2"/><text x="92" y="200" font-size="22" font-weight="700">成功！</text><text x="56" y="252" font-size="20" font-weight="400">操作完成</text><rect x="52" y="280" width="428" height="72" rx="12" fill="#f0f1f2" stroke="#d5dce0"/><text x="66" y="304" font-size="20" font-weight="400">確定</text><text x="56" y="372" font-size="20" font-weight="400">不清楚是什麼成功，也不知道是否已正式送</text><text x="56" y="408" font-size="20" font-weight="400">件。</text><rect x="546" y="104" width="460" height="420" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="566" y="136" font-size="20" font-weight="400">候選修改</text><path d="M577 178a11 11 0 1 0 0 22a11 11 0 1 0 0-22m-6 11 4 4 7-9" fill="none" stroke="#087337" stroke-width="2"/><text x="602" y="200" font-size="22" font-weight="700">欄位檢查完成</text><text x="566" y="252" font-size="20" font-weight="400">3 個必要欄位已齊全。</text><text x="566" y="304" font-size="20" font-weight="400">尚未正式受理。</text><rect x="562" y="332" width="428" height="72" rx="12" fill="#f0f1f2" stroke="#d5dce0"/><text x="576" y="356" font-size="20" font-weight="400">匯出檢查報告</text><text x="566" y="424" font-size="20" font-weight="400">清楚說明已完成的事項及下一步，但仍須測</text><text x="566" y="460" font-size="20" font-weight="400">試。</text><text x="36" y="552" font-size="20" font-weight="400">兩個示意介面並列比較；按鈕是示意文字。候選修改仍須透過真人任務測試驗證。</text></g></svg>
