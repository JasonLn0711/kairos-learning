<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 468" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜一個可驗證的設計需求</title><desc id="desc">誰使用 → 做什麼 → 遇到什麼困難 → 要如何修改 → 怎麼驗證</desc><rect width="1040" height="468" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 4｜一個可驗證的設計需求</text><text x="36" y="102" font-size="20" font-weight="400">誰使用 → 做什麼 → 遇到什麼困難 → 要如何修改 → 怎麼驗證</text><path d="M36 156H1004" stroke="#d5dce0"/><text x="36" y="198" font-size="20" font-weight="400">使用者：第一次使用系統的承辦人</text><text x="36" y="248" font-size="20" font-weight="400">任務：找出缺少的文件類型並補正</text><text x="36" y="298" font-size="20" font-weight="400">問題：不知道哪個欄位缺漏</text><text x="36" y="348" font-size="20" font-weight="400">候選修改：在欄位旁顯示具體錯誤與修正指引</text><text x="36" y="398" font-size="20" font-weight="400">驗證方法：指定缺件情境，觀察使用者是否能自行修正</text></g></svg>
