<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | Four Roles in the Office</title><desc id="desc">The cards compare purposes. Stacking them on mobile does not imply an execution order.</desc><rect width="1040" height="700" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">Figure 1 | Four Roles in the Office</text><rect x="36.0" y="72" width="476.0" height="194" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="100" font-size="22">KV Cache | Computation</text><text x="52.0" y="144" font-size="20">Retain computed parts, like</text><text x="52.0" y="180" font-size="20">keeping intermediate results to</text><text x="52.0" y="216" font-size="20">avoid repeated calculation.</text><rect x="528.0" y="72" width="476.0" height="230" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="544.0" y="100" font-size="22">Compaction | Conversation</text><text x="544.0" y="144" font-size="20">Turn lengthy discussion into a</text><text x="544.0" y="180" font-size="20">handover summary, like reducing</text><text x="544.0" y="216" font-size="20">a three-hour meeting to one page</text><text x="544.0" y="252" font-size="20">of notes.</text><rect x="36.0" y="320" width="476.0" height="194" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="348" font-size="22">RAG | Retrieval</text><text x="52.0" y="392" font-size="20">Look up the actual rules, like</text><text x="52.0" y="428" font-size="20">finding the latest requirements</text><text x="52.0" y="464" font-size="20">document in the archive.</text><rect x="528.0" y="320" width="476.0" height="230" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="544.0" y="348" font-size="22">Memory | Persistent state</text><text x="544.0" y="392" font-size="20">Write important progress in a</text><text x="544.0" y="428" font-size="20">work log, like consulting</text><text x="544.0" y="464" font-size="20">yesterday’s handover when</text><text x="544.0" y="500" font-size="20">returning to work.</text><text x="36" y="604" font-size="20">The cards compare purposes. Stacking them on mobile does not imply an</text><text x="36" y="640" font-size="20">execution order.</text></g></svg>
