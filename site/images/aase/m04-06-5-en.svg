<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1096" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5 | Recovery with conditional branches</title><desc id="desc">Arrows indicate conceptual state transitions. The decision branches by condition: failure is not required before success. Changing input requires revalidation of old results.</desc><rect width="1060" height="1096" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">Figure 5 | Recovery with conditional branches</text><rect x="244" y="96" width="552" height="130" rx="14" fill="#e9edf4" stroke="#64748b"/><text x="264" y="132" font-size="20" font-weight="700">Input</text><text x="264" y="176" font-size="20" font-weight="400">The user fills required fields</text><path d="M520 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="244" y="278" width="552" height="130" rx="14" fill="#e9edf4" stroke="#64748b"/><text x="264" y="314" font-size="20" font-weight="700">Processing</text><text x="264" y="358" font-size="20" font-weight="400">Check, validate and calculate</text><path d="M520 416v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="244" y="460" width="552" height="166" rx="14" fill="#fff2cc" stroke="#64748b"/><text x="264" y="496" font-size="20" font-weight="700">Decision</text><text x="264" y="540" font-size="20" font-weight="400">Success, missing data or technical</text><text x="264" y="576" font-size="20" font-weight="400">failure</text><path d="M520 634v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><path d="M270 678v-16h500v16" fill="none" stroke="#59666e" stroke-width="2"/><rect x="28" y="678" width="484" height="238" rx="14" fill="#fce7e7" stroke="#64748b"/><text x="48" y="714" font-size="20" font-weight="700">Missing data or technical</text><text x="48" y="750" font-size="20" font-weight="700">failure → correct / retry</text><text x="48" y="794" font-size="20" font-weight="400">Keep data and provide an exit;</text><text x="48" y="830" font-size="20" font-weight="400">correction returns to input /</text><text x="48" y="866" font-size="20" font-weight="400">rechecking.</text><rect x="548" y="678" width="484" height="202" rx="14" fill="#e2f2e8" stroke="#64748b"/><text x="568" y="714" font-size="20" font-weight="700">Success → complete</text><text x="568" y="758" font-size="20" font-weight="400">Valid result and next action;</text><text x="568" y="794" font-size="20" font-weight="400">changing input invalidates the</text><text x="568" y="830" font-size="20" font-weight="400">old result.</text><text x="36" y="964" font-size="20" font-weight="400">Arrows indicate conceptual state transitions. The decision branches by</text><text x="36" y="1000" font-size="20" font-weight="400">condition: failure is not required before success. Changing input</text><text x="36" y="1036" font-size="20" font-weight="400">requires revalidation of old results.</text></g></svg>
