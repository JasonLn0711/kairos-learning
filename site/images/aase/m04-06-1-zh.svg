<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 464" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜無法繼續工作的失敗訊息</title><desc id="desc">反例：只有失敗與重填要求，沒有說明缺漏、保留狀態或下一步。靜態示範，非真實系統。</desc><rect width="1060" height="464" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 1｜無法繼續工作的失敗訊息</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">發生錯誤</text><text x="56" y="176" font-size="20" font-weight="400">系統處理失敗，請重新填寫所有資料。</text><rect x="36" y="244" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="280" font-size="20" font-weight="700">觀察問題</text><text x="56" y="324" font-size="20" font-weight="400">使用者不知道哪裡出錯，也不知道先前工作是否保留。</text><text x="36" y="404" font-size="20" font-weight="400">反例：只有失敗與重填要求，沒有說明缺漏、保留狀態或下一步。靜態示範，非真實系統。</text></g></svg>
