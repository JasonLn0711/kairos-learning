<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 958" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜模擬操作：觀察舊報告失效問題</title><desc id="desc">操作方式：先按「執行資料檢查」，接著清空「文件種類」。比較有 Bug 與已修復兩種模式：前者仍保留舊成功與下載，後者使結果失效。此為簡化的本機互動示意，並非真實銀行系統。</desc><rect width="1060" height="958" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 2｜模擬操作：觀察舊報告失效問題</text><rect x="36" y="96" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">選擇模擬模式</text><text x="56" y="176" font-size="20" font-weight="400">有 Bug｜已修復</text><rect x="36" y="246" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="282" font-size="20" font-weight="700">客戶名稱</text><text x="56" y="326" font-size="20" font-weight="400">甲公司</text><rect x="36" y="396" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="432" font-size="20" font-weight="700">統一編號</text><text x="56" y="476" font-size="20" font-weight="400">12345678</text><rect x="546" y="396" width="478" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="566" y="432" font-size="20" font-weight="700">文件種類</text><text x="566" y="476" font-size="20" font-weight="400">財務報表</text><rect x="36" y="546" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="582" font-size="20" font-weight="700">執行資料檢查</text><text x="56" y="626" font-size="20" font-weight="400">檢查通過後顯示合成報告下載</text><rect x="36" y="696" width="988" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="732" font-size="20" font-weight="700">檢查結果</text><text x="56" y="776" font-size="20" font-weight="400">尚無有效檢查結果，不能匯出報告。</text><text x="36" y="862" font-size="20" font-weight="400">操作方式：先按「執行資料檢查」，接著清空「文件種類」。比較有 Bug 與已修復兩種模式：前</text><text x="36" y="898" font-size="20" font-weight="400">者仍保留舊成功與下載，後者使結果失效。此為簡化的本機互動示意，並非真實銀行系統。</text></g></svg>
