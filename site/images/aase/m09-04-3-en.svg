<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1038" role="img" aria-labelledby="title desc"><title id="title">Figure 3 | Five layers of AASE responsibility</title><desc id="desc">The rows identify different engineering responsibilities, without success or causal arrows. Implementation technology may change; each replacement still requires checking commitments in the other layers.</desc><rect width="1060" height="1038" fill="#fbfcfc"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="48" y="40" font-size="20" font-weight="700">Figure 3 | Five layers of AASE responsibility</text><rect x="24" y="96" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="132" font-size="20" font-weight="700">Problem and requirements</text><text x="48" y="176" font-size="20" font-weight="400">What problem are we solving?</text><rect x="24" y="248" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="284" font-size="20" font-weight="700">Design and specification</text><text x="48" y="328" font-size="20" font-weight="400">How should it work?</text><rect x="24" y="400" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="436" font-size="20" font-weight="700">System implementation</text><text x="48" y="480" font-size="20" font-weight="400">Which technology implements it?</text><rect x="24" y="552" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="588" font-size="20" font-weight="700">Testing and acceptance</text><text x="48" y="632" font-size="20" font-weight="400">How do we establish that it works?</text><rect x="24" y="704" width="1012" height="134" rx="14" fill="#fbfcfc" stroke="#a6b8b4"/><text x="48" y="740" font-size="20" font-weight="700">Delivery and improvement</text><text x="48" y="784" font-size="20" font-weight="400">How can it keep operating reliably?</text><text x="48" y="874" font-size="20" font-weight="400">The rows identify different engineering responsibilities, without</text><text x="48" y="910" font-size="20" font-weight="400">success or causal arrows. Implementation technology may change;</text><text x="48" y="946" font-size="20" font-weight="400">each replacement still requires checking commitments in the other</text><text x="48" y="982" font-size="20" font-weight="400">layers.</text></g></svg>
