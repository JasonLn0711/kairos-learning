<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Function, task and guardrails</title><desc id="desc">These are parallel perspectives, not a sequence or a causal chain.</desc><rect width="1040" height="340" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 2 | Function, task and guardrails</text><rect x="36" y="76" width="312" height="158" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">Function</text><text x="60" y="148" font-size="20" font-weight="400">Does it work</text><text x="60" y="184" font-size="20" font-weight="400">correctly?</text><rect x="364" y="76" width="312" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="388" y="104" font-size="22" font-weight="650">Task</text><text x="388" y="148" font-size="20" font-weight="400">Does it help?</text><rect x="692" y="76" width="312" height="158" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="716" y="104" font-size="22" font-weight="650">Guardrail</text><text x="716" y="148" font-size="20" font-weight="400">Does it cause side</text><text x="716" y="184" font-size="20" font-weight="400">effects?</text><text x="36" y="280" font-size="20" font-weight="400">These are parallel perspectives, not a sequence or a causal chain.</text></g></svg>
