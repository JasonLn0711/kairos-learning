<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 334" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜TLS 建立瀏覽器與伺服器間的保護</title><desc id="desc">雙向連線符號表示兩端協商，不表示已完成業務授權。四步解說見下文。</desc><rect width="1060" height="334" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 1｜TLS 建立瀏覽器與伺服器間的保護</text><rect x="36" y="96" width="448" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">你的瀏覽器</text><text x="56" y="176" font-size="20" font-weight="400">驗證伺服器憑證與網域身分</text><rect x="576" y="96" width="448" height="130" rx="14" fill="#fbfcfd" stroke="#64748b"/><text x="596" y="132" font-size="20" font-weight="700">網站伺服器</text><text x="596" y="176" font-size="20" font-weight="400">提出憑證，參與金鑰交換與受保護通訊</text><text x="510" y="156" font-size="28">↔</text><text x="36" y="274" font-size="20" font-weight="400">雙向連線符號表示兩端協商，不表示已完成業務授權。四步解說見下文。</text></g></svg>
