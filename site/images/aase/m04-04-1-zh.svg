<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 868" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜從需求到正式產品的設計流程</title><desc id="desc">箭頭表示典型設計順序；可以回到前面修正，不代表每個專案都必須瀑布式執行。</desc><rect width="1040" height="868" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="30" y="42" font-size="24" font-weight="700">圖 1｜從需求到正式產品的設計流程</text><text x="30" y="86" font-size="20" font-weight="400">箭頭表示典型設計順序；可以回到前面修正，不代表每個專案都必須瀑布式執行。</text><rect x="30" y="119" width="980" height="125" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="144" font-size="22" font-weight="700">需求與使用情境</text><text x="50" y="190" font-size="20" font-weight="400">誰要解決什麼問題？</text><path d="M520 250v26m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="30" y="269" width="980" height="125" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="294" font-size="22" font-weight="700">User Flow（使用者流程）</text><text x="50" y="340" font-size="20" font-weight="400">使用者需要經過哪些步驟？</text><path d="M520 400v26m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="30" y="419" width="980" height="125" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="444" font-size="22" font-weight="700">Wireframe（線框稿）</text><text x="50" y="490" font-size="20" font-weight="400">每個畫面放什麼？按下去會怎樣？</text><path d="M520 550v26m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="30" y="569" width="980" height="125" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="594" font-size="22" font-weight="700">Prototype（可操作原型）</text><text x="50" y="640" font-size="20" font-weight="400">讓使用者試操作，驗證互動方式</text><path d="M520 700v26m-7-7 7 7 7-7" fill="none" stroke="#65757c" stroke-width="2"/><rect x="30" y="719" width="980" height="125" rx="12" fill="#fbfcfd" stroke="#bddac9"/><text x="50" y="744" font-size="22" font-weight="700">實作、測試與交付</text><text x="50" y="790" font-size="20" font-weight="400">完成真正的業務邏輯、安全與品質驗證</text></g></svg>
