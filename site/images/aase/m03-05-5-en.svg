<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 904" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 5 | The stale check-result problem</title><desc id="desc">Design risk: the final proposed rule addresses this risk; acceptance evidence is still pending.</desc><rect width="1040" height="904" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">Figure 5 | The stale check-result problem</text><rect x="36" y="76" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">1. Check data A</text><text x="60" y="148" font-size="20" font-weight="400">The user enters data A, runs the check and receives a pass.</text><rect x="36" y="208" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="236" font-size="22" font-weight="650">2. Edit to data B</text><text x="60" y="280" font-size="20" font-weight="400">The user edits the input, producing data B.</text><rect x="36" y="340" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="368" font-size="22" font-weight="650">3. Retain the old status</text><text x="60" y="412" font-size="20" font-weight="400">The system keeps the “check passed” status for data A.</text><rect x="36" y="472" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="500" font-size="22" font-weight="650">4. Export without rechecking</text><text x="60" y="544" font-size="20" font-weight="400">The user exports a report for data B without a new check.</text><rect x="36" y="604" width="968" height="158" rx="10" fill="#fff2ea" stroke="#b15840"/><text x="60" y="632" font-size="22" font-weight="650">Rule to add</text><text x="60" y="676" font-size="20" font-weight="400">Whenever input affecting the check changes, invalidate the old pass</text><text x="60" y="712" font-size="20" font-weight="400">status. Require a new check before complete-report export.</text><text x="36" y="808" font-size="20" font-weight="400">Design risk: the final proposed rule addresses this risk; acceptance</text><text x="36" y="844" font-size="20" font-weight="400">evidence is still pending.</text></g></svg>
