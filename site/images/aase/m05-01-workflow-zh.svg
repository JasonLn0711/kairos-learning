<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 838" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜從問題到驗證，再回到適當階段</title><desc id="desc">↻ 發現問題時，回到適當階段修訂、重新實作與測試。箭頭表示閱讀順序；這是方便初學者理解的流程圖，實際工程並非只能依序進行。開發、規格澄清與測試可以反覆進行。</desc><rect width="1040" height="838" fill="#fbfcfc"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="42" font-size="24" font-weight="700">圖 1｜從問題到驗證，再回到適當階段</text><text text-anchor="middle" x="520" y="94" font-size="22" font-weight="700">Problem：問題陳述</text><text text-anchor="middle" x="520" y="136" font-size="20" font-weight="400">我們到底要解決什麼問題？</text><path d="M520 180 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text text-anchor="middle" x="520" y="226" font-size="22" font-weight="700">Spec：系統規格</text><text text-anchor="middle" x="520" y="268" font-size="20" font-weight="400">系統應該做到什麼？什麼不能做？</text><path d="M520 312 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text text-anchor="middle" x="520" y="358" font-size="22" font-weight="700">Prompt：工作交辦</text><text text-anchor="middle" x="520" y="400" font-size="20" font-weight="400">這次交給 AI 做哪一部分？有哪些權限和限制？</text><path d="M520 444 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><text text-anchor="middle" x="520" y="490" font-size="22" font-weight="700">Implementation：實作</text><text text-anchor="middle" x="520" y="532" font-size="20" font-weight="400">AI 或工程師實際撰寫、修改程式</text><path d="M520 576 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#59666c" stroke-width="2"/><rect x="36" y="594" width="968" height="110" rx="6" fill="#fbfcfd" stroke="#64748b"/><text text-anchor="middle" x="520" y="622" font-size="22" font-weight="700">Verification：驗證</text><text text-anchor="middle" x="520" y="664" font-size="20" font-weight="400">用規格與測試證據確認結果是否合格</text><text x="36" y="742" font-size="20" font-weight="400">↻ 發現問題時，回到適當階段修訂、重新實作與測試。箭頭表示閱讀順序；這是方便初學者理解的流程圖</text><text x="36" y="776" font-size="20" font-weight="400">，實際工程並非只能依序進行。開發、規格澄清與測試可以反覆進行。</text></g></svg>
