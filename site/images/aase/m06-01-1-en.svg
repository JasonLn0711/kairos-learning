<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 440" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 1 | User Flow: how a customer completes a meal</title><desc id="desc">Arrows show the action order in this simplified example. Internal system responsibilities belong to the next diagram.</desc><rect width="1320" height="440" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="42" font-size="20" font-weight="700">Figure 1 | User Flow: how a customer completes a meal</text><rect x="32" y="102" width="224" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="50" y="138" font-size="20" font-weight="700">Take a seat</text><text x="50" y="178" font-size="20" font-weight="400">The customer</text><text x="50" y="212" font-size="20" font-weight="400">finds a seat.</text><path d="M258 164 L282 164" fill="none" stroke="#61736b" stroke-width="2"/><path d="M272 170L282 164L272 158" fill="none" stroke="#61736b" stroke-width="2"/><rect x="290" y="102" width="224" height="194" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="308" y="138" font-size="20" font-weight="700">Order</text><text x="308" y="178" font-size="20" font-weight="400">Choose and</text><text x="308" y="212" font-size="20" font-weight="400">submit dishes</text><text x="308" y="246" font-size="20" font-weight="400">.</text><path d="M516 164 L540 164" fill="none" stroke="#61736b" stroke-width="2"/><path d="M530 170L540 164L530 158" fill="none" stroke="#61736b" stroke-width="2"/><rect x="548" y="102" width="224" height="194" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="566" y="138" font-size="20" font-weight="700">Wait</text><text x="566" y="178" font-size="20" font-weight="400">Wait for the</text><text x="566" y="212" font-size="20" font-weight="400">meal to</text><text x="566" y="246" font-size="20" font-weight="400">arrive.</text><path d="M774 164 L798 164" fill="none" stroke="#61736b" stroke-width="2"/><path d="M788 170L798 164L788 158" fill="none" stroke="#61736b" stroke-width="2"/><rect x="806" y="102" width="224" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="824" y="138" font-size="20" font-weight="700">Eat</text><text x="824" y="178" font-size="20" font-weight="400">Enjoy the</text><text x="824" y="212" font-size="20" font-weight="400">meal.</text><path d="M1032 164 L1056 164" fill="none" stroke="#61736b" stroke-width="2"/><path d="M1046 170L1056 164L1046 158" fill="none" stroke="#61736b" stroke-width="2"/><rect x="1064" y="102" width="224" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="1082" y="138" font-size="20" font-weight="700">Pay</text><text x="1082" y="178" font-size="20" font-weight="400">Complete</text><text x="1082" y="212" font-size="20" font-weight="400">payment.</text><text x="32" y="346" font-size="20" font-weight="400">Arrows show the action order in this simplified example. Internal system responsibilities</text><text x="32" y="380" font-size="20" font-weight="400">belong to the next diagram.</text></g></svg>
