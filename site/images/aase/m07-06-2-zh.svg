<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 726" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜Git 三個位置與操作</title><desc id="desc">箭頭表示簡化操作：git add 將選定內容寫入暫存區；git commit 以暫存內容建立提交。HEAD 通常參照目前分支最新提交，不是儲存區。</desc><rect width="1060" height="726" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 2｜Git 三個位置與操作</text><rect x="36" y="96" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="132" font-size="20" font-weight="700">Working Tree（工作區）</text><text x="56" y="174" font-size="20" font-weight="400">目前正在編輯的實際檔案，如桌上草稿。下一步：git add，選擇放入下一版的內容。</text><path d="M530 232V264m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="282" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="318" font-size="20" font-weight="700">Staging Area / Index（暫存區）</text><text x="56" y="360" font-size="20" font-weight="400">已挑選、準備提交的內容，如整理好的送件版本。下一步：git commit，建立版本紀錄。</text><path d="M530 418V450m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="468" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="504" font-size="20" font-weight="700">Repository 與 HEAD</text><text x="56" y="546" font-size="20" font-weight="400">Repository 保存提交歷史；HEAD 通常指向目前分支最新提交，如正式保存的報告版本。</text><text x="36" y="630" font-size="20" font-weight="400">箭頭表示簡化操作：git add 將選定內容寫入暫存區；git commit 以暫存內容建立提交。</text><text x="36" y="666" font-size="20" font-weight="400">HEAD 通常參照目前分支最新提交，不是儲存區。</text></g></svg>
