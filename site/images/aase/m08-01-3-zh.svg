<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 906" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜AI 協作的驗收流程</title><desc id="desc">箭頭表示工作與證據的承接順序；最後仍須依實際證據決定驗收、修正或保留待驗。圖示本身不是驗收結果。</desc><rect width="1060" height="906" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="42" font-size="20" font-weight="700">圖 3｜AI 協作的驗收流程</text><rect x="36" y="94" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="130" font-size="20" font-weight="700">人類定義需求與驗收標準</text><text x="56" y="174" font-size="20" font-weight="400">把完成條件寫入規格。</text><path d="M530 236v24m-7-7 7 7 7-7" fill="none" stroke="#53636d" stroke-width="2"/><rect x="36" y="278" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">AI Agent 實作程式與測試</text><text x="56" y="358" font-size="20" font-weight="400">依規格實作，涵蓋既有功能、異常與邊界。</text><path d="M530 420v24m-7-7 7 7 7-7" fill="none" stroke="#53636d" stroke-width="2"/><rect x="36" y="462" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="498" font-size="20" font-weight="700">工具與真人蒐集驗證證據</text><text x="56" y="542" font-size="20" font-weight="400">保留版本、環境、輸入、預期與實際結果。</text><path d="M530 604v24m-7-7 7 7 7-7" fill="none" stroke="#53636d" stroke-width="2"/><rect x="36" y="646" width="988" height="132" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="682" font-size="20" font-weight="700">依據證據決定是否驗收、修正或保留待驗</text><text x="56" y="726" font-size="20" font-weight="400">僅在證據支持的範圍作完成主張。</text><text x="36" y="810" font-size="20" font-weight="400">箭頭表示工作與證據的承接順序；最後仍須依實際證據決定驗收、修正或保留待驗。圖示本身不是驗</text><text x="36" y="846" font-size="20" font-weight="400">收結果。</text></g></svg>
