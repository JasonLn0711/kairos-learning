<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1158" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜收件檢核系統的 Context 示意</title><desc id="desc">箭頭分別表示輸入要求與結果回饋；虛線範圍框只表示本次描述的系統，不代表安全隔離。沒有外部運行時系統。</desc><rect width="1040" height="1158" fill="#fff"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="40" y="44" font-size="24" font-weight="700">圖 4｜收件檢核系統的 Context 示意</text><text x="40" y="98" font-size="20" font-weight="700">系統範圍外</text><rect x="40" y="144" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="176" font-size="22" font-weight="700">收件人員</text><text x="58" y="216" font-size="20" font-weight="400">人／角色 · 輸入合成資料、查看結果、取得報告。</text><text x="40" y="302" font-size="20" font-weight="700">系統範圍內：</text><text x="40" y="348" font-size="20" font-weight="400">本次描述的系統範圍</text><rect x="28" y="386" width="984" height="140" rx="14" fill="none" stroke="#3074aa" stroke-width="2" stroke-dasharray="8 5"/><rect x="40" y="394" width="960" height="118" rx="12" fill="#fbfcfd" stroke="#3074aa" stroke-width="2"/><text x="58" y="426" font-size="22" font-weight="700">收件完整性檢核系統</text><text x="58" y="466" font-size="20" font-weight="400">軟體系統 · 檢查欄位、提示缺漏、匯出報告。</text><text x="40" y="552" font-size="22" font-weight="700">有方向的關係</text><text x="64" y="630" font-size="20" font-weight="700">收件人員</text><path d="M78 668v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="724" font-size="20" font-weight="700">收件完整性檢核系統</text><text x="64" y="766" font-size="20" font-weight="400">輸入合成資料，要求檢查或匯出。</text><path d="M40 816H1000" stroke="#cbd5e1"/><text x="64" y="856" font-size="20" font-weight="700">收件完整性檢核系統</text><path d="M78 894v24m-7-7 7 7 7-7" fill="none" stroke="#526674" stroke-width="2"/><text x="64" y="950" font-size="20" font-weight="700">收件人員</text><text x="64" y="992" font-size="20" font-weight="400">缺漏回饋與完整性報告</text><path d="M40 1042H1000" stroke="#cbd5e1"/><text x="40" y="1066" font-size="20" font-weight="400">箭頭分別表示輸入要求與結果回饋；虛線範圍框只表示本次描述的系統，不代表安全隔離。沒有外部</text><text x="40" y="1100" font-size="20" font-weight="400">運行時系統。</text></g></svg>
