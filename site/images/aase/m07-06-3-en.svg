sed</text><rect x="36" y="444" width="316" height="92" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="486" font-size="20" font-weight="400">Export correct</text><rect x="372" y="444" width="316" height="164" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="392" y="486" font-size="20" font-weight="400">Export tests pass</text><text x="392" y="522" font-size="20" font-weight="400">and downloaded</text><text x="392" y="558" font-size="20" font-weight="400">content is checked</text><rect x="708" y="444" width="316" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="728" y="486" font-size="20" font-weight="400">More direct</text><text x="728" y="522" font-size="20" font-weight="400">supporting evidence</text><text x="36" y="636" font-size="20" font-weight="400">Each row compares a claim, evidence and supported judgment.</text></g></svg>
