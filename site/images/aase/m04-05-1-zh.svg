<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 704" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜列印：基本與進階兩層</title><desc id="desc">兩張卡比較收合與展開；功能仍在，需要時可找到。列印是示意操作。</desc><rect width="1040" height="704" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 1｜列印：基本與進階兩層</text><rect x="36" y="88" width="458" height="368" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="56" y="126" font-size="22" font-weight="700">一般列印畫面</text><text x="56" y="170" font-size="20" font-weight="400">印表機：Office Printer</text><text x="56" y="216" font-size="20" font-weight="400">份數：1</text><text x="56" y="262" font-size="20" font-weight="400">紙張：A4</text><text x="56" y="308" font-size="20" font-weight="400">進階設定 ▸</text><rect x="50" y="329" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="62" y="354" font-size="20" font-weight="400">列印</text><text x="56" y="404" font-size="20" font-weight="400">使用者一眼就能找到主要操作。</text><rect x="546" y="88" width="458" height="506" rx="12" fill="#ffffff" stroke="#d4dce1" stroke-width="1"/><text x="566" y="126" font-size="22" font-weight="700">展開進階設定後</text><text x="566" y="170" font-size="20" font-weight="400">印表機：Office Printer</text><text x="566" y="216" font-size="20" font-weight="400">份數：1</text><text x="566" y="262" font-size="20" font-weight="400">紙張：A4</text><text x="566" y="308" font-size="20" font-weight="400">進階設定 ▾</text><text x="566" y="354" font-size="20" font-weight="400">雙面列印：關閉</text><text x="566" y="400" font-size="20" font-weight="400">縮放比例：100%</text><text x="566" y="446" font-size="20" font-weight="400">反向列印：關閉</text><rect x="560" y="467" width="430" height="61" rx="12" fill="#f0f1f2" stroke="#d4dce1" stroke-width="1"/><text x="572" y="492" font-size="20" font-weight="400">列印</text><text x="566" y="542" font-size="20" font-weight="400">需要特殊功能時仍然找得到。</text><text x="36" y="638" font-size="20" font-weight="400">兩張卡比較收合與展開；功能仍在，需要時可找到。列印是示意操作。</text></g></svg>
