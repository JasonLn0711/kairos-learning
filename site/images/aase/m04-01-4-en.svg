<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 728" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4 | Original design and candidate change</title><desc id="desc">Two illustrative interfaces for comparison; the buttons are illustrative text. The candidate still requires human task testing.</desc><rect width="1040" height="728" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 4 | Original design and candidate change</text><rect x="36" y="104" width="460" height="404" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="56" y="136" font-size="20" font-weight="400">Original design</text><path d="M67 178a11 11 0 1 0 0 22a11 11 0 1 0 0-22m-6 11 4 4 7-9" fill="none" stroke="#087337" stroke-width="2"/><text x="92" y="200" font-size="22" font-weight="700">Success!</text><text x="56" y="252" font-size="20" font-weight="400">Operation completed</text><rect x="52" y="280" width="428" height="72" rx="12" fill="#f0f1f2" stroke="#d5dce0"/><text x="66" y="304" font-size="20" font-weight="400">OK</text><text x="56" y="372" font-size="20" font-weight="400">It is unclear what succeeded</text><text x="56" y="408" font-size="20" font-weight="400">or whether the application was</text><text x="56" y="444" font-size="20" font-weight="400">formally submitted.</text><rect x="546" y="104" width="460" height="492" rx="12" fill="#fbfcfd" stroke="#d5dce0"/><text x="566" y="136" font-size="20" font-weight="400">Candidate change</text><path d="M577 178a11 11 0 1 0 0 22a11 11 0 1 0 0-22m-6 11 4 4 7-9" fill="none" stroke="#087337" stroke-width="2"/><text x="602" y="200" font-size="22" font-weight="700">Field check completed</text><text x="566" y="252" font-size="20" font-weight="400">3 required fields are complete</text><text x="566" y="288" font-size="20" font-weight="400">.</text><text x="566" y="340" font-size="20" font-weight="400">Not officially accepted yet.</text><rect x="562" y="368" width="428" height="72" rx="12" fill="#f0f1f2" stroke="#d5dce0"/><text x="576" y="392" font-size="20" font-weight="400">Export check report</text><text x="566" y="460" font-size="20" font-weight="400">It explains what has completed</text><text x="566" y="496" font-size="20" font-weight="400">and the next action, but still</text><text x="566" y="532" font-size="20" font-weight="400">needs testing.</text><text x="36" y="624" font-size="20" font-weight="400">Two illustrative interfaces for comparison; the buttons are</text><text x="36" y="660" font-size="20" font-weight="400">illustrative text. The candidate still requires human task testing.</text></g></svg>
