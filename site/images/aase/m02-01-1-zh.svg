<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1150" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜文字如何變成回答</title><desc id="desc">箭頭表示簡化的處理順序。最後的回答可能對，也可能錯；這個流程本身不保證已按照業務規則完成驗證。</desc><rect width="1040" height="1150" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 1｜文字如何變成回答</text><rect x="36.0" y="70" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="98" font-size="22">你輸入文字</text><text x="56.0" y="142" font-size="20">「請檢查申請資料」</text><path d="M512 201v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="233" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="261" font-size="22">① Tokenizer：切成 Token</text><text x="56.0" y="305" font-size="20">把文字分成模型能處理的單位，再轉為編號。</text><path d="M512 364v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="396" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="424" font-size="22">② 轉成向量，加上位置資訊</text><text x="56.0" y="468" font-size="20">讓文字成為可運算的數字表示。</text><path d="M512 527v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="559" width="952.0" height="120" rx="10" fill="#edf8f5" stroke="#79aaa0"/><text x="56.0" y="587" font-size="22">③ Transformer 運算</text><text x="56.0" y="631" font-size="20">Attention 與其他神經網路層反覆處理資訊。</text><path d="M512 690v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="722" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="750" font-size="22">④ 預測下一個 Token</text><text x="56.0" y="794" font-size="20">算出各種可能輸出的機率，依生成策略選擇。</text><path d="M512 853v24m-7-7 7 7 7-7" fill="none" stroke="#5a7186" stroke-width="2"/><rect x="36.0" y="885" width="952.0" height="120" rx="10" fill="#edf4ff" stroke="#9bb9dd"/><text x="56.0" y="913" font-size="22">⑤ 形成回答</text><text x="56.0" y="957" font-size="20">「這份資料缺少文件類型。」</text><text x="36" y="1058" font-size="20">箭頭表示簡化的處理順序。最後的回答可能對，也可能錯；這個流程本身不保證已按照業務規則完</text><text x="36" y="1092" font-size="20">成驗證。</text></g></svg>
