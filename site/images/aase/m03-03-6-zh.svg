<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 984" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 6｜從流程分析走向實作</title><desc id="desc">As-Is → To-Be → User Flow 分向 UI/UX 與需求／測試兩項平行工作，再共同支持實作、驗證與改善；箭頭表示依賴，不強制瀑布式時程。</desc><rect width="1040" height="984" fill="#fbfdfb"/><g fill="#173329" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 6｜從流程分析走向實作</text><text x="36" y="100" font-size="20" font-weight="400">As-Is → To-Be → User Flow 分向 UI/UX 與需求／測試兩項平行工作，再共同支持實作</text><text x="36" y="136" font-size="20" font-weight="400">、驗證與改善；箭頭表示依賴，不強制瀑布式時程。</text><rect x="36" y="174" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="202" font-size="22" font-weight="650">As-Is</text><text x="60" y="246" font-size="20" font-weight="400">理解目前問題與限制。</text><path d="M520 308v26m-7-7 7 7 7-7" fill="none" stroke="#557764" stroke-width="2"/><rect x="36" y="336" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="364" font-size="22" font-weight="650">To-Be</text><text x="60" y="408" font-size="20" font-weight="400">設計更好的工作方式。</text><path d="M520 470v26m-7-7 7 7 7-7" fill="none" stroke="#557764" stroke-width="2"/><rect x="36" y="498" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="526" font-size="22" font-weight="650">User Flow</text><text x="60" y="570" font-size="20" font-weight="400">定義操作、判斷與例外路徑。</text><path d="M520 632v12H274v16m-7-7 7 7 7-7M520 644H766v16m-7-7 7 7 7-7" fill="none" stroke="#557764" stroke-width="2"/><rect x="36" y="660" width="476" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="688" font-size="22" font-weight="650">UI / UX</text><text x="60" y="732" font-size="20" font-weight="400">M04：設計易用介面。</text><rect x="528" y="660" width="476" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="552" y="688" font-size="22" font-weight="650">需求規格與測試</text><text x="552" y="732" font-size="20" font-weight="400">M05 / M08：定義可驗收行為。</text><path d="M274 794v12H766v-12M520 806v16m-7-7 7 7 7-7" fill="none" stroke="#557764" stroke-width="2"/><rect x="36" y="822" width="968" height="122" rx="12" fill="#f0f8f3" stroke="#658f76"/><text x="60" y="850" font-size="22" font-weight="650">實作、驗證與改善</text><text x="60" y="894" font-size="20" font-weight="400">架構設計、AI Coding、測試與迭代。</text></g></svg>
