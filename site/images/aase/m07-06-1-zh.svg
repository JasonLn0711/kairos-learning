<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 590" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜三項依據一起支持人的審查</title><desc id="desc">規格、Diff、證據是平行核對材料；共同供負責人決定接受／要求修正／延後。下方箭頭表示彙整，不表示三者有先後順序。</desc><rect width="1060" height="590" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 1｜三項依據一起支持人的審查</text><rect x="36" y="96" width="316" height="164" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="132" font-size="20" font-weight="700">規格</text><text x="56" y="174" font-size="20" font-weight="400">應該做什麼：需求、驗收條</text><text x="56" y="210" font-size="20" font-weight="400">件與不做清單</text><rect x="372" y="96" width="316" height="164" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="392" y="132" font-size="20" font-weight="700">Diff</text><text x="392" y="174" font-size="20" font-weight="400">實際改了什麼：檔案、設定</text><text x="392" y="210" font-size="20" font-weight="400">與行為</text><rect x="708" y="96" width="316" height="164" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="728" y="132" font-size="20" font-weight="700">證據</text><text x="728" y="174" font-size="20" font-weight="400">是否有效：相關測試、操作</text><text x="728" y="210" font-size="20" font-weight="400">與限制</text><path d="M530 270V306m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="326" width="988" height="128" rx="12" fill="#f1f4f5" stroke="#7b8c96"/><text x="56" y="362" font-size="20" font-weight="700">人的審查與決策</text><text x="56" y="404" font-size="20" font-weight="400">接受／要求修正／延後</text><text x="36" y="494" font-size="20" font-weight="400">規格、Diff、證據是平行核對材料；共同供負責人決定接受／要求修正／延後。下方箭頭表示彙整</text><text x="36" y="530" font-size="20" font-weight="400">，不表示三者有先後順序。</text></g></svg>
