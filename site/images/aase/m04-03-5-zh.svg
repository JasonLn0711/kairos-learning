<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 488" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜版型改變，閱讀順序保持一致</title><desc id="desc">桌面把 2／3 並排，手機改成上下排列；兩者都依 1→2→3→4 閱讀。數字表示有意義的資訊順序，不是四次實際提交。</desc><rect width="1040" height="488" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 5｜版型改變，閱讀順序保持一致</text><text x="56" y="98" font-size="22" font-weight="700">桌面版</text><rect x="50" y="120" width="440" height="70" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="62" y="144" font-size="20" font-weight="400">1. 任務與注意事項</text><rect x="50" y="178" width="212" height="70" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="62" y="202" font-size="20" font-weight="400">2. 輸入資料</text><rect x="270" y="178" width="212" height="70" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="282" y="202" font-size="20" font-weight="400">3. 輸入說明</text><rect x="50" y="236" width="440" height="70" rx="12" fill="#e3ecfb" stroke="#bccbd0"/><text x="62" y="260" font-size="20" font-weight="400">4. 檢查與結果</text><text x="556" y="98" font-size="22" font-weight="700">手機版</text><rect x="550" y="120" width="440" height="70" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="562" y="144" font-size="20" font-weight="400">1. 任務與注意事項</text><rect x="550" y="178" width="440" height="70" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="562" y="202" font-size="20" font-weight="400">2. 輸入資料</text><rect x="550" y="236" width="440" height="70" rx="12" fill="#edf0f2" stroke="#bccbd0"/><text x="562" y="260" font-size="20" font-weight="400">3. 輸入說明</text><rect x="550" y="294" width="440" height="70" rx="12" fill="#e3ecfb" stroke="#bccbd0"/><text x="562" y="318" font-size="20" font-weight="400">4. 檢查與結果</text><text x="36" y="400" font-size="20" font-weight="400">桌面把 2／3 並排，手機改成上下排列；兩者都依 1→2→3→4 閱讀。數字表示有意義的資訊順序</text><text x="36" y="434" font-size="20" font-weight="400">，不是四次實際提交。</text></g></svg>
