<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 712" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 2 | Check three outcome levels separately</title><desc id="desc">These rows are separate checks; passing one does not guarantee the others.</desc><rect width="1040" height="712" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">Figure 2 | Check three outcome levels separately</text><circle cx="48" cy="96" r="10" fill="none" stroke="#65757c"/><text x="80" y="104" font-size="20" font-weight="700">Level 1: Communication result</text><text x="80" y="144" font-size="20" font-weight="400">Did the request arrive and receive the expected response? What was</text><text x="80" y="180" font-size="20" font-weight="400">its HTTP status?</text><path d="M36 236H1004" stroke="#d5dce0"/><circle cx="48" cy="276" r="10" fill="none" stroke="#65757c"/><text x="80" y="284" font-size="20" font-weight="700">Level 2: Business result</text><text x="80" y="324" font-size="20" font-weight="400">Does the content meet the rules: complete data, enough stock and</text><text x="80" y="360" font-size="20" font-weight="400">acceptance conditions?</text><path d="M36 416H1004" stroke="#d5dce0"/><circle cx="48" cy="456" r="10" fill="none" stroke="#65757c"/><text x="80" y="464" font-size="20" font-weight="700">Level 3: User task completion</text><text x="80" y="504" font-size="20" font-weight="400">Was the order accepted, can the correct report be downloaded, or</text><text x="80" y="540" font-size="20" font-weight="400">did the user obtain the required outcome?</text><text x="36" y="616" font-size="20" font-weight="400">These rows are separate checks; passing one does not guarantee the</text><text x="36" y="652" font-size="20" font-weight="400">others.</text></g></svg>
