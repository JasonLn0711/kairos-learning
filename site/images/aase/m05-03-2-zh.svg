<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 858" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜四個平行的驗收情境</title><desc id="desc">A–D 各自驗證不同條件，沒有先後順序；D 內部的資料變更使舊檢核結果失效。</desc><rect width="1040" height="858" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 2｜四個平行的驗收情境</text><text x="36" y="98" font-size="22" font-weight="650">情境 A：完整資料</text><text x="36" y="142" font-size="20" font-weight="400">三個欄位都有有效內容，使用者按下檢查。系統應通過完整性檢核，允許預覽與匯出同一筆資料</text><text x="36" y="178" font-size="20" font-weight="400">的報告。</text><path d="M36 238H1004" stroke="#c3cfd5"/><text x="36" y="282" font-size="22" font-weight="650">情境 B：缺少必要欄位</text><text x="36" y="326" font-size="20" font-weight="400">文件類型沒有填寫。系統必須指出缺漏，禁止匯出標記為完整的報告，同時保留使用者已填的資</text><text x="36" y="362" font-size="20" font-weight="400">料。</text><path d="M36 422H1004" stroke="#c3cfd5"/><text x="36" y="466" font-size="22" font-weight="650">情境 C：輸入只有空白字元</text><text x="36" y="510" font-size="20" font-weight="400">申請人代號輸入了三個空格。雖然文字欄位不一定是空字串，但清除前後空白後沒有有效內容，</text><text x="36" y="546" font-size="20" font-weight="400">仍應視為缺漏。</text><path d="M36 606H1004" stroke="#c3cfd5"/><text x="36" y="650" font-size="22" font-weight="650">情境 D：先前通過，但資料後來改變</text><text x="36" y="694" font-size="20" font-weight="400">使用者先通過檢查，之後卻刪除了文件類型。原本通過的結果應立即失效，不得直接使用舊的成</text><text x="36" y="730" font-size="20" font-weight="400">功狀態匯出。</text><text x="36" y="798" font-size="20" font-weight="400">A–D 各自驗證不同條件，沒有先後順序；D 內部的資料變更使舊檢核結果失效。</text></g></svg>
