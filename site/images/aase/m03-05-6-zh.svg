<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1184" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 6｜整合案例：一家製造公司導入 AI 品質檢測系統</title><desc id="desc">上述數字全部是假設資料，沒有提供實驗安排、樣本代表性或計時範圍。</desc><rect width="1040" height="1184" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="650">圖 6｜整合案例：一家製造公司導入 AI 品質檢測系統</text><rect x="36" y="76" width="968" height="210" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="104" font-size="22" font-weight="650">公司提出三個主張</text><text x="60" y="148" font-size="20" font-weight="400">「AI 已經成功上線。」</text><text x="60" y="192" font-size="20" font-weight="400">「瑕疵檢測效果很好。」</text><text x="60" y="236" font-size="20" font-weight="400">「工廠整體生產效率提高 30%。」</text><rect x="36" y="296" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="324" font-size="22" font-weight="650">真正有瑕疵的產品</text><text x="60" y="368" font-size="20" font-weight="400">20 件</text><rect x="36" y="428" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="456" font-size="22" font-weight="650">成功阻擋瑕疵品</text><text x="60" y="500" font-size="20" font-weight="400">18 件</text><rect x="36" y="560" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="588" font-size="22" font-weight="650">真正正常的產品</text><text x="60" y="632" font-size="20" font-weight="400">80 件</text><rect x="36" y="692" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="720" font-size="22" font-weight="650">被錯誤阻擋的良品</text><text x="60" y="764" font-size="20" font-weight="400">12 件</text><rect x="36" y="824" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="852" font-size="22" font-weight="650">人工舊流程</text><text x="60" y="896" font-size="20" font-weight="400">平均 10 分鐘</text><rect x="36" y="956" width="968" height="122" rx="10" fill="#fbfcfd" stroke="#d5dce0"/><text x="60" y="984" font-size="22" font-weight="650">AI 新流程</text><text x="60" y="1028" font-size="20" font-weight="400">平均 7 分鐘</text><text x="36" y="1124" font-size="20" font-weight="400">上述數字全部是假設資料，沒有提供實驗安排、樣本代表性或計時範圍。</text></g></svg>
