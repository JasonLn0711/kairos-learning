<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1108" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜收件資料檢核的 User Flow</title><desc id="desc">填寫→檢查→完整性判斷。否：顯示缺漏→補填或修正→回到檢查；是：預覽→下載 JSON。這是操作條件與回復流程，不是軟體架構。修改輸入會使舊結果失效，匯出前再驗證。</desc><rect width="1320" height="1108" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="42" font-size="20" font-weight="700">圖 3｜收件資料檢核的 User Flow</text><rect x="410" y="102" width="500" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="428" y="138" font-size="20" font-weight="700">填寫收件資料</text><text x="428" y="178" font-size="20" font-weight="400">輸入三個必要教學欄位。</text><path d="M660 233 L660 271" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 261L660 271L666 261" fill="none" stroke="#61736b" stroke-width="2"/><rect x="410" y="282" width="500" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="428" y="318" font-size="20" font-weight="700">按下檢查</text><text x="428" y="358" font-size="20" font-weight="400">檢查目前輸入。</text><path d="M660 413 L660 451" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 441L660 451L666 441" fill="none" stroke="#61736b" stroke-width="2"/><rect x="410" y="462" width="500" height="126" rx="16" fill="#eefaf3" stroke="#85998e"/><text x="428" y="498" font-size="20" font-weight="700">資料完整嗎？</text><text x="428" y="538" font-size="20" font-weight="400">依教學完整性規則分成是／否。</text><path d="M660 594 L660 620 L320 620 L320 652" fill="none" stroke="#61736b" stroke-width="2"/><path d="M314 642L320 652L326 642" fill="none" stroke="#61736b" stroke-width="2"/><path d="M660 620 L1000 620 L1000 652" fill="none" stroke="#61736b" stroke-width="2"/><path d="M994 642L1000 652L1006 642" fill="none" stroke="#61736b" stroke-width="2"/><rect x="80" y="658" width="480" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="98" y="694" font-size="20" font-weight="700">否：顯示缺漏欄位</text><text x="98" y="734" font-size="20" font-weight="400">指出需要補填或修正的地方。</text><rect x="760" y="658" width="480" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="778" y="694" font-size="20" font-weight="700">是：預覽結果</text><text x="778" y="734" font-size="20" font-weight="400">檢視目前輸入對應的檢查結果。</text><path d="M320 789 L320 830" fill="none" stroke="#61736b" stroke-width="2"/><path d="M314 820L320 830L326 820" fill="none" stroke="#61736b" stroke-width="2"/><path d="M1000 789 L1000 830" fill="none" stroke="#61736b" stroke-width="2"/><path d="M994 820L1000 830L1006 820" fill="none" stroke="#61736b" stroke-width="2"/><rect x="80" y="838" width="480" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="98" y="874" font-size="20" font-weight="700">補填或修正</text><text x="98" y="914" font-size="20" font-weight="400">→ 回到「按下檢查」，使用更新的輸入。</text><rect x="760" y="838" width="480" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="778" y="874" font-size="20" font-weight="700">下載 JSON 報告</text><text x="778" y="914" font-size="20" font-weight="400">下載前再驗證；完整不代表正式受理。</text><path d="M78 883 L28 883 L28 397 L402 397" fill="none" stroke="#61736b" stroke-width="2"/><path d="M392 403L402 397L392 391" fill="none" stroke="#61736b" stroke-width="2"/><text x="32" y="1014" font-size="20" font-weight="400">填寫→檢查→完整性判斷。否：顯示缺漏→補填或修正→回到檢查；是：預覽→下載 JSON。這是操作條件與回復流程，不是軟體架</text><text x="32" y="1048" font-size="20" font-weight="400">構。修改輸入會使舊結果失效，匯出前再驗證。</text></g></svg>
