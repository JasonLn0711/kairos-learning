<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1402" role="img" aria-labelledby="title desc" lang="en"><title id="title">Figure 4 | Streamlit processes and data locations</title><desc id="desc">User → browser; browser ↔ Python/Streamlit process uses Streamlit communication (WebSocket). rules.py and Session State are inside the same Python process. Bidirectional symbols mean calls/results or reads/writes, not independent services. JSON downloads to the user device. Host grouping does not establish a security trust boundary.</desc><rect width="1320" height="1402" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="32" y="42" font-size="20" font-weight="700">Figure 4 | Streamlit processes and data locations</text><rect x="410" y="102" width="500" height="126" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="428" y="138" font-size="20" font-weight="700">User</text><text x="428" y="178" font-size="20" font-weight="400">Operates the browser.</text><path d="M660 232 L660 272" fill="none" stroke="#61736b" stroke-width="2"/><path d="M654 262L660 272L666 262" fill="none" stroke="#61736b" stroke-width="2"/><rect x="410" y="282" width="500" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="428" y="318" font-size="20" font-weight="700">Browser: user interface</text><text x="428" y="358" font-size="20" font-weight="400">Input and result display; ↔</text><text x="428" y="392" font-size="20" font-weight="400">Python/Streamlit process.</text><rect x="32" y="532" width="850" height="658" rx="8" fill="#f3f5f4" stroke="#81958a"/><text x="48" y="564" font-size="20" font-weight="700">Streamlit host</text><rect x="56" y="596" width="802" height="570" rx="8" fill="#f7fbf8" stroke="#81958a"/><text x="72" y="628" font-size="20" font-weight="700">One Python process</text><rect x="204" y="656" width="500" height="160" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="222" y="692" font-size="20" font-weight="700">Python/Streamlit process</text><text x="222" y="732" font-size="20" font-weight="400">Run validation and generate</text><text x="222" y="766" font-size="20" font-weight="400">reports.</text><rect x="80" y="880" width="360" height="194" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="98" y="916" font-size="20" font-weight="700">rules.py: validation</text><text x="98" y="950" font-size="20" font-weight="700">rules</text><text x="98" y="990" font-size="20" font-weight="400">Direct in-process calls</text><text x="98" y="1024" font-size="20" font-weight="400">and returned results.</text><rect x="474" y="880" width="360" height="262" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="492" y="916" font-size="20" font-weight="700">Session State: session</text><text x="492" y="950" font-size="20" font-weight="700">memory</text><text x="492" y="990" font-size="20" font-weight="400">Input and checked</text><text x="492" y="1024" font-size="20" font-weight="400">snapshots held inside</text><text x="492" y="1058" font-size="20" font-weight="400">the process; read/write</text><text x="492" y="1092" font-size="20" font-weight="400">.</text><path d="M454 821 L454 844 L260 844 L260 873" fill="none" stroke="#61736b" stroke-width="2"/><path d="M254 863L260 873L266 863" fill="none" stroke="#61736b" stroke-width="2"/><path d="M274 874 L274 858 L468 858 L468 822" fill="none" stroke="#61736b" stroke-width="2"/><path d="M474 832L468 822L462 832" fill="none" stroke="#61736b" stroke-width="2"/><path d="M454 821 L454 844 L654 844 L654 873" fill="none" stroke="#61736b" stroke-width="2"/><path d="M648 863L654 873L660 863" fill="none" stroke="#61736b" stroke-width="2"/><path d="M668 874 L668 858 L468 858 L468 822" fill="none" stroke="#61736b" stroke-width="2"/><path d="M474 832L468 822L462 832" fill="none" stroke="#61736b" stroke-width="2"/><rect x="930" y="656" width="358" height="228" rx="16" fill="#ddf3e7" stroke="#85998e"/><text x="948" y="692" font-size="20" font-weight="700">JSON file on the user</text><text x="948" y="726" font-size="20" font-weight="700">device</text><text x="948" y="766" font-size="20" font-weight="400">Browser → download;</text><text x="948" y="800" font-size="20" font-weight="400">managed separately from</text><text x="948" y="834" font-size="20" font-weight="400">server memory.</text><path d="M660 448 L660 478 L454 478 L454 648" fill="none" stroke="#61736b" stroke-width="2"/><path d="M448 638L454 648L460 638" fill="none" stroke="#61736b" stroke-width="2"/><path d="M440 648 L440 492 L646 492 L646 448" fill="none" stroke="#61736b" stroke-width="2"/><path d="M652 458L646 448L640 458" fill="none" stroke="#61736b" stroke-width="2"/><path d="M660 478 L1109 478 L1109 648" fill="none" stroke="#61736b" stroke-width="2"/><path d="M1103 638L1109 648L1115 638" fill="none" stroke="#61736b" stroke-width="2"/><text x="32" y="1240" font-size="20" font-weight="400">User → browser; browser ↔ Python/Streamlit process uses Streamlit communication (WebSocket).</text><text x="32" y="1274" font-size="20" font-weight="400">rules.py and Session State are inside the same Python process. Bidirectional symbols mean</text><text x="32" y="1308" font-size="20" font-weight="400">calls/results or reads/writes, not independent services. JSON downloads to the user device.</text><text x="32" y="1342" font-size="20" font-weight="400">Host grouping does not establish a security trust boundary.</text></g></svg>
