<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 526" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜三種證據分別回答不同問題</title><desc id="desc">三層各需自己的測試與觀察；功能通過，不能直接推論人能使用或工作已改善。圖中上下位置用來比較證據，不表示成效已發生。</desc><rect width="1040" height="526" fill="#fbfcfc"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="42" font-size="24" font-weight="700">圖 3｜三種證據分別回答不同問題</text><text x="64" y="94" font-size="22" font-weight="700">系統正確</text><text x="64" y="136" font-size="20" font-weight="400">功能是否按規則運作？</text><text x="64" y="202" font-size="22" font-weight="700">人能使用</text><text x="64" y="244" font-size="20" font-weight="400">使用者是否能理解、操作並完成任務？</text><text x="64" y="310" font-size="22" font-weight="700">工作改善</text><text x="64" y="352" font-size="20" font-weight="400">錯誤、等待或工作成本是否實際下降？</text><text x="36" y="430" font-size="20" font-weight="400">三層各需自己的測試與觀察；功能通過，不能直接推論人能使用或工作已改善。圖中上下位置用來比較證據</text><text x="36" y="464" font-size="20" font-weight="400">，不表示成效已發生。</text></g></svg>
