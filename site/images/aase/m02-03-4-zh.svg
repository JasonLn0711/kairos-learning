<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 648" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜先找文件，再依據文件回答</title><desc id="desc">箭頭表示提問、檢索與生成的資料使用順序；引用仍須核對版本與例外。</desc><rect width="1040" height="648" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24">圖 4｜先找文件，再依據文件回答</text><rect x="36.0" y="72" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="100" font-size="22">使用者提問</text><text x="52.0" y="144" font-size="20">「週末最多安排幾科？」</text><path d="M520 208v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="242" width="968.0" height="122" rx="10" fill="#ffffff" stroke="#c3cfd5"/><text x="52.0" y="270" font-size="22">搜尋有權限讀取的文件</text><text x="52.0" y="314" font-size="20">需求文件 v3｜現行版本。第 4.2 節：平日最多兩科，週末最多三科。</text><path d="M520 378v26m-7-7 7 7 7-7" fill="none" stroke="#637982" stroke-width="2"/><rect x="36.0" y="412" width="968.0" height="122" rx="10" fill="#e8f4ef" stroke="#90c7b9"/><text x="52.0" y="440" font-size="22">根據文件產生答案</text><text x="52.0" y="484" font-size="20">週末最多安排三科。依據：需求文件 v3，第 4.2 節。</text><text x="36" y="588" font-size="20">箭頭表示提問、檢索與生成的資料使用順序；引用仍須核對版本與例外。</text></g></svg>
