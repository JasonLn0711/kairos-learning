<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 632" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜資料完整性檢查：狀態與主要動作</title><desc id="desc">四列對照可能的狀態及動作，不是保證依序發生的四步。完整性檢查通過不代表正式審核或核准。</desc><rect width="1040" height="632" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700">圖 4｜資料完整性檢查：狀態與主要動作</text><rect x="36" y="74" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="98" font-size="22" font-weight="700">尚未檢查</text><text x="56" y="138" font-size="20" font-weight="400">使用者需要確認輸入內容，主要動作是「檢查資料」。</text><rect x="36" y="194" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="218" font-size="22" font-weight="700">檢查中</text><text x="56" y="258" font-size="20" font-weight="400">顯示檢查進度，避免重複提交，並說明目前正在處理。</text><rect x="36" y="314" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="338" font-size="22" font-weight="700">發現缺件</text><text x="56" y="378" font-size="20" font-weight="400">明確指出缺少什麼，主要動作改為「補填資料並重新檢查」。</text><rect x="36" y="434" width="968" height="108" rx="12" fill="#fbfcfd" stroke="#bccbd0"/><text x="56" y="458" font-size="22" font-weight="700">完整性檢查通過</text><text x="56" y="498" font-size="20" font-weight="400">顯示當次檢查結果，必要時才提供「預覽」與「匯出報告」。</text><text x="36" y="578" font-size="20" font-weight="400">四列對照可能的狀態及動作，不是保證依序發生的四步。完整性檢查通過不代表正式審核或核准。</text></g></svg>
