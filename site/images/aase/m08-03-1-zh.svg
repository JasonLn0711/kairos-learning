<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 868" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜從規格到測試結果</title><desc id="desc">向下箭頭表示設計與執行順序；PASS／FAIL 是同次比對的互斥結果。</desc><rect width="1060" height="868" fill="#fbfcfd"/><g font-family="Arial, Noto Sans CJK TC, sans-serif" fill="#18252c"><text x="36" y="40" font-size="20" font-weight="700">圖 1｜從規格到測試結果</text><rect x="36" y="96" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="132" font-size="20" font-weight="700">1. 業務規格（Spec）</text><text x="56" y="176" font-size="20" font-weight="400">先決定什麼結果才算正確</text><path d="M530 234v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="278" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="314" font-size="20" font-weight="700">2. 測試情境（Test Cases）</text><text x="56" y="358" font-size="20" font-weight="400">正常、無效、邊界、例外</text><path d="M530 416v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="460" width="988" height="130" rx="12" fill="#ffffff" stroke="#64748b"/><text x="56" y="496" font-size="20" font-weight="700">3. pytest 執行測試</text><text x="56" y="540" font-size="20" font-weight="400">準備輸入 → 呼叫程式 → 比對預期結果</text><path d="M530 598v25m-7-7 7 7 7-7" fill="none" stroke="#59666e" stroke-width="2"/><rect x="36" y="642" width="480" height="130" rx="12" fill="#f0f8f3" stroke="#64748b"/><text x="56" y="678" font-size="20" font-weight="700">✓ PASS</text><text x="56" y="722" font-size="20" font-weight="400">符合本次檢查條件</text><rect x="544" y="642" width="480" height="130" rx="12" fill="#fff5f5" stroke="#64748b"/><text x="564" y="678" font-size="20" font-weight="700">✗ FAIL</text><text x="564" y="722" font-size="20" font-weight="400">結果不符合預期，需調查原因</text><text x="36" y="808" font-size="20" font-weight="400">向下箭頭表示設計與執行順序；PASS／FAIL 是同次比對的互斥結果。</text></g></svg>
