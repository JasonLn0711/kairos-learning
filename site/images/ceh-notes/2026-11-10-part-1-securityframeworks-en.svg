<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 514" role="img" aria-labelledby="title desc" lang="en"><title id="title">OWASP and MITRE ATT&amp;CK: complementary perspectives</title><desc id="desc">These are parallel perspectives. NIST SP 800-115 adds assessment planning, execution, evidence and reporting. An ATT&amp;CK identifier does not authorize a test.</desc><rect width="900" height="514" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">OWASP and MITRE ATT&amp;CK: complementary perspectives</text><rect x="28.0" y="88" width="388.0" height="242" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">OWASP</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Starts with application</text><text x="222.0" y="190" font-size="18" font-weight="400" text-anchor="middle">weaknesses and security</text><text x="222.0" y="222" font-size="18" font-weight="400" text-anchor="middle">controls</text><text x="222.0" y="254" font-size="18" font-weight="400" text-anchor="middle">What should be tested,</text><text x="222.0" y="286" font-size="18" font-weight="400" text-anchor="middle">verified and improved?</text><rect x="456.0" y="88" width="388.0" height="242" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">MITRE ATT&amp;CK</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Starts with observed adversary</text><text x="650.0" y="190" font-size="18" font-weight="400" text-anchor="middle">behavior</text><text x="650.0" y="222" font-size="18" font-weight="400" text-anchor="middle">How do attackers act, and can</text><text x="650.0" y="254" font-size="18" font-weight="400" text-anchor="middle">defenses detect them?</text><text x="28" y="400" font-size="17" font-weight="400" text-anchor="start">These are parallel perspectives. NIST SP 800-115 adds assessment</text><text x="28" y="432" font-size="17" font-weight="400" text-anchor="start">planning, execution, evidence and reporting. An ATT&amp;CK identifier</text><text x="28" y="464" font-size="17" font-weight="400" text-anchor="start">does not authorize a test.</text></g></svg>
