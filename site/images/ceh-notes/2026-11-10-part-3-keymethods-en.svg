<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 796" role="img" aria-labelledby="title desc" lang="en"><title id="title">Two ways to establish shared keys</title><desc id="desc">Read each column downward; the columns are parallel comparisons. Authentication, secure schemes and a KDF remain necessary; RSA transport here does not imply static RSA exchange in TLS 1.3.</desc><rect width="900" height="796" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Two ways to establish shared keys</text><rect x="28" y="88" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="120" font-size="20" font-weight="700" text-anchor="middle">RSA-based key transport</text><text x="229.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Alice generates secret key K</text><path d="M229 214v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="270" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="302" font-size="20" font-weight="700" text-anchor="middle">Protect using a public key</text><text x="229.0" y="340" font-size="18" font-weight="400" text-anchor="middle">Protect K with Bob’s public key</text><path d="M229 396v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="452" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="484" font-size="20" font-weight="700" text-anchor="middle">Recover using a private key</text><text x="229.0" y="522" font-size="18" font-weight="400" text-anchor="middle">Bob obtains K with his private</text><text x="229.0" y="554" font-size="18" font-weight="400" text-anchor="middle">key</text><rect x="458" y="88" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Diffie–Hellman key agreement</text><text x="659.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Alice and Bob each choose secret</text><text x="659.0" y="190" font-size="18" font-weight="400" text-anchor="middle">values</text><path d="M659 246v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="458" y="302" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="334" font-size="20" font-weight="700" text-anchor="middle">Exchange</text><text x="659.0" y="372" font-size="18" font-weight="400" text-anchor="middle">Exchange computed public values</text><path d="M659 428v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="458" y="484" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="516" font-size="20" font-weight="700" text-anchor="middle">Derive</text><text x="659.0" y="554" font-size="18" font-weight="400" text-anchor="middle">Independently derive the shared</text><text x="659.0" y="586" font-size="18" font-weight="400" text-anchor="middle">secret</text><text x="28" y="682" font-size="17" font-weight="400" text-anchor="start">Read each column downward; the columns are parallel comparisons.</text><text x="28" y="714" font-size="17" font-weight="400" text-anchor="start">Authentication, secure schemes and a KDF remain necessary; RSA</text><text x="28" y="746" font-size="17" font-weight="400" text-anchor="start">transport here does not imply static RSA exchange in TLS 1.3.</text></g></svg>
