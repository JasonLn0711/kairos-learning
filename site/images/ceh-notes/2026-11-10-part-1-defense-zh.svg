<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1056" role="img" aria-labelledby="title desc" lang="zh"><title id="title">五層縱深防禦</title><desc id="desc">以機密資料系統為例。箭頭表示逐層閱讀，不表示所有攻擊都必須依序通過五層；各層共同處理不同失敗情況。</desc><rect width="900" height="1056" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">五層縱深防禦</text><text x="42" y="114" font-size="20" font-weight="700" text-anchor="start">第 1 層｜Physical</text><text x="42" y="154" font-size="18" font-weight="400" text-anchor="start">保全、門禁與機房管制</text><path d="M450 198v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="296" font-size="20" font-weight="700" text-anchor="start">第 2 層｜Identity</text><text x="42" y="336" font-size="18" font-weight="400" text-anchor="start">身分驗證、MFA 與權限限制</text><path d="M450 380v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="478" font-size="20" font-weight="700" text-anchor="start">第 3 層｜Network</text><text x="42" y="518" font-size="18" font-weight="400" text-anchor="start">防火牆與網路區隔</text><path d="M450 562v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="660" font-size="20" font-weight="700" text-anchor="start">第 4 層｜Data</text><text x="42" y="700" font-size="18" font-weight="400" text-anchor="start">加密、資料存取控制</text><path d="M450 744v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="842" font-size="20" font-weight="700" text-anchor="start">第 5 層｜Detection &amp; Recovery</text><text x="42" y="882" font-size="18" font-weight="400" text-anchor="start">監控、備份、復原與事件應變</text><text x="28" y="968" font-size="17" font-weight="400" text-anchor="start">以機密資料系統為例。箭頭表示逐層閱讀，不表示所有攻擊都必須依序通過五層；各層共同處</text><text x="28" y="1000" font-size="17" font-weight="400" text-anchor="start">理不同失敗情況。</text></g></svg>
