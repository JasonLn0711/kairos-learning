<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" role="img" aria-labelledby="title desc" lang="zh"><title id="title">SSD 邏輯覆寫與 FTL 重新映射</title><desc id="desc">舊 Page A 與新 Page B 是重新映射後並存的狀態，不是 A 再寫入 B 的時間步驟。 實際行為取決於 SSD 控制器、韌體和儲存技術，不代表每次覆寫都會產生完全相同的結果。</desc><rect width="900" height="790" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H222.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H650.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">SSD 邏輯覆寫與 FTL 重新映射</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">作業系統</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">要求覆寫邏輯區塊 LBA 100。</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">SSD 控制器／FTL</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">將邏輯位址映射至實體快閃記憶體。</text><rect x="28.0" y="492" width="388.0" height="146" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="222.0" y="524" font-size="20" font-weight="700" text-anchor="middle">舊 Page A</text><text x="222.0" y="562" font-size="18" font-weight="400" text-anchor="middle">原本的實體儲存頁面：舊資料可能尚未被實</text><text x="222.0" y="594" font-size="18" font-weight="400" text-anchor="middle">體抹除。</text><rect x="456.0" y="492" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="524" font-size="20" font-weight="700" text-anchor="middle">新 Page B</text><text x="650.0" y="562" font-size="18" font-weight="400" text-anchor="middle">新的實體儲存頁面：新資料寫入完成。</text><text x="28" y="708" font-size="17" font-weight="400" text-anchor="start">舊 Page A 與新 Page B 是重新映射後並存的狀態，不是 A 再寫入 B 的時間步驟。 實際</text><text x="28" y="740" font-size="17" font-weight="400" text-anchor="start">行為取決於 SSD 控制器、韌體和儲存技術，不代表每次覆寫都會產生完全相同的結果。</text></g></svg>
