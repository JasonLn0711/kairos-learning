<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 854" role="img" aria-labelledby="title desc" lang="en"><title id="title">SSD logical overwrite and FTL remapping</title><desc id="desc">Old Page A and new Page B are concurrent remapping outcomes, not an A-to-B sequence. Actual behavior depends on the controller, firmware and storage technology; not every overwrite produces the same result.</desc><rect width="900" height="854" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H222.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H650.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">SSD logical overwrite and FTL remapping</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Operating system</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Requests an overwrite of logical block LBA 100.</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">SSD controller / FTL</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Maps logical addresses to physical flash memory.</text><rect x="28.0" y="492" width="388.0" height="178" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="222.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Old Page A</text><text x="222.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Original physical storage page</text><text x="222.0" y="594" font-size="18" font-weight="400" text-anchor="middle">: old data may not yet have</text><text x="222.0" y="626" font-size="18" font-weight="400" text-anchor="middle">been physically erased.</text><rect x="456.0" y="492" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="524" font-size="20" font-weight="700" text-anchor="middle">New Page B</text><text x="650.0" y="562" font-size="18" font-weight="400" text-anchor="middle">New physical storage page: the</text><text x="650.0" y="594" font-size="18" font-weight="400" text-anchor="middle">new data write has completed.</text><text x="28" y="740" font-size="17" font-weight="400" text-anchor="start">Old Page A and new Page B are concurrent remapping outcomes, not an</text><text x="28" y="772" font-size="17" font-weight="400" text-anchor="start">A-to-B sequence. Actual behavior depends on the controller, firmware</text><text x="28" y="804" font-size="17" font-weight="400" text-anchor="start">and storage technology; not every overwrite produces the same result.</text></g></svg>
