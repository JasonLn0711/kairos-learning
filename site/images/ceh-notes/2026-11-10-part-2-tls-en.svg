<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2692" role="img" aria-labelledby="title desc" lang="en"><title id="title">TLS 1.3: simplified certificate-based ECDHE exchange</title><desc id="desc">Solid arrows mean browser-to-server messages; dashed arrows mean server replies, not unencrypted traffic. Orange boxes indicate local computation or validation. EncryptedExtensions, key-schedule details, client certificates and other branches are omitted; this is not a packet capture. Server handshake messages from Certificate onward are protected with handshake keys.</desc><rect width="900" height="2692" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">TLS 1.3: simplified certificate-based ECDHE exchange</text><rect x="28" y="90" width="364" height="64" rx="12" fill="#e6f3e9" stroke="#4a9865"/><text x="210" y="128" font-size="20" font-weight="700" text-anchor="middle">Browser</text><rect x="508" y="90" width="364" height="64" rx="12" fill="#e6f3e9" stroke="#4a9865"/><text x="690" y="128" font-size="20" font-weight="700" text-anchor="middle">Web server</text><path d="M210 154V2358M690 154V2358" fill="none" stroke="#899296" stroke-width="2"/><text x="450" y="196" font-size="16" font-weight="400" text-anchor="middle">Browser → Web server</text><text x="450" y="232" font-size="20" font-weight="700" text-anchor="middle">ClientHello + key_share</text><path d="M210 264H690m-9-7 9 7-9 7" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="300" font-size="18" font-weight="400" text-anchor="middle">The browser offers supported parameters and a</text><text x="450" y="332" font-size="18" font-weight="400" text-anchor="middle">public key share.</text><text x="450" y="402" font-size="16" font-weight="400" text-anchor="middle">Web server → Browser</text><text x="450" y="438" font-size="20" font-weight="700" text-anchor="middle">ServerHello + key_share</text><path d="M690 470H210m9-7-9 7 9 7" fill="none" stroke="#657079" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="506" font-size="18" font-weight="400" text-anchor="middle">The server selects parameters and returns its</text><text x="450" y="538" font-size="18" font-weight="400" text-anchor="middle">public key share.</text><rect x="96" y="590" width="708" height="178" rx="12" fill="#f7f3ea" stroke="#d8dce0"/><text x="450.0" y="624" font-size="20" font-weight="700" text-anchor="middle">Compute a shared secret and derive keys locally</text><text x="450.0" y="664" font-size="18" font-weight="400" text-anchor="middle">ECDHE and HKDF establish handshake keys. The key schedule</text><text x="450.0" y="696" font-size="18" font-weight="400" text-anchor="middle">later derives application traffic keys; the shared secret</text><text x="450.0" y="728" font-size="18" font-weight="400" text-anchor="middle">is not sent directly.</text><text x="450" y="810" font-size="16" font-weight="400" text-anchor="middle">Web server → Browser</text><text x="450" y="846" font-size="20" font-weight="700" text-anchor="middle">Certificate</text><path d="M690 878H210m9-7-9 7 9 7" fill="none" stroke="#657079" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="914" font-size="18" font-weight="400" text-anchor="middle">The server sends its certificate chain, carrying</text><text x="450" y="946" font-size="18" font-weight="400" text-anchor="middle">public-key and identity/domain binding information.</text><text x="450" y="1016" font-size="16" font-weight="400" text-anchor="middle">Web server → Browser</text><text x="450" y="1052" font-size="20" font-weight="700" text-anchor="middle">CertificateVerify</text><path d="M690 1084H210m9-7-9 7 9 7" fill="none" stroke="#657079" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="1120" font-size="18" font-weight="400" text-anchor="middle">A signature proves possession of the corresponding</text><text x="450" y="1152" font-size="18" font-weight="400" text-anchor="middle">private key and binds the handshake transcript.</text><text x="450" y="1222" font-size="16" font-weight="400" text-anchor="middle">Web server → Browser</text><text x="450" y="1258" font-size="20" font-weight="700" text-anchor="middle">Finished (server)</text><path d="M690 1290H210m9-7-9 7 9 7" fill="none" stroke="#657079" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="1326" font-size="18" font-weight="400" text-anchor="middle">A verification value based on handshake secrets and</text><text x="450" y="1358" font-size="18" font-weight="400" text-anchor="middle">the transcript authenticates this handshake.</text><rect x="96" y="1410" width="708" height="242" rx="12" fill="#f7f3ea" stroke="#d8dce0"/><text x="450.0" y="1444" font-size="20" font-weight="700" text-anchor="middle">Validate certificate, domain, signature and Finished</text><text x="450.0" y="1484" font-size="18" font-weight="400" text-anchor="middle">The browser checks the trust chain, name, validity and</text><text x="450.0" y="1516" font-size="18" font-weight="400" text-anchor="middle">applicable constraints. Failure prevents continuing a</text><text x="450.0" y="1548" font-size="18" font-weight="400" text-anchor="middle">trusted connection. This box groups validation</text><text x="450.0" y="1580" font-size="18" font-weight="400" text-anchor="middle">responsibilities rather than prescribing exact execution</text><text x="450.0" y="1612" font-size="18" font-weight="400" text-anchor="middle">timing.</text><text x="450" y="1694" font-size="16" font-weight="400" text-anchor="middle">Browser → Web server</text><text x="450" y="1730" font-size="20" font-weight="700" text-anchor="middle">Finished (browser)</text><path d="M210 1762H690m-9-7 9 7-9 7" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="1798" font-size="18" font-weight="400" text-anchor="middle">The browser sends its handshake confirmation;</text><text x="450" y="1830" font-size="18" font-weight="400" text-anchor="middle">client-certificate authentication is omitted in</text><text x="450" y="1862" font-size="18" font-weight="400" text-anchor="middle">this example.</text><text x="450" y="1932" font-size="16" font-weight="400" text-anchor="middle">Browser → Web server</text><text x="450" y="1968" font-size="20" font-weight="700" text-anchor="middle">Encrypted HTTP request</text><path d="M210 2000H690m-9-7 9 7-9 7" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="2036" font-size="18" font-weight="400" text-anchor="middle">Application traffic keys and an AEAD such as</text><text x="450" y="2068" font-size="18" font-weight="400" text-anchor="middle">AES-GCM protect the request.</text><text x="450" y="2138" font-size="16" font-weight="400" text-anchor="middle">Web server → Browser</text><text x="450" y="2174" font-size="20" font-weight="700" text-anchor="middle">Encrypted HTTP response</text><path d="M690 2206H210m9-7-9 7 9 7" fill="none" stroke="#657079" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="2242" font-size="18" font-weight="400" text-anchor="middle">The server protects its reply with traffic keys for</text><text x="450" y="2274" font-size="18" font-weight="400" text-anchor="middle">its direction. The CA does not participate in every</text><text x="450" y="2306" font-size="18" font-weight="400" text-anchor="middle">handshake.</text><rect x="28" y="2358" width="364" height="64" rx="12" fill="#e6f3e9" stroke="#4a9865"/><text x="210" y="2396" font-size="20" font-weight="700" text-anchor="middle">Browser</text><rect x="508" y="2358" width="364" height="64" rx="12" fill="#e6f3e9" stroke="#4a9865"/><text x="690" y="2396" font-size="20" font-weight="700" text-anchor="middle">Web server</text><text x="28" y="2476" font-size="17" font-weight="400" text-anchor="start">Solid arrows mean browser-to-server messages; dashed arrows mean</text><text x="28" y="2508" font-size="17" font-weight="400" text-anchor="start">server replies, not unencrypted traffic. Orange boxes indicate</text><text x="28" y="2540" font-size="17" font-weight="400" text-anchor="start">local computation or validation. EncryptedExtensions, key-schedule</text><text x="28" y="2572" font-size="17" font-weight="400" text-anchor="start">details, client certificates and other branches are omitted; this</text><text x="28" y="2604" font-size="17" font-weight="400" text-anchor="start">is not a packet capture. Server handshake messages from</text><text x="28" y="2636" font-size="17" font-weight="400" text-anchor="start">Certificate onward are protected with handshake keys.</text></g></svg>
