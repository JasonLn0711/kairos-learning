<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1024" role="img" aria-labelledby="title desc" lang="en"><title id="title">Digital signatures: creating and verifying evidence</title><desc id="desc">A typical conceptual flow; actual computation differs by algorithm. Attribution also requires trusted certificates, private-key protection, time and audit evidence. A name in a database is insufficient.</desc><rect width="900" height="1024" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Digital signatures: creating and verifying evidence</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Original electronic document</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">For example, an approved process-change record</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Generate a cryptographic hash</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Map the document to a fixed-length digest</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Sign using the private key</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Create a signature with a key controlled by the signer</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Verify signature and identity</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">Use the public key with certificates, time and audit records</text><text x="28" y="878" font-size="17" font-weight="400" text-anchor="start">A typical conceptual flow; actual computation differs by algorithm.</text><text x="28" y="910" font-size="17" font-weight="400" text-anchor="start">Attribution also requires trusted certificates, private-key</text><text x="28" y="942" font-size="17" font-weight="400" text-anchor="start">protection, time and audit evidence. A name in a database is</text><text x="28" y="974" font-size="17" font-weight="400" text-anchor="start">insufficient.</text></g></svg>
