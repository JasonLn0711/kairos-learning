<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" role="img" aria-labelledby="title desc" lang="zh"><title id="title">VeraCrypt Hidden Volume 概念圖</title><desc id="desc">巢狀框表示儲存空間包含關係，沒有解鎖繼承關係。合理否認性不是絕對不可發現；暫存、快照及外層寫入等仍需管理。</desc><rect width="900" height="485" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">VeraCrypt Hidden Volume 概念圖</text><rect x="28" y="88" width="844" height="263" rx="12" fill="#f7faf8" stroke="#b8d5c5"/><text x="48" y="123" font-size="20" font-weight="700" text-anchor="start">外層加密磁碟區 Outer Volume</text><text x="48" y="163" font-size="18" font-weight="400" text-anchor="start">有獨立密碼，存放一般希望受保護的資料</text><rect x="60" y="213" width="780" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="450.0" y="245" font-size="20" font-weight="700" text-anchor="middle">內層隱藏磁碟區 Hidden Volume</text><text x="450.0" y="283" font-size="18" font-weight="400" text-anchor="middle">位於外層磁碟區可用空間內，使用不同密碼；解鎖外層不會自動解鎖內層</text><text x="28" y="403" font-size="17" font-weight="400" text-anchor="start">巢狀框表示儲存空間包含關係，沒有解鎖繼承關係。合理否認性不是絕對不可發現；暫存、快照及</text><text x="28" y="435" font-size="17" font-weight="400" text-anchor="start">外層寫入等仍需管理。</text></g></svg>
