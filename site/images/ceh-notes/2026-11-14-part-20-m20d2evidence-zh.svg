<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 704" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 3｜證據到決策模型（Evidence-to-Decision）</title><desc id="desc">六列是判讀問題，不表示取得授權可以延後；每次主動測試前都須確認授權。</desc><rect width="900" height="704" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 3｜證據到決策模型（Evidence-to-Decision）</text><text x="42" y="116" font-size="18" font-weight="700" text-anchor="start">1. Evidence</text><text x="332" y="116" font-size="18" font-weight="400" text-anchor="start">取得了什麼原始證據？</text><path d="M28 160H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="204" font-size="18" font-weight="700" text-anchor="start">2. Provenance</text><text x="332" y="204" font-size="18" font-weight="400" text-anchor="start">證據來自哪裡、什麼時間？</text><path d="M28 248H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="292" font-size="18" font-weight="700" text-anchor="start">3. Interpretation</text><text x="332" y="292" font-size="18" font-weight="400" text-anchor="start">證據可以支持哪些解釋？</text><path d="M28 336H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="380" font-size="18" font-weight="700" text-anchor="start">4. Uncertainty</text><text x="332" y="380" font-size="18" font-weight="400" text-anchor="start">還有哪些其他合理解釋？</text><path d="M28 424H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="468" font-size="18" font-weight="700" text-anchor="start">5. Validation</text><text x="332" y="468" font-size="18" font-weight="400" text-anchor="start">什麼測試可以區分這些解釋？</text><path d="M28 512H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="556" font-size="18" font-weight="700" text-anchor="start">6. Authorization</text><text x="332" y="556" font-size="18" font-weight="400" text-anchor="start">這個測試有沒有獲得授權？</text><path d="M28 600H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="28" y="648" font-size="17" font-weight="400" text-anchor="start">六列是判讀問題，不表示取得授權可以延後；每次主動測試前都須確認授權。</text></g></svg>
