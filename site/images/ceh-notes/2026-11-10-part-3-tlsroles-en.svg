<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1428" role="img" aria-labelledby="title desc" lang="en"><title id="title">Complementary mechanisms in HTTPS</title><desc id="desc">No leads to connection failure; yes leads to key derivation and AEAD. This shows functional relationships, not an exact packet timeline; the actual handshake has a staged key schedule.</desc><rect width="900" height="1428" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H222.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="842.0" text-anchor="middle" font-size="16">No</text><path d="M436.0 808V852.0H650.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="842.0" text-anchor="middle" font-size="16">Yes</text><path d="M650.0 1042V1086.0H436.0V1130m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Complementary mechanisms in HTTPS</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Client and server negotiate TLS</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Agree parameters</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Establish a shared secret using ECDHE</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Exchange public values</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Authenticate server and handshake</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Validate certificates, signatures and other requirements</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Validation succeeds?</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">Choose the success or failure branch</text><rect x="28.0" y="896" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="928" font-size="20" font-weight="700" text-anchor="middle">Connection fails</text><text x="222.0" y="966" font-size="18" font-weight="400" text-anchor="middle">Stop when validation fails</text><rect x="456.0" y="896" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="928" font-size="20" font-weight="700" text-anchor="middle">Derive traffic-protection</text><text x="650.0" y="960" font-size="20" font-weight="700" text-anchor="middle">keys using HKDF</text><text x="650.0" y="998" font-size="18" font-weight="400" text-anchor="middle">Follow the TLS key schedule</text><rect x="28.0" y="1130" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1162" font-size="20" font-weight="700" text-anchor="middle">Protect application data with AES-GCM or another AEAD</text><text x="436.0" y="1200" font-size="18" font-weight="400" text-anchor="middle">Apply the required integrity verification too</text><text x="28" y="1314" font-size="17" font-weight="400" text-anchor="start">No leads to connection failure; yes leads to key derivation and AEAD.</text><text x="28" y="1346" font-size="17" font-weight="400" text-anchor="start">This shows functional relationships, not an exact packet timeline;</text><text x="28" y="1378" font-size="17" font-weight="400" text-anchor="start">the actual handshake has a staged key schedule.</text></g></svg>
