<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1162" role="img" aria-labelledby="title desc" lang="zh"><title id="title">混合式密碼學的分工</title><desc id="desc">ECDHE 與憑證／簽章驗證各有任務；兩路匯入受驗證的 AEAD 資料保護。這是功能依賴圖，不是 TLS 封包的精確時序。</desc><rect width="900" height="1162" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H222.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M222.0 404V448.0H222.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 404V448.0H650.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M222.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">混合式密碼學的分工</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">非對稱金鑰建立：ECDHE</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">產生共享祕密</text><rect x="28.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="322" font-size="20" font-weight="700" text-anchor="middle">共享祕密</text><text x="222.0" y="360" font-size="18" font-weight="400" text-anchor="middle">交由金鑰導出函數處理</text><rect x="456.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="322" font-size="20" font-weight="700" text-anchor="middle">憑證／數位簽章</text><text x="650.0" y="360" font-size="18" font-weight="400" text-anchor="middle">提供身分驗證依據</text><rect x="28.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="524" font-size="20" font-weight="700" text-anchor="middle">KDF 導出連線金鑰</text><text x="222.0" y="562" font-size="18" font-weight="400" text-anchor="middle">不直接把原始共享祕密當所有用途的金鑰</text><rect x="456.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="524" font-size="20" font-weight="700" text-anchor="middle">驗證連線對象</text><text x="650.0" y="562" font-size="18" font-weight="400" text-anchor="middle">確認對等方及交握的可信關係</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">對稱式 AEAD，例如 AES-GCM</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">在正確 nonce、金鑰與驗證條件下保護資料</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">受保護的應用資料</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">保密性及完整性保護</text><text x="28" y="1080" font-size="17" font-weight="400" text-anchor="start">ECDHE 與憑證／簽章驗證各有任務；兩路匯入受驗證的 AEAD 資料保護。這是功能依賴圖，不</text><text x="28" y="1112" font-size="17" font-weight="400" text-anchor="start">是 TLS 封包的精確時序。</text></g></svg>
