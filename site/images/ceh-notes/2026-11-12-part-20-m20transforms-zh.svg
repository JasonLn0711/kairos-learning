<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 822" role="img" aria-labelledby="title desc" lang="zh"><title id="title">編碼、加密與雜湊的不同目的</title><desc id="desc">三列是平行比較，不是先後執行。箭頭表示各自的資料轉換；雜湊不是設計為可逆的轉換。</desc><rect width="900" height="822" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">編碼、加密與雜湊的不同目的</text><rect x="28.0" y="88" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Encoding｜編碼</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Hello → SGVsbG8=</text><text x="436.0" y="190" font-size="18" font-weight="400" text-anchor="middle">Base64 可依格式還原，不需要保密金鑰。</text><rect x="28.0" y="322" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="354" font-size="20" font-weight="700" text-anchor="middle">Encryption｜加密</text><text x="436.0" y="392" font-size="18" font-weight="400" text-anchor="middle">明文 → 密文</text><text x="436.0" y="424" font-size="18" font-weight="400" text-anchor="middle">需正確金鑰及其他必要參數才能解密。</text><rect x="28.0" y="556" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="588" font-size="20" font-weight="700" text-anchor="middle">Hashing｜雜湊</text><text x="436.0" y="626" font-size="18" font-weight="400" text-anchor="middle">任意長度資料 → 固定長度摘要</text><text x="436.0" y="658" font-size="18" font-weight="400" text-anchor="middle">SHA-256 產生 256-bit 摘要。</text><text x="28" y="772" font-size="17" font-weight="400" text-anchor="start">三列是平行比較，不是先後執行。箭頭表示各自的資料轉換；雜湊不是設計為可逆的轉換。</text></g></svg>
