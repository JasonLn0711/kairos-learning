<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2076" role="img" aria-labelledby="title desc" lang="en"><title id="title">Six cryptography recall cards</title><desc id="desc">Explain the reason before revealing the answer. Viewing cards is not recorded as completed learning.</desc><rect width="900" height="2076" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Six cryptography recall cards</text><rect x="28" y="84" width="844" height="292" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="108" font-size="16" font-weight="400" text-anchor="middle">1 / 6</text><text x="450" y="148" font-size="20" font-weight="400" text-anchor="middle">Why do a 128-bit block and 256-bit key not uniquely identify</text><text x="450" y="180" font-size="20" font-weight="400" text-anchor="middle">Twofish?</text><text x="42" y="224" font-size="16" font-weight="400" text-anchor="start">References: 19、21</text><text x="42" y="264" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="300" font-size="18" font-weight="400" text-anchor="start">AES matches too. Additional discriminating conditions are needed, and</text><text x="42" y="332" font-size="18" font-weight="400" text-anchor="start">AES finalists also include selected Rijndael.</text><rect x="28" y="402" width="844" height="324" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="426" font-size="16" font-weight="400" text-anchor="middle">2 / 6</text><text x="450" y="466" font-size="20" font-weight="400" text-anchor="middle">Why can an attacker still read patient data despite full-disk</text><text x="450" y="498" font-size="20" font-weight="400" text-anchor="middle">encryption?</text><text x="42" y="542" font-size="16" font-weight="400" text-anchor="start">References: 20</text><text x="42" y="582" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="618" font-size="18" font-weight="400" text-anchor="start">An unlocked disk and sufficient privileges can expose plaintext</text><text x="42" y="650" font-size="18" font-weight="400" text-anchor="start">through application access. At-rest encryption is not intrusion</text><text x="42" y="682" font-size="18" font-weight="400" text-anchor="start">removal.</text><rect x="28" y="752" width="844" height="260" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="776" font-size="16" font-weight="400" text-anchor="middle">3 / 6</text><text x="450" y="816" font-size="20" font-weight="400" text-anchor="middle">Why can DH still suffer a man-in-the-middle attack?</text><text x="42" y="860" font-size="16" font-weight="400" text-anchor="start">References: 22</text><text x="42" y="900" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="936" font-size="18" font-weight="400" text-anchor="start">Without authenticating the source of public values, an attacker can</text><text x="42" y="968" font-size="18" font-weight="400" text-anchor="start">replace them and establish separate secrets with each endpoint.</text><rect x="28" y="1038" width="844" height="260" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1062" font-size="16" font-weight="400" text-anchor="middle">4 / 6</text><text x="450" y="1102" font-size="20" font-weight="400" text-anchor="middle">Why can SHA-256 alone not prove a bank origin?</text><text x="42" y="1146" font-size="16" font-weight="400" text-anchor="start">References: 25、26</text><text x="42" y="1186" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="1222" font-size="18" font-weight="400" text-anchor="start">Anyone can hash a fake transaction. Use a suitable authenticated</text><text x="42" y="1254" font-size="18" font-weight="400" text-anchor="start">mechanism and trusted identity/key binding.</text><rect x="28" y="1324" width="844" height="292" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1348" font-size="16" font-weight="400" text-anchor="middle">5 / 6</text><text x="450" y="1388" font-size="20" font-weight="400" text-anchor="middle">Why must DSA not unsafely reuse k across messages?</text><text x="42" y="1432" font-size="16" font-weight="400" text-anchor="start">References: 24</text><text x="42" y="1472" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="1508" font-size="18" font-weight="400" text-anchor="start">Reuse can expose relationships revealing the private key. Use</text><text x="42" y="1540" font-size="18" font-weight="400" text-anchor="start">suitable secure randomness or deterministic schemes and follow</text><text x="42" y="1572" font-size="18" font-weight="400" text-anchor="start">current algorithm requirements.</text><rect x="28" y="1642" width="844" height="292" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1666" font-size="16" font-weight="400" text-anchor="middle">6 / 6</text><text x="450" y="1706" font-size="20" font-weight="400" text-anchor="middle">Why does successful RSA verification not prove actual bank</text><text x="450" y="1738" font-size="20" font-weight="400" text-anchor="middle">authorization?</text><text x="42" y="1782" font-size="16" font-weight="400" text-anchor="start">References: 27</text><text x="42" y="1822" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="1858" font-size="18" font-weight="400" text-anchor="start">The verification key may have been substituted. Even with a trusted</text><text x="42" y="1890" font-size="18" font-weight="400" text-anchor="start">binding, check transaction permissions, freshness and business rules.</text><text x="28" y="1996" font-size="17" font-weight="400" text-anchor="start">Explain the reason before revealing the answer. Viewing cards is not</text><text x="28" y="2028" font-size="17" font-weight="400" text-anchor="start">recorded as completed learning.</text></g></svg>
