<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2328" role="img" aria-labelledby="title desc" lang="zh"><title id="title">八張主動回憶卡</title><desc id="desc">先作答再展開解析；顯示答案不代表學習完成，頁面不記錄個人進度。</desc><rect width="900" height="2328" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">八張主動回憶卡</text><rect x="28" y="84" width="844" height="228" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="108" font-size="16" font-weight="400" text-anchor="middle">1 / 8</text><text x="450" y="148" font-size="20" font-weight="400" text-anchor="middle">白帽和黑帽的主要差別，是不是會不會用攻擊工具？</text><text x="42" y="192" font-size="16" font-weight="400" text-anchor="start">對應：EC-Q535</text><text x="42" y="232" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="268" font-size="18" font-weight="400" text-anchor="start">不是。相同工具可用在不同授權、目的與行為下；先確認有效授權與界線。</text><rect x="28" y="338" width="844" height="260" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="362" font-size="16" font-weight="400" text-anchor="middle">2 / 8</text><text x="450" y="402" font-size="20" font-weight="400" text-anchor="middle">ISO/IEC 27001、27002、27005 如何區分？</text><text x="42" y="446" font-size="16" font-weight="400" text-anchor="start">對應：P1-Q063</text><text x="42" y="486" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="522" font-size="18" font-weight="400" text-anchor="start">27001 是 ISMS 要求，27002 是控制指引，27005 是風險管理指引。後兩者都可支援前者，</text><text x="42" y="554" font-size="18" font-weight="400" text-anchor="start">不是固定先後流程。</text><rect x="28" y="624" width="844" height="228" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="648" font-size="16" font-weight="400" text-anchor="middle">3 / 8</text><text x="450" y="688" font-size="20" font-weight="400" text-anchor="middle">警報剛出現誰先分流？醫院重大災難靠哪種計畫持續服務？</text><text x="42" y="732" font-size="16" font-weight="400" text-anchor="start">對應：P3-Q086、P3-Q088</text><text x="42" y="772" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="808" font-size="18" font-weight="400" text-anchor="start">典型 Tier 1 初步監控分流；BCP 維持必要業務，與 DRP、IRP 配合。</text><rect x="28" y="878" width="844" height="260" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="902" font-size="16" font-weight="400" text-anchor="middle">4 / 8</text><text x="450" y="942" font-size="20" font-weight="400" text-anchor="middle">為什麼一般 Delete 不能直接視為 Purge？</text><text x="42" y="986" font-size="16" font-weight="400" text-anchor="start">對應：P3-Q110</text><text x="42" y="1026" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="1062" font-size="18" font-weight="400" text-anchor="start">刪除可能只移除檔案參照。Purge 要在合適裝置方法與驗證下，讓先進實驗室復原目標資料不可</text><text x="42" y="1094" font-size="18" font-weight="400" text-anchor="start">行。</text><rect x="28" y="1164" width="844" height="228" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1188" font-size="16" font-weight="400" text-anchor="middle">5 / 8</text><text x="450" y="1228" font-size="20" font-weight="400" text-anchor="middle">Blowfish 的 64-bit 與 448-bit 分別是什麼？</text><text x="42" y="1272" font-size="16" font-weight="400" text-anchor="start">對應：EC-Q284</text><text x="42" y="1312" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="1348" font-size="18" font-weight="400" text-anchor="start">64 bits 是區塊大小；448 bits 是支援的最大金鑰長度。增加金鑰不會把區塊變大。</text><rect x="28" y="1418" width="844" height="260" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1442" font-size="16" font-weight="400" text-anchor="middle">6 / 8</text><text x="450" y="1482" font-size="20" font-weight="400" text-anchor="middle">為什麼現代 TLS 常同時需要非對稱與對稱密碼學？</text><text x="42" y="1526" font-size="16" font-weight="400" text-anchor="start">對應：EC-Q032</text><text x="42" y="1566" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="1602" font-size="18" font-weight="400" text-anchor="start">憑證式 ECDHE 連線用公鑰技術建立秘密與認證，再以 KDF 導鍵、對稱 AEAD 保護大量資料</text><text x="42" y="1634" font-size="18" font-weight="400" text-anchor="start">；仍須正確驗證對象。</text><rect x="28" y="1704" width="844" height="228" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1728" font-size="16" font-weight="400" text-anchor="middle">7 / 8</text><text x="450" y="1768" font-size="20" font-weight="400" text-anchor="middle">為何普通 SHA-256 摘要不能單獨證明未被惡意修改？</text><text x="42" y="1812" font-size="16" font-weight="400" text-anchor="start">對應：P3-Q074</text><text x="42" y="1852" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="1888" font-size="18" font-weight="400" text-anchor="start">攻擊者若同時替換資料與摘要，比對仍會一致；需可信參考摘要或適當的 MAC、簽章等認證。</text><rect x="28" y="1958" width="844" height="260" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1982" font-size="16" font-weight="400" text-anchor="middle">8 / 8</text><text x="450" y="2022" font-size="20" font-weight="400" text-anchor="middle">PKI 中 CA 與 Browser 的工作差在哪？</text><text x="42" y="2066" font-size="16" font-weight="400" text-anchor="start">對應：P3-Q121</text><text x="42" y="2106" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="2142" font-size="18" font-weight="400" text-anchor="start">CA 依政策驗證申請並簽發憑證；Browser 在連線時依信任政策驗證鏈、名稱、期限與相關條件</text><text x="42" y="2174" font-size="18" font-weight="400" text-anchor="start">。</text><text x="28" y="2280" font-size="17" font-weight="400" text-anchor="start">先作答再展開解析；顯示答案不代表學習完成，頁面不記錄個人進度。</text></g></svg>
