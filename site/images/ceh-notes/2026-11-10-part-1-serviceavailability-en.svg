<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 854" role="img" aria-labelledby="title desc" lang="en"><title id="title">Single points of failure and redundant nodes</title><desc id="desc">Upper group: a user reaches one failed server. Lower group: another user reaches parallel servers A and B through traffic distribution; A does not forward to B. Distributor, data-layer and common-mode failures require separate design.</desc><rect width="900" height="854" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M416.0 161.0H456.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M416.0 379.0H456.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 436V480.0H222.0V524m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 436V480.0H650.0V524m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Single points of failure and redundant nodes</text><rect x="28.0" y="88" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">User | Single-node scenario</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Needs the service</text><rect x="456.0" y="88" width="388.0" height="146" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Single server fails</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">A single point of failure may</text><text x="650.0" y="190" font-size="18" font-weight="400" text-anchor="middle">interrupt service</text><rect x="28.0" y="322" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="354" font-size="20" font-weight="700" text-anchor="middle">User | Redundant scenario</text><text x="222.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Needs the service</text><rect x="456.0" y="322" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="354" font-size="20" font-weight="700" text-anchor="middle">Traffic distribution</text><text x="650.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Routes to A or B</text><rect x="28.0" y="524" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="556" font-size="20" font-weight="700" text-anchor="middle">Server A</text><text x="222.0" y="594" font-size="18" font-weight="400" text-anchor="middle">Can serve requests</text><rect x="456.0" y="524" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="556" font-size="20" font-weight="700" text-anchor="middle">Server B</text><text x="650.0" y="594" font-size="18" font-weight="400" text-anchor="middle">Can serve requests</text><text x="28" y="708" font-size="17" font-weight="400" text-anchor="start">Upper group: a user reaches one failed server. Lower group: another</text><text x="28" y="740" font-size="17" font-weight="400" text-anchor="start">user reaches parallel servers A and B through traffic distribution; A</text><text x="28" y="772" font-size="17" font-weight="400" text-anchor="start">does not forward to B. Distributor, data-layer and common-mode</text><text x="28" y="804" font-size="17" font-weight="400" text-anchor="start">failures require separate design.</text></g></svg>
