<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1042" role="img" aria-labelledby="title desc" lang="en"><title id="title">Signing and verifying a bank transaction</title><desc id="desc">The columns show sender signing and receiver verification. RSA-PSS, DSA and other schemes have their own encoding and mathematics; signing is not simply “encrypting the hash with a private key.” The verification key must be trusted.</desc><rect width="900" height="1042" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Signing and verifying a bank transaction</text><rect x="28" y="88" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Sender: signing</text><text x="229.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Transaction data M</text><path d="M229 214v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="270" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="302" font-size="20" font-weight="700" text-anchor="middle">Compute digest</text><text x="229.0" y="340" font-size="18" font-weight="400" text-anchor="middle">Hash(M)</text><path d="M229 396v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="452" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="484" font-size="20" font-weight="700" text-anchor="middle">Sign using the private key</text><text x="229.0" y="522" font-size="18" font-weight="400" text-anchor="middle">Apply the selected signature</text><text x="229.0" y="554" font-size="18" font-weight="400" text-anchor="middle">scheme</text><path d="M229 610v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="666" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="698" font-size="20" font-weight="700" text-anchor="middle">Produce Signature</text><text x="229.0" y="736" font-size="18" font-weight="400" text-anchor="middle">Deliver M and its signature</text><rect x="458" y="88" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Receiver: verification</text><text x="659.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Receive M and Signature</text><path d="M659 214v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="458" y="270" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="302" font-size="20" font-weight="700" text-anchor="middle">Recompute digest</text><text x="659.0" y="340" font-size="18" font-weight="400" text-anchor="middle">Hash(M)</text><path d="M659 396v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="458" y="452" width="402" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="484" font-size="20" font-weight="700" text-anchor="middle">Verify using a trusted public</text><text x="659.0" y="516" font-size="20" font-weight="700" text-anchor="middle">key</text><text x="659.0" y="554" font-size="18" font-weight="400" text-anchor="middle">First establish the</text><text x="659.0" y="586" font-size="18" font-weight="400" text-anchor="middle">key-to-identity relationship</text><path d="M659 642v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="458" y="698" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="730" font-size="20" font-weight="700" text-anchor="middle">Pass / fail</text><text x="659.0" y="768" font-size="18" font-weight="400" text-anchor="middle">Evaluate under the scheme and</text><text x="659.0" y="800" font-size="18" font-weight="400" text-anchor="middle">validation conditions</text><text x="28" y="896" font-size="17" font-weight="400" text-anchor="start">The columns show sender signing and receiver verification. RSA-PSS,</text><text x="28" y="928" font-size="17" font-weight="400" text-anchor="start">DSA and other schemes have their own encoding and mathematics;</text><text x="28" y="960" font-size="17" font-weight="400" text-anchor="start">signing is not simply “encrypting the hash with a private key.” The</text><text x="28" y="992" font-size="17" font-weight="400" text-anchor="start">verification key must be trusted.</text></g></svg>
