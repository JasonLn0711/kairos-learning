<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" role="img" aria-labelledby="title desc" lang="zh"><title id="title">CSRF 圖 1｜同一瀏覽器、不同網頁與兩個伺服器</title><desc id="desc">Alice電腦中的兩個網頁並列，由同一Browser管理Cookie與網路；兩組HTTPS往返分別連至銀行與惡意網站Server，不是兩個Server互相轉送Session。這是責任分工示意，不是固定的程序配置。</desc><rect width="900" height="960" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CSRF 圖 1｜同一瀏覽器、不同網頁與兩個伺服器</text><rect x="28" y="88" width="844" height="404" rx="12" fill="#fbfcfd" stroke="#d8dce0"/><text x="48" y="120" font-size="22" font-weight="700" text-anchor="start">Alice 的電腦：同一個瀏覽器</text><text x="48" y="156" font-size="18" font-weight="400" text-anchor="start">網頁有自己的 DOM、JavaScript；網路與儲存由 Browser 仲裁</text><rect x="48" y="200" width="384" height="146" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="66" y="232" font-size="20" font-weight="700" text-anchor="start">銀行網頁</text><text x="66" y="270" font-size="18" font-weight="400" text-anchor="start">bank.example</text><text x="66" y="302" font-size="18" font-weight="400" text-anchor="start">自己的 DOM、JavaScript</text><rect x="468" y="200" width="384" height="146" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="486" y="232" font-size="20" font-weight="700" text-anchor="start">惡意網頁</text><text x="486" y="270" font-size="18" font-weight="400" text-anchor="start">evil.example</text><text x="486" y="302" font-size="18" font-weight="400" text-anchor="start">自己的 DOM、JavaScript</text><rect x="48" y="362" width="804" height="114" rx="12" fill="#edf4fa" stroke="#d8dce0"/><text x="66" y="394" font-size="20" font-weight="700" text-anchor="start">Browser 的 Cookie 儲存與網路管理機制</text><text x="66" y="432" font-size="18" font-weight="400" text-anchor="start">儲存不同網站的 Cookie，依照目標網址、Cookie 屬性和請求情境決定是否附帶。</text><path d="M224 516v26m-5-5 5 5 5-5M236 542V516m-5 5 5-5 5 5" fill="none" stroke="#657079" stroke-width="2"/><path d="M664 516v26m-5-5 5 5 5-5M676 542V516m-5 5 5-5 5 5" fill="none" stroke="#657079" stroke-width="2"/><text x="230" y="574" font-size="17" font-weight="400" text-anchor="middle">Browser ↔ 銀行 Server</text><text x="670" y="574" font-size="17" font-weight="400" text-anchor="middle">Browser ↔ 惡意網站 Server</text><text x="230" y="606" font-size="17" font-weight="400" text-anchor="middle">HTTPS Request / Response</text><text x="670" y="606" font-size="17" font-weight="400" text-anchor="middle">HTTPS Request / Response</text><rect x="28" y="648" width="404" height="146" rx="12" fill="#fbfcfd" stroke="#d8dce0"/><text x="46" y="680" font-size="20" font-weight="700" text-anchor="start">銀行 Server</text><text x="46" y="718" font-size="18" font-weight="400" text-anchor="start">驗證 Alice 身分、維護 Session、處理</text><text x="46" y="750" font-size="18" font-weight="400" text-anchor="start">交易</text><rect x="468" y="648" width="404" height="146" rx="12" fill="#fbfcfd" stroke="#d8dce0"/><text x="486" y="680" font-size="20" font-weight="700" text-anchor="start">惡意網站 Server</text><text x="486" y="718" font-size="18" font-weight="400" text-anchor="start">提供惡意頁面，但無權直接取得銀行的</text><text x="486" y="750" font-size="18" font-weight="400" text-anchor="start">Cookie</text><text x="28" y="840" font-size="17" font-weight="400" text-anchor="start">Alice電腦中的兩個網頁並列，由同一Browser管理Cookie與網路；兩組HTTPS往返分別連</text><text x="28" y="872" font-size="17" font-weight="400" text-anchor="start">至銀行與惡意網站Server，不是兩個Server互相轉送Session。這是責任分工示意，不是固</text><text x="28" y="904" font-size="17" font-weight="400" text-anchor="start">定的程序配置。</text></g></svg>
