<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" role="img" aria-labelledby="title desc" lang="zh"><title id="title">風險評估的三個步驟</title><desc id="desc">評價階段把分析結果與事先建立的準則比較。</desc><rect width="900" height="726" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">風險評估的三個步驟</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">風險識別</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">找出哪些威脅可能透過哪些弱點，影響哪些重要資產與業務。</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">風險分析</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">估計事件發生的可能性、後果及不確定性，建立風險程度。</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">風險評價</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">把分析結果與事先設定的接受準則比較，決定哪些風險需要優先處理。</text><text x="28" y="676" font-size="17" font-weight="400" text-anchor="start">評價階段把分析結果與事先建立的準則比較。</text></g></svg>
