400" text-anchor="middle">8</text><rect x="436" y="152" width="48" height="36" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="460" y="176" font-size="14" font-weight="400" text-anchor="middle">9</text><rect x="487" y="152" width="48" height="36" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="511" y="176" font-size="14" font-weight="400" text-anchor="middle">10</text><rect x="538" y="152" width="48" height="36" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="562" y="176" font-size="14" font-weight="400" text-anchor="middle">11</text><rect x="589" y="152" width="48" height="36" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="613" y="176" font-size="14" font-weight="400" text-anchor="middle">12</text><rect x="640" y="152" width="48" height="36" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="664" y="176" font-size="14" font-weight="400" text-anchor="middle">13</text><rect x="691" y="152" width="48" height="36" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="715" y="176" font-size="14" font-weight="400" text-anchor="middle">14</text><rect x="742" y="152" width="48" height="36" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="766" y="176" font-size="14" font-weight="400" text-anchor="middle">15</text><rect x="793" y="152" width="48" height="36" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="817" y="176" font-size="14" font-weight="400" text-anchor="middle">16</text><text x="28" y="216" font-size="18" font-weight="400" text-anchor="start">Amount of data processed by one block-cipher operation</text><text x="28" y="298" font-size="20" font-weight="700" text-anchor="start">Key size: 256 bits = 32 bytes</text><rect x="28" y="342" width="48" height="36" rx="12" fill="#c5e3d7" stroke="#b8d5c5"/><text x="52" y="366" font-size="14" font-weight="400" text-anchor="middle">1</text><rect x="79" y="342" width="48" height="36" rx="12" fill="#c5e3d7" stroke="#b8d5c5"/><text x="103" y="366" font-size="14" font-weight="400" text-anchor="middle">2</text><rect x="130" y="