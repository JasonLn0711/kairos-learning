<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546.05" role="img" aria-labelledby="title desc" lang="zh"><title id="title">PDCA 持續改善循環</title><desc id="desc">循環：Plan → Do → Check → Act → Plan。此教學模型不將所有條文機械式分割。</desc><rect width="900" height="546.05" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">PDCA 持續改善循環</text><rect x="28" y="101.6" width="404" height="116.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="135.6" font-size="20" font-weight="700">Plan｜規劃</text><text x="46" y="174.6" font-size="18" font-weight="400">範圍、政策、風險與目標。</text><rect x="468" y="101.6" width="404" height="116.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="486" y="135.6" font-size="20" font-weight="700">Do｜執行</text><text x="486" y="174.6" font-size="18" font-weight="400">控制措施、風險處理。</text><rect x="28" y="266.29999999999995" width="404" height="116.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="300.29999999999995" font-size="20" font-weight="700">Act｜改善</text><text x="46" y="339.29999999999995" font-size="18" font-weight="400">矯正、制度更新。</text><rect x="468" y="266.29999999999995" width="404" height="116.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="486" y="300.29999999999995" font-size="20" font-weight="700">Check｜檢查</text><text x="486" y="339.29999999999995" font-size="18" font-weight="400">稽核、量測、管理審查。</text><text x="28" y="424.99999999999994" font-size="19" font-weight="700">Plan → Do → Check → Act → Plan</text><text x="28" y="496.34999999999997" font-size="18" font-weight="400">循環：Plan → Do → Check → Act → Plan。此教學模型不將所有條文機械式分割。</text></g></svg>
