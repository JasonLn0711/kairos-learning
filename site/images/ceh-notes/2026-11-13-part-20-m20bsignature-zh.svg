<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" role="img" aria-labelledby="title desc" lang="zh"><title id="title">簽署與驗證的兩條流程</title><desc id="desc">簽署與驗證是兩條獨立流程，箭頭依端點標籤表示各自處理方向；桌面分為兩列，窄版依序讀完簽署端再讀驗證端，不表示兩端互相輪流運算。驗證需要訊息、簽章及可信公鑰。實際方案各異，不是把簽章用公鑰解密。</desc><rect width="900" height="780" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M202.0 193.0H242.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M416.0 193.0H456.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M630.0 193.0H670.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M202.0 491.0H242.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M416.0 491.0H456.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M630.0 491.0H670.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">簽署與驗證的兩條流程</text><rect x="28.0" y="88" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="115.0" y="120" font-size="20" font-weight="700" text-anchor="middle">簽署端：原始</text><text x="115.0" y="152" font-size="20" font-weight="700" text-anchor="middle">資料 M</text><text x="115.0" y="190" font-size="18" font-weight="400" text-anchor="middle">準備待簽署訊息</text><rect x="242.0" y="88" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="329.0" y="120" font-size="20" font-weight="700" text-anchor="middle">簽署端：</text><text x="329.0" y="152" font-size="20" font-weight="700" text-anchor="middle">Hash(M)</text><text x="329.0" y="190" font-size="18" font-weight="400" text-anchor="middle">依簽章方案處理</text><text x="329.0" y="222" font-size="18" font-weight="400" text-anchor="middle">訊息摘要</text><rect x="456.0" y="88" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="543.0" y="120" font-size="20" font-weight="700" text-anchor="middle">簽署端：使用</text><text x="543.0" y="152" font-size="20" font-weight="700" text-anchor="middle">私鑰簽署</text><text x="543.0" y="190" font-size="18" font-weight="400" text-anchor="middle">依 RSA-PSS、</text><text x="543.0" y="222" font-size="18" font-weight="400" text-anchor="middle">DSA 等具體簽</text><text x="543.0" y="254" font-size="18" font-weight="400" text-anchor="middle">章方案</text><rect x="670.0" y="88" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="757.0" y="120" font-size="20" font-weight="700" text-anchor="middle">簽署端：簽章</text><text x="757.0" y="152" font-size="20" font-weight="700" text-anchor="middle">Signature</text><text x="757.0" y="190" font-size="18" font-weight="400" text-anchor="middle">與原始資料一起</text><text x="757.0" y="222" font-size="18" font-weight="400" text-anchor="middle">交給驗證者</text><rect x="28.0" y="386" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="115.0" y="418" font-size="20" font-weight="700" text-anchor="middle">驗證端：收到</text><text x="115.0" y="450" font-size="20" font-weight="700" text-anchor="middle">資料 M</text><text x="115.0" y="488" font-size="18" font-weight="400" text-anchor="middle">同時取得</text><text x="115.0" y="520" font-size="18" font-weight="400" text-anchor="middle">Signature</text><text x="115.0" y="552" font-size="18" font-weight="400" text-anchor="middle">與簽署者公鑰</text><rect x="242.0" y="386" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="329.0" y="418" font-size="20" font-weight="700" text-anchor="middle">驗證端：驗證</text><text x="329.0" y="450" font-size="20" font-weight="700" text-anchor="middle">訊息與簽章</text><text x="329.0" y="488" font-size="18" font-weight="400" text-anchor="middle">依相同方案處理</text><text x="329.0" y="520" font-size="18" font-weight="400" text-anchor="middle">收到的訊息</text><rect x="456.0" y="386" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="543.0" y="418" font-size="20" font-weight="700" text-anchor="middle">驗證端：使用</text><text x="543.0" y="450" font-size="20" font-weight="700" text-anchor="middle">公鑰驗證</text><text x="543.0" y="488" font-size="18" font-weight="400" text-anchor="middle">檢查訊息、簽章</text><text x="543.0" y="520" font-size="18" font-weight="400" text-anchor="middle">與指定公鑰的關</text><text x="543.0" y="552" font-size="18" font-weight="400" text-anchor="middle">聯</text><rect x="670.0" y="386" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="757.0" y="418" font-size="20" font-weight="700" text-anchor="middle">驗證端：有效</text><text x="757.0" y="450" font-size="20" font-weight="700" text-anchor="middle">／無效</text><text x="757.0" y="488" font-size="18" font-weight="400" text-anchor="middle">有效仍須配合公</text><text x="757.0" y="520" font-size="18" font-weight="400" text-anchor="middle">鑰身分與私鑰保</text><text x="757.0" y="552" font-size="18" font-weight="400" text-anchor="middle">管判斷</text><text x="28" y="666" font-size="17" font-weight="400" text-anchor="start">簽署與驗證是兩條獨立流程，箭頭依端點標籤表示各自處理方向；桌面分為兩列，窄版依序讀完簽</text><text x="28" y="698" font-size="17" font-weight="400" text-anchor="start">署端再讀驗證端，不表示兩端互相輪流運算。驗證需要訊息、簽章及可信公鑰。實際方案各異，不</text><text x="28" y="730" font-size="17" font-weight="400" text-anchor="start">是把簽章用公鑰解密。</text></g></svg>
