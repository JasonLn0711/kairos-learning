題閉卷作答（另備原題）</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">40 分鐘</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">核對答案、訂正及查證</text><rect x="28.0" y="1098" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">20 分鐘</text><text x="436.0" y="1168" font-size="18" font-weight="400" text-anchor="middle">重答錯題與猜對題</text><text x="28" y="1282" font-size="17" font-weight="400" text-anchor="start">供稿建議的六段時間依序合計 180 分鐘；這是可調整的讀書安排，不代表已完成的學習進度。</text></g></svg>
