<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 842" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 1｜從 MX 到郵件伺服器連線</title><desc id="desc">依序解析郵件路由與主機位址；DNS 查詢成功，不保證 SMTP 服務實際可用。</desc><rect width="900" height="842" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 1｜從 MX 到郵件伺服器連線</text><text x="450" y="114" font-size="20" font-weight="700" text-anchor="middle">寄件端郵件伺服器</text><text x="450" y="154" font-size="18" font-weight="400" text-anchor="middle">要寄信到 research@example.com</text><path d="M450 198v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="296" font-size="20" font-weight="700" text-anchor="middle">DNS：查詢 MX</text><text x="450" y="336" font-size="18" font-weight="400" text-anchor="middle">回傳 mail.example.com</text><path d="M450 380v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="478" font-size="20" font-weight="700" text-anchor="middle">DNS：查詢 A／AAAA</text><text x="450" y="518" font-size="18" font-weight="400" text-anchor="middle">取得郵件主機的 IP 位址</text><path d="M450 562v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="660" font-size="20" font-weight="700" text-anchor="middle">嘗試連線郵件伺服器</text><text x="450" y="700" font-size="18" font-weight="400" text-anchor="middle">DNS 查詢成功，不保證 SMTP 服務實際可用</text><text x="28" y="786" font-size="17" font-weight="400" text-anchor="start">依序解析郵件路由與主機位址；DNS 查詢成功，不保證 SMTP 服務實際可用。</text></g></svg>
