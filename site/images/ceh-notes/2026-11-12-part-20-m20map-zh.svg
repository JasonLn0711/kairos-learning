<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" role="img" aria-labelledby="title desc" lang="zh"><title id="title">密碼學的四個問題</title><desc id="desc">四張卡片是平行檢查面向，閱讀順序不代表時序。</desc><rect width="900" height="524" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">密碼學的四個問題</text><rect x="28.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">保護什麼？</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">機密性、完整性、可用性</text><rect x="456.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">如何保護？</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">加密、雜湊、驗證、簽章</text><rect x="28.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="322" font-size="20" font-weight="700" text-anchor="middle">誰有權使用？</text><text x="222.0" y="360" font-size="18" font-weight="400" text-anchor="middle">金鑰、金鑰交換、身分認證</text><rect x="456.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="322" font-size="20" font-weight="700" text-anchor="middle">何時可能失效？</text><text x="650.0" y="360" font-size="18" font-weight="400" text-anchor="middle">演算法限制、主機入侵、管理錯誤</text><text x="28" y="474" font-size="17" font-weight="400" text-anchor="start">四張卡片是平行檢查面向，閱讀順序不代表時序。</text></g></svg>
