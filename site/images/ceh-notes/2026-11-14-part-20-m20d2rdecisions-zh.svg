<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 704" role="img" aria-labelledby="title desc" lang="zh"><title id="title">CSRF 圖 7｜把 Web 請求拆成三個決策</title><desc id="desc">三個責任分別判斷、依序互動；決策1允許發起不保證決策2附帶Cookie，更不保證決策3接受操作。</desc><rect width="900" height="704" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CSRF 圖 7｜把 Web 請求拆成三個決策</text><text x="42" y="112" font-size="20" font-weight="700" text-anchor="start">決策 1：網頁能不能發起這個操作？</text><text x="42" y="150" font-size="18" font-weight="400" text-anchor="start">Browser 檢查 Web Platform、Sandbox、SOP、Fetch 等規則。</text><path d="M450 198v24m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2"/><text x="42" y="290" font-size="20" font-weight="700" text-anchor="start">決策 2：Browser 實際送出哪些憑證？</text><text x="42" y="328" font-size="18" font-weight="400" text-anchor="start">依 Cookie Domain、Path、Secure、SameSite、Credentials Mode 等規則決</text><text x="42" y="360" font-size="18" font-weight="400" text-anchor="start">定。</text><path d="M450 408v24m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2"/><text x="42" y="500" font-size="20" font-weight="700" text-anchor="start">決策 3：Server 應不應該接受並執行？</text><text x="42" y="538" font-size="18" font-weight="400" text-anchor="start">驗證 Session、Authorization、CSRF、來源、操作參數與必要的額外確認。</text><text x="28" y="616" font-size="17" font-weight="400" text-anchor="start">三個責任分別判斷、依序互動；決策1允許發起不保證決策2附帶Cookie，更不保證決策3接受</text><text x="28" y="648" font-size="17" font-weight="400" text-anchor="start">操作。</text></g></svg>
