<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" role="img" aria-labelledby="title desc" lang="en"><title id="title">CIA objectives and two related concepts</title><desc id="desc">The three upper items are parallel security objectives. Non-repudiation concerns evidence; cleartext concerns data representation and exposure. They are not a fourth and fifth CIA objective.</desc><rect width="900" height="780" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CIA objectives and two related concepts</text><rect x="28.0" y="88" width="245.33333333333334" height="210" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="150.66666666666669" y="120" font-size="20" font-weight="700" text-anchor="middle">C01 ·</text><text x="150.66666666666669" y="152" font-size="20" font-weight="700" text-anchor="middle">Confidentiality</text><text x="150.66666666666669" y="190" font-size="18" font-weight="400" text-anchor="middle">Who may read the</text><text x="150.66666666666669" y="222" font-size="18" font-weight="400" text-anchor="middle">information?</text><rect x="313.33333333333337" y="88" width="245.33333333333334" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.00000000000006" y="120" font-size="20" font-weight="700" text-anchor="middle">C02 · Integrity</text><text x="436.00000000000006" y="158" font-size="18" font-weight="400" text-anchor="middle">Is the content</text><text x="436.00000000000006" y="190" font-size="18" font-weight="400" text-anchor="middle">trustworthy?</text><rect x="598.6666666666667" y="88" width="245.33333333333334" height="210" rx="12" fill="#f7f1e9" stroke="#b8d5c5"/><text x="721.3333333333334" y="120" font-size="20" font-weight="700" text-anchor="middle">C03 ·</text><text x="721.3333333333334" y="152" font-size="20" font-weight="700" text-anchor="middle">Availability</text><text x="721.3333333333334" y="190" font-size="18" font-weight="400" text-anchor="middle">Can authorized</text><text x="721.3333333333334" y="222" font-size="18" font-weight="400" text-anchor="middle">users use it when</text><text x="721.3333333333334" y="254" font-size="18" font-weight="400" text-anchor="middle">needed?</text><rect x="28.0" y="386" width="388.0" height="178" rx="12" fill="#f6f7f8" stroke="#b8d5c5"/><text x="222.0" y="418" font-size="20" font-weight="700" text-anchor="middle">C04 · Non-repudiation</text><text x="222.0" y="456" font-size="18" font-weight="400" text-anchor="middle">Can evidence support</text><text x="222.0" y="488" font-size="18" font-weight="400" text-anchor="middle">attribution afterward?</text><rect x="456.0" y="386" width="388.0" height="178" rx="12" fill="#f6f7f8" stroke="#b8d5c5"/><text x="650.0" y="418" font-size="20" font-weight="700" text-anchor="middle">C05 · Cleartext</text><text x="650.0" y="456" font-size="18" font-weight="400" text-anchor="middle">Is readable data exposed</text><text x="650.0" y="488" font-size="18" font-weight="400" text-anchor="middle">across an inappropriate trust</text><text x="650.0" y="520" font-size="18" font-weight="400" text-anchor="middle">boundary?</text><text x="28" y="634" font-size="17" font-weight="400" text-anchor="start">The three upper items are parallel security objectives.</text><text x="28" y="666" font-size="17" font-weight="400" text-anchor="start">Non-repudiation concerns evidence; cleartext concerns data</text><text x="28" y="698" font-size="17" font-weight="400" text-anchor="start">representation and exposure. They are not a fourth and fifth CIA</text><text x="28" y="730" font-size="17" font-weight="400" text-anchor="start">objective.</text></g></svg>
