<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1162" role="img" aria-labelledby="title desc" lang="zh"><title id="title">安全測試的授權與風險決策</title><desc id="desc">依NIST SP 800-115及OWASP揭露原則整理的實務模型，不是法律構成要件流程。兩個否定分支均停止；只有通過兩道條件的分支連至受控驗證與結案。</desc><rect width="900" height="1162" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H222.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="438.0" text-anchor="middle" font-size="16">否</text><path d="M436.0 404V448.0H650.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="438.0" text-anchor="middle" font-size="16">是</text><path d="M650.0 606V650.0H222.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="436.0" y="640.0" text-anchor="middle" font-size="16">否</text><path d="M650.0 606V650.0H650.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="650.0" y="640.0" text-anchor="middle" font-size="16">是</text><path d="M650.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">安全測試的授權與風險決策</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">提出測試行為</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">先說明要驗證的控制與目的</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">具有有效授權嗎？</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">授權人、期間、測試者與資產</text><rect x="28.0" y="492" width="388.0" height="114" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="222.0" y="524" font-size="20" font-weight="700" text-anchor="middle">否：不得作為已授權測試執行</text><text x="222.0" y="562" font-size="18" font-weight="400" text-anchor="middle">停止；取得適當授權後重新審查</text><rect x="456.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="524" font-size="20" font-weight="700" text-anchor="middle">是：繼續審查行為與風險</text><text x="650.0" y="562" font-size="18" font-weight="400" text-anchor="middle">符合 Scope、ROE 與風險限制嗎？</text><rect x="28.0" y="694" width="388.0" height="114" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="222.0" y="726" font-size="20" font-weight="700" text-anchor="middle">否：停止並申請變更授權</text><text x="222.0" y="764" font-size="18" font-weight="400" text-anchor="middle">此分支不連向執行或結案</text><rect x="456.0" y="694" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="726" font-size="20" font-weight="700" text-anchor="middle">是：執行受控驗證與證據保存</text><text x="650.0" y="764" font-size="18" font-weight="400" text-anchor="middle">持續遵守停止條件與資料處理規則</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">回報、改善、複測與結案</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">記錄觀察、限制、修補與驗收證據</text><text x="28" y="1080" font-size="17" font-weight="400" text-anchor="start">依NIST SP 800-115及OWASP揭露原則整理的實務模型，不是法律構成要件流程。兩個否定分</text><text x="28" y="1112" font-size="17" font-weight="400" text-anchor="start">支均停止；只有通過兩道條件的分支連至受控驗證與結案。</text></g></svg>
