<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" role="img" aria-labelledby="title desc" lang="zh"><title id="title">公開金鑰加密的角色與流程</title><desc id="desc">上排是兩把金鑰的角色，沒有時間先後。下方箭頭是加密、傳送與解密的順序；前提是已驗證 Bob 公鑰的身分。</desc><rect width="900" height="960" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">公開金鑰加密的角色與流程</text><rect x="28.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Public Key｜公鑰</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">公布給需要傳送機密訊息的人</text><rect x="456.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Private Key｜私鑰</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">由接收者秘密保管</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Alice 加密</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">使用已驗證的 Bob 公鑰</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">傳送密文</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">將密文傳送給 Bob</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Bob 解密</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">使用自己的私鑰</text><text x="28" y="878" font-size="17" font-weight="400" text-anchor="start">上排是兩把金鑰的角色，沒有時間先後。下方箭頭是加密、傳送與解密的順序；前提是已驗證</text><text x="28" y="910" font-size="17" font-weight="400" text-anchor="start">Bob 公鑰的身分。</text></g></svg>
