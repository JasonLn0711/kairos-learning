<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" role="img" aria-labelledby="title desc" lang="zh"><title id="title">AES 遴選的五個決選演算法</title><desc id="desc">五個演算法為平行候選。Rijndael 最後獲選；只提供 128-bit 區塊、最高 256-bit 金鑰與決選者條件，不能排除多個候選。</desc><rect width="900" height="758" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">AES 遴選的五個決選演算法</text><rect x="28.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">MARS</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">決選演算法</text><rect x="456.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">RC6</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">決選演算法</text><rect x="28.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Rijndael</text><text x="222.0" y="360" font-size="18" font-weight="400" text-anchor="middle">最終成為 AES 標準的基礎</text><rect x="456.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Serpent</text><text x="650.0" y="360" font-size="18" font-weight="400" text-anchor="middle">決選演算法</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Twofish</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">決選演算法，未獲選為 AES</text><text x="28" y="676" font-size="17" font-weight="400" text-anchor="start">五個演算法為平行候選。Rijndael 最後獲選；只提供 128-bit 區塊、最高 256-bit 金鑰</text><text x="28" y="708" font-size="17" font-weight="400" text-anchor="start">與決選者條件，不能排除多個候選。</text></g></svg>
