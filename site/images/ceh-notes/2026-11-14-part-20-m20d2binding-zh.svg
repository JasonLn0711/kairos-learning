<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 8｜SQL 字串拼接與參數綁定的差異</title><desc id="desc">上半部呈現拼接過程的片段，完整查詢與收尾引號見正文。下半部的 SQL 結構與參數值並列傳遞，沒有把參數接成 SQL 原始碼；兩種設計使用相同輸入，結果仍依資料內容而定。</desc><rect width="900" height="1000" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 8｜SQL 字串拼接與參數綁定的差異</text><text x="28" y="90" font-size="20" font-weight="700" text-anchor="start">不安全：把資料拼接進 SQL 指令文字</text><text x="42" y="140" font-size="17" font-weight="400" text-anchor="start">原本的 SQL（片段）</text><rect x="36" y="154" width="360" height="36" rx="10" fill="#f2f6f5" stroke="#d8dce0"/><g font-family="ui-monospace, Consolas, monospace"><text x="42" y="178" font-size="19" font-weight="400" text-anchor="start">SELECT ... WHERE username = &#x27;</text></g><path d="M42 232H858" stroke="#e1e5e8"/><text x="42" y="260" font-size="17" font-weight="400" text-anchor="start">直接拼入使用者輸入</text><rect x="36" y="274" width="144" height="36" rx="10" fill="#f2f6f5" stroke="#d8dce0"/><g font-family="ui-monospace, Consolas, monospace"><text x="42" y="298" font-size="19" font-weight="400" text-anchor="start">&#x27; OR &#x27;1&#x27;=&#x27;1</text></g><path d="M42 352H858" stroke="#e1e5e8"/><path d="M450 380v22m-6-6 6 6 6-6" fill="none" stroke="#b52323" stroke-width="2"/><g fill="#b52323"><text x="450" y="438" font-size="20" font-weight="700" text-anchor="middle">SQL 查詢邏輯被改變</text></g><text x="450" y="478" font-size="18" font-weight="400" text-anchor="middle">輸入可能擴大查詢條件</text><path d="M28 534H872" stroke="#d8dce0"/><text x="28" y="580" font-size="20" font-weight="700" text-anchor="start">安全：SQL 結構與參數值分開傳遞</text><text x="42" y="638" font-size="17" font-weight="400" text-anchor="start">SQL 指令結構</text><rect x="36" y="652" width="228" height="36" rx="10" fill="#f2f6f5" stroke="#d8dce0"/><g font-family="ui-monospace, Consolas, monospace"><text x="42" y="676" font-size="19" font-weight="400" text-anchor="start">WHERE username = ?</text></g><text x="472" y="638" font-size="17" font-weight="400" text-anchor="start">參數資料</text><rect x="466" y="652" width="144" height="36" rx="10" fill="#f2f6f5" stroke="#d8dce0"/><g font-family="ui-monospace, Consolas, monospace"><text x="472" y="676" font-size="19" font-weight="400" text-anchor="start">&#x27; OR &#x27;1&#x27;=&#x27;1</text></g><path d="M450 746v22m-6-6 6 6 6-6" fill="none" stroke="#006b39" stroke-width="2"/><g fill="#006b39"><text x="450" y="802" font-size="20" font-weight="700" text-anchor="middle">輸入只用於資料值比較，不改變 SQL 語法</text></g><text x="450" y="842" font-size="18" font-weight="400" text-anchor="middle">驅動程式將這個輸入綁定為資料值</text><text x="28" y="916" font-size="17" font-weight="400" text-anchor="start">上半部呈現拼接過程的片段，完整查詢與收尾引號見正文。下半部的 SQL 結構與參數值並</text><text x="28" y="948" font-size="17" font-weight="400" text-anchor="start">列傳遞，沒有把參數接成 SQL 原始碼；兩種設計使用相同輸入，結果仍依資料內容而定。</text></g></svg>
