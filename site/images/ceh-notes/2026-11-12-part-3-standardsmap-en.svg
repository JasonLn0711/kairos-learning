<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1088" role="img" aria-labelledby="title desc" lang="en"><title id="title">C25–C29 standards and concepts map</title><desc id="desc">This learning map does not imply mandatory normative dependencies or certification order.</desc><rect width="900" height="1088" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 436V480.0H222.0V524m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 436V480.0H650.0V524m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M222.0 702V746.0H436.0V790m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 702V746.0H436.0V790m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">C25–C29 standards and concepts map</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">C25 | Risk management</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Identify risks → analyze and assess → decide treatment.</text><rect x="28.0" y="290" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">C26 | ISO/IEC 27001</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Specifies the information security management system an organization</text><text x="436.0" y="392" font-size="18" font-weight="400" text-anchor="middle">should establish.</text><rect x="28.0" y="524" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="556" font-size="20" font-weight="700" text-anchor="middle">C27 | ISO/IEC 27005</text><text x="222.0" y="594" font-size="18" font-weight="400" text-anchor="middle">How is information security</text><text x="222.0" y="626" font-size="18" font-weight="400" text-anchor="middle">risk management performed in</text><text x="222.0" y="658" font-size="18" font-weight="400" text-anchor="middle">detail?</text><rect x="456.0" y="524" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="556" font-size="20" font-weight="700" text-anchor="middle">C28 | ISO/IEC 27002</text><text x="650.0" y="594" font-size="18" font-weight="400" text-anchor="middle">Which security controls can be</text><text x="650.0" y="626" font-size="18" font-weight="400" text-anchor="middle">selected and implemented?</text><rect x="28.0" y="790" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="822" font-size="20" font-weight="700" text-anchor="middle">C29 | ISO/IEC 27701</text><text x="436.0" y="860" font-size="18" font-weight="400" text-anchor="middle">How is a personal information and privacy information management</text><text x="436.0" y="892" font-size="18" font-weight="400" text-anchor="middle">system established?</text><text x="28" y="1006" font-size="17" font-weight="400" text-anchor="start">This learning map does not imply mandatory normative dependencies or</text><text x="28" y="1038" font-size="17" font-weight="400" text-anchor="start">certification order.</text></g></svg>
