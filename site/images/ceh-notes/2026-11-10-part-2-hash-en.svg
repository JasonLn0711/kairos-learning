<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img" aria-labelledby="title desc" lang="en"><title id="title">Different content usually produces different hashes</title><desc id="desc">The two inputs are compared in parallel. Digest A/B are conceptual labels, not computed SHA-256 results. Collisions exist mathematically; security requires that exploitable collisions be difficult to find.</desc><rect width="900" height="506" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Different content usually produces different hashes</text><rect x="28" y="90" width="404" height="178" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="46" y="124" font-size="20" font-weight="700" text-anchor="start">Input A</text><text x="46" y="164" font-size="18" font-weight="400" text-anchor="start">Patient blood pressure: 120</text><text x="46" y="196" font-size="18" font-weight="400" text-anchor="start">↓ SHA-256</text><text x="46" y="228" font-size="18" font-weight="400" text-anchor="start">Produces digest A</text><rect x="458" y="90" width="404" height="210" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="476" y="124" font-size="20" font-weight="700" text-anchor="start">Input B</text><text x="476" y="164" font-size="18" font-weight="400" text-anchor="start">Patient blood pressure: 180</text><text x="476" y="196" font-size="18" font-weight="400" text-anchor="start">↓ SHA-256</text><text x="476" y="228" font-size="18" font-weight="400" text-anchor="start">Produces digest B, usually</text><text x="476" y="260" font-size="18" font-weight="400" text-anchor="start">different from A</text><text x="28" y="354" font-size="17" font-weight="400" text-anchor="start">The two inputs are compared in parallel. Digest A/B are conceptual</text><text x="28" y="386" font-size="17" font-weight="400" text-anchor="start">labels, not computed SHA-256 results. Collisions exist</text><text x="28" y="418" font-size="17" font-weight="400" text-anchor="start">mathematically; security requires that exploitable collisions be</text><text x="28" y="450" font-size="17" font-weight="400" text-anchor="start">difficult to find.</text></g></svg>
