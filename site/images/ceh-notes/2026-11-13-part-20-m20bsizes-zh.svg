<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-labelledby="title desc" lang="zh"><title id="title">AES-256 的兩個重要參數</title><desc id="desc">兩個參數描述不同屬性；AES-128、AES-192、AES-256 的區塊同為 128 bits，金鑰長度與輪數不同。</desc><rect width="900" height="354" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">AES-256 的兩個重要參數</text><rect x="28.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Block Size：128 bits</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">每個基本資料區塊</text><rect x="456.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Key Size：256 bits</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">秘密金鑰長度</text><text x="28" y="272" font-size="17" font-weight="400" text-anchor="start">兩個參數描述不同屬性；AES-128、AES-192、AES-256 的區塊同為 128 bits，金鑰長度</text><text x="28" y="304" font-size="17" font-weight="400" text-anchor="start">與輪數不同。</text></g></svg>
