<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680.5" role="img" aria-labelledby="title desc" lang="en"><title id="title">IT/OT firewall boundary</title><desc id="desc">Only approved policy-compliant traffic passes; Deny means blocked.</desc><rect width="900" height="680.5" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">IT/OT firewall boundary</text><rect x="28" y="101.6" width="268" height="205.79999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="135.6" font-size="20" font-weight="700">IT network</text><text x="46" y="174.6" font-size="18" font-weight="400">Enterprise office</text><text x="46" y="204.29999999999998" font-size="18" font-weight="400">endpoints and</text><text x="46" y="233.99999999999997" font-size="18" font-weight="400">general information</text><text x="46" y="263.7" font-size="18" font-weight="400">systems.</text><rect x="316" y="101.6" width="268" height="176.1" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="334" y="135.6" font-size="20" font-weight="700">Firewall</text><text x="334" y="174.6" font-size="18" font-weight="400">Check source,</text><text x="334" y="204.29999999999998" font-size="18" font-weight="400">destination and</text><text x="334" y="233.99999999999997" font-size="18" font-weight="400">service rules</text><rect x="604" y="101.6" width="268" height="205.79999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="622" y="135.6" font-size="20" font-weight="700">OT network</text><text x="622" y="174.6" font-size="18" font-weight="400">Manufacturing</text><text x="622" y="204.29999999999998" font-size="18" font-weight="400">equipment and</text><text x="622" y="233.99999999999997" font-size="18" font-weight="400">factory operational</text><text x="622" y="263.7" font-size="18" font-weight="400">control systems.</text><path d="M306 141.6L318 141.6m-7 -7 7 7-7 7" fill="none" stroke="#557363" stroke-width="2"/><path d="M594 141.6L606 141.6m-7 -7 7 7-7 7" fill="none" stroke="#557363" stroke-width="2"/><rect x="28" y="337.4" width="844" height="116.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="371.4" font-size="20" font-weight="700">Allow | Approved management</text><text x="46" y="410.4" font-size="18" font-weight="400">Permit management connections that match policy.</text><rect x="28" y="472.09999999999997" width="844" height="116.69999999999999" rx="12" fill="#fff1f0" stroke="#adc8bc"/><text x="46" y="506.09999999999997" font-size="20" font-weight="700">Deny | Unauthorized direct access</text><text x="46" y="545.0999999999999" font-size="18" font-weight="400">Block unapproved direct connections.</text><text x="28" y="630.8" font-size="18" font-weight="400">Only approved policy-compliant traffic passes; Deny means blocked.</text></g></svg>
