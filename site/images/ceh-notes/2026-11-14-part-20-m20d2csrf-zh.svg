<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 844" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 7｜瀏覽器如何被誘使發出非預期請求</title><desc id="desc">箭頭是此假設情境的時間順序；登入 Cookie 是否附上仍依 Cookie 政策與請求條件，操作是否執行則取決於網站防護。</desc><rect width="900" height="844" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 7｜瀏覽器如何被誘使發出非預期請求</text><text x="450" y="120" font-size="20" font-weight="700" text-anchor="middle">Alice 已登入銀行網站</text><text x="450" y="160" font-size="18" font-weight="400" text-anchor="middle">瀏覽器持有有效的 Session Cookie</text><path d="M450 212v24m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2"/><text x="450" y="296" font-size="20" font-weight="700" text-anchor="middle">Alice 開啟惡意網站</text><text x="450" y="336" font-size="18" font-weight="400" text-anchor="middle">惡意頁面誘使瀏覽器產生請求</text><path d="M450 388v24m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2"/><rect x="28" y="442" width="844" height="110" rx="10" fill="#fbfcfd" stroke="#d8dce0"/><text x="450" y="472" font-size="20" font-weight="700" text-anchor="middle">瀏覽器向銀行發出請求</text><text x="450" y="512" font-size="18" font-weight="400" text-anchor="middle">在特定 Cookie 政策及請求條件下，附上登入憑證</text><path d="M450 564v24m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2"/><rect x="28" y="618" width="844" height="110" rx="10" fill="#fbfcfd" stroke="#d8dce0"/><text x="450" y="648" font-size="20" font-weight="700" text-anchor="middle">銀行未充分驗證請求來源或防偽資訊</text><text x="450" y="688" font-size="18" font-weight="400" text-anchor="middle">可能錯誤執行非使用者本意的操作</text><text x="28" y="760" font-size="17" font-weight="400" text-anchor="start">箭頭是此假設情境的時間順序；登入 Cookie 是否附上仍依 Cookie 政策與請求條件，操</text><text x="28" y="792" font-size="17" font-weight="400" text-anchor="start">作是否執行則取決於網站防護。</text></g></svg>
