<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1162" role="img" aria-labelledby="title desc" lang="en"><title id="title">From security testing to risk reduction</title><desc id="desc">The five steps connect in order. The responsible team remediates findings, followed by retesting. Finding no vulnerability in one test does not establish complete security.</desc><rect width="900" height="1162" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">From security testing to risk reduction</text><rect x="28" y="90" width="58" height="58" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><text x="57" y="125" font-size="22" font-weight="700" text-anchor="middle">01</text><text x="108" y="118" font-size="20" font-weight="700" text-anchor="start">Obtain authorization</text><text x="108" y="156" font-size="18" font-weight="400" text-anchor="start">Confirm which systems and activities may be tested</text><path d="M57 200v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><rect x="28" y="274" width="58" height="58" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><text x="57" y="309" font-size="22" font-weight="700" text-anchor="middle">02</text><text x="108" y="302" font-size="20" font-weight="700" text-anchor="start">Find weaknesses</text><text x="108" y="340" font-size="18" font-weight="400" text-anchor="start">Identify potential security vulnerabilities</text><path d="M57 384v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><rect x="28" y="458" width="58" height="58" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><text x="57" y="493" font-size="22" font-weight="700" text-anchor="middle">03</text><text x="108" y="486" font-size="20" font-weight="700" text-anchor="start">Verify impact</text><text x="108" y="524" font-size="18" font-weight="400" text-anchor="start">Determine within the agreed limits whether a weakness is</text><text x="108" y="556" font-size="18" font-weight="400" text-anchor="start">exploitable</text><path d="M57 600v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><rect x="28" y="674" width="58" height="58" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><text x="57" y="709" font-size="22" font-weight="700" text-anchor="middle">04</text><text x="108" y="702" font-size="20" font-weight="700" text-anchor="start">Report findings</text><text x="108" y="740" font-size="18" font-weight="400" text-anchor="start">Explain evidence, impact and remediation recommendations</text><path d="M57 784v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><rect x="28" y="858" width="58" height="58" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><text x="57" y="893" font-size="22" font-weight="700" text-anchor="middle">05</text><text x="108" y="886" font-size="20" font-weight="700" text-anchor="start">Remediate and retest</text><text x="108" y="924" font-size="18" font-weight="400" text-anchor="start">The responsible team fixes the issue, then verifies</text><text x="108" y="956" font-size="18" font-weight="400" text-anchor="start">whether the improvement works</text><text x="28" y="1042" font-size="17" font-weight="400" text-anchor="start">The five steps connect in order. The responsible team remediates</text><text x="28" y="1074" font-size="17" font-weight="400" text-anchor="start">findings, followed by retesting. Finding no vulnerability in one</text><text x="28" y="1106" font-size="17" font-weight="400" text-anchor="start">test does not establish complete security.</text></g></svg>
