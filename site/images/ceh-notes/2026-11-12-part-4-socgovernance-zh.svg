<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1242" role="img" aria-labelledby="title desc" lang="zh"><title id="title">案例組織：SOC、必要時升級應變與依業務影響啟動 BCP</title><desc id="desc">這是案例組織分工示意，不是所有 SOC 的固定編制。Tier 1 與 Tier 3 為平行分工；不是每則告警都必須進入 Tier 3、重大事件應變或 BCP。SLA、NDA、AUP 是三種平行的治理文件，不是依序執行的步驟。</desc><rect width="900" height="1242" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H222.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 202V246.0H650.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M222.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="438.0" text-anchor="middle" font-size="16">必要時</text><path d="M650.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="438.0" text-anchor="middle" font-size="16">必要時</text><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="436.0" y="640.0" text-anchor="middle" font-size="16">依影響啟動</text><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">案例組織：SOC、必要時升級應變與依業務影響啟動 BCP</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">SOC：持續監控</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">日誌、網路、端點、雲端與威脅情報</text><rect x="28.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Tier 1</text><text x="222.0" y="360" font-size="18" font-weight="400" text-anchor="middle">驗證與分流告警</text><rect x="456.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Tier 3</text><text x="650.0" y="360" font-size="18" font-weight="400" text-anchor="middle">深入調查與威脅獵捕</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">重大事件應變</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Incident Commander 協調決策與行動</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">BCP：維持關鍵業務</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">替代程序、復原資源、業務恢復</text><text x="28" y="896" font-size="18" font-weight="700" text-anchor="start">平行治理文件（不是處理步驟）</text><rect x="28.0" y="944" width="245.33333333333334" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="150.66666666666669" y="976" font-size="20" font-weight="700" text-anchor="middle">SLA</text><text x="150.66666666666669" y="1014" font-size="18" font-weight="400" text-anchor="middle">服務承諾</text><rect x="313.33333333333337" y="944" width="245.33333333333334" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.00000000000006" y="976" font-size="20" font-weight="700" text-anchor="middle">NDA</text><text x="436.00000000000006" y="1014" font-size="18" font-weight="400" text-anchor="middle">保密義務</text><rect x="598.6666666666667" y="944" width="245.33333333333334" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="721.3333333333334" y="976" font-size="20" font-weight="700" text-anchor="middle">AUP</text><text x="721.3333333333334" y="1014" font-size="18" font-weight="400" text-anchor="middle">使用規則</text><text x="28" y="1128" font-size="17" font-weight="400" text-anchor="start">這是案例組織分工示意，不是所有 SOC 的固定編制。Tier 1 與 Tier 3 為平行分工；不是</text><text x="28" y="1160" font-size="17" font-weight="400" text-anchor="start">每則告警都必須進入 Tier 3、重大事件應變或 BCP。SLA、NDA、AUP 是三種平行的治理文</text><text x="28" y="1192" font-size="17" font-weight="400" text-anchor="start">件，不是依序執行的步驟。</text></g></svg>
