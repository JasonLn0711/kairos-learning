<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc" lang="zh"><title id="title">Hash 主要用來建立資料摘要</title><desc id="desc">兩列是平行比較：通常 Hash(A) ≠ Hash(B)。須有可信比較基準，才能有效偵測惡意竄改；不同輸入仍可能碰撞。</desc><rect width="900" height="370" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Hash 主要用來建立資料摘要</text><text x="42" y="112" font-size="20" font-weight="700" text-anchor="start">原始文件 A</text><text x="520" y="112" font-size="20" font-weight="400" text-anchor="start">Hash(A)</text><path d="M440 106h40m-7-6 7 6-7 6" fill="none" stroke="#77867f" stroke-width="2"/><text x="42" y="196" font-size="20" font-weight="700" text-anchor="start">修改後文件 B</text><text x="520" y="196" font-size="20" font-weight="400" text-anchor="start">Hash(B)</text><path d="M440 190h40m-7-6 7 6-7 6" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="288" font-size="17" font-weight="400" text-anchor="start">兩列是平行比較：通常 Hash(A) ≠ Hash(B)。須有可信比較基準，才能有效偵測惡意竄改；</text><text x="28" y="320" font-size="17" font-weight="400" text-anchor="start">不同輸入仍可能碰撞。</text></g></svg>
