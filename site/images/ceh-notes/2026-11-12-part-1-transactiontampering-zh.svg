<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-labelledby="title desc" lang="zh"><title id="title">交易完整性：金額遭未授權修改</title><desc id="desc">左右是原始指示與被竄改內容的比較，並非兩筆已執行交易；金額從NT$10,000變成NT$100,000。</desc><rect width="900" height="354" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">交易完整性：金額遭未授權修改</text><rect x="28.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">客戶原始指示 · NT$10,000</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">轉給指定收款人</text><rect x="456.0" y="88" width="388.0" height="114" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">未授權修改後 · NT$100,000</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">金額被惡意更改</text><text x="28" y="272" font-size="17" font-weight="400" text-anchor="start">左右是原始指示與被竄改內容的比較，並非兩筆已執行交易；金額從NT$10,000變成NT$100,</text><text x="28" y="304" font-size="17" font-weight="400" text-anchor="start">000。</text></g></svg>
