<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 418" role="img" aria-labelledby="title desc" lang="zh"><title id="title">同樣是安全測試，風險並不相同</title><desc id="desc">產業安全要求取決於實際資產與風險，不代表所有IT或OT系統都有相同限制。兩欄比較考量，不表示OT可以忽略資料安全與服務復原。</desc><rect width="900" height="418" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">同樣是安全測試，風險並不相同</text><rect x="28.0" y="88" width="388.0" height="178" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">企業 IT 系統</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">辦公網路、網站、一般應用程式</text><text x="222.0" y="190" font-size="18" font-weight="400" text-anchor="middle">主要考量：服務可用性、資料安全、系統復</text><text x="222.0" y="222" font-size="18" font-weight="400" text-anchor="middle">原</text><rect x="456.0" y="88" width="388.0" height="178" rx="12" fill="#f7f1e9" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">晶圓廠 OT 系統</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">製造設備、控制系統、製程網路</text><text x="650.0" y="190" font-size="18" font-weight="400" text-anchor="middle">額外考量：設備安全、製程穩定、實體損失</text><text x="28" y="336" font-size="17" font-weight="400" text-anchor="start">產業安全要求取決於實際資產與風險，不代表所有IT或OT系統都有相同限制。兩欄比較考量，不</text><text x="28" y="368" font-size="17" font-weight="400" text-anchor="start">表示OT可以忽略資料安全與服務復原。</text></g></svg>
