<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 874" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖3｜TCP Connect 與 SYN Scan：第三個封包的差別</title><desc id="desc">兩欄為平行比較，不是先後執行。每欄箭頭是Client與Server間的探測方向；-sT完成交握，-sS通常用RST結束，不保證避開IDS。</desc><rect width="900" height="874" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖3｜TCP Connect 與 SYN Scan：第三個封包的差別</text><rect x="28" y="88" width="404" height="624" rx="12" fill="#f4f6f8" stroke="#94a3b8"/><text x="46" y="122" font-size="20" font-weight="700" text-anchor="start">TCP Connect Scan</text><text x="46" y="160" font-size="18" font-weight="400" text-anchor="start">Nmap -sT</text><text x="46" y="216" font-size="17" font-weight="400" text-anchor="start">Client</text><text x="338" y="216" font-size="17" font-weight="400" text-anchor="start">Server</text><text x="230" y="260" font-size="20" font-weight="700" text-anchor="middle">SYN</text><path d="M52 292H408m-10-8 10 8-10 8" fill="none" stroke="#245fe8" stroke-width="2"/><text x="46" y="334" font-size="18" font-weight="400" text-anchor="start">Client → Server：建立連線請求。</text><text x="230" y="400" font-size="20" font-weight="700" text-anchor="middle">SYN/ACK</text><path d="M408 432H52m10-8-10 8 10 8" fill="none" stroke="#00856b" stroke-width="2"/><text x="46" y="474" font-size="18" font-weight="400" text-anchor="start">Server → Client：可建立連線。</text><text x="230" y="540" font-size="20" font-weight="700" text-anchor="middle">ACK</text><path d="M52 572H408m-10-8 10 8-10 8" fill="none" stroke="#7739ba" stroke-width="2"/><text x="46" y="614" font-size="18" font-weight="400" text-anchor="start">Client → Server：連線成立，由作業</text><text x="46" y="646" font-size="18" font-weight="400" text-anchor="start">系統執行一般連線建立。</text><rect x="458" y="88" width="404" height="656" rx="12" fill="#f4f6f8" stroke="#94a3b8"/><text x="476" y="122" font-size="20" font-weight="700" text-anchor="start">TCP SYN Scan</text><text x="476" y="160" font-size="18" font-weight="400" text-anchor="start">Nmap -sS</text><text x="476" y="216" font-size="17" font-weight="400" text-anchor="start">Client</text><text x="768" y="216" font-size="17" font-weight="400" text-anchor="start">Server</text><text x="660" y="260" font-size="20" font-weight="700" text-anchor="middle">SYN</text><path d="M482 292H838m-10-8 10 8-10 8" fill="none" stroke="#245fe8" stroke-width="2"/><text x="476" y="334" font-size="18" font-weight="400" text-anchor="start">Client → Server：探測埠狀態。</text><text x="660" y="400" font-size="20" font-weight="700" text-anchor="middle">SYN/ACK</text><path d="M838 432H482m10-8-10 8 10 8" fill="none" stroke="#00856b" stroke-width="2"/><text x="476" y="474" font-size="18" font-weight="400" text-anchor="start">Server → Client：支持 open 判定</text><text x="476" y="506" font-size="18" font-weight="400" text-anchor="start">。</text><text x="660" y="572" font-size="20" font-weight="700" text-anchor="middle">RST</text><path d="M482 604H838m-10-8 10 8-10 8" fill="none" stroke="#7739ba" stroke-width="2"/><text x="476" y="646" font-size="18" font-weight="400" text-anchor="start">Client → Server：通常結束探測，未</text><text x="476" y="678" font-size="18" font-weight="400" text-anchor="start">完成TCP交握。</text><text x="28" y="790" font-size="17" font-weight="400" text-anchor="start">兩欄為平行比較，不是先後執行。每欄箭頭是Client與Server間的探測方向；-sT完成交</text><text x="28" y="822" font-size="17" font-weight="400" text-anchor="start">握，-sS通常用RST結束，不保證避開IDS。</text></g></svg>
