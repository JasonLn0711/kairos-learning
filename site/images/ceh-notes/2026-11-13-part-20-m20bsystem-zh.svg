<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1162" role="img" aria-labelledby="title desc" lang="zh"><title id="title">整合案例：跨國晶片設計協作</title><desc id="desc">箭頭是簡化設計閱讀順序，不是完整協定封包。文件簽章依需求另外使用；儲存、權限與備份持續管理。</desc><rect width="900" height="1162" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="436.0" y="640.0" text-anchor="middle" font-size="16">必要時</text><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">整合案例：跨國晶片設計協作</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">1. 確認合作方身分</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">檢查 PKI 憑證、信任鏈及相關授權</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">2. 建立加密金鑰</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">利用經認證的金鑰建立協定協商共享秘密</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">3. 保護傳輸資料</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">使用適當的對稱加密與認證機制，例如 AES-GCM</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">4. 驗證重要文件</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">必要時另外使用數位簽章，確認文件簽署來源</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">5. 安全儲存與復原</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">加密靜態資料、管理金鑰、備份與權限</text><text x="28" y="1080" font-size="17" font-weight="400" text-anchor="start">箭頭是簡化設計閱讀順序，不是完整協定封包。文件簽章依需求另外使用；儲存、權限與備份持續</text><text x="28" y="1112" font-size="17" font-weight="400" text-anchor="start">管理。</text></g></svg>
