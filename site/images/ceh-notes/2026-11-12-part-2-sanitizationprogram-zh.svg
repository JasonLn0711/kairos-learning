<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1332" role="img" aria-labelledby="title desc" lang="zh"><title id="title">媒體清理治理的六步驟</title><desc id="desc">確認保留義務、執行品質與證據，才可完成結案。</desc><rect width="900" height="1332" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1010V1054.0H436.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">媒體清理治理的六步驟</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">1｜Identify — 辨識</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">確認媒體序號、擁有者、資料類別、敏感度及所有已知資料副本。</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">2｜Authorize — 授權</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">確認資料保存期限、法律義務、Legal Hold（法律保留）及核准人員。</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">3｜Select — 選擇</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">根據媒體技術、敏感程度、復原威脅及再利用需求，決定 Clear、Purge 或 Destroy。</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">4｜Execute — 執行</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">使用核准工具與程序，記錄操作人員、設備識別資訊及執行結果。</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">5｜Verify / Validate — 確認</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">先確認操作是否成功完成，再判斷該結果是否符合資料機密性所需的保護程度。</text><rect x="28.0" y="1098" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">6｜Document — 紀錄與結案</text><text x="436.0" y="1168" font-size="18" font-weight="400" text-anchor="middle">保存清理證明、覆核與核准紀錄，決定媒體可否釋出、再使用或報廢。</text><text x="28" y="1282" font-size="17" font-weight="400" text-anchor="start">確認保留義務、執行品質與證據，才可完成結案。</text></g></svg>
