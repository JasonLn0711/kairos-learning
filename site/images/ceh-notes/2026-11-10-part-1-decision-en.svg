<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="title desc" lang="en"><title id="title">Identify the question, then find decisive clues</title><desc id="desc">The four branches are parallel categories. A real incident can involve several categories; choose according to the main issue asked by a single-answer question.</desc><rect width="900" height="740" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Identify the question, then find decisive clues</text><text x="450" y="90" font-size="20" font-weight="700" text-anchor="middle">What is the question asking?</text><path d="M450 132v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><rect x="28" y="186" width="404" height="146" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="46" y="220" font-size="20" font-weight="700" text-anchor="start">Hacker role</text><text x="46" y="260" font-size="18" font-weight="400" text-anchor="start">Authorization / Permission</text><text x="46" y="292" font-size="18" font-weight="400" text-anchor="start">White hat, grey hat, black hat</text><rect x="458" y="186" width="404" height="178" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="476" y="220" font-size="20" font-weight="700" text-anchor="start">Impact on information</text><text x="476" y="260" font-size="18" font-weight="400" text-anchor="start">Read / Modify / Unavailable</text><text x="476" y="292" font-size="18" font-weight="400" text-anchor="start">Confidentiality, integrity,</text><text x="476" y="324" font-size="18" font-weight="400" text-anchor="start">availability</text><rect x="28" y="388" width="404" height="178" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="46" y="422" font-size="20" font-weight="700" text-anchor="start">Control category</text><text x="46" y="462" font-size="18" font-weight="400" text-anchor="start">Physical / Technical</text><text x="46" y="494" font-size="18" font-weight="400" text-anchor="start">Security guard, firewall and</text><text x="46" y="526" font-size="18" font-weight="400" text-anchor="start">related controls</text><rect x="458" y="388" width="404" height="178" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="476" y="422" font-size="20" font-weight="700" text-anchor="start">Testing purpose</text><text x="476" y="462" font-size="18" font-weight="400" text-anchor="start">Goal / Primary purpose</text><text x="476" y="494" font-size="18" font-weight="400" text-anchor="start">Find vulnerabilities and reduce</text><text x="476" y="526" font-size="18" font-weight="400" text-anchor="start">risk</text><text x="28" y="620" font-size="17" font-weight="400" text-anchor="start">The four branches are parallel categories. A real incident can</text><text x="28" y="652" font-size="17" font-weight="400" text-anchor="start">involve several categories; choose according to the main issue</text><text x="28" y="684" font-size="17" font-weight="400" text-anchor="start">asked by a single-answer question.</text></g></svg>
