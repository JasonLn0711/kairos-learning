<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" role="img" aria-labelledby="title desc" lang="en"><title id="title">Three storage-encryption scopes</title><desc id="desc">These are parallel scopes, not a deployment sequence. Arrows that could imply ordering in the reference are omitted. Classification follows NIST SP 800-111.</desc><rect width="900" height="638" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Three storage-encryption scopes</text><rect x="28" y="88" width="402" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Full disk encryption</text><text x="229.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Protect disk or system-disk data</text><text x="229.0" y="190" font-size="18" font-weight="400" text-anchor="middle">against device loss, theft and</text><text x="229.0" y="222" font-size="18" font-weight="400" text-anchor="middle">offline access</text><rect x="458" y="88" width="402" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Volume / container encryption</text><text x="659.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Protect a partition or virtual</text><text x="659.0" y="190" font-size="18" font-weight="400" text-anchor="middle">disk; once mounted it can be</text><text x="659.0" y="222" font-size="18" font-weight="400" text-anchor="middle">used like a normal disk</text><rect x="28" y="290" width="402" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="322" font-size="20" font-weight="700" text-anchor="middle">File encryption</text><text x="229.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Selectively protect files or</text><text x="229.0" y="392" font-size="18" font-weight="400" text-anchor="middle">folders; this is not full disk</text><text x="229.0" y="424" font-size="18" font-weight="400" text-anchor="middle">encryption</text><text x="28" y="524" font-size="17" font-weight="400" text-anchor="start">These are parallel scopes, not a deployment sequence. Arrows that</text><text x="28" y="556" font-size="17" font-weight="400" text-anchor="start">could imply ordering in the reference are omitted. Classification</text><text x="28" y="588" font-size="17" font-weight="400" text-anchor="start">follows NIST SP 800-111.</text></g></svg>
