<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1066" role="img" aria-labelledby="title desc" lang="zh"><title id="title">從安全測試到降低風險</title><desc id="desc">五個步驟依序連接；修補由負責團隊執行，再以複測驗證改善。單次測試未發現漏洞，不代表系統完全安全。</desc><rect width="900" height="1066" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">從安全測試到降低風險</text><rect x="28" y="90" width="58" height="58" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><text x="57" y="125" font-size="22" font-weight="700" text-anchor="middle">01</text><text x="108" y="118" font-size="20" font-weight="700" text-anchor="start">取得授權</text><text x="108" y="156" font-size="18" font-weight="400" text-anchor="start">確認能測哪些系統及活動</text><path d="M57 200v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><rect x="28" y="274" width="58" height="58" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><text x="57" y="309" font-size="22" font-weight="700" text-anchor="middle">02</text><text x="108" y="302" font-size="20" font-weight="700" text-anchor="start">找出弱點</text><text x="108" y="340" font-size="18" font-weight="400" text-anchor="start">辨識可能的安全漏洞</text><path d="M57 384v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><rect x="28" y="458" width="58" height="58" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><text x="57" y="493" font-size="22" font-weight="700" text-anchor="middle">03</text><text x="108" y="486" font-size="20" font-weight="700" text-anchor="start">驗證影響</text><text x="108" y="524" font-size="18" font-weight="400" text-anchor="start">在限制內確認弱點是否可被利用</text><path d="M57 568v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><rect x="28" y="642" width="58" height="58" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><text x="57" y="677" font-size="22" font-weight="700" text-anchor="middle">04</text><text x="108" y="670" font-size="20" font-weight="700" text-anchor="start">提出報告</text><text x="108" y="708" font-size="18" font-weight="400" text-anchor="start">說明證據、影響與修補建議</text><path d="M57 752v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><rect x="28" y="826" width="58" height="58" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><text x="57" y="861" font-size="22" font-weight="700" text-anchor="middle">05</text><text x="108" y="854" font-size="20" font-weight="700" text-anchor="start">修補與複測</text><text x="108" y="892" font-size="18" font-weight="400" text-anchor="start">由負責團隊修補，再確認改善是否有效</text><text x="28" y="978" font-size="17" font-weight="400" text-anchor="start">五個步驟依序連接；修補由負責團隊執行，再以複測驗證改善。單次測試未發現漏洞，不代表</text><text x="28" y="1010" font-size="17" font-weight="400" text-anchor="start">系統完全安全。</text></g></svg>
