<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1052.1000000000004" role="img" aria-labelledby="title desc" lang="en"><title id="title">Three axes for classifying controls</title><desc id="desc">The axes can describe the same control; they are not sequential steps. A control may serve preventive, detective and other functions at once; the axes are not mutually exclusive.</desc><rect width="900" height="1052.1000000000004" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">Three axes for classifying controls</text><text x="28" y="125.6" font-size="20" font-weight="700">A | Implementation</text><rect x="28.0" y="166.6" width="262.0" height="162.79999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="40.0" y="198.6" font-size="18" font-weight="400">Administrative:</text><text x="40.0" y="228.29999999999998" font-size="18" font-weight="400">policies, rules,</text><text x="40.0" y="258.0" font-size="18" font-weight="400">people and</text><text x="40.0" y="287.7" font-size="18" font-weight="400">procedures</text><rect x="310.0" y="166.6" width="262.0" height="133.1" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="322.0" y="198.6" font-size="18" font-weight="400">Technical: software,</text><text x="322.0" y="228.29999999999998" font-size="18" font-weight="400">systems, networks</text><text x="322.0" y="258.0" font-size="18" font-weight="400">and cryptography</text><rect x="592.0" y="166.6" width="262.0" height="162.79999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="604.0" y="198.6" font-size="18" font-weight="400">Physical: entry</text><text x="604.0" y="228.29999999999998" font-size="18" font-weight="400">controls, guards,</text><text x="604.0" y="258.0" font-size="18" font-weight="400">facilities and</text><text x="604.0" y="287.7" font-size="18" font-weight="400">physical equipment</text><text x="28" y="365.4" font-size="20" font-weight="700">B | Function</text><rect x="28.0" y="406.4" width="398.0" height="103.39999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="40.0" y="438.4" font-size="18" font-weight="400">Preventive: reduce the likelihood</text><text x="40.0" y="468.09999999999997" font-size="18" font-weight="400">of incidents</text><rect x="446.0" y="406.4" width="398.0" height="103.39999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="458.0" y="438.4" font-size="18" font-weight="400">Detective: discover incidents or</text><text x="458.0" y="468.09999999999997" font-size="18" font-weight="400">anomalies</text><rect x="28.0" y="521.8" width="398.0" height="103.40000000000009" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="40.0" y="553.8" font-size="18" font-weight="400">Corrective: fix identified</text><text x="40.0" y="583.5" font-size="18" font-weight="400">problems</text><rect x="446.0" y="521.8" width="398.0" height="103.40000000000009" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="458.0" y="553.8" font-size="18" font-weight="400">Recovery: restore necessary</text><text x="458.0" y="583.5" font-size="18" font-weight="400">capabilities</text><rect x="28.0" y="637.2" width="398.0" height="103.40000000000009" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="40.0" y="669.2" font-size="18" font-weight="400">Deterrent: reduce motivation to</text><text x="40.0" y="698.9000000000001" font-size="18" font-weight="400">act</text><rect x="446.0" y="637.2" width="398.0" height="103.40000000000009" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="458.0" y="669.2" font-size="18" font-weight="400">Compensating: replace or</text><text x="458.0" y="698.9000000000001" font-size="18" font-weight="400">supplement other controls</text><text x="28" y="776.6000000000001" font-size="20" font-weight="700">C | Protection objectives</text><text x="28" y="841.6000000000001" font-size="18" font-weight="400">Confidentiality, integrity and availability (CIA), plus identity,</text><text x="28" y="871.3000000000002" font-size="18" font-weight="400">traceability and privacy requirements where applicable.</text><text x="28" y="943.0000000000002" font-size="18" font-weight="400">The axes can describe the same control; they are not sequential steps.</text><text x="28" y="972.7000000000003" font-size="18" font-weight="400">A control may serve preventive, detective and other functions at once;</text><text x="28" y="1002.4000000000003" font-size="18" font-weight="400">the axes are not mutually exclusive.</text></g></svg>
