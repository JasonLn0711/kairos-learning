<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1198" role="img" aria-labelledby="title desc" lang="zh"><title id="title">主動回憶卡（Active Recall）</title><desc id="desc">先在心裡作答，再翻開答案。卡片顯示與翻面只協助複習，不代表已理解或通過考試。</desc><rect width="900" height="1198" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">主動回憶卡（Active Recall）</text><rect x="28" y="84" width="844" height="328" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="108" font-size="16" font-weight="400" text-anchor="middle">1 / 3</text><text x="450" y="148" font-size="20" font-weight="400" text-anchor="middle">什麼條件讓滲透測試成為合乎規範的白帽行為？</text><text x="42" y="192" font-size="16" font-weight="400" text-anchor="start">對應：EC-Q001、EC-Q054、P3-Q124、EC-Q166、EC-Q189、EC-Q331、EC-Q476</text><text x="42" y="232" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="268" font-size="18" font-weight="400" text-anchor="start">先取得具有權限者的有效授權，明確約定測試目標、時段、方法限制與通報方式；在 Scope 與</text><text x="42" y="300" font-size="18" font-weight="400" text-anchor="start">ROE 內執行。</text><text x="42" y="336" font-size="18" font-weight="400" text-anchor="start">目標是識別、驗證漏洞並協助降低風險，留下報告與修補建議，再依約定複測。發現範圍外目標時</text><text x="42" y="368" font-size="18" font-weight="400" text-anchor="start">，先停止該目標的主動測試，請求擴充授權。</text><rect x="28" y="438" width="844" height="296" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="462" font-size="16" font-weight="400" text-anchor="middle">2 / 3</text><text x="450" y="502" font-size="20" font-weight="400" text-anchor="middle">病歷被偷看、血型被改壞、掛號系統無法使用，各影響 CIA 的哪一項？</text><text x="42" y="546" font-size="16" font-weight="400" text-anchor="start">對應：P1-Q003</text><text x="42" y="586" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="622" font-size="18" font-weight="400" text-anchor="start">未授權者偷看病歷：保密性（Confidentiality）。血型從 A 型被擅改為 B 型：完整性（</text><text x="42" y="654" font-size="18" font-weight="400" text-anchor="start">Integrity）。掛號系統因阻斷服務無法使用：可用性（Availability）。</text><text x="42" y="690" font-size="18" font-weight="400" text-anchor="start">不可否認性關注行為證據與可歸責性，不是資料遭偷看最直接對應的目標。</text><rect x="28" y="760" width="844" height="328" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="784" font-size="16" font-weight="400" text-anchor="middle">3 / 3</text><text x="450" y="824" font-size="20" font-weight="400" text-anchor="middle">為什麼有防火牆與加密，仍然需要保全和門禁？</text><text x="42" y="868" font-size="16" font-weight="400" text-anchor="start">對應：P3-Q113</text><text x="42" y="908" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="944" font-size="18" font-weight="400" text-anchor="start">保全與門禁保護實際場所和設備，屬於實體安全控制；防火牆與加密屬於技術控制；政策、授權程</text><text x="42" y="976" font-size="18" font-weight="400" text-anchor="start">序與訓練屬於管理控制。</text><text x="42" y="1012" font-size="18" font-weight="400" text-anchor="start">縱深防禦讓多種控制相互補強，涵蓋機房、人員、系統、資料及事件應變；任何單一控制都不能保</text><text x="42" y="1044" font-size="18" font-weight="400" text-anchor="start">證完全阻止攻擊。</text><text x="28" y="1150" font-size="17" font-weight="400" text-anchor="start">先在心裡作答，再翻開答案。卡片顯示與翻面只協助複習，不代表已理解或通過考試。</text></g></svg>
