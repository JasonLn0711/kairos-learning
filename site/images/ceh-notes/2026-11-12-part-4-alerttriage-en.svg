<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1258" role="img" aria-labelledby="title desc" lang="en"><title id="title">From security signals to incident determination and escalation when needed</title><desc id="desc">Incident Determination uses predefined criteria to decide whether to declare an incident. An anomaly or alert alone does not establish a confirmed incident. Subsequent action follows severity and response authority.</desc><rect width="900" height="1258" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 234V278.0H436.0V322m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 436V480.0H436.0V524m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 638V682.0H436.0V726m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 840V884.0H436.0V928m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">From security signals to incident determination and escalation</text><text x="28" y="72" font-size="22" font-weight="700" text-anchor="start">when needed</text><rect x="28.0" y="120" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="152" font-size="20" font-weight="700" text-anchor="middle">Telemetry / Logs</text><text x="436.0" y="190" font-size="18" font-weight="400" text-anchor="middle">Receive login time, source, account and endpoint information</text><rect x="28.0" y="322" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="354" font-size="20" font-weight="700" text-anchor="middle">Alert</text><text x="436.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Rules or analytics flag suspicious activity</text><rect x="28.0" y="524" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="556" font-size="20" font-weight="700" text-anchor="middle">Triage</text><text x="436.0" y="594" font-size="18" font-weight="400" text-anchor="middle">Compare authorized changes, account behavior and other logs</text><rect x="28.0" y="726" width="816.0" height="114" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="436.0" y="758" font-size="20" font-weight="700" text-anchor="middle">Incident Determination</text><text x="436.0" y="796" font-size="18" font-weight="400" text-anchor="middle">Use predefined criteria to decide whether to declare an incident</text><rect x="28.0" y="928" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="960" font-size="20" font-weight="700" text-anchor="middle">Escalation / Response</text><text x="436.0" y="998" font-size="18" font-weight="400" text-anchor="middle">Notify appropriate personnel and act according to incident severity</text><text x="28" y="1112" font-size="17" font-weight="400" text-anchor="start">Incident Determination uses predefined criteria to decide whether to</text><text x="28" y="1144" font-size="17" font-weight="400" text-anchor="start">declare an incident. An anomaly or alert alone does not establish a</text><text x="28" y="1176" font-size="17" font-weight="400" text-anchor="start">confirmed incident. Subsequent action follows severity and response</text><text x="28" y="1208" font-size="17" font-weight="400" text-anchor="start">authority.</text></g></svg>
