<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 873.9000000000002" role="img" aria-labelledby="title desc" lang="zh"><title id="title">控制措施的三個分類軸</title><desc id="desc">三個軸可同時描述同一項控制，彼此不是先後步驟。 一項控制可能同時具有預防、偵測及其他作用；這些軸不是互斥分類。</desc><rect width="900" height="873.9000000000002" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">控制措施的三個分類軸</text><text x="28" y="125.6" font-size="20" font-weight="700">A｜實作形式</text><rect x="28.0" y="166.6" width="262.0" height="103.4" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="40.0" y="198.6" font-size="18" font-weight="400">Administrative：政策、</text><text x="40.0" y="228.29999999999998" font-size="18" font-weight="400">制度、人員與程序</text><rect x="310.0" y="166.6" width="262.0" height="103.4" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="322.0" y="198.6" font-size="18" font-weight="400">Technical：軟體、系統、</text><text x="322.0" y="228.29999999999998" font-size="18" font-weight="400">網路與密碼學</text><rect x="592.0" y="166.6" width="262.0" height="103.4" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="604.0" y="198.6" font-size="18" font-weight="400">Physical：門禁、保全、機</text><text x="604.0" y="228.29999999999998" font-size="18" font-weight="400">房與實體設備</text><text x="28" y="306.0" font-size="20" font-weight="700">B｜控制功能</text><rect x="28.0" y="347.0" width="398.0" height="73.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="40.0" y="379.0" font-size="18" font-weight="400">Preventive｜預防：降低事件發生機會</text><rect x="446.0" y="347.0" width="398.0" height="73.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="458.0" y="379.0" font-size="18" font-weight="400">Detective｜偵測：發現事件或異常</text><rect x="28.0" y="432.7" width="398.0" height="73.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="40.0" y="464.7" font-size="18" font-weight="400">Corrective｜矯正：修正已發現的問題</text><rect x="446.0" y="432.7" width="398.0" height="73.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="458.0" y="464.7" font-size="18" font-weight="400">Recovery｜復原：恢復必要能力</text><rect x="28.0" y="518.4" width="398.0" height="73.70000000000005" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="40.0" y="550.4" font-size="18" font-weight="400">Deterrent｜嚇阻：降低行為動機</text><rect x="446.0" y="518.4" width="398.0" height="73.70000000000005" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="458.0" y="550.4" font-size="18" font-weight="400">Compensating｜補償：替代或補足其他控制</text><text x="28" y="628.1" font-size="20" font-weight="700">C｜保護目標</text><text x="28" y="693.1" font-size="18" font-weight="400">Confidentiality（機密性）、Integrity（完整性）、Availability（可用性），以及適</text><text x="28" y="722.8000000000001" font-size="18" font-weight="400">用情境下的身分、可追溯性和隱私等要求。</text><text x="28" y="794.5000000000001" font-size="18" font-weight="400">三個軸可同時描述同一項控制，彼此不是先後步驟。 一項控制可能同時具有預防、偵測及其他作用</text><text x="28" y="824.2000000000002" font-size="18" font-weight="400">；這些軸不是互斥分類。</text></g></svg>
