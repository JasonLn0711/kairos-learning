<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 6｜檔案目錄與授權範圍</title><desc id="desc">reports 與 config 同在 /srv/app/ 下，是平行目錄。未妥善限制路徑時，../config/settings.yaml 可能跳出 reports；實際存取仍受程式邏輯與檔案權限限制。</desc><rect width="900" height="736" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 6｜檔案目錄與授權範圍</text><path d="M3 7V5h6l3 3h9v12H3V7Zm0 3h18" transform="translate(42 90)" fill="none" stroke="#657079" stroke-width="1.8"/><text x="78" y="112" font-size="20" font-weight="700" text-anchor="start">/srv/app/</text><text x="78" y="146" font-size="18" font-weight="400" text-anchor="start">應用程式目錄</text><path d="M3 7V5h6l3 3h9v12H3V7Zm0 3h18" transform="translate(82 196)" fill="none" stroke="#657079" stroke-width="1.8"/><text x="118" y="218" font-size="20" font-weight="700" text-anchor="start">reports/</text><text x="118" y="252" font-size="18" font-weight="400" text-anchor="start">預期的下載範圍</text><path d="M6 3h8l4 4v14H6V3Zm3 8h6m-6 4h6" transform="translate(122 302)" fill="none" stroke="#657079" stroke-width="1.8"/><text x="158" y="324" font-size="20" font-weight="700" text-anchor="start">report.pdf</text><text x="158" y="358" font-size="18" font-weight="400" text-anchor="start">預期可下載</text><path d="M3 7V5h6l3 3h9v12H3V7Zm0 3h18" transform="translate(82 408)" fill="none" stroke="#657079" stroke-width="1.8"/><text x="118" y="430" font-size="20" font-weight="700" text-anchor="start">config/</text><text x="118" y="464" font-size="18" font-weight="400" text-anchor="start">與 reports 同層的設定目錄</text><path d="M6 3h8l4 4v14H6V3Zm3 8h6m-6 4h6" transform="translate(122 514)" fill="none" stroke="#657079" stroke-width="1.8"/><path d="M10 11v-1a2 2 0 0 1 4 0v1m-5 0h6v6H9v-6Z" transform="translate(122 514)" fill="none" stroke="#657079" stroke-width="1.4"/><text x="158" y="536" font-size="20" font-weight="700" text-anchor="start">settings.yaml</text><text x="158" y="570" font-size="18" font-weight="400" text-anchor="start">不應公開</text><text x="28" y="652" font-size="17" font-weight="400" text-anchor="start">reports 與 config 同在 /srv/app/ 下，是平行目錄。未妥善限制路徑時，../</text><text x="28" y="684" font-size="17" font-weight="400" text-anchor="start">config/settings.yaml 可能跳出 reports；實際存取仍受程式邏輯與檔案權限限制。</text></g></svg>
