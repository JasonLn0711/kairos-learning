<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1092" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 13｜正常登入與 CSRF 誘發請求的時序</title><desc id="desc">寬版三條虛線是角色生命線，實線箭頭表示五步互動；窄版改為五筆具名起訖，保留方向與順序。Cookie 未直接交給惡意網頁。第4步假設 Cookie 政策允許傳送，第5步由伺服器驗證後接受或拒絕，不代表必然成功。</desc><rect width="900" height="1092" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 13｜正常登入與 CSRF 誘發請求的時序</text><rect x="18" y="88" width="244" height="64" rx="12" fill="#e8ecef" stroke="#d8dce0"/><text x="140" y="128" font-size="20" font-weight="700" text-anchor="middle">惡意網頁</text><rect x="328" y="88" width="244" height="64" rx="12" fill="#e8ecef" stroke="#d8dce0"/><text x="450" y="128" font-size="20" font-weight="700" text-anchor="middle">Alice Browser</text><rect x="638" y="88" width="244" height="64" rx="12" fill="#e8ecef" stroke="#d8dce0"/><text x="760" y="128" font-size="20" font-weight="700" text-anchor="middle">銀行 Server</text><path d="M140 152V876" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 10"/><path d="M450 152V876" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 10"/><path d="M760 152V876" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 10"/><g fill="#008c83"><text x="605.0" y="194" font-size="20" font-weight="700" text-anchor="middle">① 正常登入</text></g><text x="605.0" y="228" font-size="16" font-weight="400" text-anchor="middle">Alice Browser → 銀行 Server</text><path d="M450 266H760m-10-8 10 8-10 8" fill="none" stroke="#008c83" stroke-width="2"/><g fill="#008c83"><text x="605.0" y="324" font-size="20" font-weight="700" text-anchor="middle">② Set-Cookie</text></g><text x="605.0" y="358" font-size="16" font-weight="400" text-anchor="middle">銀行 Server → Alice Browser</text><path d="M760 396H450m10-8-10 8 10 8" fill="none" stroke="#008c83" stroke-width="2"/><g fill="#b96500"><text x="295.0" y="454" font-size="20" font-weight="700" text-anchor="middle">③ 誘發請求</text></g><text x="295.0" y="488" font-size="16" font-weight="400" text-anchor="middle">惡意網頁 → Alice Browser</text><path d="M140 526H450m-10-8 10 8-10 8" fill="none" stroke="#b96500" stroke-width="2"/><g fill="#b52323"><text x="605.0" y="584" font-size="20" font-weight="700" text-anchor="middle">④ Browser 附 Cookie，請求銀行</text><text x="605.0" y="616" font-size="20" font-weight="700" text-anchor="middle">操作</text></g><text x="605.0" y="650" font-size="16" font-weight="400" text-anchor="middle">Alice Browser → 銀行 Server</text><path d="M450 688H760m-10-8 10 8-10 8" fill="none" stroke="#b52323" stroke-width="2"/><g fill="#657079"><text x="605.0" y="746" font-size="20" font-weight="700" text-anchor="middle">⑤ Server 判斷</text></g><text x="605.0" y="780" font-size="16" font-weight="400" text-anchor="middle">銀行 Server → Alice Browser</text><path d="M760 818H450m10-8-10 8 10 8" fill="none" stroke="#657079" stroke-width="2"/><text x="450" y="896" font-size="20" font-weight="700" text-anchor="middle">Cookie 未直接交給惡意網頁</text><text x="28" y="976" font-size="17" font-weight="400" text-anchor="start">寬版三條虛線是角色生命線，實線箭頭表示五步互動；窄版改為五筆具名起訖，保留方向與順序</text><text x="28" y="1008" font-size="17" font-weight="400" text-anchor="start">。Cookie 未直接交給惡意網頁。第4步假設 Cookie 政策允許傳送，第5步由伺服器驗證後</text><text x="28" y="1040" font-size="17" font-weight="400" text-anchor="start">接受或拒絕，不代表必然成功。</text></g></svg>
