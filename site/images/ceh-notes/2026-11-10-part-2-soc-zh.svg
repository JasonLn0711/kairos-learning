<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1364" role="img" aria-labelledby="title desc" lang="zh"><title id="title">SOC 常見的事件分流程序</title><desc id="desc">「否」可記錄、結案或觀察；「是」進入 Tier 2，必要時升級 Tier 3。重大事件可由 Tier 2 或 Tier 3 啟動應變指揮。實際編制也可能使用自動化平台或 MDR。</desc><rect width="900" height="1364" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H222.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="640.0" text-anchor="middle" font-size="16">否</text><path d="M436.0 606V650.0H650.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="640.0" text-anchor="middle" font-size="16">是</text><path d="M650.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="842.0" text-anchor="middle" font-size="16">必要時</text><path d="M844.0 751.0H875V1070H436.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1010V1054.0H436.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">SOC 常見的事件分流程序</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">SIEM／EDR 偵測到警報</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">進入事件分流</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Tier 1 初步確認與分級</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">核對警報與升級條件</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">是否有足夠跡象需要進一步調查？</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">依證據選擇分支</text><rect x="28.0" y="694" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="726" font-size="20" font-weight="700" text-anchor="middle">記錄、結案或持續觀察</text><text x="222.0" y="764" font-size="18" font-weight="400" text-anchor="middle">證據不足時保留紀錄與後續觀察</text><rect x="456.0" y="694" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Tier 2 深入調查與處置</text><text x="650.0" y="764" font-size="18" font-weight="400" text-anchor="middle">調查證據並協助處置</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">必要時升級 Tier 3</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">進階分析／Threat Hunting</text><rect x="28.0" y="1098" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">重大事件啟動事件應變指揮</text><text x="436.0" y="1168" font-size="18" font-weight="400" text-anchor="middle">統一協調、決策與通訊</text><text x="28" y="1282" font-size="17" font-weight="400" text-anchor="start">「否」可記錄、結案或觀察；「是」進入 Tier 2，必要時升級 Tier 3。重大事件可由 Tier</text><text x="28" y="1314" font-size="17" font-weight="400" text-anchor="start">2 或 Tier 3 啟動應變指揮。實際編制也可能使用自動化平台或 MDR。</text></g></svg>
