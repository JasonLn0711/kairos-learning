<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 776" role="img" aria-labelledby="title desc" lang="en"><title id="title">Fictional example: penetration-testing agreement</title><desc id="desc">192.0.2.0/24 is reserved for documentation and teaching. The neighboring 192.0.2.11 does not automatically enter the authorized scope.</desc><rect width="900" height="776" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Fictional example: penetration-testing agreement</text><text x="42" y="116" font-size="18" font-weight="700" text-anchor="start">Scope</text><text x="332" y="116" font-size="18" font-weight="400" text-anchor="start">The 192.0.2.10 server</text><path d="M28 160H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="204" font-size="18" font-weight="700" text-anchor="start">Testing time</text><text x="332" y="204" font-size="18" font-weight="400" text-anchor="start">Saturday, 10:00–14:00</text><path d="M28 248H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="292" font-size="18" font-weight="700" text-anchor="start">Permitted methods</text><text x="332" y="292" font-size="18" font-weight="400" text-anchor="start">The specified security-verification</text><text x="332" y="324" font-size="18" font-weight="400" text-anchor="start">activities</text><path d="M28 368H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="412" font-size="18" font-weight="700" text-anchor="start">Prohibited</text><text x="42" y="444" font-size="18" font-weight="700" text-anchor="start">activities</text><text x="332" y="412" font-size="18" font-weight="400" text-anchor="start">DoS, unauthorized data deletion and</text><text x="332" y="444" font-size="18" font-weight="400" text-anchor="start">out-of-scope access</text><path d="M28 488H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="532" font-size="18" font-weight="700" text-anchor="start">Incident reporting</text><text x="332" y="532" font-size="18" font-weight="400" text-anchor="start">Immediately report system abnormalities</text><text x="332" y="564" font-size="18" font-weight="400" text-anchor="start">to the designated contact</text><path d="M28 608H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="28" y="656" font-size="17" font-weight="400" text-anchor="start">192.0.2.0/24 is reserved for documentation and teaching. The</text><text x="28" y="688" font-size="17" font-weight="400" text-anchor="start">neighboring 192.0.2.11 does not automatically enter the authorized</text><text x="28" y="720" font-size="17" font-weight="400" text-anchor="start">scope.</text></g></svg>
