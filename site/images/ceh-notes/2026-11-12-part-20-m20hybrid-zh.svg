<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" role="img" aria-labelledby="title desc" lang="zh"><title id="title">混合式密碼學的兩個階段</title><desc id="desc">箭頭表示本例的階段順序；實際協定另需規定認證、金鑰衍生與 nonce 管理。</desc><rect width="900" height="524" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">混合式密碼學的兩個階段</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">階段一｜建立共享秘密</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">利用適當公開金鑰機制、身分驗證與金鑰衍生，建立工作階段對稱金鑰。</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">階段二｜大量資料加密</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">使用已建立的對稱金鑰，以 AES-GCM 等機制保護後續資料。</text><text x="28" y="474" font-size="17" font-weight="400" text-anchor="start">箭頭表示本例的階段順序；實際協定另需規定認證、金鑰衍生與 nonce 管理。</text></g></svg>
