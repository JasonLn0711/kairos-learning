<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" role="img" aria-labelledby="title desc" lang="zh"><title id="title">NIST AES 五個決選演算法</title><desc id="desc">五者為平行候選。2000 年 NIST 選出 Rijndael，後來標準化為 AES；只有共同參數無法唯一辨識候選者。</desc><rect width="900" height="556" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">NIST AES 五個決選演算法</text><rect x="28.0" y="88" width="245.33333333333334" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="150.66666666666669" y="120" font-size="20" font-weight="700" text-anchor="middle">MARS</text><text x="150.66666666666669" y="158" font-size="18" font-weight="400" text-anchor="middle">AES 決選者</text><rect x="313.33333333333337" y="88" width="245.33333333333334" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.00000000000006" y="120" font-size="20" font-weight="700" text-anchor="middle">RC6</text><text x="436.00000000000006" y="158" font-size="18" font-weight="400" text-anchor="middle">AES 決選者</text><rect x="598.6666666666667" y="88" width="245.33333333333334" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="721.3333333333334" y="120" font-size="20" font-weight="700" text-anchor="middle">Rijndael</text><text x="721.3333333333334" y="158" font-size="18" font-weight="400" text-anchor="middle">獲選為 AES</text><rect x="28.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Serpent</text><text x="222.0" y="360" font-size="18" font-weight="400" text-anchor="middle">AES 決選者</text><rect x="456.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Twofish</text><text x="650.0" y="360" font-size="18" font-weight="400" text-anchor="middle">AES 決選者</text><text x="28" y="474" font-size="17" font-weight="400" text-anchor="start">五者為平行候選。2000 年 NIST 選出 Rijndael，後來標準化為 AES；只有共同參數無法唯</text><text x="28" y="506" font-size="17" font-weight="400" text-anchor="start">一辨識候選者。</text></g></svg>
