<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621.1" role="img" aria-labelledby="title desc" lang="zh"><title id="title">IT／OT 防火牆邊界</title><desc id="desc">只有核准且符合政策的流量能通過；Deny 表示阻擋。</desc><rect width="900" height="621.1" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">IT／OT 防火牆邊界</text><rect x="28" y="101.6" width="268" height="146.39999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="135.6" font-size="20" font-weight="700">IT 網路</text><text x="46" y="174.6" font-size="18" font-weight="400">企業辦公端點與一般資訊系</text><text x="46" y="204.29999999999998" font-size="18" font-weight="400">統。</text><rect x="316" y="101.6" width="268" height="116.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="334" y="135.6" font-size="20" font-weight="700">防火牆</text><text x="334" y="174.6" font-size="18" font-weight="400">檢查來源、目的與服務規則</text><rect x="604" y="101.6" width="268" height="146.39999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="622" y="135.6" font-size="20" font-weight="700">OT 網路</text><text x="622" y="174.6" font-size="18" font-weight="400">製造設備與工廠作業控制系</text><text x="622" y="204.29999999999998" font-size="18" font-weight="400">統。</text><path d="M306 141.6L318 141.6m-7 -7 7 7-7 7" fill="none" stroke="#557363" stroke-width="2"/><path d="M594 141.6L606 141.6m-7 -7 7 7-7 7" fill="none" stroke="#557363" stroke-width="2"/><rect x="28" y="278.0" width="844" height="116.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="312.0" font-size="20" font-weight="700">Allow｜核准管理</text><text x="46" y="351.0" font-size="18" font-weight="400">符合規則的管理連線允許通過。</text><rect x="28" y="412.7" width="844" height="116.69999999999999" rx="12" fill="#fff1f0" stroke="#adc8bc"/><text x="46" y="446.7" font-size="20" font-weight="700">Deny｜未授權直連</text><text x="46" y="485.7" font-size="18" font-weight="400">阻擋未經核准的直接連線。</text><text x="28" y="571.4" font-size="18" font-weight="400">只有核准且符合政策的流量能通過；Deny 表示阻擋。</text></g></svg>
