<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2808" role="img" aria-labelledby="title desc" lang="en"><title id="title">Eight active-recall cards</title><desc id="desc">Answer before revealing explanations. Viewing an answer does not establish learning; this page does not record personal progress.</desc><rect width="900" height="2808" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Eight active-recall cards</text><rect x="28" y="84" width="844" height="292" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="108" font-size="16" font-weight="400" text-anchor="middle">1 / 8</text><text x="450" y="148" font-size="20" font-weight="400" text-anchor="middle">Is attack-tool ability the main difference between white and</text><text x="450" y="180" font-size="20" font-weight="400" text-anchor="middle">black hats?</text><text x="42" y="224" font-size="16" font-weight="400" text-anchor="start">References: EC-Q535</text><text x="42" y="264" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="300" font-size="18" font-weight="400" text-anchor="start">No. The same tools can be used with different authorization, purpose</text><text x="42" y="332" font-size="18" font-weight="400" text-anchor="start">and conduct. First check valid permission and boundaries.</text><rect x="28" y="402" width="844" height="292" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="426" font-size="16" font-weight="400" text-anchor="middle">2 / 8</text><text x="450" y="466" font-size="20" font-weight="400" text-anchor="middle">How do ISO/IEC 27001, 27002 and 27005 differ?</text><text x="42" y="510" font-size="16" font-weight="400" text-anchor="start">References: P1-Q063</text><text x="42" y="550" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="586" font-size="18" font-weight="400" text-anchor="start">27001 specifies ISMS requirements, 27002 gives control guidance and</text><text x="42" y="618" font-size="18" font-weight="400" text-anchor="start">27005 gives risk-management guidance. The latter two support the</text><text x="42" y="650" font-size="18" font-weight="400" text-anchor="start">first, without a fixed mandatory sequence.</text><rect x="28" y="720" width="844" height="292" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="744" font-size="16" font-weight="400" text-anchor="middle">3 / 8</text><text x="450" y="784" font-size="20" font-weight="400" text-anchor="middle">Who initially triages an alert, and which plan supports</text><text x="450" y="816" font-size="20" font-weight="400" text-anchor="middle">service during a hospital disaster?</text><text x="42" y="860" font-size="16" font-weight="400" text-anchor="start">References: P3-Q086、P3-Q088</text><text x="42" y="900" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="936" font-size="18" font-weight="400" text-anchor="start">Typically Tier 1 monitors and triages initially. A BCP maintains</text><text x="42" y="968" font-size="18" font-weight="400" text-anchor="start">essential business and works with the DRP and IRP.</text><rect x="28" y="1038" width="844" height="292" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1062" font-size="16" font-weight="400" text-anchor="middle">4 / 8</text><text x="450" y="1102" font-size="20" font-weight="400" text-anchor="middle">Why is ordinary deletion not automatically purge?</text><text x="42" y="1146" font-size="16" font-weight="400" text-anchor="start">References: P3-Q110</text><text x="42" y="1186" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="1222" font-size="18" font-weight="400" text-anchor="start">Deletion may remove only references. Purge needs a suitable</text><text x="42" y="1254" font-size="18" font-weight="400" text-anchor="start">device-specific method and verification that advanced laboratory</text><text x="42" y="1286" font-size="18" font-weight="400" text-anchor="start">recovery of target data is infeasible.</text><rect x="28" y="1356" width="844" height="260" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1380" font-size="16" font-weight="400" text-anchor="middle">5 / 8</text><text x="450" y="1420" font-size="20" font-weight="400" text-anchor="middle">What do Blowfish’s 64-bit and 448-bit values describe?</text><text x="42" y="1464" font-size="16" font-weight="400" text-anchor="start">References: EC-Q284</text><text x="42" y="1504" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="1540" font-size="18" font-weight="400" text-anchor="start">64 bits is block size; 448 bits is the supported maximum key length.</text><text x="42" y="1572" font-size="18" font-weight="400" text-anchor="start">Increasing the key does not enlarge the block.</text><rect x="28" y="1642" width="844" height="356" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1666" font-size="16" font-weight="400" text-anchor="middle">6 / 8</text><text x="450" y="1706" font-size="20" font-weight="400" text-anchor="middle">Why does modern TLS often combine asymmetric and symmetric</text><text x="450" y="1738" font-size="20" font-weight="400" text-anchor="middle">cryptography?</text><text x="42" y="1782" font-size="16" font-weight="400" text-anchor="start">References: EC-Q032</text><text x="42" y="1822" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="1858" font-size="18" font-weight="400" text-anchor="start">A certificate-based ECDHE connection uses public-key mechanisms for</text><text x="42" y="1890" font-size="18" font-weight="400" text-anchor="start">secret establishment and authentication, a KDF for keys, and</text><text x="42" y="1922" font-size="18" font-weight="400" text-anchor="start">symmetric AEAD for bulk data. Correct peer validation is still</text><text x="42" y="1954" font-size="18" font-weight="400" text-anchor="start">required.</text><rect x="28" y="2024" width="844" height="324" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="2048" font-size="16" font-weight="400" text-anchor="middle">7 / 8</text><text x="450" y="2088" font-size="20" font-weight="400" text-anchor="middle">Why can an ordinary SHA-256 digest not alone prove absence of</text><text x="450" y="2120" font-size="20" font-weight="400" text-anchor="middle">malicious modification?</text><text x="42" y="2164" font-size="16" font-weight="400" text-anchor="start">References: P3-Q074</text><text x="42" y="2204" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="2240" font-size="18" font-weight="400" text-anchor="start">If an attacker replaces both data and digest, comparison can still</text><text x="42" y="2272" font-size="18" font-weight="400" text-anchor="start">match. Use a trusted reference digest or suitable authentication such</text><text x="42" y="2304" font-size="18" font-weight="400" text-anchor="start">as a MAC or signature.</text><rect x="28" y="2374" width="844" height="292" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="2398" font-size="16" font-weight="400" text-anchor="middle">8 / 8</text><text x="450" y="2438" font-size="20" font-weight="400" text-anchor="middle">How do a CA and browser differ in PKI?</text><text x="42" y="2482" font-size="16" font-weight="400" text-anchor="start">References: P3-Q121</text><text x="42" y="2522" font-size="18" font-weight="700" text-anchor="start">Reference answer</text><text x="42" y="2558" font-size="18" font-weight="400" text-anchor="start">A CA validates applications under policy and issues certificates. A</text><text x="42" y="2590" font-size="18" font-weight="400" text-anchor="start">browser validates the chain, name, validity and related conditions</text><text x="42" y="2622" font-size="18" font-weight="400" text-anchor="start">under its connection trust policy.</text><text x="28" y="2728" font-size="17" font-weight="400" text-anchor="start">Answer before revealing explanations. Viewing an answer does not</text><text x="28" y="2760" font-size="17" font-weight="400" text-anchor="start">establish learning; this page does not record personal progress.</text></g></svg>
