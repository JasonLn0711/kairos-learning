<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc" lang="zh"><title id="title">滲透測試的基本流程</title><desc id="desc">向下箭頭表示作業順序：先確認有效授權與範圍，再測試並追蹤改善；不表示取得授權後可以任意測試。</desc><rect width="900" height="690" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">滲透測試的基本流程</text><text x="450" y="100" font-size="20" font-weight="700" text-anchor="middle">取得有效授權</text><text x="450" y="134" font-size="18" font-weight="400" text-anchor="middle">誰有權同意測試？</text><path d="M450 169v20m-5-5 5 5 5-5" fill="none" stroke="#657079" stroke-width="2"/><text x="450" y="236" font-size="20" font-weight="700" text-anchor="middle">定義 Scope 與 ROE</text><text x="450" y="270" font-size="18" font-weight="400" text-anchor="middle">測什麼？何時測？哪些方法禁止？</text><path d="M450 305v20m-5-5 5 5 5-5" fill="none" stroke="#657079" stroke-width="2"/><text x="450" y="372" font-size="20" font-weight="700" text-anchor="middle">在授權範圍內測試</text><text x="450" y="406" font-size="18" font-weight="400" text-anchor="middle">識別漏洞，控制影響，保留必要證據</text><path d="M450 441v20m-5-5 5 5 5-5" fill="none" stroke="#657079" stroke-width="2"/><text x="450" y="508" font-size="20" font-weight="700" text-anchor="middle">報告、修補、複測</text><text x="450" y="542" font-size="18" font-weight="400" text-anchor="middle">證明風險，追蹤改善效果</text><text x="28" y="610" font-size="17" font-weight="400" text-anchor="start">向下箭頭表示作業順序：先確認有效授權與範圍，再測試並追蹤改善；不表示取得授權後可以任意</text><text x="28" y="642" font-size="17" font-weight="400" text-anchor="start">測試。</text></g></svg>
