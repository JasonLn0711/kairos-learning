<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 856" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 16｜具有 CSRF Token 防護的請求流程</title><desc id="desc">五步依序進行；任何必要驗證不符就停止，不會因為只有有效 Session 而執行交易。此為同步器 Token 模式的概念流程，Token不直接證明人的真實意圖。</desc><rect width="900" height="856" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 16｜具有 CSRF Token 防護的請求流程</text><text x="42" y="112" font-size="22" font-weight="700" text-anchor="start">1</text><text x="88" y="112" font-size="20" font-weight="700" text-anchor="start">Alice 開啟銀行轉帳頁面</text><text x="88" y="150" font-size="18" font-weight="400" text-anchor="start">Browser 附帶 Session Cookie，Server 確認 Alice 已登入。</text><path d="M54 132V194" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="42" y="236" font-size="22" font-weight="700" text-anchor="start">2</text><text x="88" y="236" font-size="20" font-weight="700" text-anchor="start">Server 提供合法的 CSRF Token</text><text x="88" y="274" font-size="18" font-weight="400" text-anchor="start">Token 可以由 Server 隨機產生，並與 Alice 的 Session 建立關聯。</text><path d="M54 256V318" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="42" y="360" font-size="22" font-weight="700" text-anchor="start">3</text><text x="88" y="360" font-size="20" font-weight="700" text-anchor="start">Alice 透過銀行頁面提交轉帳表單</text><text x="88" y="398" font-size="18" font-weight="400" text-anchor="start">表單包含轉帳資料和 CSRF Token，Browser 同時依 Cookie 規則傳送</text><text x="88" y="430" font-size="18" font-weight="400" text-anchor="start">Session Cookie。</text><path d="M54 380V474" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="42" y="516" font-size="22" font-weight="700" text-anchor="start">4</text><text x="88" y="516" font-size="20" font-weight="700" text-anchor="start">Server 逐項驗證</text><text x="88" y="554" font-size="18" font-weight="400" text-anchor="start">檢查 Session、使用者權限、CSRF Token、交易內容，以及其他交易安全控制。</text><path d="M54 536V598" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="42" y="640" font-size="22" font-weight="700" text-anchor="start">5</text><text x="88" y="640" font-size="20" font-weight="700" text-anchor="start">所有條件符合才執行</text><text x="88" y="678" font-size="18" font-weight="400" text-anchor="start">缺少 CSRF Token 或驗證不符，就拒絕該請求。</text><text x="28" y="772" font-size="17" font-weight="400" text-anchor="start">五步依序進行；任何必要驗證不符就停止，不會因為只有有效 Session 而執行交易。此為同</text><text x="28" y="804" font-size="17" font-weight="400" text-anchor="start">步器 Token 模式的概念流程，Token不直接證明人的真實意圖。</text></g></svg>
