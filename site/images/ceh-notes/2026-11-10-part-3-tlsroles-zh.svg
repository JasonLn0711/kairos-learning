<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1364" role="img" aria-labelledby="title desc" lang="zh"><title id="title">HTTPS 中互補的密碼學機制</title><desc id="desc">「否」通往連線失敗；「是」通往金鑰導出與 AEAD。這是功能關係，非精確封包時序；實際交握有分階段金鑰排程。</desc><rect width="900" height="1364" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H222.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="842.0" text-anchor="middle" font-size="16">否</text><path d="M436.0 808V852.0H650.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="842.0" text-anchor="middle" font-size="16">是</text><path d="M650.0 1010V1054.0H436.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">HTTPS 中互補的密碼學機制</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Client 與 Server 協商 TLS</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">選定參數</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">以 ECDHE 建立共同祕密</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">雙方交換公開值</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">驗證伺服器身分與交握訊息</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">憑證及簽章等驗證</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">驗證成功？</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">選擇成功或失敗分支</text><rect x="28.0" y="896" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="928" font-size="20" font-weight="700" text-anchor="middle">連線失敗</text><text x="222.0" y="966" font-size="18" font-weight="400" text-anchor="middle">驗證不通過時停止</text><rect x="456.0" y="896" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="928" font-size="20" font-weight="700" text-anchor="middle">以 HKDF 導出流量保護金鑰</text><text x="650.0" y="966" font-size="18" font-weight="400" text-anchor="middle">依 TLS 金鑰排程處理</text><rect x="28.0" y="1098" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">使用 AES-GCM 或其他 AEAD 加密應用資料</text><text x="436.0" y="1168" font-size="18" font-weight="400" text-anchor="middle">同時處理適用的完整性驗證</text><text x="28" y="1282" font-size="17" font-weight="400" text-anchor="start">「否」通往連線失敗；「是」通往金鑰導出與 AEAD。這是功能關係，非精確封包時序；實際交</text><text x="28" y="1314" font-size="17" font-weight="400" text-anchor="start">握有分階段金鑰排程。</text></g></svg>
