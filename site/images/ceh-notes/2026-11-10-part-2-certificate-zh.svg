<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1780" role="img" aria-labelledby="title desc" lang="zh"><title id="title">憑證式 TLS 1.3：CA、伺服器與瀏覽器</title><desc id="desc">CA 事先核發憑證，不必在線參與每次交握。箭頭表示訊息方向，虛線是回覆而非加密狀態；省略選用訊息與部分加密層次，依 RFC 9846。</desc><rect width="900" height="1780" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">憑證式 TLS 1.3：CA、伺服器與瀏覽器</text><rect x="28" y="88" width="268" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="162.0" y="120" font-size="20" font-weight="700" text-anchor="middle">憑證機構 CA</text><text x="162.0" y="158" font-size="18" font-weight="400" text-anchor="middle">驗證申請並簽發憑證</text><rect x="316" y="88" width="268" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="450.0" y="120" font-size="20" font-weight="700" text-anchor="middle">網站伺服器</text><text x="450.0" y="158" font-size="18" font-weight="400" text-anchor="middle">保存自己的私鑰</text><rect x="604" y="88" width="268" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="738.0" y="120" font-size="20" font-weight="700" text-anchor="middle">瀏覽器</text><text x="738.0" y="158" font-size="18" font-weight="400" text-anchor="middle">驗證網站身分</text><path d="M738 202V1666" fill="none" stroke="#a2aaa6" stroke-width="2"/><path d="M450 202V1666" fill="none" stroke="#a2aaa6" stroke-width="2"/><path d="M162 202V1666" fill="none" stroke="#a2aaa6" stroke-width="2"/><rect x="28" y="234" width="556" height="112" rx="12" fill="#fff6e9" stroke="#b8d5c5"/><text x="306.0" y="262" font-size="20" font-weight="700" text-anchor="middle">事先完成憑證申請與簽發</text><text x="306.0" y="300" font-size="18" font-weight="400" text-anchor="middle">CA 與網站：連線之前的作業</text><text x="306.0" y="394" font-size="20" font-weight="700" text-anchor="middle">核發並簽署憑證</text><text x="306.0" y="430" font-size="18" font-weight="400" text-anchor="middle">CA → 網站伺服器</text><path d="M162 474H450m-8-6 8 6 -8 6" fill="none" stroke="#77867f" stroke-width="2" stroke-dasharray="5 4"/><text x="594.0" y="538" font-size="20" font-weight="700" text-anchor="middle">ClientHello + key_</text><text x="594.0" y="570" font-size="20" font-weight="700" text-anchor="middle">share</text><text x="594.0" y="606" font-size="18" font-weight="400" text-anchor="middle">瀏覽器 → 網站伺服器</text><path d="M738 650H450m8-6 -8 6 8 6" fill="none" stroke="#77867f" stroke-width="2"/><text x="594.0" y="714" font-size="20" font-weight="700" text-anchor="middle">ServerHello + key_</text><text x="594.0" y="746" font-size="20" font-weight="700" text-anchor="middle">share</text><text x="594.0" y="782" font-size="18" font-weight="400" text-anchor="middle">網站伺服器 → 瀏覽器</text><path d="M450 826H738m-8-6 8 6 -8 6" fill="none" stroke="#77867f" stroke-width="2" stroke-dasharray="5 4"/><text x="594.0" y="890" font-size="20" font-weight="700" text-anchor="middle">Certificate +</text><text x="594.0" y="922" font-size="20" font-weight="700" text-anchor="middle">CertificateVerify</text><text x="594.0" y="958" font-size="18" font-weight="400" text-anchor="middle">網站伺服器 → 瀏覽器</text><path d="M450 1002H738m-8-6 8 6 -8 6" fill="none" stroke="#77867f" stroke-width="2" stroke-dasharray="5 4"/><text x="594.0" y="1066" font-size="20" font-weight="700" text-anchor="middle">Finished</text><text x="594.0" y="1102" font-size="18" font-weight="400" text-anchor="middle">網站伺服器 → 瀏覽器</text><path d="M450 1146H738m-8-6 8 6 -8 6" fill="none" stroke="#77867f" stroke-width="2" stroke-dasharray="5 4"/><rect x="604" y="1186" width="268" height="176" rx="12" fill="#fff6e9" stroke="#b8d5c5"/><text x="738.0" y="1214" font-size="20" font-weight="700" text-anchor="middle">驗證憑證鏈、網域與簽章</text><text x="738.0" y="1246" font-size="20" font-weight="700" text-anchor="middle">等</text><text x="738.0" y="1284" font-size="18" font-weight="400" text-anchor="middle">瀏覽器在本機檢查；此框彙整</text><text x="738.0" y="1316" font-size="18" font-weight="400" text-anchor="middle">驗證責任</text><text x="594.0" y="1410" font-size="20" font-weight="700" text-anchor="middle">Finished</text><text x="594.0" y="1446" font-size="18" font-weight="400" text-anchor="middle">瀏覽器 → 網站伺服器</text><path d="M738 1490H450m8-6 -8 6 8 6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="316" y="1530" width="556" height="112" rx="12" fill="#fff6e9" stroke="#b8d5c5"/><text x="594.0" y="1558" font-size="20" font-weight="700" text-anchor="middle">以導出的對稱金鑰保護應用資料</text><text x="594.0" y="1596" font-size="18" font-weight="400" text-anchor="middle">伺服器 ↔ 瀏覽器</text><text x="28" y="1698" font-size="17" font-weight="400" text-anchor="start">CA 事先核發憑證，不必在線參與每次交握。箭頭表示訊息方向，虛線是回覆而非加密狀態；省略</text><text x="28" y="1730" font-size="17" font-weight="400" text-anchor="start">選用訊息與部分加密層次，依 RFC 9846。</text></g></svg>
