<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-labelledby="title desc" lang="zh"><title id="title">CIA 三要素</title><desc id="desc">三項為平行安全目標；加密本身不能阻止刪除資料。</desc><rect width="900" height="354" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CIA 三要素</text><rect x="28.0" y="88" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="150.66666666666669" y="120" font-size="20" font-weight="700" text-anchor="middle">Confidentiality</text><text x="150.66666666666669" y="152" font-size="20" font-weight="700" text-anchor="middle">｜機密性</text><text x="150.66666666666669" y="190" font-size="18" font-weight="400" text-anchor="middle">不該看的人看不到</text><rect x="313.33333333333337" y="88" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.00000000000006" y="120" font-size="20" font-weight="700" text-anchor="middle">Integrity｜完整性</text><text x="436.00000000000006" y="158" font-size="18" font-weight="400" text-anchor="middle">資料沒有遭到未授權修改</text><rect x="598.6666666666667" y="88" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="721.3333333333334" y="120" font-size="20" font-weight="700" text-anchor="middle">Availability｜可</text><text x="721.3333333333334" y="152" font-size="20" font-weight="700" text-anchor="middle">用性</text><text x="721.3333333333334" y="190" font-size="18" font-weight="400" text-anchor="middle">需要的時候能使用</text><text x="28" y="304" font-size="17" font-weight="400" text-anchor="start">三項為平行安全目標；加密本身不能阻止刪除資料。</text></g></svg>
