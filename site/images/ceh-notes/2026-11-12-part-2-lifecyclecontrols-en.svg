<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 992" role="img" aria-labelledby="title desc" lang="en"><title id="title">Data lifecycle and sanitization</title><desc id="desc">Choose methods using data risk, media capabilities and verified outcomes.</desc><rect width="900" height="992" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Data lifecycle and sanitization</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Data in use</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Prevent unauthorized access, tampering and service disruption.</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Storage, backups and archives</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Control who can access data, how it is retained and for how long.</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">End of lifecycle</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Select appropriate disposition, such as Clear, Purge or Destroy.</text><rect x="28.0" y="694" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Verification and evidence</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">Verify sanitization and preserve evidence so subsequent reuse,</text><text x="436.0" y="796" font-size="18" font-weight="400" text-anchor="middle">disposal or outsourced recycling meets risk requirements.</text><text x="28" y="910" font-size="17" font-weight="400" text-anchor="start">Choose methods using data risk, media capabilities and verified</text><text x="28" y="942" font-size="17" font-weight="400" text-anchor="start">outcomes.</text></g></svg>
