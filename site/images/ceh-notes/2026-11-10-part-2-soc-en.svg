<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" role="img" aria-labelledby="title desc" lang="en"><title id="title">A common SOC triage workflow</title><desc id="desc">No leads to recording, closure or observation; yes leads to Tier 2 and optionally Tier 3. Either investigation tier can activate major-incident command. Automation or MDR may perform these roles.</desc><rect width="900" height="1460" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H222.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="640.0" text-anchor="middle" font-size="16">No</text><path d="M436.0 606V650.0H650.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="640.0" text-anchor="middle" font-size="16">Yes</text><path d="M650.0 872V916.0H436.0V960m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="906.0" text-anchor="middle" font-size="16">If needed</text><path d="M844.0 783.0H875V1134H436.0V1162m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1074V1118.0H436.0V1162m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">A common SOC triage workflow</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">SIEM / EDR alert</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Enter incident triage</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Tier 1 initial confirmation and classification</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Check the alert and escalation criteria</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Enough evidence for further investigation?</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Choose the branch using evidence</text><rect x="28.0" y="694" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Record, close or continue</text><text x="222.0" y="758" font-size="20" font-weight="700" text-anchor="middle">observing</text><text x="222.0" y="796" font-size="18" font-weight="400" text-anchor="middle">Retain records and monitor</text><text x="222.0" y="828" font-size="18" font-weight="400" text-anchor="middle">when evidence is insufficient</text><rect x="456.0" y="694" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Tier 2 investigation and</text><text x="650.0" y="758" font-size="20" font-weight="700" text-anchor="middle">response</text><text x="650.0" y="796" font-size="18" font-weight="400" text-anchor="middle">Investigate evidence and</text><text x="650.0" y="828" font-size="18" font-weight="400" text-anchor="middle">support response</text><rect x="28.0" y="960" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="992" font-size="20" font-weight="700" text-anchor="middle">Escalate to Tier 3 when needed</text><text x="436.0" y="1030" font-size="18" font-weight="400" text-anchor="middle">Advanced analysis / threat hunting</text><rect x="28.0" y="1162" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1194" font-size="20" font-weight="700" text-anchor="middle">Activate major-incident command</text><text x="436.0" y="1232" font-size="18" font-weight="400" text-anchor="middle">Coordinate response, decisions and communication</text><text x="28" y="1346" font-size="17" font-weight="400" text-anchor="start">No leads to recording, closure or observation; yes leads to Tier 2</text><text x="28" y="1378" font-size="17" font-weight="400" text-anchor="start">and optionally Tier 3. Either investigation tier can activate</text><text x="28" y="1410" font-size="17" font-weight="400" text-anchor="start">major-incident command. Automation or MDR may perform these roles.</text></g></svg>
