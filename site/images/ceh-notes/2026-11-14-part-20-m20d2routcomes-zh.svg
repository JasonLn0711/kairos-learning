<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" role="img" aria-labelledby="title desc" lang="zh"><title id="title">CSRF 圖 5｜一次廣泛 CSRF 嘗試的四種結果</title><desc id="desc">四種訪客狀態並列比較，不是同一人的時間順序；紅色警示只表示條件符合時可能成功，不表示攻擊者事前已知道該訪客登入。</desc><rect width="900" height="750" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CSRF 圖 5｜一次廣泛 CSRF 嘗試的四種結果</text><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-3 6 6 6m0-6-6 6" transform="translate(28 88)" fill="none" stroke="#657079" stroke-width="2"/><text x="66" y="112" font-size="20" font-weight="700" text-anchor="start">Bob：沒有登入銀行</text><text x="66" y="148" font-size="18" font-weight="400" text-anchor="start">沒有有效 Session，通常無法以已登入使用者身分執行操作</text><path d="M28 192H872" fill="none" stroke="#d8dce0" stroke-width="2"/><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-3 6 6 6m0-6-6 6" transform="translate(28 224)" fill="none" stroke="#657079" stroke-width="2"/><text x="66" y="248" font-size="20" font-weight="700" text-anchor="start">Carol：登入已過期</text><text x="66" y="284" font-size="18" font-weight="400" text-anchor="start">Server 應拒絕失效 Session</text><path d="M28 328H872" fill="none" stroke="#d8dce0" stroke-width="2"/><path d="M12 3l8 4v6c0 5-8 9-8 9s-8-4-8-9V7l8-4Zm-4 9 3 3 5-6" transform="translate(28 360)" fill="none" stroke="#657079" stroke-width="2"/><text x="66" y="384" font-size="20" font-weight="700" text-anchor="start">David：已登入，但網站有 CSRF 防護</text><text x="66" y="420" font-size="18" font-weight="400" text-anchor="start">即使 Session 有效，Server 仍可阻擋未通過檢查的 Request</text><path d="M28 464H872" fill="none" stroke="#d8dce0" stroke-width="2"/><path d="M12 3 2 21h20L12 3Zm0 6v6m0 2v1" transform="translate(28 496)" fill="none" stroke="#b52323" stroke-width="2"/><text x="66" y="520" font-size="20" font-weight="700" text-anchor="start">Alice：已登入，且目標操作缺乏防護</text><text x="66" y="556" font-size="18" font-weight="400" text-anchor="start">若 Cookie 被附帶、參數符合要求、權限足夠，攻擊可能成功</text><path d="M28 600H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="662" font-size="17" font-weight="400" text-anchor="start">四種訪客狀態並列比較，不是同一人的時間順序；紅色警示只表示條件符合時可能成功，不表示</text><text x="28" y="694" font-size="17" font-weight="400" text-anchor="start">攻擊者事前已知道該訪客登入。</text></g></svg>
