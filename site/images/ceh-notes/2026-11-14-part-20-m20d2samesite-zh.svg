<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 732" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 15｜Cookie 傳送判斷表</title><desc id="desc">假設主機、路徑、HTTPS等條件符合，且沒有其他瀏覽器政策阻擋；勾叉表示在明確指定的 SameSite 設定下是否允許附帶 Cookie。未指定屬性時的預設及短暫POST例外，不能套成本表Lax欄。</desc><rect width="900" height="732" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 15｜Cookie 傳送判斷表</text><text x="28" y="88" font-size="20" font-weight="700" text-anchor="start">請求情境</text><text x="440" y="88" font-size="20" font-weight="700" text-anchor="start">Strict</text><text x="590" y="88" font-size="20" font-weight="700" text-anchor="start">Lax</text><text x="740" y="88" font-size="20" font-weight="700" text-anchor="start">None</text><text x="28" y="136" font-size="18" font-weight="400" text-anchor="start">Same-Site POST</text><g fill="#006b39"><text x="440" y="136" font-size="22" font-weight="700" text-anchor="start">✓</text></g><text x="440" y="168" font-size="18" font-weight="400" text-anchor="start">允許</text><g fill="#006b39"><text x="590" y="136" font-size="22" font-weight="700" text-anchor="start">✓</text></g><text x="590" y="168" font-size="18" font-weight="400" text-anchor="start">允許</text><g fill="#006b39"><text x="740" y="136" font-size="22" font-weight="700" text-anchor="start">✓</text></g><text x="740" y="168" font-size="18" font-weight="400" text-anchor="start">允許</text><path d="M28 212H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="248" font-size="18" font-weight="400" text-anchor="start">Cross-Site 頂層 GET</text><g fill="#b52323"><text x="440" y="248" font-size="22" font-weight="700" text-anchor="start">×</text></g><text x="440" y="280" font-size="18" font-weight="400" text-anchor="start">不允許</text><g fill="#006b39"><text x="590" y="248" font-size="22" font-weight="700" text-anchor="start">✓</text></g><text x="590" y="280" font-size="18" font-weight="400" text-anchor="start">允許</text><g fill="#006b39"><text x="740" y="248" font-size="22" font-weight="700" text-anchor="start">✓</text></g><text x="740" y="280" font-size="18" font-weight="400" text-anchor="start">允許</text><path d="M28 324H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="360" font-size="18" font-weight="400" text-anchor="start">Cross-Site 頂層 POST</text><g fill="#b52323"><text x="440" y="360" font-size="22" font-weight="700" text-anchor="start">×</text></g><text x="440" y="392" font-size="18" font-weight="400" text-anchor="start">不允許</text><g fill="#b52323"><text x="590" y="360" font-size="22" font-weight="700" text-anchor="start">×</text></g><text x="590" y="392" font-size="18" font-weight="400" text-anchor="start">不允許</text><g fill="#006b39"><text x="740" y="360" font-size="22" font-weight="700" text-anchor="start">✓</text></g><text x="740" y="392" font-size="18" font-weight="400" text-anchor="start">允許</text><path d="M28 436H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="472" font-size="18" font-weight="400" text-anchor="start">Cross-Site 圖片 GET</text><g fill="#b52323"><text x="440" y="472" font-size="22" font-weight="700" text-anchor="start">×</text></g><text x="440" y="504" font-size="18" font-weight="400" text-anchor="start">不允許</text><g fill="#b52323"><text x="590" y="472" font-size="22" font-weight="700" text-anchor="start">×</text></g><text x="590" y="504" font-size="18" font-weight="400" text-anchor="start">不允許</text><g fill="#006b39"><text x="740" y="472" font-size="22" font-weight="700" text-anchor="start">✓</text></g><text x="740" y="504" font-size="18" font-weight="400" text-anchor="start">允許</text><path d="M28 548H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="616" font-size="17" font-weight="400" text-anchor="start">假設主機、路徑、HTTPS等條件符合，且沒有其他瀏覽器政策阻擋；勾叉表示在明確指定的</text><text x="28" y="648" font-size="17" font-weight="400" text-anchor="start">SameSite 設定下是否允許附帶 Cookie。未指定屬性時的預設