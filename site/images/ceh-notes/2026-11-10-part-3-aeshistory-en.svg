<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 846" role="img" aria-labelledby="title desc" lang="en"><title id="title">Selection of the AES standard</title><desc id="desc">Arrows show historical selection stages. Twofish and Rijndael were both finalists; Rijndael was selected. Finalist status, 128-bit blocks and a 256-bit key alone do not uniquely identify Twofish.</desc><rect width="900" height="846" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Selection of the AES standard</text><rect x="28" y="88" width="844" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="450.0" y="120" font-size="20" font-weight="700" text-anchor="middle">15 candidate algorithms</text><text x="450.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Entered first-round evaluation in 1998</text><path d="M450 214v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="272" width="844" height="224" rx="12" fill="#f7faf8" stroke="#b8d5c5"/><text x="450" y="304" font-size="20" font-weight="700" text-anchor="middle">5 finalists</text><rect x="50" y="352" width="250" height="50" rx="12" fill="#ffffff" stroke="#b8d5c5"/><text x="175" y="384" font-size="18" font-weight="400" text-anchor="middle">MARS</text><rect x="330" y="352" width="250" height="50" rx="12" fill="#ffffff" stroke="#b8d5c5"/><text x="455" y="384" font-size="18" font-weight="400" text-anchor="middle">RC6</text><rect x="610" y="352" width="250" height="50" rx="12" fill="#ffffff" stroke="#b8d5c5"/><text x="735" y="384" font-size="18" font-weight="400" text-anchor="middle">Serpent</text><rect x="50" y="416" width="250" height="50" rx="12" fill="#ffffff" stroke="#b8d5c5"/><text x="175" y="448" font-size="18" font-weight="400" text-anchor="middle">Twofish</text><rect x="330" y="416" width="250" height="50" rx="12" fill="#b9dec9" stroke="#b8d5c5"/><text x="455" y="448" font-size="18" font-weight="700" text-anchor="middle">Rijndael</text><path d="M450 508v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="566" width="844" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="450.0" y="598" font-size="20" font-weight="700" text-anchor="middle">Rijndael selected as AES</text><text x="450.0" y="636" font-size="18" font-weight="400" text-anchor="middle">Selection announced in 2000; FIPS 197 published in 2001</text><text x="28" y="732" font-size="17" font-weight="400" text-anchor="start">Arrows show historical selection stages. Twofish and Rijndael were</text><text x="28" y="764" font-size="17" font-weight="400" text-anchor="start">both finalists; Rijndael was selected. Finalist status, 128-bit</text><text x="28" y="796" font-size="17" font-weight="400" text-anchor="start">blocks and a 256-bit key alone do not uniquely identify Twofish.</text></g></svg>
