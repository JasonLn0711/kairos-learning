<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 964" role="img" aria-labelledby="title desc" lang="en"><title id="title">White, black and grey hats: authorization and purpose</title><desc id="desc">The rows compare roles, not consecutive steps. Consider motive, authorization, actual conduct and applicable law together; a hat label provides no legal exemption.</desc><rect width="900" height="964" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">White, black and grey hats: authorization and purpose</text><rect x="28" y="90" width="62" height="62" rx="12" fill="#eaf5f1" stroke="#d8dce0"/><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" fill="none" stroke="#006b39" stroke-width="2" transform="translate(40 102) scale(1.6)"/><path d="m8 12 3 3 5-6" fill="none" stroke="#006b39" stroke-width="2" transform="translate(40 102) scale(1.6)"/><text x="110" y="118" font-size="20" font-weight="700" text-anchor="start">White hat</text><text x="110" y="158" font-size="18" font-weight="400" text-anchor="start">Tests security within valid authorization to find and</text><text x="110" y="190" font-size="18" font-weight="400" text-anchor="start">improve security problems.</text><text x="110" y="222" font-size="18" font-weight="400" text-anchor="start">Example: a company hires a security consultant for a</text><text x="110" y="254" font-size="18" font-weight="400" text-anchor="start">penetration test.</text><path d="M28 314H872" fill="none" stroke="#e1e5e8" stroke-width="2" /><rect x="28" y="340" width="62" height="62" rx="12" fill="#f9eeee" stroke="#d8dce0"/><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" fill="none" stroke="#b52323" stroke-width="2" transform="translate(40 352) scale(1.6)"/><path d="M12 8v5m0 3v1" fill="none" stroke="#b52323" stroke-width="2" transform="translate(40 352) scale(1.6)"/><text x="110" y="368" font-size="20" font-weight="700" text-anchor="start">Black hat</text><text x="110" y="408" font-size="18" font-weight="400" text-anchor="start">Typically compromises systems without authorization for</text><text x="110" y="440" font-size="18" font-weight="400" text-anchor="start">theft, damage or another malicious purpose.</text><text x="110" y="472" font-size="18" font-weight="400" text-anchor="start">Example: breaking into a company database to steal</text><text x="110" y="504" font-size="18" font-weight="400" text-anchor="start">customer accounts.</text><path d="M28 564H872" fill="none" stroke="#e1e5e8" stroke-width="2" /><rect x="28" y="590" width="62" height="62" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" fill="none" stroke="#18252c" stroke-width="2" transform="translate(40 602) scale(1.6)"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3v1" fill="none" stroke="#18252c" stroke-width="2" transform="translate(40 602) scale(1.6)"/><text x="110" y="618" font-size="20" font-weight="700" text-anchor="start">Grey hat</text><text x="110" y="658" font-size="18" font-weight="400" text-anchor="start">May lack a directly malicious or profit motive but tests</text><text x="110" y="690" font-size="18" font-weight="400" text-anchor="start">without authorization.</text><text x="110" y="722" font-size="18" font-weight="400" text-anchor="start">Example: verifying a website vulnerability without</text><text x="110" y="754" font-size="18" font-weight="400" text-anchor="start">consent, then notifying its owner.</text><text x="28" y="844" font-size="17" font-weight="400" text-anchor="start">The rows compare roles, not consecutive steps. Consider motive,</text><text x="28" y="876" font-size="17" font-weight="400" text-anchor="start">authorization, actual conduct and applicable law together; a hat</text><text x="28" y="908" font-size="17" font-weight="400" text-anchor="start">label provides no legal exemption.</text></g></svg>
