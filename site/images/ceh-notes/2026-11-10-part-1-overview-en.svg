<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 874" role="img" aria-labelledby="title desc" lang="en"><title id="title">Three questions build a security map</title><desc id="desc">Define protection goals, choose controls, then verify them through authorized testing. Arrows show learning and design order.</desc><rect width="900" height="874" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Three questions build a security map</text><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" fill="none" stroke="#18252c" stroke-width="2" transform="translate(438 90)"/><text x="450" y="164" font-size="20" font-weight="700" text-anchor="middle">What are we protecting?</text><text x="450" y="204" font-size="18" font-weight="400" text-anchor="middle">CIA: confidentiality, integrity and availability</text><path d="M450 248v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><path d="M3 8 12 3l9 5-9 5-9-5Zm0 5 9 5 9-5M3 18l9 5 9-5" fill="none" stroke="#18252c" stroke-width="2" transform="translate(438 322)"/><text x="450" y="396" font-size="20" font-weight="700" text-anchor="middle">How do we protect it?</text><text x="450" y="436" font-size="18" font-weight="400" text-anchor="middle">Security controls: physical, technical and administrative</text><path d="M450 480v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm5 12 6 6M7 10l2 2 4-4" fill="none" stroke="#18252c" stroke-width="2" transform="translate(438 554)"/><text x="450" y="628" font-size="20" font-weight="700" text-anchor="middle">How do we verify protection?</text><text x="450" y="668" font-size="18" font-weight="400" text-anchor="middle">Ethical hacking: authorized testing, vulnerability discovery</text><text x="450" y="700" font-size="18" font-weight="400" text-anchor="middle">and risk reduction</text><text x="28" y="786" font-size="17" font-weight="400" text-anchor="start">Define protection goals, choose controls, then verify them through</text><text x="28" y="818" font-size="17" font-weight="400" text-anchor="start">authorized testing. Arrows show learning and design order.</text></g></svg>
