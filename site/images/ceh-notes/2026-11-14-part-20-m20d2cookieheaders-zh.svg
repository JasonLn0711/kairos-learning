<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 484" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 12｜Set-Cookie 與 Cookie 的相反方向</title><desc id="desc">方向以具名起訖為準：回應要求保存 Cookie；後續請求只傳符合規則的名稱和值，不把安全屬性原樣傳回。</desc><rect width="900" height="484" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 12｜Set-Cookie 與 Cookie 的相反方向</text><text x="72" y="112" font-size="20" font-weight="700" text-anchor="start">Server → Browser</text><path d="M30 104h24m-6-6 6 6-6 6" fill="none" stroke="#657079" stroke-width="2"/><text x="72" y="152" font-size="18" font-weight="400" text-anchor="start">Set-Cookie：請保存這筆 Cookie</text><path d="M28 200H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="72" y="252" font-size="20" font-weight="700" text-anchor="start">Browser → Server</text><path d="M54 244H30m6-6-6 6 6 6" fill="none" stroke="#657079" stroke-width="2"/><text x="72" y="292" font-size="18" font-weight="400" text-anchor="start">Cookie：這次請求附帶符合規則的 Cookie 名稱和值</text><path d="M28 340H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="400" font-size="17" font-weight="400" text-anchor="start">方向以具名起訖為準：回應要求保存 Cookie；後續請求只傳符合規則的名稱和值，不把安全</text><text x="28" y="432" font-size="17" font-weight="400" text-anchor="start">屬性原樣傳回。</text></g></svg>
