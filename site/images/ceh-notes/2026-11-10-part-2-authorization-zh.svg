<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 928" role="img" aria-labelledby="title desc" lang="zh"><title id="title">授權測試的四個步驟</title><desc id="desc">箭頭表示工作依賴；授權者須能代表受測資產，測試受 Scope 與 ROE 約束。</desc><rect width="900" height="928" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">授權測試的四個步驟</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">取得測試授權</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">確認有權代表目標資產授權的人</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">確定 Scope 與 ROE</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">目標、時間、方法、資料處理、停止條件</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">執行測試、保存證據</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">限制影響，避免不必要的資料取得</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">回報漏洞與修復建議</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">使組織能降低實際風險</text><text x="28" y="878" font-size="17" font-weight="400" text-anchor="start">箭頭表示工作依賴；授權者須能代表受測資產，測試受 Scope 與 ROE 約束。</text></g></svg>
