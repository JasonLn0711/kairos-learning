<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc" lang="zh"><title id="title">兩種建立共同金鑰的方法</title><desc id="desc">兩欄各自向下閱讀，彼此是平行比較。實務仍需公鑰認證、安全方案與 KDF；RSA 型金鑰傳送不是 TLS 1.3 的 static RSA 交換。</desc><rect width="900" height="700" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">兩種建立共同金鑰的方法</text><rect x="28" y="88" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="120" font-size="20" font-weight="700" text-anchor="middle">RSA 型金鑰傳送</text><text x="229.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Alice 產生秘密金鑰 K</text><path d="M229 214v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="270" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="302" font-size="20" font-weight="700" text-anchor="middle">公鑰保護</text><text x="229.0" y="340" font-size="18" font-weight="400" text-anchor="middle">使用 Bob 的公鑰保護 K</text><path d="M229 396v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="452" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="484" font-size="20" font-weight="700" text-anchor="middle">私鑰還原</text><text x="229.0" y="522" font-size="18" font-weight="400" text-anchor="middle">Bob 以私鑰取得 K</text><rect x="458" y="88" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Diffie–Hellman 金鑰協議</text><text x="659.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Alice、Bob 各有秘密值</text><path d="M659 214v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="458" y="270" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="302" font-size="20" font-weight="700" text-anchor="middle">交換</text><text x="659.0" y="340" font-size="18" font-weight="400" text-anchor="middle">交換公開計算值</text><path d="M659 396v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="458" y="452" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="484" font-size="20" font-weight="700" text-anchor="middle">導出</text><text x="659.0" y="522" font-size="18" font-weight="400" text-anchor="middle">各自推導共同秘密</text><text x="28" y="618" font-size="17" font-weight="400" text-anchor="start">兩欄各自向下閱讀，彼此是平行比較。實務仍需公鑰認證、安全方案與 KDF；RSA 型金鑰傳送不</text><text x="28" y="650" font-size="17" font-weight="400" text-anchor="start">是 TLS 1.3 的 static RSA 交換。</text></g></svg>
