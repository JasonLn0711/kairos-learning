<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 514" role="img" aria-labelledby="title desc" lang="en"><title id="title">Unauthenticated DH: two different shared secrets</title><desc id="desc">Bidirectional links denote two separate relationships: Alice ↔ Eve uses K1; Eve ↔ Bob uses K2. This does not establish a trusted direct Alice–Bob connection.</desc><rect width="900" height="514" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M273.33333333333337 209.0H313.33333333333337m-7-5 7 5-7 5M280.33333333333337 204.0l-7 5 7 5" fill="none" stroke="#77867f" stroke-width="2"/><text x="293.33333333333337" y="197.0" text-anchor="middle" font-size="16">K1</text><path d="M558.6666666666667 209.0H598.6666666666667m-7-5 7 5-7 5M565.6666666666667 204.0l-7 5 7 5" fill="none" stroke="#77867f" stroke-width="2"/><text x="578.6666666666667" y="197.0" text-anchor="middle" font-size="16">K2</text><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Unauthenticated DH: two different shared secrets</text><rect x="28.0" y="88" width="245.33333333333334" height="242" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="150.66666666666669" y="120" font-size="20" font-weight="700" text-anchor="middle">Alice</text><text x="150.66666666666669" y="158" font-size="18" font-weight="400" text-anchor="middle">Believes the peer</text><text x="150.66666666666669" y="190" font-size="18" font-weight="400" text-anchor="middle">is Bob</text><rect x="313.33333333333337" y="88" width="245.33333333333334" height="242" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.00000000000006" y="120" font-size="20" font-weight="700" text-anchor="middle">Eve, the</text><text x="436.00000000000006" y="152" font-size="20" font-weight="700" text-anchor="middle">attacker</text><text x="436.00000000000006" y="190" font-size="18" font-weight="400" text-anchor="middle">Substitutes</text><text x="436.00000000000006" y="222" font-size="18" font-weight="400" text-anchor="middle">public values;</text><text x="436.00000000000006" y="254" font-size="18" font-weight="400" text-anchor="middle">may decrypt and</text><text x="436.00000000000006" y="286" font-size="18" font-weight="400" text-anchor="middle">re-encrypt</text><rect x="598.6666666666667" y="88" width="245.33333333333334" height="242" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="721.3333333333334" y="120" font-size="20" font-weight="700" text-anchor="middle">Bob</text><text x="721.3333333333334" y="158" font-size="18" font-weight="400" text-anchor="middle">Believes the peer</text><text x="721.3333333333334" y="190" font-size="18" font-weight="400" text-anchor="middle">is Alice</text><text x="28" y="400" font-size="17" font-weight="400" text-anchor="start">Bidirectional links denote two separate relationships: Alice ↔ Eve</text><text x="28" y="432" font-size="17" font-weight="400" text-anchor="start">uses K1; Eve ↔ Bob uses K2. This does not establish a trusted direct</text><text x="28" y="464" font-size="17" font-weight="400" text-anchor="start">Alice–Bob connection.</text></g></svg>
