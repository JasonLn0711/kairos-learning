<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" role="img" aria-labelledby="title desc" lang="en"><title id="title">Block size and key size are independent</title><desc id="desc">Bar lengths use 128 bits as the reference. Blowfish supports 32–448-bit keys while retaining 64-bit blocks; a longer key does not enlarge the block.</desc><rect width="900" height="586" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Block size and key size are independent</text><text x="28" y="108" font-size="20" font-weight="700" text-anchor="start">Blowfish block</text><rect x="28" y="152" width="408" height="18" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="28" y="202" font-size="18" font-weight="400" text-anchor="start">64 bits = 8 bytes</text><text x="28" y="284" font-size="20" font-weight="700" text-anchor="start">AES block</text><rect x="28" y="328" width="816" height="18" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="28" y="378" font-size="18" font-weight="400" text-anchor="start">128 bits = 16 bytes</text><text x="28" y="472" font-size="17" font-weight="400" text-anchor="start">Bar lengths use 128 bits as the reference. Blowfish supports 32–</text><text x="28" y="504" font-size="17" font-weight="400" text-anchor="start">448-bit keys while retaining 64-bit blocks; a longer key does not</text><text x="28" y="536" font-size="17" font-weight="400" text-anchor="start">enlarge the block.</text></g></svg>
