<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" role="img" aria-labelledby="title desc" lang="zh"><title id="title">事件應變指揮者與六個平行協作團隊</title><desc id="desc">這是重大事件組織設計範例。指揮者在預先授權內協調六個團隊；團隊之間不是依序交接的六個步驟。實際權限與角色配置由企業事先建立的應變計畫決定。</desc><rect width="900" height="960" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H222.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 202V246.0H650.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M844.0 145.0H875V464H222.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M844.0 145.0H875V464H650.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M844.0 145.0H875V666H222.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M844.0 145.0H875V666H650.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">事件應變指揮者與六個平行協作團隊</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Incident Commander</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">事件目標、決策、升級、協調及溝通</text><rect x="28.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Security / SOC</text><text x="222.0" y="360" font-size="18" font-weight="400" text-anchor="middle">調查攻擊、保存證據</text><rect x="456.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="322" font-size="20" font-weight="700" text-anchor="middle">IT / Cloud</text><text x="650.0" y="360" font-size="18" font-weight="400" text-anchor="middle">隔離、修復、基礎設施復原</text><rect x="28.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="524" font-size="20" font-weight="700" text-anchor="middle">OT / Operations</text><text x="222.0" y="562" font-size="18" font-weight="400" text-anchor="middle">設備安全、製程連續性</text><rect x="456.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Legal / Compliance</text><text x="650.0" y="562" font-size="18" font-weight="400" text-anchor="middle">法遵、通報、證據要求</text><rect x="28.0" y="694" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Business Continuity</text><text x="222.0" y="764" font-size="18" font-weight="400" text-anchor="middle">替代流程與持續營運</text><rect x="456.0" y="694" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Communications</text><text x="650.0" y="764" font-size="18" font-weight="400" text-anchor="middle">內外部訊息與利害關係人</text><text x="28" y="878" font-size="17" font-weight="400" text-anchor="start">這是重大事件組織設計範例。指揮者在預先授權內協調六個團隊；團隊之間不是依序交接的六個步</text><text x="28" y="910" font-size="17" font-weight="400" text-anchor="start">驟。實際權限與角色配置由企業事先建立的應變計畫決定。</text></g></svg>
