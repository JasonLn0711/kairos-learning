<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 814" role="img" aria-labelledby="title desc" lang="zh"><title id="title">AES 標準的選拔過程</title><desc id="desc">箭頭表示歷史評選階段。Twofish 與 Rijndael 都是決選者；Rijndael 最後獲選。只說「決選、128-bit 區塊、256-bit 金鑰」仍不足以唯一識別 Twofish。</desc><rect width="900" height="814" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">AES 標準的選拔過程</text><rect x="28" y="88" width="844" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="450.0" y="120" font-size="20" font-weight="700" text-anchor="middle">15 個候選演算法</text><text x="450.0" y="158" font-size="18" font-weight="400" text-anchor="middle">1998 年進入第一輪評估</text><path d="M450 214v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="272" width="844" height="224" rx="12" fill="#f7faf8" stroke="#b8d5c5"/><text x="450" y="304" font-size="20" font-weight="700" text-anchor="middle">5 個決選演算法</text><rect x="50" y="352" width="250" height="50" rx="12" fill="#ffffff" stroke="#b8d5c5"/><text x="175" y="384" font-size="18" font-weight="400" text-anchor="middle">MARS</text><rect x="330" y="352" width="250" height="50" rx="12" fill="#ffffff" stroke="#b8d5c5"/><text x="455" y="384" font-size="18" font-weight="400" text-anchor="middle">RC6</text><rect x="610" y="352" width="250" height="50" rx="12" fill="#ffffff" stroke="#b8d5c5"/><text x="735" y="384" font-size="18" font-weight="400" text-anchor="middle">Serpent</text><rect x="50" y="416" width="250" height="50" rx="12" fill="#ffffff" stroke="#b8d5c5"/><text x="175" y="448" font-size="18" font-weight="400" text-anchor="middle">Twofish</text><rect x="330" y="416" width="250" height="50" rx="12" fill="#b9dec9" stroke="#b8d5c5"/><text x="455" y="448" font-size="18" font-weight="700" text-anchor="middle">Rijndael</text><path d="M450 508v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="566" width="844" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="450.0" y="598" font-size="20" font-weight="700" text-anchor="middle">Rijndael 獲選為 AES</text><text x="450.0" y="636" font-size="18" font-weight="400" text-anchor="middle">2000 年宣布選擇；2001 年成為 FIPS 197</text><text x="28" y="732" font-size="17" font-weight="400" text-anchor="start">箭頭表示歷史評選階段。Twofish 與 Rijndael 都是決選者；Rijndael 最後獲選。只說「</text><text x="28" y="764" font-size="17" font-weight="400" text-anchor="start">決選、128-bit 區塊、256-bit 金鑰」仍不足以唯一識別 Twofish。</text></g></svg>
