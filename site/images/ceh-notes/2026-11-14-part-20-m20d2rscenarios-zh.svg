<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1158" role="img" aria-labelledby="title desc" lang="zh"><title id="title">CSRF 圖 2｜Web 需要的五種跨網站互動</title><desc id="desc">五個情境是平行用途，不是同一請求的五個階段。圖片HTML是可讀範例，不會在本頁執行；不會載入遠端CDN或執行程式。</desc><rect width="900" height="1158" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CSRF 圖 2｜Web 需要的五種跨網站互動</text><text x="66" y="112" font-size="20" font-weight="700" text-anchor="start">情境 A：新聞網站提供外部連結</text><path d="M8 15l7-7M7 12l-2 2a4 4 0 0 0 6 6l2-2M12 7l2-2a4 4 0 1 1 6 6l-2 2" transform="translate(28 92)" fill="none" stroke="#657079" stroke-width="2"/><text x="66" y="152" font-size="18" font-weight="400" text-anchor="start">Alice 從新聞網站點擊政府公告連結，Browser 向政府網站發送 GET Request。</text><text x="66" y="184" font-size="18" font-weight="400" text-anchor="start">新聞網站不需要有權讀取政府網站的私人資料。</text><path d="M28 228H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="66" y="276" font-size="20" font-weight="700" text-anchor="start">情境 B：從 CDN 載入圖片</text><path d="M3 4h18v16H3V4Zm0 13 6-6 4 4 3-3 5 5M14 8h1" transform="translate(28 256)" fill="none" stroke="#657079" stroke-width="2"/><text x="66" y="316" font-size="18" font-weight="400" text-anchor="start">商品網站使用另一個網域提供產品圖片。</text><rect x="66" y="340" width="806" height="76" rx="12" fill="#f2f6f5" stroke="#d8dce0"/><g font-family="ui-monospace, Consolas, monospace"><text x="82" y="372" font-size="18" font-weight="400" text-anchor="start">&lt;img src=&quot;https://cdn.example/product.jpg&quot;&gt;</text></g><text x="66" y="448" font-size="18" font-weight="400" text-anchor="start">瀏覽器向 CDN 發送 Request，取得圖片並顯示。這不代表商品網站的 JavaScript</text><text x="66" y="480" font-size="18" font-weight="400" text-anchor="start">可以讀取 CDN 的任意私人資料。</text><path d="M28 524H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="66" y="572" font-size="20" font-weight="700" text-anchor="start">情境 C：購物網站前往第三方付款服務</text><path d="M3 5h18v14H3V5Zm0 5h18" transform="translate(28 552)" fill="none" stroke="#657079" stroke-width="2"/><text x="66" y="612" font-size="18" font-weight="400" text-anchor="start">商家網站把顧客導向付款服務商，也可能透過表單提交必要資料。跨網站表單提交本來就</text><text x="66" y="644" font-size="18" font-weight="400" text-anchor="start">是 Web 支援的能力，實際付款仍須通過付款服務商的安全驗證。</text><path d="M28 688H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="66" y="736" font-size="20" font-weight="700" text-anchor="start">情境 D：使用 Google 或 Microsoft 登入</text><path d="M3 7h14m-5-5 5 5-5 5M21 17H7m5-5-5 5 5 5" transform="translate(28 716)" fill="none" stroke="#657079" stroke-width="2"/><text x="66" y="776" font-size="18" font-weight="400" text-anchor="start">應用程式導向身分提供者；驗證完成後，再重新導向原本的應用程式。這類跨網站導航是</text><text x="66" y="808" font-size="18" font-weight="400" text-anchor="start">OAuth 2.0／OpenID Connect 等流程的重要組成部分。</text><path d="M28 852H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="66" y="900" font-size="20" font-weight="700" text-anchor="start">情境 E：嵌入另一個網站的影片</text><path d="M3 5h12v14H3V5Zm12 5 6-4v12l-6-4" transform="translate(28 880)" fill="none" stroke="#657079" stroke-width="2"/><text x="66" y="940" font-size="18" font-weight="400" text-anchor="start">教學網站透過 iframe 嵌入影片播放器。Browser 可以載入它，但不同 Origin 的</text><text x="66" y="972" font-size="18" font-weight="400" text-anchor="start">Frame 仍受 SOP 與各種嵌入政策限制。</text><path d="M28 1016H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="1070" font-size="17" font-weight="400" text-anchor="start">五個情境是平行用途，不是同一請求的五個階段。圖片HTML是可讀範例，不會在本頁執行；不</text><text x="28" y="1102" font-size="17" font-weight="400" text-anchor="start">會載入遠端CDN或執行程式。</text></g></svg>
