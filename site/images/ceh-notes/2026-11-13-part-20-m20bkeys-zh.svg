<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 418" role="img" aria-labelledby="title desc" lang="zh"><title id="title">對稱與非對稱：金鑰角色比較</title><desc id="desc">兩欄是平行比較。非對稱欄以加密為例；數位簽章使用另一套簽署與驗證流程。</desc><rect width="900" height="418" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">對稱與非對稱：金鑰角色比較</text><rect x="28.0" y="88" width="388.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">對稱式加密</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Symmetric Encryption</text><text x="222.0" y="190" font-size="18" font-weight="400" text-anchor="middle">加密與解密使用相同或容易互推的秘密金鑰</text><text x="222.0" y="222" font-size="18" font-weight="400" text-anchor="middle">。</text><text x="222.0" y="254" font-size="18" font-weight="400" text-anchor="middle">AES、Blowfish、Twofish、DES</text><rect x="456.0" y="88" width="388.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">非對稱式加密</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Asymmetric Encryption</text><text x="650.0" y="190" font-size="18" font-weight="400" text-anchor="middle">使用有特定數學關係的公鑰與私鑰。</text><text x="650.0" y="222" font-size="18" font-weight="400" text-anchor="middle">加密方案可用公鑰加密、私鑰解密，例如</text><text x="650.0" y="254" font-size="18" font-weight="400" text-anchor="middle">RSA。</text><text x="28" y="368" font-size="17" font-weight="400" text-anchor="start">兩欄是平行比較。非對稱欄以加密為例；數位簽章使用另一套簽署與驗證流程。</text></g></svg>
