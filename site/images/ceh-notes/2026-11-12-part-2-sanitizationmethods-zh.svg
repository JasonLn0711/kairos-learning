<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668.5000000000001" role="img" aria-labelledby="title desc" lang="zh"><title id="title">Clear／Purge／Destroy 比較</title><desc id="desc">三種方法依資料敏感性、媒體及後續用途選擇，並非必須依序執行。</desc><rect width="900" height="668.5000000000001" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">Clear／Purge／Destroy 比較</text><rect x="28" y="101.6" width="844" height="146.39999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="135.6" font-size="20" font-weight="700">Clear｜§3.1.1</text><text x="46" y="174.6" font-size="18" font-weight="400">目標：抵抗簡單、非侵入式的資料復原。針對使用者可存取的儲存區域，採用適當的邏輯清理技術。</text><text x="46" y="204.29999999999998" font-size="18" font-weight="400">例：對適合的媒體，透過標準讀寫介面覆寫使用者可定址的資料區域。</text><rect x="28" y="266.0" width="844" height="146.39999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="300.0" font-size="20" font-weight="700">Purge｜§3.1.2</text><text x="46" y="339.0" font-size="18" font-weight="400">目標：使先進實驗室復原技術也無法可行地還原目標資料。使用適合媒體的邏輯或實體技術，並保留</text><text x="46" y="368.7" font-size="18" font-weight="400">媒體可能再次使用的能力。例：符合條件的裝置清理指令、Cryptographic Erase。</text><rect x="28" y="430.4" width="844" height="146.4000000000001" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="464.4" font-size="20" font-weight="700">Destroy｜§3.1.3</text><text x="46" y="503.4" font-size="18" font-weight="400">目標：使資料無法以先進實驗室技術可行地復原，並讓媒體失去儲存功能。使用符合媒體特性的實體</text><text x="46" y="533.1" font-size="18" font-weight="400">破壞程序。例：適當規格的媒體粉碎、解體或其他核准的銷毀技術。</text><text x="28" y="618.8000000000001" font-size="18" font-weight="400">三種方法依資料敏感性、媒體及後續用途選擇，並非必須依序執行。</text></g></svg>
