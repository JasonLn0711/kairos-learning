<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" role="img" aria-labelledby="title desc" lang="zh"><title id="title">區塊長度與金鑰長度：兩個獨立參數</title><desc id="desc">條長以 128 bits 為比較基準。Blowfish 支援 32–448-bit 金鑰，但區塊始終為 64 bits；長金鑰不會增加區塊大小。</desc><rect width="900" height="554" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">區塊長度與金鑰長度：兩個獨立參數</text><text x="28" y="108" font-size="20" font-weight="700" text-anchor="start">Blowfish 區塊</text><rect x="28" y="152" width="408" height="18" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="28" y="202" font-size="18" font-weight="400" text-anchor="start">64 bits＝8 bytes</text><text x="28" y="284" font-size="20" font-weight="700" text-anchor="start">AES 區塊</text><rect x="28" y="328" width="816" height="18" rx="12" fill="#c6dfea" stroke="#b8d5c5"/><text x="28" y="378" font-size="18" font-weight="400" text-anchor="start">128 bits＝16 bytes</text><text x="28" y="472" font-size="17" font-weight="400" text-anchor="start">條長以 128 bits 為比較基準。Blowfish 支援 32–448-bit 金鑰，但區塊始終為 64</text><text x="28" y="504" font-size="17" font-weight="400" text-anchor="start">bits；長金鑰不會增加區塊大小。</text></g></svg>
