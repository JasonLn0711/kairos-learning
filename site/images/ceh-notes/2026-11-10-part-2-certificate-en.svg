<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1940" role="img" aria-labelledby="title desc" lang="en"><title id="title">Certificate-based TLS 1.3: CA, server and browser</title><desc id="desc">The CA issues the certificate beforehand and need not participate in every handshake. Arrows indicate message direction; dashed replies do not denote encryption state. Optional messages and some encryption details are omitted; see RFC 9846.</desc><rect width="900" height="1940" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Certificate-based TLS 1.3: CA, server and browser</text><rect x="28" y="88" width="268" height="242" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="162.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Certificate</text><text x="162.0" y="152" font-size="20" font-weight="700" text-anchor="middle">authority (CA)</text><text x="162.0" y="190" font-size="18" font-weight="400" text-anchor="middle">Validate the</text><text x="162.0" y="222" font-size="18" font-weight="400" text-anchor="middle">application and</text><text x="162.0" y="254" font-size="18" font-weight="400" text-anchor="middle">sign the</text><text x="162.0" y="286" font-size="18" font-weight="400" text-anchor="middle">certificate</text><rect x="316" y="88" width="268" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="450.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Web server</text><text x="450.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Retain its own</text><text x="450.0" y="190" font-size="18" font-weight="400" text-anchor="middle">private key</text><rect x="604" y="88" width="268" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="738.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Browser</text><text x="738.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Validate server</text><text x="738.0" y="190" font-size="18" font-weight="400" text-anchor="middle">identity</text><path d="M738 362V1762" fill="none" stroke="#a2aaa6" stroke-width="2"/><path d="M450 362V1762" fill="none" stroke="#a2aaa6" stroke-width="2"/><path d="M162 362V1762" fill="none" stroke="#a2aaa6" stroke-width="2"/><rect x="28" y="362" width="844" height="112" rx="12" fill="#fff6e9" stroke="#b8d5c5"/><text x="450" y="390" font-size="20" font-weight="700" text-anchor="middle">Complete certificate application and issuance beforehand</text><text x="450" y="428" font-size="18" font-weight="400" text-anchor="middle">CA and server: before the connection</text><text x="306.0" y="522" font-size="20" font-weight="700" text-anchor="middle">Issue and sign the</text><text x="306.0" y="554" font-size="20" font-weight="700" text-anchor="middle">certificate</text><text x="306.0" y="590" font-size="18" font-weight="400" text-anchor="middle">CA → Web server</text><path d="M162 634H450m-8-6 8 6 -8 6" fill="none" stroke="#77867f" stroke-width="2" stroke-dasharray="5 4"/><text x="594.0" y="698" font-size="20" font-weight="700" text-anchor="middle">ClientHello + key_</text><text x="594.0" y="730" font-size="20" font-weight="700" text-anchor="middle">share</text><text x="594.0" y="766" font-size="18" font-weight="400" text-anchor="middle">Browser → Web server</text><path d="M738 810H450m8-6 -8 6 8 6" fill="none" stroke="#77867f" stroke-width="2"/><text x="594.0" y="874" font-size="20" font-weight="700" text-anchor="middle">ServerHello + key_</text><text x="594.0" y="906" font-size="20" font-weight="700" text-anchor="middle">share</text><text x="594.0" y="942" font-size="18" font-weight="400" text-anchor="middle">Web server → Browser</text><path d="M450 986H738m-8-6 8 6 -8 6" fill="none" stroke="#77867f" stroke-width="2" stroke-dasharray="5 4"/><text x="594.0" y="1050" font-size="20" font-weight="700" text-anchor="middle">Certificate +</text><text x="594.0" y="1082" font-size="20" font-weight="700" text-anchor="middle">CertificateVerify</text><text x="594.0" y="1118" font-size="18" font-weight="400" text-anchor="middle">Web server → Browser</text><path d="M450 1162H738m-8-6 8 6 -8 6" fill="none" stroke="#77867f" stroke-width="2" stroke-dasharray="5 4"/><text x="594.0" y="1226" font-size="20" font-weight="700" text-anchor="middle">Finished</text><text x="594.0" y="1262" font-size="18" font-weight="400" text-anchor="middle">Web server → Browser</text><path d="M450 1306H738m-8-6 8 6 -8 6" fill="none" stroke="#77867f" stroke-width="2" stroke-dasharray="5 4"/><rect x="28" y="1346" width="844" height="112" rx="12" fill="#fff6e9" stroke="#b8d5c5"/><text x="450" y="1374" font-size="20" font-weight="700" text-anchor="middle">Validate certificate chain, domain and signatures</text><text x="450" y="1412" font-size="18" font-weight="400" text-anchor="middle">Browser checks locally; this box groups validation duties</text><text x="594.0" y="1506" font-size="20" font-weight="700" text-anchor="middle">Finished</text><text x="594.0" y="1542" font-size="18" font-weight="400" text-anchor="middle">Browser → Web server</text><path d="M738 1586H450m8-6 -8 6 8 6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="1626" width="844" height="112" rx="12" fill="#fff6e9" stroke="#b8d5c5"/><text x="450" y="1654" font-size="20" font-weight="700" text-anchor="middle">Protect application data with derived symmetric keys</text><text x="450" y="1692" font-size="18" font-weight="400" text-anchor="middle">Web server ↔ Browser</text><text x="28" y="1794" font-size="17" font-weight="400" text-anchor="start">The CA issues the certificate beforehand and need not participate in</text><text x="28" y="1826" font-size="17" font-weight="400" text-anchor="start">every handshake. Arrows indicate message direction; dashed replies do</text><text x="28" y="1858" font-size="17" font-weight="400" text-anchor="start">not denote encryption state. Optional messages and some encryption</text><text x="28" y="1890" font-size="17" font-weight="400" text-anchor="start">details are omitted; see RFC 9846.</text></g></svg>
