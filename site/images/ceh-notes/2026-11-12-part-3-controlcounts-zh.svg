<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 920.8000000000002" role="img" aria-labelledby="title desc" lang="zh"><title id="title">ISO/IEC 27002：93 項控制分布</title><desc id="desc">長條依 37／93、8／93、14／93、34／93 的真正比例呈現；數量不代表重要性。 控制總數為 93 項。</desc><rect width="900" height="920.8000000000002" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">ISO/IEC 27002：93 項控制分布</text><text x="28" y="125.6" font-size="20" font-weight="700">組織控制｜37</text><rect x="28" y="158.6" width="844" height="26" rx="12" fill="#e7ece9" stroke="#adc8bc"/><rect x="28" y="158.6" width="335.78494623655916" height="26" rx="12" fill="#3d7660" stroke="#adc8bc"/><text x="28" y="216.6" font-size="18" font-weight="400">37 / 93 (39.8%)</text><text x="28" y="286.29999999999995" font-size="20" font-weight="700">人員控制｜8</text><rect x="28" y="319.29999999999995" width="844" height="26" rx="12" fill="#e7ece9" stroke="#adc8bc"/><rect x="28" y="319.29999999999995" width="72.60215053763442" height="26" rx="12" fill="#3d7660" stroke="#adc8bc"/><text x="28" y="377.29999999999995" font-size="18" font-weight="400">8 / 93 (8.6%)</text><text x="28" y="446.99999999999994" font-size="20" font-weight="700">實體控制｜14</text><rect x="28" y="479.99999999999994" width="844" height="26" rx="12" fill="#e7ece9" stroke="#adc8bc"/><rect x="28" y="479.99999999999994" width="127.05376344086021" height="26" rx="12" fill="#3d7660" stroke="#adc8bc"/><text x="28" y="538.0" font-size="18" font-weight="400">14 / 93 (15.1%)</text><text x="28" y="607.7" font-size="20" font-weight="700">技術控制｜34</text><rect x="28" y="640.7" width="844" height="26" rx="12" fill="#e7ece9" stroke="#adc8bc"/><rect x="28" y="640.7" width="308.55913978494624" height="26" rx="12" fill="#3d7660" stroke="#adc8bc"/><text x="28" y="698.7" font-size="18" font-weight="400">34 / 93 (36.6%)</text><text x="28" y="764.4000000000001" font-size="20" font-weight="700">37 + 8 + 14 + 34 = 93</text><text x="28" y="841.4000000000001" font-size="18" font-weight="400">長條依 37／93、8／93、14／93、34／93 的真正比例呈現；數量不代表重要性。 控制總數為</text><text x="28" y="871.1000000000001" font-size="18" font-weight="400">93 項。</text></g></svg>
