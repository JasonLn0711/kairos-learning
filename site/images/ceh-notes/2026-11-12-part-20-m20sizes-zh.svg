<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" role="img" aria-labelledby="title desc" lang="zh"><title id="title">AES 的區塊長度與金鑰長度</title><desc id="desc">四列列出規格，不以條長模擬安全程度。AES-256 的 256 指金鑰長度，區塊仍是 128 bits。</desc><rect width="900" height="960" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">AES 的區塊長度與金鑰長度</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Block Size｜區塊長度</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">128 bits；AES-128、AES-192、AES-256 都相同。</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">AES-128 的 Key Size</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">128 bits</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">AES-192 的 Key Size</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">192 bits</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">AES-256 的 Key Size</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">256 bits</text><text x="28" y="878" font-size="17" font-weight="400" text-anchor="start">四列列出規格，不以條長模擬安全程度。AES-256 的 256 指金鑰長度，區塊仍是 128 bits</text><text x="28" y="910" font-size="17" font-weight="400" text-anchor="start">。</text></g></svg>
