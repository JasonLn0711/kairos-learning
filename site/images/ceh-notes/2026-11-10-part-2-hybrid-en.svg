<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1290" role="img" aria-labelledby="title desc" lang="en"><title id="title">Roles in hybrid cryptography</title><desc id="desc">ECDHE and certificate/signature validation have distinct roles, converging on authenticated AEAD protection. This is a functional dependency diagram, not an exact TLS packet timeline.</desc><rect width="900" height="1290" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H222.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M222.0 468V512.0H222.0V556m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 468V512.0H650.0V556m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M222.0 702V746.0H436.0V790m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 702V746.0H436.0V790m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 904V948.0H436.0V992m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Roles in hybrid cryptography</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Asymmetric establishment: ECDHE</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Produce a shared secret</text><rect x="28.0" y="290" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Shared secret</text><text x="222.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Input to key derivation</text><rect x="456.0" y="290" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Certificates / digital</text><text x="650.0" y="354" font-size="20" font-weight="700" text-anchor="middle">signatures</text><text x="650.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Provide authentication</text><text x="650.0" y="424" font-size="18" font-weight="400" text-anchor="middle">evidence</text><rect x="28.0" y="556" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="588" font-size="20" font-weight="700" text-anchor="middle">KDF derives connection keys</text><text x="222.0" y="626" font-size="18" font-weight="400" text-anchor="middle">Do not use the raw secret</text><text x="222.0" y="658" font-size="18" font-weight="400" text-anchor="middle">directly for every purpose</text><rect x="456.0" y="556" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="588" font-size="20" font-weight="700" text-anchor="middle">Authenticate the peer</text><text x="650.0" y="626" font-size="18" font-weight="400" text-anchor="middle">Validate the peer and</text><text x="650.0" y="658" font-size="18" font-weight="400" text-anchor="middle">handshake trust relationship</text><rect x="28.0" y="790" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="822" font-size="20" font-weight="700" text-anchor="middle">Symmetric AEAD, such as AES-GCM</text><text x="436.0" y="860" font-size="18" font-weight="400" text-anchor="middle">Protect data with correct nonces, keys and verification</text><rect x="28.0" y="992" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1024" font-size="20" font-weight="700" text-anchor="middle">Protected application data</text><text x="436.0" y="1062" font-size="18" font-weight="400" text-anchor="middle">Confidentiality and integrity protection</text><text x="28" y="1176" font-size="17" font-weight="400" text-anchor="start">ECDHE and certificate/signature validation have distinct roles,</text><text x="28" y="1208" font-size="17" font-weight="400" text-anchor="start">converging on authenticated AEAD protection. This is a functional</text><text x="28" y="1240" font-size="17" font-weight="400" text-anchor="start">dependency diagram, not an exact TLS packet timeline.</text></g></svg>
