<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc" lang="en"><title id="title">Transaction integrity: unauthorized amount change</title><desc id="desc">The two states compare the original instruction with tampered content, not two executed transfers. The amount changes from NT$10,000 to NT$100,000.</desc><rect width="900" height="450" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Transaction integrity: unauthorized amount change</text><rect x="28.0" y="88" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Original instruction · NT$</text><text x="222.0" y="152" font-size="20" font-weight="700" text-anchor="middle">10,000</text><text x="222.0" y="190" font-size="18" font-weight="400" text-anchor="middle">Transfer to the specified</text><text x="222.0" y="222" font-size="18" font-weight="400" text-anchor="middle">recipient</text><rect x="456.0" y="88" width="388.0" height="178" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Tampered instruction · NT$</text><text x="650.0" y="152" font-size="20" font-weight="700" text-anchor="middle">100,000</text><text x="650.0" y="190" font-size="18" font-weight="400" text-anchor="middle">The amount was maliciously</text><text x="650.0" y="222" font-size="18" font-weight="400" text-anchor="middle">changed</text><text x="28" y="336" font-size="17" font-weight="400" text-anchor="start">The two states compare the original instruction with tampered content</text><text x="28" y="368" font-size="17" font-weight="400" text-anchor="start">, not two executed transfers. The amount changes from NT$10,000 to NT</text><text x="28" y="400" font-size="17" font-weight="400" text-anchor="start">$100,000.</text></g></svg>
