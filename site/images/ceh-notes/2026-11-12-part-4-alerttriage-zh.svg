<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1162" role="img" aria-labelledby="title desc" lang="zh"><title id="title">從安全訊號到事件判定與必要升級</title><desc id="desc">Incident Determination 依事先定義的條件確認是否宣告資安事件；異常或告警本身並不等於已確認事件。後續依事件等級及處置權限採取適當行動。</desc><rect width="900" height="1162" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">從安全訊號到事件判定與必要升級</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Telemetry / Logs</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">收到登入時間、來源、帳號及端點資訊</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Alert</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">規則或分析系統標示可疑活動</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Triage</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">比對授權變更、帳號行為及其他日誌</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Incident Determination</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">依事先定義的條件確認是否宣告資安事件</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">Escalation / Response</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">依事件等級通知適當人員並採取行動</text><text x="28" y="1080" font-size="17" font-weight="400" text-anchor="start">Incident Determination 依事先定義的條件確認是否宣告資安事件；異常或告警本身並不</text><text x="28" y="1112" font-size="17" font-weight="400" text-anchor="start">等於已確認事件。後續依事件等級及處置權限採取適當行動。</text></g></svg>
