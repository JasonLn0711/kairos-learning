<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1534" role="img" aria-labelledby="title desc" lang="zh"><title id="title">整合風險與隱私治理的七步驟</title><desc id="desc">以範圍、證據、處理與持續審查串起治理；各指引角色不同。</desc><rect width="900" height="1534" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1010V1054.0H436.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1212V1256.0H436.0V1300m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">整合風險與隱私治理的七步驟</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">1｜定義組織與系統範圍</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">ISO/IEC 27001 第 4–6 條。</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">2｜建立風險情境與接受準則</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">ISO/IEC 27005 第 6–7 條。</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">3｜分析威脅、弱點、可能性與衝擊</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">參考 NIST SP 800-30、OWASP、MITRE ATT&amp;CK。</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">4｜決定必要控制</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">ISO/IEC 27002；27001 第 6.1.3 條。</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">5｜處理計畫與適用性聲明</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">ISO/IEC 27001 第 6.1.3 條。</text><rect x="28.0" y="1098" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">6｜處理涉及個人資料的隱私風險</text><text x="436.0" y="1168" font-size="18" font-weight="400" text-anchor="middle">ISO/IEC 27701 與適用法律。</text><rect x="28.0" y="1300" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1332" font-size="20" font-weight="700" text-anchor="middle">7｜驗證控制、接受剩餘風險、持續審查</text><text x="436.0" y="1370" font-size="18" font-weight="400" text-anchor="middle">27001 第 8–10 條；27005 第 10 條。</text><text x="28" y="1484" font-size="17" font-weight="400" text-anchor="start">以範圍、證據、處理與持續審查串起治理；各指引角色不同。</text></g></svg>
