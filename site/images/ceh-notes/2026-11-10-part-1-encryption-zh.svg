<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" role="img" aria-labelledby="title desc" lang="zh"><title id="title">加密與解密：由明文到密文，再還原</title><desc id="desc">密文只示意呈現形式，並非實際加密計算結果。銀行密碼是虛構教學資料；實際加密另需適當模式與金鑰管理。</desc><rect width="900" height="724" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">加密與解密：由明文到密文，再還原</text><text x="450" y="114" font-size="20" font-weight="700" text-anchor="middle">原始資料：明文 Plaintext</text><text x="450" y="154" font-size="18" font-weight="400" text-anchor="middle">我的銀行密碼是 123456</text><path d="M450 198v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="296" font-size="20" font-weight="700" text-anchor="middle">使用加密演算法與金鑰 → 密文 Ciphertext</text><text x="450" y="336" font-size="18" font-weight="400" text-anchor="middle">7F A2 9C 41 ...</text><text x="450" y="368" font-size="18" font-weight="400" text-anchor="middle">示意字串，非實際加密結果</text><path d="M450 412v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="510" font-size="20" font-weight="700" text-anchor="middle">使用適當金鑰解密</text><text x="450" y="550" font-size="18" font-weight="400" text-anchor="middle">還原原始內容</text><text x="28" y="636" font-size="17" font-weight="400" text-anchor="start">密文只示意呈現形式，並非實際加密計算結果。銀行密碼是虛構教學資料；實際加密另需適當</text><text x="28" y="668" font-size="17" font-weight="400" text-anchor="start">模式與金鑰管理。</text></g></svg>
