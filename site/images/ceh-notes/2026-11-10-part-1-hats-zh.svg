<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="title desc" lang="zh"><title id="title">白帽、黑帽與灰帽：先看授權與目的</title><desc id="desc">三列是角色比較，不是先後流程。動機、授權、實際行為與適用法律須一起判斷；帽子名稱不構成法律豁免。</desc><rect width="900" height="740" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">白帽、黑帽與灰帽：先看授權與目的</text><rect x="28" y="90" width="62" height="62" rx="12" fill="#eaf5f1" stroke="#d8dce0"/><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" fill="none" stroke="#006b39" stroke-width="2" transform="translate(40 102) scale(1.6)"/><path d="m8 12 3 3 5-6" fill="none" stroke="#006b39" stroke-width="2" transform="translate(40 102) scale(1.6)"/><text x="110" y="118" font-size="20" font-weight="700" text-anchor="start">White Hat（白帽駭客）</text><text x="110" y="158" font-size="18" font-weight="400" text-anchor="start">在有效授權範圍內執行安全測試，目的是找出並改善安全問題。</text><text x="110" y="190" font-size="18" font-weight="400" text-anchor="start">例子：公司聘請資安顧問進行滲透測試。</text><path d="M28 250H872" fill="none" stroke="#e1e5e8" stroke-width="2" /><rect x="28" y="276" width="62" height="62" rx="12" fill="#f9eeee" stroke="#d8dce0"/><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" fill="none" stroke="#b52323" stroke-width="2" transform="translate(40 288) scale(1.6)"/><path d="M12 8v5m0 3v1" fill="none" stroke="#b52323" stroke-width="2" transform="translate(40 288) scale(1.6)"/><text x="110" y="304" font-size="20" font-weight="700" text-anchor="start">Black Hat（黑帽駭客）</text><text x="110" y="344" font-size="18" font-weight="400" text-anchor="start">通常為竊取、破壞或其他惡意目的，未經授權侵害系統。</text><text x="110" y="376" font-size="18" font-weight="400" text-anchor="start">例子：入侵公司資料庫，偷取客戶帳號。</text><path d="M28 436H872" fill="none" stroke="#e1e5e8" stroke-width="2" /><rect x="28" y="462" width="62" height="62" rx="12" fill="#f1f3f4" stroke="#d8dce0"/><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" fill="none" stroke="#18252c" stroke-width="2" transform="translate(40 474) scale(1.6)"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3v1" fill="none" stroke="#18252c" stroke-width="2" transform="translate(40 474) scale(1.6)"/><text x="110" y="490" font-size="20" font-weight="700" text-anchor="start">Grey Hat（灰帽駭客）</text><text x="110" y="530" font-size="18" font-weight="400" text-anchor="start">可能沒有直接惡意或獲利目的，卻在缺乏授權時測試。</text><text x="110" y="562" font-size="18" font-weight="400" text-anchor="start">例子：未經同意驗證網站漏洞，之後才通知站長。</text><text x="28" y="652" font-size="17" font-weight="400" text-anchor="start">三列是角色比較，不是先後流程。動機、授權、實際行為與適用法律須一起判斷；帽子名稱不</text><text x="28" y="684" font-size="17" font-weight="400" text-anchor="start">構成法律豁免。</text></g></svg>
