<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" role="img" aria-labelledby="title desc" lang="en"><title id="title">HTTP and HTTPS: protecting data in transit</title><desc id="desc">Upper row: HTTP without additional encryption may reveal content to an interceptor. Lower row: a correctly established HTTPS/TLS channel protects confidentiality and integrity. These are independent comparisons with no connection between the rows.</desc><rect width="900" height="780" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M273.33333333333337 193.0H313.33333333333337m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M558.6666666666667 193.0H598.6666666666667m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M273.33333333333337 475.0H313.33333333333337m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M558.6666666666667 475.0H598.6666666666667m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">HTTP and HTTPS: protecting data in transit</text><rect x="28.0" y="88" width="245.33333333333334" height="210" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="150.66666666666669" y="120" font-size="20" font-weight="700" text-anchor="middle">HTTP client</text><text x="150.66666666666669" y="158" font-size="18" font-weight="400" text-anchor="middle">Sends sensitive</text><text x="150.66666666666669" y="190" font-size="18" font-weight="400" text-anchor="middle">content</text><rect x="313.33333333333337" y="88" width="245.33333333333334" height="210" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="436.00000000000006" y="120" font-size="20" font-weight="700" text-anchor="middle">Readable content</text><text x="436.00000000000006" y="158" font-size="18" font-weight="400" text-anchor="middle">Transmission</text><text x="436.00000000000006" y="190" font-size="18" font-weight="400" text-anchor="middle">without</text><text x="436.00000000000006" y="222" font-size="18" font-weight="400" text-anchor="middle">additional</text><text x="436.00000000000006" y="254" font-size="18" font-weight="400" text-anchor="middle">encryption</text><rect x="598.6666666666667" y="88" width="245.33333333333334" height="210" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="721.3333333333334" y="120" font-size="20" font-weight="700" text-anchor="middle">HTTP server</text><text x="721.3333333333334" y="158" font-size="18" font-weight="400" text-anchor="middle">An interceptor</text><text x="721.3333333333334" y="190" font-size="18" font-weight="400" text-anchor="middle">may read captured</text><text x="721.3333333333334" y="222" font-size="18" font-weight="400" text-anchor="middle">content</text><rect x="28.0" y="386" width="245.33333333333334" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="150.66666666666669" y="418" font-size="20" font-weight="700" text-anchor="middle">HTTPS client</text><text x="150.66666666666669" y="456" font-size="18" font-weight="400" text-anchor="middle">Validates the</text><text x="150.66666666666669" y="488" font-size="18" font-weight="400" text-anchor="middle">server and</text><text x="150.66666666666669" y="520" font-size="18" font-weight="400" text-anchor="middle">connection</text><rect x="313.33333333333337" y="386" width="245.33333333333334" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.00000000000006" y="418" font-size="20" font-weight="700" text-anchor="middle">Encrypted data</text><text x="436.00000000000006" y="456" font-size="18" font-weight="400" text-anchor="middle">TLS protects the</text><text x="436.00000000000006" y="488" font-size="18" font-weight="400" text-anchor="middle">communication</text><text x="436.00000000000006" y="520" font-size="18" font-weight="400" text-anchor="middle">channel</text><rect x="598.6666666666667" y="386" width="245.33333333333334" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="721.3333333333334" y="418" font-size="20" font-weight="700" text-anchor="middle">HTTPS server</text><text x="721.3333333333334" y="456" font-size="18" font-weight="400" text-anchor="middle">Endpoints still</text><text x="721.3333333333334" y="488" font-size="18" font-weight="400" text-anchor="middle">process decrypted</text><text x="721.3333333333334" y="520" font-size="18" font-weight="400" text-anchor="middle">content</text><text x="28" y="634" font-size="17" font-weight="400" text-anchor="start">Upper row: HTTP without additional encryption may reveal content to</text><text x="28" y="666" font-size="17" font-weight="400" text-anchor="start">an interceptor. Lower row: a correctly established HTTPS/TLS channel</text><text x="28" y="698" font-size="17" font-weight="400" text-anchor="start">protects confidentiality and integrity. These are independent</text><text x="28" y="730" font-size="17" font-weight="400" text-anchor="start">comparisons with no connection between the rows.</text></g></svg>
