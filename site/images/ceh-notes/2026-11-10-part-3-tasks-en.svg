<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" role="img" aria-labelledby="title desc" lang="en"><title id="title">Four principal cryptographic tasks</title><desc id="desc">These are parallel tasks. A bare hash does not authenticate a sender; a signature does not directly provide confidentiality. Mechanisms are commonly combined.</desc><rect width="900" height="638" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Four principal cryptographic tasks</text><rect x="28" y="88" width="402" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Confidentiality</text><text x="229.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Keep data unreadable to</text><text x="229.0" y="190" font-size="18" font-weight="400" text-anchor="middle">unauthorized parties</text><text x="229.0" y="222" font-size="18" font-weight="400" text-anchor="middle">AES, Twofish, RSA encryption</text><rect x="458" y="88" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Key establishment</text><text x="659.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Establish shared keying material</text><text x="659.0" y="190" font-size="18" font-weight="400" text-anchor="middle">DH, ECDH, RSA-based schemes</text><rect x="28" y="290" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Integrity</text><text x="229.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Check whether data changed</text><text x="229.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Hashes, MACs, digital signatures</text><rect x="458" y="290" width="402" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Authentication</text><text x="659.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Check the relationship to a</text><text x="659.0" y="392" font-size="18" font-weight="400" text-anchor="middle">trusted party</text><text x="659.0" y="424" font-size="18" font-weight="400" text-anchor="middle">Digital signatures, PKI</text><text x="28" y="524" font-size="17" font-weight="400" text-anchor="start">These are parallel tasks. A bare hash does not authenticate a sender;</text><text x="28" y="556" font-size="17" font-weight="400" text-anchor="start">a signature does not directly provide confidentiality. Mechanisms are</text><text x="28" y="588" font-size="17" font-weight="400" text-anchor="start">commonly combined.</text></g></svg>
