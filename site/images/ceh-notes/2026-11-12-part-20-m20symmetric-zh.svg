<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 322" role="img" aria-labelledby="title desc" lang="zh"><title id="title">對稱式加密：共享秘密金鑰</title><desc id="desc">箭頭只表示 Alice 將密文傳送給 Bob，不表示秘密金鑰也經由此通道傳送。</desc><rect width="900" height="322" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M416.0 145.0H456.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><text x="436.0" y="133.0" text-anchor="middle" font-size="16">密文</text><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">對稱式加密：共享秘密金鑰</text><rect x="28.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Alice</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">持有 Secret Key K</text><rect x="456.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Bob</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">持有相同的 Secret Key K</text><text x="28" y="272" font-size="17" font-weight="400" text-anchor="start">箭頭只表示 Alice 將密文傳送給 Bob，不表示秘密金鑰也經由此通道傳送。</text></g></svg>
