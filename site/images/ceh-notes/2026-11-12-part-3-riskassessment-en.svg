<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 822" role="img" aria-labelledby="title desc" lang="en"><title id="title">Three steps in risk assessment</title><desc id="desc">Evaluation compares analysis results with established criteria.</desc><rect width="900" height="822" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 234V278.0H436.0V322m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 468V512.0H436.0V556m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Three steps in risk assessment</text><rect x="28.0" y="88" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Risk identification</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Identify threats that may exploit vulnerabilities and affect</text><text x="436.0" y="190" font-size="18" font-weight="400" text-anchor="middle">important assets and business activities.</text><rect x="28.0" y="322" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="354" font-size="20" font-weight="700" text-anchor="middle">Risk analysis</text><text x="436.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Estimate incident likelihood, consequences and uncertainty to</text><text x="436.0" y="424" font-size="18" font-weight="400" text-anchor="middle">establish the level of risk.</text><rect x="28.0" y="556" width="816.0" height="146" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="436.0" y="588" font-size="20" font-weight="700" text-anchor="middle">Risk evaluation</text><text x="436.0" y="626" font-size="18" font-weight="400" text-anchor="middle">Compare analysis results with predefined acceptance criteria to</text><text x="436.0" y="658" font-size="18" font-weight="400" text-anchor="middle">decide which risks require priority treatment.</text><text x="28" y="772" font-size="17" font-weight="400" text-anchor="start">Evaluation compares analysis results with established criteria.</text></g></svg>
