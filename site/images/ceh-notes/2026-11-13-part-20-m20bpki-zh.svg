<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" role="img" aria-labelledby="title desc" lang="zh"><title id="title">典型 X.509 憑證鏈</title><desc id="desc">向下箭頭表示簽發關係；驗證程式建立通往預先信任之信任錨的路徑。實際 PKI 階層可能不同。</desc><rect width="900" height="758" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">典型 X.509 憑證鏈</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Root CA（信任錨）</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">驗證系統預先信任的根</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Intermediate CA</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">由上一層 CA 授權簽發</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Server Certificate</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">將伺服器身分與公鑰連結</text><text x="28" y="676" font-size="17" font-weight="400" text-anchor="start">向下箭頭表示簽發關係；驗證程式建立通往預先信任之信任錨的路徑。實際 PKI 階層可能不同</text><text x="28" y="708" font-size="17" font-weight="400" text-anchor="start">。</text></g></svg>
