<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635.1500000000001" role="img" aria-labelledby="title desc" lang="en"><title id="title">PDCA continual improvement cycle</title><desc id="desc">Cycle: Plan → Do → Check → Act → Plan. This teaching model does not mechanically partition every clause.</desc><rect width="900" height="635.1500000000001" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">PDCA continual improvement cycle</text><rect x="28" y="101.6" width="404" height="146.39999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="135.6" font-size="20" font-weight="700">Plan</text><text x="46" y="174.6" font-size="18" font-weight="400">Scope, policy, risks and</text><text x="46" y="204.29999999999998" font-size="18" font-weight="400">objectives.</text><rect x="468" y="101.6" width="404" height="116.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="486" y="135.6" font-size="20" font-weight="700">Do</text><text x="486" y="174.6" font-size="18" font-weight="400">Controls and risk treatment.</text><rect x="28" y="296.0" width="404" height="146.39999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="330.0" font-size="20" font-weight="700">Act</text><text x="46" y="369.0" font-size="18" font-weight="400">Correction and management system</text><text x="46" y="398.7" font-size="18" font-weight="400">updates.</text><rect x="468" y="296.0" width="404" height="146.39999999999998" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="486" y="330.0" font-size="20" font-weight="700">Check</text><text x="486" y="369.0" font-size="18" font-weight="400">Audits, measurement and</text><text x="486" y="398.7" font-size="18" font-weight="400">management review.</text><text x="28" y="484.4" font-size="19" font-weight="700">Plan → Do → Check → Act → Plan</text><text x="28" y="555.75" font-size="18" font-weight="400">Cycle: Plan → Do → Check → Act → Plan. This teaching model does not</text><text x="28" y="585.45" font-size="18" font-weight="400">mechanically partition every clause.</text></g></svg>
