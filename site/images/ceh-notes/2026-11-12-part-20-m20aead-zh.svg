<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" role="img" aria-labelledby="title desc" lang="zh"><title id="title">AES-GCM 的簡化工作流程</title><desc id="desc">箭頭表示輸入與輸出；密文與驗證標籤是兩個並列結果。解密時必須驗證標籤，並遵守同一金鑰下的 nonce 規則。</desc><rect width="900" height="758" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H222.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H650.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">AES-GCM 的簡化工作流程</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">輸入</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">明文 + 金鑰 + Nonce + 關聯資料</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">AES-GCM</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">具關聯資料的認證加密</text><rect x="28.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Ciphertext｜密文</text><text x="222.0" y="562" font-size="18" font-weight="400" text-anchor="middle">隱藏明文內容</text><rect x="456.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Authentication Tag｜驗證標籤</text><text x="650.0" y="562" font-size="18" font-weight="400" text-anchor="middle">驗證受保護資料的完整性與真實性</text><text x="28" y="676" font-size="17" font-weight="400" text-anchor="start">箭頭表示輸入與輸出；密文與驗證標籤是兩個並列結果。解密時必須驗證標籤，並遵守同一金鑰下</text><text x="28" y="708" font-size="17" font-weight="400" text-anchor="start">的 nonce 規則。</text></g></svg>
