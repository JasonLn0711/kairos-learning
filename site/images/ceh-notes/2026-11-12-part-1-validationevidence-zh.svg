<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1162" role="img" aria-labelledby="title desc" lang="zh"><title id="title">從潛在弱點到可驗證的改善</title><desc id="desc">箭頭表示驗證與改善的工作順序；受控驗證使用已授權資產與測試資料，不以增加破壞或大量取得真實資料作為證明。</desc><rect width="900" height="1162" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">從潛在弱點到可驗證的改善</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">觀察到潛在弱點</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">掃描、設定分析、原始碼審查</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">建立可驗證假說</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">在指定條件下，這個弱點是否可被利用？</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">受控驗證</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">使用授權資產與測試資料，採取足以確認弱點的操作</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">記錄觀察與限制</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">證據、影響、測試條件、未測試範圍</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">修補與再次驗證</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">確認弱點關閉，且正常業務沒有受到破壞</text><text x="28" y="1080" font-size="17" font-weight="400" text-anchor="start">箭頭表示驗證與改善的工作順序；受控驗證使用已授權資產與測試資料，不以增加破壞或大量取得</text><text x="28" y="1112" font-size="17" font-weight="400" text-anchor="start">真實資料作為證明。</text></g></svg>
