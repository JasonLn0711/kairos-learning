<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" role="img" aria-labelledby="title desc" lang="en"><title id="title">CIA: three information-security objectives</title><desc id="desc">These are fundamental information-security objectives used by NIST. The three columns are parallel objectives, not sequential steps.</desc><rect width="900" height="416" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CIA: three information-security objectives</text><rect x="28" y="84" width="272" height="216" rx="14" fill="#e9f2f7" stroke="#d8dce0"/><rect x="312" y="84" width="272" height="216" rx="14" fill="#eaf5f1" stroke="#d8dce0"/><rect x="596" y="84" width="272" height="216" rx="14" fill="#f7f3ea" stroke="#d8dce0"/><path d="M3 3l18 18M10.5 10.5a2 2 0 0 0 3 3M9 5.5A12 12 0 0 1 12 5c7 0 10 7 10 7a17 17 0 0 1-3.5 4.5M6 6.5A19 19 0 0 0 2 12s3 7 10 7a12 12 0 0 0 5-1" transform="translate(148 100)" fill="none" stroke="#0067b3" stroke-width="1.8"/><text x="164" y="160" font-size="24" font-weight="700" text-anchor="middle">C</text><text x="164" y="192" font-size="18" font-weight="400" text-anchor="middle">Confidentiality</text><text x="164" y="224" font-size="18" font-weight="400" text-anchor="middle">Confidentiality</text><text x="164" y="256" font-size="18" font-weight="400" text-anchor="middle">Prevent unauthorized viewing</text><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Zm-3 9 2 2 4-5" transform="translate(432 100)" fill="none" stroke="#006b39" stroke-width="1.8"/><text x="448" y="160" font-size="24" font-weight="700" text-anchor="middle">I</text><text x="448" y="192" font-size="18" font-weight="400" text-anchor="middle">Integrity</text><text x="448" y="224" font-size="18" font-weight="400" text-anchor="middle">Integrity</text><text x="448" y="256" font-size="18" font-weight="400" text-anchor="middle">Prevent unauthorized alteration</text><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18m0 4v5l-3 3" transform="translate(716 100)" fill="none" stroke="#5c6064" stroke-width="1.8"/><text x="732" y="160" font-size="24" font-weight="700" text-anchor="middle">A</text><text x="732" y="192" font-size="18" font-weight="400" text-anchor="middle">Availability</text><text x="732" y="224" font-size="18" font-weight="400" text-anchor="middle">Availability</text><text x="732" y="256" font-size="18" font-weight="400" text-anchor="middle">Provide normal use when needed</text><text x="28" y="336" font-size="17" font-weight="400" text-anchor="start">These are fundamental information-security objectives used by NIST.</text><text x="28" y="368" font-size="17" font-weight="400" text-anchor="start">The three columns are parallel objectives, not sequential steps.</text></g></svg>
