<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" role="img" aria-labelledby="title desc" lang="zh"><title id="title">虛構案例：公司的滲透測試約定</title><desc id="desc">192.0.2.0/24 是保留供文件與教學使用的位址範圍；192.0.2.11 不會因鄰近而自動納入授權。</desc><rect width="900" height="648" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">虛構案例：公司的滲透測試約定</text><text x="42" y="116" font-size="18" font-weight="700" text-anchor="start">測試範圍</text><text x="332" y="116" font-size="18" font-weight="400" text-anchor="start">192.0.2.10 伺服器</text><path d="M28 160H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="204" font-size="18" font-weight="700" text-anchor="start">測試日期</text><text x="332" y="204" font-size="18" font-weight="400" text-anchor="start">星期六 10:00–14:00</text><path d="M28 248H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="292" font-size="18" font-weight="700" text-anchor="start">允許方式</text><text x="332" y="292" font-size="18" font-weight="400" text-anchor="start">指定的安全性驗證活動</text><path d="M28 336H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="380" font-size="18" font-weight="700" text-anchor="start">禁止事項</text><text x="332" y="380" font-size="18" font-weight="400" text-anchor="start">DoS、擅自刪除資料、超範圍存取</text><path d="M28 424H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="42" y="468" font-size="18" font-weight="700" text-anchor="start">事件通報</text><text x="332" y="468" font-size="18" font-weight="400" text-anchor="start">發現系統異常立即通報指定窗口</text><path d="M28 512H872" fill="none" stroke="#d8dce0" stroke-width="2" /><text x="28" y="560" font-size="17" font-weight="400" text-anchor="start">192.0.2.0/24 是保留供文件與教學使用的位址範圍；192.0.2.11 不會因鄰近而自動納</text><text x="28" y="592" font-size="17" font-weight="400" text-anchor="start">入授權。</text></g></svg>
