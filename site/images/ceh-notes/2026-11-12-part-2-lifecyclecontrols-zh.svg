<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 928" role="img" aria-labelledby="title desc" lang="zh"><title id="title">資料生命週期與清理</title><desc id="desc">清理方法依資料風險、媒體能力與驗證結果選擇。</desc><rect width="900" height="928" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">資料生命週期與清理</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">使用中的資料</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">防止未授權存取、竄改與服務中斷。</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">儲存、備份與封存</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">控制誰可以存取、如何保存、保存多久。</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">生命週期終點</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">選擇 Clear、Purge、Destroy 等適當處置。</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">驗證與證據</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">驗證清理結果並保存證據，確保後續再利用、報廢或委外回收符合風險要求。</text><text x="28" y="878" font-size="17" font-weight="400" text-anchor="start">清理方法依資料風險、媒體能力與驗證結果選擇。</text></g></svg>
