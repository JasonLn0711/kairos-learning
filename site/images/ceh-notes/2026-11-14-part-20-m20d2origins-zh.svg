<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 732" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 14｜Same-Origin 與 Same-Site 比較</title><desc id="desc">以 https://bank.example.com 為比較對象；現代 Schemeful Site 為 Scheme 加可註冊網域。bank 與 promo 的 Site 都是 https://example.com，但 Origin 不同。</desc><rect width="900" height="732" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 14｜Same-Origin 與 Same-Site 比較</text><text x="28" y="88" font-size="20" font-weight="700" text-anchor="start">其他網址</text><text x="490" y="88" font-size="20" font-weight="700" text-anchor="start">Origin</text><text x="680" y="88" font-size="20" font-weight="700" text-anchor="start">Site</text><text x="28" y="136" font-size="18" font-weight="400" text-anchor="start">https://bank.example.com</text><g fill="#006b39"><text x="490" y="136" font-size="22" font-weight="700" text-anchor="start">✓</text></g><text x="490" y="168" font-size="18" font-weight="400" text-anchor="start">相同</text><g fill="#006b39"><text x="680" y="136" font-size="22" font-weight="700" text-anchor="start">✓</text></g><text x="680" y="168" font-size="18" font-weight="400" text-anchor="start">相同</text><path d="M28 212H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="248" font-size="18" font-weight="400" text-anchor="start">https://promo.example.com</text><g fill="#b52323"><text x="490" y="248" font-size="22" font-weight="700" text-anchor="start">×</text></g><text x="490" y="280" font-size="18" font-weight="400" text-anchor="start">不同</text><g fill="#006b39"><text x="680" y="248" font-size="22" font-weight="700" text-anchor="start">✓</text></g><text x="680" y="280" font-size="18" font-weight="400" text-anchor="start">相同</text><path d="M28 324H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="360" font-size="18" font-weight="400" text-anchor="start">https://evil.example.net</text><g fill="#b52323"><text x="490" y="360" font-size="22" font-weight="700" text-anchor="start">×</text></g><text x="490" y="392" font-size="18" font-weight="400" text-anchor="start">不同</text><g fill="#b52323"><text x="680" y="360" font-size="22" font-weight="700" text-anchor="start">×</text></g><text x="680" y="392" font-size="18" font-weight="400" text-anchor="start">不同</text><path d="M28 436H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="472" font-size="18" font-weight="400" text-anchor="start">http://bank.example.com</text><g fill="#b52323"><text x="490" y="472" font-size="22" font-weight="700" text-anchor="start">×</text></g><text x="490" y="504" font-size="18" font-weight="400" text-anchor="start">不同</text><g fill="#b52323"><text x="680" y="472" font-size="22" font-weight="700" text-anchor="start">×</text></g><text x="680" y="504" font-size="18" font-weight="400" text-anchor="start">不同</text><path d="M28 548H872" fill="none" stroke="#d8dce0" stroke-width="2"/><text x="28" y="616" font-size="17" font-weight="400" text-anchor="start">以 https://bank.example.com 為比較對象；現代 Schemeful Site 為 Scheme 加</text><text x="28" y="648" font-size="17" font-weight="400" text-anchor="start">可註冊網域。bank 與 promo 的 Site 都是 https://example.com，但 Origin 不</text><text x="28" y="680" font-size="17" font-weight="400" text-anchor="start">同。</text></g></svg>
