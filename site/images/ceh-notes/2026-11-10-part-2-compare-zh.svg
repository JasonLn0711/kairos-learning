<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" role="img" aria-labelledby="title desc" lang="zh"><title id="title">Encryption 與 Hashing 的方向不同</title><desc id="desc">加密設計有對應的解密程序；雜湊沒有解密操作。低熵輸入仍可能被逐一猜測及計算摘要比對，這是猜輸入，不是解密。</desc><rect width="900" height="442" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Encryption 與 Hashing 的方向不同</text><rect x="28" y="90" width="404" height="210" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="46" y="124" font-size="20" font-weight="700" text-anchor="start">Encryption｜加密</text><text x="46" y="164" font-size="18" font-weight="400" text-anchor="start">明文</text><text x="46" y="196" font-size="18" font-weight="400" text-anchor="start">↓ 使用演算法與金鑰</text><text x="46" y="228" font-size="18" font-weight="400" text-anchor="start">密文</text><text x="46" y="260" font-size="18" font-weight="400" text-anchor="start">↑ 使用適當金鑰可還原明文</text><rect x="458" y="90" width="404" height="210" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="476" y="124" font-size="20" font-weight="700" text-anchor="start">Hashing｜雜湊</text><text x="476" y="164" font-size="18" font-weight="400" text-anchor="start">原始資料</text><text x="476" y="196" font-size="18" font-weight="400" text-anchor="start">↓ 雜湊函數</text><text x="476" y="228" font-size="18" font-weight="400" text-anchor="start">摘要</text><text x="476" y="260" font-size="18" font-weight="400" text-anchor="start">沒有對應的解密操作</text><text x="28" y="354" font-size="17" font-weight="400" text-anchor="start">加密設計有對應的解密程序；雜湊沒有解密操作。低熵輸入仍可能被逐一猜測及計算摘要比對</text><text x="28" y="386" font-size="17" font-weight="400" text-anchor="start">，這是猜輸入，不是解密。</text></g></svg>
