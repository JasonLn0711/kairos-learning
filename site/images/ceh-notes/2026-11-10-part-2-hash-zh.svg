<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc" lang="zh"><title id="title">不同內容通常產生不同的 Hash</title><desc id="desc">兩個輸入平行比較；摘要 A／B 是概念標籤，未顯示實際 SHA-256 結果。碰撞在數學上存在，安全性要求是難以找到可利用的碰撞。</desc><rect width="900" height="410" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">不同內容通常產生不同的 Hash</text><rect x="28" y="90" width="404" height="178" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="46" y="124" font-size="20" font-weight="700" text-anchor="start">輸入 A</text><text x="46" y="164" font-size="18" font-weight="400" text-anchor="start">病人血壓：120</text><text x="46" y="196" font-size="18" font-weight="400" text-anchor="start">↓ SHA-256</text><text x="46" y="228" font-size="18" font-weight="400" text-anchor="start">產生摘要 A</text><rect x="458" y="90" width="404" height="178" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="476" y="124" font-size="20" font-weight="700" text-anchor="start">輸入 B</text><text x="476" y="164" font-size="18" font-weight="400" text-anchor="start">病人血壓：180</text><text x="476" y="196" font-size="18" font-weight="400" text-anchor="start">↓ SHA-256</text><text x="476" y="228" font-size="18" font-weight="400" text-anchor="start">產生摘要 B（通常不同於 A）</text><text x="28" y="322" font-size="17" font-weight="400" text-anchor="start">兩個輸入平行比較；摘要 A／B 是概念標籤，未顯示實際 SHA-256 結果。碰撞在數學上</text><text x="28" y="354" font-size="17" font-weight="400" text-anchor="start">存在，安全性要求是難以找到可利用的碰撞。</text></g></svg>
