<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 11｜第一次 HTTP 請求與回應</title><desc id="desc">由 Browser 向 Bank Server 請求登入頁，再由 Bank Server 回傳 HTML。兩段是HTTP/1.1教學表示法，此階段假設尚未建立 Session。</desc><rect width="900" height="628" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 11｜第一次 HTTP 請求與回應</text><text x="28" y="112" font-size="20" font-weight="700" text-anchor="start">Browser → Bank Server｜HTTP Request</text><rect x="28" y="128" width="844" height="108" rx="12" fill="#f2f6f5" stroke="#d8dce0"/><g font-family="ui-monospace, Consolas, monospace"><text x="46" y="160" font-size="19" font-weight="400" text-anchor="start">GET /login HTTP/1.1</text><text x="46" y="192" font-size="19" font-weight="400" text-anchor="start">Host: bank.example.com</text></g><text x="28" y="292" font-size="20" font-weight="700" text-anchor="start">Bank Server → Browser｜HTTP Response</text><rect x="28" y="308" width="844" height="172" rx="12" fill="#f2f6f5" stroke="#d8dce0"/><g font-family="ui-monospace, Consolas, monospace"><text x="46" y="340" font-size="19" font-weight="400" text-anchor="start">HTTP/1.1 200 OK</text><text x="46" y="372" font-size="19" font-weight="400" text-anchor="start">Content-Type: text/html</text><text x="46" y="436" font-size="19" font-weight="400" text-anchor="start">&lt;html&gt;登入頁面...&lt;/html&gt;</text></g><text x="28" y="544" font-size="17" font-weight="400" text-anchor="start">由 Browser 向 Bank Server 請求登入頁，再由 Bank Server 回傳 HTML。兩段是</text><text x="28" y="576" font-size="17" font-weight="400" text-anchor="start">HTTP/1.1教學表示法，此階段假設尚未建立 Session。</text></g></svg>
