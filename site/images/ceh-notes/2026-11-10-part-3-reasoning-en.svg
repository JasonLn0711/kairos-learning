<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1662" role="img" aria-labelledby="title desc" lang="en"><title id="title">Reason from question evidence to the best answer</title><desc id="desc">Arrows show the reasoning process. Yes leads to the best answer; no records the intended exam answer and ambiguity while retaining the insufficiency of the evidence.</desc><rect width="900" height="1662" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1010V1054.0H436.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1212V1256.0H222.0V1300m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="1246.0" text-anchor="middle" font-size="16">Yes</text><path d="M436.0 1212V1256.0H650.0V1300m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="1246.0" text-anchor="middle" font-size="16">No</text><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Reason from question evidence to the best answer</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Read the question</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Read the complete prompt and options</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Identify the main security objective</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Confidentiality, integrity, identity or key establishment</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Classify the mechanism</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Encryption, key establishment, hash or signature</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Find discriminating technical conditions</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">Check schemes, parameters, uses and assumptions</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">Eliminate incompatible options</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">Explain each exclusion</text><rect x="28.0" y="1098" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">Enough evidence for a unique identification?</text><text x="436.0" y="1168" font-size="18" font-weight="400" text-anchor="middle">Check whether other mechanisms also fit</text><rect x="28.0" y="1300" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="1332" font-size="20" font-weight="700" text-anchor="middle">Select the best answer</text><text x="222.0" y="1370" font-size="18" font-weight="400" text-anchor="middle">Conclude when the evidence</text><text x="222.0" y="1402" font-size="18" font-weight="400" text-anchor="middle">suffices</text><rect x="456.0" y="1300" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="1332" font-size="20" font-weight="700" text-anchor="middle">Record the intended answer</text><text x="650.0" y="1364" font-size="20" font-weight="700" text-anchor="middle">and ambiguity</text><text x="650.0" y="1402" font-size="18" font-weight="400" text-anchor="middle">Retain limits when evidence is</text><text x="650.0" y="1434" font-size="18" font-weight="400" text-anchor="middle">insufficient</text><text x="28" y="1548" font-size="17" font-weight="400" text-anchor="start">Arrows show the reasoning process. Yes leads to the best answer; no</text><text x="28" y="1580" font-size="17" font-weight="400" text-anchor="start">records the intended exam answer and ambiguity while retaining the</text><text x="28" y="1612" font-size="17" font-weight="400" text-anchor="start">insufficiency of the evidence.</text></g></svg>
