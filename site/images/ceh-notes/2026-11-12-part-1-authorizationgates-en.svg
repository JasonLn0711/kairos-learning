<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1418" role="img" aria-labelledby="title desc" lang="en"><title id="title">Authorization and risk gates for security testing</title><desc id="desc">A practical model derived from NIST SP 800-115 and OWASP disclosure principles, not a legal-liability test. Both negative branches stop. Only the branch passing both gates proceeds to controlled verification and closure.</desc><rect width="900" height="1418" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H222.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="438.0" text-anchor="middle" font-size="16">No</text><path d="M436.0 404V448.0H650.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="438.0" text-anchor="middle" font-size="16">Yes</text><path d="M650.0 670V714.0H222.0V758m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="436.0" y="704.0" text-anchor="middle" font-size="16">No</text><path d="M650.0 670V714.0H650.0V758m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="650.0" y="704.0" text-anchor="middle" font-size="16">Yes</text><path d="M650.0 1000V1044.0H436.0V1088m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Authorization and risk gates for security testing</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Propose a testing activity</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">State the control and purpose to be assessed</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Is valid authorization in place?</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Authorizer, validity period, tester and assets</text><rect x="28.0" y="492" width="388.0" height="178" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="222.0" y="524" font-size="20" font-weight="700" text-anchor="middle">No: do not perform it as an</text><text x="222.0" y="556" font-size="20" font-weight="700" text-anchor="middle">authorized test</text><text x="222.0" y="594" font-size="18" font-weight="400" text-anchor="middle">Stop; obtain appropriate</text><text x="222.0" y="626" font-size="18" font-weight="400" text-anchor="middle">authorization and reassess</text><rect x="456.0" y="492" width="388.0" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Yes: review the activity</text><text x="650.0" y="556" font-size="20" font-weight="700" text-anchor="middle">and risk</text><text x="650.0" y="594" font-size="18" font-weight="400" text-anchor="middle">Does it comply with scope, ROE</text><text x="650.0" y="626" font-size="18" font-weight="400" text-anchor="middle">and risk limits?</text><rect x="28.0" y="758" width="388.0" height="242" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="222.0" y="790" font-size="20" font-weight="700" text-anchor="middle">No: stop and request an</text><text x="222.0" y="822" font-size="20" font-weight="700" text-anchor="middle">authorization change</text><text x="222.0" y="860" font-size="18" font-weight="400" text-anchor="middle">This branch does not proceed</text><text x="222.0" y="892" font-size="18" font-weight="400" text-anchor="middle">to execution or closure</text><rect x="456.0" y="758" width="388.0" height="242" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="790" font-size="20" font-weight="700" text-anchor="middle">Yes: perform controlled</text><text x="650.0" y="822" font-size="20" font-weight="700" text-anchor="middle">verification and preserve</text><text x="650.0" y="854" font-size="20" font-weight="700" text-anchor="middle">evidence</text><text x="650.0" y="892" font-size="18" font-weight="400" text-anchor="middle">Continue observing stop</text><text x="650.0" y="924" font-size="18" font-weight="400" text-anchor="middle">conditions and data-handling</text><text x="650.0" y="956" font-size="18" font-weight="400" text-anchor="middle">rules</text><rect x="28.0" y="1088" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1120" font-size="20" font-weight="700" text-anchor="middle">Report, remediate, retest and close</text><text x="436.0" y="1158" font-size="18" font-weight="400" text-anchor="middle">Record observations, limits, remediation and acceptance evidence</text><text x="28" y="1272" font-size="17" font-weight="400" text-anchor="start">A practical model derived from NIST SP 800-115 and OWASP disclosure</text><text x="28" y="1304" font-size="17" font-weight="400" text-anchor="start">principles, not a legal-liability test. Both negative branches stop.</text><text x="28" y="1336" font-size="17" font-weight="400" text-anchor="start">Only the branch passing both gates proceeds to controlled</text><text x="28" y="1368" font-size="17" font-weight="400" text-anchor="start">verification and closure.</text></g></svg>
