<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" role="img" aria-labelledby="title desc" lang="zh"><title id="title">未驗證的 DH：兩段不同的共同秘密</title><desc id="desc">雙向箭頭是不同的兩段關係：Alice ↔ Eve 使用 K1；Eve ↔ Bob 使用 K2。沒有 Alice 與 Bob 已建立可信直接連線的結論。</desc><rect width="900" height="386" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M273.33333333333337 161.0H313.33333333333337m-7-5 7 5-7 5M280.33333333333337 156.0l-7 5 7 5" fill="none" stroke="#77867f" stroke-width="2"/><text x="293.33333333333337" y="149.0" text-anchor="middle" font-size="16">K1</text><path d="M558.6666666666667 161.0H598.6666666666667m-7-5 7 5-7 5M565.6666666666667 156.0l-7 5 7 5" fill="none" stroke="#77867f" stroke-width="2"/><text x="578.6666666666667" y="149.0" text-anchor="middle" font-size="16">K2</text><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">未驗證的 DH：兩段不同的共同秘密</text><rect x="28.0" y="88" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="150.66666666666669" y="120" font-size="20" font-weight="700" text-anchor="middle">Alice</text><text x="150.66666666666669" y="158" font-size="18" font-weight="400" text-anchor="middle">以為對方是 Bob</text><rect x="313.33333333333337" y="88" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.00000000000006" y="120" font-size="20" font-weight="700" text-anchor="middle">Eve 攻擊者</text><text x="436.00000000000006" y="158" font-size="18" font-weight="400" text-anchor="middle">替換公開值；可解密再重</text><text x="436.00000000000006" y="190" font-size="18" font-weight="400" text-anchor="middle">新加密</text><rect x="598.6666666666667" y="88" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="721.3333333333334" y="120" font-size="20" font-weight="700" text-anchor="middle">Bob</text><text x="721.3333333333334" y="158" font-size="18" font-weight="400" text-anchor="middle">以為對方是 Alice</text><text x="28" y="304" font-size="17" font-weight="400" text-anchor="start">雙向箭頭是不同的兩段關係：Alice ↔ Eve 使用 K1；Eve ↔ Bob 使用 K2。沒有 Alice</text><text x="28" y="336" font-size="17" font-weight="400" text-anchor="start">與 Bob 已建立可信直接連線的結論。</text></g></svg>
