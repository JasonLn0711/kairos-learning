<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" role="img" aria-labelledby="title desc" lang="zh"><title id="title">三種儲存加密的保護範圍</title><desc id="desc">三種保護範圍平行比較，並非部署先後。圖中去除原圖容易造成順序誤解的箭頭；分類參考 NIST SP 800-111。</desc><rect width="900" height="542" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">三種儲存加密的保護範圍</text><rect x="28" y="88" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="120" font-size="20" font-weight="700" text-anchor="middle">整碟加密 Full Disk Encryption</text><text x="229.0" y="158" font-size="18" font-weight="400" text-anchor="middle">保護整個磁碟或系統磁碟資料；因應裝置遺失</text><text x="229.0" y="190" font-size="18" font-weight="400" text-anchor="middle">、遭竊及離線存取</text><rect x="458" y="88" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="120" font-size="20" font-weight="700" text-anchor="middle">磁碟區／容器加密</text><text x="659.0" y="158" font-size="18" font-weight="400" text-anchor="middle">保護特定分割區或虛擬磁碟；掛載後可當一般</text><text x="659.0" y="190" font-size="18" font-weight="400" text-anchor="middle">磁碟使用</text><rect x="28" y="258" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="290" font-size="20" font-weight="700" text-anchor="middle">檔案加密 File Encryption</text><text x="229.0" y="328" font-size="18" font-weight="400" text-anchor="middle">選擇性保護個別檔案或資料夾，不等同整碟加</text><text x="229.0" y="360" font-size="18" font-weight="400" text-anchor="middle">密</text><text x="28" y="460" font-size="17" font-weight="400" text-anchor="start">三種保護範圍平行比較，並非部署先後。圖中去除原圖容易造成順序誤解的箭頭；分類參考</text><text x="28" y="492" font-size="17" font-weight="400" text-anchor="start">NIST SP 800-111。</text></g></svg>
