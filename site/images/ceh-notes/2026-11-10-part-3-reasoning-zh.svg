<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1566" role="img" aria-labelledby="title desc" lang="zh"><title id="title">從題幹證據推理最佳答案</title><desc id="desc">箭頭表示判斷流程。「是」選出最佳答案；「否」記錄考試預期答案及歧義，保留線索不足的事實。</desc><rect width="900" height="1566" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1010V1054.0H436.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1212V1256.0H222.0V1300m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="1246.0" text-anchor="middle" font-size="16">是</text><path d="M436.0 1212V1256.0H650.0V1300m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="1246.0" text-anchor="middle" font-size="16">否</text><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">從題幹證據推理最佳答案</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">讀取題幹</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">先讀完整問題與選項</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">辨識主要安全目標</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">資料保密、完整性、身分或金鑰建立</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">分類技術</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">加密、金鑰建立、Hash 或簽章</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">找出最有鑑別力的技術條件</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">檢查方案、參數、用途與前提</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">排除不相容的選項</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">逐一說明理由</text><rect x="28.0" y="1098" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">證據足以唯一判定？</text><text x="436.0" y="1168" font-size="18" font-weight="400" text-anchor="middle">確認是否還有其他符合條件的方案</text><rect x="28.0" y="1300" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="1332" font-size="20" font-weight="700" text-anchor="middle">選出最佳答案</text><text x="222.0" y="1370" font-size="18" font-weight="400" text-anchor="middle">證據足夠時作結論</text><rect x="456.0" y="1300" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="1332" font-size="20" font-weight="700" text-anchor="middle">選考試預期答案並標註歧義</text><text x="650.0" y="1370" font-size="18" font-weight="400" text-anchor="middle">證據不足時保留限制</text><text x="28" y="1484" font-size="17" font-weight="400" text-anchor="start">箭頭表示判斷流程。「是」選出最佳答案；「否」記錄考試預期答案及歧義，保留線索不足的事實</text><text x="28" y="1516" font-size="17" font-weight="400" text-anchor="start">。</text></g></svg>
