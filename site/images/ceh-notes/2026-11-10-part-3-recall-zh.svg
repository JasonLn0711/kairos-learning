<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1724" role="img" aria-labelledby="title desc" lang="zh"><title id="title">六張密碼學回憶卡</title><desc id="desc">先回答原因，再看解析；翻卡或看答案不作學習完成紀錄。</desc><rect width="900" height="1724" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">六張密碼學回憶卡</text><rect x="28" y="84" width="844" height="228" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="108" font-size="16" font-weight="400" text-anchor="middle">1 / 6</text><text x="450" y="148" font-size="20" font-weight="400" text-anchor="middle">為什麼 128-bit Block + 256-bit Key 不能唯一識別 Twofish？</text><text x="42" y="192" font-size="16" font-weight="400" text-anchor="start">對應：19、21</text><text x="42" y="232" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="268" font-size="18" font-weight="400" text-anchor="start">AES 也符合；需要額外區辨條件，且「AES 決選者」也包含獲選的 Rijndael。</text><rect x="28" y="338" width="844" height="228" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="362" font-size="16" font-weight="400" text-anchor="middle">2 / 6</text><text x="450" y="402" font-size="20" font-weight="400" text-anchor="middle">全磁碟加密為何仍可能讓攻擊者讀病患資料？</text><text x="42" y="446" font-size="16" font-weight="400" text-anchor="start">對應：20</text><text x="42" y="486" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="522" font-size="18" font-weight="400" text-anchor="start">磁碟已解鎖且攻擊者有權限時，可沿應用讀取路徑取得明文；靜態加密不是入侵清除。</text><rect x="28" y="592" width="844" height="228" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="616" font-size="16" font-weight="400" text-anchor="middle">3 / 6</text><text x="450" y="656" font-size="20" font-weight="400" text-anchor="middle">DH 能建秘密，為何仍有中間人風險？</text><text x="42" y="700" font-size="16" font-weight="400" text-anchor="start">對應：22</text><text x="42" y="740" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="776" font-size="18" font-weight="400" text-anchor="start">若不驗證公開值的來源，對手可替換並分別與兩端建秘密。</text><rect x="28" y="846" width="844" height="228" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="870" font-size="16" font-weight="400" text-anchor="middle">4 / 6</text><text x="450" y="910" font-size="20" font-weight="400" text-anchor="middle">單獨 SHA-256 為何不能證明交易來自銀行？</text><text x="42" y="954" font-size="16" font-weight="400" text-anchor="start">對應：25、26</text><text x="42" y="994" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="1030" font-size="18" font-weight="400" text-anchor="start">誰都能對假交易重算摘要；需可信公鑰簽章或合適認證機制與身分綁定。</text><rect x="28" y="1100" width="844" height="260" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1124" font-size="16" font-weight="400" text-anchor="middle">5 / 6</text><text x="450" y="1164" font-size="20" font-weight="400" text-anchor="middle">DSA 的 k 為何不能在不同訊息不安全重用？</text><text x="42" y="1208" font-size="16" font-weight="400" text-anchor="start">對應：24</text><text x="42" y="1248" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="1284" font-size="18" font-weight="400" text-anchor="start">重用可暴露足以推回私鑰的數學關係；可用安全隨機來源或適當確定性方案，並遵循現代演算法標</text><text x="42" y="1316" font-size="18" font-weight="400" text-anchor="start">準。</text><rect x="28" y="1386" width="844" height="228" rx="14" fill="#fbfcfd" stroke="#d8dce0"/><text x="842" y="1410" font-size="16" font-weight="400" text-anchor="middle">6 / 6</text><text x="450" y="1450" font-size="20" font-weight="400" text-anchor="middle">RSA 驗證成功為何不等於真正銀行授權？</text><text x="42" y="1494" font-size="16" font-weight="400" text-anchor="start">對應：27</text><text x="42" y="1534" font-size="18" font-weight="700" text-anchor="start">參考答案</text><text x="42" y="1570" font-size="18" font-weight="400" text-anchor="start">驗證公鑰可能被冒換；即使可信綁定正確，還須檢查交易權限、時效與業務規則。</text><text x="28" y="1676" font-size="17" font-weight="400" text-anchor="start">先回答原因，再看解析；翻卡或看答案不作學習完成紀錄。</text></g></svg>
