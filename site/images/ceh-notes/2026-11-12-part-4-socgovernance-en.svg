<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1402" role="img" aria-labelledby="title desc" lang="en"><title id="title">Example organization: SOC, response escalation when needed and BCP activation by business impact</title><desc id="desc">This example illustrates one organization, not a mandatory structure for every SOC. Tier 1 and Tier 3 have parallel responsibilities. Not every alert requires Tier 3, major incident response or BCP activation. SLA, NDA and AUP are parallel governance documents, not sequential steps.</desc><rect width="900" height="1402" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 234V278.0H222.0V322m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 234V278.0H650.0V322m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M222.0 468V512.0H436.0V556m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="502.0" text-anchor="middle" font-size="16">If needed</text><path d="M650.0 468V512.0H436.0V556m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="502.0" text-anchor="middle" font-size="16">If needed</text><path d="M436.0 670V714.0H436.0V758m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="436.0" y="704.0" text-anchor="middle" font-size="16">Per impact</text><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Example organization: SOC, response escalation when needed and</text><text x="28" y="72" font-size="22" font-weight="700" text-anchor="start">BCP activation by business impact</text><rect x="28.0" y="120" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="152" font-size="20" font-weight="700" text-anchor="middle">SOC: continuous monitoring</text><text x="436.0" y="190" font-size="18" font-weight="400" text-anchor="middle">Logs, networks, endpoints, cloud and threat intelligence</text><rect x="28.0" y="322" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="354" font-size="20" font-weight="700" text-anchor="middle">Tier 1</text><text x="222.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Validate and triage alerts</text><rect x="456.0" y="322" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="354" font-size="20" font-weight="700" text-anchor="middle">Tier 3</text><text x="650.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Advanced investigation and</text><text x="650.0" y="424" font-size="18" font-weight="400" text-anchor="middle">threat hunting</text><rect x="28.0" y="556" width="816.0" height="114" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="436.0" y="588" font-size="20" font-weight="700" text-anchor="middle">Major incident response</text><text x="436.0" y="626" font-size="18" font-weight="400" text-anchor="middle">The Incident Commander coordinates decisions and actions</text><rect x="28.0" y="758" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="790" font-size="20" font-weight="700" text-anchor="middle">BCP: sustain critical business</text><text x="436.0" y="828" font-size="18" font-weight="400" text-anchor="middle">Alternative procedures, recovery resources and business restoration</text><text x="28" y="960" font-size="18" font-weight="700" text-anchor="start">Parallel governance documents (not response steps)</text><rect x="28.0" y="1008" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="150.66666666666669" y="1040" font-size="20" font-weight="700" text-anchor="middle">SLA</text><text x="150.66666666666669" y="1078" font-size="18" font-weight="400" text-anchor="middle">Service</text><text x="150.66666666666669" y="1110" font-size="18" font-weight="400" text-anchor="middle">commitments</text><rect x="313.33333333333337" y="1008" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.00000000000006" y="1040" font-size="20" font-weight="700" text-anchor="middle">NDA</text><text x="436.00000000000006" y="1078" font-size="18" font-weight="400" text-anchor="middle">Confidentiality</text><text x="436.00000000000006" y="1110" font-size="18" font-weight="400" text-anchor="middle">obligations</text><rect x="598.6666666666667" y="1008" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="721.3333333333334" y="1040" font-size="20" font-weight="700" text-anchor="middle">AUP</text><text x="721.3333333333334" y="1078" font-size="18" font-weight="400" text-anchor="middle">Rules of use</text><text x="28" y="1224" font-size="17" font-weight="400" text-anchor="start">This example illustrates one organization, not a mandatory structure</text><text x="28" y="1256" font-size="17" font-weight="400" text-anchor="start">for every SOC. Tier 1 and Tier 3 have parallel responsibilities. Not</text><text x="28" y="1288" font-size="17" font-weight="400" text-anchor="start">every alert requires Tier 3, major incident response or BCP</text><text x="28" y="1320" font-size="17" font-weight="400" text-anchor="start">activation. SLA, NDA and AUP are parallel governance documents, not</text><text x="28" y="1352" font-size="17" font-weight="400" text-anchor="start">sequential steps.</text></g></svg>
