<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2148" role="img" aria-labelledby="title desc" lang="zh"><title id="title">TLS 1.3：憑證式 ECDHE 連線的簡化時序</title><desc id="desc">實線箭頭表示瀏覽器送往伺服器；虛線箭頭表示伺服器回覆，並非「未加密」。橘框表示本機計算或驗證。省略 EncryptedExtensions、金鑰排程細節、用戶端憑證與其他分支；這不是封包擷取。Certificate 起的伺服器交握訊息受交握金鑰保護。</desc><rect width="900" height="2148" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">TLS 1.3：憑證式 ECDHE 連線的簡化時序</text><rect x="28" y="90" width="364" height="64" rx="12" fill="#e6f3e9" stroke="#4a9865"/><text x="210" y="128" font-size="20" font-weight="700" text-anchor="middle">瀏覽器</text><rect x="508" y="90" width="364" height="64" rx="12" fill="#e6f3e9" stroke="#4a9865"/><text x="690" y="128" font-size="20" font-weight="700" text-anchor="middle">網站伺服器</text><path d="M210 154V1910M690 154V1910" fill="none" stroke="#899296" stroke-width="2"/><text x="450" y="196" font-size="16" font-weight="400" text-anchor="middle">瀏覽器 → 網站伺服器</text><text x="450" y="232" font-size="20" font-weight="700" text-anchor="middle">ClientHello + key_share</text><path d="M210 264H690m-9-7 9 7-9 7" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="300" font-size="18" font-weight="400" text-anchor="middle">瀏覽器提供支援參數與公開金鑰分享值。</text><text x="450" y="370" font-size="16" font-weight="400" text-anchor="middle">網站伺服器 → 瀏覽器</text><text x="450" y="406" font-size="20" font-weight="700" text-anchor="middle">ServerHello + key_share</text><path d="M690 438H210m9-7-9 7 9 7" fill="none" stroke="#657079" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="474" font-size="18" font-weight="400" text-anchor="middle">伺服器選定參數，回覆其公開金鑰分享值。</text><rect x="96" y="526" width="708" height="146" rx="12" fill="#f7f3ea" stroke="#d8dce0"/><text x="450.0" y="560" font-size="20" font-weight="700" text-anchor="middle">各自計算共享祕密並導出金鑰</text><text x="450.0" y="600" font-size="18" font-weight="400" text-anchor="middle">ECDHE 與 HKDF 建立交握金鑰；後續依金鑰排程導出應用流量金鑰，不直接傳送</text><text x="450.0" y="632" font-size="18" font-weight="400" text-anchor="middle">共享祕密。</text><text x="450" y="714" font-size="16" font-weight="400" text-anchor="middle">網站伺服器 → 瀏覽器</text><text x="450" y="750" font-size="20" font-weight="700" text-anchor="middle">Certificate</text><path d="M690 782H210m9-7-9 7 9 7" fill="none" stroke="#657079" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="818" font-size="18" font-weight="400" text-anchor="middle">伺服器傳送憑證鏈，提供公鑰與身分／網域綁定資料。</text><text x="450" y="888" font-size="16" font-weight="400" text-anchor="middle">網站伺服器 → 瀏覽器</text><text x="450" y="924" font-size="20" font-weight="700" text-anchor="middle">CertificateVerify</text><path d="M690 956H210m9-7-9 7 9 7" fill="none" stroke="#657079" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="992" font-size="18" font-weight="400" text-anchor="middle">伺服器以簽章證明持有對應私鑰，並綁定交握內容。</text><text x="450" y="1062" font-size="16" font-weight="400" text-anchor="middle">網站伺服器 → 瀏覽器</text><text x="450" y="1098" font-size="20" font-weight="700" text-anchor="middle">Finished（伺服器）</text><path d="M690 1130H210m9-7-9 7 9 7" fill="none" stroke="#657079" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="1166" font-size="18" font-weight="400" text-anchor="middle">以交握祕密與交握內容驗證值，確認此次交握。</text><rect x="96" y="1218" width="708" height="146" rx="12" fill="#f7f3ea" stroke="#d8dce0"/><text x="450.0" y="1252" font-size="20" font-weight="700" text-anchor="middle">驗證憑證、網域、簽章與 Finished</text><text x="450.0" y="1292" font-size="18" font-weight="400" text-anchor="middle">瀏覽器檢查信任鏈、名稱、期限與適用限制等；失敗時不繼續可信連線。此框彙整驗</text><text x="450.0" y="1324" font-size="18" font-weight="400" text-anchor="middle">證責任，非精確執行時間。</text><text x="450" y="1406" font-size="16" font-weight="400" text-anchor="middle">瀏覽器 → 網站伺服器</text><text x="450" y="1442" font-size="20" font-weight="700" text-anchor="middle">Finished（瀏覽器）</text><path d="M210 1474H690m-9-7 9 7-9 7" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="1510" font-size="18" font-weight="400" text-anchor="middle">瀏覽器完成其交握確認；本例省略用戶端憑證驗證。</text><text x="450" y="1580" font-size="16" font-weight="400" text-anchor="middle">瀏覽器 → 網站伺服器</text><text x="450" y="1616" font-size="20" font-weight="700" text-anchor="middle">加密的 HTTP Request</text><path d="M210 1648H690m-9-7 9 7-9 7" fill="none" stroke="#657079" stroke-width="2" /><text x="450" y="1684" font-size="18" font-weight="400" text-anchor="middle">用應用流量金鑰與 AES-GCM 等 AEAD 保護請求。</text><text x="450" y="1754" font-size="16" font-weight="400" text-anchor="middle">網站伺服器 → 瀏覽器</text><text x="450" y="1790" font-size="20" font-weight="700" text-anchor="middle">加密的 HTTP Response</text><path d="M690 1822H210m9-7-9 7 9 7" fill="none" stroke="#657079" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="1858" font-size="18" font-weight="400" text-anchor="middle">伺服器以其方向的流量金鑰保護回覆；CA 不參與每次交握。</text><rect x="28" y="1910" width="364" height="64" rx="12" fill="#e6f3e9" stroke="#4a9865"/><text x="210" y="1948" font-size="20" font-weight="700" text-anchor="middle">瀏覽器</text><rect x="508" y="1910" width="364" height="64" rx="12" fill="#e6f3e9" stroke="#4a9865"/><text x="690" y="1948" font-size="20" font-weight="700" text-anchor="middle">網站伺服器</text><text x="28" y="2028" font-size="17" font-weight="400" text-anchor="start">實線箭頭表示瀏覽器送往伺服器；虛線箭頭表示伺服器回覆，並非「未加密」。橘框表示本機</text><text x="28" y="2060" font-size="17" font-weight="400" text-anchor="start">計算或驗證。省略 EncryptedExtensions、金鑰排程細節、用戶端憑證與其他分支；這</text><text x="28" y="2092" font-size="17" font-weight="400" text-anchor="start">不是封包擷取。Certificate 起的伺服器交握訊息受交握金鑰保護。</text></g></svg>
