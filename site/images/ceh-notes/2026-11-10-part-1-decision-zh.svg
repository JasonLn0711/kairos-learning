<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" role="img" aria-labelledby="title desc" lang="zh"><title id="title">先辨認問題，再找決定性線索</title><desc id="desc">四個分支是平行分類。真實事件可同時涉及多類問題；單選題依題幹要求的主要問題選擇。</desc><rect width="900" height="644" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">先辨認問題，再找決定性線索</text><text x="450" y="90" font-size="20" font-weight="700" text-anchor="middle">題目到底在問什麼？</text><path d="M450 132v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><rect x="28" y="186" width="404" height="146" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="46" y="220" font-size="20" font-weight="700" text-anchor="start">駭客角色</text><text x="46" y="260" font-size="18" font-weight="400" text-anchor="start">Authorization / Permission</text><text x="46" y="292" font-size="18" font-weight="400" text-anchor="start">White Hat、Grey Hat、Black Hat</text><rect x="458" y="186" width="404" height="178" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="476" y="220" font-size="20" font-weight="700" text-anchor="start">資訊受到什麼影響</text><text x="476" y="260" font-size="18" font-weight="400" text-anchor="start">Read / Modify / Unavailable</text><text x="476" y="292" font-size="18" font-weight="400" text-anchor="start">Confidentiality、Integrity、</text><text x="476" y="324" font-size="18" font-weight="400" text-anchor="start">Availability</text><rect x="28" y="388" width="404" height="146" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="46" y="422" font-size="20" font-weight="700" text-anchor="start">安全控制種類</text><text x="46" y="462" font-size="18" font-weight="400" text-anchor="start">Physical / Technical</text><text x="46" y="494" font-size="18" font-weight="400" text-anchor="start">Security Guard、Firewall 等</text><rect x="458" y="388" width="404" height="146" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="476" y="422" font-size="20" font-weight="700" text-anchor="start">安全測試目的</text><text x="476" y="462" font-size="18" font-weight="400" text-anchor="start">Goal / Primary purpose</text><text x="476" y="494" font-size="18" font-weight="400" text-anchor="start">找出漏洞、降低風險</text><text x="28" y="588" font-size="17" font-weight="400" text-anchor="start">四個分支是平行分類。真實事件可同時涉及多類問題；單選題依題幹要求的主要問題選擇。</text></g></svg>
