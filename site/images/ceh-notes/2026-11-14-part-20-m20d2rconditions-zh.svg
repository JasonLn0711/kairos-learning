<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 996" role="img" aria-labelledby="title desc" lang="zh"><title id="title">CSRF 圖 6｜已登入使用者 CSRF 情境的必要條件樹</title><desc id="desc">四類條件共同構成此Cookie登入情境的分析，不是四選一。攻擊者分成「知道目標URL與參數」及「能誘發請求」兩個必要面向；個別訪客的登入歷史不是必須事先知道的資料。此圖不概括其他如登入CSRF的不同威脅模型。</desc><rect width="900" height="996" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CSRF 圖 6｜已登入使用者 CSRF 情境的必要條件樹</text><rect x="280" y="88" width="340" height="114" rx="12" fill="#e6f5ec" stroke="#d8dce0"/><text x="298" y="120" font-size="20" font-weight="700" text-anchor="start">CSRF 攻擊要成功</text><text x="298" y="158" font-size="18" font-weight="400" text-anchor="start">本圖分析利用已登入憑證的操作</text><path d="M450 202V246H106.0V290m-5-7 5 7 5-7" fill="none" stroke="#657079" stroke-width="2"/><rect x="28" y="290" width="156" height="146" rx="12" fill="#e6f5ec" stroke="#d8dce0"/><text x="46" y="322" font-size="20" font-weight="700" text-anchor="start">受害者條件</text><text x="46" y="360" font-size="18" font-weight="400" text-anchor="start">有效工作階段</text><text x="46" y="392" font-size="18" font-weight="400" text-anchor="start">與權限</text><path d="M450 202V246H366.0V290m-5-7 5 7 5-7" fill="none" stroke="#657079" stroke-width="2"/><rect x="200" y="290" width="332" height="114" rx="12" fill="#e6f5ec" stroke="#d8dce0"/><text x="218" y="322" font-size="20" font-weight="700" text-anchor="start">攻擊者條件</text><text x="218" y="360" font-size="18" font-weight="400" text-anchor="start">目標資訊與誘發能力</text><path d="M450 202V246H626.0V290m-5-7 5 7 5-7" fill="none" stroke="#657079" stroke-width="2"/><rect x="548" y="290" width="156" height="146" rx="12" fill="#e6f5ec" stroke="#d8dce0"/><text x="566" y="322" font-size="20" font-weight="700" text-anchor="start">瀏覽器條件</text><text x="566" y="360" font-size="18" font-weight="400" text-anchor="start">允許請求與必</text><text x="566" y="392" font-size="18" font-weight="400" text-anchor="start">要憑證</text><path d="M450 202V246H798.0V290m-5-7 5 7 5-7" fill="none" stroke="#657079" stroke-width="2"/><rect x="720" y="290" width="156" height="178" rx="12" fill="#e6f5ec" stroke="#d8dce0"/><text x="738" y="322" font-size="20" font-weight="700" text-anchor="start">Server 條</text><text x="738" y="354" font-size="20" font-weight="700" text-anchor="start">件</text><text x="738" y="392" font-size="18" font-weight="400" text-anchor="start">相關防護缺失</text><text x="738" y="424" font-size="18" font-weight="400" text-anchor="start">或未正確執行</text><path d="M106.0 436V512H106.0V556m-5-7 5 7 5-7" fill="none" stroke="#657079" stroke-width="2"/><rect x="28.0" y="556" width="156.0" height="210" rx="12" fill="#e6f5ec" stroke="#d8dce0"/><text x="46.0" y="588" font-size="20" font-weight="700" text-anchor="start">目標使用者具</text><text x="46.0" y="620" font-size="20" font-weight="700" text-anchor="start">有有效</text><text x="46.0" y="652" font-size="20" font-weight="700" text-anchor="start">Session 及</text><text x="46.0" y="684" font-size="20" font-weight="700" text-anchor="start">足夠操作權限</text><text x="46.0" y="722" font-size="18" font-weight="400" text-anchor="start">受害者狀態</text><path d="M366.0 404V512H279.0V556m-5-7 5 7 5-7" fill="none" stroke="#657079" stroke-width="2"/><rect x="200.0" y="556" width="158.0" height="242" rx="12" fill="#e6f5ec" stroke="#d8dce0"/><text x="218.0" y="588" font-size="20" font-weight="700" text-anchor="start">知道可用的目</text><text x="218.0" y="620" font-size="20" font-weight="700" text-anchor="start">標 URL 與</text><text x="218.0" y="652" font-size="20" font-weight="700" text-anchor="start">必要參數</text><text x="218.0" y="690" font-size="18" font-weight="400" text-anchor="start">不是知道</text><text x="218.0" y="722" font-size="18" font-weight="400" text-anchor="start">Session</text><text x="218.0" y="754" font-size="18" font-weight="400" text-anchor="start">Token</text><path d="M366.0 404V512H453.0V556m-5-7 5 7 5-7" fill="none" stroke="#657079" stroke-width="2"/><rect x="374.0" y="556" width="158.0" height="210" rx="12" fill="#e6f5ec" stroke="#d8dce0"/><text x="392.0" y="588" font-size="20" font-weight="700" text-anchor="start">能讓受害者瀏</text><text x="392.0" y="620" font-size="20" font-weight="700" text-anchor="start">覽器觸發</text><text x="392.0" y="652" font-size="20" font-weight="700" text-anchor="start">Request</text><text x="392.0" y="690" font-size="18" font-weight="400" text-anchor="start">不一定需要社</text><text x="392.0" y="722" font-size="18" font-weight="400" text-anchor="start">交工程</text><path d="M626.0 436V512H626.0V556m-5-7 5 7 5-7" fill="none" stroke="#657079" stroke-width="2"/><rect x="548.0" y="556" width="156.0" height="242" rx="12" fill="#e6f5ec" stroke="#d8dce0"/><text x="566.0" y="588" font-size="20" font-weight="700" text-anchor="start">允許對應的跨</text><text x="566.0" y="620" font-size="20" font-weight="700" text-anchor="start">站請求並附帶</text><text x="566.0" y="652" font-size="20" font-weight="700" text-anchor="start">必要憑證</text><text x="566.0" y="690" font-size="18" font-weight="400" text-anchor="start">依實際</text><text x="566.0" y="722" font-size="18" font-weight="400" text-anchor="start">Cookie與請</text><text x="566.0" y="754" font-size="18" font-weight="400" text-anchor="start">求政策判斷</text><path d="M798.0 468V512H798.0V556m-5-7 5 7 5-7" fill="none" stroke="#657079" stroke-width="2"/><rect x="720.0" y="556" width="156.0" height="274" rx="12" fill="#e6f5ec" stroke="#d8dce0"/><text x="738.0" y="588" font-size="20" font-weight="700" text-anchor="start">缺少或未正確</text><text x="738.0" y="620" font-size="20" font-weight="700" text-anchor="start">執行 CSRF</text><text x="738.0" y="652" font-size="20" font-weight="700" text-anchor="start">與其他安全檢</text><text x="738.0" y="684" font-size="20" font-weight="700" text-anchor="start">查</text><text x="738.0" y="722" font-size="18" font-weight="400" text-anchor="start">Server接受</text><text x="738.0" y="754" font-size="18" font-weight="400" text-anchor="start">不符合防偽流</text><text x="738.0" y="786" font-size="18" font-weight="400" text-anchor="start">程的操作</text><text x="28" y="876" font-size="17" font-weight="400" text-anchor="start">四類條件共同構成此Cookie登入情境的分析，不是四選一。攻擊者分成「知道目標URL與參數</text><text x="28" y="908" font-size="17" font-weight="400" text-anchor="start">」及「能誘發請求」兩個必要面向；個別訪客的登入歷史不是必須事先知道的資料。此圖不概括</text><text x="28" y="940" font-size="17" font-weight="400" text-anchor="start">其他如登入CSRF的不同威脅模型。</text></g></svg>
