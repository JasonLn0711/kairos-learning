<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 754" role="img" aria-labelledby="title desc" lang="en"><title id="title">The basic penetration-testing workflow</title><desc id="desc">Downward arrows indicate work order: establish valid authorization and scope, then test and follow up remediation. Authorization does not permit unrestricted testing.</desc><rect width="900" height="754" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">The basic penetration-testing workflow</text><text x="450" y="100" font-size="20" font-weight="700" text-anchor="middle">Obtain valid authorization</text><text x="450" y="134" font-size="18" font-weight="400" text-anchor="middle">Who has authority to approve the test?</text><path d="M450 169v20m-5-5 5 5 5-5" fill="none" stroke="#657079" stroke-width="2"/><text x="450" y="236" font-size="20" font-weight="700" text-anchor="middle">Define scope and ROE</text><text x="450" y="270" font-size="18" font-weight="400" text-anchor="middle">What, when and which methods are prohibited?</text><path d="M450 305v20m-5-5 5 5 5-5" fill="none" stroke="#657079" stroke-width="2"/><text x="450" y="372" font-size="20" font-weight="700" text-anchor="middle">Test within the authorized scope</text><text x="450" y="406" font-size="18" font-weight="400" text-anchor="middle">Identify vulnerabilities, control impact and retain necessary</text><text x="450" y="438" font-size="18" font-weight="400" text-anchor="middle">evidence</text><path d="M450 473v20m-5-5 5 5 5-5" fill="none" stroke="#657079" stroke-width="2"/><text x="450" y="540" font-size="20" font-weight="700" text-anchor="middle">Report, remediate and retest</text><text x="450" y="574" font-size="18" font-weight="400" text-anchor="middle">Demonstrate risk and track improvements</text><text x="28" y="642" font-size="17" font-weight="400" text-anchor="start">Downward arrows indicate work order: establish valid authorization</text><text x="28" y="674" font-size="17" font-weight="400" text-anchor="start">and scope, then test and follow up remediation. Authorization does</text><text x="28" y="706" font-size="17" font-weight="400" text-anchor="start">not permit unrestricted testing.</text></g></svg>
