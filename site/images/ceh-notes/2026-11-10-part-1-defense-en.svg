<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1088" role="img" aria-labelledby="title desc" lang="en"><title id="title">Five layers of defense in depth</title><desc id="desc">A confidential-data system example. Arrows indicate reading order, not a path every attack must follow. The layers address different failure conditions together.</desc><rect width="900" height="1088" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Five layers of defense in depth</text><text x="42" y="114" font-size="20" font-weight="700" text-anchor="start">Layer 1 | Physical</text><text x="42" y="154" font-size="18" font-weight="400" text-anchor="start">Security guards, access control and server-room restrictions</text><path d="M450 198v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="296" font-size="20" font-weight="700" text-anchor="start">Layer 2 | Identity</text><text x="42" y="336" font-size="18" font-weight="400" text-anchor="start">Authentication, MFA and permission restrictions</text><path d="M450 380v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="478" font-size="20" font-weight="700" text-anchor="start">Layer 3 | Network</text><text x="42" y="518" font-size="18" font-weight="400" text-anchor="start">Firewalls and network segmentation</text><path d="M450 562v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="660" font-size="20" font-weight="700" text-anchor="start">Layer 4 | Data</text><text x="42" y="700" font-size="18" font-weight="400" text-anchor="start">Encryption and data access controls</text><path d="M450 744v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="842" font-size="20" font-weight="700" text-anchor="start">Layer 5 | Detection &amp; Recovery</text><text x="42" y="882" font-size="18" font-weight="400" text-anchor="start">Monitoring, backup, recovery and incident response</text><text x="28" y="968" font-size="17" font-weight="400" text-anchor="start">A confidential-data system example. Arrows indicate reading order,</text><text x="28" y="1000" font-size="17" font-weight="400" text-anchor="start">not a path every attack must follow. The layers address different</text><text x="28" y="1032" font-size="17" font-weight="400" text-anchor="start">failure conditions together.</text></g></svg>
