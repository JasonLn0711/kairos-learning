<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖4｜UDP 探測結果：四種條件分支</title><desc id="desc">四格是同一次探測的替代觀察結果，不是依序發生。ICMP Type 3 Code 3指ICMPv4；其他指定不可達錯誤可支持filtered；靜默保留不確定性。</desc><rect width="900" height="690" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖4｜UDP 探測結果：四種條件分支</text><text x="450" y="108" font-size="20" font-weight="700" text-anchor="middle">送出 UDP 探測封包</text><text x="450" y="148" font-size="18" font-weight="400" text-anchor="middle">觀察目標或網路設備是否回應</text><text x="450" y="198" font-size="18" font-weight="400" text-anchor="middle">依觀察結果分成下列四種情況</text><rect x="28" y="246" width="404" height="116" rx="12" fill="#fbfcfd" stroke="#94a3b8"/><text x="46" y="278" font-size="20" font-weight="700" text-anchor="start">open</text><text x="46" y="318" font-size="18" font-weight="400" text-anchor="start">UDP 服務回覆：確實收到對應服務的回應。</text><rect x="458" y="246" width="404" height="148" rx="12" fill="#fbfcfd" stroke="#94a3b8"/><text x="476" y="278" font-size="20" font-weight="700" text-anchor="start">closed</text><text x="476" y="318" font-size="18" font-weight="400" text-anchor="start">ICMP Type 3 Code 3：Port</text><text x="476" y="350" font-size="18" font-weight="400" text-anchor="start">Unreachable，目的埠不可達。</text><rect x="28" y="412" width="404" height="148" rx="12" fill="#fbfcfd" stroke="#94a3b8"/><text x="46" y="444" font-size="20" font-weight="700" text-anchor="start">filtered</text><text x="46" y="484" font-size="18" font-weight="400" text-anchor="start">其他特定 ICMP 不可達錯誤：存在網路存取</text><text x="46" y="516" font-size="18" font-weight="400" text-anchor="start">限制的證據。</text><rect x="458" y="412" width="404" height="116" rx="12" fill="#fbfcfd" stroke="#94a3b8"/><text x="476" y="444" font-size="20" font-weight="700" text-anchor="start">open|filtered</text><text x="476" y="484" font-size="18" font-weight="400" text-anchor="start">完全沒有回覆：無法確定開放或受到過濾。</text><text x="28" y="606" font-size="17" font-weight="400" text-anchor="start">四格是同一次探測的替代觀察結果，不是依序發生。ICMP Type 3 Code 3指ICMPv4；其</text><text x="28" y="638" font-size="17" font-weight="400" text-anchor="start">他指定不可達錯誤可支持filtered；靜默保留不確定性。</text></g></svg>
