<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" role="img" aria-labelledby="title desc" lang="zh"><title id="title">CIA 三大目標與兩個相關觀念</title><desc id="desc">上排三項是平行的安全目標；下排不可否認性是證據性質，明文是資料表示及暴露情境，兩者不是CIA的第四、第五要素。</desc><rect width="900" height="652" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CIA 三大目標與兩個相關觀念</text><rect x="28.0" y="88" width="245.33333333333334" height="178" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="150.66666666666669" y="120" font-size="20" font-weight="700" text-anchor="middle">C01 ·</text><text x="150.66666666666669" y="152" font-size="20" font-weight="700" text-anchor="middle">Confidentiality</text><text x="150.66666666666669" y="190" font-size="18" font-weight="400" text-anchor="middle">機密性</text><text x="150.66666666666669" y="222" font-size="18" font-weight="400" text-anchor="middle">誰可以看？</text><rect x="313.33333333333337" y="88" width="245.33333333333334" height="178" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.00000000000006" y="120" font-size="20" font-weight="700" text-anchor="middle">C02 · Integrity</text><text x="436.00000000000006" y="158" font-size="18" font-weight="400" text-anchor="middle">完整性</text><text x="436.00000000000006" y="190" font-size="18" font-weight="400" text-anchor="middle">內容可信嗎？</text><rect x="598.6666666666667" y="88" width="245.33333333333334" height="178" rx="12" fill="#f7f1e9" stroke="#b8d5c5"/><text x="721.3333333333334" y="120" font-size="20" font-weight="700" text-anchor="middle">C03 ·</text><text x="721.3333333333334" y="152" font-size="20" font-weight="700" text-anchor="middle">Availability</text><text x="721.3333333333334" y="190" font-size="18" font-weight="400" text-anchor="middle">可用性</text><text x="721.3333333333334" y="222" font-size="18" font-weight="400" text-anchor="middle">需要時能用嗎？</text><rect x="28.0" y="354" width="388.0" height="146" rx="12" fill="#f6f7f8" stroke="#b8d5c5"/><text x="222.0" y="386" font-size="20" font-weight="700" text-anchor="middle">C04 · Non-repudiation</text><text x="222.0" y="424" font-size="18" font-weight="400" text-anchor="middle">不可否認性</text><text x="222.0" y="456" font-size="18" font-weight="400" text-anchor="middle">事後能查證誰做的嗎？</text><rect x="456.0" y="354" width="388.0" height="146" rx="12" fill="#f6f7f8" stroke="#b8d5c5"/><text x="650.0" y="386" font-size="20" font-weight="700" text-anchor="middle">C05 · Cleartext</text><text x="650.0" y="424" font-size="18" font-weight="400" text-anchor="middle">明文</text><text x="650.0" y="456" font-size="18" font-weight="400" text-anchor="middle">可讀資料是否暴露在不適當的信任邊界？</text><text x="28" y="570" font-size="17" font-weight="400" text-anchor="start">上排三項是平行的安全目標；下排不可否認性是證據性質，明文是資料表示及暴露情境，兩者不是</text><text x="28" y="602" font-size="17" font-weight="400" text-anchor="start">CIA的第四、第五要素。</text></g></svg>
