<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 872" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 2｜TCP 一般連線建立流程</title><desc id="desc">時間由上而下；SYN 與 ACK 由 Client 傳向 Server，SYN-ACK 反向回覆。TCP 連線成功仍不等於 TLS 或登入驗證成功。</desc><rect width="900" height="872" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 2｜TCP 一般連線建立流程</text><rect x="28" y="90" width="364" height="64" rx="12" fill="#e8ecef" stroke="#94a3b8"/><text x="210" y="129" font-size="24" font-weight="700" text-anchor="middle">Client</text><rect x="508" y="90" width="364" height="64" rx="12" fill="#e8ecef" stroke="#94a3b8"/><text x="690" y="129" font-size="24" font-weight="700" text-anchor="middle">Server</text><path d="M210 156V739M690 156V739" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 10"/><text x="450" y="208" font-size="22" font-weight="700" text-anchor="middle">① SYN</text><text x="450" y="246" font-size="18" font-weight="400" text-anchor="middle">Client → Server：我想建立連線。</text><path d="M210 282 690 334m-24 5 24-5-18-16" fill="none" stroke="#245fe8" stroke-width="2" /><text x="450" y="398" font-size="22" font-weight="700" text-anchor="middle">② SYN-ACK</text><text x="450" y="436" font-size="18" font-weight="400" text-anchor="middle">Server → Client：收到，我也準備好了。</text><path d="M690 472 210 524m18-16-18 16 24 5" fill="none" stroke="#008c83" stroke-width="2" /><text x="450" y="588" font-size="22" font-weight="700" text-anchor="middle">③ ACK</text><text x="450" y="626" font-size="18" font-weight="400" text-anchor="middle">Client → Server：確認收到。</text><path d="M210 662 690 714m-24 5 24-5-18-16" fill="none" stroke="#245fe8" stroke-width="2" /><text x="28" y="784" font-size="17" font-weight="400" text-anchor="start">時間由上而下；SYN 與 ACK 由 Client 傳向 Server，SYN-ACK 反向回覆。TCP 連</text><text x="28" y="816" font-size="17" font-weight="400" text-anchor="start">線成功仍不等於 TLS 或登入驗證成功。</text></g></svg>
