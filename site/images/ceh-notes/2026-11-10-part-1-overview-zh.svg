<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" role="img" aria-labelledby="title desc" lang="zh"><title id="title">三個問題，建立資安地圖</title><desc id="desc">先界定保護目標，再選控制措施，最後以授權測試驗證；箭頭表示學習與設計順序。</desc><rect width="900" height="810" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">三個問題，建立資安地圖</text><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" fill="none" stroke="#18252c" stroke-width="2" transform="translate(438 90)"/><text x="450" y="164" font-size="20" font-weight="700" text-anchor="middle">我們要保護什麼？</text><text x="450" y="204" font-size="18" font-weight="400" text-anchor="middle">CIA：保密性、完整性、可用性</text><path d="M450 248v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><path d="M3 8 12 3l9 5-9 5-9-5Zm0 5 9 5 9-5M3 18l9 5 9-5" fill="none" stroke="#18252c" stroke-width="2" transform="translate(438 322)"/><text x="450" y="396" font-size="20" font-weight="700" text-anchor="middle">要怎麼保護？</text><text x="450" y="436" font-size="18" font-weight="400" text-anchor="middle">Security Controls：實體、技術、管理控制</text><path d="M450 480v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm5 12 6 6M7 10l2 2 4-4" fill="none" stroke="#18252c" stroke-width="2" transform="translate(438 554)"/><text x="450" y="628" font-size="20" font-weight="700" text-anchor="middle">怎麼知道保護有效？</text><text x="450" y="668" font-size="18" font-weight="400" text-anchor="middle">Ethical Hacking：經授權測試、找漏洞、改善風險</text><text x="28" y="754" font-size="17" font-weight="400" text-anchor="start">先界定保護目標，再選控制措施，最後以授權測試驗證；箭頭表示學習與設計順序。</text></g></svg>
