<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 958" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖1｜從瀏覽器到銀行：兩端入口與四個協定步驟</title><desc id="desc">虛線表示網際網路上的概念連線；下方1–4表示TCP型HTTPS的協定建立順序，不表示DNS代送網頁。HTTP/3通常走QUIC／UDP 443，不使用TCP三向交握。</desc><rect width="900" height="958" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖1｜從瀏覽器到銀行：兩端入口與四個協定步驟</text><rect x="28" y="88" width="364" height="116" rx="12" fill="#eceef1" stroke="#94a3b8"/><text x="46" y="120" font-size="20" font-weight="700" text-anchor="start">Alice 的瀏覽器</text><text x="46" y="160" font-size="18" font-weight="400" text-anchor="start">192.168.1.20:53000</text><rect x="508" y="88" width="364" height="116" rx="12" fill="#eceef1" stroke="#94a3b8"/><text x="526" y="120" font-size="20" font-weight="700" text-anchor="start">銀行伺服器</text><text x="526" y="160" font-size="18" font-weight="400" text-anchor="start">203.0.113.10:443</text><path d="M250 224H650" stroke="#7b879a" stroke-width="2" stroke-dasharray="8 8"/><text x="450" y="260" font-size="18" font-weight="400" text-anchor="middle">網際網路 · 概念連線（虛線）</text><rect x="70" y="310" width="760" height="116" rx="12" fill="#eceef1" stroke="#94a3b8"/><text x="88" y="342" font-size="20" font-weight="700" text-anchor="start">1 DNS 找出 IP</text><text x="88" y="382" font-size="18" font-weight="400" text-anchor="start">查詢 bank.example 的位址</text><rect x="70" y="444" width="760" height="116" rx="12" fill="#e5f3ec" stroke="#94a3b8"/><text x="88" y="476" font-size="20" font-weight="700" text-anchor="start">2 TCP 建立連線</text><text x="88" y="516" font-size="18" font-weight="400" text-anchor="start">臨時來源埠 53000 → 目的埠 443</text><rect x="70" y="578" width="760" height="116" rx="12" fill="#e7edfb" stroke="#94a3b8"/><text x="88" y="610" font-size="20" font-weight="700" text-anchor="start">3 TLS 建立保護</text><text x="88" y="650" font-size="18" font-weight="400" text-anchor="start">協商加密並驗證相應伺服器身分</text><rect x="70" y="712" width="760" height="116" rx="12" fill="#f1e8fa" stroke="#94a3b8"/><text x="88" y="744" font-size="20" font-weight="700" text-anchor="start">4 HTTP 請求／回應</text><text x="88" y="784" font-size="18" font-weight="400" text-anchor="start">在受保護的連線上交換網頁訊息</text><text x="28" y="874" font-size="17" font-weight="400" text-anchor="start">虛線表示網際網路上的概念連線；下方1–4表示TCP型HTTPS的協定建立順序，不表示DNS代</text><text x="28" y="906" font-size="17" font-weight="400" text-anchor="start">送網頁。HTTP/3通常走QUIC／UDP 443，不使用TCP三向交握。</text></g></svg>
