<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1598" role="img" aria-labelledby="title desc" lang="en"><title id="title">Seven steps for integrated risk and privacy governance</title><desc id="desc">Connect scope, evidence, treatment and continual review; guidance documents serve different roles.</desc><rect width="900" height="1598" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1010V1054.0H436.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1212V1256.0H436.0V1300m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Seven steps for integrated risk and privacy governance</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">1 | Define organizational and system scope</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">ISO/IEC 27001 clauses 4–6.</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">2 | Establish risk context and acceptance criteria</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">ISO/IEC 27005 clauses 6–7.</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">3 | Analyze threats, vulnerabilities, likelihood and impact</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Consult NIST SP 800-30, OWASP and MITRE ATT&amp;CK.</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">4 | Determine necessary controls</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">ISO/IEC 27002; 27001 clause 6.1.3.</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">5 | Treatment plan and Statement of Applicability</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">ISO/IEC 27001 clause 6.1.3.</text><rect x="28.0" y="1098" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">6 | Address privacy risks involving personal data</text><text x="436.0" y="1168" font-size="18" font-weight="400" text-anchor="middle">ISO/IEC 27701 and applicable law.</text><rect x="28.0" y="1300" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1332" font-size="20" font-weight="700" text-anchor="middle">7 | Verify controls, accept residual risk and review</text><text x="436.0" y="1364" font-size="20" font-weight="700" text-anchor="middle">continually</text><text x="436.0" y="1402" font-size="18" font-weight="400" text-anchor="middle">27001 clauses 8–10; 27005 clause 10.</text><text x="28" y="1516" font-size="17" font-weight="400" text-anchor="start">Connect scope, evidence, treatment and continual review; guidance</text><text x="28" y="1548" font-size="17" font-weight="400" text-anchor="start">documents serve different roles.</text></g></svg>
