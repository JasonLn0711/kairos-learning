<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-labelledby="title desc" lang="zh"><title id="title">加密容器：未掛載與已掛載</title><desc id="desc">兩張卡片是狀態比較。已掛載不代表磁碟上的全部密文變成明文，而是授權程式經由解密取得可用資料。</desc><rect width="900" height="354" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">加密容器：未掛載與已掛載</text><rect x="28.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">未掛載｜Data at Rest</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">磁碟中保存密文</text><rect x="456.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">已掛載｜Data in Use</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">授權程式可取得明文</text><text x="28" y="272" font-size="17" font-weight="400" text-anchor="start">兩張卡片是狀態比較。已掛載不代表磁碟上的全部密文變成明文，而是授權程式經由解密取得可用</text><text x="28" y="304" font-size="17" font-weight="400" text-anchor="start">資料。</text></g></svg>
