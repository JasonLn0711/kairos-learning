<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc" lang="zh"><title id="title">HTTP 與 HTTPS：傳輸內容的保護</title><desc id="desc">上排HTTP未額外加密時，截取流量者可能讀取內容。下排正確建立的HTTPS/TLS通道保護機密性與完整性；兩排是獨立比較，沒有HTTP轉成HTTPS的跨排連線。</desc><rect width="900" height="620" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M273.33333333333337 161.0H313.33333333333337m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M558.6666666666667 161.0H598.6666666666667m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M273.33333333333337 395.0H313.33333333333337m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M558.6666666666667 395.0H598.6666666666667m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">HTTP 與 HTTPS：傳輸內容的保護</text><rect x="28.0" y="88" width="245.33333333333334" height="146" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="150.66666666666669" y="120" font-size="20" font-weight="700" text-anchor="middle">HTTP 用戶端</text><text x="150.66666666666669" y="158" font-size="18" font-weight="400" text-anchor="middle">傳送敏感內容</text><rect x="313.33333333333337" y="88" width="245.33333333333334" height="146" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="436.00000000000006" y="120" font-size="20" font-weight="700" text-anchor="middle">可讀取的內容</text><text x="436.00000000000006" y="158" font-size="18" font-weight="400" text-anchor="middle">未額外加密保護的傳輸</text><rect x="598.6666666666667" y="88" width="245.33333333333334" height="146" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="721.3333333333334" y="120" font-size="20" font-weight="700" text-anchor="middle">HTTP 伺服器</text><text x="721.3333333333334" y="158" font-size="18" font-weight="400" text-anchor="middle">第三方取得流量可能讀取</text><text x="721.3333333333334" y="190" font-size="18" font-weight="400" text-anchor="middle">內容</text><rect x="28.0" y="322" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="150.66666666666669" y="354" font-size="20" font-weight="700" text-anchor="middle">HTTPS 用戶端</text><text x="150.66666666666669" y="392" font-size="18" font-weight="400" text-anchor="middle">驗證伺服器與連線</text><rect x="313.33333333333337" y="322" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.00000000000006" y="354" font-size="20" font-weight="700" text-anchor="middle">加密後的資料</text><text x="436.00000000000006" y="392" font-size="18" font-weight="400" text-anchor="middle">TLS保護傳輸通道</text><rect x="598.6666666666667" y="322" width="245.33333333333334" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="721.3333333333334" y="354" font-size="20" font-weight="700" text-anchor="middle">HTTPS 伺服器</text><text x="721.3333333333334" y="392" font-size="18" font-weight="400" text-anchor="middle">端點仍會處理已解密的內</text><text x="721.3333333333334" y="424" font-size="18" font-weight="400" text-anchor="middle">容</text><text x="28" y="538" font-size="17" font-weight="400" text-anchor="start">上排HTTP未額外加密時，截取流量者可能讀取內容。下排正確建立的HTTPS/TLS通道保護機密</text><text x="28" y="570" font-size="17" font-weight="400" text-anchor="start">性與完整性；兩排是獨立比較，沒有HTTP轉成HTTPS的跨排連線。</text></g></svg>
