<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638.8000000000001" role="img" aria-labelledby="title desc" lang="zh"><title id="title">風險分數教學互動</title><desc id="desc">教學公式：分數 = L × I；L、I 為 1–5 的序位整數，不代表損失倍數。門檻：1–4 低、5–9 中、10–25 高。 這是教學案例設定的門檻，不是 ISO 官方數值。高風險範例應升級審查並優先處理。</desc><rect width="900" height="638.8000000000001" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">風險分數教學互動</text><rect x="28" y="101.6" width="844" height="116.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="135.6" font-size="20" font-weight="700">可能性 L = 3</text><text x="46" y="174.6" font-size="18" font-weight="400">1–5 的序位尺度</text><rect x="28" y="236.29999999999998" width="844" height="116.69999999999996" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="270.29999999999995" font-size="20" font-weight="700">衝擊 I = 5</text><text x="46" y="309.29999999999995" font-size="18" font-weight="400">1–5 的序位尺度</text><rect x="28" y="370.99999999999994" width="844" height="116.69999999999999" rx="12" fill="#eef6f1" stroke="#adc8bc"/><text x="46" y="404.99999999999994" font-size="20" font-weight="700">3 × 5 = 15／25｜高風險</text><text x="46" y="443.99999999999994" font-size="18" font-weight="400">僅為教學門檻；組織應建立自己的風險準則。</text><text x="28" y="529.6999999999999" font-size="18" font-weight="400">教學公式：分數 = L × I；L、I 為 1–5 的序位整數，不代表損失倍數。門檻：1–4 低、5–9</text><text x="28" y="559.4" font-size="18" font-weight="400">中、10–25 高。 這是教學案例設定的門檻，不是 ISO 官方數值。高風險範例應升級審查並優先</text><text x="28" y="589.1" font-size="18" font-weight="400">處理。</text></g></svg>
