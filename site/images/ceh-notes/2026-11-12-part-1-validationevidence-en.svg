<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1258" role="img" aria-labelledby="title desc" lang="en"><title id="title">From a potential weakness to verified improvement</title><desc id="desc">Arrows show the assessment and remediation workflow. Controlled verification uses authorized assets and test data; greater damage or collecting real customer data is not required as proof.</desc><rect width="900" height="1258" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 638V682.0H436.0V726m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 840V884.0H436.0V928m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">From a potential weakness to verified improvement</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Observe a potential weakness</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Scanning, configuration analysis or source review</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Form a testable hypothesis</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Can this weakness be exploited under the specified conditions?</text><rect x="28.0" y="492" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Perform controlled verification</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Use authorized assets and test data, doing enough to confirm the</text><text x="436.0" y="594" font-size="18" font-weight="400" text-anchor="middle">weakness</text><rect x="28.0" y="726" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="758" font-size="20" font-weight="700" text-anchor="middle">Record observations and limits</text><text x="436.0" y="796" font-size="18" font-weight="400" text-anchor="middle">Evidence, impact, test conditions and untested scope</text><rect x="28.0" y="928" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="960" font-size="20" font-weight="700" text-anchor="middle">Remediate and retest</text><text x="436.0" y="998" font-size="18" font-weight="400" text-anchor="middle">Confirm closure while legitimate business operations remain</text><text x="436.0" y="1030" font-size="18" font-weight="400" text-anchor="middle">functional</text><text x="28" y="1144" font-size="17" font-weight="400" text-anchor="start">Arrows show the assessment and remediation workflow. Controlled</text><text x="28" y="1176" font-size="17" font-weight="400" text-anchor="start">verification uses authorized assets and test data; greater damage or</text><text x="28" y="1208" font-size="17" font-weight="400" text-anchor="start">collecting real customer data is not required as proof.</text></g></svg>
