<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc" lang="zh"><title id="title">密碼學的四項主要任務</title><desc id="desc">四種任務平行存在。Hash 本身不能驗證發送者；簽章不直接提供保密性，通常需要組合機制。</desc><rect width="900" height="510" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">密碼學的四項主要任務</text><rect x="28" y="88" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="120" font-size="20" font-weight="700" text-anchor="middle">保密性 Confidentiality</text><text x="229.0" y="158" font-size="18" font-weight="400" text-anchor="middle">讓未授權者看不懂資料</text><text x="229.0" y="190" font-size="18" font-weight="400" text-anchor="middle">AES、Twofish、RSA 加密</text><rect x="458" y="88" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="120" font-size="20" font-weight="700" text-anchor="middle">金鑰建立 Key Establishment</text><text x="659.0" y="158" font-size="18" font-weight="400" text-anchor="middle">讓雙方取得共同金鑰</text><text x="659.0" y="190" font-size="18" font-weight="400" text-anchor="middle">DH、ECDH、RSA-based schemes</text><rect x="28" y="258" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="290" font-size="20" font-weight="700" text-anchor="middle">完整性 Integrity</text><text x="229.0" y="328" font-size="18" font-weight="400" text-anchor="middle">檢查資料是否遭更動</text><text x="229.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Hash、MAC、Digital Signature</text><rect x="458" y="258" width="402" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="290" font-size="20" font-weight="700" text-anchor="middle">身分與來源驗證 Authentication</text><text x="659.0" y="328" font-size="18" font-weight="400" text-anchor="middle">確認訊息與可信對象的關係</text><text x="659.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Digital Signature、PKI</text><text x="28" y="460" font-size="17" font-weight="400" text-anchor="start">四種任務平行存在。Hash 本身不能驗證發送者；簽章不直接提供保密性，通常需要組合機制。</text></g></svg>
