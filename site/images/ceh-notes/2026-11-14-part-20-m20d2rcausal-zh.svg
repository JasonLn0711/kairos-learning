<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1832" role="img" aria-labelledby="title desc" lang="zh"><title id="title">CSRF 圖 3｜CSRF 的完整因果流程</title><desc id="desc">分析以Cookie登入的轉帳情境。Cookie閘門的否分支止於「沒有銀行登入憑證」，不會流入下一個驗證閘門；是分支才攜帶Session到銀行。Server拒絕與通過分開，不表示請求能發出就會成功。虛線框是決策，實線箭頭是因果方向。</desc><rect width="900" height="1832" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1010V1054.0H222.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="1044.0" text-anchor="middle" font-size="16">否</text><path d="M436.0 1010V1054.0H650.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="1044.0" text-anchor="middle" font-size="16">是</text><path d="M650.0 1244V1288.0H436.0V1332m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1446V1490.0H222.0V1534m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="1480.0" text-anchor="middle" font-size="16">拒絕</text><path d="M436.0 1446V1490.0H650.0V1534m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="1480.0" text-anchor="middle" font-size="16">通過</text><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CSRF 圖 3｜CSRF 的完整因果流程</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Alice 登入銀行</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">完成身分驗證</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">銀行建立 Session，瀏覽器儲存銀行 Cookie</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Server 與 Browser 各自管理工作階段和Cookie</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Alice 開啟 evil.example</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">取得惡意頁面</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">惡意頁面要求 Browser 向 bank.example 發 Request</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">指定銀行URL與操作參數</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5" stroke-dasharray="5 4"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">Cookie 政策允許附帶銀行 Cookie？</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">依目的地、Cookie屬性與請求情境判斷</text><rect x="28.0" y="1098" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">Request 可能送達，但沒有銀行登入</text><text x="222.0" y="1162" font-size="20" font-weight="700" text-anchor="middle">憑證</text><text x="222.0" y="1200" font-size="18" font-weight="400" text-anchor="middle">通常不能以已登入Alice身分執行轉帳</text><rect x="456.0" y="1098" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">銀行收到操作參數及 Alice 的</text><text x="650.0" y="1162" font-size="20" font-weight="700" text-anchor="middle">Session Cookie</text><text x="650.0" y="1200" font-size="18" font-weight="400" text-anchor="middle">仍須進一步驗證</text><rect x="28.0" y="1332" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5" stroke-dasharray="5 4"/><text x="436.0" y="1364" font-size="20" font-weight="700" text-anchor="middle">Server 是否通過 CSRF 與權限檢查？</text><text x="436.0" y="1402" font-size="18" font-weight="400" text-anchor="middle">連同必要的交易安全要求一併判斷</text><rect x="28.0" y="1534" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="1566" font-size="20" font-weight="700" text-anchor="middle">阻止操作</text><text x="222.0" y="1604" font-size="18" font-weight="400" text-anchor="middle">拒絕未通過驗證的Request</text><rect x="456.0" y="1534" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="1566" font-size="20" font-weight="700" text-anchor="middle">處理 Request</text><text x="650.0" y="1604" font-size="18" font-weight="400" text-anchor="middle">通過必要驗證後才執行</text><text x="28" y="1718" font-size="17" font-weight="400" text-anchor="start">分析以Cookie登入的轉帳情境。Cookie閘門的否分支止於「沒有銀行登入憑證」，不會流入下</text><text x="28" y="1750" font-size="17" font-weight="400" text-anchor="start">一個驗證閘門；是分支才攜帶Session到銀行。Server拒絕與通過分開，不表示請求能發出就</text><text x="28" y="1782" font-size="17" font-weight="400" text-anchor="start">會成功。虛線框是決策，實線箭頭是因果方向。</text></g></svg>
