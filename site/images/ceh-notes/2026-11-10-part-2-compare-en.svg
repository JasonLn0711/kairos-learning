<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" role="img" aria-labelledby="title desc" lang="en"><title id="title">Encryption and hashing have different directions</title><desc id="desc">Encryption has a corresponding decryption procedure; hashing has no decryption operation. Low-entropy inputs can still be guessed and hashed for comparison. That is guessing an input, not decrypting a digest.</desc><rect width="900" height="538" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Encryption and hashing have different directions</text><rect x="28" y="90" width="404" height="242" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="46" y="124" font-size="20" font-weight="700" text-anchor="start">Encryption</text><text x="46" y="164" font-size="18" font-weight="400" text-anchor="start">Plaintext</text><text x="46" y="196" font-size="18" font-weight="400" text-anchor="start">↓ Algorithm and key</text><text x="46" y="228" font-size="18" font-weight="400" text-anchor="start">Ciphertext</text><text x="46" y="260" font-size="18" font-weight="400" text-anchor="start">↑ The appropriate key can</text><text x="46" y="292" font-size="18" font-weight="400" text-anchor="start">recover the plaintext</text><rect x="458" y="90" width="404" height="242" rx="12" fill="#f5f7f8" stroke="#d8dce0"/><text x="476" y="124" font-size="20" font-weight="700" text-anchor="start">Hashing</text><text x="476" y="164" font-size="18" font-weight="400" text-anchor="start">Original data</text><text x="476" y="196" font-size="18" font-weight="400" text-anchor="start">↓ Hash function</text><text x="476" y="228" font-size="18" font-weight="400" text-anchor="start">Digest</text><text x="476" y="260" font-size="18" font-weight="400" text-anchor="start">No corresponding decryption</text><text x="476" y="292" font-size="18" font-weight="400" text-anchor="start">operation</text><text x="28" y="386" font-size="17" font-weight="400" text-anchor="start">Encryption has a corresponding decryption procedure; hashing has</text><text x="28" y="418" font-size="17" font-weight="400" text-anchor="start">no decryption operation. Low-entropy inputs can still be guessed</text><text x="28" y="450" font-size="17" font-weight="400" text-anchor="start">and hashed for comparison. That is guessing an input, not</text><text x="28" y="482" font-size="17" font-weight="400" text-anchor="start">decrypting a digest.</text></g></svg>
