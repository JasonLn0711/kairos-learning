<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" role="img" aria-labelledby="title desc" lang="zh"><title id="title">OWASP 與 MITRE ATT&amp;CK：互補的觀察角度</title><desc id="desc">兩欄是平行比較；NIST SP 800-115補上測試活動的規劃、執行、證據與報告方法。ATT&amp;CK技術編號不構成測試授權。</desc><rect width="900" height="386" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">OWASP 與 MITRE ATT&amp;CK：互補的觀察角度</text><rect x="28.0" y="88" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">OWASP</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">從應用程式弱點與安全控制出發</text><text x="222.0" y="190" font-size="18" font-weight="400" text-anchor="middle">要測什麼？如何驗證與改善？</text><rect x="456.0" y="88" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">MITRE ATT&amp;CK</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">從已知攻擊者行為出發</text><text x="650.0" y="190" font-size="18" font-weight="400" text-anchor="middle">攻擊者如何行動？防禦能否偵測？</text><text x="28" y="304" font-size="17" font-weight="400" text-anchor="start">兩欄是平行比較；NIST SP 800-115補上測試活動的規劃、執行、證據與報告方法。ATT&amp;CK</text><text x="28" y="336" font-size="17" font-weight="400" text-anchor="start">技術編號不構成測試授權。</text></g></svg>
