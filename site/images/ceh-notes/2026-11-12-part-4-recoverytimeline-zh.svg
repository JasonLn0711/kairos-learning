<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 818" role="img" aria-labelledby="title desc" lang="zh"><title id="title">銀行交易系統示例：RPO 15 分鐘、RTO 2 小時</title><desc id="desc">以下數字僅供教學，是目標而非實測結果或固定法規要求。RPO 關心資料損失的時間範圍；RTO 關心恢復服務所需的時間。兩者必須分別經過備份、復原與演練驗證。線段依 15：120（1：8）呈現真正時間比例，文字獨立排列以免窄螢幕標籤重疊。 本教學例以事故點 0 作為 RTO 計時基準；實務起訖點依業務需求與復原計畫明確定義，不表示所有 NIST 情境一律從事故點起算。</desc><rect width="900" height="818" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700">銀行交易系統示例：RPO 15 分鐘、RTO 2 小時</text><rect x="28" y="94" width="93.77777777777777" height="9" rx="2" fill="#ac772b"/><rect x="121.77777777777777" y="94" width="750.2222222222222" height="9" rx="2" fill="#2c8478"/><rect x="26.5" y="82" width="3" height="33" rx="2" fill="#455952"/><rect x="120.27777777777777" y="82" width="3" height="33" rx="2" fill="#455952"/><rect x="870.5" y="82" width="3" height="33" rx="2" fill="#455952"/><text x="28" y="156" font-size="19" font-weight="700">RPO 15 min : RTO 120 min = 1:8</text><rect x="28" y="206" width="844" height="118" rx="2" fill="#f1f6f3"/><text x="46" y="240" font-size="20" font-weight="700">復原點｜事故前 15 分鐘（−15 min）</text><text x="46" y="278" font-size="18" font-weight="400">RPO（Recovery Point Objective）= 15 分鐘：資料復原點目標。</text><rect x="28" y="344" width="844" height="118" rx="2" fill="#f1f6f3"/><text x="46" y="378" font-size="20" font-weight="700">事故｜0 min</text><text x="46" y="416" font-size="18" font-weight="400">時間軸基準點：系統中斷開始。</text><rect x="28" y="482" width="844" height="150" rx="2" fill="#f1f6f3"/><text x="46" y="516" font-size="20" font-weight="700">復原目標｜事故後 2 小時（+120 min）</text><text x="46" y="554" font-size="18" font-weight="400">RTO（Recovery Time Objective）= 2 小時：恢復所需服務能力的目標。事故到此目標</text><text x="46" y="586" font-size="18" font-weight="400">之間為系統中斷及復原期間。</text><text x="28" y="672" font-size="18" font-weight="400">以下數字僅供教學，是目標而非實測結果或固定法規要求。RPO 關心資料損失的時間範圍；RTO 關</text><text x="28" y="704" font-size="18" font-weight="400">心恢復服務所需的時間。兩者必須分別經過備份、復原與演練驗證。線段依 15：120（1：8）呈現</text><text x="28" y="736" font-size="18" font-weight="400">真正時間比例，文字獨立排列以免窄螢幕標籤重疊。 本教學例以事故點 0 作為 RTO 計時基準；</text><text x="28" y="768" font-size="18" font-weight="400">實務起訖點依業務需求與復原計畫明確定義，不表示所有 NIST 情境一律從事故點起算。</text></g></svg>
