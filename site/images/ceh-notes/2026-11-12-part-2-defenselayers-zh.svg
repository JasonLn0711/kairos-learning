<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 739.8000000000001" role="img" aria-labelledby="title desc" lang="zh"><title id="title">四層縱深防禦</title><desc id="desc">外層包覆內層，多層控制共同保護核心資產。 多層防禦旨在避免單一控制失效就造成不可接受的後果；各控制仍須分別驗證有效性。</desc><rect width="900" height="739.8000000000001" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">四層縱深防禦</text><rect x="28" y="101.6" width="844" height="514.8" rx="12" fill="#f0f3f7" stroke="#adc8bc"/><text x="46" y="135.6" font-size="20" font-weight="700">實體與環境</text><text x="46" y="173.6" font-size="18" font-weight="400">門禁、機房與環境保護</text><rect x="48" y="215.29999999999998" width="804" height="381.1" rx="12" fill="#e9f0f7" stroke="#adc8bc"/><text x="66" y="249.29999999999998" font-size="20" font-weight="700">網路區隔與流量</text><text x="66" y="287.29999999999995" font-size="18" font-weight="400">網段、邊界與流量控制</text><rect x="68" y="328.99999999999994" width="764" height="247.40000000000003" rx="12" fill="#e7f1ed" stroke="#adc8bc"/><text x="86" y="362.99999999999994" font-size="20" font-weight="700">端點與身分</text><text x="86" y="400.99999999999994" font-size="18" font-weight="400">端點防護、帳號與權限管理</text><rect x="88" y="442.69999999999993" width="724" height="113.70000000000005" rx="12" fill="#dceddf" stroke="#adc8bc"/><text x="106" y="476.69999999999993" font-size="20" font-weight="700">關鍵資料與系統</text><text x="106" y="514.6999999999999" font-size="18" font-weight="400">加密、驗證、備份與完整性</text><text x="28" y="660.4" font-size="18" font-weight="400">外層包覆內層，多層控制共同保護核心資產。 多層防禦旨在避免單一控制失效就造成不可接受的後</text><text x="28" y="690.1" font-size="18" font-weight="400">果；各控制仍須分別驗證有效性。</text></g></svg>
