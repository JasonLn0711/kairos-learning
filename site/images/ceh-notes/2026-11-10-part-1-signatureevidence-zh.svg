<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" role="img" aria-labelledby="title desc" lang="zh"><title id="title">Digital Signature：建立與驗證證據</title><desc id="desc">典型概念流程；演算法的實際計算程序可能不同。身分歸屬須結合可信憑證、私鑰保護、時間及稽核證據，不能只靠資料庫中的名字。</desc><rect width="900" height="960" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Digital Signature：建立與驗證證據</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">原始電子文件</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">例如：已核准的製程變更單</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">產生雜湊摘要（Hash）</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">將文件映射成固定長度摘要</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">使用私鑰進行數位簽章</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">由簽署者控制的金鑰建立簽章</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">驗證簽章與身分</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">使用公鑰驗證，搭配憑證、時間與稽核資料</text><text x="28" y="878" font-size="17" font-weight="400" text-anchor="start">典型概念流程；演算法的實際計算程序可能不同。身分歸屬須結合可信憑證、私鑰保護、時間及稽</text><text x="28" y="910" font-size="17" font-weight="400" text-anchor="start">核證據，不能只靠資料庫中的名字。</text></g></svg>
