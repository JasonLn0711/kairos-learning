<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 10｜Cookie 與伺服器 Session 分工</title><desc id="desc">這是傳統伺服器端 Session 的並列分工，不是瀏覽器把帳戶資料存進識別碼；其他 Token 架構見正文。</desc><rect width="900" height="400" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 10｜Cookie 與伺服器 Session 分工</text><rect x="28" y="88" width="404" height="180" rx="12" fill="#f2f4f5" stroke="#d8dce0"/><text x="46" y="120" font-size="20" font-weight="700" text-anchor="start">Browser</text><text x="46" y="160" font-size="18" font-weight="400" text-anchor="start">儲存一個識別碼，例如：</text><text x="46" y="192" font-size="18" font-weight="400" text-anchor="start">session=S7x9...</text><text x="46" y="224" font-size="18" font-weight="400" text-anchor="start">瀏覽器不一定知道這個識別碼對應誰。</text><rect x="468" y="88" width="404" height="180" rx="12" fill="#f2f4f5" stroke="#d8dce0"/><text x="486" y="120" font-size="20" font-weight="700" text-anchor="start">Server</text><text x="486" y="160" font-size="18" font-weight="400" text-anchor="start">儲存 Session 紀錄，例如：</text><text x="486" y="192" font-size="18" font-weight="400" text-anchor="start">S7x9... → User Alice</text><text x="486" y="224" font-size="18" font-weight="400" text-anchor="start">同時管理有效期限、權限及其他狀態。</text><text x="28" y="316" font-size="17" font-weight="400" text-anchor="start">這是傳統伺服器端 Session 的並列分工，不是瀏覽器把帳戶資料存進識別碼；其他 Token</text><text x="28" y="348" font-size="17" font-weight="400" text-anchor="start">架構見正文。</text></g></svg>
