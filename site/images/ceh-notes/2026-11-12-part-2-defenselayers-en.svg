<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799.2000000000002" role="img" aria-labelledby="title desc" lang="en"><title id="title">Four layers of defense in depth</title><desc id="desc">Outer layers contain inner layers; multiple controls protect core assets. Multiple layers aim to prevent one failed control from causing unacceptable consequences; each control must still be verified for effectiveness.</desc><rect width="900" height="799.2000000000002" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="42" font-size="24" font-weight="700">Four layers of defense in depth</text><rect x="28" y="101.6" width="844" height="514.8" rx="12" fill="#f0f3f7" stroke="#adc8bc"/><text x="46" y="135.6" font-size="20" font-weight="700">Physical and environmental</text><text x="46" y="173.6" font-size="18" font-weight="400">Facility access and environmental protection</text><rect x="48" y="215.29999999999998" width="804" height="381.1" rx="12" fill="#e9f0f7" stroke="#adc8bc"/><text x="66" y="249.29999999999998" font-size="20" font-weight="700">Network segmentation and traffic</text><text x="66" y="287.29999999999995" font-size="18" font-weight="400">Segments, boundaries and traffic controls</text><rect x="68" y="328.99999999999994" width="764" height="247.40000000000003" rx="12" fill="#e7f1ed" stroke="#adc8bc"/><text x="86" y="362.99999999999994" font-size="20" font-weight="700">Endpoint and identity</text><text x="86" y="400.99999999999994" font-size="18" font-weight="400">Endpoint protection, accounts and privileges</text><rect x="88" y="442.69999999999993" width="724" height="113.70000000000005" rx="12" fill="#dceddf" stroke="#adc8bc"/><text x="106" y="476.69999999999993" font-size="20" font-weight="700">Critical data and systems</text><text x="106" y="514.6999999999999" font-size="18" font-weight="400">Encryption, authentication, backups and integrity</text><text x="28" y="660.4" font-size="18" font-weight="400">Outer layers contain inner layers; multiple controls protect core</text><text x="28" y="690.1" font-size="18" font-weight="400">assets. Multiple layers aim to prevent one failed control from causing</text><text x="28" y="719.8000000000001" font-size="18" font-weight="400">unacceptable consequences; each control must still be verified for</text><text x="28" y="749.5000000000001" font-size="18" font-weight="400">effectiveness.</text></g></svg>
