<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 882" role="img" aria-labelledby="title desc" lang="zh"><title id="title">銀行交易簽署與驗證流程</title><desc id="desc">兩欄分別為發送端簽署、接收端驗證。實際 RSA-PSS、DSA 等方案各有編碼與運算，不把簽章稱為「用私鑰加密 Hash」；驗證公鑰須可信。</desc><rect width="900" height="882" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">銀行交易簽署與驗證流程</text><rect x="28" y="88" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="120" font-size="20" font-weight="700" text-anchor="middle">發送端 Signing</text><text x="229.0" y="158" font-size="18" font-weight="400" text-anchor="middle">交易資料 M</text><path d="M229 214v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="270" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="302" font-size="20" font-weight="700" text-anchor="middle">計算摘要</text><text x="229.0" y="340" font-size="18" font-weight="400" text-anchor="middle">Hash(M)</text><path d="M229 396v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="452" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="484" font-size="20" font-weight="700" text-anchor="middle">私鑰簽署</text><text x="229.0" y="522" font-size="18" font-weight="400" text-anchor="middle">依指定簽章方案運算</text><path d="M229 578v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="28" y="634" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="229.0" y="666" font-size="20" font-weight="700" text-anchor="middle">產生 Signature</text><text x="229.0" y="704" font-size="18" font-weight="400" text-anchor="middle">將 M 與簽章交付接收端</text><rect x="458" y="88" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="120" font-size="20" font-weight="700" text-anchor="middle">接收端 Verification</text><text x="659.0" y="158" font-size="18" font-weight="400" text-anchor="middle">收到 M 與 Signature</text><path d="M659 214v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="458" y="270" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="302" font-size="20" font-weight="700" text-anchor="middle">重新計算摘要</text><text x="659.0" y="340" font-size="18" font-weight="400" text-anchor="middle">Hash(M)</text><path d="M659 396v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="458" y="452" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="484" font-size="20" font-weight="700" text-anchor="middle">以可信公鑰驗證簽章</text><text x="659.0" y="522" font-size="18" font-weight="400" text-anchor="middle">先確認公鑰與簽署者身分的可信關係</text><path d="M659 578v24m-6-6 6 6 6-6" fill="none" stroke="#77867f" stroke-width="2"/><rect x="458" y="634" width="402" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="659.0" y="666" font-size="20" font-weight="700" text-anchor="middle">通過／失敗</text><text x="659.0" y="704" font-size="18" font-weight="400" text-anchor="middle">依指定方案與驗證條件判定</text><text x="28" y="800" font-size="17" font-weight="400" text-anchor="start">兩欄分別為發送端簽署、接收端驗證。實際 RSA-PSS、DSA 等方案各有編碼與運算，不把簽章</text><text x="28" y="832" font-size="17" font-weight="400" text-anchor="start">稱為「用私鑰加密 Hash」；驗證公鑰須可信。</text></g></svg>
