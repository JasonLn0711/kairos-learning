<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 874" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖5｜SYN 探測的三個觀察位置</title><desc id="desc">箭頭由發送端往不同觀察層次閱讀，不代表每一層必然產生日誌。應用沒有完整連線紀錄，不能推論防火牆或IDS看不到封包。</desc><rect width="900" height="874" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖5｜SYN 探測的三個觀察位置</text><text x="42" y="114" font-size="20" font-weight="700" text-anchor="start">掃描者發送 SYN</text><text x="42" y="154" font-size="18" font-weight="400" text-anchor="start">封包朝已授權目標送出。</text><path d="M450 198v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="296" font-size="20" font-weight="700" text-anchor="start">第一層：防火牆／網路 IDS</text><text x="42" y="336" font-size="18" font-weight="400" text-anchor="start">看得到封包、TCP Flags、來源、目的地與流量模式。</text><path d="M450 380v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="478" font-size="20" font-weight="700" text-anchor="start">第二層：作業系統／TCP Stack</text><text x="42" y="518" font-size="18" font-weight="400" text-anchor="start">可以觀察連線嘗試、狀態變化及部分事件。</text><path d="M450 562v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2" /><text x="42" y="660" font-size="20" font-weight="700" text-anchor="start">第三層：應用程式日誌</text><text x="42" y="700" font-size="18" font-weight="400" text-anchor="start">是否留下紀錄，取決於應用程式何時開始記錄及其設定。</text><text x="28" y="786" font-size="17" font-weight="400" text-anchor="start">箭頭由發送端往不同觀察層次閱讀，不代表每一層必然產生日誌。應用沒有完整連線紀錄，不</text><text x="28" y="818" font-size="17" font-weight="400" text-anchor="start">能推論防火牆或IDS看不到封包。</text></g></svg>
