<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1524" role="img" aria-labelledby="title desc" lang="en"><title id="title">Six steps for sanitization governance</title><desc id="desc">Closure requires retention review, verified execution and evidence.</desc><rect width="900" height="1524" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 234V278.0H436.0V322m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 468V512.0H436.0V556m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 702V746.0H436.0V790m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 936V980.0H436.0V1024m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1170V1214.0H436.0V1258m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Six steps for sanitization governance</text><rect x="28.0" y="88" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">1 | Identify</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Confirm the media serial number, owner, data categories, sensitivity</text><text x="436.0" y="190" font-size="18" font-weight="400" text-anchor="middle">and all known data copies.</text><rect x="28.0" y="322" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="354" font-size="20" font-weight="700" text-anchor="middle">2 | Authorize</text><text x="436.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Confirm retention periods, legal obligations, legal holds and</text><text x="436.0" y="424" font-size="18" font-weight="400" text-anchor="middle">approving personnel.</text><rect x="28.0" y="556" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="588" font-size="20" font-weight="700" text-anchor="middle">3 | Select</text><text x="436.0" y="626" font-size="18" font-weight="400" text-anchor="middle">Choose Clear, Purge or Destroy based on media technology, sensitivity</text><text x="436.0" y="658" font-size="18" font-weight="400" text-anchor="middle">, recovery threats and reuse requirements.</text><rect x="28.0" y="790" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="822" font-size="20" font-weight="700" text-anchor="middle">4 | Execute</text><text x="436.0" y="860" font-size="18" font-weight="400" text-anchor="middle">Use approved tools and procedures; record operators, device</text><text x="436.0" y="892" font-size="18" font-weight="400" text-anchor="middle">identifiers and execution outcomes.</text><rect x="28.0" y="1024" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1056" font-size="20" font-weight="700" text-anchor="middle">5 | Verify and validate</text><text x="436.0" y="1094" font-size="18" font-weight="400" text-anchor="middle">First verify successful completion; then validate whether the result</text><text x="436.0" y="1126" font-size="18" font-weight="400" text-anchor="middle">provides the protection required for data confidentiality.</text><rect x="28.0" y="1258" width="816.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1290" font-size="20" font-weight="700" text-anchor="middle">6 | Document and close</text><text x="436.0" y="1328" font-size="18" font-weight="400" text-anchor="middle">Retain sanitization certificates, review and approval records; decide</text><text x="436.0" y="1360" font-size="18" font-weight="400" text-anchor="middle">whether the media may be released, reused or disposed of.</text><text x="28" y="1474" font-size="17" font-weight="400" text-anchor="start">Closure requires retention review, verified execution and evidence.</text></g></svg>
