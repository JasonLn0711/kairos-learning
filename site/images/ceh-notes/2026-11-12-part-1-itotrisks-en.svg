<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" role="img" aria-labelledby="title desc" lang="en"><title id="title">Security testing carries different risks</title><desc id="desc">Requirements depend on actual assets and risks, rather than imposing identical restrictions on every IT or OT system. The comparison does not imply that OT can ignore data security or recovery.</desc><rect width="900" height="546" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Security testing carries different risks</text><rect x="28.0" y="88" width="388.0" height="274" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Enterprise IT systems</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Office networks, websites and</text><text x="222.0" y="190" font-size="18" font-weight="400" text-anchor="middle">general applications</text><text x="222.0" y="222" font-size="18" font-weight="400" text-anchor="middle">Key concerns: service</text><text x="222.0" y="254" font-size="18" font-weight="400" text-anchor="middle">availability, data security</text><text x="222.0" y="286" font-size="18" font-weight="400" text-anchor="middle">and recovery</text><rect x="456.0" y="88" width="388.0" height="274" rx="12" fill="#f7f1e9" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Fab OT systems</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Manufacturing equipment,</text><text x="650.0" y="190" font-size="18" font-weight="400" text-anchor="middle">control systems and process</text><text x="650.0" y="222" font-size="18" font-weight="400" text-anchor="middle">networks</text><text x="650.0" y="254" font-size="18" font-weight="400" text-anchor="middle">Additional concerns: equipment</text><text x="650.0" y="286" font-size="18" font-weight="400" text-anchor="middle">safety, process stability and</text><text x="650.0" y="318" font-size="18" font-weight="400" text-anchor="middle">physical loss</text><text x="28" y="432" font-size="17" font-weight="400" text-anchor="start">Requirements depend on actual assets and risks, rather than imposing</text><text x="28" y="464" font-size="17" font-weight="400" text-anchor="start">identical restrictions on every IT or OT system. The comparison does</text><text x="28" y="496" font-size="17" font-weight="400" text-anchor="start">not imply that OT can ignore data security or recovery.</text></g></svg>
