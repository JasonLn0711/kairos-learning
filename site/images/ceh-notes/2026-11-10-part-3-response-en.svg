<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1598" role="img" aria-labelledby="title desc" lang="en"><title id="title">Response to ongoing exfiltration</title><desc id="desc">Arrows show a teaching sequence, not a rigid forensic order. Incident command balances containment, volatile evidence, exfiltration speed and availability; storage encryption is a long-term safeguard.</desc><rect width="900" height="1598" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1010V1054.0H436.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1212V1256.0H436.0V1300m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Response to ongoing exfiltration</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Detect patient-data exfiltration</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Activate the established incident-response process</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Determine affected scope and ongoing activity</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Identify affected assets and actions</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Isolate affected hosts and block malicious connections</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Limit expansion under incident command</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Preserve memory, disk and log evidence</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">Retain and transfer evidence under the response procedure</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">Investigate entry paths and stolen credentials</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">Identify repairs and revocations</text><rect x="28.0" y="1098" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">Eradicate threats, rotate keys and rebuild trust</text><text x="436.0" y="1168" font-size="18" font-weight="400" text-anchor="middle">Verify recovery conditions</text><rect x="28.0" y="1300" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1332" font-size="20" font-weight="700" text-anchor="middle">Deploy storage encryption and access controls</text><text x="436.0" y="1370" font-size="18" font-weight="400" text-anchor="middle">Do not treat new encryption as an immediate stop to exfiltration</text><text x="28" y="1484" font-size="17" font-weight="400" text-anchor="start">Arrows show a teaching sequence, not a rigid forensic order. Incident</text><text x="28" y="1516" font-size="17" font-weight="400" text-anchor="start">command balances containment, volatile evidence, exfiltration speed</text><text x="28" y="1548" font-size="17" font-weight="400" text-anchor="start">and availability; storage encryption is a long-term safeguard.</text></g></svg>
