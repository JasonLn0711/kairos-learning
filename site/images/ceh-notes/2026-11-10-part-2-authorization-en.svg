<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" role="img" aria-labelledby="title desc" lang="en"><title id="title">Four steps in authorized testing</title><desc id="desc">Arrows show work dependencies. The authorizer must represent the target assets; scope and ROE constrain testing.</desc><rect width="900" height="960" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Four steps in authorized testing</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Obtain testing authorization</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Confirm who has authority over the target assets</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Agree scope and ROE</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">Targets, time, methods, data handling and stopping conditions</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">Test and preserve evidence</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">Limit impact and avoid unnecessary data collection</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">Report vulnerabilities and remediation</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">Enable the organization to reduce actual risk</text><text x="28" y="878" font-size="17" font-weight="400" text-anchor="start">Arrows show work dependencies. The authorizer must represent the</text><text x="28" y="910" font-size="17" font-weight="400" text-anchor="start">target assets; scope and ROE constrain testing.</text></g></svg>
