<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 822" role="img" aria-labelledby="title desc" lang="zh"><title id="title">密碼學系統的概念關係</title><desc id="desc">箭頭表示設計上的需求與落實關係；四個安全機制是平行面向，不代表依序執行。</desc><rect width="900" height="822" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H115.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 202V246.0H329.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 202V246.0H543.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 202V246.0H757.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M115.0 500V544.0H436.0V588m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M329.0 500V544.0H436.0V588m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M543.0 500V544.0H436.0V588m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M757.0 500V544.0H436.0V588m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">密碼學系統的概念關係</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">安全需求與威脅模型</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">誰可能攻擊？能控制哪些金鑰、資料或設備？</text><rect x="28.0" y="290" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="115.0" y="322" font-size="20" font-weight="700" text-anchor="middle">加密</text><text x="115.0" y="354" font-size="20" font-weight="700" text-anchor="middle">Encryption</text><text x="115.0" y="392" font-size="18" font-weight="400" text-anchor="middle">保護資料內容</text><rect x="242.0" y="290" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="329.0" y="322" font-size="20" font-weight="700" text-anchor="middle">Hash /</text><text x="329.0" y="354" font-size="20" font-weight="700" text-anchor="middle">MAC</text><text x="329.0" y="392" font-size="18" font-weight="400" text-anchor="middle">檢查資料變動；</text><text x="329.0" y="424" font-size="18" font-weight="400" text-anchor="middle">MAC 另支援來</text><text x="329.0" y="456" font-size="18" font-weight="400" text-anchor="middle">源認證</text><rect x="456.0" y="290" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="543.0" y="322" font-size="20" font-weight="700" text-anchor="middle">數位簽章</text><text x="543.0" y="354" font-size="20" font-weight="700" text-anchor="middle">Signature</text><text x="543.0" y="392" font-size="18" font-weight="400" text-anchor="middle">驗證資料與簽署</text><text x="543.0" y="424" font-size="18" font-weight="400" text-anchor="middle">金鑰的關聯</text><rect x="670.0" y="290" width="174.0" height="210" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="757.0" y="322" font-size="20" font-weight="700" text-anchor="middle">PKI / CA</text><text x="757.0" y="360" font-size="18" font-weight="400" text-anchor="middle">建立公鑰身分信</text><text x="757.0" y="392" font-size="18" font-weight="400" text-anchor="middle">任</text><rect x="28.0" y="588" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="620" font-size="20" font-weight="700" text-anchor="middle">安全的協定、實作與金鑰生命週期管理</text><text x="436.0" y="658" font-size="18" font-weight="400" text-anchor="middle">從數學上的安全，走向實際系統中的安全</text><text x="28" y="772" font-size="17" font-weight="400" text-anchor="start">箭頭表示設計上的需求與落實關係；四個安全機制是平行面向，不代表依序執行。</text></g></svg>
