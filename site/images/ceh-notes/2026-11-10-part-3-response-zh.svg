<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1566" role="img" aria-labelledby="title desc" lang="zh"><title id="title">發現持續外洩時的應變思路</title><desc id="desc">箭頭表示教學閱讀依賴，不是僵化鑑識次序。隔離、揮發性證據、外洩速度與服務可用性須由應變指揮共同權衡；儲存加密是長期防護。</desc><rect width="900" height="1566" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H436.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 808V852.0H436.0V896m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1010V1054.0H436.0V1098m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 1212V1256.0H436.0V1300m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">發現持續外洩時的應變思路</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">發現病患資料正在外洩</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">啟動既定事件應變程序</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">確認受害範圍及持續中的攻擊</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">判斷受影響資產與活動</text><rect x="28.0" y="492" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="524" font-size="20" font-weight="700" text-anchor="middle">隔離受害主機、封鎖惡意連線</text><text x="436.0" y="562" font-size="18" font-weight="400" text-anchor="middle">依指揮決策限制攻擊擴大</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">保全記憶體、磁碟及日誌證據</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">依應變程序保存與交接</text><rect x="28.0" y="896" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="928" font-size="20" font-weight="700" text-anchor="middle">調查入侵路徑與遭竊憑證</text><text x="436.0" y="966" font-size="18" font-weight="400" text-anchor="middle">找出需要修補及撤銷的項目</text><rect x="28.0" y="1098" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1130" font-size="20" font-weight="700" text-anchor="middle">清除威脅、輪替金鑰、重建可信環境</text><text x="436.0" y="1168" font-size="18" font-weight="400" text-anchor="middle">驗證恢復條件</text><rect x="28.0" y="1300" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="1332" font-size="20" font-weight="700" text-anchor="middle">部署儲存加密與存取控制等長期防護</text><text x="436.0" y="1370" font-size="18" font-weight="400" text-anchor="middle">避免把新增加密當成即時中止外洩</text><text x="28" y="1484" font-size="17" font-weight="400" text-anchor="start">箭頭表示教學閱讀依賴，不是僵化鑑識次序。隔離、揮發性證據、外洩速度與服務可用性須由應變</text><text x="28" y="1516" font-size="17" font-weight="400" text-anchor="start">指揮共同權衡；儲存加密是長期防護。</text></g></svg>
