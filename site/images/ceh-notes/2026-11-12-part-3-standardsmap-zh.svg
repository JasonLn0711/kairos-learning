<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 928" role="img" aria-labelledby="title desc" lang="zh"><title id="title">C25–C29 標準與觀念導覽</title><desc id="desc">這是教學導覽，不代表規範之間的強制依賴或認證順序。</desc><rect width="900" height="928" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 202V246.0H436.0V290m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H222.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 404V448.0H650.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M222.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 606V650.0H436.0V694m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">C25–C29 標準與觀念導覽</text><rect x="28.0" y="88" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">C25｜風險管理</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">辨識風險 → 分析與評估 → 決定處理方式。</text><rect x="28.0" y="290" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="322" font-size="20" font-weight="700" text-anchor="middle">C26｜ISO/IEC 27001</text><text x="436.0" y="360" font-size="18" font-weight="400" text-anchor="middle">規定企業應建立什麼樣的資訊安全管理系統。</text><rect x="28.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="524" font-size="20" font-weight="700" text-anchor="middle">C27｜ISO/IEC 27005</text><text x="222.0" y="562" font-size="18" font-weight="400" text-anchor="middle">如何詳細進行資訊安全風險管理？</text><rect x="456.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="524" font-size="20" font-weight="700" text-anchor="middle">C28｜ISO/IEC 27002</text><text x="650.0" y="562" font-size="18" font-weight="400" text-anchor="middle">有哪些安全控制可供選擇與實施？</text><rect x="28.0" y="694" width="816.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="436.0" y="726" font-size="20" font-weight="700" text-anchor="middle">C29｜ISO/IEC 27701</text><text x="436.0" y="764" font-size="18" font-weight="400" text-anchor="middle">如何建立個人資訊與隱私資訊管理系統？</text><text x="28" y="878" font-size="17" font-weight="400" text-anchor="start">這是教學導覽，不代表規範之間的強制依賴或認證順序。</text></g></svg>
