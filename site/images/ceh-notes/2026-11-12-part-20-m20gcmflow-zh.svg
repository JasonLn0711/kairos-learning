<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1354" role="img" aria-labelledby="title desc" lang="zh"><title id="title">AES-GCM：並行產生密文與驗證標籤，接收端驗證後才接受明文</title><desc id="desc">箭頭表示資料依賴及驗證條件，不表示把秘密金鑰隨密文傳送。密文與Tag是同次認證加密的兩個輸出，不是前後兩步。接收端使用自己持有的相同金鑰，以及相同Nonce與AAD，驗證收到的密文／Tag；驗證成功才接受解密結果，失敗就拒絕資料。本圖是機制示意，沒有執行加密或提交作答。</desc><rect width="900" height="1354" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 234V278.0H436.0V322m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 436V480.0H222.0V524m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 436V480.0H650.0V524m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M222.0 670V714.0H436.0V758m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 670V714.0H436.0V758m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 904V948.0H222.0V992m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="329.0" y="938.0" text-anchor="middle" font-size="16">是</text><path d="M436.0 904V948.0H650.0V992m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="543.0" y="938.0" text-anchor="middle" font-size="16">否</text><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">AES-GCM：並行產生密文與驗證標籤，接收端驗證後才接受明文</text><rect x="28.0" y="88" width="816.0" height="146" rx="12" fill="#e9f2fa" stroke="#a4c5e1"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">輸入</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">明文＋秘密金鑰＋Nonce（IV）＋可選AAD</text><text x="436.0" y="190" font-size="18" font-weight="400" text-anchor="middle">同一把金鑰下遵守IV唯一性；AAD參與驗證但不加密。</text><rect x="28.0" y="322" width="816.0" height="114" rx="12" fill="#e9f2fa" stroke="#a4c5e1"/><text x="436.0" y="354" font-size="20" font-weight="700" text-anchor="middle">AES-GCM</text><text x="436.0" y="392" font-size="18" font-weight="400" text-anchor="middle">AES搭配GCM運作模式：加密明文，並計算Authentication Tag。</text><rect x="28.0" y="524" width="388.0" height="146" rx="12" fill="#f6f7f8" stroke="#cbd1d5"/><text x="222.0" y="556" font-size="20" font-weight="700" text-anchor="middle">Ciphertext｜密文</text><text x="222.0" y="594" font-size="18" font-weight="400" text-anchor="middle">加密明文所得的密文，保護機密性；與Tag</text><text x="222.0" y="626" font-size="18" font-weight="400" text-anchor="middle">一起送至接收端。</text><rect x="456.0" y="524" width="388.0" height="146" rx="12" fill="#f6f7f8" stroke="#cbd1d5"/><text x="650.0" y="556" font-size="20" font-weight="700" text-anchor="middle">Authentication Tag｜驗證標籤</text><text x="650.0" y="594" font-size="18" font-weight="400" text-anchor="middle">用於驗證密文與AAD的完整性及真實性；不</text><text x="650.0" y="626" font-size="18" font-weight="400" text-anchor="middle">是數位簽章或不可否認證明。</text><rect x="28.0" y="758" width="816.0" height="146" rx="12" fill="#f6f7f8" stroke="#cbd1d5"/><text x="436.0" y="790" font-size="20" font-weight="700" text-anchor="middle">接收端：Tag驗證成功？</text><text x="436.0" y="828" font-size="18" font-weight="400" text-anchor="middle">使用自己持有的相同秘密金鑰，加上收到的密文、Tag及相同Nonce（IV）與AAD，執行認證解</text><text x="436.0" y="860" font-size="18" font-weight="400" text-anchor="middle">密。</text><rect x="28.0" y="992" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="1024" font-size="20" font-weight="700" text-anchor="middle">通過：接受解密結果</text><text x="222.0" y="1062" font-size="18" font-weight="400" text-anchor="middle">只有驗證成功，才把解密得到的明文交給後</text><text x="222.0" y="1094" font-size="18" font-weight="400" text-anchor="middle">續應用使用。</text><rect x="456.0" y="992" width="388.0" height="146" rx="12" fill="#fbeeee" stroke="#d9a4a4"/><text x="650.0" y="1024" font-size="20" font-weight="700" text-anchor="middle">失敗：拒絕資料</text><text x="650.0" y="1062" font-size="18" font-weight="400" text-anchor="middle">輸出FAIL；不把未通過驗證的明文交付給</text><text x="650.0" y="1094" font-size="18" font-weight="400" text-anchor="middle">應用使用。</text><text x="28" y="1208" font-size="17" font-weight="400" text-anchor="start">箭頭表示資料依賴及驗證條件，不表示把秘密金鑰隨密文傳送。密文與Tag是同次認證加密的兩個</text><text x="28" y="1240" font-size="17" font-weight="400" text-anchor="start">輸出，不是前後兩步。接收端使用自己持有的相同金鑰，以及相同Nonce與AAD，驗證收到的密文</text><text x="28" y="1272" font-size="17" font-weight="400" text-anchor="start">／Tag；驗證成功才接受解密結果，失敗就拒絕資料。本圖是機制示意，沒有執行加密或提交作答</text><text x="28" y="1304" font-size="17" font-weight="400" text-anchor="start">。</text></g></svg>
