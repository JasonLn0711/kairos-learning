<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 844" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 5｜不安全的資料處理流程</title><desc id="desc">箭頭呈現不可信任輸入如何影響 SQL 查詢；框線標出資料跨成語法及查詢結果改變的後果。</desc><rect width="900" height="844" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 5｜不安全的資料處理流程</text><text x="450" y="120" font-size="20" font-weight="700" text-anchor="middle">使用者輸入（不可信任）</text><text x="450" y="160" font-size="18" font-weight="400" text-anchor="middle">輸入原本應該只作為資料值</text><path d="M450 212v24m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2"/><text x="450" y="296" font-size="20" font-weight="700" text-anchor="middle">程式直接拼接 SQL 字串</text><text x="450" y="336" font-size="18" font-weight="400" text-anchor="middle">沒有將程式指令與資料分離</text><path d="M450 388v24m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2"/><rect x="28" y="442" width="844" height="110" rx="10" fill="#fbfcfd" stroke="#d8dce0"/><text x="450" y="472" font-size="20" font-weight="700" text-anchor="middle">資料可能被解讀為 SQL 語法</text><text x="450" y="512" font-size="18" font-weight="400" text-anchor="middle">突破資料與查詢指令之間的界線</text><path d="M450 564v24m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2"/><rect x="28" y="618" width="844" height="110" rx="10" fill="#fbfcfd" stroke="#d8dce0"/><text x="450" y="648" font-size="20" font-weight="700" text-anchor="middle">查詢條件、操作或回傳結果遭改變</text><text x="450" y="688" font-size="18" font-weight="400" text-anchor="middle">實際影響仍取決於查詢結構、權限與程式處理</text><text x="28" y="760" font-size="17" font-weight="400" text-anchor="start">箭頭呈現不可信任輸入如何影響 SQL 查詢；框線標出資料跨成語法及查詢結果改變的後果</text><text x="28" y="792" font-size="17" font-weight="400" text-anchor="start">。</text></g></svg>
