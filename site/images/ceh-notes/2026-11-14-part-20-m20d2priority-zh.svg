<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 4｜四個觀念的建議學習比例</title><desc id="desc">建議閱讀順序：SQL Injection → RDAP／WHOIS → Directory Traversal ≈ CSRF。40／30／15／15 是本次教學時間與篇幅配置，不是 CEH 官方考題配分。</desc><rect width="900" height="740" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 4｜四個觀念的建議學習比例</text><text x="28" y="90" font-size="18" font-weight="700" text-anchor="start">排名</text><text x="100" y="90" font-size="18" font-weight="700" text-anchor="start">觀念</text><text x="415" y="90" font-size="18" font-weight="700" text-anchor="start">建議占比</text><text x="565" y="90" font-size="18" font-weight="700" text-anchor="start">考試定位</text><text x="28" y="138" font-size="18" font-weight="400" text-anchor="start">1</text><text x="100" y="138" font-size="18" font-weight="700" text-anchor="start">SQL Injection</text><text x="415" y="138" font-size="18" font-weight="400" text-anchor="start">40%</text><text x="565" y="138" font-size="18" font-weight="400" text-anchor="start">M15 獨立章節，深入理解原理與</text><text x="565" y="170" font-size="18" font-weight="400" text-anchor="start">防禦</text><path d="M28 210H872" stroke="#d8dce0"/><text x="28" y="242" font-size="18" font-weight="400" text-anchor="start">2</text><text x="100" y="242" font-size="18" font-weight="700" text-anchor="start">RDAP／WHOIS</text><text x="415" y="242" font-size="18" font-weight="400" text-anchor="start">30%</text><text x="565" y="242" font-size="18" font-weight="400" text-anchor="start">M02 Footprinting，承接本頁</text><text x="565" y="274" font-size="18" font-weight="400" text-anchor="start">網域註冊查詢</text><path d="M28 314H872" stroke="#d8dce0"/><text x="28" y="346" font-size="18" font-weight="400" text-anchor="start">3</text><text x="100" y="346" font-size="18" font-weight="700" text-anchor="start">Directory Traversal</text><text x="415" y="346" font-size="18" font-weight="400" text-anchor="start">15%</text><text x="565" y="346" font-size="18" font-weight="400" text-anchor="start">M14 Web Application，辨識</text><text x="565" y="378" font-size="18" font-weight="400" text-anchor="start">路徑越界機制</text><path d="M28 418H872" stroke="#d8dce0"/><text x="28" y="450" font-size="18" font-weight="400" text-anchor="start">3</text><text x="100" y="450" font-size="18" font-weight="700" text-anchor="start">CSRF</text><text x="415" y="450" font-size="18" font-weight="400" text-anchor="start">15%</text><text x="565" y="450" font-size="18" font-weight="400" text-anchor="start">M14 Web Application，辨識</text><text x="565" y="482" font-size="18" font-weight="400" text-anchor="start">非預期請求機制</text><path d="M28 522H872" stroke="#d8dce0"/><rect x="28" y="554" width="334.6" height="24" rx="10" fill="#245fe8" stroke="#d8dce0"/><rect x="365.6" y="554" width="250.2" height="24" rx="10" fill="#0d928a" stroke="#d8dce0"/><rect x="618.8" y="554" width="123.6" height="24" rx="10" fill="#b57a1c" stroke="#d8dce0"/><rect x="745.4" y="554" width="123.6" height="24" rx="10" fill="#7739e8" stroke="#d8dce0"/><text x="28" y="656" font-size="17" font-weight="400" text-anchor="start">建議閱讀順序：SQL Injection → RDAP／WHOIS → Directory Traversal ≈</text><text x="28" y="688" font-size="17" font-weight="400" text-anchor="start">CSRF。40／30／15／15 是本次教學時間與篇幅配置，不是 CEH 官方考題配分。</text></g></svg>
