<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 924" role="img" aria-labelledby="title desc" lang="zh"><title id="title">圖 9｜瀏覽器仲裁網頁、Cookie 與網路請求</title><desc id="desc">兩個網頁是平行的執行環境，不能任意互讀資料；Cookie Store 與 Network Stack 同屬瀏覽器管理，並非每個分頁各有獨立網路。箭頭表示請求經瀏覽器仲裁後送往目的地，不代表所有瀏覽器的程序切分。</desc><rect width="900" height="924" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">圖 9｜瀏覽器仲裁網頁、Cookie 與網路請求</text><rect x="28" y="88" width="404" height="116" rx="12" fill="#f2f4f5" stroke="#d8dce0"/><text x="46" y="120" font-size="20" font-weight="700" text-anchor="start">銀行頁面</text><text x="46" y="160" font-size="18" font-weight="400" text-anchor="start">bank.example.com</text><rect x="468" y="88" width="404" height="116" rx="12" fill="#f2f4f5" stroke="#d8dce0"/><text x="486" y="120" font-size="20" font-weight="700" text-anchor="start">惡意頁面</text><text x="486" y="160" font-size="18" font-weight="400" text-anchor="start">evil.example.net</text><text x="450" y="228" font-size="18" font-weight="400" text-anchor="middle">不同的網頁執行安全環境；無法任意互讀資料</text><path d="M450 268v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2"/><rect x="28" y="328" width="844" height="248" rx="12" fill="#fbfcfd" stroke="#d8dce0"/><text x="48" y="364" font-size="20" font-weight="700" text-anchor="start">Browser：執行權限與網路請求的仲裁者</text><text x="48" y="404" font-size="18" font-weight="400" text-anchor="start">都需要透過瀏覽器的網路與儲存機制</text><rect x="48" y="444" width="384" height="116" rx="12" fill="#f2f4f5" stroke="#d8dce0"/><text x="66" y="476" font-size="20" font-weight="700" text-anchor="start">Cookie Store</text><text x="66" y="516" font-size="18" font-weight="400" text-anchor="start">依網域與安全規則管理</text><rect x="468" y="444" width="384" height="116" rx="12" fill="#f2f4f5" stroke="#d8dce0"/><text x="486" y="476" font-size="20" font-weight="700" text-anchor="start">Network Stack</text><text x="486" y="516" font-size="18" font-weight="400" text-anchor="start">發送 HTTP Request</text><path d="M450 592v22m-6-6 6 6 6-6" fill="none" stroke="#657079" stroke-width="2"/><rect x="28" y="644" width="844" height="116" rx="12" fill="#f2f4f5" stroke="#d8dce0"/><text x="46" y="676" font-size="20" font-weight="700" text-anchor="start">Destination Server</text><text x="46" y="716" font-size="18" font-weight="400" text-anchor="start">接收 Request，驗證身分及是否允許操作</text><text x="28" y="808" font-size="17" font-weight="400" text-anchor="start">兩個網頁是平行的執行環境，不能任意互讀資料；Cookie Store 與 Network Stack 同</text><text x="28" y="840" font-size="17" font-weight="400" text-anchor="start">屬瀏覽器管理，並非每個分頁各有獨立網路。箭頭表示請求經瀏覽器仲裁後送往目的地，不代表</text><text x="28" y="872" font-size="17" font-weight="400" text-anchor="start">所有瀏覽器的程序切分。</text></g></svg>
