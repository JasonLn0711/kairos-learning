<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 324" role="img" aria-labelledby="title desc" lang="zh"><title id="title">CSRF 圖 4｜誘發請求與 Cookie 的真正目的地</title><desc id="desc">Session Cookie若被允許附帶，是直接送到銀行，不是送給惡意網站。箭頭表示發起、附帶與處理的責任接續，不是Cookie先經過惡意Server。</desc><rect width="900" height="324" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">CSRF 圖 4｜誘發請求與 Cookie 的真正目的地</text><text x="156" y="120" font-size="20" font-weight="700" text-anchor="middle">惡意網頁</text><text x="156" y="158" font-size="18" font-weight="400" text-anchor="middle">指定銀行 URL 與參數</text><path d="M286 132h25m-6-6 6 6-6 6" fill="none" stroke="#657079" stroke-width="2"/><text x="450" y="120" font-size="20" font-weight="700" text-anchor="middle">瀏覽器</text><text x="450" y="158" font-size="18" font-weight="400" text-anchor="middle">決定 Cookie 是否附帶</text><path d="M580 132h25m-6-6 6 6-6 6" fill="none" stroke="#657079" stroke-width="2"/><text x="744" y="120" font-size="20" font-weight="700" text-anchor="middle">銀行 Server</text><text x="744" y="158" font-size="18" font-weight="400" text-anchor="middle">驗證並處理 Request</text><text x="28" y="236" font-size="17" font-weight="400" text-anchor="start">Session Cookie若被允許附帶，是直接送到銀行，不是送給惡意網站。箭頭表示發起、附帶</text><text x="28" y="268" font-size="17" font-weight="400" text-anchor="start">與處理的責任接續，不是Cookie先經過惡意Server。</text></g></svg>
