<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1152" role="img" aria-labelledby="title desc" lang="en"><title id="title">Incident Commander and six parallel collaborating teams</title><desc id="desc">This is an example organization for a major incident. The commander coordinates six teams within predefined authority; the teams are not six sequential handoffs. The organization’s established response plan determines actual authority and roles.</desc><rect width="900" height="1152" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M436.0 234V278.0H222.0V322m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M436.0 234V278.0H650.0V322m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M844.0 161.0H875V528H222.0V556m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M844.0 161.0H875V528H650.0V556m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M844.0 161.0H875V762H222.0V790m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M844.0 161.0H875V762H650.0V790m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">Incident Commander and six parallel collaborating teams</text><rect x="28.0" y="88" width="816.0" height="146" rx="12" fill="#e9f2fa" stroke="#b8d5c5"/><text x="436.0" y="120" font-size="20" font-weight="700" text-anchor="middle">Incident Commander</text><text x="436.0" y="158" font-size="18" font-weight="400" text-anchor="middle">Incident objectives, decisions, escalation, coordination and</text><text x="436.0" y="190" font-size="18" font-weight="400" text-anchor="middle">communication</text><rect x="28.0" y="322" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="354" font-size="20" font-weight="700" text-anchor="middle">Security / SOC</text><text x="222.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Investigate attacks and</text><text x="222.0" y="424" font-size="18" font-weight="400" text-anchor="middle">preserve evidence</text><rect x="456.0" y="322" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="354" font-size="20" font-weight="700" text-anchor="middle">IT / Cloud</text><text x="650.0" y="392" font-size="18" font-weight="400" text-anchor="middle">Containment, remediation and</text><text x="650.0" y="424" font-size="18" font-weight="400" text-anchor="middle">infrastructure recovery</text><rect x="28.0" y="556" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="588" font-size="20" font-weight="700" text-anchor="middle">OT / Operations</text><text x="222.0" y="626" font-size="18" font-weight="400" text-anchor="middle">Equipment safety and process</text><text x="222.0" y="658" font-size="18" font-weight="400" text-anchor="middle">continuity</text><rect x="456.0" y="556" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="588" font-size="20" font-weight="700" text-anchor="middle">Legal / Compliance</text><text x="650.0" y="626" font-size="18" font-weight="400" text-anchor="middle">Compliance, notification and</text><text x="650.0" y="658" font-size="18" font-weight="400" text-anchor="middle">evidence requirements</text><rect x="28.0" y="790" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="822" font-size="20" font-weight="700" text-anchor="middle">Business Continuity</text><text x="222.0" y="860" font-size="18" font-weight="400" text-anchor="middle">Alternative processes and</text><text x="222.0" y="892" font-size="18" font-weight="400" text-anchor="middle">business continuity</text><rect x="456.0" y="790" width="388.0" height="146" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="822" font-size="20" font-weight="700" text-anchor="middle">Communications</text><text x="650.0" y="860" font-size="18" font-weight="400" text-anchor="middle">Internal and external</text><text x="650.0" y="892" font-size="18" font-weight="400" text-anchor="middle">messaging and stakeholders</text><text x="28" y="1006" font-size="17" font-weight="400" text-anchor="start">This is an example organization for a major incident. The commander</text><text x="28" y="1038" font-size="17" font-weight="400" text-anchor="start">coordinates six teams within predefined authority; the teams are not</text><text x="28" y="1070" font-size="17" font-weight="400" text-anchor="start">six sequential handoffs. The organization’s established response plan</text><text x="28" y="1102" font-size="17" font-weight="400" text-anchor="start">determines actual authority and roles.</text></g></svg>
