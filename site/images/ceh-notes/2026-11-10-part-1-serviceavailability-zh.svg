<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" role="img" aria-labelledby="title desc" lang="zh"><title id="title">單點故障與多節點備援</title><desc id="desc">上組：使用者連到故障的單一伺服器。下組：另一個使用者經流量分配，分別連到平行的A、B伺服器；A不轉送到B。分配器、資料層及共同故障仍須另行設計。</desc><rect width="900" height="758" fill="#fbfcfd"/><g fill="#18252c" font-family="Arial, Noto Sans CJK TC, sans-serif"><path d="M416.0 145.0H456.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M416.0 347.0H456.0m-7-5 7 5-7 5" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 404V448.0H222.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><path d="M650.0 404V448.0H650.0V492m-6-7 6 7 6-7" fill="none" stroke="#77867f" stroke-width="2"/><text x="28" y="40" font-size="22" font-weight="700" text-anchor="start">單點故障與多節點備援</text><rect x="28.0" y="88" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="120" font-size="20" font-weight="700" text-anchor="middle">使用者｜單一節點情境</text><text x="222.0" y="158" font-size="18" font-weight="400" text-anchor="middle">需要服務</text><rect x="456.0" y="88" width="388.0" height="114" rx="12" fill="#fbeeee" stroke="#b8d5c5"/><text x="650.0" y="120" font-size="20" font-weight="700" text-anchor="middle">單一伺服器故障</text><text x="650.0" y="158" font-size="18" font-weight="400" text-anchor="middle">單點故障可能造成中斷</text><rect x="28.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="322" font-size="20" font-weight="700" text-anchor="middle">使用者｜備援情境</text><text x="222.0" y="360" font-size="18" font-weight="400" text-anchor="middle">需要服務</text><rect x="456.0" y="290" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="322" font-size="20" font-weight="700" text-anchor="middle">流量分配</text><text x="650.0" y="360" font-size="18" font-weight="400" text-anchor="middle">分流至A或B</text><rect x="28.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="222.0" y="524" font-size="20" font-weight="700" text-anchor="middle">伺服器 A</text><text x="222.0" y="562" font-size="18" font-weight="400" text-anchor="middle">可提供服務</text><rect x="456.0" y="492" width="388.0" height="114" rx="12" fill="#e6f5ec" stroke="#b8d5c5"/><text x="650.0" y="524" font-size="20" font-weight="700" text-anchor="middle">伺服器 B</text><text x="650.0" y="562" font-size="18" font-weight="400" text-anchor="middle">可提供服務</text><text x="28" y="676" font-size="17" font-weight="400" text-anchor="start">上組：使用者連到故障的單一伺服器。下組：另一個使用者經流量分配，分別連到平行的A、B伺</text><text x="28" y="708" font-size="17" font-weight="400" text-anchor="start">服器；A不轉送到B。分配器、資料層及共同故障仍須另行設計。</text></g></svg>
