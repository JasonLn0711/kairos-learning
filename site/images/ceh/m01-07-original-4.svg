<svg baseProfile="full" height="1050" version="1.1" viewBox="0 0 1600 1050" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>CEH M01-07｜CSF與法遵地圖</title><desc>繁體中文向量資訊圖表，適合初學者閱讀，非官方原圖。</desc><defs /><rect fill="#F6F8FC" height="1050" width="1600" x="0" y="0" /><circle cx="1500" cy="-105" fill="#EAF0FF" opacity="0.54" r="310" /><circle cx="-160" cy="1150" fill="#E2F3F0" opacity="0.44" r="310" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="80" y="67">CEH  /  MODULE 01  /  LESSON 07</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="49" font-weight="700" opacity="1" text-anchor="start" x="80" y="132">04  NIST CSF 2.0：把資安工作放進六個管理面向</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="82" y="185">六個功能同時存在，不是按順序跑完的六個關卡；「治理」橫跨所有工作。</text><rect fill="#EDF1F8" height="46" rx="23.0" ry="23.0" width="335" x="1192" y="52" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="1359.5" y="81.84">初學者圖解  ·  非官方原圖</text><rect fill="#B7C3D5" height="115" opacity="0.16" rx="23" ry="23" width="1440" x="80.5" y="226" /><rect fill="#E7EDF9" height="115" rx="23" ry="23" stroke="#D2DEF4" stroke-width="1.5" width="1440" x="78" y="220" /><rect fill="#4168D9" height="65" rx="14" ry="14" width="320" x="103" y="245" /><text fill="#FFFFFF" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="263.0" y="286.5">GOVERN  ·  治理</text><text fill="#233D70" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="31" font-weight="700" opacity="1" text-anchor="start" x="465" y="290">策略、責任、政策、風險容忍度與監督</text><rect fill="#B7C3D5" height="205" opacity="0.16" rx="20" ry="20" width="272" x="80.5" y="371" /><rect fill="#FFFFFF" height="205" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="272" x="78" y="365" /><rect fill="#EAF0FF" height="58" rx="11" ry="11" width="246" x="91" y="378" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="106" y="405">IDENTIFY</text><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="107" y="429">識別</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="100" y="483">知道有哪些資產</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="100" y="522">辨認可能風險</text><rect fill="#B7C3D5" height="205" opacity="0.16" rx="20" ry="20" width="272" x="372.5" y="371" /><rect fill="#FFFFFF" height="205" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="272" x="370" y="365" /><rect fill="#E5F6F2" height="58" rx="11" ry="11" width="246" x="383" y="378" /><text fill="#087E80" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="398" y="405">PROTECT</text><text fill="#087E80" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="399" y="429">保護</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="392" y="483">控制存取與權限</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="392" y="522">降低事件發生機會</text><rect fill="#B7C3D5" height="205" opacity="0.16" rx="20" ry="20" width="272" x="664.5" y="371" /><rect fill="#FFFFFF" height="205" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="272" x="662" y="365" /><rect fill="#F1EDFF" height="58" rx="11" ry="11" width="246" x="675" y="378" /><text fill="#7655C9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="690" y="405">DETECT</text><text fill="#7655C9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="691" y="429">偵測</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="684" y="483">觀察可能異常</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="684" y="522">產生可查證的訊號</text><rect fill="#B7C3D5" height="205" opacity="0.16" rx="20" ry="20" width="272" x="956.5" y="371" /><rect fill="#FFFFFF" height="205" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="272" x="954" y="365" /><rect fill="#FFF1E9" height="58" rx="11" ry="11" width="246" x="967" y="378" /><text fill="#D86D3E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="982" y="405">RESPOND</text><text fill="#D86D3E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="983" y="429">回應</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="976" y="483">判定與協調處置</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="976" y="522">限制已知損害</text><rect fill="#B7C3D5" height="205" opacity="0.16" rx="20" ry="20" width="272" x="1248.5" y="371" /><rect fill="#FFFFFF" height="205" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="272" x="1246" y="365" /><rect fill="#E4F5EB" height="58" rx="11" ry="11" width="246" x="1259" y="378" /><text fill="#23835F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="1274" y="405">RECOVER</text><text fill="#23835F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="1275" y="429">復原</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="1268" y="483">恢復重要服務</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="1268" y="522">確認可靠且可用</text><rect fill="#EAF0FF" height="42" rx="12" ry="12" width="866" x="91" y="588" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="middle" x="524.0" y="615.48">Govern / Identify / Protect / Detect：平時持續進行</text><rect fill="#FFF1E9" height="42" rx="12" ry="12" width="538" x="975" y="588" /><text fill="#D86D3E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="middle" x="1244.0" y="615.48">Respond / Recover：事件時啟用，平時須準備</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="29" font-weight="700" opacity="1" text-anchor="start" x="81" y="697">另一個經常考的問題：看到規範名稱，先判斷「它屬於哪一種要求」</text><rect fill="#B7C3D5" height="212" opacity="0.16" rx="19" ry="19" width="344" x="80.5" y="732" /><rect fill="#FFFFFF" height="212" rx="19" ry="19" stroke="#DFE6F0" stroke-width="1.5" width="344" x="78" y="726" /><rect fill="#EAF0FF" height="48" rx="11" ry="11" width="312" x="94" y="740" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="middle" x="250.0" y="771.92">法律／法規</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="94" y="829">依法定適用條件履行義務</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="94" y="869">臺灣：個人資料保護法</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="94" y="903">資通安全管理法（特定對象）</text><rect fill="#B7C3D5" height="212" opacity="0.16" rx="19" ry="19" width="344" x="448.5" y="732" /><rect fill="#FFFFFF" height="212" rx="19" ry="19" stroke="#DFE6F0" stroke-width="1.5" width="344" x="446" y="726" /><rect fill="#F1EDFF" height="48" rx="11" ry="11" width="312" x="462" y="740" /><text fill="#7655C9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="middle" x="618.0" y="771.92">標準／產業要求</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="462" y="829">定義可驗證的管理或技術要求</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="462" y="869">ISO/IEC 27001（ISMS）</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="462" y="903">PCI DSS（支付卡資料）</text><rect fill="#B7C3D5" height="212" opacity="0.16" rx="19" ry="19" width="344" x="816.5" y="732" /><rect fill="#FFFFFF" height="212" rx="19" ry="19" stroke="#DFE6F0" stroke-width="1.5" width="344" x="814" y="726" /><rect fill="#E5F6F2" height="48" rx="11" ry="11" width="312" x="830" y="740" /><text fill="#087E80" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="middle" x="986.0" y="771.92">框架 Framework</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="830" y="829">協助盤點能力、目標與缺口</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="830" y="869">NIST CSF 2.0</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="830" y="903">Govern 等六個功能</text><rect fill="#B7C3D5" height="212" opacity="0.16" rx="19" ry="19" width="344" x="1184.5" y="732" /><rect fill="#FFFFFF" height="212" rx="19" ry="19" stroke="#DFE6F0" stroke-width="1.5" width="344" x="1182" y="726" /><rect fill="#FFF1E9" height="48" rx="11" ry="11" width="312" x="119