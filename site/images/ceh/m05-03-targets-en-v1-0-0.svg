<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 803.7" role="img" aria-labelledby="m0503-targets-en-title m0503-targets-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-targets-en-title">Figure 2 | Multiple assessment layers of one system</title><desc id="m0503-targets-en-desc">The top is the network observation perspective; the four categories below complement it. Lines mean association within one system, not traffic or assessment order.</desc><defs><marker id="m0503-targets-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 2 | Multiple assessment layers of one system</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The top is the network observation perspective; the four categories below</text><text x="28" y="140.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">complement it. Lines mean association within one system, not traffic or</text><text x="28" y="172.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">assessment order.</text><rect x="40.0" y="234" width="920.0" height="153" rx="16" fill="#dbeafe" stroke="#47748e" stroke-width="2" /><text x="60.0" y="268.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Users and network</text><text x="60.0" y="305.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Network assessment: examine network entry points and reachable</text><text x="60.0" y="337.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">services.</text><path d="M500 387V401M270 415V401H730V415" fill="none" stroke="#47748e" stroke-width="3" /><rect x="40.0" y="415" width="448.0" height="185" rx="16" fill="#e9d5ff" stroke="#47748e" stroke-width="2" /><text x="60.0" y="449.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Website / API</text><text x="60.0" y="486.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Application: examine login,</text><text x="60.0" y="518.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">authentication, authorization</text><text x="60.0" y="550.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">and program logic.</text><rect x="512.0" y="415" width="448.0" height="185" rx="16" fill="#d1fae5" stroke="#47748e" stroke-width="2" /><text x="532.0" y="449.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Server</text><text x="532.0" y="486.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Host-based: examine the</text><text x="532.0" y="518.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">operating system, updates,</text><text x="532.0" y="550.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">permissions and configuration.</text><path d="M270 600V628" stroke="#47748e" stroke-width="3" /><path d="M730 600V628" stroke="#47748e" stroke-width="3" /><rect x="40.0" y="628" width="448.0" height="217" rx="16" fill="#fef3c7" stroke="#47748e" stroke-width="2" /><text x="60.0" y="662.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Database</text><text x="60.0" y="699.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Database: examine accounts,</text><text x="60.0" y="731.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">data-access permissions and</text><text x="60.0" y="763.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">security configuration.</text><rect x="512.0" y="628" width="448.0" height="217" rx="16" fill="#ffe4e6" stroke="#47748e" stroke-width="2" /><text x="532.0" y="662.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Cloud / Wi-Fi</text><text x="532.0" y="699.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Cloud / Wireless: examine</text><text x="532.0" y="731.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">cloud-resource permissions,</text><text x="532.0" y="763.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Wi-Fi protection and network</text><text x="532.0" y="795.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">isolation.</text></g></svg>
