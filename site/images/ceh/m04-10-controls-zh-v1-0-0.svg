<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 881.64" role="img" aria-labelledby="m0409-controls-zh-title m0409-controls-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-controls-zh-title">圖 2｜一個使用者想讀取伺服器資料</title><desc id="m0409-controls-zh-desc">箭頭表示依序檢查四個問題。這是理解用的示意圖；實際協定不一定依這四步執行，傳輸保護也可能在登入前建立。</desc><defs><marker id="m0409-controls-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 2｜一個使用者想讀取伺服器資料</text><rect x="40" y="101.6" width="920" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">第一關：網路可達性</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">防火牆讓不讓你連到這個服務？</text><text x="56" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">像大樓外面的圍牆和入口。</text><path d="M500 253.60000000000002V283.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-controls-zh-arrow)" /><rect x="40" y="299.6" width="920" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="331.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">第二關：身分驗證 Authentication</text><text x="56" y="367.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">系統能不能確認你是誰？</text><text x="56" y="399.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">像櫃檯核對員工證件。</text><path d="M500 451.6V481.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-controls-zh-arrow)" /><rect x="40" y="497.6" width="920" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="529.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">第三關：存取授權 Authorization</text><text x="56" y="565.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">就算你是員工，你能看哪些文件、做哪些操作？</text><text x="56" y="597.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">像確認你有沒有財務室的鑰匙。</text><path d="M500 649.6V679.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-controls-zh-arrow)" /><rect x="40" y="695.6" width="920" height="140" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="727.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">第四項：傳輸保護 Encryption / Integrity</text><text x="56" y="763.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">資料在傳送途中有沒有被偷看或竄改？</text><text x="56" y="795.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">像用上鎖、防拆封的公事包運送文件。</text><text x="28" y="895.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">箭頭表示依序檢查四個問題。這是理解用的示意圖；實際協定不一定依這四步執行，傳輸保護也可能在登入</text><text x="28" y="927.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">前建立。</text></g></svg>
