<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 637.8" role="img" aria-labelledby="dns-security-en-title dns-security-en-desc" preserveAspectRatio="xMidYMid meet"><title id="dns-security-en-title">Three DNS mechanisms: efficiency, data authentication and transport privacy</title><desc id="dns-security-en-desc">The three cards are parallel comparisons. Arrows below show a simplified lookup path. DoH/DoT protect a particular link; DNSSEC validates signatures and a trust chain, rather than encrypting the entire resolution path.</desc><defs><marker id="dns-security-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b7a" /></marker></defs><rect width="1500" height="1063" fill="#f5f8fc" /><g transform="scale(0.6)"><text x="32" y="45" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#183b59">Three DNS mechanisms: efficiency, data authentication and transport privacy</text>
<text x="32" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The three cards are parallel comparisons. Arrows below show a simplified lookup path. DoH/DoT protect a</text>
<text x="32" y="109" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">particular link; DNSSEC validates signatures and a trust chain, rather than encrypting the entire resolution</text>
<text x="32" y="138" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">path.</text>
<rect x="20" y="160" width="1460" height="250" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="194" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Which problem does each address?</text>
<rect x="52.0" y="218" width="448.0" height="174" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Cache</text>
<text x="68.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Speeds repeated queries without</text>
<text x="68.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">always contacting authoritative</text>
<text x="68.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">DNS. Does not prove a particular</text>
<text x="68.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">user visited a website.</text>
<rect x="526.0" y="218" width="448.0" height="174" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="542.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">DNSSEC</text>
<text x="542.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Authenticates signed DNS data and</text>
<text x="542.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">its integrity. Does not guarantee</text>
<text x="542.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">query confidentiality or website</text>
<text x="542.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">health.</text>
<rect x="1000.0" y="218" width="448.0" height="174" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="1016.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Encrypted DNS: DoH / DoT</text>
<text x="1016.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Protects a particular</text>
<text x="1016.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">client-to-resolver transport link.</text>
<text x="1016.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">The resolver still learns and</text>
<text x="1016.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">processes the query.</text>
<rect x="20" y="434" width="1460" height="192" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="468" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Follow the path to locate the protection</text>
<rect x="52.0" y="492" width="448.0" height="116" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="520" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Your computer | Stub Resolver</text>
<text x="68.0" y="559" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Sends a DNS query</text>
<path d="M503.0 550.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-security-en-arrow)" />
<rect x="526.0" y="492" width="448.0" height="116" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="542.0" y="520" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Recursive Resolver</text>
<text x="542.0" y="559" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">May validate DNSSEC or use cached</text>
<text x="542.0" y="588" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">data</text>
<path d="M977.0 550.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-security-en-arrow)" />
<rect x="1000.0" y="492" width="448.0" height="116" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="1016.0" y="520" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Authoritative DNS data</text>
<text x="1016.0" y="559" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Supplies records according to zone</text>
<text x="1016.0" y="588" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">configuration</text>
<rect x="20" y="650" width="1460" height="192" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="684" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Two protection boundaries</text>
<rect x="52.0" y="708" width="685.0" height="116" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="736" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Client ↔ resolver: DoH / DoT</text>
<text x="68.0" y="775" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Encrypts this transport link; later links need not use</text>
<text x="68.0" y="804" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">the same encryption.</text>
<rect x="763.0" y="708" width="685.0" height="116" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="779.0" y="736" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">DNSSEC: signatures and trust chain</text>
<text x="779.0" y="775" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Validates signed DNS data, not website functions.</text>
<rect x="20" y="866" width="1460" height="163" rx="20" fill="#183b59" stroke="#8098ae" />
<text x="42" y="900" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#ffffff">AXFR authorization and integrity</text>
<rect x="52.0" y="924" width="1396.0" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="952" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Zone transfer</text>
<text x="68.0" y="991" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Access control and TSIG protect authorization / integrity. TSIG does not encrypt zone contents.</text></g></svg>
