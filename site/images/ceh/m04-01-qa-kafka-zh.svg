<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" aria-labelledby="title desc"><title id="title">Kafka：事件資料流</title><desc id="desc">事件可以保留並由不同系統讀取 Consumer 主動讀取；B、C 使用不同 consumer group。Kafka 可由多台 Broker 組成。</desc><rect x="1" y="1" width="678" height="518" rx="18" fill="#f7f5ef" stroke="#c8cec7"/><g font-family="sans-serif" fill="#303632"><text x="340" y="35" text-anchor="middle" font-size="23">Kafka：事件資料流</text><rect x="215" y="60" width="250" height="70" rx="12" fill="#e9f1f5" stroke="#829eae"/><text x="340" y="89" text-anchor="middle" font-size="22">系統 A</text><text x="340" y="115" text-anchor="middle" font-size="18">Producer</text><text x="340" y="160" text-anchor="middle" font-size="18">↓ 發布事件</text><rect x="215" y="180" width="250" height="70" rx="12" fill="#e9f1f5" stroke="#829eae"/><text x="340" y="209" text-anchor="middle" font-size="22">Kafka</text><text x="340" y="235" text-anchor="middle" font-size="18">Topic: orders</text><rect x="40" y="340" width="250" height="70" rx="12" fill="#e9f1f5" stroke="#829eae"/><text x="165" y="369" text-anchor="middle" font-size="22">系統 B</text><text x="165" y="395" text-anchor="middle" font-size="18">Consumer · 出貨</text><rect x="390" y="340" width="250" height="70" rx="12" fill="#e9f1f5" stroke="#829eae"/><text x="515" y="369" text-anchor="middle" font-size="22">系統 C</text><text x="515" y="395" text-anchor="middle" font-size="18">Consumer · 分析</text><path d="M340 250V275H165V330M340 275H515V330M158 321L165 330L172 321M508 321L515 330L522 321" fill="none" stroke="#60766b" stroke-width="3"/><text x="165" y="307" text-anchor="middle" font-size="18">事件資料</text><text x="515" y="307" text-anchor="middle" font-size="18">事件資料</text><text x="340" y="440" text-anchor="middle" font-size="17">事件可以保留並由不同系統讀取</text><text x="340" y="472" text-anchor="middle" font-size="16">Consumer 主動讀取；B、C 使用不同 consumer group。</text><text x="340" y="498" text-anchor="middle" font-size="16">Kafka 可由多台 Broker 組成。</text></g></svg>
