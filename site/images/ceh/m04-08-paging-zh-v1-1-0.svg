<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 587.52" role="img" aria-labelledby="m0408-paging-zh-title m0408-paging-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0408-paging-zh-title">圖 5｜分批取得結果並確認結束</title><desc id="m0408-paging-zh-desc">箭頭表示分頁續查，不代表提升權限或擴大範圍。每頁 100 筆只是示例；檢查結果代碼與最後的空 cookie，總數仍須依實際回傳計算。</desc><g transform="scale(0.85)"><rect width="1000" height="691.2" fill="#f7f9fb" /><g font-family="sans-serif" fill="#213547"><text x="28" y="38.0" font-size="26" font-weight="700">圖 5｜分批取得結果並確認結束</text><rect x="30" y="109.19999999999999" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="141.2" font-size="22" font-weight="700">第 1 頁</text><text x="46" y="184.6" font-size="20">取得 100 筆，保留伺服器續查 cookie。</text><path d="M500 227.2V253.2m-8 -8 8 8 8 -8" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="30" y="277.2" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="309.2" font-size="22" font-weight="700">第 2 頁</text><text x="46" y="352.59999999999997" font-size="20">帶回前頁 cookie，再取一批；示例為 100 筆。</text><path d="M500 395.2V421.2m-8 -8 8 8 8 -8" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="30" y="445.2" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="477.2" font-size="22" font-weight="700">後續頁面</text><text x="46" y="520.6" font-size="20">逐批核對狀態，直到最後收到空 cookie。</text><text x="28" y="593.2" font-size="20">箭頭表示分頁續查，不代表提升權限或擴大範圍。每頁 100 筆只是示例；檢查結果代碼與最後的空</text><text x="28" y="627.2" font-size="20">cookie，總數仍須依實際回傳計算。</text></g></g></svg>