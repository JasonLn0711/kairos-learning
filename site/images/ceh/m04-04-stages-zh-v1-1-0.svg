<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="smb-stages-zh-title smb-stages-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="smb-stages-zh-title">SMB 列舉｜連線成功，不等於取得檔案權限</title>
<desc id="smb-stages-zh-desc">把一次連線拆成五個關卡；每成功一個階段，只能確認該階段的結果；被拒絕時，先查發生在哪個階段。看見共用名稱 ≠ 能進入；讀到某個檔案 ≠ 有權修改或刪除。</desc>
<g transform="scale(0.5625)"><rect width="1600" height="1200" fill="#101b30" />
<text x="60" y="70.0" font-family="sans-serif" font-size="34" fill="#e8f0ff">SMB 列舉｜連線成功，不等於取得檔案權限</text>
<rect x="45" y="160" width="275" height="640" rx="18" fill="#1d304d" stroke="#527594" />
<text x="65" y="210.0" font-family="sans-serif" font-size="28" fill="#8cd6ff">01</text>
<text x="65" y="275.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Transport｜建立</text>
<text x="65" y="314.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">網路連線</text>
<text x="65" y="470.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ TCP 445 可達</text>
<text x="65" y="620.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× 不代表列出共用</text>
<path d="M325 430h20m-9-9 9 9-9 9" fill="none" stroke="#8cd6ff" stroke-width="3" />
<rect x="355" y="160" width="275" height="640" rx="18" fill="#1d304d" stroke="#527594" />
<text x="375" y="210.0" font-family="sans-serif" font-size="28" fill="#8cd6ff">02</text>
<text x="375" y="275.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Negotiate｜協商</text>
<text x="375" y="314.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">協定</text>
<text x="375" y="470.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ SMB 版本、能</text>
<text x="375" y="506.0" font-family="sans-serif" font-size="24" fill="#90e8cf">力</text>
<text x="375" y="620.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× 不代表身分通過</text>
<path d="M635 430h20m-9-9 9 9-9 9" fill="none" stroke="#8cd6ff" stroke-width="3" />
<rect x="665" y="160" width="275" height="640" rx="18" fill="#1d304d" stroke="#527594" />
<text x="685" y="210.0" font-family="sans-serif" font-size="28" fill="#8cd6ff">03</text>
<text x="685" y="275.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Session Setup｜</text>
<text x="685" y="314.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">建立身分工作階</text>
<text x="685" y="353.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">段</text>
<text x="685" y="470.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ 確認實際使用</text>
<text x="685" y="506.0" font-family="sans-serif" font-size="24" fill="#90e8cf">身分</text>
<text x="685" y="620.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× 不代表可進所有</text>
<text x="685" y="656.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">共用</text>
<path d="M945 430h20m-9-9 9 9-9 9" fill="none" stroke="#8cd6ff" stroke-width="3" />
<rect x="975" y="160" width="275" height="640" rx="18" fill="#1d304d" stroke="#527594" />
<text x="995" y="210.0" font-family="sans-serif" font-size="28" fill="#8cd6ff">04</text>
<text x="995" y="275.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Tree Connect｜</text>
<text x="995" y="314.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">連接指定共用</text>
<text x="995" y="470.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ 例如 Training</text>
<text x="995" y="506.0" font-family="sans-serif" font-size="24" fill="#90e8cf"> 可進入</text>
<text x="995" y="620.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× 不代表能讀所有</text>
<text x="995" y="656.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">檔案</text>
<path d="M1255 430h20m-9-9 9 9-9 9" fill="none" stroke="#8cd6ff" stroke-width="3" />
<rect x="1285" y="160" width="275" height="640" rx="18" fill="#1d304d" stroke="#527594" />
<text x="1305" y="210.0" font-family="sans-serif" font-size="28" fill="#8cd6ff">05</text>
<text x="1305" y="275.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">File Operation</text>
<text x="1305" y="314.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">｜操作檔案／目</text>
<text x="1305" y="353.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">錄</text>
<text x="1305" y="470.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ 列出、讀取、</text>
<text x="1305" y="506.0" font-family="sans-serif" font-size="24" fill="#90e8cf">寫入等</text>
<text x="1305" y="620.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× 各操作須分別驗</text>
<text x="1305" y="656.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">證</text>
<text x="60" y="985.0" font-family="sans-serif" font-size="24" fill="#c5d8ed">把一次連線拆成五個關卡；每成功一個階段，只能確認該階段的結果；被拒絕時，先查發生在哪個階段。看見共用名稱 </text>
<text x="60" y="1021.0" font-family="sans-serif" font-size="24" fill="#c5d8ed">≠ 能進入；讀到某個檔案 ≠ 有權修改或刪除。</text>
</g></svg>
