<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">SMB 列舉｜同一份紀錄，可以下哪些結論？</title>
<desc id="desc">合成情境：LAB / labreader；只根據真正觀察到的操作判斷。安全判讀：支援（Capability）≠ 要求（Policy）≠ 本次實際使用（Observed）。Signing 保護訊息完整性；Encryption 保護傳輸機密性，兩者都不會增加檔案權限。</desc>
<rect width="1600" height="1200" fill="#101b30"/>
<text x="60" y="70.0" font-family="sans-serif" font-size="34" fill="#e8f0ff">SMB 列舉｜同一份紀錄，可以下哪些結論？</text>
<text x="65" y="165.0" font-family="sans-serif" font-size="27" fill="#8cd6ff">觀察到的事情</text>
<text x="575" y="165.0" font-family="sans-serif" font-size="27" fill="#8cd6ff">能確定的事</text>
<text x="1085" y="165.0" font-family="sans-serif" font-size="27" fill="#8cd6ff">不能直接推論</text>
<rect x="45" y="200" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="65" y="240.0" font-family="sans-serif" font-size="24" fill="#e8f0ff">清單出現 Finance</text>
<rect x="555" y="200" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="575" y="240.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ 知道共用名稱</text>
<rect x="1065" y="200" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="1085" y="240.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× 不能推論能進入或讀取裡面檔案</text>
<rect x="45" y="345" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="65" y="385.0" font-family="sans-serif" font-size="24" fill="#e8f0ff">進入 Training 成功</text>
<rect x="555" y="345" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="575" y="385.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ 這次能連接該共用</text>
<rect x="1065" y="345" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="1085" y="385.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× 不能推論每一個檔案都可讀</text>
<rect x="45" y="490" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="65" y="530.0" font-family="sans-serif" font-size="24" fill="#e8f0ff">看見 draft.txt</text>
<rect x="555" y="490" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="575" y="530.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ 取得指定檔名資訊</text>
<rect x="1065" y="490" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="1085" y="530.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× 不能推論能讀取檔案內容</text>
<rect x="45" y="635" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="65" y="675.0" font-family="sans-serif" font-size="24" fill="#e8f0ff">讀取 readme.txt 成功</text>
<rect x="555" y="635" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="575" y="675.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ 指定檔案內容可讀</text>
<rect x="1065" y="635" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="1085" y="675.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× 不能推論能修改、刪除或上傳</text>
<rect x="45" y="780" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="65" y="820.0" font-family="sans-serif" font-size="24" fill="#e8f0ff">SMB 3.1.1 已協商</text>
<rect x="555" y="780" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="575" y="820.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ 這次使用該協定版本</text>
<rect x="1065" y="780" width="490" height="130" rx="12" fill="#1d304d"/>
<text x="1085" y="820.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× 不能推論 SMB 加密已啟用</text>
<text x="60" y="985.0" font-family="sans-serif" font-size="24" fill="#c5d8ed">合成情境：LAB / labreader；只根據真正觀察到的操作判斷。安全判讀：支援（Capability）≠ 要求（Policy）≠ 本</text>
<text x="60" y="1021.0" font-family="sans-serif" font-size="24" fill="#c5d8ed">次實際使用（Observed）。Signing 保護訊息完整性；Encryption 保護傳輸機密性，兩者都不會增加檔案權限。</text>
</svg>
