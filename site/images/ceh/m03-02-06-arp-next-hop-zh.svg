<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 600" role="img" aria-labelledby="m0302-f6-zh-title m0302-f6-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0302-f6-zh-title">圖 2｜ARP：找本地下一站的 MAC</title>
<desc id="m0302-f6-zh-desc">IPv4 描述目的地；乙太網路訊框的 MAC 描述這一段交給誰。</desc>
<g transform="scale(0.6)"><rect width="1420" height="1000" fill="#f2f6fc" />
<rect width="1420" height="10" fill="#2464d9" />
<defs><marker id="m0302-f6-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2464d9" /></marker></defs>
<text x="40" y="55" font-family="Noto Sans CJK TC,sans-serif" font-size="30" fill="#172b49">圖 2｜ARP：找本地下一站的 MAC</text>
<text x="40" y="95" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">IPv4 描述目的地；乙太網路訊框的 MAC 描述這一段交給誰。</text>
<rect x="40.0" y="170" width="658.0" height="670" rx="20" fill="#ffffff" stroke="#b7c9df" />
<text x="60.0" y="208" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">情境 A｜同一條本地鏈路</text>
<rect x="60.0" y="290" width="289.0" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="70.0" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">A：你的電腦</text>
<text x="70.0" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.10</text>
<rect x="389.0" y="290" width="289.0" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="399.0" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">B：另一台設備</text>
<text x="399.0" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.20</text>
<path d="M349.0 338H389.0" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f6-zh-arrow)" />
<text x="60.0" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">ARP Request</text>
<path d="M389.0 405H349.0" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f6-zh-arrow)" />
<text x="60.0" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">ARP Reply</text>
<text x="60.0" y="510" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">需要解析時，A 廣播詢問誰使用 192.168.1.20；圖中只畫出 B</text>
<text x="60.0" y="540" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">。</text>
<text x="60.0" y="585" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">B 回覆自己的 IPv4／MAC 對應。</text>
<text x="60.0" y="630" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">IP 最終目的地：192.168.1.20</text>
<text x="60.0" y="675" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">訊框目的 MAC：B 的 MAC</text>
<rect x="722.0" y="170" width="658.0" height="670" rx="20" fill="#ffffff" stroke="#b7c9df" />
<text x="742.0" y="208" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">情境 B｜目的地在遠端</text>
<rect x="742.0" y="290" width="179.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="752.0" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">A：你的電腦</text>
<text x="752.0" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.10</text>
<rect x="961.3333333333334" y="290" width="179.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="971.3333333333334" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">路由器／閘道</text>
<text x="971.3333333333334" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.1</text>
<rect x="1180.6666666666667" y="290" width="179.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="1190.6666666666667" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">遠端主機</text>
<text x="1190.6666666666667" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">203.0.113.20</text>
<path d="M921.3333333333334 338H961.3333333333334" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f6-zh-arrow)" />
<text x="742.0" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">本地交付</text>
<path d="M1140.6666666666667 338H1180.6666666666667" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f6-zh-arrow)" />
<text x="961.3333333333334" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">路由轉送</text>
<text x="742.0" y="510" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">路由選擇預設閘道時，A 以 ARP 查詢 192.168.1.1。</text>
<text x="742.0" y="555" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">此處箭頭表示資料交付，不是 ARP 跨路由器。</text>
<text x="742.0" y="600" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">IP 最終目的地：203.0.113.20</text>
<text x="742.0" y="645" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">第一段訊框目的 MAC：閘道的 MAC</text>
<text x="40" y="895" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">條件：一般 IPv4 乙太網路、A 為 /24，依路由表選下一站。VLAN、Proxy ARP 等配置須另行判斷。</text>
</g></svg>