<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 600" role="img" aria-labelledby="m0302-f5-en-title m0302-f5-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0302-f5-en-title">Figure 1 | ICMP: three outcomes, three kinds of evidence</title>
<desc id="m0302-f5-en-desc">Record an echo, an error, and no expected reply separately. A dashed arrow means a probe was sent, with delivery and response unconfirmed.</desc>
<g transform="scale(0.6)"><rect width="1420" height="1000" fill="#f2f6fc" />
<rect width="1420" height="10" fill="#2464d9" />
<defs><marker id="m0302-f5-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2464d9" /></marker></defs>
<text x="40" y="55" font-family="Noto Sans CJK TC,sans-serif" font-size="30" fill="#172b49">Figure 1 | ICMP: three outcomes, three kinds of evidence</text>
<text x="40" y="95" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Record an echo, an error, and no expected reply separately. A dashed arrow means a probe was sent, with delivery and</text>
<text x="40" y="125" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">response unconfirmed.</text>
<rect x="40.0" y="170" width="430.6666666666667" height="670" rx="20" fill="#ffffff" stroke="#b7c9df" />
<text x="60.0" y="208" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">01 | Echo Reply received</text>
<rect x="60.0" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="70.0" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Probe source</text>
<text x="70.0" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.10</text>
<rect x="275.33333333333337" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="285.33333333333337" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Target</text>
<text x="285.33333333333337" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.20</text>
<path d="M235.33333333333334 338H275.33333333333337" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f5-en-arrow)" />
<text x="60.0" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">Echo Request</text>
<path d="M275.33333333333337 405H235.33333333333334" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f5-en-arrow)" />
<text x="60.0" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">Echo Reply</text>
<text x="60.0" y="510" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">Supported: Echo round-trip</text>
<text x="60.0" y="540" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">reachability at that time</text>
<text x="60.0" y="585" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">RTT describes this round-trip</text>
<text x="60.0" y="615" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">delay.</text>
<text x="60.0" y="660" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Check website, login, and</text>
<text x="60.0" y="690" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">application functionality</text>
<text x="60.0" y="720" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">separately.</text>
<rect x="494.6666666666667" y="170" width="430.6666666666667" height="670" rx="20" fill="#ffffff" stroke="#b7c9df" />
<text x="514.6666666666667" y="208" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">02 | ICMP error received</text>
<rect x="514.6666666666667" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="524.6666666666667" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Probe source</text>
<text x="524.6666666666667" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.10</text>
<rect x="730.0000000000001" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="740.0000000000001" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Error reporter</text>
<text x="740.0000000000001" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">e.g. a router</text>
<path d="M690.0000000000001 338H730.0000000000001" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f5-en-arrow)" />
<text x="514.6666666666667" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">Probe</text>
<path d="M730.0000000000001 405H690.0000000000001" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f5-en-arrow)" />
<text x="514.6666666666667" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">ICMP error</text>
<text x="514.6666666666667" y="510" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">Supported: a device reported a</text>
<text x="514.6666666666667" y="540" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">delivery problem</text>
<text x="514.6666666666667" y="585" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">For example, Destination</text>
<text x="514.6666666666667" y="615" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Unreachable or Time Exceeded.</text>
<text x="514.6666666666667" y="660" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Record Type, Code, and source; the</text>
<text x="514.6666666666667" y="690" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">reporter can also be the local</text>
<text x="514.6666666666667" y="720" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">stack or another device.</text>
<rect x="949.3333333333334" y="170" width="430.6666666666667" height="670" rx="20" fill="#ffffff" stroke="#b7c9df" />
<text x="969.3333333333334" y="208" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">03 | Timeout</text>
<rect x="969.3333333333334" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="979.3333333333334" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Probe source</text>
<text x="979.3333333333334" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.10</text>
<rect x="1184.6666666666667" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="1194.6666666666667" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Target</text>
<text x="1194.6666666666667" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">State unknown</text>
<path d="M1144.6666666666667 338H1184.6666666666667" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f5-en-arrow)" stroke-dasharray="7 5" />
<text x="969.3333333333334" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">Probe sent</text>
<text x="969.3333333333334" y="510" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">Supported: no expected reply</text>
<text x="969.3333333333334" y="540" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">within the wait</text>
<text x="969.3333333333334" y="585" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Loss, routing, policy, sleep, or</text>
<text x="969.3333333333334" y="615" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">other causes remain possible.</text>
<text x="969.3333333333334" y="660" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Power-off is not established.</text>
<text x="40" y="895" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Record source, target, time, count, waiting conditions, and responder.</text>
</g></svg>