<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 444.72" role="img" aria-labelledby="m0408-entry-zh-title m0408-entry-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0408-entry-zh-title">圖 7｜員工資料：小明</title><desc id="m0408-entry-zh-desc">簡化的通用 LDAP Entry（目錄項目）。不同目錄的帳號屬性可能不同，例如 AD 常使用 sAMAccountName；ou 欄位不取代 DN 的位置識別。</desc><g transform="scale(0.85)"><rect width="1000" height="523.2" fill="#f7f9fb" /><g font-family="sans-serif" fill="#213547"><text x="28" y="38.0" font-size="26" font-weight="700">圖 7｜員工資料：小明</text><text x="35" y="137.2" font-size="20">cn</text><text x="365" y="137.2" font-size="20">小明</text><path d="M30 171.2H970" fill="none" stroke="#8b969f" stroke-width="2" /><text x="35" y="211.2" font-size="20">uid</text><text x="365" y="211.2" font-size="20">ming</text><path d="M30 245.2H970" fill="none" stroke="#8b969f" stroke-width="2" /><text x="35" y="285.2" font-size="20">mail</text><text x="365" y="285.2" font-size="20">ming@example.test</text><path d="M30 319.2H970" fill="none" stroke="#8b969f" stroke-width="2" /><text x="35" y="359.2" font-size="20">ou</text><text x="365" y="359.2" font-size="20">Engineering</text><path d="M30 393.2H970" fill="none" stroke="#8b969f" stroke-width="2" /><text x="28" y="425.2" font-size="20">簡化的通用 LDAP Entry（目錄項目）。不同目錄的帳號屬性可能不同，例如 AD 常使用</text><text x="28" y="459.2" font-size="20">sAMAccountName；ou 欄位不取代 DN 的位置識別。</text></g></g></svg>