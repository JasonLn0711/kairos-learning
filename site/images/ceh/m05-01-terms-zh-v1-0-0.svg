<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 861.3000000000001" role="img" aria-labelledby="m0501-terms-zh-title m0501-terms-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0501-terms-zh-title">圖 1｜資產、弱點、威脅、利用、攻擊與風險</title><desc id="m0501-terms-zh-desc">資產可能存在弱點；威脅與利用方法是不同概念。攻擊是否發生須另有證據；風險綜合發生可能性與損失，不是必然發生的最後一步。</desc><defs><marker id="m0501-terms-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 1｜資產、弱點、威脅、利用、攻擊與風險</text><rect x="40.0" y="108" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="142.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Asset｜資產</text><text x="60.0" y="179.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">會員資料、訂單、系統服務</text><rect x="40.0" y="257" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="291.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Vulnerability｜弱點</text><text x="60.0" y="328.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">會員 A 可能讀到會員 B 的訂單</text><rect x="40.0" y="406" width="448.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="440.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Threat｜威脅</text><text x="60.0" y="477.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">有人想竊取不屬於自己的資料</text><rect x="512.0" y="406" width="448.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="532.0" y="440.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Exploit｜利用方法</text><text x="532.0" y="477.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">透過某種請求方式觸發權限缺陷</text><rect x="40.0" y="555" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="589.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Attack｜攻擊</text><text x="60.0" y="626.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">實際嘗試利用漏洞存取訂單</text><rect x="40.0" y="704" width="920.0" height="121" rx="16" fill="#fcf2ef" stroke="#47748e" stroke-width="2" /><text x="60.0" y="738.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Risk｜風險</text><text x="60.0" y="775.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">評估這種事件發生的可能性及造成的損失</text><text x="28" y="865.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">資產可能存在弱點；威脅與利用方法是不同概念。攻擊是否發生須另有證據；風險綜合發生可能性與損失，</text><text x="28" y="897.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">不是必然發生的最後一步。</text></g></svg>
