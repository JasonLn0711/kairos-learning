<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614.34" role="img" aria-labelledby="m0504-evidence-zh-title m0504-evidence-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0504-evidence-zh-title">圖 5｜四種證據層次</title><desc id="m0504-evidence-zh-desc">教學層次不表示每項弱點都須利用測試，成功利用也不能證明過去遭入侵。</desc><g transform="scale(.9)" font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c">圖 5｜四種證據層次</text><text x="28" y="96.19999999999999" font-size="20" fill="#18252c">教學層次不表示每項弱點都須利用測試，成功利用也不能證明過去遭入侵。</text><path d="M50.0 212.2v37.099999999999994" stroke="#cbd5e1" stroke-width="3" /><text x="46.0" y="180.2" font-size="23" fill="#18252c">1  發現疑似弱點（Potential Finding）</text><text x="68.0" y="219.29999999999998" font-size="20" fill="#18252c">掃描器比對到某個 CVE，表示值得調查，尚未確認適用條件。</text><path d="M50.0 345.29999999999995v37.099999999999994" stroke="#cbd5e1" stroke-width="3" /><text x="46.0" y="313.29999999999995" font-size="23" fill="#18252c">2  確認受到影響（Confirmed Vulnerability）</text><text x="68.0" y="352.4" font-size="20" fill="#18252c">有足夠證據確認產品、版本、設定與修補狀態符合漏洞成立條件。</text><path d="M50.0 478.4v37.099999999999994" stroke="#cbd5e1" stroke-width="3" /><text x="46.0" y="446.4" font-size="23" fill="#18252c">3  驗證實際可利用性（Validated Exploitability）</text><text x="68.0" y="485.5" font-size="20" fill="#18252c">在授權範圍內，以受控測試證明漏洞確實可以產生特定安全影響。</text><path d="M50.0 611.5v37.099999999999994" stroke="#cbd5e1" stroke-width="3" /><text x="46.0" y="579.5" font-size="23" fill="#18252c">4  發現實際入侵（Evidence of Compromise）</text><text x="68.0" y="618.6" font-size="20" fill="#18252c">透過日誌、鑑識等證據，確認曾發生未經授權的利用或入侵活動。</text></g></svg>
