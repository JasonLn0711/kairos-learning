<svg xmlns="http://www.w3.org/2000/svg" width="800" height="830" viewBox="0 0 800 830" role="img" aria-labelledby="m0903-f5-zh-title m0903-f5-zh-desc">
<title id="m0903-f5-zh-title">查證要離開可疑來源的控制圈</title><desc id="m0903-f5-zh-desc">同一個起點，兩種查證路線；可信來源必須自行取得。</desc>
<defs>
<marker id="m0903-f5-zh-flow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#1d4ed8"/></marker>
<marker id="m0903-f5-zh-attempt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#92400e"/></marker>
<marker id="m0903-f5-zh-process" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker>
</defs>
<rect width="800" height="830" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="28" y="30" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · 圖 5</text>
<text x="28" y="70" font-size="28" font-weight="700" fill="#172b3a" text-anchor="start">查證要離開可疑來源的控制圈</text>
<text x="28" y="111" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">同一個起點，兩種查證路線；可信來源必須自行取得。</text>
<rect x="285" y="140" width="230" height="85" rx="12" fill="#fffbeb" stroke="#64748b" stroke-width="1.5"/>
<text x="400.0" y="175.5" font-size="22" font-weight="700" fill="#92400e" text-anchor="middle">可疑簡訊 SMS</text>
<text x="400.0" y="206.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">尚未驗證來源</text>
<rect x="24" y="285" width="350" height="380" rx="16" fill="#fffbeb" stroke="#92400e" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="38" y="313" font-size="17" font-weight="700" fill="#92400e" text-anchor="start">A｜同一來源的控制圈</text>
<rect x="426" y="420" width="350" height="245" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="440" y="448" font-size="17" font-weight="700" fill="#0f766e" text-anchor="start">B｜既有可信來源</text>
<path d="M 350 225 L 350 250 L 250 250 L 250 342" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f5-zh-process)"/>
<path d="M 450 225 L 600 225 L 600 275" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f5-zh-process)"/>
<rect x="93" y="350" width="210" height="96" rx="12" fill="#fffbeb" stroke="#64748b" stroke-width="1.5"/>
<text x="198.0" y="390.0" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">對方給的聯絡方式</text>
<text x="198.0" y="421.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">連結／回撥號碼</text>
<rect x="93" y="527" width="210" height="96" rx="12" fill="#fffbeb" stroke="#64748b" stroke-width="1.5"/>
<text x="198.0" y="567.0" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">對方說「確認了」</text>
<text x="198.0" y="598.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">仍沒有獨立證明</text>
<path d="M 198 446 L 198 517" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f5-zh-process)"/>
<path d="M 303 575 L 342 575 L 342 398 L 312 398" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f5-zh-process)"/>
<rect x="510" y="285" width="180" height="85" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="319.5" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">掛斷／停止</text>
<text x="600.0" y="350.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">不繼續照做</text>
<path d="M 593 382 L 607 396 M 607 382 L 593 396" stroke="#92400e" stroke-width="3" fill="none"/>
<path d="M 600 417 L 740 417 L 740 517 L 724 517" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f5-zh-process)"/>
<text x="600" y="410" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">另起查證</text>
<rect x="485" y="473" width="230" height="89" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="509.5" font-size="20" font-weight="700" fill="#0f766e" text-anchor="middle">自行開啟服務台</text>
<text x="600.0" y="540.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">既有 App／通訊錄</text>
<path d="M 600 562 L 600 585" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f5-zh-process)"/>
<rect x="485" y="593" width="230" height="60" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="600.0" y="629.0" font-size="18" font-weight="700" fill="#0f766e" text-anchor="middle">核對身分・要求・授權</text>
<line x1="28" y1="700" x2="772" y2="700" stroke="#64748b" stroke-width="1"/>
<text x="28" y="725" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">→ 使用者選擇的查證路線；回圈＝仍由同源佐證。</text>
<text x="28" y="752" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">× 停止舊互動；下方從自己取得的可信入口重新開始。</text>
</g></svg>
