<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc">
<title id="title">獨立查證，要換的是信任來源</title><desc id="desc">差別不在換了幾個 App 或問了幾次，而是是否離開可疑來源控制的聯絡方式。 路線 A｜仍在可疑來源的圈子: 可疑簡訊 → 簡訊提供的客服連結 → 對方提供的客服號碼 → 對方聲稱確認成功。這仍沒有獨立證明。 路線 B｜回到既有可信程序: 可疑簡訊 → 暫停、掛斷 → 自行開啟既有服務台 → 核對工單、身分與權限。只執行必要且已授權的操作。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker></defs>
<rect width="1000" height="830" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="42" y="37" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · 圖 5</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">獨立查證，要換的是信任來源</text>
<text x="42" y="135" font-size="18" font-weight="400" fill="#43576a" text-anchor="start">差別不在換了幾個 App 或問了幾次，而是是否離開可疑來源控制的聯絡方式。</text>
<text x="42" y="199" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="start">A｜仍在可疑來源的圈子</text>
<rect x="42" y="225" width="211" height="164" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="147.5" y="269" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle">可疑簡訊</text>
<text x="147.5" y="342" font-size="17" font-weight="400" fill="#172b3a" text-anchor="middle">攻擊者提供</text>
<path d="M 257 307 L 271 307" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="277" y="225" width="211" height="164" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="382.5" y="269" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle">客服連結</text>
<text x="382.5" y="342" font-size="17" font-weight="400" fill="#172b3a" text-anchor="middle">簡訊提供</text>
<path d="M 492 307 L 506 307" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="512" y="225" width="211" height="164" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="617.5" y="269" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle">客服號碼</text>
<text x="617.5" y="342" font-size="17" font-weight="400" fill="#172b3a" text-anchor="middle">對方提供</text>
<path d="M 727 307 L 741 307" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="747" y="225" width="211" height="164" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="852.5" y="269" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle">聲稱確認</text>
<text x="852.5" y="342" font-size="17" font-weight="400" fill="#172b3a" text-anchor="middle">仍無獨立證明</text>
<text x="42" y="474" font-size="23" font-weight="700" fill="#0f766e" text-anchor="start">B｜回到既有可信程序</text>
<rect x="42" y="500" width="211" height="164" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="147.5" y="544" font-size="21" font-weight="700" fill="#0f766e" text-anchor="middle">可疑簡訊</text>
<text x="147.5" y="617" font-size="17" font-weight="400" fill="#172b3a" text-anchor="middle">先不執行</text>
<path d="M 257 582 L 271 582" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="277" y="500" width="211" height="164" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="382.5" y="544" font-size="21" font-weight="700" fill="#0f766e" text-anchor="middle">暫停、掛斷</text>
<text x="382.5" y="617" font-size="17" font-weight="400" fill="#172b3a" text-anchor="middle">不照指示操作</text>
<path d="M 492 582 L 506 582" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="512" y="500" width="211" height="164" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="617.5" y="544" font-size="21" font-weight="700" fill="#0f766e" text-anchor="middle">既有服務台</text>
<text x="617.5" y="617" font-size="17" font-weight="400" fill="#172b3a" text-anchor="middle">自行開啟可信入口</text>
<path d="M 727 582 L 741 582" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="747" y="500" width="211" height="164" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="852.5" y="544" font-size="21" font-weight="700" fill="#0f766e" text-anchor="middle">核對工單</text>
<text x="852.5" y="617" font-size="17" font-weight="400" fill="#172b3a" text-anchor="middle">身分、要求、權限</text>
<text x="42" y="766" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">確認身分之後，仍須確認要求與操作授權。</text>
</g></svg>
