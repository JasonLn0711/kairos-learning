<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 937.5" role="img" aria-labelledby="ftpsmtp-protocols-zh-title ftpsmtp-protocols-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="ftpsmtp-protocols-zh-title">M04-03｜兩種列舉，先認清「服務在做什麼」</title><desc id="ftpsmtp-protocols-zh-desc">FTP 控制與資料連線有不同角色，兩條連線不是先後步驟；雙向箭頭表示命令／回覆或資料交換，不表示誰發起連線。SMTP 箭頭表示提交與伺服器間投遞。</desc><g transform="scale(0.75)"><rect width="1200" height="1250" fill="#f5f8fc" /><text x="45" y="55.0" font-family="Noto Sans CJK TC,sans-serif" font-size="30" fill="#173450">M04-03｜兩種列舉，先認清「服務在做什麼」</text><rect x="30" y="145" width="1140" height="430" rx="16" fill="#ffffff" stroke="#b7c9df" /><text x="55" y="187.0" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#173450">FTP</text><g id="ftpsmtp-protocols-zh-node-0"><rect x="65" y="280" width="230" height="170" rx="16" fill="#e7f0ff" stroke="#b7c9df" /><text x="81" y="315.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">用戶端</text><text x="81" y="361.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">FTP Client</text></g><g id="ftpsmtp-protocols-zh-node-1"><rect x="905" y="280" width="230" height="170" rx="16" fill="#e7f0ff" stroke="#b7c9df" /><text x="921" y="315.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">伺服器</text><text x="921" y="361.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">FTP Server</text></g><text x="340" y="235.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">控制連線（常用 TCP 21）</text><path d="M325 292H875m-12-8 12 8-12 8M337 284l-12 8 12 8" fill="none" stroke="#205e96" stroke-width="3" /><text x="340" y="325.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#173450">命令及回覆：用戶端 ↔ 伺服器</text><text x="340" y="375.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#11635d">資料連線（目錄清單／檔案內容）</text><path d="M325 432H875m-12-8 12 8-12 8M337 424l-12 8 12 8" fill="none" stroke="#205e96" stroke-width="3" /><text x="340" y="465.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#11635d">資料交換：用戶端 ↔ 伺服器</text><rect x="55" y="490" width="1090" height="80" rx="16" fill="#ecf8f5" stroke="#b7c9df" /><text x="75" y="525.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#11635d">FTP 操作界線：MLSD 看檔名 ≠ RETR 讀內容 ≠ STOR 寫檔案</text><rect x="30" y="600" width="1140" height="400" rx="16" fill="#ffffff" stroke="#b7c9df" /><text x="55" y="645.0" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#173450">SMTP</text><g id="ftpsmtp-protocols-zh-node-5"><rect x="60" y="700" width="240" height="170" rx="16" fill="#e7f0ff" stroke="#b7c9df" /><text x="76" y="735.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">寄件者</text><text x="76" y="781.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">郵件程式</text></g><g id="ftpsmtp-protocols-zh-node-6"><rect x="480" y="700" width="240" height="170" rx="16" fill="#e4f3f0" stroke="#b7c9df" /><text x="496" y="735.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">寄件伺服器</text><text x="496" y="781.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">Submission / MSA</text></g><g id="ftpsmtp-protocols-zh-node-7"><rect x="900" y="700" width="240" height="170" rx="16" fill="#e7f0ff" stroke="#b7c9df" /><text x="916" y="735.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">收件方伺服器</text><text x="916" y="781.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">Mail Transfer /</text><text x="916" y="812.5" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">MTA</text></g><text x="320" y="725.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#173450">TCP 587 /</text><text x="320" y="755.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#173450">465</text><path d="M320 775H460m-12-8 12 8-12 8" fill="none" stroke="#205e96" stroke-width="3" /><text x="320" y="815.0" font-family="Noto Sans CJK TC,sans-serif" font-size="17" fill="#173450">郵件提交</text><text x="740" y="725.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#173450">TCP 25</text><path d="M740 775H880m-12-8 12 8-12 8" fill="none" stroke="#205e96" stroke-width="3" /><text x="740" y="815.0" font-family="Noto Sans CJK TC,sans-serif" font-size="17" fill="#173450">伺服器間投遞</text><rect x="55" y="900" width="1090" height="70" rx="16" fill="#fff2e1" stroke="#b7c9df" /><text x="75" y="935.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#885217">SMTP 操作界線：宣告功能 ≠ 已登入；接受要求 ≠ 已送達</text><text x="45" y="1050.0" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#173450">FTP 控制與資料連線有不同角色，兩條連線不是先後步驟；雙向箭頭表示命令／回覆或資料交換</text><text x="45" y="1083.0" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#173450">，不表示誰發起連線。SMTP 箭頭表示提交與伺服器間投遞。</text></g></svg>
