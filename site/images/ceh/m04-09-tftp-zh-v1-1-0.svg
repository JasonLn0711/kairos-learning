<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 409.14000000000004" role="img" aria-labelledby="m0409-tftp-zh-title m0409-tftp-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-tftp-zh-title">TFTP：要求檔案、回應與存取限制</title><desc id="m0409-tftp-zh-desc">左右表示用戶端與伺服器；↔ 表示請求／資料及確認的往返，不保證任意檔案都可讀寫。示意不包含真實傳輸。</desc><defs><marker id="m0409-tftp-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">TFTP：要求檔案、回應與存取限制</text><rect x="40.0" y="101.6" width="442.5" height="204" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">用戶端｜依已知檔名提出要求</text><text x="56.0" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">要求讀取 training.cfg → 伺服器 UDP</text><text x="56.0" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">69</text><text x="56.0" y="233.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">後續以雙方選定的 UDP TID 交換資料與確</text><text x="56.0" y="265.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">認。</text><rect x="517.5" y="101.6" width="442.5" height="204" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="533.5" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">伺服器｜依政策回應</text><text x="533.5" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">← 允許時傳回特定檔案，拒絕時回覆錯誤或不</text><text x="533.5" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">提供資料。</text><text x="533.5" y="233.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">來源、路徑與檔案權限決定可用範圍；基本協</text><text x="533.5" y="265.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">定沒有目錄瀏覽或使用者登入。</text><text x="28" y="370.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">左右表示用戶端與伺服器；↔ 表示請求／資料及確認的往返，不保證任意檔案都可讀寫。示意不包含真實</text><text x="28" y="402.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">傳輸。</text></g></svg>
