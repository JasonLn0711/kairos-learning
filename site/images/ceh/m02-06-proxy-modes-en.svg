<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 846" role="img" aria-labelledby="m0206-f10-en-title m0206-f10-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0206-f10-en-title">Figure 6 | DNS Only and Proxied</title><desc id="m0206-f10-en-desc">Compare two configurations for one site; routers, ISPs and intermediate networks are omitted.</desc><rect width="800" height="846" fill="#fcfcfd" /><g fill="#162a3a" font-family="system-ui, sans-serif"><text x="400" y="42" font-size="24" text-anchor="middle" font-weight="700">Figure 6 | DNS Only and Proxied</text><text x="400" y="83.6" font-size="18" text-anchor="middle">Compare two configurations for one site; routers, ISPs and</text><text x="400" y="113.3" font-size="18" text-anchor="middle">intermediate networks are omitted.</text><text x="205" y="169.0" font-size="22" text-anchor="middle" font-weight="700">DNS Only</text><text x="595" y="169.0" font-size="22" text-anchor="middle" font-weight="700">Proxied</text><rect x="30" y="199.3" width="350" height="132.3" rx="18" fill="#eef0f3" stroke="#a1aebb" stroke-width="2" /><text x="205.0" y="233.3" font-size="22" text-anchor="middle" font-weight="700">User</text><text x="205.0" y="271.6" font-size="20" text-anchor="middle">Connects directly to the</text><text x="205.0" y="304.6" font-size="20" text-anchor="middle">configured site address</text><rect x="420" y="199.3" width="350" height="132.3" rx="18" fill="#eef0f3" stroke="#a1aebb" stroke-width="2" /><text x="595.0" y="233.3" font-size="22" text-anchor="middle" font-weight="700">User</text><text x="595.0" y="271.6" font-size="20" text-anchor="middle">Connects to the proxy</text><text x="595.0" y="304.6" font-size="20" text-anchor="middle">entry point</text><path d="M595 334.6V376.6M587 366.6L595 376.6L603 366.6" fill="none" stroke="#075bc5" stroke-width="3" /><rect x="420" y="376.6" width="350" height="132.3" rx="18" fill="#e5effc" stroke="#689ee9" stroke-width="2" /><text x="595.0" y="410.6" font-size="22" text-anchor="middle" font-weight="700">Cloudflare edge proxy</text><text x="595.0" y="448.90000000000003" font-size="20" text-anchor="middle">Handles supported web</text><text x="595.0" y="481.90000000000003" font-size="20" text-anchor="middle">traffic first</text><path d="M90 335.6V588.9000000000001M82 578.9000000000001L90 588.9000000000001L98 578.9000000000001" fill="none" stroke="#52677f" stroke-width="3" /><text x="250" y="406.6" font-size="20" text-anchor="middle">Direct connection</text><path d="M460 511.90000000000003V588.9000000000001M452 578.9000000000001L460 588.9000000000001L468 578.9000000000001" fill="none" stroke="#075bc5" stroke-width="3" /><text x="630" y="546.9000000000001" font-size="18" text-anchor="middle">When origin access is</text><text x="630" y="576.6000000000001" font-size="18" text-anchor="middle">needed</text><rect x="30" y="603.9000000000001" width="350" height="132.3" rx="18" fill="#fcf0e6" stroke="#dc9a60" stroke-width="2" /><text x="205.0" y="637.9000000000001" font-size="22" text-anchor="middle" font-weight="700">Origin server</text><text x="205.0" y="676.2" font-size="20" text-anchor="middle">DNS Only: returns the</text><text x="205.0" y="709.2" font-size="20" text-anchor="middle">configured address</text><rect x="420" y="603.9000000000001" width="350" height="132.3" rx="18" fill="#e3f2f0" stroke="#59b6b1" stroke-width="2" /><text x="595.0" y="637.9000000000001" font-size="22" text-anchor="middle" font-weight="700">Origin server</text><text x="595.0" y="676.2" font-size="20" text-anchor="middle">Receives proxy requests</text><text x="595.0" y="709.2" font-size="20" text-anchor="middle">when needed</text><text x="400" y="784.2" font-size="18" text-anchor="middle">DNS Only bypasses the standard HTTP proxy; Proxied returns proxy</text><text x="400" y="813.9000000000001" font-size="18" text-anchor="middle">IPs. Check other services and origin access separately.</text></g></svg>