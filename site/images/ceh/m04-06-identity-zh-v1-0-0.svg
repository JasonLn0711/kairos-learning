<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880.0 287.2" role="img" aria-labelledby="m0406-identity-zh-title m0406-identity-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0406-identity-zh-title">圖 2｜名字相同，UID 不同</title><desc id="m0406-identity-zh-desc">兩台電腦是平行比較；同名與同 GID 不會讓不同 UID 變成檔案擁有者。</desc><rect width="880.0" height="287.2" fill="#ffffff" /><g transform="scale(0.8)" font-family="sans-serif" fill="#173450"><text x="24" y="40" font-size="22" font-weight="700">圖 2｜名字相同，UID 不同</text><rect x="24" y="88" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="118" font-size="18" font-weight="700">電腦 A｜NFS Client</text><text x="44" y="151" font-size="18" font-weight="400">使用者 learner；UID 1001；GID 3000</text><rect x="24" y="192" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="222" font-size="18" font-weight="700">電腦 B｜NFS Server</text><text x="44" y="255" font-size="18" font-weight="400">使用者 learner；UID 2001；GID 3000</text><text x="24" y="306" font-size="18" font-weight="400">兩台電腦是平行比較；同名與同 GID 不會讓不同 UID 變成檔案擁有者。</text></g></svg>