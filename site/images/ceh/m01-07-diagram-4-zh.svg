<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1230" viewBox="0 0 800 1230" role="img" aria-labelledby="title desc" xml:lang="zh"><title id="title">CSF 2.0 與法遵地圖</title><desc id="desc">六個功能是同時運作的管理面向，不是六個必須依序跑完的關卡。治理橫跨各項工作，事件應變平時也必須準備。 Govern 治理: 策略、責任、政策、風險容忍度與監督。 Identify 識別: 盤點資產，辨認並評估風險。 Protect 保護: 控制存取與權限，降低事件發生機會與影響。 Detect 偵測: 觀察異常，產生可查證的訊號。 Respond 回應: 判定事件，協調處置並限制損害。 Recover 復原: 恢復重要服務，確認可靠且可用。 法律／法規: 依適用條件履行法定義務，例如個資法、針對特定對象的資安法。 標準／產業要求: ISO/IEC 27001 管理系統、PCI DSS 支付卡資料安全；契約或法規可能使其成為義務。 框架 Framework: NIST CSF 2.0 協助盤點能力、目標與缺口。 內部政策／程序: 寫清楚授權、責任、事件升級與通報方式。通過驗證不等於不會發生事件。</desc><rect width="800" height="1230" fill="#f2f6f5"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="18" font-weight="700" fill="#18252c">CSF 2.0 與法遵地圖</text><text x="32" y="76" font-size="18" font-weight="400" fill="#18252c">六個功能是同時運作的管理面向，不是六個必須依序跑完的關卡。治理橫跨各</text><text x="32" y="102" font-size="18" font-weight="400" fill="#18252c">項工作，事件應變平時也必須準備。</text><rect x="24" y="152" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="182" font-size="18" font-weight="700" fill="#18252c">Govern 治理</text><text x="42" y="212" font-size="18" font-weight="400" fill="#18252c">策略、責任、政策、風險容忍度與監督。</text><rect x="24" y="256" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="286" font-size="18" font-weight="700" fill="#18252c">Identify 識別</text><text x="42" y="316" font-size="18" font-weight="400" fill="#18252c">盤點資產，辨認並評估風險。</text><rect x="24" y="360" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="390" font-size="18" font-weight="700" fill="#18252c">Protect 保護</text><text x="42" y="420" font-size="18" font-weight="400" fill="#18252c">控制存取與權限，降低事件發生機會與影響。</text><rect x="24" y="464" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="494" font-size="18" font-weight="700" fill="#18252c">Detect 偵測</text><text x="42" y="524" font-size="18" font-weight="400" fill="#18252c">觀察異常，產生可查證的訊號。</text><rect x="24" y="568" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="598" font-size="18" font-weight="700" fill="#18252c">Respond 回應</text><text x="42" y="628" font-size="18" font-weight="400" fill="#18252c">判定事件，協調處置並限制損害。</text><rect x="24" y="672" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="702" font-size="18" font-weight="700" fill="#18252c">Recover 復原</text><text x="42" y="732" font-size="18" font-weight="400" fill="#18252c">恢復重要服務，確認可靠且可用。</text><rect x="24" y="776" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="806" font-size="18" font-weight="700" fill="#18252c">法律／法規</text><text x="42" y="836" font-size="18" font-weight="400" fill="#18252c">依適用條件履行法定義務，例如個資法、針對特定對象的資安法。</text><rect x="24" y="880" width="752" height="112" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="910" font-size="18" font-weight="700" fill="#18252c">標準／產業要求</text><text x="42" y="940" font-size="18" font-weight="400" fill="#18252c">ISO/IEC 27001 管理系統、PCI DSS 支付卡資料安全；契約或法規可能使其成</text><text x="42" y="966" font-size="18" font-weight="400" fill="#18252c">為義務。</text><rect x="24" y="1010" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="1040" font-size="18" font-weight="700" fill="#18252c">框架 Framework</text><text x="42" y="1070" font-size="18" font-weight="400" fill="#18252c">NIST CSF 2.0 協助盤點能力、目標與缺口。</text><rect x="24" y="1114" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="1144" font-size="18" font-weight="700" fill="#18252c">內部政策／程序</text><text x="42" y="1174" font-size="18" font-weight="400" fill="#18252c">寫清楚授權、責任、事件升級與通報方式。通過驗證不等於不會發生事件。</text></g></svg>
