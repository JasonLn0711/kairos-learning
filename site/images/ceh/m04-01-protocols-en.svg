<svg xmlns="http://www.w3.org/2000/svg" width="720" height="636" viewBox="0 0 720 636" role="img" aria-labelledby="title desc"><title id="title">Different protocols, different information</title><desc id="desc">Ask which identities can obtain which information, and whether it serves the intended business purpose.</desc><rect width="720" height="636" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">Different protocols, different information</text><text x="30" y="69" font-size="16" font-weight="400">Ask which identities can obtain which information, and whether it serves</text><text x="30" y="95" font-size="16" font-weight="400">the intended business purpose.</text><rect x="30" y="141" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="168" font-size="16" font-weight="650">DNS → Query</text><text x="46" y="194" font-size="16" font-weight="400">Hostnames and DNS records</text><rect x="30" y="235" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="262" font-size="16" font-weight="650">SMB → Query</text><text x="46" y="288" font-size="16" font-weight="400">Shares and some server information</text><rect x="30" y="329" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="356" font-size="16" font-weight="650">LDAP → Query</text><text x="46" y="382" font-size="16" font-weight="400">Accounts, groups, and objects</text><rect x="30" y="423" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="450" font-size="16" font-weight="650">SNMP → Query</text><text x="46" y="476" font-size="16" font-weight="400">Device, interface, and management data</text><rect x="30" y="517" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="544" font-size="16" font-weight="650">SMTP → Query</text><text x="46" y="570" font-size="16" font-weight="400">Information the mail service allows clients to query</text></g></svg>
