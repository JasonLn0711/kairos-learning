<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 621" role="img" aria-labelledby="title desc"><title id="title">Different protocols, different information</title><desc id="desc">Ask which identities can obtain which information, and whether it serves the intended business purpose.</desc><rect x="1" y="1" width="678" height="619" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">Different protocols, different information</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">DNS</text><text x="40" y="120" font-size="17">Hostnames and DNS records</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">SMB</text><text x="40" y="215" font-size="17">Shares and some server information</text><rect x="24" y="256" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">LDAP</text><text x="40" y="310" font-size="17">Accounts, groups, and objects</text><rect x="24" y="351" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="379" font-size="19" font-weight="bold">SNMP</text><text x="40" y="405" font-size="17">Device, interface, and management data</text><rect x="24" y="446" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="474" font-size="19" font-weight="bold">SMTP</text><text x="40" y="500" font-size="17">Information the mail service allows clients to query</text><text x="24" y="561" font-size="17">Ask which identities can obtain which information, and whether</text><text x="24" y="586" font-size="17">it serves the intended business purpose.</text></g></svg>
