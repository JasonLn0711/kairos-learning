<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" role="img" aria-labelledby="t d"><title id="t">From information assets to improvement</title><desc id="d">A simplified reasoning order; real work iterates.</desc>
<rect width="760" height="880" rx="18" fill="#f7f8f5"/>
<text x="25" y="35" font-family="sans-serif" font-size="24" fill="#173d35"><tspan x="25" dy="0">From information assets to improvement</tspan></text>
<text x="25" y="75" font-family="sans-serif" font-size="18" fill="#173d35"><tspan x="25" dy="0">A simplified reasoning order; real work iterates.</tspan></text>
<rect x="25" y="135" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="170" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">Information assets</tspan></text>
<text x="45" y="215" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">Identify what needs protection.</tspan></text>
<path d="M380 283v25m-7-7 7 7 7-7" fill="none" stroke="#355e50" stroke-width="2"/>
<rect x="25" y="315" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="350" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">CIA triad</tspan></text>
<text x="45" y="395" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">Confidentiality / Integrity / Availability</tspan></text>
<path d="M380 463v25m-7-7 7 7 7-7" fill="none" stroke="#355e50" stroke-width="2"/>
<rect x="25" y="495" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="530" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">Identify threats and vulnerabilities</tspan></text>
<text x="45" y="575" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">Assess risk.</tspan></text>
<path d="M380 643v25m-7-7 7 7 7-7" fill="none" stroke="#355e50" stroke-width="2"/>
<rect x="25" y="675" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="710" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">Select appropriate controls</tspan></text>
<text x="45" y="755" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">Monitor and improve continuously.</tspan></text>
</svg>
