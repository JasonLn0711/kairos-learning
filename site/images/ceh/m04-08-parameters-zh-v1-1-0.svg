<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 381.82" role="img" aria-labelledby="m0408-parameters-zh-title m0408-parameters-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0408-parameters-zh-title">圖 2｜一次 LDAP 查詢的四個問題</title><desc id="m0408-parameters-zh-desc">四個設定共同界定查詢，並列卡片不表示執行先後。</desc><g transform="scale(0.85)"><rect width="1000" height="449.2" fill="#f7f9fb" /><g font-family="sans-serif" fill="#213547"><text x="28" y="38.0" font-size="26" font-weight="700">圖 2｜一次 LDAP 查詢的四個問題</text><rect x="30" y="109.19999999999999" width="455" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="141.2" font-size="22" font-weight="700">01 · Base</text><text x="46" y="184.6" font-size="20">從哪裡開始查？例如 People 單位。</text><rect x="515" y="109.19999999999999" width="455" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="531" y="141.2" font-size="22" font-weight="700">02 · Scope</text><text x="531" y="184.6" font-size="20">往下查幾層？只查直屬或包含所有子層。</text><rect x="30" y="237.2" width="455" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="269.2" font-size="22" font-weight="700">03 · Filter</text><text x="46" y="312.59999999999997" font-size="20">找符合什麼條件的人？例如只找使用者帳號。</text><rect x="515" y="237.2" width="455" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="531" y="269.2" font-size="22" font-weight="700">04 · Attributes</text><text x="531" y="312.59999999999997" font-size="20">要讀取哪些欄位？例如姓名、電子郵件。</text><text x="28" y="385.2" font-size="20">四個設定共同界定查詢，並列卡片不表示執行先後。</text></g></g></svg>