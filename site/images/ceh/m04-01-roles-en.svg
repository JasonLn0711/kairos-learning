<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" role="img" aria-labelledby="title desc"><title id="title">SMB, Samba, NAS: three roles</title><desc id="desc">Separate the protocol, software, and device. A NAS can provide shares through SMB.</desc><rect width="720" height="402" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">SMB, Samba, NAS: three roles</text><text x="30" y="69" font-size="16" font-weight="400">Separate the protocol, software, and device. A NAS can provide shares throug</text><text x="30" y="95" font-size="16" font-weight="400">h SMB.</text><rect x="30" y="141" width="660" height="80" rx="12" fill="#e8f0ef" stroke="#778d80"/><text x="46" y="168" font-size="16" font-weight="650">SMB: protocol</text><text x="46" y="194" font-size="16" font-weight="400">Rules for network file sharing</text><text x="40" y="251" font-size="16" font-weight="400">↑ SMB · Implements</text><text x="380" y="251" font-size="16" font-weight="400">↑ SMB · Can support</text><rect x="30" y="271" width="320" height="106" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="298" font-size="16" font-weight="650">Samba: software</text><text x="46" y="324" font-size="16" font-weight="400">Implements SMB server and client </text><text x="46" y="350" font-size="16" font-weight="400">capabilities</text><rect x="370" y="271" width="320" height="106" rx="12" fill="#fffef9" stroke="#778d80"/><text x="386" y="298" font-size="16" font-weight="650">NAS: device</text><text x="386" y="324" font-size="16" font-weight="400">Provides network storage, often t</text><text x="386" y="350" font-size="16" font-weight="400">hrough SMB and other protocols</text></g></svg>
