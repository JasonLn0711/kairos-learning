<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 431" role="img" aria-labelledby="title desc"><title id="title">SMB, Samba, NAS: three roles</title><desc id="desc">Separate the protocol, software, and device. A NAS can provide shares through SMB.</desc><rect x="1" y="1" width="678" height="429" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">SMB, Samba, NAS: three roles</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">SMB: protocol</text><text x="40" y="120" font-size="17">Rules for network file sharing</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">Samba: software</text><text x="40" y="215" font-size="17">Implements SMB server and client capabilities</text><rect x="24" y="256" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">NAS: device</text><text x="40" y="310" font-size="17">Provides network storage, often through SMB and other protocols</text><text x="24" y="371" font-size="17">Separate the protocol, software, and device. A NAS can provide</text><text x="24" y="396" font-size="17">shares through SMB.</text></g></svg>
