<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430.8" role="img" aria-labelledby="rpc-roles-en-title rpc-roles-en-desc" preserveAspectRatio="xMidYMid meet"><title id="rpc-roles-en-title">NetBIOS, SMB, RPC: different questions</title><desc id="rpc-roles-en-desc">Parallel roles, not a mandatory sequence.</desc><defs><marker id="rpc-roles-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b7a" /></marker></defs><rect width="1500" height="718" fill="#f5f8fc" /><g transform="scale(0.6)"><text x="32" y="45" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#183b59">NetBIOS, SMB, RPC: different questions</text>
<text x="32" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Parallel roles, not a mandatory sequence.</text>
<rect x="20" y="160" width="1460" height="308" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="194" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Roles</text>
<rect x="52.0" y="218" width="448.0" height="232" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">NetBIOS | Who is on the network?</text>
<text x="68.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Computer/service names; common</text>
<text x="68.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">ports 137, 138, 139. Clue: LAB-FS</text>
<text x="68.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">&lt;20&gt; UNIQUE. Does not prove file</text>
<text x="68.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">read access.</text>
<rect x="526.0" y="218" width="448.0" height="232" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="542.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">SMB | Which shared resources are</text>
<text x="542.0" y="275" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">accessible?</text>
<text x="542.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Query share names; check listing,</text>
<text x="542.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">reading, and writing separately.</text>
<text x="542.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Commonly TCP 445. Does not prove</text>
<text x="542.0" y="401" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">administrative permission.</text>
<rect x="1000.0" y="218" width="448.0" height="232" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="1016.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">RPC | Which functions are offered</text>
<text x="1016.0" y="275" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">remotely?</text>
<text x="1016.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Query interfaces and endpoints;</text>
<text x="1016.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">for example TCP 135 → dynamic</text>
<text x="1016.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">port. Verify specified operation</text>
<text x="1016.0" y="401" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">permission. Does not authorize all</text>
<text x="1016.0" y="430" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">operations.</text>
<rect x="20" y="492" width="1460" height="192" rx="20" fill="#183b59" stroke="#8098ae" />
<text x="42" y="526" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#ffffff">Evidence boundary</text>
<rect x="52.0" y="550" width="1396.0" height="116" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="578" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Core boundary</text>
<text x="68.0" y="617" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Name discovered ≠ connected ≠ authenticated ≠ authorized. Service discovery still requires verification of actual</text>
<text x="68.0" y="646" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">access.</text></g></svg>
