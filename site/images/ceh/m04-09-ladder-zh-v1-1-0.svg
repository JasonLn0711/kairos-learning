<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 887.0400000000001" role="img" aria-labelledby="m0409-ladder-zh-title m0409-ladder-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-ladder-zh-title">網路服務的證據判讀階梯</title><desc id="m0409-ladder-zh-desc">由上到下比較證據強度；箭頭不是通用登入流程，也不表示權限會自動增加。</desc><defs><marker id="m0409-ladder-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">網路服務的證據判讀階梯</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">1. 發現服務</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">找到一個可能提供服務的入口。</text><path d="M500 221.6V251.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ladder-zh-arrow)" /><rect x="40" y="267.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="299.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">2. 取得回應</text><text x="56" y="335.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">對方真的回應你的請求。</text><path d="M500 387.6V417.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ladder-zh-arrow)" /><rect x="40" y="433.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="465.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">3. 取得資訊</text><text x="56" y="501.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">對方揭露部分版本、設定或狀態。</text><path d="M500 553.6V583.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ladder-zh-arrow)" /><rect x="40" y="599.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="631.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">4. 驗證身分</text><text x="56" y="667.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">對方確認你是誰（部分服務不需要這個步驟）。</text><path d="M500 719.6V749.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ladder-zh-arrow)" /><rect x="40" y="765.6" width="920" height="108" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="797.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">5. 驗證操作權限</text><text x="56" y="833.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">確認你真正能讀取、修改或執行什麼。</text><text x="28" y="933.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">由上到下比較證據強度；箭頭不是通用登入流程，也不表示權限會自動增加。</text></g></svg>
