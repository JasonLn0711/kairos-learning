<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">從觀察到可支持的結論</title><desc id="desc">補充圖解｜三個層次不是三個自動成立的結論。每一步都要交代證據與限制。 觀察 Observation: 設定顯示：取得連結的人可讀取。 推論 Inference: 這可能造成未授權揭露，尚不等於已發生。 驗證 Verification: 授權測試確認實際權限；日誌查核支持事件判讀，但缺紀錄不是沒事件。</desc><rect width="900" height="410" rx="18" fill="#f2f6f5"/><text x="28" y="42" fill="#18252c" font-size="24" font-family="sans-serif">從觀察到可支持的結論</text><rect x="24" y="66" width="852" height="94" rx="10" fill="white" stroke="#687d78"/><text x="40" y="94" font-size="19" fill="#18252c" font-family="sans-serif">觀察 Observation</text><text x="40" y="120" font-size="17" fill="#18252c" font-family="sans-serif">設定顯示：取得連結的人可讀取。</text><rect x="24" y="172" width="852" height="94" rx="10" fill="white" stroke="#687d78"/><text x="40" y="200" font-size="19" fill="#18252c" font-family="sans-serif">推論 Inference</text><text x="40" y="226" font-size="17" fill="#18252c" font-family="sans-serif">這可能造成未授權揭露，尚不等於已發生。</text><rect x="24" y="278" width="852" height="94" rx="10" fill="white" stroke="#687d78"/><text x="40" y="306" font-size="19" fill="#18252c" font-family="sans-serif">驗證 Verification</text><text x="40" y="332" font-size="17" fill="#18252c" font-family="sans-serif">授權測試確認實際權限；日誌查核支持事件判讀，但缺紀錄不是沒事件。</text></svg>