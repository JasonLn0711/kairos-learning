<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 621" role="img" aria-labelledby="title desc"><title id="title">Five questions, separate evidence</title><desc id="desc">These categories are not a required operation order. Test permission and account permissions are separate.</desc><rect x="1" y="1" width="678" height="619" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">Five questions, separate evidence</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">Reconnaissance</text><text x="40" y="120" font-size="17">Where is the target?</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">Scanning</text><text x="40" y="215" font-size="17">Which service endpoints respond?</text><rect x="24" y="256" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">Enumeration</text><text x="40" y="310" font-size="17">What specific information is available?</text><rect x="24" y="351" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="379" font-size="19" font-weight="bold">Authentication</text><text x="40" y="405" font-size="17">Who are you?</text><rect x="24" y="446" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="474" font-size="19" font-weight="bold">Authorization</text><text x="40" y="500" font-size="17">What may you do?</text><text x="24" y="561" font-size="17">These categories are not a required operation order. Test</text><text x="24" y="586" font-size="17">permission and account permissions are separate.</text></g></svg>
