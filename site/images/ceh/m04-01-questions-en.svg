<svg xmlns="http://www.w3.org/2000/svg" width="720" height="636" viewBox="0 0 720 636" role="img" aria-labelledby="title desc"><title id="title">Five questions, separate evidence</title><desc id="desc">These categories are not a required operation order. Test permission and account permissions are separate.</desc><rect width="720" height="636" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">Five questions, separate evidence</text><text x="30" y="69" font-size="16" font-weight="400">These categories are not a required operation order. Test permission and acc</text><text x="30" y="95" font-size="16" font-weight="400">ount permissions are separate.</text><rect x="30" y="141" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="168" font-size="16" font-weight="650">Reconnaissance → Ask</text><text x="46" y="194" font-size="16" font-weight="400">Where is the target?</text><rect x="30" y="235" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="262" font-size="16" font-weight="650">Scanning → Ask</text><text x="46" y="288" font-size="16" font-weight="400">Which service endpoints respond?</text><rect x="30" y="329" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="356" font-size="16" font-weight="650">Enumeration → Ask</text><text x="46" y="382" font-size="16" font-weight="400">What specific information is available?</text><rect x="30" y="423" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="450" font-size="16" font-weight="650">Authentication → Ask</text><text x="46" y="476" font-size="16" font-weight="400">Who are you?</text><rect x="30" y="517" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="544" font-size="16" font-weight="650">Authorization → Ask</text><text x="46" y="570" font-size="16" font-weight="400">What may you do?</text></g></svg>
