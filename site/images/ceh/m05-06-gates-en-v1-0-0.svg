<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1351.8000000000002" role="img" aria-labelledby="m0506-gates-en-title m0506-gates-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0506-gates-en-title">Three gates for interpreting a scan</title><desc id="m0506-gates-en-desc">Starting with the job status, check configuration, authentication and coverage, then interpret the evidence.</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">Three gates for interpreting a scan</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">Starting with the job status, check configuration, authentication</text><text x="28" y="132.8" font-size="20" fill="#18252c">and coverage, then interpret the evidence.</text><rect x="28" y="188.8" width="844" height="133.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="224.8" font-size="23" fill="#18252c" font-weight="700">Scan job ended</text><text x="48" y="266.2" font-size="20" fill="#18252c">This is a job status, not a security conclusion.</text><path d="M450 334.20000000000005v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="376.20000000000005" width="844" height="217.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="412.20000000000005" font-size="23" fill="#18252c" font-weight="700">Gate 1: Configuration</text><text x="48" y="453.6" font-size="20" fill="#18252c">Did this scan actually use the account you configured?</text><text x="48" y="501.6" font-size="20" fill="#18252c">Saving an account in the scanner does not mean it was assigned</text><text x="48" y="537.6" font-size="20" fill="#18252c">to the target.</text><path d="M450 605.6v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="647.6" width="844" height="217.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="683.6" font-size="23" fill="#18252c" font-weight="700">Gate 2: Authentication</text><text x="48" y="725.0" font-size="20" fill="#18252c">Did the target system accept this account?</text><text x="48" y="773.0" font-size="20" fill="#18252c">An expired or locked account or unreachable SSH service can</text><text x="48" y="809.0" font-size="20" fill="#18252c">cause failure.</text><path d="M450 877.0v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="919.0" width="844" height="217.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="955.0" font-size="23" fill="#18252c" font-weight="700">Gate 3: Coverage</text><text x="48" y="996.4" font-size="20" fill="#18252c">After login, did the necessary checks actually succeed?</text><text x="48" y="1044.4" font-size="20" fill="#18252c">Logging in does not establish permission to read the package</text><text x="48" y="1080.4" font-size="20" fill="#18252c">inventory, settings or logs.</text><path d="M450 1148.4v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="1190.4" width="844" height="133.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="1226.4" font-size="23" fill="#18252c" font-weight="700">Interpret the evidence actually obtained</text><text x="48" y="1267.8000000000002" font-size="20" fill="#18252c">Explain confirmed facts, unfinished checks and unknown risks.</text></g></svg>
