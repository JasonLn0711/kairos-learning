<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 717.3000000000001" role="img" aria-labelledby="m0503-gates-en-title m0503-gates-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-gates-en-title">Figure 2 | Record three evidence states separately</title><desc id="m0503-gates-en-desc">Check these states in diagnostic order. Success in one does not establish success in the next; no automatic pass or privilege increase is implied.</desc><defs><marker id="m0503-gates-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 2 | Record three evidence states separately</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Check these states in diagnostic order. Success in one does not establish</text><text x="28" y="140.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">success in the next; no automatic pass or privilege increase is implied.</text><rect x="40.0" y="202" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="236.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">1 | Configuration applied</text><text x="60.0" y="273.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Confirm this job enabled the right credentials for this target.</text><text x="60.0" y="305.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Saving them does not establish their use.</text><rect x="40.0" y="383" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="417.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">2 | Authentication succeeded</text><text x="60.0" y="454.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Confirm the target and service accepted the identity. One successful</text><text x="60.0" y="486.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">host does not establish group-wide success.</text><rect x="40.0" y="564" width="920.0" height="185" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="598.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">3 | Required checks completed</text><text x="60.0" y="635.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Confirm permissions and outputs produced the required evidence,</text><text x="60.0" y="667.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">recording failures or gaps. Authentication cannot substitute for this</text><text x="60.0" y="699.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">evidence.</text></g></svg>
