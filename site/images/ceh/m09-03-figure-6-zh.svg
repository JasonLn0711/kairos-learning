<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160" role="img" aria-labelledby="title desc">
<title id="title">不同結論，需要各自的證據</title><desc id="desc">這些是不同的證據問題，不是必然依序發生的攻擊階段；可能重疊、跳過或仍無法確認。 接觸: 簡訊與通話紀錄：能證明有接觸跡象，不能單靠顯示資訊確認身分。 憑證暴露: 員工表示說出 OTP：有驗證資訊暴露風險，應立即依風險處置。 驗證成功: 平台驗證或登入紀錄：仍須核對操作者與授權，不能直接認定是攻擊者。 未授權操作: 存取或變更紀錄：核實操作者、工作目的、權限及實際行為。 資料外流: 經核實的傳輸證據：確認資料內容、接收方及範圍，不能只靠下載警示定案。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker></defs>
<rect width="1000" height="1160" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="42" y="37" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · 圖 6</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">不同結論，需要各自的證據</text>
<text x="42" y="135" font-size="18" font-weight="400" fill="#43576a" text-anchor="start">這些是不同的證據問題，不是必然依序發生的攻擊階段；可能重疊、跳過或仍無法確認。</text>
<rect x="42" y="210" width="916" height="146" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="249" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">接觸</text>
<text x="66" y="292" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">簡訊與通話紀錄：能證明有接觸跡象，不能單靠顯示資訊確認身分。</text>
<rect x="42" y="378" width="916" height="146" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="417" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">憑證暴露</text>
<text x="66" y="460" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">員工表示說出 OTP：有驗證資訊暴露風險，應立即依風險處置。</text>
<rect x="42" y="546" width="916" height="146" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="585" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">驗證成功</text>
<text x="66" y="628" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">平台驗證或登入紀錄：仍須核對操作者與授權，不能直接認定是攻擊者。</text>
<rect x="42" y="714" width="916" height="146" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="753" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">未授權操作</text>
<text x="66" y="796" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">存取或變更紀錄：核實操作者、工作目的、權限及實際行為。</text>
<rect x="42" y="882" width="916" height="146" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="921" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">資料外流</text>
<text x="66" y="964" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">經核實的傳輸證據：確認資料內容、接收方及範圍，不能只靠下載警示定案。</text>
<text x="42" y="1108" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">刻意不畫推進箭頭：一項結果不能代替另一項結果所需的證據。</text>
</g></svg>
