<svg xmlns="http://www.w3.org/2000/svg" width="800" height="790" viewBox="0 0 800 790" role="img" aria-labelledby="m0903-f6-zh-title m0903-f6-zh-desc">
<title id="m0903-f6-zh-title">已知、風險、未知：不要跳推結論</title><desc id="m0903-f6-zh-desc">以下是案例判讀，不是必然依序發生的攻擊階段。</desc>
<defs>
<marker id="m0903-f6-zh-flow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#1d4ed8"/></marker>
<marker id="m0903-f6-zh-attempt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#92400e"/></marker>
<marker id="m0903-f6-zh-process" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker>
</defs>
<rect width="800" height="790" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="28" y="30" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · 圖 6</text>
<text x="28" y="70" font-size="28" font-weight="700" fill="#172b3a" text-anchor="start">已知、風險、未知：不要跳推結論</text>
<text x="28" y="111" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">以下是案例判讀，不是必然依序發生的攻擊階段。</text>
<rect x="28" y="145" width="230" height="32" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="143.0" y="168" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">已知紀錄 KNOWN</text>
<rect x="298" y="145" width="230" height="32" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="413.0" y="168" font-size="16" font-weight="700" fill="#0f766e" text-anchor="middle">可支持 SUPPORTED</text>
<rect x="568" y="145" width="204" height="32" rx="8" fill="#fffbeb" stroke="#92400e" stroke-width="1.5"/>
<text x="670.0" y="168" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">尚未知 UNKNOWN</text>
<path d="M 258 250 L 288 250" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="288" cy="250" r="4" fill="#43576a"/>
<path d="M 258 400 L 288 400" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="288" cy="400" r="4" fill="#43576a"/>
<rect x="28" y="205" width="230" height="105" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="143.0" y="250.0" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle">簡訊／通話紀錄</text>
<text x="143.0" y="281.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">案例已有的線索</text>
<rect x="28" y="355" width="230" height="105" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="143.0" y="400.0" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle">員工自述交碼</text>
<text x="143.0" y="431.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">「我說出了 OTP」</text>
<rect x="298" y="205" width="230" height="105" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="413.0" y="250.0" font-size="21" font-weight="700" fill="#0f766e" text-anchor="middle">有接觸跡象</text>
<text x="413.0" y="281.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">身分仍可能未核實</text>
<rect x="298" y="355" width="230" height="105" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="413.0" y="400.0" font-size="21" font-weight="700" fill="#0f766e" text-anchor="middle">憑證暴露風險</text>
<text x="413.0" y="431.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">值得立即保護帳號</text>
<rect x="568" y="205" width="204" height="105" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="670.0" y="249.5" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">是否驗證成功？</text>
<text x="670.0" y="280.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">需驗證／登入紀錄</text>
<rect x="568" y="355" width="204" height="105" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="670.0" y="399.5" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">是否未授權操作？</text>
<text x="670.0" y="430.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">需存取／權限證據</text>
<rect x="568" y="505" width="204" height="105" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="670.0" y="549.5" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">是否資料外流？</text>
<text x="670.0" y="580.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">需核實傳輸範圍</text>
<line x1="548" y1="190" x2="548" y2="615" stroke="#92400e" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="28" y="525" width="500" height="85" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="278.0" y="575.0" font-size="21" font-weight="700" fill="#172b3a" text-anchor="middle">先處置風險，再以證據補齊結果</text>
<line x1="28" y1="655" x2="772" y2="655" stroke="#64748b" stroke-width="1"/>
<text x="28" y="680" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">無箭頭線＋圓點＝紀錄支持有限結論；不是事件推進。</text>
<text x="28" y="707" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">右側各項未知必須各自取證，不能從「說出碼」跳推。</text>
</g></svg>
