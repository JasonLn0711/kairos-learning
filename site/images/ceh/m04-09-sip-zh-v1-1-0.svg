<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 491.04" role="img" aria-labelledby="m0409-sip-zh-title m0409-sip-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-sip-zh-title">SIP 與 RTP：兩條不同的工作線</title><desc id="m0409-sip-zh-desc">每列的 ↔ 表示通話端之間該類資料的雙向交換，不表示 SIP 訊令與 RTP 語音必走相同路徑；兩列彼此平行。</desc><defs><marker id="m0409-sip-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">SIP 與 RTP：兩條不同的工作線</text><rect x="40" y="101.6" width="920" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">SIP：通話控制 ↔</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">撥打方 ↔ 撥號、響鈴、接通 ↔ 接聽方</text><text x="56" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">TLS 可保護 SIP 訊令的特定傳輸區段。</text><rect x="40" y="261.6" width="920" height="140" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="293.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">RTP：傳輸媒體 ↔</text><text x="56" y="329.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">聲音輸入 ↔ 語音封包 ↔ 聲音輸出</text><text x="56" y="361.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">媒體需要另外確認 SRTP 等保護及金鑰協商。</text><text x="28" y="461.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">每列的 ↔ 表示通話端之間該類資料的雙向交換，不表示 SIP 訊令與 RTP 語音必走相同路徑；兩列彼此</text><text x="28" y="493.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">平行。</text></g></svg>
