<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 765" role="img" aria-labelledby="m0202-f2-zh-title m0202-f2-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0202-f2-zh-title">圖 2｜數根源，不數網址</title>
<desc id="m0202-f2-zh-desc">上方引用鏈；下方不同取得途徑</desc>
<defs><marker id="m0202-f2-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="598" height="763" rx="20" fill="#f8fafc" stroke="#b7c7d5" />
<text x="300" y="45" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#172b3a">圖 2｜數根源，不數網址</text>
<rect x="70" y="85" width="460" height="75" rx="15" fill="#fff3d8" stroke="#7892a6" />
<text x="300.0" y="119" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">A：論壇原始說法</text>
<rect x="70" y="205" width="460" height="75" rx="15" fill="#fff3d8" stroke="#7892a6" />
<text x="300.0" y="239" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">B：轉貼 A</text>
<rect x="70" y="325" width="460" height="75" rx="15" fill="#fff3d8" stroke="#7892a6" />
<text x="300.0" y="359" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">C：引用 B → 仍同源</text>
<rect x="30" y="465" width="255" height="85" rx="15" fill="#e7f3ed" stroke="#7892a6" />
<text x="157.5" y="499" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">原始紀錄 D</text>
<rect x="315" y="465" width="255" height="85" rx="15" fill="#e7f3ed" stroke="#7892a6" />
<text x="442.5" y="499" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">獨立取得 E</text>
<rect x="70" y="595" width="460" height="65" rx="15" fill="#e8f2fb" stroke="#7892a6" />
<text x="300.0" y="629" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">同主張？同時間？同對象？</text>
<path d="M300 160V205" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0202-f2-zh-arrow)" />
<path d="M300 280V325" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0202-f2-zh-arrow)" />
<path d="M155 550V575H250V595" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0202-f2-zh-arrow)" />
<path d="M445 550V575H350V595" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0202-f2-zh-arrow)" />
<text x="300" y="690" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#172b3a">上方箭頭＝引用；下方＝提供支持</text>
<text x="300" y="718" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#172b3a">不同網址仍可能共用過期根源</text>
</svg>