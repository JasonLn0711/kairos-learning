<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 841.5" role="img" aria-labelledby="m0503-dimensions-zh-title m0503-dimensions-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-dimensions-zh-title">圖 4｜同一場弱點評估的五個維度</title><desc id="m0503-dimensions-zh-desc">五項同時成立；編號供閱讀，不代表執行步驟或實測通過。</desc><defs><marker id="m0503-dimensions-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 4｜同一場弱點評估的五個維度</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">五項同時成立；編號供閱讀，不代表執行步驟或實測通過。</text><rect x="40.0" y="170" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">1. 檢查對象：Host-based</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Linux 伺服器</text><rect x="40.0" y="319" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="353.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">2. 檢查位置：Internal</text><text x="60.0" y="390.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">從內部網路檢查</text><rect x="40.0" y="468" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="502.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">3. 取得證據：Active</text><text x="60.0" y="539.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">主動發送探測與檢查請求</text><rect x="40.0" y="617" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="651.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">4. 驗證身分：Authenticated</text><text x="60.0" y="688.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">使用核准的掃描帳號</text><rect x="40.0" y="766" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="800.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">5. 執行方式：Automated</text><text x="60.0" y="837.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">先以工具執行重複檢查</text></g></svg>
