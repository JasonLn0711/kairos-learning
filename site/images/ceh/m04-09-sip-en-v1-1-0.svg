<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 519.84" role="img" aria-labelledby="m0409-sip-en-title m0409-sip-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-sip-en-title">SIP and RTP: two distinct flows</title><desc id="m0409-sip-en-desc">Each ↔ denotes bidirectional exchange of that data type between call parties. Signaling and media need not follow the same route; the two rows are parallel.</desc><defs><marker id="m0409-sip-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">SIP and RTP: two distinct flows</text><rect x="40" y="101.6" width="920" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">SIP: call control ↔</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Calling party ↔ dialing, ringing, connection ↔ receiving party</text><text x="56" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">TLS can protect a particular SIP signaling transport segment.</text><rect x="40" y="261.6" width="920" height="140" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="293.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">RTP: media transport ↔</text><text x="56" y="329.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Audio input ↔ voice packets ↔ audio output</text><text x="56" y="361.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Check media protection such as SRTP and key negotiation separately.</text><text x="28" y="461.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Each ↔ denotes bidirectional exchange of that data type between call</text><text x="28" y="493.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">parties. Signaling and media need not follow the same route; the two rows</text><text x="28" y="525.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">are parallel.</text></g></svg>
