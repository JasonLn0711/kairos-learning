<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880.0 511.20000000000005" role="img" aria-labelledby="m0406-workflow-zh-title m0406-workflow-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0406-workflow-zh-title">圖 1｜本課的核心思考流程</title><desc id="m0406-workflow-zh-desc">箭頭表示判讀次序，不表示帳號名稱會自動決定身分或授權。</desc><rect width="880.0" height="511.20000000000005" fill="#ffffff" /><g transform="scale(0.8)" font-family="sans-serif" fill="#173450"><text x="24" y="40" font-size="22" font-weight="700">圖 1｜本課的核心思考流程</text><rect x="24" y="88" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="118" font-size="18" font-weight="700">帳號名稱｜你叫什麼？</text><text x="44" y="151" font-size="18" font-weight="400">例如 learner</text><path d="M550 180v22m-8 -8 8 8 8 -8" stroke="#60738d" stroke-width="2" fill="none" /><rect x="24" y="216" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="246" font-size="18" font-weight="700">UID／GID｜你的身分編號？</text><text x="44" y="279" font-size="18" font-weight="400">例如 UID 1001、GID 3000</text><path d="M550 308v22m-8 -8 8 8 8 -8" stroke="#60738d" stroke-width="2" fill="none" /><rect x="24" y="344" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="374" font-size="18" font-weight="700">NFS｜伺服器如何辨識請求？</text><text x="44" y="407" font-size="18" font-weight="400">例如 sec=sys 傳遞數字身分</text><path d="M550 436v22m-8 -8 8 8 8 -8" stroke="#60738d" stroke-width="2" fill="none" /><rect x="24" y="472" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="502" font-size="18" font-weight="700">Permissions｜你能做什麼？</text><text x="44" y="535" font-size="18" font-weight="400">列出名稱、讀取、寫入分別核對</text><text x="24" y="586" font-size="18" font-weight="400">箭頭表示判讀次序，不表示帳號名稱會自動決定身分或授權。</text></g></svg>