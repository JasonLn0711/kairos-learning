<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621.9" role="img" aria-labelledby="m0501-access-en-title m0501-access-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0501-access-en-title">Figure 3 | Two test accounts and positive/negative cases</title><desc id="m0501-access-en-desc">Purpose: check whether the server enforces resource access control according to the signed-in identity. These are policy expectations, not observed test results.</desc><defs><marker id="m0501-access-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 3 | Two test accounts and positive/negative cases</text><rect x="40.0" y="108" width="448.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="142.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Account A</text><text x="60.0" y="179.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Test imaging record A001</text><rect x="512.0" y="108" width="448.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="532.0" y="142.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Account B</text><text x="532.0" y="179.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Test imaging record B001</text><rect x="40.0" y="257" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="291.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">A reads its own A001</text><text x="60.0" y="328.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Allow</text><rect x="40.0" y="406" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x=