<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750.4" role="img" aria-labelledby="m0505-groups-zh-title m0505-groups-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0505-groups-zh-title">圖 2｜CVSS v4.0 的四組指標</title><desc id="m0505-groups-zh-desc">四組指標的用途不同；Supplemental 不改變分數。上下排列用於閱讀，不表示先後流程。</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">圖 2｜CVSS v4.0 的四組指標</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">四組指標的用途不同；Supplemental 不改變分數。上下排列用於閱讀，不表示先後流程。</text><rect x="28" y="152.8" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="186.8" font-size="23" fill="#18252c" font-weight="700">Base（基本）</text><text x="48" y="228.20000000000002" font-size="20" fill="#18252c">漏洞本身具備什麼技術特性？可能造成什麼後果？</text><rect x="28" y="300.20000000000005" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="334.20000000000005" font-size="23" fill="#18252c" font-weight="700">Threat（威脅）</text><text x="48" y="375.6" font-size="20" fill="#18252c">是否已出現可用的利用技術，或實際利用活動？</text><rect x="28" y="447.6" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="481.6" font-size="23" fill="#18252c" font-weight="700">Environmental（環境）</text><text x="48" y="523.0" font-size="20" fill="#18252c">放到我的公司後，系統的重要性、防護與實際條件有什麼差別？</text><rect x="28" y="595.0" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="629.0" font-size="23" fill="#18252c" font-weight="700">Supplemental（補充）</text><text x="48" y="670.4" font-size="20" fill="#18252c">還有什麼額外資訊值得參考，例如復原困難程度？這組指標不改變 CVSS 分數。</text></g></svg>
