<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1175" viewBox="0 0 1000 1175" role="img" aria-labelledby="title desc">
<title id="title">Connect M09-03 to the CEH knowledge map</title><desc id="desc">Concept relationships, not a fixed attack sequence. Authorization and rules of engagement govern testing and investigation. M09 | Social engineering: Recognize phishing, impersonation and cross-channel trust. M02/M04 | Reconnaissance and enumeration: Gather target and environment clues; clues do not prove compromise. M01-04/05 | Attack analysis: Analyze vectors and observed behavior. An ATT&amp;CK classification is not proof of success. M01-01/02 | Security and risk: CIA, assets, threats, vulnerabilities and consequences. M01-06 | Defensive controls: Authentication, least privilege and defense in depth. M01-07 | Incident response: Detect, contain, investigate, recover and improve. M01-03 | Authorization and ROE: Testing and investigation must stay within explicit permission and scope.</desc>
