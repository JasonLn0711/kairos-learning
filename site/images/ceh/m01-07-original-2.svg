<svg baseProfile="full" height="1040" version="1.1" viewBox="0 0 1600 1040" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>CEH M01-07｜風險評估與處置</title><desc>繁體中文向量資訊圖表，適合初學者閱讀，非官方原圖。</desc><defs /><rect fill="#F6F8FC" height="1040" width="1600" x="0" y="0" /><circle cx="1500" cy="-105" fill="#EAF0FF" opacity="0.54" r="310" /><circle cx="-160" cy="1140" fill="#E2F3F0" opacity="0.44" r="310" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="80" y="67">CEH  /  MODULE 01  /  LESSON 07</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="49" font-weight="700" opacity="1" text-anchor="start" x="80" y="132">02  同樣是權限設錯，風險卻可能完全不同</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="82" y="185">弱點是「哪裡有問題」；風險還要看「誰能接觸」與「可能造成多少傷害」。</text><rect fill="#EDF1F8" height="46" rx="23.0" ry="23.0" width="335" x="1192" y="52" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="1359.5" y="81.84">初學者圖解  ·  非官方原圖</text><rect fill="#B7C3D5" height="370" opacity="0.16" rx="22" ry="22" width="480" x="79.5" y="228" /><rect fill="#FFFFFF" height="370" rx="22" ry="22" stroke="#DFE6F0" stroke-width="1.5" width="480" x="77" y="222" /><rect fill="#EAF0FF" height="46" rx="12" ry="12" width="123" x="103" y="248" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="middle" x="164.5" y="278.92">案例 A</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="35" font-weight="700" opacity="1" text-anchor="start" x="103" y="340">公開活動海報</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="105" y="390">資料原本就準備對外公開</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="105" y="432">資料夾權限過於寬鬆</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="105" y="474">可能需要修正，但影響較低</text><rect fill="#EAF0FF" height="47" rx="13" ry="13" width="402" x="105" y="532" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="middle" x="306.0" y="562.7">示例：機率中 × 影響低</text><rect fill="#B7C3D5" height="370" opacity="0.16" rx="22" ry="22" width="480" x="576.5" y="228" /><rect fill="#FFFFFF" height="370" rx="22" ry="22" stroke="#DFE6F0" stroke-width="1.5" width="480" x="574" y="222" /><rect fill="#FFF1E9" height="46" rx="12" ry="12" width="123" x="600" y="248" /><text fill="#D86D3E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="middle" x="661.5" y="278.92">案例 B</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="35" font-weight="700" opacity="1" text-anchor="start" x="600" y="340">客戶私人文件</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="602" y="390">資料包含個人與敏感資訊</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="602" y="432">同樣設錯資料夾分享權限</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="602" y="474">可能外洩、觸發法遵與信任損害</text><rect fill="#FFF1E9" height="47" rx="13" ry="13" width="402" x="602" y="532" /><text fill="#D86D3E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="middle" x="803.0" y="562.7">示例：機率中 × 影響高</text><rect fill="#B7C3D5" height="370" opacity="0.16" rx="22" ry="22" width="448" x="1074.5" y="228" /><rect fill="#FDFEFF" height="370" rx="22" ry="22" stroke="#DFE6F0" stroke-width="1.5" width="448" x="1072" y="222" /><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="28" font-weight="700" opacity="1" text-anchor="start" x="1099" y="268">風險矩陣（僅示意）</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="middle" x="1280" y="299">影響程度 →</text><rect fill="#FFF5DB" height="68" rx="10" ry="10" stroke="#FFFFFF" stroke-width="2" width="68" x="1179" y="320" /><rect fill="#FFF1E9" height="68" rx="10" ry="10" stroke="#FFFFFF" stroke-width="2" width="68" x="1252" y="320" /><rect fill="#FCEBEB" height="68" rx="10" ry="10" stroke="#FFFFFF" stroke-width="2" width="68" x="1325" y="320" /><rect fill="#E4F5EB" height="68" rx="10" ry="10" stroke="#FFFFFF" stroke-width="2" width="68" x="1179" y="393" /><rect fill="#FFF5DB" height="68" rx="10" ry="10" stroke="#FFFFFF" stroke-width="2" width="68" x="1252" y="393" /><rect fill="#FFF1E9" height="68" rx="10" ry="10" stroke="#FFFFFF" stroke-width="2" width="68" x="1325" y="393" /><rect fill="#E4F5EB" height="68" rx="10" ry="10" stroke="#FFFFFF" stroke-width="2" width="68" x="1179" y="466" /><rect fill="#E4F5EB" height="68" rx="10" ry="10" stroke="#FFFFFF" stroke-width="2" width="68" x="1252" y="466" /><rect fill="#FFF5DB" height="68" rx="10" ry="10" stroke="#FFFFFF" stroke-width="2" width="68" x="1325" y="466" /><rect fill="#4168D9" height="38" rx="12" ry="12" width="51" x="1187" y="408" /><text fill="#FFFFFF" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="1212.5" y="434.56">A</text><rect fill="#D86D3E" height="38" rx="12" ry="12" width="51" x="1333" y="408" /><text fill="#FFFFFF" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="1358.5" y="434.56">B</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="700" opacity="1" text-anchor="middle" x="1213" y="560">低</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="700" opacity="1" text-anchor="middle" x="1286" y="560">中</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="700" opacity="1" text-anchor="middle" x="1359" y="560">高</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="700" opacity="1" text-anchor="middle" x="1150" y="363">高</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="700" opacity="1" text-anchor="middle" x="1150" y="436">中</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="700" opacity="1" text-anchor="middle" x="1150" y="509">低</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="700" opacity="1" text-anchor="start" x="1106" y="365">發生</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="700" opacity="1" text-anchor="start" x="1097" y="390">可能性</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="1100" y="582">實際判斷需考慮暴露與現有防護</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="31" font-weight="700" opacity="1" text-anchor="start" x="81" y="659">評估後有四種常見的風險處理方向</text><rect fill="#B7C3D5" height="191" opacity="0.16" rx="20" ry="20" width="345" x="82.5" y="698" /><rect fill="#FFFFFF" height="191" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="345" x="80" y="692" /><rect fill="#4168D9" height="9" rx="5" ry="5" width="343" x="81" y="693" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="start" x="103" y="747">降低 Mitigate</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="102" y="798">修正共享權限</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="102" y="834">新增檢測、重新驗證</text><rect fill="#B7C3D5" height="191" opacity="0.16" rx="20" ry="20" width="345" x="447.5" y="698" /><rect fill="#FFFFFF" height="191" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="345" x="445" y="692" /><rect fill="#087E80" height="9" rx="5" ry="5" width="343" x="446" y="693" /><text fill="#087E80" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="start" x="468" y="747">避免 Avoid</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="467" y="798">取消不必要的公開分享</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="467" y="834">但可能犧牲便利性</text><rect fill="#B7C3D5" height="191" opacity="0.16" rx="20" ry="20" width="345" x="812.5" y="698" /><rect fill="#FFFFFF" height="191" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="345" x="810" y="692" /><rect fill="#7655C9" height="9" rx="5" ry="5" width="343" x="811" y="693" /><text fill="#7655C9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="start" x="833" y="747">分擔 Share / Transfer</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="832" y="798">用契約、保險分配部分損失</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="832" y="834">不等於責任全部消失</text><rect fill="#B7C3D5" height="191" opacity="0.16" rx="20" ry="20" width="345" x="1177.5" y="698" /><rect fill="#FFFFFF" height="191" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="345" x="1175" y="692" /><rect fill="#D86D3E" height="9" rx="5" ry="5" width="343" x="1176" y="693" /><text fill="#D86D3E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="start" x="1198" y="747">接受 Accept</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="1197" y="798">授權人理解風險後做決定</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="1197" y="834">留下理由與複查時間</text><rect fill="#B7C3D5" height="75" opacity="0.16" rx="18" ry="18" width="1440" x="82.5" y="919" /><rect fill="#E9F5F3" height="75" rx="18" ry="18" stroke="#C6E7DD" stroke-width="1.5" width="1440" x="80" y="913" /><text fill="#087E80" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="107" y="961">殘餘風險 Residual Risk</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" opacity="1" text-anchor="start" x="449" y="961">即使修好權限，仍要確認先前是否有人存取；修補後風險不一定是零。</text></svg>