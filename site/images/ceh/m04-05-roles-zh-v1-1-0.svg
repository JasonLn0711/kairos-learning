<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 361.2" role="img" aria-labelledby="rpc-roles-zh-title rpc-roles-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="rpc-roles-zh-title">NetBIOS、SMB、RPC：各自回答不同問題</title><desc id="rpc-roles-zh-desc">三種技術並列比較，不表示必須按固定順序發生。</desc><defs><marker id="rpc-roles-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b7a" /></marker></defs><rect width="1500" height="602" fill="#f5f8fc" /><g transform="scale(0.6)"><text x="32" y="45" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#183b59">NetBIOS、SMB、RPC：各自回答不同問題</text>
<text x="32" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">三種技術並列比較，不表示必須按固定順序發生。</text>
<rect x="20" y="160" width="1460" height="221" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="194" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">角色比較</text>
<rect x="52.0" y="218" width="448.0" height="145" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">NetBIOS｜誰在這個網路上？</text>
<text x="68.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">看見電腦／服務名稱；常見 137、138</text>
<text x="68.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">、139。線索：LAB-FS &lt;20&gt; UNIQUE。</text>
<text x="68.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">不能證明檔案可讀。</text>
<rect x="526.0" y="218" width="448.0" height="145" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="542.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">SMB｜可以存取哪些共享資源？</text>
<text x="542.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">查詢共享資料夾名稱，分別檢查列目錄</text>
<text x="542.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">／讀取／寫入；常見 TCP 445。不能證</text>
<text x="542.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">明有管理權。</text>
<rect x="1000.0" y="218" width="448.0" height="145" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="1016.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">RPC｜遠端提供哪些功能？</text>
<text x="1016.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">查詢介面與端點位置；如 TCP 135 → </text>
<text x="1016.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">動態埠，再驗證具體操作是否獲准。不</text>
<text x="1016.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">能證明所有操作都能做。</text>
<rect x="20" y="405" width="1460" height="163" rx="20" fill="#183b59" stroke="#8098ae" />
<text x="42" y="439" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#ffffff">判讀界線</text>
<rect x="52.0" y="463" width="1396.0" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="491" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">核心邊界</text>
<text x="68.0" y="530" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">看得到名稱 ≠ 能連線 ≠ 通過驗證 ≠ 被授權。知道服務存在，仍須驗證能否使用。</text></g></svg>
