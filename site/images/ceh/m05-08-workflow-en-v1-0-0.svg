<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 961.2" role="img" aria-labelledby="m0503-evidence-en-title m0503-evidence-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-evidence-en-title">Figure 1 | Four stages of patch execution and evidence</title><desc id="m0503-evidence-en-desc">Arrows show execution and review order, not an automatic pass. Failure or rollback requires reassessing conditions and risk; monitoring continues after closure.</desc><defs><marker id="m0503-evidence-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 1 | Four stages of patch execution and evidence</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Arrows show execution and review order, not an automatic pass. Failure or</text><text x="28" y="140.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">rollback requires reassessing conditions and risk; monitoring continues</text><text x="28" y="172.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">after closure.</text><rect x="40.0" y="234" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="268.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Prepare deployment</text><text x="60.0" y="305.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Check applicable fixes, trusted sources, testing, owners, maintenance</text><text x="60.0" y="337.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">windows and recovery.</text><path d="M500 401V429" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-en-arrow)" /><rect x="40.0" y="445" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="479.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Execute change</text><text x="60.0" y="516.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Deploy under the approved plan and record installation, restarts and</text><text x="60.0" y="548.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">exceptions. Execution is not completed verification.</text><path d="M500 612V640" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-en-arrow)" /><rect x="40.0" y="656" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="690.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Verify effectiveness</text><text x="60.0" y="727.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Obtain evidence that the fix is installed and effective, required</text><text x="60.0" y="759.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">checks completed and normal service works.</text><path d="M500 823V851" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-en-arrow)" /><rect x="40.0" y="867" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="901.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Keep monitoring</text><text x="60.0" y="938.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Track whether the fix remains effective, conditions change or risk</text><text x="60.0" y="970.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">needs review.</text></g></svg>
