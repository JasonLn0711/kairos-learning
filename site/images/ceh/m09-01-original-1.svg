<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1520" height="810" viewBox="0 0 1520 810" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">信任不是授權：四道關卡</title><desc id="svgdesc">社交工程防線由外觀線索、身分驗證、行動授權及最低必要範圍依序組成。</desc>
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#2459A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrred" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#B34548" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrteal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#0A8277" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<filter id="sh" x="-10%" y="-15%" width="125%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#132942" flood-opacity="0.08"/></filter>
</defs>
<rect width="1520" height="810" fill="#F6F8FC"/>
<rect x="56" y="42" width="132" height="44" rx="22.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="122.0" y="71.7" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="650" letter-spacing="0" fill="#0A8277">M09-01</text><text x="210" y="83" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="43" font-weight="750" letter-spacing="0" fill="#15283C">信任不是授權：重要行動必須經過四道關卡</text><text x="60" y="137" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="400" letter-spacing="0" fill="#596C7D">看起來像本人，是「線索」；確認身分與核准這件事，才是「證據與決策」。</text><rect x="55" y="195" width="305" height="405" rx="20" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2" filter="url(#sh)"/><rect x="55" y="195" width="305" height="12" rx="6" fill="#FFF5DF" stroke="none" stroke-width="2"/><rect x="78" y="225" width="63" height="46" rx="23.0" fill="#FFF5DF" stroke="none" stroke-width="2"/><text x="109.5" y="256.4" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="650" letter-spacing="0" fill="#9D641C">01</text><text x="78" y="307" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="29" font-weight="740" letter-spacing="0" fill="#15283C">外觀與說法</text><text x="78" y="346" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="600" letter-spacing="0" fill="#9D641C">Trust Cues</text><text x="78" y="408" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">主管頭像、制服、聲音</text><text x="78" y="451" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">知道姓名與內部事情</text><text x="78" y="494" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">可能讓人覺得可信</text><text x="78" y="537" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">但不能證明真實身分</text><rect x="406" y="195" width="305" height="405" rx="20" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2" filter="url(#sh)"/><rect x="406" y="195" width="305" height="12" rx="6" fill="#EAF1FC" stroke="none" stroke-width="2"/><rect x="429" y="225" width="63" height="46" rx="23.0" fill="#EAF1FC" stroke="none" stroke-width="2"/><text x="460.5" y="256.4" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="650" letter-spacing="0" fill="#2459A6">02</text><text x="429" y="307" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="29" font-weight="740" letter-spacing="0" fill="#15283C">確認身分</text><text x="429" y="346" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="600" letter-spacing="0" fill="#2459A6">Authentication</text><text x="429" y="408" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">使用事先已知的管道</text><text x="429" y="451" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">核實現在是誰在要求</text><text x="429" y="494" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">不使用訊息附的新電話</text><text x="429" y="537" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">必要時查證帳號狀態</text><rect x="757" y="195" width="305" height="405" rx="20" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2" filter="url(#sh)"/><rect x="757" y="195" width="305" height="12" rx="6" fill="#E5F5F1" stroke="none" stroke-width="2"/><rect x="780" y="225" width="63" height="46" rx="23.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="811.5" y="256.4" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="650" letter-spacing="0" fill="#0A8277">03</text><text x="780" y="307" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="29" font-weight="740" letter-spacing="0" fill="#15283C">確認行動授權</text><text x="780" y="346" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="600" letter-spacing="0" fill="#0A8277">Authorization</text><text x="780" y="408" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">確認這件事是否被核准</text><text x="780" y="451" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">資料能否交給這個人</text><text x="780" y="494" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">核准目的地是否正確</text><text x="780" y="537" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">急件也不能省略流程</text><rect x="1108" y="195" width="305" height="405" rx="20" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2" filter="url(#sh)"/><rect x="1108" y="195" width="305" height="12" rx="6" fill="#E5F5F1" stroke="none" stroke-width="2"/><rect x="1131" y="225" width="63" height="46" rx="23.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="1162.5" y="256.4" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="650" letter-spacing="0" fill="#075C56">04</text><text x="1131" y="307" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="29" font-weight="740" letter-spacing="0" fill="#15283C">限制執行範圍</text><text x="1131" y="346" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="600" letter-spacing="0" fill="#075C56">Least Privilege</text><text x="1131" y="408" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">只提供必要的資料</text><text x="1131" y="451" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">僅使用核准的管道</text><text x="1131" y="494" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">記錄執行時間與內容</text><text x="1131" y="537" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#596C7D">有疑慮就暫停並通報</text><path d="M367 405 L394 405" fill="none" stroke="#2459A6" stroke-width="3" marker-end="url(#arr)" stroke-linecap="round"/><path d="M718 405 L745 405" fill="none" stroke="#2459A6" stroke-width="3" marker-end="url(#arr)" stroke-linecap="round"/><path d="M1069 405 L1096 405" fill="none" stroke="#2459A6" stroke-width="3" marker-end="url(#arr)" stroke-linecap="round"/><rect x="54" y="640" width="1410" height="115" rx="18" fill="#FFF0EF" stroke="none" stroke-width="2"/><text x="86" y="686" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="28" font-weight="750" letter-spacing="0" fill="#B34548">危險捷徑：</text><text x="246" y="686" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="28" font-weight="620" letter-spacing="0" fill="#B34548">看起來像主管 → 直接上傳敏感文件</text><text x="87" y="730" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" letter-spacing="0" fill="#15283C">這條路跳過身分驗證與授權；就算對方真的是主管，也可能違反資料處理規定。</text><text x="1460" y="789" text-anchor="end" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="450" letter-spacing="0" fill="#596C7D">CEH M09-01  •  概念圖 1 / 4</text>
</svg>
