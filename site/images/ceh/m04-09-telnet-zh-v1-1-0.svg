<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 409.14000000000004" role="img" aria-labelledby="m0409-telnet-zh-title m0409-telnet-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-telnet-zh-title">Telnet：登入提示與登入後畫面分開判讀</title><desc id="m0409-telnet-zh-desc">參考圖含 guest 登入與歡迎文字；此處用合成終端紀錄分開兩種狀態，沒有連線到圖中的網站。兩欄比較，不代表登入一定成功。</desc><defs><marker id="m0409-telnet-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Telnet：登入提示與登入後畫面分開判讀</text><rect x="40.0" y="101.6" width="442.5" height="204" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">僅看到登入提示</text><text x="56.0" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">login:</text><text x="56.0" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">這只能證明登入入口回應，尚無帳號通過驗證</text><text x="56.0" y="233.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">的證據。</text><rect x="517.5" y="101.6" width="442.5" height="204" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="533.5" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">合成登入後示意</text><text x="533.5" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">login: guest
Welcome to the</text><text x="533.5" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">training terminal.</text><text x="533.5" y="233.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">歡迎文字是另一個觀察層次；可用指令與資源</text><text x="533.5" y="265.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">仍受帳號權限限制。</text><text x="28" y="370.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">參考圖含 guest 登入與歡迎文字；此處用合成終端紀錄分開兩種狀態，沒有連線到圖中的網站。兩欄比</text><text x="28" y="402.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">較，不代表登入一定成功。</text></g></svg>
