<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-labelledby="title desc">
<title id="title">真的 OTP，也可能被轉交</title><desc id="desc">合成情境：驗證碼是真的，索取它的人卻可能是假的。每個平台的條件不同。 攻擊者發起請求: 嘗試登入或帳號復原；仍須滿足平台的其他驗證條件。 真正的平台發送 OTP: 平台把該次操作的驗證碼送到小林的手機。 小林收到真碼與假電話: 手機收到真的 OTP；同時有人冒充客服要求念出它。 小林把碼交給冒充者: 驗證碼由持有人轉交給攻擊者，而不是自行在可信入口使用。 攻擊者嘗試提交驗證碼: 把碼送回真正的平台；是否成功仍取決於其他條件與實際紀錄。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker></defs>
<rect width="1000" height="1250" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="42" y="37" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · 圖 3</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">真的 OTP，也可能被轉交</text>
<text x="42" y="135" font-size="18" font-weight="400" fill="#43576a" text-anchor="start">合成情境：驗證碼是真的，索取它的人卻可能是假的。每個平台的條件不同。</text>
<rect x="80" y="210" width="840" height="160" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="104" y="249" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">01  攻擊者發起請求</text>
<text x="104" y="292" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">嘗試登入或帳號復原；仍須滿足平台的其他驗證條件。</text>
<path d="M 500 370 L 500 386" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="394" width="840" height="160" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="104" y="433" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">02  真正的平台發送 OTP</text>
<text x="104" y="476" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">平台把該次操作的驗證碼送到小林的手機。</text>
<path d="M 500 554 L 500 570" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="578" width="840" height="160" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="104" y="617" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">03  小林收到真碼與假電話</text>
<text x="104" y="660" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">手機收到真的 OTP；同時有人冒充客服要求念出它。</text>
<path d="M 500 738 L 500 754" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="762" width="840" height="160" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="104" y="801" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">04  小林把碼交給冒充者</text>
<text x="104" y="844" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">驗證碼由持有人轉交給攻擊者，而不是自行在可信入口使用。</text>
<path d="M 500 922 L 500 938" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="946" width="840" height="160" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="104" y="985" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">05  攻擊者嘗試提交驗證碼</text>
<text x="104" y="1028" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">把碼送回真正的平台；是否成功仍取決於其他條件與實際紀錄。</text>
<text x="42" y="1196" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">取得驗證碼 ≠ 一定登入成功；須符合其他條件，再用紀錄確認結果。</text>
</g></svg>
