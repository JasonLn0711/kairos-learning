<text x="660.0" y="549.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">並非獨立證明</text>
<line x1="28" y1="601" x2="772" y2="601" stroke="#64748b" stroke-width="1"/>
<text x="28" y="626" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">→ 實線：訊息接觸方向。虛線框：共同控制邊界。</text>
<text x="28" y="653" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">風險：把一致說法誤當成獨立身分證明。</text>
