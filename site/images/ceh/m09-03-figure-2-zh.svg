<text x="28" y="70" font-size="28" font-weight="700" fill="#172b3a" text-anchor="start">同一來源，兩個看似獨立的管道</text>
<text x="28" y="111" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">虛構案例假設：攻擊者同時安排 SMS 與 Voice。</text>
