<text x="382.5" y="258.5" font-size="23" font-weight="700" fill="#92400e" text-anchor="middle">SMS</text>
<text x="382.5" y="289.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">「帳號異常」</text>
