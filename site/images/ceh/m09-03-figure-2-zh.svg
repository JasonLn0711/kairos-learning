<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">兩個管道，不等於兩份獨立證明</title><desc id="desc">同一個攻擊者安排簡訊與電話，讓小林誤以為兩邊互相佐證。 同一個攻擊者: 同時安排簡訊與語音接觸；控制來源沒有變成兩個。 簡訊 SMS: 攻擊者傳送「帳號出現異常」，引導小林處理假事件。 電話 Voice: 同一方來電自稱資訊客服，提到剛才的簡訊。 小林收到兩段接觸: 一致說法可能只是同源安排，不能單獨證明客服身分。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker></defs>
<rect width="1000" height="760" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="42" y="37" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · 圖 2</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">兩個管道，不等於兩份獨立證明</text>
<text x="42" y="135" font-size="18" font-weight="400" fill="#43576a" text-anchor="start">同一個攻擊者安排簡訊與電話，讓小林誤以為兩邊互相佐證。</text>
<rect x="340" y="178" width="320" height="115" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="500" y="218" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="middle">同一個攻擊者</text>
<text x="500" y="252" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">安排兩段接觸</text>
<path d="M 410 293 L 410 320 L 260 320 L 260 350" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 590 293 L 590 320 L 740 320 L 740 350" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="42" y="360" width="436" height="150" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="399" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="start">簡訊 SMS</text>
<text x="66" y="443" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">「帳號出現異常」</text>
<rect x="522" y="360" width="436" height="150" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="546" y="399" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="start">電話 Voice</text>
<text x="546" y="443" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">「我就是資訊客服」</text>
<path d="M 260 510 L 260 540 L 410 540 L 410 570" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 740 510 L 740 540 L 590 540 L 590 570" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="300" y="580" width="400" height="105" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="500" y="620" font-size="23" font-weight="700" fill="#0f766e" text-anchor="middle">小林：收到相同說法</text>
<text x="500" y="654" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">但來源並不獨立</text>
<text x="42" y="714" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">箭頭表示訊息接觸；兩邊都可能由同一來源控制。</text>
</g></svg>
