<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 956.7" role="img" aria-labelledby="m0501-terms-en-title m0501-terms-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0501-terms-en-title">Figure 1 | Assets, vulnerabilities, threats, exploits, attacks and risk</title><desc id="m0501-terms-en-desc">An asset may have a vulnerability. A threat and an exploit are distinct concepts. An attack requires separate evidence; risk combines likelihood and loss rather than being an inevitable final stage.</desc><defs><marker id="m0501-terms-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 1 | Assets, vulnerabilities, threats, exploits,</text><text x="28" y="83.6" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">attacks and risk</text><rect x="40.0" y="150" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="184.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Asset</text><text x="60.0" y="221.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Member data, orders and system services</text><rect x="40.0" y="299" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="333.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Vulnerability</text><text x="60.0" y="370.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Member A may be able to read member B’s orders</text><rect x="40.0" y="448" width="448.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="482.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Threat</text><text x="60.0" y="519.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Someone wants to steal data</text><text x="60.0" y="551.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">that does not belong to them</text><rect x="512.0" y="448" width="448.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="532.0" y="482.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Exploit</text><text x="532.0" y="519.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">A request method that triggers</text><text x="532.0" y="551.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">an authorization defect</text><rect x="40.0" y="629" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="663.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Attack</text><text x="60.0" y="700.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">An actual attempt to exploit the defect to access orders</text><rect x="40.0" y="778" width="920.0" height="121" rx="16" fill="#fcf2ef" stroke="#47748e" stroke-width="2" /><text x="60.0" y="812.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Risk</text><text x="60.0" y="849.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Assessment of event likelihood and resulting loss</text><text x="28" y="939.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">An asset may have a vulnerability. A threat and an exploit are distinct</text><text x="28" y="971.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">concepts. An attack requires separate evidence; risk combines likelihood</text><text x="28" y="1003.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">and loss rather than being an inevitable final stage.</text></g></svg>
