<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1175" viewBox="0 0 1000 1175" role="img" aria-labelledby="title desc">
<title id="title">把 M09-03 接回 CEH 知識地圖</title><desc id="desc">概念關聯，不是固定攻擊順序。合法授權與交戰規則約束整個測試與調查過程。 M09｜社交工程: 辨認釣魚、身分冒充與跨管道信任。 M02／M04｜偵察與列舉: 蒐集目標與環境線索；有線索不等於已入侵。 M01-04／05｜攻擊分析: 從攻擊向量與實際行為分析；ATT&amp;CK 分類不是成功證明。 M01-01／02｜安全與風險: CIA、資產、威脅、弱點與後果。 M01-06｜防護措施: 身分驗證、最小權限與縱深防禦。 M01-07｜事件應變: 偵測、圍堵、調查、復原與改善。 M01-03｜合法授權與 ROE: 安全測試與調查都必須在明確授權與範圍內。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker></defs>
