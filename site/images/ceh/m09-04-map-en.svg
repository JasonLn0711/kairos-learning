<svg xmlns="http://www.w3.org/2000/svg" width="900" height="810" viewBox="0 0 900 810" role="img" aria-labelledby="m0904-f1-en-title m0904-f1-en-desc"><title id="m0904-f1-en-title">Three tactics. One mistaken trust leap.</title><desc id="m0904-f1-en-desc">Three separate concept-association branches identify pretexting, baiting, and tailgating. Dotted lines have no arrowheads and do not depict events or a causal sequence.</desc><defs><marker id="m0904-f1-en-a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2774a7" /></marker><marker id="m0904-f1-en-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18785d" /></marker><marker id="m0904-f1-en-a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b14d55" /></marker><marker id="m0904-f1-en-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7d" /></marker></defs><g transform="scale(0.9)"><rect width="1000" height="900" fill="#f7fafc" /><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="44" y="38" fill="#2774a7" font-size="20" font-weight="700" text-anchor="start">CEH M09-04  /  01  /  NORTHSTAR · SYNTHETIC SCENARIO</text><text x="44" y="87" fill="#193449" font-size="31" font-weight="700" text-anchor="start">Three tactics. One mistaken trust leap.</text><text x="44" y="124" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">Reason, reward, and entry are lenses—not a required sequence.</text><path d="M270 310 C270 342 355 346 355 375" fill="none" stroke="#536b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8" /><path d="M730 310 C730 342 645 346 645 375" fill="none" stroke="#536b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8" /><path d="M500 525 V591" fill="none" stroke="#536b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8" /><rect x="45" y="180" width="440" height="130" rx="18" fill="#edf6fc" stroke="#2774a7" stroke-width="1.5" /><text x="69" y="218" fill="#2774a7" font-size="24" font-weight="700" text-anchor="start">REASON · Pretexting</text><text x="69" y="255" fill="#193449" font-size="20" font-weight="400" text-anchor="start">A fabricated scenario makes a request</text><text x="69" y="284" fill="#193449" font-size="20" font-weight="400" text-anchor="start">seem legitimate. A story is not permission.</text><rect x="515" y="180" width="440" height="130" rx="18" fill="#fff5dd" stroke="#946114" stroke-width="1.5" /><text x="539" y="218" fill="#946114" font-size="24" font-weight="700" text-anchor="start">REWARD · Baiting</text><text x="539" y="255" fill="#193449" font-size="20" font-weight="400" text-anchor="start">A reward or curiosity invites unsafe action.</text><text x="539" y="284" fill="#193449" font-size="20" font-weight="400" text-anchor="start">Appeal is not evidence of trust.</text><rect x="240" y="375" width="520" height="150" rx="18" fill="#ffffff" stroke="#2774a7" stroke-width="1.5" /><text x="500" y="425" fill="#193449" font-size="27" font-weight="700" text-anchor="middle">Plausibility ≠ authorization</text><text x="500" y="467" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">People, devices, and spaces have access boundaries.</text><text x="500" y="497" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">Verify permission for this specific action.</text><rect x="280" y="591" width="440" height="133" rx="18" fill="#eaf6ef" stroke="#18785d" stroke-width="1.5" /><text x="304" y="632" fill="#18785d" font-size="24" font-weight="700" text-anchor="start">ENTRY · Tailgating</text><text x="304" y="670" fill="#193449" font-size="20" font-weight="400" text-anchor="start">Following an authorized person into a</text><text x="304" y="699" fill="#193449" font-size="20" font-weight="400" text-anchor="start">restricted area does not grant permission.</text><path d="M280 766 H339" fill="none" stroke="#536b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8" /><text x="355" y="773" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">Concept association—not time or causation</text><path d="M44 804 H956" fill="none" stroke="#bdcbd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="839" fill="#193449" font-size="20" font-weight="500" text-anchor="start">Identify the requested action and the boundary—not only the story.</text><text x="44" y="870" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">One event can involve several tactics. This is not an attack flow.</text></g></g></svg>