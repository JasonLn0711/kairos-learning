<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 526" role="img" aria-labelledby="title desc"><title id="title">文件保存、事件通知、分析處理</title><desc id="desc">此圖重述原有文件案例；SMB 保存文件，Kafka 傳遞事件，應用程式執行工作。</desc><rect x="1" y="1" width="678" height="524" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">文件保存、事件通知、分析處理</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">1. 使用者 → SMB</text><text x="40" y="120" font-size="17">放入 PDF；檔案伺服器保存文件。</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">2. 監控程式 → Kafka</text><text x="40" y="215" font-size="17">發出 document.uploaded，帶位置與識別碼。</text><rect x="24" y="256" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">3. AI 服務</text><text x="40" y="310" font-size="17">讀取事件，再依權限從 SMB 讀取 PDF 並分析。</text><rect x="24" y="351" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="379" font-size="19" font-weight="bold">4. 報告服務</text><text x="40" y="405" font-size="17">收到完成事件後產生報告、通知使用者。</text><text x="24" y="466" font-size="17">此圖重述原有文件案例；SMB 保存文件，Kafka</text><text x="24" y="491" font-size="17">傳遞事件，應用程式執行工作。</text></g></svg>
