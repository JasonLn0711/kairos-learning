<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 807.84" role="img" aria-labelledby="m0409-acceptance-zh-title m0409-acceptance-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-acceptance-zh-title">圖 3｜模擬驗收：財務資料的存取權限</title><desc id="m0409-acceptance-zh-desc">教學案例：以下皆為合成測試結果。切換身分，對照政策與觀察；固定假設是普通員工存在越權讀取，另外兩個案例符合各自受測操作的政策。沒有連線或實際登入，也不代表整台系統已通過驗收。</desc><defs><marker id="m0409-acceptance-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 3｜模擬驗收：財務資料的存取權限</text><rect x="40" y="101.6" width="920" height="204" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">外部訪客</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">政策預期：不能讀公告或財務資料</text><text x="56" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">實際觀察：公告與財務資料均拒絕讀取</text><text x="56" y="233.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">受測操作符合政策</text><text x="56" y="265.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">仍須核對核准員工的正常業務功能。</text><rect x="40" y="325.6" width="920" height="204" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="357.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">普通員工</text><text x="56" y="393.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">政策預期：能讀公告，但不能讀財務資料</text><text x="56" y="425.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">實際觀察：公告可讀，但也能開啟薪資清單</text><text x="56" y="457.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">發現不符合政策的行為</text><text x="56" y="489.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">發現越權讀取，應檢查檔案與群組的有效權限。</text><rect x="40" y="549.6" width="920" height="204" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="581.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">財務人員</text><text x="56" y="617.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">政策預期：能讀公告及財務資料</text><text x="56" y="649.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">實際觀察：公告與財務資料均可讀</text><text x="56" y="681.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">受測操作符合政策</text><text x="56" y="713.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">這只驗證讀取；修改與刪除權限須另依政策測試。</text><text x="28" y="813.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">教學案例：以下皆為合成測試結果。切換身分，對照政策與觀察；固定假設是普通員工存在越權讀取，另外</text><text x="28" y="845.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">兩個案例符合各自受測操作的政策。沒有連線或實際登入，也不代表整台系統已通過驗收。</text></g></svg>
