<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 765" role="img" aria-labelledby="m0201-f1-zh-m02-01-paths-zh-TW-title m0201-f1-zh-m02-01-paths-zh-TW-desc" preserveAspectRatio="xMidYMid meet"><title id="m0201-f1-zh-m02-01-paths-zh-TW-title">圖 1｜同一個目的，不同互動路徑</title><desc id="m0201-f1-zh-m02-01-paths-zh-TW-desc">上半部箭頭＝向第三方取資料；下半部箭頭＝直接與目標互動；被動不等於全世界都沒有流量</desc><defs><marker id="m0201-f1-zh-m02-01-paths-zh-TW-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a" /></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="765" rx="22" fill="#f6f9fb" /><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">圖 1｜同一個目的，不同互動路徑</text><rect x="30" y="85" width="540" height="80" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="119" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">路徑 A：讀取既有資料</text><rect x="30" y="195" width="210" height="100" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="229" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">我</text><rect x="330" y="195" width="240" height="100" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="350" y="229" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">第三方平台</text><path d="M245,245 L323,245" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0201-f1-zh-m02-01-paths-zh-TW-arrow)" /><text x="30" y="340" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">目標未必收到這次查詢；平台仍可能記錄</text><rect x="30" y="385" width="540" height="80" rx="16" fill="#fff0d5" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="419" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">路徑 B：直接探查</text><rect x="30" y="495" width="210" height="100" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="529" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">我</text><rect x="330" y="495" width="240" height="100" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5" /><text x="350" y="529" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">目標系統</text><path d="M245,545 L323,545" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0201-f1-zh-m02-01-paths-zh-TW-arrow)" /><text x="30" y="654" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">上半部箭頭＝向第三方取資料</text><text x="30" y="683" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">下半部箭頭＝直接與目標互動</text><text x="30" y="712" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">被動不等於全世界都沒有流量</text></g></svg>