<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1207.8000000000002" role="img" aria-labelledby="m0506-gates-zh-title m0506-gates-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0506-gates-zh-title">掃描的三道關卡</title><desc id="m0506-gates-zh-desc">從任務狀態逐項核對設定、認證與覆蓋，再依實際證據判讀。</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">掃描的三道關卡</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">從任務狀態逐項核對設定、認證與覆蓋，再依實際證據判讀。</text><rect x="28" y="152.8" width="844" height="133.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="188.8" font-size="23" fill="#18252c" font-weight="700">掃描任務已經結束</text><text x="48" y="230.20000000000002" font-size="20" fill="#18252c">這只是工作狀態，不是安全結論</text><path d="M450 298.20000000000005v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="340.20000000000005" width="844" height="181.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="376.20000000000005" font-size="23" fill="#18252c" font-weight="700">第一關：設定（Configuration）</text><text x="48" y="417.6" font-size="20" fill="#18252c">這次掃描真的有使用你設定的帳號嗎？</text><text x="48" y="465.6" font-size="20" fill="#18252c">帳號放進掃描工具，不代表已指派給目標。</text><path d="M450 533.6v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="575.6" width="844" height="181.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="611.6" font-size="23" fill="#18252c" font-weight="700">第二關：認證（Authentication）</text><text x="48" y="653.0" font-size="20" fill="#18252c">目標系統有沒有接受這個帳號？</text><text x="48" y="701.0" font-size="20" fill="#18252c">帳號過期、SSH 連不上、帳號被鎖，都可能失敗。</text><path d="M450 769.0v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="811.0" width="844" height="181.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="847.0" font-size="23" fill="#18252c" font-weight="700">第三關：覆蓋（Coverage）</text><text x="48" y="888.4" font-size="20" fill="#18252c">登入後，必要的檢查項目真的有成功執行嗎？</text><text x="48" y="936.4" font-size="20" fill="#18252c">能登入，不代表有權讀取套件清單、設定或紀錄。</text><path d="M450 1004.4v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="1046.4" width="844" height="133.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="1082.4" font-size="23" fill="#18252c" font-weight="700">依據實際取得的證據判讀</text><text x="48" y="1123.8000000000002" font-size="20" fill="#18252c">說明已確認事項、未完成檢查及未知風險</text></g></svg>
