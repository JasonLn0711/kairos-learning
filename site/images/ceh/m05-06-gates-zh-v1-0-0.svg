<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 573.3000000000001" role="img" aria-labelledby="m0503-gates-zh-title m0503-gates-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-gates-zh-title">圖 2｜三項證據分別記錄</title><desc id="m0503-gates-zh-desc">依診斷順序核對三項狀態；前一項成功不自動證明下一項成功，沒有自動通過或權限提升。</desc><defs><marker id="m0503-gates-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 2｜三項證據分別記錄</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">依診斷順序核對三項狀態；前一項成功不自動證明下一項成功，沒有自動通過或權限提升。</text><rect x="40.0" y="170" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">1｜設定生效</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">確認這次工作對這個目標啟用了正確憑證；存進工具不等於已使用。</text><rect x="40.0" y="319" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="353.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">2｜認證成功</text><text x="60.0" y="390.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">確認目標與服務接受身分；一台成功不代表整批成功。</text><rect x="40.0" y="468" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="502.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">3｜必要檢查完成</text><text x="60.0" y="539.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">確認權限與輸出足以取得指定證據，並記錄失敗或缺漏；登入成功不能替代這項證據。</text></g></svg>
