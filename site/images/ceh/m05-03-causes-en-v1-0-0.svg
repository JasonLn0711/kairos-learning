<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1129.5" role="img" aria-labelledby="m0503-causes-en-title m0503-causes-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-causes-en-title">Figure 1 | Five causes of vulnerabilities</title><desc id="m0503-causes-en-desc">Use causes to assign remediation. Categories can overlap; numbers identify entries, not a sequence.</desc><defs><marker id="m0503-causes-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 1 | Five causes of vulnerabilities</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Use causes to assign remediation. Categories can overlap; numbers identify</text><text x="28" y="140.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">entries, not a sequence.</text><rect x="40.0" y="202" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="236.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">1. Design Flaw</text><text x="60.0" y="273.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The bank never specified who may enter the vault.

The institution or</text><text x="60.0" y="305.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">system rules were incomplete from the start.</text><rect x="40.0" y="383" width="920.0" height="185" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="417.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">2. Implementation Flaw</text><text x="60.0" y="454.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The rule permits only the manager, but the engineer forgot to check</text><text x="60.0" y="486.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">identity in the access-control code.

The rule is correct; the</text><text x="60.0" y="518.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">program implements it incorrectly.</text><rect x="40.0" y="596" width="920.0" height="185" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="630.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">3. Misconfiguration</text><text x="60.0" y="667.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The access-control system supports authentication, but an</text><text x="60.0" y="699.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">administrator allows everyone to enter.

The feature works; its</text><text x="60.0" y="731.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">configuration is unsafe.</text><rect x="40.0" y="809" width="920.0" height="185" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="843.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">4. Unpatched Vulnerability</text><text x="60.0" y="880.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The vendor has released an update for a known flaw in the</text><text x="60.0" y="912.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">access-control version, but the bank has not installed it.

A fix</text><text x="60.0" y="944.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">exists, but patching is incomplete.</text><rect x="40.0" y="1022" width="920.0" height="185" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="1056.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">5. Process Weakness</text><text x="60.0" y="1093.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">A manager has left the bank, but the bank has not revoked the</text><text x="60.0" y="1125.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">manager’s access.

Personnel management or maintenance procedures are</text><text x="60.0" y="1157.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">incomplete.</text></g></svg>
