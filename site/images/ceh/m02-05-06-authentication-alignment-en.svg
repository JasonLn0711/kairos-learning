<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-labelledby="m0205-f6-en-title m0205-f6-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0205-f6-en-title">6 | Read DMARC through domain alignment</title>
<desc id="m0205-f6-en-desc">Domain in the visible From address / From: notice@coffee.example / Alignment reference: coffee.example；SPF: pass; alignment: no match / MAIL FROM domain: mailer.example / Source passes that domain’s SPF check；DKIM: pass; alignment: match / d=coffee.example; s=selector1 / Signing domain matches the From domain；DMARC: pass / Aligned SPF pass OR aligned DKIM pass / The DKIM path meets the condition here</desc>
<rect x="1" y="1" width="598" height="748" rx="20" fill="#f8fafc" stroke="#b7c7d5" />
<text x="300" y="37" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">6 | Read DMARC through domain alignment</text>
<rect x="26" y="64" width="548" height="112" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="300" y="93" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Domain in the visible From address</text>
<text x="300" y="120" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">From: notice@coffee.example</text>
<text x="300" y="147" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Alignment reference: coffee.example</text>
<rect x="26" y="192" width="548" height="112" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="300" y="221" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">SPF: pass; alignment: no match</text>
<text x="300" y="248" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">MAIL FROM domain: mailer.example</text>
<text x="300" y="275" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Source passes that domain’s SPF check</text>
<rect x="26" y="320" width="548" height="112" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="300" y="349" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">DKIM: pass; alignment: match</text>
<text x="300" y="376" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">d=coffee.example; s=selector1</text>
<text x="300" y="403" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Signing domain matches the From domain</text>
<rect x="26" y="448" width="548" height="112" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="300" y="477" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">DMARC: pass</text>
<text x="300" y="504" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Aligned SPF pass OR aligned DKIM pass</text>
<text x="300" y="531" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">The DKIM path meets the condition here</text>
<text x="300" y="610" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">DKIM public-key lookup name:</text>
<text x="300" y="637" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">selector1._domainkey.coffee.example</text>
<text x="300" y="664" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">d names the signing domain; s selects its key record</text>
</svg>