<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700.74" role="img" aria-labelledby="m0504-lookup-zh-title m0504-lookup-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0504-lookup-zh-title">圖 3｜公開資料到現場查證</title><desc id="m0504-lookup-zh-desc">建議查證順序；資料完整度與更新先後需逐案核對。</desc><g transform="scale(.9)" font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c">圖 3｜公開資料到現場查證</text><text x="28" y="96.19999999999999" font-size="20" fill="#18252c">建議查證順序；資料完整度與更新先後需逐案核對。</text><text x="46.0" y="180.2" font-size="23" fill="#18252c">CVE 官方紀錄</text><text x="46.0" y="219.29999999999998" font-size="20" fill="#18252c">這個漏洞是什麼？編號是否有效？有哪些參考資料？</text><path d="M500 275.29999999999995v24m-6-6 6 6 6-6" fill="none" stroke="#64748b" stroke-width="3" /><text x="46.0" y="345.29999999999995" font-size="23" fill="#18252c">NVD 補充分析</text><text x="46.0" y="384.4" font-size="20" fill="#18252c">可能受影響的產品條件、CWE 類型、CVSS 嚴重度等（視資料完整程度）</text><path d="M500 440.4v24m-6-6 6 6 6-6" fill="none" stroke="#64748b" stroke-width="3" /><text x="46.0" y="510.4" font-size="23" fill="#18252c">廠商安全公告</text><text x="46.0" y="549.5" font-size="20" fill="#18252c">哪些版本真的受影響？有什麼限制？應更新到哪個版本？</text><path d="M500 605.5v24m-6-6 6 6 6-6" fill="none" stroke="#64748b" stroke-width="3" /><rect x="28.0" y="645.5" width="944.0" height="113.1" rx="12" fill="#ffffff" stroke="#94a3b8" /><text x="46.0" y="675.5" font-size="23" fill="#18252c">自己的系統與資產紀錄</text><text x="46.0" y="714.6" font-size="20" fill="#18252c">實際安裝版本、設定、修補狀態及執行中的元件</text></g></svg>
