<svg xmlns="http://www.w3.org/2000/svg" width="900" height="810" viewBox="0 0 900 810" role="img" aria-labelledby="m0904-f2-zh-title m0904-f2-zh-desc"><title id="m0904-f2-zh-title">先驗證身分，再核對這次權限</title><desc id="m0904-f2-zh-desc">An unverified request enters an independent verification process. Only verified identity and explicit authorization for the specific action lead to narrowly scoped access; unknown or failed verification leads to stopping and referral.</desc><defs><marker id="m0904-f2-zh-a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2774a7" /></marker><marker id="m0904-f2-zh-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18785d" /></marker><marker id="m0904-f2-zh-a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b14d55" /></marker><marker id="m0904-f2-zh-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7d" /></marker></defs><g transform="scale(0.9)"><rect width="1000" height="900" fill="#f7fafc" /><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="44" y="38" fill="#2774a7" font-size="20" font-weight="700" text-anchor="start">CEH M09-04  /  02  /  NORTHSTAR · 合成情境</text><text x="44" y="87" fill="#193449" font-size="31" font-weight="700" text-anchor="start">先驗證身分，再核對這次權限</text><text x="44" y="124" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">Pretexting｜可信的姓名、職稱或真實身分，都不能代替本次授權。</text><rect x="220" y="172" width="560" height="102" rx="18" fill="#fff5dd" stroke="#946114" stroke-width="1.5" /><text x="500" y="211" fill="#946114" font-size="24" font-weight="700" text-anchor="middle">收到請求：提供資料／變更存取</text><text x="500" y="248" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">目前狀態：尚未查證，不先執行</text><path d="M500 274 V357" fill="none" stroke="#536b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f2-zh-a-muted)" /><path d="M44 319 H410 M590 319 H956" fill="none" stroke="#2774a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" /><text x="65" y="309" fill="#2774a7" font-size="20" font-weight="700" text-anchor="start">信任來源分界</text><rect x="190" y="357" width="620" height="169" rx="18" fill="#edf6fc" stroke="#2774a7" stroke-width="1.5" /><text x="500" y="398" fill="#2774a7" font-size="23" font-weight="700" text-anchor="middle">使用既有可信通訊錄／正式服務台</text><text x="500" y="440" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">① 獨立確認身分與請求真實性</text><text x="500" y="476" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">② 確認這次資料、系統、範圍與時限的授權</text><path d="M500 526 V561 H265 V631" fill="none" stroke="#18785d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f2-zh-a-green)" /><path d="M500 561 H735 V631" fill="none" stroke="#b14d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f2-zh-a-red)" /><rect x="183" y="580" width="164" height="34" rx="5" fill="#f7fafc" stroke="#f7fafc" stroke-width="1.5" /><rect x="636" y="580" width="198" height="34" rx="5" fill="#f7fafc" stroke="#f7fafc" stroke-width="1.5" /><text x="265" y="605" fill="#18785d" font-size="20" font-weight="700" text-anchor="middle">兩者都確認</text><text x="735" y="605" fill="#b14d55" font-size="20" font-weight="700" text-anchor="middle">不符／仍不確定</text><rect x="45" y="631" width="440" height="139" rx="18" fill="#eaf6ef" stroke="#18785d" stroke-width="1.5" /><text x="265" y="672" fill="#18785d" font-size="22" font-weight="700" text-anchor="middle">依流程、最小必要範圍執行</text><text x="265" y="714" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">僅給核准的對象、內容與時限。</text><text x="265" y="744" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">留下可追溯的紀錄。</text><rect x="515" y="631" width="440" height="139" rx="18" fill="#fceef0" stroke="#b14d55" stroke-width="1.5" /><text x="735" y="672" fill="#b14d55" font-size="23" font-weight="700" text-anchor="middle">停止並轉交適當窗口</text><text x="735" y="714" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">不以催促或故事細節補足授權。</text><text x="735" y="744" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">交由正式服務台／主管確認。</text><path d="M44 804 H956" fill="none" stroke="#bdcbd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="839" fill="#193449" font-size="20" font-weight="500" text-anchor="start">真人 ≠ 有權限；換一個 App ≠ 獨立查證。</text><text x="44" y="870" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">實線箭頭＝這個防禦決策流程；藍色虛線＝信任來源分界。</text></g></g></svg>