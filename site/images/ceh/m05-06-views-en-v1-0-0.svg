<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554.4" role="img" aria-labelledby="m0503-views-en-title m0503-views-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-views-en-title">Figure 1 | Two parallel observation paths</title><desc id="m0503-views-en-desc">Arrows within each card describe an evidence path. The cards complement each other; they imply neither sequence, privilege escalation nor complete coverage.</desc><defs><marker id="m0503-views-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 1 | Two parallel observation paths</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Arrows within each card describe an evidence path. The cards complement</text><text x="28" y="140.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">each other; they imply neither sequence, privilege escalation nor complete</text><text x="28" y="172.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">coverage.</text><rect x="40.0" y="234" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="268.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Unauthenticated perspective</text><text x="60.0" y="305.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Scanner without a login → Public service responses → Visible entry</text><text x="60.0" y="337.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">points and remote clues.</text><rect x="40.0" y="415" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="449.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Authenticated perspective</text><text x="60.0" y="486.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Scanner using an approved identity → Data the target permits it to</text><text x="60.0" y="518.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">access → Package, patch or configuration evidence.</text></g></svg>
