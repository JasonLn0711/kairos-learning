<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 621" role="img" aria-labelledby="title desc"><title id="title">A simplified SMB connection</title><desc id="desc">An existing session may be reused; guest access depends on configuration. Permissions still apply.</desc><rect x="1" y="1" width="678" height="619" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">A simplified SMB connection</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">1. Connect</text><text x="40" y="120" font-size="17">Reach the file server</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">2. Negotiate</text><text x="40" y="215" font-size="17">Agree on version and security capabilities</text><rect x="24" y="256" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">3. Authenticate</text><text x="40" y="310" font-size="17">Establish the identity</text><rect x="24" y="351" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="379" font-size="19" font-weight="bold">4. Authorize</text><text x="40" y="405" font-size="17">Check the requested resource operation</text><rect x="24" y="446" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="474" font-size="19" font-weight="bold">5. Transfer</text><text x="40" y="500" font-size="17">Read or change data when permitted</text><text x="24" y="561" font-size="17">An existing session may be reused; guest access depends on</text><text x="24" y="586" font-size="17">configuration. Permissions still apply.</text></g></svg>
