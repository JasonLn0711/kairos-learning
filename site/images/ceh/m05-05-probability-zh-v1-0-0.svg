<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430.8" role="img" aria-labelledby="m0505-probability-zh-title m0505-probability-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0505-probability-zh-title">圖 3｜假設某漏洞的 EPSS</title><desc id="m0505-probability-zh-desc">固定教學數值。藍色長條佔全長 20%，不表示修補進度或本機遭入侵的機率。</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">圖 3｜假設某漏洞的 EPSS</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">固定教學數值。藍色長條佔全長 20%，不表示修補進度或本機遭入侵的機率。</text><rect x="28" y="152.8" width="844" height="252.0" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="186.8" font-size="30" fill="#18252c" font-weight="700">0.20 = 20%</text><rect x="48" y="231.8" width="804" height="14" rx="7" fill="#e2e8f0" /><rect x="48" y="231.8" width="160.8" height="14" rx="7" fill="#3268a3" /><text x="48" y="266.8" font-size="20" fill="#18252c">代表模型預測，這個 CVE 在接下來 30 天於其觀測範圍內出現利用活動的機率約為</text><text x="48" y="302.8" font-size="20" fill="#18252c">20%。</text><text x="48" y="350.8" font-size="20" fill="#18252c">這是全球漏洞層級的預測，不是你的單一伺服器有 20% 的機率遭到入侵。</text></g></svg>
