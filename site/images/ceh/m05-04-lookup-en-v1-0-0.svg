<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 792.5400000000001" role="img" aria-labelledby="m0504-lookup-en-title m0504-lookup-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0504-lookup-en-title">Figure 3 | From public records to local verification</title><desc id="m0504-lookup-en-desc">Suggested investigation order; verify completeness and freshness for each case.</desc><g transform="scale(.9)" font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c">Figure 3 | From public records to local verification</text><text x="28" y="96.19999999999999" font-size="20" fill="#18252c">Suggested investigation order; verify completeness and freshness for each</text><text x="28" y="130.2" font-size="20" fill="#18252c">case.</text><text x="46.0" y="214.2" font-size="23" fill="#18252c">Official CVE record</text><text x="46.0" y="253.29999999999998" font-size="20" fill="#18252c">What is it? Is the ID valid? Which references are available?</text><path d="M500 309.29999999999995v24m-6-6 6 6 6-6" fill="none" stroke="#64748b" stroke-width="3" /><text x="46.0" y="379.29999999999995" font-size="23" fill="#18252c">NVD enrichment</text><text x="46.0" y="418.4" font-size="20" fill="#18252c">Affected product conditions, CWE types and CVSS severity, depending on</text><text x="46.0" y="452.4" font-size="20" fill="#18252c">completeness</text><path d="M500 508.4v24m-6-6 6 6 6-6" fill="none" stroke="#64748b" stroke-width="3" /><text x="46.0" y="578.4" font-size="23" fill="#18252c">Vendor advisory</text><text x="46.0" y="617.5" font-size="20" fill="#18252c">Which versions are affected? What conditions apply? Which update is</text><text x="46.0" y="651.5" font-size="20" fill="#18252c">needed?</text><path d="M500 707.5v24m-6-6 6 6 6-6" fill="none" stroke="#64748b" stroke-width="3" /><rect x="28.0" y="747.5" width="944.0" height="113.1" rx="12" fill="#ffffff" stroke="#94a3b8" /><text x="46.0" y="777.5" font-size="23" fill="#18252c">Local system and asset records</text><text x="46.0" y="816.6" font-size="20" fill="#18252c">Installed versions, configuration, patch status and running components</text></g></svg>
