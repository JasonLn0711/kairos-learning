<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="m0302-f4-zh-title m0302-f4-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0302-f4-zh-title">圖 4｜把探索結果接到可查核紀錄</title>
<desc id="m0302-f4-zh-desc">先保存回覆或逾時，再對照資產與政策；需要時做授權服務檢查，最後留下結果與負責人。</desc>
<defs><marker id="m0302-f4-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="598" height="698" rx="20" fill="#f8fafc" stroke="#b7c7d5" />
<text x="300" y="38" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">圖 4｜把探索結果接到可查核紀錄</text>
<rect x="32" y="68" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="300" y="97" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">保存直接觀察</text>
<text x="300" y="124" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">來源、目標、方法、時間與等待設定</text>
<text x="300" y="151" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">分別記 ARP、Echo 回覆或逾時</text>
<path d="M300 168V192" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0302-f4-zh-arrow)" />
<rect x="32" y="196" width="536" height="100" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="300" y="225" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">核對資產及網路情境</text>
<text x="300" y="252" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">設備歸屬、路由、VLAN、代理 ARP</text>
<text x="300" y="279" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">參照管理紀錄與 ICMP 政策</text>
<path d="M300 296V320" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0302-f4-zh-arrow)" />
<rect x="32" y="324" width="536" height="100" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="300" y="353" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">依任務補足檢查</text>
<text x="300" y="380" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">若要確認網站，查核核准服務</text>
<text x="300" y="407" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">把鏈路、IP 與應用層分開觀察</text>
<path d="M300 424V448" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0302-f4-zh-arrow)" />
<rect x="32" y="452" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="300" y="481" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">記錄結果與下一步</text>
<text x="300" y="508" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">已核實事項、待核原因、負責人</text>
<text x="300" y="535" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">依相同條件複查並保留版本</text>
<text x="300" y="608" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">所有探測依核定範圍、時段、速率與停止條件。</text>
</svg>