<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 701.4200000000001" role="img" aria-labelledby="m0408-search-zh-title m0408-search-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0408-search-zh-title">圖 8｜一次 LDAP 查詢如何發生</title><desc id="m0408-search-zh-desc">箭頭表示這個查詢的處理順序。回傳內容與查詢狀態要一起判讀，不能把成功回應當成全部資料可見。</desc><g transform="scale(0.85)"><rect width="1000" height="825.2" fill="#f7f9fb" /><g font-family="sans-serif" fill="#213547"><text x="28" y="38.0" font-size="26" font-weight="700">圖 8｜一次 LDAP 查詢如何發生</text><rect x="30" y="109.19999999999999" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="141.2" font-size="22" font-weight="700">1 · 應用程式或管理員</text><text x="46" y="184.6" font-size="20">我要查詢研發部員工。</text><path d="M500 227.2V253.2m-8 -8 8 8 8 -8" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="30" y="277.2" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="309.2" font-size="22" font-weight="700">2 · 送出 LDAP Search</text><text x="46" y="352.59999999999997" font-size="20">指定搜尋位置、範圍與條件。</text><path d="M500 395.2V421.2m-8 -8 8 8 8 -8" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="30" y="445.2" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="477.2" font-size="22" font-weight="700">3 · 目錄伺服器</text><text x="46" y="520.6" font-size="20">根據條件與存取權限查詢資料。</text><path d="M500 563.2V589.2m-8 -8 8 8 8 -8" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="30" y="613.2" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="645.2" font-size="22" font-weight="700">4 · 回傳結果</text><text x="46" y="688.6" font-size="20">小明、小華、小美……以及查詢狀態。</text><text x="28" y="761.2" font-size="20">箭頭表示這個查詢的處理順序。回傳內容與查詢狀態要一起判讀，不能把成功回應當成全部資料可見。</text></g></g></svg>