<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688.5" role="img" aria-labelledby="m0503-status-en-title m0503-status-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-status-en-title">Figure 2 | Three separate states for one finding</title><desc id="m0503-status-en-desc">These are the small check’s synthetic states, not three passed steps. Entry restriction, update reports and verification evidence cannot substitute for each other.</desc><defs><marker id="m0503-status-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 2 | Three separate states for one finding</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">These are the small check’s synthetic states, not three passed steps. Entry</text><text x="28" y="140.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">restriction, update reports and verification evidence cannot substitute for</text><text x="28" y="172.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">each other.</text><rect x="40.0" y="234" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="268.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Entry restriction | Complete</text><text x="60.0" y="305.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Retain scope and effectiveness evidence; do not infer a package fix.</text><rect x="40.0" y="383" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="417.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Update installation | Reported successful</text><text x="60.0" y="454.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Keep the change report; still confirm that the applicable version is</text><text x="60.0" y="486.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">installed and effective in the running system.</text><rect x="40.0" y="564" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="598.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Required checks | Incomplete</text><text x="60.0" y="635.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Authentication failed, leaving a gap. Do not report verification</text><text x="60.0" y="667.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">passed without successful checks and normal-service evidence.</text></g></svg>
