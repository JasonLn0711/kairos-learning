<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 865" role="img" aria-labelledby="m0906-f3-zh-m09-06-controls-zh-TW-title m0906-f3-zh-m09-06-controls-zh-TW-desc" preserveAspectRatio="xMidYMid meet"><title id="m0906-f3-zh-m09-06-controls-zh-TW-title">圖 3｜不同控制，保護不同關卡</title><desc id="m0906-f3-zh-m09-06-controls-zh-TW-desc">五組互補控制各自保護不同關卡，沒有單一控制能保證訊息內容或行動安全。</desc><defs><marker id="m0906-f3-zh-m09-06-controls-zh-TW-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a" /></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="865" rx="22" fill="#f6f9fb" /><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">圖 3｜不同控制，保護不同關卡</text><text x="30" y="83" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">互補控制，不是「每封信都依序通過」的保證</text><rect x="48" y="110" width="522" height="112" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="68" y="144" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">郵件來源</text><text x="68" y="180" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">SPF／DKIM／DMARC</text><text x="68" y="210" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">不是內容安全保證</text><text x="25" y="172" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">1</text><rect x="48" y="242" width="522" height="112" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5" /><text x="68" y="276" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">訊息與端點</text><text x="68" y="312" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">過濾、連結檢查、端點防護</text><text x="68" y="342" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">仍可能有漏報</text><text x="25" y="304" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">2</text><rect x="48" y="374" width="522" height="112" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="68" y="408" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">人的工作流程</text><text x="68" y="444" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">獨立查證 + 特定行動核准</text><text x="68" y="474" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">不是只認聲音或頭像</text><text x="25" y="436" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">3</text><rect x="48" y="506" width="522" height="112" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5" /><text x="68" y="540" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">登入驗證</text><text x="68" y="576" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">抗釣魚 WebAuthn／FIDO2</text><text x="68" y="606" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">綁定網站；不替交易授權</text><text x="25" y="568" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">4</text><rect x="48" y="638" width="522" height="112" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="68" y="672" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">影響與應變</text><text x="68" y="708" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">最小權限、通報、撤銷存取</text><text x="68" y="738" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">限制損害，保留證據</text><text x="25" y="700" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">5</text><text x="30" y="800" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">DMARC 通過：對齊的 SPF 或 DKIM 通過</text><text x="30" y="828" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">多層都要有涵蓋率、設定與紀錄可查</text></g></svg>