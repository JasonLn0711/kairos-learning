<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 441.54" role="img" aria-labelledby="m0409-ike-zh-title m0409-ike-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-ike-zh-title">家裡電腦 → VPN 閘道 → 公司內網</title><desc id="m0409-ike-zh-desc">這條路徑是角色示意。下列三項依序說明初始協商、身分驗證及可用性檢查；它們不是 IKEv1 的階段，也不是三個固定 IKEv2 交換。</desc><defs><marker id="m0409-ike-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">家裡電腦 → VPN 閘道 → 公司內網</text><rect x="40.0" y="101.6" width="283.3333333333333" height="240" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IKE_SA_INIT：談好保</text><text x="56.0" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">護方式</text><text x="56.0" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">例如雙方協商加密演算法、</text><text x="56.0" y="237.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">交換建立金鑰所需的材料。</text><rect x="358.3333333333333" y="101.6" width="283.3333333333333" height="240" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="374.3333333333333" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IKE_AUTH：驗證雙方</text><text x="374.3333333333333" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">身分</text><text x="374.3333333333333" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">使用憑證或其他配置的驗證</text><text x="374.3333333333333" y="237.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">方式，確認連線對象；通常</text><text x="374.3333333333333" y="269.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">也協商第一組 CHILD_SA</text><text x="374.3333333333333" y="301.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">。</text><path d="M328.3333333333333 221.6H353.3333333333333" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ike-zh-arrow)" /><rect x="676.6666666666666" y="101.6" width="283.3333333333333" height="240" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="692.6666666666666" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">確認可用的資料通道</text><text x="692.6666666666666" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">還要有適當的 IPsec 資料</text><text x="692.6666666666666" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">安全關聯與路由、存取政策</text><text x="692.6666666666666" y="233.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">，才可能真正使用內部資源</text><text x="692.6666666666666" y="265.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">。</text><path d="M646.6666666666666 221.6H671.6666666666666" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ike-zh-arrow)" /><text x="28" y="406.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">這條路徑是角色示意。下列三項依序說明初始協商、身分驗證及可用性檢查；它們不是 IKEv1 的階段，</text><text x="28" y="438.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">也不是三個固定 IKEv2 交換。</text></g></svg>
