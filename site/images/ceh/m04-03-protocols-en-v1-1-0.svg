<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 937.5" role="img" aria-labelledby="ftpsmtp-protocols-en-title ftpsmtp-protocols-en-desc" preserveAspectRatio="xMidYMid meet"><title id="ftpsmtp-protocols-en-title">M04-03｜FTP and SMTP: identify what the service does</title><desc id="ftpsmtp-protocols-en-desc">FTP control and data connections have distinct roles, not sequential steps. Double arrows represent command/reply or data exchange, not connection initiation. SMTP arrows represent submission and server-to-server transfer.</desc><g transform="scale(0.75)"><rect width="1200" height="1250" fill="#f5f8fc" /><text x="45" y="55.0" font-family="Noto Sans CJK TC,sans-serif" font-size="30" fill="#173450">M04-03｜FTP and SMTP: identify what the service does</text><rect x="30" y="145" width="1140" height="430" rx="16" fill="#ffffff" stroke="#b7c9df" /><text x="55" y="187.0" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#173450">FTP</text><g id="ftpsmtp-protocols-en-node-0"><rect x="65" y="280" width="230" height="170" rx="16" fill="#e7f0ff" stroke="#b7c9df" /><text x="81" y="315.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">Client</text><text x="81" y="361.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">FTP Client</text></g><g id="ftpsmtp-protocols-en-node-1"><rect x="905" y="280" width="230" height="170" rx="16" fill="#e7f0ff" stroke="#b7c9df" /><text x="921" y="315.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">Server</text><text x="921" y="361.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">FTP Server</text></g><text x="340" y="235.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">Control connection (commonly TCP 21)</text><path d="M325 292H875m-12-8 12 8-12 8M337 284l-12 8 12 8" fill="none" stroke="#205e96" stroke-width="3" /><text x="340" y="325.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#173450">Commands and replies: client ↔ server</text><text x="340" y="375.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#11635d">Data connection (listing/file</text><text x="340" y="411.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#11635d">contents)</text><path d="M325 432H875m-12-8 12 8-12 8M337 424l-12 8 12 8" fill="none" stroke="#205e96" stroke-width="3" /><text x="340" y="465.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#11635d">Data exchange: client ↔ server</text><rect x="55" y="490" width="1090" height="80" rx="16" fill="#ecf8f5" stroke="#b7c9df" /><text x="75" y="525.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#11635d">FTP operation boundary：MLSD lists names ≠ RETR reads contents ≠ STOR writes files</text><rect x="30" y="600" width="1140" height="400" rx="16" fill="#ffffff" stroke="#b7c9df" /><text x="55" y="645.0" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#173450">SMTP</text><g id="ftpsmtp-protocols-en-node-5"><rect x="60" y="700" width="240" height="170" rx="16" fill="#e7f0ff" stroke="#b7c9df" /><text x="76" y="735.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">Sender</text><text x="76" y="781.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">Mail application</text></g><g id="ftpsmtp-protocols-en-node-6"><rect x="480" y="700" width="240" height="170" rx="16" fill="#e4f3f0" stroke="#b7c9df" /><text x="496" y="735.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">Submission</text><text x="496" y="771.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">server</text><text x="496" y="817.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">Submission / MSA</text></g><g id="ftpsmtp-protocols-en-node-7"><rect x="900" y="700" width="240" height="170" rx="16" fill="#e7f0ff" stroke="#b7c9df" /><text x="916" y="735.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">Recipient-side</text><text x="916" y="771.0" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#173450">server</text><text x="916" y="817.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">Mail Transfer /</text><text x="916" y="848.5" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#173450">MTA</text></g><text x="320" y="725.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#173450">TCP 587 /</text><text x="320" y="755.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#173450">465</text><path d="M320 775H460m-12-8 12 8-12 8" fill="none" stroke="#205e96" stroke-width="3" /><text x="320" y="815.0" font-family="Noto Sans CJK TC,sans-serif" font-size="17" fill="#173450">Submission</text><text x="740" y="725.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#173450">TCP 25</text><path d="M740 775H880m-12-8 12 8-12 8" fill="none" stroke="#205e96" stroke-width="3" /><text x="740" y="815.0" font-family="Noto Sans CJK TC,sans-serif" font-size="17" fill="#173450">Transfer</text><rect x="55" y="900" width="1090" height="70" rx="16" fill="#fff2e1" stroke="#b7c9df" /><text x="75" y="935.0" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#885217">SMTP operation boundary：Advertised feature ≠ logged in; accepted request ≠</text><text x="75" y="966.5" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#885217">delivered mail</text><text x="45" y="1050.0" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#173450">FTP control and data connections have distinct roles, not sequential steps. Double</text><text x="45" y="1083.0" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#173450">arrows represent command/reply or data exchange, not connection initiation. SMTP</text><text x="45" y="1116.0" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#173450">arrows represent submission and server-to-server transfer.</text></g></svg>
