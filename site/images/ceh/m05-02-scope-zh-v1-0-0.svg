<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466.2" role="img" aria-labelledby="m0502-scope-zh-title m0502-scope-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0502-scope-zh-title">圖 2｜依賴關係與授權範圍</title><desc id="m0502-scope-zh-desc">A 依賴 B、C，箭頭代表依賴；授權範圍只有 A 的特定檢查項目，不隨連線擴大。</desc><defs><marker id="m0502-scope-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 2｜依賴關係與授權範圍</text><rect x="40.0" y="108" width="920.0" height="121" rx="16" fill="#edf6f4" stroke="#47748e" stroke-width="2" /><text x="60.0" y="142.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">A：測試訂購網站</text><text x="60.0" y="179.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">本次授權評估；允許檢查指定安全設定及軟體版本。</text><path d="M500 229V257" fill="none" stroke="#47748e" stroke-width="3" /><path d="M500 257H270V282" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-scope-zh-arrow)" /><path d="M500 257H730V282" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-scope-zh-arrow)" /><rect x="40.0" y="297" width="448.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="331.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">B：正式資料庫</text><text x="60.0" y="368.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">公司內部；未授權。</text><rect x="512.0" y="297" width="448.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="532.0" y="331.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">C：外部金流服務</text><text x="532.0" y="368.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">第三方業者；未授權。</text><text x="28" y="458.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">A 依賴 B、C，箭頭代表依賴；授權範圍只有 A 的特定檢查項目，不隨連線擴大。</text></g></svg>
