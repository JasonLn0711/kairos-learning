<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" role="img" aria-labelledby="title desc"><title id="title">開啟 SMB 共用的簡化流程</title><desc id="desc">可重用既有工作階段；部分環境允許訪客，仍依設定與權限判斷。</desc><rect x="1" y="1" width="678" height="594" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">開啟 SMB 共用的簡化流程</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">1. 連線</text><text x="40" y="120" font-size="17">連到檔案伺服器</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">2. 協商</text><text x="40" y="215" font-size="17">確認版本與安全功能</text><rect x="24" y="256" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">3. 驗證</text><text x="40" y="310" font-size="17">確認使用身分</text><rect x="24" y="351" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="379" font-size="19" font-weight="bold">4. 授權</text><text x="40" y="405" font-size="17">檢查指定資源操作</text><rect x="24" y="446" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="474" font-size="19" font-weight="bold">5. 資料</text><text x="40" y="500" font-size="17">獲准後讀取或修改</text><text x="24" y="561" font-size="17">可重用既有工作階段；部分環境允許訪客，仍依設定與權限判斷。</text></g></svg>
