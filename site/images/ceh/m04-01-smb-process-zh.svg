<svg xmlns="http://www.w3.org/2000/svg" width="720" height="832" viewBox="0 0 720 832" role="img" aria-labelledby="title desc"><title id="title">開啟 SMB 共用的簡化流程</title><desc id="desc">可重用既有工作階段；部分環境允許訪客，仍依設定與權限判斷。</desc><rect width="720" height="832" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">開啟 SMB 共用的簡化流程</text><text x="30" y="69" font-size="16" font-weight="400">可重用既有工作階段；部分環境允許訪客，仍依設定與權限判斷。</text><text x="30" y="115" font-size="16" font-weight="650">用戶端</text><text x="480" y="115" font-size="16" font-weight="650">檔案伺服器</text><rect x="65" y="145" width="590" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="81" y="172" font-size="16" font-weight="650">連線</text><text x="81" y="198" font-size="16" font-weight="400">連到檔案伺服器</text><path d="M40 247H680" stroke="#778d80"/><text x="30" y="252" font-size="16" font-weight="400">←</text><text x="675" y="252" font-size="16" font-weight="400">→</text><rect x="65" y="277" width="590" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="81" y="304" font-size="16" font-weight="650">協商</text><text x="81" y="330" font-size="16" font-weight="400">確認版本與安全功能</text><path d="M40 379H680" stroke="#778d80"/><text x="30" y="384" font-size="16" font-weight="400">←</text><text x="675" y="384" font-size="16" font-weight="400">→</text><rect x="65" y="409" width="590" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="81" y="436" font-size="16" font-weight="650">驗證</text><text x="81" y="462" font-size="16" font-weight="400">確認使用身分</text><path d="M40 511H680" stroke="#778d80"/><text x="30" y="516" font-size="16" font-weight="400">←</text><text x="675" y="516" font-size="16" font-weight="400">→</text><rect x="65" y="541" width="590" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="81" y="568" font-size="16" font-weight="650">授權</text><text x="81" y="594" font-size="16" font-weight="400">檢查指定資源操作</text><text x="470" y="643" font-size="16" font-weight="400">伺服器檢查 ↓</text><rect x="65" y="675" width="590" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="81" y="702" font-size="16" font-weight="650">資料</text><text x="81" y="728" font-size="16" font-weight="400">獲准後讀取或修改</text><path d="M40 777H680" stroke="#778d80"/><text x="30" y="782" font-size="16" font-weight="400">←</text><text x="675" y="782" font-size="16" font-weight="400">→</text><path d="M30 145V807M690 145V807" fill="none" stroke="#778d80"/></g></svg>
