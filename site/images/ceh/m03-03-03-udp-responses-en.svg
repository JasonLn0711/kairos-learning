<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 628" role="img" aria-labelledby="m0303-f3-en-title m0303-f3-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0303-f3-en-title">UDP: send a datagram, interpret four outcomes</title><desc id="m0303-f3-en-desc">Scanner → target: UDP datagram. Cards are alternative outcomes, not a sequence.</desc><text x="24" y="32" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">UDP: send a datagram, interpret four outcomes</text><text x="24" y="68" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Scanner → target: UDP datagram. Cards are alternative outcomes,</text><text x="24" y="94" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">not a sequence.</text><rect x="12" y="112" width="576" height="96" rx="14" fill="#ecfaf4" stroke="#b7c9df" /><text x="24" y="132" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">open</text><text x="24" y="182" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">A corresponding UDP reply: an endpoint responded on this path.</text><rect x="12" y="220" width="576" height="96" rx="14" fill="#fff0f0" stroke="#b7c9df" /><text x="24" y="240" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">closed</text><text x="24" y="290" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">IPv4 ICMP Type 3 / Code 3: Port Unreachable.</text><rect x="12" y="328" width="576" height="96" rx="14" fill="#f2efff" stroke="#b7c9df" /><text x="24" y="348" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">filtered</text><text x="24" y="398" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">IPv4 ICMP Type 3 / Code 1, 2, 9, 10 or 13.</text><rect x="12" y="436" width="576" height="96" rx="14" fill="#fff7df" stroke="#b7c9df" /><text x="24" y="456" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">open|filtered</text><text x="24" y="506" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">No reply after retries: possibly open and silent, or filtered.</text><text x="24" y="564" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Match ICMP to its source and original datagram; IPv4 codes do</text><text x="24" y="590" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">not apply to ICMPv6.</text></svg>