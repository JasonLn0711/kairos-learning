<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t d"><title id="t">Redundancy: normal service and failover</title><desc id="d">User → Primary server. These are alternative branches, not consecutive steps.</desc>
<rect width="760" height="520" rx="18" fill="#f7f8f5"/>
<text x="25" y="35" font-family="sans-serif" font-size="24" fill="#173d35"><tspan x="25" dy="0">Redundancy: normal service and failover</tspan></text>
<text x="25" y="75" font-family="sans-serif" font-size="18" fill="#173d35"><tspan x="25" dy="0">User → Primary server. These are alternative branches, not consecutive</tspan><tspan x="25" dy="27">steps.</tspan></text>
<rect x="25" y="135" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="170" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">Healthy → Serve users</tspan></text>
<text x="45" y="215" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">The healthy primary server handles requests.</tspan></text>
<rect x="25" y="315" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="350" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">Failure → Standby → Continue service</tspan></text>
<text x="45" y="395" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">Requires health checks, data synchronization and a failover</tspan><tspan x="45" dy="27">mechanism.</tspan></text>
</svg>
