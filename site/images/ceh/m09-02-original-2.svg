<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="940px" version="1.1" viewBox="0 0 1600 940" width="1600px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><linearGradient id="topline" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#087F83" /><stop offset="100%" stop-color="#3569B4" /></linearGradient></defs><rect fill="#F5F8FC" height="940" width="1600" x="0" y="0" /><rect fill="url(#topline)" height="12" width="1600" x="0" y="0" /><circle cx="1490" cy="110" fill="#E8F1FD" opacity="0.42" r="170" /><circle cx="1440" cy="50" fill="#DDF4F1" opacity="0.45" r="100" /><text fill="#087F83" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" text-anchor="start" x="60" y="76">CEH M09-02  /  視覺圖解 02</text><text fill="#16263C" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="43" font-weight="800" text-anchor="start" x="60" y="139">攻擊者如何利用信任，讓人跨越安全界線？</text><text fill="#586980" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="400" text-anchor="start" x="61" y="181">從「看起來可信」到「可能損害」，中間有多個可阻斷的節點。</text><line stroke="#DCE4EE" stroke-width="2" x1="60" x2="1540" y1="207" y2="207" /><rect fill="#FFFFFF" height="213" rx="22" ry="22" stroke="#DCE4EE" stroke-width="2" width="255" x="65" y="289" /><rect fill="#E8F1FD" height="38" rx="19" ry="19" stroke="none" stroke-width="0" width="215" x="85" y="311" /><text fill="#16263C" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="192.5" y="338">① 冒用身分</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="85" y="407">假裝合作廠商</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="85" y="449">或公司主管</text><line stroke="#586980" stroke-linecap="round" stroke-width="3" x1="324" x2="364" y1="390" y2="390" /><polygon fill="#586980" points="364,390 351.0,383.0 351.0,397.0" /><rect fill="#FFFFFF" height="213" rx="22" ry="22" stroke="#DCE4EE" stroke-width="2" width="255" x="368" y="289" /><rect fill="#E8F1FD" height="38" rx="19" ry="19" stroke="none" stroke-width="0" width="215" x="388" y="311" /><text fill="#16263C" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="495.5" y="338">② 補上背景</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="388" y="407">正確提到姓名</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="388" y="449">專案或近期活動</text><line stroke="#586980" stroke-linecap="round" stroke-width="3" x1="627" x2="667" y1="390" y2="390" /><polygon fill="#586980" points="667,390 654.0,383.0 654.0,397.0" /><rect fill="#FFFFFF" height="213" rx="22" ry="22" stroke="#DCE4EE" stroke-width="2" width="255" x="671" y="289" /><rect fill="#E8F1FD" height="38" rx="19" ry="19" stroke="none" stroke-width="0" width="215" x="691" y="311" /><text fill="#16263C" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="798.5" y="338">③ 提出要求</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="691" y="407">要求登入</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="691" y="449">開附件或改匯款</text><line stroke="#586980" stroke-linecap="round" stroke-width="3" x1="930" x2="970" y1="390" y2="390" /><polygon fill="#586980" points="970,390 957.0,383.0 957.0,397.0" /><rect fill="#FFF1DD" height="213" rx="22" ry="22" stroke="#D98127" stroke-width="2" width="255" x="974" y="289" /><rect fill="#FFFFFF" height="38" rx="19" ry="19" stroke="none" stroke-width="0" width="215" x="994" y="311" /><text fill="#D98127" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="1101.5" y="338">④ 跨越界線</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="994" y="407">對未驗證網站</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="994" y="449">輸入帳密／付款</text><line stroke="#586980" stroke-linecap="round" stroke-width="3" x1="1233" x2="1273" y1="390" y2="390" /><polygon fill="#586980" points="1273,390 1260.0,383.0 1260.0,397.0" /><rect fill="#FBE8EB" height="213" rx="22" ry="22" stroke="#BA4653" stroke-width="2" width="255" x="1277" y="289" /><rect fill="#FFFFFF" height="38" rx="19" ry="19" stroke="none" stroke-width="0" width="215" x="1297" y="311" /><text fill="#BA4653" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="1404.5" y="338">⑤ 可能後果</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="1297" y="407">帳號遭冒用</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="1297" y="449">或款項受損</text><line stroke="#BA4653" stroke-dasharray="9 10" stroke-width="3" x1="957" x2="957" y1="239" y2="525" /><rect fill="#FFFFFF" height="38" rx="19" ry="19" stroke="none" stroke-width="0" width="280" x="818" y="247" /><text fill="#BA4653" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="958.0" y="274">信任界線 / Trust Boundary</text><rect fill="#DDF4F1" height="250" rx="26" ry="26" stroke="#087F83" stroke-width="2" width="686" x="80" y="592" /><rect fill="#FBE8EB" height="250" rx="26" ry="26" stroke="#BA4653" stroke-width="2" width="688" x="832" y="592" /><line stroke="#087F83" stroke-linecap="round" stroke-width="4" x1="798" x2="430" y1="502" y2="591" /><polygon fill="#087F83" points="430,591 444.28121295117944,594.74792697942 440.99022139631177,581.14023156154" /><line stroke="#BA4653" stroke-linecap="round" stroke-width="4" x1="1120" x2="1175" y1="502" y2="591" /><polygon fill="#BA4653" points="1175,591 1174.120653366148,576.2613857673955 1162.2112413468062,583.6211347681124" /><text fill="#087F83" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="31" font-weight="800" text-anchor="start" x="116" y="645">✓ 正確的阻斷方式</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="116" y="701">不採用訊息提供的聯絡方式。</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="116" y="741">從原本就知道的官方管道查證。</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="116" y="781">先確認身分、要求與授權範圍。</text><text fill="#BA4653" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="31" font-weight="800" text-anchor="start" x="868" y="645">! 沒有查證時的風險</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="868" y="701">可能洩露登入憑證、執行惡意檔案，</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="868" y="741">或造成錯誤付款；後果並非必然發生。</text><text fill="#24344B" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="400" text-anchor="start" x="868" y="781">收到信件 ≠ 已經遭到入侵。</text><line stroke="#DCE4EE" stroke-width="2" x1="60" x2="1540" y1="892" y2="892" /><text fill="#586980" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" text-anchor="start" x="61" y="922">本圖是教學用的因果模型，並非官方固定攻擊步驟。</text></svg>