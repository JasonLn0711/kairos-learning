<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326.34000000000003" role="img" aria-labelledby="m0409-stages-zh-title m0409-stages-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-stages-zh-title">M03 → M04 → M05：從入口到風險</title><desc id="m0409-stages-zh-desc">箭頭表示課程的判讀順序；發現服務後仍需證據，才能支持弱點結論。</desc><defs><marker id="m0409-stages-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">M03 → M04 → M05：從入口到風險</text><rect x="40.0" y="101.6" width="283.3333333333333" height="144" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">M03｜Scanning：找到</text><text x="56.0" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">大樓入口</text><text x="56.0" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">有哪些主機與服務？</text><rect x="358.3333333333333" y="101.6" width="283.3333333333333" height="144" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="374.3333333333333" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">M04｜Enumeration：</text><text x="374.3333333333333" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">詢問櫃檯資訊</text><text x="374.3333333333333" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">服務願意提供什麼？</text><path d="M328.3333333333333 173.6H353.3333333333333" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-stages-zh-arrow)" /><rect x="676.6666666666666" y="101.6" width="283.3333333333333" height="144" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="692.6666666666666" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">M05｜Vulnerability</text><text x="692.6666666666666" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">：分析保護弱點</text><text x="692.6666666666666" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">是否存在可證實的風險？</text><path d="M646.6666666666666 173.6H671.6666666666666" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-stages-zh-arrow)" /><text x="28" y="310.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">箭頭表示課程的判讀順序；發現服務後仍需證據，才能支持弱點結論。</text></g></svg>
