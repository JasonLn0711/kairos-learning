<svg xmlns="http://www.w3.org/2000/svg" width="720" height="788" viewBox="0 0 720 788" role="img" aria-labelledby="title desc"><title id="title">A simplified DNS lookup</title><desc id="desc">Caching, forwarding and other mechanisms affect the path; not every lookup visits every server.</desc><rect width="720" height="788" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="38" y="38" font-size="18" font-weight="650">A simplified DNS lookup</text><text x="38" y="66" font-size="16" font-weight="400">Caching, forwarding and other mechanisms affect the path; not </text><text x="38" y="94" font-size="16" font-weight="400">every lookup visits every server.</text><rect x="22" y="116" width="676" height="50" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="138" font-size="18" font-weight="650">Your computer asks for www.example.com</text><text x="38" y="194" font-size="16" font-weight="400">↓ Query</text><rect x="22" y="200" width="676" height="78" rx="12" fill="#e8f0f5" stroke="#778d80"/><text x="38" y="222" font-size="18" font-weight="650">Recursive resolver</text><text x="38" y="250" font-size="16" font-weight="400">Recursive Resolver</text><text x="38" y="306" font-size="16" font-weight="400">✓ Suitable cache: reply directly → Receive the DNS query resul</text><text x="38" y="334" font-size="16" font-weight="400">t</text><text x="38" y="362" font-size="16" font-weight="400">No suitable cached answer ↓</text><rect x="22" y="382" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="404" font-size="18" font-weight="650">1. Recursive resolver → Root nameserver · Root</text><text x="38" y="432" font-size="16" font-weight="400">← Referral: who serves .com</text><rect x="22" y="466" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="488" font-size="18" font-weight="650">2. Recursive resolver → .com nameserver · TLD</text><text x="38" y="516" font-size="16" font-weight="400">← Referral: who serves example.com</text><rect x="22" y="550" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="572" font-size="18" font-weight="650">3. Recursive resolver → example.com nameserver · Authoritative</text><text x="38" y="600" font-size="16" font-weight="400">← Return the record</text><text x="38" y="656" font-size="16" font-weight="400">Recursive resolver → Your computer：Receive the DNS query resu</text><text x="38" y="684" font-size="16" font-weight="400">lt</text><text x="38" y="712" font-size="16" font-weight="400">Each row is a query from the resolver and a response back to i</text><text x="38" y="740" font-size="16" font-weight="400">t. Root does not forward the request down the entire chain.</text></g></svg>
