<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 526" role="img" aria-labelledby="title desc"><title id="title">地址、入口、協定：分開確認</title><desc id="desc">三類證據各自判讀；445 開放、SMB 確認與指定檔案可讀，不互相等同。</desc><rect x="1" y="1" width="678" height="524" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">地址、入口、協定：分開確認</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">IP：192.168.56.10</text><text x="40" y="120" font-size="17">像設備地址。</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">Port：TCP 445</text><text x="40" y="215" font-size="17">像服務櫃檯；open 是此次觀察接受連線。</text><rect x="24" y="256" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">SMB：共用規則</text><text x="40" y="310" font-size="17">以實際協定回應確認；埠名標籤只是線索。</text><rect x="24" y="351" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="379" font-size="19" font-weight="bold">指定檔案操作</text><text x="40" y="405" font-size="17">用當次身分與路徑，記下讀取結果。</text><text x="24" y="466" font-size="17">三類證據各自判讀；445 開放、SMB</text><text x="24" y="491" font-size="17">確認與指定檔案可讀，不互相等同。</text></g></svg>
