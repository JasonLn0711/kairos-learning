<svg xmlns="http://www.w3.org/2000/svg" width="900" height="810" viewBox="0 0 900 810" role="img" aria-labelledby="m0904-f3-zh-title m0904-f3-zh-desc"><title id="m0904-f3-zh-title">看見誘餌，不必打開才能處理</title><desc id="m0904-f3-zh-desc">Unknown USB media and enticing files remain untrusted. The route to company and home devices is blocked. Reporting information goes to an approved intake process and then to specialist-directed handling. A dotted possible-harm connector is explicitly conditional, not evidence that compromise occurred.</desc><defs><marker id="m0904-f3-zh-a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2774a7" /></marker><marker id="m0904-f3-zh-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18785d" /></marker><marker id="m0904-f3-zh-a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b14d55" /></marker><marker id="m0904-f3-zh-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7d" /></marker></defs><g transform="scale(0.9)"><rect width="1000" height="900" fill="#f7fafc" /><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="44" y="38" fill="#2774a7" font-size="20" font-weight="700" text-anchor="start">CEH M09-04  /  03  /  NORTHSTAR · 合成情境</text><text x="44" y="87" fill="#193449" font-size="31" font-weight="700" text-anchor="start">看見誘餌，不必打開才能處理</text><text x="44" y="124" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">Baiting｜免費檔案、獎品或陌生 USB：先辨識來源與處理邊界。</text><rect x="44" y="180" width="421" height="154" rx="18" fill="#fff5dd" stroke="#946114" stroke-width="1.5" /><text x="69" y="220" fill="#946114" font-size="23" font-weight="700" text-anchor="start">未知來源 USB／免費檔案</text><text x="69" y="260" fill="#193449" font-size="20" font-weight="400" text-anchor="start">有吸引力，但尚未確認可信。</text><text x="69" y="291" fill="#193449" font-size="20" font-weight="400" text-anchor="start">未知 ≠ 已證實惡意</text><rect x="625" y="180" width="331" height="154" rx="18" fill="#fceef0" stroke="#b14d55" stroke-width="1.5" /><text x="791" y="221" fill="#b14d55" font-size="22" font-weight="700" text-anchor="middle">公司或家用設備</text><text x="791" y="262" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">不插入、不開啟</text><text x="791" y="293" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">家用電腦不是安全測試區。</text><path d="M465 260 H607" fill="none" stroke="#b14d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f3-zh-a-red)" /><circle cx="538" cy="260" r="16" fill="#f7fafc" stroke="#b14d55" stroke-width="2" /><path d="M532 254 L544 266 M532 266 L544 254" fill="none" stroke="#b14d55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="538" y="368" fill="#b14d55" font-size="20" font-weight="700" text-anchor="middle">阻止未知內容進入設備</text><rect x="44" y="434" width="912" height="237" rx="18" fill="#eaf6ef" stroke="#18785d" stroke-width="1.5" /><text x="535" y="468" fill="#18785d" font-size="20" font-weight="700" text-anchor="start">核准的處理流程｜Approved response</text><path d="M254 334 V501" fill="none" stroke="#18785d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f3-zh-a-green)" /><rect x="108" y="374" width="292" height="47" rx="8" fill="#f7fafc" stroke="#f7fafc" stroke-width="1.5" /><text x="254" y="405" fill="#18785d" font-size="20" font-weight="700" text-anchor="middle">僅回報資訊；不先操作內容</text><rect x="65" y="501" width="379" height="138" rx="18" fill="#ffffff" stroke="#18785d" stroke-width="1.5" /><text x="254" y="542" fill="#18785d" font-size="22" font-weight="700" text-anchor="middle">正式資安通報窗口</text><text x="254" y="579" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">回報發現地點／來源資訊。</text><text x="254" y="609" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">依指示保存與交接。</text><path d="M444 572 H577" fill="none" stroke="#18785d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f3-zh-a-green)" /><text x="511" y="550" fill="#18785d" font-size="20" font-weight="700" text-anchor="middle">轉交</text><rect x="589" y="501" width="345" height="138" rx="18" fill="#ffffff" stroke="#2774a7" stroke-width="1.5" /><text x="761" y="542" fill="#2774a7" font-size="22" font-weight="700" text-anchor="middle">受控的專業判斷</text><text x="761" y="579" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">是否分析、在哪裡分析，</text><text x="761" y="609" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">由核准人員依政策決定。</text><path d="M791 334 V390 H977 V745 H916" fill="none" stroke="#b14d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8" marker-end="url(#m0904-f3-zh-a-red)" /><rect x="460" y="704" width="456" height="80" rx="18" fill="#fceef0" stroke="#b14d55" stroke-width="1.5" /><text x="688" y="736" fill="#b14d55" font-size="20" font-weight="700" text-anchor="middle">若開啟：可能有惡意程式／資料風險</text><text x="688" y="766" fill="#536b7d" font-size="20" font-weight="400" text-anchor="middle">是假設風險，並非已證實感染。</text><path d="M44 804 H956" fill="none" stroke="#bdcbd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="839" fill="#193449" font-size="20" font-weight="500" text-anchor="start">綠箭頭＝通報／轉交流程；不是將未知 USB 插入另一台電腦。</text><text x="44" y="870" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">紅色點線＝條件式潛在後果；紅色 ×＝被禁止的操作路徑。</text></g></g></svg>