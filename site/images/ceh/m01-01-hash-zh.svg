<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-labelledby="t d"><title id="t">雜湊比對：先確認可信基準</title><desc id="d">同一演算法、同一份位元組資料範圍；差異不等於已證實入侵。</desc>
<rect width="760" height="700" rx="18" fill="#f7f8f5"/>
<text x="25" y="35" font-family="sans-serif" font-size="24" fill="#173d35"><tspan x="25" dy="0">雜湊比對：先確認可信基準</tspan></text>
<text x="25" y="75" font-family="sans-serif" font-size="18" fill="#173d35"><tspan x="25" dy="0">同一演算法、同一份位元組資料範圍；差異不等於已證實入侵。</tspan></text>
<rect x="25" y="135" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="170" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">原本的 Hash</tspan></text>
<text x="45" y="215" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">可信保存的比對基準</tspan></text>
<path d="M380 283v25m-7-7 7 7 7-7" fill="none" stroke="#355e50" stroke-width="2"/>
<rect x="25" y="315" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="350" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">目前檔案的 Hash</tspan></text>
<text x="45" y="395" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">重新計算待檢查的檔案</tspan></text>
<path d="M380 463v25m-7-7 7 7 7-7" fill="none" stroke="#355e50" stroke-width="2"/>
<rect x="25" y="495" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="530" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">兩者是否相同？</tspan></text>
<text x="45" y="575" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">不同表示內容變動；相同仍不保證原始資料符合事實。</tspan></text>
</svg>
