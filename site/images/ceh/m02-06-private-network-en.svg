<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 803" role="img" aria-labelledby="m0206-f7-en-title m0206-f7-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0206-f7-en-title">Figure 3 | A private lab network</title><desc id="m0206-f7-en-desc">The PC and NAS connect in parallel to one router/firewall, which connects outward.</desc><rect width="800" height="803" fill="#fcfcfd" /><g fill="#162a3a" font-family="system-ui, sans-serif"><rect x="35" y="147.0" width="730" height="393.9" rx="24" fill="#f0f8f7" stroke="#84c4c0" stroke-width="2" stroke-dasharray="10 6" /><text x="400" y="42" font-size="24" text-anchor="middle" font-weight="700">Figure 3 | A private lab network</text><text x="400" y="83.6" font-size="18" text-anchor="middle">The PC and NAS connect in parallel to one router/firewall, which</text><text x="400" y="113.3" font-size="18" text-anchor="middle">connects outward.</text><text x="400" y="185.0" font-size="22" text-anchor="middle" font-weight="700">Private lab | 10.20.0.0/24</text><rect x="65" y="215.3" width="320" height="99.3" rx="18" fill="#e3f2f0" stroke="#59b6b1" stroke-width="2" /><text x="225.0" y="249.3" font-size="22" text-anchor="middle" font-weight="700">Computer</text><text x="225.0" y="287.6" font-size="20" text-anchor="middle">10.20.0.10</text><rect x="415" y="215.3" width="320" height="99.3" rx="18" fill="#e3f2f0" stroke="#59b6b1" stroke-width="2" /><text x="575.0" y="249.3" font-size="22" text-anchor="middle" font-weight="700">NAS</text><text x="575.0" y="287.6" font-size="20" text-anchor="middle">10.20.0.25</text><path d="M225 314.6V346.6H575V314.6M400 346.6V374.6" fill="none" stroke="#14817b" stroke-width="3" /><text x="400" y="396.6" font-size="20" text-anchor="middle">Shared gateway</text><rect x="165" y="421.6" width="470" height="99.3" rx="18" fill="#e5effc" stroke="#689ee9" stroke-width="2" /><text x="400.0" y="455.6" font-size="22" text-anchor="middle" font-weight="700">Router / firewall</text><text x="400.0" y="493.90000000000003" font-size="20" text-anchor="middle">May provide NAT and access controls</text><path d="M400 540.9V585.9M392 575.9L400 585.9L408 575.9" fill="none" stroke="#52677f" stroke-width="3" /><text x="570" y="560.9" font-size="20" text-anchor="middle">Outbound path</text><rect x="90" y="593.9" width="620" height="99.3" rx="18" fill="#eef0f3" stroke="#a1aebb" stroke-width="2" /><text x="400.0" y="627.9" font-size="22" text-anchor="middle" font-weight="700">External network / Internet</text><text x="400.0" y="666.1999999999999" font-size="20" text-anchor="middle">Reachability depends on routes and policy</text><text x="400" y="741.1999999999999" font-size="18" text-anchor="middle">Private addresses can be routed between campuses. NAT, access</text><text x="400" y="770.9" font-size="18" text-anchor="middle">controls and authentication have distinct roles.</text></g></svg>