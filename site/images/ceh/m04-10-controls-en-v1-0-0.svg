<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 939.2399999999999" role="img" aria-labelledby="m0409-controls-en-title m0409-controls-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-controls-en-title">Figure 2 | A user wants to read server data</title><desc id="m0409-controls-en-desc">Arrows indicate the order of these explanatory checks. Actual protocols need not execute in this sequence; transport protection can be established before login.</desc><defs><marker id="m0409-controls-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 2 | A user wants to read server data</text><rect x="40" y="101.6" width="920" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Check 1: Network reachability</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Does the firewall allow a connection to this service?</text><text x="56" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Like the building perimeter and entrance.</text><path d="M500 253.60000000000002V283.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-controls-en-arrow)" /><rect x="40" y="299.6" width="920" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="331.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Check 2: Authentication</text><text x="56" y="367.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Can the system establish who you are?</text><text x="56" y="399.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Like reception checking an employee ID.</text><path d="M500 451.6V481.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-controls-en-arrow)" /><rect x="40" y="497.6" width="920" height="172" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="529.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Check 3: Authorization</text><text x="56" y="565.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Even as an employee, which documents may you see and which operations</text><text x="56" y="597.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">may you perform?</text><text x="56" y="629.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Like checking whether you have a key to Finance.</text><path d="M500 681.6V711.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-controls-en-arrow)" /><rect x="40" y="727.6" width="920" height="140" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="759.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Item 4: Encryption / Integrity</text><text x="56" y="795.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Is data protected against observation or tampering in transit?</text><text x="56" y="827.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Like carrying files in a locked, tamper-evident briefcase.</text><text x="28" y="927.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Arrows indicate the order of these explanatory checks. Actual protocols</text><text x="28" y="959.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">need not execute in this sequence; transport protection can be established</text><text x="28" y="991.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">before login.</text></g></svg>
