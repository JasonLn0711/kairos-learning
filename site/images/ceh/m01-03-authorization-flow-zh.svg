<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">測試前與測試中的授權檢查</title><desc id="desc">補充圖解｜每次準備採取新動作，都要核對約定；不確定時先停下來釐清。 確認核准: 有權的人批准指定測試者、環境與目標。 核對行動: 目標、方法、資料與時段都符合約定，才進行該動作。 遇到界線: 目標未列入、發生異常或時段結束：停止相關測試並通報。 恢復與收尾: 依核准條件恢復；最小化證據、交付報告並完成約定清理。</desc><rect width="900" height="510" rx="18" fill="#f2f6f5"/><text x="28" y="42" fill="#18252c" font-size="24" font-family="sans-serif">測試前與測試中的授權檢查</text><rect x="24" y="66" width="852" height="94" rx="10" fill="white" stroke="#687d78"/><text x="40" y="94" font-size="19" fill="#18252c" font-family="sans-serif">1. 確認核准</text><text x="40" y="120" font-size="17" fill="#18252c" font-family="sans-serif">有權的人批准指定測試者、環境與目標。</text><rect x="24" y="172" width="852" height="94" rx="10" fill="white" stroke="#687d78"/><text x="40" y="200" font-size="19" fill="#18252c" font-family="sans-serif">2. 核對行動</text><text x="40" y="226" font-size="17" fill="#18252c" font-family="sans-serif">目標、方法、資料與時段都符合約定，才進行該動作。</text><rect x="24" y="278" width="852" height="94" rx="10" fill="white" stroke="#687d78"/><text x="40" y="306" font-size="19" fill="#18252c" font-family="sans-serif">3. 遇到界線</text><text x="40" y="332" font-size="17" fill="#18252c" font-family="sans-serif">目標未列入、發生異常或時段結束：停止相關測試並通報。</text><rect x="24" y="384" width="852" height="94" rx="10" fill="white" stroke="#687d78"/><text x="40" y="412" font-size="19" fill="#18252c" font-family="sans-serif">4. 恢復與收尾</text><text x="40" y="438" font-size="17" fill="#18252c" font-family="sans-serif">依核准條件恢復；最小化證據、交付報告並完成約定清理。</text></svg>