<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588.24" role="img" aria-labelledby="m0409-stratum-zh-title m0409-stratum-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-stratum-zh-title">NTP：時間同步從哪一層傳下來？</title><desc id="m0409-stratum-zh-desc">向下箭頭表示本例的時間來源關係；Stratum 0 是參考時鐘，不是一般 NTP 伺服器。</desc><defs><marker id="m0409-stratum-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">NTP：時間同步從哪一層傳下來？</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Stratum 0</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">原子鐘、GNSS 等參考時鐘</text><path d="M500 221.6V251.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-stratum-zh-arrow)" /><rect x="40" y="267.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="299.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Stratum 1</text><text x="56" y="335.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">直接連接參考時鐘的 NTP 伺服器</text><path d="M500 387.6V417.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-stratum-zh-arrow)" /><rect x="40" y="433.6" width="920" height="108" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="465.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Stratum 2</text><text x="56" y="501.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">向上一層伺服器同步</text><text x="28" y="601.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">向下箭頭表示本例的時間來源關係；Stratum 0 是參考時鐘，不是一般 NTP 伺服器。</text></g></svg>
