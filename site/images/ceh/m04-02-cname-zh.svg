<svg xmlns="http://www.w3.org/2000/svg" width="720" height="462" viewBox="0 0 720 462" role="img" aria-labelledby="title desc"><title id="title">CNAME 名稱解析</title><desc id="desc">別名指向另一個名稱，再查到位址；這不是 HTTP 重新導向。</desc><rect width="720" height="462" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="38" y="38" font-size="18" font-weight="650">CNAME 名稱解析</text><text x="38" y="66" font-size="16" font-weight="400">別名指向另一個名稱，再查到位址；這不是 HTTP 重新導向。</text><rect x="22" y="88" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="110" font-size="18" font-weight="650">shop.example.test</text><text x="38" y="138" font-size="16" font-weight="400">CNAME 別名</text><text x="38" y="194" font-size="16" font-weight="400">↓ </text><rect x="22" y="212" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="234" font-size="18" font-weight="650">www.example.test</text><text x="38" y="262" font-size="16" font-weight="400">具有 A 記錄的名稱</text><text x="38" y="318" font-size="16" font-weight="400">↓ </text><rect x="22" y="336" width="676" height="78" rx="12" fill="#e8f0f5" stroke="#778d80"/><text x="38" y="358" font-size="18" font-weight="650">192.0.2.10</text><text x="38" y="386" font-size="16" font-weight="400">示範 IPv4 位址</text></g></svg>
