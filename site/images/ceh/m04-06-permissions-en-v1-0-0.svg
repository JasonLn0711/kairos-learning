<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880.0 498.40000000000003" role="img" aria-labelledby="m0406-permissions-en-title m0406-permissions-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0406-permissions-en-title">Figure 4 | Explore basic file permissions</title><desc id="m0406-permissions-en-desc">Shows basic permission bits in Owner/Group/Others order. The SVG and reference list retain all four reference cases; changing the selection does not change the download. Without JavaScript, 600 is the default.</desc><rect width="880.0" height="498.40000000000003" fill="#ffffff" /><g transform="scale(0.8)" font-family="sans-serif" fill="#173450"><text x="24" y="40" font-size="22" font-weight="700">Figure 4 | Explore basic file permissions</text><rect x="24" y="88" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="118" font-size="18" font-weight="700">600 | Owner read/write only</text><text x="44" y="151" font-size="18" font-weight="400">rw- | --- | ---</text><rect x="24" y="192" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="222" font-size="18" font-weight="700">640 | Group can also read</text><text x="44" y="255" font-size="18" font-weight="400">rw- | r-- | ---</text><rect x="24" y="296" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="326" font-size="18" font-weight="700">644 | Others can also read</text><text x="44" y="359" font-size="18" font-weight="400">rw- | r-- | r--</text><rect x="24" y="400" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="430" font-size="18" font-weight="700">777 | All basic permissions for everyone</text><text x="44" y="463" font-size="18" font-weight="400">rwx | rwx | rwx</text><text x="24" y="514" font-size="18" font-weight="400">Shows basic permission bits in Owner/Group/Others order. The SVG and reference list retain all four refe</text><text x="24" y="542" font-size="18" font-weight="400">rence cases; changing the selection does not change the download. Without JavaScript, 600 is the default</text><text x="24" y="570" font-size="18" font-weight="400">.</text></g></svg>