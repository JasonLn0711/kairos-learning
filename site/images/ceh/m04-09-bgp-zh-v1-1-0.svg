<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1272.24" role="img" aria-labelledby="m0409-bgp-zh-title m0409-bgp-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-bgp-zh-title">BGP 公告與 AS_PATH：回到自己便辨識迴圈</title><desc id="m0409-bgp-zh-desc">四個 AS 形成菱形。箭頭表示此例公告方向：AS64500 → AS64497 → AS64496 → AS64498 → AS64500；回到來源的公告含本身 ASN，因此排除。這不是資料封包的轉送箭頭。</desc><defs><marker id="m0409-bgp-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">BGP 公告與 AS_PATH：回到自己便辨識迴圈</text><path d="M310 680.6L360 269.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-bgp-zh-arrow)" /><path d="M640 269.6L690 680.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-bgp-zh-arrow)" /><path d="M690 848.6L640 1091.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-bgp-zh-arrow)" /><path d="M360 1091.6L310 848.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-bgp-zh-arrow)" /><rect x="30" y="512.6" width="280" height="336" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="46" y="544.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64500｜來源與迴圈</text><text x="46" y="580.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">檢查</text><text x="46" y="616.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">宣告 192.0.2.0/24 →</text><text x="46" y="648.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64497</text><text x="46" y="680.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">送出 AS_PATH：64500</text><text x="46" y="712.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">從 AS64498 收到</text><text x="46" y="744.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64498 64496 64497</text><text x="46" y="776.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64500；含自己的 64500</text><text x="46" y="808.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">，排除迴圈。</text><rect x="360" y="101.6" width="280" height="336" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="376" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64497｜向右公告</text><text x="376" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">收到來自 AS64500 的</text><text x="376" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64500</text><text x="376" y="233.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">向 AS64496 公告：</text><text x="376" y="265.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64497 64500</text><rect x="690" y="512.6" width="280" height="336" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="706" y="544.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64496｜向下公告</text><text x="706" y="580.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">收到來自 AS64497 的</text><text x="706" y="612.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64497 64500</text><text x="706" y="644.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">向 AS64498 公告：</text><text x="706" y="676.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64496 64497 64500</text><rect x="360" y="923.6" width="280" height="336" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="376" y="955.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64498｜回到來源</text><text x="376" y="991.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">收到來自 AS64496 的</text><text x="376" y="1023.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64496 64497 64500</text><text x="376" y="1055.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">向 AS64500 公告：</text><text x="376" y="1087.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64498 64496 64497</text><text x="376" y="1119.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64500</text><text x="28" y="1329.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">四個 AS 形成菱形。箭頭表示此例公告方向：AS64500 → AS64497 → AS64496 → AS64498 →</text><text x="28" y="1361.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64500；回到來源的公告含本身 ASN，因此排除。這不是資料封包的轉送箭頭。</text></g></svg>
