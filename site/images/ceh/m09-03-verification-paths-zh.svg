<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">兩條查證路線</title>
<desc id="desc">每一步的聯絡資料，是誰提供的？ 路線 A：來源仍在同一圈: 路線 A：可疑簡訊 → 簡訊內客服連結 → 客服提供的回撥號碼 → 對方說「確實是我們」。 路線 B：回到既有可信程序: 路線 B：可疑簡訊 → 暫停 → 自己開啟既有公司服務台 → 核對工單與承辦人 → 按權限處理。</desc>
<rect width="1000" height="640" fill="#f5f8fa"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#18252c">
<text x="42" y="60" font-size="30" font-weight="700">兩條查證路線</text>
<text x="42" y="100" font-size="20">每一步的聯絡資料，是誰提供的？</text>
<rect x="40" y="138" width="920" height="210" rx="12" fill="#ffffff" stroke="#5a7282" stroke-width="2"/>
<text x="64" y="178" font-size="25" font-weight="700">路線 A：來源仍在同一圈</text>
<text x="64" y="220" font-size="23">路線 A：可疑簡訊 → 簡訊內客服連結 → 客服提供的回撥號碼</text>
<text x="64" y="252" font-size="23"> → 對方說「確實是我們」。</text>
<rect x="40" y="373" width="920" height="210" rx="12" fill="#ffffff" stroke="#5a7282" stroke-width="2"/>
<text x="64" y="413" font-size="25" font-weight="700">路線 B：回到既有可信程序</text>
<text x="64" y="455" font-size="23">路線 B：可疑簡訊 → 暫停 → 自己開啟既有公司服務台 → </text>
<text x="64" y="487" font-size="23">核對工單與承辦人 → 按權限處理。</text>
</g></svg>
