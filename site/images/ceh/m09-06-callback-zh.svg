<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 885" role="img" aria-labelledby="m0906-f2-zh-m09-06-callback-zh-TW-title m0906-f2-zh-m09-06-callback-zh-TW-desc" preserveAspectRatio="xMidYMid meet"><title id="m0906-f2-zh-m09-06-callback-zh-TW-title">圖 2｜回撥查核：換管道，也換來源</title><desc id="m0906-f2-zh-m09-06-callback-zh-TW-desc">依既有聯絡資料回撥，查證特定要求與核准；否認或不明時停止，而不是沿可疑訊息提供的號碼查證。</desc><defs><marker id="m0906-f2-zh-m09-06-callback-zh-TW-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a" /></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="885" rx="22" fill="#f6f9fb" /><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">圖 2｜回撥查核：換管道，也換來源</text><rect x="30" y="78" width="245" height="57" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="152" y="114" text-anchor="middle" font-size="24" fill="#172e40" font-weight="700">接收者</text><rect x="325" y="78" width="245" height="57" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5" /><text x="447" y="114" text-anchor="middle" font-size="24" fill="#172e40" font-weight="700">既有可信聯絡人</text><path d="M152,145V748 M447,145V748" stroke="#b7cad5" stroke-width="2" stroke-dasharray="5 6" /><rect x="35" y="165" width="530" height="100" rx="16" fill="#fff0d5" stroke="#b8cbd6" stroke-width="1.5" /><text x="55" y="199" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">① 暫停敏感動作</text><text x="55" y="235" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">不回撥訊息附的新號碼</text><text x="300" y="309" text-anchor="middle" font-size="21" fill="#172e40" font-weight="400">② 用既有通訊錄號碼回撥</text><path d="M152,331 L447,331" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0906-f2-zh-m09-06-callback-zh-TW-arrow)" /><text x="300" y="379" text-anchor="middle" font-size="21" fill="#172e40" font-weight="400">③ 詢問特定要求與目的地</text><path d="M152,401 L447,401" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0906-f2-zh-m09-06-callback-zh-TW-arrow)" /><text x="300" y="449" text-anchor="middle" font-size="21" fill="#172e40" font-weight="400">④ 接收回覆，另核對正式核准</text><path d="M447,471 L152,471" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0906-f2-zh-m09-06-callback-zh-TW-arrow)" /><rect x="35" y="516" width="530" height="100" rx="16" fill="#fbe3e3" stroke="#b8cbd6" stroke-width="1.5" /><text x="55" y="550" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">否認／不明／無核准</text><text x="55" y="586" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">暫停 + 保存訊息 + 通報</text><rect x="35" y="645" width="530" height="100" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5" /><text x="55" y="679" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">身分、要求、授權均核實</text><text x="55" y="715" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">僅執行核准的必要範圍</text><text x="30" y="789" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">箭頭＝通訊方向</text><text x="30" y="817" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">兩種結果不是連續步驟</text><text x="30" y="845" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">熟悉的聲音不是單獨充分的證據</text></g></svg>