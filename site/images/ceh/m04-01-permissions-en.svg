<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 454" role="img" aria-labelledby="title desc"><title id="title">One file request, two permission layers</title><desc id="desc">For SMB access to Windows NTFS files. Locate a denial using the full response and relevant evidence.</desc><rect x="1" y="1" width="678" height="452" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">One file request, two permission layers</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">Share permissions</text><text x="40" y="120" font-size="17">Operations allowed through the network share.</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">NTFS permissions</text><text x="40" y="215" font-size="17">Operations allowed on the specified folder or file.</text><rect x="24" y="256" width="632" height="104" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">Observed result</text><text x="40" y="310" font-size="17">Both layers matter; one denial describes that particular</text><text x="40" y="333" font-size="17">request.</text><text x="24" y="394" font-size="17">For SMB access to Windows NTFS files. Locate a denial using the</text><text x="24" y="419" font-size="17">full response and relevant evidence.</text></g></svg>
