<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title desc"><title id="title">One file request, two permission layers</title><desc id="desc">For SMB access to Windows NTFS files. Locate a denial using the full response and relevant evidence.</desc><rect width="720" height="410" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">One file request, two permission layers</text><text x="30" y="69" font-size="16" font-weight="400">For SMB access to Windows NTFS files. Locate a denial using the full respons</text><text x="30" y="95" font-size="16" font-weight="400">e and relevant evidence.</text><rect x="30" y="141" width="320" height="106" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="168" font-size="16" font-weight="650">Share permissions</text><text x="46" y="194" font-size="16" font-weight="400">Operations allowed through the ne</text><text x="46" y="220" font-size="16" font-weight="400">twork share.</text><rect x="370" y="141" width="320" height="106" rx="12" fill="#fffef9" stroke="#778d80"/><text x="386" y="168" font-size="16" font-weight="650">NTFS permissions</text><text x="386" y="194" font-size="16" font-weight="400">Operations allowed on the specifi</text><text x="386" y="220" font-size="16" font-weight="400">ed folder or file.</text><text x="42" y="267" font-size="16" font-weight="400">↓ Both layers contribute to this result</text><rect x="30" y="305" width="660" height="80" rx="12" fill="#e8f0ef" stroke="#778d80"/><text x="46" y="332" font-size="16" font-weight="650">Observed result</text><text x="46" y="358" font-size="16" font-weight="400">Both layers matter; one denial describes that particular request.</text></g></svg>
