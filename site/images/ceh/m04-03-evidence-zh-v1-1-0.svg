<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 637.5" role="img" aria-labelledby="ftpsmtp-evidence-zh-title ftpsmtp-evidence-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="ftpsmtp-evidence-zh-title">圖 2｜列舉的「證據三層」判讀法</title><desc id="ftpsmtp-evidence-zh-desc">同一筆回覆，只能支持它所對應的那一步操作。驗證結論 = 實際回覆 + 對應命令 + 測試身分 + 政策範圍 + 可重查證據。三張卡是並列判讀面向，不是通訊步驟。</desc><g transform="scale(0.75)"><rect width="1200" height="850" fill="#f5f8fc" /><text x="45" y="55.0" font-family="Noto Sans CJK TC,sans-serif" font-size="30" fill="#173450">圖 2｜列舉的「證據三層」判讀法</text><rect x="40" y="165" width="350" height="455" rx="16" fill="#ffffff" stroke="#b7c9df" /><rect x="55" y="185" width="320" height="110" rx="16" fill="#e7f0ff" stroke="#b7c9df" /><text x="70" y="225.0" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#205e96">① 看到了什麼？</text><text x="65" y="345.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#205e96">FTP：MLSD 顯示檔名</text><text x="65" y="445.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#205e96">SMTP：EHLO 宣告</text><text x="65" y="479.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#205e96">STARTTLS</text><text x="65" y="545.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#205e96">→ 這是可觀察的線索</text><rect x="430" y="165" width="350" height="455" rx="16" fill="#ffffff" stroke="#b7c9df" /><rect x="445" y="185" width="320" height="110" rx="16" fill="#e1f5ef" stroke="#b7c9df" /><text x="460" y="225.0" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#11635d">② 真正完成什麼？</text><text x="455" y="345.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#11635d">FTP：226 對應清單傳完</text><text x="455" y="445.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#11635d">SMTP：250 對應指定要求</text><text x="455" y="545.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#11635d">→ 證明「該步」已處理</text><rect x="820" y="165" width="350" height="455" rx="16" fill="#ffffff" stroke="#b7c9df" /><rect x="835" y="185" width="320" height="110" rx="16" fill="#fff2e1" stroke="#b7c9df" /><text x="850" y="225.0" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#885217">③ 還不能推論什麼？</text><text x="845" y="345.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">FTP：不能推論可下載／</text><text x="845" y="379.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">可寫</text><text x="845" y="445.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">SMTP：不能推論已登入／</text><text x="845" y="479.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">寄達</text><text x="845" y="545.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">→ 還需要其他證據</text><text x="45" y="685.0" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#173450">同一筆回覆，只能支持它所對應的那一步操作。驗證結論 = 實際回覆 + 對應命令 + 測試身分 +</text><text x="45" y="718.0" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#173450">政策範圍 + 可重查證據。三張卡是並列判讀面向，不是通訊步驟。</text></g></svg>
