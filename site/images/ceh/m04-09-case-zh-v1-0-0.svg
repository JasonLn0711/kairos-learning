<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 519.84" role="img" aria-labelledby="m0409-case-zh-title m0409-case-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-case-zh-title">合成查核紀錄：VPN 端點回覆 IKE_SA_INIT</title><desc id="m0409-case-zh-desc">本例是教學用合成觀察，沒有連線到真實 VPN，也不表示已找到漏洞。</desc><defs><marker id="m0409-case-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">合成查核紀錄：VPN 端點回覆 IKE_SA_INIT</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">可以確認</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">該端點對這次初始協商有回應。</text><rect x="40" y="229.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="261.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">不能確認</text><text x="56" y="297.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">測試者已成功登入 VPN。</text><rect x="40" y="357.6" width="920" height="108" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="389.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">需要補證</text><text x="56" y="425.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">身分驗證、資料通道、存取政策及授權資源測試。</text><text x="28" y="525.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">本例是教學用合成觀察，沒有連線到真實 VPN，也不表示已找到漏洞。</text></g></svg>
