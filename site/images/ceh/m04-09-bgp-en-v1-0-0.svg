64499, AS64498 ↔ AS64499. This example selects AS64500 → AS64497 →</text><text x="28" y="620.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64496. Solid lines show peer relationships; text and green borders also</text><text x="28" y="652.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">identify the selected route.</text></g></svg>
