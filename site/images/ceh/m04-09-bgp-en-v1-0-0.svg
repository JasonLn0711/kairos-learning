<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634.14" role="img" aria-labelledby="m0409-bgp-en-title m0409-bgp-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-bgp-en-title">Two candidate routes between autonomous systems</title><desc id="m0409-bgp-en-desc">BGP peers: AS64500 ↔ AS64497, AS64500 ↔ AS64498, AS64497 ↔ AS64496, AS64497 ↔ AS64499, AS64498 ↔ AS64499. This example selects AS64500 → AS64497 → AS64496. Solid lines show peer relationships; text and green borders also identify the selected route.</desc><defs><marker id="m0409-bgp-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Two candidate routes between autonomous systems</text><path d="M300 186.6H370" fill="none" stroke="#47748e" stroke-width="3" /><path d="M630 186.6H700" fill="none" stroke="#47748e" stroke-width="3" /><path d="M170 271.6V321.6" fill="none" stroke="#47748e" stroke-width="3" /><path d="M500 271.6V321.6" fill="none" stroke="#47748e" stroke-width="3" /><path d="M300 406.6H370" fill="none" stroke="#47748e" stroke-width="3" /><rect x="40" y="101.6" width="260" height="170" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64500</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Source host;</text><text x="56" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">dual-upstream AS</text><rect x="370" y="101.6" width="260" height="172" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="386" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64497</text><text x="386" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-