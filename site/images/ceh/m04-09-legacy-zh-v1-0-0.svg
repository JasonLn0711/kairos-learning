<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 663.84" role="img" aria-labelledby="m0409-legacy-zh-title m0409-legacy-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-legacy-zh-title">兩種舊協定，各有不同的權限界線</title><desc id="m0409-legacy-zh-desc">兩張卡片比較不同服務；上下排列不代表先後步驟。</desc><defs><marker id="m0409-legacy-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">兩種舊協定，各有不同的權限界線</text><rect x="40" y="101.6" width="920" height="236" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Telnet：舊式遠端操作電腦</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">想像你在自己的電腦上，遠端打開另外一台電腦的文字終端機。</text><text x="56" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Telnet 常見 TCP 23，傳統 Telnet 不提供加密保護，因此帳號密碼和指令可能在傳輸過程中</text><text x="56" y="233.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">被觀察到。</text><text x="56" y="265.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">現代遠端管理通常應優先使用 SSH。</text><text x="56" y="297.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">但你看到 Telnet 登入畫面，只代表看到了登入入口，還不代表登入成功。</text><rect x="40" y="357.6" width="920" height="268" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="389.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">TFTP：簡易檔案傳輸</text><text x="56" y="425.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">想像機房有個簡單文件櫃，設備可以依事先知道的檔名，請求下載或上傳檔案。</text><text x="56" y="457.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">TFTP 常見 UDP 69 作為初始請求入口，之後的資料交換使用另外選定的 UDP 傳輸識別埠。</text><text x="56" y="489.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">基本 TFTP 沒有一般使用者登入驗證，也沒有標準目錄瀏覽功能。但仍可能受到檔案權限、來源限</text><text x="56" y="521.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">制與伺服器設定保護。</text><text x="56" y="553.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">這裡要記住：TFTP 不需要輸入帳號密碼，不表示可以拿到所有檔案，更不表示能任意改寫伺服器上</text><text x="56" y="585.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">的內容。</text><text x="28" y="685.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">兩張卡片比較不同服務；上下排列不代表先後步驟。</text></g></svg>
