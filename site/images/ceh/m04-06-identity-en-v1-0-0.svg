<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880.0 309.6" role="img" aria-labelledby="m0406-identity-en-title m0406-identity-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0406-identity-en-title">Figure 2 | Same name, different UID</title><desc id="m0406-identity-en-desc">The computers are compared in parallel. Matching names and GIDs do not turn a different UID into the file owner.</desc><rect width="880.0" height="309.6" fill="#ffffff" /><g transform="scale(0.8)" font-family="sans-serif" fill="#173450"><text x="24" y="40" font-size="22" font-weight="700">Figure 2 | Same name, different UID</text><rect x="24" y="88" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="118" font-size="18" font-weight="700">Computer A | NFS Client</text><text x="44" y="151" font-size="18" font-weight="400">User learner; UID 1001; GID 3000</text><rect x="24" y="192" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="222" font-size="18" font-weight="700">Computer B | NFS Server</text><text x="44" y="255" font-size="18" font-weight="400">User learner; UID 2001; GID 3000</text><text x="24" y="306" font-size="18" font-weight="400">The computers are compared in parallel. Matching names and GIDs do not turn a different UID into the fil</text><text x="24" y="334" font-size="18" font-weight="400">e owner.</text></g></svg>