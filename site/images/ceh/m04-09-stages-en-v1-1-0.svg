<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 509.94000000000005" role="img" aria-labelledby="m0409-stages-en-title m0409-stages-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-stages-en-title">M03 → M04 → M05: from entry points to risk</title><desc id="m0409-stages-en-desc">Arrows show the curriculum’s reasoning sequence. Discovering a service still requires evidence before a vulnerability conclusion.</desc><defs><marker id="m0409-stages-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">M03 → M04 → M05: from entry points to risk</text><rect x="40.0" y="101.6" width="283.3333333333333" height="316" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">M03 | Scanning:</text><text x="56.0" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">find building</text><text x="56.0" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">entrances</text><text x="56.0" y="241.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Which hosts and</text><text x="56.0" y="273.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">services exist?</text><rect x="358.3333333333333" y="101.6" width="283.3333333333333" height="316" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="374.3333333333333" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">M04 |</text><text x="374.3333333333333" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Enumeration: ask</text><text x="374.3333333333333" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">the reception</text><text x="374.3333333333333" y="241.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">desk</text><text x="374.3333333333333" y="277.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">What will the</text><text x="374.3333333333333" y="309.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">service reveal?</text><path d="M328.3333333333333 259.6H353.3333333333333" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-stages-en-arrow)" /><rect x="676.6666666666666" y="101.6" width="283.3333333333333" height="316" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="692.6666666666666" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">M05 |</text><text x="692.6666666666666" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Vulnerability:</text><text x="692.6666666666666" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">analyze</text><text x="692.6666666666666" y="241.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">protection</text><text x="692.6666666666666" y="277.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">weaknesses</text><text x="692.6666666666666" y="313.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Is there a risk</text><text x="692.6666666666666" y="345.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">supported by</text><text x="692.6666666666666" y="377.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">evidence?</text><path d="M646.6666666666666 259.6H671.6666666666666" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-stages-en-arrow)" /><text x="28" y="482.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Arrows show the curriculum’s reasoning sequence. Discovering a