<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940.5" role="img" aria-labelledby="m0501-workflow-zh-title m0501-workflow-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0501-workflow-zh-title">圖 4｜從授權到修補複測的五步工作流程</title><desc id="m0501-workflow-zh-desc">第四步須視需求及授權決定；五個節點表示工作順序，不表示每次都必須執行漏洞利用。</desc><defs><marker id="m0501-workflow-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 4｜從授權到修補複測的五步工作流程</text><rect x="40.0" y="108" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="142.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">確認測試授權與範圍</text><text x="60.0" y="179.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">指定系統、時段、帳號、可使用的方法、禁止事項與停止條件。</text><path d="M500 245V272" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0501-workflow-zh-arrow)" /><rect x="40.0" y="287" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="321.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">蒐集線索</text><text x="60.0" y="358.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">使用掃描、設定檢查、程式檢閱等方式發現疑似弱點。</text><path d="M500 424V451" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0501-workflow-zh-arrow)" /><rect x="40.0" y="466" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="500.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">核對與分析</text><text x="60.0" y="537.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">確認是否真的存在、影響哪些資產、風險有多高。</text><path d="M500 603V630" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0501-workflow-zh-arrow)" /><rect x="40.0" y="645" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="679.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">必要時進行受控驗證</text><text x="60.0" y="716.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">只有在授權涵蓋的情況下，才進一步測試可利用性與影響。</text><path d="M500 782V809" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0501-workflow-zh-arrow)" /><rect x="40.0" y="824" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="858.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">修補並複測</text><text x="60.0" y="895.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">保留原始證據、修改紀錄與驗證結果。</text><text x="28" y="985.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">第四步須視需求及授權決定；五個節點表示工作順序，不表示每次都必須執行漏洞利用。</text></g></svg>
