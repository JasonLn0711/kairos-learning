<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 617.0400000000001" role="img" aria-labelledby="m0409-ike-zh-title m0409-ike-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-ike-zh-title">家裡電腦 → VPN 閘道 → 公司內網</title><desc id="m0409-ike-zh-desc">這條路徑是角色示意。下列三項依序說明初始協商、身分驗證及可用性檢查；它們不是 IKEv1 的階段，也不是三個固定 IKEv2 交換。</desc><defs><marker id="m0409-ike-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">家裡電腦 → VPN 閘道 → 公司內網</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IKE_SA_INIT：談好保護方式</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">例如雙方協商加密演算法、交換建立金鑰所需的材料。</text><path d="M500 221.6V251.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ike-zh-arrow)" /><rect x="40" y="267.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="299.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IKE_AUTH：驗證雙方身分</text><text x="56" y="335.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">使用憑證或其他配置的驗證方式，確認連線對象；通常也協商第一組 CHILD_SA。</text><path d="M500 387.6V417.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ike-zh-arrow)" /><rect x="40" y="433.6" width="920" height="108" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="465.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">確認可用的資料通道</text><text x="56" y="501.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">還要有適當的 IPsec 資料安全關聯與路由、存取政策，才可能真正使用內部資源。</text><text x="28" y="601.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">這條路徑是角色示意。下列三項依序說明初始協商、身分驗證及可用性檢查；它們不是 IKEv1 的階段，</text><text x="28" y="633.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">也不是三個固定 IKEv2 交換。</text></g></svg>
