<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="795" viewBox="0 0 1000 795" role="img" aria-labelledby="title desc">
<title id="title">多一步驗證，不等於抗釣魚</title><desc id="desc">比較的是驗證輸出能否被轉交，以及它是否綁定正確的驗證對象。 傳統 OTP: 本例的簡訊驗證碼有期限、只能使用一次，仍可能被即時轉交給攻擊者。 抗釣魚驗證: 例如正確實作的 FIDO2／WebAuthn 驗證，透過密碼學機制綁定驗證對象。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker></defs>
<rect width="1000" height="795" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="42" y="37" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · 圖 4</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">多一步驗證，不等於抗釣魚</text>
<text x="42" y="135" font-size="18" font-weight="400" fill="#43576a" text-anchor="start">比較的是驗證輸出能否被轉交，以及它是否綁定正確的驗證對象。</text>
<rect x="42" y="185" width="446" height="500" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="228" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="start">傳統 OTP</text>
<rect x="66" y="320" width="165" height="114" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<rect x="299" y="320" width="165" height="114" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="148" y="363" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">手機上的 OTP</text>
<text x="381" y="363" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">其他人</text>
<path d="M 240 377 L 290 377" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="265" y="478" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="middle">可被即時轉交</text>
<text x="66" y="538" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">本例的簡訊驗證碼有期限、只能使用一次，</text>
<text x="66" y="568" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">仍可能被即時轉交給攻擊者。</text>
<rect x="512" y="185" width="446" height="500" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="536" y="228" font-size="23" font-weight="700" fill="#0f766e" text-anchor="start">抗釣魚驗證</text>
<rect x="536" y="320" width="165" height="114" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<rect x="769" y="320" width="165" height="114" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="618" y="363" font-size="20" font-weight="700" fill="#0f766e" text-anchor="middle">驗證器</text>
<text x="851" y="363" font-size="20" font-weight="700" fill="#0f766e" text-anchor="middle">綁定的服務</text>
<path d="M 710 377 L 760 377" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="735" y="478" font-size="19" font-weight="700" fill="#0f766e" text-anchor="middle">傳送綁定的證明</text>
<text x="536" y="538" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">例如正確實作的 FIDO2／WebAuthn 驗證，</text>
<text x="536" y="568" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">透過密碼學機制綁定驗證對象。</text>
<text x="42" y="738" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">抗釣魚驗證保護驗證環節，不會自動證明每筆付款或資料要求都有授權。</text>
</g></svg>
