<svg xmlns="http://www.w3.org/2000/svg" width="800" height="930" viewBox="0 0 800 930" role="img" aria-labelledby="m0903-f4-zh-title m0903-f4-zh-desc">
<title id="m0903-f4-zh-title">可轉交的碼，與綁定的驗證證明</title><desc id="m0903-f4-zh-desc">比較驗證機制；不是增加一步就自動抗釣魚。</desc>
<defs>
<marker id="m0903-f4-zh-flow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#1d4ed8"/></marker>
<marker id="m0903-f4-zh-attempt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#92400e"/></marker>
<marker id="m0903-f4-zh-process" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker>
</defs>
<rect width="800" height="930" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="28" y="30" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · 圖 4</text>
<text x="28" y="70" font-size="28" font-weight="700" fill="#172b3a" text-anchor="start">可轉交的碼，與綁定的驗證證明</text>
<text x="28" y="111" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">比較驗證機制；不是增加一步就自動抗釣魚。</text>
<rect x="24" y="150" width="752" height="235" rx="12" fill="#fffbeb" stroke="#92400e" stroke-width="1.5"/>
<text x="42" y="183" font-size="22" font-weight="700" fill="#92400e" text-anchor="start">A｜SMS OTP：可以被人轉交</text>
<rect x="48" y="225" width="160" height="100" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="128.0" y="267.0" font-size="20" font-weight="700" fill="#172b3a" text-anchor="middle">手機上的碼</text>
<text x="128.0" y="298.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">SMS OTP</text>
<rect x="320" y="225" width="160" height="100" rx="12" fill="#fffbeb" stroke="#64748b" stroke-width="1.5"/>
<text x="400.0" y="267.0" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">冒充者</text>
<text x="400.0" y="298.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">獲得真碼</text>
<rect x="592" y="225" width="160" height="100" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="672.0" y="267.0" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">平台驗證端</text>
<text x="672.0" y="298.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">仍檢查其他條件</text>
<path d="M 208 272 L 310 272" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f4-zh-flow)"/>
<rect x="240.0" y="233" width="40.0" height="24" rx="3" fill="#ffffff"/>
<text x="260" y="252" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">轉交</text>
<path d="M 480 272 L 582 272" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m0903-f4-zh-attempt)"/>
<rect x="495.0" y="233" width="74.0" height="24" rx="3" fill="#ffffff"/>
<text x="532" y="252" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">提交嘗試</text>
<text x="42" y="360" font-size="18" font-weight="400" fill="#92400e" text-anchor="start">期限＋單次使用，不會自動阻止即時轉交。</text>
<rect x="24" y="420" width="752" height="370" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="42" y="453" font-size="22" font-weight="700" fill="#0f766e" text-anchor="start">B｜FIDO2／WebAuthn：綁定的驗證證明</text>
<rect x="48" y="510" width="192" height="135" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="144.0" y="556.5" font-size="19" font-weight="700" fill="#0f766e" text-anchor="middle">驗證器</text>
<text x="144.0" y="581.5" font-size="19" font-weight="700" fill="#0f766e" text-anchor="middle">Authenticator</text>
<text x="144.0" y="612.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">驗證回覆不傳私鑰</text>
<rect x="310" y="510" width="182" height="135" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="401.0" y="557.5" font-size="19" font-weight="700" fill="#172b3a" text-anchor="middle">瀏覽器／Origin</text>
<text x="401.0" y="588.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">核對 Origin／RP</text>
<text x="401.0" y="611.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">ID 範圍</text>
<rect x="570" y="510" width="182" height="135" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="661.0" y="557.5" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="middle">真正服務 RP</text>
<text x="661.0" y="588.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">核對來源／挑戰／</text>
<text x="661.0" y="611.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">簽章</text>
<path d="M 240 567 L 300 567" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f4-zh-flow)"/>
<path d="M 492 567 L 560 567" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f4-zh-flow)"/>
<text x="401" y="490" font-size="18" font-weight="700" fill="#0f766e" text-anchor="middle">只傳送簽章證明，不傳私鑰</text>
<rect x="310" y="690" width="182" height="76" rx="12" fill="#fffbeb" stroke="#64748b" stroke-width="1.5"/>
<text x="401.0" y="719.5" font-size="19" font-weight="700" fill="#92400e" text-anchor="middle">假網站 Origin</text>
<text x="401.0" y="750.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">不符憑證範圍</text>
<path d="M 400 690 L 400 657" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m0903-f4-zh-attempt)"/>
<path d="M 393 651 L 407 665 M 407 651 L 393 665" stroke="#92400e" stroke-width="3" fill="none"/>
<text x="623" y="716" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">綁定不符 → 拒絕存取憑證</text>
<line x1="28" y1="822" x2="772" y2="822" stroke="#64748b" stroke-width="1"/>
<text x="28" y="847" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">→ 驗證輸出／簽章證明；⇢ 不符 Origin／RP ID 的嘗試；× 拒絕。</text>
<text x="28" y="874" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">驗證成功 ≠ 每筆付款或資料要求都有授權。</text>
</g></svg>
