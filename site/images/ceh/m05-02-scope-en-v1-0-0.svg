<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552.6" role="img" aria-labelledby="m0502-scope-en-title m0502-scope-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0502-scope-en-title">Figure 2 | Dependencies and authorization scope</title><desc id="m0502-scope-en-desc">A depends on B and C; arrows denote dependencies. Only specified checks on A are authorized. Connections do not extend permission.</desc><defs><marker id="m0502-scope-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 2 | Dependencies and authorization scope</text><rect x="40.0" y="108" width="920.0" height="153" rx="16" fill="#edf6f4" stroke="#47748e" stroke-width="2" /><text x="60.0" y="142.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">A: test ordering website</text><text x="60.0" y="179.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Authorized for this assessment: specified security settings and</text><text x="60.0" y="211.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">software versions.</text><path d="M500 261V289" fill="none" stroke="#47748e" stroke-width="3" /><path d="M500 289H270V314" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-scope-en-arrow)" /><path d="M500 289H730V314" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-scope-en-arrow)" /><rect x="40.0" y="329" width="448.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="363.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">B: production database</text><text x="60.0" y="400.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Internal company system; not</text><text x="60.0" y="432.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">authorized.</text><rect x="512.0" y="329" width="448.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="532.0" y="363.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">C: external payment service</text><text x="532.0" y="400.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Third-party provider; not</text><text x="532.0" y="432.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">authorized.</text><text x="28" y="522.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">A depends on B and C; arrows denote dependencies. Only specified checks on</text><text x="28" y="554.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">A are authorized. Connections do not extend permission.</text></g></svg>
