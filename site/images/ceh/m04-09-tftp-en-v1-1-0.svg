<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585.5400000000001" role="img" aria-labelledby="m0409-tftp-en-title m0409-tftp-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-tftp-en-title">TFTP: file requests, responses and access limits</title><desc id="m0409-tftp-en-desc">The sides represent client and server. ↔ denotes requests, data and acknowledgments, not arbitrary file permissions. No real transfer was performed.</desc><defs><marker id="m0409-tftp-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">TFTP: file requests, responses and access limits</text><rect x="40.0" y="101.6" width="442.5" height="368" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Client | Request a known</text><text x="56.0" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">filename</text><text x="56.0" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Request training.cfg → server</text><text x="56.0" y="237.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">UDP 69</text><text x="56.0" y="269.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Continue data and</text><text x="56.0" y="301.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">acknowledgments using the UDP</text><text x="56.0" y="333.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">TIDs selected by both sides.</text><rect x="517.5" y="101.6" width="442.5" height="368" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="533.5" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Server | Respond under</text><text x="533.5" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">policy</text><text x="533.5" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">← Return the particular file if</text><text x="533.5" y="237.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">allowed; otherwise respond with</text><text x="533.5" y="269.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">an error or provide no data.</text><text x="533.5" y="301.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Source, path and file</text><text x="533.5" y="333.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">permissions define the</text><text x="533.5" y="365.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">accessible scope; the base</text><text x="533.5" y="397.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">protocol has no directory</text><text x="533.5" y="429.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">browsing or user sign-in.</text><text x="28" y="534.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The sides represent client and server. ↔ denotes requests, data and</text><text x="28" y="566.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">acknowledgments, not arbitrary file permissions. No real transfer was</text><text x="28" y="598.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">performed.</text></g></svg>
