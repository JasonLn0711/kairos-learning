<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="smb-stages-en-title smb-stages-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="smb-stages-en-title">SMB enumeration｜A connection does not establish file permissions</title>
<desc id="smb-stages-en-desc">Treat a connection as five checkpoints. Each successful stage establishes only its own result. Locate the failed stage before diagnosing a refusal. Seeing a share name does not establish entry; reading a file does not establish modification or deletion rights.</desc>
<g transform="scale(0.5625)"><rect width="1600" height="1200" fill="#101b30" />
<text x="60" y="70.0" font-family="sans-serif" font-size="34" fill="#e8f0ff">SMB enumeration｜A connection does not establish file permissions</text>
<rect x="45" y="160" width="275" height="640" rx="18" fill="#1d304d" stroke="#527594" />
<text x="65" y="210.0" font-family="sans-serif" font-size="28" fill="#8cd6ff">01</text>
<text x="65" y="275.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Transport｜Establish</text>
<text x="65" y="314.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">connectivity</text>
<text x="65" y="470.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ TCP 445 is</text>
<text x="65" y="506.0" font-family="sans-serif" font-size="24" fill="#90e8cf">reachable</text>
<text x="65" y="620.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× Does not</text>
<text x="65" y="656.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">establish a</text>
<text x="65" y="692.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">share listing</text>
<path d="M325 430h20m-9-9 9 9-9 9" fill="none" stroke="#8cd6ff" stroke-width="3" />
<rect x="355" y="160" width="275" height="640" rx="18" fill="#1d304d" stroke="#527594" />
<text x="375" y="210.0" font-family="sans-serif" font-size="28" fill="#8cd6ff">02</text>
<text x="375" y="275.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Negotiate｜Agree</text>
<text x="375" y="314.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">on the protocol</text>
<text x="375" y="470.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ SMB version</text>
<text x="375" y="506.0" font-family="sans-serif" font-size="24" fill="#90e8cf">and capabilities</text>
<text x="375" y="620.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× Does not</text>
<text x="375" y="656.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">establish</text>
<text x="375" y="692.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">authentication</text>
<path d="M635 430h20m-9-9 9 9-9 9" fill="none" stroke="#8cd6ff" stroke-width="3" />
<rect x="665" y="160" width="275" height="640" rx="18" fill="#1d304d" stroke="#527594" />
<text x="685" y="210.0" font-family="sans-serif" font-size="28" fill="#8cd6ff">03</text>
<text x="685" y="275.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Session</text>
<text x="685" y="314.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Setup｜Establish</text>
<text x="685" y="353.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">identity</text>
<text x="685" y="470.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ Confirm the</text>
<text x="685" y="506.0" font-family="sans-serif" font-size="24" fill="#90e8cf">identity</text>
<text x="685" y="542.0" font-family="sans-serif" font-size="24" fill="#90e8cf">actually used</text>
<text x="685" y="620.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× Does not grant</text>
<text x="685" y="656.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">access to every</text>
<text x="685" y="692.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">share</text>
<path d="M945 430h20m-9-9 9 9-9 9" fill="none" stroke="#8cd6ff" stroke-width="3" />
<rect x="975" y="160" width="275" height="640" rx="18" fill="#1d304d" stroke="#527594" />
<text x="995" y="210.0" font-family="sans-serif" font-size="28" fill="#8cd6ff">04</text>
<text x="995" y="275.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Tree</text>
<text x="995" y="314.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Connect｜Connect</text>
<text x="995" y="353.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">to a share</text>
<text x="995" y="470.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ Training can</text>
<text x="995" y="506.0" font-family="sans-serif" font-size="24" fill="#90e8cf">be entered, for</text>
<text x="995" y="542.0" font-family="sans-serif" font-size="24" fill="#90e8cf">example</text>
<text x="995" y="620.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× Does not</text>
<text x="995" y="656.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">establish every</text>
<text x="995" y="692.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">file is readable</text>
<path d="M1255 430h20m-9-9 9 9-9 9" fill="none" stroke="#8cd6ff" stroke-width="3" />
<rect x="1285" y="160" width="275" height="640" rx="18" fill="#1d304d" stroke="#527594" />
<text x="1305" y="210.0" font-family="sans-serif" font-size="28" fill="#8cd6ff">05</text>
<text x="1305" y="275.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">File</text>
<text x="1305" y="314.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">Operation｜Operate</text>
<text x="1305" y="353.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">on</text>
<text x="1305" y="392.0" font-family="sans-serif" font-size="26" fill="#e8f0ff">files/directories</text>
<text x="1305" y="470.0" font-family="sans-serif" font-size="24" fill="#90e8cf">✓ Listing,</text>
<text x="1305" y="506.0" font-family="sans-serif" font-size="24" fill="#90e8cf">reading,</text>
<text x="1305" y="542.0" font-family="sans-serif" font-size="24" fill="#90e8cf">writing, and</text>
<text x="1305" y="578.0" font-family="sans-serif" font-size="24" fill="#90e8cf">more</text>
<text x="1305" y="620.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× Verify each</text>
<text x="1305" y="656.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">operation</text>
<text x="1305" y="692.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">separately</text>
<text x="60" y="985.0" font-family="sans-serif" font-size="24" fill="#c5d8ed">Treat a connection as five checkpoints. Each successful stage establishes only its own result. Locate the</text>
<text x="60" y="1021.0" font-family="sans-serif" font-size="24" fill="#c5d8ed">failed stage before diagnosing a refusal. Seeing a share name does not establish entry; reading a file</text>
<text x="60" y="1057.0" font-family="sans-serif" font-size="24" fill="#c5d8ed">does not establish modification or deletion rights.</text>
</g></svg>
