<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 739.6" role="img" aria-labelledby="m0506-paths-en-title m0506-paths-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0506-paths-en-title">Two observation scopes</title><desc id="m0506-paths-en-desc">Conceptual illustration: these paths are complementary observations, not successive steps for breaking into a system.</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">Two observation scopes</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">Conceptual illustration: these paths are complementary</text><text x="28" y="132.8" font-size="20" fill="#18252c">observations, not successive steps for breaking into a system.</text><rect x="28" y="188.8" width="844" height="169.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="224.8" font-size="23" fill="#18252c" font-weight="700">Company Linux server</text><text x="48" y="266.2" font-size="20" fill="#18252c">Website service, operating system, packages and configuration</text><text x="48" y="302.2" font-size="20" fill="#18252c">files</text><rect x="28" y="378.20000000000005" width="412" height="325.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="414.20000000000005" font-size="23" fill="#18252c" font-weight="700">Scan without login</text><text x="48" y="455.6" font-size="20" fill="#18252c">Observe network responses,</text><text x="48" y="491.6" font-size="20" fill="#18252c">exposed services and public</text><text x="48" y="527.6" font-size="20" fill="#18252c">version information.</text><text x="48" y="575.6" font-size="20" fill="#18252c">“What can be seen from</text><text x="48" y="611.6" font-size="20" fill="#18252c">outside?”</text><rect x="460" y="378.20000000000005" width="412" height="325.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="480" y="414.20000000000005" font-size="23" fill="#18252c" font-weight="700">Scan with login</text><text x="480" y="455.6" font-size="20" fill="#18252c">Inspect package versions,</text><text x="480" y="491.6" font-size="20" fill="#18252c">patch records and system</text><text x="480" y="527.6" font-size="20" fill="#18252c">settings within the account</text><text x="480" y="563.6" font-size="20" fill="#18252c">privileges.</text><text x="480" y="611.6" font-size="20" fill="#18252c">“What is actually installed</text><text x="480" y="647.6" font-size="20" fill="#18252c">inside?”</text></g></svg>
