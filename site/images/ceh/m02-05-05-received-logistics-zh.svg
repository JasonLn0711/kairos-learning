<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-labelledby="m0205-f5-zh-title m0205-f5-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0205-f5-zh-title">圖 5｜Received 像逐站蓋章的物流單</title>
<desc id="m0205-f5-zh-desc">最上方／最新：10:00:10 / 第三站：我方可信收件服務 / 查核起點：比對本站伺服器日誌；中間：10:00:05 / 第二站：前一個郵件中繼站 / 逐站核對來源與可取得的日誌；最下方／最早：10:00:00 / 第一站：更早的郵件接收節點 / 外部記載以來源與日誌逐項核實；兩個方向，各回答一個問題 / 時間還原：下 → 中 → 上 / 信任查核：我方最上站 → 逐站向前</desc>
<rect x="1" y="1" width="598" height="748" rx="20" fill="#f8fafc" stroke="#b7c7d5" />
<text x="300" y="37" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">圖 5｜Received 像逐站蓋章的物流單</text>
<rect x="26" y="64" width="548" height="112" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="300" y="93" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">最上方／最新：10:00:10</text>
<text x="300" y="120" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">第三站：我方可信收件服務</text>
<text x="300" y="147" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">查核起點：比對本站伺服器日誌</text>
<rect x="26" y="192" width="548" height="112" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="300" y="221" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">中間：10:00:05</text>
<text x="300" y="248" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">第二站：前一個郵件中繼站</text>
<text x="300" y="275" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">逐站核對來源與可取得的日誌</text>
<rect x="26" y="320" width="548" height="112" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="300" y="349" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">最下方／最早：10:00:00</text>
<text x="300" y="376" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">第一站：更早的郵件接收節點</text>
<text x="300" y="403" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">外部記載以來源與日誌逐項核實</text>
<rect x="26" y="448" width="548" height="112" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="300" y="477" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">兩個方向，各回答一個問題</text>
<text x="300" y="504" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">時間還原：下 → 中 → 上</text>
<text x="300" y="531" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">信任查核：我方最上站 → 逐站向前</text>
<text x="300" y="610" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">每站接收時，把新 Received 加在最上方</text>
<text x="300" y="637" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">信任邊界依我方郵件服務設定與日誌界定</text>
<text x="300" y="664" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">合成時間範例；實際判讀同時核對時區與時鐘</text>
</svg>