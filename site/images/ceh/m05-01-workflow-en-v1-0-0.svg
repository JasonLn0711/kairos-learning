<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1064.7" role="img" aria-labelledby="m0501-workflow-en-title m0501-workflow-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0501-workflow-en-title">Figure 4 | Five steps from authorization to remediation and retesting</title><desc id="m0501-workflow-en-desc">Step 4 depends on need and authorization. The five nodes show working order, not a requirement to exploit a vulnerability in every assessment.</desc><defs><marker id="m0501-workflow-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 4 | Five steps from authorization to remediation</text><text x="28" y="83.6" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">and retesting</text><rect x="40.0" y="150" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="184.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Confirm authorization and scope</text><text x="60.0" y="221.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Specify systems, time windows, accounts, allowed methods, prohibited</text><text x="60.0" y="253.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">actions and stop conditions.</text><path d="M500 319V346" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0501-workflow-en-arrow)" /><rect x="40.0" y="361" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="395.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Gather clues</text><text x="60.0" y="432.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Use scanning, configuration checks and code review to discover</text><text x="60.0" y="464.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">suspected vulnerabilities.</text><path d="M500 530V557" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0501-workflow-en-arrow)" /><rect x="40.0" y="572" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="606.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Verify and analyze</text><text x="60.0" y="643.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Confirm presence, affected assets and risk.</text><path d="M500 709V736" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0501-workflow-en-arrow)" /><rect x="40.0" y="751" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="785.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Perform controlled validation if needed</text><text x="60.0" y="822.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Test exploitability and impact only when covered by authorization.</text><path d="M500 888V915" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0501-workflow-en-arrow)" /><rect x="40.0" y="930" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="964.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Remediate and retest</text><text x="60.0" y="1001.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Retain original evidence, change records and validation results.</text><text x="28" y="1091.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Step 4 depends on need and authorization. The five nodes show working</text><text x="28" y="1123.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">order, not a requirement to exploit a vulnerability in every assessment.</text></g></svg>
