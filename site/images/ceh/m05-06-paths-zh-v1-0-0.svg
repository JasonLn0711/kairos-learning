<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559.6" role="img" aria-labelledby="m0506-paths-zh-title m0506-paths-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0506-paths-zh-title">兩種掃描的觀察範圍</title><desc id="m0506-paths-zh-desc">概念示意：兩條路徑是互補的觀察方式，不是破解系統的先後步驟。</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">兩種掃描的觀察範圍</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">概念示意：兩條路徑是互補的觀察方式，不是破解系統的先後步驟。</text><rect x="28" y="152.8" width="844" height="133.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="188.8" font-size="23" fill="#18252c" font-weight="700">公司 Linux 伺服器</text><text x="48" y="230.20000000000002" font-size="20" fill="#18252c">網站服務、作業系統、套件、設定檔</text><rect x="28" y="306.20000000000005" width="412" height="217.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="342.20000000000005" font-size="23" fill="#18252c" font-weight="700">未登入掃描</text><text x="48" y="383.6" font-size="20" fill="#18252c">觀察網路回應、開放的服務、公開版本資</text><text x="48" y="419.6" font-size="20" fill="#18252c">訊</text><text x="48" y="467.6" font-size="20" fill="#18252c">「外面看得到什麼？」</text><rect x="460" y="306.20000000000005" width="412" height="217.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="480" y="342.20000000000005" font-size="23" fill="#18252c" font-weight="700">已登入掃描</text><text x="480" y="383.6" font-size="20" fill="#18252c">依帳號權限查看套件版本、修補紀錄、系</text><text x="480" y="419.6" font-size="20" fill="#18252c">統設定</text><text x="480" y="467.6" font-size="20" fill="#18252c">「裡面實際裝了什麼？」</text></g></svg>
