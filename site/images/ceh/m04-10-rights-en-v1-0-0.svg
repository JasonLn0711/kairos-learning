<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586.08" role="img" aria-labelledby="m0409-rights-en-title m0409-rights-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-rights-en-title">Figure 1 | Three distinct outcomes for the same Finance folder</title><desc id="m0409-rights-en-desc">These are parallel capabilities, without sequence arrows. Seeing a name does not grant reading; reading does not grant modification.</desc><defs><marker id="m0409-rights-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 1 | Three distinct outcomes for the same Finance</text><text x="28" y="79.6" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">folder</text><rect x="40" y="143.2" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="175.2" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">See the name</text><text x="56" y="211.2" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Know that Finance exists</text><rect x="40" y="271.2" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="303.2" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Read the contents</text><text x="56" y="339.2" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Open financial statements</text><rect x="40" y="399.2" width="920" height="108" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="431.2" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Modify the contents</text><text x="56" y="467.2" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Change financial statements</text><text x="28" y="567.2" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">These are parallel capabilities, without sequence arrows. Seeing a name</text><text x="28" y="599.2" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">does not grant reading; reading does not grant modification.</text></g></svg>
