<text x="670.0" y="238.0" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">AUTHENTICATED?</text>
<text x="670.0" y="269.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Needs</text>
<text x="670.0" y="292.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">authentication logs</text>
<rect x="568" y="355" width="204" height="105" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="670.0" y="388.0" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">UNAUTHORIZED?</text>
<text x="670.0" y="419.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Needs access /</text>
<text x="670.0" y="442.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">authority evidence</text>
