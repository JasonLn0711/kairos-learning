<text x="670.0" y="538.0" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">EXFILTRATION?</text>
<text x="670.0" y="569.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Needs verified</text>
<text x="670.0" y="592.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">transfer scope</text>
<line x1="548" y1="190" x2="548" y2="615" stroke="#92400e" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="28" y="525" width="500" height="85" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="278.0" y="561.5" font-size="21" font-weight="700" fill="#172b3a" text-anchor="middle">ACT ON RISK; ESTABLISH OUTCOMES WITH</text>
<text x="278.0" y="588.5" font-size="21" font-weight="700" fill="#172b3a" text-anchor="middle">EVIDENCE</text>
<line x1="28" y1="655" x2="772" y2="655" stroke="#64748b" stroke-width="1"/>
<text x="28" y="680" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">Unheaded support line + dot = a record supports a limited conclusion, not progression.</text>
<text x="28" y="707" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">Each unknown outcome needs its own evidence; code disclosure is not enough.</text>
</g></svg>
