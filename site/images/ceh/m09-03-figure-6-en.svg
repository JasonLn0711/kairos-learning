<text x="143.0" y="268.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Available in this</text>
<text x="143.0" y="291.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">scenario</text>
<rect x="28" y="355" width="230" height="105" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="143.0" y="386.5" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle">REPORT OF</text>
<text x="143.0" y="413.5" font-size="21" font-weight="700" fill="#1d4ed8" text-anchor="middle">SHARING</text>
<text x="143.0" y="444.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">“I read out the OTP.”</text>
<rect x="298" y="205" width="230" height="105" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="413.0" y="237.5" font-size="19" font-weight="700" fill="#0f766e" text-anchor="middle">CONTACT OCCURRED</text>
<text x="413.0" y="268.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Identity may be</text>
<text x="413.0" y="291.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">unverified</text>
<rect x="298" y="355" width="230" height="105" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="413.0" y="388.5" font-size="21" font-weight="700" fill="#0f766e" text-anchor="middle">EXPOSURE RISK</text>
<text x="413.0" y="419.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Protect the account</text>
<text x="413.0" y="442.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">promptly</text>
