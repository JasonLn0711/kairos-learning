<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" role="img" aria-labelledby="ceh26m04c03-permissions-zh-title ceh26m04c03-permissions-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="ceh26m04c03-permissions-zh-title">圖 2｜三項權限分開找證據</title><desc id="ceh26m04c03-permissions-zh-desc">以下是三個獨立判斷，沒有必然先後或相互保證。</desc><rect x="1" y="1" width="898" height="554" rx="16" fill="#f3f7fb" stroke="#b7c9df" /><text x="35" y="44" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#172b49">圖 2｜三項權限分開找證據</text><text x="35" y="88" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">以下是三個獨立判斷，沒有必然先後或相互保證。</text><rect x="20" y="116" width="860" height="108" rx="12" fill="#ffffff" stroke="#8ba5bd" /><text x="35" y="140" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b49">名稱可見</text><text x="35" y="184" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">清單出現檔名與大小，支持看見中繼資料。</text><rect x="20" y="248" width="860" height="108" rx="12" fill="#ffffff" stroke="#8ba5bd" /><text x="35" y="272" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b49">內容可讀</text><text x="35" y="316" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">需要該檔案內容取得成功的證據；清單成功不等於下載成功。</text><rect x="20" y="380" width="860" height="108" rx="12" fill="#ffffff" stroke="#8ba5bd" /><text x="35" y="404" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b49">檔案可寫</text><text x="35" y="448" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">需要獲准的寫入驗證；本課範例沒有測試寫入。</text></svg>
