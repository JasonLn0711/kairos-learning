<svg xmlns="http://www.w3.org/2000/svg" width="720" height="542" viewBox="0 0 720 542" role="img" aria-labelledby="title desc"><title id="title">Address, endpoint, protocol: separate checks</title><desc id="desc">An open port, a confirmed SMB service, and a successful file read are different observations.</desc><rect width="720" height="542" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">Address, endpoint, protocol: separate checks</text><text x="30" y="69" font-size="16" font-weight="400">An open port, a confirmed SMB service, and a successful file read are</text><text x="30" y="95" font-size="16" font-weight="400">different observations.</text><rect x="30" y="141" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="168" font-size="16" font-weight="650">IP address → Check</text><text x="46" y="194" font-size="16" font-weight="400">Locates the device, like a street address.</text><rect x="30" y="235" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="262" font-size="16" font-weight="650">Port: TCP 445 → Check</text><text x="46" y="288" font-size="16" font-weight="400">Identifies an endpoint; open describes the observed connection response.</text><rect x="30" y="329" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="356" font-size="16" font-weight="650">SMB protocol → Check</text><text x="46" y="382" font-size="16" font-weight="400">Confirm it from protocol responses; a port-name label is a clue.</text><rect x="30" y="423" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="450" font-size="16" font-weight="650">Specified file operation → Check</text><text x="46" y="476" font-size="16" font-weight="400">Record the result for this identity, path, and action.</text></g></svg>
