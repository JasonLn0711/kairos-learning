<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 549" role="img" aria-labelledby="title desc"><title id="title">Address, endpoint, protocol: separate checks</title><desc id="desc">An open port, a confirmed SMB service, and a successful file read are different observations.</desc><rect x="1" y="1" width="678" height="547" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">Address, endpoint, protocol: separate checks</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">IP address</text><text x="40" y="120" font-size="17">Locates the device, like a street address.</text><rect x="24" y="161" width="632" height="104" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">Port: TCP 445</text><text x="40" y="215" font-size="17">Identifies an endpoint; open describes the observed connection</text><text x="40" y="238" font-size="17">response.</text><rect x="24" y="279" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="307" font-size="19" font-weight="bold">SMB protocol</text><text x="40" y="333" font-size="17">Confirm it from protocol responses; a port-name label is a clue.</text><rect x="24" y="374" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="402" font-size="19" font-weight="bold">Specified file operation</text><text x="40" y="428" font-size="17">Record the result for this identity, path, and action.</text><text x="24" y="489" font-size="17">An open port, a confirmed SMB service, and a successful file</text><text x="24" y="514" font-size="17">read are different observations.</text></g></svg>
