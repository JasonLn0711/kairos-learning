<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 856.4599999999999" role="img" aria-labelledby="m0408-tickets-zh-title m0408-tickets-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0408-tickets-zh-title">圖 10｜Kerberos 的三階段票證流程</title><desc id="m0408-tickets-zh-desc">前兩階段箭頭分別表示請求與回覆；第三階段出示票證後由服務檢查授權，「依權限存取」不是固定的 AP 回覆封包。若要求雙向驗證，服務可回傳 AP_REP。AS／TGS 是 KDC 的邏輯功能；省略預先驗證往返、金鑰細節及快取重用。</desc><g transform="scale(0.85)"><rect width="1000" height="1007.5999999999999" fill="#f7f9fb" /><g font-family="sans-serif" fill="#213547"><text x="28" y="38.0" font-size="26" font-weight="700">圖 10｜Kerberos 的三階段票證流程</text><text x="30" y="109.19999999999999" font-size="22" font-weight="700">階段 1 · AS Exchange</text><text x="30" y="158.6" font-size="22" font-weight="700">小明的電腦</text><text x="540" y="158.6" font-size="22" font-weight="700">KDC / AS</text><text x="100" y="212.0" font-size="20">→ 請求初始票證並證明身分</text><text x="100" y="258.0" font-size="20">← 取得 TGT</text><path d="M30 314.0H970" fill="none" stroke="#8b969f" stroke-width="2" /><text x="30" y="358.0" font-size="22" font-weight="700">階段 2 · TGS Exchange</text><text x="30" y="407.4" font-size="22" font-weight="700">小明的電腦</text><text x="540" y="407.4" font-size="22" font-weight="700">KDC / TGS</text><text x="100" y="460.79999999999995" font-size="20">→ 使用 TGT 申請檔案伺服器票證</text><text x="100" y="506.79999999999995" font-size="20">← 取得 Service Ticket</text><path d="M30 562.8H970" fill="none" stroke="#8b969f" stroke-width="2" /><text x="30" y="606.8" font-size="22" font-weight="700">階段 3 · AP Exchange</text><text x="30" y="656.1999999999999" font-size="22" font-weight="700">小明的電腦</text><text x="540" y="656.1999999999999" font-size="22" font-weight="700">檔案伺服器</text><text x="100" y="709.5999999999999" font-size="20">→ 出示服務票證與 Authenticator</text><text x="100" y="755.5999999999999" font-size="20">驗證成功後，依權限存取</text><path d="M30 811.5999999999999H970" fill="none" stroke="#8b969f" stroke-width="2" /><text x="28" y="875.5999999999999" font-size="20">前兩階段箭頭分別表示請求與回覆；第三階段出示票證後由服務檢查授權，「依權限存取」不是固定的</text><text x="28" y="909.5999999999999" font-size="20">AP 回覆封包。若要求雙向驗證，服務可回傳 AP_REP。AS／TGS 是 KDC 的邏輯功能；省略預先驗證</text><text x="28" y="943.5999999999999" font-size="20">往返、金鑰細節及快取重用。</text></g></g></svg>