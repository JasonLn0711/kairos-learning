<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 903" role="img" aria-labelledby="m0906-f4-en-m09-06-evidence-en-title m0906-f4-en-m09-06-evidence-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0906-f4-en-m09-06-evidence-en-title">4 | Observation is not a verdict</title><desc id="m0906-f4-en-m09-06-evidence-en-desc">DMARC pass, MFA success and no alert each support limited claims. Investigate content, authority and monitoring coverage.</desc><defs><marker id="m0906-f4-en-m09-06-evidence-en-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a" /></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="903" rx="22" fill="#f6f9fb" /><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">4 | Observation is not a verdict</text><text x="30" y="85" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Bound the evidence, then investigate.</text><rect x="30" y="117" width="540" height="100" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="151" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">DMARC passes</text><text x="50" y="187" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Domain checks succeeded</text><path d="M55,222 L55,258" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0906-f4-en-m09-06-evidence-en-arrow)" /><text x="80" y="258" text-anchor="start" font-size="23" fill="#a44043" font-weight="700">≠ safe content / actual person</text><text x="80" y="297" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Next: Verify identity, request, authority</text><rect x="30" y="343" width="540" height="100" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="377" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">MFA login succeeds</text><text x="50" y="413" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Authentication succeeded</text><path d="M55,448 L55,484" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0906-f4-en-m09-06-evidence-en-arrow)" /><text x="80" y="484" text-anchor="start" font-size="23" fill="#a44043" font-weight="700">≠ this transfer is authorized</text><text x="80" y="523" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Next: Check approval and session</text><rect x="30" y="569" width="540" height="100" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="603" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">No alert received</text><text x="50" y="639" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">No alert has been observed</text><path d="M55,674 L55,710" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0906-f4-en-m09-06-evidence-en-arrow)" /><text x="80" y="710" text-anchor="start" font-size="23" fill="#a44043" font-weight="700">≠ no attack occurred</text><text x="80" y="749" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Next: Check coverage, rules and logs</text><rect x="30" y="810" width="540" height="63" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5" /><text x="300" y="849" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">Evidence scope ≠ confidence ≠ attribution</text></g></svg>