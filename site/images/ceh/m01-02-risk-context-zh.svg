<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">風險要回到情境比較</title><desc id="desc">補充圖解｜相同權限錯誤，不代表風險相同。公開資料也要保護完整性與可用性。 公開衛教文章: 可公開閱讀；若遭竄改或刪除，仍可能傷害讀者或中斷服務。 私人病歷資料: 不應公開閱讀；未授權揭露可能影響隱私與病患信任。 共同判斷條件: 誰能做什麼、接觸機會、既有防護、可能後果；不能只數弱點。</desc><rect width="900" height="410" rx="18" fill="#f2f6f5"/><text x="28" y="42" fill="#18252c" font-size="24" font-family="sans-serif">風險要回到情境比較</text><rect x="24" y="66" width="852" height="94" rx="10" fill="white" stroke="#687d78"/><text x="40" y="94" font-size="19" fill="#18252c" font-family="sans-serif">公開衛教文章</text><text x="40" y="120" font-size="17" fill="#18252c" font-family="sans-serif">可公開閱讀；若遭竄改或刪除，仍可能傷害讀者或中斷服務。</text><rect x="24" y="172" width="852" height="94" rx="10" fill="white" stroke="#687d78"/><text x="40" y="200" font-size="19" fill="#18252c" font-family="sans-serif">私人病歷資料</text><text x="40" y="226" font-size="17" fill="#18252c" font-family="sans-serif">不應公開閱讀；未授權揭露可能影響隱私與病患信任。</text><rect x="24" y="278" width="852" height="94" rx="10" fill="white" stroke="#687d78"/><text x="40" y="306" font-size="19" fill="#18252c" font-family="sans-serif">共同判斷條件</text><text x="40" y="332" font-size="17" fill="#18252c" font-family="sans-serif">誰能做什麼、接觸機會、既有防護、可能後果；不能只數弱點。</text></svg>