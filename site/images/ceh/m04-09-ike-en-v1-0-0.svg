<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 703.44" role="img" aria-labelledby="m0409-ike-en-title m0409-ike-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-ike-en-title">Home computer → VPN gateway → internal network</title><desc id="m0409-ike-en-desc">The path identifies roles. The three items explain initial negotiation, authentication and usability checks; they are neither IKEv1 phases nor three mandatory IKEv2 exchanges.</desc><defs><marker id="m0409-ike-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Home computer → VPN gateway → internal network</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IKE_SA_INIT: negotiate protection</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Negotiate algorithms and exchange material needed to establish keys.</text><path d="M500 221.6V251.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ike-en-arrow)" /><rect x="40" y="267.6" width="920" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="299.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IKE_AUTH: authenticate both parties</text><text x="56" y="335.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Confirm identity using certificates or another configured method;</text><text x="56" y="367.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">normally negotiate the first CHILD_SA too.</text><path d="M500 419.6V449.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ike-en-arrow)" /><rect x="40" y="465.6" width="920" height="140" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="497.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Verify a usable data channel</text><text x="56" y="533.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Suitable IPsec data SAs, routing and access policies are also needed</text><text x="56" y="565.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">to use internal resources.</text><text x="28" y="665.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The path identifies roles. The three items explain initial negotiation,</text><text x="28" y="697.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">authentication and usability checks; they are neither IKEv1 phases nor</text><text x="28" y="729.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">three mandatory IKEv2 exchanges.</text></g></svg>
