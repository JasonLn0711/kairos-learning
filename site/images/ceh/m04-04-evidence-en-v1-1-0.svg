<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">SMB enumeration｜Which conclusions does this record support?</title>
<desc id="desc">Synthetic case: LAB / labreader. Judge only operations actually observed. Capability ≠ Policy ≠ Observed use in this connection. Signing protects message integrity; encryption protects confidentiality in transit. Neither grants additional file permissions.</desc>
<rect width="1600" height="1200" fill="#101b30"/>
