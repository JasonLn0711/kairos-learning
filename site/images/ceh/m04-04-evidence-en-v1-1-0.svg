<text x="1085" y="240.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">× Does not establish entry or</text>
<text x="1085" y="276.0" font-family="sans-serif" font-size="24" fill="#ffb6bf">access to its files</text>
