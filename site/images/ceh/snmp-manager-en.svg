<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="snmp-en-title snmp-en-desc" preserveAspectRatio="xMidYMid meet"><title id="snmp-en-title">One Manager, three parallel device types</title><desc id="snmp-en-desc">Simplified diagram: one Manager can query several kinds of network equipment. Whether a device answers, and which fields it returns, still depends on configuration and permissions.</desc><defs><marker id="snmp-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3977bd" /></marker></defs><rect x="260" y="25" width="380" height="140" rx="20" fill="#dceaff" stroke="#3977bd" stroke-width="3" /><text x="450" y="85" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#183b59">Monitoring system Manager</text><text x="450" y="125" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">GET request ↓; response ↑</text><path d="M430 168V248" stroke="#3977bd" stroke-width="4" marker-end="url(#snmp-en-arrow)" /><path d="M470 248V168" stroke="#3977bd" stroke-width="4" marker-end="url(#snmp-en-arrow)" /><path d="M140 320V280H760V320M450 280V320" fill="none" stroke="#607d94" stroke-width="4" /><rect x="30" y="320" width="220" height="180" rx="20" fill="#e4f3eb" stroke="#458574" stroke-width="3" /><rect x="75" y="343" width="130" height="35" rx="20" fill="#458574" stroke="#458574" stroke-width="3" /><text x="140" y="420" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#183b59">Switch</text><text x="140" y="460" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#183b59">SNMP Agent</text><rect x="340" y="320" width="220" height="180" rx="20" fill="#e4f3eb" stroke="#458574" stroke-width="3" /><rect x="385" y="343" width="130" height="35" rx="20" fill="#458574" stroke="#458574" stroke-width="3" /><text x="450" y="420" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#183b59">Router</text><text x="450" y="460" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#183b59">SNMP Agent</text><rect x="650" y="320" width="220" height="180" rx="20" fill="#e4f3eb" stroke="#458574" stroke-width="3" /><rect x="695" y="343" width="130" height="35" rx="20" fill="#458574" stroke="#458574" stroke-width="3" /><text x="760" y="420" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#183b59">Server</text><text x="760" y="460" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#183b59">SNMP Agent</text><text x="450" y="545" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Each Agent returns authorized information</text><text x="450" y="581" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Devices are peers; lines represent shared query relationships</text></svg>
