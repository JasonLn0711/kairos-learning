<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 519.84" role="img" aria-labelledby="m0409-rights-zh-title m0409-rights-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-rights-zh-title">圖 1｜同一個 Finance 資料夾，可能有三種不同的結果</title><desc id="m0409-rights-zh-desc">三個平行能力，沒有先後箭頭；名稱可見不表示可讀，能讀也不表示能改。</desc><defs><marker id="m0409-rights-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 1｜同一個 Finance 資料夾，可能有三種不同的結果</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">看得到名稱</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">知道 Finance 存在</text><rect x="40" y="229.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="261.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">讀得到內容</text><text x="56" y="297.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">可以開啟財務報表</text><rect x="40" y="357.6" width="920" height="108" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="389.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">改得了內容</text><text x="56" y="425.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">可以修改財務報表</text><text x="28" y="525.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">三個平行能力，沒有先後箭頭；名稱可見不表示可讀，能讀也不表示能改。</text></g></svg>
