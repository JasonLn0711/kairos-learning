<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870.3000000000001" role="img" aria-labelledby="m0503-dimensions-en-title m0503-dimensions-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-dimensions-en-title">Figure 4 | Five dimensions of one assessment</title><desc id="m0503-dimensions-en-desc">All five labels can apply together. Numbers guide reading; they are neither execution steps nor passed checks.</desc><defs><marker id="m0503-dimensions-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 4 | Five dimensions of one assessment</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">All five labels can apply together. Numbers guide reading; they are neither</text><text x="28" y="140.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">execution steps nor passed checks.</text><rect x="40.0" y="202" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="236.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">1. Target: Host-based</text><text x="60.0" y="273.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">A Linux server</text><rect x="40.0" y="351" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="385.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">2. Position: Internal</text><text x="60.0" y="422.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Examine it from the internal network</text><rect x="40.0" y="500" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="534.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">3. Evidence collection: Active</text><text x="60.0" y="571.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Send probes and inspection requests</text><rect x="40.0" y="649" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="683.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">4. Identity: Authenticated</text><text x="60.0" y="720.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Use an approved scanning account</text><rect x="40.0" y="798" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="832.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">5. Execution: Automated</text><text x="60.0" y="869.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Begin with tools for repetitive checks</text></g></svg>
