<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" role="img" aria-labelledby="m0301-f3-zh-title m0301-f3-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0301-f3-zh-title">TCP 是位元組串流；UDP 是獨立資料報</title><desc id="m0301-f3-zh-desc">比較傳輸介面與保障機制，不能直接推論哪個一定比較快。</desc><g transform="scale(0.6)"><rect width="1500" height="1040" fill="#f5f8fb" /><text x="50" y="50" font-size="22" fill="#2464d9" font-family="sans-serif">CEH M03-01</text><text x="50" y="100" font-size="34" fill="#172b49" font-family="sans-serif">TCP 是位元組串流；UDP 是獨立資料報</text><text x="50" y="151" font-size="22" fill="#4d6380" font-family="sans-serif">比較傳輸介面與保障機制，不能直接推論哪個一定比較快。</text><rect x="50" y="250" width="685" height="440" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2" /><text x="75" y="295" font-size="26" fill="#2464d9" font-family="sans-serif">TCP：有序的位元組串流</text><rect x="75" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2" /><text x="87" y="390" font-size="20" fill="#172b49" font-family="sans-serif">資料段 1</text><path d="M170 450 L170 525" stroke="#2464d9" stroke-width="5" fill="none" /><polygon points="170,525 158,507 182,507" fill="#2464d9" /><rect x="75" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2" /><text x="87" y="595" font-size="20" fill="#168161" font-family="sans-serif">1</text><rect x="290" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2" /><text x="302" y="390" font-size="20" fill="#172b49" font-family="sans-serif">資料段 2</text><path d="M385 450 L385 525" stroke="#2464d9" stroke-width="5" fill="none" /><polygon points="385,525 373,507 397,507" fill="#2464d9" /><rect x="290" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2" /><text x="302" y="595" font-size="20" fill="#168161" font-family="sans-serif">2</text><rect x="505" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2" /><text x="517" y="390" font-size="20" fill="#172b49" font-family="sans-serif">資料段 3</text><path d="M600 450 L600 525" stroke="#2464d9" stroke-width="5" fill="none" /><polygon points="600,525 588,507 612,507" fill="#2464d9" /><rect x="505" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2" /><text x="517" y="595" font-size="20" fill="#168161" font-family="sans-serif">3</text><text x="75" y="665" font-size="20" fill="#4d6380" font-family="sans-serif">遺失 → 重傳</text><rect x="50" y="730" width="685" height="250" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2" /><text x="72" y="770" font-size="24" fill="#2464d9" font-family="sans-serif">TCP 交付</text><text x="72" y="814" font-size="22" fill="#4d6380" font-family="sans-serif">應用程式依序讀取位元組</text><text x="72" y="856" font-size="22" fill="#4d6380" font-family="sans-serif">不保證一次 read 對應一次 write</text><text x="72" y="898" font-size="22" fill="#4d6380" font-family="sans-serif">序號、ACK 與重傳共同管理</text><rect x="765" y="250" width="685" height="440" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2" /><text x="790" y="295" font-size="26" fill="#168161" font-family="sans-serif">UDP：獨立資料報</text><rect x="790" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2" /><text x="802" y="390" font-size="20" fill="#172b49" font-family="sans-serif">資料報 A</text><path d="M885 450 L885 525" stroke="#2464d9" stroke-width="5" fill="none" /><polygon points="885,525 873,507 897,507" fill="#2464d9" /><rect x="790" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2" /><text x="802" y="595" font-size="20" fill="#168161" font-family="sans-serif">資料報 A</text><rect x="1005" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2" /><text x="1017" y="390" font-size="20" fill="#172b49" font-family="sans-serif">資料報 B</text><text x="1075" y="500" font-size="48" fill="#c83243" font-family="sans-serif">×</text><rect x="1005" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2" /><text x="1017" y="595" font-size="20" fill="#168161" font-family="sans-serif">遺失</text><rect x="1220" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2" /><text x="1232" y="390" font-size="20" fill="#172b49" font-family="sans-serif">資料報 C</text><path d="M1315 450 L1315 525" stroke="#2464d9" stroke-width="5" fill="none" /><polygon points="1315,525 1303,507 1327,507" fill="#2464d9" /><rect x="1220" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2" /><text x="1232" y="595" font-size="20" fill="#168161" font-family="sans-serif">資料報 C</text><text x="790" y="665" font-size="20" fill="#4d6380" font-family="sans-serif">B 遺失；UDP 本身不自動重傳</text><rect x="765" y="730" width="685" height="250" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2" /><text x="787" y="770" font-size="24" fill="#2464d9" font-family="sans-serif">UDP 交付</text><text x="787" y="814" font-size="22" fill="#4d6380" font-family="sans-serif">保留資料報邊界；可能遺失或亂序</text><text x="787" y="856" font-size="22" fill="#4d6380" font-family="sans-serif">QUIC 可在 UDP 上提供可靠串流</text></g></svg>