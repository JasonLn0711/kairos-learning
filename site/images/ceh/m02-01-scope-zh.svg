<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 765" role="img" aria-labelledby="m0201-f4-zh-m02-01-scope-zh-TW-title m0201-f4-zh-m02-01-scope-zh-TW-desc" preserveAspectRatio="xMidYMid meet"><title id="m0201-f4-zh-m02-01-scope-zh-TW-title">圖 4｜有線索，先過授權關卡</title><desc id="m0201-f4-zh-m02-01-scope-zh-TW-desc">下方兩種結果不是連續執行；新發現的資產不會自動納入授權；保留既有允許工作，不先做再補簽</desc><defs><marker id="m0201-f4-zh-m02-01-scope-zh-TW-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a" /></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="765" rx="22" fill="#f6f9fb" /><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">圖 4｜有線索，先過授權關卡</text><rect x="30" y="85" width="540" height="94" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="119" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">寫下目的、來源與待解問題</text><rect x="30" y="217" width="540" height="94" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="251" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">核對資產、方法、時間與資料範圍</text><path d="M300,181 L300,210" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0201-f4-zh-m02-01-scope-zh-TW-arrow)" /><path d="M150,315 L150,360" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0201-f4-zh-m02-01-scope-zh-TW-arrow)" /><path d="M570,270 H588 V552 H575" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0201-f4-zh-m02-01-scope-zh-TW-arrow)" /><rect x="30" y="375" width="540" height="94" rx="16" fill="#fff0d5" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="409" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">未授權／不明 → 暫停該動作</text><rect x="30" y="505" width="540" height="94" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="539" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">已核准 → 最小必要動作與紀錄</text><text x="30" y="654" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">下方兩種結果不是連續執行</text><text x="30" y="683" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">新發現的資產不會自動納入授權</text><text x="30" y="712" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">保留既有允許工作，不先做再補簽</text></g></svg>