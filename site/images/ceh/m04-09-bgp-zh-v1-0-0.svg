<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605.34" role="img" aria-labelledby="m0409-bgp-zh-title m0409-bgp-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-bgp-zh-title">跨 AS 的兩條候選路徑</title><desc id="m0409-bgp-zh-desc">BGP 關係：AS64500 ↔ AS64497、AS64500 ↔ AS64498、AS64497 ↔ AS64496、AS64497 ↔ AS64499、AS64498 ↔ AS64499。本例選定 AS64500 → AS64497 → AS64496。實線只表示對等關係；選定路徑另以文字與綠框標示。</desc><defs><marker id="m0409-bgp-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">跨 AS 的兩條候選路徑</text><path d="M300 186.6H370" fill="none" stroke="#47748e" stroke-width="3" /><path d="M630 186.6H700" fill="none" stroke="#47748e" stroke-width="3" /><path d="M170 271.6V321.6" fill="none" stroke="#47748e" stroke-width="3" /><path d="M500 271.6V321.6" fill="none" stroke="#47748e" stroke-width="3" /><path d="M300 406.6H370" fill="none" stroke="#47748e" stroke-width="3" /><rect x="40" y="101.6" width="260" height="170" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64500</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">來源主機所在；雙上游</text><text x="56" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS</text><rect x="370" y="101.6" width="260" height="170" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="386" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64497</text><text x="386" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">轉送 AS；本例選定路徑</text><rect x="700" y="101.6" width="260" height="170" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="716" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64496</text><text x="716" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">末端 AS；目的地主機所</text><text x="716" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">在</text><rect x="40" y="321.6" width="260" height="170" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="353.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64498</text><text x="56" y="389.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">另一個轉送 AS</text><rect x="370" y="321.6" width="260" height="170" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="386" y="353.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64499</text><text x="386" y="389.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">轉送 AS；連接</text><text x="386" y="421.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64498 與 AS64497</text><text x="28" y="556.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">BGP 關係：AS64500 ↔ AS64497、AS64500 ↔ AS64498、AS64497 ↔ AS64496、AS64497 ↔</text><text x="28" y="588.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64499、AS64498 ↔ AS64499。本例選定 AS64500 → AS64497 → AS64496。實線只表示對等</text><text x="28" y="620.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">關係；選定路徑另以文字與綠框標示。</text></g></svg>
