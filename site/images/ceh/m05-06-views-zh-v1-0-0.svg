<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 439.2" role="img" aria-labelledby="m0503-views-zh-title m0503-views-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-views-zh-title">圖 1｜兩條平行觀察路徑</title><desc id="m0503-views-zh-desc">每張卡內的箭頭表示資訊取得路徑；兩卡互補，不代表先後、權限升級或完整覆蓋。</desc><defs><marker id="m0503-views-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 1｜兩條平行觀察路徑</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">每張卡內的箭頭表示資訊取得路徑；兩卡互補，不代表先後、權限升級或完整覆蓋。</text><rect x="40.0" y="170" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">非驗證式視角</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">未登入的掃描器 → 公開服務回應 → 可見入口與外部線索。</text><rect x="40.0" y="319" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="353.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">驗證式視角</text><text x="60.0" y="390.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">使用核准身分的掃描器 → 目標允許存取的資料 → 套件、修補或設定證據。</text></g></svg>
