<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">CEH 知識不是孤島：社交工程如何串起前面章節</title><desc id="svgdesc">上方是示範的可能攻擊路徑，下方是其他技術章節及防禦章節。各步驟不一定必然發生。</desc>
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#2459A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrred" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#B34548" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrteal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#0A8277" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<filter id="sh" x="-10%" y="-15%" width="125%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#132942" flood-opacity="0.08"/></filter>
</defs>
<rect width="1600" height="1050" fill="#F6F8FC"/>
<rect x="57" y="43" width="180" height="46" rx="23.0" fill="#EAF1FC" stroke="none" stroke-width="2"/><text x="147.0" y="73.0" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#2459A6">CEH 知識地圖</text><text x="260" y="83" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="43" font-weight="750" letter-spacing="0" fill="#15283C">社交工程在 CEH 攻防架構中的位置</text><text x="60" y="140" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="400" letter-spacing="0" fill="#596C7D">橘紅線表示一種「可能」的攻擊路徑，不代表每次事件都會走完全部階段。</text><rect x="60" y="230" width="300" height="257" rx="19" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2" filter="url(#sh)"/><rect x="82" y="250" width="85" height="42" rx="21.0" fill="#FFF5DF" stroke="none" stroke-width="2"/><text x="124.5" y="278.35" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="650" letter-spacing="0" fill="#9D641C">M02</text><text x="82" y="331" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#9D641C">Footprinting</text><text x="82" y="379" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="720" letter-spacing="0" fill="#15283C">公開資訊蒐集</text><text x="82" y="425" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#596C7D">主管名字、員工職務</text><text x="82" y="459" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#596C7D">社群貼文、活動資訊</text><rect x="455" y="230" width="300" height="257" rx="19" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2" filter="url(#sh)"/><rect x="477" y="250" width="85" height="42" rx="21.0" fill="#FFF0EF" stroke="none" stroke-width="2"/><text x="519.5" y="278.35" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="650" letter-spacing="0" fill="#B34548">M09</text><text x="477" y="331" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#B34548">Social Engineering</text><text x="477" y="379" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="720" letter-spacing="0" fill="#15283C">利用信任誘導行動</text><text x="477" y="425" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#596C7D">冒充主管／資訊人員</text><text x="477" y="459" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#596C7D">製造急迫的合理理由</text><rect x="850" y="230" width="300" height="257" rx="19" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2" filter="url(#sh)"/><rect x="872" y="250" width="85" height="42" rx="21.0" fill="#FFF0EF" stroke="none" stroke-width="2"/><text x="914.5" y="278.35" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="650" letter-spacing="0" fill="#B34548">M06</text><text x="872" y="331" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#B34548">System Hacking</text><text x="872" y="379" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="720" letter-spacing="0" fill="#15283C">可能出現未授權行為</text><text x="872" y="425" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#596C7D">取得帳號或誘導執行</text><text x="872" y="459" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#596C7D">僅在攻擊成功時發生</text><rect x="1245" y="230" width="300" height="257" rx="19" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2" filter="url(#sh)"/><rect x="1267" y="250" width="85" height="42" rx="21.0" fill="#EAF1FC" stroke="none" stroke-width="2"/><text x="1309.5" y="278.35" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="650" letter-spacing="0" fill="#2459A6">M01</text><text x="1267" y="331" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="600" letter-spacing="0" fill="#2459A6">CIA Triad</text><text x="1267" y="379" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="720" letter-spacing="0" fill="#15283C">評估安全損害</text><text x="1267" y="425" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#596C7D">機密性：資料外洩</text><text x="1267" y="459" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#596C7D">完整性或可用性受損</text><path d="M368 359 L441 359" fill="none" stroke="#B34548" stroke-width="3" marker-end="url(#arrred)" stroke-linecap="round"/><path d="M763 359 L836 359" fill="none" stroke="#B34548" stroke-width="3" marker-end="url(#arrred)" stroke-linecap="round"/><path d="M1158 359 L1231 359" fill="none" stroke="#B34548" stroke-width="3" marker-end="url(#arrred)" stroke-linecap="round"/><text x="65" y="547" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="700" letter-spacing="0" fill="#153E76">其他章節提供的技術視角（不等於每次社交工程都會掃描或列舉）</text><rect x="60" y="570" width="355" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2"/><text x="80" y="610" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="720" letter-spacing="0" fill="#2459A6">M01-04</text><text x="80" y="646" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="680" letter-spacing="0" fill="#15283C">攻擊面 Attack Surface</text><text x="80" y="678" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#596C7D">哪些接觸點可能被利用？</text><rect x="455" y="570" width="355" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2"/><text x="475" y="610" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="720" letter-spacing="0" fill="#2459A6">M03</text><text x="475" y="646" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="680" letter-spacing="0" fill="#15283C">網路掃描 Scanning</text><text x="475" y="678" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#596C7D">哪些服務對外開放？</text><rect x="850" y="570" width="355" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2"/><text x="870" y="610" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="720" letter-spacing="0" fill="#2459A6">M04</text><text x="870" y="646" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="680" letter-spacing="0" fill="#15283C">列舉 Enumeration</text><text x="870" y="678" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#596C7D">DNS／SMB／帳號等有何線索？</text><rect x="1245" y="570" width="355" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2"/><text x="1265" y="610" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="720" letter-spacing="0" fill="#2459A6">M05</text><text x="1265" y="646" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="680" letter-spacing="0" fill="#15283C">弱點分析 Vulnerability</text><text x="1265" y="678" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" letter-spacing="0" fill="#596C7D">技術與流程的弱點在哪裡？</text><text x="66" y="758" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="700" letter-spacing="0" fill="#075C56">防守要同時運用先前學過的三個概念</text><rect x="60" y="785" width="490" height="156" rx="17" fill="#E5F5F1" stroke="none" stroke-width="2"/><rect x="79" y="805" width="115" height="41" rx="20.5" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="136.5" y="832.5" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#075C56">M01-03</text><text x="215" y="839" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="750" letter-spacing="0" fill="#075C56">授權與 ROE</text><text x="83" y="903" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#15283C">測試也必須先確認權限</text><rect x="585" y="785" width="490" height="156" rx="17" fill="#E5F5F1" stroke="none" stroke-width="2"/><rect x="604" y="805" width="115" height="41" rx="20.5" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="661.5" y="832.5" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#075C56">M01-06</text><text x="740" y="839" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="750" letter-spacing="0" fill="#075C56">縱深防禦</text><text x="608" y="903" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#15283C">驗證、最小權限、雙人覆核</text><rect x="1110" y="785" width="490" height="156" rx="17" fill="#E5F5F1" stroke="none" stroke-width="2"/><rect x="1129" y="805" width="115" height="41" rx="20.5" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="1186.5" y="832.5" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#075C56">M01-07</text><text x="1265" y="839" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="750" letter-spacing="0" fill="#075C56">事件應變</text><text x="1133" y="903" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#15283C">保存證據、限制損害、復原</text><text x="60" y="993" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="550" letter-spacing="0" fill="#596C7D">重點：M09 攻擊的是「人的判斷與流程」；M02/M04 可提供說服素材，M01 的控制則負責阻擋與減損。</text><text x="1540" y="1030" text-anchor="end" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="450" letter-spacing="0" fill="#596C7D">CEH M09-01  •  概念圖 2 / 4</text>
</svg>
