<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603.0" role="img" aria-labelledby="m0505-signals-zh-title m0505-signals-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0505-signals-zh-title">圖 1｜三種工具，三個問題</title><desc id="m0505-signals-zh-desc">三項平行訊號：技術嚴重度、已知利用與未來利用機率；仍需本地資產情境。</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">圖 1｜三種工具，三個問題</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">三項平行訊號：技術嚴重度、已知利用與未來利用機率；仍需本地資產情境。</text><rect x="28" y="152.8" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><path d="M3 18a9 9 0 1 1 18 0 M12 14l5-7 M5 19h14" transform="translate(46 178.8) scale(1.2)" fill="none" stroke="#18252c" stroke-width="1.7" /><text x="90" y="186.8" font-size="23" fill="#18252c" font-weight="700">CVSS — 漏洞有多嚴重？</text><text x="90" y="228.20000000000002" font-size="20" fill="#18252c">好比門鎖的設計缺陷有多嚴重，以及被突破後可能有什麼後果。</text><rect x="28" y="300.20000000000005" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><path d="M12 2l9 4v7c0 5-4 8-9 10-5-2-9-5-9-10V6z M12 7v6 M12 16v1" transform="translate(46 326.20000000000005) scale(1.2)" fill="none" stroke="#18252c" stroke-width="1.7" /><text x="90" y="334.20000000000005" font-size="23" fill="#18252c" font-weight="700">KEV — 駭客真的利用過嗎？</text><text x="90" y="375.6" font-size="20" fill="#18252c">好比已經有可靠消息確認，竊賊正在利用這種門鎖缺陷作案。</text><rect x="28" y="447.6" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><path d="M3 21v-5 M8 21V12 M13 21v-8 M18 21V7 M2 12l6-6 5 3 8-7" transform="translate(46 473.6) scale(1.2)" fill="none" stroke="#18252c" stroke-width="1.7" /><text x="90" y="481.6" font-size="23" fill="#18252c" font-weight="700">EPSS — 接下來被利用的可能性有多高？</text><text x="90" y="523.0" font-size="20" fill="#18252c">好比根據過去案例與目前跡象，預測未來 30 天這類缺陷被用來作案的可能性。</text></g></svg>
