<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 707.4" role="img" aria-labelledby="m0503-signals-zh-title m0503-signals-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-signals-zh-title">圖 1｜三個訊號加上我方證據，支撐排序判斷</title><desc id="m0503-signals-zh-desc">前三項是平行訊號，第四項是共同判讀情境；沒有數值相加、因果箭頭或固定處理順序。</desc><defs><marker id="m0503-signals-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 1｜三個訊號加上我方證據，支撐排序判斷</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">前三項是平行訊號，第四項是共同判讀情境；沒有數值相加、因果箭頭或固定處理順序。</text><rect x="40.0" y="170" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">CVSS｜技術嚴重度</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">保留版本、類型、向量與來源；分數不能直接代表我方被駭機率。</text><rect x="40.0" y="319" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="353.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">KEV｜已知利用證據</text><text x="60.0" y="390.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">保存列入狀態與查核日期；外部利用不等於我方已入侵，未列也不能忽略。</text><rect x="40.0" y="468" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="502.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">EPSS｜未來 30 天預測</text><text x="60.0" y="539.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">機率與百分位分開保存；低分或缺分數不能證明安全。</text><rect x="40.0" y="617" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="651.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">我方資產與風險情境</text><text x="60.0" y="688.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">先核對完整版本、設定與修補，再看入口曝露、重要性、後果與現有防護；記下排序理由。</text></g></svg>
