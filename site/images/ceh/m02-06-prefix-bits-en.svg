<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 445" role="img" aria-labelledby="m0206-f6-en-title m0206-f6-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0206-f6-en-title">Figure 2 | Bits in 192.0.2.25/24</title><desc id="m0206-f6-en-desc">This /24 fixes the first three octets; other prefixes need not end on an octet boundary.</desc><rect width="800" height="445" fill="#fcfcfd" /><g fill="#162a3a" font-family="system-ui, sans-serif"><text x="400" y="42" font-size="24" text-anchor="middle" font-weight="700">Figure 2 | Bits in 192.0.2.25/24</text><text x="400" y="83.6" font-size="18" text-anchor="middle">This /24 fixes the first three octets; other prefixes need not end</text><text x="400" y="113.3" font-size="18" text-anchor="middle">on an octet boundary.</text><rect x="30" y="147.0" width="170" height="99.3" rx="18" fill="#e5effc" stroke="#689ee9" stroke-width="2" /><text x="115.0" y="181.0" font-size="22" text-anchor="middle" font-weight="700">192</text><text x="115.0" y="219.3" font-size="20" text-anchor="middle">8 bits</text><rect x="225" y="147.0" width="170" height="99.3" rx="18" fill="#e5effc" stroke="#689ee9" stroke-width="2" /><text x="310.0" y="181.0" font-size="22" text-anchor="middle" font-weight="700">0</text><text x="310.0" y="219.3" font-size="20" text-anchor="middle">8 bits</text><rect x="420" y="147.0" width="170" height="99.3" rx="18" fill="#e5effc" stroke="#689ee9" stroke-width="2" /><text x="505.0" y="181.0" font-size="22" text-anchor="middle" font-weight="700">2</text><text x="505.0" y="219.3" font-size="20" text-anchor="middle">8 bits</text><rect x="615" y="147.0" width="170" height="99.3" rx="18" fill="#fcf0e6" stroke="#dc9a60" stroke-width="2" /><text x="700.0" y="181.0" font-size="22" text-anchor="middle" font-weight="700">25</text><text x="700.0" y="219.3" font-size="20" text-anchor="middle">8 bits</text><path d="M30 268.3H590" stroke="#075bc5" stroke-width="12" /><path d="M615 268.3H785" stroke="#b85b10" stroke-width="12" /><text x="310" y="306.3" font-size="20" text-anchor="middle">Network prefix: 24 bits</text><text x="700" y="306.3" font-size="20" text-anchor="middle">Variable part:</text><text x="700" y="339.3" font-size="20" text-anchor="middle">8 bits</text><text x="400" y="412.3" font-size="18" text-anchor="middle">32 − 24 = 8 variable bits; 2⁸ = 256 IPv4 addresses.</text></g></svg>