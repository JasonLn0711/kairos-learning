<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 731" role="img" aria-labelledby="m0305-evidence-zh-title m0305-evidence-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0305-evidence-zh-title">服務辨識的四層證據</title>
<desc id="m0305-evidence-zh-desc">箭頭表示查核順序，不表示自動取得權限或已證實弱點。每一步都保留來源與限制。</desc>
<defs><marker id="m0305-evidence-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="729" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">服務辨識的四層證據</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">箭頭表示查核順序，不表示自動取得權限或已證實弱點。每一步都保</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">留來源與限制。</text>
<rect x="28" y="136" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">1｜入口名稱</text>
<text x="48" y="192" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">連接埠對照表提供常見名稱，尚未驗證服務身分。</text>
<path d="M320 252V277" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0305-evidence-zh-arrow)" />
<rect x="28" y="281" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="310" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">2｜回應線索</text>
<text x="48" y="337" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">保存 Banner 與探測回應，標註工具的辨識結果。</text>
<path d="M320 397V422" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0305-evidence-zh-arrow)" />
<rect x="28" y="426" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">3｜內部核對</text>
<text x="48" y="482" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">確認代理位置、執行中服務、完整套件版本及設定。</text>
<path d="M320 542V567" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0305-evidence-zh-arrow)" />
<rect x="28" y="571" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="600" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">4｜修補判定</text>
<text x="48" y="627" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">對照供應商公告、回補修正與成立條件，再記錄結論。</text>
</svg>
