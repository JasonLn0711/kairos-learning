<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 759.22" role="img" aria-labelledby="m0408-search-en-title m0408-search-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0408-search-en-title">Figure 8 | How an LDAP search happens</title><desc id="m0408-search-en-desc">Arrows show processing order for this search. Interpret entries together with final status; a successful response does not establish universal visibility.</desc><g transform="scale(0.85)"><rect width="1000" height="893.2" fill="#f7f9fb" /><g font-family="sans-serif" fill="#213547"><text x="28" y="38.0" font-size="26" font-weight="700">Figure 8 | How an LDAP search happens</text><rect x="30" y="109.19999999999999" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="141.2" font-size="22" font-weight="700">1 · Application or administrator</text><text x="46" y="184.6" font-size="20">Find Engineering employees.</text><path d="M500 227.2V253.2m-8 -8 8 8 8 -8" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="30" y="277.2" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="309.2" font-size="22" font-weight="700">2 · Send LDAP Search</text><text x="46" y="352.59999999999997" font-size="20">Specify search base, depth, and conditions.</text><path d="M500 395.2V421.2m-8 -8 8 8 8 -8" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="30" y="445.2" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="477.2" font-size="22" font-weight="700">3 · Directory server</text><text x="46" y="520.6" font-size="20">Search according to conditions and access permissions.</text><path d="M500 563.2V589.2m-8 -8 8 8 8 -8" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="30" y="613.2" width="940" height="108" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46" y="645.2" font-size="22" font-weight="700">4 · Return results</text><text x="46" y="688.6" font-size="20">Ming, Hua, Mei, and others, together with search status.</text><text x="28" y="761.2" font-size="20">Arrows show processing order for this search. Interpret entries together</text><text x="28" y="795.2" font-size="20">with final status; a successful response does not establish universal</text><text x="28" y="829.2" font-size="20">visibility.</text></g></g></svg>