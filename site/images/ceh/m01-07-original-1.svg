<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="860" version="1.1" viewBox="0 0 1600 860" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>CEH M01-07｜整體決策循環</title><desc>繁體中文向量資訊圖表，適合初學者閱讀，非官方原圖。</desc><defs /><rect fill="#F6F8FC" height="860" width="1600" x="0" y="0" /><circle cx="1500" cy="-105" fill="#EAF0FF" opacity="0.54" r="310" /><circle cx="-160" cy="960" fill="#E2F3F0" opacity="0.44" r="310" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="80" y="67">CEH  /  MODULE 01  /  LESSON 07</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="49" font-weight="700" opacity="1" text-anchor="start" x="80" y="132">01  資訊安全是一個持續改善的循環</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="82" y="185">先決定風險，再處理異常，最後把經驗變成下一輪更好的防護。</text><rect fill="#EDF1F8" height="46" rx="23.0" ry="23.0" width="335" x="1192" y="52" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="1359.5" y="81.84">初學者圖解  ·  非官方原圖</text><rect fill="#B7C3D5" height="106" opacity="0.16" rx="20" ry="20" width="1440" x="82.5" y="226" /><rect fill="#E7EDF9" height="106" rx="20" ry="20" stroke="#D6E0F4" stroke-width="1.5" width="1440" x="80" y="220" /><rect fill="#4168D9" height="50" rx="13" ry="13" width="182" x="103" y="245" /><text fill="#FFFFFF" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="194.0" y="277.56">全程共同約束</text><text fill="#233D70" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="28" font-weight="700" opacity="1" text-anchor="start" x="312" y="287">法律與契約  ·  內部政策  ·  授權範圍  ·  責任分工  ·  證據留存</text><rect fill="#B7C3D5" height="276" opacity="0.16" rx="24" ry="24" width="430" x="92.5" y="381" /><rect fill="#FFFFFF" height="276" rx="24" ry="24" stroke="#DFE6F0" stroke-width="1.5" width="430" x="90" y="375" /><rect fill="#EAF0FF" height="60" rx="17" ry="17" width="60" x="114" y="399" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="30" font-weight="700" opacity="1" text-anchor="middle" x="144.0" y="439.8">①</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="33" font-weight="700" opacity="1" text-anchor="start" x="192" y="439">風險管理</text><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="193" y="469">Risk Management</text><line stroke="#DFE6F0" stroke-linecap="round" stroke-width="2" x1="116" x2="494" y1="491" y2="491" /><circle cx="127" cy="528" fill="#4168D9" r="5" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="144" y="536">確認重要資產與可能威脅</text><circle cx="127" cy="565" fill="#4168D9" r="5" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="144" y="573">評估機率、影響與控制措施</text><circle cx="127" cy="602" fill="#4168D9" r="5" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="144" y="610">決定誰先處理、何時再查</text><rect fill="#B7C3D5" height="276" opacity="0.16" rx="24" ry="24" width="430" x="587.5" y="381" /><rect fill="#FFFFFF" height="276" rx="24" ry="24" stroke="#DFE6F0" stroke-width="1.5" width="430" x="585" y="375" /><rect fill="#FFF1E9" height="60" rx="17" ry="17" width="60" x="609" y="399" /><text fill="#D86D3E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="30" font-weight="700" opacity="1" text-anchor="middle" x="639.0" y="439.8">②</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="33" font-weight="700" opacity="1" text-anchor="start" x="687" y="439">事件應變</text><text fill="#D86D3E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="688" y="469">Incident Response</text><line stroke="#DFE6F0" stroke-linecap="round" stroke-width="2" x1="611" x2="989" y1="491" y2="491" /><circle cx="622" cy="528" fill="#D86D3E" r="5" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="639" y="536">辨認告警，查核原始證據</text><circle cx="622" cy="565" fill="#D86D3E" r="5" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="639" y="573">依程序限制損害與處理原因</text><circle cx="622" cy="602" fill="#D86D3E" r="5" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="639" y="610">驗證復原狀態，不憑猜測結案</text><rect fill="#B7C3D5" height="276" opacity="0.16" rx="24" ry="24" width="430" x="1082.5" y="381" /><rect fill="#FFFFFF" height="276" rx="24" ry="24" stroke="#DFE6F0" stroke-width="1.5" width="430" x="1080" y="375" /><rect fill="#E5F6F2" height="60" rx="17" ry="17" width="60" x="1104" y="399" /><text fill="#087E80" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="30" font-weight="700" opacity="1" text-anchor="middle" x="1134.0" y="439.8">③</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="33" font-weight="700" opacity="1" text-anchor="start" x="1182" y="439">改善治理</text><text fill="#087E80" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="1183" y="469">Continuous Improvement</text><line stroke="#DFE6F0" stroke-linecap="round" stroke-width="2" x1="1106" x2="1484" y1="491" y2="491" /><circle cx="1117" cy="528" fill="#087E80" r="5" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="1134" y="536">找出偵測與流程缺口</text><circle cx="1117" cy="565" fill="#087E80" r="5" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="1134" y="573">更新權限、制度、演練與訓練</text><circle cx="1117" cy="602" fill="#087E80" r="5" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="1134" y="610">重新評估剩下的風險</text><line stroke="#D86D3E" stroke-linecap="round" stroke-width="6" x1="520" x2="580" y1="505" y2="505" /><polygon fill="#D86D3E" points="580,505 561.0,492.0 561.0,518.0" /><line stroke="#087E80" stroke-linecap="round" stroke-width="6" x1="1014" x2="1074" y1="505" y2="505" /><polygon fill="#087E80" points="1074,505 1055.0,492.0 1055.0,518.0" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="700" opacity="1" text-anchor="middle" x="551" y="483">事前準備</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="700" opacity="1" text-anchor="middle" x="1046" y="483">經驗回饋</text><path d="M 1285 666 L 1285 709 Q 1285 733 1256 733 L 326 733 Q 295 733 295 706 L 295 672" fill="none" stroke="#087E80" stroke-linecap="round" stroke-width="5" /><polygon fill="#087E80" points="295,672 285.0,691.0 305.0,691.0" /><rect fill="#E5F6F2" height="52" rx="14" ry="14" width="610" x="496" y="705" /><text fill="#087E80" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="801.0" y="738.56">重點：事後學習 → 改善下一次的風險評估</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="middle" x="800" y="815">不要混淆：修好一個漏洞 ≠ 管理完所有風險｜關閉告警 ≠ 確認沒事｜通過驗證 ≠ 永久安全</text></svg>