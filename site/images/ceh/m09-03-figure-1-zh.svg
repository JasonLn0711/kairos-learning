<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">四個角度，看同一場攻擊</title><desc id="desc">本課的分析工具：目標、管道、冒充身分、要求行動可以同時成立。 鎖定誰？｜Target: 一般員工小林；是否有證據顯示特別針對他設計？ 從哪裡接觸？｜Channel: SMS 簡訊與 Voice 語音；同一場攻擊可以跨管道。 假扮成誰？｜Identity: 自稱資訊服務台；假冒可信的客服角色。 要求做什麼？｜Action: 交出登入驗證碼，或核准不是自己發起的登入。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker></defs>
<rect width="1000" height="680" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="42" y="37" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · 圖 1</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">四個角度，看同一場攻擊</text>
<text x="42" y="135" font-size="18" font-weight="400" fill="#43576a" text-anchor="start">本課的分析工具：目標、管道、冒充身分、要求行動可以同時成立。</text>
<rect x="42" y="200" width="446" height="185" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="239" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">鎖定誰？｜Target</text>
<text x="66" y="282" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">一般員工小林；是否有證據顯示特別針對他</text>
<text x="66" y="312" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">設計？</text>
<rect x="512" y="200" width="446" height="185" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="536" y="239" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">從哪裡接觸？｜Channel</text>
<text x="536" y="282" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">SMS 簡訊與 Voice 語音；同一場攻擊可以跨</text>
<text x="536" y="312" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">管道。</text>
<rect x="42" y="410" width="446" height="185" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="449" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">假扮成誰？｜Identity</text>
<text x="66" y="492" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">自稱資訊服務台；假冒可信的客服角色。</text>
<rect x="512" y="410" width="446" height="185" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="536" y="449" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">要求做什麼？｜Action</text>
<text x="536" y="492" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">交出登入驗證碼，或核准不是自己發起的登</text>
<text x="536" y="522" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">入。</text>
<text x="42" y="634" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">不同角度可以同時成立，不必硬選一個名稱。</text>
</g></svg>
