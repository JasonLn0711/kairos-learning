<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 765" role="img" aria-labelledby="m0202-f3-zh-title m0202-f3-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0202-f3-zh-title">圖 3｜三個時間，兩種環境</title>
<desc id="m0202-f3-zh-desc">合成案例，資料不等於現況</desc>
<defs><marker id="m0202-f3-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="598" height="763" rx="20" fill="#f8fafc" stroke="#b7c7d5" />
<text x="300" y="45" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#172b3a">圖 3｜三個時間，兩種環境</text>
<rect x="50" y="85" width="500" height="115" rx="15" fill="#fff3d8" stroke="#7892a6" />
<text x="300.0" y="119" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">E1：去年徵才／今天下載</text>
<text x="300.0" y="148" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">提到 X 技能 ≠ 正式部署</text>
<rect x="50" y="250" width="500" height="115" rx="15" fill="#e8f2fb" stroke="#7892a6" />
<text x="300.0" y="284" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">E2：本月技術文章</text>
<text x="300.0" y="313" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">測試環境 Y ≠ 正式環境</text>
<rect x="50" y="415" width="500" height="115" rx="15" fill="#e7f3ed" stroke="#7892a6" />
<text x="300.0" y="449" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">E3：本週授權資產清冊</text>
<text x="300.0" y="478" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">正式客服 Y／限清冊範圍</text>
<rect x="50" y="580" width="500" height="65" rx="15" fill="#fbe9e5" stroke="#7892a6" />
<text x="300.0" y="614" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">仍未證明版本或可利用漏洞</text>
<path d="M300 200V250" fill="none" stroke="#41617b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m0202-f3-zh-arrow)" />
<path d="M300 365V415" fill="none" stroke="#41617b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m0202-f3-zh-arrow)" />
<path d="M300 530V580" fill="none" stroke="#41617b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m0202-f3-zh-arrow)" />
<text x="300" y="690" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#172b3a">虛線＝分析比較，不是系統遷移</text>
<text x="300" y="718" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#172b3a">事件／發布／擷取時間分開</text>
</svg>