<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940.5" role="img" aria-labelledby="m0502-workflow-zh-title m0502-workflow-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0502-workflow-zh-title">圖 3｜資安工程師的五步工作流程</title><desc id="m0502-workflow-zh-desc">箭頭表示作業順序；先確認資產與權責，再依範圍及 ROE 評估，最後交代證據與限制。</desc><defs><marker id="m0502-workflow-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 3｜資安工程師的五步工作流程</text><rect x="40.0" y="108" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="142.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">盤點資產</text><text x="60.0" y="179.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">確認哪些系統、資料與帳號存在</text><path d="M500 245V272" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-workflow-zh-arrow)" /><rect x="40.0" y="287" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="321.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">確認歸屬</text><text x="60.0" y="358.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">確認管理者與授權權責</text><path d="M500 424V451" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-workflow-zh-arrow)" /><rect x="40.0" y="466" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="500.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">界定範圍與 ROE</text><text x="60.0" y="537.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">確認能測什麼、如何測、何時停止</text><path d="M500 603V630" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-workflow-zh-arrow)" /><rect x="40.0" y="645" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="679.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">執行指定評估</text><text x="60.0" y="716.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">只在授權範圍內檢查並保存證據</text><path d="M500 782V809" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-workflow-zh-arrow)" /><rect x="40.0" y="824" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="858.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">撰寫報告</text><text x="60.0" y="895.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">交代發現、未測項目及結論限制</text><text x="28" y="985.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">箭頭表示作業順序；先確認資產與權責，再依範圍及 ROE 評估，最後交代證據與限制。</text></g></svg>
