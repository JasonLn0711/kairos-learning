<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 572" role="img" aria-labelledby="title desc"><title id="title">Store files, notify with events, process data</title><desc id="desc">This restates the document example: SMB stores files, Kafka carries events, and applications do the work.</desc><rect x="1" y="1" width="678" height="570" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">Store files, notify with events, process data</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">1. User → SMB</text><text x="40" y="120" font-size="17">Save a PDF on the file server.</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">2. Watcher → Kafka</text><text x="40" y="215" font-size="17">Publish document.uploaded with location and identifier.</text><rect x="24" y="256" width="632" height="104" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">3. AI service</text><text x="40" y="310" font-size="17">Read the event, then read the PDF from SMB with permission and</text><text x="40" y="333" font-size="17">analyze it.</text><rect x="24" y="374" width="632" height="104" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="402" font-size="19" font-weight="bold">4. Reporting service</text><text x="40" y="428" font-size="17">Receive a completion event, produce the report, and notify the</text><text x="40" y="451" font-size="17">user.</text><text x="24" y="512" font-size="17">This restates the document example: SMB stores files, Kafka</text><text x="24" y="537" font-size="17">carries events, and applications do the work.</text></g></svg>
