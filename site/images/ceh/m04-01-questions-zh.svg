<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc"><title id="title">五個問題，各自找證據</title><desc id="desc">問題分類，不是固定操作順序；測試許可與帳號權限分開。</desc><rect width="720" height="610" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">五個問題，各自找證據</text><text x="30" y="69" font-size="16" font-weight="400">問題分類，不是固定操作順序；測試許可與帳號權限分開。</text><rect x="30" y="115" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="142" font-size="16" font-weight="650">偵察 → 問</text><text x="46" y="168" font-size="16" font-weight="400">目標在哪裡？</text><rect x="30" y="209" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="236" font-size="16" font-weight="650">掃描 → 問</text><text x="46" y="262" font-size="16" font-weight="400">有哪些服務入口？</text><rect x="30" y="303" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="330" font-size="16" font-weight="650">列舉 → 問</text><text x="46" y="356" font-size="16" font-weight="400">提供哪些具體資訊？</text><rect x="30" y="397" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="424" font-size="16" font-weight="650">身分驗證 → 問</text><text x="46" y="450" font-size="16" font-weight="400">你是誰？</text><rect x="30" y="491" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="518" font-size="16" font-weight="650">存取授權 → 問</text><text x="46" y="544" font-size="16" font-weight="400">你可以做什麼？</text></g></svg>
