<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" role="img" aria-labelledby="title desc"><title id="title">五個問題，各自找證據</title><desc id="desc">問題分類，不是固定操作順序；測試許可與帳號權限分開。</desc><rect x="1" y="1" width="678" height="594" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">五個問題，各自找證據</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">偵察</text><text x="40" y="120" font-size="17">目標在哪裡？</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">掃描</text><text x="40" y="215" font-size="17">有哪些服務入口？</text><rect x="24" y="256" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">列舉</text><text x="40" y="310" font-size="17">提供哪些具體資訊？</text><rect x="24" y="351" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="379" font-size="19" font-weight="bold">身分驗證</text><text x="40" y="405" font-size="17">你是誰？</text><rect x="24" y="446" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="474" font-size="19" font-weight="bold">存取授權</text><text x="40" y="500" font-size="17">你可以做什麼？</text><text x="24" y="561" font-size="17">問題分類，不是固定操作順序；測試許可與帳號權限分開。</text></g></svg>
