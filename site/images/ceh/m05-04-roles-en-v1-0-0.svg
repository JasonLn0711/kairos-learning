<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625.95" role="img" aria-labelledby="m0504-roles-en-title m0504-roles-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0504-roles-en-title">Figure 1 | CVE, CWE, CPE and local evidence</title><desc id="m0504-roles-en-desc">Three parallel perspectives jointly support a device applicability judgment.</desc><g transform="scale(.9)" font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c">Figure 1 | CVE, CWE, CPE and local evidence</text><text x="28" y="96.19999999999999" font-size="20" fill="#18252c">Three parallel perspectives jointly support a device applicability judgment.</text><path d="M4 2h10l6 6v14H4z M14 2v6h6 M7 13h7 M7 17h4" transform="translate(162.66666666666666 158.2) scale(1.3)" fill="none" stroke="#006bc7" stroke-width="2" /><text x="46.0" y="228.2" font-size="23" fill="#18252c">CVE</text><text x="46.0" y="267.3" font-size="20" fill="#18252c">Which vulnerability?</text><path d="M20 3a6 6 0 0 1-7 8L5 20l-3-3 9-8a6 6 0 0 1 9-6z" transform="translate(484.0 158.2) scale(1.3)" fill="none" stroke="#59616b" stroke-width="2" /><text x="367.3333333333333" y="228.2" font-size="23" fill="#18252c">CWE</text><text x="367.3333333333333" y="267.3" font-size="20" fill="#18252c">Which weakness type?</text><path d="M3 6l9-5 9 5v12l-9 5-9-5z M3 6l9 5 9-5 M12 11v12" transform="translate(805.3333333333333 158.2) scale(1.3)" fill="none" stroke="#006d32" stroke-width="2" /><text x="688.6666666666666" y="228.2" font-size="23" fill="#18252c">CPE</text><text x="688.6666666666666" y="267.3" font-size="20" fill="#18252c">Which products may</text><text x="688.6666666666666" y="301.3" font-size="20" fill="#18252c">be affected?</text><path d="M500 357.29999999999995v24m-6-6 6 6 6-6" fill="none" stroke="#64748b" stroke-width="3" /><text x="46.0" y="427.29999999999995" font-size="23" fill="#18252c">Compare versions, settings, patches and local evidence</text><text x="46.0" y="466.4" font-size="20" fill="#18252c">Check actual conditions using all three perspectives</text><path d="M500 522.4v24m-6-6 6 6 6-6" fill="none" stroke="#64748b" stroke-width="3" /><text x="46.0" y="592.4" font-size="23" fill="#18252c">Is this actual device affected?</text><text x="46.0" y="631.5" font-size="20" fill="#18252c">This is the question the security engineer needs to answer</text></g></svg>
