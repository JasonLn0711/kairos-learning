<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688.5" role="img" aria-labelledby="m0503-roles-en-title m0503-roles-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-roles-en-title">Figure 1 | Three identification roles</title><desc id="m0503-roles-en-desc">Three parallel perspectives, not a sequence or one-to-one mapping. Advisory conditions and local evidence still decide applicability.</desc><defs><marker id="m0503-roles-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 1 | Three identification roles</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Three parallel perspectives, not a sequence or one-to-one mapping. Advisory</text><text x="28" y="140.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">conditions and local evidence still decide applicability.</text><rect x="40.0" y="202" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="236.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">CVE | Vulnerability case</text><text x="60.0" y="273.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Correlate the same disclosed vulnerability by ID; one vulnerability</text><text x="60.0" y="305.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">can affect several product versions.</text><rect x="40.0" y="383" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="417.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">CWE | Weakness type</text><text x="60.0" y="454.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">One weakness type can recur across vulnerabilities in different</text><text x="60.0" y="486.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">products; the same type does not mean the same event.</text><rect x="40.0" y="564" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="598.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">CPE | Product class</text><text x="60.0" y="635.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Standardize product and version names; matching devices remain</text><text x="60.0" y="667.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">separate assets, and preliminary matches require further checks.</text></g></svg>
