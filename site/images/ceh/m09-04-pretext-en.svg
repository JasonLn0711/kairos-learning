<svg xmlns="http://www.w3.org/2000/svg" width="900" height="810" viewBox="0 0 900 810" role="img" aria-labelledby="m0904-f2-en-title m0904-f2-en-desc"><title id="m0904-f2-en-title">Verify identity AND permission.</title><desc id="m0904-f2-en-desc">An unverified request enters an independent verification process. Only verified identity and explicit authorization for the specific action lead to narrowly scoped access; unknown or failed verification leads to stopping and referral.</desc><defs><marker id="m0904-f2-en-a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2774a7" /></marker><marker id="m0904-f2-en-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18785d" /></marker><marker id="m0904-f2-en-a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b14d55" /></marker><marker id="m0904-f2-en-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7d" /></marker></defs><g transform="scale(0.9)"><rect width="1000" height="900" fill="#f7fafc" /><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="44" y="38" fill="#2774a7" font-size="20" font-weight="700" text-anchor="start">CEH M09-04  /  02  /  NORTHSTAR · SYNTHETIC SCENARIO</text><text x="44" y="87" fill="#193449" font-size="31" font-weight="700" text-anchor="start">Verify identity AND permission.</text><text x="44" y="124" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">Pretexting: a credible name, role, or real identity is not enough.</text><rect x="220" y="172" width="560" height="102" rx="18" fill="#fff5dd" stroke="#946114" stroke-width="1.5" /><text x="500" y="211" fill="#946114" font-size="24" font-weight="700" text-anchor="middle">Request: share data or change access</text><text x="500" y="248" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">UNVERIFIED · do not act yet</text><path d="M500 274 V357" fill="none" stroke="#536b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f2-en-a-muted)" /><path d="M44 319 H410 M590 319 H956" fill="none" stroke="#2774a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" /><text x="65" y="309" fill="#2774a7" font-size="20" font-weight="700" text-anchor="start">Trust-source boundary</text><rect x="190" y="357" width="620" height="169" rx="18" fill="#edf6fc" stroke="#2774a7" stroke-width="1.5" /><text x="500" y="398" fill="#2774a7" font-size="23" font-weight="700" text-anchor="middle">Use an established directory or service desk</text><text x="500" y="440" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">1. Independently confirm identity and the request.</text><text x="500" y="476" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">2. Check authorization: data, system, scope, and duration.</text><path d="M500 526 V561 H265 V631" fill="none" stroke="#18785d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f2-en-a-green)" /><path d="M500 561 H735 V631" fill="none" stroke="#b14d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f2-en-a-red)" /><rect x="183" y="580" width="164" height="34" rx="5" fill="#f7fafc" stroke="#f7fafc" stroke-width="1.5" /><rect x="636" y="580" width="198" height="34" rx="5" fill="#f7fafc" stroke="#f7fafc" stroke-width="1.5" /><text x="265" y="605" fill="#18785d" font-size="20" font-weight="700" text-anchor="middle">BOTH confirmed</text><text x="735" y="605" fill="#b14d55" font-size="20" font-weight="700" text-anchor="middle">Failed OR unresolved</text><rect x="45" y="631" width="440" height="139" rx="18" fill="#eaf6ef" stroke="#18785d" stroke-width="1.5" /><text x="265" y="672" fill="#18785d" font-size="22" font-weight="700" text-anchor="middle">Proceed within the approved scope</text><text x="265" y="714" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">Only approved people, actions, and time.</text><text x="265" y="744" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">Keep an auditable record.</text><rect x="515" y="631" width="440" height="139" rx="18" fill="#fceef0" stroke="#b14d55" stroke-width="1.5" /><text x="735" y="672" fill="#b14d55" font-size="23" font-weight="700" text-anchor="middle">Stop and refer</text><text x="735" y="714" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">Urgency and story details do not fill the gap.</text><text x="735" y="744" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">Refer to the service desk or responsible owner.</text><path d="M44 804 H956" fill="none" stroke="#bdcbd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="839" fill="#193449" font-size="20" font-weight="500" text-anchor="start">A real person ≠ an authorized person. A different app ≠ an independent source.</text><text x="44" y="870" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">Solid arrows: this defensive decision flow. Blue dashes: trust-source boundary.</text></g></g></svg>