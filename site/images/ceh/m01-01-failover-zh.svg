<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t d"><title id="t">備援：正常服務與故障切換</title><desc id="d">使用者 → 主要伺服器；下列是兩種分支情況，不是連續執行的兩步。</desc>
<rect width="760" height="520" rx="18" fill="#f7f8f5"/>
<text x="25" y="35" font-family="sans-serif" font-size="24" fill="#173d35"><tspan x="25" dy="0">備援：正常服務與故障切換</tspan></text>
<text x="25" y="75" font-family="sans-serif" font-size="18" fill="#173d35"><tspan x="25" dy="0">使用者 →</tspan><tspan x="25" dy="27">主要伺服器；下列是兩種分支情況，不是連續執行的兩步。</tspan></text>
<rect x="25" y="135" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="170" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">正常 → 提供服務</tspan></text>
<text x="45" y="215" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">主要伺服器正常時服務使用者。</tspan></text>
<rect x="25" y="315" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="350" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">故障 → 備援伺服器 → 繼續提供服務</tspan></text>
<text x="45" y="395" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">必須配合健康檢查、資料同步與故障切換機制。</tspan></text>
</svg>
