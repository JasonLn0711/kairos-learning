<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="m0204-f4-en-title m0204-f4-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0204-f4-en-title">4 | From clues to defensible protection</title>
<desc id="m0204-f4-en-desc">Queries create interaction; retain conditions and separate facts from inference.</desc>
<defs><marker id="m0204-f4-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="598" height="638" rx="20" fill="#f8fafc" stroke="#b7c7d5" />
<text x="300" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">4 | From clues to defensible protection</text>
<rect x="40" y="65" width="520" height="88" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="300" y="96" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">Confirm names, services, and scope</text>
<text x="300" y="123" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">Third-party hosting does not expand permission</text>
<path d="M300 153V185" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0204-f4-en-arrow)" />
<rect x="40" y="185" width="520" height="88" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="300" y="216" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">Record time, resolver, type, and status</text>
<text x="300" y="243" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">Timeout does not mean NXDOMAIN</text>
<path d="M300 273V305" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0204-f4-en-arrow)" />
<rect x="40" y="305" width="520" height="88" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="300" y="336" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">Separate facts, hypotheses, and unknowns</text>
<text x="300" y="363" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">Public entry does not mean origin server</text>
<path d="M300 393V425" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0204-f4-en-arrow)" />
<rect x="40" y="425" width="520" height="88" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="300" y="456" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">Protect accounts, records, and access</text>
<text x="300" y="483" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">DNSSEC authenticates data; it does not encrypt</text>
<text x="300" y="575" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#172b3a">Verify changes with source and cache conditions</text>
</svg>