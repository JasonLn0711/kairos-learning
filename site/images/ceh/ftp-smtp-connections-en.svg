<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="ceh26m04c03-connections-en-title ceh26m04c03-connections-en-desc" preserveAspectRatio="xMidYMid meet"><title id="ceh26m04c03-connections-en-title">Figure 1 | Two FTP connection roles</title><desc id="ceh26m04c03-connections-en-desc">These are parallel responsibilities, not a guarantee that success on one connection makes the other succeed.</desc><rect x="1" y="1" width="898" height="518" rx="16" fill="#f3f7fb" stroke="#b7c9df" /><text x="35" y="44" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#172b49">Figure 1 | Two FTP connection roles</text><text x="35" y="88" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">These are parallel responsibilities, not a guarantee that success on one</text><text x="35" y="120" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">connection makes the other succeed.</text><rect x="20" y="148" width="860" height="140" rx="12" fill="#ffffff" stroke="#8ba5bd" /><text x="35" y="172" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b49">Control connection</text><text x="35" y="216" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Carries login, capability queries, and operation requests, commonly on TCP</text><text x="35" y="248" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">21. A successful login still needs a working data connection.</text><rect x="20" y="312" width="860" height="140" rx="12" fill="#ffffff" stroke="#8ba5bd" /><text x="35" y="336" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b49">Data connection</text><text x="35" y="380" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Carries directory listings or file contents. Active/passive modes change</text><text x="35" y="412" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">the initiator and receiving endpoint.</text></svg>
