<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="m0203-f5-zh-title m0203-f5-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0203-f5-zh-title">noindex 的生效順序</title><desc id="m0203-f5-zh-desc">公開頁面：取得內容 → 讀取規則 → 更新索引。私人內容另以身分驗證與授權交付。</desc><rect width="600" height="640" fill="#ffffff" /><rect x="20" y="24" width="560" height="112" rx="14" fill="#eaf4ff" stroke="#64748b" /><text x="40" y="66" font-size="18" font-family="sans-serif" font-weight="600" fill="#172b3a">1　允許 Googlebot 取得公開資源</text><text x="40" y="102" font-size="16" font-family="sans-serif" fill="#172b3a">讀取 HTML 或 HTTP 回應標頭</text><path d="M300 138 V169 M292 160 L300 169 L308 160" fill="none" stroke="#2563a6" stroke-width="3" /><rect x="20" y="176" width="560" height="112" rx="14" fill="#e9f7ef" stroke="#64748b" /><text x="40" y="218" font-size="18" font-family="sans-serif" font-weight="600" fill="#172b3a">2　讀到 noindex 索引指示</text><text x="40" y="254" font-size="16" font-family="sans-serif" fill="#172b3a">依規則將頁面排除於搜尋結果</text><path d="M300 290 V321 M292 312 L300 321 L308 312" fill="none" stroke="#2563a6" stroke-width="3" /><rect x="20" y="328" width="560" height="112" rx="14" fill="#fff5dd" stroke="#64748b" /><text x="40" y="370" font-size="18" font-family="sans-serif" font-weight="600" fill="#172b3a">3　使用 Search Console 查核</text><text x="40" y="406" font-size="16" font-family="sans-serif" fill="#172b3a">觀察網址審查與索引報表</text><rect x="20" y="480" width="560" height="112" rx="14" fill="#f0ecff" stroke="#64748b" /><text x="40" y="522" font-size="18" font-family="sans-serif" font-weight="600" fill="#172b3a">私人 PDF 的另一條路徑</text><text x="40" y="558" font-size="16" font-family="sans-serif" fill="#172b3a">驗證身分 → 核對檔案權限 → 交付內容</text></svg>