<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t d">
<title id="t">網頁補充：Northstar 的三種保護目標</title><desc id="d">三者是並列目標；同一事件可能影響多項。</desc>
<rect width="760" height="520" rx="20" fill="#f7f8f5"/>
<rect x="20" y="20" width="720" height="130" rx="14" fill="#eaf2ef" stroke="#677c73"/>
<text x="45" y="65" font-family="sans-serif" font-size="24" fill="#173d35">機密性</text>
<text x="45" y="108" font-family="sans-serif" font-size="21" fill="#253b33">陌生人讀到私人作答</text>
<rect x="20" y="170" width="720" height="130" rx="14" fill="#eaf2ef" stroke="#677c73"/>
<text x="45" y="215" font-family="sans-serif" font-size="24" fill="#173d35">完整性</text>
<text x="45" y="258" font-family="sans-serif" font-size="21" fill="#253b33">分數被未授權改動</text>
<rect x="20" y="320" width="720" height="130" rx="14" fill="#eaf2ef" stroke="#677c73"/>
<text x="45" y="365" font-family="sans-serif" font-size="24" fill="#173d35">可用性</text>
<text x="45" y="408" font-family="sans-serif" font-size="21" fill="#253b33">考試時系統停擺</text>
<text x="25" y="495" font-family="sans-serif" font-size="18" fill="#253b33">三者是並列目標；同一事件可能影響多項。</text>
</svg>
