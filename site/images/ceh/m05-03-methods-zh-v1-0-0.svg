<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 333.90000000000003" role="img" aria-labelledby="m0503-methods-zh-title m0503-methods-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-methods-zh-title">圖 3｜主動與被動：取得證據的方式</title><desc id="m0503-methods-zh-desc">兩種觀察方式並列互補，都需要授權。</desc><defs><marker id="m0503-methods-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 3｜主動與被動：取得證據的方式</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">兩種觀察方式並列互補，都需要授權。</text><rect x="40.0" y="170" width="448.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Active 主動式</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">你主動敲門、按門鈴，看看是否有人回應。</text><rect x="512.0" y="170" width="448.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="532.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Passive 被動式</text><text x="532.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">你觀察現有的監視畫面或進出紀錄，不主動敲</text><text x="532.0" y="273.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">門。</text></g></svg>
