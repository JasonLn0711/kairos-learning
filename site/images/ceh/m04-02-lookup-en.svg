<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc"><title id="title">From a name to a service connection</title><desc id="desc">A DNS result precedes connection attempts. These addresses are documentation examples.</desc><rect width="720" height="490" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="38" y="38" font-size="18" font-weight="650">From a name to a service connection</text><text x="38" y="66" font-size="16" font-weight="400">A DNS result precedes connection attempts. These addresses are</text><text x="38" y="94" font-size="16" font-weight="400"> documentation examples.</text><rect x="22" y="116" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="138" font-size="18" font-weight="650">User enters a domain name</text><text x="38" y="166" font-size="16" font-weight="400">www.example.test</text><text x="38" y="222" font-size="16" font-weight="400">↓ Ask DNS for the IP address</text><rect x="22" y="240" width="676" height="78" rx="12" fill="#e8f0f5" stroke="#778d80"/><text x="38" y="262" font-size="18" font-weight="650">DNS lookup system</text><text x="38" y="290" font-size="16" font-weight="400">A record returned: 192.0.2.10</text><text x="38" y="346" font-size="16" font-weight="400">↓ With an IP, prepare a connection</text><rect x="22" y="364" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="386" font-size="18" font-weight="650">Attempt to connect to the service</text><text x="38" y="414" font-size="16" font-weight="400">TCP / TLS / HTTP follow</text></g></svg>
