<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 765" role="img" aria-labelledby="m0202-f4-en-title m0202-f4-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0202-f4-en-title">4 | Preserve evidence; separate analysis</title>
<desc id="m0202-f4-en-desc">Preservation and inference differ; a hash is not truth</desc>
<defs><marker id="m0202-f4-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="598" height="763" rx="20" fill="#f8fafc" stroke="#b7c7d5" />
<text x="300" y="45" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#172b3a">4 | Preserve evidence; separate analysis</text>
<rect x="60" y="85" width="480" height="100" rx="15" fill="#e8f2fb" stroke="#7892a6" />
<text x="300.0" y="119" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">Original: source, version, times</text>
<rect x="60" y="240" width="480" height="100" rx="15" fill="#e7f3ed" stroke="#7892a6" />
<text x="300.0" y="274" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">Preserved copy + trusted hash</text>
<rect x="60" y="395" width="480" height="100" rx="15" fill="#fff3d8" stroke="#7892a6" />
<text x="300.0" y="429" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">Analysis: claim, support, limits</text>
<rect x="60" y="550" width="480" height="100" rx="15" fill="#e7f3ed" stroke="#7892a6" />
<text x="300.0" y="584" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">Reviewable trail; keep original</text>
<path d="M300 185V240" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0202-f4-en-arrow)" />
<path d="M300 340V395" fill="none" stroke="#41617b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m0202-f4-en-arrow)" />
<path d="M300 495V550" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0202-f4-en-arrow)" />
<text x="300" y="690" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#172b3a">Solid: preserve/trace. Dashed: infer.</text>
<text x="300" y="718" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#172b3a">Unchanged content ≠ a true story.</text>
</svg>