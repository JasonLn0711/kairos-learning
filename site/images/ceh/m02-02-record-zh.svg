<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 765" role="img" aria-labelledby="m0202-f4-zh-title m0202-f4-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0202-f4-zh-title">圖 4｜原始證據與分析分開</title>
<desc id="m0202-f4-zh-desc">保存與推理分開，雜湊不是事實證明</desc>
<defs><marker id="m0202-f4-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="598" height="763" rx="20" fill="#f8fafc" stroke="#b7c7d5" />
<text x="300" y="45" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#172b3a">圖 4｜原始證據與分析分開</text>
<rect x="60" y="85" width="480" height="100" rx="15" fill="#e8f2fb" stroke="#7892a6" />
<text x="300.0" y="119" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">原始資料：來源、版本、時間</text>
<rect x="60" y="240" width="480" height="100" rx="15" fill="#e7f3ed" stroke="#7892a6" />
<text x="300.0" y="274" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">保存副本＋可信雜湊基準</text>
<rect x="60" y="395" width="480" height="100" rx="15" fill="#fff3d8" stroke="#7892a6" />
<text x="300.0" y="429" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">分析筆記：主張、支持、限制</text>
<rect x="60" y="550" width="480" height="100" rx="15" fill="#e7f3ed" stroke="#7892a6" />
<text x="300.0" y="584" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#172b3a">查核者可追溯，不覆蓋原文</text>
<path d="M300 185V240" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0202-f4-zh-arrow)" />
<path d="M300 340V395" fill="none" stroke="#41617b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m0202-f4-zh-arrow)" />
<path d="M300 495V550" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0202-f4-zh-arrow)" />
<text x="300" y="690" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#172b3a">實線＝保存／追溯；虛線＝推論</text>
<text x="300" y="718" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#172b3a">內容未變 ≠ 故事為真</text>
</svg>