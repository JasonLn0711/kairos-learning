<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430.8" role="img" aria-labelledby="rpc-evidence-en-title rpc-evidence-en-desc" preserveAspectRatio="xMidYMid meet"><title id="rpc-evidence-en-title">Microsoft RPC: endpoint discovery still needs verification</title><desc id="rpc-evidence-en-desc">Synthetic case: 135 returns TCP 50020, but connection times out. Arrows show diagnostic order; authentication may occur at different stages. Known endpoints, caches, or named pipes may bypass a 135 lookup.</desc><defs><marker id="rpc-evidence-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b7a" /></marker></defs><rect width="1500" height="718" fill="#f5f8fc" /><g transform="scale(0.6)"><text x="32" y="45" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#183b59">Microsoft RPC: endpoint discovery still needs verification</text>
<text x="32" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Synthetic case: 135 returns TCP 50020, but connection times out. Arrows show diagnostic order; authentication</text>
<text x="32" y="109" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">may occur at different stages. Known endpoints, caches, or named pipes may bypass a 135 lookup.</text>
<rect x="20" y="160" width="1460" height="337" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="194" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Diagnostic stages</text>
<rect x="52.0" y="218" width="258.4" height="261" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">01 | Endpoint</text>
<text x="68.0" y="275" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">registration</text>
<text x="68.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Endpoint Mapper:</text>
<text x="68.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">TCP 135 returns</text>
<text x="68.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">50020. Establishes</text>
<text x="68.0" y="401" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">registration</text>
<text x="68.0" y="430" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">information only.</text>
<path d="M313.4 348.5h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#rpc-evidence-en-arrow)" />
<rect x="336.4" y="218" width="258.4" height="261" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="352.4" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">02 | Network</text>
<text x="352.4" y="275" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">reachability</text>
<text x="352.4" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">TCP Connection:</text>
<text x="352.4" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">connection to</text>
<text x="352.4" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">50020 times out;</text>
<text x="352.4" y="401" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">target endpoint</text>
<text x="352.4" y="430" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">not reached.</text>
<path d="M597.8 348.5h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#rpc-evidence-en-arrow)" />
<rect x="620.8" y="218" width="258.4" height="261" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="636.8" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">03 | Interface</text>
<text x="636.8" y="275" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">negotiation</text>
<text x="636.8" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">RPC Bind: check</text>
<text x="636.8" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">interface/version</text>
<text x="636.8" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">compatibility.</text>
<text x="636.8" y="401" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Negotiation may</text>
<text x="636.8" y="430" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">fail even after</text>
<text x="636.8" y="459" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">TCP connects.</text>
<path d="M882.1999999999999 348.5h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#rpc-evidence-en-arrow)" />
<rect x="905.1999999999999" y="218" width="258.4" height="261" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="921.1999999999999" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">04 |</text>
<text x="921.1999999999999" y="275" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Authentication</text>
<text x="921.1999999999999" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Establish who is</text>
<text x="921.1999999999999" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">calling. An</text>
<text x="921.1999999999999" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">identity does not</text>
<text x="921.1999999999999" y="401" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">imply all</text>
<text x="921.1999999999999" y="430" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">permissions.</text>
<path d="M1166.6 348.5h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#rpc-evidence-en-arrow)" />
<rect x="1189.6" y="218" width="258.4" height="261" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="1205.6" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">05 | Authorization</text>
<text x="1205.6" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Check permission</text>
<text x="1205.6" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">for the specified</text>
<text x="1205.6" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">operation. Read</text>
<text x="1205.6" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">permission does</text>
<text x="1205.6" y="401" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">not imply</text>
<text x="1205.6" y="430" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">modification</text>
<text x="1205.6" y="459" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">permission.</text>
<rect x="20" y="521" width="1460" height="163" rx="20" fill="#183b59" stroke="#8098ae" />
<text x="42" y="555" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#ffffff">Evidence boundary</text>
<rect x="52.0" y="579" width="1396.0" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="607" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">This case stops at stage 2</text>
<text x="68.0" y="646" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Stages 3–5 remain unverified. Do not infer incorrect credentials, administrative permission, or service absence.</text></g></svg>
