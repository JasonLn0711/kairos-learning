<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 765" role="img" aria-labelledby="m0201-f3-zh-m02-01-evidence-zh-TW-title m0201-f3-zh-m02-01-evidence-zh-TW-desc" preserveAspectRatio="xMidYMid meet"><title id="m0201-f3-zh-m02-01-evidence-zh-TW-title">圖 3｜觀察，不等於最終結論</title><desc id="m0201-f3-zh-m02-01-evidence-zh-TW-desc">箭頭＝推理與查核步驟，不是因果；技術名稱 ≠ 現行版本 ≠ 可利用漏洞；驗證也可以讀現行資產紀錄</desc><defs><marker id="m0201-f3-zh-m02-01-evidence-zh-TW-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a" /></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="765" rx="22" fill="#f6f9fb" /><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">圖 3｜觀察，不等於最終結論</text><rect x="30" y="85" width="540" height="94" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="119" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">觀察：歷史職缺提到某技術</text><path d="M300,181 L300,210" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0201-f3-zh-m02-01-evidence-zh-TW-arrow)" /><rect x="30" y="217" width="540" height="94" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="251" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">推論：當時可能有相關需求</text><path d="M300,313 L300,342" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0201-f3-zh-m02-01-evidence-zh-TW-arrow)" /><rect x="30" y="349" width="540" height="94" rx="16" fill="#fff0d5" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="383" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">待驗證：現行系統是否使用？</text><path d="M300,445 L300,474" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0201-f3-zh-m02-01-evidence-zh-TW-arrow)" /><rect x="30" y="481" width="540" height="94" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="515" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">結論限於已核實的時間與範圍</text><text x="30" y="654" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">箭頭＝推理與查核步驟，不是因果</text><text x="30" y="683" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">技術名稱 ≠ 現行版本 ≠ 可利用漏洞</text><text x="30" y="712" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">驗證也可以讀現行資產紀錄</text></g></svg>