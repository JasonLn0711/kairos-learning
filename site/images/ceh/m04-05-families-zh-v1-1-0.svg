<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378.59999999999997" role="img" aria-labelledby="rpc-families-zh-title rpc-families-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="rpc-families-zh-title">TCP 135 與 111：兩種服務查號臺</title><desc id="rpc-families-zh-desc">概念相似，但協定家族、查詢格式與找到的服務不同。</desc><defs><marker id="rpc-families-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b7a" /></marker></defs><rect width="1500" height="631" fill="#f5f8fc" /><g transform="scale(0.6)"><text x="32" y="45" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#183b59">TCP 135 與 111：兩種服務查號臺</text>
<text x="32" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">概念相似，但協定家族、查詢格式與找到的服務不同。</text>
<rect x="20" y="160" width="1460" height="250" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="194" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">RPC 體系</text>
<rect x="52.0" y="218" width="685.0" height="174" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Microsoft RPC｜Windows 常見</text>
<text x="68.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Endpoint Mapper；常見入口 TCP 135；以 Interface UUID＋</text>
<text x="68.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">版本辨識。端點可為 TCP 服務埠或具名管道，也可經 SMB 傳</text>
<text x="68.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">輸。例：135 → TCP 50020 → 指定 RPC 操作。</text>
<rect x="763.0" y="218" width="685.0" height="174" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="779.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">ONC RPC｜Unix／Linux 常見</text>
<text x="779.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">rpcbind／portmapper；常見入口 TCP／UDP 111；Program nu</text>
<text x="779.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">mber＋Version 辨識服務，以 Procedure number 辨識操作。</text>
<text x="779.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">可能用於部分 NFS 相關服務。例：111 → 找服務位置，視版</text>
<text x="779.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">本而定。</text>
<rect x="20" y="434" width="1460" height="163" rx="20" fill="#183b59" stroke="#8098ae" />
<text x="42" y="468" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#ffffff">判讀界線</text>
<rect x="52.0" y="492" width="1396.0" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="520" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">重要例外</text>
<text x="68.0" y="559" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">NFSv4.1 常直接使用 TCP 2049，不必把 111 當成每次必經站。不查 rpcbind 不等於不使用 RPC。</text></g></svg>
