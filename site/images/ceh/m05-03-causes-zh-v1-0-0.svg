<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 927.9" role="img" aria-labelledby="m0503-causes-zh-title m0503-causes-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-causes-zh-title">圖 1｜五種弱點成因</title><desc id="m0503-causes-zh-desc">依成因安排修正；五種分類可能重疊，編號只供對照。</desc><defs><marker id="m0503-causes-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 1｜五種弱點成因</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">依成因安排修正；五種分類可能重疊，編號只供對照。</text><rect x="40.0" y="170" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">1. 設計缺陷（Design Flaw）</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">銀行最初設計時，就沒有規定誰能進入金庫。

問題出在「制度或系統規則一開始就沒設計好」。</text><rect x="40.0" y="319" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="353.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">2. 實作缺陷（Implementation Flaw）</text><text x="60.0" y="390.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">銀行規定只有經理能進入金庫，但工程師寫門禁程式時，忘記檢查身分。

問題出在「規則正確，</text><text x="60.0" y="422.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">程式卻寫錯」。</text><rect x="40.0" y="500" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="534.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">3. 設定錯誤（Misconfiguration）</text><text x="60.0" y="571.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">門禁系統本來有身分驗證功能，但管理員把它設成所有人都能進入。

問題出在「功能正常，設定</text><text x="60.0" y="603.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">卻不安全」。</text><rect x="40.0" y="681" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="715.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">4. 尚未修補的已知缺陷（Unpatched Vulnerability）</text><text x="60.0" y="752.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">門禁廠商發現某個版本有安全漏洞，已經發布更新，但銀行還沒安裝。

問題出在「已經有修補方</text><text x="60.0" y="784.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">法，卻還沒完成修補」。</text><rect x="40.0" y="862" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="896.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">5. 管理與流程缺口（Process Weakness）</text><text x="60.0" y="933.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">某位經理已經離職，但銀行沒有註銷他的門禁權限。

問題出在「人員管理或維護流程不完善」。</text></g></svg>
