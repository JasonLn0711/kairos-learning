<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1675.44" role="img" aria-labelledby="m0409-bgp-en-title m0409-bgp-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-bgp-en-title">BGP advertisements and AS_PATH: detect a returning loop</title><desc id="m0409-bgp-en-desc">Four ASes form a diamond. Arrows show this example’s advertisement direction: AS64500 → AS64497 → AS64496 → AS64498 → AS64500. The returning path contains the receiving AS’s own ASN and is excluded. These are not packet-forwarding arrows.</desc><defs><marker id="m0409-bgp-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">BGP advertisements and AS_PATH: detect a returning loop</text><path d="M310 872.6L360 333.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-bgp-en-arrow)" /><path d="M640 333.6L690 872.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-bgp-en-arrow)" /><path d="M690 1104.6L640 1411.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-bgp-en-arrow)" /><path d="M360 1411.6L310 1104.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-bgp-en-arrow)" /><rect x="30" y="640.6" width="280" height="464" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="46" y="672.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64500 | Origin</text><text x="46" y="708.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">and loop check</text><text x="46" y="744.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Advertise</text><text x="46" y="776.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">192.0.2.0/24 →</text><text x="46" y="808.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64497</text><text x="46" y="840.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Outgoing AS_PATH:</text><text x="46" y="872.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64500</text><text x="46" y="904.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Receive 64498 64496</text><text x="46" y="936.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64497 64500 from</text><text x="46" y="968.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64498; exclude</text><text x="46" y="1000.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">the loop because it</text><text x="46" y="1032.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">contains own ASN</text><text x="46" y="1064.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64500.</text><rect x="360" y="101.6" width="280" height="464" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="376" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64497 |</text><text x="376" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Advertise</text><text x="376" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">rightward</text><text x="376" y="241.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Receive 64500 from</text><text x="376" y="273.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64500</text><text x="376" y="305.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Advertise to</text><text x="376" y="337.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64496: 64497 64500</text><rect x="690" y="640.6" width="280" height="464" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="706" y="672.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64496 |</text><text x="706" y="708.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Advertise</text><text x="706" y="744.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">downward</text><text x="706" y="780.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Receive 64497 64500</text><text x="706" y="812.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">from AS64497</text><text x="706" y="844.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Advertise to</text><text x="706" y="876.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64498: 64496</text><text x="706" y="908.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64497 64500</text><rect x="360" y="1179.6" width="280" height="464" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="376" y="1211.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">AS64498 | Return</text><text x="376" y="1247.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">to origin</text><text x="376" y="1283.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Receive 64496 64497</text><text x="376" y="1315.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64500 from AS64496</text><text x="376" y="1347.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Advertise to</text><text x="376" y="1379.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">AS64500: 64498</text><text x="376" y="1411.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">64496 64497 64500</text><text x="28" y="1713.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Four ASes form a diamond. Arrows show this example’s advertisement</text><text x="28" y="1745.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">direction: AS64500 → AS64497 → AS64496 → AS64498 → AS64500. The returning</text><text x="28" y="1777.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">path contains the receiving AS’s own ASN and is excluded. These are not</text><text x="28" y="1809.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">packet-forwarding arrows.</text></g></svg>
