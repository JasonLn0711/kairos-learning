<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595.35" role="img" aria-labelledby="m0504-roles-zh-title m0504-roles-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0504-roles-zh-title">圖 1｜CVE、CWE、CPE 與現場證據</title><desc id="m0504-roles-zh-desc">三種平行觀察角度共同支援設備適用性判斷。</desc><g transform="scale(.9)" font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c">圖 1｜CVE、CWE、CPE 與現場證據</text><text x="28" y="96.19999999999999" font-size="20" fill="#18252c">三種平行觀察角度共同支援設備適用性判斷。</text><path d="M4 2h10l6 6v14H4z M14 2v6h6 M7 13h7 M7 17h4" transform="translate(162.66666666666666 158.2) scale(1.3)" fill="none" stroke="#006bc7" stroke-width="2" /><text x="46.0" y="228.2" font-size="23" fill="#18252c">CVE</text><text x="46.0" y="267.3" font-size="20" fill="#18252c">發生哪個漏洞？</text><path d="M20 3a6 6 0 0 1-7 8L5 20l-3-3 9-8a6 6 0 0 1 9-6z" transform="translate(484.0 158.2) scale(1.3)" fill="none" stroke="#59616b" stroke-width="2" /><text x="367.3333333333333" y="228.2" font-size="23" fill="#18252c">CWE</text><text x="367.3333333333333" y="267.3" font-size="20" fill="#18252c">缺陷屬於哪一類？</text><path d="M3 6l9-5 9 5v12l-9 5-9-5z M3 6l9 5 9-5 M12 11v12" transform="translate(805.3333333333333 158.2) scale(1.3)" fill="none" stroke="#006d32" stroke-width="2" /><text x="688.6666666666666" y="228.2" font-size="23" fill="#18252c">CPE</text><text x="688.6666666666666" y="267.3" font-size="20" fill="#18252c">可能影響什麼產品？</text><path d="M500 323.29999999999995v24m-6-6 6 6 6-6" fill="none" stroke="#64748b" stroke-width="3" /><text x="46.0" y="393.29999999999995" font-size="23" fill="#18252c">對照版本、設定、修補與現場證據</text><text x="46.0" y="432.4" font-size="20" fill="#18252c">由三個觀察角度核對實際條件</text><path d="M500 488.4v24m-6-6 6 6 6-6" fill="none" stroke="#64748b" stroke-width="3" /><text x="46.0" y="558.4" font-size="23" fill="#18252c">這台實際設備到底有沒有受到影響？</text><text x="46.0" y="597.5" font-size="20" fill="#18252c">這才是資安工程師真正需要回答的問題</text></g></svg>
