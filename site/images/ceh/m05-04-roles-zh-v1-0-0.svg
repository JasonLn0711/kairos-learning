<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 573.3000000000001" role="img" aria-labelledby="m0503-roles-zh-title m0503-roles-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-roles-zh-title">圖 1｜三種識別的角色</title><desc id="m0503-roles-zh-desc">三個平行查詢角度，並非先後流程或一對一對應；最後仍須核對公告條件與現場證據。</desc><defs><marker id="m0503-roles-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 1｜三種識別的角色</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">三個平行查詢角度，並非先後流程或一對一對應；最後仍須核對公告條件與現場證據。</text><rect x="40.0" y="170" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">CVE｜漏洞個案</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">用共同編號對照同一個公開漏洞；一個漏洞可能影響多個產品版本。</text><rect x="40.0" y="319" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="353.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">CWE｜缺陷類型</text><text x="60.0" y="390.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">同一類缺陷可出現在不同產品的許多漏洞；相同類型不代表相同事件。</text><rect x="40.0" y="468" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="502.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">CPE｜產品類別</text><text x="60.0" y="539.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">標準化產品與版本名稱；同名設備仍是不同資產，初步匹配需要再驗證。</text></g></svg>
