<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585.6" role="img" aria-labelledby="dns-overview-zh-title dns-overview-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="dns-overview-zh-title">DNS 列舉：從名稱到可驗證的證據</title><desc id="dns-overview-zh-desc">箭頭表示查詢角色或證據判讀順序，不代表每次都接觸權威端，也不代表自動取得存取權；授權須在各階段事先確認。</desc><defs><marker id="dns-overview-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b7a" /></marker></defs><rect width="1500" height="976" fill="#f5f8fc" /><g transform="scale(0.6)"><text x="32" y="45" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#183b59">DNS 列舉：從名稱到可驗證的證據</text>
<text x="32" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">箭頭表示查詢角色或證據判讀順序，不代表每次都接觸權威端，也不代表自動取得存取權；授權須在各階段事先確認。</text>
<rect x="20" y="160" width="1460" height="192" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="194" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">① 查詢經過哪些角色？</text>
<rect x="52.0" y="218" width="448.0" height="116" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">你的電腦｜Stub Resolver</text>
<text x="68.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">送出：「www.example.test 的 A 紀錄</text>
<text x="68.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">是什麼？」</text>
<path d="M503.0 276.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-overview-zh-arrow)" />
<rect x="526.0" y="218" width="448.0" height="116" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="542.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">遞迴解析器｜Recursive Resolver</text>
<text x="542.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">可從快取回答；沒有適用快取時，再查</text>
<text x="542.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">根、頂級網域與權威伺服器。</text>
<path d="M977.0 276.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-overview-zh-arrow)" />
<rect x="1000.0" y="218" width="448.0" height="116" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="1016.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">權威名稱伺服器｜Authoritative DNS</text>
<text x="1016.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">依所管理的區域提供權威紀錄。</text>
<rect x="20" y="376" width="1460" height="163" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="410" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">② DNS 能提供什麼？</text>
<rect x="52.0" y="434" width="258.4" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="462" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">A / AAAA</text>
<text x="68.0" y="501" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">IPv4 / IPv6 位址</text>
<rect x="336.4" y="434" width="258.4" height="87" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="352.4" y="462" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">CNAME / PTR</text>
<text x="352.4" y="501" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">名稱別名／反查</text>
<rect x="620.8" y="434" width="258.4" height="87" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="636.8" y="462" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">NS / SOA</text>
<text x="636.8" y="501" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">權威 DNS／區域管理</text>
<rect x="905.1999999999999" y="434" width="258.4" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="921.1999999999999" y="462" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">MX</text>
<text x="921.1999999999999" y="501" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">郵件接收路由</text>
<rect x="1189.6" y="434" width="258.4" height="87" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="1205.6" y="462" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">TXT / SRV</text>
<text x="1205.6" y="501" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">文字政策／服務入口</text>
<rect x="20" y="563" width="1460" height="192" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="597" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">③ 形成結論時，必須逐層驗證</text>
<rect x="52.0" y="621" width="329.5" height="116" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="649" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">DNS 回覆</text>
<text x="68.0" y="688" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">查到配置資料</text>
<path d="M384.5 679.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-overview-zh-arrow)" />
<rect x="407.5" y="621" width="329.5" height="116" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="423.5" y="649" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">TCP / UDP</text>
<text x="423.5" y="688" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">確認相應的網路回應</text>
<path d="M740.0 679.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-overview-zh-arrow)" />
<rect x="763.0" y="621" width="329.5" height="116" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="779.0" y="649" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">TLS / HTTP</text>
<text x="779.0" y="688" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">確認協定與功能</text>
<path d="M1095.5 679.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-overview-zh-arrow)" />
<rect x="1118.5" y="621" width="329.5" height="116" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="1134.5" y="649" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">身分與授權</text>
<text x="1134.5" y="688" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">確認身分與允許的操作；各</text>
<text x="1134.5" y="717" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">階段都須事先確認授權。</text>
<rect x="20" y="779" width="1460" height="163" rx="20" fill="#183b59" stroke="#8098ae" />
<text x="42" y="813" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#ffffff">記錄格式</text>
<rect x="52.0" y="837" width="1396.0" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="865" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">查詢紀錄</text>
<text x="68.0" y="904" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">查詢來源／時間 → DNS 端點 → 名稱與類型 → 狀態與旗標 → 回覆與 TTL → 尚待驗證事項</text></g></svg>
