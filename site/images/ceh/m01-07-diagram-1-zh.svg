<svg xmlns="http://www.w3.org/2000/svg" width="800" height="632" viewBox="0 0 800 632" role="img" aria-labelledby="title desc" xml:lang="zh"><title id="title">資安管理的完整決策循環</title><desc id="desc">教學重繪，非官方流程圖。法律與契約、政策、授權、責任及證據留存約束全程；各活動可交錯，改善會回饋風險評估。 風險管理 Risk Management: 確認重要資產與威脅，評估可能性、影響及現有控制，決定優先順序與複查時間。 事件應變 Incident Response: 查核告警與原始證據，依授權圍堵、處理原因並驗證復原，不憑猜測結案。 改善治理 Continuous Improvement: 找出偵測與流程缺口，更新權限、制度、演練及訓練。 回到風險管理: 用事後經驗重新評估殘餘風險。修好漏洞不等於管理完所有風險；關閉告警不等於確認沒事。</desc><rect width="800" height="632" fill="#f2f6f5"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="18" font-weight="700" fill="#18252c">資安管理的完整決策循環</text><text x="32" y="76" font-size="18" font-weight="400" fill="#18252c">教學重繪，非官方流程圖。法律與契約、政策、授權、責任及證據留存約束全</text><text x="32" y="102" font-size="18" font-weight="400" fill="#18252c">程；各活動可交錯，改善會回饋風險評估。</text><rect x="24" y="152" width="752" height="112" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="182" font-size="18" font-weight="700" fill="#18252c">1. 風險管理 Risk Management</text><text x="42" y="212" font-size="18" font-weight="400" fill="#18252c">確認重要資產與威脅，評估可能性、影響及現有控制，決定優先順序與複查時</text><text x="42" y="238" font-size="18" font-weight="400" fill="#18252c">間。</text><rect x="24" y="282" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="312" font-size="18" font-weight="700" fill="#18252c">2. 事件應變 Incident Response</text><text x="42" y="342" font-size="18" font-weight="400" fill="#18252c">查核告警與原始證據，依授權圍堵、處理原因並驗證復原，不憑猜測結案。</text><rect x="24" y="386" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="416" font-size="18" font-weight="700" fill="#18252c">3. 改善治理 Continuous Improvement</text><text x="42" y="446" font-size="18" font-weight="400" fill="#18252c">找出偵測與流程缺口，更新權限、制度、演練及訓練。</text><rect x="24" y="490" width="752" height="112" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="520" font-size="18" font-weight="700" fill="#18252c">4. 回到風險管理</text><text x="42" y="550" font-size="18" font-weight="400" fill="#18252c">用事後經驗重新評估殘餘風險。修好漏洞不等於管理完所有風險；關閉告警不</text><text x="42" y="576" font-size="18" font-weight="400" fill="#18252c">等於確認沒事。</text></g></svg>
