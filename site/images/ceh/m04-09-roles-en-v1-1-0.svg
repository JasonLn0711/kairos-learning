<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 713.34" role="img" aria-labelledby="m0409-roles-en-title m0409-roles-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-roles-en-title">Six building roles, seven protocol groups</title><desc id="m0409-roles-en-desc">These are parallel comparisons. Telnet and TFTP are distinct services; no arrows imply a sequence between cards.</desc><defs><marker id="m0409-roles-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Six building roles, seven protocol groups</text><rect x="40.0" y="101.6" width="442.5" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">NTP | Standard clock</text><text x="56.0" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Keep device clocks consistent.</text><rect x="517.5" y="101.6" width="442.5" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="533.5" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IPsec / IKE | Secure channel</text><text x="533.5" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Protect remote connections and</text><text x="533.5" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">traffic.</text><rect x="40.0" y="266.6" width="442.5" height="176" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="298.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">VoIP / SIP | Telephone</text><text x="56.0" y="334.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">switchboard</text><text x="56.0" y="370.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Support dialing, answering and</text><text x="56.0" y="402.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">voice transport.</text><rect x="517.5" y="266.6" width="442.5" height="176" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="533.5" y="298.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IPv6 | Addresses and</text><text x="533.5" y="334.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">neighbors</text><text x="533.5" y="370.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Identify devices and discover</text><text x="533.5" y="402.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">routers.</text><rect x="40.0" y="467.6" width="442.5" height="176" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="499.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">BGP | Inter-network</text><text x="56.0" y="535.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">navigation</text><text x="56.0" y="571.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Exchange routes between large</text><text x="56.0" y="603.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">networks.</text><rect x="517.5" y="467.6" width="442.5" height="176" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="533.5" y="499.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Telnet / TFTP | Older</text><text x="533.5" y="535.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">management room</text><text x="533.5" y="571.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Remote terminals and simple file</text><text x="533.5" y="603.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">transfer.</text><text x="28" y="708.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">These are parallel comparisons. Telnet and TFTP are distinct services; no</text><text x="28" y="740.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">arrows imply a sequence between cards.</text></g></svg>
