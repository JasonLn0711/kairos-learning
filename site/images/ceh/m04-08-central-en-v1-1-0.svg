<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560.32" role="img" aria-labelledby="m0408-central-en-title m0408-central-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0408-central-en-title">Figure 6 | Central company employee directory</title><desc id="m0408-central-en-desc">Lines show shared use of a central directory, rather than a mandatory LDAP path for every sign-in. Systems can query it; sign-in and authorization workflows may also use Kerberos or other protocols.</desc><g transform="scale(0.85)"><rect width="1000" height="659.2" fill="#f7f9fb" /><g font-family="sans-serif" fill="#213547"><text x="28" y="38.0" font-size="26" font-weight="700">Figure 6 | Central company employee directory</text><rect x="300" y="109.19999999999999" width="400" height="176" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="316" y="141.2" font-size="22" font-weight="700">Central employee directory</text><text x="316" y="184.6" font-size="20">Accounts, names,</text><text x="316" y="218.6" font-size="20">departments, groups, and</text><text x="316" y="252.6" font-size="20">related information</text><path d="M500 285.2V310.2M172.5 310.2H827.5" fill="none" stroke="#8b969f" stroke-width="2" /><path d="M172.5 310.2V335.2" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="30.0" y="335.2" width="285" height="142" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="46.0" y="367.2" font-size="22" font-weight="700">Employee computer</text><text x="46.0" y="410.59999999999997" font-size="20">Can query the</text><text x="46.0" y="444.59999999999997" font-size="20">central directory</text><path d="M500.0 310.2V335.2" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="357.5" y="335.2" width="285" height="142" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="373.5" y="367.2" font-size="22" font-weight="700">File system</text><text x="373.5" y="410.59999999999997" font-size="20">Can query the</text><text x="373.5" y="444.59999999999997" font-size="20">central directory</text><path d="M827.5 310.2V335.2" fill="none" stroke="#8b969f" stroke-width="2" /><rect x="685.0" y="335.2" width="285" height="142" rx="12" fill="#ffffff" stroke="#8b969f" stroke-width="2" /><text x="701.0" y="367.2" font-size="22" font-weight="700">Internal website</text><text x="701.0" y="410.59999999999997" font-size="20">Can query the</text><text x="701.0" y="444.59999999999997" font-size="20">central directory</text><text x="28" y="527.2" font-size="20">Lines show shared use of a central directory, rather than a mandatory LDAP</text><text x="28" y="561.2" font-size="20">path for every sign-in. Systems can query it; sign-in and authorization</text><text x="28" y="595.2" font-size="20">workflows may also use Kerberos or other protocols.</text></g></g></svg>