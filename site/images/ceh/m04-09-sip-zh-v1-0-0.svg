<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 433.44000000000005" role="img" aria-labelledby="m0409-sip-zh-title m0409-sip-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-sip-zh-title">SIP 與 RTP：兩條不同的工作線</title><desc id="m0409-sip-zh-desc">每列的 ↔ 表示通話端之間該類資料的雙向交換，不表示 SIP 訊令與 RTP 語音必走相同路徑；兩列彼此平行。</desc><defs><marker id="m0409-sip-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">SIP 與 RTP：兩條不同的工作線</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">SIP：通話控制 ↔</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">訊令：撥號、響鈴、接通、掛斷。TLS 可保護該段 SIP 訊令。</text><rect x="40" y="229.6" width="920" height="108" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="261.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">RTP：傳輸媒體 ↔</text><text x="56" y="297.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">聲音：語音封包持續傳送。媒體須另外確認 SRTP 等保護及金鑰協商。</text><text x="28" y="397.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">每列的 ↔ 表示通話端之間該類資料的雙向交換，不表示 SIP 訊令與 RTP 語音必走相同路徑；兩列彼此</text><text x="28" y="429.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">平行。</text></g></svg>
