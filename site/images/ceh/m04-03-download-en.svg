<svg xmlns="http://www.w3.org/2000/svg" width="720" height="768" viewBox="0 0 720 768" role="img" aria-labelledby="title desc"><title id="title">Download: separate control and data</title><desc id="desc">Editorial correction: the first supplied RETR sketch pointed PDF data right, then its next paragraph corrected it to Server → Client. This figure and its ASCII companion use the corrected direction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#476195"/></marker></defs><rect width="720" height="100%" rx="16" fill="#f7f5ef"/><g font-family="system-ui,sans-serif" fill="#303632"><text x="360" y="40" text-anchor="middle" font-size="23">Download: separate control and data</text><g stroke="#416b82" fill="none" stroke-width="2"><rect x="68" y="86.80000000000001" width="44" height="28" rx="3"/><path d="M62 120.80000000000001h56l-6-6H68z"/><rect x="610" y="83.80000000000001" width="34" height="40" rx="3"/><path d="M610 96.80000000000001h34M610 109.80000000000001h34"/></g><text x="90" y="147.8" text-anchor="middle">Client</text><text x="630" y="147.8" text-anchor="middle">Server</text><rect x="30" y="161.8" width="660" height="108" rx="12" fill="#fff" stroke="#b2c0b7"/><text x="360" y="184.8" text-anchor="middle" font-size="15">Control connection</text><text x="360" y="208.8" text-anchor="middle" font-size="17">RETR manual.pdf</text><path d="M95 242.0H625" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="284.0" width="660" height="108" rx="12" fill="#fff" stroke="#b2c0b7"/><text x="360" y="307.0" text-anchor="middle" font-size="15">Control connection</text><text x="360" y="331.0" text-anchor="middle" font-size="17">150 Starting</text><path d="M625 364.2H95" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="406.2" width="660" height="108" rx="12" fill="#e8eef7" stroke="#b2c0b7"/><text x="360" y="429.2" text-anchor="middle" font-size="15">Separate data connection</text><text x="360" y="453.2" text-anchor="middle" font-size="17">PDF bytes</text><path d="M625 486.4H95" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="528.4" width="660" height="108" rx="12" fill="#fff" stroke="#b2c0b7"/><text x="360" y="551.4" text-anchor="middle" font-size="15">Control connection</text><text x="360" y="575.4" text-anchor="middle" font-size="17">226 Complete</text><path d="M625 608.6H95" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="680.6" text-anchor="middle" font-size="15">Editorial correction: the first supplied RETR sketch pointed PDF data</text><text x="360" y="704.6" text-anchor="middle" font-size="15">right, then its next paragraph corrected it to Server → Client. This</text><text x="360" y="728.6" text-anchor="middle" font-size="15">figure and its ASCII companion use the corrected direction.</text></g></svg>
