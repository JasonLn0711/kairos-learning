<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Two channels are not two independent proofs</title><desc id="desc">One attacker arranges both the text and the call, making them appear to corroborate each other. One attacker: The same source controls both the SMS and the voice contact. SMS: The attacker sends an account-alert text to draw Lin into a fabricated incident. Voice call: The same party claims to be IT support and refers to the earlier text. Lin receives both: Matching claims may share one source; they do not independently verify support.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker></defs>
<rect width="1000" height="760" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="42" y="37" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · FIGURE 2</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">Two channels are not two independent proofs</text>
<text x="42" y="135" font-size="18" font-weight="400" fill="#43576a" text-anchor="start">One attacker arranges both the text and the call, making them appear to corroborate each other.</text>
<rect x="340" y="178" width="320" height="115" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="500" y="218" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="middle">ONE ATTACKER</text>
<text x="500" y="252" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Controls both contacts</text>
<path d="M 410 293 L 410 320 L 260 320 L 260 350" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 590 293 L 590 320 L 740 320 L 740 350" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="42" y="360" width="436" height="150" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="399" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="start">SMS</text>
<text x="66" y="443" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">“Your account has a problem.”</text>
<rect x="522" y="360" width="436" height="150" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="546" y="399" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="start">VOICE CALL</text>
<text x="546" y="443" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">“I am your IT support agent.”</text>
<path d="M 260 510 L 260 540 L 410 540 L 410 570" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 740 510 L 740 540 L 590 540 L 590 570" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="300" y="580" width="400" height="105" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="500" y="620" font-size="23" font-weight="700" fill="#0f766e" text-anchor="middle">LIN: MATCHING CLAIMS</text>
<text x="500" y="654" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">The sources are not independent</text>
<text x="42" y="714" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">Arrows show contact, not independent identity verification.</text>
</g></svg>
