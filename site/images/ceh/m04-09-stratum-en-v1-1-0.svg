<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766.44" role="img" aria-labelledby="m0409-stratum-en-title m0409-stratum-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-stratum-en-title">NTP: where does the time come from?</title><desc id="m0409-stratum-en-desc">Downward arrows show the source of time in this example; Stratum 0 is a reference clock, not an ordinary NTP server.</desc><defs><marker id="m0409-stratum-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">NTP: where does the time come from?</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Stratum 0</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Reference clocks such as atomic clocks or GNSS</text><path d="M500 221.6V251.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-stratum-en-arrow)" /><rect x="40" y="267.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="299.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Stratum 1</text><text x="56" y="335.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">NTP servers directly connected to a reference clock</text><path d="M500 387.6V417.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-stratum-en-arrow)" /><rect x="40" y="433.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="465.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Stratum 2</text><text x="56" y="501.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Synchronizes to a server one level above</text><path d="M500 553.6V583.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-stratum-en-arrow)" /><rect x="40" y="599.6" width="920" height="108" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="631.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Stratum 3, 4…</text><text x="56" y="667.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Continue synchronizing from their respective upstream time sources.</text><text x="28" y="767.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Downward arrows show the source of time in this example; Stratum 0 is a</text><text x="28" y="799.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">reference clock, not an ordinary NTP server.</text></g></svg>
