<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 533.34" role="img" aria-labelledby="m0409-roles-zh-title m0409-roles-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-roles-zh-title">六組大樓角色，七種協定用途</title><desc id="m0409-roles-zh-desc">各組平行比較；Telnet 與 TFTP 是兩種不同服務，卡片之間沒有流程箭頭。</desc><defs><marker id="m0409-roles-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">六組大樓角色，七種協定用途</text><rect x="40.0" y="101.6" width="442.5" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">NTP｜標準時鐘</text><text x="56.0" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">讓全部設備的時間一致</text><rect x="517.5" y="101.6" width="442.5" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="533.5" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IPsec／IKE｜安全通道</text><text x="533.5" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">保護遠端連線與傳輸</text><rect x="40.0" y="234.6" width="442.5" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="266.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">VoIP／SIP｜電話總機</text><text x="56.0" y="302.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">協助撥號、接聽與傳送語音</text><rect x="517.5" y="234.6" width="442.5" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="533.5" y="266.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IPv6｜地址與鄰居</text><text x="533.5" y="302.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">識別設備與發現路由器</text><rect x="40.0" y="367.6" width="442.5" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="399.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">BGP｜跨網路導航</text><text x="56.0" y="435.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">讓不同大型網路交換路線</text><rect x="517.5" y="367.6" width="442.5" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="533.5" y="399.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Telnet／TFTP｜舊式管理室</text><text x="533.5" y="435.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">遠端終端機與簡易檔案傳輸</text><text x="28" y="540.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">各組平行比較；Telnet 與 TFTP 是兩種不同服務，卡片之間沒有流程箭頭。</text></g></svg>
