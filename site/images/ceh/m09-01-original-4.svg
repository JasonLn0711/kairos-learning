<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1540" height="1010" viewBox="0 0 1540 1010" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">縱深防禦：人、流程與系統五個位置</title><desc id="svgdesc">同一個社交工程風險，可以由事前制度、當下驗證、最小權限、異常通報、調查復原等互補控制處理。</desc>
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#2459A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrred" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#B34548" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrteal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#0A8277" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<filter id="sh" x="-10%" y="-15%" width="125%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#132942" flood-opacity="0.08"/></filter>
</defs>
<rect width="1540" height="1010" fill="#F6F8FC"/>
<rect x="62" y="42" width="135" height="44" rx="22.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="129.5" y="71.0" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#0A8277">M01 × M09</text><text x="219" y="84" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="42" font-weight="750" letter-spacing="0" fill="#15283C">縱深防禦：不是多買工具，而是安排互補關卡</text><text x="66" y="140" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="400" letter-spacing="0" fill="#596C7D">每一層即使失效，下一層仍有機會阻擋、發現、降低或修復損害。</text><text x="71" y="199" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="23" font-weight="750" letter-spacing="0" fill="#153E76">階段</text><text x="309" y="199" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="23" font-weight="750" letter-spacing="0" fill="#153E76">對應控制與白話理解</text><text x="1170" y="199" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="23" font-weight="750" letter-spacing="0" fill="#153E76">連回 CEH</text><rect x="60" y="226" width="1420" height="106" rx="16" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1"/><rect x="80" y="254" width="61" height="48" rx="24.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="110.5" y="285.7" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="650" letter-spacing="0" fill="#075C56">01</text><text x="160" y="292" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="27" font-weight="750" letter-spacing="0" fill="#15283C">事前</text><text x="311" y="269" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="700" letter-spacing="0" fill="#15283C">文件傳送必須有核准流程</text><text x="311" y="309" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="450" letter-spacing="0" fill="#596C7D">不依賴員工自行猜測主管意圖</text><rect x="1148" y="254" width="309" height="48" rx="24.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="1302.5" y="285.0" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#075C56">M01-06  預防控制</text><rect x="60" y="348" width="1420" height="106" rx="16" fill="#EAF1FC" stroke="#DCE4ED" stroke-width="1"/><rect x="80" y="376" width="61" height="48" rx="24.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="110.5" y="407.7" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="650" letter-spacing="0" fill="#075C56">02</text><text x="160" y="414" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="27" font-weight="750" letter-spacing="0" fill="#15283C">當下</text><text x="311" y="391" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="700" letter-spacing="0" fill="#15283C">用可信管道核實本次要求</text><text x="311" y="431" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="450" letter-spacing="0" fill="#596C7D">主管照片、聲音不等於身分證據</text><rect x="1148" y="376" width="309" height="48" rx="24.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="1302.5" y="407.0" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#075C56">M09-01  獨立驗證</text><rect x="60" y="470" width="1420" height="106" rx="16" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1"/><rect x="80" y="498" width="61" height="48" rx="24.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="110.5" y="529.7" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="650" letter-spacing="0" fill="#075C56">03</text><text x="160" y="536" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="27" font-weight="750" letter-spacing="0" fill="#15283C">執行</text><text x="311" y="513" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="700" letter-spacing="0" fill="#15283C">最小權限＋核准目的地</text><text x="311" y="553" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="450" letter-spacing="0" fill="#596C7D">就算判斷失誤也盡可能限制影響</text><rect x="1148" y="498" width="309" height="48" rx="24.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="1302.5" y="529.0" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#075C56">M01-06  限制損害</text><rect x="60" y="592" width="1420" height="106" rx="16" fill="#EAF1FC" stroke="#DCE4ED" stroke-width="1"/><rect x="80" y="620" width="61" height="48" rx="24.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="110.5" y="651.7" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="650" letter-spacing="0" fill="#075C56">04</text><text x="160" y="658" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="27" font-weight="750" letter-spacing="0" fill="#15283C">發現異常</text><text x="311" y="635" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="700" letter-spacing="0" fill="#15283C">容易求助的通報管道</text><text x="311" y="675" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="450" letter-spacing="0" fill="#596C7D">通報不責備，能讓問題早點曝光</text><rect x="1148" y="620" width="309" height="48" rx="24.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="1302.5" y="651.0" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#075C56">M01-07  偵測／通報</text><rect x="60" y="714" width="1420" height="106" rx="16" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1"/><rect x="80" y="742" width="61" height="48" rx="24.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="110.5" y="773.7" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="650" letter-spacing="0" fill="#075C56">05</text><text x="160" y="780" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="27" font-weight="750" letter-spacing="0" fill="#15283C">事後</text><text x="311" y="757" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="700" letter-spacing="0" fill="#15283C">保存紀錄、應變、復原</text><text x="311" y="797" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="450" letter-spacing="0" fill="#596C7D">分清楚「點擊」與「真的遭入侵」</text><rect x="1148" y="742" width="309" height="48" rx="24.0" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="1302.5" y="773.0" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#075C56">M01-07  調查／復原</text><rect x="62" y="858" width="1418" height="97" rx="18" fill="#FFF5DF" stroke="none" stroke-width="2"/><text x="89" y="903" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="25" font-weight="750" letter-spacing="0" fill="#9D641C">證據界線</text><text x="237" y="902" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="600" letter-spacing="0" fill="#15283C">收到可疑訊息 ≠ 已遭入侵；點擊連結 ≠ 一定中毒；未上傳 ≠ 全系統安全。</text><text x="1480" y="988" text-anchor="end" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="450" letter-spacing="0" fill="#596C7D">CEH M09-01  •  概念圖 4 / 4</text>
</svg>
