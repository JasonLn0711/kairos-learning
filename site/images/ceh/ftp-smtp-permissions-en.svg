<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="ceh26m04c03-permissions-en-title ceh26m04c03-permissions-en-desc" preserveAspectRatio="xMidYMid meet"><title id="ceh26m04c03-permissions-en-title">Figure 2 | Separate three permissions</title><desc id="ceh26m04c03-permissions-en-desc">These are independent judgments, not an inevitable sequence or mutual guarantees.</desc><rect x="1" y="1" width="898" height="618" rx="16" fill="#f3f7fb" stroke="#b7c9df" /><text x="35" y="44" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#172b49">Figure 2 | Separate three permissions</text><text x="35" y="88" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">These are independent judgments, not an inevitable sequence or mutual</text><text x="35" y="120" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">guarantees.</text><rect x="20" y="148" width="860" height="108" rx="12" fill="#ffffff" stroke="#8ba5bd" /><text x="35" y="172" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b49">Visible name</text><text x="35" y="216" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">A listing reveals a file name and size: evidence of visible metadata.</text><rect x="20" y="280" width="860" height="140" rx="12" fill="#ffffff" stroke="#8ba5bd" /><text x="35" y="304" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b49">Readable contents</text><text x="35" y="348" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Requires evidence that the file content was obtained. A successful listing</text><text x="35" y="380" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">is not a successful download.</text><rect x="20" y="444" width="860" height="108" rx="12" fill="#ffffff" stroke="#8ba5bd" /><text x="35" y="468" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b49">Writable file</text><text x="35" y="512" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Requires an authorized write check. This lesson does not test writing.</text></svg>
