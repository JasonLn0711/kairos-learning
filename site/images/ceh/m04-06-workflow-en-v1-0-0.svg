<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880.0 533.6" role="img" aria-labelledby="m0406-workflow-en-title m0406-workflow-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0406-workflow-en-title">Figure 1 | The lesson’s reasoning chain</title><desc id="m0406-workflow-en-desc">Arrows show the order of investigation, not that an account name automatically determines identity or authorization.</desc><rect width="880.0" height="533.6" fill="#ffffff" /><g transform="scale(0.8)" font-family="sans-serif" fill="#173450"><text x="24" y="40" font-size="22" font-weight="700">Figure 1 | The lesson’s reasoning chain</text><rect x="24" y="88" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="118" font-size="18" font-weight="700">Account name | What is your name?</text><text x="44" y="151" font-size="18" font-weight="400">For example, learner</text><path d="M550 180v22m-8 -8 8 8 8 -8" stroke="#60738d" stroke-width="2" fill="none" /><rect x="24" y="216" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="246" font-size="18" font-weight="700">UID/GID | What are your identifiers?</text><text x="44" y="279" font-size="18" font-weight="400">For example, UID 1001 and GID 3000</text><path d="M550 308v22m-8 -8 8 8 8 -8" stroke="#60738d" stroke-width="2" fill="none" /><rect x="24" y="344" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="374" font-size="18" font-weight="700">NFS | How is the request identified?</text><text x="44" y="407" font-size="18" font-weight="400">For example, sec=sys carries numeric identities</text><path d="M550 436v22m-8 -8 8 8 8 -8" stroke="#60738d" stroke-width="2" fill="none" /><rect x="24" y="472" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="502" font-size="18" font-weight="700">Permissions | What may you do?</text><text x="44" y="535" font-size="18" font-weight="400">Check listing, reading and writing separately</text><text x="24" y="586" font-size="18" font-weight="400">Arrows show the order of investigation, not that an account name automatically determines identity or au</text><text x="24" y="614" font-size="18" font-weight="400">thorization.</text></g></svg>