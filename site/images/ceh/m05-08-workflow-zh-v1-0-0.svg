<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 817.2" role="img" aria-labelledby="m0503-evidence-zh-title m0503-evidence-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-evidence-zh-title">圖 1｜修補執行與證據的四個階段</title><desc id="m0503-evidence-zh-desc">箭頭表示執行與查核順序，不代表每關自動通過；失敗或回復後須重看條件與風險，監控也不因結案而停止。</desc><defs><marker id="m0503-evidence-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 1｜修補執行與證據的四個階段</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">箭頭表示執行與查核順序，不代表每關自動通過；失敗或回復後須重看條件與風險，監控也不因結案而停止</text><text x="28" y="140.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">。</text><rect x="40.0" y="202" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="236.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">準備部署</text><text x="60.0" y="273.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">核對適用修正、可信來源、測試、負責人、維護時段及復原方式。</text><path d="M500 337V365" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-zh-arrow)" /><rect x="40.0" y="381" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="415.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">執行變更</text><text x="60.0" y="452.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">依核准計畫部署，記錄安裝、重啟及例外；執行不等於驗證完成。</text><path d="M500 516V544" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-zh-arrow)" /><rect x="40.0" y="560" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="594.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">驗證實效</text><text x="60.0" y="631.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">取得修正已安裝且生效、必要檢查完成及正常服務運作的證據。</text><path d="M500 695V723" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-zh-arrow)" /><rect x="40.0" y="739" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="773.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">持續監控</text><text x="60.0" y="810.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">追蹤修正是否仍有效、環境是否改變，以及是否需要重新檢視風險。</text></g></svg>
