<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585.6" role="img" aria-labelledby="dns-security-zh-title dns-security-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="dns-security-zh-title">DNS 的三種機制：效能、資料驗證與傳輸隱私</title><desc id="dns-security-zh-desc">三張卡片是平行比較。下方箭頭表示簡化查詢路徑；DoH／DoT 保護特定鏈路，DNSSEC 驗證簽章與信任鏈，並非加密整條解析路徑。</desc><defs><marker id="dns-security-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b7a" /></marker></defs><rect width="1500" height="976" fill="#f5f8fc" /><g transform="scale(0.6)"><text x="32" y="45" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#183b59">DNS 的三種機制：效能、資料驗證與傳輸隱私</text>
<text x="32" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">三張卡片是平行比較。下方箭頭表示簡化查詢路徑；DoH／DoT 保護特定鏈路，DNSSEC 驗證簽章與信任鏈，並非加密整條解析路</text>
<text x="32" y="109" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">徑。</text>
<rect x="20" y="160" width="1460" height="221" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="194" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">各自解決什麼問題？</text>
<rect x="52.0" y="218" width="448.0" height="145" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">快取 Cache</text>
<text x="68.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">加速重複查詢：重複請求不必一直問權</text>
<text x="68.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">威 DNS。不能證明特定使用者曾造訪網</text>
<text x="68.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">站。</text>
<rect x="526.0" y="218" width="448.0" height="145" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="542.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">DNSSEC</text>
<text x="542.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">驗證經簽署資料的來源與完整性。不能</text>
<text x="542.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">保證查詢內容保密或網站正常。</text>
<rect x="1000.0" y="218" width="448.0" height="145" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="1016.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">加密 DNS：DoH / DoT</text>
<text x="1016.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">保護用戶端到解析服務的特定傳輸鏈路</text>
<text x="1016.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">。解析服務仍可得知並處理查詢內容。</text>
<rect x="20" y="405" width="1460" height="163" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="439" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">用查詢路徑理解保護邊界</text>
<rect x="52.0" y="463" width="448.0" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="491" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">你的電腦｜Stub Resolver</text>
<text x="68.0" y="530" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">發起 DNS 查詢</text>
<path d="M503.0 506.5h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-security-zh-arrow)" />
<rect x="526.0" y="463" width="448.0" height="87" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="542.0" y="491" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">遞迴解析器</text>
<text x="542.0" y="530" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">可進行 DNSSEC 驗證；也可能使用快取</text>
<path d="M977.0 506.5h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-security-zh-arrow)" />
<rect x="1000.0" y="463" width="448.0" height="87" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="1016.0" y="491" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">權威 DNS 資料</text>
<text x="1016.0" y="530" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">依區域設定提供紀錄</text>
<rect x="20" y="592" width="1460" height="163" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="626" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">兩種保護的範圍</text>
<rect x="52.0" y="650" width="685.0" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="678" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">用戶端 ↔ 解析服務：DoH / DoT</text>
<text x="68.0" y="717" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">加密這段傳輸鏈路；不保證後續鏈路同樣加密。</text>
<rect x="763.0" y="650" width="685.0" height="87" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="779.0" y="678" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">DNSSEC：簽章與信任鏈</text>
<text x="779.0" y="717" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">驗證經簽署的 DNS 資料，不驗證網站功能。</text>
<rect x="20" y="779" width="1460" height="163" rx="20" fill="#183b59" stroke="#8098ae" />
<text x="42" y="813" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#ffffff">AXFR 的授權與完整性</text>
<rect x="52.0" y="837" width="1396.0" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="865" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">區域傳送</text>
<text x="68.0" y="904" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">使用存取控制與 TSIG 保護授權／完整性；TSIG 不會加密區域內容。</text></g></svg>
