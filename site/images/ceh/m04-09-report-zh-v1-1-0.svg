<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 519.84" role="img" aria-labelledby="m0409-report-zh-title m0409-report-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-report-zh-title">VPN 查核紀錄：從實際觀察到下一步驗證</title><desc id="m0409-report-zh-desc">三列是同一份合成報告的欄位；沒有真實 VPN 測試，也沒有已找到漏洞的結論。</desc><defs><marker id="m0409-report-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">VPN 查核紀錄：從實際觀察到下一步驗證</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">實際觀察</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">測試端點對 IKEv2 初始協商提供有效回應。</text><rect x="40" y="229.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="261.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">證據界線</text><text x="56" y="297.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">可證明服務回應，但尚無身分驗證成功或內網資源存取的證據。</text><rect x="40" y="357.6" width="920" height="108" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="389.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">下一步驗證</text><text x="56" y="425.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">在授權範圍內，使用核准的測試帳號確認 VPN 驗證、通道建立及存取控制是否符合政策。</text><text x="28" y="525.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">三列是同一份合成報告的欄位；沒有真實 VPN 測試，也沒有已找到漏洞的結論。</text></g></svg>
