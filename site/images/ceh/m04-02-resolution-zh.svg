<svg xmlns="http://www.w3.org/2000/svg" width="720" height="732" viewBox="0 0 720 732" role="img" aria-labelledby="title desc"><title id="title">簡化的 DNS 解析流程</title><desc id="desc">簡化的 DNS 解析流程。實際運作會受到快取、轉送設定與其他機制影響，不一定每次都經過所有伺服器。</desc><rect width="720" height="732" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="38" y="38" font-size="18" font-weight="650">簡化的 DNS 解析流程</text><text x="38" y="66" font-size="16" font-weight="400">簡化的 DNS 解析流程。實際運作會受到快取、轉送設定與其他機制影</text><text x="38" y="94" font-size="16" font-weight="400">響，不一定每次都經過所有伺服器。</text><rect x="22" y="116" width="676" height="50" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="138" font-size="18" font-weight="650">你的電腦想查 www.example.com</text><text x="38" y="194" font-size="16" font-weight="400">↓ 查詢</text><rect x="22" y="200" width="676" height="78" rx="12" fill="#e8f0f5" stroke="#778d80"/><text x="38" y="222" font-size="18" font-weight="650">遞迴解析器</text><text x="38" y="250" font-size="16" font-weight="400">Recursive Resolver</text><text x="38" y="306" font-size="16" font-weight="400">✓ 有適用快取：直接回覆 → 取得 DNS 查詢結果</text><text x="38" y="334" font-size="16" font-weight="400">沒有適用快取 ↓</text><rect x="22" y="354" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="376" font-size="18" font-weight="650">1. 遞迴解析器 → 根名稱伺服器 · Root</text><text x="38" y="404" font-size="16" font-weight="400">← 告知 .com 由誰管理</text><rect x="22" y="438" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="460" font-size="18" font-weight="650">2. 遞迴解析器 → .com 名稱伺服器 · TLD</text><text x="38" y="488" font-size="16" font-weight="400">← 告知 example.com 由誰管理</text><rect x="22" y="522" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="544" font-size="18" font-weight="650">3. 遞迴解析器 → example.com 權威伺服器 · Authoritative</text><text x="38" y="572" font-size="16" font-weight="400">← 回覆記錄</text><text x="38" y="628" font-size="16" font-weight="400">遞迴解析器 → 你的電腦：取得 DNS 查詢結果</text><text x="38" y="656" font-size="16" font-weight="400">每一列都是解析器發出查詢、該伺服器回覆解析器；Root 不會替解析</text><text x="38" y="684" font-size="16" font-weight="400">器一路轉送查詢。</text></g></svg>
