<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1067.2" role="img" aria-labelledby="m0505-workflow-en-title m0505-workflow-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0505-workflow-en-title">Figure 4 | Answer four questions in sequence</title><desc id="m0505-workflow-en-desc">Arrows show a qualitative decision sequence, not an official scoring formula. CVSS supplies severity; KEV and EPSS supply different threat signals.</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">Figure 4 | Answer four questions in sequence</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">Arrows show a qualitative decision sequence, not an official</text><text x="28" y="132.8" font-size="20" fill="#18252c">scoring formula. CVSS supplies severity; KEV and EPSS supply</text><text x="28" y="168.8" font-size="20" fill="#18252c">different threat signals.</text><rect x="28" y="224.8" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="258.8" font-size="23" fill="#18252c" font-weight="700">Gate 1: Does it actually affect my asset?</text><text x="48" y="300.2" font-size="20" fill="#18252c">Confirm product, version, configuration and affected feature.</text><path d="M450 360.20000000000005v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="402.20000000000005" width="844" height="170.8" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="436.20000000000005" font-size="23" fill="#18252c" font-weight="700">Gate 2: What do vulnerability and external threat</text><text x="48" y="477.6" font-size="23" fill="#18252c" font-weight="700">signals tell us?</text><text x="48" y="519.0" font-size="20" fill="#18252c">CVSS, KEV, EPSS and other threat intelligence.</text><path d="M450 579.0v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="621.0" width="844" height="206.8" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="655.0" font-size="23" fill="#18252c" font-weight="700">Gate 3: Can an attacker reach it, and what would the</text><text x="48" y="696.4" font-size="23" fill="#18252c" font-weight="700">impact be?</text><text x="48" y="737.8" font-size="20" fill="#18252c">Network exposure, privileges, defenses, data and business</text><text x="48" y="773.8" font-size="20" fill="#18252c">importance.</text><path d="M450 833.8v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="875.8" width="844" height="165.4" rx="14" fill="#edf4fc" stroke="#94a3b8" /><text x="48" y="909.8" font-size="23" fill="#18252c" font-weight="700">Gate 4: Decide remediation priority and measures.</text><text x="48" y="951.1999999999999" font-size="20" fill="#18252c">Immediate mitigation, scheduled patching, verification and</text><text x="48" y="987.1999999999999" font-size="20" fill="#18252c">continued tracking.</text></g></svg>
