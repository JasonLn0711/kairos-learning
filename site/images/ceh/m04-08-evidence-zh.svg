<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" role="img" aria-labelledby="title desc">
<title id="title">網頁補充：同一共享，分開記錄結果</title><desc id="desc">合成案例；以下是獨立觀察，不是自動授權流程。</desc>
<rect width="760" height="570" rx="20" fill="#f7f8f5"/>
<text x="30" y="44" font-family="sans-serif" font-size="24" fill="#173d35">網頁補充：同一共享，分開記錄結果</text>
<rect x="30" y="75" width="700" height="120" rx="14" fill="#e9f0ed" stroke="#677c73"/>
<text x="52" y="115" font-family="sans-serif" font-size="23" fill="#173d35">掛載可用</text>
<text x="52" y="157" font-family="monospace" font-size="19" fill="#253b33">/srv/course → /mnt/course</text>
<rect x="30" y="215" width="700" height="120" rx="14" fill="#edf4ed" stroke="#677c73"/>
<text x="52" y="255" font-family="sans-serif" font-size="23" fill="#173d35">本次讀取成功</text>
<text x="52" y="297" font-family="monospace" font-size="19" fill="#253b33">/mnt/course/readme.txt</text>
<rect x="30" y="355" width="700" height="120" rx="14" fill="#f4efe7" stroke="#677c73"/>
<text x="52" y="395" font-family="sans-serif" font-size="23" fill="#173d35">本次讀取遭拒</text>
<text x="52" y="437" font-family="monospace" font-size="19" fill="#253b33">/mnt/course/staff.txt — Permission denied</text>
<text x="30" y="540" font-family="sans-serif" font-size="17" fill="#253b33">合成案例；以下是獨立觀察，不是自動授權流程。</text>
</svg>
