<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706.14" role="img" aria-labelledby="m0504-evidence-en-title m0504-evidence-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0504-evidence-en-title">Figure 5 | Four evidence levels</title><desc id="m0504-evidence-en-desc">These teaching levels do not require exploitation for every finding, nor establish prior compromise from a successful test.</desc><g transform="scale(.9)" font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c">Figure 5 | Four evidence levels</text><text x="28" y="96.19999999999999" font-size="20" fill="#18252c">These teaching levels do not require exploitation for every finding, nor</text><text x="28" y="130.2" font-size="20" fill="#18252c">establish prior compromise from a successful test.</text><path d="M50.0 246.2v37.099999999999994" stroke="#cbd5e1" stroke-width="3" /><text x="46.0" y="214.2" font-size="23" fill="#18252c">1  Potential Finding</text><text x="68.0" y="253.29999999999998" font-size="20" fill="#18252c">A scanner match merits investigation; applicability remains</text><text x="68.0" y="287.29999999999995" font-size="20" fill="#18252c">unconfirmed.</text><path d="M50.0 379.29999999999995v71.1" stroke="#cbd5e1" stroke-width="3" /><text x="46.0" y="347.29999999999995" font-size="23" fill="#18252c">2  Confirmed Vulnerability</text><text x="68.0" y="386.4" font-size="20" fill="#18252c">Sufficient product, version, configuration and patch evidence</text><text x="68.0" y="420.4" font-size="20" fill="#18252c">establishes applicability.</text><path d="M50.0 546.4v37.099999999999994" stroke="#cbd5e1" stroke-width="3" /><text x="46.0" y="514.4" font-size="23" fill="#18252c">3  Validated Exploitability</text><text x="68.0" y="553.5" font-size="20" fill="#18252c">An authorized, controlled test demonstrates a specific security impact.</text><path d="M50.0 679.5v71.1" stroke="#cbd5e1" stroke-width="3" /><text x="46.0" y="647.5" font-size="23" fill="#18252c">4  Evidence of Compromise</text><text x="68.0" y="686.6" font-size="20" fill="#18252c">Logs or forensic evidence establish unauthorized exploitation or</text><text x="68.0" y="720.6" font-size="20" fill="#18252c">intrusion.</text></g></svg>
