<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 637.5" role="img" aria-labelledby="ftpsmtp-evidence-en-title ftpsmtp-evidence-en-desc" preserveAspectRatio="xMidYMid meet"><title id="ftpsmtp-evidence-en-title">Figure 2｜Three layers of evidence for enumeration</title><desc id="ftpsmtp-evidence-en-desc">Each reply supports only its corresponding operation. Conclusion = actual reply + corresponding command + test identity + policy scope + retrievable evidence. The cards are parallel judgment categories, not communication steps.</desc><g transform="scale(0.75)"><rect width="1200" height="850" fill="#f5f8fc" /><text x="45" y="55.0" font-family="Noto Sans CJK TC,sans-serif" font-size="30" fill="#173450">Figure 2｜Three layers of evidence for enumeration</text><rect x="40" y="165" width="350" height="455" rx="16" fill="#ffffff" stroke="#b7c9df" /><rect x="55" y="185" width="320" height="110" rx="16" fill="#e7f0ff" stroke="#b7c9df" /><text x="70" y="225.0" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#205e96">1. What was</text><text x="70" y="262.5" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#205e96">observed?</text><text x="65" y="345.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#205e96">FTP: MLSD displays</text><text x="65" y="379.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#205e96">filenames</text><text x="65" y="445.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#205e96">SMTP: EHLO advertises</text><text x="65" y="479.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#205e96">STARTTLS</text><text x="65" y="545.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#205e96">→ Observable clues</text><rect x="430" y="165" width="350" height="455" rx="16" fill="#ffffff" stroke="#b7c9df" /><rect x="445" y="185" width="320" height="110" rx="16" fill="#e1f5ef" stroke="#b7c9df" /><text x="460" y="225.0" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#11635d">2. What actually</text><text x="460" y="262.5" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#11635d">completed?</text><text x="455" y="345.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#11635d">FTP: 226 corresponds</text><text x="455" y="379.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#11635d">to a completed listing</text><text x="455" y="445.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#11635d">SMTP: 250 corresponds</text><text x="455" y="479.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#11635d">to a specific request</text><text x="455" y="545.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#11635d">→ Establishes that</text><text x="455" y="579.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#11635d">step was handled</text><rect x="820" y="165" width="350" height="455" rx="16" fill="#ffffff" stroke="#b7c9df" /><rect x="835" y="185" width="320" height="110" rx="16" fill="#fff2e1" stroke="#b7c9df" /><text x="850" y="225.0" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#885217">3. What remains</text><text x="850" y="262.5" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#885217">unproven?</text><text x="845" y="345.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">FTP: download/write</text><text x="845" y="379.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">permissions</text><text x="845" y="445.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">SMTP: authenticated</text><text x="845" y="479.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">login or delivery</text><text x="845" y="545.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">→ Other evidence is</text><text x="845" y="579.5" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#885217">still needed</text><text x="45" y="685.0" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#173450">Each reply supports only its corresponding operation. Conclusion = actual reply +</text><text x="45" y="718.0" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#173450">corresponding command + test identity + policy scope + retrievable evidence. The</text><text x="45" y="751.0" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#173450">cards are parallel judgment categories, not communication steps.</text></g></svg>
