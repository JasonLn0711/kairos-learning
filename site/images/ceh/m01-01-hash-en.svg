<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-labelledby="t d"><title id="t">Hash comparison: establish a trusted baseline</title><desc id="d">Use the same algorithm and byte scope. A difference does not prove intrusion.</desc>
<rect width="760" height="700" rx="18" fill="#f7f8f5"/>
<text x="25" y="35" font-family="sans-serif" font-size="24" fill="#173d35"><tspan x="25" dy="0">Hash comparison: establish a trusted baseline</tspan></text>
<text x="25" y="75" font-family="sans-serif" font-size="18" fill="#173d35"><tspan x="25" dy="0">Use the same algorithm and byte scope. A difference does not prove</tspan><tspan x="25" dy="27">intrusion.</tspan></text>
<rect x="25" y="135" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="170" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">Original hash</tspan></text>
<text x="45" y="215" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">A reliably stored comparison baseline.</tspan></text>
<path d="M380 283v25m-7-7 7 7 7-7" fill="none" stroke="#355e50" stroke-width="2"/>
<rect x="25" y="315" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="350" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">Current file hash</tspan></text>
<text x="45" y="395" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">Recalculate the file being checked.</tspan></text>
<path d="M380 463v25m-7-7 7 7 7-7" fill="none" stroke="#355e50" stroke-width="2"/>
<rect x="25" y="495" width="710" height="145" rx="12" fill="#eaf2ef" stroke="#62796f"/>
<text x="45" y="530" font-family="sans-serif" font-size="22" fill="#173d35"><tspan x="45" dy="0">Are they equal?</tspan></text>
<text x="45" y="575" font-family="sans-serif" font-size="19" fill="#173d35"><tspan x="45" dy="0">Different means changed; matching does not establish factual</tspan><tspan x="45" dy="27">correctness.</tspan></text>
</svg>
