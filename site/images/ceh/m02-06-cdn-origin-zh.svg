<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 781" role="img" aria-labelledby="m0206-f9-zh-title m0206-f9-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0206-f9-zh-title">圖 5｜DNS、CDN 與 Origin 的分工</title><desc id="m0206-f9-zh-desc">DNS 查詢與 HTTPS 傳輸是不同通訊過程；回源只在需要時發生。</desc><rect width="800" height="781" fill="#fcfcfd" /><g fill="#162a3a" font-family="system-ui, sans-serif"><text x="400" y="42" font-size="24" text-anchor="middle" font-weight="700">圖 5｜DNS、CDN 與 Origin 的分工</text><text x="400" y="83.6" font-size="18" text-anchor="middle">DNS 查詢與 HTTPS 傳輸是不同通訊過程；回源只在需要時發生。</text><rect x="25" y="117.3" width="320" height="99.3" rx="18" fill="#e5effc" stroke="#689ee9" stroke-width="2" /><text x="185.0" y="151.3" font-size="22" text-anchor="middle" font-weight="700">使用者瀏覽器</text><text x="185.0" y="189.60000000000002" font-size="20" text-anchor="middle">shop.coffee.example</text><rect x="455" y="117.3" width="320" height="99.3" rx="18" fill="#eef0f3" stroke="#a1aebb" stroke-width="2" /><text x="615.0" y="151.3" font-size="22" text-anchor="middle" font-weight="700">DNS</text><text x="615.0" y="189.60000000000002" font-size="20" text-anchor="middle">回覆 CDN 的 IP</text><path d="M350 147.3H450L438 139.3M450 147.3L438 155.3M450 182.3H350L362 174.3M350 182.3L362 190.3" fill="none" stroke="#52677f" stroke-width="3" stroke-dasharray="6 4" /><text x="400" y="248.6" font-size="20" text-anchor="middle">DNS 查詢／回覆</text><path d="M185 269.6V324.6M177 314.6L185 324.6L193 314.6" fill="none" stroke="#075bc5" stroke-width="3" /><text x="480" y="295.6" font-size="20" text-anchor="middle">HTTPS 請求：瀏覽器 → CDN</text><rect x="45" y="338.6" width="710" height="132.3" rx="18" fill="#e3f2f0" stroke="#59b6b1" stroke-width="2" /><text x="400.0" y="372.6" font-size="22" text-anchor="middle" font-weight="700">CDN Edge / Reverse Proxy</text><text x="400.0" y="410.90000000000003" font-size="20" text-anchor="middle">192.0.2.25（對外服務 IP）</text><text x="400.0" y="443.90000000000003" font-size="20" text-anchor="middle">快取命中可直接回覆使用者</text><path d="M400 473.90000000000003V545.9000000000001M392 535.9000000000001L400 545.9000000000001L408 535.9000000000001" fill="none" stroke="#a74705" stroke-width="3" /><text x="400" y="572.9000000000001" font-size="20" text-anchor="middle">需要後端資料時：CDN → Origin</text><rect x="80" y="601.9000000000001" width="640" height="99.3" rx="18" fill="#f0eafa" stroke="#ac85ed" stroke-width="2" /><text x="400.0" y="635.9000000000001" font-size="22" text-anchor="middle" font-weight="700">Origin Server｜原始伺服器</text><text x="400.0" y="674.2" font-size="20" text-anchor="middle">可能位於企業內網或雲端</text><text x="400" y="749.2" font-size="18" text-anchor="middle">圖示省略中間網路；DNS 回覆的入口位址不能直接證明 Origin 的位置。</text></g></svg>