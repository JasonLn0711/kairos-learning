<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788.4" role="img" aria-labelledby="m0503-evidence-zh-title m0503-evidence-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-evidence-zh-title">圖 5｜逐步累積弱點證據</title><desc id="m0503-evidence-zh-desc">箭頭表示工作順序；受控驗證須必要且在授權範圍內。</desc><defs><marker id="m0503-evidence-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 5｜逐步累積弱點證據</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">箭頭表示工作順序；受控驗證須必要且在授權範圍內。</text><rect x="40.0" y="170" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">發現線索</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">工具回報套件可能有漏洞</text><path d="M500 305V333" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-zh-arrow)" /><rect x="40.0" y="349" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="383.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">核對成立條件</text><text x="60.0" y="420.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">確認版本、設定、影響條件及政策</text><path d="M500 484V512" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-zh-arrow)" /><rect x="40.0" y="528" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="562.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">授權範圍內驗證</text><text x="60.0" y="599.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">必要時進行受控測試並記錄結果</text><path d="M500 663V691" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-zh-arrow)" /><rect x="40.0" y="707" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="741.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">評估影響、修正與複驗</text><text x="60.0" y="778.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">確認缺陷是否修正，正常功能是否保留</text></g></svg>
