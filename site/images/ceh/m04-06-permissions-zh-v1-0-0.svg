<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880.0 476.0" role="img" aria-labelledby="m0406-permissions-zh-title m0406-permissions-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0406-permissions-zh-title">圖 4｜互動練習：切換檔案權限</title><desc id="m0406-permissions-zh-desc">只展示基本權限位元，依序為 Owner／Group／Others；SVG 與對照清單保留全部四種對照，不隨選擇改寫下載。600 為無 JavaScript 的預設。</desc><rect width="880.0" height="476.0" fill="#ffffff" /><g transform="scale(0.8)" font-family="sans-serif" fill="#173450"><text x="24" y="40" font-size="22" font-weight="700">圖 4｜互動練習：切換檔案權限</text><rect x="24" y="88" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="118" font-size="18" font-weight="700">600｜僅擁有者讀寫</text><text x="44" y="151" font-size="18" font-weight="400">rw- | --- | ---</text><rect x="24" y="192" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="222" font-size="18" font-weight="700">640｜群組也能讀</text><text x="44" y="255" font-size="18" font-weight="400">rw- | r-- | ---</text><rect x="24" y="296" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="326" font-size="18" font-weight="700">644｜其他人也能讀</text><text x="44" y="359" font-size="18" font-weight="400">rw- | r-- | r--</text><rect x="24" y="400" width="1052" height="86" rx="12" fill="#eef4fa" stroke="#8b9cb1" /><text x="44" y="430" font-size="18" font-weight="700">777｜所有人都有全部基本權限</text><text x="44" y="463" font-size="18" font-weight="400">rwx | rwx | rwx</text><text x="24" y="514" font-size="18" font-weight="400">只展示基本權限位元，依序為 Owner／Group／Others；SVG 與對照清單保留全部四種對照，不隨選擇改寫下載。600 </text><text x="24" y="542" font-size="18" font-weight="400">為無 JavaScript 的預設。</text></g></svg>