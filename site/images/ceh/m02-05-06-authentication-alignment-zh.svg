<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-labelledby="m0205-f6-zh-title m0205-f6-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0205-f6-zh-title">圖 6｜從網域對齊讀懂 DMARC</title>
<desc id="m0205-f6-zh-desc">收件者看到的 From 網域 / From: notice@coffee.example / 對齊比較的基準：coffee.example；SPF：pass；對齊：未符合 / MAIL FROM 網域：mailer.example / 寄送來源通過該網域 SPF 檢查；DKIM：pass；對齊：符合 / d=coffee.example；s=selector1 / 簽署網域與 From 網域相同；DMARC：pass / SPF 通過且對齊，或 DKIM 通過且對齊 / 本例由 DKIM 這條路徑符合條件</desc>
<rect x="1" y="1" width="598" height="748" rx="20" fill="#f8fafc" stroke="#b7c7d5" />
<text x="300" y="37" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">圖 6｜從網域對齊讀懂 DMARC</text>
<rect x="26" y="64" width="548" height="112" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="300" y="93" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">收件者看到的 From 網域</text>
<text x="300" y="120" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">From: notice@coffee.example</text>
<text x="300" y="147" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">對齊比較的基準：coffee.example</text>
<rect x="26" y="192" width="548" height="112" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="300" y="221" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">SPF：pass；對齊：未符合</text>
<text x="300" y="248" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">MAIL FROM 網域：mailer.example</text>
<text x="300" y="275" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">寄送來源通過該網域 SPF 檢查</text>
<rect x="26" y="320" width="548" height="112" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="300" y="349" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">DKIM：pass；對齊：符合</text>
<text x="300" y="376" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">d=coffee.example；s=selector1</text>
<text x="300" y="403" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">簽署網域與 From 網域相同</text>
<rect x="26" y="448" width="548" height="112" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="300" y="477" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">DMARC：pass</text>
<text x="300" y="504" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">SPF 通過且對齊，或 DKIM 通過且對齊</text>
<text x="300" y="531" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">本例由 DKIM 這條路徑符合條件</text>
<text x="300" y="610" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">DKIM 公鑰查詢名稱：</text>
<text x="300" y="637" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">selector1._domainkey.coffee.example</text>
<text x="300" y="664" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">d 指定簽署網域，s 指定該網域內的選擇器</text>
</svg>