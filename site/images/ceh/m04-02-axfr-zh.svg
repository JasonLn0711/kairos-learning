<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc"><title id="title">一筆查詢與整區傳送</title><desc id="desc">AXFR 是正常的區域同步功能；測試整區傳送需要另外確認授權。</desc><rect width="720" height="450" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="38" y="38" font-size="18" font-weight="650">一筆查詢與整區傳送</text><text x="38" y="66" font-size="16" font-weight="400">AXFR 是正常的區域同步功能；測試整區傳送需要另外確認授權。</text><rect x="22" y="88" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="110" font-size="18" font-weight="650">一般 DNS 查詢</text><text x="38" y="138" font-size="16" font-weight="400">詢問特定名稱與記錄類型</text><text x="38" y="194" font-size="16" font-weight="400">像是問：</text><text x="38" y="222" font-size="16" font-weight="400">「這個人的電話是多少？」</text><rect x="22" y="248" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="270" font-size="18" font-weight="650">AXFR 區域傳送</text><text x="38" y="298" font-size="16" font-weight="400">要求傳送整個 DNS 區域內容</text><text x="38" y="354" font-size="16" font-weight="400">像是要求：</text><text x="38" y="382" font-size="16" font-weight="400">「請把這份通訊錄全部提供給我。」</text></g></svg>
