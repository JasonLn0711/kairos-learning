<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 406" role="img" aria-labelledby="title desc"><title id="title">SMB、Samba、NAS：三種角色</title><desc id="desc">協定、軟體與設備分開理解；NAS 可透過 SMB 提供共用。</desc><rect x="1" y="1" width="678" height="404" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">SMB、Samba、NAS：三種角色</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">SMB：規則</text><text x="40" y="120" font-size="17">網路檔案共用協定</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">Samba：軟體</text><text x="40" y="215" font-size="17">實作 SMB 服務與用戶端功能</text><rect x="24" y="256" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">NAS：設備</text><text x="40" y="310" font-size="17">提供網路儲存，通常支援 SMB 等協定</text><text x="24" y="371" font-size="17">協定、軟體與設備分開理解；NAS 可透過 SMB 提供共用。</text></g></svg>
