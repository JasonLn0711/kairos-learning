<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">SMB、Samba、NAS：三種角色</title><desc id="desc">協定、軟體與設備分開理解；NAS 可透過 SMB 提供共用。</desc><rect width="720" height="350" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">SMB、Samba、NAS：三種角色</text><text x="30" y="69" font-size="16" font-weight="400">協定、軟體與設備分開理解；NAS 可透過 SMB 提供共用。</text><rect x="30" y="115" width="660" height="80" rx="12" fill="#e8f0ef" stroke="#778d80"/><text x="46" y="142" font-size="16" font-weight="650">SMB：規則</text><text x="46" y="168" font-size="16" font-weight="400">網路檔案共用協定</text><text x="40" y="225" font-size="16" font-weight="400">↑ SMB · 實作</text><text x="380" y="225" font-size="16" font-weight="400">↑ SMB · 可支援</text><rect x="30" y="245" width="320" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="272" font-size="16" font-weight="650">Samba：軟體</text><text x="46" y="298" font-size="16" font-weight="400">實作 SMB 服務與用戶端功能</text><rect x="370" y="245" width="320" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="386" y="272" font-size="16" font-weight="650">NAS：設備</text><text x="386" y="298" font-size="16" font-weight="400">提供網路儲存，通常支援 SMB 等協定</text></g></svg>
