<svg xmlns="http://www.w3.org/2000/svg" width="720" height="358" viewBox="0 0 720 358" role="img" aria-labelledby="title desc"><title id="title">同一次讀檔，一起核對兩層權限</title><desc id="desc">適用經 SMB 存取 Windows NTFS 檔案；拒絕原因仍需完整回應與對應證據。</desc><rect width="720" height="358" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">同一次讀檔，一起核對兩層權限</text><text x="30" y="69" font-size="16" font-weight="400">適用經 SMB 存取 Windows NTFS 檔案；拒絕原因仍需完整回應與對應證據。</text><rect x="30" y="115" width="320" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="142" font-size="16" font-weight="650">Share Permissions</text><text x="46" y="168" font-size="16" font-weight="400">網路共用入口允許的操作。</text><rect x="370" y="115" width="320" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="386" y="142" font-size="16" font-weight="650">NTFS Permissions</text><text x="386" y="168" font-size="16" font-weight="400">指定資料夾與檔案允許的操作。</text><text x="42" y="215" font-size="16" font-weight="400">↓ 兩層共同影響本次結果</text><rect x="30" y="253" width="660" height="80" rx="12" fill="#e8f0ef" stroke="#778d80"/><text x="46" y="280" font-size="16" font-weight="650">本次結果</text><text x="46" y="306" font-size="16" font-weight="400">兩層都會影響；單次拒絕只描述此次操作。</text></g></svg>
