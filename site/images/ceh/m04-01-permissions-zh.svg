<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 431" role="img" aria-labelledby="title desc"><title id="title">同一次讀檔，一起核對兩層權限</title><desc id="desc">適用經 SMB 存取 Windows NTFS 檔案；拒絕原因仍需完整回應與對應證據。</desc><rect x="1" y="1" width="678" height="429" rx="18" fill="#f7f5ef" stroke="#778d80"/><g fill="#303632" font-family="sans-serif"><text x="24" y="36" font-size="23" font-weight="bold">同一次讀檔，一起核對兩層權限</text><rect x="24" y="66" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="94" font-size="19" font-weight="bold">Share Permissions</text><text x="40" y="120" font-size="17">網路共用入口允許的操作。</text><rect x="24" y="161" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="189" font-size="19" font-weight="bold">NTFS Permissions</text><text x="40" y="215" font-size="17">指定資料夾與檔案允許的操作。</text><rect x="24" y="256" width="632" height="81" rx="10" fill="#fffef9" stroke="#778d80"/><text x="40" y="284" font-size="19" font-weight="bold">本次結果</text><text x="40" y="310" font-size="17">兩層都會影響；單次拒絕只描述此次操作。</text><text x="24" y="371" font-size="17">適用經 SMB 存取 Windows NTFS</text><text x="24" y="396" font-size="17">檔案；拒絕原因仍需完整回應與對應證據。</text></g></svg>
