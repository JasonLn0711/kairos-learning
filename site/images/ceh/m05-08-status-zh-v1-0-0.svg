<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 573.3000000000001" role="img" aria-labelledby="m0503-status-zh-title m0503-status-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-status-zh-title">圖 2｜同一筆發現，分開記錄三項狀態</title><desc id="m0503-status-zh-desc">這是小檢核的合成狀態，不是三個已通過的步驟；入口限制、更新回報與驗證證據不能互相替代。</desc><defs><marker id="m0503-status-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 2｜同一筆發現，分開記錄三項狀態</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">這是小檢核的合成狀態，不是三個已通過的步驟；入口限制、更新回報與驗證證據不能互相替代。</text><rect x="40.0" y="170" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">入口限制｜已完成</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">保留限制範圍與有效性證據；不推論套件已修正。</text><rect x="40.0" y="319" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="353.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">更新安裝｜回報成功</text><text x="60.0" y="390.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">保存變更回報，仍需確認適用版本已安裝且於執行中生效。</text><rect x="40.0" y="468" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="502.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">必要檢查｜未完成</text><text x="60.0" y="539.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">登入失敗留下證據缺口；補查成功紀錄與正常服務結果前，不寫驗證通過。</text></g></svg>
