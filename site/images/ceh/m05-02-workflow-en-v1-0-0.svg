<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 969.3000000000001" role="img" aria-labelledby="m0502-workflow-en-title m0502-workflow-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0502-workflow-en-title">Figure 3 | Five-step security engineering workflow</title><desc id="m0502-workflow-en-desc">Arrows show work order: establish assets and authority, assess within scope and ROE, then report evidence and limitations.</desc><defs><marker id="m0502-workflow-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 3 | Five-step security engineering workflow</text><rect x="40.0" y="108" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="142.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Inventory assets</text><text x="60.0" y="179.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Identify existing systems, data and accounts.</text><path d="M500 245V272" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-workflow-en-arrow)" /><rect x="40.0" y="287" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="321.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Confirm ownership</text><text x="60.0" y="358.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Establish managers and authorization authority.</text><path d="M500 424V451" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-workflow-en-arrow)" /><rect x="40.0" y="466" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="500.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Define scope and ROE</text><text x="60.0" y="537.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Agree on what and how to test, and when to stop.</text><path d="M500 603V630" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-workflow-en-arrow)" /><rect x="40.0" y="645" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="679.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Perform specified assessment</text><text x="60.0" y="716.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Examine only authorized scope and preserve evidence.</text><path d="M500 782V809" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0502-workflow-en-arrow)" /><rect x="40.0" y="824" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="858.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Write the report</text><text x="60.0" y="895.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Explain findings, untested items and conclusion limits.</text><text x="28" y="985.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Arrows show work order: establish assets and authority, assess within scope</text><text x="28" y="1017.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">and ROE, then report evidence and limitations.</text></g></svg>
