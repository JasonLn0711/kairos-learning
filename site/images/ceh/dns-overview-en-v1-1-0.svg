<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690.0" role="img" aria-labelledby="dns-overview-en-title dns-overview-en-desc" preserveAspectRatio="xMidYMid meet"><title id="dns-overview-en-title">DNS enumeration: from names to verifiable evidence</title><desc id="dns-overview-en-desc">Arrows show lookup roles or evidence-reading order, not guaranteed authoritative contact or permission. Confirm authorization before every stage.</desc><defs><marker id="dns-overview-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b7a" /></marker></defs><rect width="1500" height="1150" fill="#f5f8fc" /><g transform="scale(0.6)"><text x="32" y="45" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#183b59">DNS enumeration: from names to verifiable evidence</text>
<text x="32" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Arrows show lookup roles or evidence-reading order, not guaranteed authoritative contact or permission. Confirm</text>
<text x="32" y="109" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">authorization before every stage.</text>
<rect x="20" y="160" width="1460" height="221" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="194" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">1. Which roles handle the query?</text>
<rect x="52.0" y="218" width="448.0" height="145" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Your computer | Stub Resolver</text>
<text x="68.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Ask: what are the A records of</text>
<text x="68.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">www.example.test?</text>
<path d="M503.0 290.5h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-overview-en-arrow)" />
<rect x="526.0" y="218" width="448.0" height="145" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="542.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Recursive Resolver</text>
<text x="542.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">May answer from cache; otherwise</text>
<text x="542.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">consult root, TLD and</text>
<text x="542.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">authoritative servers as needed.</text>
<path d="M977.0 290.5h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-overview-en-arrow)" />
<rect x="1000.0" y="218" width="448.0" height="145" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="1016.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Authoritative DNS</text>
<text x="1016.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Provides authoritative records for</text>
<text x="1016.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">its managed zone.</text>
<rect x="20" y="405" width="1460" height="192" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="439" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">2. What can DNS supply?</text>
<rect x="52.0" y="463" width="258.4" height="116" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="491" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">A / AAAA</text>
<text x="68.0" y="530" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">IPv4 / IPv6</text>
<text x="68.0" y="559" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">addresses</text>
<rect x="336.4" y="463" width="258.4" height="116" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="352.4" y="491" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">CNAME / PTR</text>
<text x="352.4" y="530" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Aliases / reverse</text>
<text x="352.4" y="559" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">lookup</text>
<rect x="620.8" y="463" width="258.4" height="116" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="636.8" y="491" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">NS / SOA</text>
<text x="636.8" y="530" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Authority / zone</text>
<text x="636.8" y="559" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">management</text>
<rect x="905.1999999999999" y="463" width="258.4" height="116" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="921.1999999999999" y="491" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">MX</text>
<text x="921.1999999999999" y="530" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Incoming-mail</text>
<text x="921.1999999999999" y="559" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">routing</text>
<rect x="1189.6" y="463" width="258.4" height="116" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="1205.6" y="491" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">TXT / SRV</text>
<text x="1205.6" y="530" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Text policies /</text>
<text x="1205.6" y="559" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">service endpoints</text>
<rect x="20" y="621" width="1460" height="308" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="655" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">3. Verify conclusions at each layer</text>
<rect x="52.0" y="679" width="329.5" height="232" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="707" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">DNS reply</text>
<text x="68.0" y="746" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Configuration data</text>
<text x="68.0" y="775" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">obtained</text>
<path d="M384.5 795.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-overview-en-arrow)" />
<rect x="407.5" y="679" width="329.5" height="232" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="423.5" y="707" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">TCP / UDP</text>
<text x="423.5" y="746" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Check relevant network</text>
<text x="423.5" y="775" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">responses</text>
<path d="M740.0 795.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-overview-en-arrow)" />
<rect x="763.0" y="679" width="329.5" height="232" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="779.0" y="707" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">TLS / HTTP</text>
<text x="779.0" y="746" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Check protocol and</text>
<text x="779.0" y="775" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">function</text>
<path d="M1095.5 795.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#dns-overview-en-arrow)" />
<rect x="1118.5" y="679" width="329.5" height="232" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="1134.5" y="707" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Identity and</text>
<text x="1134.5" y="736" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">authorization</text>
<text x="1134.5" y="775" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Check identity and</text>
<text x="1134.5" y="804" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">permitted operations;</text>
<text x="1134.5" y="833" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">authorization is</text>
<text x="1134.5" y="862" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">required before every</text>
<text x="1134.5" y="891" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">stage.</text>
<rect x="20" y="953" width="1460" height="163" rx="20" fill="#183b59" stroke="#8098ae" />
<text x="42" y="987" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#ffffff">Recording format</text>
<rect x="52.0" y="1011" width="1396.0" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="1039" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Query record</text>
<text x="68.0" y="1078" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Source / time → DNS endpoint → name / type → status / flags → answer / TTL → remaining verification</text></g></svg>
