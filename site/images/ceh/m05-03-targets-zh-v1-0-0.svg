<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630.9" role="img" aria-labelledby="m0503-targets-zh-title m0503-targets-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-targets-zh-title">圖 2｜同一套系統的多個評估層級</title><desc id="m0503-targets-zh-desc">上層是網路觀察視角；下方四類互補。連線只表示同一系統中的關聯，不代表資料流或檢查先後。</desc><defs><marker id="m0503-targets-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">圖 2｜同一套系統的多個評估層級</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">上層是網路觀察視角；下方四類互補。連線只表示同一系統中的關聯，不代表資料流或檢查先後。</text><rect x="40.0" y="170" width="920.0" height="121" rx="16" fill="#dbeafe" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">使用者與網路</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Network assessment：觀察網路出入口與可接觸的服務。</text><path d="M500 291V305M270 319V305H730V319" fill="none" stroke="#47748e" stroke-width="3" /><rect x="40.0" y="319" width="448.0" height="153" rx="16" fill="#e9d5ff" stroke="#47748e" stroke-width="2" /><text x="60.0" y="353.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">網站 / API</text><text x="60.0" y="390.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Application：檢查登入、身分驗證、授權</text><text x="60.0" y="422.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">與程式邏輯。</text><rect x="512.0" y="319" width="448.0" height="153" rx="16" fill="#d1fae5" stroke="#47748e" stroke-width="2" /><text x="532.0" y="353.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">伺服器</text><text x="532.0" y="390.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Host-based：檢查作業系統、更新、權限與</text><text x="532.0" y="422.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">設定。</text><path d="M270 472V500" stroke="#47748e" stroke-width="3" /><path d="M730 472V500" stroke="#47748e" stroke-width="3" /><rect x="40.0" y="500" width="448.0" height="153" rx="16" fill="#fef3c7" stroke="#47748e" stroke-width="2" /><text x="60.0" y="534.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">資料庫</text><text x="60.0" y="571.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Database：檢查帳號、資料存取權限與安全</text><text x="60.0" y="603.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">設定。</text><rect x="512.0" y="500" width="448.0" height="153" rx="16" fill="#ffe4e6" stroke="#47748e" stroke-width="2" /><text x="532.0" y="534.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">雲端 / Wi-Fi</text><text x="532.0" y="571.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Cloud / Wireless：檢查雲端資源權限、</text><text x="532.0" y="603.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Wi-Fi 保護與網路隔離。</text></g></svg>
