<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 876.4" role="img" aria-labelledby="m0505-workflow-zh-title m0505-workflow-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0505-workflow-zh-title">圖 4｜四個問題依序回答</title><desc id="m0505-workflow-zh-desc">箭頭表示定性判斷順序；這不是官方計分公式。CVSS 提供嚴重度，KEV／EPSS 補充不同威脅訊號。</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">圖 4｜四個問題依序回答</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">箭頭表示定性判斷順序；這不是官方計分公式。CVSS 提供嚴重度，KEV／EPSS 補充不同威脅</text><text x="28" y="132.8" font-size="20" fill="#18252c">訊號。</text><rect x="28" y="188.8" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="222.8" font-size="23" fill="#18252c" font-weight="700">第一關：漏洞是否真的影響我的資產？</text><text x="48" y="264.2" font-size="20" fill="#18252c">確認產品、版本、設定、受影響功能</text><path d="M450 324.20000000000005v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="366.20000000000005" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="400.20000000000005" font-size="23" fill="#18252c" font-weight="700">第二關：漏洞與外部威脅訊號告訴我什麼？</text><text x="48" y="441.6" font-size="20" fill="#18252c">CVSS、KEV、EPSS 及其他威脅情資</text><path d="M450 501.6v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="543.6" width="844" height="129.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="577.6" font-size="23" fill="#18252c" font-weight="700">第三關：攻擊者能接近嗎？影響多大？</text><text x="48" y="619.0" font-size="20" fill="#18252c">網路曝露、權限、防護、資料與業務重要性</text><path d="M450 679.0v24m-6-6 6 6 6-6" fill="none" stroke="#59616b" stroke-width="2" /><rect x="28" y="721.0" width="844" height="129.4" rx="14" fill="#edf4fc" stroke="#94a3b8" /><text x="48" y="755.0" font-size="23" fill="#18252c" font-weight="700">第四關：決定處理優先順序與措施</text><text x="48" y="796.4" font-size="20" fill="#18252c">立即緩解、安排修補、驗證、持續追蹤</text></g></svg>
