<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 502" role="img" aria-labelledby="m0303-f1-zh-title m0303-f1-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0303-f1-zh-title">TCP Connect：完成三向交握</title><desc id="m0303-f1-zh-desc">透過 connect() 完成 TCP 連線，然後結束測試。</desc><text x="24" y="32" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">TCP Connect：完成三向交握</text><text x="24" y="68" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">透過 connect() 完成 TCP 連線，然後結束測試。</text><text x="24" y="106" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">掃描端</text><text x="440" y="106" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">目標</text><rect x="12" y="120" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df" /><text x="24" y="140" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">SYN</text><path d="M40 166H560L550 159M560 166L550 173" fill="none" stroke="#245ac5" stroke-width="2" /><text x="24" y="190" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">掃描端 → 目標：提出連線與同步資訊。</text><rect x="12" y="228" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df" /><text x="24" y="248" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">SYN＋ACK</text><path d="M560 274H40L50 267M40 274L50 281" fill="none" stroke="#007d5c" stroke-width="2" /><text x="24" y="298" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">目標 → 掃描端：接受請求，提供自己的同步資訊。</text><rect x="12" y="336" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df" /><text x="24" y="356" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">ACK</text><path d="M40 382H560L550 375M560 382L550 389" fill="none" stroke="#245ac5" stroke-width="2" /><text x="24" y="406" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">掃描端 → 目標：完成一般交握。</text><text x="24" y="464" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">TCP 連線成功還需另查 TLS、HTTP 與應用功能。</text></svg>