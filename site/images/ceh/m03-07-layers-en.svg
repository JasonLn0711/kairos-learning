<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 586" role="img" aria-labelledby="m0307-layers-en-title m0307-layers-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0307-layers-en-title">Figure 3 | Three information layers</title>
<desc id="m0307-layers-en-desc">These answer different questions; a scan need not run every layer. Match each capability to authorization.</desc>
<defs><marker id="m0307-layers-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="584" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">Figure 3 | Three information layers</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">These answer different questions; a scan need not run every</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">layer. Match each capability to authorization.</text>
<rect x="28" y="136" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Host discovery: -sn / -Pn</text>
<text x="48" y="192" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">-sn skips port scans; -Pn skips the discovery decision, not</text>
<text x="48" y="215" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">firewall rules.</text>
<rect x="28" y="281" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="310" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Ports and states: -sT / -p</text>
<text x="48" y="337" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Choose method and ports; interpret states with their reasons.</text>
<rect x="28" y="426" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Service and OS: -sV / -O</text>
<text x="48" y="482" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Extra probes suggest identities. Verify them using management</text>
<text x="48" y="505" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">evidence.</text>
</svg>
