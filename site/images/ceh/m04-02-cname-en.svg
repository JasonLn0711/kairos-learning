<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc"><title id="title">Following a CNAME</title><desc id="desc">An alias points to another name, which resolves to an address. This is not an HTTP redirect.</desc><rect width="720" height="490" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="38" y="38" font-size="18" font-weight="650">Following a CNAME</text><text x="38" y="66" font-size="16" font-weight="400">An alias points to another name, which resolves to an</text><text x="38" y="94" font-size="16" font-weight="400">address. This is not an HTTP redirect.</text><rect x="22" y="116" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="138" font-size="18" font-weight="650">shop.example.test</text><text x="38" y="166" font-size="16" font-weight="400">CNAME alias</text><text x="38" y="222" font-size="16" font-weight="400">↓ </text><rect x="22" y="240" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="262" font-size="18" font-weight="650">www.example.test</text><text x="38" y="290" font-size="16" font-weight="400">Name with an A record</text><text x="38" y="346" font-size="16" font-weight="400">↓ </text><rect x="22" y="364" width="676" height="78" rx="12" fill="#e8f0f5" stroke="#778d80"/><text x="38" y="386" font-size="18" font-weight="650">192.0.2.10</text><text x="38" y="414" font-size="16" font-weight="400">Example IPv4 address</text></g></svg>
