<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 600" role="img" aria-labelledby="m0302-f5-zh-title m0302-f5-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0302-f5-zh-title">圖 1｜ICMP 探測：三種結果，三種證據</title>
<desc id="m0302-f5-zh-desc">收到回音、收到錯誤、未收到預期回覆，分別記錄。虛線表示已送探測但交付與回覆狀態未確認。</desc>
<g transform="scale(0.6)"><rect width="1420" height="1000" fill="#f2f6fc" />
<rect width="1420" height="10" fill="#2464d9" />
<defs><marker id="m0302-f5-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2464d9" /></marker></defs>
<text x="40" y="55" font-family="Noto Sans CJK TC,sans-serif" font-size="30" fill="#172b49">圖 1｜ICMP 探測：三種結果，三種證據</text>
<text x="40" y="95" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">收到回音、收到錯誤、未收到預期回覆，分別記錄。虛線表示已送探測但交付與回覆狀態未確認。</text>
<rect x="40.0" y="170" width="430.6666666666667" height="670" rx="20" fill="#ffffff" stroke="#b7c9df" />
<text x="60.0" y="208" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">01｜有 Echo Reply</text>
<rect x="60.0" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="70.0" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">測試端</text>
<text x="70.0" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.10</text>
<rect x="275.33333333333337" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="285.33333333333337" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">目標端</text>
<text x="285.33333333333337" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.20</text>
<path d="M235.33333333333334 338H275.33333333333337" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f5-zh-arrow)" />
<text x="60.0" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">Echo Request</text>
<path d="M275.33333333333337 405H235.33333333333334" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f5-zh-arrow)" />
<text x="60.0" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">Echo Reply</text>
<text x="60.0" y="510" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">能說：當時 Echo 往返通訊可達</text>
<text x="60.0" y="555" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">RTT 可觀察當次往返延遲。</text>
<text x="60.0" y="600" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">仍需另查：網站、登入與應用服務是否</text>
<text x="60.0" y="630" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">正常。</text>
<rect x="494.6666666666667" y="170" width="430.6666666666667" height="670" rx="20" fill="#ffffff" stroke="#b7c9df" />
<text x="514.6666666666667" y="208" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">02｜有 ICMP 錯誤</text>
<rect x="514.6666666666667" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="524.6666666666667" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">測試端</text>
<text x="524.6666666666667" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.10</text>
<rect x="730.0000000000001" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="740.0000000000001" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">回報設備</text>
<text x="740.0000000000001" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">例如中途路由器</text>
<path d="M690.0000000000001 338H730.0000000000001" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f5-zh-arrow)" />
<text x="514.6666666666667" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">送出探測</text>
<path d="M730.0000000000001 405H690.0000000000001" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f5-zh-arrow)" />
<text x="514.6666666666667" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">回傳錯誤</text>
<text x="514.6666666666667" y="510" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">能說：有設備回報交付問題</text>
<text x="514.6666666666667" y="555" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">例如 Destination Unreachable 或</text>
<text x="514.6666666666667" y="585" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Time Exceeded。</text>
<text x="514.6666666666667" y="630" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">記錄 Type、Code、回報來源；也可能由</text>
<text x="514.6666666666667" y="660" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">本機或其他設備回報。</text>
<rect x="949.3333333333334" y="170" width="430.6666666666667" height="670" rx="20" fill="#ffffff" stroke="#b7c9df" />
<text x="969.3333333333334" y="208" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">03｜等待逾時</text>
<rect x="969.3333333333334" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="979.3333333333334" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">測試端</text>
<text x="979.3333333333334" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.10</text>
<rect x="1184.6666666666667" y="290" width="175.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce" />
<text x="1194.6666666666667" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">目標端</text>
<text x="1194.6666666666667" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">狀態未知</text>
<path d="M1144.6666666666667 338H1184.6666666666667" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#m0302-f5-zh-arrow)" stroke-dasharray="7 5" />
<text x="969.3333333333334" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">已送探測</text>
<text x="969.3333333333334" y="510" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">能說：期限內未收到預期回覆</text>
<text x="969.3333333333334" y="555" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">可能有遺失、路由、政策、休眠或其他</text>
<text x="969.3333333333334" y="585" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">原因。</text>
<text x="969.3333333333334" y="630" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">不能直接宣稱主機已關機。</text>
<text x="40" y="895" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">判讀原則：記錄來源、目標、時間、次數、等待條件與回覆來源。</text>
</g></svg>