<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 362.7" role="img" aria-labelledby="m0503-methods-en-title m0503-methods-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-methods-en-title">Figure 3 | Active and passive ways to gather evidence</title><desc id="m0503-methods-en-desc">The two complementary approaches are parallel; both require authorization.</desc><defs><marker id="m0503-methods-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 3 | Active and passive ways to gather evidence</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The two complementary approaches are parallel; both require authorization.</text><rect x="40.0" y="170" width="448.0" height="185" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Active</text><text x="60.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">You knock or ring the bell to</text><text x="60.0" y="273.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">see whether someone responds.</text><rect x="512.0" y="170" width="448.0" height="185" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="532.0" y="204.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Passive</text><text x="532.0" y="241.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">You examine existing</text><text x="532.0" y="273.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">surveillance footage or entry</text><text x="532.0" y="305.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">records without knocking.</text></g></svg>
