<svg xmlns="http://www.w3.org/2000/svg" width="800" height="918" viewBox="0 0 800 918" role="img" aria-labelledby="title desc" xml:lang="zh"><title id="title">風險評估與四種處置方向</title><desc id="desc">示意比較：同樣的共享權限錯誤，在可能性相同時，公開海報與私人文件仍可能有不同影響。不是組織通用的量化公式。 案例 A：公開活動海報: 資料原本對外公開。示意為可能性中、影響低；仍須檢查其他存取與完整性問題。 案例 B：客戶私人文件: 同樣的設定可能造成隱私、法遵與信任損害。示意為可能性中、影響高。 降低 Mitigate: 修正共享權限、增加檢測並重新驗證。 避免 Avoid: 取消不必要的公開分享功能，也可能犧牲便利性。 移轉／分擔 Transfer / Share: 以契約或保險分配部分損失，不代表法定責任全部消失。 接受 Accept: 由有權責的人理解風險後決定，留下理由與複查時間；不得逃避法律義務。 殘餘風險 Residual Risk: 修好權限仍須確認先前存取與其他缺口；風險不一定歸零。</desc><rect width="800" height="918" fill="#f2f6f5"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="18" font-weight="700" fill="#18252c">風險評估與四種處置方向</text><text x="32" y="76" font-size="18" font-weight="400" fill="#18252c">示意比較：同樣的共享權限錯誤，在可能性相同時，公開海報與私人文件仍可</text><text x="32" y="102" font-size="18" font-weight="400" fill="#18252c">能有不同影響。不是組織通用的量化公式。</text><rect x="24" y="152" width="752" height="112" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="182" font-size="18" font-weight="700" fill="#18252c">案例 A：公開活動海報</text><text x="42" y="212" font-size="18" font-weight="400" fill="#18252c">資料原本對外公開。示意為可能性中、影響低；仍須檢查其他存取與完整性問</text><text x="42" y="238" font-size="18" font-weight="400" fill="#18252c">題。</text><rect x="24" y="282" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="312" font-size="18" font-weight="700" fill="#18252c">案例 B：客戶私人文件</text><text x="42" y="342" font-size="18" font-weight="400" fill="#18252c">同樣的設定可能造成隱私、法遵與信任損害。示意為可能性中、影響高。</text><rect x="24" y="386" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="416" font-size="18" font-weight="700" fill="#18252c">降低 Mitigate</text><text x="42" y="446" font-size="18" font-weight="400" fill="#18252c">修正共享權限、增加檢測並重新驗證。</text><rect x="24" y="490" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="520" font-size="18" font-weight="700" fill="#18252c">避免 Avoid</text><text x="42" y="550" font-size="18" font-weight="400" fill="#18252c">取消不必要的公開分享功能，也可能犧牲便利性。</text><rect x="24" y="594" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="624" font-size="18" font-weight="700" fill="#18252c">移轉／分擔 Transfer / Share</text><text x="42" y="654" font-size="18" font-weight="400" fill="#18252c">以契約或保險分配部分損失，不代表法定責任全部消失。</text><rect x="24" y="698" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="728" font-size="18" font-weight="700" fill="#18252c">接受 Accept</text><text x="42" y="758" font-size="18" font-weight="400" fill="#18252c">由有權責的人理解風險後決定，留下理由與複查時間；不得逃避法律義務。</text><rect x="24" y="802" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="832" font-size="18" font-weight="700" fill="#18252c">殘餘風險 Residual Risk</text><text x="42" y="862" font-size="18" font-weight="400" fill="#18252c">修好權限仍須確認先前存取與其他缺口；風險不一定歸零。</text></g></svg>
