<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378.59999999999997" role="img" aria-labelledby="rpc-evidence-zh-title rpc-evidence-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="rpc-evidence-zh-title">Microsoft RPC：查到端點，還要逐關驗證</title><desc id="rpc-evidence-zh-desc">合成案例：135 回傳 TCP 50020，但連線逾時。箭頭為診斷順序；驗證可能在不同階段發生。已知固定端點、快取或具名管道等情境不一定先查 135。</desc><defs><marker id="rpc-evidence-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b7a" /></marker></defs><rect width="1500" height="631" fill="#f5f8fc" /><g transform="scale(0.6)"><text x="32" y="45" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#183b59">Microsoft RPC：查到端點，還要逐關驗證</text>
<text x="32" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">合成案例：135 回傳 TCP 50020，但連線逾時。箭頭為診斷順序；驗證可能在不同階段發生。已知固定端點、快取或具名管道等</text>
<text x="32" y="109" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">情境不一定先查 135。</text>
<rect x="20" y="160" width="1460" height="250" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="194" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">診斷階段</text>
<rect x="52.0" y="218" width="258.4" height="174" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">01｜端點登記</text>
<text x="68.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Endpoint Mapper：T</text>
<text x="68.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">CP 135 回傳 50020</text>
<text x="68.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">。只確認有登記資料</text>
<text x="68.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">。</text>
<path d="M313.4 305.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#rpc-evidence-zh-arrow)" />
<rect x="336.4" y="218" width="258.4" height="174" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="352.4" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">02｜網路可達性</text>
<text x="352.4" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">TCP Connection：連</text>
<text x="352.4" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">線 50020 逾時，尚</text>
<text x="352.4" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">未連上目標端點。</text>
<path d="M597.8 305.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#rpc-evidence-zh-arrow)" />
<rect x="620.8" y="218" width="258.4" height="174" rx="13" fill="#f2edfc" stroke="#8098ae" />
<text x="636.8" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">03｜介面協商</text>
<text x="636.8" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">RPC Bind：確認介面</text>
<text x="636.8" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">／版本相容。TCP 連</text>
<text x="636.8" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">線成功，協商仍可能</text>
<text x="636.8" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">失敗。</text>
<path d="M882.1999999999999 305.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#rpc-evidence-zh-arrow)" />
<rect x="905.1999999999999" y="218" width="258.4" height="174" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="921.1999999999999" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">04｜身分確認</text>
<text x="921.1999999999999" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">確認呼叫者是誰；有</text>
<text x="921.1999999999999" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">身分不等於有所有權</text>
<text x="921.1999999999999" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">限。</text>
<path d="M1166.6 305.0h20" fill="none" stroke="#365b7a" stroke-width="2" marker-end="url(#rpc-evidence-zh-arrow)" />
<rect x="1189.6" y="218" width="258.4" height="174" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="1205.6" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">05｜操作授權</text>
<text x="1205.6" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">確認能否執行指定操</text>
<text x="1205.6" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">作；讀取允許不等於</text>
<text x="1205.6" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">修改允許。</text>
<rect x="20" y="434" width="1460" height="163" rx="20" fill="#183b59" stroke="#8098ae" />
<text x="42" y="468" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#ffffff">判讀界線</text>
<rect x="52.0" y="492" width="1396.0" height="87" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="520" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">本案例停在第 2 關</text>
<text x="68.0" y="559" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">第 3～5 關均尚未驗證；不能推論帳密錯誤、管理權限或服務不存在。</text></g></svg>
