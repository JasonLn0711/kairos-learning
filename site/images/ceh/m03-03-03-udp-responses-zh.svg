<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-labelledby="m0303-f3-zh-title m0303-f3-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0303-f3-zh-title">UDP：送出資料報，分別判讀四種回應</title><desc id="m0303-f3-zh-desc">掃描端 → 目標：UDP 資料報。四張卡是替代結果，沒有先後順序。</desc><text x="24" y="32" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">UDP：送出資料報，分別判讀四種回應</text><text x="24" y="68" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">掃描端 → 目標：UDP</text><text x="24" y="94" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">資料報。四張卡是替代結果，沒有先後順序。</text><rect x="12" y="112" width="576" height="96" rx="14" fill="#ecfaf4" stroke="#b7c9df" /><text x="24" y="132" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">open</text><text x="24" y="182" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">收到對應 UDP 回覆；此路徑有端點回應。</text><rect x="12" y="220" width="576" height="122" rx="14" fill="#fff0f0" stroke="#b7c9df" /><text x="24" y="240" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">closed</text><text x="24" y="290" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">收到 IPv4 ICMP Type 3 / Code</text><text x="24" y="316" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">3：Port Unreachable。</text><rect x="12" y="354" width="576" height="122" rx="14" fill="#f2efff" stroke="#b7c9df" /><text x="24" y="374" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">filtered</text><text x="24" y="424" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">收到 IPv4 ICMP Type 3 / Code</text><text x="24" y="450" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">1、2、9、10、13。</text><rect x="12" y="488" width="576" height="96" rx="14" fill="#fff7df" stroke="#b7c9df" /><text x="24" y="508" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">open|filtered</text><text x="24" y="558" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">重試後仍無回覆：可能開放但沉默，也可能受到過濾。</text><text x="24" y="616" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">核對 ICMP 來源與原始資料報；IPv4 數字不套用</text><text x="24" y="642" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">ICMPv6。</text></svg>