<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" role="img" aria-labelledby="m0904-f4-en-title m0904-f4-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0904-f4-en-title">One valid badge is not permission for all.</title><desc id="m0904-f4-en-desc">Public and restricted zones are separated by a physical access-control gate. An employee with confirmed access enters on a green route. An unverified visitor route stops at the gate and is directed to reception. A badge event is not a headcount.</desc><defs><marker id="m0904-f4-en-a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2774a7" /></marker><marker id="m0904-f4-en-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18785d" /></marker><marker id="m0904-f4-en-a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b14d55" /></marker><marker id="m0904-f4-en-a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7d" /></marker></defs><g transform="scale(0.9)"><rect width="1000" height="900" fill="#f7fafc" /><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="44" y="38" fill="#2774a7" font-size="20" font-weight="700" text-anchor="start">CEH M09-04  /  04  /  NORTHSTAR · SYNTHETIC SCENARIO</text><text x="44" y="87" fill="#193449" font-size="31" font-weight="700" text-anchor="start">One valid badge is not permission for all.</text><text x="44" y="124" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">Tailgating: distinguish an authorized credential from the people entering.</text><rect x="44" y="174" width="432" height="593" rx="18" fill="#ffffff" stroke="#bdcbd4" stroke-width="1.5" /><rect x="524" y="174" width="432" height="593" rx="18" fill="#edf6fc" stroke="#2774a7" stroke-width="1.5" /><text x="67" y="212" fill="#536b7d" font-size="21" font-weight="700" text-anchor="start">PUBLIC AREA</text><text x="550" y="212" fill="#2774a7" font-size="21" font-weight="700" text-anchor="start">RESTRICTED AREA</text><path d="M500 174 V304 M500 518 V767" fill="none" stroke="#2774a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="480" y="304" width="40" height="214" rx="8" fill="#ffffff" stroke="#2774a7" stroke-width="1.5" /><text x="500" y="292" fill="#2774a7" font-size="20" font-weight="700" text-anchor="middle">GATE</text><circle cx="107" cy="280" r="17" fill="#18785d" /><path d="M81 338 V323 Q81 304 107 304 Q133 304 133 323 V338" fill="#18785d" /><text x="159" y="287" fill="#18785d" font-size="23" font-weight="700" text-anchor="start">Employee</text><text x="159" y="321" fill="#193449" font-size="20" font-weight="400" text-anchor="start">Entry is authorized.</text><text x="159" y="349" fill="#193449" font-size="20" font-weight="400" text-anchor="start">Own badge validated.</text><path d="M158 376 H797" fill="none" stroke="#18785d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f4-en-a-green)" /><text x="669" y="359" fill="#18785d" font-size="20" font-weight="700" text-anchor="middle">Authorized person enters</text><rect x="619" y="260" width="290" height="62" rx="18" fill="#ffffff" stroke="#2774a7" stroke-width="1.5" /><text x="764" y="299" fill="#2774a7" font-size="20" font-weight="500" text-anchor="middle">Northstar operations</text><circle cx="107" cy="431" r="17" fill="#946114" /><path d="M81 489 V474 Q81 455 107 455 Q133 455 133 474 V489" fill="#946114" /><text x="159" y="438" fill="#946114" font-size="23" font-weight="700" text-anchor="start">Visitor</text><text x="159" y="472" fill="#193449" font-size="20" font-weight="400" text-anchor="start">Identity and access unchecked.</text><path d="M158 512 H466" fill="none" stroke="#b14d55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f4-en-a-red)" /><circle cx="490" cy="512" r="16" fill="#f7fafc" stroke="#b14d55" stroke-width="2" /><path d="M484 506 L496 518 M484 518 L496 506" fill="none" stroke="#b14d55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="327" y="543" fill="#b14d55" font-size="20" font-weight="700" text-anchor="middle">Entry not granted</text><path d="M190 532 V616" fill="none" stroke="#18785d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0904-f4-en-a-green)" /><rect x="66" y="616" width="385" height="114" rx="18" fill="#eaf6ef" stroke="#18785d" stroke-width="1.5" /><text x="259" y="656" fill="#18785d" font-size="23" font-weight="700" text-anchor="middle">Reception / access desk</text><text x="259" y="691" fill="#193449" font-size="20" font-weight="400" text-anchor="middle">Verify, register, and escort per policy.</text><rect x="552" y="585" width="376" height="145" rx="18" fill="#ffffff" stroke="#2774a7" stroke-width="1.5" /><text x="740" y="628" fill="#2774a7" font-size="23" font-weight="700" text-anchor="middle">1 valid badge event</text><text x="740" y="665" fill="#193449" font-size="28" font-weight="700" text-anchor="middle">≠</text><text x="740" y="703" fill="#193449" font-size="20" font-weight="500" text-anchor="middle">a headcount / everyone’s permission</text><path d="M44 804 H956" fill="none" stroke="#bdcbd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="839" fill="#193449" font-size="20" font-weight="500" text-anchor="start">Green: approved movement in this example. Red ×: unverified entry is blocked.</text><text x="44" y="870" fill="#536b7d" font-size="20" font-weight="400" text-anchor="start">Teaching floor plan only. Apply the site’s access and visitor-safety policy.</text></g></g></svg>