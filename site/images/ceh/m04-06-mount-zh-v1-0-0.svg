<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880.0 319.20000000000005" role="img" aria-labelledby="m0406-mount-zh-title m0406-mount-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="m0406-mount-zh-title">圖 3｜NFS 把遠端檔案系統接入本機目錄樹</title><desc id="m0406-mount-zh-desc">虛線箭頭表示用戶端到伺服器的讀寫請求，不是整份資料複製到本機。省略回覆、快取與協定細節；掛載成功不代表取得每個檔案的權限。</desc><rect width="880.0" height="319.20000000000005" fill="#ffffff" /><g transform="scale(0.8)" font-family="sans-serif" fill="#173450"><text x="24" y="40" font-size="22" font-weight="700">圖 3｜NFS 把遠端檔案系統接入本機目錄樹</text><rect x="24" y="88" width="280" height="180" rx="22" fill="#edf0f5" stroke="#8b9cb1" stroke-width="2" /><text x="54" y="148" font-size="22" font-weight="700">Client</text><text x="54" y="198" font-size="18" font-weight="400">/mnt/data</text><rect x="796" y="88" width="280" height="180" rx="22" fill="#e5f5f2" stroke="#009b8b" stroke-width="2" /><text x="826" y="148" font-size="22" font-weight="700">Server</text><text x="826" y="198" font-size="18" font-weight="400">/srv/share</text><text x="480" y="123" font-size="18" font-weight="700">NFS</text><text x="345" y="223" font-size="18" font-weight="400">網路讀寫請求</text><path d="M304 173 H790 m-18 -12 18 12 -18 12" stroke="#1d2939" fill="none" stroke-width="3" stroke-dasharray="12 8" /><text x="24" y="318" font-size="18" font-weight="400">虛線箭頭表示用戶端到伺服器的讀寫請求，不是整份資料複製到本機。省略回覆、快取與協定細節；掛載成功不代表取</text><text x="24" y="346" font-size="18" font-weight="400">得每個檔案的權限。</text></g></svg>