<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 918.0" role="img" aria-labelledby="m0503-signals-en-title m0503-signals-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-signals-en-title">Figure 1 | Three signals plus local evidence inform priority</title><desc id="m0503-signals-en-desc">The first three are parallel signals; the fourth is their shared decision context. No numerical sum, causal arrow or fixed action order is implied.</desc><defs><marker id="m0503-signals-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 1 | Three signals plus local evidence inform</text><text x="28" y="83.6" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">priority</text><text x="28" y="150.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The first three are parallel signals; the fourth is their shared decision</text><text x="28" y="182.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">context. No numerical sum, causal arrow or fixed action order is implied.</text><rect x="40.0" y="244" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="278.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">CVSS | Technical severity</text><text x="60.0" y="315.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Keep the version, type, vector and source. The score is not our</text><text x="60.0" y="347.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">probability of compromise.</text><rect x="40.0" y="425" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="459.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">KEV | Known exploitation evidence</text><text x="60.0" y="496.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Keep the listing status and check date. External exploitation is not</text><text x="60.0" y="528.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">local intrusion; absence does not justify ignoring a flaw.</text><rect x="40.0" y="606" width="920.0" height="153" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="640.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">EPSS | Next 30 days forecast</text><text x="60.0" y="677.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Keep probability separate from percentile. A low or missing score</text><text x="60.0" y="709.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">does not establish safety.</text><rect x="40.0" y="787" width="920.0" height="185" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="821.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Our assets and risk context</text><text x="60.0" y="858.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Check complete versions, configuration and patches, then exposure,</text><text x="60.0" y="890.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">importance, consequences and existing defenses. Record the</text><text x="60.0" y="922.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">prioritization rationale.</text></g></svg>
