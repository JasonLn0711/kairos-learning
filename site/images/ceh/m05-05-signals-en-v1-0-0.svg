<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 747.0" role="img" aria-labelledby="m0505-signals-en-title m0505-signals-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0505-signals-en-title">Figure 1 | Three tools, three questions</title><desc id="m0505-signals-en-desc">Parallel signals: technical severity, known exploitation and predicted exploitation. Local asset context is still required.</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">Figure 1 | Three tools, three questions</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">Parallel signals: technical severity, known exploitation and</text><text x="28" y="132.8" font-size="20" fill="#18252c">predicted exploitation. Local asset context is still required.</text><rect x="28" y="188.8" width="844" height="165.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><path d="M3 18a9 9 0 1 1 18 0 M12 14l5-7 M5 19h14" transform="translate(46 214.8) scale(1.2)" fill="none" stroke="#18252c" stroke-width="1.7" /><text x="90" y="222.8" font-size="23" fill="#18252c" font-weight="700">CVSS — How severe is it?</text><text x="90" y="264.2" font-size="20" fill="#18252c">Like assessing a lock's design defect and the consequences</text><text x="90" y="300.2" font-size="20" fill="#18252c">of defeating it.</text><rect x="28" y="372.20000000000005" width="844" height="165.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><path d="M12 2l9 4v7c0 5-4 8-9 10-5-2-9-5-9-10V6z M12 7v6 M12 16v1" transform="translate(46 398.20000000000005) scale(1.2)" fill="none" stroke="#18252c" stroke-width="1.7" /><text x="90" y="406.20000000000005" font-size="23" fill="#18252c" font-weight="700">KEV — Has it actually been exploited?</text><text x="90" y="447.6" font-size="20" fill="#18252c">Like reliable reports confirming burglars using this lock</text><text x="90" y="483.6" font-size="20" fill="#18252c">defect in real crimes.</text><rect x="28" y="555.6" width="844" height="165.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><path d="M3 21v-5 M8 21V12 M13 21v-8 M18 21V7 M2 12l6-6 5 3 8-7" transform="translate(46 581.6) scale(1.2)" fill="none" stroke="#18252c" stroke-width="1.7" /><text x="90" y="589.6" font-size="23" fill="#18252c" font-weight="700">EPSS — How likely is exploitation next?</text><text x="90" y="631.0" font-size="20" fill="#18252c">Like predicting use of this defect in the next 30 days from</text><text x="90" y="667.0" font-size="20" fill="#18252c">past cases and current signals.</text></g></svg>
