<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 577.44" role="img" aria-labelledby="m0409-case-en-title m0409-case-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-case-en-title">Synthetic review: VPN endpoint answers IKE_SA_INIT</title><desc id="m0409-case-en-desc">This teaching observation is synthetic. It records neither a connection to a real VPN nor a confirmed vulnerability.</desc><defs><marker id="m0409-case-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Synthetic review: VPN endpoint answers IKE_SA_INIT</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Established</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The endpoint responded to this initial negotiation.</text><rect x="40" y="229.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="261.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Not established</text><text x="56" y="297.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The tester successfully signed in to the VPN.</text><rect x="40" y="357.6" width="920" height="140" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="389.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Further evidence</text><text x="56" y="425.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Authentication, data channel, access policies and authorized resource</text><text x="56" y="457.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">tests.</text><text x="28" y="557.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">This teaching observation is synthetic. It records neither a connection to</text><text x="28" y="589.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">a real VPN nor a confirmed vulnerability.</text></g></svg>
