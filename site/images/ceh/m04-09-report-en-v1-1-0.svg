<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 663.84" role="img" aria-labelledby="m0409-report-en-title m0409-report-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-report-en-title">VPN review record: observation through next verification</title><desc id="m0409-report-en-desc">The three rows are fields in one synthetic report. No real VPN was tested and no vulnerability was established.</desc><defs><marker id="m0409-report-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">VPN review record: observation through next verification</text><rect x="40" y="101.6" width="920" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Observation</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The test endpoint returns a valid response to IKEv2 initial</text><text x="56" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">negotiation.</text><rect x="40" y="261.6" width="920" height="140" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="293.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Evidence boundary</text><text x="56" y="329.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">This establishes a service response; successful authentication and</text><text x="56" y="361.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">internal-resource access have not been established.</text><rect x="40" y="421.6" width="920" height="172" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="453.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Next verification</text><text x="56" y="489.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Within authorization, use an approved test account to check VPN</text><text x="56" y="521.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">authentication, tunnel establishment and access controls against</text><text x="56" y="553.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">policy.</text><text x="28" y="653.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The three rows are fields in one synthetic report. No real VPN was tested</text><text x="28" y="685.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">and no vulnerability was established.</text></g></svg>
