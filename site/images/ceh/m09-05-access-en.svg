<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 910" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="m0905-f2-en-title m0905-f2-en-desc"><title id="m0905-f2-en-title">Login access is not unlimited permission</title><desc id="m0905-f2-en-desc">Authorized reading and possible disclosure cross different purpose boundaries. An outsider using a stolen account is an alternative possibility, not an established fact.</desc><defs><marker id="m0905-f2-en-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#193449" /></marker><marker id="m0905-f2-en-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#536b7d" /></marker><marker id="m0905-f2-en-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2774a7" /></marker><marker id="m0905-f2-en-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b14d55" /></marker><marker id="m0905-f2-en-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#18785d" /></marker><marker id="m0905-f2-en-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#946c19" /></marker></defs><rect width="680" height="910" fill="#f7fafc" /><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="30" y="36" font-size="17" fill="#2774a7" font-weight="700" text-anchor="start">CEH M09-05  /  ACCESS</text><text x="30" y="83" font-size="30" fill="#193449" font-weight="700" text-anchor="start">Login access is not unlimited permission</text><text x="30" y="121" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">Synthetic example: a company customer list.</text><rect x="30" y="160" width="620" height="100" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5" /><text x="50" y="196" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">Legitimate start: employee can read data</text><text x="50" y="228" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Read access is not permission to export or disclose.</text><path d="M 340 260 L 340 310" fill="none" stroke="#2774a7" stroke-width="2.5" marker-end="url(#m0905-f2-en-blue)" /><rect x="30" y="310" width="620" height="100" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5" /><text x="50" y="346" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">1. Read for an assigned task</text><text x="50" y="378" font-size="22" fill="#193449" font-weight="400" text-anchor="start">This illustrates normal, authorized data access.</text><path d="M30 466 H650" stroke="#946c19" stroke-width="2" stroke-dasharray="8 6" /><text x="30" y="452" font-size="21" fill="#946c19" font-weight="700" text-anchor="start">Purpose / sharing authorization boundary</text><path d="M 620 410 L 620 510" fill="none" stroke="#b14d55" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#m0905-f2-en-red)" /><rect x="30" y="510" width="620" height="132" rx="18" fill="#fff0f1" stroke="#b14d55" stroke-width="1.5" /><text x="50" y="546" font-size="24" fill="#b14d55" font-weight="700" text-anchor="start">2. Possible breach: send to personal email</text><text x="50" y="578" font-size="22" fill="#193449" font-weight="400" text-anchor="start">It may be deliberate or an accidental mis-send.</text><text x="50" y="610" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Evidence and context are needed to assess intent.</text><rect x="30" y="690" width="620" height="132" rx="18" fill="#fff6dd" stroke="#946c19" stroke-width="1.5" /><text x="50" y="726" font-size="24" fill="#946c19" font-weight="700" text-anchor="start">Another path: outsider uses a stolen account</text><text x="50" y="758" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Logs may show the same account identifier.</text><text x="50" y="790" font-size="22" fill="#193449" font-weight="400" text-anchor="start">That does not prove the account owner acted.</text><text x="30" y="870" font-size="20" fill="#536b7d" font-weight="400" text-anchor="start">Solid arrow: normal access. Dashed arrow: possible risk.</text></g></svg>