<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-labelledby="m0906-f1-zh-m09-06-trust-boundary-zh-TW-title m0906-f1-zh-m09-06-trust-boundary-zh-TW-desc" preserveAspectRatio="xMidYMid meet"><title id="m0906-f1-zh-m09-06-trust-boundary-zh-TW-title">圖 1｜信任來源與執行邊界</title><desc id="m0906-f1-zh-m09-06-trust-boundary-zh-TW-desc">可疑訊息與獨立可信來源分開；需核對身分、特定要求與授權後才執行。</desc><defs><marker id="m0906-f1-zh-m09-06-trust-boundary-zh-TW-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a" /></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="850" rx="22" fill="#f6f9fb" /><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">圖 1｜信任來源與執行邊界</text><rect x="30" y="77" width="540" height="116" rx="16" fill="#fff0d5" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="111" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">未驗證的要求</text><text x="50" y="147" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">照片、聲音、網址、回撥號碼</text><text x="50" y="177" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">都可能由同一來源安排</text><text x="300" y="233" text-anchor="middle" font-size="22" fill="#914e27" font-weight="700">不能替自己作證</text><rect x="30" y="270" width="540" height="330" rx="16" fill="#ffffff" stroke="#87af9e" stroke-width="1.5" stroke-dasharray="7 6" /><text x="50" y="308" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">獨立可信來源</text><text x="50" y="346" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">既有通訊錄／正式系統／既定核准流程</text><text x="50" y="375" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">不是可疑訊息新提供的聯絡資訊</text><rect x="55" y="404" width="490" height="77" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5" /><text x="75" y="438" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">確認身分 + 這項要求 + 授權範圍</text><text x="55" y="524" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">三者有依據，才考慮執行</text><text x="55" y="554" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">仍須檢查目的地與必要資料範圍</text><path d="M300,602 L300,651" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m0906-f1-zh-m09-06-trust-boundary-zh-TW-arrow)" /><rect x="30" y="666" width="540" height="111" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5" /><text x="50" y="700" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">受保護的行動</text><text x="50" y="736" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">付款／傳送資料／變更帳號</text><text x="50" y="766" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">無法核實 → 暫停、通報</text><text x="30" y="820" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">虛線＝查核區；箭頭＝通過查核後的流程</text></g></svg>