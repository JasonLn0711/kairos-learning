<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">Four views of one attack</title><desc id="desc">A teaching framework: target, channel, claimed identity and requested action can coexist. Who is targeted?: Lin, an ordinary employee. Is there evidence of content tailored to him? Which channel?: SMS and voice. One attack may use more than one channel. Who is impersonated?: The caller claims to be the IT help desk, borrowing trust in that role. What is requested?: Disclose a login code or approve a login the employee did not initiate.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker></defs>
<rect width="1000" height="680" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="42" y="37" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · FIGURE 1</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">Four views of one attack</text>
<text x="42" y="135" font-size="18" font-weight="400" fill="#43576a" text-anchor="start">A teaching framework: target, channel, claimed identity and requested action can coexist.</text>
<rect x="42" y="200" width="446" height="185" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="239" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">Who is targeted?</text>
<text x="66" y="282" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Lin, an ordinary employee. Is there</text>
<text x="66" y="312" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">evidence of content tailored to him?</text>
<rect x="512" y="200" width="446" height="185" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="536" y="239" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">Which channel?</text>
<text x="536" y="282" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">SMS and voice. One attack may use more</text>
<text x="536" y="312" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">than one channel.</text>
<rect x="42" y="410" width="446" height="185" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="449" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">Who is impersonated?</text>
<text x="66" y="492" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">The caller claims to be the IT help desk,</text>
<text x="66" y="522" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">borrowing trust in that role.</text>
<rect x="512" y="410" width="446" height="185" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="536" y="449" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="start">What is requested?</text>
<text x="536" y="492" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Disclose a login code or approve a login</text>
<text x="536" y="522" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">the employee did not initiate.</text>
<text x="42" y="634" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">These dimensions can coexist; there is no need to force a single label.</text>
</g></svg>
