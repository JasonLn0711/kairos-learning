<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 589.14" role="img" aria-labelledby="m0409-ike-en-title m0409-ike-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-ike-en-title">Home computer → VPN gateway → internal network</title><desc id="m0409-ike-en-desc">The path identifies roles. The three items explain initial negotiation, authentication and usability checks; they are neither IKEv1 phases nor three mandatory IKEv2 exchanges.</desc><defs><marker id="m0409-ike-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Home computer → VPN gateway → internal network</text><rect x="40.0" y="101.6" width="283.3333333333333" height="372" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IKE_SA_INIT:</text><text x="56.0" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">negotiate</text><text x="56.0" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">protection</text><text x="56.0" y="241.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Negotiate</text><text x="56.0" y="273.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">algorithms and</text><text x="56.0" y="305.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">exchange material</text><text x="56.0" y="337.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">needed to establish</text><text x="56.0" y="369.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">keys.</text><rect x="358.3333333333333" y="101.6" width="283.3333333333333" height="372" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="374.3333333333333" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">IKE_AUTH:</text><text x="374.3333333333333" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">authenticate</text><text x="374.3333333333333" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">both parties</text><text x="374.3333333333333" y="241.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Confirm identity</text><text x="374.3333333333333" y="273.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">using certificates</text><text x="374.3333333333333" y="305.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">or another</text><text x="374.3333333333333" y="337.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">configured method;</text><text x="374.3333333333333" y="369.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">normally negotiate</text><text x="374.3333333333333" y="401.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">the first CHILD_SA</text><text x="374.3333333333333" y="433.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">too.</text><path d="M328.3333333333333 287.6H353.3333333333333" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ike-en-arrow)" /><rect x="676.6666666666666" y="101.6" width="283.3333333333333" height="372" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="692.6666666666666" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Verify a usable</text><text x="692.6666666666666" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">data channel</text><text x="692.6666666666666" y="205.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Suitable IPsec data</text><text x="692.6666666666666" y="237.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">SAs, routing and</text><text x="692.6666666666666" y="269.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">access policies are</text><text x="692.6666666666666" y="301.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">also needed to use</text><text x="692.6666666666666" y="333.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">internal resources.</text><path d="M646.6666666666666 287.6H671.6666666666666" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ike-en-arrow)" /><text x="28" y="538.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The path identifies roles. The three items explain initial negotiation,</text><text x="28" y="570.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">authentication and usability checks; they are neither IKEv1 phases nor</text><text x="28" y="602.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">three mandatory IKEv2 exchanges.</text></g></svg>
