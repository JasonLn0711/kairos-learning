<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1520" height="1000" viewBox="0 0 1520 1000" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">主管語音與文件上傳：錯誤路徑和正確路徑</title><desc id="svgdesc">同一則可疑訊息，若依據對方提供的驗證資訊，可能落入圈套；應透過已知管道與正式流程確認。</desc>
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#2459A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrred" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#B34548" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrteal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#0A8277" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<filter id="sh" x="-10%" y="-15%" width="125%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#132942" flood-opacity="0.08"/></filter>
</defs>
<rect width="1520" height="1000" fill="#F6F8FC"/>
<rect x="60" y="41" width="155" height="43" rx="21.5" fill="#FFF5DF" stroke="none" stroke-width="2"/><text x="137.5" y="69.85" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="650" letter-spacing="0" fill="#9D641C">情境演練</text><text x="240" y="82" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="40" font-weight="740" letter-spacing="0" fill="#15283C">收到「主管」要求上傳內部文件，下一步怎麼做？</text><rect x="60" y="152" width="1400" height="156" rx="23" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2" filter="url(#sh)"/><rect x="90" y="176" width="135" height="40" rx="20.0" fill="#FFF0EF" stroke="none" stroke-width="2"/><text x="157.5" y="203.0" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="650" letter-spacing="0" fill="#B34548">可疑訊息</text><text x="244" y="212" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="28" font-weight="650" letter-spacing="0" fill="#15283C">「現在把會員名單傳到新網址，這是緊急交辦！」</text><text x="92" y="264" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#596C7D">附主管照片、熟悉語音、甚至提供「驗證用」新電話號碼。</text><path d="M760 315 L760 381" fill="none" stroke="#2459A6" stroke-width="3" marker-end="url(#arr)" stroke-linecap="round"/><rect x="480" y="390" width="560" height="84" rx="18" fill="#EAF1FC" stroke="none" stroke-width="2"/><text x="760" y="442" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="28" font-weight="750" letter-spacing="0" fill="#153E76">遇到高風險要求，你選擇哪一條處理路線？</text><path d="M480 432 H375 V507" stroke="#B34548" stroke-width="3" fill="none" marker-end="url(#arrred)"/><path d="M1040 432 H1145 V507" stroke="#0A8277" stroke-width="3" fill="none" marker-end="url(#arrteal)"/><rect x="243" y="486" width="125" height="35" rx="17.5" fill="#FFF0EF" stroke="none" stroke-width="2"/><text x="305.5" y="509.8" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="650" letter-spacing="0" fill="#B34548">錯誤路線</text><rect x="1158" y="486" width="125" height="35" rx="17.5" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="1220.5" y="509.8" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="650" letter-spacing="0" fill="#0A8277">正確路線</text><rect x="65" y="545" width="635" height="358" rx="23" fill="#FFF0EF" stroke="none" stroke-width="2"/><text x="93" y="593" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="760" letter-spacing="0" fill="#B34548">✕  容易犯的錯誤</text><text x="95" y="657" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="700" letter-spacing="0" fill="#15283C">直接打訊息附上的新電話</text><text x="95" y="720" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" letter-spacing="0" fill="#596C7D">可能仍由冒充者接聽</text><text x="95" y="762" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" letter-spacing="0" fill="#596C7D">換成電話或另一個 App，</text><text x="95" y="804" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" letter-spacing="0" fill="#596C7D">不代表脫離了對方的控制。</text><rect x="790" y="545" width="665" height="358" rx="23" fill="#E5F5F1" stroke="none" stroke-width="2"/><text x="822" y="593" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="760" letter-spacing="0" fill="#075C56">✓  更安全的處理方式</text><text x="823" y="655" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#15283C">① 找事先保存的主管聯絡方式</text><text x="823" y="706" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#15283C">② 確認「這次」是否真的要傳資料</text><text x="823" y="757" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#15283C">③ 核准範圍、目的地、程序再確認</text><text x="823" y="808" text-anchor="start" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="23" font-weight="400" letter-spacing="0" fill="#15283C">④ 有疑慮時先暫停並通報</text><rect x="65" y="931" width="1390" height="44" rx="12" fill="#EAF1FC" stroke="none" stroke-width="2"/><text x="760" y="962" text-anchor="middle" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="640" letter-spacing="0" fill="#153E76">判斷原則：換通訊工具 ≠ 獨立驗證；來源獨立、內容具體、權限正當才是重點。</text>
</svg>
