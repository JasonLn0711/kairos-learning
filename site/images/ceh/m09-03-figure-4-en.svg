<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="795" viewBox="0 0 1000 795" role="img" aria-labelledby="title desc">
<title id="title">An extra step is not phishing resistance</title><desc id="desc">Compare whether the authentication output can be relayed and whether it is bound to the intended verifier. Traditional OTP: The SMS code in this example expires and can be used only once, but it may still be relayed to an attacker in real time. Phishing-resistant authentication: Correctly implemented FIDO2/WebAuthn authentication, for example, uses cryptographic mechanisms to bind authentication to the intended verifier.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker></defs>
<rect width="1000" height="795" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="42" y="37" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · FIGURE 4</text>
<text x="42" y="85" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">An extra step is not phishing resistance</text>
<text x="42" y="135" font-size="18" font-weight="400" fill="#43576a" text-anchor="start">Compare whether the authentication output can be relayed and whether it is bound to the intended verifier.</text>
<rect x="42" y="185" width="446" height="500" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="228" font-size="23" font-weight="700" fill="#1d4ed8" text-anchor="start">Traditional OTP</text>
<rect x="66" y="320" width="165" height="114" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<rect x="299" y="320" width="165" height="114" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="148" y="363" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">OTP on phone</text>
<text x="381" y="363" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Another</text>
<text x="381" y="391" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">person</text>
<path d="M 240 377 L 290 377" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="265" y="478" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="middle">Can be relayed</text>
<text x="66" y="538" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">The SMS code in this example expires and</text>
<text x="66" y="568" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">can be used only once, but it may still be</text>
<text x="66" y="598" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">relayed to an attacker in real time.</text>
<rect x="512" y="185" width="446" height="500" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="536" y="228" font-size="23" font-weight="700" fill="#0f766e" text-anchor="start">Phishing-resistant authentication</text>
<rect x="536" y="320" width="165" height="114" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<rect x="769" y="320" width="165" height="114" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="618" y="363" font-size="20" font-weight="700" fill="#0f766e" text-anchor="middle">Authenticator</text>
<text x="851" y="363" font-size="20" font-weight="700" fill="#0f766e" text-anchor="middle">Bound service</text>
<path d="M 710 377 L 760 377" fill="none" stroke="#43576a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="735" y="478" font-size="19" font-weight="700" fill="#0f766e" text-anchor="middle">Bound proof</text>
<text x="536" y="538" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">Correctly implemented FIDO2/WebAuthn</text>
<text x="536" y="568" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">authentication, for example, uses</text>
<text x="536" y="598" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">cryptographic mechanisms to bind</text>
<text x="536" y="628" font-size="20" font-weight="400" fill="#172b3a" text-anchor="start">authentication to the intended verifier.</text>
<text x="42" y="738" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">Protecting authentication does not automatically authorize payments or data requests.</text>
</g></svg>
