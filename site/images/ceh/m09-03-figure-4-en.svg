<svg xmlns="http://www.w3.org/2000/svg" width="800" height="930" viewBox="0 0 800 930" role="img" aria-labelledby="m0903-f4-en-title m0903-f4-en-desc">
<title id="m0903-f4-en-title">Relayable codes versus bound authentication proof</title><desc id="m0903-f4-en-desc">Compare mechanisms: an extra step alone is not phishing resistance.</desc>
<defs>
<marker id="m0903-f4-en-flow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#1d4ed8"/></marker>
<marker id="m0903-f4-en-attempt" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#92400e"/></marker>
<marker id="m0903-f4-en-process" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 5 L 0 10 Z" fill="#43576a"/></marker>
</defs>
<rect width="800" height="930" fill="#ffffff"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#172b3a">
<text x="28" y="30" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="start">CEH M09-03 · FIGURE 4</text>
<text x="28" y="70" font-size="28" font-weight="700" fill="#172b3a" text-anchor="start">Relayable codes versus bound authentication proof</text>
<text x="28" y="111" font-size="17" font-weight="400" fill="#43576a" text-anchor="start">Compare mechanisms: an extra step alone is not phishing resistance.</text>
<rect x="24" y="150" width="752" height="235" rx="12" fill="#fffbeb" stroke="#92400e" stroke-width="1.5"/>
<text x="42" y="183" font-size="22" font-weight="700" fill="#92400e" text-anchor="start">A | SMS OTP: a person can relay it</text>
<rect x="48" y="225" width="160" height="100" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="128.0" y="254.0" font-size="20" font-weight="700" fill="#172b3a" text-anchor="middle">CODE ON</text>
<text x="128.0" y="280.0" font-size="20" font-weight="700" fill="#172b3a" text-anchor="middle">PHONE</text>
<text x="128.0" y="311.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">SMS OTP</text>
<rect x="320" y="225" width="160" height="100" rx="12" fill="#fffbeb" stroke="#64748b" stroke-width="1.5"/>
<text x="400.0" y="255.5" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle">IMPOSTOR</text>
<text x="400.0" y="286.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Receives real</text>
<text x="400.0" y="309.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">code</text>
<rect x="592" y="225" width="160" height="100" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="672.0" y="254.5" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">REAL VERIFIER</text>
<text x="672.0" y="285.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Checks other</text>
<text x="672.0" y="308.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">rules</text>
<path d="M 208 272 L 310 272" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f4-en-flow)"/>
<rect x="233.78125" y="233" width="52.4375" height="24" rx="3" fill="#ffffff"/>
<text x="260" y="252" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">Relay</text>
<path d="M 480 272 L 582 272" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m0903-f4-en-attempt)"/>
<rect x="494.96875" y="233" width="74.0625" height="24" rx="3" fill="#ffffff"/>
<text x="532" y="252" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">Attempt</text>
<text x="42" y="360" font-size="18" font-weight="400" fill="#92400e" text-anchor="start">Expiry + single use do not automatically stop a real-time relay.</text>
<rect x="24" y="420" width="752" height="370" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="42" y="453" font-size="22" font-weight="700" fill="#0f766e" text-anchor="start">B | FIDO2/WebAuthn: bound proof</text>
<rect x="48" y="510" width="192" height="135" rx="12" fill="#f0fdfa" stroke="#64748b" stroke-width="1.5"/>
<text x="144.0" y="557.5" font-size="19" font-weight="700" fill="#0f766e" text-anchor="middle">AUTHENTICATOR</text>
<text x="144.0" y="588.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">No private key in</text>
<text x="144.0" y="611.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">reply</text>
<rect x="310" y="510" width="182" height="135" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="401.0" y="545.0" font-size="19" font-weight="700" fill="#172b3a" text-anchor="middle">BROWSER /</text>
<text x="401.0" y="570.0" font-size="19" font-weight="700" fill="#172b3a" text-anchor="middle">ORIGIN</text>
<text x="401.0" y="601.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Checks origin /</text>
<text x="401.0" y="624.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">RP ID scope</text>
<rect x="570" y="510" width="182" height="135" rx="12" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
<text x="661.0" y="546.0" font-size="19" font-weight="700" fill="#1d4ed8" text-anchor="middle">REAL RP</text>
<text x="661.0" y="577.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Checks origin /</text>
<text x="661.0" y="600.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">challenge /</text>
<text x="661.0" y="623.0" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">signature</text>
<path d="M 240 567 L 300 567" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f4-en-flow)"/>
<path d="M 492 567 L 560 567" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#m0903-f4-en-flow)"/>
<text x="401" y="490" font-size="18" font-weight="700" fill="#0f766e" text-anchor="middle">Signed proof only; no private key</text>
<rect x="310" y="690" width="182" height="76" rx="12" fill="#fffbeb" stroke="#64748b" stroke-width="1.5"/>
<text x="401.0" y="719.5" font-size="19" font-weight="700" fill="#92400e" text-anchor="middle">FAKE ORIGIN</text>
<text x="401.0" y="750.5" font-size="18" font-weight="400" fill="#172b3a" text-anchor="middle">Wrong scope</text>
<path d="M 400 690 L 400 657" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m0903-f4-en-attempt)"/>
<path d="M 393 651 L 407 665 M 407 651 L 393 665" stroke="#92400e" stroke-width="3" fill="none"/>
<text x="623" y="716" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">Wrong scope → credential</text>
<text x="623" y="740" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">access blocked</text>
<line x1="28" y1="822" x2="772" y2="822" stroke="#64748b" stroke-width="1"/>
<text x="28" y="847" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">→ Authentication output/signed proof. ⇢ Wrong origin/RP ID attempt. × Rejected.</text>
<text x="28" y="874" font-size="16" font-weight="400" fill="#43576a" text-anchor="start">Successful authentication ≠ authorization for every payment or data request.</text>
</g></svg>
