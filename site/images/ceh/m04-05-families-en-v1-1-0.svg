<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 413.4" role="img" aria-labelledby="rpc-families-en-title rpc-families-en-desc" preserveAspectRatio="xMidYMid meet"><title id="rpc-families-en-title">TCP 135 and 111: two service directories</title><desc id="rpc-families-en-desc">Similar purpose, different protocol families, lookup formats, and services.</desc><defs><marker id="rpc-families-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b7a" /></marker></defs><rect width="1500" height="689" fill="#f5f8fc" /><g transform="scale(0.6)"><text x="32" y="45" font-family="Noto Sans CJK TC,sans-serif" font-size="28" fill="#183b59">TCP 135 and 111: two service directories</text>
<text x="32" y="80" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Similar purpose, different protocol families, lookup formats, and services.</text>
<rect x="20" y="160" width="1460" height="279" rx="20" fill="#ffffff" stroke="#8098ae" />
<text x="42" y="194" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">RPC families</text>
<rect x="52.0" y="218" width="685.0" height="203" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Microsoft RPC | Common on Windows</text>
<text x="68.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">Endpoint Mapper, commonly TCP 135; Interface UUID +</text>
<text x="68.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">version. Endpoints include TCP service ports or named</text>
<text x="68.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">pipes; SMB transport is possible. Example: 135 → TCP</text>
<text x="68.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">50020 → specified RPC operation.</text>
<rect x="763.0" y="218" width="685.0" height="203" rx="13" fill="#e5f5f2" stroke="#8098ae" />
<text x="779.0" y="246" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">ONC RPC | Common on Unix/Linux</text>
<text x="779.0" y="285" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">rpcbind/portmapper, commonly TCP/UDP 111. Program</text>
<text x="779.0" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">number + version identifies a service; procedure</text>
<text x="779.0" y="343" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">number identifies an operation. Used by some</text>
<text x="779.0" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">NFS-related services. Example: 111 → service location,</text>
<text x="779.0" y="401" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">depending on version.</text>
<rect x="20" y="463" width="1460" height="192" rx="20" fill="#183b59" stroke="#8098ae" />
<text x="42" y="497" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#ffffff">Evidence boundary</text>
<rect x="52.0" y="521" width="1396.0" height="116" rx="13" fill="#e9f2ff" stroke="#8098ae" />
<text x="68.0" y="549" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Important exception</text>
<text x="68.0" y="588" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">NFSv4.1 commonly uses TCP 2049 directly; 111 is not a mandatory stop. Not querying rpcbind does not mean not</text>
<text x="68.0" y="617" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#183b59">using RPC.</text></g></svg>
