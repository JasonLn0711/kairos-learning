<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 890" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="m0905-f3-zh-title m0905-f3-zh-desc"><title id="m0905-f3-zh-title">身分竊用，不只是帳號被盜</title><desc id="m0905-f3-zh-desc">帳號接管與冒名申辦是兩種相關風險，資料外洩本身不能證明已發生身分竊用。</desc><defs><marker id="m0905-f3-zh-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#193449" /></marker><marker id="m0905-f3-zh-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#536b7d" /></marker><marker id="m0905-f3-zh-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2774a7" /></marker><marker id="m0905-f3-zh-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b14d55" /></marker><marker id="m0905-f3-zh-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#18785d" /></marker><marker id="m0905-f3-zh-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#946c19" /></marker></defs><rect width="680" height="890" fill="#f7fafc" /><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="30" y="36" font-size="17" fill="#2774a7" font-weight="700" text-anchor="start">CEH M09-05  /  IDENTITY</text><text x="30" y="83" font-size="30" fill="#193449" font-weight="700" text-anchor="start">身分竊用，不只是帳號被盜</text><text x="30" y="121" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">區分資料暴露、帳號接管與冒名使用。</text><rect x="30" y="160" width="620" height="100" rx="18" fill="#fff6dd" stroke="#946c19" stroke-width="1.5" /><text x="50" y="196" font-size="24" fill="#946c19" font-weight="700" text-anchor="start">身分資料遭不當取得／利用</text><text x="50" y="228" font-size="22" fill="#193449" font-weight="400" text-anchor="start">例如姓名、證件資料或驗證資訊。</text><path d="M340 260 L340 310" fill="none" stroke="#536b7d" stroke-width="2" stroke-dasharray="3 6" /><rect x="30" y="310" width="620" height="100" rx="18" fill="#fff0f1" stroke="#b14d55" stroke-width="1.5" /><text x="50" y="346" font-size="24" fill="#b14d55" font-weight="700" text-anchor="start">身分竊用：冒用他人的身分</text><text x="50" y="378" font-size="22" fill="#193449" font-weight="400" text-anchor="start">不只發生在網路帳號，也可能涉及申辦服務。</text><path d="M340 410 L190 475" fill="none" stroke="#536b7d" stroke-width="2" stroke-dasharray="3 6" /><path d="M340 410 L490 475" fill="none" stroke="#536b7d" stroke-width="2" stroke-dasharray="3 6" /><rect x="30" y="475" width="300" height="140" rx="18" fill="#fff0f1" stroke="#b14d55" stroke-width="1.5" /><text x="50" y="511" font-size="24" fill="#b14d55" font-weight="700" text-anchor="start">既有帳號遭接管</text><text x="50" y="543" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Account Takeover</text><text x="50" y="575" font-size="22" fill="#193449" font-weight="400" text-anchor="start">登入既有帳號</text><text x="50" y="607" font-size="22" fill="#193449" font-weight="400" text-anchor="start">只是其中一種風險</text><rect x="350" y="475" width="300" height="140" rx="18" fill="#fff0f1" stroke="#b14d55" stroke-width="1.5" /><text x="370" y="511" font-size="24" fill="#b14d55" font-weight="700" text-anchor="start">冒名建立新關係</text><text x="370" y="543" font-size="22" fill="#193449" font-weight="400" text-anchor="start">例如冒名申辦服務</text><text x="370" y="575" font-size="22" fill="#193449" font-weight="400" text-anchor="start">可能完全沒有</text><text x="370" y="607" font-size="22" fill="#193449" font-weight="400" text-anchor="start">接管既有帳號</text><rect x="30" y="665" width="620" height="132" rx="18" fill="#eaf7f1" stroke="#18785d" stroke-width="1.5" /><text x="50" y="701" font-size="24" fill="#18785d" font-weight="700" text-anchor="start">資料外洩 ≠ 已證實身分竊用</text><text x="50" y="733" font-size="22" fill="#193449" font-weight="400" text-anchor="start">外洩增加風險；仍要找出是否實際遭冒用。</text><text x="50" y="765" font-size="22" fill="#193449" font-weight="400" text-anchor="start">不要把可能後果寫成已發生的事實。</text><text x="30" y="850" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">點線：概念關聯，不表示必然發生。</text></g></svg>