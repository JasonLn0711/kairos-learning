<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 930.4" role="img" aria-labelledby="m0505-groups-en-title m0505-groups-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0505-groups-en-title">Figure 2 | Four CVSS v4.0 metric groups</title><desc id="m0505-groups-en-desc">Each group has a different purpose. Supplemental does not change the score. Rows are for reading, not a sequence.</desc><g font-family="system-ui,sans-serif"><text x="28" y="42.0" font-size="26" fill="#18252c" font-weight="700">Figure 2 | Four CVSS v4.0 metric groups</text><text x="28" y="96.80000000000001" font-size="20" fill="#18252c">Each group has a different purpose. Supplemental does not change</text><text x="28" y="132.8" font-size="20" fill="#18252c">the score. Rows are for reading, not a sequence.</text><rect x="28" y="188.8" width="844" height="165.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="222.8" font-size="23" fill="#18252c" font-weight="700">Base</text><text x="48" y="264.2" font-size="20" fill="#18252c">What intrinsic technical characteristics and possible</text><text x="48" y="300.2" font-size="20" fill="#18252c">consequences does the vulnerability have?</text><rect x="28" y="372.20000000000005" width="844" height="165.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="406.20000000000005" font-size="23" fill="#18252c" font-weight="700">Threat</text><text x="48" y="447.6" font-size="20" fill="#18252c">Are exploitation techniques available, or has exploitation</text><text x="48" y="483.6" font-size="20" fill="#18252c">activity occurred?</text><rect x="28" y="555.6" width="844" height="165.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="589.6" font-size="23" fill="#18252c" font-weight="700">Environmental</text><text x="48" y="631.0" font-size="20" fill="#18252c">How do system importance, defenses and actual conditions differ</text><text x="48" y="667.0" font-size="20" fill="#18252c">in my company?</text><rect x="28" y="739.0" width="844" height="165.4" rx="14" fill="#ffffff" stroke="#94a3b8" /><text x="48" y="773.0" font-size="23" fill="#18252c" font-weight="700">Supplemental</text><text x="48" y="814.4" font-size="20" fill="#18252c">What else matters, such as recovery difficulty? These metrics</text><text x="48" y="850.4" font-size="20" fill="#18252c">do not change the CVSS score.</text></g></svg>
