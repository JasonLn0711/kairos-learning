<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 754" role="img" aria-labelledby="m0305-evidence-en-title m0305-evidence-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0305-evidence-en-title">Four layers of service evidence</title>
<desc id="m0305-evidence-en-desc">Arrows show the verification order, not automatic access or a confirmed vulnerability. Preserve sources and limits at each step.</desc>
<defs><marker id="m0305-evidence-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="752" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">Four layers of service evidence</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Arrows show the verification order, not automatic access or a</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">confirmed vulnerability. Preserve sources and limits at each</text>
<text x="28" y="116" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">step.</text>
<rect x="28" y="159" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="188" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">1 | Port label</text>
<text x="48" y="215" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">A port-name table suggests a common service; it does not</text>
<text x="48" y="238" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">verify its identity.</text>
<path d="M320 275V300" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0305-evidence-en-arrow)" />
<rect x="28" y="304" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="333" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">2 | Response clues</text>
<text x="48" y="360" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Keep banners and probe responses, and record the tool’s</text>
<text x="48" y="383" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">identification.</text>
<path d="M320 420V445" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0305-evidence-en-arrow)" />
<rect x="28" y="449" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="478" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">3 | Internal checks</text>
<text x="48" y="505" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Verify proxy placement, the running service, full package</text>
<text x="48" y="528" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">version and settings.</text>
<path d="M320 565V590" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0305-evidence-en-arrow)" />
<rect x="28" y="594" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="623" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">4 | Patch assessment</text>
<text x="48" y="650" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Check vendor advisories, backported fixes and required</text>
<text x="48" y="673" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">conditions before concluding.</text>
</svg>
