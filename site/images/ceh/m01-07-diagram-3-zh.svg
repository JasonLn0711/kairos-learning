<svg xmlns="http://www.w3.org/2000/svg" width="800" height="840" viewBox="0 0 800 840" role="img" aria-labelledby="title desc" xml:lang="zh"><title id="title">從告警到事件應變</title><desc id="desc">大量下載不等於已證實入侵。這是方便閱讀的教學順序；保全、圍堵與調查可能並行或反覆，不能為等齊證據而延誤必要處置。 觀察與告警 Event / Alert: 系統記錄大量下載並發出通知：先區分觀察事實與需要查證的推測。 查證 Triage: 比對身分與權限、時間與來源、資料內容、業務核准，以及原始日誌的完整性與時間一致性。 依證據判定: 合理且已授權：記錄理由；證據不足：保留紀錄並補查；疑似或確認事件：依分級程序啟動應變。 證據保全與圍堵: 依程序保存紀錄並限制損害，不是一律先關機或刪檔；兼顧服務與病人安全。 根除與復原: 處理已確認原因與受影響元件，驗證服務可靠且可用。 改善與並行義務: 檢查流程缺口、更新控制；通知義務、法遵與服務衝擊要並行評估。</desc><rect width="800" height="840" fill="#f2f6f5"/><g font-family="system-ui, sans-serif"><text x="32" y="42" font-size="18" font-weight="700" fill="#18252c">從告警到事件應變</text><text x="32" y="76" font-size="18" font-weight="400" fill="#18252c">大量下載不等於已證實入侵。這是方便閱讀的教學順序；保全、圍堵與調查可</text><text x="32" y="102" font-size="18" font-weight="400" fill="#18252c">能並行或反覆，不能為等齊證據而延誤必要處置。</text><rect x="24" y="152" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="182" font-size="18" font-weight="700" fill="#18252c">1. 觀察與告警 Event / Alert</text><text x="42" y="212" font-size="18" font-weight="400" fill="#18252c">系統記錄大量下載並發出通知：先區分觀察事實與需要查證的推測。</text><rect x="24" y="256" width="752" height="112" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="286" font-size="18" font-weight="700" fill="#18252c">2. 查證 Triage</text><text x="42" y="316" font-size="18" font-weight="400" fill="#18252c">比對身分與權限、時間與來源、資料內容、業務核准，以及原始日誌的完整性</text><text x="42" y="342" font-size="18" font-weight="400" fill="#18252c">與時間一致性。</text><rect x="24" y="386" width="752" height="112" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="416" font-size="18" font-weight="700" fill="#18252c">3. 依證據判定</text><text x="42" y="446" font-size="18" font-weight="400" fill="#18252c">合理且已授權：記錄理由；證據不足：保留紀錄並補查；疑似或確認事件：依</text><text x="42" y="472" font-size="18" font-weight="400" fill="#18252c">分級程序啟動應變。</text><rect x="24" y="516" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="546" font-size="18" font-weight="700" fill="#18252c">4. 證據保全與圍堵</text><text x="42" y="576" font-size="18" font-weight="400" fill="#18252c">依程序保存紀錄並限制損害，不是一律先關機或刪檔；兼顧服務與病人安全。</text><rect x="24" y="620" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="650" font-size="18" font-weight="700" fill="#18252c">5. 根除與復原</text><text x="42" y="680" font-size="18" font-weight="400" fill="#18252c">處理已確認原因與受影響元件，驗證服務可靠且可用。</text><rect x="24" y="724" width="752" height="86" rx="9" fill="#ffffff" stroke="#53676e"/><text x="42" y="754" font-size="18" font-weight="700" fill="#18252c">6. 改善與並行義務</text><text x="42" y="784" font-size="18" font-weight="400" fill="#18252c">檢查流程缺口、更新控制；通知義務、法遵與服務衝擊要並行評估。</text></g></svg>
