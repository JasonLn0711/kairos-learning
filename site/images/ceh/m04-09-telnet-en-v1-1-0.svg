<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495.54" role="img" aria-labelledby="m0409-telnet-en-title m0409-telnet-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-telnet-en-title">Telnet: distinguish a prompt from a post-login screen</title><desc id="m0409-telnet-en-desc">The reference includes a guest login and welcome text. Synthetic terminal records distinguish the states here; no connection was made to the pictured site. The columns compare states, not guaranteed login success.</desc><defs><marker id="m0409-telnet-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Telnet: distinguish a prompt from a post-login screen</text><rect x="40.0" y="101.6" width="442.5" height="268" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56.0" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Login prompt only</text><text x="56.0" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">login:</text><text x="56.0" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">This establishes a responsive</text><text x="56.0" y="233.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">sign-in entry point, with no</text><text x="56.0" y="265.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">evidence that an account</text><text x="56.0" y="297.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">authenticated.</text><rect x="517.5" y="101.6" width="442.5" height="268" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="533.5" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Synthetic post-login example</text><text x="533.5" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">login: guest
Welcome to the</text><text x="533.5" y="201.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">training terminal.</text><text x="533.5" y="233.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Welcome text is another</text><text x="533.5" y="265.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">observation level; commands and</text><text x="533.5" y="297.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">resources remain subject to</text><text x="533.5" y="329.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">account permissions.</text><text x="28" y="434.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The reference includes a guest login and welcome text. Synthetic terminal</text><text x="28" y="466.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">records distinguish the states here; no connection was made to the pictured</text><text x="28" y="498.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">site. The columns compare states, not guaranteed login success.</text></g></svg>
