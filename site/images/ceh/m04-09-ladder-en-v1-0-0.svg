<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 915.84" role="img" aria-labelledby="m0409-ladder-en-title m0409-ladder-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0409-ladder-en-title">Five levels of service evidence</title><desc id="m0409-ladder-en-desc">Read downward as a comparison of evidence strength; arrows are neither a universal login process nor automatic privilege gains.</desc><defs><marker id="m0409-ladder-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="38.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Five levels of service evidence</text><rect x="40" y="101.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="133.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">1. Discover a service</text><text x="56" y="169.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">There appears to be an entry point.</text><path d="M500 221.6V251.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ladder-en-arrow)" /><rect x="40" y="267.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="299.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">2. Receive a response</text><text x="56" y="335.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Someone answers the knock.</text><path d="M500 387.6V417.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ladder-en-arrow)" /><rect x="40" y="433.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="465.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">3. Obtain information</text><text x="56" y="501.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The service reveals some information.</text><path d="M500 553.6V583.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ladder-en-arrow)" /><rect x="40" y="599.6" width="920" height="108" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="56" y="631.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">4. Authenticate</text><text x="56" y="667.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">The service confirms your identity.</text><path d="M500 719.6V749.6" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0409-ladder-en-arrow)" /><rect x="40" y="765.6" width="920" height="108" rx="16" fill="#e4f3eb" stroke="#387c65" stroke-width="2" /><text x="56" y="797.6" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">5. Obtain and verify permissions</text><text x="56" y="833.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Establish which operations you may perform.</text><text x="28" y="933.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Read downward as a comparison of evidence strength; arrows are neither a</text><text x="28" y="965.6" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">universal login process nor automatic privilege gains.</text></g></svg>
