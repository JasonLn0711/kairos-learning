<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="m0205-f2-en-title m0205-f2-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0205-f2-en-title">2 | Read the timeline and trusted origin</title>
<desc id="m0205-f2-en-desc">New Received entries are prepended. Read the timeline upward; validate outward from a trusted receiver.</desc>
<defs><marker id="m0205-f2-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="598" height="698" rx="20" fill="#f8fafc" stroke="#b7c7d5" />
<text x="300" y="38" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">2 | Read the timeline and trusted origin</text>
<rect x="32" y="68" width="536" height="100" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="300" y="97" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Top: newer Received entry</text>
<text x="300" y="124" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Added by your trusted receiving service</text>
<text x="300" y="151" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Start with this hop and its results</text>
<rect x="32" y="196" width="536" height="100" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="300" y="225" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Trust boundary: defined by the service</text>
<text x="300" y="252" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Trusted Authentication-Results source</text>
<text x="300" y="279" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Confirm with local settings and logs</text>
<rect x="32" y="324" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="300" y="353" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Lower: earlier Received entries</text>
<text x="300" y="380" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Carried in the incoming message</text>
<text x="300" y="407" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Correlate times, hops, and logs</text>
<rect x="32" y="452" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="300" y="481" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Two directions for analysis</text>
<text x="300" y="508" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Time order: bottom ↑ top</text>
<text x="300" y="535" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Trust: your receiver → external hops</text>
<text x="300" y="608" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Cards compare fields and reading directions</text>
<text x="300" y="634" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Preserve the original header order and content</text>
</svg>