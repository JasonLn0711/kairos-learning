<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 817.2" role="img" aria-labelledby="m0503-evidence-en-title m0503-evidence-en-desc" preserveAspectRatio="xMidYMid meet"><title id="m0503-evidence-en-title">Figure 5 | Accumulate vulnerability evidence step by step</title><desc id="m0503-evidence-en-desc">Arrows indicate work order. Controlled validation must be necessary and authorized.</desc><defs><marker id="m0503-evidence-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#47748e" /></marker></defs><g transform="scale(0.9)"><text x="28" y="42.0" font-family="Noto Sans CJK TC,sans-serif" font-size="26" fill="#183b59">Figure 5 | Accumulate vulnerability evidence step by step</text><text x="28" y="108.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Arrows indicate work order. Controlled validation must be necessary and</text><text x="28" y="140.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">authorized.</text><rect x="40.0" y="202" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="236.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Find a clue</text><text x="60.0" y="273.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">A tool reports a potentially vulnerable package</text><path d="M500 337V365" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-en-arrow)" /><rect x="40.0" y="381" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="415.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Check the required conditions</text><text x="60.0" y="452.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Confirm version, configuration, impact conditions and policy</text><path d="M500 516V544" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-en-arrow)" /><rect x="40.0" y="560" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="594.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Validate within authorization</text><text x="60.0" y="631.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Perform a controlled test if necessary and record results</text><path d="M500 695V723" fill="none" stroke="#47748e" stroke-width="3" marker-end="url(#m0503-evidence-en-arrow)" /><rect x="40.0" y="739" width="920.0" height="121" rx="16" fill="#f1f6fa" stroke="#47748e" stroke-width="2" /><text x="60.0" y="773.0" font-family="Noto Sans CJK TC,sans-serif" font-size="23" fill="#183b59">Assess impact, fix and retest</text><text x="60.0" y="810.0" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#183b59">Confirm that the defect is fixed and normal functionality remains</text></g></svg>
