<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">收件完整性檢核四狀態草圖</title><desc id="desc">四格分別為輸入、處理中、缺漏及完成。處理中適用未來耗時操作，本機短暫同步檢查不刻意加入等待。</desc>
<rect width="960" height="640" fill="#fff"/>
<g fill="#f2f6f5" stroke="#64748b"><rect x="20" y="20" width="440" height="280" rx="8"/><rect x="500" y="20" width="440" height="280" rx="8"/><rect x="20" y="340" width="440" height="280" rx="8"/><rect x="500" y="340" width="440" height="280" rx="8"/></g>
<g font-family="sans-serif" font-size="22" fill="#18252c">
<text x="40" y="60">輸入</text><text x="40" y="110">申請編號、申請人代號、文件類型</text><text x="40" y="155">三欄皆必填；只用合成資料</text><text x="40" y="210">［檢查資料］</text>
<text x="520" y="60">處理中（耗時操作才需要）</text><text x="520" y="110">正在檢查，請稍候</text><text x="520" y="155">避免重複提交，保留輸入</text><text x="520" y="210">失敗或逾時需有重試方法</text>
<text x="40" y="380">缺漏</text><text x="40" y="430">缺少文件類型，請補填</text><text x="40" y="475">保留申請編號與申請人代號</text><text x="40" y="530">［重新檢查］；無完整下載</text>
<text x="520" y="380">完成</text><text x="520" y="430">三個必要欄位完整</text><text x="520" y="475">預覽 JSON；不代表正式受理</text><text x="520" y="530">［匯出完整報告］</text><text x="520" y="575">修改輸入後需重新檢查</text>
</g></svg>
