<svg xmlns="http://www.w3.org/2000/svg" width="720" height="686" viewBox="0 0 720 686" role="img" aria-labelledby="title desc"><title id="title">Store files, notify with events, process data</title><desc id="desc">This restates the document example: SMB stores files, Kafka carries events, and applications do the work.</desc><rect width="720" height="686" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">Store files, notify with events, process data</text><text x="30" y="69" font-size="16" font-weight="400">This restates the document example: SMB stores files, Kafka carries events,</text><text x="30" y="95" font-size="16" font-weight="400">and applications do the work.</text><rect x="30" y="141" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="168" font-size="16" font-weight="650">User → SMB</text><text x="46" y="194" font-size="16" font-weight="400">Save a PDF on the file server.</text><text x="42" y="241" font-size="16" font-weight="400">↓ Watcher observes the file</text><rect x="30" y="279" width="660" height="80" rx="12" fill="#e8f0ef" stroke="#778d80"/><text x="46" y="306" font-size="16" font-weight="650">Watcher → Kafka</text><text x="46" y="332" font-size="16" font-weight="400">Publish document.uploaded with location and identifier.</text><text x="42" y="379" font-size="16" font-weight="400">↓ Consume document.uploaded</text><rect x="30" y="417" width="660" height="106" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="444" font-size="16" font-weight="650">AI service</text><text x="46" y="470" font-size="16" font-weight="400">Read the event, then read the PDF from SMB with permission and analyze</text><text x="46" y="496" font-size="16" font-weight="400">it.</text><text x="42" y="543" font-size="16" font-weight="400">↓ Completion event</text><rect x="30" y="581" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="608" font-size="16" font-weight="650">Reporting service</text><text x="46" y="634" font-size="16" font-weight="400">Receive a completion event, produce the report, and notify the user.</text></g></svg>
