<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1057" viewBox="0 0 720 1057" role="img" aria-labelledby="title desc"><title id="title">Active / Passive: who initiates data connections?</title><desc id="desc">Arrows show connection initiation, not file-byte direction. In either mode, downloads flow Server → Client and uploads Client → Server. Commands and replies travel both ways on the established control connection.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#476195"/></marker></defs><rect width="720" height="100%" rx="16" fill="#f7f5ef"/><g font-family="system-ui,sans-serif" fill="#303632"><text x="360" y="40" text-anchor="middle" font-size="23">Active / Passive: who initiates data connections?</text><text x="360" y="86.80000000000001" text-anchor="middle" font-size="20">Active Mode</text><g stroke="#416b82" fill="none" stroke-width="2"><rect x="68" y="118.80000000000001" width="44" height="28" rx="3"/><path d="M62 152.8h56l-6-6H68z"/><rect x="610" y="115.80000000000001" width="34" height="40" rx="3"/><path d="M610 128.8h34M610 141.8h34"/></g><text x="90" y="179.8" text-anchor="middle">Client</text><text x="630" y="179.8" text-anchor="middle">Server</text><rect x="30" y="193.8" width="660" height="108" rx="12" fill="#fff" stroke="#b2c0b7"/><text x="360" y="216.8" text-anchor="middle" font-size="15">Control connection initiation</text><text x="360" y="240.8" text-anchor="middle" font-size="17">Control connection → TCP 21</text><path d="M95 274.0H625" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="316.0" width="660" height="108" rx="12" fill="#fff" stroke="#b2c0b7"/><text x="360" y="339.0" text-anchor="middle" font-size="15">Data connection initiation</text><text x="360" y="363.0" text-anchor="middle" font-size="17">Data: traditional source TCP 20</text><path d="M625 396.2H95" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="448.2" text-anchor="middle" font-size="15">Client provides an endpoint with PORT/EPRT. TCP 20 is a traditional</text><text x="360" y="472.2" text-anchor="middle" font-size="15">source port, not a universal requirement.</text><text x="360" y="516.2" text-anchor="middle" font-size="20">Passive Mode</text><g stroke="#416b82" fill="none" stroke-width="2"><rect x="68" y="548.2" width="44" height="28" rx="3"/><path d="M62 582.2h56l-6-6H68z"/><rect x="610" y="545.2" width="34" height="40" rx="3"/><path d="M610 558.2h34M610 571.2h34"/></g><text x="90" y="609.2" text-anchor="middle">Client</text><text x="630" y="609.2" text-anchor="middle">Server</text><rect x="30" y="623.2" width="660" height="108" rx="12" fill="#fff" stroke="#b2c0b7"/><text x="360" y="646.2" text-anchor="middle" font-size="15">Control connection initiation</text><text x="360" y="670.2" text-anchor="middle" font-size="17">Control connection → TCP 21</text><path d="M95 703.4000000000001H625" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="745.4000000000001" width="660" height="108" rx="12" fill="#fff" stroke="#b2c0b7"/><text x="360" y="768.4000000000001" text-anchor="middle" font-size="15">Data connection initiation</text><text x="360" y="792.4000000000001" text-anchor="middle" font-size="17">Negotiated server data port (e.g. 50001)</text><path d="M95 825.6000000000001H625" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="877.6000000000001" text-anchor="middle" font-size="15">Client requests the server endpoint with PASV/EPSV, then connects to</text><text x="360" y="901.6000000000001" text-anchor="middle" font-size="15">it. 50001 is illustrative, not fixed or necessarily random.</text><text x="360" y="945.6000000000001" text-anchor="middle" font-size="15">Arrows show connection initiation, not file-byte direction. In either</text><text x="360" y="969.6000000000001" text-anchor="middle" font-size="15">mode, downloads flow Server → Client and uploads Client → Server.</text><text x="360" y="993.6000000000001" text-anchor="middle" font-size="15">Commands and replies travel both ways on the established control</text><text x="360" y="1017.6000000000001" text-anchor="middle" font-size="15">connection.</text></g></svg>
