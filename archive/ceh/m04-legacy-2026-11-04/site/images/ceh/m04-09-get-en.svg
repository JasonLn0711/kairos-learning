<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
<title id="title">Web supplement: one GET request and response</title><desc id="desc">Synthetic example; a read result does not establish write or login access.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42675b"/></marker></defs>
<rect width="800" height="650" rx="20" fill="#f7f8f5"/>
<text x="30" y="45" font-family="sans-serif" font-size="24" fill="#173d35">Web supplement: one GET request and response</text>
<rect x="30" y="80" width="740" height="120" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="52" y="122" font-family="sans-serif" font-size="23" fill="#173d35">Manager → Agent | Request</text>
<text x="52" y="164" font-family="sans-serif" font-size="20" fill="#253b33">GET sysName.0</text>
<path d="M400 206 V238" stroke="#42675b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="250" width="740" height="120" rx="14" fill="#e8f0f1" stroke="#677c73"/>
<text x="52" y="292" font-family="sans-serif" font-size="23" fill="#173d35">Agent | Check access scope</text>
<text x="52" y="334" font-family="sans-serif" font-size="20" fill="#253b33">Process the identity, settings, and MIB view.</text>
<path d="M400 376 V408" stroke="#42675b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="420" width="740" height="120" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="52" y="462" font-family="sans-serif" font-size="23" fill="#173d35">Agent → Manager | Response</text>
<text x="52" y="504" font-family="sans-serif" font-size="20" fill="#253b33">lab-switch-01: evidence of this read.</text>
<text x="30" y="605" font-family="sans-serif" font-size="18" fill="#253b33">Synthetic example; a read result does not establish write or login access.</text>
</svg>
