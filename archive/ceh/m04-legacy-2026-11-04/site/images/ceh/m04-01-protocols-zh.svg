<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc"><title id="title">不同協定，查不同資料</title><desc id="desc">共同問題：哪些身分取得哪些資訊？是否符合業務需要？</desc><rect width="720" height="610" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">不同協定，查不同資料</text><text x="30" y="69" font-size="16" font-weight="400">共同問題：哪些身分取得哪些資訊？是否符合業務需要？</text><rect x="30" y="115" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="142" font-size="16" font-weight="650">DNS → 查詢</text><text x="46" y="168" font-size="16" font-weight="400">主機名稱、DNS 記錄</text><rect x="30" y="209" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="236" font-size="16" font-weight="650">SMB → 查詢</text><text x="46" y="262" font-size="16" font-weight="400">共用資料夾、部分伺服器資訊</text><rect x="30" y="303" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="330" font-size="16" font-weight="650">LDAP → 查詢</text><text x="46" y="356" font-size="16" font-weight="400">帳號、群組、物件</text><rect x="30" y="397" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="424" font-size="16" font-weight="650">SNMP → 查詢</text><text x="46" y="450" font-size="16" font-weight="400">設備、介面與管理資料</text><rect x="30" y="491" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="518" font-size="16" font-weight="650">SMTP → 查詢</text><text x="46" y="544" font-size="16" font-weight="400">郵件服務允許查詢的資訊</text></g></svg>
