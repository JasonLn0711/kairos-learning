<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">網頁補充：同時驗證限制與正常功能</title><desc id="desc">兩項獨立檢查都要符合預期政策；這不是雙因素認證。</desc>
<rect width="960" height="440" rx="20" fill="#f7f8f5"/>
<text x="30" y="48" font-family="sans-serif" font-size="24" fill="#173d35">網頁補充：同時驗證限制與正常功能</text>
<rect x="30" y="90" width="440" height="230" rx="14" fill="#edf2ed" stroke="#677c73"/>
<path d="M50 120 h26 v18 h-26 z m5 24 h16" fill="none" stroke="#45695b" stroke-width="2"/>
<text x="48" y="185" font-family="sans-serif" font-size="21" fill="#173d35">訪客來源：限制資訊</text>
<text x="48" y="230" font-family="sans-serif" font-size="17" fill="#253b33">確認受限資訊未被取得，並核對規則與日誌。</text>
<rect x="490" y="90" width="440" height="230" rx="14" fill="#eaf2f5" stroke="#677c73"/>
<path d="M510 120 h26 v18 h-26 z m5 24 h16" fill="none" stroke="#45695b" stroke-width="2"/>
<text x="508" y="185" font-family="sans-serif" font-size="21" fill="#173d35">監控來源：保留功能</text>
<text x="508" y="230" font-family="sans-serif" font-size="17" fill="#253b33">確認獲准身分的必要查詢仍正常。</text>
<text x="30" y="380" font-family="sans-serif" font-size="18" fill="#253b33">兩項獨立檢查都要符合預期政策；這不是雙因素認證。</text>
</svg>
