<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Web supplement: four distinct RPC observations</title><desc id="desc">Verify each separately; one observation does not establish the others.</desc>
<rect width="960" height="600" rx="20" fill="#f7f8f5"/>
<text x="30" y="45" font-family="sans-serif" font-size="24" fill="#173d35">Web supplement: four distinct RPC observations</text>
<rect x="30" y="90" width="440" height="170" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="48" y="140" font-family="sans-serif" font-size="23" fill="#173d35">Registration found</text>
<text x="48" y="190" font-family="sans-serif" font-size="17" fill="#253b33">Lab-A / TCP 35001: mapping data.</text>
<rect x="490" y="90" width="440" height="170" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="508" y="140" font-family="sans-serif" font-size="23" fill="#173d35">Endpoint reachable</text>
<text x="508" y="190" font-family="sans-serif" font-size="17" fill="#253b33">Connection evidence from this source.</text>
<rect x="30" y="295" width="440" height="170" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="48" y="345" font-family="sans-serif" font-size="23" fill="#173d35">Authentication succeeds</text>
<text x="48" y="395" font-family="sans-serif" font-size="17" fill="#253b33">The service accepts this identity.</text>
<rect x="490" y="295" width="440" height="170" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="508" y="345" font-family="sans-serif" font-size="23" fill="#173d35">Operation authorized</text>
<text x="508" y="395" font-family="sans-serif" font-size="17" fill="#253b33">This identity may perform a specific operation.</text>
<text x="30" y="545" font-family="sans-serif" font-size="18" fill="#253b33">Verify each separately; one observation does not establish the others.</text>
</svg>
