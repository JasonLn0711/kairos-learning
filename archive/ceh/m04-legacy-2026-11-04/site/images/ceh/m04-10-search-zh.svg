<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">網頁補充：一次受限的 LDAP 搜尋</title><desc id="desc">合成讀取結果；不代表完整盤點或修改權限。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42675b"/></marker></defs><rect width="900" height="650" rx="20" fill="#f7f8f5"/>
<text x="30" y="45" font-family="sans-serif" font-size="24" fill="#173d35">網頁補充：一次受限的 LDAP 搜尋</text>
<rect x="30" y="80" width="840" height="120" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="52" y="120" font-family="sans-serif" font-size="23" fill="#173d35">用戶端 → 目錄｜搜尋條件</text>
<text x="52" y="163" font-family="sans-serif" font-size="18" fill="#253b33">Base: ou=People,dc=example,dc=test; one; (cn=Mei); cn, mail</text>
<path d="M450 206 V238" stroke="#42675b" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="250" width="840" height="120" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="52" y="290" font-family="sans-serif" font-size="23" fill="#173d35">目錄｜依授權與限制處理</text>
<text x="52" y="333" font-family="sans-serif" font-size="18" fill="#253b33">搜尋範圍、條件、讀取權限與查詢限制。</text>
<path d="M450 376 V408" stroke="#42675b" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="420" width="840" height="120" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="52" y="460" font-family="sans-serif" font-size="23" fill="#173d35">目錄 → 用戶端｜本次回覆</text>
<text x="52" y="503" font-family="sans-serif" font-size="18" fill="#253b33">Mei / mei@example.test</text>
<text x="30" y="605" font-family="sans-serif" font-size="18" fill="#253b33">合成讀取結果；不代表完整盤點或修改權限。</text>
</svg>
