<svg xmlns="http://www.w3.org/2000/svg" width="720" height="858" viewBox="0 0 720 858" role="img" aria-labelledby="title desc"><title id="title">A simplified SMB connection</title><desc id="desc">An existing session may be reused; guest access depends on configuration. Permissions still apply.</desc><rect width="720" height="858" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">A simplified SMB connection</text><text x="30" y="69" font-size="16" font-weight="400">An existing session may be reused; guest access depends on configuration.</text><text x="30" y="95" font-size="16" font-weight="400">Permissions still apply.</text><text x="30" y="141" font-size="16" font-weight="650">Client</text><text x="480" y="141" font-size="16" font-weight="650">File server</text><rect x="65" y="171" width="590" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="81" y="198" font-size="16" font-weight="650">Connect</text><text x="81" y="224" font-size="16" font-weight="400">Reach the file server</text><path d="M40 273H680" stroke="#778d80"/><text x="30" y="278" font-size="16" font-weight="400">←</text><text x="675" y="278" font-size="16" font-weight="400">→</text><rect x="65" y="303" width="590" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="81" y="330" font-size="16" font-weight="650">Negotiate</text><text x="81" y="356" font-size="16" font-weight="400">Agree on version and security capabilities</text><path d="M40 405H680" stroke="#778d80"/><text x="30" y="410" font-size="16" font-weight="400">←</text><text x="675" y="410" font-size="16" font-weight="400">→</text><rect x="65" y="435" width="590" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="81" y="462" font-size="16" font-weight="650">Authenticate</text><text x="81" y="488" font-size="16" font-weight="400">Establish the identity</text><path d="M40 537H680" stroke="#778d80"/><text x="30" y="542" font-size="16" font-weight="400">←</text><text x="675" y="542" font-size="16" font-weight="400">→</text><rect x="65" y="567" width="590" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="81" y="594" font-size="16" font-weight="650">Authorize</text><text x="81" y="620" font-size="16" font-weight="400">Check the requested resource operation</text><text x="470" y="669" font-size="16" font-weight="400">Server checks ↓</text><rect x="65" y="701" width="590" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="81" y="728" font-size="16" font-weight="650">Transfer</text><text x="81" y="754" font-size="16" font-weight="400">Read or change data when permitted</text><path d="M40 803H680" stroke="#778d80"/><text x="30" y="808" font-size="16" font-weight="400">←</text><text x="675" y="808" font-size="16" font-weight="400">→</text><path d="M30 171V833M690 171V833" fill="none" stroke="#778d80"/></g></svg>
