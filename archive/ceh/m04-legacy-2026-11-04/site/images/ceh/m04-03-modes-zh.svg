<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1009" viewBox="0 0 720 1009" role="img" aria-labelledby="title desc"><title id="title">Active／Passive：誰建立資料連線？</title><desc id="desc">箭頭表示連線發起方向，不是檔案流向。兩種模式下載皆 Server → Client，上傳皆 Client → Server；控制連線建立後，命令與回覆可雙向傳送。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#476195"/></marker></defs><rect width="720" height="100%" rx="16" fill="#f7f5ef"/><g font-family="system-ui,sans-serif" fill="#303632"><text x="360" y="40" text-anchor="middle" font-size="23">Active／Passive：誰建立資料連線？</text><text x="360" y="86.80000000000001" text-anchor="middle" font-size="20">Active Mode · 主動模式</text><g stroke="#416b82" fill="none" stroke-width="2"><rect x="68" y="118.80000000000001" width="44" height="28" rx="3"/><path d="M62 152.8h56l-6-6H68z"/><rect x="610" y="115.80000000000001" width="34" height="40" rx="3"/><path d="M610 128.8h34M610 141.8h34"/></g><text x="90" y="179.8" text-anchor="middle">Client</text><text x="630" y="179.8" text-anchor="middle">Server</text><rect x="30" y="193.8" width="660" height="108" rx="12" fill="#fff" stroke="#b2c0b7"/><text x="360" y="216.8" text-anchor="middle" font-size="15">連線建立 / Initiation</text><text x="360" y="240.8" text-anchor="middle" font-size="17">控制連線 → TCP 21</text><path d="M95 274.0H625" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="316.0" width="660" height="108" rx="12" fill="#e8eef7" stroke="#b2c0b7"/><text x="360" y="339.0" text-anchor="middle" font-size="15">資料連線建立 / Data initiation</text><text x="360" y="363.0" text-anchor="middle" font-size="17">資料連線：傳統常用來源 TCP 20</text><path d="M625 396.2H95" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="448.2" text-anchor="middle" font-size="15">Client 用 PORT／EPRT 提供接收端點。TCP 20 是傳統常見來源埠，並非所有 F</text><text x="360" y="472.2" text-anchor="middle" font-size="15">TP 資料連線都使用它。</text><text x="360" y="516.2" text-anchor="middle" font-size="20">Passive Mode · 被動模式</text><g stroke="#416b82" fill="none" stroke-width="2"><rect x="68" y="548.2" width="44" height="28" rx="3"/><path d="M62 582.2h56l-6-6H68z"/><rect x="610" y="545.2" width="34" height="40" rx="3"/><path d="M610 558.2h34M610 571.2h34"/></g><text x="90" y="609.2" text-anchor="middle">Client</text><text x="630" y="609.2" text-anchor="middle">Server</text><rect x="30" y="623.2" width="660" height="108" rx="12" fill="#fff" stroke="#b2c0b7"/><text x="360" y="646.2" text-anchor="middle" font-size="15">連線建立 / Initiation</text><text x="360" y="670.2" text-anchor="middle" font-size="17">控制連線 → TCP 21</text><path d="M95 703.4000000000001H625" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="745.4000000000001" width="660" height="108" rx="12" fill="#e8eef7" stroke="#b2c0b7"/><text x="360" y="768.4000000000001" text-anchor="middle" font-size="15">資料連線建立 / Data initiation</text><text x="360" y="792.4000000000001" text-anchor="middle" font-size="17">伺服器協商的資料埠（例：50001）</text><path d="M95 825.6000000000001H625" fill="none" stroke="#476195" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="877.6000000000001" text-anchor="middle" font-size="15">Client 用 PASV／EPSV 取得伺服器提供的資料端點，再主動連入。50001 是例</text><text x="360" y="901.6000000000001" text-anchor="middle" font-size="15">子，不代表固定或必須隨機選埠。</text><text x="360" y="945.6000000000001" text-anchor="middle" font-size="15">箭頭表示連線發起方向，不是檔案流向。兩種模式下載皆 Server → Client，上</text><text x="360" y="969.6000000000001" text-anchor="middle" font-size="15">傳皆 Client → Server；控制連線建立後，命令與回覆可雙向傳送。</text></g></svg>
