<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-labelledby="title desc">
<title id="title">補充圖解：請求與資料方向</title><desc id="desc">Client 讀寫請求 → SMB Server; SMB Server 結果／檔案資料 → Client; Producer 發布事件 → Broker 叢集; Consumer 讀取請求 → Broker 叢集; Broker 叢集 事件資料回傳 → Consumer; 箭頭依標籤區分請求與資料；Broker 可由多台組成，業務處理由應用程式執行。</desc>
<rect x="1" y="1" width="778" height="438" rx="18" fill="#f7f5ef" stroke="#d8d8ce"/><g fill="#303632" font-family="system-ui,sans-serif" font-size="17">
<text x="24" y="34" font-weight="700">補充圖解：請求與資料方向</text>
<text x="24" y="70" font-weight="600">SMB：存取共用檔案</text>
<text x="36" y="106">Client</text>
<text x="230" y="106">讀寫請求 →</text>
<text x="500" y="106">SMB Server</text>
<text x="36" y="142">SMB Server</text>
<text x="230" y="142">結果／檔案資料 →</text>
<text x="500" y="142">Client</text>
<text x="24" y="198" font-weight="600">Kafka：事件與讀取請求</text>
<text x="36" y="234">Producer</text>
<text x="230" y="234">發布事件 →</text>
<text x="500" y="234">Broker 叢集</text>
<text x="36" y="270">Consumer</text>
<text x="230" y="270">讀取請求 →</text>
<text x="500" y="270">Broker 叢集</text>
<text x="36" y="306">Broker 叢集</text>
<text x="230" y="306">事件資料回傳 →</text>
<text x="500" y="306">Consumer</text>
<text x="24" y="390" font-size="15">箭頭依標籤區分請求與資料；Broker 可由多台組成，業務處理由應用程式執行。</text>
</g></svg>
