<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 415" role="img" aria-labelledby="title desc"><title id="title">Three read states</title><desc id="desc">Public / Read permitted; Finance / Test read denied; HR / Not tested. Synthetic example: each result applies to the tested identity, file, and action. </desc><rect x="1" y="1" width="678" height="413" rx="18" fill="#f7f5ef" stroke="#c8cec7"/><g font-family="sans-serif" fill="#303632"><text x="25" y="35" font-size="22" font-weight="bold">Three read states</text><rect x="25" y="55" width="630" height="75" rx="10" fill="#fffef9" stroke="#176339"/><text x="42" y="84" font-size="20" fill="#176339">✓ Public</text><text x="75" y="111" font-size="18">Read permitted</text><rect x="25" y="150" width="630" height="75" rx="10" fill="#fffef9" stroke="#a32c2c"/><text x="42" y="179" font-size="20" fill="#a32c2c">⊘ Finance</text><text x="75" y="206" font-size="18">Test read denied</text><rect x="25" y="245" width="630" height="75" rx="10" fill="#fffef9" stroke="#525953"/><text x="42" y="274" font-size="20" fill="#525953">? HR</text><text x="75" y="301" font-size="18">Not tested</text><text x="25" y="350" font-size="16">Synthetic example: each result applies to the tested identity,</text><text x="25" y="374" font-size="16">file, and action.</text></g></svg>
