<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" aria-labelledby="title desc"><title id="title">Kafka: event data flow</title><desc id="desc">Events can be retained and read by different systems Consumers fetch events. B and C use different consumer groups. Kafka may have multiple brokers.</desc><rect x="1" y="1" width="678" height="518" rx="18" fill="#f7f5ef" stroke="#c8cec7"/><g font-family="sans-serif" fill="#303632"><text x="340" y="35" text-anchor="middle" font-size="23">Kafka: event data flow</text><rect x="215" y="60" width="250" height="70" rx="12" fill="#e9f1f5" stroke="#829eae"/><text x="340" y="89" text-anchor="middle" font-size="22">System A</text><text x="340" y="115" text-anchor="middle" font-size="18">Producer</text><text x="340" y="160" text-anchor="middle" font-size="18">↓ Publish event</text><rect x="215" y="180" width="250" height="70" rx="12" fill="#e9f1f5" stroke="#829eae"/><text x="340" y="209" text-anchor="middle" font-size="22">Kafka</text><text x="340" y="235" text-anchor="middle" font-size="18">Topic: orders</text><rect x="40" y="340" width="250" height="70" rx="12" fill="#e9f1f5" stroke="#829eae"/><text x="165" y="369" text-anchor="middle" font-size="22">System B</text><text x="165" y="395" text-anchor="middle" font-size="18">Consumer · shipping</text><rect x="390" y="340" width="250" height="70" rx="12" fill="#e9f1f5" stroke="#829eae"/><text x="515" y="369" text-anchor="middle" font-size="22">System C</text><text x="515" y="395" text-anchor="middle" font-size="18">Consumer · analysis</text><path d="M340 250V275H165V330M340 275H515V330M158 321L165 330L172 321M508 321L515 330L522 321" fill="none" stroke="#60766b" stroke-width="3"/><text x="165" y="307" text-anchor="middle" font-size="18">Event data</text><text x="515" y="307" text-anchor="middle" font-size="18">Event data</text><text x="340" y="440" text-anchor="middle" font-size="17">Events can be retained and read by different systems</text><text x="340" y="472" text-anchor="middle" font-size="16">Consumers fetch; B and C use different consumer groups.</text><text x="340" y="498" text-anchor="middle" font-size="16">Kafka may have multiple brokers.</text></g></svg>
