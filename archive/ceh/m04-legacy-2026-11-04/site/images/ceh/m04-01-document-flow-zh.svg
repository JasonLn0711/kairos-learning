<svg xmlns="http://www.w3.org/2000/svg" width="720" height="634" viewBox="0 0 720 634" role="img" aria-labelledby="title desc"><title id="title">文件保存、事件通知、分析處理</title><desc id="desc">此圖重述原有文件案例；SMB 保存文件，Kafka 傳遞事件，應用程式執行工作。</desc><rect width="720" height="634" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">文件保存、事件通知、分析處理</text><text x="30" y="69" font-size="16" font-weight="400">此圖重述原有文件案例；SMB 保存文件，Kafka 傳遞事件，應用程式執行工作。</text><rect x="30" y="115" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="142" font-size="16" font-weight="650">使用者 → SMB</text><text x="46" y="168" font-size="16" font-weight="400">放入 PDF；檔案伺服器保存文件。</text><text x="42" y="215" font-size="16" font-weight="400">↓ 監控程式觀察文件</text><rect x="30" y="253" width="660" height="80" rx="12" fill="#e8f0ef" stroke="#778d80"/><text x="46" y="280" font-size="16" font-weight="650">監控程式 → Kafka</text><text x="46" y="306" font-size="16" font-weight="400">發出 document.uploaded，帶位置與識別碼。</text><text x="42" y="353" font-size="16" font-weight="400">↓ 消費 document.uploaded</text><rect x="30" y="391" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="418" font-size="16" font-weight="650">AI 服務</text><text x="46" y="444" font-size="16" font-weight="400">讀取事件，再依權限從 SMB 讀取 PDF 並分析。</text><text x="42" y="491" font-size="16" font-weight="400">↓ 完成事件</text><rect x="30" y="529" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="556" font-size="16" font-weight="650">報告服務</text><text x="46" y="582" font-size="16" font-weight="400">收到完成事件後產生報告、通知使用者。</text></g></svg>
