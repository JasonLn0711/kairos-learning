<svg xmlns="http://www.w3.org/2000/svg" width="720" height="478" viewBox="0 0 720 478" role="img" aria-labelledby="title desc"><title id="title">One query versus a zone transfer</title><desc id="desc">AXFR is a normal zone synchronization function. Testing a transfer requires separate authorization.</desc><rect width="720" height="478" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="38" y="38" font-size="18" font-weight="650">One query versus a zone transfer</text><text x="38" y="66" font-size="16" font-weight="400">AXFR is a normal zone synchronization function. Testing a</text><text x="38" y="94" font-size="16" font-weight="400">transfer requires separate authorization.</text><rect x="22" y="116" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="138" font-size="18" font-weight="650">Ordinary DNS query</text><text x="38" y="166" font-size="16" font-weight="400">Ask about one name and record type</text><text x="38" y="222" font-size="16" font-weight="400">Like asking:</text><text x="38" y="250" font-size="16" font-weight="400">What is this person&#x27;s phone number?</text><rect x="22" y="276" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="298" font-size="18" font-weight="650">AXFR zone transfer</text><text x="38" y="326" font-size="16" font-weight="400">Request the contents of a DNS zone</text><text x="38" y="382" font-size="16" font-weight="400">Like asking:</text><text x="38" y="410" font-size="16" font-weight="400">Please give me this entire directory.</text></g></svg>
