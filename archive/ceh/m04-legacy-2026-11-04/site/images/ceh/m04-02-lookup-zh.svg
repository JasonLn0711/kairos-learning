<svg xmlns="http://www.w3.org/2000/svg" width="720" height="462" viewBox="0 0 720 462" role="img" aria-labelledby="title desc"><title id="title">從名稱查詢到服務連線</title><desc id="desc">名稱解析取得資料後，才開始後續連線；圖中的位址是文件示範值。</desc><rect width="720" height="462" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="38" y="38" font-size="18" font-weight="650">從名稱查詢到服務連線</text><text x="38" y="66" font-size="16" font-weight="400">名稱解析取得資料後，才開始後續連線；圖中的位址是文件示範值。</text><rect x="22" y="88" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="110" font-size="18" font-weight="650">使用者輸入網域名稱</text><text x="38" y="138" font-size="16" font-weight="400">www.example.test</text><text x="38" y="194" font-size="16" font-weight="400">↓ 詢問 DNS：IP 是多少？</text><rect x="22" y="212" width="676" height="78" rx="12" fill="#e8f0f5" stroke="#778d80"/><text x="38" y="234" font-size="18" font-weight="650">DNS 查詢系統</text><text x="38" y="262" font-size="16" font-weight="400">回傳 A 記錄：192.0.2.10</text><text x="38" y="318" font-size="16" font-weight="400">↓ 取得 IP，準備建立連線</text><rect x="22" y="336" width="676" height="78" rx="12" fill="#fffef9" stroke="#778d80"/><text x="38" y="358" font-size="18" font-weight="650">嘗試連線到網路服務</text><text x="38" y="386" font-size="16" font-weight="400">TCP／TLS／HTTP 等後續步驟</text></g></svg>
