<svg xmlns="http://www.w3.org/2000/svg" width="720" height="516" viewBox="0 0 720 516" role="img" aria-labelledby="title desc"><title id="title">地址、入口、協定：分開確認</title><desc id="desc">三類證據各自判讀；445 開放、SMB 確認與指定檔案可讀，不互相等同。</desc><rect width="720" height="516" rx="18" fill="#f7f5ef"/><g font-family="sans-serif" fill="#303632"><text x="30" y="35" font-size="16" font-weight="650">地址、入口、協定：分開確認</text><text x="30" y="69" font-size="16" font-weight="400">三類證據各自判讀；445 開放、SMB 確認與指定檔案可讀，不互相等同。</text><rect x="30" y="115" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="142" font-size="16" font-weight="650">IP：192.168.56.10 → 核對</text><text x="46" y="168" font-size="16" font-weight="400">像設備地址。</text><rect x="30" y="209" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="236" font-size="16" font-weight="650">Port：TCP 445 → 核對</text><text x="46" y="262" font-size="16" font-weight="400">像服務櫃檯；open 是此次觀察接受連線。</text><rect x="30" y="303" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="330" font-size="16" font-weight="650">SMB：共用規則 → 核對</text><text x="46" y="356" font-size="16" font-weight="400">以實際協定回應確認；埠名標籤只是線索。</text><rect x="30" y="397" width="660" height="80" rx="12" fill="#fffef9" stroke="#778d80"/><text x="46" y="424" font-size="16" font-weight="650">指定檔案操作 → 核對</text><text x="46" y="450" font-size="16" font-weight="400">用當次身分與路徑，記下讀取結果。</text></g></svg>
