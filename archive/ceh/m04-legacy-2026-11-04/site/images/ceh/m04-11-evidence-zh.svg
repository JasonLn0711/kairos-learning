<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">網頁補充：四種不同的 RPC 證據</title><desc id="desc">每一項分別驗證；前一項成立不會自動證明其他項。</desc>
<rect width="960" height="600" rx="20" fill="#f7f8f5"/>
<text x="30" y="45" font-family="sans-serif" font-size="24" fill="#173d35">網頁補充：四種不同的 RPC 證據</text>
<rect x="30" y="90" width="440" height="170" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="48" y="140" font-family="sans-serif" font-size="23" fill="#173d35">查到登記</text>
<text x="48" y="190" font-family="sans-serif" font-size="17" fill="#253b33">Lab-A / TCP 35001：映射資料。</text>
<rect x="490" y="90" width="440" height="170" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="508" y="140" font-family="sans-serif" font-size="23" fill="#173d35">端點可連線</text>
<text x="508" y="190" font-family="sans-serif" font-size="17" fill="#253b33">目前來源到端點的連線證據。</text>
<rect x="30" y="295" width="440" height="170" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="48" y="345" font-family="sans-serif" font-size="23" fill="#173d35">身分驗證成功</text>
<text x="48" y="395" font-family="sans-serif" font-size="17" fill="#253b33">服務接受本次使用的身分。</text>
<rect x="490" y="295" width="440" height="170" rx="14" fill="#edf2ed" stroke="#677c73"/>
<text x="508" y="345" font-family="sans-serif" font-size="23" fill="#173d35">獲准執行功能</text>
<text x="508" y="395" font-family="sans-serif" font-size="17" fill="#253b33">這個身分獲准執行特定操作。</text>
<text x="30" y="545" font-family="sans-serif" font-size="18" fill="#253b33">每一項分別驗證；前一項成立不會自動證明其他項。</text>
</svg>
