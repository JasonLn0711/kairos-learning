<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Web supplement: verify restrictions and normal service</title><desc id="desc">Both independent checks must match policy; this is not two-factor authentication.</desc>
<rect width="960" height="440" rx="20" fill="#f7f8f5"/>
<text x="30" y="48" font-family="sans-serif" font-size="24" fill="#173d35">Web supplement: verify restrictions and normal service</text>
<rect x="30" y="90" width="440" height="230" rx="14" fill="#edf2ed" stroke="#677c73"/>
<path d="M50 120 h26 v18 h-26 z m5 24 h16" fill="none" stroke="#45695b" stroke-width="2"/>
<text x="48" y="185" font-family="sans-serif" font-size="21" fill="#173d35">Guest source: restrict information</text>
<text x="48" y="230" font-family="sans-serif" font-size="17" fill="#253b33">Check restricted information is not obtained;</text>
<text x="48" y="255" font-family="sans-serif" font-size="17" fill="#253b33">review rules and logs.</text>
<rect x="490" y="90" width="440" height="230" rx="14" fill="#eaf2f5" stroke="#677c73"/>
<path d="M510 120 h26 v18 h-26 z m5 24 h16" fill="none" stroke="#45695b" stroke-width="2"/>
<text x="508" y="185" font-family="sans-serif" font-size="21" fill="#173d35">Monitoring source: preserve service</text>
<text x="508" y="230" font-family="sans-serif" font-size="17" fill="#253b33">Check necessary queries still work</text>
<text x="508" y="255" font-family="sans-serif" font-size="17" fill="#253b33">for the authorized identity.</text>
<text x="30" y="380" font-family="sans-serif" font-size="18" fill="#253b33">Both independent checks must match policy; this is not two-factor authentication.</text>
</svg>
