name: Publish learning notes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: Audit the locked AASE workshop dependencies
        run: pipx run --spec pip-audit==2.10.1 pip-audit --require-hashes -r resources/aase/requirements.txt
      - run: pnpm run validate:content
      - run: pnpm test
      - name: Test shared static HTML contract
        run: python3 -m unittest discover -s scripts -p test_validation_html.py
      - run: pnpm run check
      - run: node scripts/check-publication-boundary.mjs
      - run: pnpm run validate:release
      - name: Verify preserved download checksums
        working-directory: site/courses/matlab-practice/downloads
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Confirm uploaded artifact is visible
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {pathToFileURL} = require('node:url');
            const {waitForPagesArtifact} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/pages-artifact.mjs').href);
            await waitForPagesArtifact({
              name: process.env.PAGES_ARTIFACT_NAME,
              list: async () => (await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: context.runId})).data.artifacts,
              log: message => core.info(message)
            });
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
