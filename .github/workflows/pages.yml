name: Publish learning notes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify static entry points
        run: |
          test -s site/index.html
          test -s site/courses/matlab-practice/case1.html
          test -s site/courses/matlab-practice/case2.html
          test -s site/courses/matlab-practice/case3.html
          cd site/courses/matlab-practice/downloads
          sha256sum -c SHA256SUMS.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
