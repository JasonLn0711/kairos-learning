name: Course quality and preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm run validate:content
      - run: pnpm test
      - name: Test shared static HTML contract
        run: python3 -m unittest discover -s scripts -p test_validation_html.py
      - run: pnpm run check
      - run: node scripts/check-publication-boundary.mjs
      - run: pnpm run validate:release
      - name: Verify preserved download checksums
        working-directory: site/courses/matlab-practice/downloads
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: learning-static-preview
          path: build
          retention-days: 7
