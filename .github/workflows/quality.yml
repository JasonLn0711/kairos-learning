name: Course quality and preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: Audit the locked AASE workshop dependencies
        run: pipx run --spec pip-audit==2.10.1 pip-audit --require-hashes -r resources/aase/requirements.txt
      - run: pnpm run validate:content
      - run: pnpm test
      - name: Test shared static HTML contract
        run: python3 -m unittest discover -s scripts -p test_validation_html.py
      - run: pnpm run check
      - run: node scripts/check-publication-boundary.mjs
      - run: pnpm run validate:release
      - name: Verify preserved download checksums
        working-directory: site/courses/matlab-practice/downloads
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: learning-static-preview
          path: build
          retention-days: 7
