name: Course quality and preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate:content
      - run: npm test
      - run: npm run check
      - run: node scripts/check-publication-boundary.mjs
      - run: npm run validate:release
      - name: Verify preserved download checksums
        working-directory: site/courses/matlab-practice/downloads
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: learning-static-preview
          path: build
          retention-days: 7
