<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" role="img" aria-labelledby="title desc"><title id="title">五元組：同一筆通訊的來處、去處與協定</title><desc id="desc">五個欄位一起看，再結合時間、觀察位置與 NAT 對應資訊。</desc><g transform="scale(0.6)"><rect width="1500" height="1040" fill="#f5f8fb"/><text x="50" y="50" font-size="22" fill="#2464d9" font-family="sans-serif">CEH M03-01</text><text x="50" y="100" font-size="34" fill="#172b49" font-family="sans-serif">五元組：同一筆通訊的來處、去處與協定</text><text x="50" y="151" font-size="22" fill="#4d6380" font-family="sans-serif">五個欄位一起看，再結合時間、觀察位置與 NAT 對應資訊。</text><rect x="50" y="250" width="1400" height="180" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="80" y="300" font-size="24" fill="#172b49" font-family="sans-serif">來源端點（Client）</text><text x="960" y="300" font-size="24" fill="#172b49" font-family="sans-serif">目的端點（Server）</text><text x="80" y="365" font-size="28" fill="#2464d9" font-family="sans-serif">192.0.2.10:53000</text><text x="960" y="365" font-size="28" fill="#2464d9" font-family="sans-serif">198.51.100.20:443</text><text x="700" y="305" font-size="28" fill="#00849b" font-family="sans-serif">TCP</text><path d="M580 355 L910 355" stroke="#2464d9" stroke-width="5" fill="none"/><polygon points="910,355 892,343 892,367" fill="#2464d9"/><rect x="50" y="480" width="260" height="160" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="72" y="520" font-size="24" fill="#2464d9" font-family="sans-serif">來源 IP</text><text x="72" y="564" font-size="22" fill="#4d6380" font-family="sans-serif">192.0.2.10</text><rect x="335" y="480" width="260" height="160" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="357" y="520" font-size="24" fill="#2464d9" font-family="sans-serif">來源埠</text><text x="357" y="564" font-size="22" fill="#4d6380" font-family="sans-serif">53000</text><rect x="620" y="480" width="260" height="160" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="642" y="520" font-size="24" fill="#2464d9" font-family="sans-serif">目的 IP</text><text x="642" y="564" font-size="22" fill="#4d6380" font-family="sans-serif">198.51.100.20</text><rect x="905" y="480" width="260" height="160" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="927" y="520" font-size="24" fill="#2464d9" font-family="sans-serif">目的埠</text><text x="927" y="564" font-size="22" fill="#4d6380" font-family="sans-serif">443</text><rect x="1190" y="480" width="260" height="160" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="1212" y="520" font-size="24" fill="#2464d9" font-family="sans-serif">協定</text><text x="1212" y="564" font-size="22" fill="#4d6380" font-family="sans-serif">TCP</text><rect x="50" y="690" width="685" height="280" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="72" y="730" font-size="24" fill="#2464d9" font-family="sans-serif">回程方向</text><text x="72" y="774" font-size="22" fill="#4d6380" font-family="sans-serif">198.51.100.20:443</text><text x="72" y="816" font-size="22" fill="#4d6380" font-family="sans-serif">→ 192.0.2.10:53000</text><rect x="765" y="690" width="685" height="280" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="787" y="730" font-size="24" fill="#2464d9" font-family="sans-serif">相同埠號 ≠ 相同傳輸協定</text><text x="787" y="774" font-size="22" fill="#4d6380" font-family="sans-serif">TCP/443：常見傳統 HTTPS</text><text x="787" y="816" font-size="22" fill="#4d6380" font-family="sans-serif">UDP/443：常見 QUIC／HTTP/3</text><text x="787" y="858" font-size="22" fill="#4d6380" font-family="sans-serif">埠號本身不能證明實際服務</text></g></svg>
