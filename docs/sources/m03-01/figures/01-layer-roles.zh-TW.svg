<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" role="img" aria-labelledby="title desc"><title id="title">資料要送到哪裡？IP 找位址，Port 找端點</title><desc id="desc">從瀏覽器請求理解定址、傳輸與程式入口；箭頭表示 IP 封包的轉送方向。</desc><g transform="scale(0.6)"><rect width="1500" height="1040" fill="#f5f8fb"/><text x="50" y="50" font-size="22" fill="#2464d9" font-family="sans-serif">CEH M03-01</text><text x="50" y="100" font-size="34" fill="#172b49" font-family="sans-serif">資料要送到哪裡？IP 找位址，Port 找端點</text><text x="50" y="151" font-size="22" fill="#4d6380" font-family="sans-serif">從瀏覽器請求理解定址、傳輸與程式入口；箭頭表示 IP 封包的轉送方向。</text><rect x="50" y="260" width="380" height="300" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="72" y="300" font-size="24" fill="#2464d9" font-family="sans-serif">你的電腦（Client）</text><text x="72" y="344" font-size="22" fill="#4d6380" font-family="sans-serif">192.0.2.10</text><text x="72" y="386" font-size="22" fill="#4d6380" font-family="sans-serif">瀏覽器發出請求</text><text x="72" y="428" font-size="22" fill="#4d6380" font-family="sans-serif">暫用來源埠 53000</text><rect x="190" y="470" width="100" height="55" rx="8" fill="#edf6fc" stroke="#2464d9" stroke-width="3"/><path d="M240 525v18 M215 543h50" stroke="#2464d9" stroke-width="3" fill="none"/><path d="M440 390 L545 390" stroke="#2464d9" stroke-width="5" fill="none"/><polygon points="545,390 527,378 527,402" fill="#2464d9"/><text x="435" y="355" font-size="20" fill="#00849b" font-family="sans-serif">IP 封包</text><rect x="560" y="260" width="380" height="300" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="582" y="300" font-size="24" fill="#2464d9" font-family="sans-serif">路由器（Router）</text><text x="582" y="344" font-size="22" fill="#4d6380" font-family="sans-serif">依目的 IP 與路由表</text><text x="582" y="386" font-size="22" fill="#4d6380" font-family="sans-serif">決定下一站</text><rect x="700" y="470" width="100" height="55" rx="8" fill="#edf6fc" stroke="#2464d9" stroke-width="3"/><circle cx="720" cy="497" r="5" fill="#168161"/><circle cx="750" cy="497" r="5" fill="#168161"/><circle cx="780" cy="497" r="5" fill="#168161"/><path d="M950 390 L1055 390" stroke="#2464d9" stroke-width="5" fill="none"/><polygon points="1055,390 1037,378 1037,402" fill="#2464d9"/><text x="945" y="355" font-size="20" fill="#00849b" font-family="sans-serif">IP 封包</text><rect x="1070" y="260" width="380" height="300" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="1092" y="300" font-size="24" fill="#2464d9" font-family="sans-serif">伺服器（Server）</text><text x="1092" y="344" font-size="22" fill="#4d6380" font-family="sans-serif">198.51.100.20</text><text x="1092" y="386" font-size="22" fill="#4d6380" font-family="sans-serif">例如 TCP/443 網頁服務</text><rect x="1210" y="470" width="100" height="55" rx="8" fill="#edf6fc" stroke="#2464d9" stroke-width="3"/><path d="M1220 484h80" stroke="#2464d9" stroke-width="3"/><path d="M1220 498h80" stroke="#2464d9" stroke-width="3"/><path d="M1220 512h80" stroke="#2464d9" stroke-width="3"/><rect x="50" y="620" width="330" height="250" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="72" y="660" font-size="24" fill="#2464d9" font-family="sans-serif">IP</text><text x="72" y="704" font-size="22" fill="#4d6380" font-family="sans-serif">目的網路位址</text><text x="72" y="746" font-size="22" fill="#4d6380" font-family="sans-serif">資料送往哪裡？</text><rect x="405" y="620" width="330" height="250" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="427" y="660" font-size="24" fill="#2464d9" font-family="sans-serif">TCP／UDP</text><text x="427" y="704" font-size="22" fill="#4d6380" font-family="sans-serif">傳輸機制</text><text x="427" y="746" font-size="22" fill="#4d6380" font-family="sans-serif">串流或資料報？</text><rect x="760" y="620" width="330" height="250" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="782" y="660" font-size="24" fill="#2464d9" font-family="sans-serif">Port</text><text x="782" y="704" font-size="22" fill="#4d6380" font-family="sans-serif">通訊端點</text><text x="782" y="746" font-size="22" fill="#4d6380" font-family="sans-serif">交給哪個端點？</text><rect x="1115" y="620" width="330" height="250" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="1137" y="660" font-size="24" fill="#2464d9" font-family="sans-serif">Service</text><text x="1137" y="704" font-size="22" fill="#4d6380" font-family="sans-serif">應用服務</text><text x="1137" y="746" font-size="22" fill="#4d6380" font-family="sans-serif">實際處理什麼？</text></g></svg>
