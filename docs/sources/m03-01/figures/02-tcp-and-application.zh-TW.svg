<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" role="img" aria-labelledby="title desc"><title id="title">TCP：先建立連線，再按順序交付資料</title><desc id="desc">SYN／SYN-ACK／ACK 建立傳輸狀態，不等於加密或網站登入。</desc><g transform="scale(0.6)"><rect width="1500" height="1040" fill="#f5f8fb"/><text x="50" y="50" font-size="22" fill="#2464d9" font-family="sans-serif">CEH M03-01</text><text x="50" y="100" font-size="34" fill="#172b49" font-family="sans-serif">TCP：先建立連線，再按順序交付資料</text><text x="50" y="151" font-size="22" fill="#4d6380" font-family="sans-serif">SYN／SYN-ACK／ACK 建立傳輸狀態，不等於加密或網站登入。</text><rect x="50" y="240" width="1400" height="450" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="90" y="285" font-size="28" fill="#172b49" font-family="sans-serif">用戶端 Client</text><text x="1100" y="285" font-size="28" fill="#172b49" font-family="sans-serif">伺服器 Server</text><path d="M170 345 L1330 345" stroke="#2464d9" stroke-width="5" fill="none"/><polygon points="1330,345 1312,333 1312,357" fill="#2464d9"/><rect x="480" y="313" width="540" height="104" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="510" y="345" font-size="26" fill="#2464d9" font-family="sans-serif">SYN</text><text x="510" y="378" font-size="18" fill="#4d6380" font-family="sans-serif">用戶端 → 伺服器 · 同步用戶端初始序號</text><path d="M1330 460 L170 460" stroke="#00849b" stroke-width="5" fill="none"/><polygon points="170,460 188,448 188,472" fill="#00849b"/><rect x="480" y="428" width="540" height="104" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="510" y="460" font-size="26" fill="#2464d9" font-family="sans-serif">SYN + ACK</text><text x="510" y="493" font-size="18" fill="#4d6380" font-family="sans-serif">伺服器 → 用戶端 · 提出自己的序號並確認 SYN</text><path d="M170 575 L1330 575" stroke="#2464d9" stroke-width="5" fill="none"/><polygon points="1330,575 1312,563 1312,587" fill="#2464d9"/><rect x="480" y="543" width="540" height="104" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="510" y="575" font-size="26" fill="#2464d9" font-family="sans-serif">ACK</text><text x="510" y="608" font-size="18" fill="#4d6380" font-family="sans-serif">用戶端 → 伺服器 · 確認伺服器的 SYN</text><rect x="50" y="730" width="450" height="220" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="72" y="770" font-size="24" fill="#2464d9" font-family="sans-serif">傳輸層 TCP</text><text x="72" y="814" font-size="22" fill="#4d6380" font-family="sans-serif">順序、重傳、流量控制</text><rect x="525" y="730" width="450" height="220" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="547" y="770" font-size="24" fill="#2464d9" font-family="sans-serif">安全通道 TLS</text><text x="547" y="814" font-size="22" fill="#4d6380" font-family="sans-serif">保護內容、驗證站點身分</text><rect x="1000" y="730" width="450" height="220" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="1022" y="770" font-size="24" fill="#2464d9" font-family="sans-serif">應用登入</text><text x="1022" y="814" font-size="22" fill="#4d6380" font-family="sans-serif">核對帳號、憑證與權限</text></g></svg>
