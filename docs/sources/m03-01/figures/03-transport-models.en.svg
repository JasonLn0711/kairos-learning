<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" role="img" aria-labelledby="title desc"><title id="title">TCP is a byte stream; UDP carries independent datagrams</title><desc id="desc">Compare interfaces and guarantees, not a blanket claim that one is always faster.</desc><g transform="scale(0.6)"><rect width="1500" height="1040" fill="#f5f8fb"/><text x="50" y="50" font-size="22" fill="#2464d9" font-family="sans-serif">CEH M03-01</text><text x="50" y="100" font-size="34" fill="#172b49" font-family="sans-serif">TCP is a byte stream; UDP carries independent datagrams</text><text x="50" y="151" font-size="22" fill="#4d6380" font-family="sans-serif">Compare interfaces and guarantees, not a blanket claim that one is always faster.</text><rect x="50" y="250" width="685" height="440" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="75" y="295" font-size="26" fill="#2464d9" font-family="sans-serif">TCP: ordered byte stream</text><rect x="75" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="87" y="390" font-size="20" fill="#172b49" font-family="sans-serif">Segment 1</text><path d="M170 450 L170 525" stroke="#2464d9" stroke-width="5" fill="none"/><polygon points="170,525 158,507 182,507" fill="#2464d9"/><rect x="75" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2"/><text x="87" y="595" font-size="20" fill="#168161" font-family="sans-serif">1</text><rect x="290" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="302" y="390" font-size="20" fill="#172b49" font-family="sans-serif">Segment 2</text><path d="M385 450 L385 525" stroke="#2464d9" stroke-width="5" fill="none"/><polygon points="385,525 373,507 397,507" fill="#2464d9"/><rect x="290" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2"/><text x="302" y="595" font-size="20" fill="#168161" font-family="sans-serif">2</text><rect x="505" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="517" y="390" font-size="20" fill="#172b49" font-family="sans-serif">Segment 3</text><path d="M600 450 L600 525" stroke="#2464d9" stroke-width="5" fill="none"/><polygon points="600,525 588,507 612,507" fill="#2464d9"/><rect x="505" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2"/><text x="517" y="595" font-size="20" fill="#168161" font-family="sans-serif">3</text><text x="75" y="665" font-size="20" fill="#4d6380" font-family="sans-serif">Lost → retransmitted</text><rect x="50" y="730" width="685" height="250" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="72" y="770" font-size="24" fill="#2464d9" font-family="sans-serif">TCP delivery</text><text x="72" y="814" font-size="22" fill="#4d6380" font-family="sans-serif">The application reads ordered bytes</text><text x="72" y="856" font-size="22" fill="#4d6380" font-family="sans-serif">One read need not match one write</text><text x="72" y="898" font-size="22" fill="#4d6380" font-family="sans-serif">Sequence numbers, ACKs and retransmission</text><rect x="765" y="250" width="685" height="440" rx="20" fill="#ffffff" stroke="#c9d8e8" stroke-width="2"/><text x="790" y="295" font-size="26" fill="#168161" font-family="sans-serif">UDP: independent datagrams</text><rect x="790" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="802" y="390" font-size="20" fill="#172b49" font-family="sans-serif">Datagram A</text><path d="M885 450 L885 525" stroke="#2464d9" stroke-width="5" fill="none"/><polygon points="885,525 873,507 897,507" fill="#2464d9"/><rect x="790" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2"/><text x="802" y="595" font-size="20" fill="#168161" font-family="sans-serif">Datagram A</text><rect x="1005" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="1017" y="390" font-size="20" fill="#172b49" font-family="sans-serif">Datagram B</text><text x="1075" y="500" font-size="48" fill="#c83243" font-family="sans-serif">×</text><rect x="1005" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2"/><text x="1017" y="595" font-size="20" fill="#168161" font-family="sans-serif">Lost</text><rect x="1220" y="350" width="195" height="85" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="1232" y="390" font-size="20" fill="#172b49" font-family="sans-serif">Datagram C</text><path d="M1315 450 L1315 525" stroke="#2464d9" stroke-width="5" fill="none"/><polygon points="1315,525 1303,507 1327,507" fill="#2464d9"/><rect x="1220" y="555" width="195" height="85" rx="20" fill="#e8f5ef" stroke="#c9d8e8" stroke-width="2"/><text x="1232" y="595" font-size="20" fill="#168161" font-family="sans-serif">Datagram C</text><text x="790" y="665" font-size="20" fill="#4d6380" font-family="sans-serif">B lost; UDP does not retransmit it</text><rect x="765" y="730" width="685" height="250" rx="20" fill="#edf6fc" stroke="#c9d8e8" stroke-width="2"/><text x="787" y="770" font-size="24" fill="#2464d9" font-family="sans-serif">UDP delivery</text><text x="787" y="814" font-size="22" fill="#4d6380" font-family="sans-serif">Datagram boundaries remain; loss or reordering is</text><text x="787" y="848" font-size="22" fill="#4d6380" font-family="sans-serif">possible</text><text x="787" y="890" font-size="22" fill="#4d6380" font-family="sans-serif">QUIC can provide reliable streams over UDP</text></g></svg>
