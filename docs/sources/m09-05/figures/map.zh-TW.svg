<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">先分清楚：人、帳號與身分</title><desc id="desc">內部威脅與身分竊用是不同觀察角度。帳號活動不能單獨證明行為人的身分與意圖。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#193449"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#536b7d"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2774a7"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b14d55"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#18785d"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#946c19"/></marker></defs><rect width="680" height="760" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="30" y="36" font-size="17" fill="#2774a7" font-weight="700" text-anchor="start">CEH M09-05  /  MAP</text><text x="30" y="83" font-size="30" fill="#193449" font-weight="700" text-anchor="start">先分清楚：人、帳號與身分</text><text x="30" y="121" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">誰有權限？誰在操作？哪些資料遭利用？</text><rect x="30" y="160" width="620" height="100" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5"/><text x="50" y="196" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">兩個觀察角度，不是互斥分類</text><text x="50" y="228" font-size="22" fill="#193449" font-weight="400" text-anchor="start">同一事件可能同時涉及兩者。</text><path d="M340 260 L190 310" fill="none" stroke="#536b7d" stroke-width="2" stroke-dasharray="3 6"/><path d="M340 260 L490 310" fill="none" stroke="#536b7d" stroke-width="2" stroke-dasharray="3 6"/><rect x="30" y="310" width="300" height="172" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5"/><text x="50" y="346" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">內部威脅</text><text x="50" y="378" font-size="22" fill="#193449" font-weight="400" text-anchor="start">已獲授權的人</text><text x="50" y="410" font-size="22" fill="#193449" font-weight="400" text-anchor="start">可能故意濫用</text><text x="50" y="442" font-size="22" fill="#193449" font-weight="400" text-anchor="start">或無意造成損害</text><rect x="350" y="310" width="300" height="172" rx="18" fill="#fff0f1" stroke="#b14d55" stroke-width="1.5"/><text x="370" y="346" font-size="24" fill="#b14d55" font-weight="700" text-anchor="start">身分竊用</text><text x="370" y="378" font-size="22" fill="#193449" font-weight="400" text-anchor="start">他人的身分資料</text><text x="370" y="410" font-size="22" fill="#193449" font-weight="400" text-anchor="start">遭未經允許使用</text><text x="370" y="442" font-size="22" fill="#193449" font-weight="400" text-anchor="start">用於詐欺等目的</text><rect x="30" y="530" width="620" height="132" rx="18" fill="#fff6dd" stroke="#946c19" stroke-width="1.5"/><text x="50" y="566" font-size="24" fill="#946c19" font-weight="700" text-anchor="start">帳號活動 ≠ 本人行為</text><text x="50" y="598" font-size="22" fill="#193449" font-weight="400" text-anchor="start">外部攻擊者也可能使用遭盜用帳號。</text><text x="50" y="630" font-size="22" fill="#193449" font-weight="400" text-anchor="start">不能只憑帳號名稱，就斷定員工有惡意。</text><text x="30" y="715" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">點線：概念關聯；不是攻擊順序或因果。</text></g></svg>