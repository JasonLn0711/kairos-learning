<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 890" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">先查證，再判讀；必要時先控風險</title><desc id="desc">由大量下載的觀察開始，保存紀錄及查核脈絡，依證據充分與否採取處置或保留待查。不能僅憑警訊指控員工。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#193449"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#536b7d"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2774a7"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b14d55"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#18785d"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#946c19"/></marker></defs><rect width="680" height="890" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="30" y="36" font-size="17" fill="#2774a7" font-weight="700" text-anchor="start">CEH M09-05  /  EVIDENCE</text><text x="30" y="83" font-size="30" fill="#193449" font-weight="700" text-anchor="start">先查證，再判讀；必要時先控風險</text><text x="30" y="121" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">安全控制與證據判讀要一起做。</text><rect x="30" y="160" width="620" height="100" rx="18" fill="#fff6dd" stroke="#946c19" stroke-width="1.5"/><text x="50" y="196" font-size="24" fill="#946c19" font-weight="700" text-anchor="start">觀察：帳號下載大量資料</text><text x="50" y="228" font-size="22" fill="#193449" font-weight="400" text-anchor="start">這是警訊，不是已確認的惡意內部事件。</text><path d="M 340 260 L 340 310" fill="none" stroke="#2774a7" stroke-width="2.5" marker-end="url(#blue)"/><rect x="30" y="310" width="620" height="132" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5"/><text x="50" y="346" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">保留證據並釐清情境</text><text x="50" y="378" font-size="22" fill="#193449" font-weight="400" text-anchor="start">查核工作需求、時間、裝置與存取紀錄。</text><text x="50" y="410" font-size="22" fill="#193449" font-weight="400" text-anchor="start">依授權與隱私規範，保存必要資料。</text><path d="M 340 442 L 340 492" fill="none" stroke="#2774a7" stroke-width="2.5" marker-end="url(#blue)"/><rect x="30" y="492" width="620" height="100" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5"/><text x="50" y="528" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">是否已有足夠證據支持判斷？</text><text x="50" y="560" font-size="22" fill="#193449" font-weight="400" text-anchor="start">分開記錄：已知事實、合理推論、待查。</text><path d="M 190 592 L 190 660" fill="none" stroke="#18785d" stroke-width="2.5" marker-end="url(#green)"/><path d="M 490 592 L 490 660" fill="none" stroke="#946c19" stroke-width="2.5" marker-end="url(#amber)"/><text x="190" y="637" font-size="21" fill="#18785d" font-weight="700" text-anchor="middle">有</text><text x="490" y="637" font-size="21" fill="#946c19" font-weight="700" text-anchor="middle">沒有</text><rect x="30" y="660" width="300" height="140" rx="18" fill="#eaf7f1" stroke="#18785d" stroke-width="1.5"/><text x="50" y="696" font-size="24" fill="#18785d" font-weight="700" text-anchor="start">依程序處置</text><text x="50" y="728" font-size="22" fill="#193449" font-weight="400" text-anchor="start">核准後限制權限</text><text x="50" y="760" font-size="22" fill="#193449" font-weight="400" text-anchor="start">保留證據與複核</text><text x="50" y="792" font-size="22" fill="#193449" font-weight="400" text-anchor="start">不公開指控個人</text><rect x="350" y="660" width="300" height="140" rx="18" fill="#fff6dd" stroke="#946c19" stroke-width="1.5"/><text x="370" y="696" font-size="24" fill="#946c19" font-weight="700" text-anchor="start">維持待確認</text><text x="370" y="728" font-size="22" fill="#193449" font-weight="400" text-anchor="start">補足紀錄與訪查</text><text x="370" y="760" font-size="22" fill="#193449" font-weight="400" text-anchor="start">必要時先降低風險</text><text x="370" y="792" font-size="22" fill="#193449" font-weight="400" text-anchor="start">不把未知當無事</text><text x="30" y="850" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">箭頭：查核與處理流程，不是攻擊路徑。</text></g></svg>