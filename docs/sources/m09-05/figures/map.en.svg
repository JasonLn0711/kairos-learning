<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Separate people, accounts and identity</title><desc id="desc">Insider threats and identity theft are different analytical lenses. Account activity alone cannot establish the actor or intent.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#193449"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#536b7d"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2774a7"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b14d55"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#18785d"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#946c19"/></marker></defs><rect width="680" height="760" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="30" y="36" font-size="17" fill="#2774a7" font-weight="700" text-anchor="start">CEH M09-05  /  MAP</text><text x="30" y="83" font-size="30" fill="#193449" font-weight="700" text-anchor="start">Separate people, accounts and identity</text><text x="30" y="121" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">Who has access? Who acts? What data is misused?</text><rect x="30" y="160" width="620" height="100" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5"/><text x="50" y="196" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">Two lenses, not exclusive categories</text><text x="50" y="228" font-size="22" fill="#193449" font-weight="400" text-anchor="start">One event may involve both.</text><path d="M340 260 L190 310" fill="none" stroke="#536b7d" stroke-width="2" stroke-dasharray="3 6"/><path d="M340 260 L490 310" fill="none" stroke="#536b7d" stroke-width="2" stroke-dasharray="3 6"/><rect x="30" y="310" width="300" height="172" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5"/><text x="50" y="346" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">Insider threat</text><text x="50" y="378" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Authorized people</text><text x="50" y="410" font-size="22" fill="#193449" font-weight="400" text-anchor="start">may deliberately misuse</text><text x="50" y="442" font-size="22" fill="#193449" font-weight="400" text-anchor="start">or unintentionally harm.</text><rect x="350" y="310" width="300" height="172" rx="18" fill="#fff0f1" stroke="#b14d55" stroke-width="1.5"/><text x="370" y="346" font-size="24" fill="#b14d55" font-weight="700" text-anchor="start">Identity theft</text><text x="370" y="378" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Someone’s identity data</text><text x="370" y="410" font-size="22" fill="#193449" font-weight="400" text-anchor="start">is used without permission</text><text x="370" y="442" font-size="22" fill="#193449" font-weight="400" text-anchor="start">for fraud or other harm.</text><rect x="30" y="530" width="620" height="132" rx="18" fill="#fff6dd" stroke="#946c19" stroke-width="1.5"/><text x="50" y="566" font-size="24" fill="#946c19" font-weight="700" text-anchor="start">Account activity ≠ a person’s action</text><text x="50" y="598" font-size="22" fill="#193449" font-weight="400" text-anchor="start">An outsider may use a compromised account.</text><text x="50" y="630" font-size="22" fill="#193449" font-weight="400" text-anchor="start">An account name alone does not prove intent.</text><text x="30" y="715" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">Dotted lines: association, not sequence or cause.</text></g></svg>