<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 890" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Verify before concluding; contain risk</title><desc id="desc">Start with an observed download alert, preserve evidence and investigate context. Respond to supported findings or retain uncertainty. An alert alone does not justify accusing an employee.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#193449"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#536b7d"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2774a7"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b14d55"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#18785d"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#946c19"/></marker></defs><rect width="680" height="890" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="30" y="36" font-size="17" fill="#2774a7" font-weight="700" text-anchor="start">CEH M09-05  /  EVIDENCE</text><text x="30" y="83" font-size="30" fill="#193449" font-weight="700" text-anchor="start">Verify before concluding; contain risk</text><text x="30" y="121" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">Combine protective controls with careful interpretation.</text><rect x="30" y="160" width="620" height="100" rx="18" fill="#fff6dd" stroke="#946c19" stroke-width="1.5"/><text x="50" y="196" font-size="24" fill="#946c19" font-weight="700" text-anchor="start">Observation: an account downloads much data</text><text x="50" y="228" font-size="22" fill="#193449" font-weight="400" text-anchor="start">An alert is not a confirmed malicious insider event.</text><path d="M 340 260 L 340 310" fill="none" stroke="#2774a7" stroke-width="2.5" marker-end="url(#blue)"/><rect x="30" y="310" width="620" height="132" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5"/><text x="50" y="346" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">Preserve evidence and establish context</text><text x="50" y="378" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Check task, time, device and access records.</text><text x="50" y="410" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Collect only what is authorized and necessary.</text><path d="M 340 442 L 340 492" fill="none" stroke="#2774a7" stroke-width="2.5" marker-end="url(#blue)"/><rect x="30" y="492" width="620" height="100" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5"/><text x="50" y="528" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">Is there enough evidence for a conclusion?</text><text x="50" y="560" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Keep facts, inferences and unknowns separate.</text><path d="M 190 592 L 190 660" fill="none" stroke="#18785d" stroke-width="2.5" marker-end="url(#green)"/><path d="M 490 592 L 490 660" fill="none" stroke="#946c19" stroke-width="2.5" marker-end="url(#amber)"/><text x="190" y="637" font-size="21" fill="#18785d" font-weight="700" text-anchor="middle">Yes</text><text x="490" y="637" font-size="21" fill="#946c19" font-weight="700" text-anchor="middle">No</text><rect x="30" y="660" width="300" height="140" rx="18" fill="#eaf7f1" stroke="#18785d" stroke-width="1.5"/><text x="50" y="696" font-size="24" fill="#18785d" font-weight="700" text-anchor="start">Respond by procedure</text><text x="50" y="728" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Limit access as authorized</text><text x="50" y="760" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Preserve evidence / review</text><text x="50" y="792" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Do not publicly accuse.</text><rect x="350" y="660" width="300" height="140" rx="18" fill="#fff6dd" stroke="#946c19" stroke-width="1.5"/><text x="370" y="696" font-size="24" fill="#946c19" font-weight="700" text-anchor="start">Keep it unresolved</text><text x="370" y="728" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Gather missing context</text><text x="370" y="760" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Reduce risk if warranted</text><text x="370" y="792" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Unknown is not safe.</text><text x="30" y="850" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">Arrows: investigation workflow, not an attack path.</text></g></svg>