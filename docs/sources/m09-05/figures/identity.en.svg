<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 890" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Identity theft is more than account theft</title><desc id="desc">Account takeover and fraudulent service enrollment are related risks. Data exposure alone does not prove identity theft.</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#193449"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#536b7d"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2774a7"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b14d55"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#18785d"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#946c19"/></marker></defs><rect width="680" height="890" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="30" y="36" font-size="17" fill="#2774a7" font-weight="700" text-anchor="start">CEH M09-05  /  IDENTITY</text><text x="30" y="83" font-size="30" fill="#193449" font-weight="700" text-anchor="start">Identity theft is more than account theft</text><text x="30" y="121" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">Separate exposure, account takeover and identity misuse.</text><rect x="30" y="160" width="620" height="100" rx="18" fill="#fff6dd" stroke="#946c19" stroke-width="1.5"/><text x="50" y="196" font-size="24" fill="#946c19" font-weight="700" text-anchor="start">Identity information is obtained / misused</text><text x="50" y="228" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Examples: name, ID details or authentication data.</text><path d="M340 260 L340 310" fill="none" stroke="#536b7d" stroke-width="2" stroke-dasharray="3 6"/><rect x="30" y="310" width="620" height="100" rx="18" fill="#fff0f1" stroke="#b14d55" stroke-width="1.5"/><text x="50" y="346" font-size="24" fill="#b14d55" font-weight="700" text-anchor="start">Identity theft: misuse of another’s identity</text><text x="50" y="378" font-size="22" fill="#193449" font-weight="400" text-anchor="start">It is broader than misuse of an online account.</text><path d="M340 410 L190 475" fill="none" stroke="#536b7d" stroke-width="2" stroke-dasharray="3 6"/><path d="M340 410 L490 475" fill="none" stroke="#536b7d" stroke-width="2" stroke-dasharray="3 6"/><rect x="30" y="475" width="300" height="140" rx="18" fill="#fff0f1" stroke="#b14d55" stroke-width="1.5"/><text x="50" y="511" font-size="24" fill="#b14d55" font-weight="700" text-anchor="start">Account Takeover</text><text x="50" y="543" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Access an existing account</text><text x="50" y="575" font-size="22" fill="#193449" font-weight="400" text-anchor="start">One possible risk</text><text x="50" y="607" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Not the whole category.</text><rect x="350" y="475" width="300" height="140" rx="18" fill="#fff0f1" stroke="#b14d55" stroke-width="1.5"/><text x="370" y="511" font-size="24" fill="#b14d55" font-weight="700" text-anchor="start">Fraudulent enrollment</text><text x="370" y="543" font-size="22" fill="#193449" font-weight="400" text-anchor="start">E.g. open a service in</text><text x="370" y="575" font-size="22" fill="#193449" font-weight="400" text-anchor="start">another person’s name</text><text x="370" y="607" font-size="22" fill="#193449" font-weight="400" text-anchor="start">No takeover is required.</text><rect x="30" y="665" width="620" height="132" rx="18" fill="#eaf7f1" stroke="#18785d" stroke-width="1.5"/><text x="50" y="701" font-size="24" fill="#18785d" font-weight="700" text-anchor="start">Data exposure ≠ proven identity theft</text><text x="50" y="733" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Exposure creates risk; actual misuse needs evidence.</text><text x="50" y="765" font-size="22" fill="#193449" font-weight="400" text-anchor="start">Do not report a possible consequence as a fact.</text><text x="30" y="850" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">Dotted lines: associations, not inevitable outcomes.</text></g></svg>