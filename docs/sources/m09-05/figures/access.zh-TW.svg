<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 910" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">有權登入，不等於有權做所有事</title><desc id="desc">正常查閱與可能外傳跨越不同用途權限邊界。外部人使用遭盜用帳號為另一可能性，不是本圖已證實的事實。</desc><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#193449"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#536b7d"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2774a7"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b14d55"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#18785d"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#946c19"/></marker></defs><rect width="680" height="910" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="30" y="36" font-size="17" fill="#2774a7" font-weight="700" text-anchor="start">CEH M09-05  /  ACCESS</text><text x="30" y="83" font-size="30" fill="#193449" font-weight="700" text-anchor="start">有權登入，不等於有權做所有事</text><text x="30" y="121" font-size="21" fill="#536b7d" font-weight="400" text-anchor="start">合成情境：公司客戶名單，不使用真實個資。</text><rect x="30" y="160" width="620" height="100" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5"/><text x="50" y="196" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">合法起點：員工有查閱權限</text><text x="50" y="228" font-size="22" fill="#193449" font-weight="400" text-anchor="start">看得到資料，不等於可以任意匯出或外傳。</text><path d="M 340 260 L 340 310" fill="none" stroke="#2774a7" stroke-width="2.5" marker-end="url(#blue)"/><rect x="30" y="310" width="620" height="100" rx="18" fill="#eaf3fa" stroke="#2774a7" stroke-width="1.5"/><text x="50" y="346" font-size="24" fill="#2774a7" font-weight="700" text-anchor="start">① 依工作需要查閱</text><text x="50" y="378" font-size="22" fill="#193449" font-weight="400" text-anchor="start">此處示意正常、已授權的資料存取。</text><path d="M30 466 H650" stroke="#946c19" stroke-width="2" stroke-dasharray="8 6"/><text x="30" y="452" font-size="21" fill="#946c19" font-weight="700" text-anchor="start">用途／分享權限邊界</text><path d="M 620 410 L 620 510" fill="none" stroke="#b14d55" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#red)"/><rect x="30" y="510" width="620" height="132" rx="18" fill="#fff0f1" stroke="#b14d55" stroke-width="1.5"/><text x="50" y="546" font-size="24" fill="#b14d55" font-weight="700" text-anchor="start">② 可能的越界：寄到私人信箱</text><text x="50" y="578" font-size="22" fill="#193449" font-weight="400" text-anchor="start">可能是故意外傳，也可能是寄錯人。</text><text x="50" y="610" font-size="22" fill="#193449" font-weight="400" text-anchor="start">需要紀錄與情境，不能預先判定動機。</text><rect x="30" y="690" width="620" height="132" rx="18" fill="#fff6dd" stroke="#946c19" stroke-width="1.5"/><text x="50" y="726" font-size="24" fill="#946c19" font-weight="700" text-anchor="start">另一條路：外部人使用遭盜用帳號</text><text x="50" y="758" font-size="22" fill="#193449" font-weight="400" text-anchor="start">系統可能留下相同帳號的操作紀錄。</text><text x="50" y="790" font-size="22" fill="#193449" font-weight="400" text-anchor="start">這不代表原帳號持有人親自操作。</text><text x="30" y="870" font-size="20" fill="#536b7d" font-weight="400" text-anchor="start">實線：示意正常存取。虛線箭頭：可能風險路徑。</text></g></svg>