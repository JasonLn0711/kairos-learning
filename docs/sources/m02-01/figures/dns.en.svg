<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 765" width="600" role="img" aria-labelledby="m02-01-dns-en-title m02-01-dns-en-desc" style="width:min(100%,23.076923em);height:auto;display:block"><title id="m02-01-dns-en-title">2 | DNS: cache changes the next path</title><desc id="m02-01-dns-en-desc">Simplified model, not a tool label. Forwarding and delegation vary. Unknown path remains unknown</desc><defs><marker id="m02-01-dns-en-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a"/></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="765" rx="22" fill="#f6f9fb"/><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">2 | DNS: cache changes the next path</text><rect x="30" y="85" width="540" height="80" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5"/><text x="50" y="119" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Me → third-party resolver</text><path d="M300,170 L300,205" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m02-01-dns-en-arrow)"/><rect x="30" y="215" width="540" height="80" rx="16" fill="#fff0d5" stroke="#b8cbd6" stroke-width="1.5"/><text x="50" y="249" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Does the resolver have a valid answer?</text><path d="M150,300 L150,350" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m02-01-dns-en-arrow)"/><path d="M450,300 L450,350" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m02-01-dns-en-arrow)"/><rect x="30" y="365" width="255" height="110" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5"/><text x="50" y="399" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Cached</text><text x="50" y="435" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">May answer me</text><rect x="315" y="365" width="255" height="110" rx="16" fill="#fff0d5" stroke="#b8cbd6" stroke-width="1.5"/><text x="335" y="399" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Not cached</text><text x="335" y="435" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">May query upstream</text><path d="M450,480 L450,515" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m02-01-dns-en-arrow)"/><rect x="30" y="530" width="540" height="85" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5"/><text x="50" y="564" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Authoritative DNS may receive query</text><text x="30" y="654" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">Simplified model, not a tool label</text><text x="30" y="683" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">Forwarding and delegation vary</text><text x="30" y="712" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">Unknown path remains unknown</text></g></svg>