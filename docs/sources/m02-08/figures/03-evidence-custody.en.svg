<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
<title id="title">3 | Link original evidence and custody records</title>
<desc id="desc">Preserve originals under access control; analyze and redact working copies; record acquisition, transfer and actions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41617b"/></marker></defs>
<rect x="1" y="1" width="598" height="698" rx="20" fill="#f8fafc" stroke="#b7c7d5"/>
<text x="300" y="38" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">3 | Link original evidence and custody records</text>
<rect x="32" y="68" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="97" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Acquire and identify</text>
<text x="300" y="124" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Finding ID, source, collector, time and zone</text>
<text x="300" y="151" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Record authorized scope and acquisition method</text>
<path d="M300 168V192" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="196" width="536" height="100" rx="14" fill="#e7f3ed" stroke="#7892a6"/>
<text x="300" y="225" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Preserve the original</text>
<text x="300" y="252" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Controlled storage, original file, SHA-256</text>
<text x="300" y="279" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Use the hash to compare byte consistency</text>
<path d="M300 296V320" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="324" width="536" height="100" rx="14" fill="#fff3d8" stroke="#7892a6"/>
<text x="300" y="353" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Create working copies</text>
<text x="300" y="380" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Save analysis and redacted versions separately</text>
<text x="300" y="407" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Link each copy and its processing to the original</text>
<path d="M300 424V448" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="452" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="481" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Track custody and use</text>
<text x="300" y="508" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Who, when, what, purpose and location</text>
<text x="300" y="535" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Manage access, retention and handover</text>
<text x="300" y="608" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Publish redacted reports; retain originals as authorized.</text>
</svg>