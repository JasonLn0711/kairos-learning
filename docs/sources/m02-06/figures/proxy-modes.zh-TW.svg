<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 717" role="img" aria-labelledby="title desc"><title id="title">圖 6｜DNS Only 與 Proxied</title><desc id="desc">兩欄比較同一網站的不同入口配置，省略路由器、ISP 與其他中間網路。</desc><rect width="800" height="717" fill="#fcfcfd"/><g fill="#162a3a" font-family="system-ui, sans-serif"><text x="400" y="42" font-size="24" text-anchor="middle" font-weight="700">圖 6｜DNS Only 與 Proxied</text><text x="400" y="83.6" font-size="18" text-anchor="middle">兩欄比較同一網站的不同入口配置，省略路由器、ISP 與其他中間網路。</text><text x="205" y="139.3" font-size="22" text-anchor="middle" font-weight="700">DNS Only</text><text x="595" y="139.3" font-size="22" text-anchor="middle" font-weight="700">Proxied</text><rect x="30" y="169.6" width="350" height="99.3" rx="18" fill="#eef0f3" stroke="#a1aebb" stroke-width="2"/><text x="205.0" y="203.6" font-size="22" text-anchor="middle" font-weight="700">使用者</text><text x="205.0" y="241.89999999999998" font-size="20" text-anchor="middle">直接連線到設定的網站位址</text><rect x="420" y="169.6" width="350" height="99.3" rx="18" fill="#eef0f3" stroke="#a1aebb" stroke-width="2"/><text x="595.0" y="203.6" font-size="22" text-anchor="middle" font-weight="700">使用者</text><text x="595.0" y="241.89999999999998" font-size="20" text-anchor="middle">連線到代理入口</text><path d="M595 271.9V313.9M587 303.9L595 313.9L603 303.9" fill="none" stroke="#075bc5" stroke-width="3"/><rect x="420" y="313.9" width="350" height="99.3" rx="18" fill="#e5effc" stroke="#689ee9" stroke-width="2"/><text x="595.0" y="347.9" font-size="22" text-anchor="middle" font-weight="700">Cloudflare 邊緣代理</text><text x="595.0" y="386.2" font-size="20" text-anchor="middle">先處理支援的網站流量</text><path d="M90 272.9V493.2M82 483.2L90 493.2L98 483.2" fill="none" stroke="#52677f" stroke-width="3"/><text x="250" y="343.9" font-size="20" text-anchor="middle">直接連線</text><path d="M460 416.2V493.2M452 483.2L460 493.2L468 483.2" fill="none" stroke="#075bc5" stroke-width="3"/><text x="630" y="451.2" font-size="18" text-anchor="middle">需要回源時</text><rect x="30" y="508.2" width="350" height="99.3" rx="18" fill="#fcf0e6" stroke="#dc9a60" stroke-width="2"/><text x="205.0" y="542.2" font-size="22" text-anchor="middle" font-weight="700">Origin｜原始伺服器</text><text x="205.0" y="580.5" font-size="20" text-anchor="middle">DNS Only：回覆設定的位址</text><rect x="420" y="508.2" width="350" height="99.3" rx="18" fill="#e3f2f0" stroke="#59b6b1" stroke-width="2"/><text x="595.0" y="542.2" font-size="22" text-anchor="middle" font-weight="700">Origin｜原始伺服器</text><text x="595.0" y="580.5" font-size="20" text-anchor="middle">需要回源時接收代理請求</text><text x="400" y="655.5" font-size="18" text-anchor="middle">DNS Only 不經一般 HTTP 代理；Proxied 回覆代理 IP。其他服務與原始主機的存取</text><text x="400" y="685.2" font-size="18" text-anchor="middle">規則另行核對。</text></g></svg>
