<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 647" role="img" aria-labelledby="title desc"><title id="title">Supplementary figure | Website operator, proxy and public IP</title><desc id="desc">Role relationships: a dashed “uses” arrow links the shop to its proxy; a solid arrow links the proxy to its public entry point. These are not packet-flow arrows.</desc><rect width="800" height="647" fill="#fcfcfd"/><g fill="#162a3a" font-family="system-ui, sans-serif"><text x="400" y="42" font-size="24" text-anchor="middle" font-weight="700">Supplementary figure | Website operator, proxy and</text><text x="400" y="81.6" font-size="24" text-anchor="middle" font-weight="700">public IP</text><text x="400" y="123.19999999999999" font-size="18" text-anchor="middle">Role relationships: a dashed “uses” arrow links the shop to its</text><text x="400" y="152.89999999999998" font-size="18" text-anchor="middle">proxy; a solid arrow links the proxy to its public entry point.</text><text x="400" y="182.59999999999997" font-size="18" text-anchor="middle">These are not packet-flow arrows.</text><rect x="20" y="266.29999999999995" width="220" height="237.89999999999998" rx="18" fill="#e5effc" stroke="#689ee9" stroke-width="2"/><text x="130.0" y="300.29999999999995" font-size="22" text-anchor="middle" font-weight="700">Actual</text><text x="130.0" y="336.59999999999997" font-size="22" text-anchor="middle" font-weight="700">website</text><text x="130.0" y="372.9" font-size="22" text-anchor="middle" font-weight="700">operator</text><text x="130.0" y="411.2" font-size="20" text-anchor="middle">Coffee shop</text><text x="130.0" y="444.2" font-size="20" text-anchor="middle">Manages domain</text><text x="130.0" y="477.2" font-size="20" text-anchor="middle">and content</text><rect x="320" y="266.29999999999995" width="220" height="168.6" rx="18" fill="#fcf0e6" stroke="#dc9a60" stroke-width="2"/><text x="430.0" y="300.29999999999995" font-size="22" text-anchor="middle" font-weight="700">CDN / reverse</text><text x="430.0" y="336.59999999999997" font-size="22" text-anchor="middle" font-weight="700">proxy</text><text x="430.0" y="374.9" font-size="20" text-anchor="middle">Cloudflare</text><text x="430.0" y="407.9" font-size="20" text-anchor="middle">AS13335</text><rect x="600" y="266.29999999999995" width="180" height="270.9" rx="18" fill="#eef0f3" stroke="#a1aebb" stroke-width="2"/><text x="690.0" y="300.29999999999995" font-size="22" text-anchor="middle" font-weight="700">What</text><text x="690.0" y="336.59999999999997" font-size="22" text-anchor="middle" font-weight="700">visitors</text><text x="690.0" y="372.9" font-size="22" text-anchor="middle" font-weight="700">see</text><text x="690.0" y="411.2" font-size="20" text-anchor="middle">Proxy IP</text><text x="690.0" y="444.2" font-size="20" text-anchor="middle">Public</text><text x="690.0" y="477.2" font-size="20" text-anchor="middle">network</text><text x="690.0" y="510.2" font-size="20" text-anchor="middle">entry point</text><path d="M244 401.74999999999994H316M308 394.74999999999994L316 401.74999999999994L308 408.74999999999994" fill="none" stroke="#52677f" stroke-width="3" stroke-dasharray="6 4"/><text x="280.0" y="246.29999999999995" font-size="16" text-anchor="middle">uses</text><path d="M544 401.74999999999994H596M588 394.74999999999994L596 401.74999999999994L588 408.74999999999994" fill="none" stroke="#52677f" stroke-width="3"/><text x="570.0" y="246.29999999999995" font-size="16" text-anchor="middle">exposes</text><text x="400" y="585.1999999999999" font-size="18" text-anchor="middle">The website operator, proxy network operator and actual hosting</text><text x="400" y="614.9" font-size="18" text-anchor="middle">provider may be different organizations.</text></g></svg>
