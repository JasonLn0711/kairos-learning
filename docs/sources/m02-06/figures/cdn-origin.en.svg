<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 841" role="img" aria-labelledby="title desc"><title id="title">Figure 5 | DNS, CDN and origin roles</title><desc id="desc">DNS queries and HTTPS transfers are separate exchanges; origin requests happen when needed.</desc><rect width="800" height="841" fill="#fcfcfd"/><g fill="#162a3a" font-family="system-ui, sans-serif"><text x="400" y="42" font-size="24" text-anchor="middle" font-weight="700">Figure 5 | DNS, CDN and origin roles</text><text x="400" y="83.6" font-size="18" text-anchor="middle">DNS queries and HTTPS transfers are separate exchanges; origin</text><text x="400" y="113.3" font-size="18" text-anchor="middle">requests happen when needed.</text><rect x="25" y="147.0" width="320" height="99.3" rx="18" fill="#e5effc" stroke="#689ee9" stroke-width="2"/><text x="185.0" y="181.0" font-size="22" text-anchor="middle" font-weight="700">User’s browser</text><text x="185.0" y="219.3" font-size="20" text-anchor="middle">shop.coffee.example</text><rect x="455" y="147.0" width="320" height="99.3" rx="18" fill="#eef0f3" stroke="#a1aebb" stroke-width="2"/><text x="615.0" y="181.0" font-size="22" text-anchor="middle" font-weight="700">DNS</text><text x="615.0" y="219.3" font-size="20" text-anchor="middle">Returns the CDN IP</text><path d="M350 177.0H450L438 169.0M450 177.0L438 185.0M450 212.0H350L362 204.0M350 212.0L362 220.0" fill="none" stroke="#52677f" stroke-width="3" stroke-dasharray="6 4"/><text x="400" y="278.3" font-size="20" text-anchor="middle">DNS query / reply</text><path d="M185 299.3V354.3M177 344.3L185 354.3L193 344.3" fill="none" stroke="#075bc5" stroke-width="3"/><text x="480" y="325.3" font-size="20" text-anchor="middle">HTTPS request: browser → CDN</text><rect x="45" y="368.3" width="710" height="132.3" rx="18" fill="#e3f2f0" stroke="#59b6b1" stroke-width="2"/><text x="400.0" y="402.3" font-size="22" text-anchor="middle" font-weight="700">CDN edge / reverse proxy</text><text x="400.0" y="440.6" font-size="20" text-anchor="middle">192.0.2.25 (public-facing service IP)</text><text x="400.0" y="473.6" font-size="20" text-anchor="middle">A cache hit can answer the client directly</text><path d="M400 503.6V575.6M392 565.6L400 575.6L408 565.6" fill="none" stroke="#a74705" stroke-width="3"/><text x="400" y="602.6" font-size="20" text-anchor="middle">When backend data is needed: CDN → origin</text><rect x="80" y="631.6" width="640" height="99.3" rx="18" fill="#f0eafa" stroke="#ac85ed" stroke-width="2"/><text x="400.0" y="665.6" font-size="22" text-anchor="middle" font-weight="700">Origin server</text><text x="400.0" y="703.9" font-size="20" text-anchor="middle">May be on an internal network or in the cloud</text><text x="400" y="778.9" font-size="18" text-anchor="middle">Intermediate networks are omitted. An entry-point IP does not</text><text x="400" y="808.6" font-size="18" text-anchor="middle">establish the origin location.</text></g></svg>
