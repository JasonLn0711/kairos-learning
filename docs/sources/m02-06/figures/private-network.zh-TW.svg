<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 744" role="img" aria-labelledby="title desc"><title id="title">圖 3｜實驗室內部網路</title><desc id="desc">電腦與 NAS 平行連到同一個路由器／防火牆，再由該設備連往外部。</desc><rect width="800" height="744" fill="#fcfcfd"/><g fill="#162a3a" font-family="system-ui, sans-serif"><rect x="35" y="117.3" width="730" height="393.90000000000003" rx="24" fill="#f0f8f7" stroke="#84c4c0" stroke-width="2" stroke-dasharray="10 6"/><text x="400" y="42" font-size="24" text-anchor="middle" font-weight="700">圖 3｜實驗室內部網路</text><text x="400" y="83.6" font-size="18" text-anchor="middle">電腦與 NAS 平行連到同一個路由器／防火牆，再由該設備連往外部。</text><text x="400" y="155.3" font-size="22" text-anchor="middle" font-weight="700">實驗室內部網路｜10.20.0.0/24</text><rect x="65" y="185.60000000000002" width="320" height="99.3" rx="18" fill="#e3f2f0" stroke="#59b6b1" stroke-width="2"/><text x="225.0" y="219.60000000000002" font-size="22" text-anchor="middle" font-weight="700">電腦</text><text x="225.0" y="257.90000000000003" font-size="20" text-anchor="middle">10.20.0.10</text><rect x="415" y="185.60000000000002" width="320" height="99.3" rx="18" fill="#e3f2f0" stroke="#59b6b1" stroke-width="2"/><text x="575.0" y="219.60000000000002" font-size="22" text-anchor="middle" font-weight="700">NAS</text><text x="575.0" y="257.90000000000003" font-size="20" text-anchor="middle">10.20.0.25</text><path d="M225 284.90000000000003V316.90000000000003H575V284.90000000000003M400 316.90000000000003V344.90000000000003" fill="none" stroke="#14817b" stroke-width="3"/><text x="400" y="366.90000000000003" font-size="20" text-anchor="middle">共用閘道</text><rect x="165" y="391.90000000000003" width="470" height="99.3" rx="18" fill="#e5effc" stroke="#689ee9" stroke-width="2"/><text x="400.0" y="425.90000000000003" font-size="22" text-anchor="middle" font-weight="700">路由器／防火牆</text><text x="400.0" y="464.20000000000005" font-size="20" text-anchor="middle">可進行 NAT 與存取控制</text><path d="M400 511.20000000000005V556.2M392 546.2L400 556.2L408 546.2" fill="none" stroke="#52677f" stroke-width="3"/><text x="570" y="531.2" font-size="20" text-anchor="middle">對外路徑</text><rect x="90" y="564.2" width="620" height="99.3" rx="18" fill="#eef0f3" stroke="#a1aebb" stroke-width="2"/><text x="400.0" y="598.2" font-size="22" text-anchor="middle" font-weight="700">外部網路／Internet</text><text x="400.0" y="636.5" font-size="20" text-anchor="middle">是否可達仍由路由與政策決定</text><text x="400" y="711.5" font-size="18" text-anchor="middle">私有位址可跨校區路由；NAT、存取控制與身分驗證各有責任。</text></g></svg>
