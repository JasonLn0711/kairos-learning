<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 811.2" role="img" aria-labelledby="cs-docker-zh-title cs-docker-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-docker-zh-title">Docker 的典型分層儲存概念</title><desc id="cs-docker-zh-desc">示意結構。多個映像可共用相同層，因此映像列表大小不能直接加總為實際唯一磁碟占用。</desc><defs><marker id="cs-docker-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="1014.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">Docker 的典型分層儲存概念</text><text x="60" y="135.0" font-size="24" font-weight="700" text-anchor="start">Container Writable Layer</text><text x="60" y="181.8" font-size="20" font-weight="400" text-anchor="start">容器執行時新增或修改的狀態</text><text x="60" y="295.0" font-size="24" font-weight="700" text-anchor="start">Application Layer</text><text x="60" y="341.8" font-size="20" font-weight="400" text-anchor="start">應用程式及相關檔案</text><text x="60" y="455.0" font-size="24" font-weight="700" text-anchor="start">Dependency Layers</text><text x="60" y="501.8" font-size="20" font-weight="400" text-anchor="start">執行環境與套件</text><text x="60" y="615.0" font-size="24" font-weight="700" text-anchor="start">Base Image Layers</text><text x="60" y="661.8" font-size="20" font-weight="400" text-anchor="start">基底檔案系統內容</text><rect x="40" y="745" width="1020" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="60" y="775.0" font-size="24" font-weight="700" text-anchor="start">Volume / Bind Mount</text><text x="60" y="821.8" font-size="20" font-weight="400" text-anchor="start">獨立於容器可寫層管理的持久資料</text><path d="M40 735L1060 735" fill="none" stroke="#64748b" stroke-width="3" /><text x="28" y="950.0" font-size="20" font-weight="400" text-anchor="start">示意結構。多個映像可共用相同層，因此映像列表大小不能直接加總為實際唯一磁碟占用。</text></g></g></svg>
