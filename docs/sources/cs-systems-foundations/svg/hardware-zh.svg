<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 499.20000000000005" role="img" aria-labelledby="cs-hardware-zh-title cs-hardware-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-hardware-zh-title">CPU、RAM、SSD 與 GPU 的角色</title><desc id="cs-hardware-zh-desc">儲存層共享與執行期記憶體共享是不同機制。</desc><defs><marker id="cs-hardware-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="624.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">CPU、RAM、SSD 與 GPU 的角色</text><rect x="25" y="80" width="1050" height="440" rx="20" fill="none" stroke="#cbd5e1" stroke-width="2" /><path d="M6 6h12v12H6z M9 9h6v6H9z M9 2v4 M15 2v4 M9 18v4 M15 18v4 M2 9h4 M2 15h4 M18 9h4 M18 15h4" transform="translate(265 100) scale(1.4)" fill="none" stroke="#18252c" stroke-width="1.8" /><text x="287.5" y="170.0" font-size="24" font-weight="700" text-anchor="middle">CPU</text><text x="287.5" y="216.8" font-size="20" font-weight="400" text-anchor="middle">執行指令、運算與控制</text><path d="M3 5h18v14H3z M6 8v4 M10 8v4 M14 8v4 M18 8v4 M6 19v3 M10 19v3 M14 19v3 M18 19v3" transform="translate(800 100) scale(1.4)" fill="none" stroke="#18252c" stroke-width="1.8" /><text x="822.5" y="170.0" font-size="24" font-weight="700" text-anchor="middle">RAM</text><text x="822.5" y="216.8" font-size="20" font-weight="400" text-anchor="middle">暫存程序正在使用的資料</text><path d="M3 12l4-8h10l4 8v8H3z M3 12h18 M6 16h1 M10 16h1" transform="translate(265 320) scale(1.4)" fill="none" stroke="#18252c" stroke-width="1.8" /><text x="287.5" y="390.0" font-size="24" font-weight="700" text-anchor="middle">SSD</text><text x="287.5" y="436.8" font-size="20" font-weight="400" text-anchor="middle">持久保存檔案與程式</text><path d="M3 3h18v14H3z M8 21h8 M12 17v4 M8 8h8 M8 12h8" transform="translate(800 320) scale(1.4)" fill="none" stroke="#18252c" stroke-width="1.8" /><text x="822.5" y="390.0" font-size="24" font-weight="700" text-anchor="middle">GPU</text><text x="822.5" y="436.8" font-size="20" font-weight="400" text-anchor="middle">大量平行計算，常用於圖形與 AI</text><text x="28" y="560.0" font-size="20" font-weight="400" text-anchor="start">儲存層共享與執行期記憶體共享是不同機制。</text></g></g></svg>
