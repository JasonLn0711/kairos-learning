<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 459.20000000000005" role="img" aria-labelledby="cs-environment-zh-title cs-environment-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-environment-zh-title">從依賴規格到已安裝環境</title><desc id="cs-environment-zh-desc">需求規格、解析結果與實際安裝狀態需要分別核對。</desc><defs><marker id="cs-environment-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="574.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">從依賴規格到已安裝環境</text><text x="270.0" y="140.0" font-size="24" font-weight="700" text-anchor="middle">Manifest</text><text x="270.0" y="186.8" font-size="20" font-weight="400" text-anchor="middle">允許哪些依賴</text><text x="830.0" y="140.0" font-size="24" font-weight="700" text-anchor="middle">Lockfile</text><text x="830.0" y="186.8" font-size="20" font-weight="400" text-anchor="middle">選定哪些版本</text><path d="M510 150L570 150" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-environment-zh-arrow)" /><path d="M550 250L550 290" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-environment-zh-arrow)" /><text x="550.0" y="340.0" font-size="24" font-weight="700" text-anchor="middle">Installed Environment（已安裝環境）</text><text x="550.0" y="386.8" font-size="20" font-weight="400" text-anchor="middle">磁碟上真正存在的程式、模組、入口與連結</text><text x="28" y="510.0" font-size="20" font-weight="400" text-anchor="start">需求規格、解析結果與實際安裝狀態需要分別核對。</text></g></g></svg>
