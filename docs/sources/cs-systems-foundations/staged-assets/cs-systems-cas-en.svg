<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 718.4000000000001" role="img" aria-labelledby="cs-cas-en-title cs-cas-en-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-cas-en-title">Content-addressable storage</title><desc id="cs-cas-en-desc">Different versions can reference the same object, avoiding duplicate copies of identical bytes.</desc><defs><marker id="cs-cas-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="898.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">Content-addressable storage</text><text x="550.0" y="140.0" font-size="24" font-weight="700" text-anchor="middle">Content: file bytes</text><path d="M550 235L550 260" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-cas-en-arrow)" /><text x="550.0" y="300.0" font-size="24" font-weight="700" text-anchor="middle">SHA-256: compute a digest</text><path d="M550 395L550 420" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-cas-en-arrow)" /><text x="550.0" y="460.0" font-size="24" font-weight="700" text-anchor="middle">Blob Store: store content by digest</text><path d="M550 555L550 580" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-cas-en-arrow)" /><rect x="40" y="620" width="495" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="287.5" y="650.0" font-size="24" font-weight="700" text-anchor="middle">Version A</text><text x="287.5" y="696.8" font-size="20" font-weight="400" text-anchor="middle">References Hash X</text><rect x="565" y="620" width="495" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="812.5" y="650.0" font-size="24" font-weight="700" text-anchor="middle">Version B</text><text x="812.5" y="696.8" font-size="20" font-weight="400" text-anchor="middle">References Hash X</text><text x="28" y="800.0" font-size="20" font-weight="400" text-anchor="start">Different versions can reference the same object, avoiding duplicate copies of identical</text><text x="28" y="834.0" font-size="20" font-weight="400" text-anchor="start">bytes.</text></g></g></svg>
