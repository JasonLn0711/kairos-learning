<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 838.4000000000001" role="img" aria-labelledby="cs-docker-en-title cs-docker-en-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-docker-en-title">Typical layered Docker storage</title><desc id="cs-docker-en-desc">Conceptual structure. Images may share layers; listed image sizes cannot simply be summed as unique disk usage.</desc><defs><marker id="cs-docker-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="1048.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">Typical layered Docker storage</text><text x="60" y="135.0" font-size="24" font-weight="700" text-anchor="start">Container Writable Layer</text><text x="60" y="181.8" font-size="20" font-weight="400" text-anchor="start">State added or changed while the container runs</text><text x="60" y="295.0" font-size="24" font-weight="700" text-anchor="start">Application Layer</text><text x="60" y="341.8" font-size="20" font-weight="400" text-anchor="start">Application and related files</text><text x="60" y="455.0" font-size="24" font-weight="700" text-anchor="start">Dependency Layers</text><text x="60" y="501.8" font-size="20" font-weight="400" text-anchor="start">Runtimes and packages</text><text x="60" y="615.0" font-size="24" font-weight="700" text-anchor="start">Base Image Layers</text><text x="60" y="661.8" font-size="20" font-weight="400" text-anchor="start">Base filesystem contents</text><rect x="40" y="745" width="1020" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="60" y="775.0" font-size="24" font-weight="700" text-anchor="start">Volume / Bind Mount</text><text x="60" y="821.8" font-size="20" font-weight="400" text-anchor="start">Persistent data managed outside the writable layer</text><path d="M40 735L1060 735" fill="none" stroke="#64748b" stroke-width="3" /><text x="28" y="950.0" font-size="20" font-weight="400" text-anchor="start">Conceptual structure. Images may share layers; listed image sizes cannot simply be summed</text><text x="28" y="984.0" font-size="20" font-weight="400" text-anchor="start">as unique disk usage.</text></g></g></svg>
