<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 691.2" role="img" aria-labelledby="cs-cas-zh-title cs-cas-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-cas-zh-title">內容定址儲存</title><desc id="cs-cas-zh-desc">不同版本可以參照相同的內容物件，避免為一模一樣的位元組保存重複副本。</desc><defs><marker id="cs-cas-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="864.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">內容定址儲存</text><text x="550.0" y="140.0" font-size="24" font-weight="700" text-anchor="middle">Content：檔案位元組</text><path d="M550 235L550 260" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-cas-zh-arrow)" /><text x="550.0" y="300.0" font-size="24" font-weight="700" text-anchor="middle">SHA-256：計算摘要</text><path d="M550 395L550 420" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-cas-zh-arrow)" /><text x="550.0" y="460.0" font-size="24" font-weight="700" text-anchor="middle">Blob Store：依摘要保存內容</text><path d="M550 555L550 580" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-cas-zh-arrow)" /><rect x="40" y="620" width="495" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="287.5" y="650.0" font-size="24" font-weight="700" text-anchor="middle">版本 A</text><text x="287.5" y="696.8" font-size="20" font-weight="400" text-anchor="middle">參照 Hash X</text><rect x="565" y="620" width="495" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="812.5" y="650.0" font-size="24" font-weight="700" text-anchor="middle">版本 B</text><text x="812.5" y="696.8" font-size="20" font-weight="400" text-anchor="middle">參照 Hash X</text><text x="28" y="800.0" font-size="20" font-weight="400" text-anchor="start">不同版本可以參照相同的內容物件，避免為一模一樣的位元組保存重複副本。</text></g></g></svg>
