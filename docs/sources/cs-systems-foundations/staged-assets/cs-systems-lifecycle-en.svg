<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1062.4" role="img" aria-labelledby="cs-lifecycle-en-title cs-lifecycle-en-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-lifecycle-en-title">The software lifecycle from source to delivery</title><desc id="cs-lifecycle-en-desc">Filesystems and hardware support every stage; Git manages source history. Testing, security and provenance span the whole flow.</desc><defs><marker id="cs-lifecycle-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="1328.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">The software lifecycle from source to delivery</text><text x="550.0" y="130.0" font-size="24" font-weight="700" text-anchor="middle">Source</text><text x="550.0" y="176.8" font-size="20" font-weight="400" text-anchor="middle">Code, data, configuration, requirements</text><path d="M550 245L550 270" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-lifecycle-en-arrow)" /><text x="550.0" y="315.0" font-size="24" font-weight="700" text-anchor="middle">Dependency</text><text x="550.0" y="361.8" font-size="20" font-weight="400" text-anchor="middle">Packages, versions, libraries, toolchain</text><path d="M550 430L550 455" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-lifecycle-en-arrow)" /><text x="550.0" y="500.0" font-size="24" font-weight="700" text-anchor="middle">Build / Execute</text><text x="550.0" y="546.8" font-size="20" font-weight="400" text-anchor="middle">OS, processes, compilers, runtimes</text><path d="M550 615L550 640" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-lifecycle-en-arrow)" /><text x="550.0" y="685.0" font-size="24" font-weight="700" text-anchor="middle">Artifact</text><text x="550.0" y="731.8" font-size="20" font-weight="400" text-anchor="middle">Website files, executables, images, model packages</text><path d="M550 800L550 825" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-lifecycle-en-arrow)" /><text x="550.0" y="870.0" font-size="24" font-weight="700" text-anchor="middle">Deploy / Serve</text><text x="550.0" y="916.8" font-size="20" font-weight="400" text-anchor="middle">Servers, containers, networks, browsers</text><path d="M550 985L550 1010" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-lifecycle-en-arrow)" /><rect x="45" y="1025" width="1010" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="550.0" y="1055.0" font-size="24" font-weight="700" text-anchor="middle">Verification</text><text x="550.0" y="1101.8" font-size="20" font-weight="400" text-anchor="middle">Check every stage and the result users receive</text><text x="28" y="1230.0" font-size="20" font-weight="400" text-anchor="start">Filesystems and hardware support every stage; Git manages source history. Testing, security</text><text x="28" y="1264.0" font-size="20" font-weight="400" text-anchor="start">and provenance span the whole flow.</text></g></g></svg>
