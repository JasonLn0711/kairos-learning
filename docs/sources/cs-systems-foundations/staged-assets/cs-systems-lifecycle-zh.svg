<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1035.2" role="img" aria-labelledby="cs-lifecycle-zh-title cs-lifecycle-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="cs-lifecycle-zh-title">軟體從開發到交付的完整生命週期</title><desc id="cs-lifecycle-zh-desc">檔案系統與硬體支撐所有階段；Git 管理來源歷史；測試、安全與證據追溯貫穿整條流程。</desc><defs><marker id="cs-lifecycle-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b" /></marker></defs><g transform="scale(0.8)"><rect width="1100" height="1294.0" fill="#ffffff" /><g font-family="system-ui,sans-serif" fill="#18252c"><text x="28" y="42.0" font-size="28" font-weight="700" text-anchor="start">軟體從開發到交付的完整生命週期</text><text x="550.0" y="130.0" font-size="24" font-weight="700" text-anchor="middle">Source（來源）</text><text x="550.0" y="176.8" font-size="20" font-weight="400" text-anchor="middle">程式碼、資料、設定、需求</text><path d="M550 245L550 270" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-lifecycle-zh-arrow)" /><text x="550.0" y="315.0" font-size="24" font-weight="700" text-anchor="middle">Dependency（依賴）</text><text x="550.0" y="361.8" font-size="20" font-weight="400" text-anchor="middle">套件、版本、函式庫、工具鏈</text><path d="M550 430L550 455" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-lifecycle-zh-arrow)" /><text x="550.0" y="500.0" font-size="24" font-weight="700" text-anchor="middle">Build / Execute（建置與執行）</text><text x="550.0" y="546.8" font-size="20" font-weight="400" text-anchor="middle">作業系統、程序、編譯器、執行環境</text><path d="M550 615L550 640" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-lifecycle-zh-arrow)" /><text x="550.0" y="685.0" font-size="24" font-weight="700" text-anchor="middle">Artifact（成品）</text><text x="550.0" y="731.8" font-size="20" font-weight="400" text-anchor="middle">網站檔案、執行檔、容器映像、模型封裝</text><path d="M550 800L550 825" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-lifecycle-zh-arrow)" /><text x="550.0" y="870.0" font-size="24" font-weight="700" text-anchor="middle">Deploy / Serve（部署與服務）</text><text x="550.0" y="916.8" font-size="20" font-weight="400" text-anchor="middle">伺服器、容器、網路、瀏覽器</text><path d="M550 985L550 1010" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#cs-lifecycle-zh-arrow)" /><rect x="45" y="1025" width="1010" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="550.0" y="1055.0" font-size="24" font-weight="700" text-anchor="middle">Verification（驗證）</text><text x="550.0" y="1101.8" font-size="20" font-weight="400" text-anchor="middle">檢查每個階段，並確認使用者得到正確結果</text><text x="28" y="1230.0" font-size="20" font-weight="400" text-anchor="start">檔案系統與硬體支撐所有階段；Git 管理來源歷史；測試、安全與證據追溯貫穿整條流程。</text></g></g></svg>
