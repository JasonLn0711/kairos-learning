<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1080" version="1.1" viewBox="0 0 1600 1080" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>CEH M01-07｜警報判讀與事件應變</title><desc>繁體中文向量資訊圖表，適合初學者閱讀，非官方原圖。</desc><defs /><rect fill="#F6F8FC" height="1080" width="1600" x="0" y="0" /><circle cx="1500" cy="-105" fill="#EAF0FF" opacity="0.54" r="310" /><circle cx="-160" cy="1180" fill="#E2F3F0" opacity="0.44" r="310" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="80" y="67">CEH  /  MODULE 01  /  LESSON 07</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="49" font-weight="700" opacity="1" text-anchor="start" x="80" y="132">03  大量下載 ≠ 一定有人入侵</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="82" y="185">從觀察、告警、證據查證到資安事件處理，每一步都需要不同的判斷依據。</text><rect fill="#EDF1F8" height="46" rx="23.0" ry="23.0" width="335" x="1192" y="52" /><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="1359.5" y="81.84">初學者圖解  ·  非官方原圖</text><rect fill="#B7C3D5" height="128" opacity="0.16" rx="20" ry="20" width="316" x="82.5" y="228" /><rect fill="#FFFFFF" height="128" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="316" x="80" y="222" /><rect fill="#EAF0FF" height="42" rx="11" ry="11" width="282" x="97" y="237" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="109" y="265">① Event｜活動紀錄</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="102" y="316">發現帳號下載大量檔案</text><rect fill="#B7C3D5" height="128" opacity="0.16" rx="20" ry="20" width="316" x="469.5" y="228" /><rect fill="#FFFFFF" height="128" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="316" x="467" y="222" /><rect fill="#F1EDFF" height="42" rx="11" ry="11" width="282" x="484" y="237" /><text fill="#7655C9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="496" y="265">② Alert｜告警</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="489" y="316">系統通知值得注意</text><rect fill="#B7C3D5" height="128" opacity="0.16" rx="20" ry="20" width="316" x="857.5" y="228" /><rect fill="#FFFFFF" height="128" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="316" x="855" y="222" /><rect fill="#FFF5DB" height="42" rx="11" ry="11" width="282" x="872" y="237" /><text fill="#B67D25" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="884" y="265">③ Triage｜查證</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="877" y="316">用多種證據判斷情境</text><rect fill="#B7C3D5" height="128" opacity="0.16" rx="20" ry="20" width="278" x="1244.5" y="228" /><rect fill="#FFFFFF" height="128" rx="20" ry="20" stroke="#DFE6F0" stroke-width="1.5" width="278" x="1242" y="222" /><rect fill="#FFF1E9" height="42" rx="11" ry="11" width="244" x="1259" y="237" /><text fill="#D86D3E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="1271" y="265">④ 判定</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="1264" y="316">不預設是攻擊</text><line stroke="#92A6BF" stroke-linecap="round" stroke-width="5" x1="403" x2="457" y1="284" y2="284" /><polygon fill="#92A6BF" points="457,284 438.5,271.5 438.5,296.5" /><line stroke="#92A6BF" stroke-linecap="round" stroke-width="5" x1="790" x2="844" y1="284" y2="284" /><polygon fill="#92A6BF" points="844,284 825.5,271.5 825.5,296.5" /><line stroke="#92A6BF" stroke-linecap="round" stroke-width="5" x1="1178" x2="1232" y1="284" y2="284" /><polygon fill="#92A6BF" points="1232,284 1213.5,271.5 1213.5,296.5" /><rect fill="#B7C3D5" height="290" opacity="0.16" rx="22" ry="22" width="1085" x="82.5" y="404" /><rect fill="#FFFFFF" height="290" rx="22" ry="22" stroke="#DFE6F0" stroke-width="1.5" width="1085" x="80" y="398" /><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="27" font-weight="700" opacity="1" text-anchor="start" x="108" y="449">查證時必須收集的資訊（不是只看一個下載數字）</text><circle cx="122" cy="481" fill="#F1EDFF" r="9" stroke="#7655C9" stroke-width="2" /><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="145" y="490">身分與權限</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="312" y="490">— 這個帳號有權讀嗎？</text><circle cx="635" cy="481" fill="#F1EDFF" r="9" stroke="#7655C9" stroke-width="2" /><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="658" y="490">時間與來源</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="825" y="490">— 什麼時候？從哪裡來？</text><circle cx="122" cy="546" fill="#F1EDFF" r="9" stroke="#7655C9" stroke-width="2" /><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="145" y="555">資料內容</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="312" y="555">— 拿走的是公開或私人資料？</text><circle cx="635" cy="546" fill="#F1EDFF" r="9" stroke="#7655C9" stroke-width="2" /><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="658" y="555">業務脈絡</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="825" y="555">— 是否有事前核准的備份？</text><circle cx="122" cy="611" fill="#F1EDFF" r="9" stroke="#7655C9" stroke-width="2" /><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="145" y="620">可靠的原始紀錄</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="18" font-weight="400" opacity="1" text-anchor="start" x="312" y="620">— 日誌是否完整且時間一致？</text><text fill="#16263E" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="1239" y="392">判讀結果（依證據更新）</text><rect fill="#B7C3D5" height="102" opacity="0.16" rx="17" ry="17" width="290" x="1232.5" y="415" /><rect fill="#FFFFFF" height="102" rx="17" ry="17" stroke="#DFE6F0" stroke-width="1.5" width="290" x="1230" y="409" /><rect fill="#23835F" height="80" rx="4" ry="4" width="9" x="1241" y="420" /><text fill="#23835F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="1258" y="452">合理且已獲授權</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="1258" y="484">記錄理由、調整偵測規則</text><rect fill="#B7C3D5" height="102" opacity="0.16" rx="17" ry="17" width="290" x="1232.5" y="532" /><rect fill="#FFFFFF" height="102" rx="17" ry="17" stroke="#DFE6F0" stroke-width="1.5" width="290" x="1230" y="526" /><rect fill="#B67D25" height="80" rx="4" ry="4" width="9" x="1241" y="537" /><text fill="#B67D25" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="1258" y="569">證據不足</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="1258" y="601">保留紀錄、補證據再評估</text><rect fill="#B7C3D5" height="102" opacity="0.16" rx="17" ry="17" width="290" x="1232.5" y="649" /><rect fill="#FFFFFF" height="102" rx="17" ry="17" stroke="#DFE6F0" stroke-width="1.5" width="290" x="1230" y="643" /><rect fill="#B95252" height="80" rx="4" ry="4" width="9" x="1241" y="654" /><text fill="#B95252" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="1258" y="686">疑似或確認資安事件</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="1258" y="718">依分級與程序啟動應變</text><rect fill="#B7C3D5" height="195" opacity="0.16" rx="24" ry="24" width="1440" x="82.5" y="782" /><rect fill="#EAF0FA" height="195" rx="24" ry="24" stroke="#D3DEF1" stroke-width="1.5" width="1440" x="80" y="776" /><text fill="#233D70" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="29" font-weight="700" opacity="1" text-anchor="start" x="107" y="830">若啟動應變：依授權處理，不是「先關機、先刪檔」</text><rect fill="#FFFFFF" height="84" rx="14" ry="14" width="255" x="111" y="857" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="125" y="895">證據保全</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="400" opacity="1" text-anchor="start" x="125" y="923">先記錄與保存</text><line stroke="#4168D9" stroke-linecap="round" stroke-width="4" x1="368" x2="392" y1="900" y2="900" /><polygon fill="#4168D9" points="392,900 374.0,888.0 374.0,912.0" /><rect fill="#FFFFFF" height="84" rx="14" ry="14" width="255" x="394" y="857" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="408" y="895">圍堵</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="400" opacity="1" text-anchor="start" x="408" y="923">限制損害擴大</text><line stroke="#4168D9" stroke-linecap="round" stroke-width="4" x1="651" x2="675" y1="900" y2="900" /><polygon fill="#4168D9" points="675,900 657.0,888.0 657.0,912.0" /><rect fill="#FFFFFF" height="84" rx="14" ry="14" width="255" x="677" y="857" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="691" y="895">根除</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="400" opacity="1" text-anchor="start" x="691" y="923">處理確認的原因</text><line stroke="#4168D9" stroke-linecap="round" stroke-width="4" x1="934" x2="958" y1="900" y2="900" /><polygon fill="#4168D9" points="958,900 940.0,888.0 940.0,912.0" /><rect fill="#FFFFFF" height="84" rx="14" ry="14" width="255" x="960" y="857" /><text fill="#4168D9" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="974" y="895">復原</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="400" opacity="1" text-anchor="start" x="974" y="923">驗證可信與可用</text><line stroke="#4168D9" stroke-linecap="round" stroke-width="4" x1="1217" x2="1241" y1="900" y2="900" /><polygon fill="#4168D9" points="1241,900 1223.0,888.0 1223.0,912.0" /><rect fill="#FFFFFF" height="84" rx="14" ry="14" width="255" x="1243" y="857" /><text fill="#087E80" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="1257" y="895">改善</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="17" font-weight="400" opacity="1" text-anchor="start" x="1257" y="923">更新規則與流程</text><text fill="#53667F" font-family="'Noto Sans CJK TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="800" y="1024">實務提醒：動作可能反覆交錯；通知義務、法遵與服務衝擊也要並行評估。</text></svg>