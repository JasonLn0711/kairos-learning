<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 903" width="100%" role="img" aria-labelledby="m09-06-evidence-zh-TW-title m09-06-evidence-zh-TW-desc" style="width:100%;height:auto;display:block"><title id="m09-06-evidence-zh-TW-title">圖 4｜看到什麼，才能推論什麼？</title><desc id="m09-06-evidence-zh-TW-desc">DMARC通過、MFA登入成功與沒有告警各自都有有限的證明範圍；後續查證補足內容、授權與涵蓋率。</desc><defs><marker id="m09-06-evidence-zh-TW-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a"/></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="903" rx="22" fill="#f6f9fb"/><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">圖 4｜看到什麼，才能推論什麼？</text><text x="30" y="85" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">先界定證據，再補查，不把訊號當結論</text><rect x="30" y="117" width="540" height="100" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5"/><text x="50" y="151" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">DMARC 通過</text><text x="50" y="187" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">網域驗證條件成立</text><path d="M55,222 L55,258" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m09-06-evidence-zh-TW-arrow)"/><text x="80" y="258" text-anchor="start" font-size="23" fill="#a44043" font-weight="700">≠ 內容安全／本人提出</text><text x="80" y="297" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">補查：查身分、要求與授權</text><rect x="30" y="343" width="540" height="100" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5"/><text x="50" y="377" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">MFA 登入成功</text><text x="50" y="413" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">登入驗證已通過</text><path d="M55,448 L55,484" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m09-06-evidence-zh-TW-arrow)"/><text x="80" y="484" text-anchor="start" font-size="23" fill="#a44043" font-weight="700">≠ 這筆轉帳已獲核准</text><text x="80" y="523" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">補查：查交易核准與工作階段</text><rect x="30" y="569" width="540" height="100" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5"/><text x="50" y="603" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">沒有收到告警</text><text x="50" y="639" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">目前未觀測到告警</text><path d="M55,674 L55,710" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m09-06-evidence-zh-TW-arrow)"/><text x="80" y="710" text-anchor="start" font-size="23" fill="#a44043" font-weight="700">≠ 完全沒有攻擊</text><text x="80" y="749" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">補查：查涵蓋率、規則與紀錄</text><rect x="30" y="810" width="540" height="63" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5"/><text x="300" y="849" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">證據範圍 ≠ 信心感受 ≠ 最終歸因</text></g></svg>