<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 865" width="100%" role="img" aria-labelledby="m09-06-controls-en-title m09-06-controls-en-desc" style="width:100%;height:auto;display:block"><title id="m09-06-controls-en-title">3 | Different controls, different gates</title><desc id="m09-06-controls-en-desc">Five complementary control areas protect different gates. No single check proves message or action safety.</desc><defs><marker id="m09-06-controls-en-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a"/></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="865" rx="22" fill="#f6f9fb"/><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">3 | Different controls, different gates</text><text x="30" y="83" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">Complementary layers, not a guaranteed pipeline</text><rect x="48" y="110" width="522" height="112" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5"/><text x="68" y="144" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Email origin</text><text x="68" y="180" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">SPF / DKIM / DMARC</text><text x="68" y="210" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Not a content-safety guarantee</text><text x="25" y="172" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">1</text><rect x="48" y="242" width="522" height="112" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5"/><text x="68" y="276" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Messages and endpoints</text><text x="68" y="312" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Filtering, link checks, protection</text><text x="68" y="342" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Misses remain possible</text><text x="25" y="304" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">2</text><rect x="48" y="374" width="522" height="112" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5"/><text x="68" y="408" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Human workflow</text><text x="68" y="444" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Independent checks + approval</text><text x="68" y="474" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Not just a familiar voice or photo</text><text x="25" y="436" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">3</text><rect x="48" y="506" width="522" height="112" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5"/><text x="68" y="540" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Authentication</text><text x="68" y="576" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Phishing-resistant WebAuthn/FIDO2</text><text x="68" y="606" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Bound to site; not transaction approval</text><text x="25" y="568" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">4</text><rect x="48" y="638" width="522" height="112" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5"/><text x="68" y="672" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Impact and response</text><text x="68" y="708" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Least privilege, report, revoke</text><text x="68" y="738" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Limit harm; preserve evidence</text><text x="25" y="700" text-anchor="middle" font-size="21" fill="#172e40" font-weight="700">5</text><text x="30" y="800" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">DMARC pass: aligned SPF OR DKIM passes.</text><text x="30" y="828" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">Every layer needs coverage and evidence.</text></g></svg>