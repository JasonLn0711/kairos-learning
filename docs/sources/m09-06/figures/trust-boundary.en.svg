<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" role="img" aria-labelledby="m09-06-trust-boundary-en-title m09-06-trust-boundary-en-desc" style="width:100%;height:auto;display:block"><title id="m09-06-trust-boundary-en-title">1 | Trust sources and action boundaries</title><desc id="m09-06-trust-boundary-en-desc">Separate an untrusted request from a known source. Verify identity, specific request and authority before acting.</desc><defs><marker id="m09-06-trust-boundary-en-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a"/></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="850" rx="22" fill="#f6f9fb"/><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">1 | Trust sources and action boundaries</text><rect x="30" y="77" width="540" height="116" rx="16" fill="#fff0d5" stroke="#b8cbd6" stroke-width="1.5"/><text x="50" y="111" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Unverified request</text><text x="50" y="147" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Photo, voice, link, callback number</text><text x="50" y="177" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">may share the same untrusted source</text><text x="300" y="233" text-anchor="middle" font-size="22" fill="#914e27" font-weight="700">Cannot authenticate itself</text><rect x="30" y="270" width="540" height="330" rx="16" fill="#ffffff" stroke="#87af9e" stroke-width="1.5" stroke-dasharray="7 6"/><text x="50" y="308" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Independent trusted source</text><text x="50" y="346" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">Established directory / official system</text><text x="50" y="375" text-anchor="start" font-size="20" fill="#172e40" font-weight="400">Not contact details supplied in the request</text><rect x="55" y="404" width="490" height="77" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5"/><text x="75" y="438" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Verify identity + request + authority</text><text x="55" y="524" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">All three need evidence before action.</text><text x="55" y="554" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Check destination and minimum scope.</text><path d="M300,602 L300,651" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m09-06-trust-boundary-en-arrow)"/><rect x="30" y="666" width="540" height="111" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5"/><text x="50" y="700" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Protected action</text><text x="50" y="736" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Pay / send data / change an account</text><text x="50" y="766" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Cannot verify → hold and report</text><text x="30" y="820" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">Dashed box: verification; arrow: next step</text></g></svg>