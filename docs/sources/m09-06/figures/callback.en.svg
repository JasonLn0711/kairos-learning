<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 885" width="100%" role="img" aria-labelledby="m09-06-callback-en-title m09-06-callback-en-desc" style="width:100%;height:auto;display:block"><title id="m09-06-callback-en-title">2 | Callback: change channel AND source</title><desc id="m09-06-callback-en-desc">Call a number from an established source. Verify the specific request and approval. Stop when denied or unclear.</desc><defs><marker id="m09-06-callback-en-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#57758a"/></marker></defs><g font-family="Noto Sans CJK TC, sans-serif"><rect width="600" height="885" rx="22" fill="#f6f9fb"/><text x="30" y="43" text-anchor="start" font-size="26" fill="#172e40" font-weight="700">2 | Callback: change channel AND source</text><rect x="30" y="78" width="245" height="57" rx="16" fill="#dfeff9" stroke="#b8cbd6" stroke-width="1.5"/><text x="152" y="114" text-anchor="middle" font-size="24" fill="#172e40" font-weight="700">Recipient</text><rect x="325" y="78" width="245" height="57" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5"/><text x="447" y="114" text-anchor="middle" font-size="24" fill="#172e40" font-weight="700">Known contact</text><path d="M152,145V748 M447,145V748" stroke="#b7cad5" stroke-width="2" stroke-dasharray="5 6"/><rect x="35" y="165" width="530" height="100" rx="16" fill="#fff0d5" stroke="#b8cbd6" stroke-width="1.5"/><text x="55" y="199" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">1. Pause the sensitive action</text><text x="55" y="235" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Do not use its new callback number</text><text x="300" y="309" text-anchor="middle" font-size="21" fill="#172e40" font-weight="400">2. Call the established directory number</text><path d="M152,331 L447,331" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m09-06-callback-en-arrow)"/><text x="300" y="379" text-anchor="middle" font-size="21" fill="#172e40" font-weight="400">3. Verify this request and destination</text><path d="M152,401 L447,401" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m09-06-callback-en-arrow)"/><text x="300" y="449" text-anchor="middle" font-size="21" fill="#172e40" font-weight="400">4. Receive reply; also check approval</text><path d="M447,471 L152,471" fill="none" stroke="#57758a" stroke-width="2.5" marker-end="url(#m09-06-callback-en-arrow)"/><rect x="35" y="516" width="530" height="100" rx="16" fill="#fbe3e3" stroke="#b8cbd6" stroke-width="1.5"/><text x="55" y="550" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Denied / unclear / not authorized</text><text x="55" y="586" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Hold + preserve message + report</text><rect x="35" y="645" width="530" height="100" rx="16" fill="#def1e8" stroke="#b8cbd6" stroke-width="1.5"/><text x="55" y="679" text-anchor="start" font-size="24" fill="#172e40" font-weight="700">Identity, request, authority verified</text><text x="55" y="715" text-anchor="start" font-size="21" fill="#172e40" font-weight="400">Act only within the approved scope</text><text x="30" y="789" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">Arrows: communication direction.</text><text x="30" y="817" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">The two outcomes are alternatives.</text><text x="30" y="845" text-anchor="start" font-size="19" fill="#172e40" font-weight="400">A familiar voice alone is insufficient.</text></g></svg>