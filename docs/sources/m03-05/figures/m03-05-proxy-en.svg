<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 609" role="img" aria-labelledby="m0305-proxy-en-title m0305-proxy-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0305-proxy-en-title">Request path and version evidence</title>
<desc id="m0305-proxy-en-desc">Arrows show request forwarding in this synthetic design only. An external response may come from the proxy, not identify the backend version. Return-response arrows are omitted.</desc>
<defs><marker id="m0305-proxy-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="607" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">Request path and version evidence</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Arrows show request forwarding in this synthetic design only.</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">An external response may come from the proxy, not identify</text>
<text x="28" y="116" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">the backend version. Return-response arrows are omitted.</text>
<rect x="28" y="159" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="188" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">1 | Client</text>
<text x="48" y="215" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Send a request to the approved entry point and record the</text>
<text x="48" y="238" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">hostname used.</text>
<path d="M320 275V300" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0305-proxy-en-arrow)" />
<rect x="28" y="304" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="333" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">2 | Reverse proxy</text>
<text x="48" y="360" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Accept requests for the backend and possibly generate or</text>
<text x="48" y="383" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">change response headers.</text>
<path d="M320 420V445" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0305-proxy-en-arrow)" />
<rect x="28" y="449" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="478" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">3 | Backend service</text>
<text x="48" y="505" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Handle forwarded work; verify the exact package version</text>
<text x="48" y="528" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">separately with the administrator.</text>
</svg>
