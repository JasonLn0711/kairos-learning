<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 586" role="img" aria-labelledby="m0305-proxy-zh-title m0305-proxy-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0305-proxy-zh-title">請求路徑與版本證據</title>
<desc id="m0305-proxy-zh-desc">箭頭只表示此合成架構的請求轉送方向。外部回應可能出自代理，不能直接代表後端版本；回應的回傳方向在此省略。</desc>
<defs><marker id="m0305-proxy-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="584" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">請求路徑與版本證據</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">箭頭只表示此合成架構的請求轉送方向。外部回應可能出自代理，不</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">能直接代表後端版本；回應的回傳方向在此省略。</text>
<rect x="28" y="136" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">1｜用戶端</text>
<text x="48" y="192" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">向核准入口提出請求，記錄使用的主機名稱。</text>
<path d="M320 252V277" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0305-proxy-zh-arrow)" />
<rect x="28" y="281" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="310" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">2｜反向代理</text>
<text x="48" y="337" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">代替後端接收請求，可能產生或調整回應標頭。</text>
<path d="M320 397V422" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0305-proxy-zh-arrow)" />
<rect x="28" y="426" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">3｜後端服務</text>
<text x="48" y="482" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">處理轉送的工作；精確套件版本須另外向管理端核對。</text>
</svg>
