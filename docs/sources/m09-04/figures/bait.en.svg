<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc"><title id="title">Handle the lure without opening it.</title><desc id="desc">Unknown USB media and enticing files remain untrusted. The route to company and home devices is blocked. Reporting information goes to an approved intake process and then to specialist-directed handling. A dotted possible-harm connector is explicitly conditional, not evidence that compromise occurred.</desc><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2774a7"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18785d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b14d55"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7d"/></marker></defs><rect width="1000" height="900" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="44" y="38" fill="#2774a7" font-size="15" font-weight="700" text-anchor="start">CEH M09-04  /  03  /  NORTHSTAR · SYNTHETIC SCENARIO</text><text x="44" y="87" fill="#193449" font-size="31" font-weight="700" text-anchor="start">Handle the lure without opening it.</text><text x="44" y="124" fill="#536b7d" font-size="18" font-weight="400" text-anchor="start">Baiting: a free file, prize, or unknown USB demands a source and handling check.</text><rect x="44" y="180" width="421" height="154" rx="18" fill="#fff5dd" stroke="#9b681a" stroke-width="1.5"/><text x="69" y="220" fill="#9b681a" font-size="23" font-weight="700" text-anchor="start">Unknown USB / enticing free file</text><text x="69" y="260" fill="#193449" font-size="19" font-weight="400" text-anchor="start">Appealing, but not established as trusted.</text><text x="69" y="291" fill="#193449" font-size="19" font-weight="400" text-anchor="start">Unknown ≠ confirmed malicious</text><rect x="625" y="180" width="331" height="154" rx="18" fill="#fceef0" stroke="#b14d55" stroke-width="1.5"/><text x="791" y="221" fill="#b14d55" font-size="22" font-weight="700" text-anchor="middle">Work or home device</text><text x="791" y="262" fill="#193449" font-size="17" font-weight="400" text-anchor="middle">Do not plug in or open.</text><text x="791" y="293" fill="#193449" font-size="17" font-weight="400" text-anchor="middle">Home is not a safe test environment.</text><path d="M465 260 H607" fill="none" stroke="#b14d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><circle cx="538" cy="260" r="16" fill="#f7fafc" stroke="#b14d55" stroke-width="2"/><path d="M532 254 L544 266 M532 266 L544 254" fill="none" stroke="#b14d55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="538" y="368" fill="#b14d55" font-size="18" font-weight="700" text-anchor="middle">Block unknown content from devices</text><rect x="44" y="434" width="912" height="237" rx="18" fill="#eaf6ef" stroke="#18785d" stroke-width="1.5"/><text x="535" y="468" fill="#18785d" font-size="19" font-weight="700" text-anchor="start">APPROVED RESPONSE</text><path d="M254 334 V501" fill="none" stroke="#18785d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="108" y="374" width="292" height="47" rx="8" fill="#f7fafc" stroke="#f7fafc" stroke-width="1.5"/><text x="254" y="405" fill="#18785d" font-size="17" font-weight="700" text-anchor="middle">Report details; do not open</text><rect x="65" y="501" width="379" height="138" rx="18" fill="#ffffff" stroke="#18785d" stroke-width="1.5"/><text x="254" y="542" fill="#18785d" font-size="22" font-weight="700" text-anchor="middle">Approved security intake</text><text x="254" y="579" fill="#193449" font-size="18" font-weight="400" text-anchor="middle">Report where and how it was found.</text><text x="254" y="609" fill="#193449" font-size="18" font-weight="400" text-anchor="middle">Preserve and hand over as directed.</text><path d="M444 572 H577" fill="none" stroke="#18785d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><text x="511" y="550" fill="#18785d" font-size="17" font-weight="700" text-anchor="middle">Refer</text><rect x="589" y="501" width="345" height="138" rx="18" fill="#ffffff" stroke="#2774a7" stroke-width="1.5"/><text x="761" y="542" fill="#2774a7" font-size="22" font-weight="700" text-anchor="middle">Specialist-led assessment</text><text x="761" y="579" fill="#193449" font-size="18" font-weight="400" text-anchor="middle">Approved staff decide whether and</text><text x="761" y="609" fill="#193449" font-size="18" font-weight="400" text-anchor="middle">how to assess it under policy.</text><path d="M791 334 V390 H977 V745 H916" fill="none" stroke="#b14d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8" marker-end="url(#a-red)"/><rect x="460" y="704" width="456" height="80" rx="18" fill="#fceef0" stroke="#b14d55" stroke-width="1.5"/><text x="688" y="736" fill="#b14d55" font-size="18" font-weight="700" text-anchor="middle">IF opened: possible malware / data exposure</text><text x="688" y="766" fill="#536b7d" font-size="17" font-weight="400" text-anchor="middle">Potential harm—not proof of compromise.</text><path d="M44 804 H956" fill="none" stroke="#bdcbd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="839" fill="#193449" font-size="18" font-weight="500" text-anchor="start">Green arrows: reporting and referral—not plugging the USB into another computer.</text><text x="44" y="870" fill="#536b7d" font-size="16" font-weight="400" text-anchor="start">Red dotted arrow: conditional potential harm. Red ×: prohibited handling route.</text></g></svg>