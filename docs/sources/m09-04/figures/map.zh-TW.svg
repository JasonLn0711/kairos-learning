<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc"><title id="title">三種手法，共同跨越哪一道界線？</title><desc id="desc">Three separate concept-association branches identify pretexting, baiting, and tailgating. Dotted lines have no arrowheads and do not depict events or a causal sequence.</desc><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2774a7"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18785d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b14d55"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7d"/></marker></defs><rect width="1000" height="900" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="44" y="38" fill="#2774a7" font-size="15" font-weight="700" text-anchor="start">CEH M09-04  /  01  /  NORTHSTAR · 合成情境</text><text x="44" y="87" fill="#193449" font-size="31" font-weight="700" text-anchor="start">三種手法，共同跨越哪一道界線？</text><text x="44" y="124" fill="#536b7d" font-size="18" font-weight="400" text-anchor="start">理由、誘因與入口是分析視角；不是必然依序發生的步驟。</text><path d="M270 310 C270 342 355 346 355 375" fill="none" stroke="#536b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8"/><path d="M730 310 C730 342 645 346 645 375" fill="none" stroke="#536b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8"/><path d="M500 525 V591" fill="none" stroke="#536b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8"/><rect x="45" y="180" width="440" height="130" rx="18" fill="#edf6fc" stroke="#2774a7" stroke-width="1.5"/><text x="69" y="218" fill="#2774a7" font-size="24" font-weight="700" text-anchor="start">理由｜Pretexting</text><text x="69" y="255" fill="#193449" font-size="19" font-weight="400" text-anchor="start">用編造的情境，讓要求顯得合理。</text><text x="69" y="284" fill="#193449" font-size="19" font-weight="400" text-anchor="start">重點：理由不等於授權。</text><rect x="515" y="180" width="440" height="130" rx="18" fill="#fff5dd" stroke="#9b681a" stroke-width="1.5"/><text x="539" y="218" fill="#9b681a" font-size="24" font-weight="700" text-anchor="start">誘因｜Baiting</text><text x="539" y="255" fill="#193449" font-size="19" font-weight="400" text-anchor="start">用獎勵或好奇心，引導不安全行動。</text><text x="539" y="284" fill="#193449" font-size="19" font-weight="400" text-anchor="start">重點：吸引力不等於可信。</text><rect x="240" y="375" width="520" height="150" rx="18" fill="#ffffff" stroke="#2774a7" stroke-width="1.5"/><text x="500" y="425" fill="#193449" font-size="27" font-weight="700" text-anchor="middle">把「合理感」誤當成授權</text><text x="500" y="467" fill="#193449" font-size="19" font-weight="400" text-anchor="middle">人、設備與實體空間，都有存取邊界。</text><text x="500" y="497" fill="#193449" font-size="19" font-weight="400" text-anchor="middle">要驗證的是這次行動是否被允許。</text><rect x="280" y="591" width="440" height="133" rx="18" fill="#eaf6ef" stroke="#18785d" stroke-width="1.5"/><text x="304" y="632" fill="#18785d" font-size="24" font-weight="700" text-anchor="start">入口｜Tailgating</text><text x="304" y="670" fill="#193449" font-size="19" font-weight="400" text-anchor="start">跟隨已獲准者，進入受限空間。</text><text x="304" y="699" fill="#193449" font-size="19" font-weight="400" text-anchor="start">重點：他人獲准不代表自己獲准。</text><path d="M280 766 H339" fill="none" stroke="#536b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 8"/><text x="355" y="773" fill="#536b7d" font-size="18" font-weight="400" text-anchor="start">概念關聯，沒有先後或因果承諾</text><path d="M44 804 H956" fill="none" stroke="#bdcbd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="839" fill="#193449" font-size="18" font-weight="500" text-anchor="start">看「被要求的行動」與「越過的邊界」，不只看故事名稱。</text><text x="44" y="870" fill="#536b7d" font-size="16" font-weight="400" text-anchor="start">同一事件可包含多種手法；本圖不是一條攻擊流程。</text></g></svg>