<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc"><title id="title">刷卡成功，不代表所有人都能進入</title><desc id="desc">Public and restricted zones are separated by a physical access-control gate. An employee with confirmed access enters on a green route. An unverified visitor route stops at the gate and is directed to reception. A badge event is not a headcount.</desc><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2774a7"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18785d"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b14d55"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7d"/></marker></defs><rect width="1000" height="900" fill="#f7fafc"/><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><text x="44" y="38" fill="#2774a7" font-size="15" font-weight="700" text-anchor="start">CEH M09-04  /  04  /  NORTHSTAR · 合成情境</text><text x="44" y="87" fill="#193449" font-size="31" font-weight="700" text-anchor="start">刷卡成功，不代表所有人都能進入</text><text x="44" y="124" fill="#536b7d" font-size="18" font-weight="400" text-anchor="start">Tailgating｜把「憑證獲准」與「實際進入的人」分開看。</text><rect x="44" y="174" width="432" height="593" rx="18" fill="#ffffff" stroke="#bdcbd4" stroke-width="1.5"/><rect x="524" y="174" width="432" height="593" rx="18" fill="#edf6fc" stroke="#2774a7" stroke-width="1.5"/><text x="67" y="212" fill="#536b7d" font-size="21" font-weight="700" text-anchor="start">公共區域｜Public</text><text x="550" y="212" fill="#2774a7" font-size="21" font-weight="700" text-anchor="start">受限區域｜Restricted</text><path d="M500 174 V304 M500 518 V767" fill="none" stroke="#2774a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="480" y="304" width="40" height="214" rx="8" fill="#ffffff" stroke="#2774a7" stroke-width="1.5"/><text x="500" y="292" fill="#2774a7" font-size="16" font-weight="700" text-anchor="middle">門禁</text><circle cx="107" cy="280" r="17" fill="#18785d"/><path d="M81 338 V323 Q81 304 107 304 Q133 304 133 323 V338" fill="#18785d"/><text x="159" y="287" fill="#18785d" font-size="23" font-weight="700" text-anchor="start">員工</text><text x="159" y="321" fill="#193449" font-size="18" font-weight="400" text-anchor="start">本次進入已獲准</text><text x="159" y="349" fill="#193449" font-size="18" font-weight="400" text-anchor="start">個人識別證已驗證</text><path d="M158 376 H797" fill="none" stroke="#18785d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><text x="669" y="359" fill="#18785d" font-size="19" font-weight="700" text-anchor="middle">本人進入</text><rect x="619" y="260" width="290" height="62" rx="18" fill="#ffffff" stroke="#2774a7" stroke-width="1.5"/><text x="764" y="299" fill="#2774a7" font-size="19" font-weight="500" text-anchor="middle">Northstar 辦公／作業區</text><circle cx="107" cy="431" r="17" fill="#9b681a"/><path d="M81 489 V474 Q81 455 107 455 Q133 455 133 474 V489" fill="#9b681a"/><text x="159" y="438" fill="#9b681a" font-size="23" font-weight="700" text-anchor="start">訪客</text><text x="159" y="472" fill="#193449" font-size="17" font-weight="400" text-anchor="start">尚未核對本人與進入權限</text><path d="M158 512 H466" fill="none" stroke="#b14d55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><circle cx="490" cy="512" r="16" fill="#f7fafc" stroke="#b14d55" stroke-width="2"/><path d="M484 506 L496 518 M484 518 L496 506" fill="none" stroke="#b14d55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="327" y="543" fill="#b14d55" font-size="18" font-weight="700" text-anchor="middle">不跟隨放行</text><path d="M190 532 V616" fill="none" stroke="#18785d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="66" y="616" width="385" height="114" rx="18" fill="#eaf6ef" stroke="#18785d" stroke-width="1.5"/><text x="259" y="656" fill="#18785d" font-size="23" font-weight="700" text-anchor="middle">接待／門禁窗口</text><text x="259" y="691" fill="#193449" font-size="18" font-weight="400" text-anchor="middle">依訪客流程核對、登記與陪同。</text><rect x="552" y="585" width="376" height="145" rx="18" fill="#ffffff" stroke="#2774a7" stroke-width="1.5"/><text x="740" y="628" fill="#2774a7" font-size="23" font-weight="700" text-anchor="middle">1 筆有效刷卡紀錄</text><text x="740" y="665" fill="#193449" font-size="28" font-weight="700" text-anchor="middle">≠</text><text x="740" y="703" fill="#193449" font-size="19" font-weight="500" text-anchor="middle">進入人數／每個人的授權</text><path d="M44 804 H956" fill="none" stroke="#bdcbd4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="839" fill="#193449" font-size="18" font-weight="500" text-anchor="start">綠色＝本圖中已獲准的移動；紅色 ×＝未驗證者的進入路徑被阻止。</text><text x="44" y="870" fill="#536b7d" font-size="16" font-weight="400" text-anchor="start">空間配置是教學示意；守門、查驗與陪同依場域安全政策執行。</text></g></svg>