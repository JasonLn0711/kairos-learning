<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 586" role="img" aria-labelledby="m0307-layers-zh-title m0307-layers-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0307-layers-zh-title">圖 3｜掃描的三個資訊層次</title>
<desc id="m0307-layers-zh-desc">這是不同問題的比較，不代表每次都要依序啟動全部功能。每項功能須符合核准目的。</desc>
<defs><marker id="m0307-layers-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="584" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">圖 3｜掃描的三個資訊層次</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">這是不同問題的比較，不代表每次都要依序啟動全部功能。每項功能</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">須符合核准目的。</text>
<rect x="28" y="136" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">主機探索：-sn／-Pn</text>
<text x="48" y="192" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">-sn 不掃連接埠；-Pn 跳過一般探索判定，不是存活證據。</text>
<rect x="28" y="281" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="310" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">連接埠與狀態：-sT／-p</text>
<text x="48" y="337" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">指定方法與入口，判讀 open、closed、filtered 及其理由。</text>
<rect x="28" y="426" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">服務與系統：-sV／-O</text>
<text x="48" y="482" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">額外探測提供身分線索；由管理端核實實際服務及系統。</text>
</svg>
