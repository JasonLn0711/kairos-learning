<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 731" role="img" aria-labelledby="m0307-workflow-en-title m0307-workflow-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0307-workflow-en-title">Figure 1｜From permission to verifiable results</title>
<desc id="m0307-workflow-en-desc">Arrows show work order. Each stage bounds the next; completing a scan does not establish overall security.</desc>
<defs><marker id="m0307-workflow-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="729" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">Figure 1｜From permission to verifiable results</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Arrows show work order. Each stage bounds the next;</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">completing a scan does not establish overall security.</text>
<rect x="28" y="136" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Permission and question</text>
<text x="48" y="192" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Confirm targets, exclusions, time, source and stop</text>
<text x="48" y="215" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">conditions.</text>
<path d="M320 252V277" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0307-workflow-en-arrow)" />
<rect x="28" y="281" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="310" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Minimum settings</text>
<text x="48" y="337" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Choose protocol, ports and method; check each added</text>
<text x="48" y="360" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">capability.</text>
<path d="M320 397V422" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0307-workflow-en-arrow)" />
<rect x="28" y="426" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Preserve raw results</text>
<text x="48" y="482" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Keep command, version, time, responses, warnings and</text>
<text x="48" y="505" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">unfinished scope.</text>
<path d="M320 542V567" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0307-workflow-en-arrow)" />
<rect x="28" y="571" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="600" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Compare and verify</text>
<text x="48" y="627" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Check management settings, processes and logs before deciding</text>
<text x="48" y="650" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">what follows.</text>
</svg>
