<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 609" role="img" aria-labelledby="m0307-layers-en-title m0307-layers-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0307-layers-en-title">Figure 3 | Three information layers</title>
<desc id="m0307-layers-en-desc">Arrows show increasingly specific information, not mandatory execution. -sn omits port scanning; -Pn skips the usual discovery decision.</desc>
<defs><marker id="m0307-layers-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="607" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">Figure 3 | Three information layers</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Arrows show increasingly specific information, not mandatory</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">execution. -sn omits port scanning; -Pn skips the usual</text>
<text x="28" y="116" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">discovery decision.</text>
<rect x="28" y="159" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="188" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Host discovery: -sn / -Pn</text>
<text x="48" y="215" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">-sn skips port scans; -Pn skips the discovery decision, not</text>
<text x="48" y="238" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">firewall rules.</text>
<path d="M320 275V300" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0307-layers-en-arrow)" />
<rect x="28" y="304" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="333" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Ports and states: -sT / -p</text>
<text x="48" y="360" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Choose method and ports; interpret states with their reasons.</text>
<path d="M320 420V445" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0307-layers-en-arrow)" />
<rect x="28" y="449" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="478" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Service and OS: -sV / -O</text>
<text x="48" y="505" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Extra probes suggest identities. Verify them using management</text>
<text x="48" y="528" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">evidence.</text>
</svg>
