<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 731" role="img" aria-labelledby="m0307-workflow-zh-title m0307-workflow-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0307-workflow-zh-title">圖 1｜從授權到可核對的結果</title>
<desc id="m0307-workflow-zh-desc">箭頭代表工作順序。每一步限定下一步的範圍，不代表完成掃描就證明安全。</desc>
<defs><marker id="m0307-workflow-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="729" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">圖 1｜從授權到可核對的結果</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">箭頭代表工作順序。每一步限定下一步的範圍，不代表完成掃描就證</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">明安全。</text>
<rect x="28" y="136" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">授權與問題</text>
<text x="48" y="192" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">確認目標、排除項目、時段、來源與停止條件。</text>
<path d="M320 252V277" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0307-workflow-zh-arrow)" />
<rect x="28" y="281" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="310" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">最小必要設定</text>
<text x="48" y="337" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">選定協定、連接埠及方法，逐項確認附加功能。</text>
<path d="M320 397V422" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0307-workflow-zh-arrow)" />
<rect x="28" y="426" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">保留原始結果</text>
<text x="48" y="482" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">保存命令、版本、時間、回應、警告與未完成範圍。</text>
<path d="M320 542V567" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0307-workflow-zh-arrow)" />
<rect x="28" y="571" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="600" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">比對與核實</text>
<text x="48" y="627" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">以管理端設定、程序及日誌核對，再決定下一步。</text>
</svg>
