<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 559" role="img" aria-labelledby="m0307-positions-en-title m0307-positions-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0307-positions-en-title">Figure 2 | Two observation positions</title>
<desc id="m0307-positions-en-desc">Solid: internal probe path. Dashed: external probe may be filtered; delivery is unproven. Verify this synthetic example with paths and logs.</desc>
<defs><marker id="m0307-positions-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="557" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">Figure 2 | Two observation positions</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Solid: internal probe path. Dashed: external probe may be</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">filtered; delivery is unproven. Verify this synthetic example</text>
<text x="28" y="116" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">with paths and logs.</text>
<rect x="160" y="169" width="320" height="110" rx="12" fill="#eaf3ff" stroke="#77a2d6" />
<text x="182" y="198" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">NAS: TCP 8000</text>
<text x="182" y="225" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">One target, two independent</text>
<text x="182" y="248" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">observation paths.</text>
<path d="M165 384L280 284" fill="none" stroke="#287255" stroke-width="2.5" marker-end="url(#m0307-positions-en-arrow)" />
<rect x="20" y="389" width="290" height="150" rx="12" fill="#edf7f0" stroke="#287255" />
<text x="34" y="414" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">Internal computer → NAS TCP</text>
<text x="34" y="436" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">8000</text>
<text x="34" y="458" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">Synthetic: open. Supports</text>
<text x="34" y="480" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">access from this internal</text>
<text x="34" y="502" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">source only.</text>
<path d="M475 384L360 284" fill="none" stroke="#995a45" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m0307-positions-en-arrow)" />
<rect x="330" y="389" width="290" height="150" rx="12" fill="#fff1ea" stroke="#995a45" />
<text x="344" y="414" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">Approved external source →</text>
<text x="344" y="436" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">same NAS</text>
<text x="344" y="458" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">Synthetic: filtered. Check</text>
<text x="344" y="480" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">path and firewall; service</text>
<text x="344" y="502" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">state is uncertain.</text>
</svg>
