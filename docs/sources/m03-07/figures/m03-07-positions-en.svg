<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 441" role="img" aria-labelledby="m0307-positions-en-title m0307-positions-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0307-positions-en-title">Figure 2 | Two observation positions</title>
<desc id="m0307-positions-en-desc">These are separate test conditions, not a sequence. This synthetic example needs source, path and log checks.</desc>
<defs><marker id="m0307-positions-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="439" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">Figure 2 | Two observation positions</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">These are separate test conditions, not a sequence. This</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">synthetic example needs source, path and log checks.</text>
<rect x="28" y="136" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Internal computer → NAS TCP 8000</text>
<text x="48" y="192" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Synthetic: open. Supports access from this internal source</text>
<text x="48" y="215" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">only.</text>
<rect x="28" y="281" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="310" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Approved external source → same NAS</text>
<text x="48" y="337" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Synthetic: filtered. Check path and firewall; service state</text>
<text x="48" y="360" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">is uncertain.</text>
</svg>
