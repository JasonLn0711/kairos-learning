<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 536" role="img" aria-labelledby="m0307-positions-zh-title m0307-positions-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0307-positions-zh-title">圖 2｜同一入口，兩個觀察位置</title>
<desc id="m0307-positions-zh-desc">實線為內網探測路徑；虛線為外部可能被過濾的探測路徑，不表示已抵達 NAS。人工示例須以路徑與日誌核實。</desc>
<defs><marker id="m0307-positions-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="534" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">圖 2｜同一入口，兩個觀察位置</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">實線為內網探測路徑；虛線為外部可能被過濾的探測路徑，不表示已</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">抵達 NAS。人工示例須以路徑與日誌核實。</text>
<rect x="160" y="146" width="320" height="110" rx="12" fill="#eaf3ff" stroke="#77a2d6" />
<text x="182" y="175" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">NAS：TCP 8000</text>
<text x="182" y="202" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">同一目標，兩條獨立觀察路徑。</text>
<path d="M165 361L280 261" fill="none" stroke="#287255" stroke-width="2.5" marker-end="url(#m0307-positions-zh-arrow)" />
<rect x="20" y="366" width="290" height="150" rx="12" fill="#edf7f0" stroke="#287255" />
<text x="34" y="391" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">內部管理電腦 → NAS TCP 8000</text>
<text x="34" y="413" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">人工示例：open。只支持這次內</text>
<text x="34" y="435" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">網來源能連線。</text>
<path d="M475 361L360 261" fill="none" stroke="#995a45" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m0307-positions-zh-arrow)" />
<rect x="330" y="366" width="290" height="150" rx="12" fill="#fff1ea" stroke="#995a45" />
<text x="344" y="391" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">經核准的外部位置 → 同一 NAS</text>
<text x="344" y="413" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">人工示例：filtered。無法確定</text>
<text x="344" y="435" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">入口是否開啟；需核對防火牆與</text>
<text x="344" y="457" font-family="Noto Sans CJK TC,sans-serif" font-size="15" fill="#172b3a">路徑。</text>
</svg>
