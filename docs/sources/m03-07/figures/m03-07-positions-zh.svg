<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 441" role="img" aria-labelledby="m0307-positions-zh-title m0307-positions-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0307-positions-zh-title">圖 2｜同一入口，兩個觀察位置</title>
<desc id="m0307-positions-zh-desc">兩張卡是獨立測試條件，不是先後流程。這是人工示例，須以來源、路徑及日誌核實。</desc>
<defs><marker id="m0307-positions-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="439" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">圖 2｜同一入口，兩個觀察位置</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">兩張卡是獨立測試條件，不是先後流程。這是人工示例，須以來源、</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">路徑及日誌核實。</text>
<rect x="28" y="136" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">內部管理電腦 → NAS TCP 8000</text>
<text x="48" y="192" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">人工示例：open。只支持這次內網來源能連線。</text>
<rect x="28" y="281" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="310" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">經核准的外部位置 → 同一 NAS</text>
<text x="48" y="337" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">人工示例：filtered。無法確定入口是否開啟；需核對防火牆與路徑</text>
<text x="48" y="360" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">。</text>
</svg>
