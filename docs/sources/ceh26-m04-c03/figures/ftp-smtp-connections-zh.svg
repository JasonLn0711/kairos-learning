<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" role="img" aria-labelledby="ceh26m04c03-connections-zh-title ceh26m04c03-connections-zh-desc" preserveAspectRatio="xMidYMid meet"><title id="ceh26m04c03-connections-zh-title">圖 1｜FTP 的兩類連線</title><desc id="ceh26m04c03-connections-zh-desc">控制與資料各自有責任。兩張卡是平行分類，不表示一條連線自動保證另一條成功。</desc><rect x="1" y="1" width="898" height="422" rx="16" fill="#f3f7fb" stroke="#b7c9df" /><text x="35" y="44" font-family="Noto Sans CJK TC,sans-serif" font-size="24" fill="#172b49">圖 1｜FTP 的兩類連線</text><text x="35" y="88" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">控制與資料各自有責任。兩張卡是平行分類，不表示一條連線自動保證另一條成功。</text><rect x="20" y="116" width="860" height="108" rx="12" fill="#ffffff" stroke="#8ba5bd" /><text x="35" y="140" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b49">控制連線</text><text x="35" y="184" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">承接登入、功能詢問與操作要求，常用 TCP 21；登入成功仍須另外確認資料連線。</text><rect x="20" y="248" width="860" height="108" rx="12" fill="#ffffff" stroke="#8ba5bd" /><text x="35" y="272" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b49">資料連線</text><text x="35" y="316" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">承接目錄清單或檔案內容；主動／被動模式改變發起方向與接收位置。</text></svg>
