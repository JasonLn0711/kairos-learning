<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="title desc"><title id="title">How noindex takes effect</title><desc id="desc">Public page: fetch content, read the rule, update indexing. Private content uses authentication and authorization.</desc><rect width="600" height="640" fill="#ffffff"/><rect x="20" y="24" width="560" height="112" rx="14" fill="#eaf4ff" stroke="#64748b"/><text x="40" y="66" font-size="18" font-family="sans-serif" font-weight="600" fill="#172b3a">1  Let Googlebot fetch the public resource</text><text x="40" y="102" font-size="16" font-family="sans-serif" fill="#172b3a">Read HTML or the HTTP response header</text><path d="M300 138 V169 M292 160 L300 169 L308 160" fill="none" stroke="#2563a6" stroke-width="3"/><rect x="20" y="176" width="560" height="112" rx="14" fill="#e9f7ef" stroke="#64748b"/><text x="40" y="218" font-size="18" font-family="sans-serif" font-weight="600" fill="#172b3a">2  Read the noindex instruction</text><text x="40" y="254" font-size="16" font-family="sans-serif" fill="#172b3a">Exclude the page from search results</text><path d="M300 290 V321 M292 312 L300 321 L308 312" fill="none" stroke="#2563a6" stroke-width="3"/><rect x="20" y="328" width="560" height="112" rx="14" fill="#fff5dd" stroke="#64748b"/><text x="40" y="370" font-size="18" font-family="sans-serif" font-weight="600" fill="#172b3a">3  Check through Search Console</text><text x="40" y="406" font-size="16" font-family="sans-serif" fill="#172b3a">Inspect the URL and indexing reports</text><rect x="20" y="480" width="560" height="112" rx="14" fill="#f0ecff" stroke="#64748b"/><text x="40" y="522" font-size="18" font-family="sans-serif" font-weight="600" fill="#172b3a">A separate path for a private PDF</text><text x="40" y="558" font-size="16" font-family="sans-serif" fill="#172b3a">Authenticate → authorize the file → deliver</text></svg>
