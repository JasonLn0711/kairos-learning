<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
<title id="title">2 | Resolve a local IPv4 next hop with ARP</title>
<desc id="desc">A and B share a local Ethernet network. A resolves B’s MAC when needed and builds the local frame.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b"/></marker></defs>
<rect x="1" y="1" width="598" height="698" rx="20" fill="#f8fafc" stroke="#b7c7d5"/>
<text x="300" y="38" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">2 | Resolve a local IPv4 next hop with ARP</text>
<rect x="32" y="68" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="97" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Select next hop and check cache</text>
<text x="300" y="124" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">A: 192.0.2.10 → B: 192.0.2.20</text>
<text x="300" y="151" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Routing identifies a directly connected network</text>
<path d="M300 168V192" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="196" width="536" height="100" rx="14" fill="#e7f3ed" stroke="#7892a6"/>
<text x="300" y="225" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Send ARP Request when needed</text>
<text x="300" y="252" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Ask who uses 192.0.2.20</text>
<text x="300" y="279" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">A typical request stays in the local broadcast domain</text>
<path d="M300 296V320" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="324" width="536" height="100" rx="14" fill="#fff3d8" stroke="#7892a6"/>
<text x="300" y="353" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Receive ARP Reply</text>
<text x="300" y="380" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Read the reported IP-to-MAC mapping</text>
<text x="300" y="407" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Record the response source and reception time</text>
<path d="M300 424V448" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="452" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="481" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Build the Ethernet frame</text>
<text x="300" y="508" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Set the next-hop interface as destination MAC</text>
<text x="300" y="535" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Distinguish cache timing from a fresh response</text>
<text x="300" y="608" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">ARP is carried directly by Ethernet; this is IPv4.</text>
</svg>