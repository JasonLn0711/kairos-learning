<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 600" role="img" aria-labelledby="title desc">
<title id="title">Figure 2 | ARP resolves the local next hop</title>
<desc id="desc">IPv4 identifies the destination; the Ethernet destination MAC identifies the recipient on this link.</desc>
<g transform="scale(0.6)"><rect width="1420" height="1000" fill="#f2f6fc"/>
<rect width="1420" height="10" fill="#2464d9"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2464d9"/></marker></defs>
<text x="40" y="55" font-family="Noto Sans CJK TC,sans-serif" font-size="30" fill="#172b49">Figure 2 | ARP resolves the local next hop</text>
<text x="40" y="95" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">IPv4 identifies the destination; the Ethernet destination MAC identifies the recipient on this link.</text>
<rect x="40.0" y="170" width="658.0" height="670" rx="20" fill="#ffffff" stroke="#b7c9df"/>
<text x="60.0" y="208" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">A | Same local link</text>
<rect x="60.0" y="290" width="289.0" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce"/>
<text x="70.0" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">A: your computer</text>
<text x="70.0" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.10</text>
<rect x="389.0" y="290" width="289.0" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce"/>
<text x="399.0" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">B: local device</text>
<text x="399.0" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.20</text>
<path d="M349.0 338H389.0" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60.0" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">ARP Request</text>
<path d="M389.0 405H349.0" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60.0" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">ARP Reply</text>
<text x="60.0" y="510" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">When resolution is needed, A broadcasts for</text>
<text x="60.0" y="540" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">192.168.1.20; only B is drawn.</text>
<text x="60.0" y="585" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">B replies with its IPv4/MAC mapping.</text>
<text x="60.0" y="630" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Final destination IP: 192.168.1.20</text>
<text x="60.0" y="675" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Frame destination MAC: B’s MAC</text>
<rect x="722.0" y="170" width="658.0" height="670" rx="20" fill="#ffffff" stroke="#b7c9df"/>
<text x="742.0" y="208" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">B | Remote destination</text>
<rect x="742.0" y="290" width="179.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce"/>
<text x="752.0" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">A: your</text>
<text x="752.0" y="350" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">computer</text>
<text x="752.0" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.10</text>
<rect x="961.3333333333334" y="290" width="179.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce"/>
<text x="971.3333333333334" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Router/gateway</text>
<text x="971.3333333333334" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">192.168.1.1</text>
<rect x="1180.6666666666667" y="290" width="179.33333333333334" height="130" rx="14" fill="#edf6fc" stroke="#9db3ce"/>
<text x="1190.6666666666667" y="320" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Remote host</text>
<text x="1190.6666666666667" y="386" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#445d73">203.0.113.20</text>
<path d="M921.3333333333334 338H961.3333333333334" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#arrow)"/>
<text x="742.0" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">Local delivery</text>
<path d="M1140.6666666666667 338H1180.6666666666667" fill="none" stroke="#2464d9" stroke-width="3" marker-end="url(#arrow)"/>
<text x="961.3333333333334" y="265" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#1854bb">Forwarding</text>
<text x="742.0" y="510" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">If routing selects the default gateway, A resolves</text>
<text x="742.0" y="540" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#006c66">192.168.1.1 with ARP.</text>
<text x="742.0" y="585" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">These arrows show data delivery, not ARP crossing a</text>
<text x="742.0" y="615" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">router.</text>
<text x="742.0" y="660" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Final destination IP: 203.0.113.20</text>
<text x="742.0" y="705" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">First frame destination MAC: gateway’s MAC</text>
<text x="40" y="895" font-family="Noto Sans CJK TC,sans-serif" font-size="20" fill="#172b49">Assumptions: ordinary IPv4 Ethernet, A uses /24, and routes select the next hop. Assess VLANs and proxy ARP separately.</text>
</g></svg>