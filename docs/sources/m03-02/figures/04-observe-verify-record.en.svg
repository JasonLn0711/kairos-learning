<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
<title id="title">4 | Turn discovery into verifiable records</title>
<desc id="desc">Preserve replies or timeouts, corroborate assets and policy, perform authorized service checks as needed, and retain results and owners.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b"/></marker></defs>
<rect x="1" y="1" width="598" height="698" rx="20" fill="#f8fafc" stroke="#b7c7d5"/>
<text x="300" y="38" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">4 | Turn discovery into verifiable records</text>
<rect x="32" y="68" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="97" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Preserve direct observations</text>
<text x="300" y="124" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Source, target, method, time and timeout</text>
<text x="300" y="151" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Record ARP and Echo replies or timeouts separately</text>
<path d="M300 168V192" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="196" width="536" height="100" rx="14" fill="#e7f3ed" stroke="#7892a6"/>
<text x="300" y="225" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Corroborate assets and network context</text>
<text x="300" y="252" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Ownership, routes, VLANs and proxy ARP</text>
<text x="300" y="279" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Consult management records and ICMP policy</text>
<path d="M300 296V320" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="324" width="536" height="100" rx="14" fill="#fff3d8" stroke="#7892a6"/>
<text x="300" y="353" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Complete task-specific checks</text>
<text x="300" y="380" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">For a website, check the approved service</text>
<text x="300" y="407" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Observe link, IP and application layers separately</text>
<path d="M300 424V448" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="452" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="481" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Record results and next steps</text>
<text x="300" y="508" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Verified items, open questions and responsible owner</text>
<text x="300" y="535" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Repeat under comparable conditions and keep versions</text>
<text x="300" y="608" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Follow approved scope, timing, rate and stop conditions.</text>
</svg>