<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="title desc">
<title id="title">圖 4｜線索到防護的查核流程</title>
<desc id="desc">查詢會產生互動；保留條件並將觀察與推論分開。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41617b"/></marker></defs>
<rect x="1" y="1" width="598" height="638" rx="20" fill="#f8fafc" stroke="#b7c7d5"/>
<text x="300" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">圖 4｜線索到防護的查核流程</text>
<rect x="40" y="65" width="520" height="88" rx="14" fill="#fff3d8" stroke="#7892a6"/>
<text x="300" y="96" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">先確認：名稱、服務、授權範圍</text>
<text x="300" y="123" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">逐一核對第三方服務的測試授權</text>
<path d="M300 153V185" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="185" width="520" height="88" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="216" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">記錄：時間、解析器、類型、狀態</text>
<text x="300" y="243" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">分別記錄逾時與 NXDOMAIN 狀態</text>
<path d="M300 273V305" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="305" width="520" height="88" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="336" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">判讀：事實、假設、待核實</text>
<text x="300" y="363" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">原始主機依服務設定核實</text>
<path d="M300 393V425" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="425" width="520" height="88" rx="14" fill="#e7f3ed" stroke="#7892a6"/>
<text x="300" y="456" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">防護：管理帳號、紀錄、存取控制</text>
<text x="300" y="483" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">DNSSEC：來源真實性與完整性</text>
<text x="300" y="575" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#172b3a">變更後依來源與快取條件核驗</text>
</svg>