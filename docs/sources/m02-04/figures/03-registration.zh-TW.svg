<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="title desc">
<title id="title">圖 3｜註冊角色與核實方向</title>
<desc id="desc">註冊管理機構、註冊商與註冊人是不同角色；遮蔽欄位保留未知。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41617b"/></marker></defs>
<rect x="1" y="1" width="598" height="638" rx="20" fill="#f8fafc" stroke="#b7c7d5"/>
<text x="300" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">圖 3｜註冊角色與核實方向</text>
<rect x="40" y="65" width="520" height="88" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="96" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">Registry：管理頂層網域登錄</text>
<text x="300" y="123" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">職責：維護頂層網域登錄資料</text>
<path d="M300 153V185" fill="none" stroke="#41617b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="40" y="185" width="520" height="88" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="216" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">Registrar：提供網域註冊服務</text>
<text x="300" y="243" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">網站營運者依管理資料核實</text>
<path d="M300 273V305" fill="none" stroke="#41617b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="40" y="305" width="520" height="88" rx="14" fill="#fff3d8" stroke="#7892a6"/>
<text x="300" y="336" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">Registrant：註冊持有人角色</text>
<text x="300" y="363" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">公開資料可能遮蔽或不完整</text>
<path d="M300 393V425" fill="none" stroke="#41617b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="40" y="425" width="520" height="88" rx="14" fill="#e7f3ed" stroke="#7892a6"/>
<text x="300" y="456" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">RDAP：讀角色、事件類型與來源</text>
<text x="300" y="483" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">記錄可用欄位與待補證據</text>
<text x="300" y="575" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#172b3a">虛線表示註冊體系各角色的判讀順序</text>
</svg>