<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
<title id="title">2 | A typical open response to a SYN scan</title>
<desc id="desc">A SYN scan examines the initial response; in a typical open case, SYN+ACK is followed by RST to end the attempt.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b"/></marker></defs>
<rect x="1" y="1" width="598" height="698" rx="20" fill="#f8fafc" stroke="#b7c7d5"/>
<text x="300" y="38" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">2 | A typical open response to a SYN scan</text>
<rect x="32" y="68" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="97" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Send TCP SYN</text>
<text x="300" y="124" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Approved source → 192.0.2.20:443</text>
<text x="300" y="151" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Observe the initial connection response</text>
<path d="M300 168V192" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="196" width="536" height="100" rx="14" fill="#e7f3ed" stroke="#7892a6"/>
<text x="300" y="225" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Receive SYN+ACK</text>
<text x="300" y="252" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">An open-response pattern for this method</text>
<text x="300" y="279" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Record response source and time</text>
<path d="M300 296V320" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="324" width="536" height="100" rx="14" fill="#fff3d8" stroke="#7892a6"/>
<text x="300" y="353" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">End the attempt with RST</text>
<text x="300" y="380" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Do not continue with the usual final ACK</text>
<text x="300" y="407" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Retain the observed control flags</text>
<path d="M300 424V448" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="452" width="536" height="100" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="481" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Record the tool interpretation</text>
<text x="300" y="508" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">This SYN example is recorded as open</text>
<text x="300" y="535" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Separate method, response and follow-up checks</text>
<text x="300" y="608" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Typical paper example; privileges and details depend on platform.</text>
</svg>