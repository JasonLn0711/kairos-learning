<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="title desc"><title id="title">The same TCP 443 from different positions</title><desc id="desc">Three independent example paths; verify actual policy rather than assuming these outcomes.</desc><text x="24" y="32" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">The same TCP 443 from different positions</text><text x="24" y="68" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Three independent example paths; verify actual policy rather</text><text x="24" y="94" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">than assuming these outcomes.</text><rect x="12" y="112" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df"/><text x="24" y="132" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Internal test host</text><path d="M40 158H560L550 151M560 158L550 165" fill="none" stroke="#245ac5" stroke-width="2"/><text x="24" y="182" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Firewall / routing policy → may allow</text><rect x="12" y="220" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df"/><text x="24" y="240" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Guest network</text><path d="M40 266H560L550 259M560 266L550 273" fill="none" stroke="#245ac5" stroke-width="2"/><text x="24" y="290" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Firewall / routing policy → may restrict</text><rect x="12" y="328" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df"/><text x="24" y="348" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">External network</text><path d="M40 374H560L550 367M560 374L550 381" fill="none" stroke="#245ac5" stroke-width="2"/><text x="24" y="398" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Firewall / routing policy → may block</text><text x="24" y="456" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Compare source, time, protocol, port, payload, timeout and</text><text x="24" y="482" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">rate; confirm the same endpoint behind NAT or proxies.</text></svg>