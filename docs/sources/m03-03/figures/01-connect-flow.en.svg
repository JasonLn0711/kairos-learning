<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 554" role="img" aria-labelledby="title desc"><title id="title">TCP Connect: complete the handshake</title><desc id="desc">Use connect() to establish TCP, then end the test.</desc><text x="24" y="32" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">TCP Connect: complete the handshake</text><text x="24" y="68" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Use connect() to establish TCP, then end the test.</text><text x="24" y="106" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Scanner</text><text x="440" y="106" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Target</text><rect x="12" y="120" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df"/><text x="24" y="140" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">SYN</text><path d="M40 166H560L550 159M560 166L550 173" fill="none" stroke="#245ac5" stroke-width="2"/><text x="24" y="190" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Scanner → target: request a connection and synchronize.</text><rect x="12" y="228" width="576" height="122" rx="14" fill="#ffffff" stroke="#b7c9df"/><text x="24" y="248" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">SYN+ACK</text><path d="M560 274H40L50 267M40 274L50 281" fill="none" stroke="#007d5c" stroke-width="2"/><text x="24" y="298" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Target → scanner: accept and supply synchronization</text><text x="24" y="324" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">information.</text><rect x="12" y="362" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df"/><text x="24" y="382" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">ACK</text><path d="M40 408H560L550 401M560 408L550 415" fill="none" stroke="#245ac5" stroke-width="2"/><text x="24" y="432" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">Scanner → target: complete the ordinary handshake.</text><text x="24" y="490" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">TCP success still requires separate TLS, HTTP and application</text><text x="24" y="516" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">checks.</text></svg>