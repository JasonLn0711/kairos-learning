<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 494" role="img" aria-labelledby="title desc"><title id="title">同一 TCP 443，不同觀察位置</title><desc id="desc">三條獨立路徑示例；實際政策必須查核，並非固定結果。</desc><text x="24" y="32" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">同一 TCP 443，不同觀察位置</text><text x="24" y="68" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">三條獨立路徑示例；實際政策必須查核，並非固定結果。</text><rect x="12" y="86" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df"/><text x="24" y="106" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">內網測試端</text><path d="M40 132H560L550 125M560 132L550 139" fill="none" stroke="#245ac5" stroke-width="2"/><text x="24" y="156" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">防火牆／路由政策 → 可能允許</text><rect x="12" y="194" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df"/><text x="24" y="214" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">訪客網路</text><path d="M40 240H560L550 233M560 240L550 247" fill="none" stroke="#245ac5" stroke-width="2"/><text x="24" y="264" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">防火牆／路由政策 → 可能限制</text><rect x="12" y="302" width="576" height="96" rx="14" fill="#ffffff" stroke="#b7c9df"/><text x="24" y="322" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">外部網路</text><path d="M40 348H560L550 341M560 348L550 355" fill="none" stroke="#245ac5" stroke-width="2"/><text x="24" y="372" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">防火牆／路由政策 → 可能阻擋</text><text x="24" y="430" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">先比對來源、時間、協定、Port、酬載、等待與速率；核對</text><text x="24" y="456" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b49">NAT／代理後是否為同一入口。</text></svg>