<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 787.5" role="img" aria-labelledby="m0308-evidence-zh-title m0308-evidence-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0308-evidence-zh-title">圖二｜如何證明這次掃描被阻擋？</title>
<desc id="m0308-evidence-zh-desc">上層兩項觀察須共同進入下層交叉核對。箭頭表示查核步驟，不是封包路徑或單一紀錄足以證明的因果。</desc>
<defs><marker id="m0308-evidence-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2460ce" /></marker><marker id="m0308-evidence-zh-copy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#008475" /></marker></defs>
<g transform="scale(0.75)">
<rect x="1" y="1" width="1198" height="1048" rx="20" fill="#f5f8fb" stroke="#b7c9df" />
<text x="30" y="43" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#172b49">圖二｜如何證明這次掃描被阻擋？</text>
<text x="30" y="94" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">上層兩項觀察須共同進入下層交叉核對。箭頭表示查核步驟，不是封包路徑或單一紀錄足以證明的因果。</text>
<text x="30" y="210" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">第一層：觀察到的現象</text>
<rect x="30" y="240" width="540" height="175" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M33 252V403" stroke="#2460ce" stroke-width="6" />
<text x="48" y="272" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">掃描端｜09:02｜來源 B</text>
<text x="48" y="316" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">TCP 8443 → filtered：尚無法判定入口狀態。</text>
<rect x="630" y="240" width="540" height="175" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M633 252V403" stroke="#ad6700" stroke-width="6" />
<text x="648" y="272" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">IDS｜09:02｜可疑掃描</text>
<text x="648" y="316" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Action: alert：已產生告警，尚未證明阻擋。</text>
<path d="M300 415V465H600V510" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-evidence-zh-arrow)" />
<path d="M900 415V465H600" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-evidence-zh-arrow)" />
<text x="30" y="550" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">第二層：共同交叉核對防護與服務端</text>
<rect x="30" y="580" width="540" height="195" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M33 592V763" stroke="#bd3443" stroke-width="6" />
<text x="48" y="612" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">防火牆紀錄｜FW-17</text>
<text x="48" y="656" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">同一來源 B、目標與 TCP 8443，Action: DROP；核對 </text>
<text x="48" y="685" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">NAT、時間與規則。</text>
<rect x="630" y="580" width="540" height="195" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M633 592V763" stroke="#008475" stroke-width="6" />
<text x="648" y="612" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">服務端紀錄｜Server</text>
<text x="648" y="656" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">未找到 B 的對應連線；僅作旁證，須確認日誌收集完整</text>
<text x="648" y="685" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">性。</text>
<path d="M300 775V805H600V840" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-evidence-zh-arrow)" />
<path d="M900 775V805H600" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-evidence-zh-arrow)" />
<rect x="30" y="850" width="1140" height="175" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M33 862V1013" stroke="#008475" stroke-width="6" />
<text x="48" y="882" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">有限度結論</text>
<text x="48" y="926" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">對齊來源、目標、時間、協定、Port 與路徑後，證據支持本次 B 流量受到 FW-17 阻擋；不能推論所有服務安全、IDS 擋下</text>
<text x="48" y="955" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">攻擊或沒有入侵。</text>
</g></svg>
