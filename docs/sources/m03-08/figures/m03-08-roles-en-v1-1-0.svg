<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="m0308-roles-en-title m0308-roles-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0308-roles-en-title">Figure 1 | Firewall, IPS, and IDS roles</title>
<desc id="m0308-roles-en-desc">Blue solid arrows show packet forwarding; the green dashed branch carries a copy from before the firewall. Arrows indicate transmission direction; forwarding depends on policy.</desc>
<defs><marker id="m0308-roles-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2460ce" /></marker><marker id="m0308-roles-en-copy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#008475" /></marker></defs>
<g transform="scale(0.75)">
<rect x="1" y="1" width="1198" height="898" rx="20" fill="#f5f8fb" stroke="#b7c9df" />
<text x="30" y="43" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#172b49">Figure 1 | Firewall, IPS, and IDS roles</text>
<text x="30" y="94" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Blue solid arrows show packet forwarding; the green dashed branch carries a copy from before the</text>
<text x="30" y="123" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">firewall. Arrows indicate transmission direction; forwarding depends on policy.</text>
<rect x="30" y="235" width="240" height="280" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M33 247V503" stroke="#2460ce" stroke-width="6" />
<text x="48" y="267" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">Scanner</text>
<text x="48" y="311" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Send test packets;</text>
<text x="48" y="340" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">record replies and</text>
<text x="48" y="369" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">scan states.</text>
<rect x="330" y="235" width="240" height="280" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M333 247V503" stroke="#ad6700" stroke-width="6" />
<text x="348" y="267" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">Firewall</text>
<text x="348" y="311" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Allow or refuse</text>
<text x="348" y="340" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">according to access</text>
<text x="348" y="369" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">policy; may log</text>
<text x="348" y="398" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Allow/Drop.</text>
<rect x="630" y="235" width="240" height="280" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M633 247V503" stroke="#bd3443" stroke-width="6" />
<text x="648" y="267" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">IPS (inline)</text>
<text x="648" y="311" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">On the forwarding</text>
<text x="648" y="340" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">path; may block a</text>
<text x="648" y="369" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">rule match. Verify</text>
<text x="648" y="398" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">operating mode.</text>
<rect x="930" y="235" width="240" height="280" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M933 247V503" stroke="#008475" stroke-width="6" />
<text x="948" y="267" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">Protected server</text>
<text x="948" y="311" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Provide the TCP 8443</text>
<text x="948" y="340" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">test service; compare</text>
<text x="948" y="369" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">connection and</text>
<text x="948" y="398" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">service logs.</text>
<path d="M270 350H330" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-roles-en-arrow)" />
<path d="M570 350H630" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-roles-en-arrow)" />
<path d="M870 350H930" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-roles-en-arrow)" />
<path d="M300 350V650H440" fill="none" stroke="#008475" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#m0308-roles-en-copy)" />
<text x="40" y="600" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#006a60">Copy before firewall</text>
<rect x="440" y="570" width="730" height="170" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M443 582V728" stroke="#008475" stroke-width="6" />
<text x="458" y="602" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">IDS (passive mirror)</text>
<text x="458" y="646" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Receive a copy between scanner and firewall. Generate alerts outside</text>
<text x="458" y="675" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">the forwarding path.</text>
<text x="30" y="800" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">IDS Alert ≠ IPS/Firewall Drop. Verify actual placement, mode and action.</text>
</g></svg>
