<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="m0308-roles-zh-title m0308-roles-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0308-roles-zh-title">圖一｜Firewall、IPS 與 IDS 的角色</title>
<desc id="m0308-roles-zh-desc">藍色實線為實際封包路徑；綠色虛線為防火牆前的鏡像副本。箭頭表示傳送方向，放行仍取決於政策。</desc>
<defs><marker id="m0308-roles-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2460ce" /></marker><marker id="m0308-roles-zh-copy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#008475" /></marker></defs>
<g transform="scale(0.75)">
<rect x="1" y="1" width="1198" height="898" rx="20" fill="#f5f8fb" stroke="#b7c9df" />
<text x="30" y="43" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#172b49">圖一｜Firewall、IPS 與 IDS 的角色</text>
<text x="30" y="94" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">藍色實線為實際封包路徑；綠色虛線為防火牆前的鏡像副本。箭頭表示傳送方向，放行仍取決於政策。</text>
<rect x="30" y="235" width="240" height="280" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M33 247V503" stroke="#2460ce" stroke-width="6" />
<text x="48" y="267" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">掃描端</text>
<text x="48" y="311" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">送出測試封包，記錄收</text>
<text x="48" y="340" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">到的回覆與掃描狀態。</text>
<rect x="330" y="235" width="240" height="280" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M333 247V503" stroke="#ad6700" stroke-width="6" />
<text x="348" y="267" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">Firewall</text>
<text x="348" y="311" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">依存取政策放行或拒絕</text>
<text x="348" y="340" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">，可記錄 Allow／Drop</text>
<text x="348" y="369" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">。</text>
<rect x="630" y="235" width="240" height="280" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M633 247V503" stroke="#bd3443" stroke-width="6" />
<text x="648" y="267" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">IPS（Inline）</text>
<text x="648" y="311" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">位於實際流量路徑，符</text>
<text x="648" y="340" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">合規則時可阻擋；須核</text>
<text x="648" y="369" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">對運作模式。</text>
<rect x="930" y="235" width="240" height="280" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M933 247V503" stroke="#008475" stroke-width="6" />
<text x="948" y="267" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">受保護的伺服器</text>
<text x="948" y="311" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">提供 TCP 8443 測試服</text>
<text x="948" y="340" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">務，可核對連線及服務</text>
<text x="948" y="369" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">日誌。</text>
<path d="M270 350H330" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-roles-zh-arrow)" />
<path d="M570 350H630" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-roles-zh-arrow)" />
<path d="M870 350H930" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-roles-zh-arrow)" />
<path d="M300 350V650H440" fill="none" stroke="#008475" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#m0308-roles-zh-copy)" />
<text x="40" y="600" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#006a60">防火牆前的鏡像副本</text>
<rect x="440" y="570" width="730" height="170" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M443 582V728" stroke="#008475" stroke-width="6" />
<text x="458" y="602" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">IDS（被動鏡像）</text>
<text x="458" y="646" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">從掃描端至防火牆之間取得副本，產生告警；不在主流量路徑上。</text>
<text x="30" y="800" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">IDS 的 Alert ≠ IPS／Firewall 的 Drop；須核對實際位置、模式與動作。</text>
</g></svg>
