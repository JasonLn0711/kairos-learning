<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 787.5" role="img" aria-labelledby="m0308-evidence-en-title m0308-evidence-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0308-evidence-en-title">Figure 2 | Was this scan blocked?</title>
<desc id="m0308-evidence-en-desc">Correlate both observations in the upper layer with both records below. Arrows show investigation steps, not packet flow or causation established by a single record.</desc>
<defs><marker id="m0308-evidence-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2460ce" /></marker><marker id="m0308-evidence-en-copy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#008475" /></marker></defs>
<g transform="scale(0.75)">
<rect x="1" y="1" width="1198" height="1048" rx="20" fill="#f5f8fb" stroke="#b7c9df" />
<text x="30" y="43" font-family="Noto Sans CJK TC,sans-serif" font-size="25" fill="#172b49">Figure 2 | Was this scan blocked?</text>
<text x="30" y="94" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Correlate both observations in the upper layer with both records below. Arrows show investigation steps,</text>
<text x="30" y="123" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">not packet flow or causation established by a single record.</text>
<text x="30" y="210" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">Layer 1: observations</text>
<rect x="30" y="240" width="540" height="175" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M33 252V403" stroke="#2460ce" stroke-width="6" />
<text x="48" y="272" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">Scanner | 09:02 | source B</text>
<text x="48" y="316" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">TCP 8443 → filtered: the port state remains</text>
<text x="48" y="345" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">unresolved.</text>
<rect x="630" y="240" width="540" height="175" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M633 252V403" stroke="#ad6700" stroke-width="6" />
<text x="648" y="272" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">IDS | 09:02 | possible scan</text>
<text x="648" y="316" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Action: alert: a notification, not proof of</text>
<text x="648" y="345" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">blocking.</text>
<path d="M300 415V465H600V510" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-evidence-en-arrow)" />
<path d="M900 415V465H600" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-evidence-en-arrow)" />
<text x="30" y="550" font-family="Noto Sans CJK TC,sans-serif" font-size="22" fill="#172b49">Layer 2: cross-check both protection and server records</text>
<rect x="30" y="580" width="540" height="195" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M33 592V763" stroke="#bd3443" stroke-width="6" />
<text x="48" y="612" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">Firewall log | FW-17</text>
<text x="48" y="656" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">Match B, target and TCP 8443, Action: DROP. Check</text>
<text x="48" y="685" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">NAT, time and rule.</text>
<rect x="630" y="580" width="540" height="195" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M633 592V763" stroke="#008475" stroke-width="6" />
<text x="648" y="612" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">Server records</text>
<text x="648" y="656" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">No matching B connection found. Corroboration</text>
<text x="648" y="685" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">only; verify collection completeness.</text>
<path d="M300 775V805H600V840" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-evidence-en-arrow)" />
<path d="M900 775V805H600" fill="none" stroke="#2460ce" stroke-width="3" marker-end="url(#m0308-evidence-en-arrow)" />
<rect x="30" y="850" width="1140" height="175" rx="14" fill="#ffffff" stroke="#9db3cd" />
<path d="M33 862V1013" stroke="#008475" stroke-width="6" />
<text x="48" y="882" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b49">Bounded conclusion</text>
<text x="48" y="926" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">After matching source, target, time, protocol, port and path, evidence supports FW-17 blocking this B</text>
<text x="48" y="955" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b49">traffic. It does not establish all services are secure, IDS blocked the attack, or no intrusion occurred.</text>
</g></svg>
