<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 708" role="img" aria-labelledby="m0308-evidence-en-title m0308-evidence-en-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0308-evidence-en-title">From scope to conclusion</title>
<desc id="m0308-evidence-en-desc">Investigation order, not a packet path through devices.</desc>
<defs><marker id="m0308-evidence-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="706" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">From scope to conclusion</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Investigation order, not a packet path through devices.</text>
<rect x="28" y="113" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="142" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Scope and expectation</text>
<text x="48" y="169" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Confirm source, service, time and expected policy.</text>
<path d="M320 229V254" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0308-evidence-en-arrow)" />
<rect x="28" y="258" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="287" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Scanner observations</text>
<text x="48" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Preserve settings, responses and limitations.</text>
<path d="M320 374V399" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0308-evidence-en-arrow)" />
<rect x="28" y="403" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="432" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Cross-check records</text>
<text x="48" y="459" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Compare protective actions and service records.</text>
<path d="M320 519V544" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0308-evidence-en-arrow)" />
<rect x="28" y="548" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="577" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">Bounded conclusion</text>
<text x="48" y="604" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">State supported scope and remaining evidence gaps.</text>
