<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 563" role="img" aria-labelledby="m0308-roles-zh-title m0308-roles-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0308-roles-zh-title">三種防護角色</title>
<desc id="m0308-roles-zh-desc">角色平行比較，不代表固定設備順序。</desc>
<defs><marker id="m0308-roles-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="561" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">三種防護角色</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">角色平行比較，不代表固定設備順序。</text>
<rect x="28" y="113" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="142" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">防火牆</text>
<text x="48" y="169" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">依政策決定是否讓流量通過。</text>
<rect x="28" y="258" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="287" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">IDS 入侵偵測</text>
<text x="48" y="314" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">分析可見活動並產生告警。</text>
<rect x="28" y="403" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="432" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">IPS 入侵防禦</text>
<text x="48" y="459" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">依部署模式與規則執行防護動作。</text>
</svg>
