<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-labelledby="title desc">
<title id="title">5 | Received: a parcel’s checkpoint stamps</title>
<desc id="desc">Top / newest: 10:00:10 / Stop 3: our trusted receiving service / Start verification with this server’s logs；Middle: 10:00:05 / Stop 2: the preceding mail relay / Check the source and available logs；Bottom / earliest: 10:00:00 / Stop 1: an earlier receiving hop / Validate external entries with sources and logs；Two directions answer different questions / Timeline: bottom → middle → top / Trust: our top hop → earlier hops</desc>
<rect x="1" y="1" width="598" height="748" rx="20" fill="#f8fafc" stroke="#b7c7d5"/>
<text x="300" y="37" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">5 | Received: a parcel’s checkpoint stamps</text>
<rect x="26" y="64" width="548" height="112" rx="14" fill="#e7f3ed" stroke="#7892a6"/>
<text x="300" y="93" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Top / newest: 10:00:10</text>
<text x="300" y="120" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Stop 3: our trusted receiving service</text>
<text x="300" y="147" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Start verification with this server’s logs</text>
<rect x="26" y="192" width="548" height="112" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="221" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Middle: 10:00:05</text>
<text x="300" y="248" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Stop 2: the preceding mail relay</text>
<text x="300" y="275" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Check the source and available logs</text>
<rect x="26" y="320" width="548" height="112" rx="14" fill="#e8f2fb" stroke="#7892a6"/>
<text x="300" y="349" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Bottom / earliest: 10:00:00</text>
<text x="300" y="376" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Stop 1: an earlier receiving hop</text>
<text x="300" y="403" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Validate external entries with sources and logs</text>
<rect x="26" y="448" width="548" height="112" rx="14" fill="#fff3d8" stroke="#7892a6"/>
<text x="300" y="477" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="18" fill="#172b3a">Two directions answer different questions</text>
<text x="300" y="504" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Timeline: bottom → middle → top</text>
<text x="300" y="531" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Trust: our top hop → earlier hops</text>
<text x="300" y="610" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Each receiver prepends its new Received entry</text>
<text x="300" y="637" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Our service settings and logs define the trust boundary</text>
<text x="300" y="664" text-anchor="middle" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">Synthetic times; check time zones and clock accuracy</text>
</svg>