<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 731" role="img" aria-labelledby="m0306-evidence-zh-title m0306-evidence-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0306-evidence-zh-title">作業系統辨識的查核順序</title>
<desc id="m0306-evidence-zh-desc">箭頭表示證據查核的順序，不表示已取得權限或證實弱點。每一步保留來源與限制。</desc>
<defs><marker id="m0306-evidence-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="729" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">作業系統辨識的查核順序</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">箭頭表示證據查核的順序，不表示已取得權限或證實弱點。每一步保</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">留來源與限制。</text>
<rect x="28" y="136" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">1｜封包特徵</text>
<text x="48" y="192" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">記錄 TTL、TCP 選項及視窗等實際觀察，不以單一值猜系統。</text>
<path d="M320 252V277" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0306-evidence-zh-arrow)" />
<rect x="28" y="281" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="310" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">2｜工具比對</text>
<text x="48" y="337" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">保存候選、原始分數、工具版本與警告；相符分數不是已校準機率。</text>
<path d="M320 397V422" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0306-evidence-zh-arrow)" />
<rect x="28" y="426" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">3｜網路位置</text>
<text x="48" y="482" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">核對誰終止連線、哪一層產生回應，避免把前端當後端。</text>
<path d="M320 542V567" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0306-evidence-zh-arrow)" />
<rect x="28" y="571" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="600" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">4｜管理端證據</text>
<text x="48" y="627" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">以同設備、同時點的版本、核心、套件及更新紀錄確認。</text>
</svg>
