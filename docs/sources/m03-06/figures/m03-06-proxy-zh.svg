<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 586" role="img" aria-labelledby="m0306-proxy-zh-title m0306-proxy-zh-desc" preserveAspectRatio="xMidYMid meet">
<title id="m0306-proxy-zh-title">連線終止位置決定查核對象</title>
<desc id="m0306-proxy-zh-desc">箭頭表示此合成案例的連線方向；甲接受外部 TCP 連線，再建立到乙的連線。回傳方向省略。</desc>
<defs><marker id="m0306-proxy-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#41617b" /></marker></defs>
<rect x="1" y="1" width="638" height="584" rx="20" fill="#f8fafc" stroke="#7892a6" />
<text x="28" y="39" font-family="Noto Sans CJK TC,sans-serif" font-size="21" fill="#172b3a">連線終止位置決定查核對象</text>
<text x="28" y="70" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">箭頭表示此合成案例的連線方向；甲接受外部 TCP 連線，再建立到乙</text>
<text x="28" y="93" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">的連線。回傳方向省略。</text>
<rect x="28" y="136" width="584" height="116" rx="14" fill="#e8f2fb" stroke="#7892a6" />
<text x="48" y="165" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">1｜外部觀察者</text>
<text x="48" y="192" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">看見入口回應與工具候選，尚未確認後端系統。</text>
<path d="M320 252V277" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0306-proxy-zh-arrow)" />
<rect x="28" y="281" width="584" height="116" rx="14" fill="#e7f3ed" stroke="#7892a6" />
<text x="48" y="310" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">2｜前端甲：終止 TCP</text>
<text x="48" y="337" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">甲的協定堆疊可能產生外部指紋；優先用管理端資料核對甲。</text>
<path d="M320 397V422" fill="none" stroke="#41617b" stroke-width="2" marker-end="url(#m0306-proxy-zh-arrow)" />
<rect x="28" y="426" width="584" height="116" rx="14" fill="#fff3d8" stroke="#7892a6" />
<text x="48" y="455" font-family="Noto Sans CJK TC,sans-serif" font-size="19" fill="#172b3a">3｜後端乙：應用服務</text>
<text x="48" y="482" font-family="Noto Sans CJK TC,sans-serif" font-size="16" fill="#172b3a">應用自述可能來自乙；另查執行中服務、系統版本與更新紀錄。</text>
</svg>
